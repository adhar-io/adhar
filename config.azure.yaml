# Adhar on Azure for test.adhar.io — kubeadm on Virtual Machines, autoscaled.
#
# examples/azure-config.yaml keeps the generic version; this file holds the live
# values for subscription b8e6d308-0e08-4287-885f-a4766f295f13. No credentials
# are in here: it authenticates through your existing `az login`.
#
#   adhar up   -f config.azure.yaml --env dev --dry-run   # validate, no spend
#   adhar up   -f config.azure.yaml --env dev             # deploy
#   adhar down -f config.azure.yaml --env dev             # tear down
#   adhar down -f config.azure.yaml --env dev --purge-orphaned-volumes
#
# STATUS: first live bring-up. Azure is built and render-verified; the kubeadm path
# is shared with DigitalOcean (the one cloud proven live) but has never run on
# Azure VMs. Treat the first `adhar up` as a bring-up exercise — GCP took eleven
# provider defects and three quota traps to reach a working platform.
#
# PREREQUISITES — checked on this subscription 2026-09-26:
#   ✓ Resource providers registered. Microsoft.Compute and Microsoft.Storage were
#     BOTH `NotRegistered` on this subscription and had to be registered before any
#     VM could be created; Microsoft.Network was already done. A fresh subscription
#     usually needs this, it takes a few minutes, and the failure it causes
#     otherwise names a "MissingSubscriptionRegistration" rather than the VM you
#     were trying to create:
#       az provider register --namespace Microsoft.Compute
#       az provider register --namespace Microsoft.Storage
#   ✓ DNS. The `test.adhar.io` zone exists in resource group `adhar-rg` and its four
#     Azure nameservers match what public DNS returns, so delegation is live.
#     Nothing in the platform creates the zone.
#   ~ QUOTA — RAISED TO 10, still below what the platform needs. Originally 4 in
#     every region checked. At 10 this file runs a control plane + 1 worker on
#     Standard_E4bds_v5 (8 vCPU) to verify the PROVIDER path; the full catalogue needs
#     ~56. Historic note: "Total Regional vCPUs" was **4** in every region
#     checked (malaysiawest, southeastasia, eastasia, centralindia, southindia,
#     eastus, westus2, westeurope, uksouth, australiaeast, japaneast). That is the
#     default on a new subscription and it cannot host this platform: measured on
#     GCP, 2 workers (16 vCPU) left 58 pods unschedulable and stability needed
#     ~48 vCPU. Request an increase for BOTH "Total Regional vCPUs" and the
#     "Standard DSv3 Family vCPUs" quota in this region before running `adhar up`:
#       az vm list-usage --location malaysiawest -o table
#     Ask for at least 48, ideally 64, to leave the autoscaler room.

apiVersion: v1alpha1
kind: Config

globalSettings:
  adharContext: adhar-mgmt

  # Drives every URL, the zone external-dns manages, and the wildcard certificate.
  # Apps are published at <app>.test.adhar.io.
  defaultHost: test.adhar.io

  # 443, not 8443. A real load balancer fronts the cloud path, so the local Kind
  # convention of a high port does not apply.
  defaultHttpPort: 80
  defaultHttpsPort: 443

  # Single control plane: HA triples control-plane spend and this is verification.
  enableHAMode: false

  # Required. Let's Encrypt sends expiry notices here.
  email: tapas.friends@gmail.com

  # Selects Azure DNS for external-dns and the cert-manager DNS-01 solver.
  # Set to `none` to stay on self-signed certificates with no DNS automation.
  dnsProvider: azure

providers:
  azure:
    type: azure
    region: malaysiawest
    primary: true

    # Uses the signed-in `az login` session. No secret in this file, and nothing to
    # rotate later.
    #
    # NOTE for the in-cluster half: external-dns and the cert-manager DNS-01 solver
    # run inside the cluster and cannot use your CLI session. They need a service
    # principal with "DNS Zone Contributor" on the test.adhar.io zone. Create one
    # when you want trusted certificates:
    #   az ad sp create-for-rbac --name adhar-dns --role "DNS Zone Contributor" \
    #     --scopes /subscriptions/<sub>/resourceGroups/adhar-rg/providers/Microsoft.Network/dnszones/test.adhar.io
    useAzureCLI: true

    # The in-cluster DNS components cannot use a CLI session, so they need a service
    # principal. Its id and tenant are safe to record; the SECRET is read from the
    # environment and never written here:
    #
    #   export AZURE_CLIENT_SECRET='...'
    #   adhar up -f config.azure.yaml --env dev
    #
    # Created with DNS Zone Contributor on the zone ALONE, not on the subscription:
    #   az ad sp create-for-rbac --name adhar-dns-test --role "DNS Zone Contributor" \
    #     --scopes /subscriptions/<sub>/resourceGroups/adhar-rg/providers/Microsoft.Network/dnszones/test.adhar.io
    clientId: 66483720-42ae-4f05-82a6-e3d75db21412
    tenantId: c95747c3-18ed-485f-9889-34c2ffd38528

    # Managed AKS instead of kubeadm on VMs. Everything else — packages, GitOps,
    # SSO, autoscaling, teardown — behaves the same either way. Left off because
    # the kubeadm path is what the platform is designed around.
    # useManagedK8s: true

    config:
      subscriptionId: b8e6d308-0e08-4287-885f-a4766f295f13

      # The resource group holding the test.adhar.io DNS ZONE. external-dns and the
      # cert-manager DNS-01 solver need it, and it is not necessarily the group the
      # cluster lives in.
      dnsResourceGroup: adhar-rg

      # The existing group that already holds the DNS zone, so the cluster and its
      # zone stay together and one delete removes both.
      resourceGroup: adhar-rg
      location: malaysiawest

      # Standard_D4s_v3 = 4 vCPU / 16 GiB, chosen to FIT THE QUOTA, not because it
      # is the right size for the platform.
      #
      # The subscription allows 10 total regional vCPUs, so a control plane plus one
      # worker at 4 vCPU each (8 total) is what fits. Standard_D8s_v3 — the
      # equivalent of the e2-standard-8 the GCP run was sized on — would need 56 for
      # the configured maximum and is what to return to once quota allows.
      #
      # Consequence, stated plainly: 8 vCPU / 32 GiB cannot host the full production
      # catalogue. On GCP, 16 vCPU left 58 pods unschedulable. This shape verifies
      # the PROVIDER path — virtual network, subnet, security group, VMs, kubeadm,
      # Cilium, Gateway, Argo CD, Gitea — and not package convergence.
      #
      # This size needs the "Standard DSv3 Family vCPUs" quota, which is separate
      # from the regional total — a create can fail on either.
      # Standard_E4bds_v5, not Standard_D4s_v3.
      #
      # D4s_v3 is SUPPORTED in malaysiawest and has no capacity for this
      # subscription — the create failed at the first VM with
      #   RESPONSE 409 SkuNotAvailable: Following SKUs have failed for Capacity
      #   Restrictions: Standard_D4s_v3
      # after the network, security group, public IP and NIC already existed.
      # Chosen from `az vm list-skus --location malaysiawest` filtered to entries
      # with NO restrictions, which is the only list that reflects what this
      # subscription can actually launch. It also has more memory (32 GiB against
      # 16) at the same 4 vCPU, and its family quota is present at 10.
      vmSize: Standard_E4bds_v5

      # Premium SSD. StandardSSD_LRS is cheaper but its IOPS ceiling shows up as
      # etcd latency on a control plane.
      diskType: Premium_LRS

      # Must not overlap the pod CIDR.
      vnetCidr: 10.30.0.0/16
      subnetCidr: 10.30.1.0/24

# At least one template must exist; environments inherit from one by name.
environmentTemplates:
  dev-defaults:
    clusterConfig:
      - key: autoScale
        value: "true"
    # coreServices may not be empty (the schema rejects `{}`). Cilium is pinned for
    # the same reason as on GCP: it is the CNI AND the Gateway data path, so an
    # unpinned chart can change kube-proxy replacement behaviour mid-bootstrap.
    coreServices:
      cilium:
        chart:
          repoURL: https://helm.cilium.io/
          name: cilium
          version: 1.15.7

environments:
  dev:
    # The schema allows only `production` or `non-production`.
    type: non-production
    provider: azure
    region: malaysiawest
    template: dev-defaults

    clusterConfig:
      - key: name
        value: adhar-mgmt
      # Keys match ignoring case and separators.
      - key: machineType
        value: Standard_E4bds_v5
      # One worker: the 10 vCPU ceiling leaves room for exactly one alongside the
      # control plane.
      - key: nodeCount
        value: "1"
      - key: diskSizeGb
        value: "100"
      # - key: kubeVersion
      #   value: v1.37.0
      # - key: podCIDR
      #   value: 10.244.0.0/16      # must not overlap vnetCidr

    # On-demand autoscaling: hold a small floor, buy capacity when pods are
    # actually Pending, give it back when utilisation drops.
    #
    # maxWorkers is a quota ceiling as much as a spend ceiling: 1 control plane +
    # 6 workers at 8 vCPU each is 56 vCPU, which must fit inside BOTH the regional
    # total and the DSv3 family quota.
    # Autoscaling is configured but cannot grow: 1 control plane + 1 worker at
    # 4 vCPU each is 8 of the 10 vCPU available, and a second worker would need 12.
    # Raise the quota and this becomes minWorkers 2 / maxWorkers 6 on D8s_v3.
    autoscaling:
      enabled: true
      minWorkers: 1
      maxWorkers: 1
      nodeGroup: workers
      scaleDownUtilizationThreshold: "50%"
      scaleDownDelay: 10m
      scaleUpCooldown: 3m
