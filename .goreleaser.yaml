version: 2

project_name: adhar

before:
  hooks:
    - go mod tidy
    - go generate ./...
    # Control-plane package versioned in lockstep with the release tag; lands
    # in the gitignored platform/controlplane/dist/ and is uploaded via
    # release.extra_files below.
    - make build-control-plane VERSION={{ .Tag }}

release:
  # Tags containing a prerelease suffix (e.g. v0.2.0-rc.1) are marked as prerelease
  prerelease: auto
  draft: false
  extra_files:
    - glob: platform/controlplane/dist/adhar-control-plane-*.xpkg
  header: |
    ## Adhar {{ .Tag }}

    Install via Homebrew (`brew tap adhar-io/tap && brew install adhar`),
    container image (`ghcr.io/adhar-io/adhar:{{ .Version }}`), or download a
    binary below.

builds:
  - env:
      - CGO_ENABLED=0
    main: ./cmd
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -X adhar-io/adhar/cmd/version.Version=v{{ .Version }}
      - -X adhar-io/adhar/cmd/version.GitCommit={{ .ShortCommit }}
      - -X adhar-io/adhar/cmd/version.BuildDate={{ .CommitDate }}
      - -w
      - -s
    binary: adhar

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}-{{ .Version }}-{{ .Os }}-{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - docs/**/*

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# Supply-chain provenance (ADR-0019, MARKETPLACE.md §2).
#
# One SPDX SBOM per release archive, catalogued by syft. The release workflow
# installs syft (anchore/sbom-action/download-syft) before goreleaser runs.
sboms:
  - id: archive-sbom
    artifacts: archive
    documents:
      - "${artifact}.spdx.sbom.json"

# Cosign KEYLESS signing (Sigstore Fulcio + Rekor): no long-lived keys, the
# certificate is bound to the GitHub Actions OIDC identity of the release run.
# Requires `id-token: write` on the release job (see .github/workflows/release.yaml).
#
# checksums.txt covers every archive, so signing it transitively covers them;
# the SBOMs are signed directly so an SBOM cannot be swapped in isolation.
#
# Verify a release:
#   cosign verify-blob checksums.txt \
#     --signature checksums.txt.sig --certificate checksums.txt.pem \
#     --certificate-identity-regexp 'https://github.com/adhar-io/adhar/.*' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
signs:
  - id: checksum-keyless
    cmd: cosign
    artifacts: checksum
    certificate: "${artifact}.pem"
    signature: "${artifact}.sig"
    output: true
    args:
      - sign-blob
      - "--output-signature=${signature}"
      - "--output-certificate=${certificate}"
      - "${artifact}"
      - "--yes"
  - id: sbom-keyless
    cmd: cosign
    artifacts: sbom
    certificate: "${artifact}.pem"
    signature: "${artifact}.sig"
    output: true
    args:
      - sign-blob
      - "--output-signature=${signature}"
      - "--output-certificate=${certificate}"
      - "${artifact}"
      - "--yes"

dockers:
  - image_templates:
      - ghcr.io/adhar-io/adhar:{{ .Version }}-amd64
    use: buildx
    dockerfile: Dockerfile.goreleaser
    goarch: amd64
    build_flag_templates:
      - --platform=linux/amd64
      - --label=org.opencontainers.image.title={{ .ProjectName }}
      - --label=org.opencontainers.image.description=Adhar - Open Foundation for Cloud-Native Platform Engineering
      - --label=org.opencontainers.image.source=https://github.com/adhar-io/adhar
      - --label=org.opencontainers.image.version={{ .Version }}
      - --label=org.opencontainers.image.revision={{ .FullCommit }}
      - --label=org.opencontainers.image.licenses=Apache-2.0
  - image_templates:
      - ghcr.io/adhar-io/adhar:{{ .Version }}-arm64
    use: buildx
    dockerfile: Dockerfile.goreleaser
    goarch: arm64
    build_flag_templates:
      - --platform=linux/arm64
      - --label=org.opencontainers.image.title={{ .ProjectName }}
      - --label=org.opencontainers.image.description=Adhar - Open Foundation for Cloud-Native Platform Engineering
      - --label=org.opencontainers.image.source=https://github.com/adhar-io/adhar
      - --label=org.opencontainers.image.version={{ .Version }}
      - --label=org.opencontainers.image.revision={{ .FullCommit }}
      - --label=org.opencontainers.image.licenses=Apache-2.0

docker_manifests:
  - name_template: ghcr.io/adhar-io/adhar:{{ .Version }}
    image_templates:
      - ghcr.io/adhar-io/adhar:{{ .Version }}-amd64
      - ghcr.io/adhar-io/adhar:{{ .Version }}-arm64
  - name_template: ghcr.io/adhar-io/adhar:latest
    # Don't move the `latest` tag for prereleases
    skip_push: auto
    image_templates:
      - ghcr.io/adhar-io/adhar:{{ .Version }}-amd64
      - ghcr.io/adhar-io/adhar:{{ .Version }}-arm64

# Cosign keyless signatures for the pushed images and the multi-arch manifests,
# recorded in Rekor. Verify:
#   cosign verify ghcr.io/adhar-io/adhar:<version> \
#     --certificate-identity-regexp 'https://github.com/adhar-io/adhar/.*' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
docker_signs:
  - id: image-keyless
    cmd: cosign
    artifacts: all
    output: true
    args:
      - sign
      - "${artifact}@${digest}"
      - "--yes"

brews:
  - name: adhar
    homepage: "https://adhar.io"
    description: "Open Foundation for Cloud-Native Platform Engineering"
    license: "Apache-2.0"
    # Skipped automatically when no Homebrew tap token is available
    # (e.g. local snapshots or releases from forks); also skipped for prereleases.
    # skip_upload uses the full template engine; the token is resolved with
    # goreleaser's restricted single-env engine, which only accepts the exact
    # form '{{ .Env.VAR }}' — and is only evaluated when skip_upload != true.
    skip_upload: '{{ if index .Env "HOMEBREW_TOKEN" }}auto{{ else }}true{{ end }}'
    repository:
      owner: adhar-io
      name: homebrew-tap
      token: '{{ .Env.HOMEBREW_TOKEN }}'
    commit_author:
      name: "AdharAutomation"
      email: "noreply@adhar.io"
    directory: Formula
    install: |
      bin.install "adhar"
    test: |
      system "#{bin}/adhar version --short"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  groups:
    - title: "✨ Features"
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: "🐛 Bug Fixes"
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: "🔧 Other Changes"
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch
