# Deploy an application from a Git repository through Argo CD, promoted across
# the environments the platform defines. `adhar application deploy --repo …`
# creates exactly this object; the Console's Create wizard does too.
apiVersion: platform.adhar.io/v1alpha1
kind: CompositeApplication
metadata:
  name: payments-api
  namespace: team-payments
spec:
  crossplane:
    compositionSelector:
      matchLabels:
        provider: local
  parameters:
    displayName: Payments API
    project: default
    source:
      repoURL: https://gitea.cloud.adhar.io/adhar/payments-api.git
      path: deploy
      targetRevision: main
    destination:
      namespace: team-payments
    # Omit `environments` to get the platform default (dev auto-syncs;
    # test and prod are promoted through Kargo).
