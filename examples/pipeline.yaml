# A CI pipeline. The platform's golden path is the Tekton `app-ci` pipeline
# (clone → build → scan → sign → deploy, docs/adr/0018) which every scaffolded
# repository gets automatically; this object is for a pipeline of your own
# shape — its stages become Tekton Tasks, its triggers an EventListener.
apiVersion: platform.adhar.io/v1alpha1
kind: CompositePipeline
metadata:
  name: payments-api-ci
  namespace: team-payments
spec:
  crossplane:
    compositionSelector:
      matchLabels:
        provider: local
  name: payments-api-ci
  namespace: team-payments
  type: build
  timeout: 30m
  stages:
    - name: test
      steps:
        - name: unit
          image: maven:3-eclipse-temurin-25
          command: ["mvn", "-B", "test"]
    - name: build
      steps:
        - name: image
          image: gcr.io/kaniko-project/executor:latest
          command: ["/kaniko/executor", "--destination=harbor.cloud.adhar.io/adhar/payments-api:$(git.sha)"]
  triggers:
    git:
      enabled: true
      branch: main
      events: [push, pull_request]
    manual: true
  artifacts:
    enabled: true
    retention: 30d
