# A package of your own, delivered the way the platform delivers its own: an
# Argo CD Application (or ApplicationSet) whose source is replicated into the
# in-cluster git server first.
#
# `replicate: true` is the point of the object. The manifests are copied into
# Gitea and Argo CD is pointed at THAT, so the cluster keeps working when the
# upstream repository is unreachable — and so a platform operator can see and
# roll back exactly what is deployed. With `replicate: false` Argo CD reads the
# remote repository directly.
#
# `argoCD.applicationFile` is a path the CONTROLLER reads, so it has to exist
# where the controller runs: locally that is the machine running `adhar up`, and
# in-cluster it is a path inside the manager image.
apiVersion: platform.adhar.io/v1alpha1
kind: CustomPackage
metadata:
  name: payments-api
  namespace: adhar-system
spec:
  replicate: true
  gitServerURL: https://gitea.platform.example.com
  internalGitServeURL: http://gitea-http.adhar-system.svc.cluster.local:3000
  gitServerAuthSecretRef:
    name: gitea-credential
    namespace: adhar-system
  remoteRepository:
    url: https://github.com/acme/payments-api
    ref: main
    path: deploy
    cloneSubmodules: false
  argoCD:
    name: payments-api
    namespace: adhar-system
    type: Application
    applicationFile: /adhar/packages/payments-api/app.yaml
