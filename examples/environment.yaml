# A named environment (a quota-bounded namespace with a tier) that applications
# are promoted into. Environments are what Kargo Stages point at.
apiVersion: platform.adhar.io/v1alpha1
kind: CompositeEnvironment
metadata:
  name: payments-staging
  namespace: team-payments
spec:
  crossplane:
    compositionSelector:
      matchLabels:
        provider: local
  parameters:
    name: payments-staging
    tier: staging
    cpuQuota: "8"
    memoryQuota: 16Gi
    podQuota: 40
    enableNetworkPolicy: true
    labels:
      adhar.io/team: payments
