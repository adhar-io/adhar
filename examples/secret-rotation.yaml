# Scheduled rotation of a secret, with the services that consume it restarted
# afterwards. The platform rotates its own credentials through
# security/credential-rotation; this is for a team's.
#
# `restartOnRotation` is the part people forget: a pod that read the old value
# into memory at start-up keeps using it, so a rotated secret with nothing
# restarted is a secret that is about to cause an outage at the next restart.
apiVersion: platform.adhar.io/v1alpha1
kind: SecretRotation
metadata:
  name: payments-db-password
  namespace: team-payments
spec:
  crossplane:
    compositionSelector:
      matchLabels:
        provider: local
  parameters:
    displayName: Payments database password
    # external-secrets reads from the platform's backend (OpenBao); the cloud
    # managers are for secrets that live outside the cluster.
    provider: external-secrets
    secretType: database
    rotationKey: password
    rotationSchedule: "0 0 * * 0"
    automaticRotation: true
    secretReferences:
      - name: payments-db-app
        namespace: team-payments
    targetServices:
      - name: payments-api
        namespace: payments-api-prod
        restartOnRotation: true
    retentionPolicy:
      keepVersions: 3
    notificationConfig:
      enabled: true
      notifyOnFailure: true
      notifyOnSuccess: false
      channels:
        - type: slack
          config:
            channel: "#payments-alerts"
    auditConfig:
      enabled: true
      retentionDays: 90
