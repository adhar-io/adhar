# A managed PostgreSQL for a team. Locally and on self-managed clusters this is
# a CloudNativePG cluster with WAL archiving to the platform object store and a
# daily base backup; on `ADHAR_PROVIDER=aws` the same request becomes RDS — the
# request does not change, the composition behind it does.
apiVersion: platform.adhar.io/v1alpha1
kind: CompositeDatabase
metadata:
  name: payments-db
  namespace: team-payments
spec:
  crossplane:
    compositionSelector:
      matchLabels:
        provider: local
        engine: postgresql
  parameters:
    engine: postgresql
    engineVersion: "16"
    storageSize: 20Gi
    # 0 = a single instance; 1–5 adds streaming replicas (HA).
    replicas: 1
    enableBackup: true
    backupRetentionDays: 7
    deletionPolicy: Orphan
