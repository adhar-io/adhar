# Adhar on Google Cloud — kubeadm on Compute Engine, autoscaled.
#
# This file asks for GKE: `clusterMode: managed` below. The platform has three
# modes on every cloud — `compute` (Adhar builds the cluster itself with kubeadm
# on plain GCE instances), `managed` (Google runs the control plane) and
# `provided` (the cluster already exists and Adhar only installs onto it).
# Everything above the cluster is identical in all three; managed is the default
# in the shipped configs because only a managed control plane brings a
# cloud-controller-manager, and without one the Gateway never gets a load
# balancer address and the platform's URLs do not resolve.
#
#   adhar up -f examples/gcp-config.yaml --env production --dry-run   # validate
#   adhar up -f examples/gcp-config.yaml --env production             # deploy
#   adhar down -f examples/gcp-config.yaml --env production           # tear down
#
# Before the first run:
#   1. Enable these APIs on the project: serviceusage, cloudresourcemanager,
#      compute, container, dns, iam. The Container API is needed even in kubeadm
#      mode, because the provider constructs its client unconditionally.
#   2. Give the service account roles/compute.admin and roles/dns.admin, plus
#      roles/iam.serviceAccountUser if the nodes run as a service account.
#   3. Create a Cloud DNS managed zone for defaultHost and delegate that
#      subdomain at your registrar to the zone's four nameservers. Nothing in
#      the platform creates the zone for you.

apiVersion: v1alpha1
kind: Config

globalSettings:
  adharContext: adhar-mgmt

  # Drives every URL, the DNS zone external-dns manages, and the wildcard
  # certificate. Apps are published at <app>.<defaultHost>.
  defaultHost: cloud.example.com

  # 443, not 8443. The cloud path puts a real load balancer in front, so the
  # local Kind convention of a high port does not apply.
  defaultHttpPort: 80
  defaultHttpsPort: 443

  enableHAMode: false

  # Required. Let's Encrypt uses it for expiry notices.
  email: admin@example.com

  # Selects the edge DNS backend for external-dns and the cert-manager DNS-01
  # solver. Omit, or set to `none`, to stay on self-signed certificates with no
  # DNS automation.
  dnsProvider: gcp

providers:
  gcp:
    type: gcp
    region: asia-southeast1
    primary: true

    projectId: your-gcp-project

    # A service account key file, and not only Application Default Credentials:
    # the edge DNS step needs a key it can mount into external-dns and
    # cert-manager, so ADC alone fails there even though it is fine for
    # provisioning. `~` is expanded.
    serviceAccountKeyFile: ~/.config/gcloud/your-service-account.json

    # Managed GKE instead of kubeadm on GCE. Everything else — packages, GitOps,
    # SSO, autoscaling, teardown — behaves the same either way.
    # clusterMode: the platform has THREE modes, the same three for every
    # provider — `compute` (kubeadm on raw instances), `managed` (this
    # cloud's hosted Kubernetes, here GKE) and `provided` (an existing
    # cluster, see below). The service name is implied by the provider, so the
    # old per-cloud spellings (eks/aks/gke/doks/k3s) and the `useManagedK8s`
    # boolean are gone; both are now rejected rather than mapped,
    # so a stale config fails loudly instead of quietly building the other mode.
    #
    # compute is the default: it is the path the platform is designed around, it
    # pays no managed control-plane charge, and it is the only mode where the
    # node autoscaler can add a worker — it provisions an instance and
    # kubeadm-joins it, which a managed node pool does not let it do. It also
    # keeps the node ours, which two things the platform needs depend on: the
    # kubelet flags, and the containerd certs.d trust that lets nodes pull
    # kpack-built images from the in-cluster Harbor.
    #
    # Nothing is given up at the edge on THIS cloud. Compute mode installs the
    # cloud-controller-manager (platform/providers/cloudintegration.go), so the
    # Gateway still gets a real load-balancer address, external-dns publishes its
    # A record and the URLs answer on 443. Civo is the one exception — its CCM
    # only works against Civo's own managed Kubernetes — which is why the Civo
    # config is the only one that ships `managed`.
    #
    # Set `managed` for GKE when you want the cloud to run the control plane;
    # everything above the cluster is unchanged.
    #
    # The THIRD mode is `provided`: the cluster ALREADY EXISTS and the platform
    # only installs itself onto it, reached through the kubeconfig named below.
    # Nothing is created, and — the part that matters — nothing is ever deleted:
    # `adhar down` removes nothing and leaves the cluster running. The cluster
    # must either already run Cilium with gatewayAPI.enabled=true (the platform
    # leaves that Cilium exactly as configured), or have no CNI at all, in which
    # case the platform installs Cilium itself. A cluster running a different CNI
    # is REFUSED by the preflight rather than having its networking replaced.
    #
    #   clusterMode: provided
    #   kubeconfig: ~/.kube/config       # default: $KUBECONFIG, then ~/.kube/config
    #   kubeContext: my-existing-cluster # default: the file's current context
    #
    clusterMode: compute

    config:
      project_id: your-gcp-project
      zone: asia-southeast1-a

      vpc_name: adhar-vpc
      subnet_name: adhar-subnet
      # Any range works. The firewall rules are built from this value; they used
      # to hardcode 10.0.0.0/24, which silently dropped node-to-node traffic on
      # every cluster that chose a different subnet.
      subnet_cidr: 10.20.0.0/16

      machine_type: e2-standard-4
      # pd-standard, deliberately. pd-balanced and pd-ssd both count against the
      # region's SSD_TOTAL_GB quota, which defaults to 250 GB — three 100 GB
      # workers plus a control plane exceeds it and the create fails partway with
      # QUOTA_EXCEEDED. pd-standard counts against DISKS_TOTAL_GB (2 TB by
      # default), so it leaves room for the autoscaler to reach maxWorkers.
      # Request an SSD_TOTAL_GB increase and switch to pd-balanced for better
      # etcd and image-pull latency.
      disk_type: pd-standard
      disk_size_gb: 100

      image_family: ubuntu-2404-lts-amd64
      image_project: ubuntu-os-cloud

      # Who may reach SSH (22) and the Kubernetes API (6443). Leaving this out
      # opens both to the internet and logs a warning at provisioning time. Set
      # it to your office or VPN ranges; note that a range which excludes the
      # machine running `adhar` will also block scaling and upgrades.
      # admin_source_ranges:
      #   - 203.0.113.4/32

      labels:
        environment: production
        project: adhar

# At least one template must exist; environments inherit from one by name.
environmentTemplates:
  prod-defaults:
    clusterConfig:
      - key: autoScale
        value: "true"
    coreServices:
      cilium:
        chart:
          repoURL: https://helm.cilium.io/
          name: cilium
          version: 1.15.7

# Three environments, the same three on every provider: dev, test and prod.
#
# `isolation` decides what an environment physically IS:
#
#   namespace (the default) — a namespace on ONE shared platform cluster.
#   cluster                 — a cluster of its own, with its own platform.
#
# All three are namespaces here, so `adhar up -f <this file>` builds ONE cluster
# and creates the `dev`, `test` and `prod` namespaces on it. That is the whole
# point of the default: three clusters meant three platform installs and three
# bills, and on a default GCP quota (CPUS_ALL_REGIONS 64 against ~40 for one
# production cluster) it did not even fit.
#
# To give an environment hard isolation — its own API server, its own etcd, its
# own blast radius — set `isolation: cluster` on it. That is usually prod and
# nothing else:
#
#   prod:
#     isolation: cluster
#
# The cluster that hosts the namespace environments is sized from the
# production-type one among them, because it has to carry production's load.
# `clusterConfig` and `autoscaling` on a namespace environment describe that
# shared cluster; on a `cluster` environment they describe its own.
environments:
  dev:
    isolation: namespace
    type: non-production
    provider: gcp
    region: asia-southeast1
    template: prod-defaults
    clusterConfig:
      - key: name
        value: adhar-dev
      - key: machineType
        value: e2-standard-8
      - key: nodeCount
        value: '2'
    autoscaling:
      enabled: true
      minWorkers: 2
      maxWorkers: 5

  test:
    isolation: namespace
    type: non-production
    provider: gcp
    region: asia-southeast1
    template: prod-defaults
    clusterConfig:
      - key: name
        value: adhar-test
      - key: machineType
        value: e2-standard-8
      - key: nodeCount
        value: '2'
    autoscaling:
      enabled: true
      minWorkers: 2
      maxWorkers: 5

  prod:
    isolation: namespace
    type: production
    provider: gcp
    region: asia-southeast1
    template: prod-defaults
    clusterConfig:
      - key: name
        value: adhar-prod
      - key: machineType
        value: e2-standard-8
      - key: nodeCount
        value: '4'
    autoscaling:
      enabled: true
      minWorkers: 3
      maxWorkers: 5

# ---------------------------------------------------------------------------
# Agentic capabilities (Adhar AI)
#
# The LLM key never goes in this file. Enable the packages here, then seed the
# key straight into the secrets backend after `adhar up`:
#
#   export ADHAR_AI_LLM_API_KEY='sk-or-v1-...'
#   ADHAR_AI_LLM_PROVIDER=openrouter hack/seed-adhar-ai-llm.sh
#
# Enabling the packages with no key is a supported state: the agent runtime and
# the MCP tool servers come up and report themselves unkeyed.
# ---------------------------------------------------------------------------
