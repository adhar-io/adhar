# Adhar on DigitalOcean — a complete, working configuration.
#
# This is the whole file. Copy it, change `defaultHost`, `email` and `region`,
# and run:
#
#   export DIGITALOCEAN_ACCESS_TOKEN="dop_v1_…"
#   adhar up -f digitalocean-config.yaml --env dev
#
# Everything the platform installs (Cilium, the Gateway, ArgoCD, Gitea,
# Crossplane and the ~76 stack packages) comes from the repository, not from
# here. This file only describes the CLUSTER: where it runs, how big it starts,
# and how far it may grow.
#
# See docs/DIGITALOCEAN_PROVIDER.md for the field reference and day-2 guide.

globalSettings:
  adharContext: adhar-mgmt              # kube-context name prefix and Cilium cluster name
  defaultHost: platform.adhar.io        # a zone hosted in DigitalOcean DNS; every URL derives from it
  defaultHttpPort: 80
  defaultHttpsPort: 443                 # 443 behind a cloud LB, so URLs carry no port
  enableHAMode: true                    # ArgoCD x2 + redis-ha x3, CNPG 2 instances, PDBs
  email: admin@platform.adhar.io        # Let's Encrypt (ACME) account

  # DigitalOcean DNS for external-dns records AND the cert-manager DNS-01 solver,
  # so the wildcard certificate is a real one. `none` stays on self-signed.
  dnsProvider: digitalocean

providers:
  digitalocean:
    type: digitalocean
    region: blr1
    primary: true                       # only the primary cloud's Crossplane providers are installed
    useEnvironment: true                # read the token from DIGITALOCEAN_ACCESS_TOKEN
    # clusterMode: the platform has THREE modes, the same three for every
    # provider — `compute` (kubeadm on raw instances), `managed` (this
    # cloud's hosted Kubernetes, here DOKS) and `provided` (an existing
    # cluster, see below). The service name is implied by the provider, so the
    # old per-cloud spellings (eks/aks/gke/doks/k3s) and the `useManagedK8s`
    # boolean are gone; both are now rejected rather than mapped,
    # so a stale config fails loudly instead of quietly building the other mode.
    #
    # compute is the default: it is the path the platform is designed around, it
    # pays no managed control-plane charge, and it is the only mode where the
    # node autoscaler can add a worker — it provisions an instance and
    # kubeadm-joins it, which a managed node pool does not let it do. It also
    # keeps the node ours, which two things the platform needs depend on: the
    # kubelet flags, and the containerd certs.d trust that lets nodes pull
    # kpack-built images from the in-cluster Harbor.
    #
    # Nothing is given up at the edge on THIS cloud. Compute mode installs the
    # cloud-controller-manager (platform/providers/cloudintegration.go), so the
    # Gateway still gets a real load-balancer address, external-dns publishes its
    # A record and the URLs answer on 443. Civo is the one exception — its CCM
    # only works against Civo's own managed Kubernetes — which is why the Civo
    # config is the only one that ships `managed`.
    #
    # Set `managed` for DOKS when you want the cloud to run the control plane;
    # everything above the cluster is unchanged.
    #
    # The THIRD mode is `provided`: the cluster ALREADY EXISTS and the platform
    # only installs itself onto it, reached through the kubeconfig named below.
    # Nothing is created, and — the part that matters — nothing is ever deleted:
    # `adhar down` removes nothing and leaves the cluster running. The cluster
    # must either already run Cilium with gatewayAPI.enabled=true (the platform
    # leaves that Cilium exactly as configured), or have no CNI at all, in which
    # case the platform installs Cilium itself. A cluster running a different CNI
    # is REFUSED by the preflight rather than having its networking replaced.
    #
    #   clusterMode: provided
    #   kubeconfig: ~/.kube/config       # default: $KUBECONFIG, then ~/.kube/config
    #   kubeContext: my-existing-cluster # default: the file's current context
    #
    clusterMode: compute
                                        # `managed` hands the control plane to
                                        # DigitalOcean (free, no SSH) and the token
                                        # then also needs the Kubernetes scope.
                                        # See docs/DIGITALOCEAN_PROVIDER.md#managed-kubernetes-doks-instead-of-droplets
    config:
      reuse_existing_vpc: true          # reuse a VPC with a matching CIDR instead of creating one
      vpc_cidr: 10.3.0.0/16             # must not overlap a cluster you intend to mesh with
      droplet_size: s-8vcpu-16gb        # default size for nodes this provider creates
      image: ubuntu-24-04-x64
      tags:                             # applied to every droplet, on top of the per-cluster tag
        - adhar
        - adhar-mgmt

# Templates exist to share defaults between environments. Both keys below are
# REQUIRED by config validation even though neither installs anything on this
# path: the foundation ships as embedded manifests, so the chart coordinates
# here are recorded, printed by --dry-run, and otherwise inert. Do not spend
# time tuning them.
environmentTemplates:
  nonprod-defaults:
    clusterConfig:
      - key: autoScale
        value: "true"
    coreServices:
      cilium:
        chart:
          repoURL: https://helm.cilium.io/
          name: cilium
          version: 1.15.7

# `adhar up -f <file>` with no --env provisions EVERY environment listed here,
# so keep this list to environments you actually want. A leftover sample block
# sized for another cloud will create an orphan droplet and then fail.
# Three environments, the same three on every provider: dev, test and prod.
#
# `isolation` decides what an environment physically IS:
#
#   namespace (the default) — a namespace on ONE shared platform cluster.
#   cluster                 — a cluster of its own, with its own platform.
#
# All three are namespaces here, so `adhar up -f <this file>` builds ONE cluster
# and creates the `dev`, `test` and `prod` namespaces on it. That is the whole
# point of the default: three clusters meant three platform installs and three
# bills, and on a default GCP quota (CPUS_ALL_REGIONS 64 against ~40 for one
# production cluster) it did not even fit.
#
# To give an environment hard isolation — its own API server, its own etcd, its
# own blast radius — set `isolation: cluster` on it. That is usually prod and
# nothing else:
#
#   prod:
#     isolation: cluster
#
# The cluster that hosts the namespace environments is sized from the
# production-type one among them, because it has to carry production's load.
# `clusterConfig` and `autoscaling` on a namespace environment describe that
# shared cluster; on a `cluster` environment they describe its own.
environments:
  dev:
    isolation: namespace
    type: non-production
    provider: digitalocean
    template: nonprod-defaults
    clusterConfig:
      - key: name
        value: adhar-dev
      - key: nodeSize
        value: s-8vcpu-16gb
      - key: nodeCount
        value: '2'
    autoscaling:
      enabled: true
      minWorkers: 2
      maxWorkers: 5

  test:
    isolation: namespace
    type: non-production
    provider: digitalocean
    template: nonprod-defaults
    clusterConfig:
      - key: name
        value: adhar-test
      - key: nodeSize
        value: s-8vcpu-16gb
      - key: nodeCount
        value: '2'
    autoscaling:
      enabled: true
      minWorkers: 2
      maxWorkers: 5

  prod:
    isolation: namespace
    type: production
    provider: digitalocean
    template: nonprod-defaults
    clusterConfig:
      - key: name
        value: adhar-prod
      - key: nodeSize
        value: s-8vcpu-16gb
      - key: nodeCount
        value: '2'
    autoscaling:
      enabled: true
      minWorkers: 2
      maxWorkers: 5

# ---------------------------------------------------------------------------
# Agentic capabilities (Adhar AI)
#
# Two steps, and NEITHER puts the LLM key in this file — git carries pointers,
# the secrets backend carries values (ADR-0009):
#
#   1. Enable the two AI packages for the environment. They go together:
#      `adhar-ai` is the agent layer, `agentgateway` serves its LLM + MCP
#      endpoints, and adhar-ai has no LLM path of its own.
#
#        platform/stack/adhar-appset-production.yaml   (and the mirrored
#        platform/stack/environments/prod/config.yaml)
#          - name: "adhar-ai"      -> enabled: "true"
#          - name: "agentgateway"  -> enabled: "true"
#
#   2. After `adhar up`, seed the key. ESO projects it with no redeploy:
#
#        export ADHAR_AI_LLM_API_KEY='sk-ant-...'
#        hack/seed-adhar-ai-llm.sh                       # Anthropic (default)
#        ADHAR_AI_LLM_PROVIDER=openrouter \
#          hack/seed-adhar-ai-llm.sh                     # OpenRouter / OpenAI-compatible
#
# Enabling the packages WITHOUT a key is a supported state: the seven MCP tool
# servers and the agent runtime come up and report themselves unkeyed, and
# nothing else on the platform is affected.
#
# Full walkthrough, including the extra BackendTLSPolicy a non-default endpoint
# needs: docs/DIGITALOCEAN_PROVIDER.md -> "Agentic platform (Adhar AI)".
# ---------------------------------------------------------------------------
