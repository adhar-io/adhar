# A Kafka cluster for a team, built by Strimzi, with its topics declared
# alongside it.
#
# The PLATFORM's shared Kafka is the data/kafka-operator package, and that is
# what an application should normally use (see the platform-provided
# capabilities: never bundle a broker in a chart). Ask for one of these when a
# workload needs isolation the shared cluster cannot give — its own retention,
# its own version, its own blast radius.
apiVersion: platform.adhar.io/v1alpha1
kind: Messaging
metadata:
  name: payments-events
  namespace: team-payments
spec:
  crossplane:
    compositionSelector:
      matchLabels:
        feature: messaging
  name: payments-events
  engine: kafka
  kafkaVersion: "3.8.0"
  # 1 broker is development: no in-sync replicas, so a restart loses writes.
  replicas: 3
  storageSize: 20Gi
  topics:
    - name: payments.captured
      partitions: 6
      replicas: 3
    - name: payments.settled
      partitions: 6
      replicas: 3
    - name: payments.dead-letter
      partitions: 1
      replicas: 3
