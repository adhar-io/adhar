# A secret sourced from the platform's secrets backend (OpenBao, via External
# Secrets) rather than written into git. `data`/`stringData` are for a value
# the platform GENERATES; `externalSecret` is for one that already exists.
apiVersion: platform.adhar.io/v1alpha1
kind: CompositeSecret
metadata:
  name: payments-stripe
  namespace: team-payments
spec:
  crossplane:
    compositionSelector:
      matchLabels:
        provider: local
  name: payments-stripe
  namespace: team-payments
  type: external
  externalSecret:
    enabled: true
    provider: vault
    secretPath: secret/team-payments/stripe
    refreshInterval: 1h
  rotation:
    enabled: true
    schedule: "0 3 1 * *"
