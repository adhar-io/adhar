# The tenant root — everything else (teams, projects, environments,
# applications) hangs off an organisation (ADR-0026, the tenancy model in docs/).
# The platform seeds its own, `adhar`; any signed-in user may create another
# from the Console's organisation switcher (self-service onboarding, granted by
# RBAC `create organizations.console.adhar.io`), which declares one of these.
#
# Creating it gives you: a home namespace with its own quota, RBAC there for the
# Keycloak groups `org-<name>` (members: view) and `org-<name>-admin`
# (administrators: admin — the Console creates both groups and keeps their
# membership), and the Gitea organisation that will hold the tenant's
# repositories. Projects carry their own quotas; the ones here apply to the
# organisation's HOME namespace only.
apiVersion: platform.adhar.io/v1alpha1
kind: Organisation
metadata:
  name: acme
  namespace: adhar-system
spec:
  crossplane:
    compositionSelector:
      matchLabels:
        provider: local
  parameters:
    name: acme
    displayName: ACME Corporation
    description: The platform tenant that owns every team below it
    cpuQuota: "8"
    memoryQuota: 16Gi
    podQuota: 50
    createGiteaOrganisation: true
