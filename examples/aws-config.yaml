# Adhar on AWS — kubeadm on EC2, autoscaled from a small floor.
#
# This is the GENERIC version: every value is a placeholder, so change
# `defaultHost`, `email` and the region before the first run. Credentials are
# never read from this file (see `providers`).
#
#   adhar up   -f examples/aws-config.yaml --env dev --dry-run   # validate, no spend
#   adhar up   -f examples/aws-config.yaml --env dev             # deploy
#   adhar down -f examples/aws-config.yaml --env dev             # tear down
#   adhar down -f examples/aws-config.yaml --env dev --purge-orphaned-volumes
#
# STATUS: first live bring-up. AWS is built and render-verified; the kubeadm path
# is shared with DigitalOcean (the one cloud proven live) but has never been run
# on EC2. Treat the first `adhar up` as a bring-up exercise — GCP took eleven
# provider defects and three quota traps to reach a working platform.
#
# BEFORE THE FIRST RUN — four prerequisites, in this order. The full runbook and a
# preflight script that checks all four are in docs/AWS_PROVIDER.md §0.
#
#   1. SERVICE CONTROL POLICIES. If the account is in an AWS Organization, an SCP
#      can deny EC2 even when `AdministratorAccess` is attached, and nothing in the
#      member account can grant it back. This is FIRST because it looks like an IAM
#      problem and is not: the error says "explicit deny in a service control
#      policy" only at the very end of a long line. Fixable only from the
#      management account. Re-test with a repeated sample — while an SCP is being
#      edited, calls pass briefly and then go back to denied.
#   2. IAM. EC2 (VPC, subnets, gateways, route tables, security groups, key pairs,
#      instances, volumes), ELB read + delete for the load balancer the in-cluster
#      CCM creates, servicequotas:GetServiceQuota, sts:GetCallerIdentity.
#      docs/AWS_PROVIDER.md §1 has a ready-to-paste policy.
#   3. QUOTA. The region's Running On-Demand Standard vCPU limit (L-1216C47A) must
#      cover the WHOLE cluster at maxWorkers, not just the start: 1 control plane +
#      6 workers of m6i.2xlarge = 56 vCPU. New accounts often start at 5. Raising
#      it is a support case, not instant.
#   4. DNS. A public hosted zone for `defaultHost` must already exist, and its
#      four Route 53 nameservers must match what public DNS returns for that name
#      — delegation has to be live BEFORE the run, or the ACME DNS-01 challenge
#      cannot be answered and you get self-signed certificates. Confirm with
#      `aws route53 list-hosted-zones` and `dig NS <your-host>`. Nothing in the
#      platform creates the zone, and the AWS PROVIDER ITSELF never calls Route53
#      — external-dns and the cert-manager DNS-01 solver do, from inside the
#      cluster.

apiVersion: v1alpha1
kind: Config

globalSettings:
  adharContext: adhar-mgmt

  # Drives every URL, the zone external-dns manages, and the wildcard
  # certificate. Apps are published at <app>.platform.example.com.
  defaultHost: platform.example.com

  # 443, not 8443. A real load balancer fronts the cloud path, so the local Kind
  # convention of a high port does not apply.
  defaultHttpPort: 80
  defaultHttpsPort: 443

  # A single control plane. HA triples the control-plane spend and this is a
  # verification run.
  enableHAMode: false

  # Required. Let's Encrypt sends expiry notices here.
  email: admin@example.com

  # Selects Route53 for external-dns and the cert-manager DNS-01 solver. Set to
  # `none` to stay on self-signed certificates with no DNS automation.
  dnsProvider: aws

providers:
  aws:
    type: aws
    region: ap-southeast-1
    primary: true

    # Credentials come from the ENVIRONMENT, never from this file — it is
    # committed, and a key in git is a key that has to be rotated.
    #
    #   export AWS_ACCESS_KEY_ID=...
    #   export AWS_SECRET_ACCESS_KEY=...
    #   adhar up -f examples/aws-config.yaml --env dev
    #
    # `profile: <name>` or `credentialsFile: ~/.aws/credentials` work too.
    useEnvironment: true

    # Managed EKS instead of kubeadm on EC2. Everything else — packages, GitOps,
    # SSO, autoscaling, teardown — behaves the same either way. Left off because
    # the kubeadm path is what the platform is designed around, and because EKS
    # adds a control-plane charge plus its own IAM surface.
    # useManagedK8s: true

    # Node image. Defaults to the newest Ubuntu 24.04 LTS (noble) from Canonical
    # for x86_64 — the same LTS the GCP provider boots, which it did not used to
    # be. Override any part of it:
    #
    #   ami: ami-0123456789abcdef0        # pin exactly; skips the lookup
    #   imageNameFilter: "my/hardened-*"  # a private or hardened base image
    #   imageOwner: "111122223333"        # whose images to search
    #   imageArchitecture: arm64          # with a Graviton machineType
    #
    # Pin `ami` for a reproducible or air-gapped build: without it every run takes
    # whatever Canonical published most recently.

    vpcConfig:
      # The provider creates one VPC with a public subnet (10.0.1.0/24, nodes)
      # and a private subnet (10.0.2.0/24, tagged for internal load balancers but
      # currently unused by nodes). Must not overlap the pod CIDR below.
      cidr: 10.0.0.0/16
      subnetCidrs:
        - 10.0.1.0/24
        - 10.0.2.0/24

# At least one template must exist; environments inherit from one by name.
environmentTemplates:
  dev-defaults:
    clusterConfig:
      - key: autoScale
        value: "true"
    # coreServices may not be empty (the schema rejects `{}`). Cilium is pinned
    # here for the same reason as on GCP: it is the CNI AND the Gateway data
    # path, so an unpinned chart can change kube-proxy replacement behaviour
    # under a cluster mid-bootstrap.
    coreServices:
      cilium:
        chart:
          repoURL: https://helm.cilium.io/
          name: cilium
          version: 1.15.7

# Three environments, the same three on every provider: dev, test and prod.
#
# `isolation` decides what an environment physically IS:
#
#   namespace (the default) — a namespace on ONE shared platform cluster.
#   cluster                 — a cluster of its own, with its own platform.
#
# All three are namespaces here, so `adhar up -f <this file>` builds ONE cluster
# and creates the `dev`, `test` and `prod` namespaces on it. That is the whole
# point of the default: three clusters meant three platform installs and three
# bills, and on a default GCP quota (CPUS_ALL_REGIONS 64 against ~40 for one
# production cluster) it did not even fit.
#
# To give an environment hard isolation — its own API server, its own etcd, its
# own blast radius — set `isolation: cluster` on it. That is usually prod and
# nothing else:
#
#   prod:
#     isolation: cluster
#
# The cluster that hosts the namespace environments is sized from the
# production-type one among them, because it has to carry production's load.
# `clusterConfig` and `autoscaling` on a namespace environment describe that
# shared cluster; on a `cluster` environment they describe its own.
environments:
  dev:
    isolation: namespace
    type: non-production
    provider: aws
    region: ap-southeast-1
    template: dev-defaults
    clusterConfig:
      - key: name
        value: adhar-dev
      - key: machineType
        value: r6i.xlarge
      - key: controlPlaneMachineType
        value: r6i.large
      - key: nodeCount
        value: '2'
      - key: diskSizeGb
        value: '256'
      - key: diskType
        value: gp3
    autoscaling:
      enabled: true
      minWorkers: 2
      maxWorkers: 5

  test:
    isolation: namespace
    type: non-production
    provider: aws
    region: ap-southeast-1
    template: dev-defaults
    clusterConfig:
      - key: name
        value: adhar-test
      - key: machineType
        value: r6i.xlarge
      - key: controlPlaneMachineType
        value: r6i.large
      - key: nodeCount
        value: '2'
      - key: diskSizeGb
        value: '256'
      - key: diskType
        value: gp3
    autoscaling:
      enabled: true
      minWorkers: 2
      maxWorkers: 5

  prod:
    isolation: namespace
    type: production
    provider: aws
    region: ap-southeast-1
    template: dev-defaults
    clusterConfig:
      - key: name
        value: adhar-prod
      - key: machineType
        value: r6i.xlarge
      - key: controlPlaneMachineType
        value: r6i.large
      - key: nodeCount
        value: '2'
      - key: diskSizeGb
        value: '256'
      - key: diskType
        value: gp3
    autoscaling:
      enabled: true
      minWorkers: 2
      maxWorkers: 5
