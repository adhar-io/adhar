# ─── Machine sizing ──────────────────────────────────────────────────────────
# Every size, count and place is configuration. Where each value comes from, most
# specific first (keys match ignoring case and separators):
#
#   control plane  environments.<env>.clusterConfig  controlPlaneMachineType
#                  providers.<p>.config              controlPlaneMachineType
#                  providers.<p>.config  legacy size key (vmSize / machine_type /
#                                        droplet_size / size) — sized EVERY node
#                  built-in default (below)
#   workers        clusterConfig machineType | nodeSize | workerMachineType
#                  (or nodeGroups[].machineType for an additional group)
#                  on scale-up: the size the group's existing workers run
#                  providers.<p>.config workerMachineType → legacy size key → default
#   worker count   clusterConfig nodeCount → autoscaling.minWorkers (if higher)
#                  → default 2 (every cloud)
#   autoscaling    environments.<env>.autoscaling {enabled, minWorkers, maxWorkers,
#                  nodeGroup} (template block as fallback). minWorkers <= maxWorkers.
#   OS disk        AWS/GCP: clusterConfig diskSizeGb/diskType, else provider config;
#                  Azure: providers.azure.config diskSizeGb/diskType ONLY;
#                  DigitalOcean/Civo: implied by the size.
#   region         environments.<env>.region → providers.<p>.region (format-checked)
#   zones          AWS vpcConfig.availabilityZones; GCP config.zone (must be in region)
#   network        AWS vpcConfig {cidr, subnetCidrs}; Azure vnetCidr/subnetCidr;
#                  GCP subnet_cidr; DigitalOcean vpc_cidr; pod CIDR: clusterConfig podCidr
#   image          AWS ami/imageNameFilter; Azure imagePublisher/imageOffer/imageSku;
#                  GCP image_family/image_project; DigitalOcean image; Civo image
#   version        clusterConfig kubeVersion (or `adhar up --kube-version`)
#
# Built-in defaults — the smallest that run the full platform reliably:
#   provider       control plane      workers                       disk
#   aws            m6i.xlarge         r6i.xlarge                    256 GiB gp3
#   azure          Standard_D4s_v5    Standard_E4bds_v5             256 GiB Standard_LRS
#   gcp            e2-standard-4      e2-standard-4                 256 GiB pd-standard
#   digitalocean   s-8vcpu-16gb       s-8vcpu-16gb                  (by size)
#   civo           g3.large           g3.xlarge / g4s.kube.large*   (by size)
#   (* managed k3s pools take kube sizes.) Control planes are >= 4 vCPU because a
#   2-vCPU control plane collapses under the platform's ~600 CRDs (leader-election
#   crash loops); `adhar config validate` prints each environment's resolved sizes
#   and warns when a control plane is below that.
#
# Additional node groups (GPU, high-memory, ...) beside the primary `workers` group:
#
#   environments:
#     prod:
#       nodeGroups:
#         - name: gpu                    # DNS-1123, <= 20 chars, not "workers"
#           machineType: g5.xlarge       # empty = the provider's worker size
#           count: 1                     # >= 1
#           labels: {adhar.io/accelerator: nvidia}
#           taints:                      # applied by managed pools; compute mode records them
#             - {key: nvidia.com/gpu, value: "true", effect: NoSchedule}
#       autoscaling:
#         enabled: true
#         nodeGroup: workers             # or the name of a nodeGroups entry
#         minWorkers: 2
#         maxWorkers: 6

# Environment Templates for reusable configurations
environmentTemplates:
  # Production template with high availability and security
  prod-defaults:
    clusterConfig:
      - key: "autoScale"
        value: "true"
      - key: "minNodes"
        value: "3"
      - key: "maxNodes"
        value: "10"
    coreServices:
      cilium:
        chart:
          repoURL: "https://helm.cilium.io/"
          name: "cilium"
          version: "1.15.7"
        values:
          - key: "cluster.name"
            value: "production-cluster"
          - key: "kubeProxyReplacement"
            value: "strict"
          - key: "hubble.enabled"
            value: "true"
          - key: "hubble.relay.enabled"
            value: "true"
          - key: "hubble.ui.enabled"
            value: "true"
          - key: "encryption.enabled"
            value: "true"
          - key: "encryption.type"
            value: "wireguard"
          - key: "operator.replicas"
            value: "2"
      nginx:
        chart:
          repoURL: "https://kubernetes.github.io/ingress-nginx"
          name: "ingress-nginx"
          version: "4.10.1"
        values:
          - key: "controller.replicaCount"
            value: "3"
          - key: "controller.service.type"
            value: "LoadBalancer"
      gitea:
        chart:
          repoURL: "https://dl.gitea.com/charts/"
          name: "gitea"
          version: "10.3.0"
        values:
          - key: "postgresql.enabled"
            value: "true"
          - key: "redis.enabled"
            value: "true"
          - key: "persistence.enabled"
            value: "true"
      argocd:
        chart:
          repoURL: "https://argoproj.github.io/argo-helm"
          name: "argo-cd"
          version: "6.11.1"
        values:
          - key: "server.replicas"
            value: "2"
          - key: "controller.replicas"
            value: "2"
          - key: "repoServer.replicas"
            value: "2"
    addons:
      - name: prometheus
        chart:
          repoURL: "https://prometheus-community.github.io/helm-charts"
          name: "kube-prometheus-stack"
          version: "59.0.0"
        targetNamespace: monitoring
        createNamespace: true
        values:
          - key: "grafana.enabled"
            value: "true"
          - key: "prometheus.prometheusSpec.retention"
            value: "30d"

      - name: cert-manager
        chart:
          repoURL: "https://charts.jetstack.io"
          name: "cert-manager"
          version: "v1.15.0"
        targetNamespace: cert-manager
        createNamespace: true
        values:
          - key: "installCRDs"
            value: "true"
          - key: "global.leaderElection.namespace"
            value: "cert-manager"

      - name: external-dns
        chart:
          repoURL: "https://kubernetes-sigs.github.io/external-dns/"
          name: "external-dns"
          version: "1.14.5"
        targetNamespace: external-dns
        createNamespace: true

  # Development template with cost optimization
  nonprod-defaults:
    clusterConfig:
      - key: "autoScale"
        value: "true"
      - key: "minNodes"
        value: "1"
      - key: "maxNodes"
        value: "5"
    coreServices:
      cilium:
        chart:
          repoURL: "https://helm.cilium.io/"
          name: "cilium"
          version: "1.15.7"
      nginx:
        chart:
          repoURL: "https://kubernetes.github.io/ingress-nginx"
          name: "ingress-nginx"
          version: "4.10.1"
      gitea:
        chart:
          repoURL: "https://dl.gitea.com/charts/"
          name: "gitea"
          version: "10.3.0"
      argocd:
        chart:
          repoURL: "https://argoproj.github.io/argo-helm"
          name: "argo-cd"
          version: "6.11.1"
    addons:
      - name: metrics-server
        chart:
          repoURL: "https://kubernetes-sigs.github.io/metrics-server/"
          name: "metrics-server"
          version: "3.12.1"
        targetNamespace: kube-system

# Environment Definitions
environments:
  # Development environments (auto-assigned to non-production provider: DigitalOcean)
  dev:
    type: non-production
    template: nonprod-defaults
    clusterConfig:
      - key: "name"
