# Adhar Platform Configuration
#
# IMPORTANT: This is a template configuration file with placeholder values.
# Replace all placeholders (YOUR_*) with your actual credentials and settings.
#
# DEFAULT CONFIGURATION:
# - Kind (local Kubernetes) is enabled by default for development
# - All cloud providers are commented out - uncomment and configure as needed
# - Never commit real tokens/credentials to version control
#
# This file demonstrates how to configure production Kubernetes clusters
# across multiple cloud providers with Cilium CNI and platform components

# Global Settings
globalSettings:
  adharContext: "adhar-mgmt"
  defaultHost: "cloud.adhar.io"
  defaultHttpPort: 80
  defaultHttpsPort: 8443
  enableHAMode: false
  email: "YOUR_EMAIL@example.com"

# Provider configurations
# Only configure the providers you plan to use
# For development, Kind is enabled by default
providers:
  # Kind - Local development clusters (enabled by default)
  kind:
    type: kind
    region: local
    primary: true # Management cluster provider for local development
  #   config:
  #     kind_path: kind
  #     kubectl_path: kubectl
  #     registry:
  #       enabled: false
  #       name: "kind-registry"
  #       port: 5001
  #     cluster_config:
  #       api_version: kind.x-k8s.io/v1alpha4
  #       kind: Cluster
  #       networking:
  #         disable_default_cni: false
  #         kube_proxy_mode: iptables
  #       nodes:
  #         - role: control-plane
  #           extra_port_mappings:
  #             - container_port: 80
  #               host_port: 80
  #             - container_port: 443
  #               host_port: 443
  #         - role: worker
  #         - role: worker

  # AWS Provider (enabled for production workloads)
  # aws:
  #   type: aws
  #   # Default: raw compute + kubeadm (adhar-managed Kubernetes). Set
  #   # clusterMode: managed for EKS instead; every other behaviour
  #   # and operation is identical.
  #   clusterMode: compute
  #   region: ap-south-1
  #   primary: true  # Set to true if you want provider to handle management cluster
  #   credentials_file: "~/.aws/credentials"
  #   # accessKeyId: "YOUR_AWS_ACCESS_KEY_ID"
  #   # secretAccessKey: "YOUR_AWS_SECRET_ACCESS_KEY"
  #   # useEnvironment: true # Environment variables (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY)
  #   vpcConfig:                                  # network; the values shown are the defaults
  #     cidr: "10.0.0.0/16"
  #     subnetCidrs: ["10.0.1.0/24", "10.0.2.0/24"] # [public: every node, private: internal LBs]
  #     availabilityZones: ["ap-south-1a", "ap-south-1b"]  # [nodes, private subnet]; default: the region's first two
  #   config:
  #     # Sizes — see "Machine sizing" below. Values shown are the defaults.
  #     controlPlaneMachineType: "m6i.xlarge"       # 4 vCPU / 16 GiB
  #     workerMachineType: "r6i.xlarge"             # 4 vCPU / 32 GiB
  #     diskSizeGb: 256                             # OS disk of every node (node-local PVs live here)
  #     diskType: "gp3"
  #     # ami: "ami-0123456789abcdef0"              # pin an exact image; else the Ubuntu 24.04 lookup via
  #     # imageNameFilter / imageOwner / imageArchitecture
  #     security_groups:
  #       - name: "adhar-cluster-sg"
  #         rules:
  #           - protocol: tcp
  #             from_port: 22
