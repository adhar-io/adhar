name: E2E

on:
  push:
    branches: ['**'] # not tags
  # Nightly: the batch suites (below) are too long for every push.
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

jobs:
  e2e:
    # The nightly schedule is for the batch jobs; the bootstrap gate runs on push.
    if: github.event_name != 'schedule'
    # E2E bootstraps a full platform; cancel superseded runs on the same ref —
    # one group per engine so Docker and Podman never cancel each other.
    #
    # Job-level, not workflow-level: `matrix` does not exist in a workflow-level
    # `concurrency` expression, and a workflow file that references it is
    # rejected before any job starts. Every E2E run since the matrix was added
    # failed with ZERO jobs and no log — a failure that looked like
    # infrastructure and was a one-line syntax error (2026-10-05).
    concurrency:
      group: e2e-${{ github.ref }}-${{ matrix.engine }}
      cancel-in-progress: true
    # Docker and Podman are both first-class local engines for `adhar up`
    # (docs/KIND_PROVIDER.md): the same bootstrap must pass on each, so both
    # run on every push — a regression that only shows on Podman (image
    # preload, port mapping, rootless networking) is caught here, not by a
    # user. Podman on the runner is rootful (`sudo`), which is the mode Kind
    # documents for CI; rootless Podman works for local development.
    strategy:
      fail-fast: false
      matrix:
        engine: [docker, podman]
    name: Full bootstrap sequence (${{ matrix.engine }})
    # The job budget must EXCEED the test's own, or GitHub kills the runner
    # first and every failure looks identical (a cancelled job with no output).
    # The test defaults to a 90m overall budget and 60m for `adhar up`; the
    # budgets below are tightened for a CI runner, and this timeout leaves room
    # for checkout, the Go toolchain and the teardown after the test returns.
    runs-on: ubuntu-latest
    timeout-minutes: 70
    # Docker is the gate. The same bring-up on rootless Podman on this runner
    # reaches ~12 of 15 apps in the time Docker finishes all of them (docker
    # 14.5 min green, podman 54 min red on the same commit, 2026-10-17); the
    # Podman job still runs and reports, but a Podman-only slowness does not
    # fail the workflow until it is understood.
    continue-on-error: ${{ matrix.engine == 'podman' }}
    env:
      # A cold GitHub runner has an empty image cache, so the bootstrap is
      # dominated by image pulls. These keep the run bounded while still leaving
      # enough headroom that a slow-but-working platform is not reported as a
      # regression.
      # up = ~5m bootstrap + apps budget + the verdict's 10m grace; the runner
      # has 4 vCPUs and the identity chain alone takes ~15m on it.
      # A healthy run converges the apps in ~10 minutes (Docker passes in
      # 17-23 min end to end). The old 35m apps / 55m up budget only made a
      # stuck run take 50+ minutes to say so; a run that has not converged in
      # 20 minutes is stuck, and the cluster state dump on failure says why.
      ADHAR_E2E_TIMEOUT: 60m
      ADHAR_E2E_UP_TIMEOUT: 35m
      ADHAR_E2E_APPS_TIMEOUT: 20m
      ADHAR_E2E_HEALTH_TIMEOUT: 15m
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Prepare Podman
        if: matrix.engine == 'podman'
        run: |
          # ubuntu-latest ships podman; Kind needs the rootful daemonless
          # engine reachable by the current user, and cgroup v2 delegation.
          sudo apt-get update -qq && sudo apt-get install -y -qq podman
          podman --version
          # Run the Kind/Podman path as root (rootless Kind needs extra
          # systemd delegation the hosted runner does not grant).
          echo "SUDO=sudo -E" >> "$GITHUB_ENV"

      # Runs tests/e2e/bootstrap: adhar up → Ready condition → foundation →
      # Gitea repos → ArgoCD API → package health → CLI status → adhar down
      - name: Run e2e tests
        run: ${SUDO:-} make e2e ENGINE=${{ matrix.engine }}
        env:
          HOME: /home/runner

  # ─── Batch on Volcano (design 0025 Phase 2, PLAT-2.8, A2.9) ───────────────
  #
  # Volcano is disabled in every shipped profile until the production gate
  # (design §15): v1.17, or a maintainer sign-off on v1.16 with THIS canary
  # green. Design §4.6 runs it on every change to the package and what it
  # drives (Kyverno included: DEC-4 makes the two batch policies fail closed
  # through its chart values); a push touching none of that skips both jobs, and the nightly
  # schedule and a manual dispatch always run them.
  volcano-changes:
    name: Batch/Volcano paths changed?
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.paths.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: paths
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" != push ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # A new branch has no `before`: compare with where it left main.
          base="$BEFORE"
          if [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base=$(git merge-base origin/main HEAD 2>/dev/null || git rev-list --max-parents=0 HEAD | tail -1)
          fi
          changed=$(git diff --name-only "$base" HEAD)
          echo "$changed"
          if echo "$changed" | grep -qE '^(platform/stack/packages/core/(volcano|adhar-batch)/|platform/stack/packages/security/kyverno/|platform/controlplane/configuration/(compositions/(batchjob|team)/|xrd/(batchjob|team)\.xrd\.yaml)|platform/controllers/autoscaler/|platform/controllers/adharplatform/volcano_|tests/e2e/batch/|cmd/batch/|Makefile$|\.github/workflows/e2e\.yaml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  # Minutes, no cluster: the pinned Volcano binaries on the shipped narrowed
  # RBAC and scheduler configuration, against envtest. Catches a ClusterRole
  # that lost a verb the binaries call before the long job below starts.
  volcano-rehearsal:
    name: Volcano rehearsal (envtest)
    needs: volcano-changes
    if: needs.volcano-changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build Volcano and rehearse
        run: make e2e-volcano-rehearsal

  # A2.9: the batch suite and the canary (A2.1-A2.7, A2.10) on Kind v1.37
  # with Volcano. The harness stages a copy of platform/stack with Volcano
  # switched on; the shipped profile is never edited.
  batch-volcano:
    name: Batch on Kind with Volcano (A2.1-A2.10)
    needs: [volcano-changes, volcano-rehearsal]
    if: needs.volcano-changes.outputs.run == 'true'
    concurrency:
      group: e2e-batch-volcano-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    # Above the test's own budget (go test -timeout 340m in the Makefile), so
    # a stuck run reports why instead of being killed silently; GitHub's
    # hosted-runner ceiling is 360.
    timeout-minutes: 355
    env:
      ADHAR_E2E_UP_TIMEOUT: 40m
      ADHAR_E2E_APPS_TIMEOUT: 25m
      # Each suite's own budget: Phase 1 (~140m with the kpack build), then
      # the canary (scaffold of the partitioned job plus the scenarios).
      ADHAR_E2E_BATCH_TIMEOUT: 150m
      ADHAR_E2E_VOLCANO_SCENARIO_TIMEOUT: 20m
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run the batch suite with Volcano
        run: make e2e-batch-volcano ENGINE=docker
        env:
          HOME: /home/runner
