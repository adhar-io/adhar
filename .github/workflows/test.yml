name: Tests

on:
  push:
    branches: ['**'] # not tags
  pull_request:

jobs:
  test:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Two guards execute what they check instead of matching text: the Argo CD
      # Volcano health checks run under lua (Argo CD runs gopher-lua, Lua 5.1) and the
      # Volcano queue alerts run under promtool. Without the tools both skip, and
      # ADHAR_REQUIRE_RULE_TOOLS=1 turns that skip into a failure here.
      - name: Install rule tools
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1
          curl -sSfL https://github.com/prometheus/prometheus/releases/download/v3.5.0/prometheus-3.5.0.linux-amd64.tar.gz \
            | sudo tar -xz -C /usr/local/bin --strip-components=1 prometheus-3.5.0.linux-amd64/promtool
          lua5.1 -v
          promtool --version

      - name: Running Tests
        env:
          ADHAR_REQUIRE_RULE_TOOLS: "1"
        run: |
          go mod tidy
          make test
