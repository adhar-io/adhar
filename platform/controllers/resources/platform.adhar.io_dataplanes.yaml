  name: dataplanes.platform.adhar.io
spec:
  group: platform.adhar.io
  names:
    kind: DataPlane
    listKind: DataPlaneList
    plural: dataplanes
    shortNames:
    - dp
    singular: dataplane
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.infrastructure.mode
      name: Mode
      type: string
    - jsonPath: .spec.infrastructure.provider
      name: Provider
      type: string
    - jsonPath: .status.appCount
      name: Apps
      type: integer
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: DataPlaneSpec is the desired state.
            properties:
              infrastructure:
                properties:
                  compositeRef:
                    description: CompositeRef links the CompositeCluster XR the controller
                      created (mode=composite).
                    properties:
                      name:
                        type: string
                      namespace:
                        type: string
                    required:
                    - name
                    type: object
                  kubeconfigSecretRef:
                    description: KubeconfigSecretRef references a kubeconfig secret
                      (mode=adopt).
                    properties:
                      name:
                        type: string
                      namespace:
                        type: string
                    required:
                    - name
                    type: object
                  mode:
                    description: DataPlaneInfraMode selects how the underlying cluster
                      is realised.
                    enum:
                    - composite
                    - vcluster
                    - adopt
                    type: string
                  nodePools:
                    items:
                      properties:
                        count:
                          type: integer
                        gpu:
                          type: boolean
                        name:
                          type: string
                        size:
                          type: string
                      required:
                      - count
                      - name
                      - size
                      type: object
