---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.2
  name: adharplatforms.platform.adhar.io
spec:
  group: platform.adhar.io
  names:
    kind: AdharPlatform
    listKind: AdharPlatformList
    plural: adharplatforms
    singular: adharplatform
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: AdharPlatform is the Schema for the adharplatforms API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: AdharPlatformSpec defines the desired state of AdharPlatform.
            properties:
              autoscaling:
                description: |-
                  Autoscaling configures the platform's own node autoscaler: the cluster
                  starts small and grows only when pods cannot be scheduled, shrinking
                  again when the workers sit idle. Adhar runs self-managed kubeadm
                  clusters on raw cloud compute, for which the upstream cluster-autoscaler
                  has no cloud provider, so the platform does it itself (see
                  platform/controllers/autoscaler). Nil or disabled = fixed worker count.
                properties:
                  enabled:
                    description: |-
                      Enabled turns the autoscaler on for this platform. When false the
                      controller is still running but takes no action.
                    type: boolean
                  maxWorkers:
                    default: 5
                    description: |-
                      MaxWorkers is the ceiling the autoscaler never scales above — the
                      platform's spend limit.
                    format: int32
                    minimum: 0
                    type: integer
                  minWorkers:
                    default: 1
                    description: MinWorkers is the floor the autoscaler never scales
                      below.
                    format: int32
                    minimum: 0
                    type: integer
                  nodeGroup:
                    default: workers
                    description: NodeGroup is the provider node group to scale.
                    type: string
                  scaleDownDelay:
                    default: 10m
                    description: |-
                      ScaleDownDelay is how long the cluster must stay under the threshold
                      before a node is drained and removed.
                    type: string
                  scaleDownUtilizationThreshold:
                    default: 50%
                    description: |-
                      ScaleDownUtilizationThreshold is the requested-vs-allocatable share
                      (e.g. "50%", or a bare fraction "0.5") that cluster CPU *and* memory must
                      both stay under before a worker is removed.
                    type: string
                  scaleUpCooldown:
                    default: 3m
                    description: ScaleUpCooldown is the minimum gap between two node
                      additions.
                    type: string
                type: object
              buildCustomization:
                description: BuildCustomizationSpec fields cannot change once a cluster
                  is created
                properties:
                  clusterName:
                    description: |-
                      ClusterName identifies this platform in shared external systems, e.g.
                      as the external-dns TXT owner id so several clusters can publish into
                      the same DNS zone without stealing each other's records.
                    type: string
                  dnsProvider:
                    description: |-
                      DNSProvider is the DNS backend of the platform edge — the zone that
                      holds the platform host — used by external-dns to publish records and by
                      cert-manager's DNS-01 solver to issue the *.<host> wildcard certificate.
                      Values are Adhar provider names (digitalocean, aws, gcp, azure, civo) or
                      "cloudflare"; empty means no edge DNS (local, or "none"): records are not
                      published and the Gateway keeps the self-signed issuer. The credentials
                      live in the adhar-dns-provider Secret in the platform namespace, created
                      by the CLI from the provider credentials at bootstrap — never in Git.
                    type: string
                  email:
                    description: |-
                      Email is the ACME registration address for the platform's Let's Encrypt
                      ClusterIssuers (globalSettings.email). Empty → platform@<host>.
                    type: string
                  enableHAMode:
                    description: |-
                      EnableHAMode renders the foundation components (ArgoCD, Gitea) with
                      production replica counts, PodDisruptionBudgets, and topology spread.
                    type: boolean
                  host:
                    type: string
                  ingressHost:
                    type: string
                  port:
                    type: string
                  portSuffix:
                    description: |-
                      PortSuffix is the URL port segment (":8443" locally, empty for the
                      standard 443/80 used behind a real cloud LoadBalancer). Foundation
                      manifests template it as `{{ .Host }}{{ .PortSuffix }}` so URLs and OIDC
                      issuers are correct on every topology (local/cloud/on-prem) without any
                      hardcoded host or port. Derived from Port + Protocol.
                    type: string
                  protocol:
                    type: string
                  selfSignedCert:
                    type: string
                  staticPassword:
                    type: boolean
                  usePathRouting:
                    type: boolean
                type: object
              clusterMesh:
                description: |-
                  ClusterMesh carries this cluster's Cilium Cluster Mesh identity and,
                  optionally, the clustermesh-apiserver that lets peers connect to it.
                  Every cluster in a mesh needs a unique (name, id) pair and a
                  non-overlapping Pod CIDR; the CA is shared because the platform ships
                  one `cilium-ca` in its embedded install manifest. Nil means the
                  defaults baked into that manifest (adhar-mgmt / 1) with no apiserver.
                properties:
                  apiServer:
                    description: |-
                      APIServer deploys the clustermesh-apiserver on this cluster so peers
                      can read its state. Without it a cluster can join a mesh one-way at
                      best; `cilium clustermesh connect` needs one on both sides.
                    properties:
                      enabled:
                        description: Enabled applies resources/cilium/clustermesh.yaml
                          on this cluster.
                        type: boolean
                      nodePort:
                        description: |-
                          NodePort pins the port when ServiceType is NodePort, so firewall rules
                          and the peers' host aliases stay stable across re-creates.
                        format: int32
                        maximum: 32767
                        minimum: 30000
                        type: integer
                      serviceType:
                        description: |-
                          ServiceType exposes the apiserver to peers. ClusterIP is unreachable
                          from another cluster, so a real fleet uses NodePort (cheapest — the
                          peer dials a node IP) or LoadBalancer.
                        enum:
                        - ClusterIP
                        - NodePort
                        - LoadBalancer
                        type: string
                    type: object
                  id:
                    description: |-
                      ID is the Cilium cluster ID, unique across the mesh. 1 is the
                      management cluster; data planes take 2-255.
                    format: int32
                    maximum: 255
                    minimum: 1
                    type: integer
                  name:
                    description: |-
                      Name is the Cilium cluster name. Must be unique across the mesh and a
                      valid DNS label — it becomes `<name>.mesh.cilium.io` in the peers'
                      host aliases. Defaults to "adhar-mgmt".
                    type: string
                type: object
              packageConfigs:
                properties:
                  argoPackageConfigs:
                    description: |-
                      ArgoPackageConfigSpec Allows for configuration of the ArgoCD Installation.
                      If no fields are specified then the binary embedded resources will be used to install ArgoCD.
                    properties:
                      enabled:
                        description: Enabled controls whether to install ArgoCD.
                        type: boolean
                    type: object
                  customPackageDirs:
                    items:
                      type: string
                    type: array
                  customPackageUrls:
                    items:
                      type: string
                    type: array
                  embeddedArgoApplicationsPackageConfigs:
                    description: EmbeddedArgoApplicationsPackageConfigSpec Controls
                      the installation of the embedded argo applications.
                    properties:
                      enabled:
                        description: Enabled controls whether to install the embedded
                          argo applications and the associated GitServer
                        type: boolean
                    type: object
                  packageCustomization:
                    additionalProperties:
                      description: PackageCustomization defines how packages are customized
                      properties:
                        filePath:
                          description: FilePath is the absolute file path to a YAML
                            file that contains Kubernetes manifests.
                          type: string
                        name:
                          description: Name is the name of the package to be customized.
                            e.g. argocd
                          type: string
                      required:
                      - name
                      type: object
                    type: object
                type: object
              provider:
                description: |-
                  Provider is the infrastructure provider this platform runs on (kind,
                  aws, azure, gke, do, civo). The controller uses it to decide which
                  optional components make sense — e.g. cloud Crossplane providers are
                  only installed on cloud platforms. Empty is treated as kind (local).
                type: string
            type: object
          status:
            description: AdharPlatformStatus defines the observed state of AdharPlatform.
            properties:
              ArgoCD:
                properties:
                  appsCreated:
                    type: boolean
                  available:
                    type: boolean
                type: object
              autoscaling:
                description: Autoscaling reports the node autoscaler's view of the
                  cluster.
                properties:
                  enabled:
                    description: |-
                      Enabled mirrors spec.autoscaling.enabled so `adhar get status` can show
                      the mode without reading the spec.
                    type: boolean
                  lastReason:
                    description: |-
                      LastReason explains the most recent decision (including "no action" ones)
                      in one line.
                    type: string
                  lastScaleDown:
                    format: date-time
                    type: string
                  lastScaleUp:
                    format: date-time
                    type: string
                  underutilizedSince:
                    description: |-
                      UnderutilizedSince is when the cluster first dropped below the scale-down
                      threshold in the current stretch. It is persisted (rather than kept in
                      memory) so the ScaleDownDelay survives a controller restart or a leader
                      election handover.
                    format: date-time
                    type: string
                  workers:
                    description: Workers is the number of schedulable worker nodes
                      at the last tick.
                    format: int32
                    type: integer
                required:
                - workers
                type: object
              conditions:
                description: |-
                  Conditions represent the latest observations of the platform's state.
                  Types: ArgoCDReady, GatewayReady, GiteaReady, CrossplaneReady,
                  GitOpsReady, and the aggregate Ready.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              crossplane:
                properties:
                  available:
                    type: boolean
                  controlPlaneApplied:
                    type: boolean
                type: object
              fleet:
                description: |-
                  Fleet rolls up the DataPlanes attached to this control plane
                  (ADR-0023). Maintained by the DataPlane controller.
                properties:
                  dataPlanes:
                    description: DataPlanes is the number of DataPlane objects.
                    type: integer
                  planes:
                    description: Planes lists every data plane with its readiness
                      and placed-app count.
                    items:
                      description: FleetPlane is one data plane in the fleet roll-up.
                      properties:
                        apps:
                          type: integer
                        kubernetesVersion:
                          type: string
                        mode:
                          type: string
                        name:
                          type: string
                        ready:
                          type: boolean
                      required:
                      - name
                      type: object
                    type: array
                  ready:
                    description: Ready is how many of them report the Ready condition
                      True.
                    type: integer
                required:
                - dataPlanes
                - ready
                type: object
              gateway:
                properties:
                  available:
                    type: boolean
                type: object
              gitea:
                properties:
                  adminUserSecretNameecret:
                    type: string
                  adminUserSecretNamespace:
                    type: string
                  available:
                    type: boolean
                  externalURL:
                    type: string
                  internalURL:
                    type: string
                  repositoriesCreated:
                    type: boolean
                type: object
              observedGeneration:
                description: ObservedGeneration is the 'Generation' of the resource
                  that was last processed by the controller.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
