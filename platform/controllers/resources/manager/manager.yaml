# In-cluster controller manager: keeps AdharPlatform, GitRepository and
# CustomPackage reconciliation running continuously after the CLI exits.
# Applied by the CLI (adhar up --in-cluster); not part of the reconciler's
# own resource set.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: adhar-controller-manager
  namespace: {{ .Namespace }}
  labels:
    app.kubernetes.io/name: adhar-controller-manager
    adhar.io/component: controller-manager
---
# The manager server-side-applies the entire platform foundation (CRDs, RBAC,
# cluster-scoped resources, arbitrary embedded manifests), so a hand-scoped
# ClusterRole would drift on every foundation change. cluster-admin matches the
# authority the CLI already exercises at bootstrap.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: adhar-controller-manager
  labels:
    app.kubernetes.io/name: adhar-controller-manager
    adhar.io/component: controller-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: adhar-controller-manager
    namespace: {{ .Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adhar-controller-manager
  namespace: {{ .Namespace }}
  labels:
    app.kubernetes.io/name: adhar-controller-manager
    adhar.io/component: controller-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: adhar-controller-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: adhar-controller-manager
        adhar.io/component: controller-manager
    spec:
      serviceAccountName: adhar-controller-manager
      # Service-link env vars from other Services in the shared namespace can
      # hijack flag parsing (ADR-0011).
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: {{ .Image }}
          args:
            - controller
            - --leader-elect=true
            # Both are required, not cosmetic: the manager reads the platform host
            # from this resource, and a mismatched name silently yields an empty
            # build configuration (see ManagerConfig.PlatformName).
            - --platform-name={{ .PlatformName }}
            - --namespace={{ .Namespace }}
          env:
            # The node autoscaler drives the cloud provider through the same
            # helpers the CLI uses, and those keep per-cluster state (the
            # kubeadm SSH key) under $HOME/.adhar. The image runs as uid 65532
            # with a read-only root filesystem, so point HOME at the writable
            # emptyDir instead of a non-existent home.
            - name: HOME
              value: /tmp
          ports:
            # controller-runtime's default webhook port. Named so the Service in
            # security/adhar-tenant-quotas can target it by name.
            - name: webhook
              containerPort: 9443
              protocol: TCP
          # Probe windows sized for a loaded single-node cluster (ADR-0012):
          # a healthy manager can take seconds to answer under convergence load.
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            # The manager materializes git worktrees and rendered manifests
            # under /tmp; the root filesystem stays read-only.
            - name: tmp
              mountPath: /tmp
            # Admission-webhook serving certificate, issued by cert-manager in
            # security/adhar-tenant-quotas.
            #
            # `optional: true` is what keeps this Deployment installable on a
            # cluster that has not enabled that package: without it the pod would
            # stay in ContainerCreating waiting for a Secret that will never
            # appear, taking every controller down to gain one webhook. The
            # controller checks for the files and simply does not serve webhooks
            # when they are absent (platform/webhooks/setup.go).
            - name: webhook-certs
              mountPath: /tmp/k8s-webhook-server/serving-certs
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: webhook-certs
          secret:
            secretName: adhar-webhook-serving-cert
            optional: true
