---
apiVersion: kubernetes.m.crossplane.io/v1alpha1
kind: Object
metadata:
  name: acme-payments-batch-queue-prod
  namespace: adhar-system
  annotations:
    crossplane.io/composition-resource-name: batch-queue-prod
spec:
  forProvider:
    manifest:
      apiVersion: scheduling.volcano.sh/v1beta1
      kind: Queue
      metadata:
        name: acme-payments-prod
status:
  conditions:
  - type: Ready
    status: 'False'
    reason: Unavailable
  - type: Synced
    status: 'False'
    reason: ReconcileError
    message: 'cannot create object: admission webhook "validatequeue.volcano.sh" denied
      the request: queue acme-payments-prod: the sum of the deserved resources of
      the children of adhar-batch exceeds its deserved'
