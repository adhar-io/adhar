# The ceiling admits no further prod deserved share: Volcano's queue webhook
# refuses the prod leaf and provider-kubernetes reports it as Synced=False.
apiVersion: kubernetes.m.crossplane.io/v1alpha1
kind: Object
metadata:
  name: acme-payments-batch-queue-dev
  namespace: adhar-system
  annotations:
    crossplane.io/composition-resource-name: batch-queue-dev
spec:
  forProvider:
    manifest:
      apiVersion: scheduling.volcano.sh/v1beta1
      kind: Queue
      metadata:
        name: acme-payments-dev
status:
  conditions:
  - type: Ready
    status: 'True'
    reason: Available
  - type: Synced
    status: 'True'
    reason: ReconcileSuccess
  atProvider:
    manifest:
      apiVersion: scheduling.volcano.sh/v1beta1
      kind: Queue
      metadata:
        name: acme-payments-dev
      status:
        state: Open
---
