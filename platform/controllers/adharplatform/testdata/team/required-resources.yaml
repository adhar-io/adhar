# What the Team composition reads where Volcano runs: the scheduler descriptor
# (core/volcano, design 0025 D7), the Queue CRD, the tenant allowances and the
# root queue whose capability is the batch ceiling (§4.1, §14).
apiVersion: v1
kind: ConfigMap
metadata:
  name: adhar-batch-scheduler
  namespace: adhar-system
data:
  scheduler: volcano
  version: v1.16.0
  gang: "true"
  rootQueue: adhar-batch
  prodDeservedCPU: "2"
  prodDeservedMemory: 4Gi
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: queues.scheduling.volcano.sh
spec:
  group: scheduling.volcano.sh
  names: {kind: Queue, plural: queues}
  scope: Cluster
  versions:
    - {name: v1beta1, served: true, storage: true, schema: {openAPIV3Schema: {type: object}}}
---
# payments may hold 8 CPU and 64Gi across its projects; the ceiling is
# 22 CPU / 24Gi, so the leaves get 8 CPU (the allowance) and 24Gi (the ceiling).
apiVersion: v1
kind: ConfigMap
metadata:
  name: adhar-tenant-quotas
  namespace: adhar-system
data:
  default: |
    cpu: "32"
    memory: 512Mi
  payments: |
    cpu: "8"     # the team's own entry wins over default
    memory: 64Gi
    projects: 10
---
apiVersion: scheduling.volcano.sh/v1beta1
kind: Queue
metadata:
  name: adhar-batch
spec:
  parent: root
  capability: {cpu: "22", memory: 24Gi}
  deserved: {cpu: "22", memory: 24Gi}
  reclaimable: false
status:
  state: Open
