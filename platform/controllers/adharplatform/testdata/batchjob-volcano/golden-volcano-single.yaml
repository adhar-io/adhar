conditions:
- message: PriorityClass adhar-batch-volcano-critical exists; runs on Volcano queue
    acme-payments-prod
  reason: Met
  status: "True"
  target: Composite
  type: PrerequisitesReady
- message: creating ConfigMap importer-run
  reason: Creating
  status: Unknown
  target: Composite
  type: TemplateReady
- message: creating CronJob importer
  reason: Creating
  status: Unknown
  target: Composite
  type: ScheduleReady
- message: the schedule is not on hold
  reason: NotHeld
  status: "False"
  target: Composite
  type: Held
- message: runs on queue acme-payments-prod (deserved {"cpu":"2","memory":"4Gi"})
  reason: Fits
  status: "True"
  target: Composite
  type: QueueFits
- message: the schedule is a CronJob (batch/v1)
  reason: Settled
  status: "True"
  target: Composite
  type: SchedulerSwitch
- message: environment prod of project shop (team payments, organisation acme)
  reason: EnvironmentNamespace
  status: "True"
  target: Composite
  type: Placement
requirements:
  leafQueue:
    apiVersion: scheduling.volcano.sh/v1beta1
    kind: Queue
    matchName: acme-payments-prod
  namespace:
    apiVersion: v1
    kind: Namespace
    matchName: prod
  priorityClass:
    apiVersion: scheduling.k8s.io/v1
    kind: PriorityClass
    matchName: adhar-batch-critical
  schedulerDescriptor:
    apiVersion: v1
    kind: ConfigMap
    matchName: adhar-batch-scheduler
    namespace: adhar-system
  volcanoCronJobCRD:
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    matchName: cronjobs.batch.volcano.sh
  volcanoJobCRD:
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    matchName: jobs.batch.volcano.sh
  volcanoPriorityClass:
    apiVersion: scheduling.k8s.io/v1
    kind: PriorityClass
    matchName: adhar-batch-volcano-critical
  volcanoQueueCRD:
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    matchName: queues.scheduling.volcano.sh
status:
  activeRuns: []
  cronJob: importer
  message: scheduled "30 1 * * *" in Asia/Singapore
  queue: acme-payments-prod
  runTemplate: importer-run
  scheduler: volcano
