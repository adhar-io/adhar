conditions:
- message: PriorityClass adhar-batch-critical exists
  reason: Met
  status: "True"
  target: Composite
  type: PrerequisitesReady
- message: creating ConfigMap settlement-run
  reason: Creating
  status: Unknown
  target: Composite
  type: TemplateReady
- message: creating CronJob settlement
  reason: Creating
  status: Unknown
  target: Composite
  type: ScheduleReady
- message: the schedule is not on hold
  reason: NotHeld
  status: "False"
  target: Composite
  type: Held
- message: this job runs on the native path (Volcano is not installed on this cluster
    (no ConfigMap adhar-system/adhar-batch-scheduler, or its CRDs are not served)),
    which has no queues
  reason: NativeScheduler
  status: "True"
  target: Composite
  type: QueueFits
- message: the schedule is a CronJob (batch/v1)
  reason: Settled
  status: "True"
  target: Composite
  type: SchedulerSwitch
- message: environment prod of project shop (team payments, organisation acme)
  reason: EnvironmentNamespace
  status: "True"
  target: Composite
  type: Placement
requirements:
  namespace:
    apiVersion: v1
    kind: Namespace
    matchName: prod
  priorityClass:
    apiVersion: scheduling.k8s.io/v1
    kind: PriorityClass
    matchName: adhar-batch-critical
  quota:
    apiVersion: v1
    kind: ResourceQuota
    matchName: prod-quota
    namespace: prod
  schedulerDescriptor:
    apiVersion: v1
    kind: ConfigMap
    matchName: adhar-batch-scheduler
    namespace: adhar-system
  volcanoCronJobCRD:
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    matchName: cronjobs.batch.volcano.sh
  volcanoJobCRD:
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    matchName: jobs.batch.volcano.sh
  volcanoPriorityClass:
    apiVersion: scheduling.k8s.io/v1
    kind: PriorityClass
    matchName: adhar-batch-volcano-critical
  volcanoQueueCRD:
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    matchName: queues.scheduling.volcano.sh
status:
  activeRuns: []
  cronJob: settlement
  message: scheduled "0 2 * * *" in Asia/Singapore
  runTemplate: settlement-run
  scheduler: kubernetes
