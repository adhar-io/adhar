composed:
  rules:
    alerts:
    - BatchRunFailed
    - BatchScheduleMissed
    - BatchNoRecentSuccess
    - BatchRunTooLong
    - BatchRunStuckPending
    - BatchRunOOMKilled
    kind: PrometheusRule
  run-template:
    data.kind: IndexedJob
    kind: ConfigMap
    template.yaml:
      apiVersion: batch/v1
      kind: Job
      metadata:
        annotations:
          adhar.io/batch-actor: ""
        labels:
          adhar.io/application: settlement
          adhar.io/batch-job: settlement
          adhar.io/batch-role: indexed
          adhar.io/batch-trigger: manual
          adhar.io/component: app
          adhar.io/environment: prod
          adhar.io/organisation: acme
          adhar.io/plane: workload
          adhar.io/project: shop
          adhar.io/scale-up: "true"
          adhar.io/team: payments
          adhar.io/workload: batch
          app.kubernetes.io/name: settlement
        namespace: prod
      spec:
        activeDeadlineSeconds: 21600
        backoffLimit: 2
        completionMode: Indexed
        completions: 5
        parallelism: 5
        podFailurePolicy:
          rules:
          - action: Ignore
            onPodConditions:
            - status: "True"
              type: DisruptionTarget
          - action: FailJob
            onExitCodes:
              containerName: batch
              operator: In
              values:
              - 2
              - 3
              - 4
              - 6
              - 7
        podReplacementPolicy: Failed
        successPolicy:
          rules:
          - succeededIndexes: "0"
        template:
          metadata:
            annotations:
              adhar.io/batch-actor: ""
              cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
            labels:
              adhar.io/application: settlement
              adhar.io/batch-job: settlement
              adhar.io/batch-role: indexed
              adhar.io/batch-trigger: manual
              adhar.io/component: app
              adhar.io/environment: prod
              adhar.io/organisation: acme
              adhar.io/plane: workload
              adhar.io/project: shop
              adhar.io/scale-up: "true"
              adhar.io/team: payments
              adhar.io/workload: batch
              app.kubernetes.io/name: settlement
          spec:
            containers:
            - env:
              - name: ADHAR_BATCH_JOB
                value: settlementJob
              - name: ADHAR_BATCH_NAME
                value: settlement
              - name: ADHAR_BATCH_ROLE
                value: indexed
              - name: ADHAR_BATCH_TRIGGER
                value: manual
              - name: ADHAR_BATCH_PARAMS
                value: '{}'
              - name: ADHAR_BATCH_TIME_ZONE
                value: Asia/Singapore
              - name: ADHAR_BATCH_REPOSITORY_SCHEMA
                value: batch
              - name: ADHAR_BATCH_SHUTDOWN_TIMEOUT
                value: 90s
              - name: ADHAR_BATCH_PARTITION_TRANSPORT
                value: jdbc
              - name: ADHAR_BATCH_PARTITION_GRIDSIZE
                value: "16"
              - name: ADHAR_BATCH_PARTITION_TIMEOUT
                value: 21300s
              - name: JOB_COMPLETION_INDEX
                valueFrom:
                  fieldRef:
                    apiVersion: v1
                    fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
              - name: ADHAR_BATCH_K8S_JOB
                valueFrom:
                  fieldRef:
                    apiVersion: v1
                    fieldPath: metadata.labels['batch.kubernetes.io/job-name']
              - name: ADHAR_BATCH_ACTOR
                valueFrom:
                  fieldRef:
                    apiVersion: v1
                    fieldPath: metadata.annotations['adhar.io/batch-actor']
              - name: POD_NAME
                valueFrom:
                  fieldRef:
                    apiVersion: v1
                    fieldPath: metadata.name
              - name: POD_UID
                valueFrom:
                  fieldRef:
                    apiVersion: v1
                    fieldPath: metadata.uid
              - name: NODE_NAME
                valueFrom:
                  fieldRef:
                    apiVersion: v1
                    fieldPath: spec.nodeName
              - name: ADHAR_ENVIRONMENT
                value: prod
              - name: SPRING_DATASOURCE_URL
                valueFrom:
                  secretKeyRef:
                    key: jdbc-uri
                    name: settlement-db-app
              - name: SPRING_DATASOURCE_USERNAME
                valueFrom:
                  secretKeyRef:
                    key: username
                    name: settlement-db-app
              - name: SPRING_DATASOURCE_PASSWORD
                valueFrom:
                  secretKeyRef:
                    key: password
                    name: settlement-db-app
              - name: BPL_JVM_THREAD_COUNT
                value: "50"
              - name: JAVA_TOOL_OPTIONS
                value: -XX:ReservedCodeCacheSize=64M
              - name: OTEL_EXPORTER_OTLP_ENDPOINT
                value: http://alloy.adhar-system.svc.cluster.local:4318
              - name: OTEL_EXPORTER_OTLP_PROTOCOL
                value: http/protobuf
              - name: OTEL_METRICS_EXPORTER
                value: otlp
              - name: OTEL_RESOURCE_ATTRIBUTES
                value: deployment.environment.name=prod,deployment.environment=prod,service.namespace=prod,k8s.namespace.name=prod,k8s.pod.name=$(POD_NAME),adhar.application=settlement,adhar.batch.job=settlement
              - name: OTEL_SERVICE_NAME
                value: settlement
              image: harbor-core.adhar-system.svc.cluster.local/library/settlement@sha256:2222222222222222222222222222222222222222222222222222222222222222
              name: batch
              resources:
                limits:
                  memory: 1Gi
                requests:
                  cpu: 500m
                  memory: 1Gi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                  - ALL
              volumeMounts:
              - mountPath: /tmp
                name: tmp
            enableServiceLinks: false
            imagePullSecrets:
            - name: harbor-dockercfg
            priorityClassName: adhar-batch-critical
            restartPolicy: Never
            schedulerName: default-scheduler
            securityContext:
              runAsNonRoot: true
              seccompProfile:
                type: RuntimeDefault
            serviceAccountName: settlement-batch
            terminationGracePeriodSeconds: 120
            volumes:
            - emptyDir:
                sizeLimit: 1Gi
              name: tmp
        ttlSecondsAfterFinished: 604800
  runner-role:
    apiVersion: rbac.authorization.k8s.io/v1
    kind: Role
    metadata:
      annotations:
        gotemplating.fn.crossplane.io/composition-resource-name: runner-role
        gotemplating.fn.crossplane.io/ready: "False"
      labels:
        adhar.io/application: settlement
        adhar.io/batch-job: settlement
        adhar.io/environment: prod
        adhar.io/organisation: acme
        adhar.io/plane: workload
        adhar.io/project: shop
        adhar.io/team: payments
        adhar.io/workload: batch
        app.kubernetes.io/name: settlement
      name: settlement-batch
      namespace: prod
    rules:
    - apiGroups:
      - batch
      - batch.volcano.sh
      resources:
      - jobs
      verbs:
      - get
    - apiGroups:
      - ""
      resources:
      - pods
      verbs:
      - get
  runner-rolebinding:
    apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata:
      annotations:
        gotemplating.fn.crossplane.io/composition-resource-name: runner-rolebinding
        gotemplating.fn.crossplane.io/ready: "False"
      labels:
        adhar.io/application: settlement
        adhar.io/batch-job: settlement
        adhar.io/environment: prod
        adhar.io/organisation: acme
        adhar.io/plane: workload
        adhar.io/project: shop
        adhar.io/team: payments
        adhar.io/workload: batch
        app.kubernetes.io/name: settlement
      name: settlement-batch
      namespace: prod
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: Role
      name: settlement-batch
    subjects:
    - kind: ServiceAccount
      name: settlement-batch
      namespace: prod
  runner-sa:
    apiVersion: v1
    kind: ServiceAccount
    metadata:
      annotations:
        gotemplating.fn.crossplane.io/composition-resource-name: runner-sa
        gotemplating.fn.crossplane.io/ready: "False"
      labels:
        adhar.io/application: settlement
        adhar.io/batch-job: settlement
        adhar.io/environment: prod
        adhar.io/organisation: acme
        adhar.io/plane: workload
        adhar.io/project: shop
        adhar.io/team: payments
        adhar.io/workload: batch
        app.kubernetes.io/name: settlement
      name: settlement-batch
      namespace: prod
  schedule-native:
    apiVersion: batch/v1
    kind: CronJob
    metadata:
      annotations:
        gotemplating.fn.crossplane.io/composition-resource-name: schedule-native
        gotemplating.fn.crossplane.io/ready: "False"
      labels:
