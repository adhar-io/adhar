conditions:
- message: PriorityClass adhar-batch-volcano-critical exists; runs on Volcano queue
    acme-payments-prod
  reason: Met
  status: "True"
  target: Composite
  type: PrerequisitesReady
- message: creating ConfigMap settlement-run
  reason: Creating
  status: Unknown
  target: Composite
  type: TemplateReady
- message: creating CronJob settlement
  reason: Creating
  status: Unknown
  target: Composite
  type: ScheduleReady
- message: the schedule is not on hold
  reason: NotHeld
  status: "False"
  target: Composite
  type: Held
- message: 'a run asks for more than queue acme-payments-prod''s deserved share in
    every dimension (cpu 2500m > deserved 2, memory 5120Mi > deserved 4Gi): it starts
    only while the batch tree has idle room and can never reclaim capacity from dev
    and test; shrink the run, or raise the batch ceiling''s prod share (globalSettings.batch)'
  reason: ExceedsDeserved
  status: "False"
  target: Composite
  type: QueueFits
- message: the schedule is a Volcano CronJob (batch.volcano.sh/v1alpha1)
  reason: Settled
  status: "True"
  target: Composite
  type: SchedulerSwitch
- message: environment prod of project shop (team payments, organisation acme)
  reason: EnvironmentNamespace
  status: "True"
  target: Composite
  type: Placement
requirements:
