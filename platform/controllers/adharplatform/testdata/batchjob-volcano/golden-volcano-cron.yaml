                    memory: 1Gi
                  requests:
                    cpu: 500m
                    memory: 1Gi
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                    - ALL
                volumeMounts:
                - mountPath: /tmp
                  name: tmp
              enableServiceLinks: false
              imagePullSecrets:
              - name: harbor-dockercfg
              priorityClassName: adhar-batch-volcano-critical
              restartPolicy: Never
              schedulerName: volcano
              securityContext:
                runAsNonRoot: true
                seccompProfile:
                  type: RuntimeDefault
              serviceAccountName: settlement-batch
