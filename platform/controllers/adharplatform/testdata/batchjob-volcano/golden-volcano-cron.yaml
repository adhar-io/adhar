composed:
  rules:
    alerts:
    - BatchRunFailed
    - BatchGangPending
    - BatchGangQueueRejected
    - BatchNoRecentSuccess
    - BatchRunTooLong
    - BatchRunStuckPending
    - BatchRunOOMKilled
    kind: PrometheusRule
  run-template:
    data.kind: VolcanoJob
    kind: ConfigMap
    template.yaml:
      apiVersion: batch.volcano.sh/v1alpha1
      kind: Job
      metadata:
        annotations:
          adhar.io/batch-actor: ""
        labels:
          adhar.io/application: settlement
          adhar.io/batch-job: settlement
          adhar.io/batch-trigger: manual
          adhar.io/environment: prod
          adhar.io/organisation: acme
          adhar.io/plane: workload
          adhar.io/project: shop
          adhar.io/scale-up: "true"
          adhar.io/team: payments
          adhar.io/workload: batch
          app.kubernetes.io/name: settlement
        namespace: prod
      spec:
        maxRetry: 3
        minAvailable: 5
        plugins:
          env: []
        policies:
        - action: TerminateJob
          exitCode: 2
        - action: TerminateJob
          exitCode: 3
        - action: TerminateJob
          exitCode: 4
        - action: TerminateJob
          exitCode: 6
        - action: TerminateJob
          exitCode: 7
        - action: RestartJob
          events:
          - PodEvicted
          - PodFailed
        priorityClassName: adhar-batch-volcano-critical
        queue: acme-payments-prod
        schedulerName: volcano
        tasks:
        - minAvailable: 1
          name: manager
          policies:
          - action: CompleteJob
            events:
            - TaskCompleted
          replicas: 1
          template:
            metadata:
              annotations:
                adhar.io/batch-actor: ""
                cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
              labels:
                adhar.io/application: settlement
                adhar.io/batch-job: settlement
                adhar.io/batch-role: manager
                adhar.io/batch-trigger: manual
                adhar.io/component: app
                adhar.io/environment: prod
                adhar.io/organisation: acme
                adhar.io/plane: workload
                adhar.io/project: shop
                adhar.io/scale-up: "true"
                adhar.io/team: payments
                adhar.io/workload: batch
                app.kubernetes.io/name: settlement
            spec:
              activeDeadlineSeconds: 21600
              containers:
              - env:
                - name: ADHAR_BATCH_JOB
                  value: settlementJob
                - name: ADHAR_BATCH_NAME
                  value: settlement
                - name: ADHAR_BATCH_ROLE
                  value: manager
                - name: ADHAR_BATCH_TRIGGER
                  value: manual
                - name: ADHAR_BATCH_PARAMS
                  value: '{}'
                - name: ADHAR_BATCH_TIME_ZONE
                  value: Asia/Singapore
                - name: ADHAR_BATCH_REPOSITORY_SCHEMA
                  value: batch
                - name: ADHAR_BATCH_SHUTDOWN_TIMEOUT
                  value: 90s
                - name: ADHAR_BATCH_PARTITION_TRANSPORT
                  value: jdbc
                - name: ADHAR_BATCH_PARTITION_GRIDSIZE
                  value: "16"
                - name: ADHAR_BATCH_PARTITION_TIMEOUT
                  value: 21300s
                - name: ADHAR_BATCH_K8S_JOB
                  valueFrom:
                    fieldRef:
                      apiVersion: v1
                      fieldPath: metadata.labels['volcano.sh/job-name']
                - name: ADHAR_BATCH_ACTOR
                  valueFrom:
                    fieldRef:
                      apiVersion: v1
                      fieldPath: metadata.annotations['adhar.io/batch-actor']
                - name: POD_NAME
                  valueFrom:
                    fieldRef:
                      apiVersion: v1
                      fieldPath: metadata.name
                - name: POD_UID
                  valueFrom:
                    fieldRef:
                      apiVersion: v1
                      fieldPath: metadata.uid
                - name: NODE_NAME
                  valueFrom:
                    fieldRef:
                      apiVersion: v1
                      fieldPath: spec.nodeName
                - name: ADHAR_ENVIRONMENT
                  value: prod
                - name: SPRING_DATASOURCE_URL
                  valueFrom:
                    secretKeyRef:
                      key: jdbc-uri
                      name: settlement-db-app
                - name: SPRING_DATASOURCE_USERNAME
                  valueFrom:
                    secretKeyRef:
                      key: username
                      name: settlement-db-app
                - name: SPRING_DATASOURCE_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      key: password
                      name: settlement-db-app
                - name: BPL_JVM_THREAD_COUNT
                  value: "50"
                - name: JAVA_TOOL_OPTIONS
                  value: -XX:ReservedCodeCacheSize=64M
                - name: OTEL_EXPORTER_OTLP_ENDPOINT
                  value: http://alloy.adhar-system.svc.cluster.local:4318
                - name: OTEL_EXPORTER_OTLP_PROTOCOL
                  value: http/protobuf
                - name: OTEL_METRICS_EXPORTER
                  value: otlp
                - name: OTEL_RESOURCE_ATTRIBUTES
