composed:
  rules:
    alerts:
    - BatchRunFailed
    - BatchGangPending
    - BatchGangQueueRejected
    - BatchRunTooLong
    - BatchRunStuckPending
    - BatchRunOOMKilled
    kind: PrometheusRule
  run-template:
    data.kind: VolcanoJob
    kind: ConfigMap
    template.yaml:
      apiVersion: batch.volcano.sh/v1alpha1
      kind: Job
      metadata:
        annotations:
          adhar.io/batch-actor: ""
        labels:
          adhar.io/application: reconciler
          adhar.io/batch-job: reconciler
          adhar.io/batch-trigger: manual
          adhar.io/environment: dev
          adhar.io/organisation: acme
          adhar.io/plane: workload
          adhar.io/project: shop
          adhar.io/team: payments
          adhar.io/workload: batch
          app.kubernetes.io/name: reconciler
        namespace: dev
      spec:
        maxRetry: 3
        minAvailable: 5
        plugins:
          env: []
        policies:
        - action: TerminateJob
          exitCode: 2
        - action: TerminateJob
          exitCode: 3
        - action: TerminateJob
          exitCode: 4
        - action: TerminateJob
          exitCode: 6
        - action: TerminateJob
          exitCode: 7
        - action: RestartJob
          events:
          - PodEvicted
          - PodFailed
        priorityClassName: adhar-batch-volcano
        queue: acme-payments-dev
        schedulerName: volcano
        tasks:
        - minAvailable: 1
          name: manager
          policies:
          - action: CompleteJob
            events:
            - TaskCompleted
          replicas: 1
          template:
            metadata:
              annotations:
                adhar.io/batch-actor: ""
                cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
              labels:
                adhar.io/application: reconciler
                adhar.io/batch-job: reconciler
                adhar.io/batch-role: manager
                adhar.io/batch-trigger: manual
                adhar.io/component: app
                adhar.io/environment: dev
                adhar.io/organisation: acme
                adhar.io/plane: workload
                adhar.io/project: shop
                adhar.io/team: payments
                adhar.io/workload: batch
                app.kubernetes.io/name: reconciler
            spec:
              activeDeadlineSeconds: 21600
              containers:
              - env:
                - name: ADHAR_BATCH_JOB
                  value: reconcileJob
                - name: ADHAR_BATCH_NAME
                  value: reconciler
                - name: ADHAR_BATCH_ROLE
                  value: manager
                - name: ADHAR_BATCH_TRIGGER
                  value: manual
                - name: ADHAR_BATCH_PARAMS
                  value: '{}'
                - name: ADHAR_BATCH_TIME_ZONE
                  value: UTC
                - name: ADHAR_BATCH_REPOSITORY_SCHEMA
                  value: batch
                - name: ADHAR_BATCH_SHUTDOWN_TIMEOUT
                  value: 90s
                - name: ADHAR_BATCH_PARTITION_TRANSPORT
                  value: jdbc
                - name: ADHAR_BATCH_PARTITION_GRIDSIZE
                  value: "32"
                - name: ADHAR_BATCH_PARTITION_TIMEOUT
                  value: 21300s
                - name: ADHAR_BATCH_K8S_JOB
                  valueFrom:
                    fieldRef:
                      apiVersion: v1
                      fieldPath: metadata.labels['volcano.sh/job-name']
                - name: ADHAR_BATCH_ACTOR
                  valueFrom:
                    fieldRef:
                      apiVersion: v1
                      fieldPath: metadata.annotations['adhar.io/batch-actor']
                - name: POD_NAME
                  valueFrom:
                    fieldRef:
                      apiVersion: v1
                      fieldPath: metadata.name
                - name: POD_UID
                  valueFrom:
                    fieldRef:
                      apiVersion: v1
                      fieldPath: metadata.uid
                - name: NODE_NAME
                  valueFrom:
                    fieldRef:
                      apiVersion: v1
                      fieldPath: spec.nodeName
                - name: ADHAR_ENVIRONMENT
                  value: dev
                - name: SPRING_DATASOURCE_URL
                  valueFrom:
                    secretKeyRef:
                      key: jdbc-uri
                      name: reconciler-db-app
                - name: SPRING_DATASOURCE_USERNAME
                  valueFrom:
                    secretKeyRef:
                      key: username
                      name: reconciler-db-app
                - name: SPRING_DATASOURCE_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      key: password
                      name: reconciler-db-app
                - name: BPL_JVM_THREAD_COUNT
                  value: "50"
                - name: JAVA_TOOL_OPTIONS
                  value: -XX:ReservedCodeCacheSize=64M
                - name: OTEL_EXPORTER_OTLP_ENDPOINT
                  value: http://alloy.adhar-system.svc.cluster.local:4318
                - name: OTEL_EXPORTER_OTLP_PROTOCOL
                  value: http/protobuf
                - name: OTEL_METRICS_EXPORTER
                  value: otlp
                - name: OTEL_RESOURCE_ATTRIBUTES
                  value: deployment.environment.name=dev,deployment.environment=dev,service.namespace=dev,k8s.namespace.name=dev,k8s.pod.name=$(POD_NAME),adhar.application=reconciler,adhar.batch.job=reconciler
                - name: OTEL_SERVICE_NAME
                  value: reconciler
                image: harbor-core.adhar-system.svc.cluster.local/library/reconciler:1.0.0
                name: batch
                resources:
                  limits:
                    memory: 1Gi
                  requests:
                    cpu: 500m
                    memory: 1Gi
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                    - ALL
                volumeMounts:
                - mountPath: /tmp
                  name: tmp
              enableServiceLinks: false
              imagePullSecrets:
              - name: harbor-dockercfg
              priorityClassName: adhar-batch-volcano
              restartPolicy: Never
              schedulerName: volcano
              securityContext:
                runAsNonRoot: true
                seccompProfile:
                  type: RuntimeDefault
              serviceAccountName: reconciler-batch
              terminationGracePeriodSeconds: 120
              volumes:
              - emptyDir:
                  sizeLimit: 1Gi
                name: tmp
        - minAvailable: 4
          name: worker
          replicas: 4
          template:
            metadata:
              annotations:
                adhar.io/batch-actor: ""
                cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
              labels:
                adhar.io/application: reconciler
                adhar.io/batch-job: reconciler
                adhar.io/batch-role: worker
                adhar.io/batch-trigger: manual
                adhar.io/component: app
                adhar.io/environment: dev
                adhar.io/organisation: acme
                adhar.io/plane: workload
                adhar.io/project: shop
                adhar.io/team: payments
                adhar.io/workload: batch
                app.kubernetes.io/name: reconciler
            spec:
              activeDeadlineSeconds: 21600
              containers:
              - env:
                - name: ADHAR_BATCH_JOB
                  value: reconcileJob
                - name: ADHAR_BATCH_NAME
                  value: reconciler
                - name: ADHAR_BATCH_ROLE
                  value: worker
                - name: ADHAR_BATCH_TRIGGER
                  value: manual
                - name: ADHAR_BATCH_PARAMS
                  value: '{}'
                - name: ADHAR_BATCH_TIME_ZONE
                  value: UTC
                - name: ADHAR_BATCH_REPOSITORY_SCHEMA
                  value: batch
                - name: ADHAR_BATCH_SHUTDOWN_TIMEOUT
                  value: 90s
                - name: ADHAR_BATCH_PARTITION_TRANSPORT
                  value: jdbc
                - name: ADHAR_BATCH_PARTITION_GRIDSIZE
                  value: "32"
                - name: ADHAR_BATCH_PARTITION_TIMEOUT
                  value: 21300s
                - name: ADHAR_BATCH_K8S_JOB
                  valueFrom:
                    fieldRef:
                      apiVersion: v1
                      fieldPath: metadata.labels['volcano.sh/job-name']
                - name: ADHAR_BATCH_ACTOR
                  valueFrom:
                    fieldRef:
                      apiVersion: v1
                      fieldPath: metadata.annotations['adhar.io/batch-actor']
                - name: POD_NAME
                  valueFrom:
                    fieldRef:
                      apiVersion: v1
                      fieldPath: metadata.name
                - name: POD_UID
                  valueFrom:
                    fieldRef:
                      apiVersion: v1
                      fieldPath: metadata.uid
                - name: NODE_NAME
                  valueFrom:
                    fieldRef:
                      apiVersion: v1
                      fieldPath: spec.nodeName
                - name: ADHAR_ENVIRONMENT
                  value: dev
                - name: SPRING_DATASOURCE_URL
                  valueFrom:
                    secretKeyRef:
                      key: jdbc-uri
                      name: reconciler-db-app
                - name: SPRING_DATASOURCE_USERNAME
                  valueFrom:
                    secretKeyRef:
                      key: username
                      name: reconciler-db-app
                - name: SPRING_DATASOURCE_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      key: password
                      name: reconciler-db-app
                - name: BPL_JVM_THREAD_COUNT
                  value: "50"
                - name: JAVA_TOOL_OPTIONS
                  value: -XX:ReservedCodeCacheSize=64M
                - name: OTEL_EXPORTER_OTLP_ENDPOINT
                  value: http://alloy.adhar-system.svc.cluster.local:4318
                - name: OTEL_EXPORTER_OTLP_PROTOCOL
                  value: http/protobuf
                - name: OTEL_METRICS_EXPORTER
                  value: otlp
                - name: OTEL_RESOURCE_ATTRIBUTES
                  value: deployment.environment.name=dev,deployment.environment=dev,service.namespace=dev,k8s.namespace.name=dev,k8s.pod.name=$(POD_NAME),adhar.application=reconciler,adhar.batch.job=reconciler
                - name: OTEL_SERVICE_NAME
                  value: reconciler
                image: harbor-core.adhar-system.svc.cluster.local/library/reconciler:1.0.0
                name: batch
                resources:
                  limits:
                    memory: 1536Mi
                  requests:
                    cpu: "1"
                    memory: 1536Mi
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                    - ALL
                volumeMounts:
                - mountPath: /tmp
                  name: tmp
              enableServiceLinks: false
              imagePullSecrets:
              - name: harbor-dockercfg
              priorityClassName: adhar-batch-volcano
              restartPolicy: Never
              schedulerName: volcano
              securityContext:
                runAsNonRoot: true
                seccompProfile:
                  type: RuntimeDefault
              serviceAccountName: reconciler-batch
              terminationGracePeriodSeconds: 120
              volumes:
              - emptyDir:
                  sizeLimit: 1Gi
                name: tmp
        ttlSecondsAfterFinished: 604800
  runner-role:
    apiVersion: rbac.authorization.k8s.io/v1
    kind: Role
    metadata:
      annotations:
        gotemplating.fn.crossplane.io/composition-resource-name: runner-role
        gotemplating.fn.crossplane.io/ready: "False"
      labels:
        adhar.io/application: reconciler
        adhar.io/batch-job: reconciler
        adhar.io/environment: dev
        adhar.io/organisation: acme
        adhar.io/plane: workload
        adhar.io/project: shop
        adhar.io/team: payments
        adhar.io/workload: batch
        app.kubernetes.io/name: reconciler
      name: reconciler-batch
      namespace: dev
    rules:
    - apiGroups:
      - batch
      - batch.volcano.sh
      resources:
      - jobs
      verbs:
      - get
    - apiGroups:
      - ""
      resources:
      - pods
      verbs:
      - get
  runner-rolebinding:
    apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata:
      annotations:
        gotemplating.fn.crossplane.io/composition-resource-name: runner-rolebinding
        gotemplating.fn.crossplane.io/ready: "False"
      labels:
        adhar.io/application: reconciler
        adhar.io/batch-job: reconciler
        adhar.io/environment: dev
        adhar.io/organisation: acme
        adhar.io/plane: workload
        adhar.io/project: shop
        adhar.io/team: payments
        adhar.io/workload: batch
        app.kubernetes.io/name: reconciler
      name: reconciler-batch
      namespace: dev
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: Role
      name: reconciler-batch
    subjects:
    - kind: ServiceAccount
      name: reconciler-batch
      namespace: dev
  runner-sa:
    apiVersion: v1
    kind: ServiceAccount
    metadata:
      annotations:
        gotemplating.fn.crossplane.io/composition-resource-name: runner-sa
        gotemplating.fn.crossplane.io/ready: "False"
      labels:
        adhar.io/application: reconciler
        adhar.io/batch-job: reconciler
        adhar.io/environment: dev
        adhar.io/organisation: acme
        adhar.io/plane: workload
        adhar.io/project: shop
        adhar.io/team: payments
        adhar.io/workload: batch
        app.kubernetes.io/name: reconciler
      name: reconciler-batch
      namespace: dev
conditions:
- message: PriorityClass adhar-batch-volcano exists; runs on Volcano queue acme-payments-dev
  reason: Met
  status: "True"
  target: Composite
  type: PrerequisitesReady
- message: creating ConfigMap reconciler-run
  reason: Creating
  status: Unknown
  target: Composite
  type: TemplateReady
- message: 'no schedule: this job runs when somebody starts it'
  reason: OnDemand
  status: "True"
  target: Composite
  type: ScheduleReady
- message: the schedule is not on hold
  reason: NotHeld
  status: "False"
  target: Composite
  type: Held
- message: runs on queue acme-payments-dev
  reason: Fits
  status: "True"
  target: Composite
  type: QueueFits
- message: no schedule
  reason: Settled
  status: "True"
  target: Composite
  type: SchedulerSwitch
- message: environment dev of project shop (team payments, organisation acme)
  reason: EnvironmentNamespace
  status: "True"
  target: Composite
  type: Placement
requirements:
  leafQueue:
    apiVersion: scheduling.volcano.sh/v1beta1
    kind: Queue
    matchName: acme-payments-dev
  namespace:
    apiVersion: v1
    kind: Namespace
    matchName: dev
  priorityClass:
    apiVersion: scheduling.k8s.io/v1
    kind: PriorityClass
    matchName: adhar-batch
  quota:
    apiVersion: v1
    kind: ResourceQuota
    matchName: dev-quota
    namespace: dev
  schedulerDescriptor:
    apiVersion: v1
    kind: ConfigMap
    matchName: adhar-batch-scheduler
    namespace: adhar-system
  volcanoCronJobCRD:
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    matchName: cronjobs.batch.volcano.sh
  volcanoJobCRD:
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    matchName: jobs.batch.volcano.sh
  volcanoPriorityClass:
    apiVersion: scheduling.k8s.io/v1
    kind: PriorityClass
    matchName: adhar-batch-volcano
  volcanoQueueCRD:
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    matchName: queues.scheduling.volcano.sh
status:
  activeRuns: []
  message: on demand
  queue: acme-payments-dev
  runTemplate: reconciler-run
  scheduler: volcano
