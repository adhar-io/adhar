  atProvider:
    manifest:
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata: {name: adhar-test-func-prod, namespace: adhar-system}
      status:
        sync: {status: Unknown}
        health: {status: Healthy}
        conditions:
          - type: ComparisonError
            message: "Failed to load target state: failed to generate manifest for source 1 of 1: rpc error: code = Unknown desc = unable to resolve 'stage/prod' to a commit SHA"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: test-func-stage-seed
  namespace: adhar-system
  annotations:
    crossplane.io/composition-resource-name: stage-seed
status:
