# Click-free single sign-on for the Argo CD UI.
#
# Argo CD authenticates natively against Keycloak, which means its own login
# page with a "LOG IN VIA KEYCLOAK" button. Keycloak's session makes the button
# silent, but the user still sees a login screen on an app they already signed in
# to — which is not single sign-on as anyone experiences it.
#
# Argo CD accepts an OIDC ID token as `Authorization: Bearer`, validating it
# against the same `argocd` client and applying its own RBAC from the token's
# groups. So the UI is fronted with an oauth2-proxy that holds the SHARED
# platform session cookie (security/keycloak/manifests/sso-cookie.yaml, scoped to
# the parent domain) and forwards that token. A user who signed in anywhere on
# the platform lands straight on the Argo CD dashboard; nothing trusts a
# spoofable identity header, because the bearer token is verified by Argo CD.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-oauth2-proxy
  namespace: adhar-system
spec:
  refreshPolicy: CreatedOnce
  refreshInterval: 30s
  secretStoreRef:
    name: keycloak
    kind: ClusterSecretStore
  target:
    name: argocd-oauth2-proxy
    # mergePolicy Merge: the two credential keys from `data` below stay as they
    # are and these literals are ADDED — no template references, because this
    # file is itself rendered by the controller as a Go template and the
    # embedded-foundation test rightly rejects any surviving directive.
    #
    # The same two settings as the --cookie-refresh / --cookie-expire args on
    # the Deployment below, ALSO as environment so that a platform whose
    # controller image predates the args still refreshes: this Secret is
    # created once and never rewritten (refreshPolicy CreatedOnce), so these
    # keys survive the controller's re-apply of the Deployment, which the args
    # do not. Flags win over env when both exist.
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        OAUTH2_PROXY_COOKIE_REFRESH: "2m"
        OAUTH2_PROXY_COOKIE_EXPIRE: "8h0m0s"
  data:
    - secretKey: OAUTH2_PROXY_CLIENT_SECRET
      remoteRef:
        key: keycloak-clients
        property: ARGOCD_CLIENT_SECRET
    # The platform-wide session cookie: the whole point of this proxy is that it
    # accepts the session another app established.
    - secretKey: OAUTH2_PROXY_COOKIE_SECRET
      remoteRef:
        key: adhar-sso-cookie
        property: COOKIE_SECRET
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-oauth2-proxy
  namespace: adhar-system
  labels:
    app.kubernetes.io/name: argocd-oauth2-proxy
    app.kubernetes.io/part-of: argocd
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: argocd-oauth2-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argocd-oauth2-proxy
    spec:
      enableServiceLinks: false
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1
          args:
            - --http-address=0.0.0.0:4180
            - --provider=oidc
            - --oidc-issuer-url=https://keycloak.{{ .Host }}{{ .PortSuffix }}/realms/adhar
            - --ssl-insecure-skip-verify=true
            - --client-id=argocd
            - --redirect-url=https://argocd.{{ .Host }}{{ .PortSuffix }}/oauth2/callback
            - --upstream=http://argo-cd-argocd-server.adhar-system.svc.cluster.local:80
            - --email-domain=*
            - --scope=openid profile email groups
            - --cookie-secure=true
            # Refresh the upstream tokens well before they expire. This proxy
            # forwards the ID token to Argo CD (--pass-authorization-header
            # below) and Argo CD verifies it on EVERY request, preferring it
            # over its own session cookie. A stale token therefore breaks the
            # UI even though the proxy's own session is perfectly valid.
            #
            # TWO MINUTES, because the `adhar` realm issues tokens that live
            # FIVE. This said 25m until 2026-10-05, sized against
            # "accessTokenLifespan 1800 s" — but that PUT in keycloak-config.yaml
            # targets the MASTER realm, which only the config Job itself logs
            # into. The `adhar` realm never set the field, so it keeps
            # Keycloak's 300 s default; measured on the live realm:
            #
            #   id_token exp - iat = 300
            #
            # So the forwarded token was dead for 20 of every 25 minutes. Argo CD
            # answered its own UI with 401, and oauth2-proxy turns a redirect
            # into a 403 for XHR callers, which the UI renders as the much-
            # reported "Something went wrong! Error: Forbidden". It also looked
            # like Keycloak coming up BROKE a working admin login: before the
            # realm exists this proxy cannot sign anyone in, so the operator is
            # on Argo CD's local admin session; the moment SSO engages the
            # forwarded-token path takes over and starts expiring.
            #
            # Keep this strictly below the realm's token lifespan — the invariant
            # TestArgoCDSSOProxyRefreshesTheTokenItForwards reads out of
            # keycloak-config.yaml rather than trusting a number in a comment.
            - --cookie-refresh=2m
            - --cookie-expire=8h0m0s
            # Parent-domain cookie + the shared secret = a session established by
            # any other app is accepted here without a round trip to Keycloak.
            - --cookie-name=_adhar_sso_argocd
            - --whitelist-domain=.{{ .Host }}{{ .PortSuffix }}
            - --skip-provider-button=true
            - --reverse-proxy=true
            # Fronting the UI must not take away the `argocd` CLI, its webhooks
            # or the health endpoint. The CLI speaks gRPC-web to
            # /<package>.<Name>Service/<Method> and carries its own Argo CD JWT,
            # and /api/v1/session is how it obtains one. These paths bypass the
            # proxy's session check (and get no injected bearer token); Argo CD
            # authenticates them itself exactly as it did before.
            - --skip-auth-route=^/healthz
            - --skip-auth-route=^/api/webhook
            # Anchored: an unanchored ^/api/v1/session also matched
            # /api/v1/session/userinfo, which the UI calls to learn who is
            # signed in — bypassing the proxy there made every page look
            # logged out. Only the CLI login endpoint itself is exempt.
            - --skip-auth-route=^/api/v1/session$
            - --skip-auth-route=^/[a-z]+\.[A-Za-z]+Service/
            # The ID token goes upstream as a bearer token: Argo CD verifies it
            # against the same client and applies its own RBAC, so the user never
            # sees its login page.
            #
            # It MUST be --pass-authorization-header. The similarly named
            # --set-authorization-header sets the header on the RESPONSE to the
            # browser (for nginx auth_request setups) and sends nothing upstream,
            # so Argo CD saw no token at all: the page loaded, every API call came
            # back unauthenticated, and the UI fell back to its own login screen.
            - --pass-authorization-header=true
            - --pass-access-token=true
            - --pass-user-headers=true
          envFrom:
            - secretRef:
                name: argocd-oauth2-proxy
          ports:
            - name: http
              containerPort: 4180
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
          readinessProbe:
            httpGet:
              path: /ping
              port: 4180
            initialDelaySeconds: 5
            timeoutSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: argocd-oauth2-proxy
  namespace: adhar-system
  labels:
    app.kubernetes.io/name: argocd-oauth2-proxy
spec:
  selector:
    app.kubernetes.io/name: argocd-oauth2-proxy
  ports:
    - name: http
      port: 4180
      targetPort: 4180
