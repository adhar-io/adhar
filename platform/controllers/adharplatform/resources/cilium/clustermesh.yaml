# CILIUM CLUSTER MESH — apiserver (opt-in, roadmap P2.4)
#
# Auto-extracted from the Cilium 1.20.0 Helm chart with
# `clustermesh.useAPIServer=true` (see hack/cilium/generate-clustermesh.sh). NOT part
# of the default embedded install.yaml on purpose: the management cluster runs
# mesh-ready identity (cluster adhar-mgmt / ID 1, SPIFFE trust domain adhar.io) out of
# the box, but the clustermesh-apiserver pod is only needed once you federate a second
# cluster — keeping it out of every local `adhar up` preserves the single-node
# footprint (ADR-0012).
#
# Apply on the MANAGEMENT cluster to accept peers, then
# `cilium clustermesh connect --context <mgmt> --destination-context <data-plane>`
# (the DataPlane controller's mesh phase automates this — ADR-0023 §2.2). Endpoint
# sync stays inert until a peer's config lands in the cilium-clustermesh secret.
# Service is ClusterIP; expose via the Gateway or a LoadBalancer in real fleets.
