# Gitea routed through the Cilium Gateway (adhar-gateway). TLS terminates at the
# Gateway (adhar-cert).
#
# Gitea's sub-path model is the OPPOSITE of ArgoCD's, and needs BOTH halves:
#   1. ROOT_URL=https://gitea.adhar.localtest.me:8443/ (install.yaml
#      gitea-inline-config) — this ONLY controls URL generation. It sets Gitea's
#      AppSubURL=/gitea so every emitted link, asset src, redirect, cookie path,
#      OAuth callback and clone URL is prefixed with /gitea.
#   2. This route STRIPS the /gitea prefix (URLRewrite ReplacePrefixMatch "/")
#      before forwarding — because Gitea still SERVES all of its HTTP handlers at
#      root, not under /gitea (unlike ArgoCD's server.rootpath which actually
#      mounts the app under the sub-path). This mirrors the canonical Gitea
#      reverse-proxy setup `proxy_pass http://gitea:3000/;` (trailing slash).
# So: browser requests /gitea/assets/x → Gateway strips → /assets/x → Gitea serves,
# and Gitea's HTML already points assets/links at /gitea/... via AppSubURL. Forward
# the prefix intact (no strip) and Gitea 404s (it has no routes under /gitea) — the
# page fails to load; strip without ROOT_URL and assets become root-relative and
# hit the "/" catch-all. Both pieces are required together.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gitea-server
  namespace: adhar-system
  labels:
    app.kubernetes.io/name: gitea
    app.kubernetes.io/instance: gitea
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: gitea
spec:
  parentRefs:
    - name: adhar-gateway
      namespace: adhar-system
  hostnames:
    - gitea.adhar.localtest.me
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: gitea-http
          port: 3000
---
# Gitea admin credential, consumed by:
#   * the controller's gitea admin password-sync flow (utils.GiteaAdminSecret),
#   * Backstage's `gitea-credentials` ExternalSecret via the `gitea`
#     ClusterSecretStore (remoteNamespace: adhar-system).
# Values mirror the break-glass admin defined in hack/gitea/values.yaml. When
# StaticPassword mode is enabled the controller rotates the password and patches
# this Secret in place.
apiVersion: v1
kind: Secret
metadata:
  name: gitea-credential
  namespace: adhar-system
  labels:
    app.kubernetes.io/name: gitea
    app.kubernetes.io/part-of: gitea
type: Opaque
stringData:
  username: gitea_admin
  password: r8sA8CPHD9!bt6d
---
# Ensures gitea-credential carries an admin API token (key `token`). The chart
# secret ships username/password only; consumers that need token auth
# (Lighthouse's oauth secret, the preview-environments PR generator) read the
# `token` key. Idempotent: exits immediately when the key already exists. The
# dev-password flow also (re)writes this key when rotating the password.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitea-token-gen
  namespace: adhar-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gitea-token-gen
  namespace: adhar-system
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitea-token-gen
  namespace: adhar-system
subjects:
  - kind: ServiceAccount
    name: gitea-token-gen
    namespace: adhar-system
roleRef:
  kind: Role
  name: gitea-token-gen
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: gitea-token-gen
  namespace: adhar-system
  labels:
    app.kubernetes.io/name: gitea
    app.kubernetes.io/part-of: gitea
spec:
  backoffLimit: 6
  template:
    spec:
      serviceAccountName: gitea-token-gen
      restartPolicy: OnFailure
      enableServiceLinks: false
      containers:
        - name: token-gen
          image: docker.io/library/ubuntu:22.04
          command: ["/bin/bash", "-c"]
          args:
            - |
              #!/bin/bash
              set -e -o pipefail
              apt -qq update && apt -qq install -y curl jq >/dev/null

              NS=adhar-system
              API=https://kubernetes.default.svc
              SA=/var/run/secrets/kubernetes.io/serviceaccount
              TOKEN=$(cat ${SA}/token)
              K8S=(curl -sS --cacert ${SA}/ca.crt -H "Authorization: Bearer ${TOKEN}")

              SECRET=$("${K8S[@]}" "${API}/api/v1/namespaces/${NS}/secrets/gitea-credential")
              if [ "$(echo "${SECRET}" | jq -r '.data.token // empty')" != "" ]; then
                echo "gitea-credential already carries a token; nothing to do"
                exit 0
              fi
              USER=$(echo "${SECRET}" | jq -r '.data.username' | base64 -d)
              PASS=$(echo "${SECRET}" | jq -r '.data.password' | base64 -d)

              GITEA=http://gitea-http.${NS}.svc.cluster.local:3000
              # Wait for the Gitea API (cold bootstrap ordering).
              for i in $(seq 1 60); do
                curl -sf "${GITEA}/api/healthz" >/dev/null && break
                sleep 5
              done

              NAME="adhar-platform-$(date -u +%s)"
              APITOKEN=$(curl -sS --fail-with-body -u "${USER}:${PASS}" \
                -H 'Content-Type: application/json' \
                -d "{\"name\": \"${NAME}\", \"scopes\": [\"all\"]}" \
                "${GITEA}/api/v1/users/${USER}/tokens" | jq -r '.sha1')
              [ -n "${APITOKEN}" ] && [ "${APITOKEN}" != "null" ]

              "${K8S[@]}" --fail-with-body -X PATCH \
                -H 'Content-Type: application/merge-patch+json' \
                -d "{\"stringData\": {\"token\": \"${APITOKEN}\"}}" \
                "${API}/api/v1/namespaces/${NS}/secrets/gitea-credential" >/dev/null
              echo "admin API token ${NAME} written to gitea-credential"
          # No dropped capabilities: apt needs setgroups during package
          # install (observed: "setgroups Operation not permitted" crashloop
          # with drop ALL). Same posture as the keycloak config job.
