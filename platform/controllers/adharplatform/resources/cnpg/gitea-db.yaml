# Gitea's database in HA mode: a CNPG-managed PostgreSQL cluster replaces the
# chart-bundled single-instance PostgreSQL (roadmap P1.2b, matches Keycloak's
# keycloak-db pattern). The operator creates services gitea-db-rw / gitea-db-ro
# and a PodDisruptionBudget for the instances automatically.
#
# Credentials intentionally match the gitea-inline-config database section
# (USER/PASSWD/NAME=gitea); bootstrap-credential rotation is roadmap P1.4.
apiVersion: v1
kind: Secret
metadata:
  name: gitea-db-credentials
  namespace: adhar-system
  labels:
    app.kubernetes.io/name: gitea-db
    adhar.io/component: gitea
type: kubernetes.io/basic-auth
stringData:
  username: gitea
  password: gitea
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: gitea-db
  namespace: adhar-system
  labels:
    app.kubernetes.io/name: gitea-db
    adhar.io/component: gitea
spec:
  instances: 2
  storage:
    size: 10Gi
  enableSuperuserAccess: false
  bootstrap:
    initdb:
      database: gitea
      owner: gitea
      secret:
        name: gitea-db-credentials
  # Scheduled base backups + WAL archiving to the platform object store
  # (roadmap P1.5). At bootstrap the minio package (GitOps phase) is not up
  # yet, so archiving logs warnings until it syncs, then self-heals; the
  # database itself is unaffected. Point at real object storage in cloud
  # environments.
  backup:
    retentionPolicy: 30d
    barmanObjectStore:
      destinationPath: s3://adhar-backups/cnpg/gitea-db
      endpointURL: http://minio.adhar-system.svc.cluster.local:9000
      s3Credentials:
        accessKeyId:
          name: root-creds
          key: rootUser
        secretAccessKey:
          name: root-creds
          key: rootPassword
---
# Daily base backup at 01:30 UTC; PITR between base backups via WAL archive.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: gitea-db-daily
  namespace: adhar-system
  labels:
    app.kubernetes.io/name: gitea-db
    adhar.io/component: gitea
spec:
  schedule: "0 30 1 * * *"
  backupOwnerReference: self
  cluster:
    name: gitea-db
