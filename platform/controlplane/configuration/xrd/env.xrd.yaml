---
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: environments.platform.adhar.io
spec:
  group: platform.adhar.io
  scope: Namespaced
  names:
    kind: Environment
    plural: environments
  defaultCompositionRef:
    name: environment-local
  versions:
  - name: v1alpha1
    served: true
    referenceable: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              parameters:
                type: object
                properties:
                  name:
                    type: string
                  tier:
                    type: string
                    enum:
                    - dev
                    - test
                    - prod
                    default: dev
                  cpuQuota:
                    type: string
                    default: '4'
                  memoryQuota:
                    type: string
                    default: 8Gi
                  podQuota:
                    type: integer
                    default: 20
                  enableNetworkPolicy:
                    type: boolean
                    default: true
                  labels:
                    type: object
                    additionalProperties:
                      type: string
                  organisation:
                    type: string
                    default: adhar
                    description: Owning organisation (label adhar.io/organisation).
                  team:
                    type: string
                    default: platform
                    description: Owning team; its Keycloak group `ws-team-<team>` is bound in this namespace with
                      the role in `access`.
                  project:
                    type: string
                    default: ''
                    description: Owning project (label adhar.io/project). Set by the project composition when it
                      composes this environment.
                  environment:
                    type: string
                    enum:
                    - dev
                    - test
                    - prod
                    description: Which of the three environments this is (label adhar.io/environment). Defaults
                      to `tier`.
                  access:
                    type: string
                    enum:
                    - admin
                    - edit
                    - view
                    default: admin
                    description: 'The owning team''s Kubernetes role here. Production is `view`: changes arrive
                      through a Release, not kubectl.'
                required:
                - name
            required:
            - parameters
          status:
            type: object
            properties:
              phase:
                type: string
              message:
                type: string
              ready:
                type: boolean
              namespace:
                type: string
              tier:
                type: string
              environment:
                type: string
