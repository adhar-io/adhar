apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: compositedatabases.platform.adhar.io
spec:
  group: platform.adhar.io
  scope: Namespaced
  names:
    kind: CompositeDatabase
    plural: compositedatabases
  # Local-safe default: an unqualified CompositeDatabase provisions an in-cluster
  # CloudNativePG Postgres (no cloud credentials needed). Pick a cloud provider by
  # setting spec.compositionSelector.matchLabels.provider to aws|gcp|azure.
  defaultCompositionRef:
    name: compositedatabase-local-cnpg
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - compositionSelector
                - parameters
              properties:
                compositionSelector:
                  type: object
                  properties:
                    matchLabels:
                      type: object
                      additionalProperties:
                        type: string
                  default:
                    matchLabels:
                      feature: database
                      # Default to the in-cluster provider so a bare request
                      # never selects a cloud composition that has no credentials.
                      provider: local
                providerConfigRef:
                  type: object
                  properties:
                    name:
                      type: string
                parameters:
                  type: object
                  required:
                    - engine
                    - engineVersion
                  properties:
                    displayName:
                      type: string
                      description: "Human-friendly name shown in the console (defaults to the resource name)."
                    engine:
                      type: string
                      description: "Database engine. The local (in-cluster) provider supports postgresql; mysql/mariadb/mongodb/redis/valkey require a cloud provider."
                      default: postgresql
                      enum:
                        - postgresql
                        - mysql
                        - mariadb
                        - mongodb
                        - redis
                        - valkey
                    engineVersion:
                      type: string
                      description: "Major engine version (e.g. \"16\" for postgresql). Optional for the local provider — defaults to 16."
                      default: "16"
                    instanceClass:
                      type: string
                      description: "Cloud only: compute size (e.g. db.t3.micro on AWS). Ignored by the local provider, which runs a single small CNPG instance."
                    storageSize:
                      type: string
                      description: "Persistent storage size (e.g. 10Gi). Local can be small (1Gi+); cloud providers enforce minimums (AWS RDS ≥ 20Gi)."
                      default: "10Gi"
                    storageType:
                      type: string
                      description: "Cloud only: block-storage class (AWS gp3 etc.). Ignored by the local provider."
                      enum:
                        - gp2
                        - gp3
                        - io1
                        - standard
                    region:
                      type: string
                      description: "Cloud only: provider region (e.g. us-west-2). Ignored by the local provider."
                    availabilityZones:
                      type: array
                      items:
                        type: string
                    multiAZ:
                      type: boolean
                      default: false
                    backupRetentionDays:
                      type: integer
                      minimum: 0
                      maximum: 35
                      default: 7
                    backupWindow:
                      type: string
                      description: "Preferred backup window (e.g., 02:00-03:00)"
                    maintenanceWindow:
                      type: string
                      description: "Preferred maintenance window (e.g., sun:05:00-sun:06:00)"
                    enableBackup:
                      type: boolean
                      default: true
                    enableEncryption:
                      type: boolean
                      default: true
                    kmsKeyId:
                      type: string
                    publiclyAccessible:
                      type: boolean
                      default: false
                    networkConfig:
                      type: object
                      properties:
                        vpcId:
                          type: string
                        subnetIds:
                          type: array
                          items:
                            type: string
                        securityGroupIds:
                          type: array
                          items:
                            type: string
                    credentials:
                      type: object
                      description: "Admin credentials. If omitted, the provider generates a password into the app's connection secret."
                      properties:
                        masterUsername:
                          type: string
                          description: "Admin/owner username for the database."
                          default: app
                        masterPasswordSecretRef:
                          type: object
                          properties:
                            name:
                              type: string
                            namespace:
                              type: string
                            key:
                              type: string
                    performanceInsights:
                      type: object
                      properties:
                        enabled:
                          type: boolean
                        retentionDays:
                          type: integer
                    monitoring:
                      type: object
                      properties:
                        enableEnhancedMonitoring:
                          type: boolean
                        monitoringInterval:
                          type: integer
                          enum: [0, 1, 5, 10, 15, 30, 60]
                    tags:
                      type: object
                      additionalProperties:
                        type: string
                    deletionPolicy:
                      type: string
                      enum:
                        - Delete
                        - Orphan
                      default: Delete
                    skipFinalSnapshot:
                      type: boolean
                      default: false
                writeConnectionSecretToRef:
                  type: object
                  properties:
                    namespace:
                      type: string
                      default: adhar-system
                    name:
                      type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                  description: "Overall phase (Pending, Creating, Available, Modifying, Failed)"
                message:
                  type: string
                ready:
                  type: boolean
                endpoint:
                  type: string
                port:
                  type: integer
                status:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
