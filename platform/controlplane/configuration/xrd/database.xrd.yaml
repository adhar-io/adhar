apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: databases.platform.adhar.io
spec:
  group: platform.adhar.io
  scope: Namespaced
  names:
    kind: Database
    plural: databases
  # Local-safe default: an unqualified Database provisions an in-cluster
  # CloudNativePG Postgres (no cloud credentials needed). Pick a cloud provider by
  # setting spec.compositionSelector.matchLabels.provider to aws|gcp|azure.
  defaultCompositionRef:
    name: database-local-cnpg
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - compositionSelector
                - parameters
              properties:
                compositionSelector:
                  type: object
                  properties:
                    matchLabels:
                      type: object
                      additionalProperties:
                        type: string
                  default:
                    matchLabels:
                      feature: database
                      # Default to the in-cluster provider so a bare request
                      # never selects a cloud composition that has no credentials.
                      provider: local
                providerConfigRef:
                  type: object
                  properties:
                    name:
                      type: string
                parameters:
                  type: object
                  required:
                    - engine
                    - engineVersion
                  properties:
                    displayName:
                      type: string
                      description: "Human-friendly name shown in the console (defaults to the resource name)."
                    engine:
                      type: string
                      description: "Database engine. The local (in-cluster) provider supports postgresql; mysql/mariadb/mongodb/redis/valkey require a cloud provider."
                      default: postgresql
                      enum:
                        - postgresql
                        - mysql
                        - mariadb
                        - mongodb
                        - redis
                        - valkey
                    engineVersion:
                      type: string
                      description: >-
                        Major engine version (e.g. "16" for postgresql). The CLOUD compositions
                        provision this version. The LOCAL (CNPG) one ignores it and lets the
                        operator pick its own default image, because the operator's default is
                        what every existing cluster is already running — deriving an image from
                        this field downgraded nine live databases from 18 to 16 in testing. Pin
                        `imageName` instead when a particular build is needed.
                      default: "16"
                    replicas:
                      type: integer
                      minimum: 0
                      maximum: 5
                      default: 0
                      description: "Read replicas alongside the primary. Honoured by the local valkey composition (Valkey CR `replicas`); 0 means a single node. This MUST stay declared here: an undeclared field is pruned by the structural schema, so the composition read it as 0 forever and a request for replicas was silently ignored."
                    instanceClass:
                      type: string
                      description: "Cloud only: compute size (e.g. db.t3.micro on AWS). Ignored by the local provider, which runs a single small CNPG instance."
                    # ── the in-cluster (CNPG) shape ──
                    # Added 2026-10-11, when the platform's own ten databases stopped
                    # declaring CNPG Clusters of their own and started asking for a
                    # Database. Everything here is additive and defaults to what the
                    # composition already did, so an existing request is unchanged.
                    databaseName:
                      type: string
                      description: >-
                        The database created at bootstrap. Defaults to `app`, which is what
                        CNPG's own convention produces and what the connection Secret says.
                      default: app
                    credentialsSecret:
                      type: string
                      description: >-
                        Name of an EXISTING Secret (keys `username` and `password`) to bootstrap
                        the owner role with, normally one an ExternalSecret in the same package
                        mints. Left empty, CNPG generates the credential itself and publishes it
                        as `<name>-app` — do NOT set this for a database whose consumers read
                        that generated Secret, because CNPG stops creating it.
                    postInitSQL:
                      type: array
                      items:
                        type: string
                      description: >-
                        SQL run once, against the new database, as its owner
                        (`postInitApplicationSQL`) — an extension to create, a role to alter.
                        It runs ONLY at bootstrap: adding a statement later does nothing to a
                        database that already exists.
                    imageName:
                      type: string
                      description: >-
                        Postgres image, overriding the one derived from engineVersion. Needed
                        when an extension only ships in a particular variant (pgvector is in
                        `-bookworm`).
                    superuserAccess:
                      type: boolean
                      default: false
                      description: >-
                        Let the `postgres` superuser log in with a password. CNPG 1.30 defaults
                        this off and blanks the password; leave it off unless something genuinely
                        needs it.
                    postgresqlParameters:
                      type: object
                      additionalProperties:
                        type: string
                      description: >-
                        postgresql.conf settings (e.g. shared_buffers, max_connections). Values
                        are strings because that is what Postgres reads; `128MB` and `100` are
                        both legal and neither is a number here.
                    priorityClassName:
                      type: string
                      default: adhar-node-bound
                      description: >-
                        Scheduling priority. The platform's stateful workloads use
                        `adhar-node-bound` so a database is not the thing evicted to make room
                        for a build.
                    resources:
                      type: object
                      description: >-
                        Per-instance compute. NOTHING is defaulted, deliberately: a request
                        added to a database that did not ask for one reserves capacity on a
                        cluster whose scheduling was already tight, and a memory limit below
                        what Postgres actually uses is an OOM kill rather than a cap. Set them
                        when you know the numbers.
                      properties:
                        cpu:
                          type: string
                        memory:
                          type: string
                        memoryLimit:
                          type: string
                    additionalDatabases:
                      type: array
                      description: >-
                        Extra logical databases in the same cluster, as CNPG `Database` objects.
                        A second database is much cheaper than a second cluster.
                      items:
                        type: object
                        required: [name]
                        properties:
                          name:
                            type: string
                          owner:
                            type: string
                            description: Defaults to the cluster's owner.
                    backupSchedule:
                      type: string
                      default: "0 30 1 * * *"
                      description: >-
                        Cron for the daily base backup, in CNPG's SIX-field form — the leading
                        field is SECONDS. A five-field cron is accepted and runs at the wrong
                        time of day.
                    backupBucket:
                      type: string
                      default: adhar-backups
                      description: Object-store bucket for base backups and WAL.
                    component:
                      type: string
                      description: >-
                        The platform component this database belongs to (label
                        `adhar.io/component`), so the console and the dashboards can group it
                        with the rest of that package.
                    organisation:
                      type: string
                      default: adhar
                    team:
                      type: string
                      default: platform
                    project:
                      type: string
                      default: ""
                    environment:
                      type: string
                      enum: [dev, test, prod]
                      default: dev
                    storageSize:
                      type: string
                      description: "Persistent storage size (e.g. 10Gi). Local can be small (1Gi+); cloud providers enforce minimums (AWS RDS ≥ 20Gi)."
                      default: "10Gi"
                    storageType:
                      type: string
                      description: "Cloud only: block-storage class (AWS gp3 etc.). Ignored by the local provider."
                      enum:
                        - gp2
                        - gp3
                        - io1
                        - standard
                    region:
                      type: string
                      description: "Cloud only: provider region (e.g. us-west-2). Ignored by the local provider."
                    availabilityZones:
                      type: array
                      items:
                        type: string
                    multiAZ:
                      type: boolean
                      default: false
                    backupRetentionDays:
                      type: integer
                      minimum: 0
                      maximum: 35
                      default: 7
                    backupWindow:
                      type: string
                      description: "Preferred backup window (e.g., 02:00-03:00)"
                    maintenanceWindow:
                      type: string
                      description: "Preferred maintenance window (e.g., sun:05:00-sun:06:00)"
                    enableBackup:
                      type: boolean
                      default: true
                    enableEncryption:
                      type: boolean
                      default: true
                    kmsKeyId:
                      type: string
                    publiclyAccessible:
                      type: boolean
                      default: false
                    networkConfig:
                      type: object
                      properties:
                        vpcId:
                          type: string
                        subnetIds:
                          type: array
                          items:
                            type: string
                        securityGroupIds:
                          type: array
                          items:
                            type: string
                    credentials:
                      type: object
                      description: "Admin credentials. If omitted, the provider generates a password into the app's connection secret."
                      properties:
                        masterUsername:
                          type: string
                          description: "Admin/owner username for the database."
                          default: app
                        masterPasswordSecretRef:
                          type: object
                          properties:
                            name:
                              type: string
                            namespace:
                              type: string
                            key:
                              type: string
                    performanceInsights:
                      type: object
                      properties:
                        enabled:
                          type: boolean
                        retentionDays:
                          type: integer
                    monitoring:
                      type: object
                      properties:
                        enableEnhancedMonitoring:
                          type: boolean
                        monitoringInterval:
                          type: integer
                          enum: [0, 1, 5, 10, 15, 30, 60]
                    tags:
                      type: object
                      additionalProperties:
                        type: string
                    deletionPolicy:
                      type: string
                      enum:
                        - Delete
                        - Orphan
                      default: Delete
                    skipFinalSnapshot:
                      type: boolean
                      default: false
                writeConnectionSecretToRef:
                  type: object
                  properties:
                    namespace:
                      type: string
                      default: adhar-system
                    name:
                      type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                  description: "Overall phase (Pending, Creating, Available, Modifying, Failed)"
                message:
                  type: string
                ready:
                  type: boolean
                endpoint:
                  type: string
                port:
                  type: integer
                status:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
