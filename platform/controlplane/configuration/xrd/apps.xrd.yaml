apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: compositeapplications.platform.adhar.io
spec:
  group: platform.adhar.io
  scope: Namespaced
  names:
    kind: CompositeApplication
    plural: compositeapplications
  defaultCompositionRef:
    name: compositeapplication-multienv
  versions:
  - name: v1alpha1
    served: true
    referenceable: true
    schema:
      openAPIV3Schema:
        type: object
        required:
        - spec
        properties:
          spec:
            type: object
            required:
            - compositionSelector
            - parameters
            properties:
              compositionSelector:
                type: object
                properties:
                  matchLabels:
                    type: object
                    additionalProperties:
                      type: string
                default:
                  matchLabels:
                    feature: apps
              providerConfigRef:
                type: object
                properties:
                  name:
                    type: string
              parameters:
                type: object
                required:
                - source
                - project
                properties:
                  displayName:
                    type: string
                  type:
                    type: string
                    description: >-
                      What kind of application this is. It decides how the platform runs it, not
                      only how it labels it. `service` (the default), `web`, `worker` and `data`
                      deploy as ordinary containers. `ai` deploys into an isolated microVM (Kata
                      Containers, RuntimeClass `kata-qemu-nvidia-gpu` when it asks for a GPU) with
                      GPU sharing, and gets an AgentWorkload for its namespace: resource quota,
                      network policy, and model and tool allow-lists on the AI gateway.
                    enum: [service, web, worker, data, ai]
                    default: service
                  ai:
                    type: object
                    description: Settings that apply only when `type` is `ai`. Ignored otherwise.
                    properties:
                      environment:
                        type: string
                        description: >-
                          The environment the AgentWorkload is created for. Its namespace is
                          `<application>-<environment>`, which also becomes the Application's
                          destination namespace.
                        enum: [dev, test, prod]
                        default: dev
                      isolation:
                        type: string
                        description: >-
                          `microvm` runs every pod in a Kata Containers microVM: its own kernel,
                          no shared host namespaces. `container` runs ordinary containers and is
                          the fallback for nodes without KVM.
                        enum: [microvm, container]
                        default: microvm
                      gpu:
                        type: object
                        properties:
                          count:
                            type: integer
                            description: GPUs (or GPU partitions) each pod may request. 0 means none.
                            default: 1
                            minimum: 0
                          sharing:
                            type: string
                            description: >-
                              How a physical GPU is shared. `mig` hands each pod a MIG partition,
                              which works inside a microVM (A100/H100-class cards). `timeslice`
                              shares a whole GPU between containers by time-slicing, which does
                              NOT work across microVMs — with `isolation: microvm` it is downgraded
                              to one GPU per pod and the policy report says so. `none` gives each pod
                              a whole GPU.
                            enum: [mig, timeslice, none]
                            default: mig
                      models:
                        type: array
                        description: Model names this application may call through the AI gateway. Empty means none.
                        items: {type: string}
                        default: []
                      tools:
                        type: array
                        description: MCP tools this application may call through the AI gateway. Empty means none.
                        items: {type: string}
                        default: []
                      budget:
                        type: object
                        properties:
                          tokensPerHour: {type: integer, default: 100000}
                          requestsPerMinute: {type: integer, default: 60}
                  project:
                    type: string
                    description: The CompositeProject this application belongs to. Its environments, AppProject
                      and Kargo project are read from that object; `default` means the platform project `adhar`.
                  description:
                    type: string
                  environments:
                    type: array
                    default:
                    - name: dev
                      autoSync: true
                      order: 0
                    - name: test
                      autoSync: false
                      order: 1
                    - name: prod
                      autoSync: false
                      order: 2
                    items:
                      type: object
                      required:
                      - name
                      properties:
                        name:
                          type: string
                          description: "Environment name (dev, test, prod, \u2026)."
                        namespace:
                          type: string
                          description: Target namespace (defaults to <app>-<env>).
                        autoSync:
                          type: boolean
                          default: false
                          description: Deploy automatically. Typically true only for dev; higher envs are promoted
                            into.
                        order:
                          type: integer
                          description: "Promotion order (0=first). Used to wire the Kargo dev\u2192test\u2192prod\
                            \ stage chain."
                    description: 'Optional subset/override of the project''s environments for this application (by
                      `name`). Omitted: every environment of the project. Namespaces always come from the project.'
                  source:
                    type: object
                    required:
                    - repoURL
                    properties:
                      repoURL:
                        type: string
                      path:
                        type: string
                      chart:
                        type: string
                      targetRevision:
                        type: string
                      helm:
                        type: object
                        properties:
                          releaseName:
                            type: string
                          valueFiles:
                            type: array
                            items:
                              type: string
                          values:
                            type: string
                      directory:
                        type: object
                        properties:
                          recurse:
                            type: boolean
                      kustomize:
                        type: object
                        properties:
                          images:
                            type: array
                            items:
                              type: string
                  destination:
                    type: object
                    properties:
                      server:
                        type: string
                      namespace:
                        type: string
                      clusterRef:
                        type: object
                        properties:
                          name:
                            type: string
                      clusterSelector:
                        type: object
                        properties:
                          matchLabels:
                            type: object
                            additionalProperties:
                              type: string
                  syncPolicy:
                    type: object
                    properties:
                      automated:
                        type: object
                        properties:
                          prune:
                            type: boolean
                          selfHeal:
                            type: boolean
                          allowEmpty:
                            type: boolean
                      retry:
                        type: object
                        properties:
                          limit:
                            type: integer
                      syncOptions:
                        type: array
                        items:
                          type: string
                  ignoreDifferences:
                    type: array
                    items:
                      type: object
                      properties:
                        kind:
                          type: string
                        name:
                          type: string
                        jsonPointers:
                          type: array
                          items:
                            type: string
                  image:
                    type: object
                    description: The image Kargo watches and promotes. Defaults to `<project.imageRegistry>/<application>`,
                      which is where the paved-road CI publishes.
                    properties:
                      repository:
                        type: string
                      selectionStrategy:
                        type: string
                        enum:
                        - NewestBuild
                        - SemVer
                        - Lexical
                        - Digest
                        default: NewestBuild
                        description: 'NewestBuild: CI tags images with the commit SHA, which has no order; Kargo
                          ranks by the image''s creation time.'
                  promotion:
                    type: object
                    description: How environments are chained. Defaults to the project's environment order with
                      the project's autoPromote flags.
                    properties:
                      enabled:
                        type: boolean
                        default: true
                        description: Create the Kargo Warehouse and Stages. Off for applications that are deployed
                          by something other than the paved road.
                      soakTime:
                        type: string
                        default: 0s
                        description: Minimum time freight must be healthy in an upstream environment before it may
                          be promoted (Kargo requiredSoakTime).
              writeConnectionSecretToRef:
                type: object
                properties:
                  namespace:
                    type: string
                    default: adhar-system
                  name:
                    type: string
          status:
            type: object
            properties:
              phase:
                type: string
                description: Overall phase of the application (Pending, Syncing, Healthy, Degraded, Failed)
              message:
                type: string
                description: Human-readable message describing current status
              healthStatus:
                type: string
                description: ArgoCD health status (Healthy, Progressing, Degraded, Suspended, Missing, Unknown)
              syncStatus:
                type: string
                description: ArgoCD sync status (Synced, OutOfSync, Unknown)
              lastSynced:
                type: string
                format: date-time
                description: Timestamp of last successful sync
              revision:
                type: string
                description: Git revision or chart version currently deployed
              operationState:
                type: object
                description: Details of the current or most recent sync operation
                properties:
                  phase:
                    type: string
                    description: Operation phase (Running, Succeeded, Failed, Error, Terminating)
                  message:
                    type: string
                  startedAt:
                    type: string
                    format: date-time
                  finishedAt:
                    type: string
                    format: date-time
              conditions:
                type: array
                description: Structured conditions from ArgoCD
                items:
                  type: object
                  properties:
                    type:
                      type: string
                      description: Condition type (e.g., InvalidSpec, ComparisonError, SyncError)
                    status:
                      type: string
                      description: Status of condition (True, False, Unknown)
                    reason:
                      type: string
                      description: Machine-readable reason for condition
                    message:
                      type: string
                      description: Human-readable message
                    lastTransitionTime:
                      type: string
                      format: date-time
              resources:
                type: array
                description: Summary of managed resources
                items:
                  type: object
                  properties:
                    group:
                      type: string
                    kind:
                      type: string
                    name:
                      type: string
                    namespace:
                      type: string
                    status:
                      type: string
                    health:
                      type: string
