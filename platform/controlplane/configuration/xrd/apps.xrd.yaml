apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: applications.platform.adhar.io
spec:
  group: platform.adhar.io
  scope: Namespaced
  names:
    kind: Application
    plural: applications
  defaultCompositionRef:
    name: application-multienv
  versions:
  - name: v1alpha1
    served: true
    referenceable: true
    schema:
      openAPIV3Schema:
        type: object
        required:
        - spec
        properties:
          spec:
            type: object
            required:
            - compositionSelector
            - parameters
            properties:
              compositionSelector:
                type: object
                properties:
                  matchLabels:
                    type: object
                    additionalProperties:
                      type: string
                default:
                  matchLabels:
                    feature: apps
              providerConfigRef:
                type: object
                properties:
                  name:
                    type: string
              parameters:
                type: object
                required:
                - source
                - project
                properties:
                  displayName:
                    type: string
                  type:
                    type: string
                    description: >-
                      What kind of application this is. It decides how the platform runs it, not
                      only how it labels it. `service` (the default), `web`, `worker` and `data`
                      deploy as ordinary containers. `ai` deploys into an isolated microVM (Kata
                      Containers, RuntimeClass `kata-qemu-nvidia-gpu` when it asks for a GPU) with
                      GPU sharing, and gets an AgentWorkload for its namespace: resource quota,
                      network policy, and model and tool allow-lists on the AI gateway.
                    enum: [service, web, worker, data, ai]
                    default: service
                  ai:
                    type: object
                    description: Settings that apply only when `type` is `ai`. Ignored otherwise.
                    properties:
                      environment:
                        type: string
                        description: >-
                          The environment the AgentWorkload is created for. Its namespace is
                          `<application>-<environment>`, which also becomes the Application's
                          destination namespace.
                        enum: [dev, test, prod]
                        default: dev
                      isolation:
                        type: string
                        description: >-
                          `microvm` runs every pod in a Kata Containers microVM: its own kernel,
                          no shared host namespaces. `container` runs ordinary containers and is
                          the fallback for nodes without KVM.
                        enum: [microvm, container]
                        default: microvm
                      gpu:
                        type: object
                        properties:
                          count:
                            type: integer
                            description: GPUs (or GPU partitions) each pod may request. 0 means none.
                            default: 1
                            minimum: 0
                          sharing:
                            type: string
                            description: >-
                              How a physical GPU is shared. `mig` hands each pod a MIG partition,
                              which works inside a microVM (A100/H100-class cards). `timeslice`
                              shares a whole GPU between containers by time-slicing, which does
                              NOT work across microVMs — with `isolation: microvm` it is downgraded
                              to one GPU per pod and the policy report says so. `none` gives each pod
                              a whole GPU.
                            enum: [mig, timeslice, none]
                            default: mig
                      models:
                        type: array
                        description: Model names this application may call through the AI gateway. Empty means none.
                        items: {type: string}
                        default: []
                      tools:
                        type: array
                        description: MCP tools this application may call through the AI gateway. Empty means none.
                        items: {type: string}
                        default: []
                      budget:
                        type: object
                        properties:
                          tokensPerHour: {type: integer, default: 100000}
                          requestsPerMinute: {type: integer, default: 60}
                  project:
                    type: string
                    description: The Project this application belongs to. Its environments, AppProject
                      and Kargo project are read from that object; `default` means the platform project `adhar`.
                  description:
                    type: string
                  environments:
                    type: array
                    description: >-
                      DEPRECATED and IGNORED. Environments belong to the Project and are shared by
                      every application in it: each application is deployed to, and promoted through,
                      all of the project's environments (default dev → test → prod) by the project's
                      shared Kargo Stages. Kept only so that existing Applications (which carry the old
                      default) stay valid; when it disagrees with the project, the
                      `ProjectEnvironments` condition reports that it was ignored.
                    items:
                      type: object
                      required:
                      - name
                      properties:
                        name:
                          type: string
                          description: "Environment name (dev, test, prod, \u2026). Ignored."
                        namespace:
                          type: string
                          description: Ignored; namespaces always come from the project.
                        autoSync:
                          type: boolean
                          description: Ignored; every environment is auto-synced and Kargo decides its revision.
                        order:
                          type: integer
                          description: Ignored; the project's environment order is the promotion order.
                  source:
                    type: object
                    required:
                    - repoURL
                    properties:
                      repoURL:
                        type: string
                      path:
                        type: string
                      chart:
                        type: string
                      targetRevision:
                        type: string
                      helm:
                        type: object
                        properties:
                          releaseName:
                            type: string
                          valueFiles:
                            type: array
                            items:
                              type: string
                          values:
                            type: string
                      directory:
                        type: object
                        properties:
                          recurse:
                            type: boolean
                      kustomize:
                        type: object
                        properties:
                          images:
                            type: array
                            items:
                              type: string
                  destination:
                    type: object
                    properties:
                      server:
                        type: string
                      namespace:
                        type: string
                      clusterRef:
                        type: object
                        properties:
                          name:
                            type: string
                      clusterSelector:
                        type: object
                        properties:
                          matchLabels:
                            type: object
                            additionalProperties:
                              type: string
                  syncPolicy:
                    type: object
                    properties:
                      automated:
                        type: object
                        properties:
                          prune:
                            type: boolean
                          selfHeal:
                            type: boolean
                          allowEmpty:
                            type: boolean
                      retry:
                        type: object
                        properties:
                          limit:
                            type: integer
                      syncOptions:
                        type: array
                        items:
                          type: string
                  ignoreDifferences:
                    type: array
                    items:
                      type: object
                      properties:
                        kind:
                          type: string
                        name:
                          type: string
                        jsonPointers:
                          type: array
                          items:
                            type: string
                  image:
                    type: object
                    description: The image Kargo watches and promotes. Defaults to `<project.imageRegistry>/<application>`,
                      which is where the paved-road CI publishes.
                    properties:
                      repository:
                        type: string
                      selectionStrategy:
                        type: string
                        enum:
                        - NewestBuild
                        - SemVer
                        - Lexical
                        - Digest
                        default: NewestBuild
                        description: 'NewestBuild: CI tags images with the commit SHA, which has no order; Kargo
                          ranks by the image''s creation time.'
                  promotion:
                    type: object
                    description: How environments are chained. Defaults to the project's environment order with
                      the project's autoPromote flags.
                    properties:
                      enabled:
                        type: boolean
                        default: true
                        description: Create the Kargo Warehouse and join the project's shared Stages. Off for
                          applications that are deployed by something other than the paved road.
                      soakTime:
                        type: string
                        default: 0s
                        description: Minimum time freight must be healthy in an upstream environment before it may
                          be promoted (Kargo requiredSoakTime).
                      verification:
                        type: object
                        description: This application's share of the Prometheus check each project Stage runs after a
                          promotion (the environment's AnalysisTemplate `<env>-health` carries one set of metrics per
                          application). Freight moves to the next environment only once verified — no Rollout
                          unhealthy, no pod unready, no restarts over the window, and the application's own
                          error-rate query when given. Set enabled to false to leave this application's metrics out.
                        properties:
                          enabled:
                            type: boolean
                            default: true
                          interval:
                            type: string
                            default: 60s
                            description: Time between samples.
                          count:
                            type: integer
                            default: 8
                            description: Samples that must pass (count × interval is the soak). The run must outlast
                              settleSeconds, or a release that never finishes is never seen to fail.
                          settleSeconds:
                            type: integer
                            default: 480
                            description: How long a release may legitimately be in flight. The Rollout check fails
                              only when Degraded or still not Healthy after this long, and the pod check only on a pod
                              still not ready once older than this — a canary walking its steps and a JVM booting are
                              not failures. Raise it for an application that boots slowly.
                          failureLimit:
                            type: integer
                            default: 1
                            description: Failed samples tolerated before the run fails.
                          errorRateQuery:
                            type: string
                            description: Optional PromQL returning the application's error ratio (0-1), e.g. over
                              http_server_requests_seconds_count. Write $NAMESPACE where the environment's
                              namespace goes; it is substituted per Stage. Compared against errorRateThreshold.
                          errorRateThreshold:
                            type: number
                            default: 0.01
              writeConnectionSecretToRef:
                type: object
                properties:
                  namespace:
                    type: string
                    default: adhar-system
                  name:
                    type: string
          status:
            type: object
            properties:
              environments:
                type: array
                description: The project environments this application runs in, with its Argo CD Application and
                  the project's shared Kargo Stage for each.
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    namespace:
                      type: string
                    argoApplication:
                      type: string
                    stage:
                      type: string
              delivery:
                type: object
                description: What the project's shared promotion chain needs to promote this application; written
                  by the Application composition and read by the Project composition.
                properties:
                  promote:
                    type: boolean
                  kargoProject:
                    type: string
                  warehouse:
                    type: string
                  image:
                    type: string
                  repoURL:
                    type: string
                  path:
                    type: string
                  targetRevision:
                    type: string
                  soakTime:
                    type: string
                  verification:
                    type: object
                    properties:
                      enabled:
                        type: boolean
                      interval:
                        type: string
                      count:
                        type: integer
                      settleSeconds:
                        type: integer
                      failureLimit:
                        type: integer
                      errorRateQuery:
                        type: string
                      errorRateThreshold:
                        type: number
              phase:
                type: string
                description: Overall phase of the application (Pending, Syncing, Healthy, Degraded, Failed)
              message:
                type: string
                description: Human-readable message describing current status
              healthStatus:
                type: string
                description: ArgoCD health status (Healthy, Progressing, Degraded, Suspended, Missing, Unknown)
              syncStatus:
                type: string
                description: ArgoCD sync status (Synced, OutOfSync, Unknown)
              lastSynced:
                type: string
                format: date-time
                description: Timestamp of last successful sync
              revision:
                type: string
                description: Git revision or chart version currently deployed
              operationState:
                type: object
                description: Details of the current or most recent sync operation
                properties:
                  phase:
                    type: string
                    description: Operation phase (Running, Succeeded, Failed, Error, Terminating)
                  message:
                    type: string
                  startedAt:
                    type: string
                    format: date-time
                  finishedAt:
                    type: string
                    format: date-time
              conditions:
                type: array
                description: Structured conditions from ArgoCD
                items:
                  type: object
                  properties:
                    type:
                      type: string
                      description: Condition type (e.g., InvalidSpec, ComparisonError, SyncError)
                    status:
                      type: string
                      description: Status of condition (True, False, Unknown)
                    reason:
                      type: string
                      description: Machine-readable reason for condition
                    message:
                      type: string
                      description: Human-readable message
                    lastTransitionTime:
                      type: string
                      format: date-time
              resources:
                type: array
                description: Summary of managed resources
                items:
                  type: object
                  properties:
                    group:
                      type: string
                    kind:
                      type: string
                    name:
                      type: string
                    namespace:
                      type: string
                    status:
                      type: string
                    health:
                      type: string
