---
# CompositeProject — the keystone of the Adhar ownership hierarchy:
#
#   Organisation ─owns─► Team ─owns─► Project ─holds─► Application(s)
#                                        │
#                                        ├─ Environment  (namespace + guardrails)
#                                        ├─ Repository    (Gitea repo, GitOps source)
#                                        ├─ GitOps project (ArgoCD AppProject)
#                                        └─ Monitoring     (auto — platform-common)
#
# Organisation and Team are catalog metadata (Backstage Groups). A Project is the
# first level that provisions real infrastructure, so it is a Crossplane XR: one
# CompositeProject fans out into a guard-railed namespace, an ArgoCD AppProject
# scoped to it, and (optionally) its own Gitea repository — all GitOps-managed.
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: compositeprojects.platform.adhar.io
spec:
  group: platform.adhar.io
  scope: Namespaced
  names:
    kind: CompositeProject
    plural: compositeprojects
  defaultCompositionRef:
    name: compositeproject-local
  versions:
  - name: v1alpha1
    served: true
    referenceable: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              parameters:
                type: object
                properties:
                  organisation:
                    type: string
                    description: Owning organisation (Backstage Group)
                  team:
                    type: string
                    description: Owning team (Backstage Group)
                  name:
                    type: string
                    description: "Project name \u2014 also the project namespace"
                  description:
                    type: string
                    default: ''
                    description: Shown in the AppProject and the Gitea repository.
                  tier:
                    type: string
                    enum:
                    - dev
                    - test
                    - prod
                    default: dev
                    description: Guardrail tier of the project HOME namespace (the Kargo project namespace). Environment
                      tiers are set per entry of `environments`.
                  cpuQuota:
                    type: string
                    default: '4'
                  memoryQuota:
                    type: string
                    default: 8Gi
                  podQuota:
                    type: integer
                    default: 30
                  createRepository:
                    type: boolean
                    description: Auto-create a Gitea repo for the project
                    default: true
                  environments:
                    type: array
                    description: "The project's environments, each composed as a CompositeEnvironment with its own\
                      \ namespace, quota, network boundary and team access. Default dev \u2192 test \u2192 prod.\
                      \ `namespace` defaults to `<project>-<name>`; the platform's own project pins `dev`/`test`/`prod`."
                    default:
                    - name: dev
                      tier: dev
                      autoPromote: true
                    - name: test
                      tier: test
                      autoPromote: true
                    - name: prod
                      tier: prod
                      autoPromote: false
                    items:
                      type: object
                      required:
                      - name
                      properties:
                        name:
                          type: string
                          enum:
                          - dev
                          - test
                          - prod
                        tier:
                          type: string
                          enum:
                          - dev
                          - test
                          - prod
                          description: Defaults to the name.
                        namespace:
                          type: string
                          description: Override the environment namespace (default `<project>-<name>`).
                          pattern: ^[a-z]([-a-z0-9]*[a-z0-9])?$
                        autoPromote:
                          type: boolean
                          description: Kargo promotes freight into this environment without a human (dev and test
                            by default; prod never).
                        access:
                          type: string
                          enum:
                          - admin
                          - edit
                          - view
                          description: "The owning team's Kubernetes role in this environment. Default: admin in\
                            \ dev/test, view in prod \u2014 production changes arrive through a Release."
                        cpuQuota:
                          type: string
                        memoryQuota:
                          type: string
                        podQuota:
                          type: integer
                  allowedSourceRepos:
                    type: array
                    items:
                      type: string
                    default: []
                    description: Extra Argo CD source repositories the project's AppProject admits, beyond the organisation's
                      own Gitea repositories.
                  imageRegistry:
                    type: string
                    default: harbor-core.adhar-system.svc.cluster.local/library
                    description: Registry path the project's application images are published under; Kargo watches
                      `<imageRegistry>/<application>`.
                required:
                - organisation
                - team
                - name
            required:
            - parameters
          status:
            type: object
            properties:
              namespace:
                type: string
              repository:
                type: string
              appProject:
                type: string
              phase:
                type: string
              environments:
                type: array
                description: 'Resolved environments: the single place applications and the paved-road Tasks look
                  up where an environment lives.'
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    namespace:
                      type: string
                    tier:
                      type: string
                    autoPromote:
                      type: boolean
              kargoProject:
                type: string
              organisation:
                type: string
              team:
                type: string
              ready:
                type: boolean
              message:
                type: string
              imageRegistry:
                type: string
    additionalPrinterColumns:
    - name: Organisation
      type: string
      jsonPath: .spec.parameters.organisation
    - name: Team
      type: string
      jsonPath: .spec.parameters.team
    - name: Namespace
      type: string
      jsonPath: .status.namespace
    - name: Phase
      type: string
      jsonPath: .status.phase
