---
# RBAC for Crossplane to compose LOCAL native resources. Crossplane's RBAC
# manager only grants access to XRD-defined + provider types by default; the
# local compositions (database→CNPG, redis→Deployment/Service, bucket→Job,
# kafka→Strimzi) emit native/operator resources, so Crossplane's service account
# needs permission to manage them. This ClusterRole aggregates into the
# `crossplane` ClusterRole via the aggregation label.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: crossplane-compose-local
  labels:
    rbac.crossplane.io/aggregate-to-crossplane: "true"
rules:
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters", "clusters/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "secrets", "configmaps", "persistentvolumeclaims", "namespaces", "resourcequotas", "limitranges", "serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # RoleBindings for composed workload identities (e.g. the secret-rotation SA).
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "bind"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # ADR-0026 concept hierarchy: a project owns a Kargo project (promotion
  # pipeline per application) and materialises its credentials with ESO; an
  # organisation and an environment bind their groups with RoleBindings.
  - apiGroups: ["kargo.akuity.io"]
    resources: ["projects", "projectconfigs", "warehouses", "stages", "promotions"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Kargo's admission webhook lets a Promotion be CREATED only by a subject that
  # may `promote` to its Stage (a Kargo-specific verb); a Release is
  # created by the provider, so the provider needs it.
  - apiGroups: ["kargo.akuity.io"]
    resources: ["stages"]
    verbs: ["promote"]
  - apiGroups: ["external-secrets.io"]
    resources: ["externalsecrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["argoproj.io"]
    resources: ["applications", "appprojects"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["kafka.strimzi.io"]
    resources: ["kafkas", "kafkas/status", "kafkatopics", "kafkanodepools"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Valkey (Hyperspike valkey-operator) — the local `engine: valkey` composition
  # composes a Valkey CR, so Crossplane needs to manage them.
  - apiGroups: ["hyperspike.io"]
    resources: ["valkeys", "valkeys/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # ServiceMonitor/PodMonitor so compositions can wire their own observability
  # (e.g. the Redis exporter ServiceMonitor) into kube-prometheus. PrometheusRule
  # so an AgentWorkload can alert on its own declared budget.
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["servicemonitors", "podmonitors", "prometheusrules"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # LimitRange was never granted, so a composition that emits one fails at
  # apply with a 403 that the XR reports as a generic sync error.
  - apiGroups: [""]
    resources: ["limitranges"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # An AgentWorkload composes the gateway policy that is its identity's ONLY
  # grant (compositions/agent/kubernetes.yaml): which models it may name and
  # which MCP targets it may call. Without this the agent exists but can reach
  # nothing, which is the intended default but not a useful end state.
  - apiGroups: ["agentgateway.dev"]
    resources: ["agentgatewaypolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Search (compositions/search) composes an OpenSearchCluster and the
  # users, roles, index-lifecycle and snapshot policies around it, run by the
  # opensearch-k8s-operator in data/opensearch; Vector
  # (compositions/vector) composes a collections Job and the ESO Password
  # generators both use to mint credentials.
  - apiGroups: ["opensearch.org"]
    resources: ["opensearchactiongroups", "opensearchclusters", "opensearchcomponenttemplates", "opensearchindextemplates", "opensearchismpolicies", "opensearchroles", "opensearchsnapshotpolicies", "opensearchtenants", "opensearchuserrolebindings", "opensearchusers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["generators.external-secrets.io"]
    resources: ["passwords"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # The Qdrant chart (provider-helm, same ClusterRole) emits a
  # PodDisruptionBudget when a Vector asks for more than one replica.
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
# Cluster-wide role the composed `secret-rotation` ServiceAccount is bound to by
# the secretrotation-local composition, so rotation Jobs can update the
# target Secret's value in their namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: adhar-secret-rotator
  labels:
    app.kubernetes.io/managed-by: adhar
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "patch", "update"]
