---
# Local Application composition — turns a CompositeApplication into an ArgoCD
# Application (GitOps deploy). Same XRD as cloud; developers describe source +
# destination and the control plane wires the GitOps deployment.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: compositeapplication-local-argocd
  labels:
    feature: application
    provider: local
spec:
  compositeTypeRef:
    apiVersion: platform.adhar.io/v1alpha1
    kind: CompositeApplication
  mode: Pipeline
  pipeline:
    - step: render
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $xr := .observed.composite.resource -}}
            {{- $name := $xr.metadata.name -}}
            {{- $ns := $xr.metadata.namespace -}}
            {{- $p := dig "spec" "parameters" dict $xr -}}
            {{- $src := dig "source" dict $p -}}
            {{- $dst := dig "destination" dict $p -}}
            ---
            # ArgoCD watches adhar-system for Application objects.
            apiVersion: argoproj.io/v1alpha1
            kind: Application
            metadata:
              name: {{ $name }}
              namespace: adhar-system
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: argocd-app
              labels:
                platform.adhar.io/self-service: "true"
            spec:
              project: {{ dig "project" "default" $p | quote }}
              source:
                repoURL: {{ dig "repoURL" "" $src | quote }}
                {{- /*
                  A HELM source and a GIT source are mutually exclusive in an Argo CD
                  Application, and the difference is `chart` vs `path`. This block used
                  to emit `path` unconditionally with a default of ".", so a Helm
                  request (the `microservice` template: repoURL
                  https://charts.bitnami.com/bitnami, chart nginx) produced an
                  Application with a chart REPOSITORY as its repoURL and no chart at
                  all. Argo CD then tried to clone it as Git and parked the app at
                  Unknown with
                      failed to list refs: empty input
                  — so the template could never sync, and nothing in that message
                  points at the missing field.
                */}}
                {{- if dig "chart" "" $src }}
                chart: {{ dig "chart" "" $src | quote }}
                targetRevision: {{ dig "targetRevision" "*" $src | quote }}
                {{- if dig "helm" dict $src }}
                helm:
                  {{- range $k, $v := dig "helm" dict $src }}
                  {{ $k }}: {{ $v | toYaml | nindent 20 }}
                  {{- end }}
                {{- end }}
                {{- else }}
                path: {{ dig "path" "." $src | quote }}
                targetRevision: {{ dig "targetRevision" "HEAD" $src | quote }}
                {{- end }}
              destination:
                server: {{ dig "server" "https://kubernetes.default.svc" $dst | quote }}
                namespace: {{ dig "namespace" $ns $dst | quote }}
              syncPolicy:
                automated:
                  prune: true
                  selfHeal: true
                syncOptions:
                  - CreateNamespace=true
    - step: ready
      functionRef:
        name: function-auto-ready
