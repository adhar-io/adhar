              {"id":2,"type":"stat","title":"Rollout","description":"Argo Rollouts phase of the application in this environment: Healthy, Progressing (a new version rolling out), Paused (a canary step waiting) or Degraded.","gridPos":{"h":4,"w":3,"x":0,"y":1},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"datasource":{"type":"prometheus","uid":"prometheus"},"refId":"A","expr":"(max(rollout_info{namespace=\"$env\",name=\"__APP__\",phase=~\"Healthy|Completed\"}) * 1) or (max(rollout_info{namespace=\"$env\",name=\"__APP__\",phase=\"Progressing\"}) * 2) or (max(rollout_info{namespace=\"$env\",name=\"__APP__\",phase=\"Paused\"}) * 3) or (max(rollout_info{namespace=\"$env\",name=\"__APP__\",phase=\"Degraded\"}) * 4) or ((max(kube_deployment_status_replicas_available{namespace=\"$env\",deployment=\"__APP__\"}) >= 0) * 0 + 5)","legendFormat":"__auto","instant":true,"range":false}],"fieldConfig":{"defaults":{"unit":"short","decimals":0,"noValue":"No Rollout","thresholds":{"mode":"absolute","steps":[{"color":"#5794F2","value":null}]},"color":{"mode":"thresholds"},"mappings":[{"type":"value","options":{"1":{"text":"Healthy","color":"green","index":0},"2":{"text":"Progressing","color":"#5794F2","index":1},"3":{"text":"Paused (canary step)","color":"#EAB839","index":2},"4":{"text":"Degraded","color":"red","index":3},"5":{"text":"Deployment","color":"#5794F2","index":4}}}]},"overrides":[]},"options":{"reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"colorMode":"background","graphMode":"none","textMode":"value","justifyMode":"center","orientation":"auto","wideLayout":true,"showPercentChange":false}},
              {"id":3,"type":"stat","title":"Argo CD","description":"Health and sync of the Argo CD Application __ARGO_APP__<env>.","gridPos":{"h":4,"w":3,"x":3,"y":1},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"datasource":{"type":"prometheus","uid":"prometheus"},"refId":"A","expr":"((max(argocd_app_info{name=\"__ARGO_APP__${env:text}\",health_status=\"Healthy\"}) * 1) or (max(argocd_app_info{name=\"__ARGO_APP__${env:text}\",health_status=\"Progressing\"}) * 2) or (max(argocd_app_info{name=\"__ARGO_APP__${env:text}\",health_status=~\"Suspended|Missing|Unknown\"}) * 3) or (max(argocd_app_info{name=\"__ARGO_APP__${env:text}\",health_status=\"Degraded\"}) * 4)) + ((max(argocd_app_info{name=\"__ARGO_APP__${env:text}\",sync_status=\"OutOfSync\"}) * 10) or vector(0))","legendFormat":"__auto","instant":true,"range":false}],"fieldConfig":{"defaults":{"unit":"short","decimals":0,"noValue":"No Argo CD app","thresholds":{"mode":"absolute","steps":[{"color":"#5794F2","value":null}]},"color":{"mode":"thresholds"},"mappings":[{"type":"value","options":{"1":{"text":"Healthy · Synced","color":"green","index":0},"11":{"text":"Healthy · OutOfSync","color":"#EAB839","index":1},"2":{"text":"Progressing","color":"#5794F2","index":2},"12":{"text":"Progressing · OutOfSync","color":"#5794F2","index":3},"3":{"text":"Missing / Unknown","color":"#EAB839","index":4},"13":{"text":"Missing · OutOfSync","color":"#EAB839","index":5},"4":{"text":"Degraded","color":"red","index":6},"14":{"text":"Degraded · OutOfSync","color":"red","index":7}}}]},"overrides":[]},"options":{"reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"colorMode":"background","graphMode":"none","textMode":"value","justifyMode":"center","orientation":"auto","wideLayout":true,"showPercentChange":false}},
              {"id":4,"type":"stat","title":"Pods Ready","description":"Ready pods over desired replicas. Below 100% = pods failing readiness or not scheduled.","gridPos":{"h":4,"w":3,"x":6,"y":1},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"datasource":{"type":"prometheus","uid":"prometheus"},"refId":"A","expr":"sum(kube_pod_status_ready{namespace=\"$env\",pod=~\"$pod\",condition=\"true\"}) / clamp_min(max(rollout_info_replicas_desired{namespace=\"$env\",name=\"__APP__\"}) or max(kube_deployment_spec_replicas{namespace=\"$env\",deployment=\"__APP__\"}), 1)","legendFormat":"__auto","instant":true,"range":false}],"fieldConfig":{"defaults":{"unit":"percentunit","decimals":0,"noValue":"No pods","thresholds":{"mode":"absolute","steps":[{"color":"red","value":null},{"color":"#EAB839","value":0.5},{"color":"green","value":1}]},"color":{"mode":"thresholds"},"mappings":[]},"overrides":[]},"options":{"reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"colorMode":"background","graphMode":"none","textMode":"value","justifyMode":"center","orientation":"auto","wideLayout":true,"showPercentChange":false}},
