apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: application-multienv
  labels:
    feature: apps
    topology: multi-env
spec:
  compositeTypeRef:
    apiVersion: platform.adhar.io/v1alpha1
    kind: Application
  mode: Pipeline
  pipeline:
    - step: render-environments
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- /* A deployable inside a PROJECT (ADR-0026).
                   Organisation → Team → Project → APPLICATION → Environment → Release

                   The application never decides where an environment lives: it
                   OBSERVES its Project (an observe-only provider-kubernetes
                   Object — managementPolicies: [Observe]) and reads
                   status.environments[] from it. Until the project has published
                   that list, this renders only the observation and reports Pending.

                   Per environment OF THE PROJECT it then emits an Argo CD Application
                   `<project>-<app>-<env>` in the project's AppProject, deploying
                   `<path>/envs/<env>` into the environment's namespace — every
                   environment is Git-driven, so every one is auto-synced; WHICH revision
                   an environment runs is Kargo's call. Plus one Kargo Warehouse `<app>`
                   watching the application's image repository.

                   Environments are the PROJECT's, shared by every application in it:
                   there is no per-application environment list any more, and no
                   per-application Kargo Stage. The promotion chain is the project's —
                   one Stage per project environment (`dev` → `test` → `prod`), composed
                   by the Project (compositions/project/local.yaml), requesting freight
                   from every application's Warehouse. This composition publishes what
                   that chain needs to promote THIS application on status.delivery
                   (image, repository, overlay path, branch, soak, verification), and
                   the Project reads it back. Each Argo CD Application therefore names
                   the shared Stage `<project>:<env>` as the one Kargo may update it.

                   MIGRATION (2026-10): applications composed before this change owned
                   Stages `<app>-<env>` and AnalysisTemplates `<app>-<env>-health` in the
                   Kargo project namespace. They are no longer rendered, so Crossplane
                   garbage-collects the Objects and with them the Stages; the project's
                   shared Stages replace them. Nothing carries over and nothing needs to:
                   Freight belongs to the Warehouse (kept, same name), the deployed
                   digest is in Git, and the new `dev` Stage auto-promotes the newest
                   freight again — a no-op commit that re-verifies it — after which test
                   follows on its own. Only prod needs a fresh Release, against Stage
                   `<env>` instead of `<app>-<env>`. `spec.parameters.environments` is
                   kept in the schema so existing XRs stay valid, but it is IGNORED; the
                   ProjectEnvironments condition says so when it disagrees with the
                   project.
                   Kargo expressions are `${{ … }}`; `{{` starts a Go template action,
                   so they are spelled through $ex below. */ -}}
            {{- $xr := .observed.composite.resource -}}
            {{- $params := default (dict) $xr.spec.parameters -}}
            {{- $name := $xr.metadata.name -}}
            {{- $xrns := $xr.metadata.namespace -}}
            {{- $source := default (dict) $params.source -}}
            {{- $repoURL := get $source "repoURL" -}}
            {{- if not $repoURL }}{{ fail "source.repoURL must be provided" }}{{ end -}}
            {{- /* The platform's own Gitea is addressed IN-CLUSTER. The Argo CD
                   AppProject allow-list and the Kargo git credential the Project
                   composes are both written for gitea-http.adhar-system, while the
                   console and CLI hand us the repository's PUBLIC clone URL
                   (https://gitea.<domain>/<org>/<repo>.git) — a form that differs
                   per installation and that nothing in-cluster needs. Left as-is,
                   Argo CD refused the repo ("not permitted in project") and Kargo
                   could not push ("could not read Username") on every app
                   (2026-10-17). Repositories hosted elsewhere pass through unchanged. */ -}}
            {{- $giteaHost := "gitea-http.adhar-system.svc.cluster.local:3000" -}}
            {{- if regexMatch "^https?://gitea\\.[^/]+/" $repoURL -}}
            {{-   $repoURL = regexReplaceAll "^https?://gitea\\.[^/]+/" $repoURL (printf "http://%s/" $giteaHost) -}}
            {{- end -}}
            {{- $path := default "deploy" (get $source "path") -}}
            {{- $revision := default "main" (get $source "targetRevision") -}}
            {{- $project := default "adhar" $params.project -}}
            {{- if eq $project "default" }}{{ $project = "adhar" }}{{ end -}}
            {{- $promo := default (dict) $params.promotion -}}
            {{- $promote := ternary (get $promo "enabled") true (hasKey $promo "enabled") -}}
            {{- $soak := default "0s" (get $promo "soakTime") -}}
            {{- $verifyCfg := default (dict) (get $promo "verification") -}}
            {{- $verify := ternary (get $verifyCfg "enabled") true (hasKey $verifyCfg "enabled") -}}
            {{- $vInterval := default "60s" (get $verifyCfg "interval") -}}
            {{- $vCount := default 8 (get $verifyCfg "count") -}}
            {{- $vSettle := default 480 (get $verifyCfg "settleSeconds") -}}
            {{- $vFail := default 1 (get $verifyCfg "failureLimit") -}}
            {{- $errQuery := default "" (get $verifyCfg "errorRateQuery") -}}
            {{- $errThreshold := default 0.01 (get $verifyCfg "errorRateThreshold") -}}
            {{- $imageCfg := default (dict) $params.image -}}
            {{- $strategy := default "NewestBuild" (get $imageCfg "selectionStrategy") -}}
            {{- $providerConfig := dig "spec" "providerConfigRef" "name" "kubernetes-provider" $xr -}}
            {{- $observed := default (dict) .observed.resources -}}
            {{- $projObj := dig "project" "resource" dict $observed -}}
            {{- $projStatus := dig "status" "atProvider" "manifest" "status" dict $projObj -}}
            {{- $projEnvs := dig "environments" (list) $projStatus -}}
            {{- $registry := dig "imageRegistry" "harbor-core.adhar-system.svc.cluster.local/library" $projStatus -}}
            {{- $image := default (printf "%s/%s" $registry $name) (get $imageCfg "repository") -}}
            {{- /* Every application runs in EVERY environment of its project: the
                   project's chain promotes all of them together, so an application
                   that skipped `test` would never reach `prod`. The retired per-app
                   `environments` list is read only to report that it is ignored. */ -}}
            {{- $envs := $projEnvs -}}
            {{- $projEnvNames := list -}}
            {{- range $projEnvs }}{{ $projEnvNames = append $projEnvNames .name }}{{ end -}}
            {{- $wanted := list -}}
            {{- range (default (list) $params.environments) }}{{ $wanted = append $wanted .name }}{{ end -}}
            {{- $ignored := list -}}
            {{- range $wanted }}{{ if not (has . $projEnvNames) }}{{ $ignored = append $ignored . }}{{ end }}{{ end -}}
            {{- $notListed := list -}}
            {{- if $wanted }}{{ range $projEnvNames }}{{ if not (has . $wanted) }}{{ $notListed = append $notListed . }}{{ end }}{{ end }}{{ end -}}
            {{- $ex := "${{" -}}
            {{- $ready := 0 -}}
            {{- $labels := dict "adhar.io/organisation" (dig "organisation" "adhar" $projStatus) "adhar.io/team" (dig "team" "platform" $projStatus) "adhar.io/project" $project "adhar.io/application" $name -}}
            {{- /* The application type, on every environment's Application and on its namespace,
                   where the ai-workload-isolation policy reads it. See compositions/apps/local.yaml
                   for the full account; here every environment gets the same labels. */ -}}
            {{- $type := default "service" $params.type -}}
            {{- $ai := default (dict) $params.ai -}}
            {{- $_ := set $labels "platform.adhar.io/application-type" $type -}}
            {{- $nsLabels := dict "platform.adhar.io/application-type" $type -}}
            {{- if eq $type "ai" -}}
            {{- $_ := set $nsLabels "platform.adhar.io/isolation" (default "microvm" (get $ai "isolation")) -}}
            {{- $_ := set $nsLabels "platform.adhar.io/gpu-sharing" (dig "gpu" "sharing" "mig" $ai) -}}
            {{- $_ := set $nsLabels "platform.adhar.io/gpu-count" (toString (dig "gpu" "count" 1 $ai)) -}}
            {{- end -}}
            ---
            # Observe the project (read-only): where do its environments live?
            apiVersion: kubernetes.m.crossplane.io/v1alpha1
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: project
            spec:
              managementPolicies: ["Observe"]
              providerConfigRef: {name: {{ quote $providerConfig }}, kind: ClusterProviderConfig}
              forProvider:
                manifest:
                  apiVersion: platform.adhar.io/v1alpha1
                  kind: Project
                  metadata:
                    name: {{ quote $project }}
                    namespace: {{ quote $xrns }}
            {{- /* Nothing below can render until the Project has been observed and has
                   reported its environments: on the first pass $envs is empty, and the
                   dashboard indexing the first environment used to fail the WHOLE pipeline, so the
                   Project was never composed and the XR stayed unsynced for ever. */ -}}
            {{- if $envs }}
            ---
            # One Grafana dashboard per application, in the "Applications" folder:
            # the Rollout's phase and readiness, restarts, CPU and memory of its
            # pods, and HTTP traffic when the service publishes Micrometer
            # metrics (Spring, through the platform's kube-prometheus scrape).
            # Switch environments with the dashboard's `env` variable (its value is
            # the project environment's namespace). Grafana's
            # sidecar picks up any ConfigMap labelled grafana_dashboard=1 in this
            # namespace, so composing the ConfigMap is all that is needed.
            apiVersion: kubernetes.m.crossplane.io/v1alpha1
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: dashboard
                gotemplating.fn.crossplane.io/ready: "True"
              labels: {feature: apps, managed-by: adhar}
            spec:
              providerConfigRef: {name: {{ quote $providerConfig }}, kind: ClusterProviderConfig}
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: ConfigMap
                  metadata:
                    name: {{ quote (printf "app-dashboard-%s" $name) }}
                    namespace: adhar-system
                    labels:
                      grafana_dashboard: "1"
                      {{- range $k, $v := $labels }}
                      {{ $k }}: {{ $v | quote }}
                      {{- end }}
                    annotations:
                      grafana_folder: Applications
                  data:
                    {{ printf "%s.json" $name }}: |
                      {{- $podRe := printf "%s-[a-z0-9]+-[a-z0-9]+" $name -}}
                      {{- /* `$env` is the environment's NAMESPACE, labelled with its name:
                             the project decides where an environment lives (`<project>-<env>`,
                             or `dev`/`test`/`prod` for the platform's own `adhar` project), so
                             a query on namespace="dev" found nothing for every other project.
                             Grafana's custom variable spells a labelled value `text : value`. */ -}}
                      {{- $envNames := list -}}
                      {{- $envPairs := list -}}
                      {{- range $envs }}{{ $envNames = append $envNames .name }}{{ $envPairs = append $envPairs (printf "%s : %s" .name .namespace) }}{{ end -}}
                      {{- $envCSV := join "," $envPairs -}}
                      {{- $firstEnv := index $envs 0 }}
                      {
                        "uid": {{ printf "app-%s" $name | quote }},
                        "title": {{ printf "%s · application" $name | quote }},
                        "tags": ["adhar", "application", {{ quote $name }}],
                        "editable": false,
                        "schemaVersion": 39,
                        "time": {"from": "now-1h", "to": "now"},
                        "refresh": "30s",
                        "templating": {"list": [
                          {"name": "env", "label": "Environment", "type": "custom", "query": {{ quote $envCSV }},
                           "current": {"text": {{ quote $firstEnv.name }}, "value": {{ quote $firstEnv.namespace }}},
                           "options": [{{- range $i, $e := $envs }}{{ if $i }},{{ end }}{"text": {{ quote $e.name }}, "value": {{ quote $e.namespace }}, "selected": {{ eq $i 0 }}}{{- end }}]}
                        ]},
                        "panels": [
                          {"id": 1, "type": "stat", "title": "Rollout phase", "gridPos": {"x": 0, "y": 0, "w": 6, "h": 4},
                           "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "/^phase$/"}, "textMode": "name"},
                           "targets": [{"refId": "A", "expr": {{ printf "rollout_info{namespace=\"$env\",name=\"%s\"} == 1" $name | quote }}, "format": "table", "instant": true}]},
                          {"id": 2, "type": "stat", "title": "Ready pods", "gridPos": {"x": 6, "y": 0, "w": 6, "h": 4},
                           "targets": [{"refId": "A", "expr": {{ printf "sum(kube_pod_status_ready{namespace=\"$env\",pod=~\"%s\",condition=\"true\"}) or vector(0)" $podRe | quote }}}]},
                          {"id": 3, "type": "stat", "title": "Restarts (1h)", "gridPos": {"x": 12, "y": 0, "w": 6, "h": 4},
                           "fieldConfig": {"defaults": {"thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}}},
                           "targets": [{"refId": "A", "expr": {{ printf "sum(increase(kube_pod_container_status_restarts_total{namespace=\"$env\",pod=~\"%s\",container!=\"POD\"}[1h])) or vector(0)" $podRe | quote }}}]},
                          {"id": 4, "type": "stat", "title": "Image", "gridPos": {"x": 18, "y": 0, "w": 6, "h": 4},
                           "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "/^image$/"}, "textMode": "name"},
                           "targets": [{"refId": "A", "expr": {{ printf "kube_pod_container_info{namespace=\"$env\",pod=~\"%s\",container!=\"POD\"}" $podRe | quote }}, "format": "table", "instant": true}]},
                          {"id": 5, "type": "timeseries", "title": "CPU (cores)", "gridPos": {"x": 0, "y": 4, "w": 12, "h": 8},
                           "targets": [{"refId": "A", "expr": {{ printf "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"$env\",pod=~\"%s\",container!=\"\",container!=\"POD\"}[$__rate_interval]))" $podRe | quote }}}]},
                          {"id": 6, "type": "timeseries", "title": "Memory (working set)", "gridPos": {"x": 12, "y": 4, "w": 12, "h": 8},
                           "fieldConfig": {"defaults": {"unit": "bytes"}},
                           "targets": [{"refId": "A", "expr": {{ printf "sum by (pod) (container_memory_working_set_bytes{namespace=\"$env\",pod=~\"%s\",container!=\"\",container!=\"POD\"})" $podRe | quote }}}]},
                          {"id": 7, "type": "timeseries", "title": "HTTP requests / s (by status)", "gridPos": {"x": 0, "y": 12, "w": 12, "h": 8},
                           "targets": [{"refId": "A", "expr": {{ printf "sum by (status) (rate(http_server_requests_seconds_count{namespace=\"$env\",pod=~\"%s\"}[$__rate_interval]))" $podRe | quote }}}]},
                          {"id": 8, "type": "timeseries", "title": "HTTP 5xx ratio", "gridPos": {"x": 12, "y": 12, "w": 12, "h": 8},
                           "fieldConfig": {"defaults": {"unit": "percentunit", "max": 1, "min": 0}},
                           "targets": [{"refId": "A", "expr": {{ printf "sum(rate(http_server_requests_seconds_count{namespace=\"$env\",pod=~\"%s\",status=~\"5..\"}[$__rate_interval])) / clamp_min(sum(rate(http_server_requests_seconds_count{namespace=\"$env\",pod=~\"%s\"}[$__rate_interval])), 1e-9)" $podRe $podRe | quote }}}]},
                          {"id": 9, "type": "timeseries", "title": "HTTP latency p95 (s)", "gridPos": {"x": 0, "y": 20, "w": 24, "h": 8},
                           "targets": [{"refId": "A", "expr": {{ printf "histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{namespace=\"$env\",pod=~\"%s\"}[$__rate_interval])))" $podRe | quote }}}]}
                        ]
                      }
            {{- if $promote }}
            ---
            # The Warehouse: new freight whenever the paved-road CI publishes an image.
            apiVersion: kubernetes.m.crossplane.io/v1alpha1
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: warehouse
              labels: {feature: apps, managed-by: adhar}
            spec:
              providerConfigRef: {name: {{ quote $providerConfig }}, kind: ClusterProviderConfig}
              forProvider:
                manifest:
                  apiVersion: kargo.akuity.io/v1alpha1
                  kind: Warehouse
                  metadata:
                    name: {{ quote $name }}
                    namespace: {{ quote $project }}
                    labels:
                      {{- range $k, $v := $labels }}
                      {{ $k }}: {{ $v | quote }}
                      {{- end }}
                  spec:
                    interval: 2m
                    subscriptions:
                      - image:
                          repoURL: {{ quote $image }}
                          # NewestBuild by default: CI tags images with the commit
                          # SHA, which has no order; Kargo ranks by creation time.
                          imageSelectionStrategy: {{ $strategy }}
                          # Only what app-ci publishes is freight: it tags the SIGNED
                          # image with the full commit SHA. Anything else in the
                          # repository (a `latest`, a kpack `bN.<timestamp>` build,
                          # a hand-pushed tag) is unsigned, Kyverno flags the pod,
                          # and promoting it by digest would still deploy it.
                          # (`allowTags` is refused outright since Kargo 1.11.)
                          allowTagsRegexes: ["^[0-9a-f]{40}$"]
                          # Harbor serves its own internal CA; this hop never leaves
                          # the cluster network.
                          insecureSkipTLSVerify: true
                          discoveryLimit: 10
            {{- if $envs }}
            {{- $envList := list -}}
            {{- range $envs }}{{ $envList = append $envList .name }}{{ end }}
            ---
            # Seeds each environment's rendered branch `stage/<env>` from the
            # source branch's overlay, once, so its Argo CD Application has
            # something to sync before the first promotion writes to it. A
            # branch that exists is never touched: promotions own it from then
            # on. Idempotent, so the Job re-running after its TTL is harmless.
            apiVersion: batch/v1
            kind: Job
            metadata:
              name: {{ printf "%s-stage-branches" $name | trunc 63 | trimSuffix "-" }}
              namespace: {{ $xrns }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: stage-branches
                # A Job reports completion, not Ready; it must not hold the XR.
                gotemplating.fn.crossplane.io/ready: "True"
              labels:
                {{- range $k, $v := $labels }}
                {{ $k }}: {{ $v | quote }}
                {{- end }}
            spec:
              backoffLimit: 6
              ttlSecondsAfterFinished: 3600
              template:
                spec:
                  restartPolicy: OnFailure
                  securityContext: {runAsNonRoot: true, runAsUser: 65532, seccompProfile: {type: RuntimeDefault}}
                  containers:
                    - name: seed
                      image: alpine/k8s:1.31.1
                      env:
                        - {name: REPO, value: {{ quote $repoURL }}}
                        - {name: REVISION, value: {{ quote $revision }}}
                        - {name: OVERLAYS, value: {{ quote $path }}}
                        - {name: ENVS, value: {{ join " " $envList | quote }}}
                        - {name: HOME, value: /tmp}
                        - name: GITEA_USER
                          valueFrom: {secretKeyRef: {name: gitea-credential, key: username}}
                        - name: GITEA_PASSWORD
                          valueFrom: {secretKeyRef: {name: gitea-credential, key: password}}
                      securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: ["ALL"]}}
                      resources:
                        requests: {cpu: 20m, memory: 64Mi}
                        limits: {cpu: 500m, memory: 256Mi}
                      command: ["/bin/sh", "-c"]
                      args:
                        - |
                          set -eu
                          cd "$(mktemp -d)"
                          AUTH="Authorization: Basic $(printf '%s:%s' "$GITEA_USER" "$GITEA_PASSWORD" | base64 | tr -d '\n')"
                          g() { git -c http.extraHeader="$AUTH" -c user.name=adhar -c user.email=adhar@adhar.io "$@"; }
                          g clone -q --depth 1 --branch "$REVISION" "$REPO" src
                          for env in $ENVS; do
                            b="stage/$env"
                            if g ls-remote --exit-code --heads "$REPO" "$b" >/dev/null 2>&1; then
                              echo "$b exists; promotions own it"
                              continue
                            fi
                            rm -rf out && mkdir out
                            kustomize build "src/$OVERLAYS/envs/$env" > out/manifests.yaml
                            (cd out && git init -q -b "$b" && git add manifests.yaml \
                              && g commit -qm "seed $b from $REVISION [skip ci]" \
                              && g push -q "$REPO" "HEAD:refs/heads/$b")
                            echo "seeded $b"
                          done
            {{- end }}
            {{- end }}
            {{- range $envs }}
            {{- $env := . -}}
            {{- $envName := $env.name -}}
            {{- $ns := $env.namespace -}}
            {{- $appName := printf "%s-%s-%s" $project $name $envName -}}
            {{- $obsApp := default (dict) (get $observed (printf "app-%s" $envName)) -}}
            {{- $obsHealth := dig "resource" "status" "atProvider" "manifest" "status" "health" "status" "" $obsApp -}}
            {{- if eq $obsHealth "Healthy" }}{{- $ready = add1 $ready -}}{{- end }}
            ---
            # Argo CD Application for one environment, under the project's AppProject.
            apiVersion: kubernetes.m.crossplane.io/v1alpha1
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: app-{{ $envName }}
              labels: {feature: apps, managed-by: adhar, adhar.io/environment: {{ quote $envName }}}
            spec:
              providerConfigRef: {name: {{ quote $providerConfig }}, kind: ClusterProviderConfig}
              forProvider:
                manifest:
                  apiVersion: argoproj.io/v1alpha1
                  kind: Application
                  metadata:
                    name: {{ quote $appName }}
                    namespace: adhar-system
                    annotations:
                      # Kargo refuses to update an Application that does not NAME
                      # the Stage allowed to touch it ("is not authorized"), so the
                      # promotion's last step failed after the commit was pushed
                      # (2026-10-17). <kargo project namespace>:<stage>, and the Stage
                      # is the PROJECT's environment Stage, shared by every application.
                      kargo.akuity.io/authorized-stage: {{ quote (printf "%s:%s" $project $envName) }}
                    labels:
                      {{- range $k, $v := $labels }}
                      {{ $k }}: {{ $v | quote }}
                      {{- end }}
                      adhar.io/environment: {{ quote $envName }}
                    finalizers: [resources-finalizer.argocd.argoproj.io]
                  spec:
                    project: {{ quote $project }}
                    source:
                      repoURL: {{ quote $repoURL }}
                      {{- if $promote }}
                      # The environment's RENDERED branch: plain manifests that
                      # only this environment's promotions commit to (Kargo
                      # renders <path>/envs/<env> from the source branch). With
                      # every environment on the shared source branch, a test
                      # promotion moved dev's synced revision past the commit
                      # dev's own promotion made, and Kargo reported dev
                      # Unhealthy after every downstream promotion.
                      path: .
                      targetRevision: {{ quote (printf "stage/%s" $envName) }}
                      {{- else }}
                      path: {{ quote (printf "%s/envs/%s" $path $envName) }}
                      targetRevision: {{ quote $revision }}
                      {{- end }}
                    destination:
                      server: https://kubernetes.default.svc
                      namespace: {{ quote $ns }}
                    syncPolicy:
                      automated: {prune: true, selfHeal: true}
                      managedNamespaceMetadata:
                        labels:
                          {{- range $k, $v := $nsLabels }}
                          {{ $k }}: {{ $v | quote }}
                          {{- end }}
                      syncOptions:
                        - ServerSideApply=true
                        - RespectIgnoreDifferences=true
                      retry: {limit: -1, backoff: {duration: 5s, factor: 2, maxDuration: 3m}}
                    ignoreDifferences:
                      - group: gateway.networking.k8s.io
                        kind: HTTPRoute
                        jsonPointers: ['/status']
                      # A HorizontalPodAutoscaler owns the replica count once it
                      # has scaled the Rollout. Without this Argo CD put Git's
                      # count back after every HPA decision, a new pod booted,
                      # the Rollout went Progressing and Kargo's verification
                      # failed the freight (GCP, 2026-10-21). Only fields the HPA
                      # actually wrote are ignored, so a service without one
                      # still takes its replicas from Git.
                      - group: argoproj.io
                        kind: Rollout
                        managedFieldsManagers: [kube-controller-manager]
            {{- end }}
            {{- end }}
            {{- if $envs }}
            ---
            # The retired per-application environment list: accepted (existing XRs
            # carry the old schema default dev/test/prod) but never acted on. Say so
            # whenever it disagrees with the project, instead of silently deploying
            # somewhere the author did not ask for.
            apiVersion: meta.gotemplating.fn.crossplane.io/v1alpha1
            kind: ClaimConditions
            conditions:
              - type: ProjectEnvironments
                status: "True"
                target: Composite
                {{- if or $ignored $notListed }}
                reason: OverrideIgnored
                message: {{ quote (printf "spec.parameters.environments is ignored: every application runs in all of project %q's environments (%s)%s%s" $project (join ", " $projEnvNames) (ternary (printf "; not a project environment: %s" (join ", " $ignored)) "" (gt (len $ignored) 0)) (ternary (printf "; deployed anyway: %s" (join ", " $notListed)) "" (gt (len $notListed) 0))) }}
                {{- else }}
                reason: Inherited
                message: {{ quote (printf "runs in project %q's environments: %s" $project (join ", " $projEnvNames)) }}
                {{- end }}
            {{- end }}
            ---
            apiVersion: platform.adhar.io/v1alpha1
            kind: Application
            status:
              {{- if not $envs }}
              phase: Pending
              message: {{ quote (printf "waiting for project %q to publish its environments" $project) }}
              {{- else }}
              phase: {{ if eq $ready (len $envs) }}Healthy{{ else if gt $ready 0 }}Progressing{{ else }}Pending{{ end }}
              message: {{ quote (printf "%d/%d environments healthy" $ready (len $envs)) }}
              # Where this application runs: the project's environments, each with
              # its Argo CD Application and the project's shared Kargo Stage.
              environments:
                {{- range $envs }}
                - name: {{ quote .name }}
                  namespace: {{ quote .namespace }}
                  argoApplication: {{ quote (printf "%s-%s-%s" $project $name .name) }}
                  stage: {{ quote .name }}
                {{- end }}
              # What the project's shared promotion chain needs to promote this
              # application. The Project composition reads it back (an extra
              # resource) and renders one requestedFreight origin plus one set of
              # promotion steps per application into each environment's Stage.
              delivery:
                promote: {{ $promote }}
                kargoProject: {{ quote $project }}
                {{- if $promote }}
                warehouse: {{ quote $name }}
                image: {{ quote $image }}
                repoURL: {{ quote $repoURL }}
                path: {{ quote $path }}
                targetRevision: {{ quote $revision }}
                soakTime: {{ quote $soak }}
                verification:
                  enabled: {{ $verify }}
                  interval: {{ quote $vInterval }}
                  count: {{ $vCount }}
                  settleSeconds: {{ $vSettle }}
                  failureLimit: {{ $vFail }}
                  {{- if $errQuery }}
                  errorRateQuery: {{ quote $errQuery }}
                  {{- end }}
                  errorRateThreshold: {{ $errThreshold }}
                {{- end }}
              {{- end }}
    - step: ready
      functionRef:
        name: function-auto-ready
