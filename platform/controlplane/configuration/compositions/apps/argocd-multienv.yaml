e":false}},
              {"id":8,"type":"stat","title":"Served 4xx","description":"Share of requests the pod's nginx answered 4xx: missing assets, often a stale bundle after a release.","gridPos":{"h":4,"w":3,"x":18,"y":1},"datasource":{"type":"loki","uid":"loki"},"targets":[{"datasource":{"type":"loki","uid":"loki"},"refId":"A","expr":"(sum((count_over_time({adhar_application=\"__APP__\", adhar_environment=\"${env:text}\", adhar_component=\"app\"} | pod=~\"$pod\" != \"kube-probe\" | pattern \"<_> - <_> [<_>] \\\"<method> <path> <_>\\\" <status> <bytes> \\\"<_>\\\" \\\"<agent>\\\"\" | status=~\"[0-9]+\" | status=~\"4..\" [$__range]) or count_over_time({namespace=\"$env\", app=\"__APP__\", pod=~\"$pod\", adhar_application=\"\"} != \"kube-probe\" | pattern \"<_> - <_> [<_>] \\\"<method> <path> <_>\\\" <status> <bytes> \\\"<_>\\\" \\\"<agent>\\\"\" | status=~\"[0-9]+\" | status=~\"4..\" [$__range]))) or vector(0)) / sum((count_over_time({adhar_application=\"__APP__\", adhar_environment=\"${env:text}\", adhar_component=\"app\"} | pod=~\"$pod\" != \"kube-probe\" | pattern \"<_> - <_> [<_>] \\\"<method> <path> <_>\\\" <status> <bytes> \\\"<_>\\\" \\\"<agent>\\\"\" | status=~\"[0-9]+\" [$__range]) or count_over_time({namespace=\"$env\", app=\"__APP__\", pod=~\"$pod\", adhar_application=\"\"} != \"kube-probe\" | pattern \"<_> - <_> [<_>] \\\"<method> <path> <_>\\\" <status> <bytes> \\\"<_>\\\" \\\"<agent>\\\"\" | status=~\"[0-9]+\" [$__range])))","legendFormat":"__auto","instant":true,"range":false,"queryType":"instant"}],"fieldConfig":{"defaults":{"unit":"percentunit","decimals":2,"noValue":"—","thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"#EAB839","value":0.02},{"color":"red","value":0.1}]},"color":{"mode":"thresholds"},"mappings":[]},"overrides":[]},"options":{"reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"colorMode":"background","graphMode":"none","textMode":"value","justifyMode":"center","orientation":"auto","wideLayout":