              {"id":9,"type":"stat","title":"LCP p75","description":"75th percentile LCP over the selected range, as Core Web Vitals are judged: green ≤ 2500, red > 4000 ms.","gridPos":{"h":4,"w":3,"x":21,"y":1},"datasource":{"type":"loki","uid":"loki"},"targets":[{"datasource":{"type":"loki","uid":"loki"},"refId":"A","expr":"quantile_over_time(0.75, {source=\"faro\",app_name=\"__APP__\",app_environment=\"${env:text}\",kind=\"measurement\"} |= \"web-vitals\" | logfmt | type=\"web-vitals\" | lcp!=\"\" | unwrap lcp [$__range]) by (app_name)","legendFormat":"__auto","instant":true,"range":false,"queryType":"instant"}],"fieldConfig":{"defaults":{"unit":"ms","decimals":0,"noValue":"—","thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"#EAB839","value":2500},{"color":"red","value":4000}]},"color":{"mode":"thresholds"},"mappings":[]},"overrides":[]},"options":{"reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"colorMode":"background","graphMode":"none","textMode":"value","justifyMode":"center","orientation":"auto","wideLayout":true,"showPercentChange":false}},
