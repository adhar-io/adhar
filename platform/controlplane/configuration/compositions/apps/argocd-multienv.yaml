               {"id":96,"type":"table","title":"Slow Traces (> 1s)","description":"Latest server traces slower than one second.","gridPos":{"h":8,"w":12,"x":0,"y":231},"datasource":{"type":"tempo","uid":"tempo"},"targets":[{"datasource":{"type":"tempo","uid":"tempo"},"refId":"A","queryType":"traceql","query":"{resource.service.name=\"__APP__\" && kind=server && duration > 1s}","limit":20,"tableType":"traces"}],"fieldConfig":{"defaults":{"custom":{"align":"auto","cellOptions":{"type":"auto"}},"noValue":"No trace slower than one second"},"overrides":[]},"options":{"showHeader":true,"cellHeight":"sm","footer":{"show":false}}},
               {"id":97,"type":"table","title":"Slow Database / Client Calls (> 250ms)","description":"Latest outbound calls (SQL, cache, HTTP) slower than 250 ms, with the trace they belong to.","gridPos":{"h":8,"w":12,"x":12,"y":231},"datasource":{"type":"tempo","uid":"tempo"},"targets":[{"datasource":{"type":"tempo","uid":"tempo"},"refId":"A","queryType":"traceql","query":"{resource.service.name=\"__APP__\" && kind=client && duration > 250ms}","limit":20,"tableType":"traces"}],"fieldConfig":{"defaults":{"custom":{"align":"auto","cellOptions":{"type":"auto"}},"noValue":"No client call slower than 250 ms"},"overrides":[]},"options":{"showHeader":true,"cellHeight":"sm","footer":{"show":false}}}
