               {"datasource":{"type":"prometheus","uid":"prometheus"},"enable":true,"iconColor":"purple","name":"Argo CD syncs","expr":"sum by (phase) (increase(argocd_app_sync_total{name=\"__ARGO_APP__${env:text}\"}[2m])) > 0","step":"1m","titleFormat":"Argo CD sync","textFormat":"{{phase}}"},
