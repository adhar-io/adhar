apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: application-multienv
  labels:
    feature: apps
    topology: multi-env
spec:
  compositeTypeRef:
    apiVersion: platform.adhar.io/v1alpha1
    kind: Application
  mode: Pipeline
  pipeline:
    - step: render-environments
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- /* A deployable inside a PROJECT (ADR-0026).
                   Organisation → Team → Project → APPLICATION → Environment → Release

                   The application never decides where an environment lives: it
                   OBSERVES its Project (an observe-only provider-kubernetes
                   Object — managementPolicies: [Observe]) and reads
                   status.environments[] from it. Until the project has published
                   that list, this renders only the observation and reports Pending.

                   Per environment OF THE PROJECT it then emits an Argo CD Application
                   `<project>-<app>-<env>` in the project's AppProject, deploying
                   `<path>/envs/<env>` into the environment's namespace — every
                   environment is Git-driven, so every one is auto-synced; WHICH revision
                   an environment runs is Kargo's call. Plus one Kargo Warehouse `<app>`
                   watching the application's image repository.

                   Environments are the PROJECT's, shared by every application in it:
                   there is no per-application environment list any more, and no
                   per-application Kargo Stage. The promotion chain is the project's —
                   one Stage per project environment (`dev` → `test` → `prod`), composed
                   by the Project (compositions/project/local.yaml), requesting freight
                   from every application's Warehouse. This composition publishes what
                   that chain needs to promote THIS application on status.delivery
                   (image, repository, overlay path, branch, soak, verification), and
                   the Project reads it back. Each Argo CD Application therefore names
                   the shared Stage `<project>:<env>` as the one Kargo may update it.

                   MIGRATION (2026-10): applications composed before this change owned
                   Stages `<app>-<env>` and AnalysisTemplates `<app>-<env>-health` in the
                   Kargo project namespace. They are no longer rendered, so Crossplane
                   garbage-collects the Objects and with them the Stages; the project's
                   shared Stages replace them. Nothing carries over and nothing needs to:
                   Freight belongs to the Warehouse (kept, same name), the deployed
                   digest is in Git, and the new `dev` Stage auto-promotes the newest
                   freight again — a no-op commit that re-verifies it — after which test
                   follows on its own. Only prod needs a fresh Release, against Stage
                   `<env>` instead of `<app>-<env>`. `spec.parameters.environments` is
                   kept in the schema so existing XRs stay valid, but it is IGNORED; the
                   ProjectEnvironments condition says so when it disagrees with the
                   project.
                   Kargo expressions are `${{ … }}`; `{{` starts a Go template action,
                   so they are spelled through $ex below. */ -}}
            {{- $xr := .observed.composite.resource -}}
            {{- $params := default (dict) $xr.spec.parameters -}}
            {{- $name := $xr.metadata.name -}}
            {{- $xrns := $xr.metadata.namespace -}}
            {{- $source := default (dict) $params.source -}}
            {{- $repoURL := get $source "repoURL" -}}
            {{- if not $repoURL }}{{ fail "source.repoURL must be provided" }}{{ end -}}
            {{- /* The platform's own Gitea is addressed IN-CLUSTER. The Argo CD
                   AppProject allow-list and the Kargo git credential the Project
                   composes are both written for gitea-http.adhar-system, while the
                   console and CLI hand us the repository's PUBLIC clone URL
                   (https://gitea.<domain>/<org>/<repo>.git) — a form that differs
                   per installation and that nothing in-cluster needs. Left as-is,
                   Argo CD refused the repo ("not permitted in project") and Kargo
                   could not push ("could not read Username") on every app
                   (2026-10-17). Repositories hosted elsewhere pass through unchanged. */ -}}
            {{- $giteaHost := "gitea-http.adhar-system.svc.cluster.local:3000" -}}
            {{- if regexMatch "^https?://gitea\\.[^/]+/" $repoURL -}}
            {{-   $repoURL = regexReplaceAll "^https?://gitea\\.[^/]+/" $repoURL (printf "http://%s/" $giteaHost) -}}
            {{- end -}}
            {{- $path := default "deploy" (get $source "path") -}}
            {{- $revision := default "main" (get $source "targetRevision") -}}
            {{- $project := default "adhar" $params.project -}}
            {{- if eq $project "default" }}{{ $project = "adhar" }}{{ end -}}
            {{- $promo := default (dict) $params.promotion -}}
            {{- $promote := ternary (get $promo "enabled") true (hasKey $promo "enabled") -}}
            {{- $soak := default "0s" (get $promo "soakTime") -}}
            {{- $verifyCfg := default (dict) (get $promo "verification") -}}
            {{- $verify := ternary (get $verifyCfg "enabled") true (hasKey $verifyCfg "enabled") -}}
            {{- $vInterval := default "60s" (get $verifyCfg "interval") -}}
            {{- $vCount := default 8 (get $verifyCfg "count") -}}
            {{- $vSettle := default 480 (get $verifyCfg "settleSeconds") -}}
            {{- $vFail := default 1 (get $verifyCfg "failureLimit") -}}
            {{- $errQuery := default "" (get $verifyCfg "errorRateQuery") -}}
            {{- $errThreshold := default 0.01 (get $verifyCfg "errorRateThreshold") -}}
            {{- $imageCfg := default (dict) $params.image -}}
            {{- $strategy := default "NewestBuild" (get $imageCfg "selectionStrategy") -}}
            {{- $providerConfig := dig "spec" "providerConfigRef" "name" "kubernetes-provider" $xr -}}
            {{- $observed := default (dict) .observed.resources -}}
            {{- $projObj := dig "project" "resource" dict $observed -}}
            {{- $projStatus := dig "status" "atProvider" "manifest" "status" dict $projObj -}}
            {{- $projEnvs := dig "environments" (list) $projStatus -}}
            {{- $registry := dig "imageRegistry" "harbor-core.adhar-system.svc.cluster.local/library" $projStatus -}}
            {{- $image := default (printf "%s/%s" $registry $name) (get $imageCfg "repository") -}}
            {{- /* Every application runs in EVERY environment of its project: the
                   project's chain promotes all of them together, so an application
                   that skipped `test` would never reach `prod`. The retired per-app
                   `environments` list is read only to report that it is ignored. */ -}}
            {{- $envs := $projEnvs -}}
            {{- $projEnvNames := list -}}
            {{- range $projEnvs }}{{ $projEnvNames = append $projEnvNames .name }}{{ end -}}
            {{- $wanted := list -}}
            {{- range (default (list) $params.environments) }}{{ $wanted = append $wanted .name }}{{ end -}}
            {{- $ignored := list -}}
            {{- range $wanted }}{{ if not (has . $projEnvNames) }}{{ $ignored = append $ignored . }}{{ end }}{{ end -}}
            {{- $notListed := list -}}
            {{- if $wanted }}{{ range $projEnvNames }}{{ if not (has . $wanted) }}{{ $notListed = append $notListed . }}{{ end }}{{ end }}{{ end -}}
            {{- $ex := "${{" -}}
            {{- $ready := 0 -}}
            {{- $labels := dict "adhar.io/organisation" (dig "organisation" "adhar" $projStatus) "adhar.io/team" (dig "team" "platform" $projStatus) "adhar.io/project" $project "adhar.io/application" $name -}}
            {{- /* The application type, on every environment's Application and on its namespace,
                   where the ai-workload-isolation policy reads it. See compositions/apps/local.yaml
                   for the full account; here every environment gets the same labels. */ -}}
            {{- $type := default "service" $params.type -}}
            {{- $ai := default (dict) $params.ai -}}
            {{- $_ := set $labels "platform.adhar.io/application-type" $type -}}
            {{- $nsLabels := dict "platform.adhar.io/application-type" $type -}}
            {{- if eq $type "ai" -}}
            {{- $_ := set $nsLabels "platform.adhar.io/isolation" (default "microvm" (get $ai "isolation")) -}}
            {{- $_ := set $nsLabels "platform.adhar.io/gpu-sharing" (dig "gpu" "sharing" "mig" $ai) -}}
            {{- $_ := set $nsLabels "platform.adhar.io/gpu-count" (toString (dig "gpu" "count" 1 $ai)) -}}
            {{- end -}}
            ---
            # Observe the project (read-only): where do its environments live?
            apiVersion: kubernetes.m.crossplane.io/v1alpha1
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: project
            spec:
              managementPolicies: ["Observe"]
              providerConfigRef: {name: {{ quote $providerConfig }}, kind: ClusterProviderConfig}
              forProvider:
                manifest:
                  apiVersion: platform.adhar.io/v1alpha1
                  kind: Project
                  metadata:
                    name: {{ quote $project }}
                    namespace: {{ quote $xrns }}
            {{- /* Nothing below can render until the Project has been observed and has
                   reported its environments: on the first pass $envs is empty, and the
                   dashboard indexing the first environment used to fail the WHOLE pipeline, so the
                   Project was never composed and the XR stayed unsynced for ever. */ -}}
            {{- if $envs }}
            {{- /* The dashboard JSON is GENERATED: edit hack/dashboards/build-app-dashboard.py and
                   re-run it (TestTheComposedAppDashboardIsUpToDate fails otherwise). It is a raw
                   string, so Grafana's `{{pod}}` legends need no escaping, with __PLACEHOLDERS__
                   filled in below. */ -}}
            {{- /* BEGIN GENERATED APP DASHBOARD (hack/dashboards/build-app-dashboard.py) */ -}}
            {{- $appDash := `{
             "uid":"app-__APP__",
             "title":"__APP__ · application",
             "description":"Service dashboard of the custom application __APP__, composed by the Application composition (golden signals, resources, JVM, business metrics, logs, traces, delivery). Generated by hack/dashboards/build-app-dashboard.py.",
             "tags":["adhar","application","__APP__"],
             "editable":false,
             "graphTooltip":1,
             "schemaVersion":39,
             "time":{"from":"now-3h","to":"now"},
             "refresh":"30s",
             "links":"__LINKS__",
             "annotations":{
              "list":[
               {"builtIn":1,"datasource":{"type":"grafana","uid":"-- Grafana --"},"enable":true,"hide":true,"iconColor":"rgba(0, 211, 255, 1)","name":"Annotations & Alerts","type":"dashboard"},
               {"datasource":{"type":"prometheus","uid":"prometheus"},"enable":true,"iconColor":"blue","name":"Deploys","expr":"(time() - max(kube_replicaset_created{namespace=\"$env\",replicaset=~\"__APP__-[a-z0-9]{6,10}\"})) < 60","step":"30s","titleFormat":"New version rolled out","textFormat":"A new ReplicaSet of __APP__ (Kargo promotion or rollout)"},
               {"datasource":{"type":"prometheus","uid":"prometheus"},"enable":true,"iconColor":"purple","name":"Argo CD syncs","expr":"sum by (phase) (increase(argocd_app_sync_total{name=\"__ARGO_APP__${env:text}\"}[2m])) > 0","step":"1m","titleFormat":"Argo CD sync","textFormat":"{{phase}}"},
               {"datasource":{"type":"prometheus","uid":"prometheus"},"enable":true,"iconColor":"red","name":"Restarts","expr":"sum(increase(kube_pod_container_status_restarts_total{namespace=\"$env\",pod=~\"__POD_RE__\",container!=\"\"}[2m])) > 0","step":"1m","titleFormat":"Container restarted","textFormat":""}
              ]
             },
             "templating":{
              "list":[
               "__ENV_VAR__",
               {"name":"pod","label":"Pod","type":"query","datasource":{"type":"prometheus","uid":"prometheus"},"definition":"label_values(kube_pod_info{namespace=\"$env\",pod=~\"__POD_RE__\"}, pod)","query":{"qryType":1,"query":"label_values(kube_pod_info{namespace=\"$env\",pod=~\"__POD_RE__\"}, pod)","refId":"var-pod"},"includeAll":true,"multi":true,"allValue":"__POD_RE__","refresh":2,"sort":1,"current":{"text":["All"],"value":["$__all"]},"options":[],"hide":0},
               {"name":"business_metric","label":"Business metric","type":"query","datasource":{"type":"prometheus","uid":"prometheus"},"definition":"label_values({__name__=~\"adhar_business_.+_(total|count)\",namespace=\"$env\",pod=~\"$pod\"}, __name__)","query":{"qryType":1,"query":"label_values({__name__=~\"adhar_business_.+_(total|count)\",namespace=\"$env\",pod=~\"$pod\"}, __name__)","refId":"var-business_metric"},"includeAll":true,"multi":true,"refresh":2,"sort":1,"hide":2,"current":{"text":["All"],"value":["$__all"]},"options":[]},
               {"name":"slo","label":"Availability SLO","type":"custom","query":"0.99,0.995,0.999","current":{"text":"0.995","value":"0.995"},"includeAll":false,"multi":false,"hide":0,"options":[{"text":"0.99","value":"0.99","selected":false},{"text":"0.995","value":"0.995","selected":true},{"text":"0.999","value":"0.999","selected":false}]},
               {"name":"search","label":"Log search","type":"textbox","query":"","current":{"text":"","value":""},"hide":0}
              ]
             },
             "panels":[
              {"id":1,"type":"row","title":"Overview","collapsed":false,"gridPos":{"h":1,"w":24,"x":0,"y":0},"panels":[]},
              {"id":2,"type":"stat","title":"Rollout","description":"Argo Rollouts phase of the application in this environment (Healthy, Progressing, Paused for a canary step, Degraded).","gridPos":{"h":4,"w":4,"x":0,"y":1},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"datasource":{"type":"prometheus","uid":"prometheus"},"refId":"A","expr":"max by (phase) (rollout_info{namespace=\"$env\",name=\"__APP__\"})","legendFormat":"{{phase}}","instant":true,"range":false}],"fieldConfig":{"defaults":{"unit":"short","decimals":0,"noValue":"No Rollout","thresholds":{"mode":"absolute","steps":[{"color":"#5794F2","value":null}]},"color":{"mode":"thresholds"},"mappings":[{"type":"value","options":{"1":{"color":"#5794F2"}}}]},"overrides":[]},"options":{"reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"colorMode":"none","graphMode":"none","textMode":"name","justifyMode":"center","orientation":"auto","wideLayout":true,"showPercentChange":false}},
              {"id":3,"type":"stat","title":"Replicas","description":"Available replicas.","gridPos":{"h":4,"w":4,"x":4,"y":1},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"datasource":{"type":"prometheus","uid":"prometheus"},"refId":"A","expr":"max(rollout_info_replicas_available{namespace=\"$env\",name=\"__APP__\"}) or max(kube_deployment_status_replicas_available{namespace=\"$env\",deployment=\"__APP__\"})","legendFormat":"__auto","instant":true,"range":false}],"fieldConfig":{"defaults":{"unit":"short","decimals":0,"noValue":"0","thresholds":{"mode":"absolute","steps":[{"color":"red","value":null},{"color":"green","value":1}]},"color":{"mode":"thresholds"},"mappings":[]},"overrides":[]},"options":{"reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"colorMode":"value","graphMode":"none","textMode":"value","justifyMode":"center","orientation":"auto","wideLayout":true,"showPercentChange":false}},
              {"id":4,"type":"stat","title":"Argo CD","description":"Health and sync of the Argo CD Application __ARGO_APP__<env>.","gridPos":{"h":4,"w":4,"x":8,"y":1},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"datasource":{"type":"prometheus","uid":"prometheus"},"refId":"A","expr":"max by (health_status, sync_status) (argocd_app_info{name=\"__ARGO_APP__${env:text}\"})","legendFormat":"{{health_status}} · {{sync_status}}","instant":true,"range":false}],"fieldConfig":{"defaults":{"unit":"short","decimals":0,"noValue":"No Argo CD app","thresholds":{"mode":"absolute","steps":[{"color":"#5794F2","value":null}]},"color":{"mode":"thresholds"},"mappings":[]},"overrides":[]},"options":{"reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"colorMode":"none","graphMode":"none","textMode":"name","justifyMode":"center","orientation":"auto","wideLayout":true,"showPercentChange":false}},
              {"id":5,"type":"stat","title":"Requests / s","description":"Request rate (excludes /actuator probes).","gridPos":{"h":4,"w":4,"x":12,"y":1},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"datasource":{"type":"prometheus","uid":"prometheus"},"refId":"A","expr":"sum (rate(http_server_requests_seconds_count{namespace=\"$env\",pod=~\"$pod\",uri!~\"/actuator.*\"}[$__rate_interval]))","legendFormat":"__auto"}],"fieldConfig":{"defaults":{"unit":"reqps","decimals":2,"noValue":"—","thresholds":{"mode":"absolute","steps":[{"color":"#5794F2","value":null}]},"color":{"mode":"thresholds"},"mappings":[]},"overrides":[]},"options":{"reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"colorMode":"value","graphMode":"area","textMode":"value","justifyMode":"center","orientation":"auto","wideLayout":true,"showPercentChange":false}},
              {"id":6,"type":"stat","title":"5xx Ratio","description":"Share of requests answered 5xx.","gridPos":{"h":4,"w":4,"x":16,"y":1},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"datasource":{"type":"prometheus","uid":"prometheus"},"refId":"A","expr":"(sum (rate(http_server_requests_seconds_count{namespace=\"$env\",pod=~\"$pod\",uri!~\"/actuator.*\",status=~\"5..\"}[$__rate_interval])) or sum (rate(http_server_requests_seconds_count{namespace=\"$env\",pod=~\"$pod\",uri!~\"/actuator.*\"}[$__rate_interval])) * 0) / sum (rate(http_server_requests_seconds_count{namespace=\"$env\",pod=~\"$pod\",uri!~\"/actuator.*\"}[$__rate_interval]))","legendFormat":"__auto"}],"fieldConfig":{"defaults":{"unit":"percentunit","decimals":2,"noValue":"—","thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"#EAB839","value":0.001},{"color":"red","value":0.01}]},"color":{"mode":"thresholds"},"mappings":[]},"overrides":[]},"options":{"reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"colorMode":"value","graphMode":"area","textMode":"value","justifyMode":"center","orientation":"auto","wideLayout":true,"showPercentChange":false}},
              {"id":7,"type":"stat","title":"p95 Latency","description":"95th percentile server latency.","gridPos":{"h":4,"w":4,"x":20,"y":1},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"datasource":{"type":"prometheus","uid":"prometheus"},"refId":"A","expr":"histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{namespace=\"$env\",pod=~\"$pod\",uri!~\"/actuator.*\"}[$__rate_interval])))","legendFormat":"__auto"}],"fieldConfig":{"defaults":{"unit":"s","decimals":3,"noValue":"—","thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"#EAB839","value":0.5},{"color":"red","value":1}]},"color":{"mode":"thresholds"},"mappings":[]},"overrides":[]},"options":{"reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"colorMode":"value","graphMode":"area","textMode":"value","justifyMode":"center","orientation":"auto","wideLayout":true,"showPercentChange":false}},
              {"id":8,"type":"stat","title":"Error Budget Left","description":"Share of the error budget left over the selected range for the $slo availability objective (5xx counted as failures). Below 0 = spent.","gridPos":{"h":4,"w":4,"x":0,"y":5},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"datasource":{"type":"prometheus","uid":"prometheus"},"refId":"A","expr":"1 - ((sum (rate(http_server_requests_seconds_count{namespace=\"$env\",pod=~\"$pod\",uri!~\"/actuator.*\",status=~\"5..\"}[$__range])) or sum (rate(http_server_requests_seconds_count{namespace=\"$env\",pod=~\"$pod\",uri!~\"/actuator.*\"}[$__range])) * 0) / sum (rate(http_server_requests_seconds_count{namespace=\"$env\",pod=~\"$pod\",uri!~\"/actuator.*\"}[$__range]))) / (1 - $slo)","legendFormat":"__auto","instant":true,"range":false}],"fieldConfig":{"defaults":{"unit":"percentunit","decimals":1,"noValue":"—","thresholds":{"mode":"absolute","steps":[{"color":"red","value":null},{"color":"#EAB839","value":0.25},{"color":"green","value":0.5}]},"color":{"mode":"thresholds"},"mappings":[]},"overrides":[]},"options":{"reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"colorMode":"value","graphMode":"none","textMode":"value","justifyMode":"center","orientation":"auto","wideLayout":true,"showPercentChange":false}},
              {"id":9,"type":"stat","title":"Restarts","description":"Container restarts in the selected range.","gridPos":{"h":4,"w":4,"x":4,"y":5},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"datasource":{"type":"prometheus","uid":"prometheus"},"refId":"A","expr":"round(sum(increase(kube_pod_container_status_restarts_total{namespace=\"$env\",pod=~\"$pod\",container!=\"\",container!=\"POD\"}[$__range]))) or vector(0)","legendFormat":"__auto","instant":true,"range":false}],"fieldConfig":{"defaults":{"unit":"short","decimals":0,"noValue":"0","thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"#EAB839","value":1},{"color":"red","value":5}]},"color":{"mode":"thresholds"},"mappings":[]},"overrides":[]},"options":{"reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"colorMode":"value","graphMode":"none","textMode":"value","justifyMode":"center","orientation":"auto","wideLayout":true,"showPercentChange":false}},
              {"id":10,"type":"stat","title":"OOMKilled","description":"Containers whose last exit was an OOM kill.","gridPos":{"h":4,"w":4,"x":8,"y":5},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"datasource":{"type":"prometheus","uid":"prometheus"},"refId":"A","expr":"count(kube_pod_container_status_last_terminated_reason{namespace=\"$env\",pod=~\"$pod\",reason=\"OOMKilled\"} == 1) or vector(0)","legendFormat":"__auto","instant":true,"range":false}],"fieldConfig":{"defaults":{"unit":"short","decimals":0,"noValue":"0","thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"red","value":1}]},"color":{"mode":"thresholds"},"mappings":[]},"overrides":[]},"options":{"reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"colorMode":"value","graphMode":"none","textMode":"value","justifyMode":"center","orientation":"auto","wideLayout":true,"showPercentChange":false}},
              {"id":11,"type":"stat","title":"Running Version","description":"Image digest (first 12 hex) of the running app container; Kargo promotes by digest.","gridPos":{"h":4,"w":4,"x":12,"y":5},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"datasource":{"type":"prometheus","uid":"prometheus"},"refId":"A","expr":"max by (version) (label_replace(kube_pod_container_info{namespace=\"$env\",pod=~\"$pod\",container=\"app\"}, \"version\", \"$1\", \"image_spec\", \".*(?:@sha256:|:)([0-9a-f]{12}).*\"))","legendFormat":"{{version}}","instant":true,"range":false}],"fieldConfig":{"defaults":{"unit":"short","decimals":0,"noValue":"—","thresholds":{"mode":"absolute","steps":[{"color":"#5794F2","value":null}]},"color":{"mode":"thresholds"},"mappings":[]},"overrides":[]},"options":{"reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"colorMode":"none","graphMode":"none","textMode":"name","justifyMode":"center","orientation":"auto","wideLayout":true,"showPercentChange":false}},
              {"id":12,"type":"stat","title":"CPU / Request","description":"CPU used over CPU requested.","gridPos":{"h":4,"w":4,"x":16,"y":5},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"datasource":{"type":"prometheus","uid":"prometheus"},"refId":"A","expr":"sum(rate(container_cpu_usage_seconds_total{namespace=\"$env\",pod=~\"$pod\",container!=\"\",container!=\"POD\"}[$__rate_interval])) / sum(kube_pod_container_resource_requests{namespace=\"$env\",pod=~\"$pod\",container!=\"\",container!=\"POD\",resource=\"cpu\"})","legendFormat":"__auto","instant":true,"range":false}],"fieldConfig":{"defaults":{"unit":"percentunit","decimals":0,"noValue":"—","thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"#EAB839","value":0.8},{"color":"red","value":1.2}]},"color":{"mode":"thresholds"},"mappings":[]},"overrides":[]},"options":{"reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"colorMode":"value","graphMode":"none","textMode":"value","justifyMode":"center","orientation":"auto","wideLayout":true,"showPercentChange":false}},
              {"id":13,"type":"stat","title":"Memory / Limit","description":"Working set over the memory limit. Near 100% = next OOM kill.","gridPos":{"h":4,"w":4,"x":20,"y":5},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"datasource":{"type":"prometheus","uid":"prometheus"},"refId":"A","expr":"sum(container_memory_working_set_bytes{namespace=\"$env\",pod=~\"$pod\",container!=\"\",container!=\"POD\"}) / sum(kube_pod_container_resource_limits{namespace=\"$env\",pod=~\"$pod\",container!=\"\",container!=\"POD\",resource=\"memory\"})","legendFormat":"__auto","instant":true,"range":false}],"fieldConfig":{"defaults":{"unit":"percentunit","decimals":0,"noValue":"No limit","thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"#EAB839","value":0.75},{"color":"red","value":0.9}]},"color":{"mode":"thresholds"},"mappings":[]},"overrides":[]},"options":{"reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"colorMode":"value","graphMode":"none","textMode":"value","justifyMode":"center","orientation":"auto","wideLayout":true,"showPercentChange":false}},
