---
# Local Project composition — a product and everything it owns (ADR-0026).
#
#   Organisation → Team → PROJECT → Application → Environment → Release
#
# A project fans out into:
#   • its HOME namespace `<project>`, which is also its Kargo Project: Kargo
#     insists on a namespace named after the project, and the promotion
#     policy (ProjectConfig: dev and test promote themselves, prod never) and
#     the credentials Kargo discovers by label live there;
#   • one Environment per entry of `environments` — a namespaced XR
#     composing namespaced XRs, which Crossplane v2 allows — each a namespace
#     with quota, network boundary and the team's access (admin in dev/test,
#     view in prod: production changes arrive through a Release);
#   • the Argo CD AppProject `<project>`, whose destinations are the home and
#     every environment namespace, and whose sources are the organisation's
#     Gitea repositories (plus `allowedSourceRepos`) — guardrails on WHAT may be
#     deployed WHERE under this project;
#   • optionally the project's own Gitea repository;
#   • the project's SHARED promotion chain: one Kargo Stage per environment,
#     named after it (`dev` → `test` → `prod`), that every Application of the
#     project feeds with its own Warehouse — see "Promotion chain" below;
#   • `status.environments[]`: the resolved {name, namespace, tier} list that
#     the application composition and the paved-road Tasks read, so nobody
#     else ever guesses where an environment lives.
#
# Monitoring needs no per-project wiring: kube-prometheus + the variable-driven
# dashboards auto-cover every new namespace.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: project-local
  labels:
    feature: project
    provider: local
spec:
  compositeTypeRef:
    apiVersion: platform.adhar.io/v1alpha1
    kind: Project
  mode: Pipeline
  pipeline:
    - step: render
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $xr := .observed.composite.resource -}}
            {{- $xrns := $xr.metadata.namespace -}}
            {{- $p := dig "spec" "parameters" dict $xr -}}
            {{- $name := dig "name" $xr.metadata.name $p -}}
            {{- $org := dig "organisation" "adhar" $p -}}
            {{- $team := dig "team" "platform" $p -}}
            {{- $tier := dig "tier" "dev" $p -}}
            {{- $desc := dig "description" "" $p -}}
            {{- /* Quota defaults are CAPS for one environment of one project, which hosts
                   every application of that project: at 4 CPU / 8Gi / 30 pods the default
                   project's dev namespace was full after five small services and refused
                   the sixth's cache ("exceeded quota: dev-quota", 2026-10-17). They must
                   agree with the XRD defaults (project.xrd.yaml, env.xrd.yaml). */ -}}
            {{- $cpu := dig "cpuQuota" "16" $p -}}
            {{- $mem := dig "memoryQuota" "32Gi" $p -}}
            {{- $pods := dig "podQuota" 100 $p -}}
            {{- $repo := dig "createRepository" true $p -}}
            {{- $registry := dig "imageRegistry" "harbor-core.adhar-system.svc.cluster.local/library" $p -}}
            {{- $extraRepos := dig "allowedSourceRepos" (list) $p -}}
            {{- $giteaHost := "gitea-http.adhar-system.svc.cluster.local:3000" -}}
            {{- $prom := "http://prometheus-kube-prometheus-prometheus.adhar-system.svc.cluster.local:9090" -}}
            {{- $ex := "${{" -}}
            {{- /* The project's applications, read as extra resources (requested
                   below). The selector cannot be narrowed by label — an Application
                   created by the console carries none — so every Application is
                   listed and filtered here: same namespace as this Project, naming
                   this Project (`default` means `adhar`, as in the application
                   composition), not being deleted, and with its delivery published
                   (status.delivery, written by compositions/apps/argocd-multienv.yaml
                   once it has observed this project's environments). */ -}}
            {{- $apps := dict -}}
            {{- /* Which of them are Functions (type `function`, or the label
                   adhar.io/workload: function): read from the Application itself, so
                   the application composition's status.delivery — whose schema is
                   strict — needs no new field. Their environment checks are Knative's
                   (the analysis below). */ -}}
            {{- $functions := dict -}}
            {{- range (default (list) (getExtraResources . "applications")) -}}
            {{-   $a := default (dict) .resource -}}
            {{-   $am := default (dict) (get $a "metadata") -}}
            {{-   $ap := dig "spec" "parameters" "project" "adhar" $a -}}
            {{-   if eq $ap "default" }}{{ $ap = "adhar" }}{{ end -}}
            {{-   $d := dig "status" "delivery" (dict) $a -}}
            {{-   if and (eq (get $am "namespace") $xrns) (eq $ap $xr.metadata.name) (not (get $am "deletionTimestamp")) (eq (toString (get $d "promote")) "true") (get $d "image") (get $d "repoURL") -}}
            {{-     $_ := set $apps (get $am "name") $d -}}
            {{-     if or (eq (toString (dig "spec" "parameters" "type" "" $a)) "function") (eq (toString (dig "metadata" "labels" "adhar.io/workload" "" $a)) "function") -}}
            {{-       $_ := set $functions (get $am "name") true -}}
            {{-     end -}}
            {{-   end -}}
            {{- end -}}
            {{- $appNames := keys $apps | sortAlpha -}}
            {{- $verifyApps := list -}}
            {{- range $appNames }}{{ if ne (toString (dig "verification" "enabled" true (get $apps .))) "false" }}{{ $verifyApps = append $verifyApps . }}{{ end }}{{ end -}}
            {{- $envs := dig "environments" (list) $p -}}
            {{- if not $envs -}}
            {{- $envs = list (dict "name" "dev" "tier" "dev" "autoPromote" true) (dict "name" "test" "tier" "test" "autoPromote" true) (dict "name" "prod" "tier" "prod" "autoPromote" false) -}}
            {{- end -}}
            {{- /* Resolve every environment once; the same list feeds the XRs,
                   the AppProject destinations and the status. */ -}}
            {{- $resolved := list -}}
            {{- range $envs -}}
            {{- $e := . -}}
            {{- $en := $e.name -}}
            {{- $et := default $en (get $e "tier") -}}
            {{- $ens := default (printf "%s-%s" $name $en) (get $e "namespace") -}}
            {{- $auto := ternary (get $e "autoPromote") (ne $en "prod") (hasKey $e "autoPromote") -}}
            {{- $access := default (ternary "view" "admin" (eq $en "prod")) (get $e "access") -}}
            {{- $resolved = append $resolved (dict "name" $en "tier" $et "namespace" $ens "autoPromote" $auto "access" $access "cpu" (default $cpu (get $e "cpuQuota")) "mem" (default $mem (get $e "memoryQuota")) "pods" (default $pods (get $e "podQuota"))) -}}
            {{- end -}}
            {{- $labels := dict "platform.adhar.io/self-service" "true" "adhar.io/organisation" $org "adhar.io/team" $team "adhar.io/project" $name -}}
            {{- /*
              A project named after its ORGANISATION shares the organisation's
              home namespace, so composing these three objects here would be a
              SECOND manager of each of them.

              The Organisation composition already emits Namespace/<org>,
              ResourceQuota/<org>-quota and LimitRange/<org>-limits. Live on
              2026-10-14 the platform's own org and project are both `adhar`,
              and every one of the three existed twice:

                Namespace/adhar      owners=[Organisation/adhar] and [Project/adhar]
                ResourceQuota/adhar-quota   likewise
                LimitRange/adhar-limits     likewise

              Two provider-kubernetes Objects managing one target do not merge:
              each reconcile re-applies its own copy, so the quota flips between
              the organisation's numbers and the project's for as long as both
              exist — and the resource page lists each composed object twice.

              The organisation is the authority for its own namespace, so the
              project defers. A project with any other name keeps its own
              namespace exactly as before.
            */ -}}
            {{- if ne $name $org }}
            ---
            # Home namespace = Kargo project namespace.
            apiVersion: kubernetes.m.crossplane.io/v1alpha1
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: namespace
            spec:
              providerConfigRef: { name: kubernetes-provider, kind: ClusterProviderConfig }
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: Namespace
                  metadata:
                    name: {{ $name }}
                    labels:
                      {{- range $k, $v := $labels }}
                      {{ $k }}: {{ $v | quote }}
                      {{- end }}
                      adhar.io/plane: workload
                      adhar.io/tier: {{ $tier | quote }}
                      kargo.akuity.io/project: "true"
            ---
            apiVersion: kubernetes.m.crossplane.io/v1alpha1
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: quota
            spec:
              providerConfigRef: { name: kubernetes-provider, kind: ClusterProviderConfig }
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: ResourceQuota
                  metadata: { name: {{ $name }}-quota, namespace: {{ $name }}, labels: { adhar.io/project: {{ $name | quote }} } }
                  spec:
                    hard:
                      requests.cpu: "{{ $cpu }}"
                      requests.memory: "{{ $mem }}"
                      limits.cpu: "{{ $cpu }}"
                      limits.memory: "{{ $mem }}"
                      pods: "{{ $pods }}"
            ---
            apiVersion: kubernetes.m.crossplane.io/v1alpha1
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: limits
            spec:
              providerConfigRef: { name: kubernetes-provider, kind: ClusterProviderConfig }
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: LimitRange
                  metadata: { name: {{ $name }}-limits, namespace: {{ $name }}, labels: { adhar.io/project: {{ $name | quote }} } }
                  spec:
                    limits:
                      - type: Container
                        default: { cpu: "500m", memory: "512Mi" }
                        defaultRequest: { cpu: "100m", memory: "128Mi" }
            {{- end }}
            ---
            # Team RBAC on the home namespace — the isolation boundary between
            # application teams. `ws-team-<team>` is the Keycloak group the
            # Console creates for a team (Team publishes it on its
            # status); `org-<org>-admin` is the organisation's owner, who reaches
            # every namespace in their tenant. `oidc:` is the apiserver's
            # --oidc-groups-prefix; the realm mapper emits bare names, not paths.
            # Deliberately NOT bound: the plain `org-<org>` membership group —
            # that would make every member an admin of every team.
            apiVersion: kubernetes.m.crossplane.io/v1alpha1
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: team-admin-rbac
            spec:
              providerConfigRef: { name: kubernetes-provider, kind: ClusterProviderConfig }
              forProvider:
                manifest:
                  apiVersion: rbac.authorization.k8s.io/v1
                  kind: RoleBinding
                  metadata:
                    name: {{ printf "%s-team-admin" $name }}
                    namespace: {{ $name }}
                    labels:
                      {{- range $k, $v := $labels }}
                      {{ $k }}: {{ $v | quote }}
                      {{- end }}
                  roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: admin }
                  subjects:
                    - { apiGroup: rbac.authorization.k8s.io, kind: Group, name: {{ printf "oidc:ws-team-%s" $team | quote }} }
                    - { apiGroup: rbac.authorization.k8s.io, kind: Group, name: {{ printf "oidc:org-%s-admin" $org | quote }} }
            ---
            # Network isolation of the home namespace: default-deny ingress, then
            # re-admit the namespace itself and the shared platform (gateway,
            # Prometheus, Loki, Argo CD, admission webhooks). Egress stays open.
            apiVersion: kubernetes.m.crossplane.io/v1alpha1
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: tenant-isolation
            spec:
              providerConfigRef: { name: kubernetes-provider, kind: ClusterProviderConfig }
              forProvider:
                manifest:
                  apiVersion: networking.k8s.io/v1
                  kind: NetworkPolicy
                  metadata:
                    name: {{ printf "%s-tenant-isolation" $name }}
                    namespace: {{ $name }}
                    labels:
                      {{- range $k, $v := $labels }}
                      {{ $k }}: {{ $v | quote }}
                      {{- end }}
                  spec:
                    podSelector: {}
                    policyTypes: [Ingress]
                    ingress:
                      - from:
                          - podSelector: {}
                      - from:
                          - namespaceSelector:
                              matchLabels:
                                kubernetes.io/metadata.name: adhar-system
            {{- range $resolved }}
            ---
            # One environment of the project: an XR composing an XR.
            apiVersion: platform.adhar.io/v1alpha1
            kind: Environment
            metadata:
              name: {{ $name }}-{{ .name }}
              namespace: {{ $xrns }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: env-{{ .name }}
              labels:
                {{- range $k, $v := $labels }}
                {{ $k }}: {{ $v | quote }}
                {{- end }}
                adhar.io/environment: {{ .name | quote }}
            spec:
              parameters:
                name: {{ .namespace }}
                tier: {{ .tier }}
                environment: {{ .name }}
                organisation: {{ $org }}
                team: {{ $team }}
                project: {{ $name }}
                access: {{ .access }}
                cpuQuota: {{ .cpu | quote }}
                memoryQuota: {{ .mem }}
                podQuota: {{ .pods }}
                enableNetworkPolicy: true
            {{- end }}
            ---
            # The project's applications: Crossplane fetches them and calls this
            # function again with them under `applications` (getExtraResources).
            apiVersion: meta.gotemplating.fn.crossplane.io/v1alpha1
            kind: ExtraResources
            requirements:
              applications:
                apiVersion: platform.adhar.io/v1alpha1
                kind: Application
                matchLabels: {}
            ---
            # Kargo: the project's promotion pipeline container. Warehouses are
            # added per application (Application); the Stages are the project's
            # own, one per environment (below).
            apiVersion: kubernetes.m.crossplane.io/v1alpha1
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: kargo-project
            spec:
              providerConfigRef: { name: kubernetes-provider, kind: ClusterProviderConfig }
              forProvider:
                manifest:
                  apiVersion: kargo.akuity.io/v1alpha1
                  kind: Project
                  metadata:
                    name: {{ $name }}
                    labels:
                      {{- range $k, $v := $labels }}
                      {{ $k }}: {{ $v | quote }}
                      {{- end }}
            ---
            # Who may ship where: dev and test promote themselves, prod never
            # does. Selected by the environment LABEL on the project's shared
            # Stages, so the rule is written once per project and applies to every
            # application in it — Kargo auto-promotes each freight ORIGIN (one per
            # application's Warehouse) independently. One object to read, one to
            # audit. Mirrors application/kargo's own promotion-pipeline.yaml.
            apiVersion: kubernetes.m.crossplane.io/v1alpha1
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: kargo-projectconfig
            spec:
              providerConfigRef: { name: kubernetes-provider, kind: ClusterProviderConfig }
              forProvider:
                manifest:
                  apiVersion: kargo.akuity.io/v1alpha1
                  kind: ProjectConfig
                  metadata:
                    name: {{ $name }}
                    namespace: {{ $name }}
                    labels:
                      {{- range $k, $v := $labels }}
                      {{ $k }}: {{ $v | quote }}
                      {{- end }}
                  spec:
                    promotionPolicies:
                      {{- range $resolved }}
                      - stageSelector:
                          matchLabels:
                            adhar.io/environment: {{ .name | quote }}
                        autoPromotionEnabled: {{ .autoPromote }}
                      {{- end }}
            ---
            # Credentials Kargo discovers by label in the project namespace:
            # `git` for cloning/pushing application repositories, `image` for
            # listing Harbor tags. Materialised by ESO from the platform's own
            # Secrets through `platform-delivery`, a ClusterSecretStore that can
            # read only gitea-ci-creds and harbor-push and serves only workload
            # and preview namespaces, so no composition ever copies a password
            # and a tenant cannot reach any other platform Secret through it.
            apiVersion: kubernetes.m.crossplane.io/v1alpha1
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: kargo-git-credentials
            spec:
              providerConfigRef: { name: kubernetes-provider, kind: ClusterProviderConfig }
              forProvider:
                manifest:
                  apiVersion: external-secrets.io/v1
                  kind: ExternalSecret
                  metadata:
                    name: kargo-git
                    namespace: {{ $name }}
                    labels: { adhar.io/project: {{ $name | quote }} }
                  spec:
                    refreshInterval: 1h
                    secretStoreRef: { kind: ClusterSecretStore, name: platform-delivery }
                    target:
                      name: kargo-git
                      template:
                        engineVersion: v2
                        metadata:
                          labels: { kargo.akuity.io/cred-type: git }
                        data:
                          # Kargo >= 1.0 reads `repoURL` (+ `repoURLIsRegex`); the
                          # `repoURLPattern` key of 0.x is ignored silently, so every
                          # promotion push failed with "could not read Username"
                          # while a credential sat right beside it (2026-10-17).
                          repoURL: {{ printf "^http://%s/%s/.*$" $giteaHost $org | quote }}
                          repoURLIsRegex: "true"
                          username: {{ `{{ .username }}` | quote }}
                          password: {{ `{{ .password }}` | quote }}
                    data:
                      - secretKey: username
                        remoteRef: { key: gitea-ci-creds, property: username }
                      - secretKey: password
                        remoteRef: { key: gitea-ci-creds, property: password }
            ---
            # The promotion gate's identity (see the `<app>-resilience` metric in
            # the test environment's AnalysisTemplate). Kargo's controller creates
            # the gate Job here, so it is allowed Jobs in THIS namespace only;
            # the Job runs as this ServiceAccount, which may start the resilience
            # runner in adhar-system and read its result, nothing more.
            apiVersion: kubernetes.m.crossplane.io/v1alpha1
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: resilience-gate-sa
            spec:
              providerConfigRef: { name: kubernetes-provider, kind: ClusterProviderConfig }
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: ServiceAccount
                  metadata:
                    name: adhar-resilience-gate
                    namespace: {{ $name }}
                    labels: { adhar.io/project: {{ $name | quote }} }
            ---
            apiVersion: kubernetes.m.crossplane.io/v1alpha1
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: resilience-gate-kargo-jobs
            spec:
              providerConfigRef: { name: kubernetes-provider, kind: ClusterProviderConfig }
              forProvider:
                manifest:
                  apiVersion: rbac.authorization.k8s.io/v1
                  kind: RoleBinding
                  metadata:
                    name: adhar-kargo-verification-jobs
                    namespace: {{ $name }}
                    labels: { adhar.io/project: {{ $name | quote }} }
                  roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: adhar-kargo-verification-jobs}
                  subjects:
                    - {kind: ServiceAccount, name: kargo-controller, namespace: adhar-system}
            ---
            apiVersion: kubernetes.m.crossplane.io/v1alpha1
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: resilience-gate-runner
            spec:
              providerConfigRef: { name: kubernetes-provider, kind: ClusterProviderConfig }
              forProvider:
                manifest:
                  apiVersion: rbac.authorization.k8s.io/v1
                  kind: RoleBinding
                  metadata:
                    name: {{ printf "adhar-resilience-gate-%s" $name | trunc 63 | trimSuffix "-" }}
                    namespace: adhar-system
                    labels: { adhar.io/project: {{ $name | quote }} }
                  roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: adhar-resilience-gate}
                  subjects:
                    - {kind: ServiceAccount, name: adhar-resilience-gate, namespace: {{ $name }}}
            ---
            # The identity a Release uses to submit a Promotion. A Promotion must be
            # CREATED (a POST): Kargo's webhook renames every Promotion to
            # <stage>.<ulid>.<freight>, and an apply by name over that rename leaves
            # a ghost stored under the old key that Kargo never reconciles (Azure,
            # 2026-10-17). So the Release composition runs a one-shot Job as this
            # ServiceAccount instead of composing the Promotion directly; the Role
            # is the least Kargo's webhook accepts (`promote` on the Stage is what
            # it checks for the creating actor).
            apiVersion: kubernetes.m.crossplane.io/v1alpha1
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: release-sa
            spec:
              providerConfigRef: { name: kubernetes-provider, kind: ClusterProviderConfig }
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: ServiceAccount
                  metadata:
                    name: adhar-release
                    namespace: {{ $name }}
                    labels: { adhar.io/project: {{ $name | quote }} }
            ---
            apiVersion: kubernetes.m.crossplane.io/v1alpha1
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: release-role
            spec:
              providerConfigRef: { name: kubernetes-provider, kind: ClusterProviderConfig }
              forProvider:
                manifest:
                  apiVersion: rbac.authorization.k8s.io/v1
                  kind: Role
                  metadata:
                    name: adhar-release
                    namespace: {{ $name }}
                    labels: { adhar.io/project: {{ $name | quote }} }
                  rules:
                    - apiGroups: [kargo.akuity.io]
                      resources: [promotions]
                      verbs: [create, get, list, watch]
                    - apiGroups: [kargo.akuity.io]
                      resources: [stages]
                      verbs: [get, list, promote]
                    - apiGroups: [kargo.akuity.io]
                      resources: [freights]
                      verbs: [get, list]
            ---
            apiVersion: kubernetes.m.crossplane.io/v1alpha1
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: release-rolebinding
            spec:
              providerConfigRef: { name: kubernetes-provider, kind: ClusterProviderConfig }
              forProvider:
                manifest:
                  apiVersion: rbac.authorization.k8s.io/v1
                  kind: RoleBinding
                  metadata:
                    name: adhar-release
                    namespace: {{ $name }}
                    labels: { adhar.io/project: {{ $name | quote }} }
                  roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: adhar-release }
                  subjects:
                    - kind: ServiceAccount
                      name: adhar-release
                      namespace: {{ $name }}
            ---
            apiVersion: kubernetes.m.crossplane.io/v1alpha1
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: kargo-image-credentials
            spec:
              providerConfigRef: { name: kubernetes-provider, kind: ClusterProviderConfig }
              forProvider:
                manifest:
                  apiVersion: external-secrets.io/v1
                  kind: ExternalSecret
                  metadata:
                    name: kargo-image
                    namespace: {{ $name }}
                    labels: { adhar.io/project: {{ $name | quote }} }
                  spec:
                    refreshInterval: 1h
                    secretStoreRef: { kind: ClusterSecretStore, name: platform-delivery }
                    target:
                      name: kargo-image
                      template:
                        engineVersion: v2
                        metadata:
                          labels: { kargo.akuity.io/cred-type: image }
                        data:
                          repoURL: {{ printf "^%s/.*$" $registry | quote }}
                          repoURLIsRegex: "true"
                          username: {{ `{{ .username }}` | quote }}
                          password: {{ `{{ .password }}` | quote }}
                    data:
                      - secretKey: username
                        remoteRef: { key: harbor-push, property: username }
                      - secretKey: password
                        remoteRef: { key: harbor-push, property: password }
            ---
            # Argo CD AppProject — deployment guardrails scoped to this project:
            # only the organisation's repositories, only into this project's
            # namespaces.
            apiVersion: kubernetes.m.crossplane.io/v1alpha1
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: appproject
            spec:
              providerConfigRef: { name: kubernetes-provider, kind: ClusterProviderConfig }
              forProvider:
                manifest:
                  apiVersion: argoproj.io/v1alpha1
                  kind: AppProject
                  metadata:
                    name: {{ $name }}
                    namespace: adhar-system
                    labels:
                      {{- range $k, $v := $labels }}
                      {{ $k }}: {{ $v | quote }}
                      {{- end }}
                  spec:
                    description: {{ printf "%s / %s / %s%s" $org $team $name (ternary (printf " — %s" $desc) "" (ne $desc "")) | quote }}
                    sourceRepos:
                      - {{ printf "http://%s/%s/*" $giteaHost $org | quote }}
                      # The public host is the platform's seed-time convention; the
                      # controller rewrites it to the real domain when the stack is seeded.
                      - {{ printf "https://gitea.adhar.localtest.me:8443/%s/*" $org | quote }}
                      {{- range $extraRepos }}
                      - {{ . | quote }}
                      {{- end }}
                    destinations:
                      - server: https://kubernetes.default.svc
                        namespace: {{ $name }}
                      {{- range $resolved }}
                      - server: https://kubernetes.default.svc
                        namespace: {{ .namespace }}
                      {{- end }}
                    clusterResourceWhitelist: []
                    namespaceResourceWhitelist:
                      - group: "*"
                        kind: "*"
            {{- /*
              Promotion chain — ONE per project, shared by every application in it.

              One Kargo Stage per project environment, named after the environment
              (`dev`, `test`, `prod`) and chained in the project's order: the first
              takes freight straight from the Warehouses, each next one only freight
              VERIFIED in the previous Stage. Each Stage requests freight from every
              application's Warehouse `<app>` (one requestedFreight origin per
              application). Kargo promotes one piece of freight — so one application —
              at a time and auto-promotes every origin on its own, so applications
              still move independently through the same three environments.

              The promotion steps are per application, gated on the freight's origin
              (`if: ctx.targetFreight.origin.name == '<app>'`): clone the app's repo,
              set its image DIGEST in `<path>/envs/<env>`, commit "[skip ci]", push,
              and have Argo CD sync `<project>-<app>-<env>` to that commit (that Argo
              CD Application authorises `<project>:<env>`).

              Verification cannot follow the origin — Kargo gives an AnalysisRun only
              ctx.project/ctx.stage — so each environment has ONE AnalysisTemplate
              `<env>-health` with metrics per application, each written so that an
              application not (yet) deployed there passes: no Rollout that is not
              Healthy/Completed, no pod not Ready, no restart over 5m, and the app's
              own error-rate query. Per-application interval/count/failureLimit are
              kept. Consequence, by design: a broken application holds the whole
              environment back until it is fixed — the environment is shared.

              Applications whose `promotion.enabled` is false, or that have not yet
              published status.delivery, are left out; with no application at all
              there is no Stage (Kargo requires at least one requested origin).
            */ -}}
            {{- if $appNames }}
            {{- $prevEnv := "" -}}
            {{- range $resolved }}
            {{- $en := .name -}}
            {{- $ens := .namespace -}}
            {{- $tier := .tier -}}
            {{- if $verifyApps }}
            ---
            # What "healthy in this environment" means, asked of Prometheus after
            # every promotion into it. Kargo marks the Stage's freight verified only
            # when every metric passes on every sample, and the next Stage requests
            # only VERIFIED freight — so dev's measured health decides whether test
            # gets a build, without anyone clicking; prod still waits for a Release.
            apiVersion: kubernetes.m.crossplane.io/v1alpha1
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: analysis-{{ $en }}
              labels: {feature: project, managed-by: adhar, adhar.io/environment: {{ quote $en }}}
            spec:
              providerConfigRef: { name: kubernetes-provider, kind: ClusterProviderConfig }
              forProvider:
                manifest:
                  apiVersion: argoproj.io/v1alpha1
                  kind: AnalysisTemplate
                  metadata:
                    name: {{ quote (printf "%s-health" $en) }}
                    namespace: {{ $name }}
                    labels:
                      {{- range $k, $v := $labels }}
                      {{ $k }}: {{ $v | quote }}
                      {{- end }}
                      adhar.io/environment: {{ quote $en }}
                      adhar.io/stage-scope: project
                  spec:
                    metrics:
                      {{- range $verifyApps }}
                      {{- $app := . -}}
                      {{- $v := dig "verification" (dict) (get $apps $app) -}}
                      {{- $vi := default "60s" (get $v "interval") -}}
                      {{- /* 8 samples, a minute apart, after the 2m delay: the run spans the
                             settle window below, so a release still unhealthy at
                             its end fails on the last two samples (failureLimit 1). */ -}}
                      {{- $vc := int (default 8 (get $v "count")) -}}
                      {{- $vf := int (default 1 (get $v "failureLimit")) -}}
                      {{- /* Verification starts the moment the promotion is synced,
                             while the new pod may still be pulling its image and
                             booting — a JVM on a busy node took ~4 minutes, so
                             its first two samples failed and `failureLimit: 1`
                             failed the Stage although nothing was wrong
                             (2026-10-21). A Rollout that is really stuck is still
                             unhealthy after this delay and still fails. */ -}}
                      {{- $vd := default "2m" (get $v "initialDelay") -}}
                      {{- /* How long a release may legitimately be in flight. A
                             canary is SUPPOSED to be not-Healthy while it walks
                             its steps, and a booting pod is SUPPOSED to be not
                             ready: a JVM canary (two ~100 s boots and two 30 s
                             pauses) was still Paused at every sample after the
                             2m delay above, and failed verification in test with
                             nothing wrong (my-service, DigitalOcean 2026-10-22;
                             that canary took over 6 minutes on a busy node).
                             So these checks fail on what a BROKEN release looks
                             like — Degraded, or still not Healthy after the whole
                             window; a pod still not ready once it is older than
                             it — never on a release that is merely in progress. */ -}}
                      {{- $vs := int (default 480 (get $v "settleSeconds")) -}}
                      {{- $pods := printf "%s-[a-z0-9]+-[a-z0-9]+" $app }}
                      {{- if get $functions $app }}
                      {{- /* A FUNCTION (Knative). It has no Rollout, so rollout_info says
                             nothing, and its pods are revisions named
                             <app>-<5-digit generation>-deployment-<rs>-<pod>, which the
                             <app>-<rs>-<pod> pattern never matches: every check passed
                             without measuring anything. And it legitimately has NO pod
                             while scaled to zero, so each check below passes on silence
                             and fails only on evidence that the release is broken. */ -}}
                      {{- $kpods := printf "%s-[0-9]{5}-deployment-[a-z0-9]+-[a-z0-9]+" $app -}}
                      {{- $argoApp := printf "%s-%s-%s" $name $app $en }}
                      # The Function's own verdict: Argo CD's health check for
                      # platform.adhar.io/Function reads its ServiceReady/EdgeReady
                      # conditions (Degraded = Knative gave up on the revision, or the
                      # host is claimed elsewhere). Degraded fails now; anything but
                      # Healthy for the whole settle window fails too.
                      - name: {{ quote (printf "%s-function-healthy" $app) }}
                        initialDelay: {{ $vd }}
                        interval: {{ $vi }}
                        count: {{ $vc }}
                        failureLimit: {{ $vf }}
                        successCondition: result[0] < 1
                        provider:
                          prometheus:
                            address: {{ $prom }}
                            query: {{ quote (printf "(count(argocd_app_info{name=\"%s\",health_status=\"Degraded\"} == 1) or vector(0)) + min_over_time(((count(argocd_app_info{name=\"%s\",health_status!=\"Healthy\"} == 1)) or vector(0))[%ds:30s])" $argoApp $argoApp $vs) }}
                      # A revision pod still not Ready once older than the settle
                      # window. Pods Knative is terminating (scale-down) are not counted.
                      - name: {{ quote (printf "%s-pods-ready" $app) }}
                        initialDelay: {{ $vd }}
                        interval: {{ $vi }}
                        count: {{ $vc }}
                        failureLimit: {{ $vf }}
                        successCondition: result[0] < 1
                        provider:
                          prometheus:
                            address: {{ $prom }}
                            query: {{ quote (printf "count((kube_pod_status_ready{namespace=\"%s\",pod=~\"%s\",condition=\"false\"} == 1) and on(namespace, pod) ((time() - kube_pod_created{namespace=\"%s\",pod=~\"%s\"}) > %d) unless on(namespace, pod) kube_pod_deletion_timestamp{namespace=\"%s\",pod=~\"%s\"}) or vector(0)" $ens $kpods $ens $kpods $vs $ens $kpods) }}
                      # A crash loop: any restart of a revision's containers.
                      - name: {{ quote (printf "%s-no-restarts" $app) }}
                        initialDelay: {{ $vd }}
                        interval: {{ $vi }}
                        count: {{ $vc }}
                        failureLimit: {{ $vf }}
                        successCondition: result[0] < 1
                        provider:
                          prometheus:
                            address: {{ $prom }}
                            query: {{ quote (printf "sum(increase(kube_pod_container_status_restarts_total{namespace=\"%s\",pod=~\"%s\",container!=\"POD\"}[5m])) or vector(0)" $ens $kpods) }}
                      # 5xx share, unless the application names its own query: what
                      # Knative's activator answered for this function (it fronts a
                      # function scaled to zero and one with little spare capacity;
                      # knative-serving's ServiceMonitor scrapes it). No traffic is
                      # no evidence, and passes.
                      - name: {{ quote (printf "%s-error-rate" $app) }}
                        initialDelay: {{ $vd }}
                        interval: {{ $vi }}
                        count: {{ $vc }}
                        failureLimit: {{ $vf }}
                        successCondition: {{ quote (printf "result[0] < %v" (default 0.01 (get $v "errorRateThreshold"))) }}
                        provider:
                          prometheus:
                            address: {{ $prom }}
                            {{- with (get $v "errorRateQuery") }}
                            query: {{ quote (replace "$NAMESPACE" $ens .) }}
                            {{- else }}
                            query: {{ quote (printf "(sum(rate(http_server_request_duration_seconds_count{job=\"activator\",k8s_namespace_name=\"%s\",kn_service_name=\"%s\",http_response_status_code=~\"5..\"}[5m])) / (sum(rate(http_server_request_duration_seconds_count{job=\"activator\",k8s_namespace_name=\"%s\",kn_service_name=\"%s\"}[5m])) > 0)) or vector(0)" $ens $app $ens $app) }}
                            {{- end }}
                      {{- else }}
                      # Argo Rollouts labels a finished canary "Completed" and a stable one "Healthy".
                      - name: {{ quote (printf "%s-rollout-healthy" $app) }}
                        initialDelay: {{ $vd }}
                        interval: {{ $vi }}
                        count: {{ $vc }}
                        failureLimit: {{ $vf }}
                        successCondition: result[0] < 1
                        provider:
                          prometheus:
                            address: {{ $prom }}
                            query: {{ quote (printf "(count(rollout_info{namespace=\"%s\",name=\"%s\",phase=\"Degraded\"} == 1) or vector(0)) + min_over_time(((count(rollout_info{namespace=\"%s\",name=\"%s\",phase!~\"Healthy|Completed\"} == 1)) or vector(0))[%ds:30s])" $ens $app $ens $app $vs) }}
                      - name: {{ quote (printf "%s-pods-ready" $app) }}
                        initialDelay: {{ $vd }}
                        interval: {{ $vi }}
                        count: {{ $vc }}
                        failureLimit: {{ $vf }}
                        successCondition: result[0] < 1
                        provider:
                          prometheus:
                            address: {{ $prom }}
                            query: {{ quote (printf "count((kube_pod_status_ready{namespace=\"%s\",pod=~\"%s\",condition=\"false\"} == 1) and on(namespace, pod) ((time() - kube_pod_created{namespace=\"%s\",pod=~\"%s\"}) > %d)) or vector(0)" $ens $pods $ens $pods $vs) }}
                      - name: {{ quote (printf "%s-no-restarts" $app) }}
                        initialDelay: {{ $vd }}
                        interval: {{ $vi }}
                        count: {{ $vc }}
                        failureLimit: {{ $vf }}
                        successCondition: result[0] < 1
                        provider:
                          prometheus:
                            address: {{ $prom }}
                            query: {{ quote (printf "sum(increase(kube_pod_container_status_restarts_total{namespace=\"%s\",pod=~\"%s\",container!=\"POD\"}[5m])) or vector(0)" $ens $pods) }}
                      {{- with (get $v "errorRateQuery") }}
                      - name: {{ quote (printf "%s-error-rate" $app) }}
                        initialDelay: {{ $vd }}
                        interval: {{ $vi }}
                        count: {{ $vc }}
                        failureLimit: {{ $vf }}
                        successCondition: {{ quote (printf "result[0] < %v" (default 0.01 (get $v "errorRateThreshold"))) }}
                        provider:
                          prometheus:
                            address: {{ $prom }}
                            query: {{ quote (replace "$NAMESPACE" $ens .) }}
                      {{- end }}
                      {{- end }}
                      {{- /* Not for a Function: the resilience runner's gate mode waits for a
                             Rollout or Deployment named <app> and fails without one, and a
                             Knative Service has neither — so every function would be held in
                             test for ever. Its checks above are its gate until the runner
                             learns Knative workloads. */ -}}
                      {{- if and (eq $tier "test") (not (get $functions $app)) }}
                      # THE PROMOTION GATE. In the environment before prod, a build
                      # is verified only once the application's own load test and
                      # chaos suite pass against it here: this Job starts the
                      # platform's resilience runner in gate mode for this app and
                      # namespace (adhar-scorecards, resilience-runner.yaml) and
                      # exits with its verdict. Prod requests only freight verified
                      # here, so a build that slows down under load or stops
                      # answering when a pod dies never reaches it. An image that
                      # already passed here is not retested; without the
                      # scorecards package the gate passes and says so.
                      - name: {{ quote (printf "%s-resilience" $app) }}
                        provider:
                          job:
                            metadata:
                              labels: {adhar.io/resilience-gate: {{ quote $app }}, adhar.io/environment: {{ quote $en }}}
                            spec:
                              backoffLimit: 0
                              activeDeadlineSeconds: 4200
                              ttlSecondsAfterFinished: 3600
                              template:
                                spec:
                                  serviceAccountName: adhar-resilience-gate
                                  restartPolicy: Never
                                  securityContext: {runAsNonRoot: true, runAsUser: 65532, seccompProfile: {type: RuntimeDefault}}
                                  containers:
                                    - name: gate
                                      image: alpine/k8s:1.31.1
                                      env:
                                        - {name: APP, value: {{ quote $app }}}
                                        - {name: GATE_NAMESPACE, value: {{ quote $ens }}}
                                        - {name: GATE_ENVIRONMENT, value: {{ quote $en }}}
                                        - {name: HOME, value: /tmp}
                                      securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: ["ALL"]}}
                                      resources:
                                        requests: {cpu: 10m, memory: 32Mi}
                                        limits: {cpu: 200m, memory: 128Mi}
                                      command: ["bash", "-c"]
                                      args:
                                        - |
                                          set -uo pipefail
                                          if ! kubectl -n adhar-system get cronjob adhar-resilience-runner >/dev/null 2>&1; then
                                            echo "no resilience runner (adhar-scorecards is not installed); the gate passes"
                                            exit 0
                                          fi
                                          J="adhar-gate-$(printf '%s-%s' "$APP" "$GATE_ENVIRONMENT" | tr -c 'a-z0-9-' '-' | cut -c1-40 | sed 's/-*$//')-$(date +%s | tail -c 6)"
                                          kubectl -n adhar-system get cronjob adhar-resilience-runner -o json \
                                            | jq --arg j "$J" --arg app "$APP" --arg ns "$GATE_NAMESPACE" --arg env "$GATE_ENVIRONMENT" '{
                                                apiVersion: "batch/v1", kind: "Job",
                                                metadata: {name: $j, namespace: "adhar-system",
                                                           labels: {"adhar.io/component": "scorecards", "adhar.io/resilience-gate": $app}},
                                                spec: (.spec.jobTemplate.spec
                                                  | .template.spec.containers[0].env += [
                                                      {name: "VERIFY_APP", value: $app},
                                                      {name: "VERIFY_NAMESPACE", value: $ns},
                                                      {name: "VERIFY_ENVIRONMENT", value: $env}])}' \
                                            | kubectl create -f - || { echo "could not start the resilience runner"; exit 1; }
                                          echo "gate: $APP in $GATE_NAMESPACE (runner job $J)"
                                          ok=""
                                          for i in $(seq 1 400); do
                                            st="$(kubectl -n adhar-system get job "$J" -o jsonpath='{.status.succeeded}/{.status.failed}' 2>/dev/null)"
                                            case "$st" in 1/*) ok=1; break ;; */1) ok=0; break ;; esac
                                            sleep 10
                                          done
                                          kubectl -n adhar-system logs "job/$J" --tail=80 2>/dev/null || true
                                          [ "$ok" = 1 ]
                      {{- end }}
                      {{- end }}
            {{- end }}
            ---
            # The project's Kargo Stage for this environment, shared by every
            # application. Its adhar.io/environment label is what the ProjectConfig
            # promotion policy selects on (dev/test auto, prod manual).
            apiVersion: kubernetes.m.crossplane.io/v1alpha1
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: stage-{{ $en }}
              labels: {feature: project, managed-by: adhar, adhar.io/environment: {{ quote $en }}}
            spec:
              providerConfigRef: { name: kubernetes-provider, kind: ClusterProviderConfig }
              forProvider:
                manifest:
                  apiVersion: kargo.akuity.io/v1alpha1
                  kind: Stage
                  metadata:
                    name: {{ quote $en }}
                    namespace: {{ $name }}
                    labels:
                      {{- range $k, $v := $labels }}
                      {{ $k }}: {{ $v | quote }}
                      {{- end }}
                      adhar.io/environment: {{ quote $en }}
                      adhar.io/stage-scope: project
                  spec:
                    requestedFreight:
                      {{- range $appNames }}
                      {{- $soak := default "0s" (get (get $apps .) "soakTime") }}
                      - origin: {kind: Warehouse, name: {{ quote . }}}
                        sources:
                          {{- if $prevEnv }}
                          stages: [{{ quote $prevEnv }}]
                          {{- if ne $soak "0s" }}
                          requiredSoakTime: {{ $soak }}
                          {{- end }}
                          {{- else }}
                          direct: true
                          {{- end }}
                      {{- end }}
                    {{- if $verifyApps }}
                    verification:
                      analysisTemplates:
                        - name: {{ quote (printf "%s-health" $en) }}
                    {{- end }}
                    promotionTemplate:
                      spec:
                        steps:
                          {{- range $appNames }}
                          {{- $app := . -}}
                          {{- $d := get $apps $app -}}
                          {{- $image := get $d "image" -}}
                          {{- $repoURL := get $d "repoURL" -}}
                          {{- $revision := default "main" (get $d "targetRevision") -}}
                          {{- $path := default "deploy" (get $d "path") -}}
                          {{- $when := printf "%s ctx.targetFreight.origin.name == '%s' }}" $ex $app -}}
                          {{- $digest := printf "%s imageFrom(%q, warehouse(%q)).Digest }}" $ex $image $app }}
                          # ── {{ $app }} ──
                          # The source branch (overlays) and this environment's
                          # RENDERED branch `stage/<env>`, which only promotions
                          # into this environment write. Argo CD syncs the
                          # rendered branch, so a later promotion elsewhere can
                          # never move this environment's revision past the
                          # commit made here (that read as "dev Unhealthy" after
                          # every test promotion while all shared `main`).
                          - uses: git-clone
                            if: {{ quote $when }}
                            config:
                              repoURL: {{ quote $repoURL }}
                              checkout:
                                - {branch: {{ quote $revision }}, path: ./src}
                                - {branch: {{ quote (printf "stage/%s" $en) }}, create: true, path: ./out}
                          - uses: kustomize-set-image
                            if: {{ quote $when }}
                            config:
                              path: {{ quote (printf "./src/%s/envs/%s" $path $en) }}
                              images:
                                # By DIGEST, not tag: the digest is what cosign signed
                                # and it cannot be moved by another build.
                                - image: {{ quote $image }}
                                  digest: {{ quote $digest }}
                          # Replace the branch's content with the rendered overlay.
                          - uses: git-clear
                            if: {{ quote $when }}
                            config:
                              path: ./out
                          - uses: kustomize-build
                            if: {{ quote $when }}
                            config:
                              path: {{ quote (printf "./src/%s/envs/%s" $path $en) }}
                              outPath: ./out/manifests.yaml
                          - uses: git-commit
                            if: {{ quote $when }}
                            config:
                              path: ./out
                              # "[skip ci]" — the app-ci trigger's CEL filter drops
                              # pushes carrying it. A promotion commit that built again
                              # would publish a new digest, which is new freight, which
                              # is another promotion commit: a loop with no end.
                              message: {{ quote (printf "promote(%s): %s %s [skip ci]" $en $app $digest) }}
                          # `as` names the step's outputs: Kargo keys them by this
                          # alias, so the Argo CD step reads the pushed commit by it.
                          - uses: git-push
                            if: {{ quote $when }}
                            as: {{ quote (printf "push-%s" $app) }}
                            config:
                              path: ./out
                              targetBranch: {{ quote (printf "stage/%s" $en) }}
                          # Wait for Argo CD to apply it and the Rollout to go Healthy;
                          # otherwise the downstream Stage promotes off an environment
                          # that has not finished rolling out.
                          - uses: argocd-update
                            if: {{ quote $when }}
                            config:
                              apps:
                                - name: {{ quote (printf "%s-%s-%s" $name $app $en) }}
                                  sources:
                                    - repoURL: {{ quote $repoURL }}
                                      desiredRevision: {{ quote (printf "%s outputs['push-%s'].commit }}" $ex $app) }}
                          {{- end }}
            {{- $prevEnv = $en -}}
            {{- end }}
            {{- end }}
            {{- if $repo }}
            ---
            # The project's Gitea repository, in the organisation (idempotent).
            apiVersion: batch/v1
            kind: Job
            metadata:
              name: {{ $name }}-repo
              namespace: adhar-system
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: repo-job
              labels:
                {{- range $k, $v := $labels }}
                {{ $k }}: {{ $v | quote }}
                {{- end }}
            spec:
              backoffLimit: 4
              ttlSecondsAfterFinished: 600
              template:
                spec:
                  restartPolicy: OnFailure
                  containers:
                    - name: create-repo
                      image: curlimages/curl:8.10.1
                      env:
                        - name: GITEA_USER
                          valueFrom: { secretKeyRef: { name: gitea-credential, key: username } }
                        - name: GITEA_PASSWORD
                          valueFrom: { secretKeyRef: { name: gitea-credential, key: password } }
                        # Payloads as environment variables, never spliced into the shell
                        # string (an apostrophe in a description is an unterminated quote).
                        - name: ORG_PAYLOAD
                          value: {{ dict "username" $org "full_name" $org "visibility" "private" | toJson | quote }}
                        - name: REPO_PAYLOAD
                          value: {{ dict "name" $name "auto_init" true "default_branch" "main" "private" false "description" (printf "Adhar project %s (%s/%s)%s" $name $org $team (ternary (printf " — %s" $desc) "" (ne $desc ""))) | toJson | quote }}
                      command: ["/bin/sh", "-c"]
                      args:
                        - |
                          set -e
                          AUTH="-u $GITEA_USER:$GITEA_PASSWORD -H Content-Type:application/json"
                          API="http://{{ $giteaHost }}/api/v1"
                          ocode=$(curl -s -o /tmp/org -w "%{http_code}" $AUTH -X POST "$API/orgs" -d "$ORG_PAYLOAD")
                          echo "org -> $ocode"; case "$ocode" in 201|422|409) : ;; *) echo "org create failed"; exit 1 ;; esac
                          rcode=$(curl -s -o /tmp/repo -w "%{http_code}" $AUTH -X POST "$API/orgs/{{ $org }}/repos" -d "$REPO_PAYLOAD")
                          echo "repo -> $rcode"; cat /tmp/repo 2>/dev/null || true; echo
                          case "$rcode" in 201|409) echo "repository {{ $org }}/{{ $name }} ready"; exit 0 ;; esac
                          echo "unexpected repo status $rcode"; exit 1
                      resources:
                        requests: { cpu: 10m, memory: 32Mi }
                        limits: { memory: 64Mi }
            {{- end }}
            ---
            apiVersion: platform.adhar.io/v1alpha1
            kind: Project
            status:
              namespace: {{ $name }}
              appProject: {{ $name }}
              kargoProject: {{ $name }}
              organisation: {{ $org }}
              team: {{ $team }}
              imageRegistry: {{ $registry }}
              {{- if $repo }}
              repository: "http://{{ $giteaHost }}/{{ $org }}/{{ $name }}.git"
              {{- end }}
              environments:
                {{- range $resolved }}
                - name: {{ .name }}
                  namespace: {{ .namespace }}
                  tier: {{ .tier }}
                  autoPromote: {{ .autoPromote }}
                  {{- if $appNames }}
                  stage: {{ .name }}
                  {{- end }}
                {{- end }}
              # The applications the shared promotion chain currently promotes.
              {{- if $appNames }}
              applications:
                {{- range $appNames }}
                - {{ quote . }}
                {{- end }}
              {{- else }}
              applications: []
              {{- end }}
              phase: Provisioned
    - step: ready
      functionRef:
        name: function-auto-ready
