# Civo K3s runs under LegacyCluster scope (CONVENTIONS.md §3):
# the community provider-civo has no namespaced (.m) MRs, so its managed
# resources stay cluster-scoped and reference the plain legacy ProviderConfig
# (name: civo) with no providerConfigRef kind field.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: compositecluster-civo-k3s
  labels:
    feature: cluster
    provider: civo
spec:
  compositeTypeRef:
    apiVersion: platform.adhar.io/v1alpha1
    kind: CompositeCluster
  mode: Pipeline
  pipeline:
    - step: render-civo
      functionRef:
        name: function-go-templating
      input:
        apiVersion: templating.fn.crossplane.io/v1beta1
        kind: Template
        spec:
          template: |
            {{- $xr := .observed.composite.resource -}}
            {{- $params := $xr.spec.parameters -}}
            {{- $providerSettings := default (dict) $params.providerSettings -}}
            {{- $civo := default (dict) (get $providerSettings "civo") -}}
            {{- $conn := default (dict) $xr.spec.writeConnectionSecretToRef -}}
            {{- $secretName := default (printf "%s-kubeconfig" $xr.metadata.name) (get $conn "name") -}}
            {{- $secretNamespace := default "crossplane-system" (get $conn "namespace") -}}
            {{- $providerConfig := dig "spec" "providerConfigRef" "name" "civo" $xr -}}
            {{- $pools := $params.nodePools -}}
            {{- $applications := default (list) (get $civo "applications") -}}
            {{- $cni := get $civo "cni" -}}
            {{- $publicIPDefault := get $civo "publicIPNodePool" -}}
            {{- $clusterVersion := default $params.version (get $civo "version") -}}
            {{- $secretPrefix := default $xr.metadata.name (get $civo "connectionSecretNamePrefix") -}}
            {{- $secretNS := default $secretNamespace (get $civo "connectionSecretNamespace") -}}
            apiVersion: fn.crossplane.io/v1beta1
            kind: FunctionIO
            desired:
              resources:
                - name: civo-cluster
                  resource:
                    apiVersion: cluster.civo.crossplane.io/v1alpha1
                    kind: CivoKubernetes
                    metadata:
                      labels:
                        feature: cluster
                        provider: civo
                    spec:
                      forProvider:
                        name: {{ quote (default $xr.metadata.name $params.displayName) }}
                        pools:
                        {{- range $index, $pool := $pools }}
                          - size: {{ quote $pool.instanceType }}
                            count: {{ default 1 $pool.count }}
                            {{- if $pool.regionOverride }}
                            region: {{ quote $pool.regionOverride }}
                            {{- else }}
                            region: {{ quote $params.region }}
                            {{- end }}
                            {{- if (or $pool.taints $publicIPDefault $pool.publicIPNodePool $pool.labels) }}
                            {{- if $pool.labels }}
                            labels:
                            {{- range $k, $v := $pool.labels }}
                              {{ $k }}: {{ quote $v }}
                            {{- end }}
                            {{- end }}
                            {{- if $pool.taints }}
                            taints:
                            {{- range $pool.taints }}
                              - key: {{ quote .key }}
                                value: {{ quote (default "" .value) }}
                                effect: {{ quote .effect }}
                            {{- end }}
                            {{- else }}
                            taints: []
                            {{- end }}
                            {{- if $pool.publicIPNodePool }}
                            public_ip_node_pool: true
                            {{- else if $publicIPDefault }}
                            public_ip_node_pool: true
                            {{- end }}
                            {{- else }}
                            taints: []
                            {{- end }}
                        {{- end }}
                        {{- if $applications }}
                        applications:
                        {{- range $applications }}
                          - {{ quote . }}
                        {{- end }}
                        {{- end }}
                        {{- if $clusterVersion }}
                        version: {{ quote $clusterVersion }}
                        {{- end }}
                        {{- if $cni }}
                        cni: {{ quote $cni }}
                        {{- end }}
                        connectionDetails:
                          connectionSecretNamePrefix: {{ quote $secretPrefix }}
                          connectionSecretNamespace: {{ quote $secretNS }}
                      {{- if $providerConfig }}
                      providerConfigRef:
                        name: {{ quote $providerConfig }}
                      {{- end }}
                      writeConnectionSecretToRef:
                        name: {{ quote $secretName }}
                        namespace: {{ quote $secretNamespace }}
                      deletionPolicy: {{ default "Delete" $params.deletionPolicy }}
    # ArgoCD auto-registration (roadmap P2.1): parse the kubeconfig from the
    # cluster's connection details and publish an ArgoCD cluster Secret in
    # adhar-system. Uses the credentials embedded in the provider-issued
    # kubeconfig (client certificates or bearer token).
    - step: register-argocd
      functionRef:
        name: function-go-templating
      input:
        apiVersion: templating.fn.crossplane.io/v1beta1
        kind: Template
        spec:
          template: |
            {{- $xr := .observed.composite.resource -}}
            {{- $observed := default (dict) .observed.resources -}}
            {{- $conn := dig "civo-cluster" "connectionDetails" (dict) $observed -}}
            {{- $raw := coalesce (get $conn "kubeconfig") (get $conn "attribute.kube_config_raw") -}}
            apiVersion: fn.crossplane.io/v1beta1
            kind: FunctionIO
            desired:
              resources:
                {{- if $raw }}
                {{- $kc := fromYaml (b64dec $raw) }}
                {{- $clusters := dig "clusters" (list) $kc }}
                {{- $users := dig "users" (list) $kc }}
                {{- if and $clusters $users }}
                {{- $cluster0 := dig "cluster" (dict) (index $clusters 0) }}
                {{- $user0 := dig "user" (dict) (index $users 0) }}
                {{- $server := dig "server" "" $cluster0 }}
                {{- $caData := dig "certificate-authority-data" "" $cluster0 }}
                {{- $certData := dig "client-certificate-data" "" $user0 }}
                {{- $keyData := dig "client-key-data" "" $user0 }}
                {{- $token := dig "token" "" $user0 }}
                {{- if $server }}
                - name: argocd-cluster-registration
                  resource:
                    apiVersion: kubernetes.m.crossplane.io/v1alpha1
                    kind: Object
                    metadata:
                      labels:
                        feature: cluster
                        provider: civo
                        adhar.io/argocd-registration: "true"
                    spec:
                      forProvider:
                        manifest:
                          apiVersion: v1
                          kind: Secret
                          metadata:
                            name: cluster-{{ $xr.metadata.name }}
                            namespace: adhar-system
                            labels:
                              argocd.argoproj.io/secret-type: cluster
                              adhar.io/cluster: {{ quote $xr.metadata.name }}
                          type: Opaque
                          stringData:
                            name: {{ quote $xr.metadata.name }}
                            server: {{ quote $server }}
                            config: |
                              {{- if $token }}
                              {"bearerToken": {{ quote $token }}, "tlsClientConfig": {"caData": {{ quote $caData }}}}
                              {{- else }}
                              {"tlsClientConfig": {"caData": {{ quote $caData }}, "certData": {{ quote $certData }}, "keyData": {{ quote $keyData }}}}
                              {{- end }}
                      providerConfigRef:
                        name: kubernetes-provider
                        kind: ClusterProviderConfig
                {{- end }}
                {{- end }}
                {{- end }}
