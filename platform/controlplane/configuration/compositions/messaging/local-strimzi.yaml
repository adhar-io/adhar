---
# Local Kafka composition — provisions a single-node Strimzi Kafka (KRaft, no
# ZooKeeper) in the requester's namespace. The Strimzi cluster operator watches
# all namespaces (STRIMZI_NAMESPACE=*), so the Kafka reconciles wherever the XR
# lives. Selected via the `provider: local, engine: kafka` labels / compositionRef.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: messaging-local-strimzi
  labels:
    feature: messaging
    provider: local
    engine: kafka
spec:
  compositeTypeRef:
    apiVersion: platform.adhar.io/v1alpha1
    kind: Messaging
  mode: Pipeline
  pipeline:
    - step: render
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $xr := .observed.composite.resource -}}
            {{- $name := $xr.metadata.name -}}
            {{- $ns := $xr.metadata.namespace -}}
            {{- $spec := $xr.spec -}}
            {{- $version := dig "kafkaVersion" "4.3.1" $spec -}}
            {{- $size := dig "storageSize" "2Gi" $spec -}}
            ---
            # JMX Prometheus exporter rules — feeds the Kafka Grafana dashboards.
            apiVersion: v1
            kind: ConfigMap
            metadata:
              name: {{ $name }}-metrics
              namespace: {{ $ns }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: kafka-metrics-cm
                # A ConfigMap has no status. function-auto-ready reads a Ready
                # condition, finds none, and holds the Messaging unready forever.
                gotemplating.fn.crossplane.io/ready: "True"
            data:
              kafka-metrics-config.yml: |
                lowercaseOutputName: true
                rules:
                  - pattern: "kafka.server<type=(.+), name=(.+)PerSec\\w*><>Count"
                    name: "kafka_server_$1_$2_total"
                    type: COUNTER
                  - pattern: "kafka.server<type=(.+), name=(.+)><>Value"
                    name: "kafka_server_$1_$2"
                    type: GAUGE
                  - pattern: "kafka.controller<type=(.+), name=(.+)><>Value"
                    name: "kafka_controller_$1_$2"
                    type: GAUGE
                  - pattern: "kafka.network<type=(.+), name=(.+)><>Value"
                    name: "kafka_network_$1_$2"
                    type: GAUGE
                  - pattern: "kafka.log<type=(.+), name=(.+)><>Value"
                    name: "kafka_log_$1_$2"
                    type: GAUGE
            ---
            apiVersion: kafka.strimzi.io/v1
            kind: KafkaNodePool
            metadata:
              name: {{ $name }}-pool
              namespace: {{ $ns }}
              labels:
                strimzi.io/cluster: {{ $name }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: kafka-pool
                # Strimzi writes NO conditions on a KafkaNodePool (its readiness is
                # the Kafka cluster's, which auto-ready does read), so without
                # this the Messaging never becomes Ready and the Argo CD app that
                # asked for it stays Degraded with a running broker.
                gotemplating.fn.crossplane.io/ready: "True"
            spec:
              replicas: 1
              roles: [controller, broker]
              # Explicit, because the broker otherwise inherits whatever LimitRange
              # the namespace carries: in an environment namespace that is a 512Mi
              # default limit, Strimzi sizes the heap from the limit, and the log
              # cleaner's 128 MB dedupe buffer alone pushed it into
              # "java.lang.OutOfMemoryError: Java heap space" on every start —
              # exit 1, CrashLoopBackOff, while the SAME composition in
              # adhar-system (no LimitRange) ran fine (2026-10-17). The request
              # stays small; the limit and -Xmx are what a one-node KRaft broker
              # needs to start.
              resources:
                requests: {cpu: 200m, memory: 768Mi}
                limits: {memory: 1536Mi}
              jvmOptions:
                -Xms: 512m
                -Xmx: 1024m
              storage:
                type: persistent-claim
                size: {{ $size }}
                deleteClaim: true
            ---
            apiVersion: kafka.strimzi.io/v1
            kind: Kafka
            metadata:
              name: {{ $name }}
              namespace: {{ $ns }}
              annotations:
                strimzi.io/kraft: enabled
                strimzi.io/node-pools: enabled
                gotemplating.fn.crossplane.io/composition-resource-name: kafka-cluster
            spec:
              kafka:
                version: "{{ $version }}"
                listeners:
                  - name: plain
                    port: 9092
                    type: internal
                    tls: false
                config:
                  offsets.topic.replication.factor: 1
                  transaction.state.log.replication.factor: 1
                  transaction.state.log.min.isr: 1
                  default.replication.factor: 1
                  min.insync.replicas: 1
                  # A one-node team broker does not need Kafka's 128 MB per-thread
                  # dedupe buffer for log compaction; 32 MB keeps the heap small.
                  log.cleaner.dedupe.buffer.size: 33554432
                metricsConfig:
                  type: jmxPrometheusExporter
                  valueFrom:
                    configMapKeyRef:
                      name: {{ $name }}-metrics
                      key: kafka-metrics-config.yml
              entityOperator:
                topicOperator: {}
                userOperator: {}
              # kafka-exporter feeds the kafka-exporter dashboard (topic/consumer lag).
              kafkaExporter:
                topicRegex: ".*"
                groupRegex: ".*"
            ---
            # PodMonitor so kube-prometheus scrapes the JMX + kafka-exporter ports
            # of every composed Kafka; the Kafka dashboards are cluster-var driven.
            apiVersion: monitoring.coreos.com/v1
            kind: PodMonitor
            metadata:
              name: {{ $name }}-kafka
              namespace: {{ $ns }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: kafka-podmonitor
                # A PodMonitor has no status either.
                gotemplating.fn.crossplane.io/ready: "True"
              labels:
                strimzi.io/cluster: {{ $name }}
            spec:
              selector:
                matchLabels:
                  strimzi.io/cluster: {{ $name }}
              podMetricsEndpoints:
                - path: /metrics
                  port: tcp-prometheus
                  relabelings:
                    - action: labelmap
                      regex: "__meta_kubernetes_pod_label_(.+)"
            {{- range dig "topics" (list) $spec }}
            {{- /* An unnamed topic must fail HERE, by name, not as an apiserver
                   rejection of a KafkaTopic called `topic-<no value>` that takes
                   the Kafka cluster down with it. The XRD requires the field too;
                   this covers an XRD a cluster has not received yet. */}}
            {{- if not (dig "name" "" .) }}
            {{- fail (printf "messaging/%s: every entry in spec.topics needs a non-empty name" $name) }}
            {{- end }}
            ---
            apiVersion: kafka.strimzi.io/v1
            kind: KafkaTopic
            metadata:
              # The OBJECT is named after its cluster; the Kafka topic keeps the
              # name the team asked for (spec.topicName). Two Messaging XRs in one
              # namespace both asking for a topic called "events" otherwise
              # compose the same object and fight over it ("Only one reference
              # can have Controller set to true", 2026-10-17) — the second
              # team's topic never exists and its XR never becomes Ready.
              name: {{ $name }}-{{ .name }}
              namespace: {{ $ns }}
              labels:
                strimzi.io/cluster: {{ $name }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: topic-{{ .name }}
            spec:
              topicName: {{ .name }}
              partitions: {{ dig "partitions" 3 . }}
              replicas: {{ dig "replicas" 1 . }}
            {{- end }}
    - step: ready
      functionRef:
        name: function-auto-ready
