apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: compositegitops-argocd
  labels:
    feature: gitops
spec:
  compositeTypeRef:
    apiVersion: platform.adhar.io/v1alpha1
    kind: CompositeGitOps
  mode: Pipeline
  pipeline:
    - step: render-gitops
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $xr := .observed.composite.resource -}}
            {{- $params := $xr.spec.parameters -}}
            {{- $project := default (dict) $params.project -}}
            {{- $appsets := default (list) $params.applicationSets -}}
            {{- $conn := default (dict) $xr.spec.writeConnectionSecretToRef -}}
            {{- $secretName := default (printf "%s-gitops" $xr.metadata.name) (get $conn "name") -}}
            {{- $secretNamespace := default "adhar-system" (get $conn "namespace") -}}
            {{- $providerConfig := dig "spec" "providerConfigRef" "name" "kubernetes-provider" $xr -}}
            {{- /* sprig's generic map has no Helm-only `required`; `fail` is the
                   supported equivalent in function-go-templating. */ -}}
            {{- $projectName := get $project "name" -}}
            {{- if not $projectName }}{{ fail "project.name must be provided" }}{{ end -}}
            {{- $observedResources := default (dict) .observed.resources -}}
            {{- $projectObserved := default (dict) (get $observedResources "argocd-project") -}}
            {{- $projectResource := default (dict) (get $projectObserved "resource") -}}
            {{- $projectStatus := default (dict) (get $projectResource "status") -}}
            {{- $projectConditions := default (list) (get $projectStatus "conditions") -}}
            {{- $projectHealthy := false -}}
            {{- if gt (len $projectConditions) 0 -}}
            {{-   $projectHealthy = eq (default "" (get (default (dict) (index $projectConditions 0)) "status")) "True" -}}
            {{- end -}}
            {{- $messages := list }}
            {{- range $projectConditions }}
              {{- if (get . "message") }}
                {{- $messages = append $messages (get . "message") -}}
              {{- end }}
            {{- end }}
            {{- $joinedMessages := join "; " $messages -}}
            ---
            apiVersion: kubernetes.m.crossplane.io/v1alpha1
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: argocd-project
              labels:
                feature: gitops
                managed-by: adhar
            spec:
              forProvider:
                manifest:
                  apiVersion: argoproj.io/v1alpha1
                  kind: AppProject
                  metadata:
                    name: {{ quote $projectName }}
                    namespace: adhar-system
                    labels:
                      adhar.io/gitops: {{ quote $xr.metadata.name }}
                  spec:
                    description: {{ quote (default "" (get $project "description")) }}
                    sourceRepos:
                    {{- if (get $project "sourceRepos") }}
                      {{- range (get $project "sourceRepos") }}
                      - {{ quote . }}
                      {{- end }}
                    {{- else }}
                      - '*'
                    {{- end }}
                    destinations:
                    {{- if (get $project "destinations") }}
                      {{- range (get $project "destinations") }}
                      - namespace: {{ quote (default "*" .namespace) }}
                        server: {{ quote (default "*" .server) }}
                      {{- end }}
                    {{- else }}
                      - namespace: '*'
                        server: '*'
                    {{- end }}
                    {{- if (get $project "clusterResourceWhitelist") }}
                    clusterResourceWhitelist:
                    {{- range (get $project "clusterResourceWhitelist") }}
                      - group: {{ quote (default "*" .group) }}
                        kind: {{ quote (default "*" .kind) }}
                    {{- end }}
                    {{- end }}
                    {{- if (get $project "namespaceResourceBlacklist") }}
                    namespaceResourceBlacklist:
                    {{- range (get $project "namespaceResourceBlacklist") }}
                      - group: {{ quote (default "*" .group) }}
                        kind: {{ quote (default "*" .kind) }}
                    {{- end }}
                    {{- end }}
                    {{- if (get $project "roles") }}
                    roles:
                    {{- range (get $project "roles") }}
                      - name: {{ quote (default "" .name) }}
                        {{- if .policies }}
                        policies:
                        {{- range .policies }}
                          - {{ quote . }}
                        {{- end }}
                        {{- end }}
                        {{- if .groups }}
                        groups:
                        {{- range .groups }}
                          - {{ quote . }}
                        {{- end }}
                        {{- end }}
                    {{- end }}
                    {{- end }}
              {{- if $providerConfig }}
              providerConfigRef:
                name: {{ quote $providerConfig }}
                kind: ClusterProviderConfig
              {{- end }}
              {{- if $secretName }}
              writeConnectionSecretToRef:
                name: {{ quote $secretName }}
                namespace: {{ quote $secretNamespace }}
              {{- end }}
            {{- range $index, $appset := $appsets }}
            ---
            apiVersion: kubernetes.m.crossplane.io/v1alpha1
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: argocd-appset-{{ $index }}
              labels:
                feature: gitops
                managed-by: adhar
            spec:
              forProvider:
                manifest:
                  apiVersion: argoproj.io/v1alpha1
                  kind: ApplicationSet
                  metadata:
                    name: {{ quote (default (printf "%s-appset-%d" $xr.metadata.name $index) (get $appset "name")) }}
                    namespace: adhar-system
                    labels:
                      project: {{ quote (get $project "name") }}
                      adhar.io/gitops: {{ quote $xr.metadata.name }}
                  spec:
                    generators:
                      {{ toYaml (default (list) (get $appset "generators")) | nindent 10 }}
                    template:
                      {{ toYaml (default (dict) (get $appset "template")) | nindent 10 }}
              {{- if $providerConfig }}
              providerConfigRef:
                name: {{ quote $providerConfig }}
                kind: ClusterProviderConfig
              {{- end }}
              # No deletionPolicy here: this is a namespaced kubernetes.m.crossplane.io
              # Object, whose schema has no such field (the apply would fail). Delete
              # on removal is the default managementPolicies behaviour anyway.
            {{- end }}
            ---
            # Publish the project roll-up on the XR status. XR-level connection
            # details are v1-only (CONVENTIONS.md §1), so the coordinates that
            # used to be emitted as connection details live on status instead.
            apiVersion: platform.adhar.io/v1alpha1
            kind: CompositeGitOps
            status:
              projectSynced: {{ $projectHealthy }}
              managedApplicationSets: {{ len $appsets }}
              message: {{ quote $joinedMessages }}
