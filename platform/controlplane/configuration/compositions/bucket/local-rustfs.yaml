---
# Bucket — an S3 bucket on RustFS, the platform's primary object store.
#
# RustFS, not MinIO: MinIO is disabled in every profile, so a bucket created
# there would land in a store nothing else can reach. The client is RustFS's own
# `rc`: minio/mc can no longer be pulled anonymously from Docker Hub or Quay, which
# left every Bucket's Job in ImagePullBackOff on a node without it cached. Quota
# goes through the RustFS admin API, which `rc` speaks and only `rc` is built for.
#
# Everything the Job does is idempotent, because the Job is recreated after its TTL
# and runs again. `rc ilm rule add` is the one call that is not: every run appends
# another rule, so it only runs when the declared rule is missing.
#
# The lifecycle rule is the one setting worth arguing about: a bucket of build
# artefacts with no expiry grows until the store's volume is full, which takes
# the WHOLE object store down — not just this bucket. That happened on a live
# cluster (61 GiB of a backup copying itself), which is why the field exists and
# why the quota does too.
#
# The connection Secret hands every bucket the store's ROOT credential
# (design 0025 R5, risk accepted 2026-11-13). The PLAT-1.9 spike found the client CAN mint a
# scoped identity — rc v0.1.37 has `rc admin user add`, `rc admin policy create`,
# `rc admin policy attach` and `rc admin service-account` — so the obstacle is not
# the tool. It is that the change swaps the credential under every existing Bucket
# consumer at once (the Secret's keys change from root-creds to a per-bucket user)
# and RustFS's honouring of a bucket-scoped IAM policy is unverified on a live
# store, and the two together are not something to ship without a live bucket
# test. Until then a Bucket is for ONE team, which docs/BATCH.md says. The
# shape when it lands: an ESO Password generator (`refreshPolicy: CreatedOnce`)
# mints the secret key, this Job adds the user and attaches a policy that names
# only this bucket, and `credentialsSecret` below points at that Secret.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: bucket-local-rustfs
  labels:
    feature: bucket
    provider: local
    store: rustfs
spec:
  compositeTypeRef:
    apiVersion: platform.adhar.io/v1alpha1
    kind: Bucket
  mode: Pipeline
  pipeline:
    - step: render
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $xr := .observed.composite.resource -}}
            {{- $name := $xr.metadata.name -}}
            {{- $ns := $xr.metadata.namespace -}}
            {{- $p := dig "spec" "parameters" dict $xr -}}
            {{- $bucket := dig "bucketName" $name $p -}}
            {{- $versioning := dig "versioning" false $p -}}
            {{- $public := dig "public" false $p -}}
            {{- $quota := dig "quotaGB" 0 $p -}}
            {{- $expire := dig "expireAfterDays" 0 $p -}}
            {{- $endpoint := "http://rustfs.adhar-system.svc.cluster.local:9000" -}}
            ---
            apiVersion: batch/v1
            kind: Job
            metadata:
              name: {{ $name }}-bucket
              namespace: {{ $ns }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: bucket-job
              labels:
                platform.adhar.io/bucket: {{ $name }}
                adhar.io/organisation: {{ dig "organisation" "adhar" $p | quote }}
                adhar.io/team: {{ dig "team" "platform" $p | quote }}
                {{- if dig "project" "" $p }}
                adhar.io/project: {{ dig "project" "" $p | quote }}
                {{- end }}
                adhar.io/environment: {{ dig "environment" "dev" $p | quote }}
                adhar.io/plane: workload
            spec:
              backoffLimit: 6
              ttlSecondsAfterFinished: 600
              template:
                spec:
                  restartPolicy: OnFailure
                  containers:
                    - name: rc
                      image: docker.io/rustfs/rc:v0.1.37
                      env:
                        - name: S3_USER
                          valueFrom: { secretKeyRef: { name: root-creds, key: rootUser } }
                        - name: S3_PASS
                          valueFrom: { secretKeyRef: { name: root-creds, key: rootPassword } }
                      command: [sh, -c]
                      args:
                        - |
                          set -e
                          rc alias set local {{ $endpoint }} "$S3_USER" "$S3_PASS" --bucket-lookup path
                          rc bucket create --ignore-existing "local/{{ $bucket }}"
                          {{- if $versioning }}
                          rc bucket version enable "local/{{ $bucket }}"
                          {{- else }}
                          rc bucket version suspend "local/{{ $bucket }}"
                          {{- end }}
                          {{- if gt (int $quota) 0 }}
                          rc bucket quota set "local/{{ $bucket }}" {{ $quota }}G
                          {{- end }}
                          {{- if gt (int $expire) 0 }}
                          if ! rc ilm rule list "local/{{ $bucket }}" --json \
                            | jq -e '[.rules[]? | select(.expiration.days == {{ $expire }})] | length == 1' >/dev/null; then
                            rc ilm rule remove "local/{{ $bucket }}" --all
                            rc ilm rule add "local/{{ $bucket }}" --expiry-days {{ $expire }}
                          fi
                          {{- end }}
                          {{- if $public }}
                          rc bucket anonymous set download "local/{{ $bucket }}"
                          {{- else }}
                          rc bucket anonymous set private "local/{{ $bucket }}"
                          {{- end }}
                          echo "bucket {{ $bucket }} ready"
                      resources:
                        requests: { cpu: 10m, memory: 32Mi }
                        limits: { memory: 128Mi }
            ---
            apiVersion: v1
            kind: Secret
            metadata:
              name: {{ $name }}-bucket
              namespace: {{ $ns }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: bucket-conn
              labels:
                platform.adhar.io/bucket: {{ $name }}
            stringData:
              endpoint: "{{ $endpoint }}"
              bucket: {{ $bucket | quote }}
              # Every S3 client insists on a region whether or not the store
              # cares; this is the value RustFS answers to.
              region: "us-east-1"
              # The credential is the object store's root, in Secret `root-creds`
              # — referenced, not copied.
              credentialsSecret: "root-creds"
              accessKeyKey: "rootUser"
              secretKeyKey: "rootPassword"
            ---
            apiVersion: platform.adhar.io/v1alpha1
            kind: Bucket
            status:
              bucket: {{ $bucket | quote }}
              endpoint: "{{ $endpoint }}"
              connectionSecret: "{{ $name }}-bucket"
    - step: ready
      functionRef:
        name: function-auto-ready
