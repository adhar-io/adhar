---
# Cache — a team's own Valkey, through the Hyperspike valkey-operator.
#
# The operator owns failover, scaling, TLS and the exporter; this composition
# owns the request. It emits a connection Secret with a `uri` clients can use
# unchanged (valkey:// and redis:// are the same protocol), and leaves the
# password out of it entirely unless one was asked for — a cache with a
# credential nobody passes is a cache nothing can reach.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: cache-local-valkey
  labels:
    feature: cache
    provider: local
    engine: valkey
spec:
  compositeTypeRef:
    apiVersion: platform.adhar.io/v1alpha1
    kind: Cache
  mode: Pipeline
  pipeline:
    - step: render
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $xr := .observed.composite.resource -}}
            {{- $name := $xr.metadata.name -}}
            {{- $ns := $xr.metadata.namespace -}}
            {{- $p := dig "spec" "parameters" dict $xr -}}
            {{- $nodes := dig "nodes" 1 $p -}}
            {{- $replicas := dig "replicas" 0 $p -}}
            {{- $auth := dig "password" false $p -}}
            {{- $tls := dig "tls" false $p -}}
            {{- $mem := dig "maxMemory" "256Mi" $p -}}
            {{- $cpu := dig "cpu" "25m" $p -}}
            {{- $metrics := dig "metrics" true $p -}}
            {{- $host := printf "%s.%s.svc.cluster.local" $name $ns -}}
            {{- $scheme := ternary "valkeys" "valkey" $tls -}}
            {{- /*
              The Valkey CR carries NO status at all — `status: {}` on a cluster
              whose cache pod is Running 2/2 — and function-auto-ready counts a
              composed resource with no Ready condition as unready forever, so
              every Cache XR sat at `Ready=False Creating: Unready resources:
              cache` while the cache served traffic. There is no readiness
              vocabulary to wait for (the same trap the readiness catalog records
              for Opstree Redis), so the ceiling is "the operator has accepted
              it": ready once the resource has actually been observed, which is
              also how Argo CD treats a kind it has no health check for. The
              workload itself is watched through its StatefulSet and the
              operator's ServiceMonitor, not through this XR.
            */}}
            {{- $cacheAccepted := dig "resources" "cache" "resource" "metadata" "uid" "" .observed -}}
            ---
            apiVersion: hyperspike.io/v1
            kind: Valkey
            metadata:
              name: {{ $name }}
              namespace: {{ $ns }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: cache
                {{- if $cacheAccepted }}
                gotemplating.fn.crossplane.io/ready: "True"
                {{- end }}
              labels:
                app.kubernetes.io/managed-by: crossplane
                app.kubernetes.io/component: cache
                platform.adhar.io/cache: {{ $name }}
                adhar.io/organisation: {{ dig "organisation" "adhar" $p | quote }}
                adhar.io/team: {{ dig "team" "platform" $p | quote }}
                {{- if dig "project" "" $p }}
                adhar.io/project: {{ dig "project" "" $p | quote }}
                {{- end }}
                adhar.io/environment: {{ dig "environment" "dev" $p | quote }}
                adhar.io/plane: workload
            spec:
              nodes: {{ $nodes }}
              replicas: {{ $replicas }}
              tls: {{ $tls }}
              {{- if $tls }}
              # The operator requests a cert-manager Certificate for TLS and
              # leaves its issuer EMPTY unless one is named; cert-manager's
              # webhook then rejects it ("issuerRef.name: Required value") and
              # the operator never creates the StatefulSet — the Cache XR reads
              # Ready (the Valkey CR has no status) while nothing runs and
              # nothing can be monitored (2026-10-24, a `tls: true` cache in
              # `default`). The platform's adhar-controlplane issuer is adhar-selfsigned
              # (security/cert-manager); clients read ca.crt from the Secret.
              certIssuer: adhar-selfsigned
              certIssuerType: ClusterIssuer
              {{- end }}
              # Storage MUST be stated. With none, valkey-operator v0.0.61
              # creates the StatefulSet with its own default 8Gi claim, and
              # every later reconcile then fails "storage has been removed but
              # cannot be updated in a statefuleset" — BEFORE the step that
              # assigns hash slots. The node runs, answers PING, and has zero
              # slots: every command fails `CLUSTERDOWN Hash slot not served`
              # (the shared adhar-cache, 2026-10-24, which took the oauth2-proxy
              # session stores down with it). This is exactly the operator's
              # default, so existing caches reconcile without a change.
              storage:
                spec:
                  accessModes: [ReadWriteOnce]
                  resources:
                    requests:
                      storage: 8Gi
                  volumeMode: Filesystem
              # anonymousAuth is the inverse of "require a password": the
              # operator generates and requires one when this is false.
              anonymousAuth: {{ not $auth }}
              prometheus: {{ $metrics }}
              serviceMonitor: {{ $metrics }}
              resources:
                requests:
                  cpu: {{ $cpu | quote }}
                  memory: 64Mi
                limits:
                  memory: {{ $mem | quote }}
            ---
            apiVersion: v1
            kind: Secret
            metadata:
              name: {{ $name }}-cache
              namespace: {{ $ns }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: cache-conn
                # A Secret has no Ready condition, so function-auto-ready
                # counted it unready forever and the Cache never went
                # Ready — `adhar-cache` sat at Ready=False with a running
                # Valkey behind it. The CACHE itself still gates; this is
                # the connection detail beside it.
                gotemplating.fn.crossplane.io/ready: "True"
              labels:
                platform.adhar.io/cache: {{ $name }}
            stringData:
              host: "{{ $host }}"
              port: "6379"
              engine: "valkey"
              {{- if $auth }}
              # The operator generates the credential into its own Secret
              # (`{{ $name }}`, key `password`); it is NOT copied here, because a
              # second copy is a second thing to rotate.
              uri: "{{ $scheme }}://{{ $host }}:6379"
              passwordSecret: "{{ $name }}"
              passwordKey: "password"
              {{- else }}
              uri: "{{ $scheme }}://{{ $host }}:6379"
              {{- end }}
            ---
            apiVersion: platform.adhar.io/v1alpha1
            kind: Cache
            status:
              host: "{{ $host }}"
              port: 6379
              connectionSecret: "{{ $name }}-cache"
    - step: ready
      functionRef:
        name: function-auto-ready
