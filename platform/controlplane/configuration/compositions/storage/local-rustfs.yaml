---
# Local object-storage (bucket) composition — creates a bucket in the platform's
# primary object store, RustFS, for self-service storage. CompositeStorage with
# type: object; selected via the `provider: local, type: object` labels or an
# explicit compositionRef.
#
# RustFS, not MinIO. RustFS is the platform's primary S3 store and MinIO is
# disabled in every profile, so a bucket created in MinIO would land in a store
# nothing else can reach. The endpoint below is the RustFS Service; `mc` is only
# a client and speaks to any S3 endpoint, so the tool is unchanged.
#
# A Job creates the bucket; a connection Secret `<name>-bucket` exposes the S3
# endpoint + bucket name. Credentials are the platform object-store root, in
# Secret `root-creds` (rootUser / rootPassword) — the contract every consumer on
# the platform reads, which the rustfs package now publishes.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: compositestorage-local-rustfs
  labels:
    feature: storage
    provider: local
    type: object
spec:
  compositeTypeRef:
    apiVersion: platform.adhar.io/v1alpha1
    kind: CompositeStorage
  mode: Pipeline
  pipeline:
    - step: render
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $xr := .observed.composite.resource -}}
            {{- $meta := $xr.metadata -}}
            {{- $ns := $meta.namespace -}}
            {{- $bucket := dig "spec" "name" $meta.name $xr -}}
            {{- $endpoint := "http://rustfs.adhar-system.svc.cluster.local:9000" -}}
            ---
            apiVersion: batch/v1
            kind: Job
            metadata:
              name: {{ $meta.name }}-bucket
              namespace: {{ $ns }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: bucket-job
            spec:
              backoffLimit: 6
              template:
                spec:
                  restartPolicy: OnFailure
                  containers:
                    - name: mc
                      image: minio/mc:RELEASE.2024-11-21T17-21-54Z
                      command: [sh, -c]
                      args:
                        - |
                          set -e
                          mc alias set local {{ $endpoint }} "$S3_USER" "$S3_PASS"
                          mc mb --ignore-existing "local/{{ $bucket }}"
                          echo "bucket {{ $bucket }} ready"
                      env:
                        - name: S3_USER
                          valueFrom: { secretKeyRef: { name: root-creds, key: rootUser } }
                        - name: S3_PASS
                          valueFrom: { secretKeyRef: { name: root-creds, key: rootPassword } }
            ---
            apiVersion: v1
            kind: Secret
            metadata:
              name: {{ $meta.name }}-bucket
              namespace: {{ $ns }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: bucket-conn
            stringData:
              endpoint: "{{ $endpoint }}"
              bucket: "{{ $bucket }}"
              region: "us-east-1"
    - step: ready
      functionRef:
        name: function-auto-ready
