---
# Release — one promotion of a freight into an environment (ADR-0026).
#
# A Kargo Promotion of the application's freight into the project's shared
# Stage `<environment>` (one Stage per project environment, fed by every
# application's Warehouse) in the project's Kargo namespace. Before 2026-10 each
# application had its own Stage `<application>-<environment>`. Only `stage` and `freight` are set: Kargo's
# mutating webhook copies the promotion steps from the Stage's template
# (verified against Kargo on 2026-10-04 with a server-side dry run), so the
# release never carries a pipeline that could drift from the Stage's.
#
# The Promotion is immutable once accepted, so the composed Object is named
# after the XR: a new release is a new XR, never an edit. Its phase is mirrored
# onto the XR status from the Object's observed manifest.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: release-kargo
  labels:
    feature: release
    provider: kargo
spec:
  compositeTypeRef:
    apiVersion: platform.adhar.io/v1alpha1
    kind: Release
  mode: Pipeline
  pipeline:
    - step: render
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $xr := .observed.composite.resource -}}
            {{- $p := dig "spec" "parameters" dict $xr -}}
            {{- $project := dig "project" "adhar" $p -}}
            {{- $app := dig "application" "" $p -}}
            {{- $env := dig "environment" "dev" $p -}}
            {{- $freight := dig "freight" "" $p -}}
            {{- if not $app }}{{ fail "parameters.application is required" }}{{ end -}}
            {{- if not $freight }}{{ fail "parameters.freight is required" }}{{ end -}}
            {{- /* The project's shared Stage: named after the environment. The freight
                   (from the application's Warehouse) says which application moves. */ -}}
            {{- $stage := $env -}}
            {{- $job := dig "promotion-job" "resource" dict (default dict .observed.resources) -}}
            {{- $jobStatus := dig "status" "atProvider" "manifest" "status" dict $job -}}
            {{- $succeeded := dig "succeeded" 0 $jobStatus -}}
            {{- $failed := dig "failed" 0 $jobStatus -}}
            {{- $jobName := printf "release-%s" $xr.metadata.name -}}
            ---
            # The Promotion is CREATED by a one-shot Job, never applied by name.
            # Kargo's mutating webhook renames every Promotion to
            # <stage>.<ulid>.<freight>; an apply that names the object leaves it
            # stored under the OLD key with the new name inside — a ghost the list
            # shows, GET cannot find and Kargo never reconciles, which also wedged
            # the stage's queue behind it (Azure, 2026-10-17). A create with
            # generateName lets the webhook name it. The Job is idempotent: it
            # submits nothing when a Promotion already carries this Release's label.
            apiVersion: kubernetes.m.crossplane.io/v1alpha1
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: promotion-job
            spec:
              providerConfigRef: { name: kubernetes-provider, kind: ClusterProviderConfig }
              forProvider:
                manifest:
                  apiVersion: batch/v1
                  kind: Job
                  metadata:
                    name: {{ $jobName | quote }}
                    namespace: {{ $project }}
                    labels:
                      adhar.io/project: {{ $project | quote }}
                      adhar.io/application: {{ $app | quote }}
                      adhar.io/environment: {{ $env | quote }}
                      adhar.io/release: {{ $xr.metadata.name | quote }}
                  spec:
                    backoffLimit: 3
                    ttlSecondsAfterFinished: 604800
                    template:
                      metadata:
                        labels: { adhar.io/release: {{ $xr.metadata.name | quote }} }
                      spec:
                        serviceAccountName: adhar-release
                        restartPolicy: OnFailure
                        containers:
                          - name: promote
                            image: docker.io/alpine/k8s:1.31.0
                            env:
                              - { name: NS, value: {{ $project | quote }} }
                              - { name: RELEASE, value: {{ $xr.metadata.name | quote }} }
                              - { name: RELEASED_BY, value: {{ printf "%s/%s" $xr.metadata.namespace $xr.metadata.name | quote }} }
                              - { name: STAGE, value: {{ $stage | quote }} }
                              - { name: FREIGHT, value: {{ $freight | quote }} }
                              - { name: APP, value: {{ $app | quote }} }
                              - { name: ENV, value: {{ $env | quote }} }
                              - { name: PROJECT, value: {{ $project | quote }} }
                              - { name: REASON, value: {{ dig "reason" "" $p | quote }} }
                            command: [sh, -ec]
                            args:
                              - |
                                if kubectl -n "$NS" get promotions.kargo.akuity.io -l "adhar.io/release=$RELEASE" -o name | grep -q .; then
                                  echo "promotion for release $RELEASE already submitted"; exit 0
                                fi
                                kubectl create -f - <<EOF
                                apiVersion: kargo.akuity.io/v1alpha1
                                kind: Promotion
                                metadata:
                                  generateName: ${STAGE}-
                                  namespace: $NS
                                  labels:
                                    adhar.io/project: "$PROJECT"
                                    adhar.io/application: "$APP"
                                    adhar.io/environment: "$ENV"
                                    adhar.io/release: "$RELEASE"
                                  annotations:
                                    adhar.io/reason: "$REASON"
                                    adhar.io/released-by: "$RELEASED_BY"
                                spec:
                                  stage: "$STAGE"
                                  freight: "$FREIGHT"
                                EOF
            ---
            apiVersion: platform.adhar.io/v1alpha1
            kind: Release
            status:
              promotion: {{ printf "label adhar.io/release=%s in namespace %s" $xr.metadata.name $project | quote }}
              stage: {{ $stage | quote }}
              {{- if gt (int $succeeded) 0 }}
              phase: Submitted
              message: "Promotion submitted to Kargo; its progress is on the Stage"
              ready: true
              {{- else if gt (int $failed) 0 }}
              phase: Failed
              message: {{ printf "the release Job %s failed %v time(s); see its pod logs" $jobName $failed | quote }}
              ready: false
              {{- else }}
              phase: Pending
              ready: false
              {{- end }}
    - step: ready
      functionRef:
        name: function-auto-ready
