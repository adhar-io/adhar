---
# Search → an OpenSearchCluster in the requester's namespace, run by
# the platform's opensearch-k8s-operator (data/opensearch), with everything the
# platform's own shared cluster has:
#
#   * admin and monitoring passwords minted by ESO Password generators and
#     hashed into the security config by the operator — no password is ever in
#     a manifest, and `kubectl get secret <name>-admin-credentials` is the only
#     place it exists;
#   * TLS generated by the operator on transport and HTTP;
#   * the operator's own ServiceMonitor (general.monitoring) so the cluster
#     appears in Grafana with no per-instance wiring, scraping as a dedicated
#     monitoring user that can read metrics and nothing else;
#   * an ISM policy for dated indices (roll over, go warm, delete);
#   * a daily OpensearchSnapshotPolicy into the platform object store, with the
#     S3 keys projected from the platform's root-creds through the `platform`
#     ClusterSecretStore into this namespace (the keystore Secret must live
#     next to the cluster).
#
# Every object is emitted as a provider-kubernetes Object: the OpenSearch CRs
# are namespaced operator types, not Crossplane managed resources. The
# OpenSearchCluster Object is also what the status is read from — its observed
# manifest carries the operator's `status.phase` and `status.health`.
#
# ONE generator per ExternalSecret and ONE credential per ExternalSecret, for
# the reason data/opensearch/manifests/credentials.yaml gives: folding both
# passwords into one ES would rotate the admin password every time the
# monitoring user was touched, against a cluster bootstrapped with the old one.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: search-opensearch
  labels:
    feature: search
    provider: kubernetes
    engine: opensearch
spec:
  compositeTypeRef:
    apiVersion: platform.adhar.io/v1alpha1
    kind: Search
  mode: Pipeline
  pipeline:
    - step: render
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $xr := .observed.composite.resource -}}
            {{- $name := $xr.metadata.name -}}
            {{- $ns := $xr.metadata.namespace -}}
            {{- $p := dig "spec" "parameters" dict $xr -}}
            {{- $version := dig "version" "3.8.0" $p -}}
            {{- $nodes := int (dig "nodes" 1 $p) -}}
            {{- $disk := dig "storageSize" "20Gi" $p -}}
            {{- $sc := dig "storageClass" "" $p -}}
            {{- $cpu := dig "resources" "cpu" "250m" $p -}}
            {{- $mem := dig "resources" "memory" "2Gi" $p -}}
            {{- $memLimit := dig "resources" "memoryLimit" "3Gi" $p -}}
            {{- $dash := dig "dashboards" "enabled" false $p -}}
            {{- $snap := dig "snapshots" "enabled" true $p -}}
            {{- $snapSchedule := dig "snapshots" "schedule" "30 1 * * *" $p -}}
            {{- $snapKeep := int (dig "snapshots" "retentionDays" 14 $p) -}}
            {{- $snapBucket := dig "snapshots" "bucket" "adhar-backups" $p -}}
            {{- $ism := dig "indexLifecycle" "enabled" true $p -}}
            {{- $ismPatterns := dig "indexLifecycle" "indexPatterns" (list "logs-*" "events-*") $p -}}
            {{- $ismWarm := int (dig "indexLifecycle" "warmAfterDays" 7 $p) -}}
            {{- $ismDelete := int (dig "indexLifecycle" "deleteAfterDays" 30 $p) -}}
            {{- $org := dig "organisation" "adhar" $p -}}
            {{- $team := dig "team" "platform" $p -}}
            {{- $project := dig "project" "" $p -}}
            {{- $env := dig "environment" "dev" $p -}}
            {{- $policy := dig "deletionPolicy" "Delete" $p -}}
            {{- $providerConfig := dig "spec" "providerConfigRef" "name" "kubernetes-provider" $xr -}}
            {{- $host := printf "%s.%s.svc.cluster.local" $name $ns -}}
            {{- $repo := printf "%s-snapshots" $name -}}
            {{- $labels := dict "adhar.io/organisation" $org "adhar.io/team" $team "adhar.io/environment" $env "adhar.io/plane" "workload" "platform.adhar.io/search" $name "app.kubernetes.io/managed-by" "crossplane" -}}
            {{- if $project }}{{ $_ := set $labels "adhar.io/project" $project }}{{ end -}}
            {{- /* Status comes from the OpenSearchCluster the provider observes. */ -}}
            {{- $observed := default (dict) .observed.resources -}}
            {{- $osStatus := dig "cluster" "resource" "status" "atProvider" "manifest" "status" dict $observed -}}
            {{- $osPhase := dig "phase" "" $osStatus -}}
            {{- $osHealth := dig "health" "" $osStatus -}}
            {{- $osVersion := dig "version" "" $osStatus -}}
            {{- $phase := "Pending" -}}
            {{- $message := "Waiting for the OpenSearch operator to pick up the cluster" -}}
            {{- $ready := false -}}
            {{- if eq $osPhase "RUNNING" -}}
              {{- if eq $osHealth "red" -}}
                {{- $phase = "Degraded" -}}{{- $message = "Cluster is running but health is red" -}}
              {{- else -}}
                {{- $phase = "Available" -}}{{- $ready = true -}}{{- $message = printf "OpenSearch %s is serving" (default $version $osVersion) -}}
              {{- end -}}
            {{- else if eq $osPhase "PENDING" -}}
              {{- $phase = "Creating" -}}{{- $message = "Operator is bootstrapping the cluster" -}}
            {{- else if $osPhase -}}
              {{- $phase = "Creating" -}}{{- $message = printf "Cluster phase: %s" $osPhase -}}
            {{- end -}}
            ---
            # Admin password: minted once by the generator, never rotated under a
            # running cluster (the operator hashes it into the security config at
            # bootstrap). The same Secret doubles as the connection Secret, so an
            # application needs exactly one reference.
            apiVersion: kubernetes.m.crossplane.io/v1alpha1
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: admin-password
              labels: {feature: search, managed-by: adhar}
            spec:
              deletionPolicy: {{ $policy }}
              providerConfigRef: {name: {{ quote $providerConfig }}, kind: ClusterProviderConfig}
              forProvider:
                manifest:
                  apiVersion: generators.external-secrets.io/v1alpha1
                  kind: Password
                  metadata:
                    name: {{ $name }}-admin
                    namespace: {{ $ns }}
                    labels:
                      {{- range $k, $v := $labels }}
                      {{ $k }}: {{ $v | quote }}
                      {{- end }}
                  spec:
                    length: 32
                    digits: 5
                    symbols: 3
                    # Restricted symbol set: this password travels through a
                    # basic-auth header, a Prometheus scrape config and the
                    # OpenSearch keystore.
                    symbolCharacters: /-+
                    noUpper: false
                    allowRepeat: true
            ---
            apiVersion: kubernetes.m.crossplane.io/v1alpha1
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: admin-credentials
              labels: {feature: search, managed-by: adhar}
            spec:
              deletionPolicy: {{ $policy }}
              providerConfigRef: {name: {{ quote $providerConfig }}, kind: ClusterProviderConfig}
              forProvider:
                manifest:
                  apiVersion: external-secrets.io/v1
                  kind: ExternalSecret
                  metadata:
                    name: {{ $name }}-admin-credentials
                    namespace: {{ $ns }}
                    labels:
                      {{- range $k, $v := $labels }}
                      {{ $k }}: {{ $v | quote }}
                      {{- end }}
                  spec:
                    refreshPolicy: CreatedOnce
                    refreshInterval: "0"
                    target:
                      name: {{ $name }}-admin-credentials
                      template:
                        engineVersion: v2
                        metadata:
                          labels:
                            adhar.io/cli-secret: "true"
                            platform.adhar.io/search: {{ $name | quote }}
                        data:
                          # `username` and `password` are what the operator requires
                          # of security.config.adminCredentialsSecret; the rest is
                          # the connection the application reads.
                          username: admin
                          password: {{ `{{ .PASSWORD }}` | quote }}
                          host: {{ $host | quote }}
                          port: "9200"
                          uri: {{ printf "https://admin:%s@%s:9200" `{{ .PASSWORD }}` $host | quote }}
                    dataFrom:
                      - sourceRef:
                          generatorRef:
                            apiVersion: generators.external-secrets.io/v1alpha1
                            kind: Password
                            name: {{ $name }}-admin
                        rewrite:
                          - transform:
                              template: PASSWORD
            ---
            apiVersion: kubernetes.m.crossplane.io/v1alpha1
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: monitoring-password
              labels: {feature: search, managed-by: adhar}
            spec:
              deletionPolicy: {{ $policy }}
              providerConfigRef: {name: {{ quote $providerConfig }}, kind: ClusterProviderConfig}
              forProvider:
                manifest:
                  apiVersion: generators.external-secrets.io/v1alpha1
                  kind: Password
                  metadata:
                    name: {{ $name }}-monitoring
                    namespace: {{ $ns }}
                    labels:
                      {{- range $k, $v := $labels }}
                      {{ $k }}: {{ $v | quote }}
                      {{- end }}
                  spec:
                    length: 32
                    digits: 5
                    symbols: 3
                    symbolCharacters: /-+
                    noUpper: false
                    allowRepeat: true
            ---
            # Read from BOTH ends of the same Secret: the OpensearchUser below sets
            # this user's password from it, and the ServiceMonitor the operator
            # generates scrapes with it. One object, so they cannot drift apart.
            apiVersion: kubernetes.m.crossplane.io/v1alpha1
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: monitoring-credentials
              labels: {feature: search, managed-by: adhar}
            spec:
              deletionPolicy: {{ $policy }}
              providerConfigRef: {name: {{ quote $providerConfig }}, kind: ClusterProviderConfig}
              forProvider:
                manifest:
                  apiVersion: external-secrets.io/v1
                  kind: ExternalSecret
                  metadata:
                    name: {{ $name }}-monitoring-credentials
                    namespace: {{ $ns }}
                    labels:
                      {{- range $k, $v := $labels }}
                      {{ $k }}: {{ $v | quote }}
                      {{- end }}
                  spec:
                    refreshPolicy: CreatedOnce
                    refreshInterval: "0"
                    target:
                      name: {{ $name }}-monitoring-credentials
                      template:
                        engineVersion: v2
                        data:
                          # MUST equal the OpensearchUser's name below: the
                          # operator creates the user from that name, and the
                          # ServiceMonitor it generates authenticates with this
                          # `username`. A mismatch is a 401 on every scrape and
                          # an empty Grafana panel, with a healthy cluster.
                          username: {{ $name }}-monitoring
                          password: {{ `{{ .PASSWORD }}` | quote }}
                    dataFrom:
                      - sourceRef:
                          generatorRef:
                            apiVersion: generators.external-secrets.io/v1alpha1
                            kind: Password
                            name: {{ $name }}-monitoring
                        rewrite:
                          - transform:
                              template: PASSWORD
            {{- if $snap }}
            ---
            # S3 keys for the snapshot repository, projected from the platform's
            # root-creds into this namespace: the OpenSearch keystore can only read
            # a Secret next to the cluster, and no composition copies a password.
            apiVersion: kubernetes.m.crossplane.io/v1alpha1
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: s3-credentials
              labels: {feature: search, managed-by: adhar}
            spec:
              deletionPolicy: {{ $policy }}
              providerConfigRef: {name: {{ quote $providerConfig }}, kind: ClusterProviderConfig}
              forProvider:
                manifest:
                  apiVersion: external-secrets.io/v1
                  kind: ExternalSecret
                  metadata:
                    name: {{ $name }}-s3-credentials
                    namespace: {{ $ns }}
                    labels:
                      {{- range $k, $v := $labels }}
                      {{ $k }}: {{ $v | quote }}
                      {{- end }}
                  spec:
                    refreshInterval: 1h
                    secretStoreRef: {kind: ClusterSecretStore, name: platform}
                    target:
                      name: {{ $name }}-s3-credentials
                    data:
                      - secretKey: RUSTFS_ACCESS_KEY
                        remoteRef: {key: root-creds, property: RUSTFS_ACCESS_KEY}
                      - secretKey: RUSTFS_SECRET_KEY
                        remoteRef: {key: root-creds, property: RUSTFS_SECRET_KEY}
            {{- end }}
            ---
            # The cluster. Service names derive from the CR name: `<name>` (REST,
            # 9200), `<name>-discovery` (transport), `<name>-dashboards` (5601).
            apiVersion: kubernetes.m.crossplane.io/v1alpha1
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: cluster
              labels: {feature: search, managed-by: adhar}
            spec:
              deletionPolicy: {{ $policy }}
              providerConfigRef: {name: {{ quote $providerConfig }}, kind: ClusterProviderConfig}
              forProvider:
                manifest:
                  apiVersion: opensearch.org/v1
                  kind: OpenSearchCluster
                  metadata:
                    name: {{ $name }}
                    namespace: {{ $ns }}
                    labels:
                      {{- range $k, $v := $labels }}
                      {{ $k }}: {{ $v | quote }}
                      {{- end }}
                  spec:
                    general:
                      serviceName: {{ $name }}
                      version: {{ $version | quote }}
                      image: docker.io/opensearchproject/opensearch:{{ $version }}
                      httpPort: 9200
                      vendor: Opensearch
                      setVMMaxMapCount: true
                      drainDataNodes: true
                      monitoring:
                        enable: true
                        scrapeInterval: 30s
                        monitoringUserSecret: {{ $name }}-monitoring-credentials
                        labels:
                          adhar.io/component: observability
                        tlsConfig:
                          insecureSkipVerify: true
                      {{- if $snap }}
                      # repository-s3 is NOT bundled in OpenSearch 3.x; without the
                      # plugin every s3.client.* setting below is rejected and the
                      # node refuses to start.
                      pluginsList:
                        - repository-s3
                      additionalConfig:
                        s3.client.default.endpoint: rustfs.adhar-system.svc.cluster.local:9000
                        s3.client.default.path_style_access: "true"
                        s3.client.default.protocol: http
                      keystore:
                        - secret:
                            name: {{ $name }}-s3-credentials
                          keyMappings:
                            RUSTFS_ACCESS_KEY: s3.client.default.access_key
                            RUSTFS_SECRET_KEY: s3.client.default.secret_key
                      snapshotRepositories:
                        - name: {{ $repo }}
                          type: s3
                          settings:
                            bucket: {{ $snapBucket }}
                            base_path: opensearch/{{ $ns }}/{{ $name }}
                            client: default
                      {{- end }}
                    confMgmt:
                      smartScaler: true
                    bootstrap:
                      resources:
                        requests: {cpu: 100m, memory: 512Mi}
                        limits: {memory: 1Gi}
                    initHelper:
                      image: docker.io/busybox:1.36
                      resources:
                        requests: {cpu: 50m, memory: 64Mi}
                        limits: {memory: 128Mi}
                    dashboards:
                      enable: {{ $dash }}
                      {{- if $dash }}
                      version: {{ $version | quote }}
                      image: docker.io/opensearchproject/opensearch-dashboards:{{ $version }}
                      replicas: 1
                      opensearchCredentialsSecret:
                        name: {{ $name }}-admin-credentials
                      additionalConfig:
                        opensearch_security.multitenancy.enabled: "false"
                      resources:
                        requests: {cpu: 100m, memory: 512Mi}
                        limits: {memory: 1Gi}
                      tls:
                        enable: false
                      {{- end }}
                    nodePools:
                      - component: nodes
                        replicas: {{ $nodes }}
                        diskSize: {{ $disk }}
                        {{- if $sc }}
                        persistence:
                          pvc:
                            storageClass: {{ $sc }}
                            accessModes: [ReadWriteOnce]
                        {{- end }}
                        # `master` is the role name this operator release accepts (the
                        # platform cluster uses the same spelling); cluster_manager is
                        # the engine's, not the CR's.
                        roles: [master, data, ingest]
                        resources:
                          requests: {cpu: {{ $cpu }}, memory: {{ $mem }}}
                          limits: {memory: {{ $memLimit }}}
                    security:
                      tls:
                        transport:
                          generate: true
                          perNode: true
                          duration: 8760h
                          rotateDaysBeforeExpiry: 30
                        http:
                          generate: true
                          duration: 8760h
                          rotateDaysBeforeExpiry: 30
                      config:
                        adminCredentialsSecret:
                          name: {{ $name }}-admin-credentials
            ---
            apiVersion: kubernetes.m.crossplane.io/v1alpha1
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: monitoring-role
              labels: {feature: search, managed-by: adhar}
            spec:
              deletionPolicy: {{ $policy }}
              providerConfigRef: {name: {{ quote $providerConfig }}, kind: ClusterProviderConfig}
              forProvider:
                manifest:
                  apiVersion: opensearch.org/v1
                  kind: OpensearchRole
                  metadata:
                    name: {{ $name }}-monitoring
                    namespace: {{ $ns }}
                    labels:
                      {{- range $k, $v := $labels }}
                      {{ $k }}: {{ $v | quote }}
                      {{- end }}
                  spec:
                    opensearchCluster:
                      name: {{ $name }}
                    clusterPermissions:
                      - cluster_monitor
                      - cluster:admin/prometheus/metrics
                      - cluster:monitor/*
                    indexPermissions:
                      - indexPatterns: ["*"]
                        allowedActions:
                          - indices_monitor
                          - indices:admin/mappings/get
            ---
            apiVersion: kubernetes.m.crossplane.io/v1alpha1
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: monitoring-user
              labels: {feature: search, managed-by: adhar}
            spec:
              deletionPolicy: {{ $policy }}
              providerConfigRef: {name: {{ quote $providerConfig }}, kind: ClusterProviderConfig}
              forProvider:
                manifest:
                  apiVersion: opensearch.org/v1
                  kind: OpensearchUser
                  metadata:
                    name: {{ $name }}-monitoring
                    namespace: {{ $ns }}
                    labels:
                      {{- range $k, $v := $labels }}
                      {{ $k }}: {{ $v | quote }}
                      {{- end }}
                  spec:
                    opensearchCluster:
                      name: {{ $name }}
                    passwordFrom:
                      name: {{ $name }}-monitoring-credentials
                      key: password
            ---
            apiVersion: kubernetes.m.crossplane.io/v1alpha1
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: monitoring-binding
              labels: {feature: search, managed-by: adhar}
            spec:
              deletionPolicy: {{ $policy }}
              providerConfigRef: {name: {{ quote $providerConfig }}, kind: ClusterProviderConfig}
              forProvider:
                manifest:
                  apiVersion: opensearch.org/v1
                  kind: OpensearchUserRoleBinding
                  metadata:
                    name: {{ $name }}-monitoring
                    namespace: {{ $ns }}
                    labels:
                      {{- range $k, $v := $labels }}
                      {{ $k }}: {{ $v | quote }}
                      {{- end }}
                  spec:
                    opensearchCluster:
                      name: {{ $name }}
                    roles: [{{ $name }}-monitoring]
                    users: [{{ $name }}-monitoring]
            {{- if $ism }}
            ---
            apiVersion: kubernetes.m.crossplane.io/v1alpha1
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: ism-policy
              labels: {feature: search, managed-by: adhar}
            spec:
              deletionPolicy: {{ $policy }}
              providerConfigRef: {name: {{ quote $providerConfig }}, kind: ClusterProviderConfig}
              forProvider:
                manifest:
                  apiVersion: opensearch.org/v1
                  kind: OpenSearchISMPolicy
                  metadata:
                    name: {{ $name }}-timeseries
                    namespace: {{ $ns }}
                    labels:
                      {{- range $k, $v := $labels }}
                      {{ $k }}: {{ $v | quote }}
                      {{- end }}
                  spec:
                    opensearchCluster:
                      name: {{ $name }}
                    defaultState: hot
                    description: "Roll over dated indices at 20GB or {{ $ismWarm }} days, drop replicas at {{ $ismWarm }} days, delete at {{ $ismDelete }}"
                    states:
                      - name: hot
                        actions:
                          - rollover:
                              minIndexAge: {{ $ismWarm }}d
                              minSize: 20gb
                        transitions:
                          - stateName: warm
                            conditions:
                              minIndexAge: {{ $ismWarm }}d
                      - name: warm
                        actions:
                          - replicaCount:
                              numberOfReplicas: 0
                        transitions:
                          - stateName: delete
                            conditions:
                              minIndexAge: {{ $ismDelete }}d
                      - name: delete
                        actions:
                          - delete: {}
                        transitions: []
                    ismTemplate:
                      priority: 0
                      indexPatterns:
                        {{- range $ismPatterns }}
                        - {{ . | quote }}
                        {{- end }}
            {{- end }}
            {{- if $snap }}
            ---
            # Applied through the cluster's REST API; the repository it names is
            # registered during the cluster's own reconcile, so this just retries
            # until the cluster is up.
            apiVersion: kubernetes.m.crossplane.io/v1alpha1
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: snapshot-policy
              labels: {feature: search, managed-by: adhar}
            spec:
              deletionPolicy: {{ $policy }}
              providerConfigRef: {name: {{ quote $providerConfig }}, kind: ClusterProviderConfig}
              forProvider:
                manifest:
                  apiVersion: opensearch.org/v1
                  kind: OpensearchSnapshotPolicy
                  metadata:
                    name: {{ $name }}-daily
                    namespace: {{ $ns }}
                    labels:
                      {{- range $k, $v := $labels }}
                      {{ $k }}: {{ $v | quote }}
                      {{- end }}
                  spec:
                    policyName: {{ $name }}-daily
                    description: Daily full snapshot of {{ $name }} into the platform object store
                    enabled: true
                    opensearchCluster:
                      name: {{ $name }}
                    creation:
                      schedule:
                        cron:
                          expression: {{ $snapSchedule | quote }}
                          timezone: UTC
                      timeLimit: 1h
                    deletion:
                      schedule:
                        cron:
                          expression: "0 3 * * *"
                          timezone: UTC
                      deleteCondition:
                        maxAge: {{ $snapKeep }}d
                        maxCount: {{ mul $snapKeep 2 }}
                        minCount: 5
                    snapshotConfig:
                      repository: {{ $repo }}
                      indices: "*"
                      includeGlobalState: true
                      ignoreUnavailable: false
                      partial: false
                      dateFormat: yyyy-MM-dd-HH-mm
                      dateFormatTimezone: UTC
            {{- end }}
            ---
            apiVersion: platform.adhar.io/v1alpha1
            kind: Search
            status:
              phase: {{ $phase }}
              message: {{ $message | quote }}
              ready: {{ $ready }}
              {{- if $osHealth }}
              health: {{ $osHealth }}
              {{- end }}
              version: {{ default $version $osVersion | quote }}
              endpoint: https://{{ $host }}:9200
              port: 9200
              {{- if $dash }}
              dashboardsEndpoint: http://{{ $name }}-dashboards.{{ $ns }}.svc.cluster.local:5601
              {{- end }}
              credentialsSecret: {{ $name }}-admin-credentials
              {{- if $snap }}
              snapshotRepository: s3://{{ $snapBucket }}/opensearch/{{ $ns }}/{{ $name }}
              {{- end }}
              organisation: {{ $org }}
              team: {{ $team }}
              {{- if $project }}
              project: {{ $project }}
              {{- end }}
              environment: {{ $env }}
    - step: ready
      functionRef:
        name: function-auto-ready
