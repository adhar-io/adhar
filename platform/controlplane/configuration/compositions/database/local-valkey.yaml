---
# Local Valkey composition — provisions an operator-managed Valkey cache in the
# requester's namespace via the Hyperspike valkey-operator (kind: Valkey), the
# fully open-source (BSD-3) drop-in for Redis. Same CompositeDatabase XRD as the
# cloud (AWS/Azure/GCP) and other local engines, so a developer's self-service
# request stays portable across environments.
#
# Selected via compositionRef by the template, or by the labels
# `provider: local, feature: database, engine: valkey`.
#
# Unlike the raw-Deployment `local-redis` path, this hands lifecycle (failover,
# TLS, scaling, metrics) to the operator. The operator creates a Service named
# after the Valkey CR, so the emitted `<name>-app` Secret points at it with a
# ready `uri` (valkey://host:6379, protocol-compatible with redis:// clients).
#
# Observability is auto-wired: `prometheus: true` + `serviceMonitor: true` make
# the operator stand up the exporter + a ServiceMonitor, which kube-prometheus
# (all-ServiceMonitor selector) scrapes — so every composed cache appears in the
# Valkey/Redis Grafana dashboard with no per-instance wiring.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: compositedatabase-local-valkey
  labels:
    feature: database
    provider: local
    engine: valkey
spec:
  compositeTypeRef:
    apiVersion: platform.adhar.io/v1alpha1
    kind: CompositeDatabase
  mode: Pipeline
  pipeline:
    - step: render
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $xr := .observed.composite.resource -}}
            {{- $name := $xr.metadata.name -}}
            {{- $ns := $xr.metadata.namespace -}}
            {{- $params := dig "spec" "parameters" dict $xr -}}
            {{- $replicas := dig "replicas" 0 $params -}}
            {{- $host := printf "%s.%s.svc.cluster.local" $name $ns -}}
            ---
            apiVersion: hyperspike.io/v1
            kind: Valkey
            metadata:
              name: {{ $name }}
              namespace: {{ $ns }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: valkey-cache
              labels:
                app.kubernetes.io/managed-by: crossplane
                app.kubernetes.io/component: cache
                platform.adhar.io/database: {{ $name }}
            spec:
              nodes: 1
              replicas: {{ $replicas }}
              tls: false
              # Simple in-cluster caching by default; front with auth/TLS for a
              # real deployment by setting servicePassword + tls: true.
              anonymousAuth: true
              # Operator-managed exporter + ServiceMonitor -> kube-prometheus.
              prometheus: true
              serviceMonitor: true
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  memory: 256Mi
            ---
            apiVersion: v1
            kind: Secret
            metadata:
              name: {{ $name }}-app
              namespace: {{ $ns }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: valkey-conn
              labels:
                platform.adhar.io/database: {{ $name }}
            stringData:
              # valkey:// and redis:// are interchangeable for standard clients.
              uri: "valkey://{{ $host }}:6379"
              host: "{{ $host }}"
              port: "6379"
              engine: "valkey"
    - step: ready
      functionRef:
        name: function-auto-ready
