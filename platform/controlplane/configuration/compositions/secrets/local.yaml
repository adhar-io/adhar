---
# Local Secret composition — materializes a Kubernetes Secret in the requester's
# namespace from the CompositeSecret spec. Self-service secret management without
# handing developers raw Secret RBAC.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: compositesecret-local
  labels:
    feature: secret
    provider: local
spec:
  compositeTypeRef:
    apiVersion: platform.adhar.io/v1alpha1
    kind: CompositeSecret
  mode: Pipeline
  pipeline:
    - step: render
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $xr := .observed.composite.resource -}}
            {{- $name := dig "spec" "name" $xr.metadata.name $xr -}}
            {{- $ns := dig "spec" "namespace" $xr.metadata.namespace $xr -}}
            {{- $logical := dig "spec" "type" "generic" $xr -}}
            {{- /* map the logical XRD type to a real Kubernetes Secret type */ -}}
            {{- $k8sType := "Opaque" -}}
            {{- if eq $logical "tls" }}{{- $k8sType = "kubernetes.io/tls" -}}{{- end -}}
            {{- if eq $logical "docker-registry" }}{{- $k8sType = "kubernetes.io/dockerconfigjson" -}}{{- end -}}
            {{- if eq $logical "service-account" }}{{- $k8sType = "kubernetes.io/service-account-token" -}}{{- end -}}
            {{- $data := dig "spec" "data" dict $xr -}}
            {{- $stringData := dig "spec" "stringData" dict $xr -}}
            ---
            apiVersion: v1
            kind: Secret
            metadata:
              name: {{ $name }}
              namespace: {{ $ns }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: secret
              labels:
                platform.adhar.io/self-service: "true"
            type: {{ $k8sType }}
            {{- if $data }}
            data:
              {{- range $k, $v := $data }}
              {{ $k }}: {{ $v | quote }}
              {{- end }}
            {{- end }}
            {{- if $stringData }}
            stringData:
              {{- range $k, $v := $stringData }}
              {{ $k }}: {{ $v | quote }}
              {{- end }}
            {{- end }}
    - step: ready
      functionRef:
        name: function-auto-ready
