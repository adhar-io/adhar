---
# Pin stable ServiceAccount names for the Kubernetes-native providers.
# By default Crossplane derives the provider SA name from a hash of the package
# reference (e.g. provider-kubernetes-f6665ef36536), which changes on upgrade and
# cannot be referenced from a committed ClusterRoleBinding. A DeploymentRuntimeConfig
# lets us fix the SA name so the RBAC below is stable across provider revisions.
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: provider-kubernetes
spec:
  serviceAccountTemplate:
    metadata:
      name: provider-kubernetes
---
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: provider-helm
spec:
  serviceAccountTemplate:
    metadata:
      name: provider-helm
---
# provider-kubernetes is the control plane's hands for GitOps provisioning: it
# creates the native resources a Composition emits (Crossplane's own RBAC manager
# only grants the provider its CRD types, not arbitrary native targets). This
# scoped ClusterRole enumerates exactly the resource classes the local/GitOps
# compositions provision — environments (namespaces, quotas, limits, netpol),
# ArgoCD apps/projects, workloads, and connection config/secrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: crossplane-provider-kubernetes-compose
  labels:
    app.kubernetes.io/managed-by: adhar
rules:
  # Environments: namespaces + guardrails
  - apiGroups: [""]
    resources: ["namespaces", "resourcequotas", "limitranges", "serviceaccounts", "services", "configmaps", "secrets", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies", "ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # GitOps deployment objects + CI workflows
  - apiGroups: ["argoproj.io"]
    resources: ["applications", "appprojects", "applicationsets", "rollouts", "analysistemplates", "workflows", "workflowtemplates"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Policy governance (compliance compositions emit Kyverno ClusterPolicies)
  - apiGroups: ["kyverno.io"]
    resources: ["clusterpolicies", "policies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # CI pipelines (pipeline composition emits Tekton TaskRuns/PipelineRuns)
  - apiGroups: ["tekton.dev"]
    resources: ["taskruns", "pipelineruns"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Agent workloads (compositions/agent): the AI-gateway policy that IS the
  # agent's grant, and the PrometheusRule that alerts on its declared budget.
  # This is the identity that actually applies composed Objects, so the grant
  # has to be here as well as on Crossplane's own aggregate role.
  # ADR-0026 concept hierarchy: a project owns a Kargo project (promotion
  # pipeline per application) and materialises its credentials with ESO; an
  # organisation and an environment bind their groups with RoleBindings.
  - apiGroups: ["kargo.akuity.io"]
    resources: ["projects", "projectconfigs", "warehouses", "stages", "promotions"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Kargo's admission webhook lets a Promotion be CREATED only by a subject that
  # may `promote` to its Stage (a Kargo-specific verb); a CompositeRelease is
  # created by the provider, so the provider needs it.
  - apiGroups: ["kargo.akuity.io"]
    resources: ["stages"]
    verbs: ["promote"]
  - apiGroups: ["external-secrets.io"]
    resources: ["externalsecrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # An application OBSERVES its project (managementPolicies: [Observe]) to learn
  # where the environments live; read-only on the XR kinds it looks up.
  - apiGroups: ["platform.adhar.io"]
    resources: ["compositeprojects", "compositeenvironments", "compositeapplications"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["agentgateway.dev"]
    resources: ["agentgatewaypolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["prometheusrules", "servicemonitors", "podmonitors"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # CompositeSearch (compositions/search) composes an OpenSearchCluster and the
  # users, roles, index-lifecycle and snapshot policies around it, run by the
  # opensearch-k8s-operator in data/opensearch; CompositeVector
  # (compositions/vector) composes a collections Job and the ESO Password
  # generators both use to mint credentials.
  - apiGroups: ["opensearch.org"]
    resources: ["opensearchactiongroups", "opensearchclusters", "opensearchcomponenttemplates", "opensearchindextemplates", "opensearchismpolicies", "opensearchroles", "opensearchsnapshotpolicies", "opensearchtenants", "opensearchuserrolebindings", "opensearchusers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["generators.external-secrets.io"]
    resources: ["passwords"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # The Qdrant chart (provider-helm, same ClusterRole) emits a
  # PodDisruptionBudget when a CompositeVector asks for more than one replica.
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Workloads a Composition may compose directly
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Per-namespace RBAC a project/environment may set up for its team
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # ...and permission to BIND the built-in roles those RoleBindings reference.
  #
  # Create on rolebindings is NOT sufficient. Kubernetes' privilege-escalation
  # prevention refuses a RoleBinding whose role grants anything the CREATOR does
  # not itself hold, so the team-admin RoleBinding in the project composition
  # failed with "attempting to grant RBAC permissions not currently held"
  # (bindings, endpoints, ...) and every onboarded team silently got a namespace
  # with no owner. The escape hatch is the `bind` verb.
  #
  # resourceNames pins it to the three built-in aggregated roles the platform
  # actually hands to tenants. Without that list this would be `bind` on ALL
  # ClusterRoles -- including cluster-admin -- which would let anyone who can
  # author a Composition grant themselves the cluster. Granting the provider
  # cluster-admin outright, the other common fix, has exactly the same problem.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    resourceNames: ["admin", "edit", "view"]
    verbs: ["bind"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: crossplane-provider-kubernetes-compose
  labels:
    app.kubernetes.io/managed-by: adhar
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: crossplane-provider-kubernetes-compose
subjects:
  - kind: ServiceAccount
    name: provider-kubernetes
    namespace: adhar-system
---
# provider-helm installs Helm releases which touch namespaced workload resources.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: crossplane-provider-helm-compose
  labels:
    app.kubernetes.io/managed-by: adhar
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: crossplane-provider-kubernetes-compose
subjects:
  - kind: ServiceAccount
    name: provider-helm
    namespace: adhar-system
