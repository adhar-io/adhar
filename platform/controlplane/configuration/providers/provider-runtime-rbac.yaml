---
# The runtime every package without a runtimeConfigRef gets: the cloud
# providers (providers/cloud/provider-packages.yaml), the provider families
# they pull in as dependencies, and every Function. Crossplane creates it
# empty; it is declared here for enableServiceLinks alone.
#
# Every package runtime shares the adhar-system namespace (ADR-0011), so
# Kubernetes injects a <SVC>_PORT variable per Service into it. Knative's
# Service/webhook becomes WEBHOOK_PORT=tcp://<ip>:9090, which the upjet
# providers read as their --webhook-port flag and exit on: with Knative
# installed, all four GCP provider pods crash-looped 410 times on
# `strconv.ParseFloat: parsing "tcp://10.110.228.193:9090"` and Crossplane
# reported the providers unhealthy (2026-10-26).
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: default
spec:
  deploymentTemplate:
    spec:
      selector: {}
      template:
        spec:
          enableServiceLinks: false
          # Required by the CRD; Crossplane merges by this name into the
          # runtime container it renders, so naming it changes nothing else.
          containers:
            - name: package-runtime
---
# Pin stable ServiceAccount names for the Kubernetes-native providers.
# By default Crossplane derives the provider SA name from a hash of the package
# reference (e.g. provider-kubernetes-f6665ef36536), which changes on upgrade and
# cannot be referenced from a committed ClusterRoleBinding. A DeploymentRuntimeConfig
# lets us fix the SA name so the RBAC below is stable across provider revisions.
# A named runtime config replaces `default` entirely, so each repeats
# enableServiceLinks: false.
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: provider-kubernetes
spec:
  deploymentTemplate:
    spec:
      selector: {}
      template:
        spec:
          enableServiceLinks: false
          # Required by the CRD; Crossplane merges by this name into the
          # runtime container it renders, so naming it changes nothing else.
          containers:
            - name: package-runtime
  serviceAccountTemplate:
    metadata:
      name: provider-kubernetes
---
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: provider-helm
spec:
  deploymentTemplate:
    spec:
      selector: {}
      template:
        spec:
          enableServiceLinks: false
          # Required by the CRD; Crossplane merges by this name into the
          # runtime container it renders, so naming it changes nothing else.
          containers:
            - name: package-runtime
  serviceAccountTemplate:
    metadata:
      name: provider-helm
---
# provider-kubernetes is the control plane's hands for GitOps provisioning: it
# creates the native resources a Composition emits (Crossplane's own RBAC manager
# only grants the provider its CRD types, not arbitrary native targets). This
# scoped ClusterRole enumerates exactly the resource classes the local/GitOps
# compositions provision — environments (namespaces, quotas, limits, netpol),
# ArgoCD apps/projects, workloads, and connection config/secrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: crossplane-provider-kubernetes-compose
  labels:
    app.kubernetes.io/managed-by: adhar
rules:
  # Environments: namespaces + guardrails
  - apiGroups: [""]
    resources: ["namespaces", "resourcequotas", "limitranges", "serviceaccounts", "services", "configmaps", "secrets", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies", "ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # The environment composition admits the Gateway's data path with a
  # CiliumNetworkPolicy (the `ingress` entity has no namespace a Kubernetes
  # NetworkPolicy could select).
  - apiGroups: ["cilium.io"]
    resources: ["ciliumnetworkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # GitOps deployment objects + CI workflows
  - apiGroups: ["argoproj.io"]
    resources: ["applications", "appprojects", "applicationsets", "rollouts", "analysistemplates", "workflows", "workflowtemplates"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Policy governance (compliance compositions emit Kyverno ClusterPolicies)
  - apiGroups: ["kyverno.io"]
    resources: ["clusterpolicies", "policies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # CI pipelines (pipeline composition emits Tekton TaskRuns/PipelineRuns)
  - apiGroups: ["tekton.dev"]
    resources: ["taskruns", "pipelineruns"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Function composition emits a Knative Service via provider-kubernetes.
  - apiGroups: ["serving.knative.dev"]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # ...and the edge in front of it (compositions/function): a DomainMapping for
  # its public host, the HTTPRoute on adhar-gateway that sends that host to
  # Kourier, and the ReferenceGrant in knative-serving that lets the route name
  # Kourier's Service from the function's namespace.
  - apiGroups: ["serving.knative.dev"]
    resources: ["domainmappings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes", "referencegrants"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # The DomainMapping's ClusterDomainClaim is composed create-only, so a host
  # another namespace holds is never taken over or released: no update, no
  # delete. `patch` is the server-side dry run provider-kubernetes computes
  # desired state with, even for an Object it may only create.
  - apiGroups: ["networking.internal.knative.dev"]
    resources: ["clusterdomainclaims"]
    verbs: ["get", "list", "watch", "create", "patch"]
  # A Function's event sources: cron is a PingSource, cloudevent a Trigger on
  # the namespace's Broker (created when absent), topic a Dapr Subscription.
  - apiGroups: ["sources.knative.dev"]
    resources: ["pingsources"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["eventing.knative.dev"]
    resources: ["triggers", "brokers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["dapr.io"]
    resources: ["subscriptions"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Every environment's Dapr building blocks (compositions/env/local.yaml): the
  # pubsub / statestore / lockstore / configstore / secretstore Components, the
  # adhar-dapr Configuration its apps name in dapr.io/config, and the default
  # Resiliency. Without these the Objects sit at "forbidden" and an app that
  # names adhar-dapr has a sidecar that cannot load its configuration.
  - apiGroups: ["dapr.io"]
    resources: ["components", "configurations", "resiliencies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Agent workloads (compositions/agent): the AI-gateway policy that IS the
  # agent's grant, and the PrometheusRule that alerts on its declared budget.
  # This is the identity that actually applies composed Objects, so the grant
  # has to be here as well as on Crossplane's own aggregate role.
  # ADR-0026 concept hierarchy: a project owns a Kargo project (promotion
  # pipeline per application) and materialises its credentials with ESO; an
  # organisation and an environment bind their groups with RoleBindings.
  - apiGroups: ["kargo.akuity.io"]
    # freights: the Project composition grants a Release's Job `get, list` on
    # them, and Kubernetes lets a Role grant only what its creator holds.
    resources: ["projects", "projectconfigs", "warehouses", "stages", "promotions", "freights"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Kargo's admission webhook lets a Promotion be CREATED only by a subject that
  # may `promote` to its Stage (a Kargo-specific verb); a Release is
  # created by the provider, so the provider needs it.
  - apiGroups: ["kargo.akuity.io"]
    resources: ["stages"]
    verbs: ["promote"]
  - apiGroups: ["external-secrets.io"]
    resources: ["externalsecrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # An application OBSERVES its project (managementPolicies: [Observe]) to learn
  # where the environments live; read-only on the XR kinds it looks up.
  - apiGroups: ["platform.adhar.io"]
    resources: ["projects", "environments", "applications"]
    # An observe-only Object still computes its desired state with a server-side
    # dry run, which is a PATCH: without it every Application XR sat at
    # "Unready resources: project" with "cannot dry run SSA ... forbidden"
    # (2026-10-17). Observe policy never applies the result, so this grants no
    # power to change an XR.
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["agentgateway.dev"]
    resources: ["agentgatewaypolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["prometheusrules", "servicemonitors", "podmonitors"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Search (compositions/search) composes an OpenSearchCluster and the
  # users, roles, index-lifecycle and snapshot policies around it, run by the
  # opensearch-k8s-operator in data/opensearch; Vector
  # (compositions/vector) composes a collections Job and the ESO Password
  # generators both use to mint credentials.
  - apiGroups: ["opensearch.org"]
    resources: ["opensearchactiongroups", "opensearchclusters", "opensearchcomponenttemplates", "opensearchindextemplates", "opensearchismpolicies", "opensearchroles", "opensearchsnapshotpolicies", "opensearchtenants", "opensearchuserrolebindings", "opensearchusers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["generators.external-secrets.io"]
    resources: ["passwords"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # The Qdrant chart (provider-helm, same ClusterRole) emits a
  # PodDisruptionBudget when a Vector asks for more than one replica.
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Workloads a Composition may compose directly
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Per-namespace RBAC a project/environment may set up for its team
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # ...and permission to BIND the built-in roles those RoleBindings reference.
  #
  # Create on rolebindings is NOT sufficient. Kubernetes' privilege-escalation
  # prevention refuses a RoleBinding whose role grants anything the CREATOR does
  # not itself hold, so the team-admin RoleBinding in the project composition
  # failed with "attempting to grant RBAC permissions not currently held"
  # (bindings, endpoints, ...) and every onboarded team silently got a namespace
  # with no owner. The escape hatch is the `bind` verb.
  #
  # resourceNames pins it to the three built-in aggregated roles the platform
  # actually hands to tenants. Without that list this would be `bind` on ALL
  # ClusterRoles -- including cluster-admin -- which would let anyone who can
  # author a Composition grant themselves the cluster. Granting the provider
  # cluster-admin outright, the other common fix, has exactly the same problem.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    resourceNames: ["admin", "edit", "view"]
    verbs: ["bind"]
  # The project composition's resilience gate binds two more roles the
  # provider does not itself hold: the Kargo verification Jobs' ClusterRole
  # (pods, pods/log read; jobs deletecollection) and the gate runner's Role.
  # Both RoleBindings were refused with "attempting to grant RBAC permissions
  # not currently held" and Project adhar sat at "Unready resources:
  # resilience-gate-kargo-jobs, resilience-gate-runner" (2026-10-26). Pinned by
  # name for the same reason as above.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    resourceNames: ["adhar-kargo-verification-jobs"]
    verbs: ["bind"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles"]
    resourceNames: ["adhar-resilience-gate"]
    verbs: ["bind"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: crossplane-provider-kubernetes-compose
  labels:
    app.kubernetes.io/managed-by: adhar
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: crossplane-provider-kubernetes-compose
subjects:
  - kind: ServiceAccount
    name: provider-kubernetes
    namespace: adhar-system
---
# provider-helm installs Helm releases which touch namespaced workload resources.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: crossplane-provider-helm-compose
  labels:
    app.kubernetes.io/managed-by: adhar
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: crossplane-provider-kubernetes-compose
subjects:
  - kind: ServiceAccount
    name: provider-helm
    namespace: adhar-system
