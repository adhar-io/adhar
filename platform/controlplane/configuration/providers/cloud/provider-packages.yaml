# DigitalOcean: crossplane-contrib/provider-digitalocean (the old
# kubernetes.digitalocean.crossplane.io API) is archived and its package is no
# longer published anywhere; the maintained replacement is the upjet-generated
# provider-upjet-digitalocean (API group digitalocean.crossplane.io). Civo: the
# only published package is xpkg.upbound.io/civo/provider-civo:v0.1
# (cluster.civo.crossplane.io/v1alpha1 CivoKubernetes) — unverified on a live
# Civo account.
#
# Provider packages come from the community registry (xpkg.crossplane.io,
# crossplane-contrib). The Upbound-published `upbound/provider-*` packages from
# v2.0.0 on refuse to start on vanilla Crossplane ("this Upbound Official
# package version is only compatible with Upbound Crossplane (UXP)") — verified
# live: 11 provider pods crash-looping. The crossplane-contrib builds are the
# same upjet providers and serve the same API groups (*.aws.m.upbound.io etc.),
# so compositions are unchanged; only the package reference differs.
# Cloud Crossplane Provider packages. Applied best-effort by the controller and
# only meaningful in cloud mode (they are heavy and unnecessary on a local Kind
# node). Versions are kept in sync with ../../crossplane.yaml dependsOn.
# AWS (Upbound, modular)
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-aws-eks
spec:
  package: xpkg.crossplane.io/crossplane-contrib/provider-aws-eks:v2.0.0
---
