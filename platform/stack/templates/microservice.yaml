# Template: microservice
# A Helm-chart microservice deployed through the Adhar control plane. Swap the
# source.repoURL/chart for your service's chart. Instantiated identically by the
# CLI (`adhar apps deploy <name> --template microservice`) and the Console.
apiVersion: platform.adhar.io/v1alpha1
kind: CompositeApplication
metadata:
  name: ${APP_NAME}
  namespace: ${APP_NAMESPACE}
spec:
  crossplane:
    compositionSelector:
      matchLabels:
        feature: application
        provider: local
  parameters:
    displayName: ${APP_NAME}
    project: default
    description: "Microservice ${APP_NAME} created from the microservice template"
    source:
      repoURL: https://charts.bitnami.com/bitnami
      chart: nginx
      targetRevision: "18.*"
      helm:
        releaseName: ${APP_NAME}
        # Bitnami retired its free Docker Hub tags in 2025: the chart still resolves,
        # but the images it references (docker.io/bitnami/nginx:…-r0) answer
        #   not found
        # and every pod sits in ImagePullBackOff — which reads as a platform fault
        # rather than an upstream policy change. The images live under
        # `bitnamilegacy` now, and the chart refuses a non-bitnami repository unless
        # allowInsecureImages is set. The platform's own Jobs already pull from
        # bitnamilegacy for the same reason.
        values: |
          global:
            security:
              allowInsecureImages: true
          image:
            repository: bitnamilegacy/nginx
    destination:
      namespace: ${APP_NAMESPACE}
      server: https://kubernetes.default.svc
