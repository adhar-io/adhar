# What a run pod must look like (design 0025 §10.3). Audit in Phase 1, Enforce in
# Phase 3 once real jobs have been seen against it: the composition already renders
# every one of these, so a finding here means somebody wrote a run by hand.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: adhar-batch-pod-standards
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    policies.kyverno.io/title: "Batch: run pod standards"
    policies.kyverno.io/category: Batch
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Job
    policies.kyverno.io/description: >-
      A batch run sets memory request = limit, restartPolicy Never and a batch
      PriorityClass, mounts no PersistentVolumeClaim (a node-local volume pins a
      preemptible pod to one node) and has a deadline and a TTL.
spec:
  background: true
  rules:
    - name: a-run-has-a-deadline-and-a-ttl
      match: &batchRuns
        any:
          - resources:
              kinds: ["batch/v1/Job"]
              selector:
                matchLabels:
                  adhar.io/workload: batch
      validate:
        failureAction: Audit
        message: A batch run needs activeDeadlineSeconds and ttlSecondsAfterFinished (design 0025 INV-1).
        pattern:
          spec:
            activeDeadlineSeconds: ">0"
            ttlSecondsAfterFinished: ">=0"
    - name: a-run-pod-never-restarts-in-place-and-uses-a-batch-class
      match: *batchRuns
      validate:
        failureAction: Audit
        message: A batch run pod needs restartPolicy Never and the PriorityClass adhar-batch or adhar-batch-critical.
        pattern:
          spec:
            template:
              spec:
                restartPolicy: Never
                priorityClassName: "adhar-batch | adhar-batch-critical"
    - name: a-run-mounts-no-persistent-volume
      match: *batchRuns
      validate:
        failureAction: Audit
        message: A batch run pod may not mount a PersistentVolumeClaim; a node-local volume pins a preemptible pod to one node.
        pattern:
          spec:
            template:
              spec:
                =(volumes):
                  - X(persistentVolumeClaim): "null"
    - name: a-run-containers-memory-request-equals-its-limit
      match: *batchRuns
      validate:
        failureAction: Audit
        message: A batch run's memory request must equal its limit; a run overcommitted on memory is the one the kernel kills.
        foreach:
          - list: request.object.spec.template.spec.containers
            deny:
              conditions:
                any:
                  - key: "{{ element.resources.requests.memory || '' }}"
                    operator: NotEquals
                    value: "{{ element.resources.limits.memory || 'absent' }}"
