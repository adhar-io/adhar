# Volcano: which queue a namespace's batch runs on, and what a Volcano run looks
# like (design 0025 §4.3, §10.3; PLAT-2.4).
#
# WHY THIS FILE IS IN manifests/volcano/ AND NOT manifests/ (2026-11-14). The design
# names core/adhar-batch/manifests/kyverno-queue.yaml. Kyverno refuses a policy
# naming a kind the cluster does not serve, and adhar-batch is enabled in every
# profile while Volcano is enabled in none until the production gate (§15): in
# manifests/ this policy would fail every adhar-batch sync on every cluster. The
# ApplicationSet syncs a manifestPath non-recursively, so this directory is synced
# only by its own element, `adhar-batch-volcano`, enabled exactly where `volcano`
# is (the vllm/cpu precedent of one package with several elements).
#
# Volcano's own job admission checks only that a queue is an open leaf [S29], and
# its NamespaceQueue is alpha and off [S2], so without this any namespace could
# name any queue: a dev backlog could spend prod's share, or one team another's.
# The leaf of a namespace is `<organisation>-<team>-<tier>` from its labels — the
# Team composition (compositions/team/local.yaml) composes exactly those, team ×
# TIER, so an environment named `staging` of tier `test` runs on the team's test
# leaf. `adhar.io/tier` is what the Environment composition always stamps
# (dev|test|prod); `adhar.io/environment` is the environment's NAME.
#
#   adhar-batch-queue-default (mutate): defaults an unset (or Volcano's own
#     `default`) queue to the namespace's leaf on a Volcano Job, a Volcano CronJob's
#     job template, the pod template of a batch/v1 Job or CronJob whose pods Volcano
#     schedules (a single run on Volcano), and a plain Pod that names schedulerName
#     volcano (its `scheduling.volcano.sh/queue-name` annotation, which Volcano's
#     PodGroup controller reads [S19]).
#   adhar-batch-queue-binding (Enforce): denies any other queue on those and on a
#     PodGroup written by hand, and a leaf whose Queue is not labelled as this
#     namespace's team's — the composition refuses to adopt such a name, and this
#     keeps a team whose `<organisation>-<team>` spells another's off the other's
#     queue. It also keeps every Volcano run reclaimable (volcano.sh/preemptable).
#     Design 0025 §10.3 names one Mutate + Enforce policy; it is two because a
#     policy mixing mutate and validate rules reports each validate rule twice in the
#     kyverno CLI, so its tests could not tell a pass from a skip (2026-11-14).
#   adhar-batch-volcano-pod-standards (Audit, Enforce in Phase 3): the batch pod
#     standards of kyverno-pod-standards.yaml, written for spec.tasks[*].template
#     because Kyverno's autogen covers only the built-in controllers [S89].
#
# FAILURE POLICY (user decision DEC-4, 2026-11-14; Kyverno's global
# forceFailurePolicyIgnore is off, so each policy's own value is what the webhook
# gets). adhar-batch-queue-binding fails CLOSED: while Kyverno is down a person's
# Volcano run is refused, never admitted onto an unchecked queue. The defaulting
# policy and the pod standards fail open: a run the default could not fix is refused
# by the binding anyway, and a standards finding is an audit. The controllers that
# execute an admitted run never reach the binding's webhook (matchConditions), so an
# outage stops no scheduled run: Volcano's own, and Kubernetes' CronJob and Job
# controllers creating the Jobs and pods of a batch/v1 CronJob or Job (a scheduled
# single run on Volcano is one, design 0025 §6.4). Those are excluded only for what
# they create on behalf of a batch/v1 Job or CronJob (the controller
# ownerReference), because `system:kube-controller-manager` is EVERY controller on a
# cluster that does not run with --use-service-account-credentials, and a
# Deployment's pods must still be checked. What they create derives from a pod
# template this policy already checked on the Job or CronJob, which is why those
# templates must name the leaf themselves: during an outage the defaulting policy
# does not run on the job-controller's pods, and a pod that names no queue would land
# on Volcano's `default`.
#
# Every comparison of a client-written string is a JMESPath boolean, never a
# string condition: conditions treat a string as a wildcard pattern, so a queue
# `*` would have been "unset" to the defaulting rule and "empty" to the pod check.
#
# Volcano's controllers are excluded by USERNAME, as in kyverno-run-integrity.yaml:
# what they create (a CronJob's Jobs, a Job's PodGroup and pods, a PodGroup for an
# annotated pod) derives from an object this policy already admitted, and a Kyverno
# outage must not stop scheduled runs. matchConditions and the rules' preconditions
# hold the same name, in case a Kyverno release stops propagating matchConditions.
#
# Kyverno's admission controller reads the namespace (it is bound to `view`) and
# the leaf Queue, which rbac.yaml beside this file grants it by aggregation.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: adhar-batch-queue-default
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    # The pod rules are for pods that name volcano themselves; a workload's pods
    # are mutated as they are created, never its template (no Argo CD diff). The
    # one template defaulted is a Volcano-scheduled batch/v1 Job's or CronJob's,
    # which the BatchJob composition always names, so it too never diffs.
    pod-policies.kyverno.io/autogen-controllers: none
    policies.kyverno.io/title: "Batch: default a namespace's runs to its team's queue"
    policies.kyverno.io/category: Batch
    policies.kyverno.io/subject: Job, CronJob, Pod
    policies.kyverno.io/description: >-
      A Volcano Job, CronJob or pod, or a Job or CronJob whose pods Volcano
      schedules, in a team's environment namespace that names no queue (or
      Volcano's default) is put on the team's leaf queue for the namespace's tier,
      <organisation>-<team>-<tier>.
spec:
  background: false
  webhookConfiguration:
    failurePolicy: Ignore
    matchConditions:
      - name: not-volcanos-own-controllers
        expression: "request.userInfo.username != 'system:serviceaccount:adhar-system:volcano-controllers'"
  rules:
    - name: default-a-volcano-job-to-its-team-queue
      match:
        any:
          - resources:
              kinds: ["batch.volcano.sh/v1alpha1/Job"]
              operations: ["CREATE"]
              namespaceSelector: &teamNamespaces
                matchExpressions:
                  - { key: adhar.io/organisation, operator: Exists }
                  - { key: adhar.io/team, operator: Exists }
                  - { key: adhar.io/tier, operator: In, values: [dev, test, prod] }
      context: &leaf
        - name: ns
          apiCall:
            urlPath: "/api/v1/namespaces/{{ request.namespace }}"
            jmesPath: "metadata.labels"
        - name: leaf
          variable:
            jmesPath: >-
              join('-', [ns."adhar.io/organisation", ns."adhar.io/team", ns."adhar.io/tier"])
      preconditions:
        all:
          - key: "{{ request.userInfo.username }}"
            operator: NotEquals
            value: system:serviceaccount:adhar-system:volcano-controllers
          - key: "{{ contains(['', 'default'], request.object.spec.queue || '') }}"
            operator: Equals
            value: true
      mutate:
        patchStrategicMerge:
          spec:
            queue: "{{ leaf }}"
    - name: default-a-volcano-cronjob-to-its-team-queue
      match:
        any:
          - resources:
              kinds: ["batch.volcano.sh/v1alpha1/CronJob"]
              operations: ["CREATE", "UPDATE"]
              namespaceSelector: *teamNamespaces
      context: *leaf
      preconditions:
        all:
          - key: "{{ request.userInfo.username }}"
            operator: NotEquals
            value: system:serviceaccount:adhar-system:volcano-controllers
          - key: "{{ contains(['', 'default'], request.object.spec.jobTemplate.spec.queue || '') }}"
            operator: Equals
            value: true
      mutate:
        patchStrategicMerge:
          spec:
            jobTemplate:
              spec:
                queue: "{{ leaf }}"
    # A batch/v1 Job or CronJob whose pods Volcano schedules (a single run on Volcano:
    # the composition changes only the pod template, design 0025 §6.4). Defaulted on
    # the template, because the binding below requires the template to name the leaf:
    # the job-controller's pods are not checked again.
    - name: default-a-volcano-scheduled-job-to-its-team-queue
      match:
        any:
          - resources:
              kinds: ["batch/v1/Job"]
              operations: ["CREATE"]
              namespaceSelector: *teamNamespaces
      context: *leaf
      preconditions:
        all:
          - key: "{{ request.userInfo.username }}"
            operator: NotEquals
            value: system:serviceaccount:adhar-system:volcano-controllers
          - key: "{{ request.object.spec.template.spec.schedulerName == 'volcano' }}"
            operator: Equals
            value: true
          - key: "{{ contains(['', 'default'], request.object.spec.template.metadata.annotations.\"scheduling.volcano.sh/queue-name\" || '') }}"
            operator: Equals
            value: true
      mutate:
        patchStrategicMerge:
          spec:
            template:
              metadata:
                annotations:
                  scheduling.volcano.sh/queue-name: "{{ leaf }}"
    - name: default-a-volcano-scheduled-cronjob-to-its-team-queue
      match:
        any:
          - resources:
              kinds: ["batch/v1/CronJob"]
              operations: ["CREATE", "UPDATE"]
              namespaceSelector: *teamNamespaces
      context: *leaf
      preconditions:
        all:
          - key: "{{ request.userInfo.username }}"
            operator: NotEquals
            value: system:serviceaccount:adhar-system:volcano-controllers
          - key: "{{ request.object.spec.jobTemplate.spec.template.spec.schedulerName == 'volcano' }}"
            operator: Equals
            value: true
          - key: "{{ contains(['', 'default'], request.object.spec.jobTemplate.spec.template.metadata.annotations.\"scheduling.volcano.sh/queue-name\" || '') }}"
            operator: Equals
            value: true
      mutate:
        patchStrategicMerge:
          spec:
            jobTemplate:
              spec:
                template:
                  metadata:
                    annotations:
                      scheduling.volcano.sh/queue-name: "{{ leaf }}"
    # A pod that names Volcano itself (not one of a Volcano Job's, which carry
    # scheduling.k8s.io/group-name and inherit the Job's queue through its PodGroup).
    - name: default-a-volcano-pod-to-its-team-queue
      match:
        any:
          - resources:
              kinds: ["Pod"]
              operations: ["CREATE"]
              namespaceSelector: *teamNamespaces
      context: *leaf
      preconditions:
        all:
          - key: "{{ request.userInfo.username }}"
            operator: NotEquals
            value: system:serviceaccount:adhar-system:volcano-controllers
          - key: "{{ request.object.spec.schedulerName == 'volcano' }}"
            operator: Equals
            value: true
          - key: "{{ (request.object.metadata.annotations.\"scheduling.k8s.io/group-name\" || '') == '' }}"
            operator: Equals
            value: true
          - key: "{{ contains(['', 'default'], request.object.metadata.annotations.\"scheduling.volcano.sh/queue-name\" || '') }}"
            operator: Equals
            value: true
      mutate:
        patchStrategicMerge:
          metadata:
            annotations:
              scheduling.volcano.sh/queue-name: "{{ leaf }}"
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: adhar-batch-queue-binding
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    pod-policies.kyverno.io/autogen-controllers: none
    policies.kyverno.io/title: "Batch: a namespace runs on its team's queue"
    policies.kyverno.io/category: Batch
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Job, CronJob, PodGroup, Pod
    policies.kyverno.io/description: >-
      A Volcano Job, CronJob, PodGroup or pod, or a Job or CronJob whose pods Volcano
      schedules, in a team's environment namespace runs on that team's leaf queue
      for the namespace's tier, <organisation>-<team>-<tier>, and that Queue is the
      team's: any other is denied, including another team's. No Volcano run may opt
      out of reclaim with volcano.sh/preemptable.
spec:
  background: false
  webhookConfiguration:
    failurePolicy: Fail
    matchConditions:
      - name: not-volcanos-own-controllers
        expression: "request.userInfo.username != 'system:serviceaccount:adhar-system:volcano-controllers'"
      # Kubernetes' CronJob and Job controllers creating (or, removing the job
      # tracking finalizer, updating) the Jobs and pods of a batch/v1 CronJob or Job,
      # whose templates the rules below checked (2026-11-14). Without this a
      # scheduled single run on Volcano waits for Kyverno. Only for objects whose
      # CONTROLLER owner is a batch/v1 Job or CronJob: `system:kube-controller-manager`
      # is every controller where per-controller credentials are off.
      - name: not-the-job-controllers-own-runs
        expression: >-
          !(request.userInfo.username in [
          'system:serviceaccount:kube-system:job-controller',
          'system:serviceaccount:kube-system:cronjob-controller',
          'system:kube-controller-manager'] &&
          object != null && has(object.metadata.ownerReferences) &&
          object.metadata.ownerReferences.exists(r, r.apiVersion == 'batch/v1' &&
          (r.kind == 'Job' || r.kind == 'CronJob') && has(r.controller) && r.controller))
      # Fail closed for what Volcano schedules ONLY (DEC-4, 2026-11-14). The policy
      # matches every Pod, Job and CronJob CREATE and UPDATE by kind, so without this
      # a Kyverno outage would refuse every pod and every Job in the cluster. A pod is
      # in scope when it, or the object it replaces, names schedulerName volcano or
      # carries Volcano's queue or group annotation: exactly the pods the Pod rules
      # below check; a batch/v1 Job or CronJob when its pod template does. Volcano's
      # own kinds are always in scope. A client can only bring an object INTO scope
      # this way: a pod with none of the three is one Volcano never schedules or
      # evicts. TestFailClosedPoliciesReachOnlyWhatTheyCheck runs it on a real API
      # server.
      - name: only-what-volcano-schedules
        expression: >-
          request.kind.group == 'batch' ?
          [object, oldObject].exists(o, o != null &&
          [request.kind.kind == 'CronJob' ? o.spec.jobTemplate.spec.template : o.spec.template].exists(t,
          (has(t.spec) && has(t.spec.schedulerName) && t.spec.schedulerName == 'volcano') ||
          (has(t.metadata) && has(t.metadata.annotations) &&
          ('scheduling.volcano.sh/queue-name' in t.metadata.annotations ||
          'scheduling.k8s.io/group-name' in t.metadata.annotations)))) :
          (request.kind.group != '' ||
          [object, oldObject].exists(o, o != null && (
          (has(o.spec.schedulerName) && o.spec.schedulerName == 'volcano') ||
          (has(o.metadata.annotations) &&
          ('scheduling.volcano.sh/queue-name' in o.metadata.annotations ||
          'scheduling.k8s.io/group-name' in o.metadata.annotations)))))
  rules:
    - name: a-volcano-job-names-its-team-queue
      match:
        any:
          - resources:
              kinds: ["batch.volcano.sh/v1alpha1/Job"]
              operations: ["CREATE", "UPDATE"]
              namespaceSelector: &teamNamespaces
                matchExpressions:
                  - { key: adhar.io/organisation, operator: Exists }
                  - { key: adhar.io/team, operator: Exists }
                  - { key: adhar.io/tier, operator: In, values: [dev, test, prod] }
      context: &leaf
        - name: ns
          apiCall:
            urlPath: "/api/v1/namespaces/{{ request.namespace }}"
            jmesPath: "metadata.labels"
        - name: leaf
          variable:
            jmesPath: >-
              join('-', [ns."adhar.io/organisation", ns."adhar.io/team", ns."adhar.io/tier"])
      preconditions: &createdOrQueueChanged
        all:
          - key: "{{ request.userInfo.username }}"
            operator: NotEquals
            value: system:serviceaccount:adhar-system:volcano-controllers
        any:
          - key: "{{ request.operation }}"
            operator: Equals
            value: CREATE
          - key: "{{ (request.object.spec.queue || '') == (request.oldObject.spec.queue || '') }}"
            operator: Equals
            value: false
      validate:
        failureAction: Enforce
        message: >-
          Namespace {{ request.namespace }} runs batch on queue {{ leaf }} (its team's
          leaf for its tier); spec.queue {{ request.object.spec.queue || '(unset)' }} is not
          that queue.
        deny:
          conditions:
            any:
              - key: "{{ (request.object.spec.queue || '') == leaf }}"
                operator: Equals
                value: false
    - name: a-volcano-cronjob-names-its-team-queue
      match:
        any:
          - resources:
              kinds: ["batch.volcano.sh/v1alpha1/CronJob"]
              operations: ["CREATE", "UPDATE"]
              namespaceSelector: *teamNamespaces
      context: *leaf
      preconditions:
        all:
          - key: "{{ request.userInfo.username }}"
            operator: NotEquals
            value: system:serviceaccount:adhar-system:volcano-controllers
        any:
          - key: "{{ request.operation }}"
            operator: Equals
            value: CREATE
          - key: "{{ (request.object.spec.jobTemplate.spec.queue || '') == (request.oldObject.spec.jobTemplate.spec.queue || '') }}"
            operator: Equals
            value: false
      validate:
        failureAction: Enforce
        message: >-
          Namespace {{ request.namespace }} runs batch on queue {{ leaf }} (its team's
          leaf for its tier); spec.jobTemplate.spec.queue
          {{ request.object.spec.jobTemplate.spec.queue || '(unset)' }} is not that queue.
        deny:
          conditions:
            any:
              - key: "{{ (request.object.spec.jobTemplate.spec.queue || '') == leaf }}"
                operator: Equals
                value: false
    # A PodGroup written by hand (a pod may name one with scheduling.k8s.io/group-name).
    - name: a-podgroup-names-its-team-queue
      match:
        any:
          - resources:
              kinds: ["scheduling.volcano.sh/v1beta1/PodGroup"]
              operations: ["CREATE", "UPDATE"]
              namespaceSelector: *teamNamespaces
      context: *leaf
      preconditions: *createdOrQueueChanged
      validate:
        failureAction: Enforce
        message: >-
          Namespace {{ request.namespace }} runs batch on queue {{ leaf }} (its team's
          leaf for its tier); spec.queue {{ request.object.spec.queue || '(unset)' }} is not
          that queue.
        deny:
          conditions:
            any:
              - key: "{{ (request.object.spec.queue || '') == leaf }}"
                operator: Equals
                value: false
    # UPDATE too, when the annotation changes or goes (2026-11-14): Volcano's PodGroup
    # controller REBUILDS a Deployment's or StatefulSet's PodGroup from one of its pods
    # on every ReplicaSet/StatefulSet event (createOrUpdateNormalPodPG), queue
    # included, and writes it as volcano-controllers, which this policy excludes. A
    # pod re-annotated after creation would otherwise move its whole workload onto
    # another team's queue, or (annotation removed) onto Volcano's `default`.
    # The Job and CronJob controllers' pods are the webhook's second matchCondition,
    # held here too: their template was checked on the Job or CronJob (below).
    - name: a-volcano-pod-names-its-team-queue
      match:
        any:
          - resources:
              kinds: ["Pod"]
              operations: ["CREATE", "UPDATE"]
              namespaceSelector: *teamNamespaces
      context: *leaf
      preconditions:
        all:
          - key: "{{ request.userInfo.username }}"
            operator: NotEquals
            value: system:serviceaccount:adhar-system:volcano-controllers
          - &notTheJobControllersOwnRuns
            key: >-
              {{ contains(['system:serviceaccount:kube-system:job-controller', 'system:serviceaccount:kube-system:cronjob-controller', 'system:kube-controller-manager'], request.userInfo.username)
              && length(request.object.metadata.ownerReferences[?apiVersion == 'batch/v1' && (kind == 'Job' || kind == 'CronJob') && controller] || `[]`) > `0` }}
            operator: Equals
            value: false
        any:
          - key: "{{ request.operation == 'CREATE' && (request.object.metadata.annotations.\"scheduling.volcano.sh/queue-name\" || '') != '' }}"
            operator: Equals
            value: true
          - key: "{{ request.operation == 'UPDATE' && (request.object.metadata.annotations.\"scheduling.volcano.sh/queue-name\" || '') != (request.oldObject.metadata.annotations.\"scheduling.volcano.sh/queue-name\" || '') }}"
            operator: Equals
            value: true
      validate:
        failureAction: Enforce
        message: >-
          Namespace {{ request.namespace }} runs batch on queue {{ leaf }} (its team's
          leaf for its tier); the pod's scheduling.volcano.sh/queue-name is not that queue.
        deny:
          conditions:
            any:
              - key: "{{ (request.object.metadata.annotations.\"scheduling.volcano.sh/queue-name\" || '') == leaf }}"
                operator: Equals
                value: false
    # A pod that carries scheduling.k8s.io/group-name but is not scheduled by Volcano
    # (A2.7 edge, 2026-11-14). Volcano's scheduler cache builds a job from ANY pod
    # naming a PodGroup, whoever schedules it, and every job in its session is a
    # reclaim and preempt candidate: such a pod, placed by kube-scheduler, could be
    # evicted by Volcano although Volcano never scheduled it. The annotation is
    # Volcano's own; only pods that name schedulerName volcano may carry it.
    - name: a-group-name-pod-is-scheduled-by-volcano
      match:
        any:
          - resources:
              kinds: ["Pod"]
              operations: ["CREATE", "UPDATE"]
              namespaceSelector: *teamNamespaces
      context: *leaf
      preconditions:
        all:
          - key: "{{ request.userInfo.username }}"
            operator: NotEquals
            value: system:serviceaccount:adhar-system:volcano-controllers
          - *notTheJobControllersOwnRuns
      validate:
        failureAction: Enforce
        message: >-
          scheduling.k8s.io/group-name is for pods Volcano schedules (schedulerName
          volcano); Volcano's scheduler cache makes any pod that carries it a reclaim
          and preempt victim, so a pod on {{ request.object.spec.schedulerName || 'default-scheduler' }}
          may not (design 0025 A2.7). Leaf of this namespace: {{ leaf }}.
        deny:
          conditions:
            all:
              - key: "{{ (request.object.metadata.annotations.\"scheduling.k8s.io/group-name\" || '') != '' }}"
                operator: Equals
                value: true
              - key: "{{ (request.object.spec.schedulerName || 'default-scheduler') == 'volcano' }}"
                operator: Equals
                value: false
    # A batch/v1 Job or CronJob whose pods Volcano schedules (a single run on Volcano,
    # design 0025 §6.4), checked on its POD TEMPLATE (2026-11-14): the Job and CronJob
    # controllers' pods and Jobs are not checked again, so a CronJob that fires during
    # a Kyverno outage still runs. The template must NAME the leaf, not merely not
    # name another: the defaulting policy fails open and does not run on the
    # job-controller's pods, and a pod naming no queue lands on Volcano's `default`.
    # Every UPDATE is checked, as for the plugins: a suspended Job's template
    # annotations are mutable until it starts, and a CronJob's always are.
    - name: a-volcano-scheduled-job-names-its-team-queue
      match:
        any:
          - resources:
              kinds: ["batch/v1/Job", "batch/v1/CronJob"]
              operations: ["CREATE", "UPDATE"]
              namespaceSelector: *teamNamespaces
      context: &leafAndPodTemplate
        - name: ns
          apiCall:
            urlPath: "/api/v1/namespaces/{{ request.namespace }}"
            jmesPath: "metadata.labels"
        - name: leaf
          variable:
            jmesPath: >-
              join('-', [ns."adhar.io/organisation", ns."adhar.io/team", ns."adhar.io/tier"])
        - name: podTemplate
          variable:
            jmesPath: "request.object.spec.jobTemplate.spec.template || request.object.spec.template || `{}`"
      preconditions:
        all:
          - key: "{{ request.userInfo.username }}"
            operator: NotEquals
            value: system:serviceaccount:adhar-system:volcano-controllers
          - *notTheJobControllersOwnRuns
        any:
          - key: "{{ podTemplate.spec.schedulerName == 'volcano' }}"
            operator: Equals
            value: true
          - key: "{{ length(podTemplate.metadata.annotations.\"scheduling.volcano.sh/queue-name\" || '') > `0` }}"
            operator: Equals
            value: true
      validate:
        failureAction: Enforce
        message: >-
          Namespace {{ request.namespace }} runs batch on queue {{ leaf }} (its team's
          leaf for its tier); this {{ request.object.kind }}'s pod template names
          scheduling.volcano.sh/queue-name
          {{ podTemplate.metadata.annotations."scheduling.volcano.sh/queue-name" || '(unset)' }}, not that queue.
        deny:
          conditions:
            any:
              - key: "{{ contains([leaf], podTemplate.metadata.annotations.\"scheduling.volcano.sh/queue-name\" || '') }}"
                operator: Equals
                value: false
    - name: a-group-name-template-is-scheduled-by-volcano
      match:
        any:
          - resources:
              kinds: ["batch/v1/Job", "batch/v1/CronJob"]
              operations: ["CREATE", "UPDATE"]
              namespaceSelector: *teamNamespaces
      context: *leafAndPodTemplate
      preconditions:
        all:
          - key: "{{ request.userInfo.username }}"
            operator: NotEquals
            value: system:serviceaccount:adhar-system:volcano-controllers
          - *notTheJobControllersOwnRuns
      validate:
        failureAction: Enforce
        message: >-
          scheduling.k8s.io/group-name is for pods Volcano schedules (schedulerName
          volcano), and this {{ request.object.kind }}'s pod template names
          {{ podTemplate.spec.schedulerName || 'default-scheduler' }} (design 0025 A2.7).
          Leaf of this namespace: {{ leaf }}.
        deny:
          conditions:
            all:
              - key: "{{ length(podTemplate.metadata.annotations.\"scheduling.k8s.io/group-name\" || '') > `0` }}"
                operator: Equals
                value: true
              - key: "{{ contains(['volcano'], podTemplate.spec.schedulerName || '') }}"
                operator: Equals
                value: false
    # Every Volcano run stays reclaimable (design 0025 A2.4, 2026-11-14). Volcano's
    # reclaim and preempt skip a task that is not Preemptable (reclaim.go:194), and a
    # pod is Preemptable unless volcano.sh/preemptable, as an annotation or else a
    # label, parses false OR does not parse at all (api/pod_info.go GetPodPreemptable).
    # Volcano copies a Job's annotation and label onto its pods
    # (job_controller_util.go:126), its PodGroup controller a pod's onto the PodGroup.
    # So a dev run that set it would keep prod's share for as long as it ran. Refused
    # on every place it reaches a pod from: the object, a Volcano Job's or CronJob's
    # job and task templates, and a batch/v1 Job's or CronJob's pod template. On a
    # PodGroup it is Volcano's job-level flag, which only the preemptable modes of
    # gang and drf read (both off, values.yaml); refused there too, for one rule.
    # Volcano run integrity compares it on a labelled run; this covers the runs it
    # does not see (an unlabelled Volcano Job, a pod naming schedulerName volcano, a
    # batch/v1 Job on Volcano).
    - name: a-volcano-run-stays-preemptable
      match:
        any:
          - resources:
              kinds: ["batch.volcano.sh/v1alpha1/Job", "batch.volcano.sh/v1alpha1/CronJob", "scheduling.volcano.sh/v1beta1/PodGroup", "Pod", "batch/v1/Job", "batch/v1/CronJob"]
              operations: ["CREATE", "UPDATE"]
              namespaceSelector: *teamNamespaces
      context:
        - name: ns
          apiCall:
            urlPath: "/api/v1/namespaces/{{ request.namespace }}"
            jmesPath: "metadata.labels"
        - name: leaf
          variable:
            jmesPath: >-
              join('-', [ns."adhar.io/organisation", ns."adhar.io/team", ns."adhar.io/tier"])
        # Every value that is not one strconv.ParseBool reads as true.
        - name: notPreemptable
          variable:
            jmesPath: >-
              [request.object.metadata.annotations, request.object.metadata.labels,
              request.object.spec.tasks[].template.metadata.annotations, request.object.spec.tasks[].template.metadata.labels,
              request.object.spec.jobTemplate.metadata.annotations, request.object.spec.jobTemplate.metadata.labels,
              request.object.spec.jobTemplate.spec.tasks[].template.metadata.annotations,
              request.object.spec.jobTemplate.spec.tasks[].template.metadata.labels,
              request.object.spec.template.metadata.annotations, request.object.spec.template.metadata.labels,
              request.object.spec.jobTemplate.spec.template.metadata.annotations,
              request.object.spec.jobTemplate.spec.template.metadata.labels][]."volcano.sh/preemptable"
              | [?!contains(`["1", "t", "T", "TRUE", "true", "True"]`, @)]
      preconditions:
        all:
          - key: "{{ request.userInfo.username }}"
            operator: NotEquals
            value: system:serviceaccount:adhar-system:volcano-controllers
          - *notTheJobControllersOwnRuns
      validate:
        failureAction: Enforce
        message: >-
          volcano.sh/preemptable {{ notPreemptable }} would keep this run out of
          Volcano's reclaim and preempt, so the queue whose share it holds could never
          take it back (design 0025 A2.4): Volcano runs stay preemptable. Leaf of this
          namespace: {{ leaf }}.
        deny:
          conditions:
            any:
              - key: "{{ length(notPreemptable) }}"
                operator: GreaterThan
                value: 0
    # The env plugin only (design 0025 §4.5, DEC-6, 2026-11-14). The narrowed
    # volcano-controllers ClusterRole cannot write Secrets, Services, ConfigMaps or
    # NetworkPolicies, which the ssh and svc plugins (and tensorflow, mpi, pytorch and
    # ray, which pull svc in) need: such a run would be admitted and then fail late in
    # the controller with "forbidden". Refused here, with the reason.
    - name: a-volcano-job-uses-the-env-plugin-only
      match:
        any:
          - resources:
              kinds: ["batch.volcano.sh/v1alpha1/Job"]
              operations: ["CREATE", "UPDATE"]
              namespaceSelector: *teamNamespaces
      context: *leaf
      preconditions:
        all:
          - key: "{{ request.userInfo.username }}"
            operator: NotEquals
            value: system:serviceaccount:adhar-system:volcano-controllers
      validate:
        failureAction: Enforce
        message: >-
          Volcano runs use the env plugin only (design 0025 §4.5); this one names
          {{ keys(request.object.spec.plugins || `{}`) }}. Pods reach each other through
          the JobRepository, not the svc or ssh plugins. Leaf of this namespace: {{ leaf }}.
        deny:
          conditions:
            any:
              - key: "{{ length(keys(request.object.spec.plugins || `{}`)[?@ != 'env']) }}"
                operator: GreaterThan
                value: 0
    - name: a-volcano-cronjob-uses-the-env-plugin-only
      match:
        any:
          - resources:
              kinds: ["batch.volcano.sh/v1alpha1/CronJob"]
              operations: ["CREATE", "UPDATE"]
              namespaceSelector: *teamNamespaces
      context: *leaf
      preconditions:
        all:
          - key: "{{ request.userInfo.username }}"
            operator: NotEquals
            value: system:serviceaccount:adhar-system:volcano-controllers
      validate:
        failureAction: Enforce
        message: >-
          Volcano runs use the env plugin only (design 0025 §4.5); this CronJob's job
          template names {{ keys(request.object.spec.jobTemplate.spec.plugins || `{}`) }}.
          Leaf of this namespace: {{ leaf }}.
        deny:
          conditions:
            any:
              - key: "{{ length(keys(request.object.spec.jobTemplate.spec.plugins || `{}`)[?@ != 'env']) }}"
                operator: GreaterThan
                value: 0
    # The leaf itself must be this team's. `default: {}` makes a missing Queue a
    # denial with this message rather than an opaque lookup error. A pod that names
    # a queue is checked too (2026-11-14): its PodGroup is written by Volcano's
    # controller, which this policy excludes, so the pod is the last chance. So is a
    # batch/v1 Job or CronJob whose pod template names one: the job-controller's pods
    # are not checked again.
    - name: the-team-queue-belongs-to-the-team
      match:
        any:
          - resources:
              kinds: ["batch.volcano.sh/v1alpha1/Job", "batch.volcano.sh/v1alpha1/CronJob", "scheduling.volcano.sh/v1beta1/PodGroup", "Pod", "batch/v1/Job", "batch/v1/CronJob"]
              operations: ["CREATE"]
              namespaceSelector: *teamNamespaces
      context:
        - name: ns
          apiCall:
            urlPath: "/api/v1/namespaces/{{ request.namespace }}"
            jmesPath: "metadata.labels"
        - name: leaf
          variable:
            jmesPath: >-
              join('-', [ns."adhar.io/organisation", ns."adhar.io/team", ns."adhar.io/tier"])
        - name: owner
          apiCall:
            urlPath: "/apis/scheduling.volcano.sh/v1beta1/queues/{{ leaf }}"
            jmesPath: "metadata.labels"
            default: {}
        # Where a pod or a batch/v1 Job's pods name their queue: the pod itself, or
        # the pod template.
        - name: podTemplate
          variable:
            jmesPath: "request.object.spec.jobTemplate.spec.template || request.object.spec.template || request.object"
      preconditions:
        all:
          - key: "{{ request.userInfo.username }}"
            operator: NotEquals
            value: system:serviceaccount:adhar-system:volcano-controllers
          - *notTheJobControllersOwnRuns
          - key: "{{ (request.object.kind != 'Pod' && request.object.apiVersion != 'batch/v1') || (podTemplate.metadata.annotations.\"scheduling.volcano.sh/queue-name\" || '') != '' }}"
            operator: Equals
            value: true
      validate:
        failureAction: Enforce
        message: >-
          Queue {{ leaf }} is not team {{ ns."adhar.io/team" }} of organisation
          {{ ns."adhar.io/organisation" }}'s (it is labelled organisation
          '{{ owner."adhar.io/organisation" || '' }}' team '{{ owner."adhar.io/team" || '' }}',
          or does not exist): the Team's BatchQueuesReady condition says why.
        deny:
          conditions:
            any:
              - key: "{{ owner.\"adhar.io/organisation\" == ns.\"adhar.io/organisation\" && owner.\"adhar.io/team\" == ns.\"adhar.io/team\" }}"
                operator: Equals
                value: false
---
# What a Volcano run looks like: kyverno-pod-standards.yaml's rules, for the pod
# templates under spec.tasks. A Volcano Job has no Job-level deadline, so the
# deadline is each task's pod activeDeadlineSeconds; spec.volumes is refused as a
# whole because Volcano creates a PersistentVolumeClaim for each entry.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: adhar-batch-volcano-pod-standards
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    policies.kyverno.io/title: "Batch: Volcano run pod standards"
    policies.kyverno.io/category: Batch
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Job
    policies.kyverno.io/description: >-
      A Volcano batch run sets memory request = limit, restartPolicy Never and a
      batch PriorityClass on every task, mounts no PersistentVolumeClaim, and has a
      TTL and a per-task deadline.
spec:
  background: true
  webhookConfiguration:
    failurePolicy: Ignore
  rules:
    - name: a-volcano-run-has-a-deadline-and-a-ttl
      match: &volcanoRuns
        any:
          - resources:
              kinds: ["batch.volcano.sh/v1alpha1/Job"]
              selector:
                matchLabels:
                  adhar.io/workload: batch
      validate:
        failureAction: Audit
        message: A Volcano batch run needs ttlSecondsAfterFinished and activeDeadlineSeconds on every task's pod (design 0025 INV-1).
        # "?*", not ">=0": Kyverno reads a MISSING field as passing a numeric
        # comparison, so ">=0" admits a run with no TTL at all.
        pattern:
          spec:
            ttlSecondsAfterFinished: "?*"
            tasks:
              - template:
                  spec:
                    activeDeadlineSeconds: ">0"
    - name: a-volcano-run-never-restarts-in-place-and-uses-a-batch-class
      match: *volcanoRuns
      validate:
        failureAction: Audit
        # The Volcano classes (DEC-1): Volcano v1.16 refuses every reclaimer and
        # preemptor whose class is preemptionPolicy Never, so a run on adhar-batch
        # could neither take back prod's share nor be ranked within its queue.
        message: A Volcano batch run needs the PriorityClass adhar-batch-volcano or adhar-batch-volcano-critical, and restartPolicy Never on every task (Volcano's policies restart the gang).
        pattern:
          spec:
            priorityClassName: "adhar-batch-volcano | adhar-batch-volcano-critical"
            tasks:
              - template:
                  spec:
                    restartPolicy: Never
                    =(priorityClassName): "adhar-batch-volcano | adhar-batch-volcano-critical"
    - name: a-volcano-run-mounts-no-persistent-volume
      match: *volcanoRuns
      validate:
        failureAction: Audit
        message: A Volcano batch run may not claim volumes (spec.volumes) or mount a PersistentVolumeClaim; a node-local volume pins a preemptible pod to one node.
        pattern:
          spec:
            X(volumes): "null"
            tasks:
              - template:
                  spec:
                    =(volumes):
                      - X(persistentVolumeClaim): "null"
    - name: a-volcano-run-containers-memory-request-equals-its-limit
      match: *volcanoRuns
      validate:
        failureAction: Audit
        message: A Volcano batch run's memory request must equal its limit in every task; a run overcommitted on memory is the one the kernel kills.
        foreach:
          - list: "request.object.spec.tasks[].template.spec.containers[]"
            deny:
              conditions:
                any:
                  - key: "{{ element.resources.requests.memory || '' }}"
                    operator: NotEquals
                    value: "{{ element.resources.limits.memory || 'absent' }}"
