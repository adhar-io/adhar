# The Volcano half of run integrity (design 0025 G4, §6.5, §10.3; FU-8, 2026-11-14):
# operating a job never lets anyone run anything other than the deployed definition,
# whichever scheduler places it. ../kyverno-run-integrity.yaml holds batch/v1 Jobs to
# ConfigMap <batch-job>-run; a BatchJob that Volcano schedules composes that template
# as a batch.volcano.sh Job, and adhar-batch-edit / adhar-batch-operator let people
# create those, so the same comparison is made here. In manifests/volcano/ because it
# names a Volcano kind, which Kyverno refuses where Volcano is not installed (see
# kyverno-queue.yaml): the adhar-batch-volcano element syncs it exactly where Volcano is.
#
# A client may set only what §6.5 lets it set, as on the native path: the name, the
# adhar.io/batch-trigger label and the env vars ADHAR_BATCH_PARAMS, _TRIGGER,
# _RESTART_OF, _COMMAND and _EXECUTION_ID (cmd/batch buildRun; the Console's run
# builder). Everything else, in every task, must be the template's.
#
# What differs from the native policy, and why:
#
# * Volcano's own mutating webhook runs before this one (validating webhooks follow
#   every mutating one) and fills in what the template leaves out (v1.16
#   pkg/webhooks/admission/jobs/mutate/mutate_job.go): spec.queue `default`,
#   spec.schedulerName `volcano`, spec.maxRetry 3, and on every task maxRetry 3 and
#   minAvailable = replicas. The view applies the same defaults to BOTH sides, so a
#   run compares equal before and after that webhook.
#
# * A CRD's quantities are not canonicalised by the API server, but Volcano's webhook
#   re-marshals spec.tasks whenever it defaults a task (every composed template), and
#   resource.Quantity marshals canonically: a template's 1.5Gi arrives as 1536Mi. The
#   view therefore reads every request, limit and /tmp sizeLimit as a NUMBER
#   (divide(q, '1')), and compares every resource name, not only cpu and memory:
#   there is one container per task here, not one per run.
#
# * The image may arrive pinned (tag@sha256:…) by verify-supply-chain-images, as on
#   the native path, so the view compares each image without its digest — and when a
#   template itself names a digest, the images must be exactly the template's.
#
# * Volcano reads scheduling knobs from annotations and labels, which the native path
#   has no equivalent of: volcano.sh/preemptable "false" on the Job (copied to its
#   PodGroup and pods) or on a task's template makes a run immune to reclaim and
#   preempt (v1.16 reclaim.go skips a task that is not Preemptable), so a dev run
#   could hold capacity prod is owed (A2.4). The view compares those keys — preemptable
#   as annotation and label, cooldown-time, revocable-zone, jdb-min-available and
#   jdb-max-unavailable — on the Job and on every task template. (An unlabelled
#   Volcano run is held to preemptable by adhar-batch-queue-binding.)
#
# * The view LISTS what is compared, as the native one does (see its header for what
#   is left out on purpose and why): a field a later Kubernetes release adds to the
#   pod spec is admitted until it is listed here.
#
# * The controllers are excluded by USERNAME, never by label, in the webhook's
#   matchConditions AND in the rule's preconditions, as in ../kyverno-run-integrity.yaml:
#   volcano-controllers creates the Volcano Jobs of a Volcano CronJob (the scheduled
#   runs), which must go on during a Kyverno outage.
#
# FAILURE POLICY Fail (user decision DEC-4, 2026-11-14): like the native policy, a
# person's run is refused while Kyverno is down rather than admitted unchecked, and the
# matchConditions keep the webhook to batch runs only. TestEveryKyvernoPolicyStatesItsFailurePolicy
# pins it; TestFailClosedPoliciesReachOnlyWhatTheyCheck runs the conditions on a real
# API server. The name keeps the native policy's as its prefix on purpose: a refusal
# reads `adhar-batch-run-integrity-volcano`, which is what the e2e suite's forged
# Volcano run and alerts.yaml's fail-open matcher look for.
#
# Only CREATE is checked, as on the native path: Volcano's own update validation
# forbids changing a task's template, and in prod, where people hold
# adhar-batch-operator, they may create Volcano Jobs but not patch them.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: adhar-batch-run-integrity-volcano
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    policies.kyverno.io/title: "Batch: Volcano runs match their template"
    policies.kyverno.io/category: Batch
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Job
    policies.kyverno.io/description: >-
      A Volcano batch run started by a person or a client must match the BatchJob's
      composed run template in everything but its name, trigger and run parameters, so
      that the right to operate a job can never run anything but the deployed definition.
spec:
  background: false
  webhookConfiguration:
    failurePolicy: Fail
    matchConditions:
      - name: not-the-controllers-that-execute-the-schedule
        expression: >-
          !(request.userInfo.username in [
          'system:serviceaccount:kube-system:cronjob-controller',
          'system:kube-controller-manager',
          'system:serviceaccount:adhar-system:volcano-controllers'])
      # Fail closed for batch runs ONLY: without this every Volcano Job anyone
      # creates would be refused while Kyverno is down (DEC-4).
      - name: only-batch-runs
        expression: >-
          object != null && has(object.metadata.labels) &&
          'adhar.io/batch-job' in object.metadata.labels
  rules:
    - name: a-volcano-run-matches-its-template
      match:
        any:
          - resources:
              kinds: ["batch.volcano.sh/v1alpha1/Job"]
              operations: ["CREATE"]
              selector:
                matchExpressions:
                  - key: adhar.io/batch-job
                    operator: Exists
      preconditions:
        all:
          - key: "{{ request.userInfo.username }}"
            operator: AnyNotIn
            value:
              - system:serviceaccount:kube-system:cronjob-controller
              - system:kube-controller-manager
              - system:serviceaccount:adhar-system:volcano-controllers
      context:
        - name: templateYaml
          apiCall:
            urlPath: '/api/v1/namespaces/{{ request.namespace }}/configmaps/{{ request.object.metadata.labels."adhar.io/batch-job" }}-run'
            jmesPath: 'data."template.yaml"'
            default: ""
        - name: tpl
          variable:
            jmesPath: "parse_yaml(templateYaml)"
            default: {}
        - name: views
          variable:
            jmesPath: >-
              [tpl, request.object][].{
              job: {api: apiVersion, kind: kind, spec: spec.{schedulerName: schedulerName || 'volcano', queue: queue || 'default',
                priorityClassName: priorityClassName, minAvailable: minAvailable, minSuccess: minSuccess,
                maxRetry: maxRetry || `3`, policies: policies, plugins: plugins, ttlSecondsAfterFinished: ttlSecondsAfterFinished,
                runningEstimate: runningEstimate, volumes: volumes, networkTopology: networkTopology, tasks: length(tasks || `[]`)}},
              labels: [metadata.labels, spec.tasks[].template.metadata.labels][].{batchJob: "adhar.io/batch-job", workload: "adhar.io/workload",
                role: "adhar.io/batch-role", scaleUp: "adhar.io/scale-up", application: "adhar.io/application",
                environment: "adhar.io/environment", project: "adhar.io/project", team: "adhar.io/team",
                organisation: "adhar.io/organisation", plane: "adhar.io/plane", name: "app.kubernetes.io/name"},
              volcano: [metadata, spec.tasks[].template.metadata][].{preemptable: annotations."volcano.sh/preemptable",
                preemptableLabel: labels."volcano.sh/preemptable", cooldown: annotations."volcano.sh/cooldown-time",
                revocableZone: annotations."volcano.sh/revocable-zone", jdbMin: annotations."volcano.sh/jdb-min-available",
                jdbMax: annotations."volcano.sh/jdb-max-unavailable"},
              tasks: spec.tasks[].{name: name, replicas: replicas, minAvailable: minAvailable || replicas, maxRetry: maxRetry || `3`,
                policies: policies, topologyPolicy: topologyPolicy, dependsOn: dependsOn, partitionPolicy: partitionPolicy,
                safeToEvict: template.metadata.annotations."cluster-autoscaler.kubernetes.io/safe-to-evict"},
              pods: spec.tasks[].template.spec.{serviceAccountName: serviceAccountName, automount: automountServiceAccountToken,
                priorityClassName: priorityClassName, schedulerName: schedulerName, restartPolicy: restartPolicy,
                deadline: activeDeadlineSeconds, grace: terminationGracePeriodSeconds, enableServiceLinks: enableServiceLinks,
                imagePullSecrets: imagePullSecrets, securityContext: securityContext, initContainers: initContainers,
                nodeName: nodeName, nodeSelector: nodeSelector, affinity: affinity, tolerations: tolerations,
                topology: topologySpreadConstraints, hostNetwork: hostNetwork, hostPID: hostPID, hostIPC: hostIPC,
                runtimeClassName: runtimeClassName, dnsConfig: dnsConfig, dnsPolicy: dnsPolicy || 'ClusterFirst',
                hostAliases: hostAliases, shareProcessNamespace: shareProcessNamespace, resourceClaims: resourceClaims,
                schedulingGates: schedulingGates, readinessGates: readinessGates, hostUsers: hostUsers, os: os,
                hostname: hostname, subdomain: subdomain, setHostnameAsFQDN: setHostnameAsFQDN, overhead: overhead,
                containers: length(containers || `[]`),
                volumes: volumes[].{name: name, medium: emptyDir.medium, types: sort(keys(@)),
                  sizeLimit: emptyDir.sizeLimit && divide(to_string(emptyDir.sizeLimit), '1')}},
              containers: spec.tasks[].template.spec.containers[].{name: name, image: split(image || '', '@sha256:')[0],
                command: command, args: args, workingDir: workingDir, ports: ports, envFrom: envFrom,
                securityContext: securityContext, volumeMounts: volumeMounts, lifecycle: lifecycle,
                livenessProbe: livenessProbe, readinessProbe: readinessProbe, startupProbe: startupProbe, stdin: stdin, tty: tty,
                volumeDevices: volumeDevices, resizePolicy: resizePolicy, restartPolicy: restartPolicy,
                restartPolicyRules: restartPolicyRules,
                env: env[?!contains(`["ADHAR_BATCH_PARAMS","ADHAR_BATCH_TRIGGER","ADHAR_BATCH_RESTART_OF","ADHAR_BATCH_COMMAND","ADHAR_BATCH_EXECUTION_ID"]`, name)],
                requests: items(resources.requests || `{}`, 'name', 'q')[].{name: name, q: divide(to_string(q), '1')},
                limits: items(resources.limits || `{}`, 'name', 'q')[].{name: name, q: divide(to_string(q), '1')},
                claims: resources.claims}}
        - name: wantImages
          variable:
            jmesPath: "tpl.spec.tasks[].template.spec.containers[].image || `[]`"
        - name: differs
          variable:
            jmesPath: >-
              [ to_string(views[0].job) != to_string(views[1].job) && 'the Volcano Job spec',
                to_string(views[0].labels) != to_string(views[1].labels) && 'the labels',
                to_string(views[0].volcano) != to_string(views[1].volcano) && 'the Volcano scheduling annotations',
                to_string(views[0].tasks) != to_string(views[1].tasks) && 'the tasks',
                to_string(views[0].pods) != to_string(views[1].pods) && 'the pod specs',
                to_string(views[0].containers) != to_string(views[1].containers) && 'the containers',
                ( length(wantImages) == `0` || ( contains(join(' ', wantImages), '@')
                  && to_string(wantImages) != to_string(request.object.spec.tasks[].template.spec.containers[].image) ) ) && 'the image'
              ][?@]
      validate:
        failureAction: Enforce
        message: >-
          This Volcano run does not match ConfigMap {{ request.object.metadata.labels."adhar.io/batch-job" }}-run,
          the BatchJob's deployed template. It differs in {{ differs }}. A client may set only the name, the
          adhar.io/batch-trigger label and the ADHAR_BATCH_PARAMS, _TRIGGER, _RESTART_OF, _COMMAND and
          _EXECUTION_ID environment variables; to change anything else, change the BatchJob in Git.
        deny:
          conditions:
            any:
              - key: "{{ length(differs) }}"
                operator: GreaterThan
                value: 0
---
# The rule above matches runs by their label, so a prod operator could step around
# it: adhar-batch-operator may create Volcano Jobs, and one with NO adhar.io/batch-job
# label is compared with nothing. The Volcano half of ../kyverno-run-integrity.yaml's
# adhar-batch-prod-jobs-name-a-batchjob, failurePolicy Ignore like it (DEC-4).
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: adhar-batch-volcano-prod-jobs-name-a-batchjob
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    policies.kyverno.io/title: "Batch: an operator's Volcano Job in prod names a BatchJob"
    policies.kyverno.io/category: Batch
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Job
    policies.kyverno.io/description: >-
      In a prod environment namespace, a Volcano Job created by a person must carry the
      adhar.io/batch-job label, which is what subjects it to the run template.
spec:
  background: false
  webhookConfiguration:
    failurePolicy: Ignore
  rules:
    - name: a-persons-volcano-job-in-prod-names-a-batchjob
      match:
        any:
          - resources:
              kinds: ["batch.volcano.sh/v1alpha1/Job"]
              operations: ["CREATE"]
              namespaceSelector:
                matchLabels:
                  adhar.io/environment: prod
      exclude:
        any:
          - clusterRoles: ["cluster-admin"]
      preconditions:
        all:
          - key: "{{ request.userInfo.username }}"
            operator: NotEquals
            value: "system:*"
      validate:
        failureAction: Enforce
        message: >-
          In a prod environment a Volcano Job must be a run of a deployed BatchJob: start it with `adhar batch run`
          or from the Console, which build it from the BatchJob's run template.
        deny:
          conditions:
            all:
              - key: adhar.io/batch-job
                operator: AnyNotIn
                value: "{{ request.object.metadata.labels || `{}` | keys(@) }}"
