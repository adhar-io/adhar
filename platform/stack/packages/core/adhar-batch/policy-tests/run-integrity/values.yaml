# What the policy reads from the cluster: ConfigMap <batch-job>-run, data."template.yaml".
# The rule's apiCall is mocked here; templateYaml is the composition's own output for
# testdata/batchjob/xr-ondemand.yaml. TestBatchRunIntegrityFixtureIsTheComposedTemplate
# fails when the composition and this copy part.
apiVersion: cli.kyverno.io/v1alpha1
kind: Values
metadata:
  name: run-integrity
policies:
  - name: adhar-batch-run-integrity
    rules:
      - name: a-run-matches-its-template
        values:
          templateYaml: "apiVersion: batch/v1\nkind: Job\nmetadata:\n    annotations:\n        adhar.io/batch-actor: \"\"\n    labels:\n        adhar.io/application: reconciler\n        adhar.io/batch-job: reconciler\n        adhar.io/batch-role: single\n        adhar.io/batch-trigger: manual\n        adhar.io/environment: dev\n        adhar.io/organisation: acme\n        adhar.io/plane: workload\n        adhar.io/project: shop\n        adhar.io/team: payments\n        adhar.io/workload: batch\n        app.kubernetes.io/name: reconciler\n    namespace: dev\nspec:\n    activeDeadlineSeconds: 21600\n    backoffLimit: 2\n    completions: 1\n    parallelism: 1\n    podFailurePolicy:\n        rules:\n            - action: Ignore\n              onPodConditions:\n                - status: \"True\"\n                  type: DisruptionTarget\n            - action: FailJob\n              onExitCodes:\n                containerName: batch\n                operator: In\n                values:\n                    - 2\n                    - 3\n                    - 4\n                    - 6\n                    - 7\n    podReplacementPolicy: Failed\n    template:\n        metadata:\n            annotations:\n                adhar.io/batch-actor: \"\"\n                cluster-autoscaler.kubernetes.io/safe-to-evict: \"false\"\n            labels:\n                adhar.io/application: reconciler\n                adhar.io/batch-job: reconciler\n                adhar.io/batch-role: single\n                adhar.io/batch-trigger: manual\n                adhar.io/environment: dev\n                adhar.io/organisation: acme\n                adhar.io/plane: workload\n                adhar.io/project: shop\n                adhar.io/team: payments\n                adhar.io/workload: batch\n                app.kubernetes.io/name: reconciler\n        spec:\n            containers:\n                - env:\n                    - name: ADHAR_BATCH_JOB\n                      value: reconcileJob\n                    - name: ADHAR_BATCH_NAME\n                      value: reconciler\n                    - name: ADHAR_BATCH_ROLE\n                      value: single\n                    - name: ADHAR_BATCH_TRIGGER\n                      value: manual\n                    - name: ADHAR_BATCH_PARAMS\n                      value: '{}'\n                    - name: ADHAR_BATCH_TIME_ZONE\n                      value: UTC\n                    - name: ADHAR_BATCH_REPOSITORY_SCHEMA\n                      value: batch\n                    - name: ADHAR_BATCH_SHUTDOWN_TIMEOUT\n                      value: 90s\n                    - name: ADHAR_BATCH_K8S_JOB\n                      valueFrom:\n                        fieldRef:\n                            apiVersion: v1\n                            fieldPath: metadata.labels['batch.kubernetes.io/job-name']\n                    - name: ADHAR_BATCH_ACTOR\n                      valueFrom:\n                        fieldRef:\n                            apiVersion: v1\n                            fieldPath: metadata.annotations['adhar.io/batch-actor']\n                    - name: POD_NAME\n                      valueFrom:\n                        fieldRef:\n                            apiVersion: v1\n                            fieldPath: metadata.name\n                    - name: POD_UID\n                      valueFrom:\n                        fieldRef:\n                            apiVersion: v1\n                            fieldPath: metadata.uid\n                    - name: NODE_NAME\n                      valueFrom:\n                        fieldRef:\n                            apiVersion: v1\n                            fieldPath: spec.nodeName\n                    - name: ADHAR_ENVIRONMENT\n                      value: dev\n                    - name: SPRING_DATASOURCE_URL\n                      valueFrom:\n                        secretKeyRef:\n                            key: jdbc-uri\n                            name: reconciler-db-app\n                    - name: SPRING_DATASOURCE_USERNAME\n                      valueFrom:\n                        secretKeyRef:\n                            key: username\n                            name: reconciler-db-app\n                    - name: SPRING_DATASOURCE_PASSWORD\n                      valueFrom:\n                        secretKeyRef:\n                            key: password\n                            name: reconciler-db-app\n                    - name: BPL_JVM_THREAD_COUNT\n                      value: \"50\"\n                    - name: JAVA_TOOL_OPTIONS\n                      value: -XX:ReservedCodeCacheSize=64M\n                    - name: OTEL_EXPORTER_OTLP_ENDPOINT\n                      value: http://alloy.adhar-system.svc.cluster.local:4318\n                    - name: OTEL_EXPORTER_OTLP_PROTOCOL\n                      value: http/protobuf\n                    - name: OTEL_METRICS_EXPORTER\n                      value: otlp\n                    - name: OTEL_RESOURCE_ATTRIBUTES\n                      value: deployment.environment.name=dev,deployment.environment=dev,service.namespace=dev\n                    - name: OTEL_SERVICE_NAME\n                      value: reconciler\n                  image: harbor-core.adhar-system.svc.cluster.local/library/reconciler:1.0.0\n                  name: batch\n                  resources:\n                    limits:\n                        memory: 1536Mi\n                    requests:\n                        cpu: \"1\"\n                        memory: 1536Mi\n                  securityContext:\n                    allowPrivilegeEscalation: false\n                    capabilities:\n                        drop:\n                            - ALL\n                  volumeMounts:\n                    - mountPath: /tmp\n                      name: tmp\n            enableServiceLinks: false\n            imagePullSecrets:\n                - name: harbor-dockercfg\n            priorityClassName: adhar-batch\n            restartPolicy: Never\n            schedulerName: default-scheduler\n            securityContext:\n                runAsNonRoot: true\n                seccompProfile:\n                    type: RuntimeDefault\n            serviceAccountName: reconciler-batch\n            terminationGracePeriodSeconds: 120\n            volumes:\n                - emptyDir:\n                    sizeLimit: 1Gi\n                  name: tmp\n    ttlSecondsAfterFinished: 604800\n\n"
