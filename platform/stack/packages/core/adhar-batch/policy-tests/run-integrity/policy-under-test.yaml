# GENERATED by generate-resources.sh from manifests/kyverno-run-integrity.yaml, without matchConditions.
# Operating a job never lets anyone run anything other than the deployed definition
# (design 0025 G4, §6.5, §10.3).
#
# A run labelled adhar.io/batch-job, created by anyone except the controllers that
# execute the deployed schedule, must match ConfigMap <batch-job>-run in everything
# but what §6.5 lets a client set: the name, the adhar.io/batch-trigger label and
# the env vars ADHAR_BATCH_PARAMS, _TRIGGER, _RESTART_OF, _COMMAND and _EXECUTION_ID.
# Users, the CLI, the Console, the batch observer and workflow steps are all checked.
#
# Three decisions a reader would otherwise have to reverse-engineer:
#
# * The controllers are excluded by USERNAME, never by label. A label such as
#   adhar.io/batch-trigger: schedule is client-settable and must not skip anything.
#   It is done twice on purpose: the webhook's matchConditions keep a Kyverno outage
#   from blocking scheduled runs (fail closed for people, never for the clock), and
#   the rule's own preconditions hold the same list in case a Kyverno release stops
#   propagating matchConditions (design 0025 R6). `system:kube-controller-manager` is
#   the same CronJob controller on a cluster that does not run it with
#   --use-service-account-credentials, which a `provided` cluster may not.
#
# * The comparison is one JMESPath view applied to BOTH objects, `[tpl,
#   request.object][].{...}`, so the two sides cannot drift, and it is done in JMESPath
#   because deny conditions treat a string as a wildcard pattern: a value holding `*`
#   would otherwise match anything. The view holds what API-server defaulting cannot
#   change, normalised where it can (dnsPolicy, completionMode, manualSelector).
#
# * Quantities and the image are compared on their own. The API server canonicalises
#   a quantity on the way in (1.5Gi arrives as 1536Mi, 2048Mi as 2Gi), so a byte
#   comparison would refuse an honest run, and the Equals family of deny conditions
#   is quantity aware. verify-supply-chain-images pins a tag to tag@sha256:… before
#   this policy sees it, so a template naming a tag accepts that tag pinned.
#
# Adding a Volcano Job to this policy waits for Phase 2 and its CRD (PLAT-2.4):
# Kyverno refuses a policy naming a kind the cluster does not serve.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: adhar-batch-run-integrity
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    policies.kyverno.io/title: "Batch: runs match their template"
    policies.kyverno.io/category: Batch
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Job
    policies.kyverno.io/description: >-
      A batch run started by a person or a client must match the BatchJob's composed
      run template in everything but its name, trigger and run parameters, so that the
      right to operate a job can never run anything but the deployed definition.
spec:
  background: false
  webhookConfiguration:
    failurePolicy: Fail
  rules:
    - name: a-run-matches-its-template
      match:
        any:
          - resources:
              kinds: ["batch/v1/Job"]
              operations: ["CREATE"]
              selector:
                matchExpressions:
                  - key: adhar.io/batch-job
                    operator: Exists
      preconditions:
        all:
          - key: "{{ request.userInfo.username }}"
            operator: AnyNotIn
            value:
              - system:serviceaccount:kube-system:cronjob-controller
              - system:kube-controller-manager
              - system:serviceaccount:adhar-system:volcano-controllers
      context:
        - name: templateYaml
          apiCall:
            urlPath: '/api/v1/namespaces/{{ request.namespace }}/configmaps/{{ request.object.metadata.labels."adhar.io/batch-job" }}-run'
            jmesPath: 'data."template.yaml"'
            default: ""
        - name: tpl
          variable:
            jmesPath: "parse_yaml(templateYaml)"
            default: {}
        - name: views
          variable:
            jmesPath: >-
              [tpl, request.object][].{
              job: spec.{parallelism: parallelism, completions: completions, completionMode: completionMode || 'NonIndexed',
                backoffLimit: backoffLimit, backoffLimitPerIndex: backoffLimitPerIndex, maxFailedIndexes: maxFailedIndexes,
                activeDeadlineSeconds: activeDeadlineSeconds, ttlSecondsAfterFinished: ttlSecondsAfterFinished,
                podReplacementPolicy: podReplacementPolicy, podFailurePolicy: podFailurePolicy, successPolicy: successPolicy,
                manualSelector: manualSelector || `false`, managedBy: managedBy},
              labels: [metadata.labels, spec.template.metadata.labels][].{batchJob: "adhar.io/batch-job", workload: "adhar.io/workload",
                role: "adhar.io/batch-role", scaleUp: "adhar.io/scale-up", application: "adhar.io/application",
                environment: "adhar.io/environment", project: "adhar.io/project", team: "adhar.io/team",
                organisation: "adhar.io/organisation", plane: "adhar.io/plane", name: "app.kubernetes.io/name"},
              safeToEvict: spec.template.metadata.annotations."cluster-autoscaler.kubernetes.io/safe-to-evict",
              pod: spec.template.spec.{serviceAccountName: serviceAccountName, automount: automountServiceAccountToken,
                priorityClassName: priorityClassName, schedulerName: schedulerName, restartPolicy: restartPolicy,
                grace: terminationGracePeriodSeconds, enableServiceLinks: enableServiceLinks, imagePullSecrets: imagePullSecrets,
                securityContext: securityContext, initContainers: initContainers, nodeName: nodeName, nodeSelector: nodeSelector,
                affinity: affinity, tolerations: tolerations, topology: topologySpreadConstraints, hostNetwork: hostNetwork,
                hostPID: hostPID, hostIPC: hostIPC, runtimeClassName: runtimeClassName, dnsConfig: dnsConfig,
                dnsPolicy: dnsPolicy || 'ClusterFirst', hostAliases: hostAliases, shareProcessNamespace: shareProcessNamespace,
                volumes: volumes[].{name: name, medium: emptyDir.medium, types: sort(keys(@))}},
              containers: spec.template.spec.containers[].{name: name, command: command, args: args, workingDir: workingDir,
                ports: ports, envFrom: envFrom, securityContext: securityContext, volumeMounts: volumeMounts, lifecycle: lifecycle,
                livenessProbe: livenessProbe, readinessProbe: readinessProbe, startupProbe: startupProbe, stdin: stdin, tty: tty,
                env: env[?!contains(`["ADHAR_BATCH_PARAMS","ADHAR_BATCH_TRIGGER","ADHAR_BATCH_RESTART_OF","ADHAR_BATCH_COMMAND","ADHAR_BATCH_EXECUTION_ID"]`, name)],
                requestNames: sort(keys(resources.requests || `{}`)), limitNames: sort(keys(resources.limits || `{}`))}}
        - name: wantImage
          variable:
            jmesPath: "tpl.spec.template.spec.containers[0].image || 'the template names no image'"
        - name: differs
          variable:
            jmesPath: >-
              [ to_string(views[0].job) != to_string(views[1].job) && 'the Job spec',
                to_string(views[0].labels) != to_string(views[1].labels) && 'the labels',
                to_string(views[0].safeToEvict) != to_string(views[1].safeToEvict) && 'the safe-to-evict annotation',
                to_string(views[0].pod) != to_string(views[1].pod) && 'the pod spec',
                to_string(views[0].containers) != to_string(views[1].containers) && 'the containers',
                ( request.object.spec.template.spec.containers[0].image != wantImage
                  && !starts_with(request.object.spec.template.spec.containers[0].image, join('', [wantImage, '@sha256:'])) ) && 'the image'
              ][?@]
      validate:
        failureAction: Enforce
        message: >-
          This run does not match ConfigMap {{ request.object.metadata.labels."adhar.io/batch-job" }}-run, the
          BatchJob's deployed template. It differs in {{ differs }} (an empty list means its resources: cpu, memory
          or the /tmp size). A client may set only the name, the adhar.io/batch-trigger label and the
          ADHAR_BATCH_PARAMS, _TRIGGER, _RESTART_OF, _COMMAND and _EXECUTION_ID environment variables; to change
          anything else, change the BatchJob in Git.
        deny:
          conditions:
            any:
              - key: "{{ length(differs) }}"
                operator: GreaterThan
                value: 0
              - key: "{{ request.object.spec.template.spec.containers[0].resources.requests.cpu || '' }}"
                operator: NotEquals
                value: "{{ tpl.spec.template.spec.containers[0].resources.requests.cpu || '' }}"
              - key: "{{ request.object.spec.template.spec.containers[0].resources.requests.memory || '' }}"
                operator: NotEquals
                value: "{{ tpl.spec.template.spec.containers[0].resources.requests.memory || '' }}"
              - key: "{{ request.object.spec.template.spec.containers[0].resources.limits.cpu || '' }}"
                operator: NotEquals
                value: "{{ tpl.spec.template.spec.containers[0].resources.limits.cpu || '' }}"
              - key: "{{ request.object.spec.template.spec.containers[0].resources.limits.memory || '' }}"
                operator: NotEquals
                value: "{{ tpl.spec.template.spec.containers[0].resources.limits.memory || '' }}"
              - key: "{{ request.object.spec.template.spec.volumes[?name=='tmp'] | [0].emptyDir.sizeLimit || '' }}"
                operator: NotEquals
                value: "{{ tpl.spec.template.spec.volumes[?name=='tmp'] | [0].emptyDir.sizeLimit || '' }}"
---
# The rule above matches runs by their label, so a prod operator could step around
# it: adhar-batch-operator may create Jobs, and a Job with NO adhar.io/batch-job
# label is compared with nothing. In prod a team's only way to create a Job is that
# role, because its access is `view`, so a person's Job there must name a BatchJob.
# Controllers (Argo CD's hooks, Kargo, the resilience gate) and cluster admins are
# not what this is about and are left alone; dev and test are too, where the team is
# `admin` and its role already lets it run anything.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: adhar-batch-prod-jobs-name-a-batchjob
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    policies.kyverno.io/title: "Batch: an operator's Job in prod names a BatchJob"
    policies.kyverno.io/category: Batch
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Job
    policies.kyverno.io/description: >-
      In a prod environment namespace, a Job created by a person must carry the
      adhar.io/batch-job label, which is what subjects it to the run template.
spec:
  background: false
  rules:
    - name: a-persons-job-in-prod-names-a-batchjob
      match:
        any:
          - resources:
              kinds: ["batch/v1/Job"]
              operations: ["CREATE"]
              namespaceSelector:
                matchLabels:
                  adhar.io/environment: prod
      exclude:
        any:
          - clusterRoles: ["cluster-admin"]
      preconditions:
        all:
          - key: "{{ request.userInfo.username }}"
            operator: NotEquals
            value: "system:*"
      validate:
        failureAction: Enforce
        message: >-
          In a prod environment a Job must be a run of a deployed BatchJob: start it with `adhar batch run` or
          from the Console, which build it from the BatchJob's run template. A one-off Job arrives through a Release.
        deny:
          conditions:
            all:
              - key: adhar.io/batch-job
                operator: AnyNotIn
                value: "{{ request.object.metadata.labels || `{}` | keys(@) }}"
