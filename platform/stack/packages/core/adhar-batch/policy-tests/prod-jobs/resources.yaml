# Jobs in prod and dev: the policy reads only the label and the namespace.
apiVersion: batch/v1
kind: Job
metadata: { name: one-off-in-prod, namespace: prod }
spec: { template: { spec: { restartPolicy: Never, containers: [ { name: x, image: "docker.io/library/busybox:1.36" } ] } } }
---
apiVersion: batch/v1
kind: Job
metadata: { name: labelled-elsewhere-in-prod, namespace: prod, labels: { app: x } }
spec: { template: { spec: { restartPolicy: Never, containers: [ { name: x, image: "docker.io/library/busybox:1.36" } ] } } }
---
apiVersion: batch/v1
kind: Job
metadata: { name: run-in-prod, namespace: prod, labels: { adhar.io/batch-job: importer } }
spec: { template: { spec: { restartPolicy: Never, containers: [ { name: batch, image: "docker.io/library/busybox:1.36" } ] } } }
---
apiVersion: batch/v1
kind: Job
metadata: { name: one-off-in-dev, namespace: dev }
spec: { template: { spec: { restartPolicy: Never, containers: [ { name: x, image: "docker.io/library/busybox:1.36" } ] } } }
