# What adhar-batch-queue-default makes of the runs that name no queue (or `default`):
# the namespace's leaf, by tier.
apiVersion: batch.volcano.sh/v1alpha1
kind: Job
metadata:
  name: unset-queue
  namespace: shop-dev
spec:
  schedulerName: volcano
  minAvailable: 1
  tasks:
  - name: batch
    replicas: 1
    template:
      spec:
        restartPolicy: Never
        containers:
        - name: batch
          image: docker.io/library/busybox:1.36
  queue: acme-payments-dev
---
apiVersion: batch.volcano.sh/v1alpha1
kind: Job
metadata:
  name: default-queue
  namespace: shop-dev
spec:
  schedulerName: volcano
  minAvailable: 1
  tasks:
  - name: batch
    replicas: 1
    template:
      spec:
        restartPolicy: Never
        containers:
        - name: batch
          image: docker.io/library/busybox:1.36
  queue: acme-payments-dev
---
apiVersion: batch.volcano.sh/v1alpha1
kind: CronJob
metadata:
  name: cron-unset-queue
  namespace: shop-dev
spec:
  schedule: 0 1 * * *
  jobTemplate:
    spec:
      schedulerName: volcano
      minAvailable: 1
      tasks:
      - name: batch
        replicas: 1
        template:
          spec:
            restartPolicy: Never
            containers:
            - name: batch
              image: docker.io/library/busybox:1.36
      queue: acme-payments-dev
---
apiVersion: v1
kind: Pod
metadata:
  name: volcano-pod-unset
  namespace: shop-dev
  annotations:
    scheduling.volcano.sh/queue-name: acme-payments-dev
spec:
  restartPolicy: Never
  containers:
  - name: batch
    image: docker.io/library/busybox:1.36
  schedulerName: volcano
---
apiVersion: batch.volcano.sh/v1alpha1
kind: Job
metadata:
  name: staging-unset-queue
  namespace: shop-staging
spec:
  schedulerName: volcano
  minAvailable: 1
  tasks:
  - name: batch
    replicas: 1
    template:
      spec:
        restartPolicy: Never
        containers:
        - name: batch
          image: docker.io/library/busybox:1.36
  queue: acme-payments-test
