# A2.7 edge: a pod naming a PodGroup that kube-scheduler would place.
apiVersion: v1
kind: Pod
metadata:
  name: annotated-kube-scheduler-pod
  namespace: shop-dev
  annotations:
    scheduling.k8s.io/group-name: settlement-x
spec:
  restartPolicy: Never
  containers:
  - name: batch
    image: docker.io/library/busybox:1.36
---
apiVersion: v1
kind: Pod
metadata:
  name: annotated-default-scheduler-pod
  namespace: shop-dev
  annotations:
    scheduling.k8s.io/group-name: settlement-x
spec:
  schedulerName: default-scheduler
  restartPolicy: Never
  containers:
  - name: batch
    image: docker.io/library/busybox:1.36
---
# DEC-6: the narrowed controllers cannot serve the svc/ssh/framework plugins.
apiVersion: batch.volcano.sh/v1alpha1
kind: Job
metadata:
  name: env-plugin-job
  namespace: shop-dev
spec:
  schedulerName: volcano
  minAvailable: 1
  plugins:
    env: []
  tasks:
  - name: batch
    replicas: 1
    template:
      spec:
        restartPolicy: Never
        containers:
        - name: batch
          image: docker.io/library/busybox:1.36
  queue: acme-payments-dev
---
apiVersion: batch.volcano.sh/v1alpha1
kind: Job
metadata:
  name: svc-plugin-job
  namespace: shop-dev
spec:
  schedulerName: volcano
  minAvailable: 1
  plugins:
    env: []
    svc: []
  tasks:
  - name: batch
    replicas: 1
    template:
      spec:
        restartPolicy: Never
        containers:
        - name: batch
          image: docker.io/library/busybox:1.36
  queue: acme-payments-dev
---
apiVersion: batch.volcano.sh/v1alpha1
kind: Job
metadata:
  name: pytorch-plugin-job
  namespace: shop-dev
spec:
  schedulerName: volcano
  minAvailable: 1
  plugins:
    pytorch: ["--master=manager", "--worker=worker"]
  tasks:
  - name: batch
    replicas: 1
    template:
      spec:
        restartPolicy: Never
        containers:
        - name: batch
          image: docker.io/library/busybox:1.36
  queue: acme-payments-dev
---
apiVersion: batch.volcano.sh/v1alpha1
kind: CronJob
metadata:
  name: cron-ssh-plugin
  namespace: shop-dev
spec:
  schedule: "0 1 * * *"
  jobTemplate:
    spec:
      schedulerName: volcano
      minAvailable: 1
      queue: acme-payments-dev
      plugins:
        ssh: []
      tasks:
      - name: batch
        replicas: 1
        template:
          spec:
            restartPolicy: Never
            containers:
            - name: batch
              image: docker.io/library/busybox:1.36
