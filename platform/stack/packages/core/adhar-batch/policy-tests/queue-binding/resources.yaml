# Volcano runs, CronJobs, PodGroups and pods in team acme/payments' namespaces
# (shop-dev: tier dev; shop-staging: an environment named staging of tier test)
# and in a namespace that belongs to no team (tools).
apiVersion: batch.volcano.sh/v1alpha1
kind: Job
metadata:
  name: own-queue
  namespace: shop-dev
spec:
  schedulerName: volcano
  minAvailable: 1
  tasks:
  - name: batch
    replicas: 1
    template:
      spec:
        restartPolicy: Never
        containers:
        - name: batch
          image: docker.io/library/busybox:1.36
  queue: acme-payments-dev
---
apiVersion: batch.volcano.sh/v1alpha1
