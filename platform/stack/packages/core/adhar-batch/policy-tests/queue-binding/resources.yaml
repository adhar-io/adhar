---
apiVersion: batch.volcano.sh/v1alpha1
kind: CronJob
metadata:
  name: cron-own-queue
  namespace: shop-dev
spec:
  schedule: 0 1 * * *
  jobTemplate:
    spec:
      schedulerName: volcano
      minAvailable: 1
      tasks:
      - name: batch
        replicas: 1
        template:
          spec:
            restartPolicy: Never
            containers:
