# batch/v1 Jobs and CronJobs whose pods Volcano schedules (a single run on Volcano:
# the composition changes only the pod template), and what Kubernetes' Job and
# CronJob controllers create for them.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: single-own-queue
  namespace: shop-dev
spec:
  template:
    metadata:
      annotations:
        scheduling.volcano.sh/queue-name: acme-payments-dev
    spec:
      schedulerName: volcano
      restartPolicy: Never
      containers:
      - name: batch
        image: docker.io/library/busybox:1.36
---
apiVersion: batch/v1
kind: Job
metadata:
  name: single-team-b-queue
  namespace: shop-dev
spec:
  template:
    metadata:
      annotations:
        scheduling.volcano.sh/queue-name: acme-ledger-dev
    spec:
      schedulerName: volcano
      restartPolicy: Never
      containers:
      - name: batch
        image: docker.io/library/busybox:1.36
---
apiVersion: batch/v1
kind: Job
metadata:
  name: single-wildcard-queue
  namespace: shop-dev
spec:
  template:
    metadata:
      annotations:
        scheduling.volcano.sh/queue-name: '*'
    spec:
      schedulerName: volcano
      restartPolicy: Never
      containers:
      - name: batch
        image: docker.io/library/busybox:1.36
---
apiVersion: batch/v1
kind: Job
metadata:
  name: single-unset-queue
  namespace: shop-dev
spec:
  template:
    spec:
      schedulerName: volcano
      restartPolicy: Never
      containers:
      - name: batch
        image: docker.io/library/busybox:1.36
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cron-single-own-queue
  namespace: shop-dev
spec:
  schedule: "0 1 * * *"
  jobTemplate:
    spec:
      template:
        metadata:
          annotations:
            scheduling.volcano.sh/queue-name: acme-payments-dev
        spec:
          schedulerName: volcano
          restartPolicy: Never
          containers:
          - name: batch
            image: docker.io/library/busybox:1.36
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cron-single-team-b-queue
  namespace: shop-dev
spec:
  schedule: "0 1 * * *"
  jobTemplate:
    spec:
      template:
        metadata:
          annotations:
            scheduling.volcano.sh/queue-name: acme-ledger-dev
        spec:
          schedulerName: volcano
          restartPolicy: Never
          containers:
          - name: batch
            image: docker.io/library/busybox:1.36
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cron-single-unset-queue
  namespace: shop-dev
spec:
  schedule: "0 1 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          schedulerName: volcano
          restartPolicy: Never
          containers:
          - name: batch
            image: docker.io/library/busybox:1.36
---
apiVersion: batch/v1
kind: Job
metadata:
  name: plain-batch-job
  namespace: shop-dev
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: batch
        image: docker.io/library/busybox:1.36
---
apiVersion: batch/v1
kind: Job
metadata:
  name: group-name-kube-scheduler-job
  namespace: shop-dev
spec:
  template:
    metadata:
      annotations:
        scheduling.k8s.io/group-name: 'settlement-x'
    spec:
      restartPolicy: Never
      containers:
      - name: batch
        image: docker.io/library/busybox:1.36
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cron-group-name-kube-scheduler
  namespace: shop-dev
spec:
  schedule: "0 1 * * *"
  jobTemplate:
    spec:
      template:
        metadata:
          annotations:
            scheduling.k8s.io/group-name: 'settlement-x'
        spec:
          restartPolicy: Never
          containers:
          - name: batch
            image: docker.io/library/busybox:1.36
---
apiVersion: batch/v1
kind: Job
metadata:
  name: job-made-by-cron-team-b-queue
  namespace: shop-dev
  ownerReferences:
  - {apiVersion: batch/v1, kind: CronJob, name: job-made-by-cron-team-b-queue-owner, uid: 00000000-0000-0000-0000-000000000001, controller: true}
spec:
  template:
    metadata:
      annotations:
        scheduling.volcano.sh/queue-name: acme-ledger-dev
    spec:
      schedulerName: volcano
      restartPolicy: Never
      containers:
      - name: batch
        image: docker.io/library/busybox:1.36
---
apiVersion: v1
kind: Pod
metadata:
  name: job-pod-team-b-queue
  namespace: shop-dev
  ownerReferences:
  - {apiVersion: batch/v1, kind: Job, name: job-pod-team-b-queue-owner, uid: 00000000-0000-0000-0000-000000000002, controller: true}
  annotations:
    scheduling.volcano.sh/queue-name: acme-ledger-dev
spec:
  restartPolicy: Never
  containers:
  - name: batch
    image: docker.io/library/busybox:1.36
  schedulerName: volcano
---
apiVersion: v1
kind: Pod
metadata:
  name: job-pod-group-name-kube-scheduler
  namespace: shop-dev
  ownerReferences:
  - {apiVersion: batch/v1, kind: Job, name: job-pod-group-name-kube-scheduler-owner, uid: 00000000-0000-0000-0000-000000000002, controller: true}
  annotations:
    scheduling.k8s.io/group-name: 'settlement-x'
spec:
  restartPolicy: Never
  containers:
  - name: batch
    image: docker.io/library/busybox:1.36
---
apiVersion: v1
kind: Pod
metadata:
  name: replicaset-pod-team-b-queue
  namespace: shop-dev
  ownerReferences:
  - {apiVersion: apps/v1, kind: ReplicaSet, name: replicaset-pod-team-b-queue-owner, uid: 00000000-0000-0000-0000-000000000002, controller: true}
  annotations:
    scheduling.volcano.sh/queue-name: acme-ledger-dev
spec:
  restartPolicy: Never
  containers:
  - name: batch
    image: docker.io/library/busybox:1.36
  schedulerName: volcano
---
apiVersion: v1
kind: Pod
metadata:
  name: volcano-job-pod-team-b-queue
  namespace: shop-dev
  ownerReferences:
  - {apiVersion: batch.volcano.sh/v1alpha1, kind: Job, name: volcano-job-pod-team-b-queue-owner, uid: 00000000-0000-0000-0000-000000000002, controller: true}
  annotations:
    scheduling.volcano.sh/queue-name: acme-ledger-dev
spec:
  restartPolicy: Never
  containers:
  - name: batch
    image: docker.io/library/busybox:1.36
  schedulerName: volcano
# volcano.sh/preemptable: every value strconv.ParseBool does not read as true
# keeps a task out of Volcano's reclaim and preempt.
---
apiVersion: batch.volcano.sh/v1alpha1
kind: Job
metadata:
  name: vc-job-not-preemptable
  namespace: shop-dev
  annotations:
    volcano.sh/preemptable: "false"
spec:
  schedulerName: volcano
  minAvailable: 1
  queue: acme-payments-dev
  tasks:
  - name: batch
    replicas: 1
    template:
      spec:
        restartPolicy: Never
        containers:
        - name: batch
          image: docker.io/library/busybox:1.36
---
apiVersion: batch.volcano.sh/v1alpha1
kind: Job
metadata:
  name: vc-task-label-not-preemptable
  namespace: shop-dev
spec:
  schedulerName: volcano
  minAvailable: 1
  queue: acme-payments-dev
  tasks:
  - name: batch
    replicas: 1
    template:
      metadata:
        labels:
          volcano.sh/preemptable: "0"
      spec:
        restartPolicy: Never
        containers:
        - name: batch
          image: docker.io/library/busybox:1.36
---
apiVersion: batch.volcano.sh/v1alpha1
kind: CronJob
metadata:
  name: vc-cron-not-preemptable
  namespace: shop-dev
spec:
  schedule: "0 1 * * *"
  jobTemplate:
    metadata:
      annotations:
        volcano.sh/preemptable: "False"
    spec:
      schedulerName: volcano
      minAvailable: 1
      queue: acme-payments-dev
      tasks:
      - name: batch
        replicas: 1
        template:
          spec:
            restartPolicy: Never
            containers:
            - name: batch
              image: docker.io/library/busybox:1.36
---
apiVersion: batch.volcano.sh/v1alpha1
kind: CronJob
metadata:
  name: vc-cron-task-not-preemptable
  namespace: shop-dev
spec:
  schedule: "0 1 * * *"
  jobTemplate:
    spec:
      schedulerName: volcano
      minAvailable: 1
      queue: acme-payments-dev
      tasks:
      - name: batch
        replicas: 1
        template:
          metadata:
            annotations:
              volcano.sh/preemptable: "f"
          spec:
            restartPolicy: Never
            containers:
            - name: batch
              image: docker.io/library/busybox:1.36
---
apiVersion: scheduling.volcano.sh/v1beta1
kind: PodGroup
metadata:
  name: podgroup-not-preemptable
  namespace: shop-dev
  labels:
    volcano.sh/preemptable: "false"
spec:
  minMember: 1
  queue: acme-payments-dev
---
apiVersion: v1
kind: Pod
metadata:
  name: volcano-pod-not-preemptable
  namespace: shop-dev
  annotations:
    scheduling.volcano.sh/queue-name: acme-payments-dev
    volcano.sh/preemptable: "FALSE"
spec:
  restartPolicy: Never
  containers:
  - name: batch
    image: docker.io/library/busybox:1.36
  schedulerName: volcano
---
# A value that does not parse is read as NOT preemptable.
apiVersion: v1
kind: Pod
metadata:
  name: volcano-pod-preemptable-unparseable
  namespace: shop-dev
  labels:
    volcano.sh/preemptable: "no"
spec:
  restartPolicy: Never
  containers:
  - name: batch
    image: docker.io/library/busybox:1.36
  schedulerName: volcano
---
apiVersion: v1
kind: Pod
metadata:
  name: volcano-pod-preemptable
  namespace: shop-dev
  annotations:
    volcano.sh/preemptable: "true"
  labels:
    volcano.sh/preemptable: "T"
spec:
  restartPolicy: Never
  containers:
  - name: batch
    image: docker.io/library/busybox:1.36
  schedulerName: volcano
---
apiVersion: batch/v1
kind: Job
metadata:
  name: single-not-preemptable
  namespace: shop-dev
spec:
  template:
    metadata:
      annotations:
        scheduling.volcano.sh/queue-name: acme-payments-dev
        volcano.sh/preemptable: "false"
    spec:
      schedulerName: volcano
      restartPolicy: Never
      containers:
      - name: batch
        image: docker.io/library/busybox:1.36
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cron-single-not-preemptable
  namespace: shop-dev
spec:
  schedule: "0 1 * * *"
  jobTemplate:
    spec:
      template:
        metadata:
          annotations:
            scheduling.volcano.sh/queue-name: acme-payments-dev
          labels:
            volcano.sh/preemptable: "false"
        spec:
          schedulerName: volcano
          restartPolicy: Never
          containers:
          - name: batch
            image: docker.io/library/busybox:1.36
---
apiVersion: v1
kind: Pod
metadata:
  name: job-pod-not-preemptable
  namespace: shop-dev
  ownerReferences:
  - {apiVersion: batch/v1, kind: Job, name: job-pod-not-preemptable-owner, uid: 00000000-0000-0000-0000-000000000002, controller: true}
  annotations:
    scheduling.volcano.sh/queue-name: acme-payments-dev
    volcano.sh/preemptable: "false"
spec:
  restartPolicy: Never
  containers:
  - name: batch
    image: docker.io/library/busybox:1.36
  schedulerName: volcano
