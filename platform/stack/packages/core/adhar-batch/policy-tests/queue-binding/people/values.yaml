# What the rules read from the cluster, mocked: the namespace's labels (team
# acme/payments, tier dev) and its leaf Queue's, which the Team composition labelled.
apiVersion: cli.kyverno.io/v1alpha1
kind: Values
metadata:
  name: queue-binding-people
namespaceSelector:
- name: shop-dev
  labels: &id001
    adhar.io/organisation: acme
    adhar.io/team: payments
    adhar.io/project: shop
    adhar.io/environment: dev
    adhar.io/tier: dev
- name: shop-staging
  labels:
    adhar.io/organisation: acme
    adhar.io/team: payments
    adhar.io/project: shop
    adhar.io/environment: staging
    adhar.io/tier: test
- name: tools
  labels:
    kubernetes.io/metadata.name: tools
policies:
- name: adhar-batch-queue-default
  rules:
  - name: default-a-volcano-job-to-its-team-queue
    values:
      ns: *id001
  - name: default-a-volcano-cronjob-to-its-team-queue
    values:
      ns: *id001
  - name: default-a-volcano-scheduled-job-to-its-team-queue
    values:
      ns: *id001
  - name: default-a-volcano-scheduled-cronjob-to-its-team-queue
    values:
      ns: *id001
  - name: default-a-volcano-pod-to-its-team-queue
    values:
      ns: *id001
- name: adhar-batch-queue-binding
  rules:
  - name: a-volcano-job-names-its-team-queue
    values:
      ns: *id001
  - name: a-volcano-cronjob-names-its-team-queue
    values:
      ns: *id001
  - name: a-podgroup-names-its-team-queue
    values:
      ns: *id001
  - name: a-volcano-pod-names-its-team-queue
    values:
      ns: *id001
  - name: a-group-name-pod-is-scheduled-by-volcano
    values:
      ns: *id001
  - name: a-volcano-scheduled-job-names-its-team-queue
    values:
      ns: *id001
  - name: a-group-name-template-is-scheduled-by-volcano
    values:
      ns: *id001
  - name: a-volcano-run-stays-preemptable
    values:
      ns: *id001
  - name: a-volcano-job-uses-the-env-plugin-only
    values:
      ns: *id001
  - name: a-volcano-cronjob-uses-the-env-plugin-only
    values:
      ns: *id001
  - name: the-team-queue-belongs-to-the-team
    values:
      ns: *id001
      owner:
        adhar.io/organisation: acme
        adhar.io/team: payments
        adhar.io/batch-queue: 'true'
        adhar.io/tier: dev
