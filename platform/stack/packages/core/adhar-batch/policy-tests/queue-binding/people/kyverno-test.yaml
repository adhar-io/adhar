# A person (or the CLI, or the Console as one) in team acme/payments' dev namespace.
# A2.5: a Volcano Job naming team B's queue (acme-ledger-dev) is denied. A queue `*`
# is neither defaulted nor admitted: conditions would read it as a wildcard.
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata: {name: queue-binding-people}
policies: [../policy-under-test.yaml]
resources: [../resources.yaml]
variables: values.yaml
userinfo: user.yaml
results:
- policy: adhar-batch-queue-default
  rule: default-a-volcano-job-to-its-team-queue
  kind: Job
  resources: [unset-queue, default-queue]
  patchedResources: ../patched.yaml
  result: pass
- policy: adhar-batch-queue-default
  rule: default-a-volcano-job-to-its-team-queue
  kind: Job
  resources: [own-queue, team-b-queue, wildcard-queue]
  result: skip
- policy: adhar-batch-queue-default
  rule: default-a-volcano-cronjob-to-its-team-queue
  kind: CronJob
  resources: [cron-unset-queue]
  patchedResources: ../patched.yaml
  result: pass
- policy: adhar-batch-queue-default
  rule: default-a-volcano-cronjob-to-its-team-queue
  kind: CronJob
  resources: [cron-team-b-queue]
  result: skip
- policy: adhar-batch-queue-default
  rule: default-a-volcano-pod-to-its-team-queue
  kind: Pod
  resources: [volcano-pod-unset]
  patchedResources: ../patched.yaml
  result: pass
- policy: adhar-batch-queue-default
  rule: default-a-volcano-pod-to-its-team-queue
  kind: Pod
  resources: [gang-member, plain-pod, volcano-pod-team-b-queue, volcano-pod-wildcard-queue]
  result: skip
- policy: adhar-batch-queue-binding
  rule: a-volcano-job-names-its-team-queue
  kind: Job
  resources: [own-queue]
  result: pass
- policy: adhar-batch-queue-binding
  rule: a-volcano-job-names-its-team-queue
  kind: Job
  resources: [team-b-queue, other-tier-queue, wildcard-queue]
  result: fail
- policy: adhar-batch-queue-binding
  rule: a-volcano-job-names-its-team-queue
  kind: Job
  resources: [platform-namespace-job]
  result: skip
- policy: adhar-batch-queue-binding
  rule: a-volcano-cronjob-names-its-team-queue
  kind: CronJob
  resources: [cron-own-queue]
  result: pass
- policy: adhar-batch-queue-binding
  rule: a-volcano-cronjob-names-its-team-queue
  kind: CronJob
  resources: [cron-team-b-queue]
  result: fail
- policy: adhar-batch-queue-binding
  rule: a-podgroup-names-its-team-queue
  kind: PodGroup
  resources: [podgroup-own-queue]
  result: pass
- policy: adhar-batch-queue-binding
  rule: a-podgroup-names-its-team-queue
  kind: PodGroup
  resources: [podgroup-team-b-queue]
  result: fail
- policy: adhar-batch-queue-binding
  rule: a-volcano-pod-names-its-team-queue
  kind: Pod
  resources: [volcano-pod-own-queue]
  result: pass
- policy: adhar-batch-queue-binding
  rule: a-volcano-pod-names-its-team-queue
  kind: Pod
  resources: [volcano-pod-team-b-queue, volcano-pod-wildcard-queue]
  result: fail
- policy: adhar-batch-queue-binding
  rule: a-volcano-pod-names-its-team-queue
  kind: Pod
  resources: [plain-pod, gang-member]
  result: skip
- policy: adhar-batch-queue-binding
  rule: the-team-queue-belongs-to-the-team
  kind: Job
  resources: [own-queue]
  result: pass
- policy: adhar-batch-queue-binding
  rule: the-team-queue-belongs-to-the-team
  kind: CronJob
  resources: [cron-own-queue]
  result: pass
- policy: adhar-batch-queue-binding
  rule: the-team-queue-belongs-to-the-team
  kind: PodGroup
  resources: [podgroup-own-queue]
  result: pass
- policy: adhar-batch-queue-binding
  rule: the-team-queue-belongs-to-the-team
  kind: Pod
  resources: [volcano-pod-own-queue]
  result: pass
- policy: adhar-batch-queue-binding
  rule: the-team-queue-belongs-to-the-team
  kind: Pod
  resources: [plain-pod, gang-member]
  result: skip
- policy: adhar-batch-queue-binding
  rule: a-group-name-pod-is-scheduled-by-volcano
  kind: Pod
  resources: [annotated-kube-scheduler-pod, annotated-default-scheduler-pod]
  result: fail
- policy: adhar-batch-queue-binding
  rule: a-group-name-pod-is-scheduled-by-volcano
  kind: Pod
  resources: [gang-member, plain-pod, volcano-pod-own-queue]
  result: pass
- policy: adhar-batch-queue-binding
  rule: a-volcano-job-uses-the-env-plugin-only
  kind: Job
  resources: [own-queue, env-plugin-job]
  result: pass
- policy: adhar-batch-queue-binding
  rule: a-volcano-job-uses-the-env-plugin-only
  kind: Job
  resources: [svc-plugin-job, pytorch-plugin-job]
  result: fail
- policy: adhar-batch-queue-binding
  rule: a-volcano-cronjob-uses-the-env-plugin-only
  kind: CronJob
  resources: [cron-own-queue]
  result: pass
- policy: adhar-batch-queue-binding
  rule: a-volcano-cronjob-uses-the-env-plugin-only
  kind: CronJob
  resources: [cron-ssh-plugin]
  result: fail
