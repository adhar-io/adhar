# A person (or the CLI, or the Console acting as one) starting a run of a BatchJob
# that names a Bucket (design 0025 D26): the run built from the template is admitted;
# one reading another bucket, the store's root credential directly, a literal
# endpoint, or none of the five ADHAR_S3_* variables is not. Resources and values
# are generated by generate-resources.sh.
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: bucket-run-integrity
policies:
  - ../run-integrity/policy-under-test.yaml
resources:
  - resources.yaml
variables: values.yaml
userinfo: user.yaml
results:
  - policy: adhar-batch-run-integrity
    rule: a-run-matches-its-template
    kind: Job
    resources: [run-ok, run-with-params]
    result: pass
  - policy: adhar-batch-run-integrity
    rule: a-run-matches-its-template
    kind: Job
    resources: [deny-other-bucket, deny-root-credential, deny-literal-endpoint, deny-dropped-bucket]
    result: fail
