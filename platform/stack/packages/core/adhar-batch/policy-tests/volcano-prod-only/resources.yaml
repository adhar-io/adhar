---
apiVersion: batch.volcano.sh/v1alpha1
kind: Job
metadata:
  name: critical-in-prod
  namespace: shop-prod
  labels: { adhar.io/scale-up: "true" }
spec:
  schedulerName: volcano
  minAvailable: 1
  priorityClassName: adhar-batch-volcano-critical
  tasks:
  - name: batch
    replicas: 1
    template:
      spec:
        restartPolicy: Never
        containers:
        - name: batch
          image: docker.io/library/busybox:1.36
---
apiVersion: batch.volcano.sh/v1alpha1
kind: CronJob
metadata:
  name: cron-scale-up-in-dev
  namespace: shop-dev
spec:
  schedule: "0 1 * * *"
  jobTemplate:
    metadata:
      labels: { adhar.io/scale-up: "true" }
    spec:
      schedulerName: volcano
      minAvailable: 1
      tasks:
      - name: batch
        replicas: 1
        template:
          spec:
            restartPolicy: Never
            containers:
            - name: batch
              image: docker.io/library/busybox:1.36
---
apiVersion: batch.volcano.sh/v1alpha1
kind: CronJob
metadata:
  name: cron-standard-in-dev
  namespace: shop-dev
spec:
  schedule: "0 1 * * *"
  jobTemplate:
    metadata: {}
    spec:
      schedulerName: volcano
      minAvailable: 1
      priorityClassName: adhar-batch-volcano
      tasks:
      - name: batch
