  minAvailable: 1
  priorityClassName: adhar-batch-volcano-critical
  tasks:
  - name: batch
    replicas: 1
    template:
      spec:
        restartPolicy: Never
        containers:
        - name: batch
          image: docker.io/library/busybox:1.36
---
apiVersion: batch.volcano.sh/v1alpha1
kind: Job
metadata:
  name: task-critical-in-dev
  namespace: shop-dev
spec:
  schedulerName: volcano
  minAvailable: 1
  priorityClassName: adhar-batch-volcano
  tasks:
  - name: batch
    replicas: 1
    template:
      spec:
        restartPolicy: Never
