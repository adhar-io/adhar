---
apiVersion: scheduling.volcano.sh/v1beta1
kind: PodGroup
metadata:
  name: podgroup-scale-up-in-dev
  namespace: shop-dev
  labels: { adhar.io/scale-up: "true" }
spec:
  minMember: 1
  queue: acme-payments-dev
