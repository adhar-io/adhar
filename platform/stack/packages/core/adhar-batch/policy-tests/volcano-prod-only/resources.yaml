# Volcano runs in a prod and a dev namespace (design 0025 §4.4, §4.7).
apiVersion: batch.volcano.sh/v1alpha1
kind: Job
metadata:
  name: scale-up-in-dev
  namespace: shop-dev
  labels: { adhar.io/scale-up: "true" }
spec:
  schedulerName: volcano
  minAvailable: 1
  tasks:
  - name: batch
    replicas: 1
    template:
      spec:
        restartPolicy: Never
        containers:
        - name: batch
          image: docker.io/library/busybox:1.36
---
apiVersion: batch.volcano.sh/v1alpha1
kind: Job
metadata:
  name: scale-up-in-prod
  namespace: shop-prod
  labels: { adhar.io/scale-up: "true" }
spec:
  schedulerName: volcano
  minAvailable: 1
  tasks:
  - name: batch
    replicas: 1
    template:
      spec:
        restartPolicy: Never
        containers:
        - name: batch
          image: docker.io/library/busybox:1.36
---
apiVersion: batch.volcano.sh/v1alpha1
kind: Job
metadata:
  name: standard-in-dev
  namespace: shop-dev
spec:
  schedulerName: volcano
  minAvailable: 1
  priorityClassName: adhar-batch-volcano
  tasks:
  - name: batch
    replicas: 1
    template:
      spec:
        restartPolicy: Never
        containers:
        - name: batch
          image: docker.io/library/busybox:1.36
---
apiVersion: batch.volcano.sh/v1alpha1
kind: Job
metadata:
  name: critical-in-dev
  namespace: shop-dev
spec:
