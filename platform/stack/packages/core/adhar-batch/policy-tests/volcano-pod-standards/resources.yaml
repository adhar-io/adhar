# A partitioned run as design 0025 §4.5 renders it (1 manager + 4 workers), and
# variants that each break one standard.
apiVersion: batch.volcano.sh/v1alpha1
kind: Job
metadata:
  name: standard-run
  namespace: shop-prod
  labels:
    adhar.io/batch-job: settlement
    adhar.io/workload: batch
spec:
  schedulerName: volcano
  queue: acme-payments-prod
  priorityClassName: adhar-batch-volcano-critical
  minAvailable: 5
  maxRetry: 3
  ttlSecondsAfterFinished: 604800
  tasks:
  - name: manager
    replicas: 1
    template:
      metadata:
        labels:
          adhar.io/workload: batch
      spec:
        restartPolicy: Never
        containers:
        - name: batch
          image: docker.io/library/busybox:1.36
          resources:
            requests:
              cpu: '1'
              memory: 1536Mi
            limits:
              memory: 1536Mi
        activeDeadlineSeconds: 21600
  - name: worker
    replicas: 4
    template:
      metadata:
        labels:
          adhar.io/workload: batch
      spec:
        restartPolicy: Never
        containers:
        - name: batch
          image: docker.io/library/busybox:1.36
          resources:
            requests:
              cpu: '1'
              memory: 1536Mi
            limits:
              memory: 1536Mi
        activeDeadlineSeconds: 21600
---
