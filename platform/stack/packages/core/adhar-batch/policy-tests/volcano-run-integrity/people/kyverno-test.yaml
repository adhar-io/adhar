# A person (or the CLI, or the Console acting as one) starting a Volcano run: every
# run- variant is one a client builds from the template, every deny- variant changes
# what a client may not.
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: volcano-run-integrity-people
policies:
  - ../policy-under-test.yaml
resources:
  - ../resources.yaml
variables: ../values.yaml
userinfo: user.yaml
