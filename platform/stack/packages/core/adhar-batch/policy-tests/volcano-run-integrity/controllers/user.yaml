# vc-controller-manager (core/volcano), which runs a Volcano CronJob's schedule.
apiVersion: cli.kyverno.io/v1alpha1
kind: UserInfo
metadata:
  name: volcano-controllers
userInfo:
  username: system:serviceaccount:adhar-system:volcano-controllers
  groups:
    - system:serviceaccounts
    - system:serviceaccounts:adhar-system
    - system:authenticated
