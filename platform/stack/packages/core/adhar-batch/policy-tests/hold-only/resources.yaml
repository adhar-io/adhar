  namespace: prod
  labels: { team: payments }
  annotations: { adhar.io/batch-hold: cover, example.io/note: "kept" }
spec: { parameters: { job: importJob, image: "docker.io/evil/image:1", database: { secretRef: importer-db-app } } }
---
