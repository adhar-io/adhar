# Enforce since Phase 3 (PLAT-3.6); each rule both ways, and nothing that is not a batch
# run. The CronJob twins exist because autogen gives a Job rule no CronJob rule: a
# schedule that breaks a standard is refused when it is defined, not at every fire.
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: pod-standards
policies:
  - ../../manifests/kyverno-pod-standards.yaml
resources:
  - resources.yaml
results:
  - { policy: adhar-batch-pod-standards, rule: a-run-has-a-deadline-and-a-ttl, kind: Job, resources: [good], result: pass }
  - { policy: adhar-batch-pod-standards, rule: a-run-has-a-deadline-and-a-ttl, kind: Job, resources: [bad], result: fail }
  - { policy: adhar-batch-pod-standards, rule: a-run-has-a-deadline-and-a-ttl, kind: Job, resources: [not-batch], result: skip }
  - { policy: adhar-batch-pod-standards, rule: a-run-pod-never-restarts-in-place-and-uses-a-batch-class, kind: Job, resources: [good], result: pass }
  - { policy: adhar-batch-pod-standards, rule: a-run-pod-never-restarts-in-place-and-uses-a-batch-class, kind: Job, resources: [bad], result: fail }
  - { policy: adhar-batch-pod-standards, rule: a-run-mounts-no-persistent-volume, kind: Job, resources: [good], result: pass }
  - { policy: adhar-batch-pod-standards, rule: a-run-mounts-no-persistent-volume, kind: Job, resources: [bad], result: fail }
  - { policy: adhar-batch-pod-standards, rule: a-run-containers-memory-request-equals-its-limit, kind: Job, resources: [good], result: pass }
  - { policy: adhar-batch-pod-standards, rule: a-run-containers-memory-request-equals-its-limit, kind: Job, resources: [bad], result: fail }
  - { policy: adhar-batch-pod-standards, rule: a-run-has-a-deadline-and-a-ttl, kind: Job, resources: [no-ttl], result: fail }
  - { policy: adhar-batch-pod-standards, rule: a-run-has-a-deadline-and-a-ttl, kind: Job, resources: [volcano-single], result: pass }
  - { policy: adhar-batch-pod-standards, rule: a-run-pod-never-restarts-in-place-and-uses-a-batch-class, kind: Job, resources: [volcano-single, volcano-single-native-class], result: pass }
  - { policy: adhar-batch-pod-standards, rule: a-volcano-scheduled-run-pod-uses-a-volcano-class, kind: Job, resources: [volcano-single], result: pass }
  - { policy: adhar-batch-pod-standards, rule: a-volcano-scheduled-run-pod-uses-a-volcano-class, kind: Job, resources: [volcano-single-native-class], result: fail }
  - { policy: adhar-batch-pod-standards, rule: a-volcano-scheduled-run-pod-uses-a-volcano-class, kind: Job, resources: [good], result: skip }
  - { policy: adhar-batch-pod-standards, rule: a-scheduled-run-has-a-deadline-and-a-ttl, kind: CronJob, resources: [schedule-good], result: pass }
  - { policy: adhar-batch-pod-standards, rule: a-scheduled-run-has-a-deadline-and-a-ttl, kind: CronJob, resources: [schedule-bad, schedule-no-ttl], result: fail }
  - { policy: adhar-batch-pod-standards, rule: a-scheduled-run-has-a-deadline-and-a-ttl, kind: CronJob, resources: [schedule-not-batch], result: skip }
  - { policy: adhar-batch-pod-standards, rule: a-scheduled-run-pod-never-restarts-and-uses-a-batch-class, kind: CronJob, resources: [schedule-good, schedule-volcano-native-class], result: pass }
  - { policy: adhar-batch-pod-standards, rule: a-scheduled-run-pod-never-restarts-and-uses-a-batch-class, kind: CronJob, resources: [schedule-bad], result: fail }
  - { policy: adhar-batch-pod-standards, rule: a-scheduled-run-pod-never-restarts-and-uses-a-batch-class, kind: CronJob, resources: [schedule-not-batch], result: skip }
  - { policy: adhar-batch-pod-standards, rule: a-scheduled-volcano-run-pod-uses-a-volcano-class, kind: CronJob, resources: [schedule-volcano-native-class], result: fail }
  - { policy: adhar-batch-pod-standards, rule: a-scheduled-volcano-run-pod-uses-a-volcano-class, kind: CronJob, resources: [schedule-good], result: skip }
  - { policy: adhar-batch-pod-standards, rule: a-scheduled-run-mounts-no-persistent-volume, kind: CronJob, resources: [schedule-good], result: pass }
  - { policy: adhar-batch-pod-standards, rule: a-scheduled-run-mounts-no-persistent-volume, kind: CronJob, resources: [schedule-bad], result: fail }
  - { policy: adhar-batch-pod-standards, rule: a-scheduled-run-containers-memory-request-equals-its-limit, kind: CronJob, resources: [schedule-good], result: pass }
  - { policy: adhar-batch-pod-standards, rule: a-scheduled-run-containers-memory-request-equals-its-limit, kind: CronJob, resources: [schedule-bad], result: fail }
  - { policy: adhar-batch-pod-standards, rule: a-scheduled-run-containers-memory-request-equals-its-limit, kind: CronJob, resources: [schedule-not-batch], result: skip }
