# A person (or the CLI, or the Console acting as one) starting a run of a
# mode: chunked BatchJob (design 0025 D11): every run- variant is one a client
# builds from the template, every deny- variant changes what a client may not.
# Resources and values are generated by ../generate-resources.sh.
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: chunked-run-integrity-native
policies:
  - ../../run-integrity/policy-under-test.yaml
resources:
  - resources.yaml
variables: values.yaml
userinfo: user.yaml
results:
  - policy: adhar-batch-run-integrity
    rule: a-run-matches-its-template
    kind: Job
    resources: [run-ok]
    result: pass
  - policy: adhar-batch-run-integrity
    rule: a-run-matches-its-template
    kind: Job
    resources: [run-with-params]
    result: pass
  - policy: adhar-batch-run-integrity
    rule: a-run-matches-its-template
    kind: Job
    resources: [run-restart]
    result: pass
  - policy: adhar-batch-run-integrity
    rule: a-run-matches-its-template
    kind: Job
    resources: [deny-distribution]
    result: fail
  - policy: adhar-batch-run-integrity
    rule: a-run-matches-its-template
    kind: Job
    resources: [deny-no-distribution]
    result: fail
  - policy: adhar-batch-run-integrity
    rule: a-run-matches-its-template
    kind: Job
    resources: [deny-partition-channel]
    result: fail
  - policy: adhar-batch-run-integrity
    rule: a-run-matches-its-template
    kind: Job
    resources: [deny-mode]
    result: fail
  - policy: adhar-batch-run-integrity
    rule: a-run-matches-its-template
    kind: Job
    resources: [deny-chunking-timeout]
    result: fail
  - policy: adhar-batch-run-integrity
    rule: a-run-matches-its-template
    kind: Job
    resources: [deny-request-queue]
    result: fail
  - policy: adhar-batch-run-integrity
    rule: a-run-matches-its-template
    kind: Job
    resources: [deny-reply-queue]
    result: fail
  - policy: adhar-batch-run-integrity
    rule: a-run-matches-its-template
    kind: Job
    resources: [deny-queue-prefix]
    result: fail
  - policy: adhar-batch-run-integrity
    rule: a-run-matches-its-template
    kind: Job
    resources: [deny-extra-envfrom]
    result: fail
  - policy: adhar-batch-run-integrity
    rule: a-run-matches-its-template
    kind: Job
    resources: [deny-password-secret]
    result: fail
  - policy: adhar-batch-run-integrity
    rule: a-run-matches-its-template
    kind: Job
    resources: [deny-lineage-receiver]
    result: fail
  - policy: adhar-batch-run-integrity
    rule: a-run-matches-its-template
    kind: Job
    resources: [deny-lineage-namespace]
    result: fail
  - policy: adhar-batch-run-integrity
    rule: a-run-matches-its-template
    kind: Job
    resources: [deny-lineage-token]
    result: fail
  - policy: adhar-batch-run-integrity
    rule: a-run-matches-its-template
    kind: Job
    resources: [deny-lineage-key]
    result: fail
  - policy: adhar-batch-run-integrity
    rule: a-run-matches-its-template
    kind: Job
    resources: [deny-lineage-dropped]
    result: fail
  - policy: adhar-batch-run-integrity
    rule: a-run-matches-its-template
    kind: Job
    resources: [deny-indexes]
    result: fail
  - policy: adhar-batch-run-integrity
    rule: a-run-matches-its-template
    kind: Job
    resources: [deny-image]
    result: fail
