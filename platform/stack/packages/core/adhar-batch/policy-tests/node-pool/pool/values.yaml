# One node labelled adhar.io/node-pool=batch exists (the policy's node lookup).
apiVersion: cli.kyverno.io/v1alpha1
kind: Values
metadata:
  name: node-pool-with-a-pool
policies:
  - name: adhar-batch-node-pool
    rules:
      - name: a-run-pod-tolerates-and-prefers-the-batch-pool
        values:
          poolNodes: 1
