    \      jsonPath: .spec.ips\n    - name: Age\n      type: date\n      jsonPath:\
    \ .metadata.creationTimestamp\n    \"schema\":\n      \"openAPIV3Schema\":\n \
    \       description: ServiceImport describes a service imported from clusters\
