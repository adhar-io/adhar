  autoscaling.karmada.io_federatedhpas.yaml: "---\napiVersion: apiextensions.k8s.io/v1\n\
    kind: CustomResourceDefinition\nmetadata:\n  annotations:\n    controller-gen.kubebuilder.io/version:\
    \ v0.21.0\n  name: federatedhpas.autoscaling.karmada.io\nspec:\n  group: autoscaling.karmada.io\n\
    \  names:\n    categories:\n    - karmada-io\n    kind: FederatedHPA\n    listKind:\
    \ FederatedHPAList\n    plural: federatedhpas\n    shortNames:\n    - fhpa\n \
    \   singular: federatedhpa\n  scope: Namespaced\n  versions:\n  - additionalPrinterColumns:\n\
    \    - jsonPath: .spec.scaleTargetRef.kind\n      name: REFERENCE-KIND\n     \
    \ type: string\n    - jsonPath: .spec.scaleTargetRef.name\n      name: REFERENCE-NAME\n\
    \      type: string\n    - jsonPath: .spec.minReplicas\n      name: MINPODS\n\
    \      type: integer\n    - jsonPath: .spec.maxReplicas\n      name: MAXPODS\n\
    \      type: integer\n    - jsonPath: .status.currentReplicas\n      name: REPLICAS\n\
    \      type: integer\n    - jsonPath: .metadata.creationTimestamp\n      name:\
    \ AGE\n      type: date\n    name: v1alpha1\n    schema:\n      openAPIV3Schema:\n\
    \        description: |-\n          FederatedHPA is centralized HPA that can aggregate\
    \ the metrics in multiple clusters.\n          When the system load increases,\
    \ it will query the metrics from multiple clusters and scales up the replicas.\n\
    \          When the system load decreases, it will query the metrics from multiple\
    \ clusters and scales down the replicas.\n          After the replicas are scaled\
    \ up/down, karmada-scheduler will schedule the replicas based on the policy.\n\
    \        properties:\n          apiVersion:\n            description: |-\n   \
    \           APIVersion defines the versioned schema of this representation of\
    \ an object.\n              Servers should convert recognized schemas to the latest\
    \ internal value, and\n              may reject unrecognized values.\n       \
    \       More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources\n\
    \            type: string\n          kind:\n            description: |-\n    \
    \          Kind is a string value representing the REST resource this object represents.\n\
    \              Servers may infer this from the endpoint the client submits requests\
    \ to.\n              Cannot be updated.\n              In CamelCase.\n       \
    \       More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds\n\
    \            type: string\n          metadata:\n            type: object\n   \
    \       spec:\n            description: Spec is the specification of the FederatedHPA.\n\
    \            properties:\n              behavior:\n                description:\
    \ |-\n                  Behavior configures the scaling behavior of the target\n\
    \                  in both Up and Down directions (scaleUp and scaleDown fields\
    \ respectively).\n                  If not set, the default HPAScalingRules for\
    \ scale up and scale down are used.\n                properties:\n           \
    \       scaleDown:\n                    description: |-\n                    \
    \  scaleDown is scaling policy for scaling Down.\n                      If not\
    \ set, the default value is to allow to scale down to minReplicas pods, with a\n\
    \                      300 second stabilization window (i.e., the highest recommendation\
    \ for\n                      the last 300sec is used).\n                    properties:\n\
    \                      policies:\n                        description: |-\n  \
    \                        policies is a list of potential scaling polices which\
    \ can be used during scaling.\n                          If not set, use the default\
    \ values:\n                          - For scale up: allow doubling the number\
    \ of pods, or an absolute change of 4 pods in a 15s window.\n                \
    \          - For scale down: allow all pods to be removed in a 15s window.\n \
    \                       items:\n                          description: HPAScalingPolicy\
    \ is a single policy which must\n                            hold true for a specified\
    \ past interval.\n                          properties:\n                    \
    \        periodSeconds:\n                              description: |-\n     \
    \                           periodSeconds specifies the window of time for which\
    \ the policy should hold true.\n                                PeriodSeconds\
    \ must be greater than zero and less than or equal to 1800 (30 min).\n       \
    \                       format: int32\n                              type: integer\n\
    \                            type:\n                              description:\
    \ type is used to specify the scaling policy.\n                              type:\
    \ string\n                            value:\n                              description:\
