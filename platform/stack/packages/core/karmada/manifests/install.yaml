    \ properties:\n                                            key:\n            \
    \                                  description: The label key that the\n     \
    \                                           selector applies to.\n           \
    \                                   type: string\n                           \
    \                 operator:\n                                              description:\
    \ |-\n                                                Represents a key's relationship\
    \ to a set of values.\n                                                Valid operators\
    \ are In, NotIn, Exists, DoesNotExist. Gt, and Lt.\n                         \
    \                     type: string\n                                         \
    \   values:\n                                              description: |-\n \
    \                                               An array of string values. If\
    \ the operator is In or NotIn,\n                                             \
    \   the values array must be non-empty. If the operator is Exists or DoesNotExist,\n\
    \                                                the values array must be empty.\
    \ If the operator is Gt or Lt, the values\n                                  \
    \              array must have a single element, which will be interpreted as\
