    \                format: date-time\n                type: string\n           \
    \   observedGeneration:\n                description: |-\n                  ObservedGeneration\
    \ is the generation(.metadata.generation) observed by the controller.\n      \
    \            If ObservedGeneration is less than the generation in metadata means\
    \ the controller hasn't confirmed\n                  the rebalance result or hasn't\
    \ done the rebalance yet.\n                format: int64\n                type:\
    \ integer\n              observedWorkloads:\n                description: ObservedWorkloads\
    \ contains information about the execution\n                  states and messages\
