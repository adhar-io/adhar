  policy.karmada.io_clusterpropagationpolicies.yaml: "---\napiVersion: apiextensions.k8s.io/v1\n\
    kind: CustomResourceDefinition\nmetadata:\n  annotations:\n    controller-gen.kubebuilder.io/version:\
    \ v0.21.0\n  name: clusterpropagationpolicies.policy.karmada.io\nspec:\n  group:\
    \ policy.karmada.io\n  names:\n    categories:\n    - karmada-io\n    kind: ClusterPropagationPolicy\n\
    \    listKind: ClusterPropagationPolicyList\n    plural: clusterpropagationpolicies\n\
    \    shortNames:\n    - cpp\n    singular: clusterpropagationpolicy\n  scope:\
    \ Cluster\n  versions:\n  - additionalPrinterColumns:\n    - jsonPath: .spec.conflictResolution\n\
    \      name: CONFLICT-RESOLUTION\n      type: string\n    - jsonPath: .spec.priority\n\
    \      name: PRIORITY\n      type: string\n    - jsonPath: .metadata.creationTimestamp\n\
    \      name: AGE\n      type: date\n    name: v1alpha1\n    schema:\n      openAPIV3Schema:\n\
    \        description: |-\n          ClusterPropagationPolicy represents the cluster-wide\
    \ policy that propagates a group of resources to one or more clusters.\n     \
    \     Different with PropagationPolicy that could only propagate resources in\
    \ its own namespace, ClusterPropagationPolicy\n          is able to propagate\
    \ cluster level resources and resources in any namespace other than system reserved\
    \ ones.\n          System reserved namespaces are: karmada-system, karmada-cluster,\
    \ karmada-es-*.\n        properties:\n          apiVersion:\n            description:\
    \ |-\n              APIVersion defines the versioned schema of this representation\
    \ of an object.\n              Servers should convert recognized schemas to the\
    \ latest internal value, and\n              may reject unrecognized values.\n\
    \              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources\n\
    \            type: string\n          kind:\n            description: |-\n    \
    \          Kind is a string value representing the REST resource this object represents.\n\
    \              Servers may infer this from the endpoint the client submits requests\
    \ to.\n              Cannot be updated.\n              In CamelCase.\n       \
    \       More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds\n\
    \            type: string\n          metadata:\n            type: object\n   \
    \       spec:\n            description: Spec represents the desired behavior of\
    \ ClusterPropagationPolicy.\n            properties:\n              activationPreference:\n\
    \                description: |-\n                  ActivationPreference indicates\
    \ how the referencing resource template will\n                  be propagated,\
    \ in case of policy changes.\n\n                  If empty, the resource template\
    \ will respond to policy changes\n                  immediately, in other words,\
    \ any policy changes will drive the resource\n                  template to be\
    \ propagated immediately as per the current propagation rules.\n\n           \
    \       If the value is 'Lazy' means the policy changes will not take effect for\
    \ now\n                  but defer to the resource template changes, in other\
    \ words, the resource\n                  template will not be propagated as per\
    \ the current propagation rules until\n                  there is an update on\
    \ it.\n                  This is an experimental feature that might help in a\
    \ scenario where a policy\n                  manages huge amount of resource templates,\
    \ changes to a policy typically\n                  affect numerous applications\
    \ simultaneously. A minor misconfiguration\n                  could lead to widespread\
    \ failures. With this feature, the change can be\n                  gradually\
    \ rolled out through iterative modifications of resource templates.\n        \
    \        enum:\n                - Lazy\n                type: string\n       \
    \       association:\n                description: |-\n                  Association\
    \ tells if relevant resources should be selected automatically.\n            \
    \      e.g. a ConfigMap referred by a Deployment.\n                  default false.\n\
    \                  Deprecated: in favor of PropagateDeps.\n                type:\
    \ boolean\n              conflictResolution:\n                default: Abort\n\
    \                description: |-\n                  ConflictResolution declares\
    \ how potential conflict should be handled when\n                  a resource\
    \ that is being propagated already exists in the target cluster.\n\n         \
    \         It defaults to \"Abort\" which means stop propagating to avoid unexpected\n\
    \                  overwrites. The \"Overwrite\" might be useful when migrating\
    \ legacy cluster\n                  resources to Karmada, in which case conflict\
    \ is predictable and can be\n                  instructed to Karmada take over\
    \ the resource by overwriting.\n                enum:\n                - Abort\n\
    \                - Overwrite\n                type: string\n              dependentOverrides:\n\
    \                description: |-\n                  DependentOverrides represents\
    \ the list of overrides(OverridePolicy)\n                  which must present\
    \ before the current PropagationPolicy takes effect.\n\n                  It used\
    \ to explicitly specify overrides which current PropagationPolicy rely on.\n \
    \                 A typical scenario is the users create OverridePolicy(ies) and\
    \ resources at the same time,\n                  they want to ensure the new-created\
    \ policies would be adopted.\n\n                  Note: For the overrides, OverridePolicy(ies)\
    \ in current namespace and ClusterOverridePolicy(ies),\n                  which\
    \ not present in this list will still be applied if they matches the resources.\n\
    \                items:\n                  type: string\n                type:\
    \ array\n              failover:\n                description: |-\n          \
    \        Failover indicates how Karmada migrates applications in case of failures.\n\
    \                  If this value is nil, failover is disabled.\n             \
    \   properties:\n                  application:\n                    description:\
    \ |-\n                      Application indicates failover behaviors in case of\
    \ application failure.\n                      If this value is nil, failover is\
    \ disabled.\n                      If set, the PropagateDeps should be true so\
    \ that the dependencies could\n                      be migrated along with the\
    \ application.\n                    properties:\n                      decisionConditions:\n\
    \                        description: |-\n                          DecisionConditions\
    \ indicates the decision conditions of performing the failover process.\n    \
    \                      Only when all conditions are met can the failover process\
    \ be performed.\n                          Currently, DecisionConditions includes\
    \ several conditions:\n                          - TolerationSeconds (optional)\n\
    \                        properties:\n                          tolerationSeconds:\n\
    \                            default: 300\n                            description:\
    \ |-\n                              TolerationSeconds represents the period of\
    \ time Karmada should wait\n                              after reaching the desired\
    \ state before performing failover process.\n\n                              Defaults\
    \ to 300s if not specified.\n                              Set it to 0 to perform\
    \ failover immediately.\n                            format: int32\n         \
    \                   type: integer\n                        type: object\n    \
    \                  gracePeriodSeconds:\n                        description: |-\n\
    \                          GracePeriodSeconds is the maximum waiting duration\
    \ in seconds before\n                          application on the migrated cluster\
    \ should be deleted.\n                          Required only when PurgeMode is\
    \ \"Gracefully\" and defaults to 600s.\n                          If the application\
    \ on the new cluster cannot reach a Healthy state,\n                         \
    \ Karmada will delete the application after GracePeriodSeconds is reached.\n \
    \                         Value must be positive integer.\n                  \
    \      format: int32\n                        type: integer\n                \
    \      purgeMode:\n                        default: Gracefully\n             \
    \           description: |-\n                          PurgeMode represents how\
    \ to deal with the legacy applications on the\n                          cluster\
    \ from which the application is migrated.\n                          Valid options\
    \ are \"Directly\", \"Gracefully\", \"Never\".\n                          Defaults\
    \ to \"Gracefully\".\n                        enum:\n                        -\
    \ Directly\n                        - Gracefully\n                        - Never\n\
    \                        type: string\n                      statePreservation:\n\
    \                        description: |-\n                          StatePreservation\
    \ defines the policy for preserving and restoring state data\n               \
    \           during failover events for stateful applications.\n\n            \
    \              When an application fails over from one cluster to another, this\
    \ policy enables\n                          the extraction of critical data from\
    \ the original resource configuration.\n                          Upon successful\
    \ migration, the extracted data is then re-injected into the new\n           \
    \               resource, ensuring that the application can resume operation with\
    \ its previous\n                          state intact.\n                    \
    \      This is particularly useful for stateful applications where maintaining\
    \ data\n                          consistency across failover events is crucial.\n\
    \                          If not specified, means no state data will be preserved.\n\
    \n                          Note: This requires the StatefulFailoverInjection\
    \ feature gate to be enabled,\n                          which is alpha.\n   \
    \                     properties:\n                          rules:\n        \
    \                    description: |-\n                              Rules contains\
    \ a list of StatePreservationRule configurations.\n                          \
    \    Each rule specifies a JSONPath expression targeting specific pieces of\n\
    \                              state data to be preserved during failover events.\
    \ An AliasLabelName is associated\n                              with each rule,\
    \ serving as a label key when the preserved data is passed\n                 \
    \             to the new cluster.\n                            items:\n      \
    \                        description: |-\n                                StatePreservationRule\
    \ defines a single rule for state preservation.\n                            \
    \    It includes a JSONPath expression and an alias name that will be used\n \
    \                               as a label key when passing state information\
    \ to the new cluster.\n                              properties:\n           \
    \                     aliasLabelName:\n                                  description:\
    \ |-\n                                    AliasLabelName is the name that will\
    \ be used as a label key when the preserved\n                                \
    \    data is passed to the new cluster. This facilitates the injection of the\n\
    \                                    preserved state back into the application\
    \ resources during recovery.\n                                  type: string\n\
    \                                jsonPath:\n                                 \
    \ description: |-\n                                    JSONPath is the JSONPath\
    \ template used to identify the state data\n                                 \
    \   to be preserved from the original resource configuration.\n              \
    \                      The JSONPath syntax follows the Kubernetes specification:\n\
    \                                    https://kubernetes.io/docs/reference/kubectl/jsonpath/\n\
    \n                                    Note: The JSONPath expression will start\
    \ searching from the \"status\" field of\n                                   \
    \ the API resource object by default. For example, to extract the \"availableReplicas\"\
    \n                                    from a Deployment, the JSONPath expression\
    \ should be \"{.availableReplicas}\", not\n                                  \
    \  \"{.status.availableReplicas}\".\n                                  type: string\n\
    \                              required:\n                              - aliasLabelName\n\
    \                              - jsonPath\n                              type:\
    \ object\n                            type: array\n                        required:\n\
    \                        - rules\n                        type: object\n     \
    \               required:\n                    - decisionConditions\n        \
    \            type: object\n                  cluster:\n                    description:\
    \ |-\n                      Cluster indicates failover behaviors in case of cluster\
    \ failure.\n                      If this value is nil, the failover behavior\
    \ in case of cluster failure\n                      will be controlled by the\
    \ controller's no-execute-taint-eviction-purge-mode\n                      parameter.\n\
    \                      If set, the failover behavior in case of cluster failure\
    \ will be defined\n                      by this value.\n                    properties:\n\
    \                      purgeMode:\n                        default: Gracefully\n\
    \                        description: |-\n                          PurgeMode\
    \ represents how to deal with the legacy applications on the\n               \
    \           cluster from which the application is migrated.\n                \
    \          Valid options are \"Directly\", \"Gracefully\".\n                 \
    \         Defaults to \"Gracefully\".\n                        enum:\n       \
    \                 - Directly\n                        - Gracefully\n         \
    \               type: string\n                      statePreservation:\n     \
    \                   description: |-\n                          StatePreservation\
    \ defines the policy for preserving and restoring state data\n               \
    \           during failover events for stateful applications.\n\n            \
    \              When an application fails over from one cluster to another, this\
    \ policy enables\n                          the extraction of critical data from\
    \ the original resource configuration.\n                          Upon successful\
    \ migration, the extracted data is then re-injected into the new\n           \
    \               resource, ensuring that the application can resume operation with\
    \ its previous\n                          state intact.\n                    \
    \      This is particularly useful for stateful applications where maintaining\
    \ data\n                          consistency across failover events is crucial.\n\
    \                          If not specified, means no state data will be preserved.\n\
    \n                          Note: This requires the StatefulFailoverInjection\
    \ feature gate to be enabled,\n                          which is alpha.\n   \
    \                     properties:\n                          rules:\n        \
    \                    description: |-\n                              Rules contains\
    \ a list of StatePreservationRule configurations.\n                          \
    \    Each rule specifies a JSONPath expression targeting specific pieces of\n\
    \                              state data to be preserved during failover events.\
    \ An AliasLabelName is associated\n                              with each rule,\
    \ serving as a label key when the preserved data is passed\n                 \
    \             to the new cluster.\n                            items:\n      \
    \                        description: |-\n                                StatePreservationRule\
    \ defines a single rule for state preservation.\n                            \
    \    It includes a JSONPath expression and an alias name that will be used\n \
    \                               as a label key when passing state information\
    \ to the new cluster.\n                              properties:\n           \
    \                     aliasLabelName:\n                                  description:\
    \ |-\n                                    AliasLabelName is the name that will\
    \ be used as a label key when the preserved\n                                \
    \    data is passed to the new cluster. This facilitates the injection of the\n\
    \                                    preserved state back into the application\
    \ resources during recovery.\n                                  type: string\n\
    \                                jsonPath:\n                                 \
    \ description: |-\n                                    JSONPath is the JSONPath\
    \ template used to identify the state data\n                                 \
    \   to be preserved from the original resource configuration.\n              \
    \                      The JSONPath syntax follows the Kubernetes specification:\n\
    \                                    https://kubernetes.io/docs/reference/kubectl/jsonpath/\n\
    \n                                    Note: The JSONPath expression will start\
    \ searching from the \"status\" field of\n                                   \
    \ the API resource object by default. For example, to extract the \"availableReplicas\"\
    \n                                    from a Deployment, the JSONPath expression\
    \ should be \"{.availableReplicas}\", not\n                                  \
    \  \"{.status.availableReplicas}\".\n                                  type: string\n\
    \                              required:\n                              - aliasLabelName\n\
    \                              - jsonPath\n                              type:\
    \ object\n                            type: array\n                        required:\n\
    \                        - rules\n                        type: object\n     \
    \               type: object\n                type: object\n              placement:\n\
    \                description: Placement represents the rule for select clusters\
    \ to\n                  propagate resources.\n                properties:\n  \
    \                clusterAffinities:\n                    description: |-\n   \
    \                   ClusterAffinities represents scheduling restrictions to multiple\
    \ cluster\n                      groups that indicated by ClusterAffinityTerm.\n\
    \n                      The scheduler will evaluate these groups one by one in\
    \ the order they\n                      appear in the spec, the group that does\
