apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: etcd
  namespace: adhar-system
  labels:
    app: etcd
spec:
  replicas: 1
  serviceName: etcd
  selector:
    matchLabels:
      app: etcd
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: etcd
    spec:
      automountServiceAccountToken: false
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - etcd
            topologyKey: kubernetes.io/hostname
      containers:
      - name: etcd
        image: registry.k8s.io/etcd:3.6.8-0
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /livez
            port: 2381
            scheme: HTTP
          initialDelaySeconds: 60
          timeoutSeconds: 5
          periodSeconds: 10
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: 2381
            scheme: HTTP
          initialDelaySeconds: 10
          timeoutSeconds: 5
          periodSeconds: 5
          successThreshold: 1
          failureThreshold: 30
        env:
        - name: KARMADA_ETCD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        ports:
        - containerPort: 2379
          name: client
          protocol: TCP
        - containerPort: 2380
          name: server
          protocol: TCP
        - containerPort: 2381
          name: metrics
          protocol: TCP
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 50m
            memory: 128Mi
        volumeMounts:
        - mountPath: /var/lib/etcd
          name: etcd-data
        - name: etcd-cert
          mountPath: /etc/kubernetes/pki/etcd
          readOnly: true
        command:
        - /usr/local/bin/etcd
        - --name
        - $(KARMADA_ETCD_NAME)
        - --listen-peer-urls
        - http://0.0.0.0:2380
        - --listen-client-urls
        - https://0.0.0.0:2379
        - --listen-metrics-urls
        - http://0.0.0.0:2381
        - --advertise-client-urls
        - https://etcd-client.adhar-system.svc.cluster.local:2379
        - --initial-cluster
        - etcd-0=http://etcd-0.etcd.adhar-system.svc.cluster.local:2380
        - --initial-cluster-state
        - new
        - --cert-file=/etc/kubernetes/pki/etcd/karmada.crt
        - --client-cert-auth=true
        - --key-file=/etc/kubernetes/pki/etcd/karmada.key
        - --trusted-ca-file=/etc/kubernetes/pki/etcd/server-ca.crt
        - --log-level=info
        - --data-dir=/var/lib/etcd
        - --cipher-suites=TLS_RSA_WITH_AES_128_CBC_SHA,TLS_RSA_WITH_AES_256_CBC_SHA,TLS_RSA_WITH_AES_128_GCM_SHA256,TLS_RSA_WITH_AES_256_GCM_SHA384,TLS_AES_128_GCM_SHA256,TLS_AES_256_GCM_SHA384,TLS_CHACHA20_POLY1305_SHA256,TLS_ECDHE_ECDSA_WITH_AES_128_CBC_SHA,TLS_ECDHE_ECDSA_WITH_AES_256_CBC_SHA,TLS_ECDHE_RSA_WITH_AES_128_CBC_SHA,TLS_ECDHE_RSA_WITH_AES_256_CBC_SHA,TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256,TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256,TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305,TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305
      priorityClassName: system-node-critical
      volumes:
      - name: etcd-cert
        secret:
          secretName: karmada-cert
  volumeClaimTemplates:
  - metadata:
      name: etcd-data
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: null
      resources:
        requests:
          storage: 5Gi

