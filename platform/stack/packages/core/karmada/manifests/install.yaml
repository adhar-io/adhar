    \                          pattern: ^(\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\\\
    +|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))))?$\n                              x-kubernetes-int-or-string:\
    \ true\n                          type: object\n                        name:\n\
    \                          description: name is the name of the resource in question.\n\
    \                          type: string\n                      required:\n   \
    \                   - current\n                      - name\n                \
    \      type: object\n                    type:\n                      description:\
    \ |-\n                        type is the type of metric source.  It will be one\
    \ of \"ContainerResource\", \"External\",\n                        \"Object\"\
    , \"Pods\" or \"Resource\", each corresponds to a matching field in the object.\n\
    \                      type: string\n                  required:\n           \
    \       - type\n                  type: object\n                type: array\n\
    \                x-kubernetes-list-type: atomic\n              currentReplicas:\n\
    \                description: |-\n                  currentReplicas is current\
    \ number of replicas of pods managed by this autoscaler,\n                  as\
    \ last seen by the autoscaler.\n                format: int32\n              \
    \  type: integer\n              desiredReplicas:\n                description:\
    \ |-\n                  desiredReplicas is the desired number of replicas of pods\
    \ managed by this autoscaler,\n                  as last calculated by the autoscaler.\n\
    \                format: int32\n                type: integer\n              lastScaleTime:\n\
    \                description: |-\n                  lastScaleTime is the last\
    \ time the HorizontalPodAutoscaler scaled the number of pods,\n              \
    \    used by the autoscaler to control how often the number of pods is changed.\n\
    \                format: date-time\n                type: string\n           \
    \   observedGeneration:\n                description: observedGeneration is the\
    \ most recent generation observed\n                  by this autoscaler.\n   \
    \             format: int64\n                type: integer\n            required:\n\
    \            - desiredReplicas\n            type: object\n        required:\n\
    \        - spec\n        type: object\n    served: true\n    storage: true\n \
    \   subresources:\n      status: {}"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: karmada-crds-config-bases
  namespace: adhar-system
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: '2'
  labels: null
data:
  config.karmada.io_resourceinterpretercustomizations.yaml: "---\napiVersion: apiextensions.k8s.io/v1\n\
    kind: CustomResourceDefinition\nmetadata:\n  annotations:\n    controller-gen.kubebuilder.io/version:\
    \ v0.21.0\n  name: resourceinterpretercustomizations.config.karmada.io\nspec:\n\
    \  group: config.karmada.io\n  names:\n    categories:\n    - karmada-io\n   \
    \ kind: ResourceInterpreterCustomization\n    listKind: ResourceInterpreterCustomizationList\n\
    \    plural: resourceinterpretercustomizations\n    shortNames:\n    - ric\n \
    \   singular: resourceinterpretercustomization\n  scope: Cluster\n  versions:\n\
    \  - additionalPrinterColumns:\n    - jsonPath: .spec.target.apiVersion\n    \
    \  name: TARGET-API-VERSION\n      type: string\n    - jsonPath: .spec.target.kind\n\
    \      name: TARGET-KIND\n      type: string\n    - jsonPath: .metadata.creationTimestamp\n\
    \      name: AGE\n      type: date\n    name: v1alpha1\n    schema:\n      openAPIV3Schema:\n\
    \        description: |-\n          ResourceInterpreterCustomization describes\
    \ the configuration of a specific\n          resource for Karmada to get the structure.\n\
    \          It has higher precedence than the default interpreter and the interpreter\n\
    \          webhook.\n        properties:\n          apiVersion:\n            description:\
    \ |-\n              APIVersion defines the versioned schema of this representation\
    \ of an object.\n              Servers should convert recognized schemas to the\
    \ latest internal value, and\n              may reject unrecognized values.\n\
    \              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources\n\
    \            type: string\n          kind:\n            description: |-\n    \
    \          Kind is a string value representing the REST resource this object represents.\n\
    \              Servers may infer this from the endpoint the client submits requests\
    \ to.\n              Cannot be updated.\n              In CamelCase.\n       \
    \       More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds\n\
    \            type: string\n          metadata:\n            type: object\n   \
    \       spec:\n            description: Spec describes the configuration in detail.\n\
    \            properties:\n              customizations:\n                description:\
    \ Customizations describe the interpretation rules.\n                properties:\n\
    \                  componentResource:\n                    description: |-\n \
    \                     ComponentResource describes the rules for Karmada to discover\
    \ the resource requirements\n                      for multiple components from\
    \ the given object.\n                      This is designed for CRDs with multiple\
    \ components (e.g., FlinkDeployment), but\n                      can also be used\
    \ for single-component resources like Deployment.\n                      If implemented,\
    \ the controller will use this to obtain per-component replica and resource\n\
    \                      requirements, and will not call ReplicaResource.\n    \
    \                  If not implemented, the controller will fall back to ReplicaResource\
    \ for backward compatibility.\n                      This will only be used when\
    \ the feature gate 'MultiplePodTemplatesScheduling' is enabled.\n            \
    \        properties:\n                      luaScript:\n                     \
    \   description: |-\n                          LuaScript holds the Lua script\
    \ that is used to extract the desired replica count and resource\n           \
    \               requirements for each component of the resource.\n\n         \
    \                 The script should implement a function as follows:\n\n     \
    \                     ```\n                            luaScript: >\n        \
    \                        function GetComponents(desiredObj)\n                \
    \                    local components = {}\n\n                               \
    \     local jobManagerComponent = {\n                                        name\
    \ = \"jobmanager\",\n                                        replicas = desiredObj.spec.jobManager.replicas\n\
    \                                    }\n                                    table.insert(components,\
    \ jobManagerComponent)\n\n                                    local taskManagerComponent\
    \ = {\n                                        name = \"taskmanager\",\n     \
    \                                   replicas = desiredObj.spec.taskManager.replicas\n\
    \                                    }\n                                    table.insert(components,\
    \ taskManagerComponent)\n\n                                    return components\n\
    \                                end\n                          ```\n\n      \
    \                    The content of the LuaScript needs to be a whole function\
    \ including both\n                          declaration and implementation.\n\n\
    \                          The parameters will be supplied by the system:\n  \
    \                          - desiredObj: the object represents the configuration\
    \ to be applied\n                                to the member cluster.\n\n  \
    \                        The function expects one return value:\n            \
    \                - components: the resource requirements for each component.\n\
    \                          The returned value will be set into a ResourceBinding\
    \ or ClusterResourceBinding.\n                        type: string\n         \
    \           required:\n                    - luaScript\n                    type:\
    \ object\n                  dependencyInterpretation:\n                    description:\
    \ |-\n                      DependencyInterpretation describes the rules for Karmada\
    \ to analyze the\n                      dependent resources.\n               \
    \       Karmada provides built-in rules for several standard Kubernetes types,\
    \ see:\n                      https://karmada.io/docs/userguide/globalview/customizing-resource-interpreter/#interpretdependency\n\
    \                      If DependencyInterpretation is set, the built-in rules\
    \ will be ignored.\n                    properties:\n                      luaScript:\n\
    \                        description: |-\n                          LuaScript\
    \ holds the Lua script that is used to interpret the dependencies of\n       \
    \                   a specific resource.\n                          The script\
    \ should implement a function as follows:\n\n                          ```\n \
    \                           luaScript: >\n                                function\
    \ GetDependencies(desiredObj)\n                                    dependencies\
    \ = {}\n                                    serviceAccountName = desiredObj.spec.template.spec.serviceAccountName\n\
    \                                    if serviceAccountName ~= nil and serviceAccountName\
    \ ~= \"default\" then\n                                        dependency = {}\n\
    \                                        dependency.apiVersion = \"v1\"\n    \
    \                                    dependency.kind = \"ServiceAccount\"\n  \
    \                                      dependency.name = serviceAccountName\n\
    \                                        dependency.namespace = desiredObj.metadata.namespace\n\
    \                                        dependencies[1] = dependency\n      \
    \                              end\n                                    return\
    \ dependencies\n                                end\n                        \
    \  ```\n\n                          The content of the LuaScript needs to be a\
    \ whole function including both\n                          declaration and implementation.\n\
    \n                          The parameters will be supplied by the system:\n \
    \                           - desiredObj: the object represents the configuration\
    \ to be applied\n                                to the member cluster.\n\n  \
    \                        The returned value should be expressed by a slice of\
    \ DependentObjectReference.\n                        type: string\n          \
    \          required:\n                    - luaScript\n                    type:\
    \ object\n                  healthInterpretation:\n                    description:\
    \ |-\n                      HealthInterpretation describes the health assessment\
    \ rules by which Karmada\n                      can assess the health state of\
    \ the resource type.\n                    properties:\n                      luaScript:\n\
    \                        description: |-\n                          LuaScript\
    \ holds the Lua script that is used to assess the health state of\n          \
    \                a specific resource.\n                          The script should\
    \ implement a function as follows:\n\n                          ```\n        \
    \                    luaScript: >\n                                function InterpretHealth(observedObj)\n\
    \                                    if observedObj.status.readyReplicas == observedObj.spec.replicas\
    \ then\n                                        return true\n                \
    \                    end\n                                end\n              \
    \            ```\n\n                          The content of the LuaScript needs\
    \ to be a whole function including both\n                          declaration\
    \ and implementation.\n\n                          The parameters will be supplied\
    \ by the system:\n                            - observedObj: the object represents\
    \ the configuration that is observed\n                                from a specific\
    \ member cluster.\n\n                          The returned boolean value indicates\
    \ the health status.\n                        type: string\n                 \
    \   required:\n                    - luaScript\n                    type: object\n\
    \                  replicaResource:\n                    description: |-\n   \
    \                   ReplicaResource describes the rules for Karmada to discover\
    \ the resource's\n                      replica as well as resource requirements.\n\
    \                      It would be useful for those CRD resources that declare\
    \ workload types like\n                      Deployment.\n                   \
    \   It is usually not needed for Kubernetes native resources(Deployment, Job)\
    \ as\n                      Karmada knows how to discover info from them. But\
    \ if it is set, the built-in\n                      discovery rules will be ignored.\n\
    \                    properties:\n                      luaScript:\n         \
    \               description: |-\n                          LuaScript holds the\
    \ Lua script that is used to discover the resource's\n                       \
    \   replica as well as resource requirements\n\n                          The\
    \ script should implement a function as follows:\n\n                         \
    \ ```\n                            luaScript: >\n                            \
    \    function GetReplicas(desiredObj)\n                                    replica\
    \ = desiredObj.spec.replicas\n                                    requirement\
    \ = {}\n                                    requirement.nodeClaim = {}\n     \
    \                               requirement.nodeClaim.nodeSelector = desiredObj.spec.template.spec.nodeSelector\n\
    \                                    requirement.nodeClaim.tolerations = desiredObj.spec.template.spec.tolerations\n\
    \                                    requirement.resourceRequest = desiredObj.spec.template.spec.containers[1].resources.limits\n\
    \                                    return replica, requirement\n           \
    \                     end\n                          ```\n\n                 \
    \         The content of the LuaScript needs to be a whole function including\
    \ both\n                          declaration and implementation.\n\n        \
    \                  The parameters will be supplied by the system:\n          \
    \                  - desiredObj: the object represents the configuration to be\
    \ applied\n                                to the member cluster.\n\n        \
    \                  The function expects two return values:\n                 \
    \           - replica: the declared replica number\n                         \
    \   - requirement: the resource required by each replica expressed with a\n  \
    \                              ResourceBindingSpec.ReplicaRequirements.\n    \
    \                      The returned values will be set into a ResourceBinding\
    \ or ClusterResourceBinding.\n                        type: string\n         \
    \           required:\n                    - luaScript\n                    type:\
    \ object\n                  replicaRevision:\n                    description:\
    \ |-\n                      ReplicaRevision describes the rules for Karmada to\
    \ revise the resource's replica.\n                      It would be useful for\
    \ those CRD resources that declare workload types like\n                     \
    \ Deployment.\n                      It is usually not needed for Kubernetes native\
    \ resources(Deployment, Job) as\n                      Karmada knows how to revise\
    \ replicas for them. But if it is set, the built-in\n                      revision\
    \ rules will be ignored.\n                    properties:\n                  \
    \    luaScript:\n                        description: |-\n                   \
    \       LuaScript holds the Lua script that is used to revise replicas in the\
    \ desired specification.\n                          The script should implement\
    \ a function as follows:\n\n                          ```\n                  \
    \          luaScript: >\n                                function ReviseReplica(desiredObj,\
    \ desiredReplica)\n                                    desiredObj.spec.replicas\
    \ = desiredReplica\n                                    return desiredObj\n  \
    \                              end\n                          ```\n\n        \
    \                  The content of the LuaScript needs to be a whole function including\
    \ both\n                          declaration and implementation.\n\n        \
    \                  The parameters will be supplied by the system:\n          \
    \                  - desiredObj: the object represents the configuration to be\
    \ applied\n                                to the member cluster.\n          \
    \                  - desiredReplica: the replica number should be applied with.\n\
    \n                          The returned object should be a revised configuration\
    \ which will be\n                          applied to member cluster eventually.\n\
    \                        type: string\n                    required:\n       \
    \             - luaScript\n                    type: object\n                \
    \  retention:\n                    description: |-\n                      Retention\
    \ describes the desired behavior that Karmada should react on\n              \
    \        the changes made by member cluster components. This avoids system\n \
    \                     running into a meaningless loop that Karmada resource controller\
    \ and\n                      the member cluster component continually applying\
    \ opposite values of a field.\n                      For example, the \"replicas\"\
    \ of Deployment might be changed by the HPA\n                      controller\
    \ on member cluster. In this case, Karmada should retain the \"replicas\"\n  \
    \                    and not try to change it.\n                    properties:\n\
    \                      luaScript:\n                        description: |-\n \
    \                         LuaScript holds the Lua script that is used to retain\
    \ runtime values\n                          to the desired specification.\n\n\
    \                          The script should implement a function as follows:\n\
    \n                          ```\n                            luaScript: >\n  \
    \                              function Retain(desiredObj, observedObj)\n    \
    \                                desiredObj.spec.fieldFoo = observedObj.spec.fieldFoo\n\
    \                                    return desiredObj\n                     \
    \           end\n                          ```\n\n                          The\
    \ content of the LuaScript needs to be a whole function including both\n     \
    \                     declaration and implementation.\n\n                    \
    \      The parameters will be supplied by the system:\n                      \
    \      - desiredObj: the object represents the configuration to be applied\n \
    \                               to the member cluster.\n                     \
    \       - observedObj: the object represents the configuration that is observed\n\
    \                                from a specific member cluster.\n\n         \
    \                 The returned object should be a retained configuration which\
    \ will be\n                          applied to member cluster eventually.\n \
    \                       type: string\n                    required:\n        \
    \            - luaScript\n                    type: object\n                 \
    \ statusAggregation:\n                    description: |-\n                  \
    \    StatusAggregation describes the rules for Karmada to aggregate status\n \
    \                     collected from member clusters to resource template.\n \
    \                     Karmada provides built-in rules for several standard Kubernetes\
    \ types, see:\n                      https://karmada.io/docs/userguide/globalview/customizing-resource-interpreter/#aggregatestatus\n\
    \                      If StatusAggregation is set, the built-in rules will be\
    \ ignored.\n                    properties:\n                      luaScript:\n\
    \                        description: |-\n                          LuaScript\
    \ holds the Lua script that is used to aggregate decentralized statuses\n    \
    \                      to the desired specification.\n                       \
    \   The script should implement a function as follows:\n\n                   \
    \       ```\n                            luaScript: >\n                      \
    \          function AggregateStatus(desiredObj, statusItems)\n               \
    \                     for i = 1, #statusItems do\n                           \
    \             desiredObj.status.readyReplicas = desiredObj.status.readyReplicas\
    \ + items[i].readyReplicas\n                                    end\n        \
    \                            return desiredObj\n                             \
    \   end\n                          ```\n\n                          The content\
    \ of the LuaScript needs to be a whole function including both\n             \
    \             declaration and implementation.\n\n                          The\
    \ parameters will be supplied by the system:\n                            - desiredObj:\
    \ the object represents a resource template.\n                            - statusItems:\
    \ the slice of status expressed with AggregatedStatusItem.\n\n               \
    \           The returned object should be a whole object with status aggregated.\n\
    \                        type: string\n                    required:\n       \
    \             - luaScript\n                    type: object\n                \
    \  statusReflection:\n                    description: |-\n                  \
    \    StatusReflection describes the rules for Karmada to pick the resource's status.\n\
    \                      Karmada provides built-in rules for several standard Kubernetes\
    \ types, see:\n                      https://karmada.io/docs/userguide/globalview/customizing-resource-interpreter/#interpretstatus\n\
    \                      If StatusReflection is set, the built-in rules will be\
    \ ignored.\n                    properties:\n                      luaScript:\n\
    \                        description: |-\n                          LuaScript\
    \ holds the Lua script that is used to get the status from the observed specification.\n\
    \                          The script should implement a function as follows:\n\
    \n                          ```\n                            luaScript: >\n  \
    \                              function ReflectStatus(observedObj)\n         \
    \                           status = {}\n                                    status.readyReplicas\
    \ = observedObj.status.observedObj\n                                    return\
    \ status\n                                end\n                          ```\n\
    \n                          The content of the LuaScript needs to be a whole function\
    \ including both\n                          declaration and implementation.\n\n\
    \                          The parameters will be supplied by the system:\n  \
    \                          - observedObj: the object represents the configuration\
    \ that is observed\n                                from a specific member cluster.\n\
    \n                          The returned status could be the whole status or part\
    \ of it and will\n                          be set into both Work and ResourceBinding(ClusterResourceBinding).\n\
    \                        type: string\n                    required:\n       \
    \             - luaScript\n                    type: object\n                type:\
    \ object\n              target:\n                description: CustomizationTarget\
    \ represents the resource type that\n                  the customization applies\
    \ to.\n                properties:\n                  apiVersion:\n          \
    \          description: APIVersion represents the API version of the target\n\
    \                      resource.\n                    type: string\n         \
    \         kind:\n                    description: Kind represents the Kind of\
    \ target resources.\n                    type: string\n                required:\n\
    \                - apiVersion\n                - kind\n                type: object\n\
    \            required:\n            - customizations\n            - target\n \
    \           type: object\n        required:\n        - spec\n        type: object\n\
    \    served: true\n    storage: true\n    subresources: {}"
  config.karmada.io_resourceinterpreterwebhookconfigurations.yaml: "---\napiVersion:\
    \ apiextensions.k8s.io/v1\nkind: CustomResourceDefinition\nmetadata:\n  annotations:\n\
    \    controller-gen.kubebuilder.io/version: v0.21.0\n  name: resourceinterpreterwebhookconfigurations.config.karmada.io\n\
    spec:\n  group: config.karmada.io\n  names:\n    categories:\n    - karmada-io\n\
    \    kind: ResourceInterpreterWebhookConfiguration\n    listKind: ResourceInterpreterWebhookConfigurationList\n\
    \    plural: resourceinterpreterwebhookconfigurations\n    singular: resourceinterpreterwebhookconfiguration\n\
    \  scope: Cluster\n  versions:\n  - name: v1alpha1\n    schema:\n      openAPIV3Schema:\n\
    \        description: |-\n          ResourceInterpreterWebhookConfiguration describes\
    \ the configuration of webhooks which take the responsibility to\n          tell\
    \ karmada the details of the resource object, especially for custom resources.\n\
    \        properties:\n          apiVersion:\n            description: |-\n   \
    \           APIVersion defines the versioned schema of this representation of\
    \ an object.\n              Servers should convert recognized schemas to the latest\
    \ internal value, and\n              may reject unrecognized values.\n       \
    \       More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources\n\
    \            type: string\n          kind:\n            description: |-\n    \
    \          Kind is a string value representing the REST resource this object represents.\n\
    \              Servers may infer this from the endpoint the client submits requests\
    \ to.\n              Cannot be updated.\n              In CamelCase.\n       \
    \       More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds\n\
    \            type: string\n          metadata:\n            type: object\n   \
    \       webhooks:\n            description: Webhooks is a list of webhooks and\
    \ the affected resources\n              and operations.\n            items:\n\
    \              description: ResourceInterpreterWebhook describes the webhook as\
    \ well\n                as the resources and operations it applies to.\n     \
    \         properties:\n                clientConfig:\n                  description:\
    \ |-\n                    ClientConfig defines how to communicate with the hook.\n\
    \                    It supports two mutually exclusive configuration modes:\n\
    \n                    1. URL - Directly specify the webhook URL with format `scheme://host:port/path`.\n\
    \                       Example: https://webhook.example.com:8443/my-interpreter\n\
    \n                    2. Service - Reference a Kubernetes Service that exposes\
    \ the webhook.\n                       When using Service reference, Karmada resolves\
    \ the endpoint through following steps:\n                       a) First attempts\
    \ to locate the Service in karmada-apiserver\n                       b) If found,\
    \ constructs URL based on Service type:\n                          - ClusterIP/LoadBalancer/NodePort:\
    \ Uses ClusterIP with port from Service spec\n                            (Note:\
    \ Services with ClusterIP \"None\" are rejected), Example:\n                 \
    \           `https://<cluster ip>:<port>`\n                          - ExternalName:\
    \ Uses external DNS name format: `https://<external name>:<port>`\n          \
    \             c) If NOT found in karmada-apiserver, falls back to standard Kubernetes\n\
    \                          service DNS name format: `https://<service>.<namespace>.svc:<port>`\n\
    \n                    Note: When both URL and Service are specified, the Service\
    \ reference takes precedence\n                          and the URL configuration\
    \ will be ignored.\n                  properties:\n                    caBundle:\n\
    \                      description: |-\n                        caBundle is a\
    \ PEM encoded CA bundle which will be used to validate the webhook's server certificate.\n\
    \                        If unspecified, system trust roots on the apiserver are\
    \ used.\n                      format: byte\n                      type: string\n\
    \                    service:\n                      description: |-\n       \
    \                 service is a reference to the service for this webhook. Either\n\
    \                        `service` or `url` must be specified.\n\n           \
    \             If the webhook is running within the cluster, then you should use\
    \ `service`.\n                      properties:\n                        name:\n\
    \                          description: |-\n                            name is\
    \ the name of the service.\n                            Required\n           \
    \               type: string\n                        namespace:\n           \
    \               description: |-\n                            namespace is the\
    \ namespace of the service.\n                            Required\n          \
    \                type: string\n                        path:\n               \
    \           description: |-\n                            path is an optional URL\
    \ path which will be sent in any request to\n                            this\
    \ service.\n                          type: string\n                        port:\n\
    \                          description: |-\n                            port is\
    \ the port on the service that hosts the webhook.\n                          \
    \  Default to 443 for backward compatibility.\n                            `port`\
    \ should be a valid port number (1-65535, inclusive).\n                      \
    \    format: int32\n                          type: integer\n                \
    \      required:\n                      - name\n                      - namespace\n\
    \                      type: object\n                    url:\n              \
    \        description: |-\n                        url gives the location of the\
    \ webhook, in standard URL form\n                        (`scheme://host:port/path`).\
    \ Exactly one of `url` or `service`\n                        must be specified.\n\
    \n                        The `host` should not refer to a service running in\
    \ the cluster; use\n                        the `service` field instead. The host\
    \ might be resolved via external\n                        DNS in some apiservers\
    \ (e.g., `kube-apiserver` cannot resolve\n                        in-cluster DNS\
    \ as that would be a layering violation). `host` may\n                       \
    \ also be an IP address.\n\n                        Please note that using `localhost`\
    \ or `127.0.0.1` as a `host` is\n                        risky unless you take\
    \ great care to run this webhook on all hosts\n                        which run\
    \ an apiserver which might need to make calls to this\n                      \
    \  webhook. Such installs are likely to be non-portable, i.e., not easy\n    \
    \                    to turn up in a new cluster.\n\n                        The\
    \ scheme must be \"https\"; the URL must begin with \"https://\".\n\n        \
    \                A path is optional, and if present may be any string permissible\
    \ in\n                        a URL. You may use the path to pass an arbitrary\
    \ string to the\n                        webhook, for example, a cluster identifier.\n\
    \n                        Attempting to use a user or basic auth e.g. \"user:password@\"\
    \ is not\n                        allowed. Fragments (\"#...\") and query parameters\
    \ (\"?...\") are not\n                        allowed, either.\n             \
    \         type: string\n                  type: object\n                interpreterContextVersions:\n\
    \                  description: |-\n                    InterpreterContextVersions\
    \ is an ordered list of preferred `ResourceInterpreterContext`\n             \
    \       versions the Webhook expects. Karmada will try to use first version in\n\
    \                    the list which it supports. If none of the versions specified\
    \ in this list\n                    supported by Karmada, validation will fail\
    \ for this object.\n                    If a persisted webhook configuration specifies\
    \ allowed versions and does not\n                    include any versions known\
    \ to the Karmada, calls to the webhook will fail\n                    and be subject\
    \ to the failure policy.\n                  items:\n                    type:\
    \ string\n                  type: array\n                name:\n             \
    \     description: Name is the full-qualified name of the webhook.\n         \
    \         type: string\n                rules:\n                  description:\
    \ |-\n                    Rules describes what operations on what resources the\
    \ webhook cares about.\n                    The webhook cares about an operation\
    \ if it matches any Rule.\n                  items:\n                    description:\
    \ |-\n                      RuleWithOperations is a tuple of Operations and Resources.\
    \ It is recommended to make\n                      sure that all the tuple expansions\
    \ are valid.\n                    properties:\n                      apiGroups:\n\
    \                        description: |-\n                          APIGroups\
    \ is the API groups the resources belong to. '*' is all groups.\n            \
    \              If '*' is present, the length of the slice must be one.\n     \
    \                     For example:\n                           [\"apps\", \"batch\"\
    , \"example.io\"] means matches 3 groups.\n                           [\"*\"]\
    \ means matches all group\n\n                          Note: The group could be\
    \ empty, e.g the 'core' group of kubernetes, in that case use [\"\"].\n      \
    \                  items:\n                          type: string\n          \
    \              type: array\n                      apiVersions:\n             \
    \           description: |-\n                          APIVersions is the API\
    \ versions the resources belong to. '*' is all versions.\n                   \
    \       If '*' is present, the length of the slice must be one.\n            \
    \              For example:\n                           [\"v1alpha1\", \"v1beta1\"\
    ] means matches 2 versions.\n                           [\"*\"] means matches\
    \ all versions.\n                        items:\n                          type:\
    \ string\n                        type: array\n                      kinds:\n\
    \                        description: |-\n                          Kinds is a\
    \ list of resources this rule applies to.\n                          If '*' is\
    \ present, the length of the slice must be one.\n                          For\
    \ example:\n                           [\"Deployment\", \"Pod\"] means matches\
    \ Deployment and Pod.\n                           [\"*\"] means apply to all resources.\n\
    \                        items:\n                          type: string\n    \
    \                    type: array\n                      operations:\n        \
    \                description: |-\n                          Operations is the\
    \ operations the hook cares about.\n                          If '*' is present,\
    \ the length of the slice must be one.\n                        items:\n     \
    \                     description: InterpreterOperation specifies an operation\n\
    \                            for a request.\n                          type: string\n\
    \                        type: array\n                    required:\n        \
    \            - apiGroups\n                    - apiVersions\n                \
    \    - kinds\n                    - operations\n                    type: object\n\
    \                  type: array\n                timeoutSeconds:\n            \
    \      description: |-\n                    TimeoutSeconds specifies the timeout\
    \ for this webhook. After the timeout passes,\n                    the webhook\
    \ call will be ignored or the API call will fail based on the\n              \
    \      failure policy.\n                    The timeout value must be between\
    \ 1 and 30 seconds.\n                    Default to 10 seconds.\n            \
    \      format: int32\n                  type: integer\n              required:\n\
    \              - clientConfig\n              - interpreterContextVersions\n  \
    \            - name\n              type: object\n            type: array\n   \
    \     required:\n        - webhooks\n        type: object\n    served: true\n\
    \    storage: true"

