    value\". The requirements are ANDed.\n                        type: object\n \
    \                   type: object\n                    x-kubernetes-map-type: atomic\n\
    \                type: object\n            required:\n            - taints\n \
    \           type: object\n        required:\n        - spec\n        type: object\n\
    \    served: true\n    storage: true"
  policy.karmada.io_federatedresourcequotas.yaml: "---\napiVersion: apiextensions.k8s.io/v1\n\
    kind: CustomResourceDefinition\nmetadata:\n  annotations:\n    controller-gen.kubebuilder.io/version:\
    \ v0.21.0\n  name: federatedresourcequotas.policy.karmada.io\nspec:\n  group:\
    \ policy.karmada.io\n  names:\n    categories:\n    - karmada-io\n    kind: FederatedResourceQuota\n\
    \    listKind: FederatedResourceQuotaList\n    plural: federatedresourcequotas\n\
    \    singular: federatedresourcequota\n  scope: Namespaced\n  versions:\n  - additionalPrinterColumns:\n\
    \    - jsonPath: .status.overall\n      name: OVERALL\n      type: string\n  \
    \  - jsonPath: .status.overallUsed\n      name: OVERALL_USED\n      type: string\n\
    \    name: v1alpha1\n    schema:\n      openAPIV3Schema:\n        description:\
    \ FederatedResourceQuota sets aggregate quota restrictions enforced\n        \
    \  per namespace across all clusters.\n        properties:\n          apiVersion:\n\
    \            description: |-\n              APIVersion defines the versioned schema\
    \ of this representation of an object.\n              Servers should convert recognized\
    \ schemas to the latest internal value, and\n              may reject unrecognized\
    \ values.\n              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources\n\
    \            type: string\n          kind:\n            description: |-\n    \
    \          Kind is a string value representing the REST resource this object represents.\n\
    \              Servers may infer this from the endpoint the client submits requests\
    \ to.\n              Cannot be updated.\n              In CamelCase.\n       \
    \       More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds\n\
    \            type: string\n          metadata:\n            type: object\n   \
    \       spec:\n            description: Spec defines the desired quota.\n    \
    \        properties:\n              overall:\n                additionalProperties:\n\
    \                  anyOf:\n                  - type: integer\n               \
    \   - type: string\n                  pattern: ^(\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\\
    .[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))))?$\n\
    \                  x-kubernetes-int-or-string: true\n                description:\
    \ Overall is the set of desired hard limits for each named\n                 \
    \ resource.\n                type: object\n              staticAssignments:\n\
    \                description: |-\n                  StaticAssignments specifies\
    \ ResourceQuota settings for specific clusters.\n                  If non-empty,\
    \ Karmada will create ResourceQuotas in the corresponding clusters.\n        \
    \          Clusters not listed here or when StaticAssignments is empty will have\
    \ no ResourceQuotas created.\n\n                  This field addresses multi-cluster\
    \ configuration management challenges by allowing centralized\n              \
    \    control over ResourceQuotas across clusters.\n\n                  Note: The\
    \ Karmada scheduler currently does NOT use this configuration for scheduling decisions.\n\
    \                  Future updates may integrate it into the scheduling logic.\n\
    \                items:\n                  description: StaticClusterAssignment\
    \ represents the set of desired\n                    hard limits for a specific\
    \ cluster.\n                  properties:\n                    clusterName:\n\
    \                      description: ClusterName is the name of the cluster the\
    \ limits\n                        enforce to.\n                      type: string\n\
    \                    hard:\n                      additionalProperties:\n    \
    \                    anyOf:\n                        - type: integer\n       \
    \                 - type: string\n                        pattern: ^(\\+|-)?(([0-9]+(\\\
    .[0-9]*)?)|(\\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\\
    .[0-9]+))))?$\n                        x-kubernetes-int-or-string: true\n    \
    \                  description: Hard is the set of desired hard limits for each\n\
    \                        named resource.\n                      type: object\n\
    \                  required:\n                  - clusterName\n              \
    \    - hard\n                  type: object\n                type: array\n   \
    \         required:\n            - overall\n            type: object\n       \
    \   status:\n            description: Status defines the actual enforced quota\
    \ and its current\n              usage.\n            properties:\n           \
    \   aggregatedStatus:\n                description: AggregatedStatus is the observed\
    \ quota usage of each\n                  cluster.\n                items:\n  \
    \                description: ClusterQuotaStatus represents the set of desired\
    \ limits\n                    and observed usage for a specific cluster.\n   \
    \               properties:\n                    clusterName:\n              \
    \        description: ClusterName is the name of the cluster the limits\n    \
    \                    enforce to.\n                      type: string\n       \
    \             hard:\n                      additionalProperties:\n           \
    \             anyOf:\n                        - type: integer\n              \
    \          - type: string\n                        pattern: ^(\\+|-)?(([0-9]+(\\\
    .[0-9]*)?)|(\\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\\
    .[0-9]+))))?$\n                        x-kubernetes-int-or-string: true\n    \
    \                  description: |-\n                        Hard is the set of\
    \ enforced hard limits for each named resource.\n                        More\
    \ info: https://kubernetes.io/docs/concepts/policy/resource-quotas/\n        \
    \              type: object\n                    used:\n                     \
    \ additionalProperties:\n                        anyOf:\n                    \
    \    - type: integer\n                        - type: string\n               \
    \         pattern: ^(\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\\\
    +|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))))?$\n                        x-kubernetes-int-or-string:\
    \ true\n                      description: Used is the current observed total\
    \ usage of the\n                        resource in the namespace.\n         \
    \             type: object\n                  required:\n                  - clusterName\n\
    \                  type: object\n                type: array\n              overall:\n\
    \                additionalProperties:\n                  anyOf:\n           \
    \       - type: integer\n                  - type: string\n                  pattern:\
    \ ^(\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\\\
    +|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))))?$\n                  x-kubernetes-int-or-string:\
    \ true\n                description: Overall is the set of enforced hard limits\
    \ for each named\n                  resource.\n                type: object\n\
    \              overallUsed:\n                additionalProperties:\n         \
    \         anyOf:\n                  - type: integer\n                  - type:\
    \ string\n                  pattern: ^(\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\\\
    +|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))))?$\n                  x-kubernetes-int-or-string:\
    \ true\n                description: OverallUsed is the current observed total\
    \ usage of the\n                  resource in the namespace.\n               \
    \ type: object\n            type: object\n        required:\n        - spec\n\
    \        type: object\n    served: true\n    storage: true\n    subresources:\n\
    \      status: {}"
  policy.karmada.io_overridepolicies.yaml: "---\napiVersion: apiextensions.k8s.io/v1\n\
    kind: CustomResourceDefinition\nmetadata:\n  annotations:\n    controller-gen.kubebuilder.io/version:\
    \ v0.21.0\n  name: overridepolicies.policy.karmada.io\nspec:\n  group: policy.karmada.io\n\
    \  names:\n    categories:\n    - karmada-io\n    kind: OverridePolicy\n    listKind:\
    \ OverridePolicyList\n    plural: overridepolicies\n    shortNames:\n    - op\n\
    \    singular: overridepolicy\n  scope: Namespaced\n  versions:\n  - name: v1alpha1\n\
    \    schema:\n      openAPIV3Schema:\n        description: OverridePolicy represents\
    \ the policy that overrides a group of\n          resources to one or more clusters.\n\
    \        properties:\n          apiVersion:\n            description: |-\n   \
    \           APIVersion defines the versioned schema of this representation of\
    \ an object.\n              Servers should convert recognized schemas to the latest\
    \ internal value, and\n              may reject unrecognized values.\n       \
    \       More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources\n\
    \            type: string\n          kind:\n            description: |-\n    \
    \          Kind is a string value representing the REST resource this object represents.\n\
    \              Servers may infer this from the endpoint the client submits requests\
    \ to.\n              Cannot be updated.\n              In CamelCase.\n       \
    \       More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds\n\
    \            type: string\n          metadata:\n            type: object\n   \
    \       spec:\n            description: Spec represents the desired behavior of\
    \ OverridePolicy.\n            properties:\n              overrideRules:\n   \
    \             description: OverrideRules defines a collection of override rules\n\
    \                  on target clusters.\n                items:\n             \
    \     description: RuleWithCluster defines the override rules on clusters.\n \
    \                 properties:\n                    overriders:\n             \
    \         description: Overriders represents the override rules that would\n \
    \                       apply on resources\n                      properties:\n\
    \                        annotationsOverrider:\n                          description:\
    \ AnnotationsOverrider represents the rules dedicated\n                      \
    \      to handling workload annotations\n                          items:\n  \
    \                          description: LabelAnnotationOverrider represents the\
    \ rules\n                              dedicated to handling workload labels/annotations\n\
    \                            properties:\n                              operator:\n\
    \                                description: Operator represents the operator\
    \ which\n                                  will apply on the workload.\n     \
    \                           enum:\n                                - add\n   \
    \                             - remove\n                                - replace\n\
    \                                type: string\n                              value:\n\
    \                                additionalProperties:\n                     \
    \             type: string\n                                description: |-\n\
    \                                  Value to be applied to annotations/labels of\
    \ workload.\n                                  Items in Value which will be appended\
    \ after annotations/labels when Operator is 'add'.\n                         \
    \         Items in Value which match in annotations/labels will be deleted when\
    \ Operator is 'remove'.\n                                  Items in Value which\
    \ match in annotations/labels will be replaced when Operator is 'replace'.\n \
    \                               type: object\n                            required:\n\
    \                            - operator\n                            - value\n\
    \                            type: object\n                          type: array\n\
    \                        argsOverrider:\n                          description:\
    \ ArgsOverrider represents the rules dedicated\n                            to\
    \ handling container args\n                          items:\n                \
    \            description: CommandArgsOverrider represents the rules\n        \
    \                      dedicated to handling command/args overrides.\n       \
    \                     properties:\n                              containerName:\n\
    \                                description: The name of container\n        \
    \                        type: string\n                              operator:\n\
    \                                description: Operator represents the operator\
    \ which\n                                  will apply on the command/args.\n \
    \                               enum:\n                                - add\n\
    \                                - remove\n                                type:\
    \ string\n                              value:\n                             \
    \   description: |-\n                                  Value to be applied to\
    \ command/args.\n                                  Items in Value which will be\
    \ appended after command/args when Operator is 'add'.\n                      \
    \            Items in Value which match in command/args will be deleted when Operator\
    \ is 'remove'.\n                                  If Value is empty, then the\
    \ command/args will remain the same.\n                                items:\n\
    \                                  type: string\n                            \
    \    type: array\n                            required:\n                    \
    \        - containerName\n                            - operator\n           \
    \                 type: object\n                          type: array\n      \
    \                  commandOverrider:\n                          description: CommandOverrider\
    \ represents the rules dedicated\n                            to handling container\
    \ command\n                          items:\n                            description:\
    \ CommandArgsOverrider represents the rules\n                              dedicated\
    \ to handling command/args overrides.\n                            properties:\n\
    \                              containerName:\n                              \
    \  description: The name of container\n                                type: string\n\
    \                              operator:\n                                description:\
    \ Operator represents the operator which\n                                  will\
    \ apply on the command/args.\n                                enum:\n        \
    \                        - add\n                                - remove\n   \
    \                             type: string\n                              value:\n\
    \                                description: |-\n                           \
    \       Value to be applied to command/args.\n                               \
    \   Items in Value which will be appended after command/args when Operator is\
    \ 'add'.\n                                  Items in Value which match in command/args\
    \ will be deleted when Operator is 'remove'.\n                               \
    \   If Value is empty, then the command/args will remain the same.\n         \
    \                       items:\n                                  type: string\n\
    \                                type: array\n                            required:\n\
    \                            - containerName\n                            - operator\n\
    \                            type: object\n                          type: array\n\
    \                        fieldOverrider:\n                          description:\
    \ |-\n                            FieldOverrider represents the rules dedicated\
    \ to modifying a specific field in any Kubernetes resource.\n                \
    \            This allows changing a single field within the resource with multiple\
    \ operations.\n                            It is designed to handle structured\
    \ field values such as those found in ConfigMaps or Secrets.\n               \
    \             The current implementation supports JSON and YAML formats, but can\
    \ easily be extended to support XML in the future.\n                         \
    \ items:\n                            description: |-\n                      \
    \        FieldOverrider represents the rules dedicated to modifying a specific\
    \ field in any Kubernetes resource.\n                              This allows\
    \ changing a single field within the resource with multiple operations.\n    \
    \                          It is designed to handle structured field values such\
    \ as those found in ConfigMaps or Secrets.\n                              The\
    \ current implementation supports JSON and YAML formats, but can easily be extended\
    \ to support XML in the future.\n                              Note: In any given\
    \ instance, FieldOverrider processes either JSON or YAML fields, but not both\
    \ simultaneously.\n                            properties:\n                 \
    \             fieldPath:\n                                description: |-\n  \
    \                                FieldPath specifies the initial location in the\
    \ instance document where the operation should take place.\n                 \
    \                 The path uses RFC 6901 for navigating into nested structures.\
    \ For example, the path \"/data/db-config.yaml\"\n                           \
    \       specifies the configuration data key named \"db-config.yaml\" in a ConfigMap:\
    \ \"/data/db-config.yaml\".\n                                type: string\n  \
    \                            json:\n                                description:\
    \ JSON represents the operations performed\n                                 \
    \ on the JSON document specified by the FieldPath.\n                         \
    \       items:\n                                  description: JSONPatchOperation\
    \ represents a single\n                                    field modification\
    \ operation for JSON format.\n                                  properties:\n\
    \                                    operator:\n                             \
    \         description: |-\n                                        Operator indicates\
    \ the operation on target field.\n                                        Available\
    \ operators are: \"add\", \"remove\", and \"replace\".\n                     \
    \                 enum:\n                                      - add\n       \
    \                               - remove\n                                   \
    \   - replace\n                                      type: string\n          \
    \                          subPath:\n                                      description:\
    \ |-\n                                        SubPath specifies the relative location\
    \ within the initial FieldPath where the operation should take place.\n      \
    \                                  The path uses RFC 6901 for navigating into\
    \ nested structures.\n                                      type: string\n   \
    \                                 value:\n                                   \
    \   description: |-\n                                        Value is the new\
    \ value to set for the specified field if the operation is \"add\" or \"replace\"\
    .\n                                        For \"remove\" operation, this field\
    \ is ignored.\n                                      x-kubernetes-preserve-unknown-fields:\
    \ true\n                                  required:\n                        \
    \          - operator\n                                  - subPath\n         \
    \                         type: object\n                                type:\
    \ array\n                              yaml:\n                               \
    \ description: YAML represents the operations performed\n                    \
    \              on the YAML document specified by the FieldPath.\n            \
    \                    items:\n                                  description: YAMLPatchOperation\
    \ represents a single\n                                    field modification\
    \ operation for YAML format.\n                                  properties:\n\
    \                                    operator:\n                             \
    \         description: |-\n                                        Operator indicates\
    \ the operation on target field.\n                                        Available\
    \ operators are: \"add\", \"remove\", and \"replace\".\n                     \
    \                 enum:\n                                      - add\n       \
    \                               - remove\n                                   \
    \   - replace\n                                      type: string\n          \
    \                          subPath:\n                                      description:\
    \ |-\n                                        SubPath specifies the relative location\
    \ within the initial FieldPath where the operation should take place.\n      \
    \                                  The path uses RFC 6901 for navigating into\
    \ nested structures.\n                                      type: string\n   \
    \                                 value:\n                                   \
    \   description: |-\n                                        Value is the new\
    \ value to set for the specified field if the operation is \"add\" or \"replace\"\
    .\n                                        For \"remove\" operation, this field\
    \ is ignored.\n                                      x-kubernetes-preserve-unknown-fields:\
    \ true\n                                  required:\n                        \
    \          - operator\n                                  - subPath\n         \
    \                         type: object\n                                type:\
    \ array\n                            required:\n                            -\
    \ fieldPath\n                            type: object\n                      \
    \    type: array\n                        imageOverrider:\n                  \
    \        description: ImageOverrider represents the rules dedicated\n        \
    \                    to handling image overrides.\n                          items:\n\
    \                            description: ImageOverrider represents the rules\
    \ dedicated\n                              to handling image overrides.\n    \
    \                        properties:\n                              component:\n\
    \                                description: |-\n                           \
    \       Component is part of image name.\n                                  Basically\
    \ we presume an image can be made of '[registry/]repository[:tag]'.\n        \
    \                          The registry could be:\n                          \
    \        - registry.k8s.io\n                                  - fictional.registry.example:10443\n\
    \                                  The repository could be:\n                \
    \                  - kube-apiserver\n                                  - fictional/nginx\n\
    \                                  The tag cloud be:\n                       \
    \           - latest\n                                  - v1.19.1\n          \
    \                        - @sha256:dbcc1c35ac38df41fd2f5e4130b32ffdb93ebae8b3dbe638c23575912276fc9c\n\
    \                                enum:\n                                - Registry\n\
    \                                - Repository\n                              \
    \  - Tag\n                                type: string\n                     \
    \         operator:\n                                description: Operator represents\
    \ the operator which\n                                  will apply on the image.\n\
    \                                enum:\n                                - add\n\
    \                                - remove\n                                - replace\n\
    \                                type: string\n                              predicate:\n\
    \                                description: |-\n                           \
    \       Predicate filters images before applying the rule.\n\n               \
    \                   Defaults to nil, in that case, the system will automatically\
    \ detect image fields if the resource type is\n                              \
    \    Pod, ReplicaSet, Deployment, StatefulSet, DaemonSet or Job by following rule:\n\
    \                                    - Pod: /spec/containers/<N>/image\n     \
    \                               - ReplicaSet: /spec/template/spec/containers/<N>/image\n\
    \                                    - Deployment: /spec/template/spec/containers/<N>/image\n\
    \                                    - DaemonSet: /spec/template/spec/containers/<N>/image\n\
    \                                    - StatefulSet: /spec/template/spec/containers/<N>/image\n\
    \                                    - Job: /spec/template/spec/containers/<N>/image\n\
    \                                  In addition, all images will be processed if\
    \ the resource object has more than one container.\n\n                       \
    \           If not nil, only images matches the filters will be processed.\n \
    \                               properties:\n                                \
    \  path:\n                                    description: Path indicates the\
    \ path of target\n                                      field\n              \
    \                      type: string\n                                required:\n\
    \                                - path\n                                type:\
    \ object\n                              value:\n                             \
    \   description: |-\n                                  Value to be applied to\
    \ image.\n                                  Must not be empty when operator is\
    \ 'add' or 'replace'.\n                                  Defaults to empty and\
    \ ignored when operator is 'remove'.\n                                type: string\n\
    \                            required:\n                            - component\n\
    \                            - operator\n                            type: object\n\
    \                          type: array\n                        labelsOverrider:\n\
    \                          description: LabelsOverrider represents the rules dedicated\n\
    \                            to handling workload labels\n                   \
    \       items:\n                            description: LabelAnnotationOverrider\
    \ represents the rules\n                              dedicated to handling workload\
    \ labels/annotations\n                            properties:\n              \
    \                operator:\n                                description: Operator\
    \ represents the operator which\n                                  will apply\
    \ on the workload.\n                                enum:\n                  \
    \              - add\n                                - remove\n             \
    \                   - replace\n                                type: string\n\
    \                              value:\n                                additionalProperties:\n\
    \                                  type: string\n                            \
    \    description: |-\n                                  Value to be applied to\
    \ annotations/labels of workload.\n                                  Items in\
    \ Value which will be appended after annotations/labels when Operator is 'add'.\n\
    \                                  Items in Value which match in annotations/labels\
    \ will be deleted when Operator is 'remove'.\n                               \
    \   Items in Value which match in annotations/labels will be replaced when Operator\
    \ is 'replace'.\n                                type: object\n              \
    \              required:\n                            - operator\n           \
    \                 - value\n                            type: object\n        \
    \                  type: array\n                        plaintext:\n         \
    \                 description: Plaintext represents override rules defined\n \
    \                           with plaintext overriders.\n                     \
    \     items:\n                            description: |-\n                  \
    \            PlaintextOverrider is a simple overrider that overrides target fields\n\
    \                              according to path, operator and value.\n      \
    \                      properties:\n                              operator:\n\
    \                                description: |-\n                           \
    \       Operator indicates the operation on target field.\n                  \
    \                Available operators are: add, replace and remove.\n         \
    \                       enum:\n                                - add\n       \
    \                         - remove\n                                - replace\n\
    \                                type: string\n                              path:\n\
    \                                description: Path indicates the path of target\
    \ field\n                                type: string\n                      \
    \        value:\n                                description: |-\n           \
    \                       Value to be applied to target field.\n               \
    \                   Must be empty when operator is Remove.\n                 \
    \               x-kubernetes-preserve-unknown-fields: true\n                 \
    \           required:\n                            - operator\n              \
    \              - path\n                            type: object\n            \
    \              type: array\n                      type: object\n             \
    \       targetCluster:\n                      description: |-\n              \
    \          TargetCluster defines restrictions on this override policy\n      \
    \                  that only applies to resources propagated to the matching clusters.\n\
    \                        nil means matching all clusters.\n                  \
    \    properties:\n                        clusterNames:\n                    \
    \      description: ClusterNames is the list of clusters to be\n             \
    \               selected.\n                          items:\n                \
    \            type: string\n                          type: array\n           \
    \             exclude:\n                          description: ExcludedClusters\
    \ is the list of clusters to\n                            be ignored.\n      \
    \                    items:\n                            type: string\n      \
    \                    type: array\n                        fieldSelector:\n   \
    \                       description: |-\n                            FieldSelector\
    \ is a filter to select member clusters by fields.\n                         \
    \   The key(field) of the match expression should be 'provider', 'region', or\
    \ 'zone',\n                            and the operator of the match expression\
    \ should be 'In' or 'NotIn'.\n                            If non-nil and non-empty,\
    \ only the clusters match this filter will be selected.\n                    \
    \      properties:\n                            matchExpressions:\n          \
    \                    description: A list of field selector requirements.\n   \
    \                           items:\n                                description:\
    \ |-\n                                  A node selector requirement is a selector\
    \ that contains values, a key, and an operator\n                             \
    \     that relates the key and values.\n                                properties:\n\
    \                                  key:\n                                    description:\
    \ The label key that the selector applies\n                                  \
    \    to.\n                                    type: string\n                 \
    \                 operator:\n                                    description:\
    \ |-\n                                      Represents a key's relationship to\
    \ a set of values.\n                                      Valid operators are\
    \ In, NotIn, Exists, DoesNotExist. Gt, and Lt.\n                             \
    \       type: string\n                                  values:\n            \
    \                        description: |-\n                                   \
    \   An array of string values. If the operator is In or NotIn,\n             \
    \                         the values array must be non-empty. If the operator\
    \ is Exists or DoesNotExist,\n                                      the values\
    \ array must be empty. If the operator is Gt or Lt, the values\n             \
    \                         array must have a single element, which will be interpreted\
    \ as an integer.\n                                      This array is replaced\
    \ during a strategic merge patch.\n                                    items:\n\
    \                                      type: string\n                        \
    \            type: array\n                                    x-kubernetes-list-type:\
    \ atomic\n                                required:\n                        \
    \        - key\n                                - operator\n                 \
    \               type: object\n                              type: array\n    \
    \                      type: object\n                        labelSelector:\n\
    \                          description: |-\n                            LabelSelector\
    \ is a filter to select member clusters by labels.\n                         \
