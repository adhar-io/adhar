    \ by the multi-cluster\n              service implementation's controller.\n \
    \           type: object\n            properties:\n              conditions:\n\
    \                type: array\n                items:\n                  description:\
    \ \"Condition contains details for one aspect of the current\n               \
    \     state of this API Resource. --- This struct is intended for direct\n   \
    \                 use as an array at the field path .status.conditions.  For example,\n\
    \                    type FooStatus struct{     // Represents the observations\
    \ of a\n                    foo's current state.     // Known .status.conditions.type\
    \ are:\n                    \\\"Available\\\", \\\"Progressing\\\", and \\\"Degraded\\\
    \"     // +patchMergeKey=type\n                    \\    // +patchStrategy=merge\
    \     // +listType=map     // +listMapKey=type\n                    \\    Conditions\
    \ []metav1.Condition `json:\\\"conditions,omitempty\\\"\n                    patchStrategy:\\\
    \"merge\\\" patchMergeKey:\\\"type\\\" protobuf:\\\"bytes,1,rep,name=conditions\\\
    \"`\n                    \\n     // other fields }\"\n                  type:\
    \ object\n                  required:\n                  - lastTransitionTime\n\
    \                  - message\n                  - reason\n                  -\
    \ status\n                  - type\n                  properties:\n          \
    \          lastTransitionTime:\n                      description: lastTransitionTime\
    \ is the last time the condition\n                        transitioned from one\
    \ status to another. This should be when\n                        the underlying\
    \ condition changed.  If that is not known, then\n                        using\
    \ the time when the API field changed is acceptable.\n                      type:\
    \ string\n                      format: date-time\n                    message:\n\
    \                      description: message is a human readable message indicating\n\
    \                        details about the transition. This may be an empty string.\n\
    \                      type: string\n                      maxLength: 32768\n\
    \                    observedGeneration:\n                      description: observedGeneration\
    \ represents the .metadata.generation\n                        that the condition\
    \ was set based upon. For instance, if .metadata.generation\n                \
    \        is currently 12, but the .status.conditions[x].observedGeneration\n \
    \                       is 9, the condition is out of date with respect to the\
    \ current\n                        state of the instance.\n                  \
    \    type: integer\n                      format: int64\n                    \
    \  minimum: 0\n                    reason:\n                      description:\
    \ reason contains a programmatic identifier indicating\n                     \
    \   the reason for the condition's last transition. Producers\n              \
    \          of specific condition types may define expected values and\n      \
    \                  meanings for this field, and whether the values are considered\n\
    \                        a guaranteed API. The value should be a CamelCase string.\n\
    \                        This field may not be empty.\n                      type:\
    \ string\n                      maxLength: 1024\n                      minLength:\
    \ 1\n                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$\n\
    \                    status:\n                      description: status of the\
    \ condition, one of True, False, Unknown.\n                      type: string\n\
    \                      enum:\n                      - \"True\"\n             \
    \         - \"False\"\n                      - Unknown\n                    type:\n\
    \                      description: type of condition in CamelCase or in foo.example.com/CamelCase.\n\
    \                        --- Many .condition.type values are consistent across\
    \ resources\n                        like Available, but because arbitrary conditions\
    \ can be useful\n                        (see .node.status.conditions), the ability\
    \ to deconflict is\n                        important. The regex it matches is\
    \ (dns1123SubdomainFmt/)?(qualifiedNameFmt)\n                      type: string\n\
    \                      maxLength: 316\n                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\\\
    .[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$\n\
    \                x-kubernetes-list-map-keys:\n                - type\n       \
    \         x-kubernetes-list-type: map"
