    \      description: Name of target cluster.\n                      type: string\n\
    \                    replicas:\n                      description: Replicas in\
    \ target cluster\n                      format: int32\n                      type:\
    \ integer\n                  required:\n                  - name\n           \
    \       type: object\n                type: array\n              components:\n\
    \                description: |-\n                  Components represents the\
    \ requirements of multiple pod templates of the referencing resource.\n      \
    \            It is designed to support workloads that consist of multiple pod\
