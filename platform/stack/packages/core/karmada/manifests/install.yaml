---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: karmada-aggregated-apiserver
  namespace: adhar-system
  labels:
    app: karmada-aggregated-apiserver
spec:
  selector:
    matchLabels:
      app: karmada-aggregated-apiserver
  replicas: 1
  strategy:
    rollingUpdate:
      maxSurge: 50%
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: karmada-aggregated-apiserver
    spec:
      automountServiceAccountToken: false
      initContainers:
      - name: wait
        image: docker.io/bitnamisecure/kubectl:latest
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - "bash <<'EOF'\nset -ex\n\n# here are three cases:\n# case first installation:\
          \ no `cm/karmada-version` at first, so when you get it, it means `karmada-static-resource-job`\
          \ finished.\n# case restart: already has `cm/karmada-version`, which means\
          \ `karmada-static-resource-job` already finished.\n# case upgrading: already\
          \ has `cm/karmada-version`, but it may be old version, we should wait until\
          \ `.data.karmadaVersion` equal to current `.Values.karmadaImageVersion`.\n\
          while [[ $(kubectl --kubeconfig /etc/kubeconfig get configmap karmada-version\
          \ -n adhar-system -o jsonpath='{.data.karmadaVersion}') != v1.19.0 ]]; do\n\
          \  echo \"wait for karmada-static-resource-job finished\"; sleep 2\ndone\n\
          \necho \"karmada-static-resource-job successfully completed since expected\
          \ configmap value was found\"\nEOF\n"
        volumeMounts:
        - name: kubeconfig-secret
          subPath: kubeconfig
          mountPath: /etc/kubeconfig
      containers:
      - name: karmada-aggregated-apiserver
        image: docker.io/karmada/karmada-aggregated-apiserver:v1.19.0
        imagePullPolicy: IfNotPresent
        volumeMounts:
        - name: kubeconfig-secret
          subPath: kubeconfig
          mountPath: /etc/kubeconfig
        - name: etcd-cert
          mountPath: /etc/etcd/pki
          readOnly: true
        - name: apiserver-cert
          mountPath: /etc/kubernetes/pki
          readOnly: true
        env:
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        command:
        - /bin/karmada-aggregated-apiserver
        - --kubeconfig=/etc/kubeconfig
        - --authentication-kubeconfig=/etc/kubeconfig
        - --authorization-kubeconfig=/etc/kubeconfig
        - --etcd-cafile=/etc/etcd/pki/server-ca.crt
        - --etcd-certfile=/etc/etcd/pki/karmada.crt
        - --etcd-keyfile=/etc/etcd/pki/karmada.key
        - --etcd-servers=https://etcd-client.adhar-system.svc.cluster.local:2379
        - --tls-cert-file=/etc/kubernetes/pki/karmada.crt
        - --tls-private-key-file=/etc/kubernetes/pki/karmada.key
        - --audit-log-path=-
        - --audit-log-maxage=0
        - --audit-log-maxbackup=0
        - --tls-min-version=VersionTLS13
        - --v=2
        - --bind-address=$(POD_IP)
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 50m
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: /readyz
            port: 443
            scheme: HTTPS
          initialDelaySeconds: 1
          periodSeconds: 3
          timeoutSeconds: 15
        livenessProbe:
          httpGet:
            path: /healthz
            port: 443
            scheme: HTTPS
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 15
      priorityClassName: system-node-critical
      volumes:
      - name: kubeconfig-secret
        secret:
          secretName: karmada-kubeconfig
      - name: apiserver-cert
        secret:
          secretName: karmada-cert
      - name: etcd-cert
        secret:
          secretName: karmada-cert

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: karmada-apiserver
  namespace: adhar-system
  labels:
    app: karmada-apiserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: karmada-apiserver
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: karmada-apiserver
    spec:
      automountServiceAccountToken: false
      initContainers:
      - name: wait
        image: docker.io/cfssl/cfssl:latest
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - "bash <<'EOF'\nset -ex\nwhile true; do\n  ETCD_ENDPOINT=${ETCD_CLIENT_SERVICE_HOST}\"\
          :\"${ETCD_CLIENT_SERVICE_PORT}\n\n  # check etcd connectivity by executing\
          \ curl.\n  # if etcd is ready, the response of curl would be `curl: (52)\
          \ Empty reply from server`, with return code 52.\n  # if not, the response\
          \ of curl would be like `curl: (7) Failed to connect to .....`, with other\
          \ return code.\n  if curl --connect-timeout 2 ${ETCD_ENDPOINT} || [ $? -eq\
          \ 52 ]; then\n    break\n  fi\n\n  echo \"failed to connect to \"${ETCD_ENDPOINT}\n\
          \  sleep 2\ndone\necho \"successfully connect to \"${ETCD_ENDPOINT}\nEOF\n"
      containers:
      - name: karmada-apiserver
        image: registry.k8s.io/kube-apiserver:v1.36.2
        imagePullPolicy: IfNotPresent
        command:
        - kube-apiserver
        - --allow-privileged=true
        - --authorization-mode=Node,RBAC
        - --client-ca-file=/etc/kubernetes/pki/server-ca.crt
        - --disable-admission-plugins=StorageObjectInUseProtection,ServiceAccount
        - --enable-bootstrap-token-auth=true
        - --etcd-cafile=/etc/etcd/pki/server-ca.crt
        - --etcd-certfile=/etc/etcd/pki/karmada.crt
        - --etcd-keyfile=/etc/etcd/pki/karmada.key
        - --etcd-servers=https://etcd-client.adhar-system.svc.cluster.local:2379
        - --bind-address=0.0.0.0
        - --runtime-config=
        - --secure-port=5443
        - --service-account-issuer=https://kubernetes.default.svc.cluster.local
        - --service-account-key-file=/etc/kubernetes/pki/karmada.key
        - --service-account-signing-key-file=/etc/kubernetes/pki/karmada.key
        - --service-cluster-ip-range=10.96.0.0/12
        - --proxy-client-cert-file=/etc/kubernetes/pki/front-proxy-client.crt
        - --proxy-client-key-file=/etc/kubernetes/pki/front-proxy-client.key
        - --requestheader-allowed-names=front-proxy-client
        - --requestheader-client-ca-file=/etc/kubernetes/pki/front-proxy-ca.crt
        - --requestheader-extra-headers-prefix=X-Remote-Extra-
        - --requestheader-group-headers=X-Remote-Group
        - --requestheader-username-headers=X-Remote-User
        - --tls-cert-file=/etc/kubernetes/pki/karmada.crt
        - --tls-private-key-file=/etc/kubernetes/pki/karmada.key
        - --max-requests-inflight=1500
        - --max-mutating-requests-inflight=500
        - --tls-min-version=VersionTLS13
        - --v=2
        ports:
        - name: http
          containerPort: 5443
          protocol: TCP
        livenessProbe:
          failureThreshold: 8
          httpGet:
            path: /livez
            port: 5443
            scheme: HTTPS
          initialDelaySeconds: 10
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 15
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /readyz
            port: 5443
            scheme: HTTPS
          initialDelaySeconds: 10
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 15
        resources:
          limits:
            cpu: 1000m
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 256Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - name: apiserver-cert
          mountPath: /etc/kubernetes/pki
          readOnly: true
        - name: etcd-cert
          mountPath: /etc/etcd/pki
          readOnly: true
      enableServiceLinks: true
      preemptionPolicy: PreemptLowerPriority
      priority: 2000001000
      restartPolicy: Always
      schedulerName: default-scheduler
      terminationGracePeriodSeconds: 30
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - karmada-apiserver
            topologyKey: kubernetes.io/hostname
      priorityClassName: system-node-critical
      volumes:
      - name: apiserver-cert
        secret:
          secretName: karmada-cert
      - name: etcd-cert
        secret:
          secretName: karmada-cert

