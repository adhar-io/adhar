    \      - operator\n                          type: object\n                  \
    \      type: array\n                        x-kubernetes-list-type: atomic\n \
    \                     matchLabels:\n                        additionalProperties:\n\
    \                          type: string\n                        description:\
    \ |-\n                          matchLabels is a map of {key,value} pairs. A single\
