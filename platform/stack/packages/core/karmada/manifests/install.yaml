    \    plural: clustertaintpolicies\n    singular: clustertaintpolicy\n  scope:\
    \ Cluster\n  versions:\n  - name: v1alpha1\n    schema:\n      openAPIV3Schema:\n\
    \        description: |-\n          ClusterTaintPolicy automates taint management\
    \ on Cluster objects based\n          on declarative conditions.\n          The\
    \ system evaluates AddOnConditions to determine when to add taints,\n        \
    \  and RemoveOnConditions to determine when to remove taints.\n          AddOnConditions\
