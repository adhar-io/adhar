    \                   Note: true means stop propagating to all clusters. Can not\
    \ co-exist\n                      with DispatchingOnClusters which is used to\
    \ suspend particular clusters.\n                    type: boolean\n          \
    \        dispatchingOnClusters:\n                    description: |-\n       \
    \               DispatchingOnClusters declares a list of clusters to which the\
    \ dispatching\n                      should be suspended.\n                  \
    \    Note: Can not co-exist with Dispatching which is used to suspend all.\n \
    \                   properties:\n                      clusterNames:\n       \
    \                 description: ClusterNames is the list of clusters to be selected.\n\
    \                        items:\n                          type: string\n    \
    \                    type: array\n                    type: object\n         \
    \       type: object\n            required:\n            - resourceSelectors\n\
    \            type: object\n        required:\n        - spec\n        type: object\n\
    \    served: true\n    storage: true\n    subresources: {}"

