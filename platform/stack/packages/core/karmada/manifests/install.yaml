apiVersion: batch/v1
kind: Job
metadata:
  name: karmada-post-delete
  namespace: adhar-system
  labels:
    helm.sh/chart: karmada-v1.19.0
  annotations:
    helm.sh/hook: post-delete
    helm.sh/hook-weight: '0'
    helm.sh/hook-delete-policy: hook-succeeded
    argocd.argoproj.io/hook: PostDelete
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  parallelism: 1
  completions: 1
  template:
    metadata:
      name: karmada
      labels:
        helm.sh/chart: karmada-v1.19.0
    spec:
      serviceAccountName: karmada-hook-job
      restartPolicy: Never
      containers:
      - name: post-delete
        image: docker.io/bitnamisecure/kubectl:latest
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - 'bash <<''EOF''

          set -ex

          kubectl delete -f /opt/mount/ --ignore-not-found=true

          kubectl delete -f /opt/crds/ --ignore-not-found=true -R

          kubectl delete -f /opt/static-resources/ --ignore-not-found=true -R

          kubectl delete cm/karmada-config -n adhar-system --ignore-not-found=true

          kubectl delete deployment/karmada-controller-manager -n adhar-system --ignore-not-found=true

          EOF

          '
        volumeMounts:
        - name: mount
          mountPath: /opt/mount
        - name: crds-autoscaling-base
          mountPath: /opt/crds/base/autoscaling
        - name: crds-config-base
          mountPath: /opt/crds/base/config
        - name: crds-multicluster-base
          mountPath: /opt/crds/base/multicluster
        - name: crds-networking-base
          mountPath: /opt/crds/base/networking
        - name: crds-policy-base
          mountPath: /opt/crds/base/policy
        - name: crds-remedy-base
          mountPath: /opt/crds/base/remedy
        - name: crds-work-base
          mountPath: /opt/crds/base/work
        - name: static-resources
          mountPath: /opt/static-resources
      volumes:
      - name: mount
        configMap:
          name: karmada-config
      - name: crds-autoscaling-base
        configMap:
          name: karmada-crds-autoscaling-bases
      - name: crds-config-base
        configMap:
          name: karmada-crds-config-bases
      - name: crds-multicluster-base
        configMap:
          name: karmada-crds-multicluster-bases
      - name: crds-networking-base
        configMap:
          name: karmada-crds-networking-bases
      - name: crds-policy-base
        configMap:
          name: karmada-crds-policy-bases
      - name: crds-remedy-base
        configMap:
          name: karmada-crds-remedy-bases
      - name: crds-work-base
        configMap:
          name: karmada-crds-work-bases
      - name: crds-apps-base
        configMap:
          name: karmada-crds-apps-bases
      - name: static-resources
        configMap:
          name: karmada-static-resources

---
apiVersion: batch/v1
kind: Job
metadata:
  name: karmada-pre-install
  namespace: adhar-system
  annotations:
    helm.sh/hook: pre-install
    helm.sh/hook-weight: '3'
    helm.sh/hook-delete-policy: hook-succeeded
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  labels: null
spec:
  parallelism: 1
  completions: 1
  template:
    metadata:
      name: karmada
      labels:
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/instance: karmada
        helm.sh/chart: karmada-v1.19.0
    spec:
      serviceAccountName: karmada-hook-job
      restartPolicy: Never
      initContainers:
      - name: init
        image: docker.io/cfssl/cfssl:latest
        imagePullPolicy: IfNotPresent
        workingDir: /opt/mount
        command:
        - /bin/sh
        - -c
        - 'bash <<''EOF''

          set -ex

          mkdir -p /opt/configs

          mkdir -p /opt/certs

          cp -r -L /opt/mount/* /opt/configs/

          openssl req -x509 -sha256 -new -nodes -days 3650 -newkey rsa:3072 -keyout
          "/opt/certs/server-ca.key" -out "/opt/certs/server-ca.crt" -subj "/C=xx/ST=x/L=x/O=x/OU=x/CN=ca/emailAddress=x/"

          openssl req -x509 -sha256 -new -nodes -days 3650 -newkey rsa:3072 -keyout
          "/opt/certs/front-proxy-ca.key" -out "/opt/certs/front-proxy-ca.crt" -subj
          "/C=xx/ST=x/L=x/O=x/OU=x/CN=ca/emailAddress=x/"

          echo ''{"signing":{"default":{"expiry":"43800h","usages":["signing","key
          encipherment","client auth","server auth"]}}}'' > "/opt/certs/server-ca-config.json"

          echo ''{"CN":"system:admin","hosts":["karmada.adhar-system.svc.cluster.local","karmada.adhar-system.svc","*.adhar-system.svc.cluster.local","*.adhar-system.svc","localhost","127.0.0.1"],"names":[{"O":"system:masters"}],"key":{"algo":"rsa","size":3072}}''
          | cfssl gencert -ca=/opt/certs/server-ca.crt -ca-key=/opt/certs/server-ca.key
          -config=/opt/certs/server-ca-config.json - | cfssljson -bare /opt/certs/karmada

          echo ''{"signing":{"default":{"expiry":"43800h","usages":["signing","key
          encipherment","client auth","server auth"]}}}'' > "/opt/certs/front-proxy-ca-config.json"

          echo ''{"CN":"front-proxy-client","hosts":["karmada.adhar-system.svc.cluster.local","karmada.adhar-system.svc","*.adhar-system.svc.cluster.local","*.adhar-system.svc","localhost","127.0.0.1"],"names":[{"O":"system:masters"}],"key":{"algo":"rsa","size":3072}}''
          | cfssl gencert -ca=/opt/certs/front-proxy-ca.crt -ca-key=/opt/certs/front-proxy-ca.key
          -config=/opt/certs/front-proxy-ca-config.json - | cfssljson -bare /opt/certs/front-proxy-client

          karmada_ca=$(base64 /opt/certs/server-ca.crt | tr -d ''\r\n'')

          karmada_ca_key=$(base64 /opt/certs/server-ca.key | tr -d ''\r\n'')

          karmada_crt=$(base64 /opt/certs/karmada.pem | tr -d ''\r\n'')

          karmada_key=$(base64 /opt/certs/karmada-key.pem | tr -d ''\r\n'')

          front_proxy_ca=$(base64 /opt/certs/front-proxy-ca.crt | tr -d ''\r\n'')

          front_proxy_client_crt=$(base64 /opt/certs/front-proxy-client.pem | tr -d
          ''\r\n'')

          front_proxy_client_key=$(base64 /opt/certs/front-proxy-client-key.pem |
          tr -d ''\r\n'')

          sed -i'''' -e "s/{{ ca_crt }}/${karmada_ca}/g" /opt/configs/cert.yaml

          sed -i'''' -e "s/{{ ca_key }}/${karmada_ca_key}/g" /opt/configs/cert.yaml

          sed -i'''' -e "s/{{ crt }}/${karmada_crt}/g" /opt/configs/cert.yaml

          sed -i'''' -e "s/{{ key }}/${karmada_key}/g" /opt/configs/cert.yaml

          sed -i'''' -e "s/{{ front_proxy_ca_crt }}/${front_proxy_ca}/g" /opt/configs/cert.yaml

          sed -i'''' -e "s/{{ front_proxy_crt }}/${front_proxy_client_crt}/g" /opt/configs/cert.yaml

          sed -i'''' -e "s/{{ front_proxy_key }}/${front_proxy_client_key}/g" /opt/configs/cert.yaml

          sed -i'''' -e "s/{{ ca_crt }}/${karmada_ca}/g" /opt/configs/kubeconfig.yaml

          sed -i'''' -e "s/{{ crt }}/${karmada_crt}/g" /opt/configs/kubeconfig.yaml

          sed -i'''' -e "s/{{ key }}/${karmada_key}/g" /opt/configs/kubeconfig.yaml

          sed -i'''' -e "s/{{ crt }}/${karmada_crt}/g" /opt/configs/webhook-cert.yaml

          sed -i'''' -e "s/{{ key }}/${karmada_key}/g" /opt/configs/webhook-cert.yaml

          sed -i'''' -e "s/{{ ca_crt }}/${karmada_ca}/g" /opt/configs/static-resources-configmaps.yaml

          sed -i'''' -e "s/{{ ca_crt }}/${karmada_ca}/g" /opt/configs/crds-patches-configmaps.yaml

          EOF

          '
        volumeMounts:
        - name: mount
          mountPath: /opt/mount
        - name: configs
          mountPath: /opt/configs
      containers:
      - name: pre-install
        image: docker.io/bitnamisecure/kubectl:latest
        imagePullPolicy: IfNotPresent
        workingDir: /opt/mount
        command:
        - /bin/sh
        - -c
        - 'bash <<''EOF''

          set -ex

          kubectl apply --server-side -f /opt/configs/

          EOF

          '
        volumeMounts:
        - name: mount
          mountPath: /opt/mount
        - name: configs
          mountPath: /opt/configs
      volumes:
      - name: mount
        configMap:
          name: karmada-config
      - name: configs
        emptyDir: {}

---
apiVersion: batch/v1
kind: Job
metadata:
  name: karmada-pre-upgrade
  namespace: adhar-system
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: '3'
    helm.sh/hook-delete-policy: hook-succeeded
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  labels: null
spec:
  parallelism: 1
  completions: 1
  template:
    metadata:
      name: karmada-pre-upgrade
      labels:
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/instance: karmada
        helm.sh/chart: karmada-v1.19.0
    spec:
      serviceAccountName: karmada-hook-job
      restartPolicy: Never
      containers:
      - name: pre-upgrade
        image: docker.io/bitnamisecure/kubectl:latest
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - 'set -ex

          # Fetch certs from existing secret

          karmada_ca=$(kubectl get secret karmada-cert -n adhar-system -o jsonpath=''{.data.server-ca\.crt}'')

          kubectl get configmap karmada-static-resources -n adhar-system -o json |
          sed -e "s/{{ ca_crt }}/${karmada_ca}/g" | kubectl apply -f -

          kubectl get configmap karmada-crds-patches -n adhar-system -o json | sed
          -e "s/{{ ca_crt }}/${karmada_ca}/g" | kubectl apply -f -

          '
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
