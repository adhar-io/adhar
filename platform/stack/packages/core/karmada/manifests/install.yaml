data:
  networking.karmada.io_multiclusteringresses.yaml: "---\napiVersion: apiextensions.k8s.io/v1\n\
    kind: CustomResourceDefinition\nmetadata:\n  annotations:\n    controller-gen.kubebuilder.io/version:\
    \ v0.21.0\n  name: multiclusteringresses.networking.karmada.io\nspec:\n  group:\
    \ networking.karmada.io\n  names:\n    categories:\n    - karmada-io\n    kind:\
    \ MultiClusterIngress\n    listKind: MultiClusterIngressList\n    plural: multiclusteringresses\n\
    \    shortNames:\n    - mci\n    singular: multiclusteringress\n  scope: Namespaced\n\
    \  versions:\n  - name: v1alpha1\n    schema:\n      openAPIV3Schema:\n      \
    \  description: |-\n          MultiClusterIngress is a collection of rules that\
    \ allow inbound connections to reach the\n          endpoints defined by a backend.\
    \ The structure of MultiClusterIngress is same as Ingress,\n          indicates\
    \ the Ingress in multi-clusters.\n        properties:\n          apiVersion:\n\
    \            description: |-\n              APIVersion defines the versioned schema\
    \ of this representation of an object.\n              Servers should convert recognized\
    \ schemas to the latest internal value, and\n              may reject unrecognized\
    \ values.\n              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources\n\
    \            type: string\n          kind:\n            description: |-\n    \
    \          Kind is a string value representing the REST resource this object represents.\n\
    \              Servers may infer this from the endpoint the client submits requests\
    \ to.\n              Cannot be updated.\n              In CamelCase.\n       \
    \       More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds\n\
    \            type: string\n          metadata:\n            type: object\n   \
    \       spec:\n            description: Spec is the desired state of the MultiClusterIngress.\n\
    \            properties:\n              defaultBackend:\n                description:\
    \ |-\n                  defaultBackend is the backend that should handle requests\
    \ that don't\n                  match any rule. If Rules are not specified, DefaultBackend\
    \ must be specified.\n                  If DefaultBackend is not set, the handling\
    \ of requests that do not match any\n                  of the rules will be up\
    \ to the Ingress controller.\n                properties:\n                  resource:\n\
    \                    description: |-\n                      resource is an ObjectRef\
    \ to another Kubernetes resource in the namespace\n                      of the\
    \ Ingress object. If resource is specified, a service.Name and\n             \
    \         service.Port must not be specified.\n                      This is a\
    \ mutually exclusive setting with \"Service\".\n                    properties:\n\
    \                      apiGroup:\n                        description: |-\n  \
    \                        APIGroup is the group for the resource being referenced.\n\
    \                          If APIGroup is not specified, the specified Kind must\
    \ be in the core API group.\n                          For any other third-party\
    \ types, APIGroup is required.\n                        type: string\n       \
    \               kind:\n                        description: Kind is the type of\
    \ resource being referenced\n                        type: string\n          \
    \            name:\n                        description: Name is the name of resource\
    \ being referenced\n                        type: string\n                   \
    \ required:\n                    - kind\n                    - name\n        \
    \            type: object\n                    x-kubernetes-map-type: atomic\n\
    \                  service:\n                    description: |-\n           \
    \           service references a service as a backend.\n                     \
    \ This is a mutually exclusive setting with \"Resource\".\n                  \
    \  properties:\n                      name:\n                        description:\
    \ |-\n                          name is the referenced service. The service must\
    \ exist in\n                          the same namespace as the Ingress object.\n\
    \                        type: string\n                      port:\n         \
    \               description: |-\n                          port of the referenced\
    \ service. A port name or port number\n                          is required for\
    \ a IngressServiceBackend.\n                        properties:\n            \
    \              name:\n                            description: |-\n          \
    \                    name is the name of the port on the Service.\n          \
    \                    This is a mutually exclusive setting with \"Number\".\n \
    \                           type: string\n                          number:\n\
    \                            description: |-\n                              number\
    \ is the numerical port number (e.g. 80) on the Service.\n                   \
    \           This is a mutually exclusive setting with \"Name\".\n            \
    \                format: int32\n                            type: integer\n  \
    \                      type: object\n                        x-kubernetes-map-type:\
    \ atomic\n                    required:\n                    - name\n        \
    \            type: object\n                type: object\n              ingressClassName:\n\
    \                description: |-\n                  ingressClassName is the name\
    \ of an IngressClass cluster resource. Ingress\n                  controller implementations\
    \ use this field to know whether they should be\n                  serving this\
    \ Ingress resource, by a transitive connection\n                  (controller\
    \ -> IngressClass -> Ingress resource). Although the\n                  `kubernetes.io/ingress.class`\
    \ annotation (simple constant name) was never\n                  formally defined,\
    \ it was widely supported by Ingress controllers to create\n                 \
    \ a direct binding between Ingress controller and Ingress resources. Newly\n \
    \                 created Ingress resources should prefer using the field. However,\
    \ even\n                  though the annotation is officially deprecated, for\
    \ backwards compatibility\n                  reasons, ingress controllers should\
    \ still honor that annotation if present.\n                type: string\n    \
    \          rules:\n                description: |-\n                  rules is\
    \ a list of host rules used to configure the Ingress. If unspecified,\n      \
    \            or no rule matches, all traffic is sent to the default backend.\n\
    \                items:\n                  description: |-\n                 \
    \   IngressRule represents the rules mapping the paths under a specified host\
    \ to\n                    the related backend services. Incoming requests are\
    \ first evaluated for a host\n                    match, then routed to the backend\
    \ associated with the matching IngressRuleValue.\n                  properties:\n\
    \                    host:\n                      description: \"host is the fully\
    \ qualified domain name of a network\n                        host, as defined\
    \ by RFC 3986.\\nNote the following deviations\n                        from the\
    \ \\\"host\\\" part of the\\nURI as defined in RFC 3986:\\n1.\n              \
    \          IPs are not allowed. Currently an IngressRuleValue can only\n     \
    \                   apply to\\n   the IP in the Spec of the parent Ingress.\\\
    n2.\n                        The `:` delimiter is not respected because ports\
    \ are not allowed.\\n\\t\n                        \\ Currently the port of an\
    \ Ingress is implicitly :80 for http\n                        and\\n\\t  :443\
    \ for https.\\nBoth these may change in the future.\\nIncoming\n             \
    \           requests are matched against the host before the\\nIngressRuleValue.\n\
    \                        If the host is unspecified, the Ingress routes all\\\
    ntraffic\n                        based on the specified IngressRuleValue.\\n\\\
    nhost can be \\\"precise\\\"\n                        which is a domain name without\
    \ the terminating dot of\\na network\n                        host (e.g. \\\"\
    foo.bar.com\\\") or \\\"wildcard\\\", which is a domain\n                    \
    \    name\\nprefixed with a single wildcard label (e.g. \\\"*.foo.com\\\").\\\
    nThe\n                        wildcard character '*' must appear by itself as\
    \ the first\n                        DNS label and\\nmatches only a single label.\
    \ You cannot have\n                        a wildcard label by itself (e.g. Host\
    \ == \\\"*\\\").\\nRequests\n                        will be matched against the\
    \ Host field in the following way:\\n1.\n                        If host is precise,\
    \ the request matches this rule if the http\n                        host header\
    \ is equal to Host.\\n2. If host is a wildcard, then\n                       \
    \ the request matches this rule if the http host header\\nis\n               \
    \         to equal to the suffix (removing the first label) of the wildcard\n\
    \                        rule.\"\n                      type: string\n       \
    \             http:\n                      description: |-\n                 \
    \       HTTPIngressRuleValue is a list of http selectors pointing to backends.\n\
    \                        In the example: http://<host>/<path>?<searchpart> ->\
    \ backend where\n                        where parts of the url correspond to\
    \ RFC 3986, this resource will be used\n                        to match against\
    \ everything after the last '/' and before the first '?'\n                   \
    \     or '#'.\n                      properties:\n                        paths:\n\
    \                          description: paths is a collection of paths that map\
    \ requests\n                            to backends.\n                       \
    \   items:\n                            description: |-\n                    \
    \          HTTPIngressPath associates a path with a backend. Incoming urls matching\
    \ the\n                              path are forwarded to the backend.\n    \
    \                        properties:\n                              backend:\n\
    \                                description: |-\n                           \
    \       backend defines the referenced service endpoint to which the traffic\n\
    \                                  will be forwarded to.\n                   \
    \             properties:\n                                  resource:\n     \
    \                               description: |-\n                            \
    \          resource is an ObjectRef to another Kubernetes resource in the namespace\n\
    \                                      of the Ingress object. If resource is specified,\
    \ a service.Name and\n                                      service.Port must\
    \ not be specified.\n                                      This is a mutually\
    \ exclusive setting with \"Service\".\n                                    properties:\n\
    \                                      apiGroup:\n                           \
    \             description: |-\n                                          APIGroup\
    \ is the group for the resource being referenced.\n                          \
    \                If APIGroup is not specified, the specified Kind must be in the\
    \ core API group.\n                                          For any other third-party\
    \ types, APIGroup is required.\n                                        type:\
    \ string\n                                      kind:\n                      \
    \                  description: Kind is the type of resource\n               \
    \                           being referenced\n                               \
    \         type: string\n                                      name:\n        \
    \                                description: Name is the name of resource\n \
    \                                         being referenced\n                 \
    \                       type: string\n                                    required:\n\
    \                                    - kind\n                                \
    \    - name\n                                    type: object\n              \
    \                      x-kubernetes-map-type: atomic\n                       \
    \           service:\n                                    description: |-\n  \
    \                                    service references a service as a backend.\n\
    \                                      This is a mutually exclusive setting with\
    \ \"Resource\".\n                                    properties:\n           \
    \                           name:\n                                        description:\
    \ |-\n                                          name is the referenced service.\
    \ The service must exist in\n                                          the same\
    \ namespace as the Ingress object.\n                                        type:\
    \ string\n                                      port:\n                      \
    \                  description: |-\n                                         \
    \ port of the referenced service. A port name or port number\n               \
    \                           is required for a IngressServiceBackend.\n       \
    \                                 properties:\n                              \
    \            name:\n                                            description: |-\n\
    \                                              name is the name of the port on\
    \ the Service.\n                                              This is a mutually\
    \ exclusive setting with \"Number\".\n                                       \
    \     type: string\n                                          number:\n      \
    \                                      description: |-\n                     \
    \                         number is the numerical port number (e.g. 80) on the\
    \ Service.\n                                              This is a mutually exclusive\
    \ setting with \"Name\".\n                                            format:\
    \ int32\n                                            type: integer\n         \
    \                               type: object\n                               \
    \         x-kubernetes-map-type: atomic\n                                    required:\n\
    \                                    - name\n                                \
    \    type: object\n                                type: object\n            \
    \                  path:\n                                description: |-\n  \
    \                                path is matched against the path of an incoming\
    \ request. Currently it can\n                                  contain characters\
    \ disallowed from the conventional \"path\" part of a URL\n                  \
    \                as defined by RFC 3986. Paths must begin with a '/' and must\
    \ be present\n                                  when using PathType with value\
    \ \"Exact\" or \"Prefix\".\n                                type: string\n   \
    \                           pathType:\n                                description:\
    \ |-\n                                  pathType determines the interpretation\
    \ of the path matching. PathType can\n                                  be one\
    \ of the following values:\n                                  * Exact: Matches\
    \ the URL path exactly.\n                                  * Prefix: Matches based\
    \ on a URL path prefix split by '/'. Matching is\n                           \
    \         done on a path element by element basis. A path element refers is the\n\
    \                                    list of labels in the path split by the '/'\
    \ separator. A request is a\n                                    match for path\
    \ p if every p is an element-wise prefix of p of the\n                       \
    \             request path. Note that if the last element of the path is a substring\n\
    \                                    of the last element in request path, it is\
    \ not a match (e.g. /foo/bar\n                                    matches /foo/bar/baz,\
    \ but does not match /foo/barbaz).\n                                  * ImplementationSpecific:\
    \ Interpretation of the Path matching is up to\n                             \
    \       the IngressClass. Implementations can treat this as a separate PathType\n\
    \                                    or treat it identically to Prefix or Exact\
    \ path types.\n                                  Implementations are required\
    \ to support all path types.\n                                type: string\n \
    \                           required:\n                            - backend\n\
    \                            - pathType\n                            type: object\n\
    \                          type: array\n                          x-kubernetes-list-type:\
    \ atomic\n                      required:\n                      - paths\n   \
    \                   type: object\n                  type: object\n           \
    \     type: array\n                x-kubernetes-list-type: atomic\n          \
    \    tls:\n                description: |-\n                  tls represents the\
    \ TLS configuration. Currently the Ingress only supports a\n                 \
    \ single TLS port, 443. If multiple members of this list specify different hosts,\n\
    \                  they will be multiplexed on the same port according to the\
    \ hostname specified\n                  through the SNI TLS extension, if the\
    \ ingress controller fulfilling the\n                  ingress supports SNI.\n\
    \                items:\n                  description: IngressTLS describes the\
    \ transport layer security associated\n                    with an ingress.\n\
    \                  properties:\n                    hosts:\n                 \
    \     description: |-\n                        hosts is a list of hosts included\
    \ in the TLS certificate. The values in\n                        this list must\
    \ match the name/s used in the tlsSecret. Defaults to the\n                  \
    \      wildcard host setting for the loadbalancer controller fulfilling this\n\
    \                        Ingress, if left unspecified.\n                     \
    \ items:\n                        type: string\n                      type: array\n\
    \                      x-kubernetes-list-type: atomic\n                    secretName:\n\
    \                      description: |-\n                        secretName is\
    \ the name of the secret used to terminate TLS traffic on\n                  \
    \      port 443. Field is left optional to allow TLS routing based on SNI\n  \
    \                      hostname alone. If the SNI host in a listener conflicts\
    \ with the \"Host\"\n                        header field used by an IngressRule,\
    \ the SNI host is used for termination\n                        and value of the\
    \ \"Host\" header is used for routing.\n                      type: string\n \
    \                 type: object\n                type: array\n                x-kubernetes-list-type:\
    \ atomic\n            type: object\n          status:\n            description:\
    \ Status is the current state of the MultiClusterIngress.\n            properties:\n\
    \              loadBalancer:\n                description: loadBalancer contains\
    \ the current status of the load-balancer.\n                properties:\n    \
    \              ingress:\n                    description: ingress is a list containing\
    \ ingress points for the\n                      load-balancer.\n             \
    \       items:\n                      description: IngressLoadBalancerIngress\
    \ represents the status\n                        of a load-balancer ingress point.\n\
    \                      properties:\n                        hostname:\n      \
    \                    description: hostname is set for load-balancer ingress points\n\
    \                            that are DNS based.\n                          type:\
    \ string\n                        ip:\n                          description:\
    \ ip is set for load-balancer ingress points\n                            that\
    \ are IP based.\n                          type: string\n                    \
    \    ports:\n                          description: ports provides information\
    \ about the ports\n                            exposed by this LoadBalancer.\n\
    \                          items:\n                            description: IngressPortStatus\
    \ represents the error condition\n                              of a service port\n\
    \                            properties:\n                              error:\n\
    \                                description: |-\n                           \
    \       error is to record the problem with the service port\n               \
    \                   The format of the error shall comply with the following rules:\n\
    \                                  - built-in error values shall be specified\
    \ in this file and those shall use\n                                    CamelCase\
    \ names\n                                  - cloud provider specific error values\
    \ must have names that comply with the\n                                    format\
    \ foo.example.com/CamelCase.\n                                maxLength: 316\n\
    \                                pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$\n\
    \                                type: string\n                              port:\n\
    \                                description: port is the port number of the ingress\n\
    \                                  port.\n                                format:\
    \ int32\n                                type: integer\n                     \
    \         protocol:\n                                description: |-\n       \
    \                           protocol is the protocol of the ingress port.\n  \
    \                                The supported values are: \"TCP\", \"UDP\", \"\
    SCTP\"\n                                type: string\n                       \
    \     required:\n                            - error\n                       \
    \     - port\n                            - protocol\n                       \
    \     type: object\n                          type: array\n                  \
    \        x-kubernetes-list-type: atomic\n                      type: object\n\
    \                    type: array\n                    x-kubernetes-list-type:\
    \ atomic\n                type: object\n              serviceLocations:\n    \
    \            description: |-\n                  ServiceLocations records the locations\
    \ of MulticlusterIngress's backend\n                  Service resources. It will\
    \ be set by the system controller.\n                items:\n                 \
    \ description: ServiceLocation records the locations of MulticlusterIngress's\n\
    \                    backend Service resources.\n                  properties:\n\
    \                    clusters:\n                      description: Clusters records\
    \ the cluster list where the Service\n                        is located.\n  \
    \                    items:\n                        type: string\n          \
    \            type: array\n                    name:\n                      description:\
    \ |-\n                        name is the referenced service. The service must\
    \ exist in\n                        the same namespace as the MultiClusterService\
    \ object.\n                      type: string\n                  required:\n \
    \                 - name\n                  type: object\n                type:\
    \ array\n              trafficBlockClusters:\n                description: |-\n\
    \                  TrafficBlockClusters records the cluster name list that needs\
    \ to perform traffic block.\n                  When the cloud provider implements\
    \ its multicluster-cloud-provider and refreshes\n                  the service\
    \ backend address to the LoadBalancer Service, it needs to filter out\n      \
    \            the backend addresses in these clusters.\n                items:\n\
    \                  type: string\n                type: array\n            type:\
    \ object\n        type: object\n    served: true\n    storage: true\n    subresources:\n\
    \      status: {}"
  networking.karmada.io_multiclusterservices.yaml: "---\napiVersion: apiextensions.k8s.io/v1\n\
    kind: CustomResourceDefinition\nmetadata:\n  annotations:\n    controller-gen.kubebuilder.io/version:\
    \ v0.21.0\n  name: multiclusterservices.networking.karmada.io\nspec:\n  group:\
    \ networking.karmada.io\n  names:\n    categories:\n    - karmada-io\n    kind:\
    \ MultiClusterService\n    listKind: MultiClusterServiceList\n    plural: multiclusterservices\n\
    \    shortNames:\n    - mcs\n    singular: multiclusterservice\n  scope: Namespaced\n\
    \  versions:\n  - name: v1alpha1\n    schema:\n      openAPIV3Schema:\n      \
    \  description: |-\n          MultiClusterService is a named abstraction of multi-cluster\
    \ software service.\n          The name field of MultiClusterService is the same\
    \ as that of Service name.\n          Services with the same name in different\
    \ clusters are regarded as the same\n          service and are associated with\
    \ the same MultiClusterService.\n          MultiClusterService can control the\
    \ exposure of services to outside multiple\n          clusters, and also enable\
    \ service discovery between clusters.\n        properties:\n          apiVersion:\n\
    \            description: |-\n              APIVersion defines the versioned schema\
    \ of this representation of an object.\n              Servers should convert recognized\
    \ schemas to the latest internal value, and\n              may reject unrecognized\
    \ values.\n              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources\n\
    \            type: string\n          kind:\n            description: |-\n    \
    \          Kind is a string value representing the REST resource this object represents.\n\
    \              Servers may infer this from the endpoint the client submits requests\
    \ to.\n              Cannot be updated.\n              In CamelCase.\n       \
    \       More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds\n\
    \            type: string\n          metadata:\n            type: object\n   \
    \       spec:\n            description: Spec is the desired state of the MultiClusterService.\n\
    \            properties:\n              consumerClusters:\n                description:\
    \ |-\n                  ConsumerClusters specifies the clusters where the service\
    \ will be exposed, for clients.\n                  If leave it empty, the service\
    \ will be exposed to all clusters.\n                items:\n                 \
    \ description: ClusterSelector specifies the cluster to be selected.\n       \
    \           properties:\n                    name:\n                      description:\
    \ Name is the name of the cluster to be selected.\n                      type:\
    \ string\n                  required:\n                  - name\n            \
    \      type: object\n                type: array\n              ports:\n     \
    \           description: |-\n                  Ports is the list of ports that\
    \ are exposed by this MultiClusterService.\n                  No specified port\
    \ will be filtered out during the service\n                  exposure and discovery\
    \ process.\n                  All ports in the referencing service will be exposed\
    \ by default.\n                items:\n                  description: ExposurePort\
    \ describes which port will be exposed.\n                  properties:\n     \
    \               name:\n                      description: |-\n               \
    \         Name is the name of the port that needs to be exposed within the service.\n\
    \                        The port name must be the same as that defined in the\
    \ service.\n                      type: string\n                    port:\n  \
    \                    description: Port specifies the exposed service port.\n \
    \                     format: int32\n                      type: integer\n   \
    \               required:\n                  - port\n                  type: object\n\
    \                type: array\n              providerClusters:\n              \
    \  description: |-\n                  ProviderClusters specifies the clusters\
    \ which will provide the service backend.\n                  If leave it empty,\
    \ we will collect the backend endpoints from all clusters and sync\n         \
    \         them to the ConsumerClusters.\n                items:\n            \
    \      description: ClusterSelector specifies the cluster to be selected.\n  \
    \                properties:\n                    name:\n                    \
    \  description: Name is the name of the cluster to be selected.\n            \
    \          type: string\n                  required:\n                  - name\n\
    \                  type: object\n                type: array\n              range:\n\
    \                description: |-\n                  Range specifies the ranges\
    \ where the referencing service should\n                  be exposed.\n      \
    \            Only valid and optional in case of Types contains CrossCluster.\n\
    \                  If not set and Types contains CrossCluster, all clusters will\n\
    \                  be selected, that means the referencing service will be exposed\n\
    \                  across all registered clusters.\n                  Deprecated:\
    \ in favor of ProviderClusters/ConsumerClusters.\n                properties:\n\
    \                  clusterNames:\n                    description: ClusterNames\
    \ is the list of clusters to be selected.\n                    items:\n      \
    \                type: string\n                    type: array\n             \
    \   type: object\n              serviceConsumptionClusters:\n                description:\
    \ |-\n                  ServiceConsumptionClusters specifies the clusters where\
    \ the service will be exposed, for clients.\n                  If leave it empty,\
    \ the service will be exposed to all clusters.\n                  Deprecated:\
    \ in favor of ProviderClusters/ConsumerClusters.\n                items:\n   \
    \               type: string\n                type: array\n              serviceProvisionClusters:\n\
    \                description: |-\n                  ServiceProvisionClusters specifies\
    \ the clusters which will provision the service backend.\n                  If\
    \ leave it empty, we will collect the backend endpoints from all clusters and\
    \ sync\n                  them to the ServiceConsumptionClusters.\n          \
    \        Deprecated: in favor of ProviderClusters/ConsumerClusters.\n        \
    \        items:\n                  type: string\n                type: array\n\
    \              types:\n                description: |-\n                  Types\
    \ specifies how to expose the service referencing by this\n                  MultiClusterService.\n\
    \                items:\n                  description: ExposureType describes\
    \ how to expose the service.\n                  type: string\n               \
    \ type: array\n            required:\n            - types\n            type: object\n\
    \          status:\n            description: Status is the current state of the\
    \ MultiClusterService.\n            properties:\n              conditions:\n \
    \               description: Current service state\n                items:\n \
    \                 description: Condition contains details for one aspect of the\
    \ current\n                    state of this API Resource.\n                 \
    \ properties:\n                    lastTransitionTime:\n                     \
    \ description: |-\n                        lastTransitionTime is the last time\
    \ the condition transitioned from one status to another.\n                   \
    \     This should be when the underlying condition changed.  If that is not known,\
    \ then using the time when the API field changed is acceptable.\n            \
    \          format: date-time\n                      type: string\n           \
    \         message:\n                      description: |-\n                  \
    \      message is a human readable message indicating details about the transition.\n\
    \                        This may be an empty string.\n                      maxLength:\
    \ 32768\n                      type: string\n                    observedGeneration:\n\
    \                      description: |-\n                        observedGeneration\
    \ represents the .metadata.generation that the condition was set based upon.\n\
    \                        For instance, if .metadata.generation is currently 12,\
    \ but the .status.conditions[x].observedGeneration is 9, the condition is out\
    \ of date\n                        with respect to the current state of the instance.\n\
    \                      format: int64\n                      minimum: 0\n     \
    \                 type: integer\n                    reason:\n               \
    \       description: |-\n                        reason contains a programmatic\
    \ identifier indicating the reason for the condition's last transition.\n    \
    \                    Producers of specific condition types may define expected\
    \ values and meanings for this field,\n                        and whether the\
    \ values are considered a guaranteed API.\n                        The value should\
    \ be a CamelCase string.\n                        This field may not be empty.\n\
    \                      maxLength: 1024\n                      minLength: 1\n \
    \                     pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$\n    \
    \                  type: string\n                    status:\n               \
    \       description: status of the condition, one of True, False, Unknown.\n \
    \                     enum:\n                      - \"True\"\n              \
    \        - \"False\"\n                      - Unknown\n                      type:\
    \ string\n                    type:\n                      description: type of\
    \ condition in CamelCase or in foo.example.com/CamelCase.\n                  \
    \    maxLength: 316\n                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\\\
    .[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$\n\
    \                      type: string\n                  required:\n           \
    \       - lastTransitionTime\n                  - message\n                  -\
    \ reason\n                  - status\n                  - type\n             \
    \     type: object\n                type: array\n                x-kubernetes-list-map-keys:\n\
    \                - type\n                x-kubernetes-list-type: map\n       \
    \       loadBalancer:\n                description: |-\n                  LoadBalancer\
    \ contains the current status of the load-balancer,\n                  if one\
    \ is present.\n                properties:\n                  ingress:\n     \
    \               description: |-\n                      Ingress is a list containing\
    \ ingress points for the load-balancer.\n                      Traffic intended\
    \ for the service should be sent to these ingress points.\n                  \
    \  items:\n                      description: |-\n                        LoadBalancerIngress\
    \ represents the status of a load-balancer ingress point:\n                  \
    \      traffic intended for the service should be sent to an ingress point.\n\
    \                      properties:\n                        hostname:\n      \
    \                    description: |-\n                            Hostname is\
    \ set for load-balancer ingress points that are DNS based\n                  \
    \          (typically AWS load-balancers)\n                          type: string\n\
    \                        ip:\n                          description: |-\n    \
    \                        IP is set for load-balancer ingress points that are IP\
    \ based\n                            (typically GCE or OpenStack load-balancers)\n\
    \                          type: string\n                        ipMode:\n   \
    \                       description: |-\n                            IPMode specifies\
    \ how the load-balancer IP behaves, and may only be specified when the ip field\
    \ is specified.\n                            Setting this to \"VIP\" indicates\
    \ that traffic is delivered to the node with\n                            the\
    \ destination set to the load-balancer's IP and port.\n                      \
    \      Setting this to \"Proxy\" indicates that traffic is delivered to the node\
    \ or pod with\n                            the destination set to the node's IP\
    \ and node port or the pod's IP and port.\n                            Service\
    \ implementations may use this information to adjust traffic routing.\n      \
    \                    type: string\n                        ports:\n          \
    \                description: |-\n                            Ports is a list\
    \ of records of service ports\n                            If used, every port\
    \ defined in the service should have an entry in it\n                        \
    \  items:\n                            description: PortStatus represents the\
    \ error condition\n                              of a service port\n         \
    \                   properties:\n                              error:\n      \
    \                          description: |-\n                                 \
    \ Error is to record the problem with the service port\n                     \
    \             The format of the error shall comply with the following rules:\n\
    \                                  - built-in error values shall be specified\
    \ in this file and those shall use\n                                    CamelCase\
    \ names\n                                  - cloud provider specific error values\
    \ must have names that comply with the\n                                    format\
    \ foo.example.com/CamelCase.\n                                maxLength: 316\n\
    \                                pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$\n\
    \                                type: string\n                              port:\n\
    \                                description: Port is the port number of the service\n\
    \                                  port of which status is recorded here\n   \
    \                             format: int32\n                                type:\
    \ integer\n                              protocol:\n                         \
    \       description: |-\n                                  Protocol is the protocol\
    \ of the service port of which status is recorded here\n                     \
    \             The supported values are: \"TCP\", \"UDP\", \"SCTP\"\n         \
    \                       type: string\n                            required:\n\
    \                            - error\n                            - port\n   \
    \                         - protocol\n                            type: object\n\
    \                          type: array\n                          x-kubernetes-list-type:\
    \ atomic\n                      type: object\n                    type: array\n\
    \                    x-kubernetes-list-type: atomic\n                type: object\n\
    \            type: object\n        required:\n        - spec\n        type: object\n\
    \    served: true\n    storage: true\n    subresources:\n      status: {}"

