    \                      type: string\n                  required:\n           \
    \       - apiVersion\n                  - kind\n                  type: object\n\
    \                minItems: 1\n                type: array\n              schedulePriority:\n\
    \                description: |-\n                  SchedulePriority defines how\
    \ Karmada should resolve the priority and preemption policy\n                \
    \  for workload scheduling.\n\n                  This setting is useful for controlling\
    \ the scheduling behavior of offline workloads.\n                  By setting\
    \ a higher or lower priority, users can control which workloads are scheduled\
    \ first.\n                  Additionally, it allows specifying a preemption policy\
    \ where higher-priority workloads can\n                  preempt lower-priority\
