    \ should not co-exist with SpreadByField.\n                          type: string\n\
    \                      type: object\n                    type: array\n       \
    \           workloadAffinity:\n                    description: |-\n         \
    \             WorkloadAffinity represents inter-workload affinity and anti-affinity\n\
