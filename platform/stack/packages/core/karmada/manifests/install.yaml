    \ of\n                  CronFederatedHPARule.\n                items:\n      \
    \            description: ExecutionHistory records the execution history of specific\n\
    \                    CronFederatedHPARule.\n                  properties:\n  \
    \                  failedExecutions:\n                      description: FailedExecutions\
    \ records failed executions.\n                      items:\n                 \
    \       description: FailedExecution records a failed execution.\n           \
    \             properties:\n                          executionTime:\n        \
    \                    description: |-\n                              ExecutionTime\
    \ is the actual execution time of CronFederatedHPARule.\n                    \
    \          Tasks may not always be executed at ScheduleTime. ExecutionTime is\
