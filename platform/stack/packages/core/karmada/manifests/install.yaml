    \ Non-standard\n                        protocols should use prefixed names such\
    \ as mycompany.com/my-custom-protocol.\n                        Field can be enabled\
    \ with ServiceAppProtocol feature gate.\n                      type: string\n\
    \                    name:\n                      description: The name of this\
    \ port within the service. This\n                        must be a DNS_LABEL.\
    \ All ports within a ServiceSpec must have\n                        unique names.\
    \ When considering the endpoints for a Service,\n                        this\
    \ must match the 'name' field in the EndpointPort. Optional\n                \
    \        if only one ServicePort is defined on this service.\n               \
    \       type: string\n                    port:\n                      description:\
    \ The port that will be exposed by this service.\n                      type:\
    \ integer\n                      format: int32\n                    protocol:\n\
    \                      description: The IP protocol for this port. Supports \"\
    TCP\",\n                        \"UDP\", and \"SCTP\". Default is TCP.\n     \
    \                 type: string\n                x-kubernetes-list-type: atomic\n\
    \              sessionAffinity:\n                description: 'Supports \"ClientIP\"\
    \ and \"None\". Used to maintain session\n                  affinity. Enable client\
