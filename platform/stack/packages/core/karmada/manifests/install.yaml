    \            type: object\n            required:\n            - ports\n      \
    \      - type\n            properties:\n              ips:\n                description:\
    \ ip will be used as the VIP for this service when type\n                  is\
    \ ClusterSetIP.\n                type: array\n                maxItems: 1\n  \
    \              items:\n                  type: string\n              ports:\n\
    \                type: array\n                items:\n                  description:\
    \ ServicePort represents the port on which the service\n                    is\
    \ exposed\n                  type: object\n                  required:\n     \
    \             - port\n                  properties:\n                    appProtocol:\n\
    \                      description: The application protocol for this port. This\
