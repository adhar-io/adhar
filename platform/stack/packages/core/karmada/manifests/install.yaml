data:
  policy.karmada.io_clusteroverridepolicies.yaml: "---\napiVersion: apiextensions.k8s.io/v1\n\
    kind: CustomResourceDefinition\nmetadata:\n  annotations:\n    controller-gen.kubebuilder.io/version:\
    \ v0.21.0\n  name: clusteroverridepolicies.policy.karmada.io\nspec:\n  group:\
    \ policy.karmada.io\n  names:\n    categories:\n    - karmada-io\n    kind: ClusterOverridePolicy\n\
    \    listKind: ClusterOverridePolicyList\n    plural: clusteroverridepolicies\n\
    \    shortNames:\n    - cop\n    singular: clusteroverridepolicy\n  scope: Cluster\n\
    \  versions:\n  - name: v1alpha1\n    schema:\n      openAPIV3Schema:\n      \
    \  description: ClusterOverridePolicy represents the cluster-wide policy that\n\
    \          overrides a group of resources to one or more clusters.\n        properties:\n\
    \          apiVersion:\n            description: |-\n              APIVersion\
    \ defines the versioned schema of this representation of an object.\n        \
    \      Servers should convert recognized schemas to the latest internal value,\
    \ and\n              may reject unrecognized values.\n              More info:\
    \ https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources\n\
    \            type: string\n          kind:\n            description: |-\n    \
    \          Kind is a string value representing the REST resource this object represents.\n\
    \              Servers may infer this from the endpoint the client submits requests\
    \ to.\n              Cannot be updated.\n              In CamelCase.\n       \
    \       More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds\n\
    \            type: string\n          metadata:\n            type: object\n   \
    \       spec:\n            description: Spec represents the desired behavior of\
    \ ClusterOverridePolicy.\n            properties:\n              overrideRules:\n\
    \                description: OverrideRules defines a collection of override rules\n\
    \                  on target clusters.\n                items:\n             \
    \     description: RuleWithCluster defines the override rules on clusters.\n \
    \                 properties:\n                    overriders:\n             \
    \         description: Overriders represents the override rules that would\n \
    \                       apply on resources\n                      properties:\n\
    \                        annotationsOverrider:\n                          description:\
    \ AnnotationsOverrider represents the rules dedicated\n                      \
    \      to handling workload annotations\n                          items:\n  \
    \                          description: LabelAnnotationOverrider represents the\
    \ rules\n                              dedicated to handling workload labels/annotations\n\
    \                            properties:\n                              operator:\n\
    \                                description: Operator represents the operator\
    \ which\n                                  will apply on the workload.\n     \
    \                           enum:\n                                - add\n   \
    \                             - remove\n                                - replace\n\
    \                                type: string\n                              value:\n\
    \                                additionalProperties:\n                     \
    \             type: string\n                                description: |-\n\
    \                                  Value to be applied to annotations/labels of\
    \ workload.\n                                  Items in Value which will be appended\
    \ after annotations/labels when Operator is 'add'.\n                         \
    \         Items in Value which match in annotations/labels will be deleted when\
    \ Operator is 'remove'.\n                                  Items in Value which\
    \ match in annotations/labels will be replaced when Operator is 'replace'.\n \
    \                               type: object\n                            required:\n\
    \                            - operator\n                            - value\n\
    \                            type: object\n                          type: array\n\
    \                        argsOverrider:\n                          description:\
    \ ArgsOverrider represents the rules dedicated\n                            to\
    \ handling container args\n                          items:\n                \
    \            description: CommandArgsOverrider represents the rules\n        \
    \                      dedicated to handling command/args overrides.\n       \
    \                     properties:\n                              containerName:\n\
