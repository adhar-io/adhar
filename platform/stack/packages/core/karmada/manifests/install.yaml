    \      name: AGE\n      type: date\n    name: v1alpha1\n    schema:\n      openAPIV3Schema:\n\
    \        description: |-\n          CronFederatedHPA represents a collection of\
    \ repeating schedule to scale\n          replica number of a specific workload.\
    \ It can scale any resource implementing\n          the scale subresource as well\
    \ as FederatedHPA.\n        properties:\n          apiVersion:\n            description:\
