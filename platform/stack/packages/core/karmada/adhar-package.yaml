# Adhar marketplace contract for the karmada package.
# Validated against platform/stack/packages/marketplace.schema.json
# (run: hack/validate-packages.sh). See MARKETPLACE.md for the contract.
apiVersion: marketplace.adhar.io/v1alpha1
kind: AdharPackage
name: karmada
category: core
version: "1.19.0"
description: Karmada multi-cluster control plane — registers member clusters and propagates workloads across clouds with PropagationPolicy and OverridePolicy.
maintainer:
  name: Adhar Platform Team
  url: https://github.com/adhar-io/adhar
  firstParty: true
license: Apache-2.0
homepage: https://karmada.io
adharCompatibility:
  minVersion: "0.1.0"
dependencies: []
provenance:
  sourceRepo: https://github.com/adhar-io/adhar
  upstreamChart: karmada-io/karmada (release asset karmada-chart-v1.19.0.tgz)
  signed: true                 # release artifacts are Cosign-keyless signed by the GoReleaser pipeline
  cosignKeyless: true          # Sigstore Fulcio + Rekor, ADR-0019
  scanned: true
  scanner: trivy
  sbom: https://github.com/adhar-io/adhar/releases  # SPDX SBOMs are attached to every release
planeAffinity: control-plane
stability: beta   # enabled in the production curated set only
resources:
  localSafe: false   # a full second control plane (apiserver + etcd) does not belong on one Kind node
keywords:
  - multicluster
  - multicloud
  - fleet
  - karmada
  - propagation
verification:
  status: verified
  profile: production
  verifiedAt: "2026-09-23"
  platformVersion: "v0.1.22"
  kubernetesVersion: "v1.37.0"
