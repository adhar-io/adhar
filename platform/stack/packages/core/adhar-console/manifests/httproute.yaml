# Adhar Console routed through the Cilium Gateway (adhar-gateway).
# TLS terminates at the Gateway (adhar-cert); the console serves plain HTTP on
# its own host console.adhar.localtest.me, served at root.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: console
  namespace: adhar-system
spec:
  parentRefs:
    - name: adhar-gateway
      namespace: adhar-system
  hostnames:
    - console.adhar.localtest.me
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: console
          port: 80
