---
apiVersion: v1
kind: Secret
metadata:
  name: k8s-config
  namespace: adhar-system
stringData:
  k8s-config.yaml: "type: 'config'\nclusters:\n  - url: https://kubernetes.default.svc.cluster.local\n\
    \    name: local\n    authProvider: 'serviceAccount'\n    skipTLSVerify: true\n\
    \    skipMetricsLookup: true\n    serviceAccountToken: \n      $file: /var/run/secrets/kubernetes.io/serviceaccount/token\n\
    \    caData: \n      $file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt\n"
---
apiVersion: v1
kind: Service
metadata:
  name: backstage
  namespace: adhar-system
spec:
  ports:
  - name: http
    port: 7007
    targetPort: http
  selector:
    app: backstage
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: backstage-db
  namespace: adhar-system
  annotations:
    argocd.argoproj.io/sync-wave: '5'
spec:
  instances: 1
  storage:
    size: 1Gi
  bootstrap:
    initdb:
      database: backstage
      owner: backstage
      secret:
        name: backstage-env-vars
      postInitApplicationSQL:
      - ALTER ROLE backstage CREATEDB
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adhar-console
  namespace: adhar-system
  annotations:
    argocd.argoproj.io/sync-wave: '20'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backstage
  template:
    metadata:
      labels:
        app: backstage
    spec:
      # Build a CA trust bundle = in-cluster API-server CA + the adhar gateway
      # CA, so the console's Deno runtime trusts BOTH the Kubernetes API (used
      # by the /api/svc/k8s proxy) and Keycloak's self-signed HTTPS endpoint
      # (server-side OIDC code exchange + JWKS).
      initContainers:
      - name: ca-bundle
        image: busybox:1.36
        command:
        - sh
        - -c
        - >-
          cat /var/run/secrets/kubernetes.io/serviceaccount/ca.crt /adhar-cert/ca.crt
          > /shared/ca-bundle.crt 2>/dev/null ||
          cat /var/run/secrets/kubernetes.io/serviceaccount/ca.crt /adhar-cert/tls.crt
          > /shared/ca-bundle.crt
        volumeMounts:
        - { name: ca-bundle, mountPath: /shared }
        - { name: adhar-cert, mountPath: /adhar-cert, readOnly: true }
      containers:
      - name: adhar-console
        image: adhario/adhar-console:0.2.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
          name: http
        env:
        - { name: PORT, value: '3000' }
        # SSO — reuses the 'backstage' Keycloak client (confidential). This env
        # is what flips the console from "Keycloak not configured" to real SSO.
        - { name: KEYCLOAK_URL, value: 'https://keycloak.adhar.localtest.me:8443' }
        - { name: KEYCLOAK_REALM, value: 'adhar' }
        - { name: KEYCLOAK_CLIENT_ID, value: 'backstage' }
        - { name: AUTH_PUBLIC_URL, value: 'https://console.adhar.localtest.me:8443' }
        - { name: AUTH_SCOPES, value: 'openid profile email offline_access' }
        - { name: AUTH_COOKIE_SECURE, value: 'true' }
        - { name: K8S_API_URL, value: 'https://kubernetes.default.svc' }
        - { name: DENO_CERT, value: '/shared/ca-bundle.crt' }
        # AI assistant — point at an in-cluster OpenAI-compatible endpoint to
        # enable it (leave AI_BASE_URL empty to disable). AI_API_KEY (if needed)
        # comes from the backstage-env-vars Secret.
        - { name: AI_BASE_URL, value: '' }
        - { name: AI_MODEL, value: 'default' }
        # AUTH_CLIENT_SECRET + AUTH_COOKIE_SECRET come from here (templated by
        # the backstage-oidc ExternalSecret from the keycloak-clients secret).
        envFrom:
        - secretRef:
            name: backstage-env-vars
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 768Mi
        startupProbe:
          httpGet: { path: /healthz, port: http }
          periodSeconds: 3
          failureThreshold: 40
        livenessProbe:
          httpGet: { path: /healthz, port: http }
          periodSeconds: 20
          timeoutSeconds: 3
        readinessProbe:
          httpGet: { path: /readyz, port: http }
          periodSeconds: 10
          timeoutSeconds: 5
        volumeMounts:
        - { name: ca-bundle, mountPath: /shared, readOnly: true }
      serviceAccountName: backstage
      volumes:
      - name: ca-bundle
        emptyDir: {}
      - name: adhar-cert
        secret:
          secretName: adhar-cert
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: backstage
  namespace: adhar-system
spec:
  length: 36
  digits: 5
  symbols: 5
  symbolCharacters: /-+
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backstage-oidc
  namespace: adhar-system
spec:
  secretStoreRef:
    name: keycloak
    kind: ClusterSecretStore
  # CreatedOnce + 5m: retry until keycloak-clients exists, then freeze so the
  # generated Postgres password (which the DB was initialized with) never
  # rotates. A bare refreshInterval "0" is one attempt with NO retry — any ES
  # created before the Keycloak realm job finishes stays SecretSyncedError
  # forever.
  refreshPolicy: CreatedOnce
  refreshInterval: 5m
  target:
    name: backstage-env-vars
    template:
      engineVersion: v2
      data:
        BACKSTAGE_FRONTEND_URL: https://console.adhar.localtest.me:8443
        POSTGRES_HOST: backstage-db-rw.adhar-system.svc.cluster.local
        POSTGRES_PORT: '5432'
        POSTGRES_DB: backstage
        POSTGRES_USER: backstage
        POSTGRES_PASSWORD: '{{.POSTGRES_PASSWORD}}'
        username: backstage
        password: '{{.POSTGRES_PASSWORD}}'
        ARGO_WORKFLOWS_URL: https://argo-workflows.adhar.localtest.me:8443
        KEYCLOAK_NAME_METADATA: https://keycloak.adhar.localtest.me:8443/realms/adhar/.well-known/openid-configuration
        KEYCLOAK_CLIENT_SECRET: '{{.BACKSTAGE_CLIENT_SECRET}}'
        # Adhar Console (TanStack) SSO — reuses the 'backstage' Keycloak client.
        AUTH_CLIENT_SECRET: '{{.BACKSTAGE_CLIENT_SECRET}}'
        # Signs the console's HttpOnly session cookie (>=32 chars). Rotate for
        # a hardened deployment; stable value keeps sessions valid across pod
        # restarts / replicas.
        AUTH_COOKIE_SECRET: 'adhar-console-session-signing-key-change-me-please-01'
        # Console's own relational state (preferences, notification state). Reuses
        # the CNPG 'backstage' database; the console auto-creates its tables.
        DATABASE_URL: 'postgres://backstage:{{.POSTGRES_PASSWORD}}@backstage-db-rw.adhar-system.svc.cluster.local:5432/backstage'
        ARGOCD_AUTH_TOKEN: argocd.token={{.ARGOCD_SESSION_TOKEN}}
        ARGO_CD_URL: http://argo-cd-argocd-server.adhar-system.svc.cluster.local/api/v1/
  data:
  - secretKey: ARGOCD_SESSION_TOKEN
    remoteRef:
      key: keycloak-clients
      property: ARGOCD_SESSION_TOKEN
  - secretKey: BACKSTAGE_CLIENT_SECRET
    remoteRef:
      key: keycloak-clients
      property: BACKSTAGE_CLIENT_SECRET
  dataFrom:
  - sourceRef:
      generatorRef:
        apiVersion: generators.external-secrets.io/v1alpha1
        kind: Password
        name: backstage
    rewrite:
    - transform:
        template: POSTGRES_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitea-credentials
  namespace: adhar-system
spec:
  secretStoreRef:
    name: gitea
    kind: ClusterSecretStore
  # 1h, not "0": sync-once is a single attempt with no retry, so a first sync
  # that races the source secret wedges as SecretSyncedError forever.
  refreshInterval: 1h
  target:
    name: gitea-credentials
  data:
  - secretKey: GITEA_USERNAME
    remoteRef:
      key: gitea-credential
      property: username
  - secretKey: GITEA_PASSWORD
    remoteRef:
      key: gitea-credential
      property: password
