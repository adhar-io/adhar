apiVersion: v1
kind: ServiceAccount
metadata:
  name: console
  namespace: adhar-system

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: console-argo-workflows
rules:
- apiGroups:
  - argoproj.io
  resources:
  - workflows
  verbs:
  - create

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: read-all
rules:
- apiGroups:
  - '*'
  resources:
  - '*'
  verbs:
  - get
  - list
  - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: console-exec
rules:
- apiGroups:
  - ''
  resources:
  - pods/exec
  - pods/attach
  verbs:
  - create
  - get

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: console-exec
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: console-exec
subjects:
- kind: ServiceAccount
  name: console
  namespace: adhar-system

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: console-argo-workflows
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: console-argo-workflows
subjects:
- kind: ServiceAccount
  name: console
  namespace: adhar-system

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: console-read-all
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: read-all
subjects:
- kind: ServiceAccount
  name: console
  namespace: adhar-system

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: console-impersonator
  labels:
    adhar.io/component: rbac
rules:
- apiGroups:
  - ''
  resources:
  - users
  - groups
  verbs:
  - impersonate

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: console-impersonator
  labels:
    adhar.io/component: rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: console-impersonator
subjects:
- kind: ServiceAccount
  name: console
  namespace: adhar-system

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: console-tenant-provisioner
rules:
- apiGroups:
  - ''
  resources:
  - namespaces
  verbs:
  - create
  - get
  - list
  - watch
  - update
  - patch
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - rolebindings
  - roles
  verbs:
  - create
  - get
  - list
  - update
  - patch
- apiGroups:
  - argoproj.io
  resources:
  - appprojects
  verbs:
  - create
  - get
  - list
  - update
  - patch
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - clusterroles
  verbs:
  - bind
  resourceNames:
  - admin

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: console-tenant-provisioner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: console-tenant-provisioner
subjects:
- kind: ServiceAccount
  name: console
  namespace: adhar-system

---
apiVersion: v1
kind: Service
metadata:
  name: console
  namespace: adhar-system
spec:
  ports:
  - name: http
    port: 80
    targetPort: http
  selector:
    app: console

---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: console-db
  namespace: adhar-system
  annotations:
    argocd.argoproj.io/sync-wave: '5'
    argocd.argoproj.io/sync-options: ServerSideApply=true
spec:
  instances: 1
  monitoring:
    enablePodMonitor: true
  storage:
    size: 5Gi
  bootstrap:
    initdb:
      database: console
      owner: console
      secret:
        name: console-env-vars
      postInitApplicationSQL:
      - ALTER ROLE console CREATEDB
  backup:
    barmanObjectStore:
      destinationPath: s3://adhar-backups/cnpg/console-db
      endpointURL: http://rustfs.adhar-system.svc.cluster.local:9000
      s3Credentials:
        accessKeyId:
          key: rootUser
          name: root-creds
        secretAccessKey:
          key: rootPassword
          name: root-creds
      wal:
        compression: gzip
    retentionPolicy: 7d

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adhar-console
  namespace: adhar-system
  annotations:
    argocd.argoproj.io/sync-wave: '20'
spec:
  progressDeadlineSeconds: 120
  replicas: 1
  selector:
    matchLabels:
      app: console
  template:
    metadata:
      labels:
        app: console
    spec:
      initContainers:
      - name: ca-bundle
        image: busybox:1.36
        command:
        - sh
        - -c
        - cat /var/run/secrets/kubernetes.io/serviceaccount/ca.crt /adhar-cert/ca.crt
          > /shared/ca-bundle.crt 2>/dev/null || cat /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          /adhar-cert/tls.crt > /shared/ca-bundle.crt
        volumeMounts:
        - name: ca-bundle
          mountPath: /shared
        - name: adhar-cert
          mountPath: /adhar-cert
          readOnly: true
      containers:
      - name: adhar-console
        image: ghcr.io/adhar-io/adhar-console:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: PORT
          value: '3000'
        - name: ADHAR_DOMAIN
          value: adhar.localtest.me:8443
        - name: KEYCLOAK_INTERNAL_URL
          value: http://keycloak.adhar-system.svc.cluster.local:8080
        - name: KEYCLOAK_REALM
          value: adhar
        - name: KEYCLOAK_CLIENT_ID
          value: adhar-console
        - name: AUTH_SCOPES
          value: openid profile email offline_access
        - name: AUTH_COOKIE_SECURE
          value: 'true'
        - name: K8S_API_URL
          value: https://kubernetes.default.svc
        - name: DENO_CERT
          value: /shared/ca-bundle.crt
        - name: AI_BASE_URL
          value: http://adhar-ai-gateway.adhar-system.svc.cluster.local:8080/v1
        - name: AI_MODEL
          valueFrom:
            secretKeyRef:
              name: adhar-ai-llm
              key: MODEL
              optional: true
        - name: ADHAR_AI_URL
          value: http://adhar-ai-runtime.adhar-system.svc.cluster.local:8080
        - name: GITEA_URL
          value: http://gitea-http.adhar-system.svc.cluster.local:3000
        - name: ADHAR_APPSET_REPO
          value: adhar/environments
        - name: ADHAR_APPSET_FILE
          value: production/config.yaml
        - name: ARGOCD_URL
          value: http://argo-cd-argocd-server.adhar-system.svc.cluster.local:80
        - name: ARGOCD_NAMESPACE
          value: adhar-system
        - name: ARGOCD_USERNAME
          value: admin
        - name: ARGOCD_PASSWORD
          valueFrom:
            secretKeyRef:
              name: argocd-credentials
              key: ARGOCD_ADMIN_PASSWORD
        # Alertmanager's bearer token for POST /api/alerts/alertmanager — the
        # same Secret kube-prometheus mounts into Alertmanager. `optional` so a
        # local profile without kube-prometheus still starts; the receiver then
        # refuses with 503 rather than accepting unauthenticated alerts.
        - name: ALERTMANAGER_WEBHOOK_TOKEN
          valueFrom:
            secretKeyRef:
              name: alertmanager-console-webhook
              key: token
              optional: true
        - name: GRAFANA_URL
          value: http://prometheus-grafana.adhar-system.svc.cluster.local:80
        - name: GRAFANA_USERNAME
          valueFrom:
            secretKeyRef:
              name: prometheus-grafana
              key: admin-user
              optional: true
        - name: GRAFANA_PASSWORD
          valueFrom:
            secretKeyRef:
              name: prometheus-grafana
              key: admin-password
              optional: true
        - name: MIMIR_TENANT
          value: anonymous
        - name: PROMETHEUS_URL
          value: http://prometheus-kube-prometheus-prometheus.adhar-system.svc.cluster.local:9090
        - name: LOKI_URL
          value: http://loki.adhar-system.svc.cluster.local:3100
        - name: MIMIR_URL
          value: http://mimir-gateway.adhar-system.svc.cluster.local:80
        - name: TEMPO_URL
          value: http://tempo.adhar-system.svc.cluster.local:3200
        - name: VAULT_URL
          value: http://vault.adhar-system.svc.cluster.local:8200
        - name: TEKTON_URL
          value: http://tekton-dashboard.adhar-system.svc.cluster.local:9097
        - name: HARBOR_URL
          value: http://harbor.adhar-system.svc.cluster.local:80
        - name: HARBOR_PROJECT
          value: library
        - name: HARBOR_USERNAME
          value: admin
        - name: HARBOR_PASSWORD
          valueFrom:
            secretKeyRef:
              name: harbor-core
              key: HARBOR_ADMIN_PASSWORD
              optional: true
        - name: NEXUS_URL
          value: http://nexus.adhar-system.svc.cluster.local:8081
        - name: NEXUS_USERNAME
          valueFrom:
            secretKeyRef:
              name: nexus-credentials
              key: username
              optional: true
        - name: NEXUS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: nexus-credentials
              key: password
              optional: true
        - name: KAFKA_UI_URL
          value: http://kafka-ui.adhar-system.svc.cluster.local:80
        - name: TOOLJET_URL
          value: http://tooljet.adhar-system.svc.cluster.local:80
        - name: PENPOT_URL
          value: http://penpot.adhar-system.svc.cluster.local:8080
        - name: OPENSEARCH_URL
          value: http://opensearch-dashboards.adhar-system.svc.cluster.local:5601
        - name: MINIO_URL
          value: http://rustfs.adhar-system.svc.cluster.local:9000
        - name: ARGO_ROLLOUTS_URL
          value: http://argo-rollouts-dashboard.adhar-system.svc.cluster.local:3100
        - name: KYVERNO_URL
          value: https://kyverno-svc.adhar-system.svc.cluster.local:443
        - name: CROSSPLANE_URL
          value: https://crossplane-webhooks.adhar-system.svc.cluster.local:9443
        - name: HUBBLE_URL
          value: http://hubble-ui.adhar-system.svc.cluster.local:80
        - name: JUPYTERHUB_URL
          value: http://proxy-public.adhar-system.svc.cluster.local:80
        - name: METABASE_URL
          value: http://metabase.adhar-system.svc.cluster.local:80
        - name: METABASE_USERNAME
          valueFrom:
            secretKeyRef:
              name: metabase-admin-credentials
              key: username
              optional: true
        - name: METABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: metabase-admin-credentials
              key: password
              optional: true
        - name: OPENCOST_URL
          value: http://opencost.adhar-system.svc.cluster.local:9003
        - name: KARGO_URL
          value: http://kargo-api.adhar-system.svc.cluster.local:80
        - name: CODER_URL
          value: http://coder.adhar-system.svc.cluster.local:80
        - name: AIRBYTE_URL
          value: http://airbyte-airbyte-server-svc.adhar-system.svc.cluster.local:8001
        - name: FALCO_URL
          value: http://falco-falcosidekick.adhar-system.svc.cluster.local:2801
        envFrom:
        - secretRef:
            name: console-env-vars
        - secretRef:
            name: gitea-credentials
        - secretRef:
            name: coder-credentials
            optional: true
        - secretRef:
            name: plane-api-token
            optional: true
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 768Mi
        startupProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 3
          failureThreshold: 40
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 20
          timeoutSeconds: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
        volumeMounts:
        - name: ca-bundle
          mountPath: /shared
          readOnly: true
      serviceAccountName: console
      volumes:
      - name: ca-bundle
        emptyDir: {}
      - name: adhar-cert
        secret:
          secretName: adhar-cert

---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: console
  namespace: adhar-system
spec:
  length: 36
  digits: 5
  symbols: 5
  symbolCharacters: /-+
  noUpper: false
  allowRepeat: true

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: console-oidc
  namespace: adhar-system
spec:
  secretStoreRef:
    name: keycloak
    kind: ClusterSecretStore
  refreshPolicy: CreatedOnce
  refreshInterval: 30s
  target:
    name: console-env-vars
    template:
      engineVersion: v2
      data:
        POSTGRES_HOST: console-db-rw.adhar-system.svc.cluster.local
        POSTGRES_PORT: '5432'
        POSTGRES_DB: console
        POSTGRES_USER: console
        POSTGRES_PASSWORD: '{{.POSTGRES_PASSWORD}}'
        username: console
        password: '{{.POSTGRES_PASSWORD}}'
        ARGO_WORKFLOWS_URL: https://argo-workflows.adhar.localtest.me:8443
        AUTH_CLIENT_SECRET: '{{.ADHAR_CONSOLE_CLIENT_SECRET}}'
        AUTH_COOKIE_SECRET: adhar-console-session-signing-key-change-me-please-01
        DATABASE_URL: postgres://console:{{.POSTGRES_PASSWORD}}@console-db-rw.adhar-system.svc.cluster.local:5432/console
        ARGOCD_TOKEN: '{{ .ARGOCD_SESSION_TOKEN }}'
        ARGO_CD_URL: http://argo-cd-argocd-server.adhar-system.svc.cluster.local/api/v1/
  data:
  - secretKey: ARGOCD_SESSION_TOKEN
    remoteRef:
      key: keycloak-clients
      property: ARGOCD_SESSION_TOKEN
  - secretKey: ADHAR_CONSOLE_CLIENT_SECRET
    remoteRef:
      key: keycloak-clients
      property: ADHAR_CONSOLE_CLIENT_SECRET
  dataFrom:
  - sourceRef:
      generatorRef:
        apiVersion: generators.external-secrets.io/v1alpha1
        kind: Password
        name: console
    rewrite:
    - transform:
        template: POSTGRES_PASSWORD

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitea-credentials
  namespace: adhar-system
spec:
  secretStoreRef:
    name: gitea
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: gitea-credentials
  data:
  - secretKey: GITEA_USERNAME
    remoteRef:
      key: gitea-credential
      property: username
  - secretKey: GITEA_PASSWORD
    remoteRef:
      key: gitea-credential
      property: password
  - secretKey: GITEA_TOKEN
    remoteRef:
      key: gitea-credential
      property: token

---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: console-db-daily
  namespace: adhar-system
  labels:
    app.kubernetes.io/name: console-db
  annotations:
    argocd.argoproj.io/sync-wave: '-4'
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  schedule: 0 40 2 * * *
  backupOwnerReference: self
  cluster:
    name: console-db
