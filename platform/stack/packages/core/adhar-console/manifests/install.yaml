  resources:
  - pods/exec
  - pods/attach
  verbs:
  - create
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: console-exec
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: console-exec
subjects:
- kind: ServiceAccount
  name: console
  namespace: adhar-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: console-argo-workflows
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: console-argo-workflows
subjects:
- kind: ServiceAccount
  name: console
  namespace: adhar-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: console-read-all
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: read-all
subjects:
- kind: ServiceAccount
  name: console
  namespace: adhar-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: console-impersonator
  labels:
    adhar.io/component: rbac
rules:
- apiGroups:
  - ''
  resources:
  - users
  - groups
  verbs:
  - impersonate
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: console-impersonator
  labels:
    adhar.io/component: rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: console-impersonator
subjects:
- kind: ServiceAccount
  name: console
  namespace: adhar-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: console-tenant-provisioner
rules:
- apiGroups:
  - ''
  resources:
  - namespaces
  verbs:
  - create
  - get
  - list
  - watch
  - update
  - patch
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - rolebindings
  - roles
  verbs:
  - create
  - get
  - list
  - update
  - patch
- apiGroups:
  - argoproj.io
  resources:
  - appprojects
  verbs:
  - create
  - get
  - list
  - update
  - patch
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - clusterroles
  verbs:
  - bind
  resourceNames:
  - admin
# Tenancy is provisioned THROUGH the control plane: a new organisation or team
# from the console's switcher is an `Organisation` / `Team` XR
# (platform.adhar.io), whose composition creates the home namespace, quota, role
# bindings, Gitea organisation and — for teams — the Keycloak group. The console
# applies those XRs server-side (and back-fills them for tenants that predate
# this), so it needs to write them; `read-all` already covers reading.
#
# It belongs on THIS role and not on `console-exec`: provisioning a tenant and
# opening a shell into a pod are different privileges with different blast
# radii, and a grant that drifts onto the wrong role is the kind of mistake that
# only a test notices (`TestConsoleMayWriteTenancyXRs` names the role).
- apiGroups:
  - platform.adhar.io
  resources:
  - organisations
  - teams
  # A scaffolded service is registered as an Application XR in its project;
  # the control plane composes its per-environment Argo CD Applications and
  # Kargo promotion from it (ADR-0026). The console used to POST a raw Argo CD
  # Application into `default` instead — no promotion, wrong namespace.
  - applications
  verbs:
  - create
  - get
  - list
  - watch
  - update
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: console-tenant-provisioner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: console-tenant-provisioner
subjects:
- kind: ServiceAccount
  name: console
  namespace: adhar-system
---
# The console's notification watcher (apps/console/app/server/events/ in the
# console repo) turns platform state transitions into Notification Center
# entries — Argo CD health and sync operations, Tekton runs, Kargo freight /
# promotions / stage verification, Argo Rollouts, every control-plane XR being
# created / ready / failed / deleted, nodes joining and leaving, the node
# autoscaler's Events and the resilience gate's Jobs. It runs as THIS
# ServiceAccount with no request in flight, so each resource it watches needs
# list + watch here.
#
# `read-all` above happens to cover all of it today. This role exists anyway,
# and names each resource, because `read-all` is the grant most likely to be
# narrowed (it includes Secrets), and a watcher that loses a resource does not
# fail — `runWatch` logs one 403 and disables that source, and the feed goes
# quiet about promotions with nothing on screen to say why. Read-only, and
# pinned by `TestConsoleWatchedResourcesAreGranted`, which also fails when the
# control plane gains an XRD this list does not name.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: console-event-watcher
  labels:
    adhar.io/component: rbac
rules:
- apiGroups:
  - ''
  resources:
  - events
  - namespaces
  - nodes
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - argoproj.io
  resources:
  - applications
  - rollouts
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - tekton.dev
  resources:
  - pipelineruns
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - kargo.akuity.io
  resources:
  - freights
  - promotions
  - stages
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - platform.adhar.io
  resources:
  - agentworkloads
  - applications
  - authstacks
  - backuppolicies
  - buckets
  - caches
  - clusters
  - compliancepolicies
  - costtrackers
  - databases
  - environments
  - functions
  - gitops
  - graphdatabases
  - healths
  - loggings
  - messagings
  - metrics
  - networks
  - nosqldatabases
  - organisations
  - pipelines
  - platformconfigs
  - projects
  - queues
  - releases
  - repositories
  - restores
  - scales
  - searches
  - secretrotations
  - secrets
  - services
  - storages
  - tables
  - teams
  - topics
  - traces
  - vectors
  - webhooks
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: console-event-watcher
  labels:
    adhar.io/component: rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: console-event-watcher
subjects:
- kind: ServiceAccount
  name: console
  namespace: adhar-system
---
apiVersion: v1
kind: Service
metadata:
  name: console
  namespace: adhar-system
spec:
  ports:
  - name: http
    port: 80
    targetPort: http
  selector:
    app: console
---
# The database, asked for rather than built.
#
# This was a CloudNativePG `Cluster` plus a `ScheduledBackup` declared here,
# with the same barman stanza every other platform database also carried. It is
# now a `Database`, and the control plane composes exactly those objects
# (compositions/database/local-cnpg.yaml) — verified by rendering this request
# and diffing it against the Cluster it replaces, field for field.
#
# The credential is unchanged: the ExternalSecret in this package still mints it,
# and `credentialsSecret` hands it to CNPG as the bootstrap owner secret.
apiVersion: platform.adhar.io/v1alpha1
kind: Database
metadata:
  name: console-db
  namespace: adhar-system
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  parameters:
    databaseName: console
    credentials:
      masterUsername: console
    credentialsSecret: console-env-vars
    storageSize: 5Gi
    postInitSQL:
      - ALTER ROLE console CREATEDB
    backupSchedule: 0 40 2 * * *
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adhar-console
  namespace: adhar-system
  annotations:
    argocd.argoproj.io/sync-wave: '20'
spec:
  # 600s (the Kubernetes default), NOT 120.
  #
  # The console does not serve until it has primed a watch cache over the WHOLE
  # cluster and built its graph. Measured on a full production bring-up
  # (2026-10-03): pod Scheduled 08:07:15, Ready 08:10:09 — 2m54s, having primed
  # 352 pods, 293 services, 196 deployments, 75 Applications and 2000 events
  # into a 1215-node graph. The 120s deadline could not be met on any real
  # cluster, so the Deployment went
  #   Progressing=False ProgressDeadlineExceeded
  # Argo CD read that as a failed sync, retried (attempt #14 observed), and each
  # retry restarted the clock — an app permanently Degraded while the console
  # itself was running and healthy. The readiness probe is the real gate; this
  # only has to be longer than a cold start on a busy cluster.
  progressDeadlineSeconds: 600
  replicas: 1
  # Replace in place: one replica gains nothing from a surge pod except a
  # few seconds of overlap, and on a fully requested cluster the surge pod
  # can never schedule, so the rollout would wait forever on the old one.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: console
  template:
    metadata:
      labels:
        app: console
    spec:
      initContainers:
      - name: ca-bundle
        image: busybox:1.36
        command:
        - sh
        - -c
        - cat /var/run/secrets/kubernetes.io/serviceaccount/ca.crt /adhar-cert/ca.crt
          > /shared/ca-bundle.crt 2>/dev/null || cat /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          /adhar-cert/tls.crt > /shared/ca-bundle.crt
        volumeMounts:
        - name: ca-bundle
          mountPath: /shared
        - name: adhar-cert
          mountPath: /adhar-cert
          readOnly: true
      containers:
      - name: adhar-console
        # Pinned to a released version (2026-10-24, was :latest + Always). A
        # floating tag made the running console unknowable from the manifest,
        # upgraded it on any pod restart, and the console's own status card
        # reported "latest" against its build version. Bump this line to ship
        # a new console; the tag carries no `v` prefix.
        image: ghcr.io/adhar-io/adhar-console:0.1.164
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: PORT
          value: '3000'
        - name: ADHAR_DOMAIN
          value: adhar.localtest.me:8443
        - name: KEYCLOAK_INTERNAL_URL
          value: http://keycloak.adhar-system.svc.cluster.local:8080
        - name: KEYCLOAK_REALM
          value: adhar
        - name: KEYCLOAK_CLIENT_ID
          value: adhar-console
        # No offline_access: an offline token kept the console signed in after
        # Keycloak's SSO session had ended, so every tool opened from it asked
        # for the password again. An online token keeps that session alive.
        - name: AUTH_SCOPES
          value: openid profile email
        - name: AUTH_COOKIE_SECURE
          value: 'true'
        - name: K8S_API_URL
          value: https://kubernetes.default.svc
        - name: DENO_CERT
          value: /shared/ca-bundle.crt
        - name: AI_BASE_URL
          value: http://adhar-ai-gateway.adhar-system.svc.cluster.local:8080/v1
        - name: AI_MODEL
          valueFrom:
            secretKeyRef:
              name: adhar-ai-llm
              key: MODEL
              optional: true
        - name: ADHAR_AI_URL
          value: http://adhar-ai-runtime.adhar-system.svc.cluster.local:8080
        - name: GITEA_URL
          value: http://gitea-http.adhar-system.svc.cluster.local:3000
        # The profile's ApplicationSet, committed to the packages repo at
        # seeding and kept live by the adhar-platform-applicationset Argo CD
        # Application. It pointed at environments/production/config.yaml,
        # which neither exists (the directory is `prod`) nor decides what
        # deploys, so every Marketplace toggle failed.
        - name: ADHAR_APPSET_REPO
          value: adhar/packages
        - name: ADHAR_APPSET_FILE
          value: applicationset.yaml
        - name: ARGOCD_URL
          value: http://argo-cd-argocd-server.adhar-system.svc.cluster.local:80
        - name: ARGOCD_NAMESPACE
          value: adhar-system
        - name: ARGOCD_USERNAME
          value: admin
        - name: ARGOCD_PASSWORD
          valueFrom:
            secretKeyRef:
              name: argocd-credentials
              key: ARGOCD_ADMIN_PASSWORD
        # Alertmanager's bearer token for POST /api/alerts/alertmanager — the
        # same Secret kube-prometheus mounts into Alertmanager. `optional` so a
        # local profile without kube-prometheus still starts; the receiver then
        # refuses with 503 rather than accepting unauthenticated alerts.
        - name: ALERTMANAGER_WEBHOOK_TOKEN
          valueFrom:
            secretKeyRef:
              name: alertmanager-console-webhook
              key: token
              optional: true
        - name: GRAFANA_URL
          value: http://prometheus-grafana.adhar-system.svc.cluster.local:80
        - name: GRAFANA_USERNAME
          valueFrom:
            secretKeyRef:
              name: prometheus-grafana
              key: admin-user
              optional: true
        - name: GRAFANA_PASSWORD
          valueFrom:
            secretKeyRef:
              name: prometheus-grafana
              key: admin-password
              optional: true
        - name: MIMIR_TENANT
          value: anonymous
        - name: PROMETHEUS_URL
          value: http://prometheus-kube-prometheus-prometheus.adhar-system.svc.cluster.local:9090
        - name: LOKI_URL
          value: http://loki.adhar-system.svc.cluster.local:3100
        - name: MIMIR_URL
          value: http://mimir-gateway.adhar-system.svc.cluster.local:80
        - name: TEMPO_URL
          value: http://tempo.adhar-system.svc.cluster.local:3200
        - name: VAULT_URL
          value: http://vault.adhar-system.svc.cluster.local:8200
        - name: TEKTON_URL
          value: http://tekton-dashboard.adhar-system.svc.cluster.local:9097
        - name: HARBOR_URL
          value: http://harbor.adhar-system.svc.cluster.local:80
        - name: HARBOR_PROJECT
          value: library
        - name: HARBOR_USERNAME
          value: admin
        - name: HARBOR_PASSWORD
          valueFrom:
            secretKeyRef:
              name: harbor-core
              key: HARBOR_ADMIN_PASSWORD
              optional: true
        - name: NEXUS_URL
          value: http://nexus.adhar-system.svc.cluster.local:8081
        - name: NEXUS_USERNAME
          valueFrom:
            secretKeyRef:
              name: nexus-credentials
              key: username
              optional: true
        - name: NEXUS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: nexus-credentials
              key: password
              optional: true
        - name: KAFKA_UI_URL
          value: http://kafka-ui.adhar-system.svc.cluster.local:80
        - name: TOOLJET_URL
          value: http://tooljet.adhar-system.svc.cluster.local:80
        - name: PENPOT_URL
          value: http://penpot.adhar-system.svc.cluster.local:8080
        - name: OPENSEARCH_URL
          value: http://opensearch-dashboards.adhar-system.svc.cluster.local:5601
        - name: MINIO_URL
          value: http://rustfs.adhar-system.svc.cluster.local:9000
        - name: ARGO_ROLLOUTS_URL
          value: http://argo-rollouts-dashboard.adhar-system.svc.cluster.local:3100
        - name: KYVERNO_URL
          value: https://kyverno-svc.adhar-system.svc.cluster.local:443
        - name: CROSSPLANE_URL
          value: https://crossplane-webhooks.adhar-system.svc.cluster.local:9443
        - name: HUBBLE_URL
          value: http://hubble-ui.adhar-system.svc.cluster.local:80
        - name: JUPYTERHUB_URL
          value: http://proxy-public.adhar-system.svc.cluster.local:80
        - name: METABASE_URL
          value: http://metabase.adhar-system.svc.cluster.local:80
        - name: METABASE_USERNAME
          valueFrom:
            secretKeyRef:
              name: metabase-admin-credentials
              key: username
              optional: true
        - name: METABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: metabase-admin-credentials
              key: password
              optional: true
        - name: OPENCOST_URL
          value: http://opencost.adhar-system.svc.cluster.local:9003
        - name: KARGO_URL
          value: http://kargo-api.adhar-system.svc.cluster.local:80
        - name: CODER_URL
          value: http://coder.adhar-system.svc.cluster.local:80
        - name: AIRBYTE_URL
          value: http://airbyte-airbyte-server-svc.adhar-system.svc.cluster.local:8001
        # No AIRBYTE_CLIENT_ID / AIRBYTE_CLIENT_SECRET (2026-10-24). Airbyte
        # now runs with its built-in auth OFF (Keycloak via oauth2-proxy is the
        # only login; data/airbyte values.yaml), and in auth mode NONE the
        # token endpoint the BFF used to mint from
        # (/api/v1/applications/token) has no backing service. Without the two
        # vars the console's tool registry picks `none` auth for Airbyte; what
        # keeps the API private is the airbyte package's NetworkPolicy, which
        # admits this pod (app=console). If Airbyte's auth is ever turned back
        # on, restore both vars from Secret airbyte-auth-secrets keys
        # instance-admin-client-id / instance-admin-client-secret.
        - name: FALCO_URL
          value: http://falco-falcosidekick-ui.adhar-system.svc.cluster.local:2802
        # Analytics: PostHog over the cluster network, authenticated with the
        # personal API key the posthog package's bootstrap Job mints for the
        # Console (application/posthog manifests/bootstrap-credentials.yaml).
        # Optional because posthog is off in the local profile — without the
        # Secret the registry falls back to `none` auth and the panel reports
        # PostHog's own answer instead of a synthetic 503.
        - name: POSTHOG_URL
          value: http://posthog-web.adhar-system.svc.cluster.local:8000
        - name: POSTHOG_TOKEN
          valueFrom:
            secretKeyRef:
              name: posthog-console-credentials
              key: api-key
              optional: true
        envFrom:
        - secretRef:
            name: console-env-vars
        - secretRef:
            name: gitea-credentials
        - secretRef:
            name: coder-credentials
            optional: true
        - secretRef:
            name: plane-api-token
            optional: true
        # Strapi's Content API: STRAPI_URL (adhar-controlplane) + STRAPI_TOKEN, generated
        # and registered by the strapi package (application/strapi
        # manifests/console-token.yaml), which also restarts the console once
        # when the Secret lands after it started.
        - secretRef:
            name: strapi-api-token
            optional: true
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 768Mi
        startupProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 3
          failureThreshold: 40
          # EXPLICIT 5s. Omitting it does not mean "no timeout" — Kubernetes
          # defaults timeoutSeconds to 1, and the platform forbids a 1-second
          # probe outright (TestNoProbeShipsAOneSecondTimeout) because a loaded
          # node fails a healthy check. That invariant greps the manifests, so it
          # could not see a default applied at admission: the live Deployment
          # showed `timeoutSeconds: 1` while this file declared nothing. Harbor's
          # database was killed 29 times by exactly this class of probe.
          timeoutSeconds: 5
        # 10s × 3: one replica serves every user, so a listener that has died
        # inside a live process is a full outage until this fires — at 20s × 3
        # the Gateway answered "upstream connect error … Connection refused"
        # for a minute or more (2026-10-26). From 0.1.162 the server also exits
        # on its own the moment its listener stops (server.ts).
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 10
          failureThreshold: 3
          timeoutSeconds: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
        volumeMounts:
        - name: ca-bundle
          mountPath: /shared
          readOnly: true
      serviceAccountName: console
      volumes:
      - name: ca-bundle
        emptyDir: {}
      - name: adhar-cert
        secret:
          secretName: adhar-cert
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: console
  namespace: adhar-system
spec:
  length: 36
  digits: 5
  symbols: 5
  symbolCharacters: /-+
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: console-oidc
  namespace: adhar-system
spec:
  secretStoreRef:
    name: keycloak
    kind: ClusterSecretStore
  refreshPolicy: CreatedOnce
  # 10s, not 30s: this is the RETRY cadence until keycloak-clients exists, and
  # the wait is the platform's critical path — Keycloak's wave-20 config Job
  # writes that Secret and several apps cannot go Healthy until their own ES has
  # picked it up. At 30s each consumer could sit on a Secret that was already
  # there for half a minute; the whole GitOps phase is a chain of such waits.
  refreshInterval: 10s
  target:
    name: console-env-vars
    template:
      engineVersion: v2
      data:
        POSTGRES_HOST: console-db-rw.adhar-system.svc.cluster.local
        POSTGRES_PORT: '5432'
        POSTGRES_DB: console
        POSTGRES_USER: console
        POSTGRES_PASSWORD: '{{.POSTGRES_PASSWORD}}'
        username: console
        password: '{{.POSTGRES_PASSWORD}}'
        ARGO_WORKFLOWS_URL: https://argo-workflows.adhar.localtest.me:8443
        AUTH_CLIENT_SECRET: '{{.ADHAR_CONSOLE_CLIENT_SECRET}}'
        AUTH_COOKIE_SECRET: adhar-console-session-signing-key-change-me-please-01
        DATABASE_URL: postgres://console:{{.POSTGRES_PASSWORD}}@console-db-rw.adhar-system.svc.cluster.local:5432/console
        ARGOCD_TOKEN: '{{ .ARGOCD_SESSION_TOKEN }}'
        ARGO_CD_URL: http://argo-cd-argocd-server.adhar-system.svc.cluster.local/api/v1/
  data:
  - secretKey: ARGOCD_SESSION_TOKEN
    remoteRef:
      key: keycloak-clients
      property: ARGOCD_SESSION_TOKEN
  - secretKey: ADHAR_CONSOLE_CLIENT_SECRET
    remoteRef:
      key: keycloak-clients
      property: ADHAR_CONSOLE_CLIENT_SECRET
  dataFrom:
  - sourceRef:
      generatorRef:
        apiVersion: generators.external-secrets.io/v1alpha1
        kind: Password
        name: console
    rewrite:
    - transform:
        template: POSTGRES_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitea-credentials
  namespace: adhar-system
spec:
  secretStoreRef:
    name: gitea
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: gitea-credentials
  data:
  - secretKey: GITEA_USERNAME
    remoteRef:
      key: gitea-credential
      property: username
  - secretKey: GITEA_PASSWORD
    remoteRef:
      key: gitea-credential
      property: password
  - secretKey: GITEA_TOKEN
    remoteRef:
      key: gitea-credential
      property: token
