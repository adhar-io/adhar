apiVersion: v1
kind: ServiceAccount
metadata:
  name: console
  namespace: adhar-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: console-argo-workflows
rules:
- apiGroups:
  - argoproj.io
  resources:
  - workflows
  verbs:
  - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: read-all
rules:
- apiGroups:
  - '*'
  resources:
  - '*'
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: console-argo-workflows
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: console-argo-workflows
subjects:
- kind: ServiceAccount
  name: console
  namespace: adhar-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: console-read-all
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: read-all
subjects:
- kind: ServiceAccount
  name: console
  namespace: adhar-system
---
apiVersion: v1
kind: Service
metadata:
  name: console
  namespace: adhar-system
spec:
  ports:
  - name: http
    port: 80
    targetPort: http
  selector:
    app: console
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: console-db
  namespace: adhar-system
  annotations:
    argocd.argoproj.io/sync-wave: '5'
    # CNPG Clusters are large once the operator populates them, so ArgoCD's
    # client-side apply overflows the 262144-byte last-applied annotation and
    # falls back to replace(--force). With ServerSideApply globally on, that
    # yields the invalid "--force cannot be used with --server-side" and the
    # whole app sync fails (blocking the console Deployment in a later wave).
    # Pinning ServerSideApply per-resource routes it through SSA/force-conflicts.
    argocd.argoproj.io/sync-options: ServerSideApply=true
spec:
  instances: 1
  storage:
    size: 1Gi
  bootstrap:
    initdb:
      database: console
      owner: console
      secret:
        name: console-env-vars
      postInitApplicationSQL:
      - ALTER ROLE console CREATEDB
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adhar-console
  namespace: adhar-system
  annotations:
    argocd.argoproj.io/sync-wave: '20'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: console
  template:
    metadata:
      labels:
        app: console
    spec:
      # Build a CA trust bundle = in-cluster API-server CA + the adhar gateway
      # CA, so the console's Deno runtime trusts BOTH the Kubernetes API (used
      # by the /api/svc/k8s proxy) and Keycloak's self-signed HTTPS endpoint
      # (server-side OIDC code exchange + JWKS).
      initContainers:
      - name: ca-bundle
        image: busybox:1.36
        command:
        - sh
        - -c
        - >-
          cat /var/run/secrets/kubernetes.io/serviceaccount/ca.crt /adhar-cert/ca.crt
          > /shared/ca-bundle.crt 2>/dev/null ||
          cat /var/run/secrets/kubernetes.io/serviceaccount/ca.crt /adhar-cert/tls.crt
          > /shared/ca-bundle.crt
        volumeMounts:
        - { name: ca-bundle, mountPath: /shared }
        - { name: adhar-cert, mountPath: /adhar-cert, readOnly: true }
      containers:
      - name: adhar-console
        # Track the latest published console build; Always-pull so pod restarts
        # pick up new pushes to the mutable :latest tag.
        image: ghcr.io/adhar-io/adhar-console:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
        env:
        - { name: PORT, value: '3000' }
        # SSO — dedicated confidential 'adhar-console' Keycloak client. This env
        # is what flips the console from "Keycloak not configured" to real SSO.
        # The client's access tokens carry aud=kubernetes + the groups claim, so
        # per-user kube-apiserver impersonation + RBAC work (see keycloak-config).
        - { name: KEYCLOAK_URL, value: 'https://keycloak.adhar.localtest.me:8443' }
        # In-cluster backchannel: the public KEYCLOAK_URL isn't routable from
        # inside the cluster (split-horizon DNS behind the gateway), so the
        # console does server-side OIDC (discovery/token/JWKS) against the
        # Keycloak Service directly. Token issuer + browser redirects stay public.
        - { name: KEYCLOAK_INTERNAL_URL, value: 'http://keycloak.adhar-system.svc.cluster.local:8080' }
        - { name: KEYCLOAK_REALM, value: 'adhar' }
        - { name: KEYCLOAK_CLIENT_ID, value: 'adhar-console' }
        - { name: AUTH_PUBLIC_URL, value: 'https://console.adhar.localtest.me:8443' }
        - { name: AUTH_SCOPES, value: 'openid profile email offline_access' }
        - { name: AUTH_COOKIE_SECURE, value: 'true' }
        - { name: K8S_API_URL, value: 'https://kubernetes.default.svc' }
        - { name: DENO_CERT, value: '/shared/ca-bundle.crt' }
        # AI assistant — point at an in-cluster OpenAI-compatible endpoint to
        # enable it (leave AI_BASE_URL empty to disable). AI_API_KEY (if needed)
        # comes from the console-env-vars Secret.
        - { name: AI_BASE_URL, value: '' }
        - { name: AI_MODEL, value: 'default' }
        # ── Backing platform tools ───────────────────────────────────────────
        # Each <TOOL>_URL is the tool's IN-CLUSTER Service URL, used by the BFF's
        # server-side proxy (/api/svc/<tool>) — the public *.localtest.me hosts
        # resolve to loopback inside the cluster (split-horizon), so a Service URL
        # is required. The console reports these as "configured" and the app
        # launcher derives the public browser URL from the cluster base domain,
        # so tiles both open in the browser AND back real server-side data.
        # Only tools actually deployed in this cluster are set; the rest stay
        # unconfigured (honest "not set up" tiles).
        - { name: GITEA_URL, value: 'http://gitea-http.adhar-system.svc.cluster.local:3000' }
        - { name: ARGOCD_URL, value: 'http://argo-cd-argocd-server.adhar-system.svc.cluster.local:80' }
        - { name: GRAFANA_URL, value: 'http://prometheus-grafana.adhar-system.svc.cluster.local:80' }
        - { name: PROMETHEUS_URL, value: 'http://prometheus-kube-prometheus-prometheus.adhar-system.svc.cluster.local:9090' }
        - { name: LOKI_URL, value: 'http://loki.adhar-system.svc.cluster.local:3100' }
        - { name: MIMIR_URL, value: 'http://mimir-gateway.adhar-system.svc.cluster.local:80' }
        - { name: TEMPO_URL, value: 'http://tempo.adhar-system.svc.cluster.local:3200' }
        - { name: VAULT_URL, value: 'http://vault.adhar-system.svc.cluster.local:8200' }
        - { name: TEKTON_URL, value: 'http://tekton-dashboard.adhar-system.svc.cluster.local:9097' }
        # AUTH_CLIENT_SECRET + AUTH_COOKIE_SECRET come from here (templated by
        # the console-oidc ExternalSecret from the keycloak-clients secret).
        envFrom:
        - secretRef:
            name: console-env-vars
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 768Mi
        startupProbe:
          httpGet: { path: /healthz, port: http }
          periodSeconds: 3
          failureThreshold: 40
        livenessProbe:
          httpGet: { path: /healthz, port: http }
          periodSeconds: 20
          timeoutSeconds: 3
        readinessProbe:
          httpGet: { path: /readyz, port: http }
          periodSeconds: 10
          timeoutSeconds: 5
        volumeMounts:
        - { name: ca-bundle, mountPath: /shared, readOnly: true }
      serviceAccountName: console
      volumes:
      - name: ca-bundle
        emptyDir: {}
      - name: adhar-cert
        secret:
          secretName: adhar-cert
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: console
  namespace: adhar-system
spec:
  length: 36
  digits: 5
  symbols: 5
  symbolCharacters: /-+
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: console-oidc
  namespace: adhar-system
spec:
  secretStoreRef:
    name: keycloak
    kind: ClusterSecretStore
  # CreatedOnce + 5m: retry until keycloak-clients exists, then freeze so the
  # generated Postgres password (which the DB was initialized with) never
  # rotates. A bare refreshInterval "0" is one attempt with NO retry — any ES
  # created before the Keycloak realm job finishes stays SecretSyncedError
  # forever.
  refreshPolicy: CreatedOnce
  refreshInterval: 5m
  target:
    name: console-env-vars
    template:
      engineVersion: v2
      data:
        POSTGRES_HOST: console-db-rw.adhar-system.svc.cluster.local
        POSTGRES_PORT: '5432'
        POSTGRES_DB: console
        POSTGRES_USER: console
        POSTGRES_PASSWORD: '{{.POSTGRES_PASSWORD}}'
        username: console
        password: '{{.POSTGRES_PASSWORD}}'
        ARGO_WORKFLOWS_URL: https://argo-workflows.adhar.localtest.me:8443
        # Adhar Console SSO — dedicated 'adhar-console' Keycloak client
        # (access token aud=kubernetes + groups for per-user k8s impersonation).
        # This client also has a service account with realm-management roles
        # (see keycloak-config.yaml), so the console reflects workspace teams /
        # org-roles into realm groups for cluster RBAC using AUTH_CLIENT_SECRET —
        # no separate admin credential needed (keycloak-admin.ts falls back to
        # the console's own clientId + secret).
        AUTH_CLIENT_SECRET: '{{.ADHAR_CONSOLE_CLIENT_SECRET}}'
        # Signs the console's HttpOnly session cookie (>=32 chars). Rotate for
        # a hardened deployment; stable value keeps sessions valid across pod
        # restarts / replicas.
        AUTH_COOKIE_SECRET: 'adhar-console-session-signing-key-change-me-please-01'
        # Console's own relational state (preferences, notification state). Uses
        # the CNPG 'console' database; the console auto-creates its tables.
        DATABASE_URL: 'postgres://console:{{.POSTGRES_PASSWORD}}@console-db-rw.adhar-system.svc.cluster.local:5432/console'
        ARGOCD_AUTH_TOKEN: argocd.token={{.ARGOCD_SESSION_TOKEN}}
        ARGO_CD_URL: http://argo-cd-argocd-server.adhar-system.svc.cluster.local/api/v1/
  data:
  - secretKey: ARGOCD_SESSION_TOKEN
    remoteRef:
      key: keycloak-clients
      property: ARGOCD_SESSION_TOKEN
  - secretKey: ADHAR_CONSOLE_CLIENT_SECRET
    remoteRef:
      key: keycloak-clients
      property: ADHAR_CONSOLE_CLIENT_SECRET
  dataFrom:
  - sourceRef:
      generatorRef:
        apiVersion: generators.external-secrets.io/v1alpha1
        kind: Password
        name: console
    rewrite:
    - transform:
        template: POSTGRES_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitea-credentials
  namespace: adhar-system
spec:
  secretStoreRef:
    name: gitea
    kind: ClusterSecretStore
  # 1h, not "0": sync-once is a single attempt with no retry, so a first sync
  # that races the source secret wedges as SecretSyncedError forever.
  refreshInterval: 1h
  target:
    name: gitea-credentials
  data:
  - secretKey: GITEA_USERNAME
    remoteRef:
      key: gitea-credential
      property: username
  - secretKey: GITEA_PASSWORD
    remoteRef:
      key: gitea-credential
      property: password
