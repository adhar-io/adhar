# Console permissions as Kubernetes RBAC.
#
# The Adhar Console authorizes every action with a SelfSubjectAccessReview made
# AS the signed-in user (their OIDC token, or the console ServiceAccount
# impersonating them). Kubernetes objects need nothing here — the built-in and
# CRD roles already answer "may I delete this Deployment". Console-level actions
# that are NOT Kubernetes objects (switching a platform package on, changing
# billing, approving a scan waiver, …) are VIRTUAL resources in the API group
# `console.adhar.io`. No CRD backs them: the RBAC authorizer matches rules by
# string, so the rules below are honoured by an SSAR for exactly that
# verb/resource whether or not the API exists. The console hides every action
# the user may not take and its BFF refuses the same request — both ask the
# same question, so they cannot disagree.
#
# Catalogue (source of truth: adhar-console packages/auth/src/console-permissions.ts;
# operator guide: adhar-console docs/rbac.md):
#
#   packages                update                  enable/disable platform packages
# * billing                 get | update            see | change billing
# * workspace-members       create | update | delete add | change role | remove
# * workspace-roles         create | update | delete custom workspace roles
# * workspace-teams         create | update | delete teams and team membership
# * workspace-projects      create | update | delete workspace projects
# * workspace-tokens        create | delete         organisation API tokens
# * workspace-approvals     approve                 decide approval requests
#   organizations           create                  self-service onboarding
# * organizations           update | delete         rename | delete the organisation
# * audit                   get                     workspace audit trail
#   scorecards              update                  re-run + apply scorecard fixes
#   resilience-runs         create                  start a resilience suite (namespaced)
#   scan-waivers            create | approve | self-approve
#   scan-policies           update
# * notifications-broadcast create                  notify every member
#   ai-knowledge            create | update         add notes | rate grounding
#   applications            create | delete         scaffold | delete (incl. repo)
#
# * = ORGANISATION-SCOPED. The console answers these itself and never asks the
# apiserver: it reads the Keycloak groups on the signed-in user's verified
# token for the organisation the request is working in. `org-<slug>` may read,
# `org-<slug>-admin` (whose members are all in `org-<slug>` too) may change,
# and platform-admin, platform-engineer and super-admin administer EVERY
# organisation. RBAC cannot say "admin of THIS organisation" — a
# ClusterRoleBinding holds in all of them — and the realm-wide ws-role-owner,
# ws-role-admin and ws-role-billing bindings that stood in for it made an
# owner of one organisation an administrator of every organisation. Those
# bindings are gone (their Keycloak groups are left alone and grant nothing),
# and a rule in this file for a starred check is ignored.
#
# Who holds the rest (groups carry the `oidc:` prefix, as in
# stack/packages/security/keycloak/manifests/k8s-rbac.yaml):
#
#   platform-admin, platform-engineer  everything — they are bound to
#                                      cluster-admin, whose `*` rules cover
#                                      console.adhar.io too.
#   super-admin                        everything (adhar-console-admin below).
#   every signed-in user               adhar-console-member: what any member
#                                      could do before these checks existed.
#   application-admin                  resilience runs, application delete.
#   ws-team-<org>.<team> (admin of its resilience runs IN those namespaces,
#     namespaces, Project composition) via aggregation into `admin`.
#   security-reviewer / security-admin waiver review; security-admin also
#                                      scan policy.
#
# Deploy order (2026-10-31). The console release that answers the starred
# checks from Keycloak ships FIRST; this file without the ws-role-* bindings
# ships after it, in the platform release whose `adhar upgrade` also moves the
# Team, Project and Environment compositions to the organisation-qualified
# team group `ws-team-<org>.<team>`. On start the console copies existing
# members and team memberships into `org-<slug>`, `org-<slug>-admin` and the
# qualified team groups, removing nothing (in the platform organisation
# `adhar`, whose admin group is admin of prod too, former workspace admins are
# reported to the platform admins instead of copied). Compositions that move
# before that copy lock team members out of their namespaces, and an older
# console reading this file leaves each organisation's own admins unable to
# administer it. Rolling the console back past that release needs the three
# bindings restored from git.
# Guard: TestConsoleRBACGrantsNothingToRealmWideWorkspaceRoleGroups.
#
# To tighten, delete or edit a binding — e.g. remove `organizations: create`
# from adhar-console-member to stop self-service organisation creation. To
# grant, bind one of these ClusterRoles (or your own) to a group. A starred
# check is granted by adding the person to `org-<slug>-admin` in Keycloak —
# the console's Settings → Members does exactly that — never here.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: adhar-console-admin
  labels:
    adhar.io/component: rbac
rules:
  - apiGroups: [console.adhar.io]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: adhar-console-admin
  labels:
    adhar.io/component: rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: adhar-console-admin
subjects:
  # platform-admin and platform-engineer already hold cluster-admin.
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: oidc:super-admin
---
# Every signed-in person. These are exactly the console actions that were open
# to any member before they became RBAC checks, so turning the checks on
# changed nothing for anyone; each line can now be removed to tighten.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: adhar-console-member
  labels:
    adhar.io/component: rbac
rules:
  # Organisation-scoped (starred above): the console answers these from
  # `org-<slug>` membership and no longer reads this rule; it stays for a
  # console older than that change, which still asks.
  - apiGroups: [console.adhar.io]
    resources: [billing, audit]
    verbs: [get]
  # Re-run scorecards and apply fixes; WHICH entities a member may fix is
  # still decided by ownership (the owning team's developers).
  - apiGroups: [console.adhar.io]
    resources: [scorecards]
    verbs: [update]
  # Request a waiver; the console additionally requires membership of the
  # project (list pods in its namespace). Reviewing is NOT here.
  - apiGroups: [console.adhar.io]
    resources: [scan-waivers]
    verbs: [create]
  - apiGroups: [console.adhar.io]
    resources: [ai-knowledge]
    verbs: [create, update]
  # Golden-path scaffolding and self-service organisation onboarding.
  - apiGroups: [console.adhar.io]
    resources: [applications, organizations]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: adhar-console-member
  labels:
    adhar.io/component: rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: adhar-console-member
subjects:
  # Added by the apiserver to every authenticated user, impersonated ones
  # included. ServiceAccounts match too, harmlessly: nothing but the console
  # reads console.adhar.io.
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: system:authenticated
---
# Application admins: run resilience suites anywhere, delete applications
# (whose source repository the console removes with Gitea admin credentials).
# Console actions only — this grants NO Kubernetes authority; see the empty
# adhar-oidc-application-admin binding in keycloak/manifests/k8s-rbac.yaml.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: adhar-console-application-admin
  labels:
    adhar.io/component: rbac
rules:
  - apiGroups: [console.adhar.io]
    resources: [resilience-runs]
    verbs: [create]
  - apiGroups: [console.adhar.io]
    resources: [applications]
    verbs: [delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: adhar-console-application-admin
  labels:
    adhar.io/component: rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: adhar-console-application-admin
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: oidc:application-admin
---
# Folded into the built-in `admin` role, which the Project composition binds
# to oidc:ws-team-<org>.<team> in the team's own namespace: a team may start
# resilience suites against its own apps (the console asks in the app's
# namespace) and nowhere else.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: adhar-console-namespace-admin
  labels:
    adhar.io/component: rbac
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
rules:
  - apiGroups: [console.adhar.io]
    resources: [resilience-runs]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: adhar-console-security-reviewer
  labels:
    adhar.io/component: rbac
rules:
  # Approve / reject / revoke waivers, decide paused scan gates, re-sync.
  - apiGroups: [console.adhar.io]
    resources: [scan-waivers]
    verbs: [approve]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: adhar-console-security-reviewer
  labels:
    adhar.io/component: rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: adhar-console-security-reviewer
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: oidc:security-reviewer
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: oidc:security-admin
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: adhar-console-security-admin
  labels:
    adhar.io/component: rbac
rules:
  - apiGroups: [console.adhar.io]
    resources: [scan-policies]
    verbs: [update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: adhar-console-security-admin
  labels:
    adhar.io/component: rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: adhar-console-security-admin
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: oidc:security-admin
