# Velero's object-store credential, rendered from RustFS's root-creds.
#
# This did not exist. The BackupStorageLocation referenced a Secret named
# `secret-key` (a name that reads like a KEY — almost certainly a transposed
# `name`/`key` pair), nothing created it, and Velero ran for weeks reporting
# Synced/Healthy in Argo CD while every scheduled backup went straight to
# FailedValidation:
#
#   BackupStorageLocation "default" is unavailable: unable to get credentials:
#   unable to get key for secret: Secret "secret-key" not found
#
# So the platform's stated DR story (ADR-0021: "Backup/DR is shipped, not
# suggested") produced zero cluster backups. The failure was invisible because
# Velero's own Deployment is healthy whether or not it can reach its store; only
# the Backup objects show it, and nothing surfaced those.
#
# The credential is the platform's S3 root credential (the same `root-creds`
# every other RustFS consumer reads) rendered into the AWS-INI file the
# velero-plugin-for-aws expects. `creationPolicy: Owner` so the Secret is
# removed with the package.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: velero-s3-credentials
  namespace: adhar-system
  annotations:
    # Before the BSL (wave 0) so the store validates on Velero's first check
    # rather than after a 1-minute retry.
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: gitea
    kind: ClusterSecretStore
  target:
    name: velero-s3-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # The plugin reads a profile file, not discrete keys. `[default]` is the
        # profile the BSL uses when none is named in its config.
        cloud: |
          [default]
          aws_access_key_id = {{ .accessKeyID }}
          aws_secret_access_key = {{ .secretAccessKey }}
  data:
    - secretKey: accessKeyID
      remoteRef: {key: root-creds, property: rootUser}
    - secretKey: secretAccessKey
      remoteRef: {key: root-creds, property: rootPassword}
