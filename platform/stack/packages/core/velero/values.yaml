resources:
  requests:
    memory: 128Mi
snapshotsEnabled: false
# File-system backups: without the node agent Velero only backs up Kubernetes
# objects — PVC file data was silently excluded from the DR story.
deployNodeAgent: true
# Opt-in file backup (see manifests/schedules.yaml for the full reasoning): the
# opt-out default had Velero copy the object store into itself and fill the disk.
defaultVolumesToFsBackup: false
initContainers:
  - name: velero-plugin-for-aws
    image: velero/velero-plugin-for-aws:v1.8.2
    imagePullPolicy: IfNotPresent
    volumeMounts:
      - mountPath: /target
        name: plugins
configuration:
  backupStorageLocation:
    - name: default
      provider: aws
      bucket: adhar-backups
      # Velero owns only this prefix. The bucket is shared with the CNPG WAL
      # archives (cnpg/<cluster>/…) and Velero refuses a backup store whose
      # root holds directories it did not create ("Backup store contains
      # invalid top-level directories: [cnpg]" -> BSL Unavailable).
      prefix: velero
      # The Secret produced by manifests/credentials.yaml (an ExternalSecret over
      # RustFS's root-creds), holding an AWS-INI profile under the `cloud` key.
      # Velero's `credential` is {Secret NAME, KEY WITHIN IT}: the earlier value
      # here named a Secret `secret-key` that nothing ever created, which left
      # the store Unavailable and every backup in FailedValidation.
      credential:
        name: velero-s3-credentials
        key: cloud
      config:
        region: minio
        s3Url: http://rustfs.adhar-system.svc.cluster.local:9000
        s3ForcePathStyle: "true"
