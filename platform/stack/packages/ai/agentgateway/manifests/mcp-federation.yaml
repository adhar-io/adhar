# agentgateway — MCP federation: seven tool servers behind ONE URL (ADR-0025).
#
# ---------------------------------------------------------------------------
# THE PROBLEM THIS SOLVES
# ---------------------------------------------------------------------------
# adhar-ai (ADR-0024) splits the platform's tools across seven per-domain MCP
# servers so that read/write authority is scoped per domain. That is right for
# authorization and wrong for clients: Claude Code, an IDE assistant or a ChatOps
# bot would have to be configured with seven separate MCP endpoints, seven sets
# of credentials, and would still have no single place where tool-level policy is
# enforced.
#
# agentgateway multiplexes them. One endpoint:
#
#     https://mcp.adhar.localtest.me:8443/mcp
#
# speaks MCP to the client, fans out to all seven servers, merges their tool
# lists into one, and routes each `tools/call` back to the server that owns it.
# JWT validation (security.yaml) and per-tool authorization happen here, once,
# in front of every tool — not seven times in seven Python services.
#
# ---------------------------------------------------------------------------
# TARGET CONTRACT (what adhar-ai's MCP images must serve)
# ---------------------------------------------------------------------------
# Service names and ports below are taken verbatim from
# adhar-ai/manifests/mcp-servers.yaml: seven ClusterIP Services named
# `adhar-ai-mcp-<domain>`, each with a single port named `http` on 8080.
#
# TRANSPORT: `StreamableHTTP` at `/mcp` — the transport of the current MCP spec
# revision, and what agentgateway 1.5 prefers. adhar-ai's README describes an
# `/mcp/sse` surface on the RUNTIME; these are the per-domain servers behind it.
# If those images ship SSE instead, change `protocol` to `SSE` here (the path
# then defaults to `/sse`) — it is a one-word change per target and no client
# configuration moves, which is exactly the point of putting a gateway here.
#
# `backendRef` (not `host`) is used deliberately, and the trade-off is worth
# stating because it is the opposite of the choice made for vLLM in
# llm-routes.yaml. A Service reference gives agentgateway real endpoint health
# and load balancing across replicas instead of round-robin DNS. The cost,
# VERIFIED on a live cluster: if ANY ONE of the seven Services is missing, the
# whole federated backend is rejected at config-translation time --
#
#   Accepted=False  TranslationError: failed to translate backend:
#                   mcp backendRef service adhar-system/adhar-ai-mcp-cluster not found
#
# and `failureMode: FailOpen` does NOT cover this: FailOpen is a RUNTIME
# behaviour for targets that fail to initialize or go away, not a config-time
# one. That is acceptable here -- and is why vLLM, which genuinely may not be
# installed, uses `host` instead -- because:
#
#   * adhar-ai is a hard `dependencies` entry in adhar-package.yaml; the two
#     packages are enabled together, so the Services are expected to exist;
#   * it SELF-HEALS. Also verified live: the moment the seven Services appear,
#     the backend re-translates and flips to Accepted=True with no intervention.
#     So a first boot where agentgateway's Application syncs ahead of adhar-ai's
#     is a transient rejected state, not a deadlock -- and during it the LLM
#     routes are entirely unaffected, because a rejected backend only takes out
#     the route that references it.
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: adhar-mcp
  namespace: adhar-system
  labels:
    app.kubernetes.io/name: adhar-mcp
    app.kubernetes.io/part-of: agentgateway
    adhar.io/component: ai
    adhar.io/plane: control
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  mcp:
    # FailOpen, NOT the FailClosed default. Seven targets means seven chances for
    # one rolling Deployment to take down every tool in the platform. With
    # FailOpen a restarting `cost` server costs you the cost tools for thirty
    # seconds; with FailClosed it costs you the entire MCP session. Availability
    # wins here because authority does not depend on it — a skipped target
    # exposes FEWER tools, never more.
    failureMode: FailOpen
    # Always prefix tool names with the target name, even when only one target is
    # healthy. `Conditional` (the default) would change tool names depending on
    # how many servers happen to be up, so a client's cached tool list and the
    # authorization CEL in security.yaml would both break intermittently. With
    # `Always`, a tool is permanently `gitops_open_pull_request`, and the
    # authorization rules can key off that stable prefix.
    prefixMode: Always
    # Stateful (the default): MCP sessions are pinned to a proxy replica so
    # server-side session state survives a multi-call tool sequence.
    sessionRouting: Stateful
    targets:
      # --- read-only domains -------------------------------------------------
      - name: cluster
        static:
          backendRef:
            name: adhar-ai-mcp-cluster
          port: 8080
          path: /mcp
          protocol: StreamableHTTP
      - name: observability
        static:
          backendRef:
            name: adhar-ai-mcp-observability
          port: 8080
          path: /mcp
          protocol: StreamableHTTP
      - name: cost
        static:
          backendRef:
            name: adhar-ai-mcp-cost
          port: 8080
          path: /mcp
          protocol: StreamableHTTP
      # --- PR-authoring (write) domains --------------------------------------
      # "Write" here means "opens a Gitea PR" — ADR-0024 grants no cluster or
      # cloud mutation tool anywhere. security.yaml still restricts these to
      # platform-admin, because opening a PR against the platform repos is a
      # privileged act even when a human merges it.
      - name: gitops
        static:
          backendRef:
            name: adhar-ai-mcp-gitops
          port: 8080
          path: /mcp
          protocol: StreamableHTTP
      - name: provision
        static:
          backendRef:
            name: adhar-ai-mcp-provision
          port: 8080
          path: /mcp
          protocol: StreamableHTTP
      - name: security
        static:
          backendRef:
            name: adhar-ai-mcp-security
          port: 8080
          path: /mcp
          protocol: StreamableHTTP
      - name: catalog
        static:
          backendRef:
            name: adhar-ai-mcp-catalog
          port: 8080
          path: /mcp
          protocol: StreamableHTTP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agentgateway-mcp
  namespace: adhar-system
  labels:
    app.kubernetes.io/name: agentgateway-mcp
    app.kubernetes.io/part-of: agentgateway
    adhar.io/component: ai
    adhar.io/plane: control
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  parentRefs:
    - name: adhar-ai-gateway
      namespace: adhar-system
  # No hostname here: this route is attached to the INTERNAL agentgateway
  # Gateway, which is only reachable via the Cilium edge. The public hostname
  # split (ai.<host> vs mcp.<host>) happens at the edge in httproute.yaml, which
  # rewrites mcp.<host>/ to /mcp before forwarding, so this path match is what
  # both `mcp.<host>/` and `ai.<host>/mcp` land on.
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /mcp
      backendRefs:
        - name: adhar-mcp
          group: agentgateway.dev
          kind: AgentgatewayBackend
