# agentgateway — Grafana dashboard for the AI data plane (ADR-0025).
#
# Discovered by the Grafana sidecar through `grafana_dashboard: "1"` and filed
# under the "Platform" folder, exactly like the dashboards in
# observability/kube-prometheus/manifests/dashboard-*.yaml.
#
# EVERY metric name and EVERY label used below is taken from agentgateway's own
# data-plane metrics reference and its bundled dashboard — nothing is inferred:
#
#   agentgateway_requests_total                              (status, route, gateway)
#   agentgateway_request_duration_seconds_bucket             (le, route, gateway)
#   agentgateway_gen_ai_client_token_usage_sum               (gen_ai_token_type,
#                                                             gen_ai_request_model,
#                                                             gen_ai_system)
#   agentgateway_gen_ai_client_cost_usd_total                (gen_ai_request_model)
#   agentgateway_gen_ai_server_time_to_first_token_bucket    (le, gen_ai_request_model)
#   agentgateway_gen_ai_server_request_duration_bucket       (le, gen_ai_request_model)
#   agentgateway_gen_ai_server_time_per_output_token_bucket  (le, gen_ai_request_model)
#   agentgateway_guardrail_checks_total
#   agentgateway_mcp_requests_total                          (method, server, resource)
#   agentgateway_build_info                                  (namespace — drives $namespace)
#
# All of these are DATA-PLANE series on the provisioned proxy pods (port 15020),
# collected by the PodMonitor in servicemonitor.yaml. Counters and histograms are
# not pre-initialized: a freshly installed gateway shows empty panels until the
# first request of each kind arrives. That is upstream behaviour, not a broken
# dashboard.
#
# This REPLACES the generic dashboard the chart can ship
# (monitoring.grafanaDashboard) with one built around the questions this platform
# actually asks: what is AI costing, which model is answering, what did the
# guardrails catch, and which governed tool is being called.
apiVersion: v1
kind: ConfigMap
metadata:
  name: adhar-dashboard-agentgateway
  namespace: adhar-system
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: adhar-observability
    adhar.io/component: ai
  annotations:
    grafana_folder: "Platform"
    # Wave 10: the repo's first-boot ordering rule for every monitoring object.
    argocd.argoproj.io/sync-wave: "10"
data:
  agentgateway.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "graphTooltip": 1,
      "schemaVersion": 39,
      "title": "Adhar AI Gateway (agentgateway)",
      "uid": "adhar-agentgateway",
      "tags": [
        "adhar",
        "ai",
        "agentgateway",
        "llm",
        "mcp"
      ],
      "timezone": "browser",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "refresh": "30s",
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": {},
            "hide": 0,
            "label": "Data source",
            "refresh": 1,
            "regex": ""
          },
          {
            "name": "namespace",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "query": {
              "query": "label_values(agentgateway_build_info, namespace)",
              "refId": "ns"
            },
            "definition": "label_values(agentgateway_build_info, namespace)",
            "current": {
              "text": "adhar-system",
              "value": "adhar-system"
            },
            "includeAll": true,
            "multi": true,
            "refresh": 2,
            "sort": 1,
            "hide": 0,
            "label": "Namespace"
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Traffic \u2014 all AI data plane requests",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Requests / sec",
          "description": "agentgateway_requests_total across every route on the AI data plane (LLM + MCP).",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "decimals": 2,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "none",
            "graphMode": "area",
            "textMode": "auto",
            "justifyMode": "auto",
            "orientation": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum(rate(agentgateway_requests_total{namespace=~\"$namespace\"}[$__rate_interval]))",
              "legendFormat": "rps",
              "range": true,
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Error ratio (5xx)",
          "description": "Fraction of requests answered 5xx. A missing upstream (e.g. the optional vLLM backend with ai/vllm not installed) shows up here.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 4,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 2,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "none",
            "graphMode": "area",
            "textMode": "auto",
            "justifyMode": "auto",
            "orientation": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum(rate(agentgateway_requests_total{namespace=~\"$namespace\",status=~\"5..\"}[$__rate_interval])) / clamp_min(sum(rate(agentgateway_requests_total{namespace=~\"$namespace\"}[$__rate_interval])), 1e-9)",
              "legendFormat": "5xx ratio",
              "range": true,
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Rate-limited (429) / sec",
          "description": "Requests rejected by the token/request budgets in guardrails.yaml. Sustained non-zero means a budget is too tight.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 8,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "decimals": 2,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "none",
            "graphMode": "area",
            "textMode": "auto",
            "justifyMode": "auto",
            "orientation": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum(rate(agentgateway_requests_total{namespace=~\"$namespace\",status=\"429\"}[$__rate_interval]))",
              "legendFormat": "429/s",
              "range": true,
              "refId": "A"
            }
          ]
        },
        {
          "id": 5,
          "type": "stat",
          "title": "LLM spend (USD, range)",
          "description": "Realized cost over the selected time range, from agentgateway's model cost catalog. Self-hosted vLLM contributes nothing, which is the point of routing local/* models to it.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 12,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "currencyUSD",
              "decimals": 3,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "none",
            "graphMode": "area",
            "textMode": "auto",
            "justifyMode": "auto",
            "orientation": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum(increase(agentgateway_gen_ai_client_cost_usd_total{namespace=~\"$namespace\"}[$__range]))",
              "legendFormat": "usd",
              "range": true,
              "refId": "A"
            }
          ]
        },
        {
          "id": 6,
          "type": "stat",
          "title": "Guardrail hits / sec",
          "description": "agentgateway_guardrail_checks_total \u2014 secret/PII regex guards firing. With the shipped Audit/Mask defaults these do not block; use this to decide when to switch them to Reject.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 16,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 2,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "none",
            "graphMode": "area",
            "textMode": "auto",
            "justifyMode": "auto",
            "orientation": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum(rate(agentgateway_guardrail_checks_total{namespace=~\"$namespace\"}[$__rate_interval]))",
              "legendFormat": "checks/s",
              "range": true,
              "refId": "A"
            }
          ]
        },
        {
          "id": 7,
          "type": "stat",
          "title": "MCP calls / sec",
          "description": "All MCP protocol requests: initialize, tools/list, tools/call across the seven federated servers.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 20,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "decimals": 2,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "none",
            "graphMode": "area",
            "textMode": "auto",
            "justifyMode": "auto",
            "orientation": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum(rate(agentgateway_mcp_requests_total{namespace=~\"$namespace\"}[$__rate_interval]))",
              "legendFormat": "mcp/s",
              "range": true,
              "refId": "A"
            }
          ]
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Request rate by status",
          "description": "Split by HTTP status. 401/403 = JWT or authorization policy (security.yaml); 429 = budget (guardrails.yaml).",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 5
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 40,
                "showPoints": "never",
                "axisLabel": "",
                "stacking": {
                  "mode": "normal",
                  "group": "A"
                }
              },
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "lastNotNull"
              ],
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum by (status) (rate(agentgateway_requests_total{namespace=~\"$namespace\"}[$__rate_interval]))",
              "legendFormat": "{{status}}",
              "range": true,
              "refId": "A"
            }
          ]
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Request rate by route",
          "description": "agentgateway-llm vs agentgateway-mcp: how the AI data plane's traffic divides between completions and tool calls.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 5
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 12,
                "showPoints": "never",
                "axisLabel": "",
                "stacking": {
                  "mode": "none",
                  "group": "A"
                }
              },
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "lastNotNull"
              ],
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum by (route) (rate(agentgateway_requests_total{namespace=~\"$namespace\"}[$__rate_interval]))",
              "legendFormat": "{{route}}",
              "range": true,
              "refId": "A"
            }
          ]
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Gateway latency (p50 / p95 / p99)",
          "description": "End-to-end time through the proxy. For LLM traffic this is dominated by the provider, not by agentgateway \u2014 use the LLM panels below to separate the two.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 13
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 12,
                "showPoints": "never",
                "axisLabel": "",
                "stacking": {
                  "mode": "none",
                  "group": "A"
                }
              },
              "color": {
                "mode": "palette-classic"
              },
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "lastNotNull"
              ],
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "histogram_quantile(0.50, sum by (le) (rate(agentgateway_request_duration_seconds_bucket{namespace=~\"$namespace\"}[$__rate_interval])))",
              "legendFormat": "p50",
              "range": true,
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(agentgateway_request_duration_seconds_bucket{namespace=~\"$namespace\"}[$__rate_interval])))",
              "legendFormat": "p95",
              "range": true,
              "refId": "B"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "histogram_quantile(0.99, sum by (le) (rate(agentgateway_request_duration_seconds_bucket{namespace=~\"$namespace\"}[$__rate_interval])))",
              "legendFormat": "p99",
              "range": true,
              "refId": "C"
            }
          ]
        },
        {
          "id": 11,
          "type": "row",
          "title": "LLM \u2014 tokens, cost and latency per model / provider",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 21
          },
          "panels": []
        },
        {
          "id": 12,
          "type": "timeseries",
          "title": "Input tokens / sec by model and provider",
          "description": "gen_ai_system is the provider (anthropic / openai / the self-hosted vLLM backend); gen_ai_request_model is the model the caller asked for. This is the panel that answers 'who is spending the context window'.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 22
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 40,
                "showPoints": "never",
                "axisLabel": "",
                "stacking": {
                  "mode": "normal",
                  "group": "A"
                }
              },
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "lastNotNull"
              ],
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum by (gen_ai_system, gen_ai_request_model) (rate(agentgateway_gen_ai_client_token_usage_sum{namespace=~\"$namespace\",gen_ai_token_type=\"input\"}[$__rate_interval]))",
              "legendFormat": "{{gen_ai_system}} \u00b7 {{gen_ai_request_model}}",
              "range": true,
              "refId": "A"
            }
          ]
        },
        {
          "id": 13,
          "type": "timeseries",
          "title": "Output tokens / sec by model and provider",
          "description": "Output tokens are the expensive half on every hosted provider. A model whose output rate dwarfs its input rate is generating long answers \u2014 often a prompt problem, not a capacity problem.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 22
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 40,
                "showPoints": "never",
                "axisLabel": "",
                "stacking": {
                  "mode": "normal",
                  "group": "A"
                }
              },
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "lastNotNull"
              ],
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum by (gen_ai_system, gen_ai_request_model) (rate(agentgateway_gen_ai_client_token_usage_sum{namespace=~\"$namespace\",gen_ai_token_type=\"output\"}[$__rate_interval]))",
              "legendFormat": "{{gen_ai_system}} \u00b7 {{gen_ai_request_model}}",
              "range": true,
              "refId": "A"
            }
          ]
        },
        {
          "id": 14,
          "type": "timeseries",
          "title": "Cumulative USD cost by model",
          "description": "Realized spend per model. Models served by the in-cluster vLLM are absent or zero \u2014 the visible gap between a claude-* line and a local/* line is the saving from routing a task to the local model.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 30
          },
          "fieldConfig": {
            "defaults": {
              "unit": "currencyUSD",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 40,
                "showPoints": "never",
                "axisLabel": "",
                "stacking": {
                  "mode": "normal",
                  "group": "A"
                }
              },
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "lastNotNull"
