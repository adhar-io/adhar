    controller-gen.kubebuilder.io/version: v0.21.0
    argocd.argoproj.io/sync-wave: '-5'
  name: k8sgpts.core.k8sgpt.ai
spec:
  group: core.k8sgpt.ai
  names:
    kind: K8sGPT
    listKind: K8sGPTList
    plural: k8sgpts
    singular: k8sgpt
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: K8sGPT is the Schema for the k8sgpts API
        properties:
          apiVersion:
            description: 'APIVersion defines the versioned schema of this representation
              of an object.

              Servers should convert recognized schemas to the latest internal value,
              and

              may reject unrecognized values.

              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources'
            type: string
          kind:
            description: 'Kind is a string value representing the REST resource this
              object represents.

              Servers may infer this from the endpoint the client submits requests
              to.

              Cannot be updated.

              In CamelCase.

              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds'
            type: string
          metadata:
            type: object
          spec:
            description: K8sGPTSpec defines the desired state of K8sGPT
            properties:
              ai:
                properties:
                  anonymized:
                    default: true
                    type: boolean
                  autoRemediation:
                    properties:
                      enabled:
                        default: false
                        type: boolean
                      resources:
                        default:
                        - Pod
                        - Deployment
                        description: 'Resources is an exact allowlist of target resource
                          selectors. Use Kind for

                          legacy matching, group/Kind (for example apps/Deployment),
                          or

                          group/version/Kind (for example apps/v1/Deployment or v1/ConfigMap).

                          An enabled selector only makes a finding eligible; automatic
                          execution

                          remains deny-by-default until a matching GVK policy is registered.'
                        items:
                          type: string
                        type: array
                      similarityRequirement:
                        default: '90'
                        description: 'Deprecated: textual similarity is retained for
                          API compatibility only.

                          Execution is authorized by the deterministic remediation
                          policy.'
                        type: string
                    required:
                    - enabled
                    - resources
                    - similarityRequirement
                    type: object
                  azureAPIType:
                    enum:
                    - AZURE
                    - AZURE_AD
                    - CLOUDFLARE_AZURE
                    type: string
                  backOff:
                    properties:
                      enabled:
                        default: false
                        type: boolean
                      maxRetries:
                        default: 5
                        type: integer
                    required:
                    - enabled
                    - maxRetries
                    type: object
                  backend:
                    default: openai
                    enum:
                    - ibmwatsonxai
                    - openai
                    - deepseek
                    - localai
                    - azureopenai
                    - amazonbedrock
                    - cohere
                    - amazonsagemaker
                    - google
                    - googlevertexai
                    - customrest
                    type: string
                  baseUrl:
                    type: string
                  customHeaders:
                    description: 'Custom headers to be passed to the AI provider

                      Format: "Key1:Value1,Key2:Value2"'
                    type: string
                  enabled:
                    type: boolean
                  engine:
                    type: string
                  language:
                    default: english
                    type: string
                  maxTokens:
                    default: '2048'
                    type: string
                  model:
                    default: gpt-4o-mini
                    type: string
                  providerId:
                    type: string
                  proxyEndpoint:
                    type: string
                  region:
                    type: string
                  secret:
                    properties:
                      key:
                        type: string
                      name:
                        type: string
                    type: object
                  topk:
                    default: '50'
                    type: string
                required:
                - backend
                type: object
              analysis:
                properties:
                  interval:
                    description: Interval is the time between analysis runs
                    pattern: ^[0-9]+[smh]$
                    type: string
                type: object
              containerSecurityContext:
                description: 'ContainerSecurityContext defines the security options
                  the container should run with.

                  This allows setting security constraints like runAsNonRoot, readOnlyRootFilesystem,
                  etc.'
                properties:
                  allowPrivilegeEscalation:
                    description: 'AllowPrivilegeEscalation controls whether a process
                      can gain more

                      privileges than its parent process. This bool directly controls
                      if

                      the no_new_privs flag will be set on the container process.

                      AllowPrivilegeEscalation is true always when the container is:

                      1) run as Privileged

                      2) has CAP_SYS_ADMIN

                      Note that this field cannot be set when spec.os.name is windows.'
                    type: boolean
                  appArmorProfile:
                    description: 'appArmorProfile is the AppArmor options to use by
                      this container. If set, this profile

                      overrides the pod''s appArmorProfile.

                      Note that this field cannot be set when spec.os.name is windows.'
                    properties:
                      localhostProfile:
                        description: 'localhostProfile indicates a profile loaded
                          on the node that should be used.

                          The profile must be preconfigured on the node to work.

                          Must match the loaded name of the profile.

                          Must be set if and only if type is "Localhost".'
                        type: string
                      type:
                        description: "type indicates which kind of AppArmor profile\
                          \ will be applied.\nValid options are:\n  Localhost - a\
                          \ profile pre-loaded on the node.\n  RuntimeDefault - the\
                          \ container runtime's default profile.\n  Unconfined - no\
                          \ AppArmor enforcement."
                        type: string
                    required:
                    - type
                    type: object
                  capabilities:
                    description: 'The capabilities to add/drop when running containers.

                      Defaults to the default set of capabilities granted by the container
                      runtime.

                      Note that this field cannot be set when spec.os.name is windows.'
                    properties:
                      add:
                        description: Added capabilities
                        items:
                          description: Capability represent POSIX capabilities type
                          type: string
                        type: array
                        x-kubernetes-list-type: atomic
                      drop:
                        description: Removed capabilities
                        items:
                          description: Capability represent POSIX capabilities type
                          type: string
                        type: array
                        x-kubernetes-list-type: atomic
                    type: object
                  privileged:
                    description: 'Run container in privileged mode.

                      Processes in privileged containers are essentially equivalent
                      to root on the host.

                      Defaults to false.

                      Note that this field cannot be set when spec.os.name is windows.'
                    type: boolean
                  procMount:
                    description: 'procMount denotes the type of proc mount to use
                      for the containers.

                      The default value is Default which uses the container runtime
                      defaults for

                      readonly paths and masked paths.

                      This requires the ProcMountType feature flag to be enabled.

                      Note that this field cannot be set when spec.os.name is windows.'
                    type: string
                  readOnlyRootFilesystem:
                    description: 'Whether this container has a read-only root filesystem.

                      Default is false.

                      Note that this field cannot be set when spec.os.name is windows.'
                    type: boolean
                  runAsGroup:
                    description: 'The GID to run the entrypoint of the container process.

                      Uses runtime default if unset.

                      May also be set in PodSecurityContext.  If set in both SecurityContext
                      and

                      PodSecurityContext, the value specified in SecurityContext takes
                      precedence.

                      Note that this field cannot be set when spec.os.name is windows.'
                    format: int64
                    type: integer
                  runAsNonRoot:
                    description: 'Indicates that the container must run as a non-root
                      user.

                      If true, the Kubelet will validate the image at runtime to ensure
                      that it

                      does not run as UID 0 (root) and fail to start the container
                      if it does.

                      If unset or false, no such validation will be performed.

                      May also be set in PodSecurityContext.  If set in both SecurityContext
                      and

                      PodSecurityContext, the value specified in SecurityContext takes
                      precedence.'
                    type: boolean
                  runAsUser:
                    description: 'The UID to run the entrypoint of the container process.

                      Defaults to user specified in image metadata if unspecified.

                      May also be set in PodSecurityContext.  If set in both SecurityContext
                      and

                      PodSecurityContext, the value specified in SecurityContext takes
                      precedence.

                      Note that this field cannot be set when spec.os.name is windows.'
                    format: int64
                    type: integer
                  seLinuxOptions:
                    description: 'The SELinux context to be applied to the container.

                      If unspecified, the container runtime will allocate a random
                      SELinux context for each

                      container.  May also be set in PodSecurityContext.  If set in
                      both SecurityContext and

                      PodSecurityContext, the value specified in SecurityContext takes
                      precedence.

                      Note that this field cannot be set when spec.os.name is windows.'
                    properties:
                      level:
                        description: Level is SELinux level label that applies to
                          the container.
                        type: string
                      role:
                        description: Role is a SELinux role label that applies to
                          the container.
                        type: string
                      type:
                        description: Type is a SELinux type label that applies to
                          the container.
                        type: string
                      user:
                        description: User is a SELinux user label that applies to
                          the container.
                        type: string
                    type: object
                  seccompProfile:
                    description: 'The seccomp options to use by this container. If
                      seccomp options are

                      provided at both the pod & container level, the container options

                      override the pod options.

                      Note that this field cannot be set when spec.os.name is windows.'
                    properties:
                      localhostProfile:
                        description: 'localhostProfile indicates a profile defined
                          in a file on the node should be used.

                          The profile must be preconfigured on the node to work.

                          Must be a descending path, relative to the kubelet''s configured
                          seccomp profile location.

                          Must be set if type is "Localhost". Must NOT be set for
                          any other type.'
                        type: string
                      type:
                        description: 'type indicates which kind of seccomp profile
                          will be applied.

                          Valid options are:


                          Localhost - a profile defined in a file on the node should
                          be used.

                          RuntimeDefault - the container runtime default profile should
                          be used.

                          Unconfined - no profile should be applied.'
                        type: string
                    required:
                    - type
                    type: object
                  windowsOptions:
                    description: 'The Windows specific settings applied to all containers.

                      If unspecified, the options from the PodSecurityContext will
                      be used.

                      If set in both SecurityContext and PodSecurityContext, the value
                      specified in SecurityContext takes precedence.

                      Note that this field cannot be set when spec.os.name is linux.'
                    properties:
                      gmsaCredentialSpec:
                        description: 'GMSACredentialSpec is where the GMSA admission
                          webhook

                          (https://github.com/kubernetes-sigs/windows-gmsa) inlines
                          the contents of the

                          GMSA credential spec named by the GMSACredentialSpecName
                          field.'
                        type: string
                      gmsaCredentialSpecName:
                        description: GMSACredentialSpecName is the name of the GMSA
                          credential spec to use.
                        type: string
                      hostProcess:
                        description: 'HostProcess determines if a container should
                          be run as a ''Host Process'' container.

                          All of a Pod''s containers must have the same effective
                          HostProcess value

                          (it is not allowed to have a mix of HostProcess containers
                          and non-HostProcess containers).

                          In addition, if HostProcess is true then HostNetwork must
                          also be set to true.'
                        type: boolean
                      runAsUserName:
                        description: 'The UserName in Windows to run the entrypoint
                          of the container process.

                          Defaults to the user specified in image metadata if unspecified.

                          May also be set in PodSecurityContext. If set in both SecurityContext
                          and

                          PodSecurityContext, the value specified in SecurityContext
                          takes precedence.'
                        type: string
                    type: object
                type: object
              customAnalyzers:
                items:
                  properties:
                    connection:
                      properties:
                        port:
                          type: integer
                        url:
                          type: string
                      type: object
                    name:
