# llm-d model server — CPU PROFILE (appset element "llm-d-cpu").
#
# vLLM's OFFICIAL CPU build serving a small instruction model, so the whole
# stack — router, EPP scheduling, agentgateway routing on `local/*` — is
# exercisable on the platform's CPU droplets and on Kind. The GPU profile in
# ../gpu/install.yaml serves Qwen3.6-27B on one accelerator; enable EXACTLY ONE
# of the two (both Deployments are named `llm-d-decode` and both claim the
# `llm-d-model-cache` PVC).
#
# Labels are the contract with the router (../../values.yaml
# router.modelServers.matchLabels): the EPP discovers replicas by
# `llm-d.ai/inferenceServing=true,llm-d.ai/model=adhar-local`. The pool label is
# deliberately NOT the model name — it names the platform's local pool, so
# swapping the profile (CPU today, GPU tomorrow) re-points nothing: the router,
# agentgateway's `local/*` route and adhar-ai's secondary model all stay as
# they are.
#
# Two served names: the real one, `local/Qwen/Qwen2.5-0.5B-Instruct`, for a
# caller that wants THIS model; and the alias `local/default`, which is what
# adhar-ai names as its self-hosted fallback (ADHAR_AI_LLM_SECONDARY_MODEL)
# so that the runtime does not have to know which profile is installed.
#
# Model: Qwen2.5-0.5B-Instruct — open weights, no HF token required, ~1 GB, and
# it answers in seconds on 4 CPUs, which is what makes an end-to-end proof of the
# agentic loop against self-hosted inference practical.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: llm-d-model-cache
  namespace: adhar-system
  # SAME WAVE as llm-d-decode, the only consumer. A WaitForFirstConsumer PVC
  # cannot bind until a pod mounts it, so leaving it in an earlier wave than its
  # consumer deadlocks the sync permanently: Argo CD waits for the PVC to become
  # Bound before applying the Deployment that would bind it. The default
  # StorageClass on GCP (pd.csi.storage.gke.io) is WaitForFirstConsumer, which is
  # why this only showed up there and not on clusters that bind Immediately.
  annotations: {argocd.argoproj.io/sync-wave: "1"}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 10Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-d-decode
  namespace: adhar-system
  labels:
    app.kubernetes.io/name: llm-d-decode
    app.kubernetes.io/part-of: llm-d
    llm-d.ai/inferenceServing: "true"
    llm-d.ai/model: adhar-local
  annotations: {argocd.argoproj.io/sync-wave: "1"}
spec:
  replicas: 1
  strategy: {type: Recreate}   # single RWO model cache
  selector:
    matchLabels:
      llm-d.ai/inferenceServing: "true"
      llm-d.ai/model: adhar-local
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llm-d-decode
        app.kubernetes.io/part-of: llm-d
        llm-d.ai/inferenceServing: "true"
        llm-d.ai/model: adhar-local
    spec:
      enableServiceLinks: false
      securityContext: {runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, runAsNonRoot: true}
      containers:
        - name: vllm
          image: vllm/vllm-openai-cpu:v0.29.0
          command: ["vllm", "serve"]
          args:
            - "Qwen/Qwen2.5-0.5B-Instruct"
            # The model NAME clients send. agentgateway strips nothing, so the
            # runtime's `local/Qwen/Qwen2.5-0.5B-Instruct` must be served as-is.
            - "--served-model-name"
            - "local/Qwen/Qwen2.5-0.5B-Instruct"
            # The profile-agnostic alias adhar-ai falls back to. Same name on
            # the GPU profile, so the runtime never learns which one is on.
            - "local/default"
            - "--port=8000"
            # The agent runtime sends its whole MCP toolbox (27 tool schemas,
            # ~4k tokens) with every turn; at 4096 vLLM answered every request
            # 400 "maximum context length is 4096 tokens" (2026-09-15). Qwen2.5
            # supports 32k; VLLM_CPU_KVCACHE_SPACE below sizes the CPU KV cache.
            - "--max-model-len=32768"
            # float32, not bfloat16: the platform's cloud nodes (GCP e2 = AMD
            # EPYC Zen 2, AVX2 only; no AVX-512 BF16 or AMX) have no native
            # bf16, so vLLM's CPU backend emulated it — 2–4 tokens/s and
            # 60-second engine stalls under an agent turn (2026-09-24). fp32 is
            # native everywhere; a 0.5B model is 2 GB of weights at fp32.
            - "--dtype=float32"
            # The agent runtime sends tools with every turn (MCP toolbox) and
            # tool_choice=auto; without a tool-call parser vLLM answers 400
            # ("tool_choice=auto requires --enable-auto-tool-choice"), which
            # is what the runtime's first local-model run hit on 2026-09-15.
            # hermes is the parser for the Qwen2.5 family.
            - "--enable-auto-tool-choice"
            - "--tool-call-parser=hermes"
          env:
            # The image runs as a non-root user with no HOME; Triton's kernel
            # cache defaults to ~/.triton and the worker died with
            # "PermissionError: '/.triton'" on the 2026-09-15 DO bring-up.
            # Everything cache-like lives on the model-cache volume.
            - {name: HOME, value: /cache}
            - {name: TRITON_CACHE_DIR, value: /cache/triton}
            - {name: XDG_CACHE_HOME, value: /cache/xdg}
            - {name: VLLM_CPU_KVCACHE_SPACE, value: "4"}
            - {name: VLLM_CPU_NUM_OF_RESERVED_CPU, value: "1"}
            # Pin the OpenMP workers to as many cores as the CFS quota below
            # allows. Unset, vLLM binds one thread per VISIBLE core (8 on an
            # e2-standard-8) inside a 4-CPU quota, so the threads throttle each
            # other and the engine core misses its shared-memory heartbeat
            # ("No available shared memory broadcast block found in 60 seconds").
            - {name: VLLM_CPU_OMP_THREADS_BIND, value: "0-5"}
            - {name: HF_HOME, value: /cache/hf}
            - {name: VLLM_CACHE_ROOT, value: /cache/vllm}
          ports:
            - {name: http, containerPort: 8000}
          volumeMounts:
            - {name: cache, mountPath: /cache}
            - {name: dshm, mountPath: /dev/shm}
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 15
            failureThreshold: 120   # first start downloads the weights
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
          resources:
            # Six of the node's eight CPUs: generation speed on CPU is linear
            # in cores, and this is the only thing on the platform that turns
            # a question into an answer.
            requests: {cpu: "3", memory: 6Gi}
            limits: {cpu: "6", memory: 10Gi}
      volumes:
        - name: cache
          persistentVolumeClaim: {claimName: llm-d-model-cache}
        - name: dshm
          emptyDir: {medium: Memory, sizeLimit: 2Gi}
