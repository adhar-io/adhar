# llm-d router — RENDERED from oci://ghcr.io/llm-d/charts/llm-d-router-standalone
# v0.10.0 with ../values.yaml (`helm template llm-d <chart> -n adhar-system
# -f values.yaml`). Regenerate with generate-manifests.sh; do not hand-edit.
#
# What this is: the llm-d "router" — an endpoint picker (EPP) that schedules
# each request onto the best vLLM replica (prefix-cache affinity, load) with an
# agentgateway sidecar as the proxy in front of it. Standalone mode: no Gateway
# API objects of its own; the platform's agentgateway data plane (ai/agentgateway)
# sends `local/*` model traffic to Service `llm-d-epp:8081`.
---
# Source: llm-d-router-standalone/templates/epp.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: llm-d-epp
  namespace: adhar-system
  labels:
    app.kubernetes.io/name: llm-d-epp
    app.kubernetes.io/version: "v0.10.0"
---
# Source: llm-d-router-standalone/templates/epp.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-d-epp
  namespace: adhar-system
data:
  default-plugins.yaml: |
    apiVersion: llm-d.ai/v1alpha1
    kind: EndpointPickerConfig
    plugins:
    - type: queue-scorer
    - type: kv-cache-utilization-scorer
    - type: prefix-cache-scorer
    - type: metrics-data-source
      parameters:
        scheme: "http"
        path: "/metrics"
        insecureSkipVerify: true
    - type: core-metrics-extractor
    schedulingProfiles:
    - name: default
      plugins:
      - pluginRef: queue-scorer
        weight: 2
      - pluginRef: kv-cache-utilization-scorer
        weight: 2
      - pluginRef: prefix-cache-scorer
        weight: 3
  payload-agnostic.yaml: |
    # Request-format agnostic routing. Use this when the request format is
    # unknown or unsupported, so the EPP cannot rely on scorers that read the
    # request body (e.g. the prefix-cache scorer). The passthrough parser does
    # not parse the body, and routing falls back to backend-state scorers:
    #   - active-request-scorer  : prefers the least busy endpoint
    #   - session-affinity-scorer: keeps a session pinned to the same endpoint
    # Select it by setting router.epp.pluginsConfigFile: payload-agnostic.yaml
    apiVersion: llm-d.ai/v1alpha1
    kind: EndpointPickerConfig
    plugins:
    - type: passthrough-parser
    - type: active-request-scorer
    - type: session-affinity-scorer
    requestHandler:
      parsers:
      - pluginRef: passthrough-parser
    schedulingProfiles:
    - name: default
      plugins:
      - pluginRef: active-request-scorer
        weight: 1
      - pluginRef: session-affinity-scorer
        weight: 1
---
# Source: llm-d-router-standalone/templates/epp.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: agentgateway
  namespace: adhar-system
data:
  config.yaml: |-
    config:
      statsAddr: "0.0.0.0:15020"
      readinessAddr: "0.0.0.0:15021"
    binds:
    - port: 8081
      listeners:
      - name: default
        protocol: HTTP
        routes:
        - name: standalone-epp
          matches:
          - path:
              pathPrefix: /
          backends:
          - service:
              name: "adhar-system/llm-d"
              port: 8000
            policies:
              inferenceRouting:
                endpointPicker:
                  host: "127.0.0.1:9002"
                destinationMode: passthrough
    services:
    - name: "llm-d"
      namespace: "adhar-system"
      hostname: "llm-d"
      vips: []
      ports:
        8000: 8000
---
# Source: llm-d-router-standalone/templates/epp.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: llm-d-epp-sa
  namespace: adhar-system
  labels:
    app.kubernetes.io/name: llm-d-epp
    app.kubernetes.io/version: "v0.10.0"
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "watch", "list"]
---
# Source: llm-d-router-standalone/templates/epp.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: llm-d-epp-sa
  namespace: adhar-system
subjects:
- kind: ServiceAccount
  name: llm-d-epp
  namespace: adhar-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: llm-d-epp-sa
---
# Source: llm-d-router-standalone/templates/epp.yaml
apiVersion: v1
kind: Service
metadata:
  name: llm-d-epp
  namespace: adhar-system
  labels:
    app.kubernetes.io/name: llm-d-epp
    app.kubernetes.io/version: "v0.10.0"
spec:
  selector:
    llm-d-router-standalone: llm-d-epp
  ports:
    - name: grpc-ext-proc
      protocol: TCP
      port: 9002
      appProtocol: kubernetes.io/h2c
    - name: http-metrics
      protocol: TCP
      port: 9090
    - name: http
      port: 8081
      protocol: TCP
      targetPort: 8081
  type: ClusterIP
---
# Source: llm-d-router-standalone/templates/epp.yaml
---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-d-epp
  namespace: adhar-system
  labels:
    app.kubernetes.io/name: llm-d-epp
    app.kubernetes.io/version: "v0.10.0"
    llm-d.ai/igw-mode: llm-d-router-standalone
spec:
  replicas: 1
  strategy:
    # The current recommended EPP deployment pattern is to have a single active replica. This ensures
    # optimal performance of the stateful operations such prefix cache aware scorer.
    # The Recreate strategy the old replica is killed immediately, and allow the new replica(s) to
    # quickly take over. This is particularly important in the high availability set up with leader
    # election, as the rolling update strategy would prevent the old leader being killed because
    # otherwise the maxUnavailable would be 100%.
    type: Recreate
  selector:
    matchLabels:
      llm-d-router-standalone: llm-d-epp
  template:
    metadata:
      labels:
        llm-d-router-standalone: llm-d-epp
        llm-d.ai/igw-mode: llm-d-router-standalone
    spec:

      serviceAccountName: llm-d-epp
      # Conservatively, this timeout should mirror the longest grace period of the pods within the pool
      terminationGracePeriodSeconds: 130
      containers:
        - name: agentgateway-proxy
          image: cr.agentgateway.dev/agentgateway:v1.5.0
          imagePullPolicy: IfNotPresent
          args:
            - "-f"
            - "/config/config.yaml"
          ports:
          - containerPort: 8081
            name: http
          - containerPort: 15020
            name: metrics-15020
          - containerPort: 15021
            name: readiness-15021
          readinessProbe:
            failureThreshold: 1
            httpGet:
              path: /healthz/ready
              port: 15021
              scheme: HTTP
            periodSeconds: 5
            successThreshold: 1
            timeoutSeconds: 1
          startupProbe:
            failureThreshold: 60
            httpGet:
              path: /healthz/ready
              port: 15021
              scheme: HTTP
            periodSeconds: 1
            successThreshold: 1
            timeoutSeconds: 2
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - name: agentgateway-config-template
              mountPath: /config
              readOnly: true
        - name: epp
          image: ghcr.io/llm-d/llm-d-router-endpoint-picker:v0.10.0
          imagePullPolicy: IfNotPresent
          args:
              - --endpoint-selector
              - "llm-d.ai/inferenceServing=true,llm-d.ai/model=qwen2.5-0.5b-instruct"
              - --endpoint-target-ports
              - "8000"
              - --zap-encoder
              - "json"
              - --config-file
              - "/config/default-plugins.yaml"
              - --grpc-health-port
              - "9003"
              # Pass additional flags via the router.epp.flags field in values.yaml.
              # Render them as --flag=value so boolean values are parsed correctly.
              - "--secure-serving=false"
              - "--v=2"
              - --tracing=false
          resources:
            
            limits:
              memory: 2Gi
            requests:
              cpu: 200m
              memory: 512Mi
          ports:
            - name: grpc
              containerPort: 9002
            - name: grpc-health
              containerPort: 9003
            - name: metrics
              containerPort: 9090
          livenessProbe:
            grpc:
              port: 9003
              service: inference-extension
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            grpc:
              port: 9003
              service: inference-extension
            periodSeconds: 2
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            
          volumeMounts:
            - name: plugins-config-volume
              mountPath: "/config"
        
      volumes:
        - name: agentgateway-config-template
          configMap:
            name: agentgateway
            items:
              - key: config.yaml
                path: config.yaml
        - name: plugins-config-volume
          configMap:
            name: llm-d-epp
