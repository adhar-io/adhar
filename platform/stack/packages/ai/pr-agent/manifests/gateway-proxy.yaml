# The gateway proxy: how PR-Agent authenticates to the AI gateway without ever
# holding an LLM credential.
#
# agentgateway (ai/agentgateway) accepts Kubernetes ServiceAccount tokens whose
# audience is `agentgateway`. kubelet projects one for the `pr-agent`
# ServiceAccount into THIS container only and rotates it well before its hour
# is up. PR-Agent cannot use it directly: it reads its OpenAI key once, at
# start, from settings. So PR-Agent talks to this proxy on 127.0.0.1:8081 and
# the proxy re-reads the token file on EVERY request and sets
# `Authorization: Bearer <token>` on the way to the gateway. Nothing is minted,
# stored in a Secret or rotated by hand — the k8sgpt package needs a one-year
# token in a Secret only because its operator owns its Deployment and cannot
# mount a projected one.
#
# It is also a narrowing: it forwards POST /v1/chat/completions and nothing
# else, listens on loopback, and logs path and status — never headers.
#
# If the token cannot be read, no Authorization header is sent and the gateway
# answers 401 "no bearer token found" (its log names the cause); this
# container's log carries the read error.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pr-agent-gateway-proxy
  namespace: adhar-system
  labels:
    app.kubernetes.io/name: pr-agent
    app.kubernetes.io/part-of: pr-agent
    adhar.io/component: ai
    adhar.io/plane: control
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  gateway.js: |
    // The projected token is re-read per request: kubelet replaces the file
    // (an atomic symlink swap) as it rotates the token, so a cached copy
    // would expire under a long-running pod.
    const fs = require('fs');
    const TOKEN_FILE = '/var/run/secrets/agentgateway/token';

    function bearer(r) {
      try {
        const token = fs.readFileSync(TOKEN_FILE, 'utf8').trim();
        return token ? 'Bearer ' + token : '';
      } catch (e) {
        r.error('pr-agent gateway proxy: cannot read ' + TOKEN_FILE + ': ' + e.message);
        return '';
      }
    }

    export default { bearer };
  nginx.conf: |
    load_module modules/ngx_http_js_module.so;

    worker_processes 1;
    pid /tmp/nginx.pid;
    error_log /dev/stderr notice;

    events {
      worker_connections 256;
    }

    http {
      client_body_temp_path /tmp/client_temp;
      proxy_temp_path /tmp/proxy_temp;
      fastcgi_temp_path /tmp/fastcgi_temp;
      uwsgi_temp_path /tmp/uwsgi_temp;
      scgi_temp_path /tmp/scgi_temp;
      server_tokens off;

      # Method, path and outcome only: never a header, never a body.
      log_format gateway '"$request_method $uri" $status upstream=$upstream_status sent=$request_length took=$request_time';
      access_log /dev/stdout gateway;

      # The gateway's Service is resolved per request, not once at start: the
      # proxy comes up even if the gateway is not there yet, and a recreated
      # Service (new ClusterIP) is picked up within 30 s.
      resolver kube-dns.kube-system.svc.cluster.local. valid=30s ipv6=off;
      map $host $agentgateway {
        default adhar-ai-gateway.adhar-system.svc.cluster.local:8080;
      }

      js_path /etc/nginx/njs/;
      js_import gateway from gateway.js;
      js_set $gateway_bearer gateway.bearer;

      server {
        # Loopback only: the server container is the one caller.
        listen 127.0.0.1:8081;

        # A review prompt carries the PR's diff (up to max_model_tokens of it);
        # nginx's 1m default would answer 413 to a large PR.
        client_max_body_size 8m;
        client_body_buffer_size 1m;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        location = /v1/chat/completions {
          limit_except POST { deny all; }
          # Replaces the placeholder key PR-Agent sends.
          proxy_set_header Authorization $gateway_bearer;
          proxy_pass http://$agentgateway;
          # Streamed completions pass through as they arrive.
          proxy_buffering off;
          proxy_read_timeout 300s;
          proxy_send_timeout 300s;
        }

        location / {
          return 404;
        }
      }

      server {
        # kubelet's probes. Nothing else is served here.
        listen 8082;
        location = /healthz {
          access_log off;
          return 200 "ok\n";
        }
        location / {
          return 404;
        }
      }
    }
