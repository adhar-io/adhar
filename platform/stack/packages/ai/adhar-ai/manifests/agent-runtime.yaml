# Adhar AI — agent runtime (ADR-0024 §5, Decision point 4).
#
# The plan-act-observe loop. Two faces:
#   - assistant mode: interactive, Console chat + `adhar ai` CLI over /chat;
#     writes ALWAYS become Gitea PRs a human merges (autonomous=false).
#   - operators: event-driven (alert-triage, drift-explain, cost-advisor,
#     upgrade-preflight). Each subscribes to a trigger and declares its own
#     allowed_tools + autonomy level, read from the adhar-ai-config ConfigMap.
#
# Staged-autonomy ladder (global default `suggest` => every write is a PR;
# nothing is ever a direct cluster mutation): read-only -> suggest ->
# approve-to-apply -> scoped.
apiVersion: v1
kind: ConfigMap
metadata:
  name: adhar-ai-config
  namespace: adhar-system
  labels:
    app.kubernetes.io/name: adhar-ai
    adhar.io/component: ai
    adhar.io/plane: control
    adhar.io/origin: adhar-ai
  annotations:
    argocd.argoproj.io/sync-wave: "4"
data:
  config.yaml: |
    # -------------------------------------------------------------------------
    # Staged autonomy. Global default is deliberately conservative: `suggest`.
    # Each rung differs from the one below in a way you can observe:
    #   read-only        : write tools are not offered at all, and are refused if
    #                       called anyway
    #   suggest          : write tools allowed; the FIRST pull request ends the run,
    #                       so a human reads one proposal rather than a chain
    #   approve-to-apply : the run CONTINUES after a pull request, so the agent can
    #                       verify its own proposal; a human still merges every one
    #   scoped           : runs unattended, and is therefore confined to the
    #                       NARROWER writePolicy.scoped allow-list below — which is
    #                       EMPTY by default, so this rung permits no write at all
    #                       until an operator enumerates what it may touch
    #
    # Authority only ever NARROWS. This file sets a ceiling; an operator policy may
    # be stricter; a /chat request may ask for less; and an unauthenticated caller is
    # pinned to read-only regardless. Nothing widens it.
    # -------------------------------------------------------------------------
    autonomy:
      default: suggest
    # Global agent-loop budgets (belt-and-suspenders with the gateway budgets).
    limits:
      maxSteps: 12
      maxToolCallsPerOp: 40
    # Repos/paths the write path may target (defense-in-depth with the Kyverno
    # guardrail + Gitea branch protection).
    writePolicy:
      allowedRepos: [packages, environments]
      allowedPathPrefixes:
        - "packages/"
        - "environments/"
      # The NARROWER list that `scoped` autonomy runs under. Left empty on purpose:
      # `scoped` opens pull requests unattended, so inheriting the broad list above
      # would be a silent widening. Until these are enumerated, `scoped` refuses
      # every write and says which field to set. Example:
      #   scoped:
      #     allowedRepos: [environments]
      #     allowedPathPrefixes: ["environments/dev/"]
      scoped:
        allowedRepos: []
        allowedPathPrefixes: []
    # Event-driven operators. Autonomy is per-operator, never above `suggest`
    # here — bump deliberately as trust is calibrated (ADR-0024 consequences).
    operators:
      alert-triage:
        trigger: alertmanager
        autonomy: suggest
        allowedTools: [promql, logql, app_status, correlate, propose_change]
      drift-explain:
        trigger: argocd-notifications
        autonomy: read-only
        allowedTools: [app_status, app_diff, sync_status]
      cost-advisor:
        trigger: cron
        autonomy: suggest
        allowedTools: [cost_by, budget_status, showback, propose_change]
      upgrade-preflight:
        trigger: manual
        autonomy: suggest
        allowedTools: [resource_health, app_status, findings, propose_change]
    # MCP server endpoints the runtime mounts as tool groups.
    mcpServers:
      cluster:       http://adhar-ai-mcp-cluster.adhar-system.svc.cluster.local:8080
      gitops:        http://adhar-ai-mcp-gitops.adhar-system.svc.cluster.local:8080
      provision:     http://adhar-ai-mcp-provision.adhar-system.svc.cluster.local:8080
      observability: http://adhar-ai-mcp-observability.adhar-system.svc.cluster.local:8080
      security:      http://adhar-ai-mcp-security.adhar-system.svc.cluster.local:8080
      cost:          http://adhar-ai-mcp-cost.adhar-system.svc.cluster.local:8080
      catalog:       http://adhar-ai-mcp-catalog.adhar-system.svc.cluster.local:8080
    # RAG grounding store (pgvector on CNPG — see pgvector-rag.yaml).
    rag:
      enabled: true
      table: kb_chunk
    # Findings survive a restart in this table, on the same database as the RAG
    # index. With no database configured they stay in memory only, and /healthz
    # says so rather than pretending they are durable.
    findings:
      table: finding
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adhar-ai-runtime
  namespace: adhar-system
  labels:
    app.kubernetes.io/name: adhar-ai-runtime
    app.kubernetes.io/part-of: adhar-ai
    adhar.io/component: ai
    adhar.io/plane: control
  annotations:
    argocd.argoproj.io/sync-wave: "7"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: adhar-ai-runtime
  template:
    metadata:
      labels:
        app.kubernetes.io/name: adhar-ai-runtime
        app.kubernetes.io/part-of: adhar-ai
        adhar.io/component: ai
        adhar.io/plane: control
        adhar.io/origin: adhar-ai
    spec:
      serviceAccountName: adhar-ai
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runtime
          image: ghcr.io/adhar-io/adhar-ai-runtime:latest
          imagePullPolicy: Always
          args: ["runtime", "--config=/etc/adhar-ai/config.yaml", "--listen=:8080"]
          ports:
            - name: http
              containerPort: 8080
          env:
            # The platform AI data plane (agentgateway, ADR-0025) — NOT the
            # retired adhar-ai-llm-gateway. /v1 is part of the base URL and the
            # loop POSTs an OpenAI-shaped body that NAMES A MODEL; the gateway
            # routes on that name (`claude-*` -> Anthropic, `gpt-*` -> OpenAI,
            # `local/*` -> the in-cluster vLLM) and holds the key server-side.
            - name: LLM_GATEWAY_URL
              value: "http://adhar-ai-gateway.adhar-system.svc.cluster.local:8080/v1"
            # The model every run names unless the caller asks for another.
            #
            # Not optional in practice. With this unset the runtime falls back
            # to its library default (`claude-sonnet-5`), which on an install
            # whose key is an OpenAI/OpenRouter one cannot be served — and the
            # failure surfaces as a gateway routing error rather than "wrong
            # model", which sends you looking in the wrong place. It must name
            # a model the configured provider actually serves; the prefix is
            # also what the gateway routes on.
            - name: ADHAR_AI_LLM_MODEL
              value: "openai/gpt-5"
            # The runtime KEEPS its OIDC settings: it publishes its own hostname
            # (httproute.yaml) so /chat is reached directly, not through the AI
            # gateway, and it exchanges the caller's token for a short-lived
            # RBAC-scoped Kubernetes token so reads run as the user.
            - name: OIDC_ISSUER_URL
              value: "https://keycloak.adhar.localtest.me:8443/realms/adhar"
            - name: OIDC_CLIENT_ID
              value: "adhar-ai"
            # Signing keys are fetched from the IN-CLUSTER Keycloak Service while
            # the issuer above stays the PUBLIC realm URL, because `iss` must
            # match the token byte-for-byte. The split means key retrieval does
            # not depend on the platform's own ingress, so /chat authenticates on
            # a fresh cluster before DNS and TLS have settled, and a Keycloak key
            # rotation never waits on the edge. Same split ADR-0025 specifies for
            # agentgateway.
            - name: ADHAR_AI_OIDC_JWKS_URL
              value: "http://keycloak.adhar-system.svc.cluster.local:8080/realms/adhar/protocol/openid-connect/certs"
            # Keycloak groups allowed to drive a WRITE (a Gitea pull request).
            # Mirrors the agentgateway authorization table in ADR-0025:
            # platform-developer investigates, platform-admin may propose.
            - name: ADHAR_AI_WRITE_GROUPS
              value: "platform-admin"
            # The runtime's OWN identity, for the calls it makes with no caller
            # token to forward: the drift and cost pollers, and an Alertmanager
            # webhook authenticated by the shared secret below. It needs one
            # because agentgateway runs `jwtAuthentication: Strict` across
            # the whole Gateway (ADR-0025) — a completion request with no token
            # is a 401, so without this an operator could not run at all.
            #
            # The `adhar-ai` Keycloak client already ships
            # serviceAccountsEnabled: true (oidc-client.yaml), and the config
            # Job upserts its secret into `keycloak-clients`. The token endpoint
            # is the IN-CLUSTER Service for the same reason the JWKS URL is:
            # minting a token must not wait on the platform's own ingress.
            - name: ADHAR_AI_OIDC_TOKEN_URL
              value: "http://keycloak.adhar-system.svc.cluster.local:8080/realms/adhar/protocol/openid-connect/token"
            - name: ADHAR_AI_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-clients
                  key: ADHAR_AI_CLIENT_SECRET
                  optional: true
            # Shared bearer for the machine callers that hold no OIDC client:
            # Alertmanager (http_config.authorization.credentials) and ArgoCD
            # notifications. Accepted ONLY on /operators/{name}/event, never on
            # /chat. Optional: with no token those callers are still answered and
            # triaged, but pinned to read-only, so an unauthenticated POST cannot
            # open a pull request.
            - name: ADHAR_AI_WEBHOOK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: adhar-ai-webhook
                  key: WEBHOOK_TOKEN
                  optional: true
            # RAG connection (pgvector on CNPG). Credentials from the CNPG-issued
            # app secret (see pgvector-rag.yaml).
            - name: RAG_DB_HOST
              value: "adhar-ai-rag-rw.adhar-system.svc.cluster.local"
            - name: RAG_DB_NAME
              value: "adhar_ai_rag"
          envFrom:
            # CNPG app user credentials for the RAG store.
            - secretRef:
                name: adhar-ai-rag-app
                optional: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: config
              mountPath: /etc/adhar-ai
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: adhar-ai-config
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: adhar-ai-runtime
  namespace: adhar-system
  labels:
    app.kubernetes.io/name: adhar-ai-runtime
    app.kubernetes.io/part-of: adhar-ai
    adhar.io/component: ai
    adhar.io/plane: control
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: adhar-ai-runtime
  ports:
    - name: http
      port: 8080
      targetPort: http
