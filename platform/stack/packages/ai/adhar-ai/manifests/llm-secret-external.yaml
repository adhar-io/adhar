# Adhar AI — the ONE secret that turns agency on (ADR-0024 §4, ADR-0009).
#
# THE TWO BACKEND-SOURCED ExternalSecrets BELOW ARE SYNC-WAVE 8, AFTER THE
# WORKLOADS (waves 6-7), DELIBERATELY.
#
# They read a path an operator has to create. In wave 0 a missing path made
# ESO report `could not get secret data from provider`, ArgoCD never advanced
# past that wave, and NOT ONE Deployment was created — so a platform without
# an LLM key did not get an unkeyed Adhar AI, it got no Adhar AI at all, which
# contradicts "degrade gracefully when unkeyed" (ADR-0024 §9). The runtime
# already tolerates the Secret being absent (its secretKeyRefs are
# `optional: true`), so running late costs nothing: unkeyed, the MCP servers
# and runtime come up and only these two resources report Degraded, which is
# the honest signal. Seed the key and they turn Ready with no redeploy.
#
# Seed it with: hack/seed-adhar-ai-llm.sh (see that script for providers).
#
# Git carries a pointer, never the value: this ExternalSecret projects the LLM
# provider selection + API keys from Vault into the `adhar-ai-llm` Kubernetes
# Secret.
#
# WHO READS IT (changed by ADR-0025). The bespoke adhar-ai-llm-gateway that used
# to `envFrom` this Secret is gone. The consumer is now agentgateway, which
# reads individual KEYS server-side via `policies.auth.secretRef`
# (agentgateway/manifests/llm-routes.yaml):
#
#   backend `llm-anthropic` -> key `API_KEY`          (the platform default)
#   backend `llm-openai`    -> key `OPENAI_API_KEY`
#   backend `llm-vllm`      -> no key at all
#
# so the Secret must now be able to carry BOTH hosted providers at once — a
# single request stream picks its provider by model name, not by a global
# PROVIDER setting. `ANTHROPIC_API_KEY` is published alongside `API_KEY` as the
# unambiguous per-provider name (it is what this repo's own code and most SDKs
# look for); `API_KEY` stays exactly as it was, so the default Claude posture is
# unchanged and nothing has to be re-keyed.
#
# Default posture: provider=claude, model=latest Claude. Configure the Vault
# key and the platform gains its agentic capabilities; leave it unset and the
# AI packages stay unkeyed and the platform runs entirely unaffected
# (ADR-0024 §9, "degrade gracefully when unkeyed").
#
# ---------------------------------------------------------------------------
# Example Vault key layout (KV v2 at mount `secret`, path `adhar-ai/llm`):
#
#   vault kv put secret/adhar-ai/llm \
#     PROVIDER="claude" \
#     API_KEY="sk-ant-..." \
#     ANTHROPIC_API_KEY="sk-ant-..." \
#     OPENAI_API_KEY="" \
#     MODEL="claude-opus-4-5-20251101" \
#     ENDPOINT="" \
#     BUDGET_PER_USER_DAILY_TOKENS="2000000" \
#     BUDGET_PER_OP_MAX_TOOL_CALLS="40"
#
#   UPGRADING an entry written before ADR-0025: add the two new properties. They
#   may be empty strings — `ANTHROPIC_API_KEY` falls back to `API_KEY` in the
#   template below, and an empty `OPENAI_API_KEY` simply leaves the OpenAI
#   backend unkeyed, which 5xxs `gpt-*` requests and affects nothing else. ESO
#   reads every property listed under `data:`, so a property that is absent
#   entirely (rather than empty) fails the whole ExternalSecret — the same
#   contract the six original properties already have.
#
#   # OpenAI:            PROVIDER=openai            API_KEY=sk-...        MODEL=gpt-4o
#   # Azure OpenAI:      PROVIDER=azure             API_KEY=...           ENDPOINT=https://<res>.openai.azure.com  MODEL=<deployment>
#   # OpenAI-compatible: PROVIDER=openai-compatible API_KEY=...           ENDPOINT=https://vllm.internal/v1        MODEL=<served-model>
#   # Ollama (air-gap):  PROVIDER=ollama            API_KEY=<unused>      ENDPOINT=http://ollama.adhar-system:11434 MODEL=llama3.1
# ---------------------------------------------------------------------------
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: adhar-ai-llm
  namespace: adhar-system
  labels:
    app.kubernetes.io/name: adhar-ai
    adhar.io/component: ai
    adhar.io/plane: control
    adhar.io/origin: adhar-ai
  annotations:
    # Wave 8 — AFTER the workloads (waves 6-7), on purpose. See the file header.
    argocd.argoproj.io/sync-wave: "8"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: adhar-ai-llm
    creationPolicy: Owner
    # If Vault has no adhar-ai/llm entry yet, ESO still materializes the Secret
    # from these template defaults, so the gateway can start in "claude, no key"
    # posture (reports unkeyed, stays read-only) rather than hard-failing sync.
    template:
      engineVersion: v2
      data:
        PROVIDER: "{{ .provider | default \"claude\" }}"
        # The single-provider key, untouched: `llm-anthropic` binds to it and
        # the platform default is PROVIDER=claude, so the default posture works
        # exactly as before this file gained per-provider keys.
        API_KEY: "{{ .apiKey | default \"\" }}"
        # Per-provider keys, so hosted Anthropic and hosted OpenAI can be keyed
        # AT ONCE and a caller picks between them with a model name.
        # ANTHROPIC_API_KEY falls back to API_KEY: an install that only ever set
        # the single key keeps working, unchanged, with no Vault edit.
        ANTHROPIC_API_KEY: "{{ .anthropicApiKey | default .apiKey | default \"\" }}"
        # No fallback for OpenAI on purpose: silently reusing an Anthropic key as
        # an OpenAI credential would turn a missing key into a 401 from a third
        # party instead of an obvious unresolved-credential condition.
        OPENAI_API_KEY: "{{ .openaiApiKey | default \"\" }}"
        MODEL: "{{ .model | default \"claude-opus-4-5-20251101\" }}"
        ENDPOINT: "{{ .endpoint | default \"\" }}"
        BUDGET_PER_USER_DAILY_TOKENS: "{{ .budgetPerUserDailyTokens | default \"2000000\" }}"
        BUDGET_PER_OP_MAX_TOOL_CALLS: "{{ .budgetPerOpMaxToolCalls | default \"40\" }}"
  data:
    - secretKey: provider
      remoteRef:
        key: adhar-ai/llm
        property: PROVIDER
        conversionStrategy: Default
    - secretKey: apiKey
      remoteRef:
        key: adhar-ai/llm
        property: API_KEY
        conversionStrategy: Default
    - secretKey: anthropicApiKey
      remoteRef:
        key: adhar-ai/llm
        property: ANTHROPIC_API_KEY
        conversionStrategy: Default
    - secretKey: openaiApiKey
      remoteRef:
        key: adhar-ai/llm
        property: OPENAI_API_KEY
        conversionStrategy: Default
    - secretKey: model
      remoteRef:
        key: adhar-ai/llm
        property: MODEL
        conversionStrategy: Default
    - secretKey: endpoint
      remoteRef:
        key: adhar-ai/llm
        property: ENDPOINT
        conversionStrategy: Default
    - secretKey: budgetPerUserDailyTokens
      remoteRef:
        key: adhar-ai/llm
        property: BUDGET_PER_USER_DAILY_TOKENS
        conversionStrategy: Default
    - secretKey: budgetPerOpMaxToolCalls
      remoteRef:
        key: adhar-ai/llm
        property: BUDGET_PER_OP_MAX_TOOL_CALLS
        conversionStrategy: Default
---
# The Gitea bot identity used by the mcp write tools to open PRs (ADR-0024 §3).
# Commit-only rights; this is the entire "write" credential the platform grants
# the agent — a contributor token, never a cluster/cloud credential.
#
#   vault kv put secret/adhar-ai/bot \
#     GITEA_BOT_USER="adhar-ai-bot" \
#     GITEA_BOT_TOKEN="<gitea personal access token, repo scope>"
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: adhar-ai-bot
  namespace: adhar-system
  labels:
    app.kubernetes.io/name: adhar-ai
    adhar.io/component: ai
    adhar.io/plane: control
    adhar.io/origin: adhar-ai
  annotations:
    # Wave 8 — AFTER the workloads (waves 6-7), on purpose. See the file header.
    argocd.argoproj.io/sync-wave: "8"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: adhar-ai-bot
    creationPolicy: Owner
  data:
    - secretKey: GITEA_BOT_USER
      remoteRef:
        key: adhar-ai/bot
        property: GITEA_BOT_USER
        conversionStrategy: Default
    - secretKey: GITEA_BOT_TOKEN
      remoteRef:
        key: adhar-ai/bot
        property: GITEA_BOT_TOKEN
        conversionStrategy: Default
---
# The shared bearer the MACHINE callers present to the agent runtime's
# /operators/{name}/event webhook: Alertmanager and ArgoCD notifications, neither
# of which holds an OIDC client. Alertmanager sends it as
# `http_config.authorization.credentials`; the runtime compares it in constant
# time and accepts it on that route ONLY — never on /chat, so leaking it cannot
# become an interactive agent session.
#
# GENERATED, not supplied: the Password generator below mints a 48-character
# value once (`refreshPolicy: CreatedOnce`) so there is nothing for an operator
# to invent, rotate by hand, or paste into a ticket. Read it back when wiring
# Alertmanager:
#
#   kubectl -n adhar-system get secret adhar-ai-webhook \
#     -o jsonpath='{.data.WEBHOOK_TOKEN}' | base64 -d
#
# The Deployment marks this reference `optional: true`, so a cluster without it
# still runs: unauthenticated webhook callers are answered and triaged, but
# pinned to `read-only`, and therefore cannot open a pull request.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: adhar-ai-webhook
  namespace: adhar-system
  labels:
    app.kubernetes.io/name: adhar-ai
    adhar.io/component: ai
    adhar.io/plane: control
    adhar.io/origin: adhar-ai
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  length: 48
  digits: 8
  # No symbols: the value travels in an HTTP Authorization header and through
  # Alertmanager's own YAML, where quoting mistakes are the likeliest failure.
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: adhar-ai-webhook
  namespace: adhar-system
  labels:
    app.kubernetes.io/name: adhar-ai
    adhar.io/component: ai
    adhar.io/plane: control
    adhar.io/origin: adhar-ai
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  # CreatedOnce: the token must stay stable, because Alertmanager's copy of it
  # lives in the observability package's own config. A refresh that regenerated
  # it would silently downgrade every alert to read-only triage.
  refreshPolicy: CreatedOnce
  refreshInterval: 1h
  target:
    name: adhar-ai-webhook
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        WEBHOOK_TOKEN: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: adhar-ai-webhook
      rewrite:
        - transform:
            template: "password"
