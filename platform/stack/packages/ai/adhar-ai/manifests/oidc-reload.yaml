# Restarts the Adhar AI runtime once Keycloak has published its client secret.
#
# THE FAILURE THIS FIXES, exactly as an operator sees it:
#
#   AI provider error 401: authentication failure: no bearer token found
#
# agentgateway runs `jwtAuthentication: Strict` across the whole Gateway
# (ADR-0025), so every completion needs a bearer token — including the ones the
# runtime makes on its OWN behalf (the drift and cost pollers, Alertmanager
# webhooks, any request with no caller token to forward). The runtime is built for
# that: it mints a token by client_credentials with ADHAR_AI_OIDC_CLIENT_SECRET,
# read from `keycloak-clients`.
#
# But `keycloak-clients` is written by Keycloak's realm Job at wave 20 — minutes
# AFTER the runtime is already running — and the env var is `optional: true` so the
# runtime still boots without it. Environment variables are injected once, at pod
# creation, and never updated: the running pod therefore holds an EMPTY client
# secret forever, calls the gateway with no Authorization header, and every
# completion is a 401. Measured on a live cluster: the key was present in
# `keycloak-clients` and the pod's env was still empty.
#
# Every other SSO-consuming package already ships this Job (coder, adhar-console,
# jupyterhub, headlamp, grafana). adhar-ai was the one that did not.
#
# Unlike those, this one ASKS THE PROCESS, and has to: the other hooks compare
# the pod's start with their Secret's creationTimestamp, but this key is added
# to keycloak-clients — a Secret Keycloak's realm Job created earlier — by
# oidc-client.yaml, so no stamp on that Secret says when the KEY arrived (AWS,
# 2026-10-30: created 15:40:46, ADHAR_AI_CLIENT_SECRET added 15:57:34; a pod
# started in between is "newer than the Secret" and has no client secret). The
# managedFields time of the writer is no substitute either: keycloak-clients is
# patched every five minutes (keycloak-client-reconcile refreshes
# ARGOCD_SESSION_TOKEN), so a key owned by that writer would look new forever.
# What the hook must not do is take a FAILED question for the answer "missing":
# the exec prints its answer, and a refused or timed-out exec, like a pod list
# that fails, ends the hook instead of restarting the runtime.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: adhar-ai-oidc-reload
  namespace: adhar-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: adhar-ai-oidc-reload
  namespace: adhar-system
rules:
  # By name where RBAC can: it reads one Secret and restarts and waits on one
  # Deployment. Unnamed, these rules read every Secret in adhar-system and
  # could patch any Deployment in it. Pods cannot be named (the runtime's pod
  # name is generated), so listing them and exec'ing into the one it picked
  # stay unnamed.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["keycloak-clients"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  # `watch`: `kubectl rollout status` watches the Deployment (by name, so
  # resourceNames applies); without it the wait logs "Failed to watch …
  # unknown" and only notices progress on its backoff relists.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["adhar-ai-runtime"]
    verbs: ["get", "list", "watch", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: adhar-ai-oidc-reload
  namespace: adhar-system
subjects:
  - kind: ServiceAccount
    name: adhar-ai-oidc-reload
    namespace: adhar-system
roleRef:
  kind: Role
  name: adhar-ai-oidc-reload
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: adhar-ai-oidc-reload
  namespace: adhar-system
  labels:
    app.kubernetes.io/name: adhar-ai
    adhar.io/component: ai
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    # After the runtime itself (wave 4) and after Keycloak's realm Job has had a
    # chance to run; the wait loop below covers a cold bootstrap regardless.
    argocd.argoproj.io/sync-wave: "11"
spec:
  backoffLimit: 2
  template:
    metadata:
      generateName: adhar-ai-oidc-reload
      labels:
        app.kubernetes.io/name: adhar-ai
        adhar.io/component: ai
    spec:
      serviceAccountName: adhar-ai-oidc-reload
      restartPolicy: Never
      # One shared namespace means a <NAME>_PORT env var per Service, which breaks
      # anything that decodes env strictly (packages/CONFLICTS.md).
      enableServiceLinks: false
      containers:
        - name: kubectl
          image: docker.io/bitnamilegacy/kubectl:1.31
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -eu -o pipefail
              NS=adhar-system
              DEPLOY=adhar-ai-runtime
              SECRET=keycloak-clients
              KEY=ADHAR_AI_CLIENT_SECRET

              # 1. Wait (bounded: 240 x 10s = 40 min, the length of a cold
              #    keycloak-db -> keycloak -> realm Job path) for the client
              #    secret. A timeout is not a failure: the next sync retries.
              ok=""
              for i in $(seq 1 240); do
                if kubectl -n "$NS" get secret "$SECRET" \
                     -o "jsonpath={.data.$KEY}" 2>/dev/null | grep -q .; then
                  ok=1; break
                fi
                echo "waiting for $SECRET/$KEY ($i)"
                sleep 10
              done
              if [ -z "$ok" ]; then
                echo "client secret not published yet; leaving the runtime as-is (next sync retries)"
                exit 0
              fi

              # 2. Restart ONLY if the RUNNING pod is actually missing the env, so
              #    a steady-state sync is a no-op rather than a restart loop.
              #    The NEWEST Running pod is asked (pods list in name order, so
              #    the first can be the one a rollout is replacing). The pod list
              #    is read on its own and a list that FAILS ends the hook — read
              #    as "no pod", an API timeout restarted the runtime; only a list
              #    that succeeded with no Running pod restarts it.
              #    Guard: TestRestartHooksNeverRestartOnAFailedPodList.
              if ! RUNNING=$(kubectl -n "$NS" get pods -l app.kubernetes.io/name=adhar-ai-runtime \
                               --field-selector=status.phase=Running \
                               -o jsonpath='{range .items[*]}{.status.startTime}{" "}{.metadata.name}{"\n"}{end}'); then
                echo "cannot list the runtime pods; leaving the runtime as-is (next sync retries)"
                exit 0
              fi
              POD=$(printf '%s\n' "$RUNNING" | sort | tail -n 1 | cut -d' ' -f2)
              if [ -n "$POD" ]; then
                # The answer is PRINTED, not read off the exit status: a refused
                # or timed-out exec exits non-zero exactly like a failed `test`,
                # and the old hook read both as "missing" and restarted — the way
                # Grafana's, whose exec was always refused, restarted Grafana on
                # every sync. Guard: TestRestartHooksNeverReadAFailedExecAsMissing.
                if ! HELD=$(kubectl -n "$NS" exec "$POD" -- \
                              sh -c 'if [ -n "${ADHAR_AI_OIDC_CLIENT_SECRET:-}" ]; then echo held; else echo missing; fi'); then
                  echo "cannot ask $POD for its env; leaving the runtime as-is (next sync retries)"
                  exit 0
                fi
                case "$HELD" in
                  held) echo "the runtime ($POD) already holds its client secret; nothing to do."; exit 0 ;;
                  missing) echo "the runtime ($POD) started without its client secret" ;;
                  *) echo "unexpected answer from $POD ('$HELD'); leaving the runtime as-is"; exit 0 ;;
                esac
              fi

              echo "Restarting $DEPLOY so it can mint its own tokens..."
              kubectl -n "$NS" rollout restart deployment "$DEPLOY"
              kubectl -n "$NS" rollout status deployment "$DEPLOY" --timeout=300s || true
              echo "Adhar AI OIDC reload complete."
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {memory: 256Mi}
