# Adhar AI — the platform's AI plane, end to end.
#
# Filed under the AI folder, beside the agentgateway and vLLM dashboards, since
# 2026-10-10. It sat at the Grafana root for a day as a second "front door" next
# to "Adhar Platform"; in use the platform page is the one front door and the AI
# plane reads better as the head of its own folder. "Adhar Platform" is now the
# ONLY dashboard outside a folder — pinned by TestExactlyOneDashboardSitsOutsideAFolder.
#
# EVERY QUERY HERE WAS CHECKED AGAINST A LIVE PROMETHEUS (metric name AND label
# set, AWS cluster, 2026-10-09) before it was written. That is not ceremony: the
# dashboard this replaces had panels for "Realized spend", "Pull requests
# opened" and "Knowledge base", and no metric by any of those names is exported
# anywhere on the platform — three panels that could only ever read "No data".
# A beautiful dashboard full of empty panels is worse than a small honest one,
# because it teaches people to distrust the whole thing.
#
# 47 panels in 8 rows, built on five metric families:
#
#   adhar_ai_*            the agent runtime  (runs, steps, LLM calls, circuits)
#   adhar_ai_tool_*       the seven MCP domain servers (tool, access, decision)
#   agentgateway_gen_ai_* tokens and GenAI latency at the data plane
#   agentgateway_*        the data plane itself (status, guardrails, xDS, shed)
#   k8sgpt_*              AI explanations of unhealthy cluster objects
#
# What the first live look showed, and what these panels are for: every
# `adhar_ai_agent_runs_total` series carried `outcome="error"`, the gateway was
# answering `status=401 reason=JwtAuth`, the openai→local fallback was itself
# erroring, and `adhar_ai_mcp_servers_connected` was 0 for all seven domains
# while all seven MCP pods were Running. None of that was visible before.
apiVersion: v1
kind: ConfigMap
metadata:
  name: adhar-ai-dashboard
  namespace: adhar-system
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: adhar-ai
    app.kubernetes.io/part-of: adhar-observability
  annotations:
    grafana_folder: "AI"
data:
  adhar-ai.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "description": "The platform's AI plane end to end: the agent runtime's reasoning loop, the models and tokens behind it, the seven MCP domain servers it calls tools through, the agentgateway data plane that enforces identity and guardrails, and k8sgpt's findings. Every query is built on metrics verified present on a live cluster. Filed under the AI folder; the platform front page is Adhar Platform.",
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "links": [
        {
          "asDropdown": false,
          "icon": "external link",
          "includeVars": true,
          "keepTime": true,
          "tags": [],
          "targetBlank": false,
          "title": "Adhar Platform",
          "tooltip": "The platform overview",
          "type": "link",
          "url": "/d/adhar-platform-overview/adhar-platform"
        }
      ],
      "panels": [
        {
          "type": "row",
          "title": "At a glance",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "panels": []
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Agent runs (1h)",
          "description": "Agent loops started in the last hour, every trigger and autonomy level.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 0,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "No data",
              "color": {
                "mode": "thresholds"
              },
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "sum(increase(adhar_ai_agent_runs_total{job=\"adhar-ai-runtime\"}[1h]))",
              "refId": "A",
              "range": false,
              "instant": true
            }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Run success rate",
          "description": "Share of runs ending `outcome=ok` over 30m. Reads 0 while every run errors.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 3,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "noValue": "No data",
              "color": {
                "mode": "thresholds"
              },
              "decimals": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.8
                  },
                  {
                    "color": "green",
                    "value": 0.95
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "sum(rate(adhar_ai_agent_runs_total{job=\"adhar-ai-runtime\",outcome=\"ok\"}[30m])) / clamp_min(sum(rate(adhar_ai_agent_runs_total{job=\"adhar-ai-runtime\"}[30m])), 1e-9)",
              "refId": "A",
              "range": false,
              "instant": true
            }
          ]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Run p95",
          "description": "95th percentile wall-clock duration of an agent run.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 6,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "noValue": "No data",
              "color": {
                "mode": "thresholds"
              },
              "decimals": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(adhar_ai_agent_run_duration_seconds_bucket{job=\"adhar-ai-runtime\"}[30m])))",
              "refId": "A",
              "range": false,
              "instant": true
            }
          ]
        },
        {
          "id": 5,
          "type": "stat",
          "title": "LLM calls / min",
          "description": "Model calls the runtime is making, across every model and outcome.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 9,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "No data",
              "color": {
                "mode": "thresholds"
              },
              "decimals": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "sum(rate(adhar_ai_llm_requests_total{job=\"adhar-ai-runtime\"}[5m])) * 60",
              "refId": "A",
              "range": false,
              "instant": true
            }
          ]
        },
        {
          "id": 6,
          "type": "stat",
          "title": "Tokens / min",
          "description": "Tokens through the AI gateway per minute — input, output and cache combined.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 12,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "No data",
              "color": {
                "mode": "thresholds"
              },
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "sum(rate(agentgateway_gen_ai_client_token_usage_sum{job=~\".*agentgateway.*\"}[5m])) * 60",
              "refId": "A",
              "range": false,
              "instant": true
            }
          ]
        },
        {
          "id": 7,
          "type": "stat",
          "title": "Tool calls (1h)",
          "description": "MCP tool invocations across all seven domain servers.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 15,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "No data",
              "color": {
                "mode": "thresholds"
              },
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "sum(increase(adhar_ai_tool_calls_total{job=~\"adhar-ai-mcp-.*\"}[1h]))",
              "refId": "A",
              "range": false,
              "instant": true
            }
          ]
        },
        {
          "id": 8,
          "type": "stat",
          "title": "MCP servers connected",
          "description": "Domain servers the runtime currently holds an MCP session to. Zero means the agent has no tools, even while every MCP pod is Running.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 18,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "No data",
              "color": {
                "mode": "thresholds"
              },
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  },
                  {
                    "color": "green",
                    "value": 7
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "sum(adhar_ai_mcp_servers_connected{job=\"adhar-ai-runtime\"})",
              "refId": "A",
              "range": false,
              "instant": true
            }
          ]
        },
        {
          "id": 9,
          "type": "stat",
          "title": "Guardrail actions (1h)",
          "description": "Gateway guardrail decisions that were not a plain Allow (Audit, Deny, Mask).",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 21,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "No data",
              "color": {
                "mode": "thresholds"
              },
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "sum(increase(agentgateway_guardrail_checks_total{job=~\".*agentgateway.*\",action!=\"Allow\"}[1h]))",
              "refId": "A",
              "range": false,
              "instant": true
            }
          ]
        },
        {
          "type": "row",
          "title": "Agent runs",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 5
          },
          "id": 10,
          "panels": []
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "Runs by outcome",
          "description": "Run starts per second, split by how they finished.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 6
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "noValue": "No data",
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 35,
                "gradientMode": "opacity",
                "showPoints": "never",
                "spanNulls": true,
                "scaleDistribution": {
                  "type": "linear"
                },
                "stacking": {
                  "mode": "normal",
                  "group": "A"
                },
                "axisSoftMin": 0
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "calcs": [
                "mean",
                "max",
                "lastNotNull"
              ],
              "displayMode": "table",
              "placement": "right",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "sum by (outcome) (rate(adhar_ai_agent_runs_total{job=\"adhar-ai-runtime\"}[5m]))",
              "refId": "A",
              "range": true,
              "legendFormat": "{{outcome}}"
            }
          ]
        },
        {
          "id": 12,
          "type": "timeseries",
          "title": "Run duration percentiles",
          "description": "How long an agent loop takes end to end.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 6
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "noValue": "No data",
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 0,
                "gradientMode": "none",
                "showPoints": "never",
                "spanNulls": true,
                "scaleDistribution": {
                  "type": "linear"
                },
                "stacking": {
                  "mode": "none",
                  "group": "A"
                },
                "axisSoftMin": 0
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "histogram_quantile(0.50, sum by (le) (rate(adhar_ai_agent_run_duration_seconds_bucket{job=\"adhar-ai-runtime\"}[5m])))",
              "refId": "A",
              "range": true,
              "legendFormat": "p50"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "histogram_quantile(0.90, sum by (le) (rate(adhar_ai_agent_run_duration_seconds_bucket{job=\"adhar-ai-runtime\"}[5m])))",
              "refId": "B",
              "range": true,
              "legendFormat": "p90"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "histogram_quantile(0.99, sum by (le) (rate(adhar_ai_agent_run_duration_seconds_bucket{job=\"adhar-ai-runtime\"}[5m])))",
              "refId": "C",
              "range": true,
              "legendFormat": "p99"
            }
          ]
        },
        {
          "id": 13,
          "type": "piechart",
          "title": "Runs by trigger",
          "description": "What starts runs over the selected range — chat, webhook, schedule.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 7,
            "w": 6,
            "x": 0,
            "y": 14
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "No data",
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "options": {
            "displayLabels": [
              "percent"
            ],
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "showLegend": true,
              "values": [
                "value"
              ]
            },
            "pieType": "donut",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "tooltip": {
              "mode": "single",
              "sort": "none"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "sum by (trigger) (increase(adhar_ai_agent_runs_total{job=\"adhar-ai-runtime\"}[$__range]))",
              "refId": "A",
              "range": true,
              "legendFormat": "{{trigger}}"
            }
          ]
        },
        {
          "id": 14,
          "type": "piechart",
          "title": "Runs by autonomy",
          "description": "Autonomy level requested: read-only, suggest, or act.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 7,
            "w": 6,
            "x": 6,
            "y": 14
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "No data",
              "color": {
                "mode": "palette-classic"
              }
            },
