            ],
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "showLegend": true,
              "values": [
                "value"
              ]
            },
            "pieType": "donut",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "tooltip": {
              "mode": "single",
              "sort": "none"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "sum by (autonomy) (increase(adhar_ai_agent_runs_total{job=\"adhar-ai-runtime\"}[$__range]))",
              "refId": "A",
              "range": true,
              "legendFormat": "{{autonomy}}"
            }
          ]
        },
        {
          "id": 15,
          "type": "timeseries",
          "title": "Steps per run",
          "description": "Reasoning steps per run. A climbing p95 means the agent is looping.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 7,
            "w": 6,
            "x": 12,
            "y": 14
          },
