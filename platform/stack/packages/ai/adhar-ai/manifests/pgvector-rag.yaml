# Adhar AI — pgvector RAG store (ADR-0024 §5, §6, Decision point 5).
#
# Grounding: the agent's suggestions follow Adhar's ACTUAL conventions and
# current state, not a generic prior. This CNPG Cluster hosts a pgvector store
# indexed over docs/, docs/adr/, PRODUCTION.md, runbooks, and past incidents
# (the reindex CronOperation walks + chunks + embeds nightly). The retriever
# returns top-k cosine matches as grounding messages with `source` citations
# surfaced in answers. Live state (ArgoCD inventory, active alerts, catalog) is
# injected alongside at query time by the runtime's build_context.
#
# Follows the keycloak-db CNPG pattern, including the mandatory
# ServerSideApply=true sync-option (CNPG Clusters overflow client-side apply's
# last-applied annotation; without SSA ArgoCD force-fails and drops the DB).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: adhar-ai-rag
  namespace: adhar-system
  labels:
    app.kubernetes.io/name: adhar-ai
    adhar.io/component: ai
    adhar.io/plane: control
    adhar.io/origin: adhar-ai
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: ServerSideApply=true
spec:
  instances: 1
  # pgvector-enabled image; postC7 CNPG ships the vector extension in the
  # -bookworm images. Adjust the tag to your platform's pinned major.
  imageName: ghcr.io/cloudnative-pg/postgresql:16-bookworm
  storage:
    size: 5Gi
  bootstrap:
    initdb:
      database: adhar_ai_rag
      owner: adhar_ai
      # CNPG generates the app-user Secret `adhar-ai-rag-app` (consumed by the
      # runtime via envFrom, see agent-runtime.yaml).
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS vector;
        - |
          CREATE TABLE IF NOT EXISTS kb_chunk (
            id        BIGSERIAL PRIMARY KEY,
            source    TEXT,          -- docs/adr/0024-...md, PRODUCTION.md#5, runbook:...
            kind      TEXT,          -- adr | doc | runbook | incident
            chunk     TEXT,
            embedding vector(1536)
          );
        - CREATE INDEX IF NOT EXISTS kb_chunk_embedding_idx ON kb_chunk USING hnsw (embedding vector_cosine_ops);
  # Scheduled base backups + WAL archiving to the platform object store, matching
  # the keycloak-db posture. RAG content is reconstructable from docs, so this is
  # convenience, not a hard dependency; WAL warns until minio is healthy.
  backup:
    retentionPolicy: 14d
    barmanObjectStore:
      destinationPath: s3://adhar-backups/cnpg/adhar-ai-rag
      endpointURL: http://minio.adhar-system.svc.cluster.local:9000
      s3Credentials:
        accessKeyId:
          name: root-creds
          key: rootUser
        secretAccessKey:
          name: root-creds
          key: rootPassword
