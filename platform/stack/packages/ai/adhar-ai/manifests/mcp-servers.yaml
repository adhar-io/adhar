# ---------------------------- mcp-catalog (write: PR) -----------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adhar-ai-mcp-catalog
  namespace: adhar-system
  labels:
    app.kubernetes.io/name: adhar-ai-mcp-catalog
    app.kubernetes.io/part-of: adhar-ai
    adhar.io/component: ai
    adhar.io/mcp-domain: catalog
    adhar.io/plane: control
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: adhar-ai-mcp-catalog
  template:
    metadata:
      labels:
        app.kubernetes.io/name: adhar-ai-mcp-catalog
        app.kubernetes.io/part-of: adhar-ai
        adhar.io/component: ai
        adhar.io/mcp-domain: catalog
        adhar.io/plane: control
        adhar.io/origin: adhar-ai
    spec:
      serviceAccountName: adhar-ai
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp
          image: ghcr.io/adhar-io/adhar-ai-mcp-catalog:latest
          imagePullPolicy: Always
          args: ["mcp", "--domain=catalog", "--listen=:8080"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: MCP_DOMAIN
              value: "catalog"
            - name: GITEA_WRITE_ENABLED
              value: "true"
            - name: GITEA_API_URL
              value: "http://gitea-http.adhar-system.svc.cluster.local:3000"
            - name: GITEA_WRITE_REPOS
              value: "packages,environments"
            # The platform AI data plane (agentgateway, ADR-0025) — NOT the
            # retired adhar-ai-llm-gateway. The URL carries the /v1 prefix and
            # the caller POSTs an OpenAI-shaped body that NAMES A MODEL
            # (`claude-*` -> Anthropic, `gpt-*`/`o[1-9]-*` -> OpenAI,
            # `local/*` -> the in-cluster vLLM). There is no server-side
            # provider selection any more: the model name IS the routing key.
            - name: LLM_GATEWAY_URL
              value: "http://adhar-ai-gateway.adhar-system.svc.cluster.local:8080/v1"
            # No OIDC_ISSUER_URL / OIDC_CLIENT_ID: per-server token validation is
            # gone (ADR-0025 "Required changes in adhar-ai", item 6). Every
            # request reaches these servers through agentgateway, which validates
            # the Keycloak JWT ONCE for all seven and authorizes per tool
            # (agentgateway/manifests/security.yaml). The Keycloak `adhar-ai`
            # client and its `groups` mapper stay — the gateway's CEL rules read
            # those claims — and the bearer token is preserved
            # (preserveToken: true) so RBAC-scoped reads still run as the USER.
          envFrom:
            - secretRef:
                name: adhar-ai-bot
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
