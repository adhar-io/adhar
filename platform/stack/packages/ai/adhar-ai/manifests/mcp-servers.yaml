    adhar.io/component: ai
    adhar.io/mcp-domain: catalog
    adhar.io/plane: control
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: adhar-ai-mcp-catalog
  ports:
    - name: http
      port: 8080
      targetPort: http
