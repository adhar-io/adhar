# Adhar AI — per-domain MCP tool servers (ADR-0024 §2, Decision point 2 & 7).
#
# One Deployment + Service per domain. Each wraps an Adhar capability as typed
# MCP tools tagged read/write:
#   - READ tools are RBAC-scoped (all pods mount the `adhar-ai` ServiceAccount,
#     whose ClusterRole is get/list/watch only — see namespace-and-rbac.yaml).
#   - WRITE tools open Gitea PRs ONLY (via the adhar-ai-bot token); there is no
#     kubectl_apply / argo_sync / helm_install / cloud-mutation tool anywhere.
#
# The servers are reachable outward (Claude Code / IDE assistants / ChatOps)
# through the Gateway + OIDC: the runtime's /mcp/sse surface (httproute.yaml)
# fronts these ClusterIP services. All carry adhar.io/origin=adhar-ai so the
# Kyverno guardrail (kyverno-policy.yaml) can attribute their activity.
#
# Domains: cluster, gitops, provision, observability, security, cost, catalog.
# Image per domain: ghcr.io/adhar-io/adhar-ai-mcp-<domain>:latest
#
# GITEA_WRITE_ENABLED marks which domains carry a write (PR-authoring) tool;
# read-only domains keep it "false" and do not mount the bot token. The blocks
# are intentionally uniform (fully expanded — YAML anchors do not span the ---
# document boundaries that kubectl/ArgoCD split on).
---
# ---------------------------- mcp-cluster (read-only) -----------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adhar-ai-mcp-cluster
  namespace: adhar-system
  labels:
    app.kubernetes.io/name: adhar-ai-mcp-cluster
    app.kubernetes.io/part-of: adhar-ai
    adhar.io/component: ai
    adhar.io/mcp-domain: cluster
    adhar.io/plane: control
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: adhar-ai-mcp-cluster
  template:
    metadata:
      labels:
        app.kubernetes.io/name: adhar-ai-mcp-cluster
        app.kubernetes.io/part-of: adhar-ai
        adhar.io/component: ai
        adhar.io/mcp-domain: cluster
        adhar.io/plane: control
        adhar.io/origin: adhar-ai
    spec:
      serviceAccountName: adhar-ai
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp
          image: ghcr.io/adhar-io/adhar-ai-mcp-cluster:latest
          imagePullPolicy: Always
          args: ["mcp", "--domain=cluster", "--listen=:8080"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: MCP_DOMAIN
              value: "cluster"
            - name: GITEA_WRITE_ENABLED
              value: "false"
            - name: LLM_GATEWAY_URL
              value: "http://adhar-ai-llm-gateway.adhar-system.svc.cluster.local:8080"
            - name: OIDC_ISSUER_URL
              value: "https://keycloak.adhar.localtest.me:8443/realms/adhar"
            - name: OIDC_CLIENT_ID
              value: "adhar-ai"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: adhar-ai-mcp-cluster
  namespace: adhar-system
  labels:
    app.kubernetes.io/name: adhar-ai-mcp-cluster
    app.kubernetes.io/part-of: adhar-ai
    adhar.io/component: ai
    adhar.io/mcp-domain: cluster
    adhar.io/plane: control
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: adhar-ai-mcp-cluster
  ports:
    - name: http
      port: 8080
      targetPort: http
---
