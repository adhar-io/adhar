# Adhar AI — per-domain MCP tool servers (ADR-0024 §2, Decision point 2 & 7).
#
# One Deployment + Service per domain. Each wraps an Adhar capability as typed
# MCP tools tagged read/write:
#   - READ tools are RBAC-scoped (all pods mount the `adhar-ai` ServiceAccount,
#     whose ClusterRole is get/list/watch only — see namespace-and-rbac.yaml).
#   - WRITE tools open Gitea PRs ONLY (via the adhar-ai-bot token); there is no
#     kubectl_apply / argo_sync / helm_install / cloud-mutation tool anywhere.
#
# The servers are reachable outward (Claude Code / IDE assistants / ChatOps)
# through ONE federated endpoint — `https://mcp.<host>/mcp` on agentgateway
# (ADR-0025) — which multiplexes all seven of these ClusterIP Services, validates
# the Keycloak JWT and authorizes per tool. They are NOT published individually
# and the runtime is no longer on the critical path of an external tool call.
# All carry adhar.io/origin=adhar-ai so the Kyverno guardrail
# (kyverno-policy.yaml) can attribute their activity.
#
# TRANSPORT CONTRACT (what agentgateway/manifests/mcp-federation.yaml
# federates): StreamableHTTP at `/mcp` on port 8080, plus `/healthz` on the same
# port for the probe below. The image serves exactly that (`--listen=:8080`).
#
# Domains: cluster, gitops, provision, observability, security, cost, catalog.
# Image per domain: ghcr.io/adhar-io/adhar-ai-mcp-<domain>:latest
#
# GITEA_WRITE_ENABLED marks which domains carry a write (PR-authoring) tool;
# read-only domains keep it "false" and do not mount the bot token. The blocks
# are intentionally uniform (fully expanded — YAML anchors do not span the ---
# document boundaries that kubectl/ArgoCD split on).
---
# ---------------------------- mcp-cluster (read-only) -----------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adhar-ai-mcp-cluster
  namespace: adhar-system
  labels:
    app.kubernetes.io/name: adhar-ai-mcp-cluster
    app.kubernetes.io/part-of: adhar-ai
    adhar.io/component: ai
    adhar.io/mcp-domain: cluster
    adhar.io/plane: control
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: adhar-ai-mcp-cluster
  template:
    metadata:
      labels:
        app.kubernetes.io/name: adhar-ai-mcp-cluster
        app.kubernetes.io/part-of: adhar-ai
        adhar.io/component: ai
        adhar.io/mcp-domain: cluster
        adhar.io/plane: control
        adhar.io/origin: adhar-ai
    spec:
      serviceAccountName: adhar-ai
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp
          image: ghcr.io/adhar-io/adhar-ai-mcp-cluster:latest
          imagePullPolicy: Always
          args: ["mcp", "--domain=cluster", "--listen=:8080"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: MCP_DOMAIN
              value: "cluster"
            - name: GITEA_WRITE_ENABLED
              value: "false"
            # The platform AI data plane (agentgateway, ADR-0025) — NOT the
            # retired adhar-ai-llm-gateway. The URL carries the /v1 prefix and
            # the caller POSTs an OpenAI-shaped body that NAMES A MODEL
            # (`claude-*` -> Anthropic, `gpt-*`/`o[1-9]-*` -> OpenAI,
            # `local/*` -> the in-cluster vLLM). There is no server-side
            # provider selection any more: the model name IS the routing key.
            - name: LLM_GATEWAY_URL
              value: "http://adhar-ai-gateway.adhar-system.svc.cluster.local:8080/v1"
            # No OIDC_ISSUER_URL / OIDC_CLIENT_ID: per-server token validation is
            # gone (ADR-0025 "Required changes in adhar-ai", item 6). Every
            # request reaches these servers through agentgateway, which validates
            # the Keycloak JWT ONCE for all seven and authorizes per tool
            # (agentgateway/manifests/security.yaml). The Keycloak `adhar-ai`
            # client and its `groups` mapper stay — the gateway's CEL rules read
            # those claims — and the bearer token is preserved
            # (preserveToken: true) so RBAC-scoped reads still run as the USER.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: adhar-ai-mcp-cluster
  namespace: adhar-system
  labels:
    app.kubernetes.io/name: adhar-ai-mcp-cluster
    app.kubernetes.io/part-of: adhar-ai
    adhar.io/component: ai
    adhar.io/mcp-domain: cluster
    adhar.io/plane: control
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: adhar-ai-mcp-cluster
  ports:
    - name: http
      port: 8080
      targetPort: http
---
