# Adhar AI — package values (ADR-0024).
#
# This package ships plain manifests (manifests/), not a Helm chart, so these
# values are documentation of the knobs the manifests expose rather than chart
# inputs. Override the corresponding env/ConfigMap/Secret in manifests/ to change
# behavior; the single functional switch is the `adhar-ai-llm` secret in Vault.

# Control-plane only (ADR-0023). Data planes get no AI components.
plane: control-plane

# LLM access. THE GATEWAY IS EXTERNAL TO THIS PACKAGE (ADR-0025): the bespoke
# adhar-ai-llm-gateway Deployment is gone and the AI data plane is now
# agentgateway, which this package's components call at
#
#   http://adhar-ai-gateway.adhar-system.svc.cluster.local:8080/v1
#
# Requests are OpenAI-shaped and pick a provider BY MODEL NAME (`claude-*` ->
# Anthropic, `gpt-*`/`o[1-9]-*` -> OpenAI, `local/*` -> the in-cluster vLLM), so
# `provider` is no longer a server-side switch — it is only the default model
# this package's callers name when a caller does not choose one.
#
# The ONE secret (Vault: secret/adhar-ai/llm) still drives credentials; leave it
# unset and the platform runs unaffected/unkeyed. Token/rate BUDGETS moved with
# the gateway: they are the `conditional` local rate limits in
# agentgateway/manifests/guardrails.yaml, keyed on the caller's Keycloak
# group. The numbers below are recorded here only as the values that were
# carried over, and changing them here changes nothing.
llm:
  gateway: external           # agentgateway (ADR-0025); this package ships none
  gatewayUrl: http://adhar-ai-gateway.adhar-system.svc.cluster.local:8080/v1
  defaultModel: claude-opus-4-5-20251101   # latest Claude by default
  budgets:                    # enforced in agentgateway, not here
    perUserDailyTokens: 2000000
    perOpMaxToolCalls: 40
    perOpMaxTokens: 400000
    rateLimitRequestsPerMinute: 60

# Staged autonomy (agent-runtime ConfigMap adhar-ai-config).
# read-only -> suggest -> approve-to-apply -> scoped. Default is conservative.
autonomy:
  default: suggest

# MCP tool servers (one Deployment+Service each). read = RBAC-scoped get/list;
# write = Gitea PR only. No kubectl_apply / cloud-mutation tool exists.
mcpServers:
  cluster:       {write: false}
  gitops:        {write: true}
  provision:     {write: true}
  observability: {write: false}
  security:      {write: true}
  cost:          {write: false}
  catalog:       {write: true}

# The only write credential the agent holds: a Gitea bot token (commit-only).
gitea:
  botUser: adhar-ai-bot
  writeRepos: [packages, environments]

# RAG grounding store (pgvector on CNPG).
rag:
  enabled: true
  database: adhar_ai_rag
  storageSize: 5Gi

# Outward surface (Gateway + OIDC). This package publishes ONE hostname: the
# agent runtime. `ai.<host>` (completions) and `mcp.<host>` (federated tools)
# belong to agentgateway now — see manifests/httproute.yaml for why the
# runtime moved off them.
ingress:
  hostnames:
    - agent.adhar.localtest.me
  oidcClientId: adhar-ai      # kept: the gateway's authz rules read its `groups` claim

# Adhar-owned images track :latest with imagePullPolicy: Always.
# No `gateway` image: ADR-0025 retired adhar-ai-llm-gateway (whose image was
# never built) in favour of the upstream agentgateway proxy.
images:
  runtime: ghcr.io/adhar-io/adhar-ai-runtime:latest
  mcpPrefix: ghcr.io/adhar-io/adhar-ai-mcp-   # + <domain>:latest
