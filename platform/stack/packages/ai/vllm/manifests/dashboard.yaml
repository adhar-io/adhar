# Grafana dashboard for the self-hosted vLLM inference engine (ai/vllm).
# Auto-loaded by the Grafana sidecar (grafana_dashboard label); fed by
# servicemonitor.yaml. Datasource is variable-driven and $model is populated
# from the model_name label vLLM puts on every one of its metrics.
#
# EVERY vllm:* QUERY BELOW USES A METRIC VERIFIED TO EXIST IN v0.29.0
# (vllm/v1/metrics/loggers.py, and confirmed against a live /metrics scrape).
# Counters are queried with the _total suffix the Python Prometheus client adds
# on the wire (declared vllm:prompt_tokens -> scraped vllm:prompt_tokens_total).
# The V0-engine metrics are deliberately absent because the V1 engine removed
# them: vllm:gpu_cache_usage_perc, vllm:cpu_cache_usage_perc,
# vllm:num_requests_swapped, vllm:avg_generation_throughput_toks_per_s.
#
# There is NO GPU-utilisation panel. vLLM exports no GPU metrics of its own and
# Adhar ships no NVIDIA DCGM exporter, so a DCGM_FI_DEV_GPU_UTIL panel would be
# a permanently empty graph. The "Pod resources" row uses cAdvisor CPU/memory,
# which is the number that actually matters on the CPU profile; add
# dcgm-exporter next to the GPU profile if you need VRAM/SM utilisation.
apiVersion: v1
kind: ConfigMap
metadata:
  name: adhar-dashboard-vllm
  namespace: adhar-system
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: adhar-observability
  annotations:
    grafana_folder: "Platform"
