# ClusterSecretStore wiring external-secrets to the in-cluster OpenBao.
#
# !!! THE STORE IS DELIBERATELY STILL NAMED `vault` !!!
# OpenBao is a fork of HashiCorp Vault and is wire-compatible with Vault's HTTP
# API, so the External Secrets provider stays `vault:` and every existing
# consumer keeps working with NO change. Packages that resolve secrets through
# this store by name include:
#   * ai/adhar-ai/manifests/llm-secret-external.yaml   (adhar-ai-llm, adhar-ai-bot)
#   * ai/vllm/manifests/hf-token.yaml                  (vllm-hf-token)
# Renaming the store would break each of those silently (ExternalSecrets go
# SecretSyncedError, workloads start without their credentials), so the name is
# treated as a platform API. openbao and vault therefore both claim
# `ClusterSecretStore/vault` and are MUTUALLY EXCLUSIVE — exactly one secrets
# backend may be enabled at a time (see platform/stack/packages/CONFLICTS.md).
#
# This store lives in the *openbao* package (not external-secrets) on purpose:
# its readiness depends entirely on OpenBao being initialized/unsealed and
# configured with the "external-secrets" kubernetes-auth role. Keeping it here
# means the external-secrets Application stays Healthy as soon as its
# controllers are up, and the store's transient not-ready window is attributed
# to the OpenBao app that actually owns it.
#
# Sync-wave "3" runs it just after the OpenBao bootstrap Job (wave "2"), which
# enables KV v2, kubernetes auth and the "external-secrets" role — so the
# store's first connectivity/auth check succeeds almost immediately and it goes
# Ready without a long Degraded window.
#
# Auth: the external-secrets controller ServiceAccount (external-secrets /
# adhar-system) logs in via OpenBao's kubernetes auth (mount "kubernetes", role
# "external-secrets") and gets the read-only "external-secrets" policy.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/component: secret-store
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  provider:
    # OpenBao speaks Vault's API verbatim; `vault:` is the correct provider.
    vault:
      server: "http://openbao.adhar-system.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "external-secrets"
          serviceAccountRef:
            name: "external-secrets"
            namespace: "adhar-system"
