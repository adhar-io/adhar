# OPENBAO BOOTSTRAP (auto-init / unseal / configure)
#
# Applied AFTER the OpenBao server StatefulSet (chart objects have no sync-wave =
# wave 0; the RBAC/config below run at wave "1", the Job at wave "2"). The Job is
# fully idempotent and safe to re-run: every step checks current state before
# mutating, and it NEVER re-initialises an already-initialised server.
#
# What it does:
#   1. Waits for openbao-0 (svc "openbao") to answer `bao status`.
#   2. Initializes OpenBao (1 key share / threshold 1) ONLY if it reports
#      initialized=false, and stores the init JSON (unseal key + root token) in
#      the K8s Secret "openbao-keys" (adhar-system).
#   3. Unseals using the stored key (skips if already unsealed).
#   4. Logs in with the root token and idempotently configures:
#        - KV v2 secrets engine at path "secret/"
#        - kubernetes auth method (mount "kubernetes/") using the adhar-controlplane
#          SA token / CA / API host (OpenBao's own pod SA acts as token reviewer
#          via its system:auth-delegator binding)
#        - policy "external-secrets" (read on secret/data/* + secret/metadata/*)
#        - kubernetes auth role "external-secrets" bound to the external-secrets
#          controller ServiceAccount (external-secrets / adhar-system)
#        - OIDC auth (Keycloak) + group->policy mappings (configure-oidc.sh,
#          also re-applied every 10 min by the openbao-oidc-reconcile CronJob)
#
# The root token and the unseal key are only ever moved between the OpenBao API
# and the Kubernetes Secret; they are never echoed, and every command that could
# surface them sends output to /dev/null. `set -x` is never enabled.
#
# !!! CLOUD / PRODUCTION WARNING !!!
# This Job stores the unseal key and root token in a plain K8s Secret, which is
# fine for local/dev and for a self-contained platform, but a KMS auto-unseal is
# strictly better where one is available: configure a `seal "awskms" {}` /
# `seal "azurekeyvault" {}` / `seal "gcpckms" {}` stanza in values.yaml and drop
# the init/unseal steps here (or restrict the Job to the configure step).
# See openbao/README.md.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-bootstrap
  namespace: adhar-system
  labels:
    app.kubernetes.io/name: openbao
    app.kubernetes.io/component: bootstrap
  annotations:
    argocd.argoproj.io/sync-wave: "1"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openbao-bootstrap
  namespace: adhar-system
  labels:
    app.kubernetes.io/name: openbao
    app.kubernetes.io/component: bootstrap
  annotations:
    argocd.argoproj.io/sync-wave: "1"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openbao-bootstrap
  namespace: adhar-system
  labels:
    app.kubernetes.io/name: openbao
    app.kubernetes.io/component: bootstrap
  annotations:
    argocd.argoproj.io/sync-wave: "1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openbao-bootstrap
subjects:
  - kind: ServiceAccount
    name: openbao-bootstrap
    namespace: adhar-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openbao-bootstrap
  namespace: adhar-system
  labels:
    app.kubernetes.io/name: openbao
    app.kubernetes.io/component: bootstrap
  annotations:
    argocd.argoproj.io/sync-wave: "1"
data:
  bootstrap.sh: |
    #!/bin/sh
    set -eu

    # OpenBao honours BAO_* first and falls back to VAULT_*; use the native names.
    BAO_ADDR="http://openbao.adhar-system.svc.cluster.local:8200"
    export BAO_ADDR
    KEYS_SECRET="openbao-keys"
    NAMESPACE="adhar-system"

    # External-secrets controller identity (must match its install.yaml).
    ES_SA="external-secrets"
    ES_NS="adhar-system"

    log() { echo "[openbao-bootstrap] $*"; }

    # ---------------------------------------------------------------------
    # 0. The openbao image has the `bao` CLI but no kubectl, so fetch a static
    #    kubectl once (busybox wget supports HTTPS). kubectl picks up the
    #    adhar-controlplane SA token + CA automatically.
    # ---------------------------------------------------------------------
    if ! command -v kubectl >/dev/null 2>&1; then
      log "downloading kubectl"
      KVER="$(wget -q -O - https://dl.k8s.io/release/stable.txt)"
      ARCH="$(uname -m)"
      case "${ARCH}" in
        x86_64) ARCH="amd64" ;;
        aarch64) ARCH="arm64" ;;
      esac
      wget -q -O /tmp/kubectl "https://dl.k8s.io/release/${KVER}/bin/linux/${ARCH}/kubectl"
      chmod +x /tmp/kubectl
      PATH="/tmp:${PATH}"
      export PATH
    fi
    KUBE="kubectl -n ${NAMESPACE}"

    # ---------------------------------------------------------------------
    # 1. Wait for OpenBao to respond. `bao status` exits 0 (unsealed),
    #    2 (sealed) or 1 (no response yet) once the API is reachable.
    # ---------------------------------------------------------------------
    log "waiting for OpenBao API at ${BAO_ADDR}"
    i=0
    while true; do
      # Capture the exit code directly — `$?` after an if-block is the block's
      # status, not the condition's.
      rc=0
      bao status >/dev/null 2>&1 || rc=$?
      if [ "${rc}" = "0" ] || [ "${rc}" = "2" ]; then break; fi
      i=$((i + 1))
      if [ "${i}" -ge 60 ]; then
        log "timed out waiting for OpenBao API"
        exit 1
      fi
      sleep 5
    done
    log "OpenBao API is reachable"

    # ---------------------------------------------------------------------
    # 2. Initialize ONLY if not already initialized; persist init JSON to the
    #    K8s Secret. Re-initialising would destroy every stored secret, so the
    #    guard is deliberately the first thing checked and tolerant of JSON
    #    whitespace.
    # ---------------------------------------------------------------------
    if bao status -format=json | grep -q '"initialized"[[:space:]]*:[[:space:]]*true'; then
      log "OpenBao already initialized"
    else
      log "initializing OpenBao"
      INIT_JSON="$(bao operator init -key-shares=1 -key-threshold=1 -format=json)"
      log "storing init keys in Secret ${KEYS_SECRET}"
      ${KUBE} create secret generic "${KEYS_SECRET}" \
        --from-literal=init.json="${INIT_JSON}" \
        --dry-run=client -o yaml | ${KUBE} apply -f - >/dev/null
    fi

    # ---------------------------------------------------------------------
    # 3. Unseal using the stored key (skip if already unsealed).
    # ---------------------------------------------------------------------
    if bao status -format=json | grep -q '"sealed"[[:space:]]*:[[:space:]]*false'; then
      log "OpenBao already unsealed"
    else
      log "reading unseal key from Secret ${KEYS_SECRET}"
      INIT_JSON="$(${KUBE} get secret "${KEYS_SECRET}" -o jsonpath='{.data.init\.json}' | base64 -d)"
      # `operator init -format=json` pretty-prints across lines; flatten first.
      UNSEAL_KEY="$(echo "${INIT_JSON}" | tr -d '\n' | sed -n 's/.*"unseal_keys_b64":[[:space:]]*\[[[:space:]]*"\([^"]*\)".*/\1/p')"
      if [ -z "${UNSEAL_KEY}" ]; then
        log "could not parse unseal key from ${KEYS_SECRET}"
        exit 1
      fi
      log "unsealing OpenBao"
      bao operator unseal "${UNSEAL_KEY}" >/dev/null
    fi

    # ---------------------------------------------------------------------
    # 4. Login with root token, then configure (all idempotent). The token is
    #    only ever assigned to BAO_TOKEN — never printed.
    # ---------------------------------------------------------------------
    INIT_JSON="$(${KUBE} get secret "${KEYS_SECRET}" -o jsonpath='{.data.init\.json}' | base64 -d)"
    ROOT_TOKEN="$(echo "${INIT_JSON}" | tr -d '\n' | sed -n 's/.*"root_token":[[:space:]]*"\([^"]*\)".*/\1/p')"
    if [ -z "${ROOT_TOKEN}" ]; then
      log "could not parse root token from ${KEYS_SECRET}"
      exit 1
    fi
    BAO_TOKEN="${ROOT_TOKEN}"
    export BAO_TOKEN

    # KV v2 at secret/ (ignore if already enabled).
    if bao secrets list -format=json | grep -q '"secret/"'; then
      log "KV v2 already enabled at secret/"
    else
      log "enabling KV v2 at secret/"
      bao secrets enable -path=secret -version=2 kv || true
    fi

    # kubernetes auth method (ignore if already enabled).
    if bao auth list -format=json | grep -q '"kubernetes/"'; then
      log "kubernetes auth already enabled"
    else
      log "enabling kubernetes auth"
      bao auth enable kubernetes || true
    fi

    # Configure kubernetes auth from the adhar-controlplane environment. Leaving
    # token_reviewer_jwt unset makes OpenBao use its own pod SA (which carries
    # the system:auth-delegator binding) to review login JWTs.
    log "configuring kubernetes auth"
    KUBE_CA="$(cat /var/run/secrets/kubernetes.io/serviceaccount/ca.crt)"
    bao write auth/kubernetes/config \
      kubernetes_host="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT_HTTPS}" \
      kubernetes_ca_cert="${KUBE_CA}" >/dev/null

    # Policy for external-secrets (read-only on KV v2 data + metadata).
    # Built with printf (not a heredoc) so leading indentation inside this
    # YAML block scalar can never break the terminator.
    log "writing policy external-secrets"
    printf '%s\n' \
      'path "secret/data/*" {' \
      '  capabilities = ["read"]' \
      '}' \
      'path "secret/metadata/*" {' \
      '  capabilities = ["read"]' \
      '}' > /tmp/external-secrets.hcl
    bao policy write external-secrets /tmp/external-secrets.hcl

    # Kubernetes auth role bound to the external-secrets controller SA.
    log "creating kubernetes auth role external-secrets"
    bao write auth/kubernetes/role/external-secrets \
      bound_service_account_names="${ES_SA}" \
      bound_service_account_namespaces="${ES_NS}" \
      policies="external-secrets" \
      ttl="1h" >/dev/null

    # Tenant secrets. ClusterSecretStore/vault is restricted to adhar-system
    # (it can read every path), so a tenant reads OpenBao through a
    # SecretStore in its OWN namespace instead. One kubernetes-auth role
    # serves every namespace, and one templated policy confines each login to
    # secret/tenants/<that namespace>/*, using the service_account_namespace
    # the kubernetes auth method records on the login's entity alias. A tenant
    # can only mint a token for a ServiceAccount in a namespace it controls,
    # so it can never name another namespace's path.
    K8S_ACCESSOR="$(bao auth list 2>/dev/null | awk '/^kubernetes\//{print $3; exit}')"
    if [ -n "${K8S_ACCESSOR}" ]; then
      log "writing policy tenant-secrets"
      NS_TMPL="{{identity.entity.aliases.${K8S_ACCESSOR}.metadata.service_account_namespace}}"
      printf '%s\n' \
        "path \"secret/data/tenants/${NS_TMPL}/*\" {" \
        '  capabilities = ["read"]' \
        '}' \
        "path \"secret/metadata/tenants/${NS_TMPL}/*\" {" \
        '  capabilities = ["read", "list"]' \
        '}' > /tmp/tenant-secrets.hcl
      bao policy write tenant-secrets /tmp/tenant-secrets.hcl
      log "creating kubernetes auth role tenant"
      bao write auth/kubernetes/role/tenant \
        bound_service_account_names="adhar-secrets" \
        bound_service_account_namespaces="*" \
        policies="tenant-secrets" \
        ttl="1h" >/dev/null
    else
      log "ERROR: kubernetes auth accessor not found — tenant role not created; re-run by syncing the openbao app"
    fi

    # ---------------------------------------------------------------------
    # 5. OIDC auth method (Keycloak) — enables "Sign in with OIDC" in the
    #    OpenBao UI. It needs the `openbao` Keycloak client secret (openbao-oidc
    #    Secret) and the platform CA (openbao-ca Secret), both delivered by the
    #    ExternalSecrets in oidc.yaml once Keycloak's wave-20 config Job has
    #    written keycloak-clients.
    #
    #    So it WAITS for them. It used to skip, on the reasoning that "this Job
    #    re-runs on every sync (Sync hook) and will configure OIDC on a later
    #    pass" — and that is false once the app converges: Argo CD runs a Sync
    #    hook only when a sync actually happens, and a Synced, Healthy app never
    #    syncs again on its own. Live on 2026-10-11 the Job ran 43 minutes
    #    before the Keycloak client secret existed, logged "OIDC prerequisites
    #    not ready … skipping for now", completed successfully, and never ran
    #    again — so the OpenBao UI offered no OIDC method at all and nobody
    #    could sign in with Keycloak. The prerequisites were present the whole
    #    time anyone looked.
    #
    #    Twenty minutes of patience, the same the library mirrors give
    #    nexus-credentials. Still non-fatal at the end: failing here would take
    #    down the ClusterSecretStore every ExternalSecret on the platform reads,
    #    which is a far worse outcome than a UI without an SSO button — but it
    #    is logged as an ERROR naming the consequence, not as a shrug.
    # ---------------------------------------------------------------------
    # Only the CLIENT SECRET is required. The platform CA is used ONLY when the
    # edge serves a certificate the system roots do not trust (a local or
    # self-signed cluster); requiring it meant a cluster with a publicly trusted
    # certificate — which needs no custom CA at all — waited for a Secret it
    # would never use and then gave up on OIDC entirely.
    read_oidc_prereqs() {
      OIDC_SECRET="$(${KUBE} get secret openbao-oidc -o jsonpath='{.data.OPENBAO_CLIENT_SECRET}' 2>/dev/null | base64 -d 2>/dev/null || true)"
      OIDC_CA="$(${KUBE} get secret openbao-ca -o jsonpath='{.data.tls\.crt}' 2>/dev/null | base64 -d 2>/dev/null || true)"
      [ -n "${OIDC_SECRET}" ]
    }
    OIDC_SECRET=""; OIDC_CA=""
    if ! read_oidc_prereqs; then
      log "waiting up to 20m for the OIDC prerequisites (openbao-oidc / openbao-ca)"
      i=0
      while [ "$i" -lt 120 ]; do
        sleep 10
        i=$((i + 1))
        if read_oidc_prereqs; then
          log "OIDC prerequisites ready after $((i * 10))s"
          break
        fi
      done
    fi
    if [ -n "${OIDC_SECRET}" ]; then
      # The method, role, policies and group mappings live in configure-oidc.sh
      # (below), which the openbao-oidc-reconcile CronJob also runs.
      OIDC_SECRET="${OIDC_SECRET}" OIDC_CA="${OIDC_CA}" sh /scripts/configure-oidc.sh \
        || log "ERROR: OIDC configuration incomplete; the openbao-oidc-reconcile CronJob retries it every 10 minutes"
    else
      log "ERROR: OIDC prerequisites (openbao-oidc / openbao-ca) never arrived — the OpenBao UI will"
      log "ERROR: offer NO Keycloak sign-in until they do. The openbao-oidc-reconcile CronJob checks again"
      log "ERROR: every 10 minutes; openbao-oidc comes from keycloak-clients (OPENBAO_CLIENT_SECRET)."
    fi

    # ---------------------------------------------------------------------
    # Adhar AI: import the credential `adhar up` staged, if there is one.
    #
    # SEED-ONCE, DELIBERATELY. The Job re-runs on every sync; if it overwrote the
    # entry each time, an operator who later rotated the key with `adhar ai key
    # set` would silently get the original one back on the next Argo CD sync. So
    # this writes only when the path does not exist yet: `adhar up` initialises,
    # and every rotation afterwards is authoritative.
    #
    # The value travels as JSON on STDIN, never as a command-line argument, so it
    # does not appear in the container's process list, and nothing here echoes it.
    SEED_DIR=/etc/adhar-ai-seed
    if [ -f "$SEED_DIR/PROVIDER" ]; then
      if bao kv get secret/adhar-ai/llm >/dev/null 2>&1; then
        log "adhar-ai LLM credential already present; leaving it alone"
      else
        log "importing the staged Adhar AI credential into secret/adhar-ai/llm"
        if {
          printf '{'
          first=1
          for f in PROVIDER MODEL ENDPOINT API_KEY ANTHROPIC_API_KEY OPENAI_API_KEY \
                   BUDGET_PER_USER_DAILY_TOKENS BUDGET_PER_OP_MAX_TOOL_CALLS; do
            [ -f "$SEED_DIR/$f" ] || continue
            v="$(cat "$SEED_DIR/$f")"
            [ "$first" -eq 1 ] || printf ','
            first=0
            printf '"%s":"%s"' "$f" "$v"
          done
          printf '}'
        } | bao kv put secret/adhar-ai/llm - >/dev/null 2>&1; then
          log "  wrote secret/adhar-ai/llm (Adhar AI is keyed)"
        else
          log "  WARNING: could not write secret/adhar-ai/llm; run 'adhar ai key set' after the platform settles"
        fi
      fi
    fi

    log "bootstrap complete"
  configure-oidc.sh: |
    #!/bin/sh
    # Idempotent OIDC (Keycloak) configuration of OpenBao, shared by the
    # bootstrap Job (bootstrap.sh, step 5) and the openbao-oidc-reconcile CronJob
    # (oidc-reconcile.sh). Inputs, all from the caller's environment:
    #   BAO_ADDR, BAO_TOKEN  the OpenBao API and the root token (never printed)
    #   OIDC_SECRET          the Keycloak `openbao` client secret (required)
    #   OIDC_CA              the platform CA, only for a self-signed edge (optional)
    # Exits non-zero when the method could not be made usable (config or role),
    # so the CronJob's history shows a failed run instead of a quiet success.
    set -u
    log() { echo "[openbao-oidc] $*"; }
    : "${BAO_ADDR:?}" "${BAO_TOKEN:?}" "${OIDC_SECRET:?}"
    OIDC_CA="${OIDC_CA:-}"
    export BAO_ADDR BAO_TOKEN
    OPENBAO_URL="https://openbao.adhar.localtest.me:8443"
    rc=0

    log "configuring OIDC auth method (Keycloak)"
    if ! bao auth list -format=json | grep -q '"oidc/"'; then
      bao auth enable oidc || true
    fi
    # System CAs FIRST, the platform CA only as a fallback.
    #
    # `oidc_discovery_ca_pem` does not ADD a trust root, it REPLACES the whole
    # set — so handing OpenBao the self-signed platform CA makes a publicly
    # trusted Keycloak fail to verify. Live on 2026-10-11 the edge served a
    # Let's Encrypt certificate (issuer CN=YR1) that curl validated against
    # the system roots on the first try, and the pinned platform CA turned
    # that into `Code: 400 … error checking oidc discovery URL` — an error
    # that names the URL and says nothing about trust, so it reads like the
    # realm being unreachable when the realm was answering 200 the whole time.
    #
    # Which certificate the edge serves depends on the cluster (cert-manager
    # issues a real one wherever DNS-01 works, self-signed otherwise), so this
    # is decided by TRYING rather than configured: no CA, then the CA.
    oidc_config() {
      bao write auth/oidc/config \
        oidc_discovery_url="https://keycloak.adhar.localtest.me:8443/realms/adhar" \
        oidc_client_id="openbao" \
        oidc_client_secret="${OIDC_SECRET}" \
        default_role="default" "$@"
    }
    if oidc_config >/dev/null 2>&1; then
      log "oidc config written (Keycloak verified against the system CAs)"
    elif [ -n "${OIDC_CA}" ] && oidc_config oidc_discovery_ca_pem="${OIDC_CA}" >/dev/null 2>&1; then
      log "oidc config written (Keycloak verified against the platform CA)"
    else
      rc=1
      log "ERROR: could not write auth/oidc/config — the OpenBao UI will offer NO Keycloak sign-in."
      log "ERROR: the discovery URL must be fetchable from this pod AND its certificate must verify"
      log "ERROR: either against the system roots or against the openbao-ca Secret. The"
      log "ERROR: openbao-oidc-reconcile CronJob tries again every 10 minutes; the failing call:"
      oidc_config ${OIDC_CA:+oidc_discovery_ca_pem="${OIDC_CA}"} || true
    fi
    # Redirect URIs: the UI's own popup callback; the click-free start page,
    # which is also where Keycloak returns (security/keycloak/manifests/
    # sso-start.yaml, openbao.html; httproute.yaml.tmpl sends a bare `/` there);
    # the API callback; and the CLI's loopback listener (`bao login -method=oidc`).
    # Every one of them is also registered on the Keycloak client (oidc.yaml).
    # Tokens: 1 h, renewable by the UI while in use, hard-capped at a working day.
    if ! bao write auth/oidc/role/default \
      role_type="oidc" \
      bound_audiences="openbao" \
      allowed_redirect_uris="${OPENBAO_URL}/ui/vault/auth/oidc/oidc/callback,${OPENBAO_URL}/adhar-sso/openbao.html,${OPENBAO_URL}/v1/auth/oidc/oidc/callback,http://localhost:8250/oidc/callback" \
      user_claim="sub" \
      claim_mappings="preferred_username=username" \
      claim_mappings="email=email" \
      oidc_scopes="openid,profile,email,groups" \
      groups_claim="groups" \
      token_policies="default" \
      token_ttl="1h" \
      token_max_ttl="8h" >/dev/null; then
      rc=1
      log "ERROR: oidc role write failed — the OIDC method exists but has no usable role"
    fi
    # List the OIDC method on the UI's sign-in page. Without it the page opens
    # on the Token method and Keycloak hides behind an "Other" dropdown, so a
    # person already signed in to Keycloak had to know to pick OIDC first. With
    # it, OIDC is the first tab — which is also where the click-free start page
    # falls back to when Keycloak is unavailable.
    bao auth tune -listing-visibility=unauth oidc/ >/dev/null \
      || log "ERROR: could not list the oidc method on the sign-in page"

    # Map Keycloak groups -> OpenBao policies so an OIDC login is actually
    # USEFUL. Without this a signed-in user only gets the `default` policy
    # (grants nothing). OpenBao matches the ID token's `groups` claim
    # (groups_claim above, Keycloak `full.path: false`) against EXTERNAL identity
    # groups by alias name; each carries a policy. Mirrors the k8s RBAC the
    # keycloak package ships. Policies are piped via printf (NOT a heredoc) so the
    # HCL stays inside this YAML block scalar.
    log "mapping Keycloak groups to OpenBao policies"
    printf 'path "*" { capabilities = ["create","read","update","delete","list","patch","sudo"] }\n' \
      | bao policy write platform-admin - >/dev/null 2>&1 || log "ERROR: policy platform-admin write failed"
    # Platform-owned paths (bootstrap break-glass credentials, the AI
    # layer's LLM key, the Hugging Face token) are DENIED to developers and
    # viewers; an explicit deny overrides the broad secret/* grant. Without
    # this a platform-viewer, whose Kubernetes role cannot read Secrets,
    # could read the bootstrap admin passwords here.
    PLATFORM_DENY='path "secret/data/adhar/*" { capabilities = ["deny"] }\npath "secret/metadata/adhar/*" { capabilities = ["deny"] }\npath "secret/data/adhar-ai/*" { capabilities = ["deny"] }\npath "secret/metadata/adhar-ai/*" { capabilities = ["deny"] }\npath "secret/data/vllm/*" { capabilities = ["deny"] }\npath "secret/metadata/vllm/*" { capabilities = ["deny"] }\n'
    printf "path \"secret/*\" { capabilities = [\"create\",\"read\",\"update\",\"delete\",\"list\",\"patch\"] }\npath \"sys/mounts\" { capabilities = [\"read\",\"list\"] }\npath \"auth/token/lookup-self\" { capabilities = [\"read\"] }\n${PLATFORM_DENY}" \
      | bao policy write platform-developer - >/dev/null 2>&1 || log "ERROR: policy platform-developer write failed"
    printf "path \"secret/*\" { capabilities = [\"read\",\"list\"] }\npath \"sys/mounts\" { capabilities = [\"read\",\"list\"] }\n${PLATFORM_DENY}" \
      | bao policy write platform-viewer - >/dev/null 2>&1 || log "ERROR: policy platform-viewer write failed"
    OIDC_ACCESSOR="$(bao auth list 2>/dev/null | awk '/^oidc\//{print $3; exit}')"
    for g in platform-admin platform-developer platform-viewer; do
      # identity/group/name/<n> is create-OR-update by name (identity/group with
      # an existing name is not), so a re-run reconciles the policy instead of
      # failing on it.
      bao write identity/group/name/"$g" type="external" policies="$g" >/dev/null 2>&1 \
        || log "ERROR: identity group $g write failed"
      GID="$(bao read -field=id identity/group/name/"$g" 2>/dev/null || true)"
      if [ -n "$GID" ] && [ -n "$OIDC_ACCESSOR" ]; then
        if bao read -format=json identity/group/name/"$g" 2>/dev/null | tr -d ' \n' \
            | grep -q "\"mount_accessor\":\"${OIDC_ACCESSOR}\""; then
          :
        else
          bao write identity/group-alias name="$g" mount_accessor="$OIDC_ACCESSOR" canonical_id="$GID" >/dev/null \
            || log "ERROR: group-alias $g write failed"
        fi
      fi
    done
    log "OIDC configuration done (rc=${rc})"
    exit "${rc}"
  oidc-reconcile.sh: |
    #!/bin/sh
    # openbao-oidc-reconcile CronJob entry point. The bootstrap Job is a Sync hook,
    # and a hook runs only when Argo CD syncs — a Synced, Healthy app never syncs
    # again on its own. Live on 2026-10-24 (AWS) the Job waited its 20 minutes,
    # the Keycloak client secret landed two minutes later, and OpenBao was left
    # with no OIDC method at all: the UI opened on ?with=token and nobody could
    # sign in with Keycloak. This re-applies configure-oidc.sh every 10 minutes
    # from mounted Secrets (no kubectl, no Kubernetes API access), so the method
    # converges whenever its prerequisites arrive and config drift (a rotated
    # client secret, a hand-edited role) is corrected.
    set -u
    BAO_ADDR="http://openbao.adhar-system.svc.cluster.local:8200"
    export BAO_ADDR
    log() { echo "[openbao-oidc-reconcile] $*"; }
    KEYS=/var/run/openbao/keys/init.json
    if [ ! -s "${KEYS}" ]; then
      log "openbao-keys not present yet (OpenBao not initialised); the bootstrap Job does that"
      exit 0
    fi
    if ! bao status -format=json 2>/dev/null | grep -q '"sealed"[[:space:]]*:[[:space:]]*false'; then
      log "OpenBao is sealed or unreachable; nothing to do until the bootstrap Job unseals it"
      exit 0
    fi
    BAO_TOKEN="$(tr -d '\n' < "${KEYS}" | sed -n 's/.*"root_token":[[:space:]]*"\([^"]*\)".*/\1/p')"
    OIDC_SECRET="$(cat /var/run/openbao/oidc/OPENBAO_CLIENT_SECRET 2>/dev/null || true)"
    OIDC_CA="$(cat /var/run/openbao/ca/tls.crt 2>/dev/null || true)"
    if [ -z "${BAO_TOKEN}" ]; then
      log "ERROR: could not parse the root token from openbao-keys"
      exit 1
    fi
    if [ -z "${OIDC_SECRET}" ]; then
      log "ERROR: openbao-oidc (OPENBAO_CLIENT_SECRET from keycloak-clients) not present yet; no Keycloak sign-in until it is"
      exit 0
    fi
    export BAO_TOKEN OIDC_SECRET OIDC_CA
    exec sh /scripts/configure-oidc.sh
---
apiVersion: batch/v1
kind: Job
metadata:
  name: openbao-bootstrap
  namespace: adhar-system
  labels:
    app.kubernetes.io/name: openbao
    app.kubernetes.io/component: bootstrap
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    # Re-run on every sync so config drift is reconciled idempotently.
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 5
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openbao
        app.kubernetes.io/component: bootstrap
    spec:
      serviceAccountName: openbao-bootstrap
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          # Pinned to the chart's appVersion (openbao/openbao 0.29.4 -> v2.6.2)
          # so the CLI and the server always speak the same API.
          image: quay.io/openbao/openbao:2.6.2
          command: ["/bin/sh", "/scripts/bootstrap.sh"]
          volumeMounts:
            - name: script
              mountPath: /scripts
            - name: ai-llm-seed
              mountPath: /etc/adhar-ai-seed
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: openbao-bootstrap
            defaultMode: 0755
        # The LLM credential `adhar up` stages when the operator exported
        # ADHAR_AI_LLM_API_KEY (cmd/up/ai_seed.go). Optional: on a platform brought
        # up without one the Secret simply does not exist and the import below is
        # skipped, which is the normal case.
        - name: ai-llm-seed
          secret:
            secretName: adhar-ai-llm-seed
            optional: true
---
# Keeps the OIDC (Keycloak) sign-in converged — see oidc-reconcile.sh above for
# why a Sync hook alone cannot. Reads the root token, the Keycloak client
# secret and the platform CA from mounted Secrets (all optional, so it exists
# harmlessly before any of them do); it has no ServiceAccount token and no
# Kubernetes API access.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: openbao-oidc-reconcile
  namespace: adhar-system
  labels:
    app.kubernetes.io/name: openbao
    app.kubernetes.io/component: oidc-reconcile
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300
      ttlSecondsAfterFinished: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: openbao
            app.kubernetes.io/component: oidc-reconcile
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          enableServiceLinks: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 1000
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: reconcile
              # Same image as the server and the bootstrap Job (CLI == API).
              image: quay.io/openbao/openbao:2.6.2
              command: ["/bin/sh", "/scripts/oidc-reconcile.sh"]
              env:
                - {name: HOME, value: /tmp}
              resources:
                requests: {cpu: 10m, memory: 32Mi}
                limits: {memory: 96Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              volumeMounts:
                - {name: script, mountPath: /scripts, readOnly: true}
                - {name: keys, mountPath: /var/run/openbao/keys, readOnly: true}
                - {name: oidc, mountPath: /var/run/openbao/oidc, readOnly: true}
                - {name: ca, mountPath: /var/run/openbao/ca, readOnly: true}
                - {name: tmp, mountPath: /tmp}
          volumes:
            - name: script
              configMap:
                name: openbao-bootstrap
                defaultMode: 0755
            - name: keys
              secret:
                secretName: openbao-keys
                optional: true
                items: [{key: init.json, path: init.json}]
            - name: oidc
              secret:
                secretName: openbao-oidc
                optional: true
            - name: ca
              secret:
                secretName: openbao-ca
                optional: true
            - name: tmp
              emptyDir: {}
