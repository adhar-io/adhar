# Prometheus scrape targets for runtime threat detection (sync-wave 10: the
# monitoring CRDs come from kube-prometheus and may not exist on a first boot).
#
# Two monitors, two different questions:
#   falco-falcosidekick  — WHAT Falco saw: falcosecurity_falcosidekick_falco_events_total
#                          {rule, priority, priority_raw, source, k8s_ns_name, k8s_pod_name}
#                          and the fan-out health, falcosecurity_falcosidekick_outputs_total
#                          {destination, status}. The dashboard and rules.yaml read these.
#   falco-metrics        — WHETHER Falco is healthy: rules loaded, kernel events
#                          dropped, probe state (falcosecurity_falco_* / _scap_*),
#                          from the DaemonSet's :8765 webserver (values.yaml
#                          metrics.enabled + webserver.prometheus_metrics_enabled).
# Prometheus' serviceMonitorSelector is {} so both are picked up as-is.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  name: falco-falcosidekick
  namespace: adhar-system
  labels:
    app.kubernetes.io/name: falcosidekick
    app.kubernetes.io/instance: falco
    app.kubernetes.io/managed-by: adhar
spec:
  jobLabel: app.kubernetes.io/name
  namespaceSelector:
    matchNames:
      - adhar-system
  selector:
    matchLabels:
      app.kubernetes.io/name: falcosidekick
      app.kubernetes.io/instance: falco
      app.kubernetes.io/component: core
  endpoints:
    - port: http
      path: /metrics
      interval: 60s
      scrapeTimeout: 30s
      honorLabels: true
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  name: falco-metrics
  namespace: adhar-system
  labels:
    app.kubernetes.io/name: falco
    app.kubernetes.io/instance: falco
    app.kubernetes.io/managed-by: adhar
spec:
  jobLabel: app.kubernetes.io/name
  namespaceSelector:
    matchNames:
      - adhar-system
  selector:
    # The chart labels the falco-metrics Service with only these two; the
    # sidekick Services carry name=falcosidekick, so this cannot match them.
    matchLabels:
      app.kubernetes.io/name: falco
      app.kubernetes.io/instance: falco
  endpoints:
    - port: metrics
      path: /metrics
      interval: 60s
      scrapeTimeout: 30s
