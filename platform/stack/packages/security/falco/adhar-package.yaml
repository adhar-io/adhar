# Adhar marketplace contract for the falco package.
# Validated against platform/stack/packages/marketplace.schema.json
# (run: hack/validate-packages.sh). See MARKETPLACE.md for the contract.
# Scaffolded by hack/gen-package-contracts.sh — refine it by hand as the
# package changes; the generator never overwrites an existing contract.
apiVersion: marketplace.adhar.io/v1alpha1
kind: AdharPackage
name: falco
category: security
version: "9.1.0"
description: "Falco runtime threat detection: Falcosidekick fans every event out to Loki, Alertmanager (Warning+ → the Console), Prometheus and a persisted search API the Console's runtime-security feed reads; platform-aware rules watch AI agent workloads."
maintainer:
  name: Adhar Platform Team
  url: https://github.com/adhar-io/adhar
  firstParty: true
license: Apache-2.0
homepage: https://falco.org
adharCompatibility:
  minVersion: "0.1.0"
dependencies:
  # Sinks, not prerequisites: the DaemonSet runs without them, but events have
  # nowhere to go (Loki) and nothing turns them into pages (kube-prometheus owns
  # the PrometheusRule/ServiceMonitor CRDs and the Alertmanager they reach).
  - name: loki-stack
    category: observability
    optional: true
  - name: kube-prometheus
    category: observability
    optional: true
provenance:
  sourceRepo: https://github.com/adhar-io/adhar
  upstreamChart: falcosecurity/falco
  signed: true                 # release artifacts are Cosign-keyless signed by the GoReleaser pipeline
  cosignKeyless: true          # Sigstore Fulcio + Rekor, ADR-0019
  scanned: true
  scanner: trivy
  sbom: https://github.com/adhar-io/adhar/releases  # SPDX SBOMs are attached to every release
planeAffinity: data-plane   # runs as a per-node DaemonSet watching syscalls
stability: beta   # enabled in the production curated set only
resources:
  localSafe: false   # mirrors the enabled gate in adhar-appset-local.yaml
keywords:
  - runtime-security
  - threat-detection
  - ebpf
  - falco
verification:
  status: verified
  profile: production
  verifiedAt: "2026-09-23"
  platformVersion: "v0.1.23"
  kubernetesVersion: "v1.37.0"
