# Keycloak SSO in front of the Policy Reporter UI (no native auth). oauth2-proxy
# gates it with the `policy-reporter` Keycloak client (secret via ESO from
# keycloak-clients). Same pattern as the Tekton / Argo Rollouts dashboards.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: policy-reporter-oauth2-proxy
  namespace: adhar-system
spec:
  refreshPolicy: CreatedOnce
  refreshInterval: 30s
  secretStoreRef:
    name: keycloak
    kind: ClusterSecretStore
  target:
    name: policy-reporter-oauth2-proxy
    template:
      engineVersion: v2
      data:
        OAUTH2_PROXY_CLIENT_SECRET: "{{ .POLICY_REPORTER_CLIENT_SECRET }}"
        OAUTH2_PROXY_COOKIE_SECRET: "{{ .COOKIE_SECRET }}"
  data:
    - secretKey: POLICY_REPORTER_CLIENT_SECRET
      remoteRef:
        key: keycloak-clients
        property: POLICY_REPORTER_CLIENT_SECRET
    # The platform-wide cookie secret (security/keycloak/manifests/sso-cookie.yaml).
    # Shared by every oauth2-proxy so a session established by one app is
    # accepted by all of them.
    - secretKey: COOKIE_SECRET
      remoteRef:
        key: adhar-sso-cookie
        property: COOKIE_SECRET
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: policy-reporter-oauth2-proxy
  namespace: adhar-system
  labels:
    app.kubernetes.io/name: policy-reporter-oauth2-proxy
    app.kubernetes.io/part-of: policy-reporter
spec:
  # A late SSO secret (this app can sync before Keycloak has written
  # keycloak-clients) must not hold the rollout Progressing for the default
  # 10 minutes — surface it fast so ArgoCD retries.
  progressDeadlineSeconds: 120
  replicas: 1
  selector:
    matchLabels:
      app: policy-reporter-oauth2-proxy
  template:
    metadata:
      labels:
        app: policy-reporter-oauth2-proxy
    spec:
      enableServiceLinks: false
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1
          args:
            - --http-address=0.0.0.0:4180
            - --provider=oidc
            - --oidc-issuer-url=https://keycloak.adhar.localtest.me:8443/realms/adhar
            - --ssl-insecure-skip-verify=true
            - --client-id=policy-reporter
            - --redirect-url=https://policy-reporter.adhar.localtest.me:8443/oauth2/callback
            - --upstream=http://policy-reporter-ui.adhar-system.svc.cluster.local:8080
            - --email-domain=*
            - --scope=openid profile email groups
            - --cookie-secure=true
            # Parent-domain cookie + the shared secret above = real single
            # sign-on: another app's proxy accepts this session without a round
            # trip to Keycloak. Seed-time host rewriting turns the literal
            # domain into the platform's own.
            - --cookie-domain=.adhar.localtest.me
            - --whitelist-domain=.adhar.localtest.me:8443
            - --skip-provider-button=true
            - --reverse-proxy=true
          envFrom:
            - secretRef:
                name: policy-reporter-oauth2-proxy
          ports:
            - name: http
              containerPort: 4180
          readinessProbe:
            httpGet:
              path: /ping
              port: 4180
            initialDelaySeconds: 5
            timeoutSeconds: 10
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: policy-reporter-oauth2-proxy
  namespace: adhar-system
  labels:
    app.kubernetes.io/name: policy-reporter-oauth2-proxy
    app.kubernetes.io/part-of: policy-reporter
spec:
  selector:
    app: policy-reporter-oauth2-proxy
  ports:
    - name: http
      port: 4180
      targetPort: 4180
