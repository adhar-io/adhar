apiVersion: apps/v1
kind: Deployment
metadata:
  name: policy-reporter
  namespace: adhar-system
  labels:
    app.kubernetes.io/name: policy-reporter
    app.kubernetes.io/instance: policy-reporter
    app.kubernetes.io/version: 3.10.0
    app.kubernetes.io/component: reporting
    app.kubernetes.io/part-of: policy-reporter
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: policy-reporter-3.10.0
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: policy-reporter
      app.kubernetes.io/instance: policy-reporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: policy-reporter
        app.kubernetes.io/instance: policy-reporter
        app.kubernetes.io/version: 3.10.0
        app.kubernetes.io/part-of: policy-reporter
        helm.sh/chart: policy-reporter-3.10.0
      annotations:
        checksum/secret: c24c48f06b91092d8762958fb2dcd973624a727640cc86aab6a055266a6491f1
    spec:
      serviceAccountName: policy-reporter
      automountServiceAccountToken: true
      securityContext:
        fsGroup: 1234
      containers:
      - name: policy-reporter
        image: ghcr.io/kyverno/policy-reporter:3.10.0
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1234
          seccompProfile:
            type: RuntimeDefault
        args:
        - --port=8080
        - --config=/app/config.yaml
        - --dbfile=/sqlite/database.db
        - --metrics-enabled=true
        - --rest-enabled=true
        - --profile=false
        - --lease-name=policy-reporter
        - --template-dir=/app/templates
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /ready
            port: http
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
        resources:
          limits:
            memory: 512Mi
          requests:
            cpu: 50m
            memory: 128Mi
        volumeMounts:
        - name: sqlite
          mountPath: /sqlite
        - name: config-file
          mountPath: /app/config.yaml
          subPath: config.yaml
          readOnly: true
        - name: tmp
          mountPath: /tmp
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
      volumes:
      - name: sqlite
        emptyDir: {}
      - name: config-file
        secret:
          secretName: policy-reporter-config
          optional: true
      - name: tmp
        emptyDir: {}
      enableServiceLinks: false

