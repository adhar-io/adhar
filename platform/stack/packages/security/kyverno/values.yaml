crds:
  enabled: true
# Each policy's OWN failurePolicy decides (user decision DEC-4, 2026-11-14). This
# flag used to force every policy webhook to Ignore: on a single-node local cluster
# the admission controller gets probe-killed under load, and with Fail webhooks
# every API write the policies match is then rejected, which stalls Argo CD syncs
# and kubelet pod creation until Kyverno recovers. That protection is kept policy by
# policy instead: every Kyverno policy in the stack states failurePolicy Ignore
# itself, except core/adhar-batch's adhar-batch-run-integrity and
# adhar-batch-queue-binding, which must fail CLOSED (design 0025 §10.3: a Kyverno
# outage blocks a person's manual or Volcano run, never a scheduled one, whose
# controllers their matchConditions exclude). The flag also overrode those two, so
# they admitted everything while Kyverno was down. A policy that names no
# failurePolicy gets Kyverno's default, Fail, so
# TestEveryKyvernoPolicyStatesItsFailurePolicy refuses one that does not say.
features:
  forceFailurePolicyIgnore:
    enabled: false
  # PolicyExceptions ON, and only honoured from the platform namespace. They were
  # off (the chart default), so the exceptions shipped in
  # security/adhar-kyverno-policies were inert and every node agent that needs
  # host access by design — Cilium, Falco, Tetragon, node-exporter, the CSI
  # drivers — reported as a policy failure (2026-10-24). Restricting the
  # namespace keeps a team from exempting its own workloads.
  policyExceptions:
    enabled: true
    namespace: adhar-system

# Admit the platform namespace. The chart excludes its own release namespace
# from BOTH the resource filters and the webhook namespaceSelector, and on this
# platform that namespace is adhar-system — where every package, including
# kpack's build pods, lives (ADR-0011). With the exclusion in place the
# `kpack-build-ca-trust` mutate (application/supply-chain) never fired, build
# pods never got the Harbor CA, and every golden-path build failed on
# "x509: certificate signed by unknown authority" (2026-09-15 DO bring-up).
# Validation policies stay Audit / exclude adhar-system themselves, so
# admitting it changes admission only for the mutate rules that target it.
config:
  excludeKyvernoNamespace: false
  webhooks:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system]

# Trust the platform CA in every Kyverno controller. `verify-image-signatures`
# fetches signatures from the adhar-controlplane Harbor (harbor-core.adhar-system.svc,
# an internal CA) — without the CA the verifier fails with "Get https://harbor-
# core…/v2/: tls: …" and every platform-built image is refused as unverified,
# so no golden path ever reaches a running Pod (2026-09-15 DO bring-up). The
# `adhar-ca` ConfigMap is distributed by application/supply-chain; it is
# optional here because Kyverno starts before that package, and the
# distributor restarts the admission controller once the bundle exists (Go
# loads the system roots once, on first use). Kept OUT of
# global.caCertificates, which replaces /etc/ssl/certs/ca-certificates.crt and
# would drop the public CAs Kyverno needs to verify ghcr.io/docker.io images.
admissionController:
  container:
    extraEnvVars:
      - {name: SSL_CERT_DIR, value: /etc/ssl/certs:/etc/adhar-ca}
  extraVolumes:
    - name: adhar-ca
      configMap: {name: adhar-ca, optional: true}
  extraVolumeMounts:
    - {name: adhar-ca, mountPath: /etc/adhar-ca, readOnly: true}
backgroundController:
  extraEnvVars:
    - {name: SSL_CERT_DIR, value: /etc/ssl/certs:/etc/adhar-ca}
  extraVolumes:
    - name: adhar-ca
      configMap: {name: adhar-ca, optional: true}
  extraVolumeMounts:
    - {name: adhar-ca, mountPath: /etc/adhar-ca, readOnly: true}
reportsController:
  extraEnvVars:
    - {name: SSL_CERT_DIR, value: /etc/ssl/certs:/etc/adhar-ca}
  extraVolumes:
    - name: adhar-ca
      configMap: {name: adhar-ca, optional: true}
  extraVolumeMounts:
    - {name: adhar-ca, mountPath: /etc/adhar-ca, readOnly: true}
