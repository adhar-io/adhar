---
apiVersion: batch/v1
kind: Job
metadata:
  name: config
  namespace: adhar-system
  annotations:
    # Runs DURING sync at wave 20 — after the Keycloak Deployment (wave 10) is
    # healthy — so it can register the realm/clients and write the
    # keycloak-clients Secret BEFORE the consumer ExternalSecrets (wave 40) try
    # to read it. As a PostSync hook it ran only after the whole sync succeeded,
    # but the sync could never succeed because argocd-oidc/gitea-oauth (wave 0)
    # failed with "could not get secret data from provider" (keycloak-clients
    # did not exist yet) — a deadlock that left Keycloak permanently OutOfSync.
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "20"
spec:
  template:
    metadata:
      generateName: config
    spec:
      serviceAccountName: keycloak-config
      restartPolicy: Never
      volumes:
        - name: keycloak-config
          secret:
            secretName: keycloak-config
        - name: config-payloads
          configMap:
            name: config-job
      containers:
        - name: kubectl
          # alpine/k8s ships bash+curl+jq+kubectl preinstalled: the previous
          # ubuntu:22.04 spent minutes on apt update/install + kubectl download
          # on EVERY keycloak sync, dominating platform provisioning time.
          image: docker.io/alpine/k8s:1.31.0
          volumeMounts:
            - name: keycloak-config
              readOnly: true
              mountPath: "/var/secrets/"
            - name: config-payloads
              readOnly: true
              mountPath: "/var/config/"
          command: ["/bin/bash", "-c"]
          args:
            - |
              #! /bin/bash
  
              set -ex -o pipefail
              
              ADMIN_PASSWORD=$(cat /var/secrets/KEYCLOAK_ADMIN_PASSWORD)
              USER1_PASSWORD=$(cat /var/secrets/USER_PASSWORD)

              KEYCLOAK_URL=http://keycloak.adhar-system.svc.cluster.local:8080

              KEYCLOAK_TOKEN=$(curl -sS  --fail-with-body -X POST -H "Content-Type: application/x-www-form-urlencoded" \
                --data-urlencode "username=adhar-admin" \
                --data-urlencode "password=${ADMIN_PASSWORD}" \
                --data-urlencode "grant_type=password" \
                --data-urlencode "client_id=admin-cli" \
                ${KEYCLOAK_URL}/realms/master/protocol/openid-connect/token | jq -e -r '.access_token')
                
              set +e

              # Master-realm admin tokens default to a 60s lifespan, but this job
              # spends minutes in apt installs and kubectl downloads between API
              # calls — every call after the first slow section then got HTTP 401
              # and the job died half-provisioned. Raise the lifespan first and
              # fetch a fresh token that carries it, so the whole script runs
              # inside one valid token.
              curl -sS -H "Content-Type: application/json" \
                -H "Authorization: bearer ${KEYCLOAK_TOKEN}" \
                -X PUT --data '{"accessTokenLifespan":1800}' \
                "${KEYCLOAK_URL}/admin/realms/master"
              KEYCLOAK_TOKEN=$(curl -sS --fail-with-body -X POST -H "Content-Type: application/x-www-form-urlencoded" \
                --data-urlencode "username=adhar-admin" \
                --data-urlencode "password=${ADMIN_PASSWORD}" \
                --data-urlencode "grant_type=password" \
                --data-urlencode "client_id=admin-cli" \
                ${KEYCLOAK_URL}/realms/master/protocol/openid-connect/token | jq -e -r '.access_token')

              # The platform runs behind the self-signed Cilium Gateway, which
              # terminates TLS and forwards to Keycloak over plain HTTP. With the
              # realm default sslRequired=external, Keycloak rejects browser logins
              # coming from an external client with {"error":"HTTPS required"} unless
              # the proxy's X-Forwarded-Proto=https reaches it — which is not
              # guaranteed here. Relax the MASTER realm (admin console login) to
              # sslRequired=NONE. This runs on every sync, BEFORE the early-exit
              # below, so admin login keeps working even after the realm exists.
              curl -sS -H "Content-Type: application/json" \
                -H "Authorization: bearer ${KEYCLOAK_TOKEN}" \
                -X PUT --data '{"sslRequired":"NONE"}' \
                "${KEYCLOAK_URL}/admin/realms/master"

              # Same for the adhar realm (user1/user2 + app SSO). This is a no-op
              # 404 on the very first run before the realm exists (it is then
              # created with sslRequired=NONE from realm-payload.json below), and
              # on later runs it fixes a pre-existing realm that was created as
              # sslRequired=external.
              curl -sS -H "Content-Type: application/json" \
                -H "Authorization: bearer ${KEYCLOAK_TOKEN}" \
                -X PUT --data '{"sslRequired":"NONE"}' \
                "${KEYCLOAK_URL}/admin/realms/adhar"

              # Reconcile OIDC client configs (redirect URIs, scopes, web origins) on
              # EVERY sync by PUT-ing the desired client representation onto the
              # existing client. Without this, the early-exit below skips client
              # setup on an already-provisioned realm, so config changes (e.g. the
              # move to per-app subdomains) never reach the clients and SSO breaks
              # with redirect_uri mismatch. Non-fatal (runs under set +e).
              for c in argo adhar-console headlamp grafana argocd gitea prometheus vault harbor rustfs minio adhar-cli tekton; do
                pf="/var/config/${c}-client-payload.json"
                [ -f "${pf}" ] || continue
                cid=$(jq -r '.clientId' "${pf}")
                id=$(curl -sS -H "Authorization: bearer ${KEYCLOAK_TOKEN}" \
                  "${KEYCLOAK_URL}/admin/realms/adhar/clients?clientId=${cid}" | jq -r '.[0].id // empty')
                if [ -n "${id}" ]; then
                  echo "reconciling client ${cid}"
                  curl -sS -H "Content-Type: application/json" -H "Authorization: bearer ${KEYCLOAK_TOKEN}" \
                    -X PUT --data @"${pf}" "${KEYCLOAK_URL}/admin/realms/adhar/clients/${id}" >/dev/null 2>&1 || true
                else
                  # Client missing on an already-provisioned realm (e.g. a newly
                  # added client like adhar-console). Create it and attach the
                  # groups default scope so its tokens carry the groups claim.
                  echo "creating missing client ${cid}"
                  curl -sS -H "Content-Type: application/json" -H "Authorization: bearer ${KEYCLOAK_TOKEN}" \
                    -X POST --data @"${pf}" "${KEYCLOAK_URL}/admin/realms/adhar/clients" >/dev/null 2>&1 || true
                  id=$(curl -sS -H "Authorization: bearer ${KEYCLOAK_TOKEN}" \
                    "${KEYCLOAK_URL}/admin/realms/adhar/clients?clientId=${cid}" | jq -r '.[0].id // empty')
                  gid=$(curl -sS -H "Authorization: bearer ${KEYCLOAK_TOKEN}" \
                    "${KEYCLOAK_URL}/admin/realms/adhar/client-scopes" | jq -r '.[] | select(.name=="groups") | .id')
                  if [ -n "${id}" ] && [ -n "${gid}" ]; then
                    curl -sS -H "Authorization: bearer ${KEYCLOAK_TOKEN}" \
                      -X PUT "${KEYCLOAK_URL}/admin/realms/adhar/clients/${id}/default-client-scopes/${gid}" >/dev/null 2>&1 || true
                  fi
                fi
              done

              # Ensure the adhar-console client secret is present in the
              # keycloak-clients Secret even on an already-provisioned realm (the
              # full create-path + rebuild-if-missing below only run on fresh /
              # absent state). Lets the console's console-oidc ExternalSecret
              # resolve ADHAR_CONSOLE_CLIENT_SECRET after this client is added.
              # Non-fatal (runs under set +e).
              ACS_ID=$(curl -sS -H "Authorization: bearer ${KEYCLOAK_TOKEN}" \
                "${KEYCLOAK_URL}/admin/realms/adhar/clients?clientId=adhar-console" | jq -r '.[0].id // empty')
              if [ -n "${ACS_ID}" ]; then
                ACS=$(curl -sS -H "Authorization: bearer ${KEYCLOAK_TOKEN}" \
                  "${KEYCLOAK_URL}/admin/realms/adhar/clients/${ACS_ID}" | jq -r '.secret // empty')
                if [ -n "${ACS}" ] && kubectl -n adhar-system get secret keycloak-clients >/dev/null 2>&1; then
                  kubectl -n adhar-system patch secret keycloak-clients --type merge \
                    -p "{\"stringData\":{\"ADHAR_CONSOLE_CLIENT_ID\":\"adhar-console\",\"ADHAR_CONSOLE_CLIENT_SECRET\":\"${ACS}\"}}" >/dev/null 2>&1 || true
                fi
              fi

              # A realm can exist half-provisioned: an earlier job run that died
              # mid-way (e.g. on token expiry) created the realm but none of the
              # clients. Treating bare existence as "provisioned" made the
              # early-exit below rebuild keycloak-clients with EMPTY secrets and
              # exit 0, silently breaking SSO everywhere. Only early-exit when a
              # sentinel client is present too; otherwise drop the partial realm
              # and run full provisioning.
              REALM_OK=1
              curl --fail-with-body -H "Authorization: bearer ${KEYCLOAK_TOKEN}"  "${KEYCLOAK_URL}/admin/realms/adhar"  &> /dev/null || REALM_OK=0
              if [ "${REALM_OK}" = "1" ]; then
                SENTINEL=$(curl -sS -H "Authorization: bearer ${KEYCLOAK_TOKEN}" "${KEYCLOAK_URL}/admin/realms/adhar/clients?clientId=argocd" | jq -r '.[0].id // empty')
                if [ -z "${SENTINEL}" ]; then
                  echo "adhar realm exists but is half-provisioned (no argocd client); recreating"
                  curl -sS -H "Authorization: bearer ${KEYCLOAK_TOKEN}" -X DELETE "${KEYCLOAK_URL}/admin/realms/adhar"
                  REALM_OK=0
                fi
              fi
              if [ "${REALM_OK}" = "1" ]; then
                # Realm already provisioned. The keycloak-clients Secret lives in
                # the cluster and can be lost independently of the realm (e.g. a
                # namespace migration) — rebuild it from Keycloak if missing,
                # otherwise every OIDC ExternalSecret downstream stays broken.
                SA_TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
                SA_CA=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                if ! curl -sS --fail --cacert "${SA_CA}" -H "Authorization: Bearer ${SA_TOKEN}" \
                    "https://kubernetes.default.svc/api/v1/namespaces/adhar-system/secrets/keycloak-clients" &>/dev/null; then
                  echo "keycloak-clients secret missing; rebuilding from Keycloak"
                  getsec() { curl -sS -H "Authorization: bearer ${KEYCLOAK_TOKEN}" "${KEYCLOAK_URL}/admin/realms/adhar/clients?clientId=$1" | jq -r '.[0].secret // empty'; }
                  ARGOCD_PASSWORD=$(kubectl -n adhar-system get secret argocd-initial-admin-secret -o go-template='{{.data.password | base64decode }}' 2>/dev/null || true)
                  ARGOCD_SESSION_TOKEN=$(curl -sS http://argo-cd-argocd-server.adhar-system.svc.cluster.local:80/api/v1/session -H 'Content-Type: application/json' -d "{\"username\":\"admin\",\"password\":\"${ARGOCD_PASSWORD}\"}" 2>/dev/null | jq -r '.token // empty' 2>/dev/null || true)
                  kubectl -n adhar-system create secret generic keycloak-clients \
                    --from-literal=ARGO_WORKFLOWS_CLIENT_ID=argo-workflows --from-literal=ARGO_WORKFLOWS_CLIENT_SECRET="$(getsec argo-workflows)" \
                    --from-literal=ARGOCD_SESSION_TOKEN="${ARGOCD_SESSION_TOKEN}" \
                    --from-literal=ADHAR_CONSOLE_CLIENT_ID=adhar-console --from-literal=ADHAR_CONSOLE_CLIENT_SECRET="$(getsec adhar-console)" \
                    --from-literal=HEADLAMP_CLIENT_ID=headlamp --from-literal=HEADLAMP_CLIENT_SECRET="$(getsec headlamp)" \
                    --from-literal=GRAFANA_CLIENT_ID=grafana --from-literal=GRAFANA_CLIENT_SECRET="$(getsec grafana)" \
                    --from-literal=ARGOCD_CLIENT_ID=argocd --from-literal=ARGOCD_CLIENT_SECRET="$(getsec argocd)" \
                    --from-literal=GITEA_CLIENT_ID=gitea --from-literal=GITEA_CLIENT_SECRET="$(getsec gitea)" \
                    --from-literal=PROMETHEUS_CLIENT_ID=prometheus --from-literal=PROMETHEUS_CLIENT_SECRET="$(getsec prometheus)" \
                    --from-literal=VAULT_CLIENT_ID=vault --from-literal=VAULT_CLIENT_SECRET="$(getsec vault)" \
                    --from-literal=HARBOR_CLIENT_ID=harbor --from-literal=HARBOR_CLIENT_SECRET="$(getsec harbor)" \
                    --from-literal=RUSTFS_CLIENT_ID=rustfs --from-literal=RUSTFS_CLIENT_SECRET="$(getsec rustfs)" \
                    --from-literal=TEKTON_CLIENT_ID=tekton --from-literal=TEKTON_CLIENT_SECRET="$(getsec tekton)" \
                    --from-literal=MINIO_CLIENT_ID=minio --from-literal=MINIO_CLIENT_SECRET="$(getsec minio)" \
                    --dry-run=client -o yaml | kubectl apply -f -
                fi
                exit 0
              fi
              set -e
              
              echo "creating adhar realm and groups"
              
