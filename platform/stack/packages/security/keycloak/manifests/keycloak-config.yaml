  # NOTE: keep "description" under 255 chars — Keycloak stores it in a
  # varchar(255) column, and a longer value makes client creation fail with an
  # opaque 500 ("unknown_error"). The create calls in the config job are
  # non-fatal, so the client silently never exists, keycloak-clients gets an
  # EMPTY ADHAR_CONSOLE_CLIENT_SECRET, and the console crash-loops with
  # "Missing: AUTH_CLIENT_SECRET".
  # Full context: confidential OIDC client for the Adhar Console
  # (console.adhar.localtest.me), server-side BFF authorization-code flow;
  # access tokens carry the 'kubernetes' audience (matching the kube-apiserver
  # --oidc-client-id) + the groups claim, enabling per-user kube-apiserver
  # impersonation and RBAC.
  adhar-console-client-payload.json: |
    {
      "protocol": "openid-connect",
      "clientId": "adhar-console",
      "name": "Adhar Console",
      "description": "Adhar Console OIDC client (server-side BFF auth-code flow; access tokens carry aud=kubernetes + groups for per-user kube-apiserver impersonation and RBAC)",
      "publicClient": false,
      "authorizationServicesEnabled": false,
      "serviceAccountsEnabled": true,
      "implicitFlowEnabled": false,
      "directAccessGrantsEnabled": false,
      "standardFlowEnabled": true,
      "frontchannelLogout": true,
      "attributes": {
        "saml_idp_initiated_sso_url_name": "",
        "oauth2.device.authorization.grant.enabled": false,
        "oidc.ciba.grant.enabled": false,
        "post.logout.redirect.uris": "https://console.adhar.localtest.me:8443/*##http://localhost:5100/*"
      },
      "alwaysDisplayInConsole": false,
      "rootUrl": "https://console.adhar.localtest.me:8443",
      "baseUrl": "/",
      "redirectUris": [
        "https://console.adhar.localtest.me:8443/api/auth/callback",
        "https://console.adhar.localtest.me:8443/*",
        "http://localhost:5100/api/auth/callback",
        "http://localhost:5100/*"
      ],
      "webOrigins": [
        "https://console.adhar.localtest.me:8443",
        "http://localhost:5100"
      ],
      "protocolMappers": [
        {
          "name": "kubernetes-audience",
          "protocol": "openid-connect",
          "protocolMapper": "oidc-audience-mapper",
          "config": {
            "included.custom.audience": "kubernetes",
            "id.token.claim": "false",
            "access.token.claim": "true"
          }
        },
        {
          "name": "groups",
          "protocol": "openid-connect",
          "protocolMapper": "oidc-group-membership-mapper",
          "config": {
            "claim.name": "groups",
            "full.path": "false",
            "id.token.claim": "true",
            "access.token.claim": "true",
            "userinfo.token.claim": "true"
          }
        }
      ]
    }

