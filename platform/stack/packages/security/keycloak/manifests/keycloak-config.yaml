  # ---------------------------------------------------------------------
  # configure.sh — the ONE provisioning script, shared by the Sync-hook Job
  # (KEYCLOAK_CONFIG_MODE=full) and the client-reconcile CronJob
  # (KEYCLOAK_CONFIG_MODE=clients). Mounted with the payloads at /var/config.
  #
  # OIDC clients are data-driven — there is NO hardcoded client list anywhere:
  #   1. every /var/config/*-client-payload.json key of this ConfigMap;
  #   2. every ConfigMap in adhar-system labelled adhar.io/keycloak-client=true
  #      carrying a `client.json` key (same JSON shape; shipped by the app
  #      package itself — see hack/gen-sso.sh).
  # Each client is created if missing (or PUT-reconciled: redirectUris,
  # webOrigins, flags), gets the `groups` default client scope, and — for
  # confidential clients — its secret is exported into the keycloak-clients
  # Secret as <PREFIX>_CLIENT_ID / <PREFIX>_CLIENT_SECRET, PREFIX being the
  # clientId upper-cased with '-' -> '_' (argo-workflows -> ARGO_WORKFLOWS,
  # adhar-console -> ADHAR_CONSOLE, nexus -> NEXUS). Per-app ExternalSecrets
  # read those keys through the `keycloak` ClusterSecretStore.
  #
  # The CronJob runs the client part every 5 minutes, so a client ConfigMap
  # added by another package is picked up without re-syncing keycloak.
  # ---------------------------------------------------------------------
  configure.sh: |
    #!/bin/bash
    set -ex -o pipefail

    MODE="${KEYCLOAK_CONFIG_MODE:-full}"
    ADMIN_PASSWORD=$(cat /var/secrets/KEYCLOAK_ADMIN_PASSWORD)
    USER1_PASSWORD=$(cat /var/secrets/USER_PASSWORD)

    KEYCLOAK_URL=http://keycloak.adhar-system.svc.cluster.local:8080
    REALM_URL="${KEYCLOAK_URL}/admin/realms/adhar"

    get_token() {
      curl -sS --fail-with-body -X POST -H "Content-Type: application/x-www-form-urlencoded" \
        --data-urlencode "username=adhar-admin" \
        --data-urlencode "password=${ADMIN_PASSWORD}" \
        --data-urlencode "grant_type=password" \
        --data-urlencode "client_id=admin-cli" \
        "${KEYCLOAK_URL}/realms/master/protocol/openid-connect/token" | jq -e -r '.access_token'
    }
    KEYCLOAK_TOKEN=$(get_token)

    set +e

    # Master-realm admin tokens default to a 60s lifespan; a full run can take
    # longer than that between API calls and every call after expiry got HTTP
    # 401, leaving the realm half-provisioned. Raise the lifespan first and
    # fetch a fresh token that carries it, so the whole script runs inside one
    # valid token.
    curl -sS -H "Content-Type: application/json" \
      -H "Authorization: bearer ${KEYCLOAK_TOKEN}" \
      -X PUT --data '{"accessTokenLifespan":1800}' \
      "${KEYCLOAK_URL}/admin/realms/master"
    KEYCLOAK_TOKEN=$(get_token)

    # --- helpers ---------------------------------------------------------
    kc() { curl -sS -H "Content-Type: application/json" -H "Authorization: bearer ${KEYCLOAK_TOKEN}" "$@"; }
    client_uuid() { kc "${REALM_URL}/clients?clientId=$1" | jq -r '.[0].id // empty'; }
    groups_scope_id() { kc "${REALM_URL}/client-scopes" | jq -r '.[] | select(.name=="groups") | .id'; }
    # keycloak-clients key prefix: clientId upper-cased, '-' -> '_'.
    key_prefix() { echo "$1" | tr '[:lower:]' '[:upper:]' | tr '-' '_'; }
    realm_exists() { curl -sS --fail -H "Authorization: bearer ${KEYCLOAK_TOKEN}" "${REALM_URL}" >/dev/null 2>&1; }

    # ensure_clients_secret: the keycloak-clients Secret lives in the cluster
    # and can be lost independently of the realm (e.g. a namespace migration)
    # — recreate it when missing so the per-client patches below have a
    # target and every OIDC ExternalSecret downstream can resolve.
    # ARGOCD_SESSION_TOKEN (console's ArgoCD integration) is best-effort:
    # ArgoCD may be briefly unreachable and that must not abort the run.
    argocd_session_token() {
      local pw
      pw=$(kubectl -n adhar-system get secret argocd-initial-admin-secret -o go-template='{{.data.password | base64decode }}' 2>/dev/null || true)
      curl -sS http://argo-cd-argocd-server.adhar-system.svc.cluster.local:80/api/v1/session \
        -H 'Content-Type: application/json' -d "{\"username\":\"admin\",\"password\":\"${pw}\"}" 2>/dev/null \
        | jq -r '.token // empty' 2>/dev/null || true
    }
    ensure_clients_secret() {
      local tok
      if kubectl -n adhar-system get secret keycloak-clients >/dev/null 2>&1; then
        if [ "${MODE}" = "full" ]; then
          tok=$(argocd_session_token)
          if [ -n "${tok}" ]; then
            { set +x; kubectl -n adhar-system patch secret keycloak-clients --type merge \
                -p "{\"stringData\":{\"ARGOCD_SESSION_TOKEN\":\"${tok}\"}}" >/dev/null; set -x; } 2>/dev/null
          fi
        fi
        return 0
      fi
      echo "keycloak-clients secret missing; creating"
      tok=$(argocd_session_token)
      # Value quoted/empty-safe: an empty token must still create the key,
      # otherwise consumers of it fail with 'could not get secret data'.
      { set +x; kubectl -n adhar-system create secret generic keycloak-clients \
          --from-literal=ARGOCD_SESSION_TOKEN="${tok}" >/dev/null; set -x; } 2>/dev/null
    }

    # ensure_client <payload.json>: create-or-reconcile one OIDC client,
    # attach the groups scope, export its secret. Non-fatal per client.
    # NOTE: keep "description" under 255 chars — Keycloak stores it in a
    # varchar(255) and a longer value fails creation with an opaque 500.
    ensure_client() {
      local pf="$1" cid id kp rsec
      cid=$(jq -r '.clientId // empty' "${pf}" 2>/dev/null)
      if [ -z "${cid}" ]; then echo "skipping ${pf}: no clientId"; return 0; fi
      id=$(client_uuid "${cid}")
      if [ -n "${id}" ]; then
        # Reconcile the representation (redirect URIs, web origins, flags) on
        # EVERY run, so config changes reach existing clients — otherwise SSO
        # breaks with redirect_uri mismatch after e.g. a host move.
        echo "reconciling client ${cid}"
        kc -X PUT --data @"${pf}" "${REALM_URL}/clients/${id}" >/dev/null 2>&1 || true
      else
        echo "creating client ${cid}"
        kc -X POST --data @"${pf}" "${REALM_URL}/clients" >/dev/null 2>&1
        id=$(client_uuid "${cid}")
        if [ -z "${id}" ]; then echo "WARNING: client ${cid} could not be created (payload ${pf})"; return 0; fi
      fi
      # groups default scope: tokens carry the groups claim that app RBAC keys on.
      if [ -n "${GROUPS_SCOPE_ID}" ]; then
        kc -X PUT "${REALM_URL}/clients/${id}/default-client-scopes/${GROUPS_SCOPE_ID}" >/dev/null 2>&1 || true
      fi
      # Public clients (adhar-cli, kargo, kargo-cli) have no secret to export.
      if [ "$(jq -r '.publicClient // false' "${pf}")" = "true" ]; then return 0; fi
      # Keep keycloak-clients authoritative from Keycloak on every run: client
      # secrets can drift (a recreate, a manual regenerate) and a stale copy
      # silently breaks the app's token exchange.
      rsec=$(kc "${REALM_URL}/clients/${id}" | jq -r '.secret // empty')
      if [ -z "${rsec}" ]; then echo "WARNING: client ${cid} has no secret"; return 0; fi
      kp=$(key_prefix "${cid}")
      { set +x; kubectl -n adhar-system patch secret keycloak-clients --type merge \
          -p "{\"stringData\":{\"${kp}_CLIENT_ID\":\"${cid}\",\"${kp}_CLIENT_SECRET\":\"${rsec}\"}}" >/dev/null \
          && echo "keycloak-clients: ${kp}_CLIENT_SECRET set"; set -x; } 2>/dev/null
    }

    # reconcile_clients: gather every client payload from both sources and
    # run ensure_client on each. Idempotent; this is all the CronJob does.
    reconcile_clients() {
      local d=/tmp/clients f name b64
      GROUPS_SCOPE_ID=$(groups_scope_id)
      rm -rf "${d}"; mkdir -p "${d}"
      for f in /var/config/*-client-payload.json; do
        [ -f "${f}" ] && cp "${f}" "${d}/file-$(basename "${f}")"
      done
      kubectl -n adhar-system get configmap -l adhar.io/keycloak-client=true -o json 2>/dev/null \
        | jq -r '.items[] | select(.data["client.json"] != null) | "\(.metadata.name) \(.data["client.json"] | @base64)"' \
        | while read -r name b64; do
            echo "${b64}" | base64 -d > "${d}/cm-${name}.json"
          done
      for f in "${d}"/*.json; do
        [ -f "${f}" ] || continue
        ensure_client "${f}"
      done
    }

    # --- clients-only mode (CronJob) -------------------------------------
    if [ "${MODE}" = "clients" ]; then
      if ! realm_exists; then
        echo "adhar realm not provisioned yet; nothing to reconcile"
        exit 0
      fi
      ensure_clients_secret
      reconcile_clients
      exit 0
    fi

    # --- full mode (Sync-hook Job) ---------------------------------------

    # The platform runs behind the self-signed Cilium Gateway, which
    # terminates TLS and forwards to Keycloak over plain HTTP. With the
    # realm default sslRequired=external, Keycloak rejects browser logins
    # coming from an external client with {"error":"HTTPS required"} unless
    # the proxy's X-Forwarded-Proto=https reaches it — which is not
    # guaranteed here. Relax the MASTER realm (admin console login) to
    # sslRequired=NONE on every sync, so admin login keeps working.
    kc -X PUT --data '{"sslRequired":"NONE"}' "${KEYCLOAK_URL}/admin/realms/master"

    # Same for the adhar realm (user1/user2 + app SSO). No-op 404 on the very
    # first run before the realm exists (it is then created with
    # sslRequired=NONE from realm-payload.json below); on later runs it fixes
    # a pre-existing realm created as sslRequired=external. Also (re)applies
    # the Adhar-branded login theme so it survives realm re-imports.
    #
    # registrationAllowed belongs HERE, not only in realm-payload.json: that
    # payload is POSTed exclusively when the realm does not yet exist, so a
    # setting added to it never reaches an already-provisioned cluster. The
    # console's "Create a new account" sends people to Keycloak's hosted
    # sign-up (…/protocol/openid-connect/registrations); with registration off
    # that endpoint answers 400 and the console correctly falls back to telling
    # them to ask an administrator. Reconciling it on every run is what makes
    # self sign-up actually work on an existing install.
    #
    # registrationEmailAsUsername keeps the identity addressable — onboarding
    # emails the workspace contact, and Gitea/Argo CD map users by email.
    # resetPasswordAllowed is the other half of self-service: an account nobody
    # can recover is not self-service.
    kc -X PUT --data '{"sslRequired":"NONE","loginTheme":"adhar","registrationAllowed":true,"registrationEmailAsUsername":true,"resetPasswordAllowed":true,"verifyEmail":false}' "${REALM_URL}"

    # A realm can exist half-provisioned: an earlier run that died mid-way
    # created the realm but none of the clients. Treating bare existence as
    # "provisioned" rebuilt keycloak-clients with EMPTY secrets. Only treat
    # the realm as provisioned when the sentinel client is present too;
    # otherwise drop the partial realm and provision from scratch.
    REALM_OK=1
    realm_exists || REALM_OK=0
    if [ "${REALM_OK}" = "1" ] && [ -z "$(client_uuid argocd)" ]; then
      echo "adhar realm exists but is half-provisioned (no argocd client); recreating"
      kc -X DELETE "${REALM_URL}"
      REALM_OK=0
    fi

    if [ "${REALM_OK}" = "0" ]; then
      set -e
      echo "creating adhar realm and groups"
      kc -X POST --data @/var/config/realm-payload.json "${KEYCLOAK_URL}/admin/realms"
      kc -X POST --data @/var/config/client-scope-groups-payload.json "${REALM_URL}/client-scopes"
      kc -X POST --data @/var/config/group-admin-payload.json "${REALM_URL}/groups"
      kc -X POST --data @/var/config/group-base-user-payload.json "${REALM_URL}/groups"

      echo "creating platform RBAC groups"
      kc -X POST --data @/var/config/group-platform-admin-payload.json "${REALM_URL}/groups"
      kc -X POST --data @/var/config/group-platform-developer-payload.json "${REALM_URL}/groups"
      kc -X POST --data @/var/config/group-platform-viewer-payload.json "${REALM_URL}/groups"
      kc -X POST --data @/var/config/group-platform-engineer-payload.json "${REALM_URL}/groups"
      kc -X POST --data @/var/config/group-application-admin-payload.json "${REALM_URL}/groups"

      echo "adding group claim to tokens"
      CLIENT_SCOPE_GROUPS_ID=$(kc "${REALM_URL}/client-scopes" | jq -e -r '.[] | select(.name == "groups") | .id')
      kc -X POST --data @/var/config/group-mapper-payload.json \
        "${REALM_URL}/client-scopes/${CLIENT_SCOPE_GROUPS_ID}/protocol-mappers/models"

      echo "creating test users"
      kc -X POST --data @/var/config/user-user1.json "${REALM_URL}/users"
      kc -X POST --data @/var/config/user-user2.json "${REALM_URL}/users"
      USER1ID=$(kc "${REALM_URL}/users?lastName=one" | jq -r '.[0].id')
      USER2ID=$(kc "${REALM_URL}/users?lastName=two" | jq -r '.[0].id')

      echo "setting user passwords"
      jq -r --arg pass "${USER1_PASSWORD}" '.value = $pass' /var/config/user-password.json > /tmp/user-password-to-be-applied.json
      kc -X PUT --data @/tmp/user-password-to-be-applied.json "${REALM_URL}/users/${USER1ID}/reset-password"
      kc -X PUT --data @/tmp/user-password-to-be-applied.json "${REALM_URL}/users/${USER2ID}/reset-password"
      set +e
    fi

    # Default group for self-registered users.
    #
    # Enabling registrationAllowed is only half of self sign-up: Keycloak puts a
    # self-registered user in NO group, and every RBAC binding on this platform
    # keys on group membership (oidc:platform-viewer -> view, and so on). Without
    # a default the new account signs in successfully and then sees nothing,
    # which looks like a broken product rather than a permissions model.
    #
    # platform-viewer deliberately: read-only is the only safe thing to hand
    # someone who just created their own account. They gain real rights on their
    # OWN namespace when onboarding provisions their organization, which binds
    # their org group to the namespaced `admin` role — scoped to their tenant,
    # not the cluster.
    #
    # Idempotent: PUT on default-groups is a no-op when already set. Runs on
    # every reconcile so it reaches realms that already existed.
    VIEWER_GID=$(kc "${REALM_URL}/groups" | jq -r '.[] | select(.name=="platform-viewer") | .id')
    if [ -n "${VIEWER_GID}" ] && [ "${VIEWER_GID}" != "null" ]; then
      kc -X PUT "${REALM_URL}/default-groups/${VIEWER_GID}" >/dev/null 2>&1 \
        && echo "default group for new sign-ups: platform-viewer" \
        || echo "warning: could not set the default group; self-registered users will have no access"
    else
      echo "warning: platform-viewer group not found; skipping default-group setup"
    fi

    # Clients + keycloak-clients: the same data-driven pass on a fresh AND an
    # existing realm, so every client (including ones shipped by other
    # packages that are already present) converges on the FIRST run.
    ensure_clients_secret
    reconcile_clients

    # Grant the adhar-console client's SERVICE ACCOUNT the realm-management
    # roles the console needs to (a) reflect workspace teams / org-roles into
    # realm groups and (b) provision per-tenant groups during onboarding
    # (create group + add members): manage-realm + manage-users cover group
    # create/delete + user group-membership; view-users/query-users/
    # query-groups cover lookups. The console authenticates with
    # client_credentials using its own (already-wired) secret.
    #
    # Retry + verify: on a fresh realm the client's service-account user can
    # lag behind client creation, and a single best-effort POST then silently
    # no-ops — leaving the console SA with ZERO realm-management roles, so
    # onboarding's Keycloak provisioning step 403s. Force
    # serviceAccountsEnabled, poll for the SA user, assign, and read the
    # mapping back until manage-users is actually present. Non-fatal.
    rm_id=$(client_uuid realm-management)
    for attempt in 1 2 3 4 5 6; do
      ac_id=$(client_uuid adhar-console)
      if [ -n "${ac_id}" ]; then
        kc -X PUT --data '{"serviceAccountsEnabled":true}' "${REALM_URL}/clients/${ac_id}" >/dev/null 2>&1 || true
        sa_uid=$(kc "${REALM_URL}/clients/${ac_id}/service-account-user" | jq -r '.id // empty')
      fi
      if [ -n "${sa_uid}" ] && [ -n "${rm_id}" ]; then
        rm_roles=$(kc "${REALM_URL}/clients/${rm_id}/roles" \
          | jq -c '[.[] | select(.name=="manage-realm" or .name=="manage-users" or .name=="view-users" or .name=="query-users" or .name=="query-groups")]')
        if [ -n "${rm_roles}" ] && [ "${rm_roles}" != "[]" ]; then
          kc -X POST --data "${rm_roles}" "${REALM_URL}/users/${sa_uid}/role-mappings/clients/${rm_id}" >/dev/null 2>&1 || true
        fi
        have=$(kc "${REALM_URL}/users/${sa_uid}/role-mappings/clients/${rm_id}" | jq -r '[.[].name] | join(",")')
        echo "adhar-console SA realm-management roles (attempt ${attempt}): ${have}"
        case ",${have}," in *,manage-users,*) echo "granted realm-management roles to adhar-console service account"; break;; esac
      fi
      sleep 5
    done
    exit 0

---
apiVersion: batch/v1
kind: Job
metadata:
  name: config
  namespace: adhar-system
  annotations:
    # Runs DURING sync at wave 20 — after the Keycloak Deployment (wave 10) is
    # healthy — so it can register the realm/clients and write the
    # keycloak-clients Secret BEFORE the consumer ExternalSecrets (wave 40) try
    # to read it. As a PostSync hook it ran only after the whole sync succeeded,
    # but the sync could never succeed because argocd-oidc/gitea-oauth (wave 0)
    # failed with "could not get secret data from provider" (keycloak-clients
    # did not exist yet) — a deadlock that left Keycloak permanently OutOfSync.
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "20"
spec:
  template:
    metadata:
      generateName: config
    spec:
      serviceAccountName: keycloak-config
      restartPolicy: Never
      volumes:
        - name: keycloak-config
          secret:
            secretName: keycloak-config
        - name: config-payloads
          configMap:
            name: config-job
      containers:
        - name: kubectl
          # alpine/k8s ships bash+curl+jq+kubectl preinstalled: the previous
          # ubuntu:22.04 spent minutes on apt update/install + kubectl download
          # on EVERY keycloak sync, dominating platform provisioning time.
          image: docker.io/alpine/k8s:1.31.0
          volumeMounts:
            - name: keycloak-config
              readOnly: true
              mountPath: "/var/secrets/"
            - name: config-payloads
              readOnly: true
              mountPath: "/var/config/"
          env:
            - name: KEYCLOAK_CONFIG_MODE
              value: full
          command: ["/bin/bash", "/var/config/configure.sh"]
---
# Client reconciler: every 5 minutes, run ONLY the client part of configure.sh
# (idempotent). This is what lets an app package ship its own Keycloak client
# (a ConfigMap labelled adhar.io/keycloak-client=true with client.json — see
# hack/gen-sso.sh) and have it provisioned, with its secret exported into
# keycloak-clients, without a keycloak re-sync. Full realm configuration stays
# with the Sync-hook Job above.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: keycloak-client-reconcile
  namespace: adhar-system
  labels:
    app.kubernetes.io/name: keycloak-client-reconcile
    app.kubernetes.io/part-of: keycloak
  annotations:
    # After the realm job (wave 20); a run before the realm exists is a no-op.
    argocd.argoproj.io/sync-wave: "25"
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  startingDeadlineSeconds: 120
  jobTemplate:
    spec:
      backoffLimit: 1
      # Must finish inside the 5-minute period (Forbid skips overlapping runs).
      activeDeadlineSeconds: 240
      ttlSecondsAfterFinished: 900
      template:
        metadata:
          labels:
            app.kubernetes.io/name: keycloak-client-reconcile
        spec:
          serviceAccountName: keycloak-config
          restartPolicy: Never
          volumes:
            - name: keycloak-config
              secret:
                secretName: keycloak-config
            - name: config-payloads
              configMap:
                name: config-job
          containers:
            - name: kubectl
              image: docker.io/alpine/k8s:1.31.0
              volumeMounts:
                - name: keycloak-config
                  readOnly: true
                  mountPath: "/var/secrets/"
                - name: config-payloads
                  readOnly: true
                  mountPath: "/var/config/"
              env:
                - name: KEYCLOAK_CONFIG_MODE
                  value: clients
              command: ["/bin/bash", "/var/config/configure.sh"]
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
