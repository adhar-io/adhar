# resources here are used to configure keycloak instance for SSO
apiVersion: v1
kind: ServiceAccount
metadata:
  name: keycloak-config
  namespace: adhar-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: keycloak-config
  namespace: adhar-system
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]
  # Client discovery: any ConfigMap labelled adhar.io/keycloak-client=true
  # (shipped by an app package) is an OIDC client to ensure — see configure.sh.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: keycloak-config
  namespace: adhar-system
subjects:
  - kind: ServiceAccount
    name: keycloak-config
    namespace: adhar-system
roleRef:
  kind: Role
  name: keycloak-config
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: config-job
  namespace: adhar-system
data:
  client-scope-groups-payload.json: |
    {
      "name": "groups",
      "description": "groups a user belongs to",
      "attributes": {
          "consent.screen.text": "Access to groups a user belongs to.",
          "display.on.consent.screen": "true",
          "include.in.token.scope": "true",
          "gui.order": ""
      },
      "type": "default",
      "protocol": "openid-connect"
    }
  group-admin-payload.json: |
    {"name":"admin"}
  group-base-user-payload.json: |
    {"name":"base-user"}
  group-platform-admin-payload.json: |
    {"name":"platform-admin"}
  group-platform-developer-payload.json: |
    {"name":"platform-developer"}
  group-platform-viewer-payload.json: |
    {"name":"platform-viewer"}
  group-platform-engineer-payload.json: |
    {"name":"platform-engineer"}
  group-application-admin-payload.json: |
    {"name":"application-admin"}
  group-mapper-payload.json: |
    {
        "protocol": "openid-connect",
        "protocolMapper": "oidc-group-membership-mapper",
        "name": "groups",
        "config": {
          "claim.name": "groups",
          "full.path": "false",
          "id.token.claim": "true",
          "access.token.claim": "true",
          "userinfo.token.claim": "true"
        }
    }
  # registrationAllowed: the console's "Create a new account" sends a visitor to
  # Keycloak's hosted sign-up (…/protocol/openid-connect/registrations). Without
  # this the realm answers 400 and there is no way for a new person to obtain an
  # account, so onboarding could never create an organization — an org needs an
  # owner. Set it to false for an invite-only platform; the console detects the
  # refusal and says an administrator must create the account instead of
  # offering a dead end.
  #
  # registrationEmailAsUsername keeps identities addressable: onboarding emails
  # the workspace contact, and Gitea/Argo CD map users by email.
  realm-payload.json: |
    {"realm":"adhar","enabled":true,"sslRequired":"NONE","loginTheme":"adhar","registrationAllowed":true,"registrationEmailAsUsername":true,"resetPasswordAllowed":true,"verifyEmail":false}
  user-password.json: |
    {
        "temporary": false,
        "type": "password",
        "value": "${USER1_PASSWORD}"
    }
  user-user1.json: |
    {
        "username": "user1",
        "email": "user1@noreply.com",
        "firstName": "user",
        "lastName": "one",
        "requiredActions": [],
        "emailVerified": true,
        "groups": [
          "/platform-admin"
        ],
        "enabled": true
    }
  user-user2.json: |
    {
        "username": "user2",
        "email": "user2@noreply.com",
        "firstName": "user",
        "lastName": "two",
        "requiredActions": [],
        "emailVerified": true,
        "groups": [
          "/platform-developer"
        ],
        "enabled": true
    }
  argo-client-payload.json: |
    {
      "protocol": "openid-connect",
      "clientId": "argo-workflows",
      "name": "Argo Workflows Client",
      "description": "Used for Argo Workflows SSO",
      "publicClient": false,
      "authorizationServicesEnabled": false,
      "serviceAccountsEnabled": false,
      "implicitFlowEnabled": false,
      "directAccessGrantsEnabled": true,
      "standardFlowEnabled": true,
      "frontchannelLogout": true,
