# One session cookie secret shared by EVERY oauth2-proxy on the platform.
#
# Each app used to mint its own secret from its own Password generator, which
# made secret management awkward for no benefit: a generator mints a distinct
# value per ExternalSecret, so rotating or reasoning about them meant touching
# every package. One secret is simply easier to operate.
#
# It does NOT make sessions shareable, and must not be used to try. Sharing the
# secret AND the cookie name on the parent domain was tried and was worse than
# the problem it meant to solve: every proxy then decrypted and reused every
# other proxy's session, so Argo CD was handed a token minted for the tekton
# client and rejected it with 'expected audience "argocd" got ["tekton"]', and
# whichever app the user opened last overwrote all the other sessions. Each
# proxy therefore sets its OWN --cookie-name and leaves --cookie-domain unset.
#
# Seamless sign-in is Keycloak's job, which is what an identity provider is for:
# a proxy with no session of its own redirects to Keycloak, Keycloak recognises
# the existing session and returns an authorization code immediately, and the
# proxy mints its own session with the right audience. The user sees no login
# screen on any app after the first.
#
# Wave 4: before the oauth2-proxy front-ends (wave 5) that read it.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: adhar-sso-cookie
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "4"}
spec:
  # oauth2-proxy requires a 16, 24 or 32 byte cookie secret.
  length: 32
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: adhar-sso-cookie
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "4"}
spec:
  # CreatedOnce: rotating this would sign every user out of every app at once.
  refreshPolicy: CreatedOnce
  refreshInterval: 30s
  target:
    name: adhar-sso-cookie
    template:
      engineVersion: v2
      data:
        COOKIE_SECRET: "{{ .COOKIE_SECRET }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: adhar-sso-cookie
      rewrite:
        - transform:
            template: "COOKIE_SECRET"
