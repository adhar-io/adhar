# One session cookie secret shared by EVERY oauth2-proxy on the platform.
#
# Each app used to mint its own cookie secret from its own Password generator,
# and no proxy set --cookie-domain. Two consequences, both of which broke single
# sign-on: the session cookie was scoped to one host (hubble.<domain>), so a
# sibling app saw no session at all; and even with a shared domain a sibling
# could not have decrypted the cookie, because the secret differed. Signing in
# to the console and opening Argo CD or Grafana therefore hit an auth round trip
# every time.
#
# With one secret plus --cookie-domain=.<domain>, any proxy accepts the session
# another one established: one sign-in covers every SSO-fronted app.
#
# Wave 4: before the oauth2-proxy front-ends (wave 5) that read it.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: adhar-sso-cookie
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "4"}
spec:
  # oauth2-proxy requires a 16, 24 or 32 byte cookie secret.
  length: 32
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: adhar-sso-cookie
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "4"}
spec:
  # CreatedOnce: rotating this would sign every user out of every app at once.
  refreshPolicy: CreatedOnce
  refreshInterval: 30s
  target:
    name: adhar-sso-cookie
    template:
      engineVersion: v2
      data:
        COOKIE_SECRET: "{{ .COOKIE_SECRET }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: adhar-sso-cookie
      rewrite:
        - transform:
            template: "COOKIE_SECRET"
