apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: keycloak
  namespace: adhar-system
  labels:
    app: keycloak
spec:
  # Prometheus serviceMonitorSelector is empty ({}) so this is picked up
  # cluster-wide with no extra release label required.
  selector:
    matchLabels:
      app: keycloak
  namespaceSelector:
    matchNames:
      - adhar-system
  endpoints:
    # Keycloak 26 serves Prometheus metrics on the dedicated management interface
    # (port 9000, named "management" on the keycloak Service) at /metrics — they
    # are no longer exposed on the main HTTP port.
    - port: management
      path: /metrics
      scheme: http
      interval: 30s
      honorLabels: true
