apiVersion: v1
kind: Service
metadata:
  name: keycloak
  labels:
    app: keycloak
spec:
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  selector:
    app: keycloak
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: keycloak
  name: keycloak
  namespace: adhar-system
  annotations:
    argocd.argoproj.io/sync-wave: '10'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
      - args:
        - start-dev
        env:
        - name: KEYCLOAK_ADMIN
          value: adhar-admin
        - name: KEYCLOAK_LOGLEVEL
          value: ALL
        - name: QUARKUS_TRANSACTION_MANAGER_ENABLE_RECOVERY
          value: 'true'
        # Expose Prometheus metrics (/metrics) and health (/health). On this
        # Keycloak 22 (Quarkus) image there is NO separate management interface
        # (port 9000 was introduced in Keycloak 25); metrics/health are served
        # on the main HTTP port 8080. These are build-time options, applied
        # automatically by `start-dev`.
        - name: KC_METRICS_ENABLED
          value: 'true'
        - name: KC_HEALTH_ENABLED
          value: 'true'
        envFrom:
        - secretRef:
            name: keycloak-config
        image: quay.io/keycloak/keycloak:22.0.3
        name: keycloak
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          httpGet:
            path: /realms/master
            port: 8080
          # Keycloak takes 2-3 min to boot (JVM + realm init) and /realms/master
          # can take >1s to answer on a loaded node; the kube default 1s timeout
          # made readiness flap, which repeatedly tore down the SSO config flow.
          initialDelaySeconds: 60
          periodSeconds: 20
          timeoutSeconds: 10
          failureThreshold: 6
        volumeMounts:
        - mountPath: /opt/keycloak/conf
          name: keycloak-config
          readOnly: true
      volumes:
      - configMap:
          name: keycloak-config
        name: keycloak-config
---
apiVersion: v1
data:
  keycloak.conf: "# Database\n# The database vendor.\ndb=postgres\n\n# The username\
    \ of the database user.\ndb-url=jdbc:postgresql://keycloak-db-rw.adhar-system.svc.cluster.local:5432/keycloak\n\
    \n# The proxy address forwarding mode if the server is behind a reverse proxy.\n\
    proxy=edge\n\n# hostname configuration \u2014 Keycloak has its own subdomain,\
    \ served at root\n# (no http-relative-path). Issuer: https://keycloak.adhar.localtest.me:8443/realms/adhar\n\
    hostname=keycloak.adhar.localtest.me\nhostname-port=8443\n\n# the admin url requires\
    \ its own configuration to reflect correct url\nhostname-admin=keycloak.adhar.localtest.me:8443\n\
    \nhostname-debug=true\n\n# this should only be allowed in development. NEVER in\
    \ production.\nhostname-strict=false\n\n# Pin the issuer to the fixed https frontend\
    \ URL for BACKCHANNEL requests too. The\n# console does server-side OIDC over the\
    \ in-cluster http backchannel\n# (KEYCLOAK_INTERNAL_URL=http://keycloak...svc:8080);\
    \ with this=false Keycloak\n# reflected that http scheme into discovery URLs + the\
    \ token 'iss' claim\n# (http://keycloak.adhar.localtest.me:8443/realms/adhar), which\
    \ broke BOTH the\n# console's id-token verification AND kube-apiserver token\
    \ acceptance (its\n# --oidc-issuer-url is https). true → always emit the https\
    \ issuer regardless\n# of the backchannel request scheme.\nhostname-strict-backchannel=true\n"
kind: ConfigMap
metadata:
  name: keycloak-config
  namespace: adhar-system
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: keycloak-db
  namespace: adhar-system
  annotations:
    argocd.argoproj.io/sync-wave: '5'
    # See console-db: CNPG Clusters overflow client-side apply's last-applied
    # annotation; pin ServerSideApply so ArgoCD uses SSA/force-conflicts instead
    # of the invalid replace(--force) + --server-side combination.
    argocd.argoproj.io/sync-options: ServerSideApply=true
spec:
  instances: 1
  storage:
    size: 1Gi
  bootstrap:
    initdb:
      database: keycloak
      owner: keycloak
      secret:
        name: keycloak-config
  # Scheduled base backups + WAL archiving to the platform object store
  # (roadmap P1.5). Credentials are MinIO's root-creds (the minio package
  # creates bucket adhar-backups); point destinationPath/endpointURL at real
  # object storage in cloud environments. WAL archiving logs warnings until
  # the minio package is healthy, then self-heals.
  backup:
    retentionPolicy: 30d
    barmanObjectStore:
      destinationPath: s3://adhar-backups/cnpg/keycloak-db
      endpointURL: http://minio.adhar-system.svc.cluster.local:9000
      s3Credentials:
        accessKeyId:
          name: root-creds
          key: rootUser
        secretAccessKey:
          name: root-creds
          key: rootPassword
---
# Daily base backup at 01:30 UTC (before the Velero object backup at 02:00);
# point-in-time recovery between base backups comes from WAL archiving.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: keycloak-db-daily
  namespace: adhar-system
  annotations:
    argocd.argoproj.io/sync-wave: '6'
spec:
  schedule: "0 30 1 * * *"
  backupOwnerReference: self
  cluster:
    name: keycloak-db
