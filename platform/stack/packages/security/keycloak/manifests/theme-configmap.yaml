# Adhar-branded Keycloak login theme, mounted into the Keycloak pod at
# /opt/keycloak/themes/adhar via the volume in install.yaml. The realm's
# loginTheme is set to `adhar` (keycloak-config.yaml).
#
# GENERATED — do not edit by hand.
#   source:    ../theme/adhar/login/
#   generator: hack/gen-keycloak-theme-configmap.sh
# Edit the files under theme/adhar/login/ and re-run the generator.
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-theme-adhar
  namespace: adhar-system
  labels:
    app: keycloak
    adhar.io/package-name: keycloak
data:
  theme.properties: |
    # Adhar login theme — Keycloak 26.x
    #
    # Inherit the full keycloak.v2 (PatternFly v5) login theme so all form logic,
    # templates and base styling are preserved. We only LAYER an additional
    # stylesheet on top — no FTL templates are overridden, so login functionality
    # (username/password, social providers, errors, "remember me", registration,
    # reset-credentials) is never at risk.
    #
    # parent MUST be keycloak.v2 (NOT keycloak): the `css/styles.css` webpack bundle
    # referenced below ships ONLY in keycloak.v2. With parent=keycloak the styles
    # line resolves css/styles.css to a 404, the page loses its base styling and
    # renders broken. This file had drifted to `parent=keycloak` while the deployed
    # ConfigMap carried the correct value — see manifests/theme-configmap.yaml.
    parent=keycloak.v2
    import=common/keycloak

    # IMPORTANT: `styles` OVERRIDES (does not merge with) the parent value, so we
    # must re-declare the parent's bundle first, then append ours. `css/styles.css`
    # is the webpack bundle shipped by the keycloak.v2 login theme in Keycloak 26.x;
    # it is resolved from the parent chain. `css/adhar.css` is our override and is
    # listed LAST so it wins the cascade.
    styles=css/styles.css css/adhar.css

    # Theme resolution — see resources/js/adhar-theme.js for the full reasoning.
    #
    # `scripts` OVERRIDES the parent value exactly as `styles` does, but the parent
    # chain declares NO `scripts` key (keycloak.v2 hardcodes js/passwordVisibility.js
    # directly in template.ftl, so it is NOT at risk here), which makes this line
    # additive in practice. template.ftl renders it as a plain
    # `<script src=... type="text/javascript">` in <head> — parser-blocking, so it
    # runs before first paint and an explicit light/dark choice never flashes.
    scripts=js/adhar-theme.js

    # Responsive viewport (inherited, re-declared for safety on older bundles).
    meta=viewport==width=device-width,initial-scale=1
  adhar.css: |
    /* =============================================================================
       Adhar login theme — layered on keycloak.v2 (PatternFly v5), Keycloak 26.x

       This stylesheet is loaded LAST (see theme.properties) so it wins the cascade
       over patternfly.min.css and the parent theme's styles.css.

       Two things to know before editing:

       1. The markup is PatternFly **v5** — every class is `pf-v5-c-*`. An earlier
          revision of this file also carried `.pf-c-*` (v4) and `.card-pf` /
          `.login-pf-page` (PatternFly 3 / Keycloak "v1" theme) selectors. None of
          those elements exist in Keycloak 26's login pages, so roughly half the
          rules were dead — which is why the card and page background never picked
          up any Adhar styling and the pages still looked like stock Keycloak.

       2. Keycloak renders text inputs as a **span wrapper around the input**:

              <span class="pf-v5-c-form-control">
                <input class="pf-v5-c-form-control" …>   <!-- text inputs -->
                <input …>                                 <!-- password: no class -->
              </span>

          Styling `.pf-v5-c-form-control` alone therefore painted a bordered box on
          the wrapper AND a second one on the input inside it — the "double box"
          field bug. The rule below is: the **wrapper** draws the field, and any
          `input` inside it is flattened to transparent. A bare input that is not
          wrapped still gets the box, so both shapes render identically.

       Colours mirror `apps/console/app/styles.css` exactly (same OKLCH values) so
       the login page and the console are visibly the same product.

       3. Light/dark is NOT driven by `prefers-color-scheme` here. It used to be,
          which is why choosing dark in the Adhar Console left this page white: the
          console's mode is an explicit user choice, and the OS preference is a
          different signal. `resources/js/adhar-theme.js` now resolves the mode from
          an `adhar-theme` cookie shared across `*.<domain>` (falling back to the OS)
          and stamps `data-adhar-theme` on <html>, keeping Keycloak's own
          `pf-v5-theme-dark` class in step. The single dark block below reads both,
          so it is correct with JS, without JS, and for every combination of
          explicit choice and OS setting — see the comment on that block.
       ============================================================================ */

    /* ----------------------------------------------------------------------------
       Tokens — mirrored from the console's @theme block
       ---------------------------------------------------------------------------- */
    :root {
      /* Brand ramp (identical to the console's --color-brand-*) */
      --ad-brand-50:  oklch(0.97 0.015 265);
      --ad-brand-200: oklch(0.89 0.055 264);
      --ad-brand-300: oklch(0.81 0.09 263);
      --ad-brand-400: oklch(0.71 0.13 262);
      --ad-brand-500: oklch(0.58 0.17 262);
      --ad-brand-600: oklch(0.51 0.19 262);
      --ad-brand-700: oklch(0.44 0.18 262);
      --ad-brand-800: oklch(0.36 0.15 262);

      /* Surfaces / content / edges */
      --ad-surface-app:    oklch(0.985 0.003 260);
      --ad-surface-sunken: oklch(0.975 0.005 260);
      --ad-surface-raised: oklch(1 0 0);
      --ad-content:        oklch(0.21 0.02 260);
      --ad-content-muted:  oklch(0.48 0.015 260);
      --ad-content-subtle: oklch(0.64 0.01 260);
      --ad-edge-subtle:    oklch(0.95 0.005 260);
      --ad-edge-default:   oklch(0.91 0.008 260);
      --ad-edge-strong:    oklch(0.84 0.012 260);

      /* Page gradient. The console's two faint radials read as "almost white" on a
         full-bleed sign-in page, where the background is most of what you see, so
         this is a fuller Adhar mesh: three brand-ramp radials (blue / cyan / violet)
         over a vertical base wash. Hues 262/200/292 are the brand ramp and its two
         neighbours, so it stays on-brand rather than becoming a rainbow. */
      --ad-gradient:
        radial-gradient(1100px 620px at 12% -12%, oklch(0.88 0.085 262 / 0.62), transparent 62%),
        radial-gradient(900px 560px at 88% 2%,    oklch(0.90 0.065 200 / 0.50), transparent 64%),
        radial-gradient(900px 700px at 50% 112%,  oklch(0.89 0.075 292 / 0.42), transparent 62%),
        linear-gradient(180deg, oklch(0.985 0.004 260) 0%, oklch(0.962 0.010 262) 100%);

      /* Feedback tones */
      --ad-danger:  oklch(0.55 0.21 20);
      --ad-danger-bg: oklch(0.97 0.02 20);
      --ad-warn:    oklch(0.55 0.14 75);
      --ad-warn-bg: oklch(0.97 0.03 85);
      --ad-success: oklch(0.52 0.13 155);
      --ad-success-bg: oklch(0.96 0.03 155);
      --ad-info:    var(--ad-brand-600);
      --ad-info-bg: var(--ad-brand-50);

      /* Radii — the console's --radius-* scale */
      color-scheme: light;

      --ad-radius-md: 8px;
      --ad-radius-lg: 12px;
      --ad-radius-xl: 16px;

      --ad-font: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;

      /* Focus. `--ad-ring` is the console's neutral input ring
         (focus-visible:border-slate-400 + ring-slate-900/10) and is kept for
         non-essential affordances, but FORM FIELDS use the brand ring: at 10% slate
         the neutral ring was all but invisible against a white card, which is both
         the reported complaint and a WCAG 2.4.11 (focus appearance) problem.
         `--ad-focus-edge` is the matching border colour, so every focusable control
         — field, checkbox, button, link — highlights identically. */
      --ad-ring: 0 0 0 3px oklch(0.21 0.02 260 / 0.10);
      --ad-ring-brand: 0 0 0 3px oklch(0.58 0.17 262 / 0.35);
      --ad-focus-edge: var(--ad-brand-500);

      --ad-shadow-sm: 0 1px 2px oklch(0.21 0.02 260 / 0.06);
      --ad-shadow-card:
        0 1px 2px oklch(0.21 0.02 260 / 0.05),
        0 8px 24px oklch(0.21 0.02 260 / 0.07);
    }

    /* Dark mode — mirrors the console's `.dark` block. Surfaces, content and edges
       flip; the brand ramp is deliberately preserved, exactly as the console does.
       ----------------------------------------------------------------------------
       The two selectors below cover every case with ONE copy of the palette, which
       is why there is no `prefers-color-scheme` block here to drift out of step:

         [data-adhar-theme="dark"]                      explicit dark (cookie/?theme)
         .pf-v5-theme-dark:not([data-adhar-theme="light"])
                                                        system mode on a dark OS, and
                                                        the no-JS case — Keycloak's own
                                                        darkMode script sets that class
                                                        from prefers-color-scheme even
                                                        if adhar-theme.js never runs

       The `:not(…="light")` guard is what makes an explicit LIGHT choice win on a
       dark OS: adhar-theme.js also removes the PatternFly class in that case, so the
       inherited component styles cannot stay dark under our light surfaces. */
    :root[data-adhar-theme="dark"],
    :root.pf-v5-theme-dark:not([data-adhar-theme="light"]) {
        color-scheme: dark;
        --ad-surface-app:    oklch(0.16 0.005 260);
        --ad-surface-sunken: oklch(0.13 0.005 260);
        --ad-surface-raised: oklch(0.21 0.006 260);
        --ad-content:        oklch(0.96 0.003 260);
        --ad-content-muted:  oklch(0.78 0.005 260);
        --ad-content-subtle: oklch(0.6 0.008 260);
        --ad-edge-subtle:    oklch(0.22 0.005 260);
        --ad-edge-default:   oklch(0.3 0.008 260);
        --ad-edge-strong:    oklch(0.42 0.012 260);

        --ad-gradient:
          radial-gradient(1100px 620px at 12% -12%, oklch(0.48 0.150 262 / 0.46), transparent 62%),
          radial-gradient(900px 560px at 88% 2%,    oklch(0.44 0.110 200 / 0.36), transparent 64%),
          radial-gradient(900px 700px at 50% 112%,  oklch(0.42 0.130 292 / 0.32), transparent 62%),
          linear-gradient(180deg, oklch(0.175 0.008 260) 0%, oklch(0.125 0.010 262) 100%);

        --ad-danger-bg:  oklch(0.55 0.21 20 / 0.12);
        --ad-warn-bg:    oklch(0.55 0.14 75 / 0.12);
        --ad-success-bg: oklch(0.52 0.13 155 / 0.12);
        --ad-info-bg:    oklch(0.58 0.17 262 / 0.12);

        --ad-ring: 0 0 0 3px oklch(0.96 0.003 260 / 0.12);
        /* brand-500 at 35% disappears into a dark surface; go brighter and stronger. */
        --ad-ring-brand: 0 0 0 3px oklch(0.71 0.13 262 / 0.48);
        --ad-focus-edge: var(--ad-brand-400);
        --ad-shadow-card:
          0 1px 2px oklch(0 0 0 / 0.4),
          0 8px 24px oklch(0 0 0 / 0.35);
    }

    /* ----------------------------------------------------------------------------
       Page background
       ----------------------------------------------------------------------------
       The parent theme sets a fixed low-poly artwork with

           .login-pf body { background: var(--keycloak-bg-logo-url) …; }

       Note the selector: `.login-pf` is on <html>, not <body>. The previous rule
       here was `body.login-pf`, which matches nothing — so the Keycloak artwork
       was never actually replaced. Both real hooks are covered below.
       ---------------------------------------------------------------------------- */
    html.login-pf,
    html {
      height: 100%;
    }

    .login-pf body,
    body#keycloak-bg,
    body {
      min-height: 100%;
      margin: 0;
      font-family: var(--ad-font);
      color: var(--ad-content);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      /* Kill the inherited artwork outright, then paint the console's surface as the
         base colour. The gradient itself is the fixed layer below, so it cannot
         scroll away from a tall page (the register form is taller than the
         viewport on a laptop). */
      background-image: none;
      background-color: var(--ad-surface-app);
    }

    /* The Adhar gradient, as its own fixed layer behind the login stack. */
    .login-pf body::before,
    body#keycloak-bg::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background: var(--ad-gradient);
      background-attachment: fixed;
    }

    /* ----------------------------------------------------------------------------
       Layout — centre the login stack over the texture
       ---------------------------------------------------------------------------- */
    .pf-v5-c-login {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 16px;
      background: transparent;
    }

    /* ----------------------------------------------------------------------------
       Container — THE card-geometry fix
       ----------------------------------------------------------------------------
       PatternFly turns this element into a TWO-COLUMN named grid at >=1200px, i.e.
       on essentially every desktop:

           @media (min-width: 1200px) {
             .pf-v5-c-login__container {
               grid-template-areas: "main header" "main footer" "main .";
               grid-template-columns: 34rem minmax(auto, 34rem);
               padding-inline: 6.125rem;          <- 98px EACH side
             }
           }

       The previous rule here overrode `grid-template-columns` to a single column but
       left `grid-template-areas` alone. A 2-column area template with 1 explicit
       column does not collapse — the browser adds an implicit second column — so
       `header` (the 260px logo) was placed BESIDE the card instead of above it, and
       the inherited 196px of inline padding came off the 440px cap as well. The card
       was squeezed into whatever remained, which is why its width and height looked
       wrong on a desktop and correct on a phone (below the 1200px breakpoint).

       So: declare the areas as a single-column stack and neutralise the inherited
       inline padding. `--ad-card-w` carries the cap so individual pages can widen it.
       ---------------------------------------------------------------------------- */
    .pf-v5-c-login__container {
      display: grid;
      grid-template-areas:
        'header'
        'main'
        'footer';
      grid-template-columns: minmax(0, 1fr);
      justify-content: stretch;
      width: 100%;
      max-width: var(--ad-card-w, 448px);
      margin-inline: auto;
      padding-inline: 0;
      gap: 0;
      grid-column-gap: 0;
    }

    /* The register and update-profile forms carry noticeably more fields; at the
       sign-in width they turn into a long narrow ribbon. */
    body[data-page-id='login-register'],
    body[data-page-id='login-update-profile'],
    body[data-page-id='login-idp-link-email'] {
      --ad-card-w: 560px;
    }

    /* ----------------------------------------------------------------------------
       Header — Adhar logo + tagline, painted over the realm-name text
       ---------------------------------------------------------------------------- */
    .pf-v5-c-login__header {
      /* `--pf-v5-c-login__header--xl--MarginTop` pushes the logo down on wide
         screens; the stack below centres itself, so start flush. */
      margin-block-start: 0;
      margin-bottom: 22px;
      padding-inline: 0;
    }

    #kc-header {
      position: relative;
      width: 100%;
      margin: 0 auto 18px;
      padding: 0;
      text-align: center;
      color: transparent;
    }

    #kc-header-wrapper {
      display: block;
      width: 260px;
      height: 68px;
      max-width: 78vw;
      margin: 0 auto;
      padding: 0;
      /* Hide the realm display-name Keycloak renders here. */
      font-size: 0;
      line-height: 0;
      color: transparent;
      text-indent: -9999px;
      overflow: hidden;
      white-space: nowrap;
      border: 0;
      background: url('../img/adhar-logo.svg') center center / contain no-repeat;
    }

    #kc-header::after {
      content: 'Open Cloud-Native Foundation';
      display: block;
      margin-top: 12px;
      font-family: var(--ad-font);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ad-content-subtle);
    }

    /* ----------------------------------------------------------------------------
       Theme toggle
       ----------------------------------------------------------------------------
       Injected into #kc-header by resources/js/adhar-theme.js. Fixed to the viewport
       corner rather than placed in the header flow, so it cannot shift the logo or
       the tagline, and it stays reachable on the tall register form. #kc-header sets
       `color: transparent` to hide the realm name, so the colour is re-declared.
       ---------------------------------------------------------------------------- */
    .adhar-theme-toggle {
      position: fixed;
      top: max(16px, env(safe-area-inset-top));
      inset-inline-end: max(16px, env(safe-area-inset-right));
      z-index: 10;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      padding: 0;
      color: var(--ad-content-muted);
      background: var(--ad-surface-raised);
      border: 1px solid var(--ad-edge-default);
      border-radius: 999px;
      box-shadow: var(--ad-shadow-sm);
      cursor: pointer;
      -webkit-appearance: none;
      appearance: none;
      transition: color 120ms ease, border-color 120ms ease, background-color 120ms ease;
    }

    .adhar-theme-toggle:hover {
      color: var(--ad-content);
      background: var(--ad-surface-app);
      border-color: var(--ad-edge-strong);
    }

    .adhar-theme-toggle:focus-visible {
      outline: none;
      border-color: var(--ad-brand-500);
      box-shadow: var(--ad-ring-brand);
    }

    .adhar-theme-toggle svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
    }

    /* The moon is a filled glyph; the sun is drawn with strokes. */
    .adhar-theme-toggle svg path[d^='M20.1'] {
      fill: currentColor;
      stroke: none;
    }

    .adhar-theme-toggle svg circle {
      fill: currentColor;
      stroke: none;
    }

    /* ----------------------------------------------------------------------------
       Card
       ---------------------------------------------------------------------------- */
    .pf-v5-c-login__main {
      /* PatternFly sets `align-self: start` and a bottom margin on the card; with
         the single-column stack above, both just introduce stray offsets. */
      align-self: stretch;
      width: 100%;
      margin-block-end: 0;
      background: var(--ad-surface-raised);
      border: 1px solid var(--ad-edge-default);
      border-radius: var(--ad-radius-xl);
      box-shadow: var(--ad-shadow-card);
      overflow: hidden;
    }

    /* The parent theme puts a 4px blue slab on top of the card. Replace it with a
       plain divider — the console has no such device. */
    .pf-v5-c-login__main-header {
      padding: 26px 28px 0;
      border-top: 0;
      background: transparent;
    }

    .pf-v5-c-login__main-body {
      padding: 18px 28px 26px;
    }

    .pf-v5-c-login__main-footer {
      padding: 0 28px 22px;
    }

    /* login.ftl emits a second, always-empty `__main-footer` after the real one
       (and register.ftl does the same). With padding applied it left a band of
       dead space at the bottom of every card. `:empty` is unreliable here because
       the element contains whitespace, so match "has no element children". */
    .pf-v5-c-login__main-footer:not(:has(*)),
    .pf-v5-c-login__main-footer-band:not(:has(*)) {
      display: none;
      padding: 0;
      border: 0;
    }

    /* Title — matches the console's page-header h1 */
    .pf-v5-c-login__main-header .pf-v5-c-title,
    #kc-page-title {
      margin: 0;
      font-family: var(--ad-font);
      font-size: 20px;
      font-weight: 600;
      line-height: 1.3;
      letter-spacing: -0.01em;
      color: var(--ad-content);
      text-align: left;
    }

    .pf-v5-c-login__main-header-desc,
    #kc-username,
    .kc-login-tooltip {
      margin-top: 6px;
      font-size: 13px;
      color: var(--ad-content-muted);
    }

    /* ----------------------------------------------------------------------------
       Form groups + labels
       ---------------------------------------------------------------------------- */
    .pf-v5-c-form {
      --pf-v5-c-form--GridGap: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .pf-v5-c-form__group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin: 0;
    }

    .pf-v5-c-form__group-label {
      padding-bottom: 0;
    }

    /* The label and its required marker are separate spans. Without an explicit
       inline box the asterisk wrapped onto its own line under the label text. */
    .pf-v5-c-form__label {
      display: inline-flex;
      align-items: baseline;
      gap: 3px;
      padding: 0;
      font-family: var(--ad-font);
      font-size: 13px;
      font-weight: 500;
      line-height: 1.4;
      color: var(--ad-content);
    }

    .pf-v5-c-form__label-text {
      display: inline;
      font-size: inherit;
      font-weight: inherit;
      color: inherit;
    }

    .pf-v5-c-form__label-required {
      display: inline;
      margin: 0;
      font-size: 13px;
      line-height: 1;
      color: var(--ad-danger);
    }

    /* "* Required fields" hint above the register form */
    #kc-registration-required-fields,
    .pf-v5-c-form__helper-text:not(.pf-m-error) {
      font-size: 12px;
      color: var(--ad-content-muted);
    }

    /* ----------------------------------------------------------------------------
       Inputs
       ----------------------------------------------------------------------------
       The wrapper span draws the field; any input inside it is flattened. A bare
       input (no wrapper) is matched by the same selector list and keeps the box.
       ---------------------------------------------------------------------------- */
    span.pf-v5-c-form-control,
    input.pf-v5-c-form-control,
    select.pf-v5-c-form-control,
    textarea.pf-v5-c-form-control,
    .pf-v5-c-form-control {
      display: flex;
      align-items: center;
      box-sizing: border-box;
      width: 100%;
      min-height: 38px;
      padding: 8px 12px;
      font-family: var(--ad-font);
      font-size: 14px;
      line-height: 1.4;
      color: var(--ad-content);
      background: var(--ad-surface-raised);
      /* PF paints a 1px "underline" via a background image — remove it. */
      background-image: none;
      border: 1px solid var(--ad-edge-default);
      border-radius: var(--ad-radius-md);
      box-shadow: var(--ad-shadow-sm);
      outline: none;
      transition:
        border-color 0.15s ease,
        box-shadow 0.15s ease;
    }

    /* Flatten the inner input — this is the fix for the double-box fields. The
       password input carries no class of its own, so match on the element too. */
    .pf-v5-c-form-control > input,
    .pf-v5-c-form-control > select,
    .pf-v5-c-form-control > textarea {
      flex: 1 1 auto;
      width: 100%;
      min-width: 0;
      min-height: 0;
      margin: 0;
      padding: 0;
      font: inherit;
      color: inherit;
      background: transparent;
      background-image: none;
      border: 0;
      border-radius: 0;
      box-shadow: none;
      outline: none;
      -webkit-appearance: none;
      appearance: none;
    }

    .pf-v5-c-form-control::after,
    .pf-v5-c-form-control::before {
      display: none;
    }

    input::placeholder,
    textarea::placeholder {
      color: var(--ad-content-subtle);
      opacity: 1;
    }

    span.pf-v5-c-form-control:hover,
    input.pf-v5-c-form-control:hover {
      border-color: var(--ad-edge-strong);
    }

    /* Focus lives on the wrapper, because the real input inside is transparent. */
    span.pf-v5-c-form-control:focus-within,
    input.pf-v5-c-form-control:focus,
    textarea.pf-v5-c-form-control:focus,
    select.pf-v5-c-form-control:focus {
      border-color: var(--ad-focus-edge);
      box-shadow: var(--ad-ring-brand);
    }

    /* Autofill — keep the field on-brand rather than browser yellow. */
    input:-webkit-autofill,
    input:-webkit-autofill:hover,
    input:-webkit-autofill:focus {
      -webkit-text-fill-color: var(--ad-content);
      box-shadow: 0 0 0 1000px var(--ad-surface-raised) inset;
      transition: background-color 5000s ease-in-out 0s;
    }

    /* ----------------------------------------------------------------------------
       Input group — password field with the show/hide toggle
       ----------------------------------------------------------------------------
       The group reads as ONE field: the wrapper loses its right corners and the
       toggle button continues the same border.
       ---------------------------------------------------------------------------- */
    .pf-v5-c-input-group {
      display: flex;
      align-items: stretch;
      width: 100%;
      background: transparent;
      border: 0;
      gap: 0;
    }

    .pf-v5-c-input-group__item {
      display: flex;
      align-items: stretch;
      background: transparent;
    }

    .pf-v5-c-input-group__item.pf-m-fill {
      flex: 1 1 auto;
      min-width: 0;
    }

    .pf-v5-c-input-group__item.pf-m-fill > .pf-v5-c-form-control {
      border-top-right-radius: 0;
      border-bottom-right-radius: 0;
      border-right: 0;
    }

    .pf-v5-c-button.pf-m-control {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      min-height: 38px;
      padding: 0;
      color: var(--ad-content-muted);
      /* Transparent, not `surface-sunken`: in dark mode sunken is *darker* than
         the field, so a filled button read as a hole punched in the input. */
      background: transparent;
      border: 1px solid var(--ad-edge-default);
      border-left: 0;
      border-top-left-radius: 0;
      border-bottom-left-radius: 0;
      border-top-right-radius: var(--ad-radius-md);
      border-bottom-right-radius: var(--ad-radius-md);
      box-shadow: var(--ad-shadow-sm);
      cursor: pointer;
      transition:
        background-color 0.15s ease,
        color 0.15s ease;
    }

    .pf-v5-c-button.pf-m-control::before,
    .pf-v5-c-button.pf-m-control::after {
      display: none;
    }

    .pf-v5-c-button.pf-m-control:hover {
      color: var(--ad-content);
      background: var(--ad-edge-subtle);
    }

    /* Focus on a password field — the bug worth spelling out.
       ----------------------------------------------------------------------------
       The password (and password-confirm) field is an input GROUP: a text wrapper
       that has had its right border and right corners removed, plus the show/hide
       button continuing the same outline. The generic field rule above puts the ring
       on that wrapper, so focusing the password box drew a rounded halo around only
       the LEFT HALF of what reads as one field, cutting through the middle of it and
       passing behind the button.

       Fix: the group draws the ring, the inner wrapper draws none. The group is the
       union of both halves, so one ring follows the real outline — which needs a
       border-radius here too, or the ring would be a sharp rectangle around a
       rounded field.

       The inner suppression wins on specificity, (0,3,0) against the (0,2,1) of
       `span.pf-v5-c-form-control:focus-within`, so it does not depend on rule order. */
    .pf-v5-c-input-group {
      border-radius: var(--ad-radius-md);
    }

    .pf-v5-c-input-group:focus-within {
      box-shadow: var(--ad-ring-brand);
    }

    .pf-v5-c-input-group .pf-v5-c-form-control:focus-within {
      box-shadow: none;
    }

    .pf-v5-c-input-group:focus-within .pf-v5-c-button.pf-m-control,
    .pf-v5-c-input-group:focus-within .pf-v5-c-input-group__item.pf-m-fill > .pf-v5-c-form-control {
      border-color: var(--ad-focus-edge);
    }

    /* ----------------------------------------------------------------------------
       Checkbox ("Remember me")
       ---------------------------------------------------------------------------- */
    .pf-v5-c-check {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .pf-v5-c-check__input {
      width: 15px;
      height: 15px;
      margin: 0;
      accent-color: var(--ad-brand-600);
      border-radius: 4px;
      cursor: pointer;
    }

    /* "Remember me" had no focus style at all, so tabbing through the form lost the
       caret between the password field and the submit button. */
    .pf-v5-c-check__input:focus-visible {
      outline: none;
      box-shadow: var(--ad-ring-brand);
    }

    .pf-v5-c-check__label {
      font-size: 13px;
      color: var(--ad-content-muted);
      cursor: pointer;
    }

    /* Options row — "remember me" on the left, "forgot password" on the right */
    #kc-form-options,
    .pf-v5-c-form__group.kc-form-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    /* ----------------------------------------------------------------------------
       Buttons — the console's `primary` variant (solid brand, not a gradient)
       ---------------------------------------------------------------------------- */
    .pf-v5-c-button {
      font-family: var(--ad-font);
      font-size: 14px;
      font-weight: 500;
      border-radius: var(--ad-radius-lg);
      transition:
        background-color 0.15s ease,
        border-color 0.15s ease,
        box-shadow 0.15s ease;
    }

    .pf-v5-c-button.pf-m-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      padding: 0 20px;
      color: #fff;
      background: var(--ad-brand-600);
      border: 0;
      box-shadow:
        var(--ad-shadow-sm),
        inset 0 0 0 1px oklch(1 0 0 / 0.1);
      cursor: pointer;
    }

    .pf-v5-c-button.pf-m-primary:hover {
      background: var(--ad-brand-700);
    }

    .pf-v5-c-button.pf-m-primary:active {
      background: var(--ad-brand-800);
    }

    .pf-v5-c-button.pf-m-primary:focus-visible {
      outline: none;
      box-shadow: var(--ad-ring-brand);
    }

    .pf-v5-c-button.pf-m-primary:disabled {
      background: var(--ad-brand-300);
      color: oklch(1 0 0 / 0.7);
      cursor: not-allowed;
    }

    .pf-v5-c-button.pf-m-block {
      width: 100%;
    }

    /* Secondary / default — the console's `secondary` variant */
    .pf-v5-c-button.pf-m-secondary,
    .pf-v5-c-button.pf-m-tertiary,
    .pf-v5-c-button.pf-m-default {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      padding: 0 18px;
      color: var(--ad-content);
      background: var(--ad-surface-raised);
      border: 1px solid var(--ad-edge-default);
      box-shadow: var(--ad-shadow-sm);
      cursor: pointer;
    }

    .pf-v5-c-button.pf-m-secondary:hover,
    .pf-v5-c-button.pf-m-tertiary:hover,
    .pf-v5-c-button.pf-m-default:hover {
      border-color: var(--ad-edge-strong);
      background: var(--ad-surface-sunken);
    }

    /* Only the primary button had a focus ring, so every secondary control — "Back
       to sign in", the identity-provider buttons — took keyboard focus invisibly. */
    .pf-v5-c-button.pf-m-secondary:focus-visible,
    .pf-v5-c-button.pf-m-tertiary:focus-visible,
    .pf-v5-c-button.pf-m-default:focus-visible,
    .pf-v5-c-button.pf-m-control:focus-visible,
    a.zocial:focus-visible,
    #kc-social-providers a:focus-visible {
      outline: none;
      border-color: var(--ad-focus-edge);
      box-shadow: var(--ad-ring-brand);
    }

    /* ----------------------------------------------------------------------------
       Links + footer bands
       ---------------------------------------------------------------------------- */
    a,
    .pf-v5-c-login__main-footer-band-item a,
    .pf-v5-c-button.pf-m-link {
      color: var(--ad-brand-700);
      font-weight: 500;
      text-decoration: none;
      text-underline-offset: 2px;
    }

    a:hover,
    .pf-v5-c-button.pf-m-link:hover {
      color: var(--ad-brand-800);
      text-decoration: underline;
    }

    /* Inline links get an offset outline rather than a box-shadow ring: a ring on a
       text run that wraps across two lines draws a lopsided blob, whereas `outline`
       follows each line box. Underlining too, so focus is not colour-only. */
    a:focus-visible,
    .pf-v5-c-button.pf-m-link:focus-visible {
      outline: 2px solid var(--ad-focus-edge);
      outline-offset: 2px;
      border-radius: 4px;
      text-decoration: underline;
    }

    /* The logo is a link on some pages; a ring around a 260px transparent box looks
       like a stray rectangle, so keep it tight to the artwork. */
    #kc-header-wrapper a:focus-visible {
      outline-offset: 0;
    }

    /* Links lift to a brighter brand step on dark surfaces. This MUST use the same
       selector pair as the token block above rather than `prefers-color-scheme`:
       keyed to the OS, an explicit LIGHT choice on a dark-mode machine left
       brand-300 links on a white card — the one contrast bug that survived the
       first pass at dark mode. */
    :root[data-adhar-theme='dark'] a,
    :root[data-adhar-theme='dark'] .pf-v5-c-login__main-footer-band-item a,
    :root[data-adhar-theme='dark'] .pf-v5-c-button.pf-m-link,
    :root.pf-v5-theme-dark:not([data-adhar-theme='light']) a,
    :root.pf-v5-theme-dark:not([data-adhar-theme='light']) .pf-v5-c-login__main-footer-band-item a,
    :root.pf-v5-theme-dark:not([data-adhar-theme='light']) .pf-v5-c-button.pf-m-link {
      color: var(--ad-brand-300);
    }

    :root[data-adhar-theme='dark'] a:hover,
    :root[data-adhar-theme='dark'] .pf-v5-c-button.pf-m-link:hover,
    :root.pf-v5-theme-dark:not([data-adhar-theme='light']) a:hover,
    :root.pf-v5-theme-dark:not([data-adhar-theme='light']) .pf-v5-c-button.pf-m-link:hover {
      color: var(--ad-brand-200);
    }

    /* "New user? Register" / "Already have an account?" band.
       The parent theme gives the first band a large top margin and draws a rule;
       combined with the card's own padding that produced a doubled divider under
       the submit button. One divider, on the band only. */
    .pf-v5-c-login__main-footer-band {
      margin: 0;
      padding: 16px 0 0;
      border-top: 1px solid var(--ad-edge-subtle);
      font-size: 13px;
      color: var(--ad-content-muted);
      text-align: center;
    }

    .pf-v5-c-login__main-footer-band:first-child {
      margin-block-start: 0;
    }

    .pf-v5-c-login__main-footer-band + .pf-v5-c-login__main-footer-band {
      padding-top: 8px;
      border-top: 0;
    }

    .pf-v5-c-login__main-footer-band-item {
      margin: 0;
    }

    /* ----------------------------------------------------------------------------
       Social / identity providers
       ---------------------------------------------------------------------------- */
    #kc-social-providers {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid var(--ad-edge-subtle);
    }

    #kc-social-providers ul {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .pf-v5-c-button.kc-social-item {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      min-height: 40px;
      color: var(--ad-content);
      background: var(--ad-surface-raised);
      border: 1px solid var(--ad-edge-default);
      box-shadow: var(--ad-shadow-sm);
    }

    .pf-v5-c-button.kc-social-item:hover {
      border-color: var(--ad-edge-strong);
      background: var(--ad-surface-sunken);
    }

    /* ----------------------------------------------------------------------------
       Alerts, field errors, helper text
       ---------------------------------------------------------------------------- */
    .pf-v5-c-alert {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 16px;
      padding: 12px 14px;
      font-size: 13px;
      line-height: 1.45;
      color: var(--ad-content);
      background: var(--ad-surface-sunken);
      border: 1px solid var(--ad-edge-default);
      border-radius: var(--ad-radius-md);
      box-shadow: none;
    }

    .pf-v5-c-alert::before {
      display: none;
    }

    .pf-v5-c-alert__icon {
      display: flex;
      align-items: center;
      padding: 0;
      font-size: 14px;
    }

    .pf-v5-c-alert.pf-m-danger {
      color: var(--ad-danger);
      background: var(--ad-danger-bg);
      border-color: color-mix(in oklab, var(--ad-danger) 35%, transparent);
    }

    .pf-v5-c-alert.pf-m-warning {
      color: var(--ad-warn);
      background: var(--ad-warn-bg);
      border-color: color-mix(in oklab, var(--ad-warn) 35%, transparent);
    }

    .pf-v5-c-alert.pf-m-success {
      color: var(--ad-success);
      background: var(--ad-success-bg);
      border-color: color-mix(in oklab, var(--ad-success) 35%, transparent);
    }

    .pf-v5-c-alert.pf-m-info {
      color: var(--ad-info);
      background: var(--ad-info-bg);
      border-color: color-mix(in oklab, var(--ad-info) 35%, transparent);
    }

    /* Per-field validation message */
    .pf-v5-c-helper-text__item.pf-m-error,
    .pf-v5-c-helper-text__item-text.pf-m-error,
    .pf-v5-c-form__helper-text.pf-m-error,
    #input-error,
    .kc-feedback-text {
      font-size: 12px;
      line-height: 1.4;
      color: var(--ad-danger);
    }

    /* Invalid field */
    .pf-v5-c-form-control.pf-m-error,
    span.pf-v5-c-form-control:has(input[aria-invalid='true']) {
      border-color: var(--ad-danger);
    }

    .pf-v5-c-form-control.pf-m-error:focus-within {
      border-color: var(--ad-danger);
      box-shadow: 0 0 0 3px color-mix(in oklab, var(--ad-danger) 26%, transparent);
    }

    /* An invalid PASSWORD field is an input group, so the ring is on the group (see
       the focus note there) — without this it would focus brand-blue while the field
       is in an error state, which reads as "fixed" when it is not. */
    .pf-v5-c-input-group:focus-within:has(.pf-m-error),
    .pf-v5-c-input-group:focus-within:has(input[aria-invalid='true']) {
      box-shadow: 0 0 0 3px color-mix(in oklab, var(--ad-danger) 26%, transparent);
    }

    .pf-v5-c-input-group:focus-within:has(.pf-m-error) .pf-v5-c-button.pf-m-control,
    .pf-v5-c-input-group:focus-within:has(.pf-m-error) .pf-v5-c-form-control,
    .pf-v5-c-input-group:focus-within:has(input[aria-invalid='true']) .pf-v5-c-button.pf-m-control,
    .pf-v5-c-input-group:focus-within:has(input[aria-invalid='true']) .pf-v5-c-form-control {
      border-color: var(--ad-danger);
    }

    /* Keycloak renders empty placeholders under every field — an error container,
       and on password fields a helper-text wrapper around an empty helper list.
       Left visible they added phantom rows, so password fields sat further from
       the next field than the others. Collapse them until they hold something.
       `:empty` is no use here: the nodes contain whitespace, and the helper-text
       wrapper holds an (empty) child element. */
    [id^='input-error-container-']:not(:has(*)) {
      display: none;
    }

    /* The helper-text wrapper always contains an (empty) helper-text list, so test
       for a real *item* instead. Note this must not be written as
       `:has(> .pf-v5-c-helper-text:not(:has(*)))` — `:has()` cannot be nested
       inside `:has()`, which makes the selector invalid and silently drops the
       whole rule. */
    .pf-v5-c-form__helper-text:not(:has(.pf-v5-c-helper-text__item)) {
      display: none;
    }

    /* ----------------------------------------------------------------------------
       Language picker + misc menus
       ---------------------------------------------------------------------------- */
    .pf-v5-c-menu,
    .pf-v5-c-menu__content {
      color: var(--ad-content);
      background: var(--ad-surface-raised);
      border: 1px solid var(--ad-edge-default);
      border-radius: var(--ad-radius-md);
      box-shadow: var(--ad-shadow-card);
    }

    .pf-v5-c-menu__list-item:hover {
      background: var(--ad-surface-sunken);
    }

    /* ----------------------------------------------------------------------------
       Small screens
       ---------------------------------------------------------------------------- */
    @media (max-width: 480px) {
      .pf-v5-c-login {
        padding: 24px 12px;
      }

      .pf-v5-c-login__main-header {
        padding: 22px 20px 0;
      }

      .pf-v5-c-login__main-body {
        padding: 16px 20px 22px;
      }

      .pf-v5-c-login__main-footer {
        padding: 0 20px 20px;
      }

      #kc-header-wrapper {
        width: 220px;
        height: 58px;
      }

      .adhar-theme-toggle {
        top: max(10px, env(safe-area-inset-top));
        inset-inline-end: max(10px, env(safe-area-inset-right));
        width: 34px;
        height: 34px;
      }
    }

    /* Between the phone breakpoint and the widened register cap, the 560px cards
       would otherwise overflow a narrow tablet/split window. */
    @media (max-width: 600px) {
      body[data-page-id='login-register'],
      body[data-page-id='login-update-profile'],
      body[data-page-id='login-idp-link-email'] {
        --ad-card-w: 100%;
      }
    }
  adhar-theme.js: |
    /* =============================================================================
       Adhar login theme — theme resolution (light / dark / follow-the-OS)

       WHY THIS FILE EXISTS
       --------------------
       Keycloak 26 ships its own dark-mode support: keycloak.v2's theme.properties
       sets `darkMode=true` + `kcDarkModeClass=pf-v5-theme-dark`, and template.ftl
       inlines a script that adds/removes that class from <html> according to
       `prefers-color-scheme`. Our stylesheet used to key off the same media query.

       Both therefore follow the OPERATING SYSTEM. Neither follows the Adhar
       Console, whose light/dark mode is an explicit user choice. Pick dark in the
       console on a light-mode laptop and the login page stayed white — the bug this
       file fixes.

       HOW THE PREFERENCE IS SHARED
       ----------------------------
       The console runs on console.<domain> and Keycloak on keycloak.<domain>.
       Different origins, so localStorage is NOT shared. A cookie scoped to the
       PARENT domain is, so the preference travels in an `adhar-theme` cookie
       (`light` | `dark` | `system`) set on `.<domain>` — readable by both.
       `?theme=` on the URL is also honoured (and persisted), which lets the console
       hand the choice over explicitly on redirect to login.

       WHY A CLASSIC SCRIPT, NOT A MODULE
       ----------------------------------
       theme.properties `scripts=` renders `<script src=… type="text/javascript">`
       in <head>, which is parser-blocking and runs BEFORE first paint — so an
       explicit choice never flashes the wrong colours. Keycloak's own dark-mode
       script is `type="module"` and therefore deferred: it runs AFTER this one and
       would clobber the choice, and it re-applies on every OS change. The observer
       at the bottom pins our decision back without overriding any template.
       ============================================================================= */
    (function () {
      "use strict";

      var DARK_CLASS = "pf-v5-theme-dark";
      var COOKIE = "adhar-theme";
      var MODES = { light: 1, dark: 1, system: 1 };
      var root = document.documentElement;

      function readCookie(name) {
        var parts = ("; " + document.cookie).split("; " + name + "=");
        if (parts.length !== 2) return null;
        try {
          return decodeURIComponent(parts.pop().split(";").shift());
        } catch (e) {
          return null;
        }
      }

      /* The cookie must be visible to sibling subdomains, so it is set one label up
         (keycloak.platform.adhar.io -> .platform.adhar.io). Returning null means
         "host-only", which is correct for a bare host or an IP — there are no
         siblings to share with, and a domain attribute would be rejected anyway. */
      function cookieDomain() {
        var host = location.hostname;
        if (/^[0-9.]+$/.test(host) || host.indexOf(":") !== -1) return null;
        var labels = host.split(".");
        if (labels.length < 3) return null;
        return "." + labels.slice(1).join(".");
      }

      function writeCookie(name, value) {
        var domain = cookieDomain();
        document.cookie =
          name + "=" + encodeURIComponent(value) +
          ";path=/;max-age=31536000;samesite=lax" +
          (location.protocol === "https:" ? ";secure" : "") +
          (domain ? ";domain=" + domain : "");
      }

      function resolveMode() {
        var query = null;
        try {
          query = new URLSearchParams(location.search).get("theme");
        } catch (e) {
          /* Very old browser: fall through to the cookie. */
        }
        if (query && MODES[query]) {
          writeCookie(COOKIE, query);
          return query;
        }
        var stored = readCookie(COOKIE);
        return stored && MODES[stored] ? stored : "system";
      }

      function systemPrefersDark() {
        return !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
      }

      var mode = resolveMode();
      var observer = null;

      /* `data-adhar-theme` is what the stylesheet keys off:
           - "dark"   forces the dark tokens
           - "light"  suppresses the prefers-color-scheme dark block
           - "system" leaves the media query in charge
         The PatternFly class is kept in step so the inherited component styles and
         our tokens never disagree — a light choice on a dark OS would otherwise
         leave PatternFly dark underneath our light surfaces. */
      function apply() {
        root.setAttribute("data-adhar-theme", mode);

        if (observer) {
          observer.disconnect();
          observer = null;
        }

        if (mode === "system") {
          /* Hand the class back to Keycloak's own listener. Set it once here too,
             because that listener may not have run yet. */
          root.classList.toggle(DARK_CLASS, systemPrefersDark());
          return;
        }

        var wantDark = mode === "dark";
        root.classList.toggle(DARK_CLASS, wantDark);

        /* Keycloak's deferred module re-applies the OS preference, so re-assert. */
        if (window.MutationObserver) {
          observer = new MutationObserver(function () {
            if (root.classList.contains(DARK_CLASS) !== wantDark) {
              root.classList.toggle(DARK_CLASS, wantDark);
            }
          });
          observer.observe(root, { attributes: true, attributeFilter: ["class"] });
        }
      }

      apply();

      /* ---------------------------------------------------------------------------
         Toggle control
         ---------------------------------------------------------------------------
         Without a control the shared cookie can only ever be set by the console, so
         the fix would be untestable from the login page itself. The button writes
         the SAME cookie the console reads, so the two surfaces round-trip.
         Rendered from script rather than an FTL override, keeping the theme's
         "no templates overridden" property intact.
         ------------------------------------------------------------------------- */
      var SUN =
        '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">' +
        '<circle cx="12" cy="12" r="4.2"/>' +
        '<g stroke-linecap="round"><path d="M12 2.6v2.4M12 19v2.4M2.6 12h2.4M19 12h2.4' +
        'M5.3 5.3l1.7 1.7M17 17l1.7 1.7M18.7 5.3L17 7M7 17l-1.7 1.7"/></g></svg>';
      var MOON =
        '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">' +
        '<path d="M20.1 14.6A8.4 8.4 0 1 1 9.4 3.9a6.9 6.9 0 0 0 10.7 10.7z"/></svg>';

      function effectiveDark() {
        if (mode === "dark") return true;
        if (mode === "light") return false;
        return systemPrefersDark();
      }

      function label() {
        return effectiveDark() ? "Switch to light theme" : "Switch to dark theme";
      }

      function mountToggle() {
        var header = document.getElementById("kc-header");
        if (!header || document.getElementById("adhar-theme-toggle")) return;

        var button = document.createElement("button");
        button.id = "adhar-theme-toggle";
        button.type = "button";
        button.className = "adhar-theme-toggle";
        button.setAttribute("aria-label", label());
        button.setAttribute("title", label());
        button.innerHTML = effectiveDark() ? SUN : MOON;

        button.addEventListener("click", function () {
          mode = effectiveDark() ? "light" : "dark";
          writeCookie(COOKIE, mode);
          apply();
          button.innerHTML = effectiveDark() ? SUN : MOON;
          button.setAttribute("aria-label", label());
          button.setAttribute("title", label());
        });

        header.appendChild(button);
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", mountToggle);
      } else {
        mountToggle();
      }

      /* In system mode the icon must track the OS as it changes. */
      if (window.matchMedia) {
        var mq = window.matchMedia("(prefers-color-scheme: dark)");
        var onChange = function () {
          if (mode !== "system") return;
          var button = document.getElementById("adhar-theme-toggle");
          if (!button) return;
          button.innerHTML = effectiveDark() ? SUN : MOON;
          button.setAttribute("aria-label", label());
          button.setAttribute("title", label());
        };
        if (mq.addEventListener) mq.addEventListener("change", onChange);
        else if (mq.addListener) mq.addListener(onChange);
      }
    })();
