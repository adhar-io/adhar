apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: keycloak
  namespace: adhar-system
spec:
  length: 36
  digits: 5
  symbols: 5
  symbolCharacters: /-+
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-config
  namespace: adhar-system
spec:
  refreshInterval: '0'
  target:
    name: keycloak-config
    template:
      metadata:
        labels:
          adhar.io/cli-secret: 'true'
          adhar.io/package-name: keycloak
      engineVersion: v2
      data:
        KEYCLOAK_ADMIN_PASSWORD: '{{.KEYCLOAK_ADMIN_PASSWORD}}'
        KC_DB_USERNAME: keycloak
        KC_DB_PASSWORD: '{{.KC_DB_PASSWORD}}'
        POSTGRES_DB: keycloak
        POSTGRES_USER: keycloak
        POSTGRES_PASSWORD: '{{.KC_DB_PASSWORD}}'
        USER_PASSWORD: '{{.USER_PASSWORD}}'
        username: keycloak
        password: '{{.KC_DB_PASSWORD}}'
  dataFrom:
  - sourceRef:
      generatorRef:
        apiVersion: generators.external-secrets.io/v1alpha1
        kind: Password
        name: keycloak
    rewrite:
    - transform:
        template: KEYCLOAK_ADMIN_PASSWORD
  - sourceRef:
      generatorRef:
        apiVersion: generators.external-secrets.io/v1alpha1
        kind: Password
        name: keycloak
    rewrite:
    - transform:
        template: KC_DB_PASSWORD
  - sourceRef:
      generatorRef:
        apiVersion: generators.external-secrets.io/v1alpha1
        kind: Password
        name: keycloak
    rewrite:
    - transform:
        template: USER_PASSWORD
---
# user2's password lives in its OWN ExternalSecret, not as another key in
# keycloak-config above. That looks asymmetric, and it is deliberate.
#
# The Password generator returns a fresh random value on every call, and ESO
# re-runs EVERY `dataFrom` entry of an ExternalSecret whenever that object's
# spec changes. Adding a USER2_PASSWORD key to keycloak-config would therefore
# rotate KEYCLOAK_ADMIN_PASSWORD and KC_DB_PASSWORD too, on every cluster that
# upgrades into this version — against a Keycloak whose admin account was
# bootstrapped once with the old password, and a Postgres already initialised
# with the old one. The platform would come back with a secret that no longer
# opens anything.
#
# A separate object is additive: existing clusters keep their credentials and
# simply gain this one.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-user2
  namespace: adhar-system
spec:
  refreshInterval: '0'
  target:
    name: keycloak-user2
    template:
      metadata:
        labels:
          # Makes it visible to `adhar get secrets`, which lists every secret
          # carrying this label.
          adhar.io/cli-secret: 'true'
          adhar.io/package-name: keycloak
      engineVersion: v2
      data:
        # Same key name as user1's in keycloak-config, so the two are read the
        # same way; they are distinguished by which secret they live in.
        USER_PASSWORD: '{{.USER_PASSWORD}}'
        username: user2@noreply.com
  dataFrom:
  - sourceRef:
      generatorRef:
        apiVersion: generators.external-secrets.io/v1alpha1
        kind: Password
        name: keycloak
    rewrite:
    - transform:
        template: USER_PASSWORD
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-store
  namespace: adhar-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: adhar-system
  name: eso-store
rules:
- apiGroups:
  - ''
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - authorization.k8s.io
  resources:
  - selfsubjectrulesreviews
  verbs:
  - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-store
  namespace: adhar-system
subjects:
- kind: ServiceAccount
  name: eso-store
  namespace: adhar-system
roleRef:
  kind: Role
  name: eso-store
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: keycloak
spec:
  provider:
    kubernetes:
      remoteNamespace: adhar-system
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: adhar-system
          key: ca.crt
      auth:
        serviceAccount:
          name: eso-store
          namespace: adhar-system
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: gitea
spec:
  provider:
    kubernetes:
      remoteNamespace: adhar-system
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: adhar-system
          key: ca.crt
      auth:
        serviceAccount:
          name: eso-store
          namespace: adhar-system
