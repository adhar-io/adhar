# Kubernetes RBAC from Keycloak groups (ADR-0008: authorization flows from
# group claims; humans authenticate to the API server via OIDC).
#
# The realm's platform groups map onto Kubernetes' standard aggregated roles:
#
#   platform-admin     -> cluster-admin
#   platform-engineer  -> cluster-admin  (platform/infra admin tier; full access,
#                                         incl. Secrets)
#   application-admin  -> (nothing cluster-wide -- see below)
#   platform-developer -> edit  (platform team; cluster-wide by design)
#   platform-viewer    -> view  (platform team; cluster-wide by design)
#
# APPLICATION TEAMS are NOT in the table above. There is exactly one
# organisation on a platform, and teams are the unit of onboarding and the unit
# of isolation. A team's authority is granted per-namespace by the
# CompositeProject composition, binding `oidc:ws-team-<team>` to `admin` in that
# team's own namespace only -- "Platform Admin of your own tenant". The
# platform-* groups above are the platform team, whose shared services every
# application team consumes.
#
# NOTE on Secrets — CHECK THIS AGAINST YOUR CLUSTER, the distinction is not what
# an earlier revision of this comment claimed.
#
# `view` does NOT grant Secrets. `edit` DOES: verified on Kubernetes v1.37,
# where the built-in `edit` ClusterRole carries get/list/watch on secrets, so
# **platform-developer can READ Secrets in any namespace** (it cannot write
# them). Only `view`/platform-viewer is excluded.
#
# This comment previously asserted that edit and view both excluded Secrets and
# that "only the admin-tier groups above can read Secrets" — which would lead an
# operator to hand out platform-developer believing Secrets were out of reach.
# If you need a developer tier that genuinely cannot read Secrets, bind a custom
# ClusterRole rather than the built-in `edit`.
#
# Group subjects use the "oidc:" prefix, which the API server must be configured
# to produce. On the kubeadm providers this is a DAY-2 step, applied once Keycloak
# is serving — `oidcAuth: "true"` in clusterConfig is REJECTED, because setting
# --oidc-issuer-url during `kubeadm init` points the apiserver at a Keycloak that
# does not exist yet and it then fails to start at all, aborting provisioning.
# See docs/DIGITALOCEAN_PROVIDER.md, "kubectl with your platform identity", for
# the exact commands. The flags are:
#
#   --oidc-issuer-url=https://keycloak.<host>/realms/adhar
#   --oidc-client-id=kubernetes          # the token's AUDIENCE, not adhar-cli
#   --oidc-username-claim=preferred_username
#   --oidc-username-prefix=oidc:
#   --oidc-groups-claim=groups
#   --oidc-groups-prefix=oidc:
#
# --oidc-client-id is the token's `aud`, which is `kubernetes` — NOT `adhar-cli`,
# which is only the `azp` (the client that requested the token). An earlier
# revision of this comment said adhar-cli; with that value the API server rejects
# every token with a bare "Unauthorized" and the bindings below never match.
#
# It is off by default on purpose: enabling it makes Keycloak group membership a
# grant of Kubernetes authority (anyone in platform-admin becomes cluster-admin),
# so it belongs to whoever runs the platform. Kind sets the same flags via
# platform/providers/kind/resources/kind.yaml.tmpl. A MANAGED control plane
# (DOKS/EKS/AKS/GKE) does not take apiserver flags this way — use the cloud's own
# OIDC settings, with the same claims and prefixes.
#
# The prefix keeps OIDC identities from ever colliding with built-in
# system: users/groups. kubectl can then use the CLI session directly:
#   kubectl --token "$(adhar auth token)" get pods
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: adhar-oidc-platform-admin
  labels:
    adhar.io/component: rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: oidc:platform-admin
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: adhar-oidc-platform-engineer
  labels:
    adhar.io/component: rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: oidc:platform-engineer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  # DELIBERATELY BINDS NOTHING CLUSTER-WIDE.
  #
  # This used to bind oidc:application-admin to the built-in `admin` ClusterRole
  # across the whole cluster, which meant every application admin had admin on
  # every OTHER application team's namespace -- no tenant isolation at all, and
  # read/write on their Secrets. The comment above this file's group table has
  # said "tighten to per-namespace RoleBindings for tenants" since it was
  # written; this is that tightening.
  #
  # An application team's authority is now granted where the team actually
  # lives: the CompositeProject composition
  # (platform/controlplane/configuration/compositions/project/local.yaml) emits
  # a RoleBinding of `oidc:ws-team-<team>` to `admin` IN THAT TEAM'S NAMESPACE,
  # plus a default-deny-ingress NetworkPolicy. Onboarding a team is what grants
  # it access, and it reaches nothing else.
  #
  # The platform-* groups below stay cluster-wide on purpose: the platform team
  # hosts the shared services every application team consumes.
  #
  # The empty subject list is kept rather than deleting the object so that
  # clusters upgrading from the old model have the over-broad binding actively
  # emptied by the sync, instead of leaving an orphan ClusterRoleBinding behind
  # that ArgoCD would have no manifest to prune against.
  name: adhar-oidc-application-admin
  labels:
    adhar.io/component: rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: adhar-oidc-platform-developer
  labels:
    adhar.io/component: rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: oidc:platform-developer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: adhar-oidc-platform-viewer
  labels:
    adhar.io/component: rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: oidc:platform-viewer
---
# Platform custom resources for the built-in role tiers.
#
# Kubernetes' built-in `view` / `edit` / `admin` ClusterRoles cover the core API
# groups only. They say nothing about CRDs, so a signed-in developer or viewer
# is denied the platform's own resources and the Console fails to render:
#
#   Couldn't load the marketplace
#   applicationsets.argoproj.io is forbidden: User "oidc:<user>" cannot list
#   resource "applicationsets" in API group "argoproj.io"
#
# Only the cluster-admin tiers worked, which made every read-only page an
# admin-only page.
#
# Aggregation is the idiomatic fix: labelling a ClusterRole
# `rbac.authorization.k8s.io/aggregate-to-view: "true"` folds its rules into
# `view`, and `view`'s rules are in turn aggregated into `edit` and `admin`. One
# object therefore fixes every tier at once, and stays correct if the tiers are
# re-bound later.
#
# READ-ONLY on purpose. The Console mutates the platform through GitOps (a Gitea
# commit that ArgoCD reconciles), never by writing these objects directly, so
# nothing here needs create/update/delete.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: adhar-platform-crd-view
  labels:
    adhar.io/component: rbac
    rbac.authorization.k8s.io/aggregate-to-view: "true"
rules:
  # ArgoCD: the Console's marketplace, app list and sync status.
  - apiGroups: [argoproj.io]
    resources:
      - applications
      - applicationsets
      - appprojects
      - workflows
      - workflowtemplates
      - rollouts
      - analysisruns
      - analysistemplates
    verbs: [get, list, watch]
  # The platform's own API: what `adhar get status` and the Console header read.
  - apiGroups: [platform.adhar.io]
    resources: ["*"]
    verbs: [get, list, watch]
  # Databases, certificates and policy reports surfaced on the service pages.
  - apiGroups: [postgresql.cnpg.io]
    resources: ["*"]
    verbs: [get, list, watch]
  - apiGroups: [cert-manager.io]
    resources: [certificates, issuers, clusterissuers]
    verbs: [get, list, watch]
  - apiGroups: [wgpolicyk8s.io]
    resources: [policyreports, clusterpolicyreports]
    verbs: [get, list, watch]
  - apiGroups: [kyverno.io]
    resources: [policies, clusterpolicies]
    verbs: [get, list, watch]
  # Routing: the access URL shown on a service card.
  - apiGroups: [gateway.networking.k8s.io]
    resources: [gateways, httproutes, gatewayclasses]
    verbs: [get, list, watch]
  # Pipelines: build history on the service pages.
  - apiGroups: [tekton.dev]
    resources: [pipelines, pipelineruns, tasks, taskruns]
    verbs: [get, list, watch]
