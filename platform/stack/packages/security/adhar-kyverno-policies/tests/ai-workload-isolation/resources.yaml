apiVersion: v1
kind: Pod
metadata: {name: gpu-microvm, namespace: vision-prod}
spec:
  containers:
    - name: model
      image: ghcr.io/example/model:1.0
      resources: {limits: {nvidia.com/gpu: "1", memory: 8Gi}, requests: {nvidia.com/gpu: "1", cpu: "1"}}
---
apiVersion: v1
kind: Pod
metadata: {name: cpu-microvm, namespace: vision-prod}
spec:
  containers:
    - name: api
      image: ghcr.io/example/api:1.0
---
apiVersion: v1
kind: Pod
metadata: {name: explicit-runc, namespace: vision-prod}
spec:
  runtimeClassName: runc
  containers:
    - name: api
      image: ghcr.io/example/api:1.0
---
apiVersion: v1
kind: Pod
metadata: {name: gpu-mig, namespace: embed-prod}
spec:
  tolerations: [{key: dedicated, operator: Exists}]
  containers:
    - name: model
      image: ghcr.io/example/model:1.0
      resources: {limits: {nvidia.com/gpu: "2"}}
---
apiVersion: v1
kind: Pod
metadata: {name: gpu-slice, namespace: slice-prod}
spec:
  containers:
    - name: model
      image: ghcr.io/example/model:1.0
      resources: {limits: {nvidia.com/gpu: "1"}}
---
apiVersion: v1
kind: Pod
metadata: {name: plain, namespace: team-web}
spec:
  containers:
    - name: web
      image: ghcr.io/example/web:1.0
      resources: {limits: {nvidia.com/gpu: "1"}}
