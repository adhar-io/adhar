# Cluster-scoped governance: namespaces must declare which plane they belong to
# (ADR-0023 placement contract — `adhar.io/plane: control|data`, plus `preview`
# for the ephemeral per-PR namespaces of ADR-0017). Platform
# namespaces are created with the label; tenant/application namespaces get it
# from Environment / the golden-path templates. Audit only: it reports,
# never blocks. Kubernetes' own namespaces are excluded.
#
# This is also the platform's cluster-scoped policy: Kyverno writes per-namespace
# PolicyReports for namespaced resources and ClusterPolicyReports only for
# cluster-scoped ones, so without a Namespace-level policy the cluster-wide
# report set is empty and cluster-level tooling shows "no reports".
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-namespace-plane-label
  annotations:
    policies.kyverno.io/title: Require Namespace Plane Label
    policies.kyverno.io/category: Adhar Governance
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Namespace
    policies.kyverno.io/description: >-
      Every namespace must carry the adhar.io/plane label (control, data, or
      preview) so workload placement and fleet policies (ADR-0023) can be
      enforced.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: plane-label-present
      match:
        any:
          - resources:
              kinds:
                - Namespace
      exclude:
        any:
          - resources:
              names:
                - kube-system
                - kube-public
                - kube-node-lease
                - default
                - local-path-storage
                - cilium-secrets   # Cilium-owned, created by the agent
      validate:
        # `workload` is what the hierarchy compositions stamp on every team
        # namespace (project home and dev/test/prod), and `ci` is the
        # supply-chain build sandbox. The policy predated both, so every
        # namespace the platform created for a team reported as a violation
        # of its own placement rule (2026-10-24).
        message: >-
          Namespace must be labelled adhar.io/plane=control, data, workload, ci
          or preview (ADR-0023 placement; `workload` is a team's application
          namespace, `ci` the build sandbox, `preview` the ephemeral
          per-pull-request plane of ADR-0017).
        pattern:
          metadata:
            labels:
              adhar.io/plane: "control | data | workload | ci | preview"
