# The cloud's CSI node driver (mounts block devices: privileged + host paths) and cloud-controller-manager (host network).
apiVersion: kyverno.io/v2
kind: PolicyException
metadata:
  name: platform-agent-cloud-integration
  namespace: adhar-system
  labels:
    app.kubernetes.io/part-of: adhar-kyverno-policies
spec:
  exceptions:
  - policyName: disallow-host-namespaces
    ruleNames:
    - host-namespaces
    - autogen-host-namespaces
  - policyName: disallow-host-path
    ruleNames:
    - host-path
    - autogen-host-path
  - policyName: disallow-privileged-containers
    ruleNames:
    - privileged-containers
    - autogen-privileged-containers
  match:
    any:
    - resources:
        kinds: [Pod, DaemonSet, Deployment, ReplicaSet, StatefulSet]
        namespaces: [kube-system]
        names:
        - "*csi-node*"
        - "*csi-controller*"
        - "*cloud-controller-manager*"
        - "csi-*"
