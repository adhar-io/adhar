# Node-level platform agents that need host access BY DESIGN (2026-10-24).
#
# These were the bulk of the platform's policy "failures": the Pod Security
# baseline policies are right to flag host paths, host namespaces and privileged
# containers in workloads, and these agents are exactly the components whose
# job requires them. Each exception names the agent's pods and controllers and
# ONLY the rules that agent was reported failing — not a blanket bypass. The
# policies keep enforcing everything else for them and everything for
# everyone else. Kyverno honours exceptions only from adhar-system
# (security/kyverno values: features.policyExceptions.namespace).
---
# The CNI and its Envoy/operator: eBPF datapath, host networking, BPF and cgroup mounts, privileged init containers.
apiVersion: kyverno.io/v2
kind: PolicyException
metadata:
  name: platform-agent-cilium
  namespace: adhar-system
  labels:
    app.kubernetes.io/part-of: adhar-kyverno-policies
spec:
  exceptions:
  - policyName: disallow-capabilities
    ruleNames:
    - adding-capabilities
    - autogen-adding-capabilities
  - policyName: disallow-host-namespaces
    ruleNames:
    - host-namespaces
    - autogen-host-namespaces
  - policyName: disallow-host-path
    ruleNames:
    - host-path
    - autogen-host-path
  - policyName: disallow-host-ports
    ruleNames:
    - host-ports-none
    - autogen-host-ports-none
  - policyName: disallow-privileged-containers
    ruleNames:
    - privileged-containers
    - autogen-privileged-containers
  - policyName: disallow-selinux
    ruleNames:
    - selinux-type
    - autogen-selinux-type
    - selinux-user-role
    - autogen-selinux-user-role
  - policyName: restrict-apparmor-profiles
    ruleNames:
    - app-armor
    - autogen-app-armor
  - policyName: restrict-seccomp
    ruleNames:
    - check-seccomp
    - autogen-check-seccomp
  match:
    any:
    - resources:
        kinds: [Pod, DaemonSet, Deployment, ReplicaSet, StatefulSet]
        namespaces: [adhar-system]
        names:
        - cilium
        - "cilium-*"
---
# Runtime security: reads kernel events (privileged) and host paths (/proc, /etc, container runtime socket).
apiVersion: kyverno.io/v2
kind: PolicyException
metadata:
  name: platform-agent-falco
  namespace: adhar-system
  labels:
    app.kubernetes.io/part-of: adhar-kyverno-policies
spec:
  exceptions:
  - policyName: disallow-host-path
    ruleNames:
    - host-path
    - autogen-host-path
  - policyName: disallow-privileged-containers
    ruleNames:
    - privileged-containers
    - autogen-privileged-containers
  match:
    any:
    - resources:
        kinds: [Pod, DaemonSet, Deployment, ReplicaSet, StatefulSet]
        namespaces: [adhar-system]
        names:
        - falco
        - "falco-*"
---
