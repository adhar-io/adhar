# Platform ClusterIssuers (production edge, roadmap P1.3).
#
# adhar-selfsigned is the default issuer the cloud Gateway variant references —
# it works with zero external configuration (same trust posture as the local
# self-signed bootstrap certificate).
#
# The Let's Encrypt issuers use the HTTP-01 solver through the platform
# Gateway. HTTP-01 cannot issue wildcard certificates: use these for
# per-application hostnames, or add a DNS-01 solver with your DNS provider's
# credentials (and point the Gateway's cert-manager.io/cluster-issuer
# annotation at that issuer) for the platform wildcard certificate.
#
# Override the ACME registration email per environment; the default is a
# placeholder that should be replaced with globalSettings.email.
#
# The sync options let ArgoCD apply these CRs in the same sync as the
# cert-manager CRDs they depend on.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: adhar-selfsigned
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: adhar-letsencrypt-staging
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: platform@adhar.example
    privateKeySecretRef:
      name: adhar-letsencrypt-staging-account
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - kind: Gateway
                name: adhar-gateway
                namespace: adhar-system
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: adhar-letsencrypt-prod
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: platform@adhar.example
    privateKeySecretRef:
      name: adhar-letsencrypt-prod-account
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - kind: Gateway
                name: adhar-gateway
                namespace: adhar-system
