# cert-manager Prometheus ServiceMonitor
# Not emitted by the chart (prometheus.servicemonitor.enabled left default off).
# The cert-manager controller exposes certmanager_* metrics on the "cert-manager"
# Service, port 9402 at /metrics. The chart names that Service port
# `http-metrics`; this monitor used to ask for `tcp-prometheus-servicemonitor`
# (the name only the chart's OWN ServiceMonitor template uses), matched no port,
# and so produced no target at all — every cert panel on the platform dashboard
# and the cert-manager dashboard read "No data" (found 2026-10-23).
# Prometheus serviceMonitorSelector is empty ({}), so this is scraped as-is and
# feeds the cert-manager Grafana dashboard (gnetId 11001).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  name: cert-manager
  namespace: adhar-system
  labels:
    app.kubernetes.io/name: cert-manager
    app.kubernetes.io/instance: cert-manager
    app.kubernetes.io/component: controller
    app.kubernetes.io/managed-by: adhar
spec:
  jobLabel: app.kubernetes.io/name
  namespaceSelector:
    matchNames:
      - adhar-system
  selector:
    matchLabels:
      app.kubernetes.io/name: cert-manager
      app.kubernetes.io/instance: cert-manager
      app.kubernetes.io/component: controller
  endpoints:
    - port: http-metrics
      path: /metrics
      interval: 60s
      scrapeTimeout: 30s
      honorLabels: true
