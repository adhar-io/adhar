# Trivy Operator Helm Chart Values
# Continuously scans workloads (vulnerabilities, misconfig, secrets) and writes
# results to CRDs. No web UI / ingress.

operator:
  # The chart reads the limit HERE. It used to sit under a `trivyOperator:` key
  # the chart has never had, so the operator ran its default of 10 concurrent
  # scan jobs — ten Trivy processes, each pulling the ~100 MB vulnerability DB,
  # against the ~90 images a platform runs on a cluster still settling.
  scanJobsConcurrentLimit: 3
  # One Trivy server (a StatefulSet with a cached DB) answers every scan job,
  # instead of each job downloading and unpacking the DB itself. The chart
  # switches scanning to ClientServer mode when this is on.
  builtInTrivyServer: true
  # SbomReports are what the console's license inventory reads (and what
  # ClusterVulnerabilityReports are built from). The chart's default, stated
  # so nobody turns it off thinking it is optional.
  sbomGenerationEnabled: true
  scannerReportTTL: "24h"
  # Pinned explicitly rather than relying on the release namespace: a stale
  # "trivy-system" value survived the adhar-system consolidation here because it
  # renders as an env var value, not a `namespace:` field, and the operator then
  # crashlooped looking for its config and leader-election lease.
  namespace: adhar-system

trivyOperator:
  # Completed CI pods are not workloads. A Tekton TaskRun pod (and a kpack
  # build pod) has no built-in controller, so the operator scanned it as a bare
  # Pod -- every init and step container, each into its own VulnerabilityReport
  # AND SbomReport -- and kept those reports for as long as the finished pod
  # existed. On 2026-11-03 (DigitalOcean, 8 apps in CI) that was 257 of 700
  # VulnerabilityReports and 236 of 673 SbomReports, every one for a
  # Succeeded/Failed pod. SBOM + vulnerability reports were 265 of the 331 MiB
  # the API server stores, and kube-apiserver keeps each custom resource decoded
  # in its watch cache at ~7x its JSON size: ~2 GiB of its 4.3 GiB live heap,
  # on a control plane at 108% memory. The app image a pipeline builds is still
  # scanned twice: by the pipeline's own Trivy gate and, once deployed, here as
  # a ReplicaSet/StatefulSet. Matched by label KEY on the scanned resource.
  skipResourceByLabels: "tekton.dev/taskRun,kpack.io/build"

# The operator reads the `trivy-operator` ConfigMap -- where trivyOperator.*
# lands -- once, at startup, and the chart checksums only the OTHER ConfigMap
# (trivy-operator-config), so a change here would sit unread until the pod
# happened to restart. This is the sha256 of that ConfigMap's data (canonical
# JSON); TestTrivyOperatorSkipsCIPodsAndRollsWhenItsConfigMapChanges prints the
# new value whenever the rendered ConfigMap changes, and the pod rolls with it.
podAnnotations:
  adhar.io/operator-configmap-sha256: "549b0cc16f535db2127ae79cf6ec420aa5fdf8e66fa8212398f23f7f257eb03f"

# The node-collector Job (CIS / NSA node checks) runs once per node, the
# control plane included — and the control plane is tainted NoSchedule. With
# no toleration the master's collector sat Pending until the operator timed it
# out and created another, forever (2026-10-22), so the master — the node whose
# kubelet/apiserver file permissions matter most — was never assessed.
nodeCollector:
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

# The operator itself. The chart ships no resources, so it took the namespace's
# 64Mi default request while its informer caches (every workload, every report
# CRD) held 1.1 GiB at steady state and peaked at 1.7 GiB over three hours
# (2026-10-22) — the second-largest unaccounted process on nodes the kubelet was
# evicting pods from. No limit: a capped informer cache OOM-loops.
resources:
  requests: {cpu: 50m, memory: 1280Mi}

trivy:
  # The runtime ignore file is Trivy's YAML format (ids scoped by purl/path,
  # with expiry), not the legacy one-id-per-line .trivyignore. Its CONTENT
  # (trivy.ignoreFile) is written by manifests/waiver-sync.yaml from the
  # platform-wide scan waivers, never from these values.
  ignoreFileName: ".trivyignore.yaml"
  # Each scan job is a Trivy CLIENT now (the server holds the DB), so it needs
  # little; the server gets the memory to hold the unpacked DB.
  resources:
    requests: {cpu: 50m, memory: 128M}
    limits: {cpu: 500m, memory: 512M}
  server:
    # Measured 50 MiB idle, 204 MiB peak over three hours with scans running
    # (2026-10-22); the 1Gi limit still covers a DB update.
    # cpu request 100m -> 50m: measured max 1m on the AWS cluster
    # (2026-10-24), the request was 100x use; scans burst to the 1-CPU limit.
    resources:
      requests: {cpu: 50m, memory: 256Mi}
      limits: {cpu: "1", memory: 1Gi}
