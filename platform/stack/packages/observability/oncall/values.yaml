# Adhar overrides for grafana/oncall.
# External access is provided via the Cilium Gateway API HTTPRoute in
# manifests/httproute.yaml, so the chart's bundled nginx Ingress, ingress-nginx
# controller subchart and cert-manager subchart are all disabled. cert-manager
# is already installed by the Adhar security stack.
ingress:
  enabled: false

ingress-nginx:
  enabled: false

cert-manager:
  enabled: false
# Recreate: this Deployment owns a ReadWriteOnce volume, so a RollingUpdate can
# never schedule its replacement (the volume stays attached to the old pod's
# node) and every change parked the new pod in ContainerCreating for good.
grafana:
  deploymentStrategy:
    type: Recreate
