# HUBBLE RELAY + UI — moved off the bootstrap Cilium critical path so their
# images no longer block the 'Cilium & Gateway' phase of `adhar up`. The
# agent's Hubble server stays in the bootstrap install; relay connects to
# hubble-peer.adhar-system. Regenerate with generate-manifests.sh.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hubble-relay
  namespace: adhar-system
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hubble-ui
  namespace: adhar-system
---
apiVersion: v1
kind: Secret
metadata:
  name: hubble-relay-client-certs
  namespace: adhar-system
  labels:
    cilium.io/helm-template-non-idempotent: 'true'
  annotations: null
type: kubernetes.io/tls
data:
  ca.crt: 
  tls.crt: 
  tls.key: 
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hubble-relay-config
  namespace: adhar-system
data:
  config.yaml: "cluster-name: adhar-mgmt\npeer-service: \"hubble-peer.adhar-system.svc.cluster.local.:443\"\
    \nlisten-address: :4245\ngops: true\ngops-port: \"9893\"\nretry-timeout: \nsort-buffer-len-max:\
    \ \nsort-buffer-drain-timeout: \ntls-hubble-client-cert-file: /var/lib/hubble-relay/tls/client.crt\n\
    tls-hubble-client-key-file: /var/lib/hubble-relay/tls/client.key\ntls-hubble-server-ca-files:\
    \ /var/lib/hubble-relay/tls/hubble-server-ca.crt\n\ndisable-server-tls: true\n"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hubble-ui-nginx
  namespace: adhar-system
data:
  nginx.conf: "server {\n    listen       8081;\n    listen       [::]:8081;\n   \
    \ server_name  localhost;\n    root /app;\n    index index.html;\n    client_max_body_size\
    \ 1G;\n\n    location / {\n        proxy_set_header Host $host;\n        proxy_set_header\
    \ X-Real-IP $remote_addr;\n\n        location /api {\n            proxy_http_version\
    \ 1.1;\n            proxy_pass_request_headers on;\n            proxy_pass http://127.0.0.1:8090;\n\
    \        }\n        location / {\n            if ($http_user_agent ~* \"kube-probe\"\
    ) { access_log off; }\n            # double `/index.html` is required here\n \
    \           try_files $uri $uri/ /index.html /index.html;\n        }\n\n     \
    \   # Liveness probe\n        location /healthz {\n            access_log off;\n\
    \            add_header Content-Type text/plain;\n            return 200 'ok';\n\
    \        }\n    }\n}"
---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: hubble-ui
  labels:
    app.kubernetes.io/part-of: cilium
    helm.sh/chart: cilium-1.20.0
rules:
- apiGroups:
  - ''
  resources:
  - componentstatuses
  - namespaces
  - nodes
  - pods
  - services
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apiextensions.k8s.io
  resources:
  - customresourcedefinitions
  verbs:
  - get
  - list
  - watch
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: hubble-ui
  labels:
    app.kubernetes.io/part-of: cilium
    helm.sh/chart: cilium-1.20.0
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hubble-ui
subjects:
- kind: ServiceAccount
  name: hubble-ui
  namespace: adhar-system
---
kind: Service
apiVersion: v1
metadata:
  name: hubble-relay
  namespace: adhar-system
  annotations: null
  labels:
    k8s-app: hubble-relay
    app.kubernetes.io/name: hubble-relay
    app.kubernetes.io/part-of: cilium
    helm.sh/chart: cilium-1.20.0
spec:
  type: ClusterIP
  selector:
    k8s-app: hubble-relay
  ports:
  - protocol: TCP
    port: 80
    targetPort: grpc
---
kind: Service
apiVersion: v1
metadata:
  name: hubble-ui
  namespace: adhar-system
  labels:
    k8s-app: hubble-ui
    app.kubernetes.io/name: hubble-ui
    app.kubernetes.io/part-of: cilium
    helm.sh/chart: cilium-1.20.0
spec:
  type: ClusterIP
  selector:
    k8s-app: hubble-ui
  ports:
  - name: http
    port: 80
    targetPort: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hubble-relay
  namespace: adhar-system
  labels:
    k8s-app: hubble-relay
    app.kubernetes.io/name: hubble-relay
    app.kubernetes.io/part-of: cilium
    helm.sh/chart: cilium-1.20.0
spec:
  replicas: 1
  selector:
    matchLabels:
      k8s-app: hubble-relay
  strategy:
    rollingUpdate:
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      annotations: null
      labels:
        k8s-app: hubble-relay
        app.kubernetes.io/name: hubble-relay
        app.kubernetes.io/part-of: cilium
        helm.sh/chart: cilium-1.20.0
    spec:
      securityContext:
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: hubble-relay
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 65532
          runAsNonRoot: true
          runAsUser: 65532
          seccompProfile:
            type: RuntimeDefault
        image: quay.io/cilium/hubble-relay:v1.20.0
        imagePullPolicy: IfNotPresent
        command:
        - hubble-relay
        args:
        - serve
        ports:
        - name: grpc
          containerPort: 4245
        readinessProbe:
          grpc:
            port: 4222
          timeoutSeconds: 3
        livenessProbe:
          grpc:
            port: 4222
          timeoutSeconds: 10
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 12
        startupProbe:
          grpc:
            port: 4222
          initialDelaySeconds: 10
          failureThreshold: 20
          periodSeconds: 3
        volumeMounts:
        - name: tmp-volume
          mountPath: /tmp
        - name: config
          mountPath: /etc/hubble-relay
          readOnly: true
        - name: tls
          mountPath: /var/lib/hubble-relay/tls
          readOnly: true
        terminationMessagePolicy: FallbackToLogsOnError
      restartPolicy: Always
      priorityClassName: null
      serviceAccountName: hubble-relay
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 1
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                k8s-app: cilium
            topologyKey: kubernetes.io/hostname
      nodeSelector:
        kubernetes.io/os: linux
      volumes:
      - name: tmp-volume
        emptyDir: {}
      - name: config
        configMap:
          name: hubble-relay-config
          items:
          - key: config.yaml
            path: config.yaml
      - name: tls
        projected:
          defaultMode: 256
          sources:
          - secret:
              name: hubble-relay-client-certs
              items:
              - key: tls.crt
                path: client.crt
              - key: tls.key
                path: client.key
              - key: ca.crt
                path: hubble-server-ca.crt
---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: hubble-ui
  namespace: adhar-system
  labels:
    k8s-app: hubble-ui
    app.kubernetes.io/name: hubble-ui
    app.kubernetes.io/part-of: cilium
    helm.sh/chart: cilium-1.20.0
spec:
  replicas: 1
  selector:
    matchLabels:
      k8s-app: hubble-ui
  strategy:
    rollingUpdate:
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      annotations: null
      labels:
        k8s-app: hubble-ui
        app.kubernetes.io/name: hubble-ui
        app.kubernetes.io/part-of: cilium
        helm.sh/chart: cilium-1.20.0
    spec:
      securityContext:
        fsGroup: 1001
        runAsGroup: 1001
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      priorityClassName: null
      serviceAccountName: hubble-ui
      automountServiceAccountToken: true
      containers:
      - name: frontend
        image: quay.io/cilium/hubble-ui:v0.13.5
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8081
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
        readinessProbe:
          httpGet:
            path: /
            port: http
        volumeMounts:
        - name: hubble-ui-nginx-conf
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: nginx.conf
        - name: tmp-dir
          mountPath: /tmp
        terminationMessagePolicy: FallbackToLogsOnError
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
      - name: backend
        image: quay.io/cilium/hubble-ui-backend:v0.13.5
        imagePullPolicy: IfNotPresent
        env:
        - name: EVENTS_SERVER_PORT
          value: '8090'
        - name: FLOWS_API_ADDR
          value: hubble-relay:80
        ports:
        - name: grpc
          containerPort: 8090
        volumeMounts: null
        terminationMessagePolicy: FallbackToLogsOnError
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
      nodeSelector:
        kubernetes.io/os: linux
      volumes:
      - configMap:
          defaultMode: 420
          name: hubble-ui-nginx
        name: hubble-ui-nginx-conf
      - name: tmp-dir
        emptyDir:
          sizeLimit: 256Mi
