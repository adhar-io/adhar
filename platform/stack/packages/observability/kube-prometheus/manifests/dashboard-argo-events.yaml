# Grafana dashboard for Argo Events (application/argo-events). Fed by the
# PodMonitors in application/argo-events/manifests/podmonitor.yaml: the
# controller-manager (job argo-events-controller-manager) and the EventSource /
# Sensor pods it creates (job eventsource-controller / sensor-controller). Hand
# written (no upstream dashboard on grafana.com); datasource is variable-driven.
apiVersion: v1
kind: ConfigMap
metadata:
  name: adhar-dashboard-argo-events
  namespace: adhar-system
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: adhar-observability
  annotations:
    grafana_folder: "Platform"
data:
  argo-events.json: |
