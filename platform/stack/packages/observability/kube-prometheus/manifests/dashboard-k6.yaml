# Grafana dashboard for the k6 Operator (application/k6). Fed by
# application/k6/manifests/servicemonitor.yaml (job k6-operator,
# controller-runtime metrics on the chart's metrics Service). Test-run panels
# use kube-state-metrics (k6 runner pods carry the label app=k6); k6 result
# metrics themselves flow to Prometheus via remote write from the TestRun spec.
# Hand written (no upstream operator dashboard on grafana.com); datasource is
# variable-driven.
apiVersion: v1
kind: ConfigMap
metadata:
  name: adhar-dashboard-k6
  namespace: adhar-system
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: adhar-observability
  annotations:
    grafana_folder: "Platform"
data:
  k6.json: |
