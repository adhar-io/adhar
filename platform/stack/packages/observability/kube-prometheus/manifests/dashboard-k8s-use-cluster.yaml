apiVersion: v1
kind: ConfigMap
metadata:
  name: adhar-dashboard-k8s-use-cluster
  namespace: adhar-system
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: adhar-observability
  annotations:
    grafana_folder: "Kubernetes"
data:
  k8s-use-cluster.json: |
    {
      "graphTooltip": 1,
      "panels": [
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "panels": [],
          "title": "CPU",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "fillOpacity": 100,
                "showPoints": "never",
                "stacking": {
                  "mode": "normal"
                }
              },
              "unit": "percentunit"
            }
          },
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 0,
            "y": 1
          },
          "id": 2,
          "options": {
            "legend": {
              "showLegend": false
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "pluginVersion": "v13.0.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "expr": "((\n  instance:node_cpu_utilisation:rate5m{job=\"node-exporter\", cluster=~\"$cluster\"}\n  *\n  instance:node_num_cpu:sum{job=\"node-exporter\", cluster=~\"$cluster\"}\n) != 0 )\n/ scalar(sum(instance:node_num_cpu:sum{job=\"node-exporter\", cluster=~\"$cluster\"}))\n",
              "legendFormat": "{{ instance }}"
            }
          ],
          "title": "CPU Utilisation",
          "type": "timeseries",
          "description": "CPU actually used as a share of allocatable CPU."
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "fillOpacity": 100,
                "showPoints": "never",
                "stacking": {
                  "mode": "normal"
                }
              },
              "unit": "percentunit"
            }
          },
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 12,
            "y": 1
          },
          "id": 3,
          "options": {
            "legend": {
              "showLegend": false
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "pluginVersion": "v13.0.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "expr": "(\n  instance:node_load1_per_cpu:ratio{job=\"node-exporter\", cluster=~\"$cluster\"}\n  / scalar(count(instance:node_load1_per_cpu:ratio{job=\"node-exporter\", cluster=~\"$cluster\"}))\n)  != 0\n",
              "legendFormat": "{{ instance }}"
            }
          ],
          "title": "CPU Saturation (Load1 per CPU)",
          "type": "timeseries",
          "description": "CPU Saturation (Load1 per CPU) (kubernetes-mixin). Source: instance:node_load1_per_cpu:ratio."
        },
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 8
          },
          "id": 4,
          "panels": [],
          "title": "Memory",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "fillOpacity": 100,
                "showPoints": "never",
                "stacking": {
                  "mode": "normal"
                }
              },
              "unit": "percentunit"
            }
          },
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 0,
            "y": 9
          },
          "id": 5,
          "options": {
            "legend": {
              "showLegend": false
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "pluginVersion": "v13.0.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "expr": "(\n  instance:node_memory_utilisation:ratio{job=\"node-exporter\", cluster=~\"$cluster\"}\n  / scalar(count(instance:node_memory_utilisation:ratio{job=\"node-exporter\", cluster=~\"$cluster\"}))\n) != 0\n",
              "legendFormat": "{{ instance }}"
            }
          ],
          "title": "Memory Utilisation",
          "type": "timeseries",
          "description": "Memory actually used as a share of allocatable memory."
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "fillOpacity": 100,
                "showPoints": "never",
                "stacking": {
                  "mode": "normal"
                }
              },
              "unit": "rds"
            }
          },
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 12,
            "y": 9
          },
          "id": 6,
          "options": {
            "legend": {
              "showLegend": false
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "pluginVersion": "v13.0.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "expr": "instance:node_vmstat_pgmajfault:rate5m{job=\"node-exporter\", cluster=~\"$cluster\"}",
              "legendFormat": "{{ instance }}"
            }
          ],
          "title": "Memory Saturation (Major Page Faults)",
          "type": "timeseries",
          "description": "Memory Saturation (Major Page Faults) (kubernetes-mixin). Source: instance:node_vmstat_pgmajfault:rate5m."
        },
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 16
          },
          "id": 7,
          "panels": [],
          "title": "Network",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "fillOpacity": 100,
                "showPoints": "never",
                "stacking": {
                  "mode": "normal"
                }
              },
              "unit": "Bps"
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byRegexp",
                  "options": "/Transmit/"
                },
                "properties": [
                  {
                    "id": "custom.transform",
                    "value": "negative-Y"
                  }
                ]
              }
            ]
          },
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 0,
            "y": 17
          },
          "id": 8,
          "options": {
            "legend": {
              "showLegend": false
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "pluginVersion": "v13.0.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "expr": "instance:node_network_receive_bytes_excluding_lo:rate5m{job=\"node-exporter\", cluster=~\"$cluster\"} != 0",
              "legendFormat": "{{ instance }} Receive"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "expr": "instance:node_network_transmit_bytes_excluding_lo:rate5m{job=\"node-exporter\", cluster=~\"$cluster\"} != 0",
              "legendFormat": "{{ instance }} Transmit"
            }
          ],
          "title": "Network Utilisation (Bytes Receive/Transmit)",
          "type": "timeseries",
          "description": "Network Utilisation (Bytes Receive/Transmit) (kubernetes-mixin). Source: instance:node_network_receive_bytes_excluding_lo:rate5m, instance:node_network_transmit_bytes_excluding_lo:rate5m."
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "fillOpacity": 100,
                "showPoints": "never",
                "stacking": {
                  "mode": "normal"
                }
              },
              "unit": "Bps"
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byRegexp",
                  "options": "/Transmit/"
                },
                "properties": [
                  {
                    "id": "custom.transform",
                    "value": "negative-Y"
                  }
                ]
              }
            ]
          },
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 12,
            "y": 17
          },
          "id": 9,
          "options": {
            "legend": {
              "showLegend": false
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "pluginVersion": "v13.0.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "expr": "instance:node_network_receive_drop_excluding_lo:rate5m{job=\"node-exporter\", cluster=~\"$cluster\"} != 0",
              "legendFormat": "{{ instance }} Receive"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "expr": "instance:node_network_transmit_drop_excluding_lo:rate5m{job=\"node-exporter\", cluster=~\"$cluster\"} != 0",
              "legendFormat": "{{ instance }} Transmit"
            }
          ],
          "title": "Network Saturation (Drops Receive/Transmit)",
          "type": "timeseries",
          "description": "Network Saturation (Drops Receive/Transmit) (kubernetes-mixin). Source: instance:node_network_receive_drop_excluding_lo:rate5m, instance:node_network_transmit_drop_excluding_lo:rate5m."
        },
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 24
          },
          "id": 10,
          "panels": [],
          "title": "Disk IO",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "fillOpacity": 100,
                "showPoints": "never",
                "stacking": {
                  "mode": "normal"
                }
              },
              "unit": "percentunit"
            }
          },
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 0,
            "y": 25
          },
          "id": 11,
          "options": {
            "legend": {
              "showLegend": false
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "pluginVersion": "v13.0.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "expr": "instance_device:node_disk_io_time_seconds:rate5m{job=\"node-exporter\", cluster=~\"$cluster\"}\n/ scalar(count(instance_device:node_disk_io_time_seconds:rate5m{job=\"node-exporter\", cluster=~\"$cluster\"}))\n",
              "legendFormat": "{{ instance }} {{device}}"
            }
          ],
          "title": "Disk IO Utilisation",
          "type": "timeseries",
          "description": "Disk IO Utilisation (kubernetes-mixin). Source: instance_device:node_disk_io_time_seconds:rate5m."
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "fillOpacity": 100,
                "showPoints": "never",
                "stacking": {
                  "mode": "normal"
                }
              },
              "unit": "percentunit"
            }
          },
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 12,
            "y": 25
          },
          "id": 12,
          "options": {
            "legend": {
              "showLegend": false
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "pluginVersion": "v13.0.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "expr": "instance_device:node_disk_io_time_weighted_seconds:rate5m{job=\"node-exporter\", cluster=~\"$cluster\"}\n/ scalar(count(instance_device:node_disk_io_time_weighted_seconds:rate5m{job=\"node-exporter\", cluster=~\"$cluster\"}))\n",
              "legendFormat": "{{ instance }} {{device}}"
            }
          ],
          "title": "Disk IO Saturation",
          "type": "timeseries",
          "description": "Disk IO Saturation (kubernetes-mixin). Source: instance_device:node_disk_io_time_weighted_seconds:rate5m."
        },
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 34
          },
          "id": 13,
          "panels": [],
          "title": "Disk Space",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "fillOpacity": 100,
                "showPoints": "never",
                "stacking": {
                  "mode": "normal"
                }
              },
              "unit": "percentunit"
            }
          },
          "gridPos": {
            "h": 7,
            "w": 24,
            "x": 0,
            "y": 35
          },
          "id": 14,
          "options": {
            "legend": {
              "showLegend": false
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "pluginVersion": "v13.0.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "expr": "sum without (device) (\n  max without (fstype, mountpoint) ((\n    node_filesystem_size_bytes{job=\"node-exporter\", fstype!=\"\", mountpoint!=\"\", cluster=~\"$cluster\"}\n    -\n    node_filesystem_avail_bytes{job=\"node-exporter\", fstype!=\"\", mountpoint!=\"\", cluster=~\"$cluster\"}\n  ) != 0)\n)\n/ scalar(sum(max without (fstype, mountpoint) (node_filesystem_size_bytes{job=\"node-exporter\", fstype!=\"\", mountpoint!=\"\", cluster=~\"$cluster\"})))\n",
              "legendFormat": "{{ instance }}"
            }
          ],
          "title": "Disk Space Utilisation",
          "type": "timeseries",
          "description": "Disk Space Utilisation (kubernetes-mixin). Source: node_filesystem_size_bytes, node_filesystem_avail_bytes."
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": [
        "node-exporter-mixin",
        "adhar",
        "adhar-kubernetes",
        "kubernetes"
      ],
      "templating": {
        "list": [
          {
            "name": "datasource",
            "query": "prometheus",
            "type": "datasource"
          },
          {
            "allValue": ".*",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "hide": 2,
            "includeAll": true,
            "name": "cluster",
            "query": "label_values(node_time_seconds, cluster)",
            "refresh": 2,
            "sort": 1,
            "type": "query"
          }
        ]
      },
      "time": {
        "from": "now-1h",
        "to": "now"
      },
