# Sveltos Grafana dashboard (hand-written; no upstream dashboard exists).
# Built on projectsveltos_* metrics (reconcile duration/operations/outcome,
# consecutive failures, drifts, matching clusters, outdated Helm charts) and
# controller-runtime metrics scraped by core/sveltos/manifests/podmonitor.yaml
# (job = the pod's control-plane label). Panels use the default Prometheus
# datasource (uid "prometheus").
apiVersion: v1
kind: ConfigMap
metadata:
  name: adhar-dashboard-sveltos
  namespace: adhar-system
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: adhar-observability
  annotations:
    grafana_folder: "Platform"
data:
  sveltos.json: |
    {
      "uid": "adhar-sveltos",
      "title": "Adhar / Sveltos — Add-on Delivery",
      "tags": [
        "adhar",
        "sveltos",
        "core",
        "multi-cluster"
      ],
      "editable": true,
      "schemaVersion": 39,
      "version": 1,
      "timezone": "",
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "graphTooltip": 1,
      "annotations": {
        "list": []
      },
      "links": [],
      "templating": {
        "list": [
          {
            "name": "controller",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "refresh": 2,
            "query": {
              "query": "label_values(controller_runtime_reconcile_total{namespace=\"adhar-system\", job=~\"addon-controller|access-manager|sc-manager|hc-manager|event-manager|classifier|shard-controller\"}, job)",
              "refId": "controller"
            },
            "sort": 1,
            "includeAll": true,
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "label": "Controller",
            "regex": "",
            "allValue": ".*"
          },
          {
            "name": "cluster_namespace",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "refresh": 2,
            "query": {
              "query": "label_values(projectsveltos_reconcile_operations_total, cluster_namespace)",
              "refId": "cluster_namespace"
            },
            "sort": 1,
            "includeAll": true,
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "label": "Cluster namespace",
            "regex": "",
            "allValue": ".*"
          },
          {
            "name": "cluster_name",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "refresh": 2,
            "query": {
              "query": "label_values(projectsveltos_reconcile_operations_total{cluster_namespace=~\"$cluster_namespace\"}, cluster_name)",
              "refId": "cluster_name"
            },
            "sort": 1,
            "includeAll": true,
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "label": "Cluster",
            "regex": "",
            "allValue": ".*"
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Overview — Sveltos (add-on / profile delivery)",
          "collapsed": false,
          "gridPos": {
