# Grafana dashboard for Coder (application/coder). Fed by
# application/coder/manifests/servicemonitor.yaml (job coder-metrics, coderd_*
# metrics on port 2112 — requires CODER_PROMETHEUS_ENABLE=true in the chart
# values). Hand written (no upstream dashboard on grafana.com); datasource is
# variable-driven.
apiVersion: v1
kind: ConfigMap
metadata:
  name: adhar-dashboard-coder
  namespace: adhar-system
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: adhar-observability
  annotations:
    grafana_folder: "Platform"
data:
  coder.json: |
