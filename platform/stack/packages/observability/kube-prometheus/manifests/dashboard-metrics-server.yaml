      "title": "Adhar / metrics-server — Resource Metrics API",
      "tags": [
        "adhar",
        "metrics-server",
        "observability"
      ],
      "editable": true,
      "schemaVersion": 39,
      "version": 1,
      "timezone": "",
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "graphTooltip": 1,
