# metrics-server Grafana dashboard (hand-written; no maintained upstream
# dashboard exists). Built on metrics_server_* (kubelet scrape latency and
# success, storage points, API freshness) and apiserver_* metrics scraped by
# observability/metrics-server/manifests/servicemonitor.yaml
# (job="metrics-server"). Panels use the default Prometheus datasource (uid
# "prometheus").
apiVersion: v1
kind: ConfigMap
metadata:
  name: adhar-dashboard-metrics-server
  namespace: adhar-system
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: adhar-observability
  annotations:
    grafana_folder: "Platform"
data:
  metrics-server.json: |
