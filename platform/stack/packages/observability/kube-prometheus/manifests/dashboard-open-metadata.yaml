# Grafana dashboard for OpenMetadata (data/open-metadata). Fed by
# data/open-metadata/manifests/servicemonitor.yaml (job openmetadata,
# /prometheus on the admin port 8586). Hand written (no upstream dashboard on
# grafana.com); datasource is variable-driven.
apiVersion: v1
kind: ConfigMap
metadata:
  name: adhar-dashboard-open-metadata
  namespace: adhar-system
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: adhar-observability
  annotations:
    grafana_folder: "Platform"
data:
  open-metadata.json: |
