apiVersion: v1
kind: ConfigMap
metadata:
  name: adhar-dashboard-kafka-cluster
  namespace: adhar-system
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: adhar-observability
  annotations:
    grafana_folder: "Data"
data:
  kafka-cluster.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "description": "Strimzi Kafka (KRaft) brokers: the platform's shared adhar-kafka and every composed application cluster. Broker and controller health, partitions and replication, throughput, request latency, storage, JVM and pod resources. Topic-level production and consumer lag are on 'Kafka / Topics & Consumer Lag'.",
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [
        {
          "title": "Data services",
          "type": "dashboards",
          "tags": [
            "adhar-data"
          ],
          "asDropdown": true,
          "includeVars": false,
          "keepTime": true,
          "targetBlank": false,
          "icon": "external link"
        },
        {
          "title": "Kubernetes",
          "type": "dashboards",
          "tags": [
            "adhar-kubernetes"
          ],
          "asDropdown": true,
          "includeVars": false,
          "keepTime": true,
          "targetBlank": false,
          "icon": "external link"
        },
        {
          "title": "Kafka topics & consumer lag",
          "type": "link",
          "url": "/d/jwPKIsniz",
          "asDropdown": false,
          "includeVars": false,
          "keepTime": true,
          "targetBlank": false,
          "icon": "dashboard",
          "tags": []
        },
        {
          "title": "Kubernetes overview",
          "type": "link",
          "url": "/d/adhar-k8s-overview",
          "asDropdown": false,
          "includeVars": false,
          "keepTime": true,
          "targetBlank": false,
          "icon": "dashboard",
          "tags": []
        }
      ],
      "liveNow": false,
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Health at a glance",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "type": "stat",
          "title": "Brokers running",
          "description": "Brokers whose BrokerState is RUNNING (3), out of all brokers reporting metrics.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "count(max by (namespace, strimzi_io_cluster, pod) (kafka_server_kafkaserver_brokerstate{namespace=~\"$namespace\", strimzi_io_cluster=~\"$cluster\", pod=~\"$broker\"}) == 3) or vector(0)",
              "legendFormat": "running",
              "range": true,
              "instant": false,
              "editorMode": "code",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "count(max by (namespace, strimzi_io_cluster, pod) (kafka_server_kafkaserver_brokerstate{namespace=~\"$namespace\", strimzi_io_cluster=~\"$cluster\", pod=~\"$broker\"}))",
              "legendFormat": "total",
              "range": true,
              "instant": false,
              "editorMode": "code",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              },
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center",
            "textMode": "value_and_name",
            "orientation": "auto",
            "wideLayout": true,
            "showPercentChange": false,
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "id": 2,
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 0,
            "y": 1
          }
        },
        {
          "type": "stat",
          "title": "Clusters without controller",
          "description": "Kafka clusters where no broker reports itself the active KRaft controller. Must be 0 — without a controller no leader elections or topic changes happen.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "count(sum by (namespace, strimzi_io_cluster) (max by (namespace, strimzi_io_cluster, pod) (kafka_controller_kafkacontroller_activecontrollercount{namespace=~\"$namespace\", strimzi_io_cluster=~\"$cluster\", pod=~\"$broker\"})) == 0) or vector(0)",
              "legendFormat": "",
              "range": true,
              "instant": false,
              "editorMode": "code",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "textMode": "auto",
            "orientation": "auto",
            "wideLayout": true,
            "showPercentChange": false,
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "id": 3,
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 3,
            "y": 1
          }
        },
        {
          "type": "stat",
          "title": "Offline partitions",
          "description": "Partitions with no live leader — unavailable for produce and consume.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(max by (namespace, strimzi_io_cluster) (max by (namespace, strimzi_io_cluster, pod) (kafka_controller_kafkacontroller_offlinepartitionscount{namespace=~\"$namespace\", strimzi_io_cluster=~\"$cluster\", pod=~\"$broker\"}))) or vector(0)",
              "legendFormat": "",
              "range": true,
              "instant": false,
              "editorMode": "code",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "textMode": "auto",
            "orientation": "auto",
            "wideLayout": true,
            "showPercentChange": false,
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "id": 4,
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 6,
            "y": 1
          }
        },
        {
          "type": "stat",
          "title": "Under-replicated",
          "description": "Partitions whose ISR is smaller than the replica set. A broker is down, slow or out of disk.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(max by (namespace, strimzi_io_cluster, pod) (kafka_server_replicamanager_underreplicatedpartitions{namespace=~\"$namespace\", strimzi_io_cluster=~\"$cluster\", pod=~\"$broker\"})) or vector(0)",
              "legendFormat": "",
              "range": true,
              "instant": false,
              "editorMode": "code",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "textMode": "auto",
            "orientation": "auto",
            "wideLayout": true,
            "showPercentChange": false,
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "id": 5,
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 9,
            "y": 1
          }
        },
        {
          "type": "stat",
          "title": "Under min ISR",
          "description": "Partitions below min.insync.replicas: producers with acks=all are being refused.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(max by (namespace, strimzi_io_cluster, pod) (kafka_server_replicamanager_underminisrpartitioncount{namespace=~\"$namespace\", strimzi_io_cluster=~\"$cluster\", pod=~\"$broker\"})) or vector(0)",
              "legendFormat": "",
              "range": true,
              "instant": false,
              "editorMode": "code",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "textMode": "auto",
            "orientation": "auto",
            "wideLayout": true,
            "showPercentChange": false,
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "id": 6,
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 12,
            "y": 1
          }
        },
        {
          "type": "stat",
          "title": "Fenced brokers",
          "description": "Brokers the controller has fenced (missed heartbeats).",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(max by (namespace, strimzi_io_cluster) (max by (namespace, strimzi_io_cluster, pod) (kafka_controller_kafkacontroller_fencedbrokercount{namespace=~\"$namespace\", strimzi_io_cluster=~\"$cluster\", pod=~\"$broker\"}))) or vector(0)",
              "legendFormat": "",
              "range": true,
              "instant": false,
              "editorMode": "code",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "textMode": "auto",
            "orientation": "auto",
            "wideLayout": true,
            "showPercentChange": false,
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "id": 7,
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 15,
            "y": 1
          }
        },
        {
          "type": "stat",
          "title": "Topics / partitions",
          "description": "Topics and partitions known to the controller (all clusters in the selection).",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(max by (namespace, strimzi_io_cluster) (max by (namespace, strimzi_io_cluster, pod) (kafka_controller_kafkacontroller_globaltopiccount{namespace=~\"$namespace\", strimzi_io_cluster=~\"$cluster\", pod=~\"$broker\"})))",
              "legendFormat": "topics",
              "range": true,
              "instant": false,
              "editorMode": "code",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(max by (namespace, strimzi_io_cluster) (max by (namespace, strimzi_io_cluster, pod) (kafka_controller_kafkacontroller_globalpartitioncount{namespace=~\"$namespace\", strimzi_io_cluster=~\"$cluster\", pod=~\"$broker\"})))",
              "legendFormat": "partitions",
              "range": true,
              "instant": false,
              "editorMode": "code",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              },
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center",
            "textMode": "value_and_name",
            "orientation": "auto",
            "wideLayout": true,
            "showPercentChange": false,
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "id": 8,
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 18,
            "y": 1
          }
        },
        {
          "type": "stat",
          "title": "Messages in / s",
          "description": "Messages produced per second across the selected brokers.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(max by (namespace, strimzi_io_cluster, pod) (rate(kafka_server_brokertopicmetrics_messagesin_total{namespace=~\"$namespace\", strimzi_io_cluster=~\"$cluster\", pod=~\"$broker\", topic=\"\"}[$__rate_interval])))",
              "legendFormat": "",
              "range": true,
              "instant": false,
              "editorMode": "code",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              },
              "mappings": [],
              "decimals": 1
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "center",
            "textMode": "auto",
            "orientation": "auto",
            "wideLayout": true,
            "showPercentChange": false,
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "id": 9,
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 21,
            "y": 1
          }
        },
        {
          "type": "table",
          "title": "Brokers",
          "description": "One row per broker. 'Controller' is the active KRaft controller. Heap % is used / max heap.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max by (namespace, strimzi_io_cluster, pod) (kafka_server_kafkaserver_brokerstate{namespace=~\"$namespace\", strimzi_io_cluster=~\"$cluster\", pod=~\"$broker\"})",
              "legendFormat": "",
              "range": false,
              "instant": true,
              "editorMode": "code",
              "format": "table",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max by (namespace, strimzi_io_cluster, pod) (kafka_controller_kafkacontroller_activecontrollercount{namespace=~\"$namespace\", strimzi_io_cluster=~\"$cluster\", pod=~\"$broker\"})",
              "legendFormat": "",
              "range": false,
              "instant": true,
              "editorMode": "code",
              "format": "table",
              "refId": "B"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max by (namespace, strimzi_io_cluster, pod) (kafka_server_replicamanager_partitioncount{namespace=~\"$namespace\", strimzi_io_cluster=~\"$cluster\", pod=~\"$broker\"})",
              "legendFormat": "",
              "range": false,
              "instant": true,
              "editorMode": "code",
              "format": "table",
              "refId": "C"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max by (namespace, strimzi_io_cluster, pod) (kafka_server_replicamanager_leadercount{namespace=~\"$namespace\", strimzi_io_cluster=~\"$cluster\", pod=~\"$broker\"})",
              "legendFormat": "",
              "range": false,
              "instant": true,
              "editorMode": "code",
              "format": "table",
              "refId": "D"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max by (namespace, strimzi_io_cluster, pod) (kafka_server_replicamanager_underreplicatedpartitions{namespace=~\"$namespace\", strimzi_io_cluster=~\"$cluster\", pod=~\"$broker\"})",
              "legendFormat": "",
              "range": false,
              "instant": true,
              "editorMode": "code",
              "format": "table",
              "refId": "E"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max by (namespace, strimzi_io_cluster, pod) (kafka_log_logmanager_offlinelogdirectorycount{namespace=~\"$namespace\", strimzi_io_cluster=~\"$cluster\", pod=~\"$broker\"})",
              "legendFormat": "",
              "range": false,
              "instant": true,
              "editorMode": "code",
              "format": "table",
              "refId": "F"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max by (namespace, strimzi_io_cluster, pod) (rate(kafka_server_brokertopicmetrics_messagesin_total{namespace=~\"$namespace\", strimzi_io_cluster=~\"$cluster\", pod=~\"$broker\", topic=\"\"}[5m]))",
              "legendFormat": "",
              "range": false,
              "instant": true,
              "editorMode": "code",
              "format": "table",
              "refId": "G"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max by (namespace, strimzi_io_cluster, pod) (rate(kafka_server_brokertopicmetrics_bytesin_total{namespace=~\"$namespace\", strimzi_io_cluster=~\"$cluster\", pod=~\"$broker\", topic=\"\"}[5m]))",
              "legendFormat": "",
              "range": false,
              "instant": true,
              "editorMode": "code",
              "format": "table",
              "refId": "H"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max by (namespace, strimzi_io_cluster, pod) (rate(kafka_server_brokertopicmetrics_bytesout_total{namespace=~\"$namespace\", strimzi_io_cluster=~\"$cluster\", pod=~\"$broker\", topic=\"\"}[5m]))",
              "legendFormat": "",
              "range": false,
              "instant": true,
              "editorMode": "code",
              "format": "table",
              "refId": "I"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "100 * max by (namespace, strimzi_io_cluster, pod) (jvm_memory_used_bytes{namespace=~\"$namespace\", strimzi_io_cluster=~\"$cluster\", pod=~\"$broker\", area=\"heap\"}) / max by (namespace, strimzi_io_cluster, pod) (jvm_memory_max_bytes{namespace=~\"$namespace\", strimzi_io_cluster=~\"$cluster\", pod=~\"$broker\", area=\"heap\"})",
              "legendFormat": "",
              "range": false,
              "instant": true,
              "editorMode": "code",
              "format": "table",
              "refId": "J"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (namespace, pod) (rate(container_cpu_usage_seconds_total{namespace=~\"$namespace\", pod=~\"$broker\", container=\"kafka\"}[5m])) * on (namespace, pod) group_left (strimzi_io_cluster) (0 * max by (namespace, pod, strimzi_io_cluster) (kafka_server_kafkaserver_brokerstate{namespace=~\"$namespace\", strimzi_io_cluster=~\"$cluster\", pod=~\"$broker\"}) + 1)",
              "legendFormat": "",
              "range": false,
              "instant": true,
              "editorMode": "code",
              "format": "table",
              "refId": "K"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max by (namespace, pod) (kube_pod_container_status_restarts_total{job=\"kube-state-metrics\", namespace=~\"$namespace\", pod=~\"$broker\", container=\"kafka\"}) * on (namespace, pod) group_left (strimzi_io_cluster) (0 * max by (namespace, pod, strimzi_io_cluster) (kafka_server_kafkaserver_brokerstate{namespace=~\"$namespace\", strimzi_io_cluster=~\"$cluster\", pod=~\"$broker\"}) + 1)",
              "legendFormat": "",
              "range": false,
              "instant": true,
              "editorMode": "code",
              "format": "table",
              "refId": "L"
            }
          ],
          "transformations": [
            {
