# tf-controller (Terraform / OpenTofu) Grafana dashboard (hand-written; the
# generic Flux2 dashboard, gnetId 16714, only covers Kustomization/HelmRelease
# kinds). Built on the Flux-style gotk_reconcile_condition /
# gotk_reconcile_duration_seconds / gotk_suspend_status metrics (kind=Terraform)
# and controller-runtime metrics scraped by
# infrastructure/terraform/manifests/podmonitor.yaml (job="tf-controller").
# Panels use the default Prometheus datasource (uid "prometheus").
apiVersion: v1
kind: ConfigMap
metadata:
  name: adhar-dashboard-terraform
  namespace: adhar-system
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: adhar-observability
  annotations:
    grafana_folder: "Platform"
data:
  terraform.json: |
    {
      "uid": "adhar-terraform",
      "title": "Adhar / Terraform — tf-controller",
      "tags": [
        "adhar",
        "terraform",
        "opentofu",
        "infrastructure",
        "gitops"
      ],
      "editable": true,
      "schemaVersion": 39,
      "version": 1,
      "timezone": "",
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "graphTooltip": 1,
      "annotations": {
        "list": []
      },
      "links": [],
      "templating": {
        "list": [
          {
            "name": "namespace",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "refresh": 2,
            "query": {
              "query": "label_values(gotk_reconcile_condition{kind=\"Terraform\"}, namespace)",
              "refId": "namespace"
            },
            "sort": 1,
            "includeAll": true,
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "label": "Namespace",
            "regex": "",
            "allValue": ".*"
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Overview — tf-controller (Terraform / OpenTofu GitOps)",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Controller up",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "textMode": "auto",
            "orientation": "auto",
            "wideLayout": true
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(up{job=\"tf-controller\"})",
              "legendFormat": "",
              "refId": "A",
              "range": false,
              "instant": true
            }
          ]
        },
        {
