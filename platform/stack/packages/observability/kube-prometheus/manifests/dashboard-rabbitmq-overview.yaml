        {
          "type": "stat",
          "title": "Nodes",
          "description": "RabbitMQ nodes reporting metrics.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "count(rabbitmq_identity_info{namespace=~\"$namespace\", pod=~\"$pod\", rabbitmq_endpoint!=\"detailed\"}) or vector(0)",
              "legendFormat": "",
              "range": true,
              "instant": false,
              "editorMode": "code",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              },
              "mappings": [],
              "noValue": "not scraped"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center",
            "textMode": "auto",
            "orientation": "auto",
            "wideLayout": true,
            "showPercentChange": false,
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
