            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(rabbitmq_alarms_memory_used_watermark{namespace=~\"$namespace\", pod=~\"$pod\"} + rabbitmq_alarms_free_disk_space_watermark{namespace=~\"$namespace\", pod=~\"$pod\"} + rabbitmq_alarms_file_descriptor_limit{namespace=~\"$namespace\", pod=~\"$pod\"}) or vector(0)",
              "legendFormat": "",
              "range": true,
              "instant": false,
              "editorMode": "code",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "textMode": "auto",
            "orientation": "auto",
            "wideLayout": true,
