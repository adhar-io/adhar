          "asDropdown": true,
          "includeVars": false,
          "keepTime": true,
          "targetBlank": false,
          "icon": "external link"
        },
        {
          "title": "Kubernetes",
          "type": "dashboards",
          "tags": [
            "adhar-kubernetes"
          ],
          "asDropdown": true,
          "includeVars": false,
          "keepTime": true,
          "targetBlank": false,
          "icon": "external link"
        },
        {
          "title": "RabbitMQ streams",
          "type": "link",
          "url": "/d/j7MCpqZ7k",
          "asDropdown": false,
          "includeVars": false,
          "keepTime": true,
          "targetBlank": false,
          "icon": "dashboard",
          "tags": []
