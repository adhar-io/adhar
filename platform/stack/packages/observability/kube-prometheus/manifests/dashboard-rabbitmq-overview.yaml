          "title": "Nodes",
          "description": "One row per node: version, uptime, memory against the high watermark, free disk against the disk limit, file descriptors and Erlang processes.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max by (namespace, pod, rabbitmq_cluster, rabbitmq_node) (rabbitmq_identity_info{namespace=~\"$namespace\", pod=~\"$pod\", rabbitmq_endpoint!=\"detailed\"})",
              "legendFormat": "",
              "range": false,
              "instant": true,
              "editorMode": "code",
              "format": "table",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max by (namespace, pod, rabbitmq_version, erlang_version) (rabbitmq_build_info{namespace=~\"$namespace\", pod=~\"$pod\"})",
              "legendFormat": "",
              "range": false,
              "instant": true,
              "editorMode": "code",
              "format": "table",
              "refId": "B"
