apiVersion: v1
kind: ConfigMap
metadata:
  name: adhar-dashboard-k8s-capacity
  namespace: adhar-system
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: adhar-observability
  annotations:
    grafana_folder: "Kubernetes"
data:
  k8s-capacity.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "description": "Where the cluster's capacity goes. The scheduler places pods by REQUESTS, not by usage, so a cluster can refuse pods while its nodes are mostly idle. This dashboard puts allocatable, requested and used side by side per node, per namespace and per workload, shows the largest pod that still fits, and lists what is pending because nothing fits.",
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [
        {
          "title": "Data services",
          "type": "dashboards",
          "tags": [
            "adhar-data"
          ],
          "asDropdown": true,
          "includeVars": false,
          "keepTime": true,
          "targetBlank": false,
          "icon": "external link"
        },
        {
          "title": "Kubernetes",
          "type": "dashboards",
          "tags": [
            "adhar-kubernetes"
          ],
          "asDropdown": true,
          "includeVars": false,
          "keepTime": true,
          "targetBlank": false,
          "icon": "external link"
        },
        {
          "title": "Cluster overview",
          "type": "link",
          "url": "/d/adhar-k8s-overview",
          "asDropdown": false,
          "includeVars": false,
          "keepTime": true,
          "targetBlank": false,
          "icon": "dashboard",
          "tags": []
        }
      ],
      "liveNow": false,
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Headroom",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "type": "stat",
          "title": "Memory allocatable",
          "description": "Allocatable memory on the selected nodes.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(kube_node_status_allocatable{job=\"kube-state-metrics\", node=~\"$node\", resource=\"memory\"})",
              "legendFormat": "",
              "range": true,
              "instant": false,
              "editorMode": "code",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              },
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center",
            "textMode": "auto",
            "orientation": "auto",
            "wideLayout": true,
            "showPercentChange": false,
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "id": 2,
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 0,
            "y": 1
          }
        },
        {
          "type": "stat",
          "title": "Memory requested",
          "description": "Memory requested by running + pending pods on the selected nodes.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(sum by (node) (kube_pod_container_resource_requests{job=\"kube-state-metrics\", node=~\"$node\", resource=\"memory\"} * on (namespace, pod) group_left () max by (namespace, pod) (kube_pod_status_phase{job=\"kube-state-metrics\", phase=~\"Pending|Running\"} == 1)))",
              "legendFormat": "",
              "range": true,
              "instant": false,
              "editorMode": "code",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              },
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center",
            "textMode": "auto",
            "orientation": "auto",
            "wideLayout": true,
            "showPercentChange": false,
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "id": 3,
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 3,
            "y": 1
          }
        },
        {
          "type": "stat",
          "title": "Memory used",
          "description": "Real working set on the selected nodes.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(container_memory_working_set_bytes{job=\"kubelet\", metrics_path=\"/metrics/cadvisor\", container!=\"\", node=~\"$node\"})",
              "legendFormat": "",
              "range": true,
              "instant": false,
              "editorMode": "code",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              },
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center",
            "textMode": "auto",
            "orientation": "auto",
            "wideLayout": true,
            "showPercentChange": false,
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "id": 4,
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 6,
            "y": 1
          }
        },
        {
          "type": "stat",
          "title": "Largest free memory",
          "description": "Largest unrequested memory on any single schedulable node (control-plane, tainted and cordoned nodes excluded) = the biggest memory request a new pod can have and still be scheduled.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max((sum by (node) (kube_node_status_allocatable{job=\"kube-state-metrics\", node=~\"$node\", resource=\"memory\"}) - (sum by (node) (kube_pod_container_resource_requests{job=\"kube-state-metrics\", node=~\"$node\", resource=\"memory\"} * on (namespace, pod) group_left () max by (namespace, pod) (kube_pod_status_phase{job=\"kube-state-metrics\", phase=~\"Pending|Running\"} == 1)) or sum by (node) (kube_node_status_allocatable{job=\"kube-state-metrics\", node=~\"$node\", resource=\"memory\"}) * 0)) unless on (node) (max by (node) (kube_node_spec_taint{job=\"kube-state-metrics\", effect=~\"NoSchedule|NoExecute\"}) or max by (node) (kube_node_spec_unschedulable{job=\"kube-state-metrics\"} == 1)))",
              "legendFormat": "",
              "range": true,
              "instant": false,
              "editorMode": "code",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "#EAB839",
                    "value": 536870912
                  },
                  {
                    "color": "green",
                    "value": 2147483648
                  }
                ]
              },
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "textMode": "auto",
            "orientation": "auto",
            "wideLayout": true,
            "showPercentChange": false,
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "id": 5,
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 9,
            "y": 1
          }
        },
        {
          "type": "stat",
          "title": "CPU allocatable",
          "description": "Allocatable CPU on the selected nodes.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(kube_node_status_allocatable{job=\"kube-state-metrics\", node=~\"$node\", resource=\"cpu\"})",
              "legendFormat": "",
              "range": true,
              "instant": false,
              "editorMode": "code",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "cores",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              },
              "mappings": [],
              "decimals": 1
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center",
            "textMode": "auto",
            "orientation": "auto",
            "wideLayout": true,
            "showPercentChange": false,
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "id": 6,
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 12,
            "y": 1
          }
        },
        {
          "type": "stat",
          "title": "CPU requested",
          "description": "CPU requested by running + pending pods.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(sum by (node) (kube_pod_container_resource_requests{job=\"kube-state-metrics\", node=~\"$node\", resource=\"cpu\"} * on (namespace, pod) group_left () max by (namespace, pod) (kube_pod_status_phase{job=\"kube-state-metrics\", phase=~\"Pending|Running\"} == 1)))",
              "legendFormat": "",
              "range": true,
              "instant": false,
              "editorMode": "code",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "cores",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              },
              "mappings": [],
              "decimals": 1
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center",
            "textMode": "auto",
            "orientation": "auto",
            "wideLayout": true,
            "showPercentChange": false,
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "id": 7,
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 15,
            "y": 1
          }
        },
        {
          "type": "stat",
          "title": "CPU used",
          "description": "Real CPU usage.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(rate(container_cpu_usage_seconds_total{job=\"kubelet\", metrics_path=\"/metrics/cadvisor\", container!=\"\", node=~\"$node\"}[$__rate_interval]))",
              "legendFormat": "",
              "range": true,
              "instant": false,
              "editorMode": "code",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "cores",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              },
              "mappings": [],
              "decimals": 1
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center",
            "textMode": "auto",
            "orientation": "auto",
            "wideLayout": true,
            "showPercentChange": false,
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "id": 8,
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 18,
            "y": 1
          }
        },
        {
          "type": "stat",
          "title": "Largest free CPU",
          "description": "Largest unrequested CPU on any single schedulable node (control-plane, tainted and cordoned nodes excluded) = the biggest CPU request a new pod can have and still be scheduled.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max((sum by (node) (kube_node_status_allocatable{job=\"kube-state-metrics\", node=~\"$node\", resource=\"cpu\"}) - (sum by (node) (kube_pod_container_resource_requests{job=\"kube-state-metrics\", node=~\"$node\", resource=\"cpu\"} * on (namespace, pod) group_left () max by (namespace, pod) (kube_pod_status_phase{job=\"kube-state-metrics\", phase=~\"Pending|Running\"} == 1)) or sum by (node) (kube_node_status_allocatable{job=\"kube-state-metrics\", node=~\"$node\", resource=\"cpu\"}) * 0)) unless on (node) (max by (node) (kube_node_spec_taint{job=\"kube-state-metrics\", effect=~\"NoSchedule|NoExecute\"}) or max by (node) (kube_node_spec_unschedulable{job=\"kube-state-metrics\"} == 1)))",
              "legendFormat": "",
              "range": true,
              "instant": false,
              "editorMode": "code",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "cores",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "#EAB839",
                    "value": 0.25
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              },
              "mappings": [],
              "decimals": 2
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "textMode": "auto",
            "orientation": "auto",
            "wideLayout": true,
            "showPercentChange": false,
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "id": 9,
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 21,
            "y": 1
          }
        },
        {
          "type": "stat",
          "title": "Pods pending",
          "description": "Pods not yet running.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(kube_pod_status_phase{job=\"kube-state-metrics\", namespace=~\"$namespace\", phase=\"Pending\"})",
              "legendFormat": "",
              "range": true,
              "instant": false,
              "editorMode": "code",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "#EAB839",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 5
                  }
                ]
              },
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "justifyMode": "center",
            "textMode": "auto",
            "orientation": "auto",
            "wideLayout": true,
            "showPercentChange": false,
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "id": 10,
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 5
          }
        },
        {
          "type": "stat",
          "title": "Unschedulable pods",
          "description": "Pods the scheduler has marked Unschedulable (no node fits their requests, affinity, taints or volume topology).",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(kube_pod_status_unschedulable{job=\"kube-state-metrics\", namespace=~\"$namespace\"}) or vector(0)",
              "legendFormat": "",
              "range": true,
              "instant": false,
              "editorMode": "code",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "justifyMode": "center",
            "textMode": "auto",
            "orientation": "auto",
            "wideLayout": true,
            "showPercentChange": false,
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "id": 11,
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 4,
            "y": 5
          }
        },
        {
          "type": "stat",
          "title": "Pods without memory request",
          "description": "Running pods with no memory request on any container (BestEffort for memory). They are invisible to the scheduler and the first to be OOM-killed under pressure.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "count(max by (namespace, pod) (kube_pod_status_phase{job=\"kube-state-metrics\", namespace=~\"$namespace\", phase=\"Running\"} == 1) unless on (namespace, pod) max by (namespace, pod) (kube_pod_container_resource_requests{job=\"kube-state-metrics\", namespace=~\"$namespace\", resource=\"memory\"})) or vector(0)",
              "legendFormat": "",
              "range": true,
              "instant": false,
              "editorMode": "code",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "#EAB839",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 20
                  }
                ]
              },
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "textMode": "auto",
            "orientation": "auto",
            "wideLayout": true,
            "showPercentChange": false,
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "id": 12,
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 8,
            "y": 5
          }
        },
        {
          "type": "stat",
          "title": "Memory request efficiency",
          "description": "Used / requested memory across running pods. 40% means 60% of what pods reserve sits idle.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "100 * sum(container_memory_working_set_bytes{job=\"kubelet\", metrics_path=\"/metrics/cadvisor\", container!=\"\", node=~\"$node\"}) / sum(sum by (node) (kube_pod_container_resource_requests{job=\"kube-state-metrics\", node=~\"$node\", resource=\"memory\"} * on (namespace, pod) group_left () max by (namespace, pod) (kube_pod_status_phase{job=\"kube-state-metrics\", phase=~\"Pending|Running\"} == 1)))",
              "legendFormat": "",
              "range": true,
              "instant": false,
              "editorMode": "code",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "#EAB839",
                    "value": 30
                  },
                  {
                    "color": "green",
                    "value": 60
                  }
                ]
              },
              "mappings": [],
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "textMode": "auto",
            "orientation": "auto",
            "wideLayout": true,
            "showPercentChange": false,
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "id": 13,
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 12,
            "y": 5
          }
        },
        {
          "type": "stat",
          "title": "CPU request efficiency",
          "description": "Used / requested CPU.",
          "datasource": {
            "type": "prometheus",
