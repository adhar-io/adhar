# Restarts Grafana once the Keycloak OAuth client secret is available.
#
# Problem: Grafana consumes its Keycloak client id/secret via `envFromSecrets`
# (grafana-oidc). Env vars are read ONCE at container start. But grafana-oidc is
# produced by an ExternalSecret that depends on Keycloak's realm job
# (keycloak-clients), which finishes minutes AFTER Grafana has already started —
# so the running Grafana comes up with empty CLIENT_ID / no CLIENT_SECRET and the
# "Sign in with Keycloak" OAuth code exchange fails ("invalid_client"). Nothing
# restarts Grafana afterwards, so it stays broken until a manual rollout. The
# secret is kept `optional: true` on purpose so Grafana still boots (with local
# admin as break-glass) before Keycloak exists.
#
# Fix: a PostSync hook that waits for the secret, then restarts Grafana ONLY if the
# running pod started before the Secret existed. That makes it idempotent — on
# steady-state syncs (Grafana already has the creds) it is a no-op, so there is
# no restart loop.
#
# It used to ask the pod instead (`kubectl exec … test -n "$GF_AUTH_…"`), and
# that restarted Grafana on EVERY sync of kube-prometheus: this Role has never
# granted pods/exec, the exec was refused, its stderr went to /dev/null, and the
# refusal read as "the env is missing" (AWS, 2026-10-30: Secret 15:42:04, pod
# 15:43:20, restarted anyway at 15:47:16). The question is answered from
# timestamps now, the way the console's reload hooks answer it: grafana-oidc is
# written by External Secrets only once BOTH keys resolve, so its
# creationTimestamp is the moment the credential became available, and a pod
# that started after it has it in its env.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana-oidc-reload
  namespace: adhar-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: grafana-oidc-reload
  namespace: adhar-system
rules:
  # Exactly what the script touches, by name (as penpot's console-token Role
  # does): it reads one Secret, lists Grafana's pods, and restarts and waits on
  # one Deployment. Unnamed, these rules read every Secret in adhar-system and
  # could patch any Deployment in it.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["grafana-oidc"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
  # `watch`: `kubectl rollout status` watches the Deployment (by name, so
  # resourceNames applies); without it the wait logs "Failed to watch …
  # unknown" and only notices progress on its backoff relists.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["prometheus-grafana"]
    verbs: ["get", "list", "watch", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: grafana-oidc-reload
  namespace: adhar-system
subjects:
  - kind: ServiceAccount
    name: grafana-oidc-reload
    namespace: adhar-system
roleRef:
  kind: Role
  name: grafana-oidc-reload
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: grafana-oidc-reload
  namespace: adhar-system
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  template:
    metadata:
      generateName: grafana-oidc-reload
    spec:
      serviceAccountName: grafana-oidc-reload
      restartPolicy: Never
      containers:
        - name: kubectl
          image: docker.io/bitnamilegacy/kubectl:1.31
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -eu -o pipefail
              NS=adhar-system
              DEPLOY=prometheus-grafana
              SECRET=grafana-oidc

              # 1. Wait (bounded) for the OAuth client secret to be populated by the
              #    keycloak realm job -> ExternalSecret chain. Non-fatal on timeout:
              #    a later sync re-runs this hook once Keycloak has finished.
              # 60 x 10s (10 min) was shorter than a cold bootstrap takes to get
              # through keycloak-db -> keycloak -> realm job -> ExternalSecret, so
              # this hook routinely gave up. "Retry next sync" does not save it:
              # PostSync hooks only re-run when a sync actually happens, and once
              # the app is Synced nothing triggers one — Grafana then stays without
              # OIDC until someone rolls it out by hand. 240 x 10s = 40 min.
              ok=""
              for i in $(seq 1 240); do
                if kubectl -n "$NS" get secret "$SECRET" \
                     -o jsonpath='{.data.GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}' 2>/dev/null | grep -q .; then
                  ok=1; break
                fi
                echo "waiting for $SECRET GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET ($i)"
                sleep 10
              done
              if [ -z "$ok" ]; then
                echo "secret not ready yet; leaving Grafana as-is (will retry next sync)"
                exit 0
              fi

              # 2. Only restart if the running Grafana predates the Secret (i.e. it
              #    started with the OAuth env missing). The NEWEST Grafana pod
              #    decides (pods list in name order, so the first can be the one
              #    a rollout is replacing), compared by the digits of the RFC
              #    3339 stamps: busybox `date -d` rejects them (adhar-console
              #    oidc-reload.yaml, 2026-10-28). The pod list is read on its
              #    own and a list that FAILS ends the hook — read as "no pod",
              #    an API timeout restarted Grafana; only a list that succeeded
              #    with no started pod restarts it.
              #    Guard: TestRestartHooksNeverRestartOnAFailedPodList.
              #    The selector is the Deployment's own: `name=grafana` alone
              #    also selects OnCall's Grafana (instance=oncall), whose start
              #    time then answered for this one.
              SECRET_TS=$(kubectl -n "$NS" get secret "$SECRET" -o jsonpath='{.metadata.creationTimestamp}')
              if ! STARTED=$(kubectl -n "$NS" get pods -l app.kubernetes.io/instance=prometheus,app.kubernetes.io/name=grafana \
                               -o jsonpath='{range .items[*]}{.status.startTime}{"\n"}{end}'); then
                echo "cannot list the Grafana pods; leaving Grafana as-is (retries next sync)"
                exit 0
              fi
              POD_TS=$(printf '%s\n' "$STARTED" | sort | tail -n 1)
              if [ -n "$POD_TS" ] && [ "${POD_TS//[!0-9]/}" -gt "${SECRET_TS//[!0-9]/}" ]; then
                echo "Grafana pod ($POD_TS) is newer than $SECRET ($SECRET_TS); nothing to do."
                exit 0
              fi

              echo "Restarting $DEPLOY to load Keycloak OAuth env..."
              kubectl -n "$NS" rollout restart deployment "$DEPLOY"
              kubectl -n "$NS" rollout status deployment "$DEPLOY" --timeout=180s || true
              echo "Grafana OAuth reload complete."
