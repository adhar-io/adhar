apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: argocd
  namespace: adhar-system
  labels:
    app: argocd
spec:
  # Prometheus podMonitorSelector is empty ({}) so this is picked up
  # cluster-wide with no extra release label required.
  #
  # The controller-embedded ArgoCD install (resources/argocd/install.yaml)
  # does NOT ship the helm chart's dedicated "-metrics" Services, so there is
  # nothing for a ServiceMonitor to target. The metrics endpoints are exposed
  # only as pod ports named "metrics", so we scrape the pods directly:
  #   argocd-server                 :8083
  #   argocd-repo-server            :8084
  #   argocd-application-controller :8082  (exposes argocd_app_info, etc.)
  #   argocd-applicationset-controller :8080 (exposes argocd_appset_info)
  #   argocd-notifications-controller  :9001
  # Every ArgoCD pod carries app.kubernetes.io/part-of=argocd; only the pods
  # that actually expose a "metrics" port are scraped (dex/redis are skipped).
  selector:
    matchLabels:
      app.kubernetes.io/part-of: argocd
  namespaceSelector:
    matchNames:
      - adhar-system
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      scheme: http
      interval: 30s
      honorLabels: true
