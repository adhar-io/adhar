apiVersion: v1
kind: ConfigMap
metadata:
  name: adhar-dashboard-cloudnativepg
  namespace: adhar-system
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: adhar-observability
  annotations:
    grafana_folder: "Platform"
data:
  cloudnativepg.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "description": "Fleet-wide CloudNativePG observability: every cluster, every instance, side by side. Select one, several or all clusters with the Cluster variable. Rows backed by cnpg_* metrics require spec.monitoring.enablePodMonitor: true on each CNPG Cluster resource; the Resources and Storage rows are backed by cAdvisor and kubelet and are always populated.",
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "panels": [
        {
          "id": 57,
          "type": "row",
          "title": "🗂️ Fleet Overview — every cluster at a glance",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": [],
          "repeat": null,
          "description": "Every CloudNativePG cluster in the selection, side by side."
        },
        {
          "id": 1,
          "type": "stat",
          "title": "Clusters",
          "description": "Distinct CloudNativePG clusters matching the current selection.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 0,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "count(count by (cluster) (label_replace(max by (pod) (kube_pod_container_status_ready{namespace=~\"$namespace\", container=\"postgres\", pod=~\"$instance\"}), \"cluster\", \"$1\", \"pod\", \"(.*)-[0-9]+\")))",
              "legendFormat": "__auto",
              "range": false,
              "instant": true,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              },
              "unit": "short",
              "decimals": 0
            },
            "overrides": []
          },
          "maxDataPoints": 100,
          "options": {
            "colorMode": "none",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "textMode": "auto",
            "wideLayout": true,
            "showPercentChange": false,
            "percentChangeColorMode": "standard",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "text": {
              "titleSize": 12,
              "valueSize": 28
            }
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Instances",
          "description": "PostgreSQL instance pods across the selected clusters.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 3,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "count(count by (pod) (kube_pod_container_status_ready{namespace=~\"$namespace\", container=\"postgres\", pod=~\"$instance\"}))",
              "legendFormat": "__auto",
              "range": false,
              "instant": true,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              },
              "unit": "short",
              "decimals": 0
            },
            "overrides": []
          },
          "maxDataPoints": 100,
          "options": {
            "colorMode": "none",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "textMode": "auto",
            "wideLayout": true,
            "showPercentChange": false,
            "percentChangeColorMode": "standard",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "text": {
              "titleSize": 12,
              "valueSize": 28
            }
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Instances Up",
          "description": "Instances whose CNPG exporter reports PostgreSQL up.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 6,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "sum(cnpg_collector_up{namespace=~\"$namespace\", cluster=~\"$cluster\"}) or vector(0)",
              "legendFormat": "__auto",
              "range": false,
              "instant": true,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              },
              "unit": "short",
              "decimals": 0
            },
            "overrides": []
          },
          "maxDataPoints": 100,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "textMode": "auto",
            "wideLayout": true,
            "showPercentChange": false,
            "percentChangeColorMode": "standard",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "text": {
              "titleSize": 12,
              "valueSize": 28
            }
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Primaries",
          "description": "Instances not in recovery — i.e. the writable primary of each cluster.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 9,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "count(cnpg_pg_replication_in_recovery{namespace=~\"$namespace\", pod=~\"$instance\"} == 0) or vector(0)",
              "legendFormat": "__auto",
              "range": false,
              "instant": true,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              },
              "unit": "short",
              "decimals": 0
            },
            "overrides": []
          },
          "maxDataPoints": 100,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "textMode": "auto",
            "wideLayout": true,
            "showPercentChange": false,
            "percentChangeColorMode": "standard",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "text": {
              "titleSize": 12,
              "valueSize": 28
            }
          }
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Max Replication Lag",
          "description": "Worst standby replication lag across the selection.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 12,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "max(cnpg_pg_replication_lag{namespace=~\"$namespace\", pod=~\"$instance\"}) or vector(0)",
              "legendFormat": "__auto",
              "range": false,
              "instant": true,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 10
                  },
                  {
                    "color": "red",
                    "value": 60
                  }
                ]
              },
              "unit": "s",
              "decimals": 2
            },
            "overrides": []
          },
          "maxDataPoints": 100,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "textMode": "auto",
            "wideLayout": true,
            "showPercentChange": false,
            "percentChangeColorMode": "standard",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "text": {
              "titleSize": 12,
              "valueSize": 28
            }
          }
        },
        {
          "id": 6,
          "type": "stat",
          "title": "WAL Ready to Archive",
          "description": "WAL segments waiting in archive_status/ready. A growing backlog means archiving is stalled.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 15,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "max(cnpg_collector_pg_wal_archive_status{namespace=~\"$namespace\", pod=~\"$instance\", value=\"ready\"}) or vector(0)",
              "legendFormat": "__auto",
              "range": false,
              "instant": true,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 20
                  },
                  {
                    "color": "red",
                    "value": 100
                  }
                ]
              },
              "unit": "short",
              "decimals": 0
            },
            "overrides": []
          },
          "maxDataPoints": 100,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "textMode": "auto",
            "wideLayout": true,
            "showPercentChange": false,
            "percentChangeColorMode": "standard",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "text": {
              "titleSize": 12,
              "valueSize": 28
            }
          }
        },
        {
          "id": 7,
          "type": "stat",
          "title": "Oldest Backup",
          "description": "Age of the most stale successful base backup across the selection.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 18,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "max(time() - cnpg_collector_last_available_backup_timestamp{namespace=~\"$namespace\", pod=~\"$instance\"}) or vector(0)",
              "legendFormat": "__auto",
              "range": false,
              "instant": true,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 90000
                  },
                  {
                    "color": "red",
                    "value": 172800
                  }
                ]
              },
              "unit": "s",
              "decimals": 0
            },
            "overrides": []
          },
          "maxDataPoints": 100,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "textMode": "auto",
            "wideLayout": true,
            "showPercentChange": false,
            "percentChangeColorMode": "standard",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "text": {
              "titleSize": 12,
              "valueSize": 28
            }
          }
        },
        {
          "id": 8,
          "type": "stat",
          "title": "Worst Volume Used",
          "description": "Fullest PostgreSQL data volume.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 21,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "100 * max(1 - kubelet_volume_stats_available_bytes{namespace=~\"$namespace\", persistentvolumeclaim=~\"$instance\"} / kubelet_volume_stats_capacity_bytes{namespace=~\"$namespace\", persistentvolumeclaim=~\"$instance\"}) or vector(0)",
              "legendFormat": "__auto",
              "range": false,
              "instant": true,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 75
                  },
                  {
                    "color": "orange",
                    "value": 85
                  },
                  {
                    "color": "red",
                    "value": 90
                  }
                ]
              },
              "unit": "percent",
              "decimals": 1
            },
            "overrides": []
          },
          "maxDataPoints": 100,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "textMode": "auto",
            "wideLayout": true,
            "showPercentChange": false,
            "percentChangeColorMode": "standard",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "text": {
              "titleSize": 12,
              "valueSize": 28
            }
          }
        },
        {
          "id": 9,
          "type": "table",
          "title": "🗂️ All Database Clusters — Full Detail",
          "description": "One row per CloudNativePG cluster with every headline metric side by side. Columns sourced from cnpg_* require spec.monitoring.enablePodMonitor: true on the Cluster resource; Instances, CPU, Memory and Volume come from kube-state-metrics/cAdvisor and are always populated.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 11,
            "w": 24,
            "x": 0,
            "y": 5
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "count by (cluster) (label_replace(max by (pod) (kube_pod_container_status_ready{namespace=~\"$namespace\", container=\"postgres\", pod=~\"$instance\"}), \"cluster\", \"$1\", \"pod\", \"(.*)-[0-9]+\"))",
              "legendFormat": "__auto",
              "range": false,
              "instant": true,
              "refId": "A",
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "sum by (cluster) (cnpg_collector_up{namespace=~\"$namespace\", cluster=~\"$cluster\"})",
              "legendFormat": "__auto",
              "range": false,
              "instant": true,
              "refId": "B",
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "max by (cluster) (label_replace(cnpg_pg_replication_lag{namespace=~\"$namespace\", pod=~\"$instance\"}, \"cluster\", \"$1\", \"pod\", \"(.*)-[0-9]+\"))",
              "legendFormat": "__auto",
              "range": false,
              "instant": true,
              "refId": "C",
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "max by (cluster) (label_replace(cnpg_collector_pg_wal_archive_status{namespace=~\"$namespace\", pod=~\"$instance\", value=\"ready\"}, \"cluster\", \"$1\", \"pod\", \"(.*)-[0-9]+\"))",
              "legendFormat": "__auto",
              "range": false,
              "instant": true,
              "refId": "D",
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "max by (cluster) (label_replace(time() - cnpg_collector_last_available_backup_timestamp{namespace=~\"$namespace\", pod=~\"$instance\"}, \"cluster\", \"$1\", \"pod\", \"(.*)-[0-9]+\"))",
              "legendFormat": "__auto",
              "range": false,
              "instant": true,
              "refId": "E",
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "max by (cluster) (label_replace(sum by (pod) (cnpg_pg_database_size_bytes{namespace=~\"$namespace\", pod=~\"$instance\", datname!~\"template.*|postgres\"}), \"cluster\", \"$1\", \"pod\", \"(.*)-[0-9]+\"))",
              "legendFormat": "__auto",
              "range": false,
              "instant": true,
              "refId": "F",
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "max by (cluster) (label_replace(sum by (pod) (cnpg_backends_total{namespace=~\"$namespace\", pod=~\"$instance\"}), \"cluster\", \"$1\", \"pod\", \"(.*)-[0-9]+\"))",
              "legendFormat": "__auto",
              "range": false,
              "instant": true,
              "refId": "G",
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "max by (cluster) (label_replace(sum by (pod) (rate(cnpg_pg_stat_database_xact_commit{namespace=~\"$namespace\", pod=~\"$instance\"}[5m]) + rate(cnpg_pg_stat_database_xact_rollback{namespace=~\"$namespace\", pod=~\"$instance\"}[5m])), \"cluster\", \"$1\", \"pod\", \"(.*)-[0-9]+\"))",
              "legendFormat": "__auto",
              "range": false,
              "instant": true,
              "refId": "H",
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "max by (cluster) (label_replace(100 * (1 - kubelet_volume_stats_available_bytes{namespace=~\"$namespace\", persistentvolumeclaim=~\"$instance\"} / kubelet_volume_stats_capacity_bytes{namespace=~\"$namespace\", persistentvolumeclaim=~\"$instance\"}), \"cluster\", \"$1\", \"persistentvolumeclaim\", \"(.*)-[0-9]+\"))",
              "legendFormat": "__auto",
              "range": false,
              "instant": true,
              "refId": "I",
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "sum by (cluster) (label_replace(sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=~\"$namespace\", container=\"postgres\", pod=~\"$instance\"}[5m])), \"cluster\", \"$1\", \"pod\", \"(.*)-[0-9]+\"))",
              "legendFormat": "__auto",
              "range": false,
              "instant": true,
              "refId": "J",
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "sum by (cluster) (label_replace(sum by (pod) (container_memory_working_set_bytes{namespace=~\"$namespace\", container=\"postgres\", pod=~\"$instance\"}), \"cluster\", \"$1\", \"pod\", \"(.*)-[0-9]+\"))",
              "legendFormat": "__auto",
              "range": false,
              "instant": true,
              "refId": "K",
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "max by (cluster) (cnpg_collector_postgres_version{namespace=~\"$namespace\", cluster=~\"$cluster\"})",
              "legendFormat": "__auto",
              "range": false,
              "instant": true,
              "refId": "L",
              "format": "table"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              },
              "unit": "short",
              "decimals": 1,
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                },
                "inspect": false,
                "filterable": true
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Up"
                },
                "properties": [
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-background",
                      "mode": "gradient"
                    }
                  },
                  {
                    "id": "thresholds",
