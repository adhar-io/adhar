# Loki (logs) and Tempo (traces) datasources for Grafana, loaded by the
# datasource sidecar (label grafana_datasource: "1") — one pane for
# metrics, logs and traces (ADR-0010).
apiVersion: v1
data:
  logs-traces-datasources.yaml: "apiVersion: 1\ndatasources:\n- access: proxy\n  name:\
    \ Loki\n  type: loki\n  url: http://loki.adhar-system.svc.cluster.local:3100\n\
    - access: proxy\n  name: Tempo\n  type: tempo\n  url: http://tempo.adhar-system.svc.cluster.local:3200\n"
kind: ConfigMap
metadata:
  labels:
    adhar.io/component: observability
    grafana_datasource: '1'
  name: datasources-logs-traces
  namespace: adhar-system
