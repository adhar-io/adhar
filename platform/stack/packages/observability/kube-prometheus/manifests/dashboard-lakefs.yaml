# Grafana dashboard for lakeFS (data/lakefs). Fed by
# data/lakefs/manifests/servicemonitor.yaml (job lakefs, /metrics on the API
# port). Hand written (no upstream dashboard on grafana.com); datasource is
# variable-driven.
