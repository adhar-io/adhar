              "expr": "sum(rate(controller_runtime_reconcile_total[5m])) by (controller)",
              "legendFormat": "{{controller}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "never",
                "spanNulls": true,
                "stacking": {
                  "mode": "none",
                  "group": "A"
                },
                "gradientMode": "opacity"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "showLegend": true,
              "placement": "bottom",
              "displayMode": "table",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
