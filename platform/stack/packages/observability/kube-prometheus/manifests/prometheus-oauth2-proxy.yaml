# Keycloak SSO in front of the Prometheus UI.
#
# Prometheus has no native OIDC, so an oauth2-proxy sits in front of it and does
# the OpenID Connect handshake with Keycloak. Prometheus is given its OWN host
# (prometheus.adhar.localtest.me) rather than a sub-path so it can keep serving at
# root — that keeps Grafana's in-cluster datasource (http://prometheus…:9090/) and
# the operator/scrapes working unchanged. The platform wildcard cert
# (*.adhar.localtest.me) already covers this subdomain and the Gateway listeners
# are hostname-agnostic.
#
# Flow: browser -> Gateway (prometheus.adhar.localtest.me) -> oauth2-proxy ->
#   (unauthenticated) 302 to Keycloak /auth -> login -> /oauth2/callback ->
#   cookie set -> reverse-proxy to the Prometheus Service.
---
# Assembles the oauth2-proxy env Secret: the Keycloak client secret (pulled from
# keycloak-clients) + the generated cookie secret. Keys are the OAUTH2_PROXY_*
# env names the Deployment consumes via envFrom.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: prometheus-oauth2-proxy
  namespace: adhar-system
spec:
  # CreatedOnce + 5m: retry until keycloak-clients exists, then freeze so the
  # generated cookie secret never rotates. A bare refreshInterval "0" is one
  # attempt with NO retry — any ES created before the Keycloak realm job
  # finishes (always, on a cold bootstrap) stays SecretSyncedError forever.
  refreshPolicy: CreatedOnce
  refreshInterval: 30s
  secretStoreRef:
    name: keycloak
    kind: ClusterSecretStore
  target:
    name: prometheus-oauth2-proxy
    template:
      engineVersion: v2
      data:
        OAUTH2_PROXY_CLIENT_SECRET: "{{ .PROMETHEUS_CLIENT_SECRET }}"
        OAUTH2_PROXY_COOKIE_SECRET: "{{ .COOKIE_SECRET }}"
  data:
    - secretKey: PROMETHEUS_CLIENT_SECRET
      remoteRef:
        key: keycloak-clients
        property: PROMETHEUS_CLIENT_SECRET
    # The platform-wide cookie secret (security/keycloak/manifests/sso-cookie.yaml).
    # Shared by every oauth2-proxy so a session established by one app is
    # accepted by all of them.
    - secretKey: COOKIE_SECRET
      remoteRef:
        key: adhar-sso-cookie
        property: COOKIE_SECRET
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-oauth2-proxy
  namespace: adhar-system
  labels:
    app.kubernetes.io/name: prometheus-oauth2-proxy
    app.kubernetes.io/part-of: kube-prometheus
spec:
  # A late SSO secret (this app can sync before Keycloak has written
  # keycloak-clients) must not hold the rollout Progressing for the default
  # 10 minutes — surface it fast so ArgoCD retries.
  progressDeadlineSeconds: 120
  replicas: 1
  selector:
    matchLabels:
      app: prometheus-oauth2-proxy
  template:
    metadata:
      labels:
        app: prometheus-oauth2-proxy
    spec:
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1
          args:
            - --http-address=0.0.0.0:4180
            - --provider=oidc
            - --oidc-issuer-url=https://keycloak.adhar.localtest.me:8443/realms/adhar
            # Keycloak is served over the self-signed platform cert (adhar-cert);
            # skip verification for the server-side OIDC discovery/token calls.
            - --ssl-insecure-skip-verify=true
            - --client-id=prometheus
            - --redirect-url=https://prometheus.adhar.localtest.me:8443/oauth2/callback
            - --upstream=http://prometheus-kube-prometheus-prometheus.adhar-system:9090
            - --email-domain=*
            - --scope=openid profile email groups
            - --cookie-secure=true
            # Parent-domain cookie + the shared secret above = real single
            # sign-on: another app's proxy accepts this session without a round
            # trip to Keycloak. Seed-time host rewriting turns the literal
            # domain into the platform's own.
            - --cookie-domain=.adhar.localtest.me
            - --whitelist-domain=.adhar.localtest.me:8443
            - --skip-provider-button=true
            - --reverse-proxy=true
          envFrom:
            - secretRef:
                name: prometheus-oauth2-proxy
          ports:
            - name: http
              containerPort: 4180
          readinessProbe:
            httpGet:
              path: /ping
              port: http
          livenessProbe:
            httpGet:
              path: /ping
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-oauth2-proxy
  namespace: adhar-system
  labels:
    app.kubernetes.io/name: prometheus-oauth2-proxy
    app.kubernetes.io/part-of: kube-prometheus
spec:
  selector:
    app: prometheus-oauth2-proxy
  ports:
    - name: http
      port: 4180
      targetPort: http
---
# Dedicated host for Prometheus, routed through the Cilium Gateway to oauth2-proxy.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prometheus
  namespace: adhar-system
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: kube-prometheus
spec:
  parentRefs:
    - name: adhar-gateway
      namespace: adhar-system
  hostnames:
    - prometheus.adhar.localtest.me
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: prometheus-oauth2-proxy
          port: 4180
