        {
          "id": 13,
          "type": "gauge",
          "title": "CPU Requests Committed",
          "description": "Sum of container CPU requests vs allocatable CPU. Over 100% means overcommitted.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 6,
            "w": 4,
            "x": 16,
            "y": 5
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
