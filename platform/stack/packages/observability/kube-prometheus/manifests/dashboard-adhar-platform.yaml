          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "100 * sum(kubelet_running_pods) / sum(max by (node) (kube_node_status_allocatable{resource=\"pods\"}))",
              "legendFormat": "Pod slots",
              "range": false,
              "instant": true,
              "refId": "A"
