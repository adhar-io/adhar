        {
          "id": 6,
          "type": "stat",
          "title": "Apps Healthy",
          "description": "ArgoCD applications with health_status=Healthy (deduplicated by app name).",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 15,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "count(count by (name) (argocd_app_info{health_status=\"Healthy\"})) or vector(0)",
              "legendFormat": "__auto",
              "range": false,
              "instant": true,
