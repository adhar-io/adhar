    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          },
          {
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "enable": true,
            "iconColor": "red",
            "name": "Argo CD sync failures",
            "expr": "sum by (name) (increase(argocd_app_sync_total{phase=~\"Failed|Error\"}[2m])) > 0",
            "step": "2m",
            "titleFormat": "Sync failed",
            "textFormat": "{{name}}",
            "useValueForTime": false
          },
          {
            "datasource": {
              "type": "loki",
              "uid": "loki"
            },
            "enable": true,
            "iconColor": "blue",
            "name": "Node scaling",
            "expr": "{namespace=\"adhar-system\", app=\"adhar-controller-manager\"} |= \"scaling\" |~ \"worker node group\"",
            "titleFormat": "Node autoscaler",
            "textFormat": "{{__line__}}"
          }
        ]
      },
      "description": "The platform front page: health at a glance, capacity (requests vs usage per node), reliability, GitOps and delivery (Argo CD, Rollouts, Kargo verification, Tekton), custom application SLOs, the control plane, identity/edge/certificates, security, data, logs/traces and the node autoscaler. The only dashboard outside a Grafana folder; everything else is filed by area, and each custom application has its own in the Applications folder. Generated by build-platform-dashboard.py \u2014 edit that, not this file.",
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "links": [
        {
          "asDropdown": false,
          "icon": "external link",
          "includeVars": false,
          "keepTime": true,
          "tags": [],
          "targetBlank": false,
          "title": "Adhar AI",
          "tooltip": "The AI plane: agent runs, models, tokens, MCP tools and guardrails",
          "type": "link",
          "url": "/d/adhar-ai/adhar-ai"
