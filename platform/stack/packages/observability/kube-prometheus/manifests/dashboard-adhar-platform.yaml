        {
          "id": 12,
          "type": "gauge",
          "title": "Pod Slots Used",
          "description": "Running pods against total allocatable pod slots (110/node default).",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 6,
            "w": 4,
            "x": 12,
            "y": 5
