apiVersion: v1
kind: ConfigMap
metadata:
  name: adhar-dashboard-argo-workflows-controller
  namespace: adhar-system
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: adhar-observability
  annotations:
    grafana_folder: "Platform"
data:
  argo-workflows-controller.json: |
    {
      "annotations": {
        "list": []
      },
      "description": "Detailed controller monitoring for Argo Workflows. Tracks controller errors, Kubernetes API request patterns, work queue metrics, and worker saturation. Use this dashboard to diagnose controller performance issues, identify API server pressure, and monitor processing backlogs. The dashboards were generated using [argo-workflows-mixin](https://github.com/adinhodovic/argo-workflows-mixin). Open issues and create feature requests in the repository.",
      "editable": false,
      "links": [
        {
          "asDropdown": true,
          "includeVars": false,
          "keepTime": true,
          "tags": [
            "argo-workflows",
            "argo-workflows-mixin"
          ],
          "targetBlank": true,
          "title": "Argo Workflows",
          "type": "dashboards"
        }
      ],
      "panels": [
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "title": "Summary",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "description": "Current controller error rate across the selected controllers. Use this as the first signal for reconciliation failures.",
          "fieldConfig": {
            "defaults": {
              "mappings": [],
              "thresholds": {
                "steps": [
                  {
                    "color": "green",
                    "value": 0
                  }
                ]
              },
              "unit": "ops"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 1
          },
          "id": 2,
          "options": {
            "graphMode": "area",
            "percentChangeColorMode": "standard",
            "showPercentChange": false
          },
          "pluginVersion": "v11.4.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "expr": "sum(\n  rate(\n    argo_workflows_error_count{\n      cluster=\"$cluster\",\nnamespace=~\"$namespace\",\njob=~\"$job\"\n\n\n    }[$__rate_interval]\n  )\n)\n",
              "instant": false
            }
          ],
          "title": "Controller Errors",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "description": "Current percentage of Kubernetes API requests succeeding. No data means there were no requests in the selected interval.",
          "fieldConfig": {
            "defaults": {
              "mappings": [],
              "thresholds": {
                "steps": [
                  {
                    "color": "green",
                    "value": 0
                  }
                ]
              },
              "unit": "percent"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 6,
            "y": 1
          },
          "id": 3,
          "options": {
            "graphMode": "area",
            "percentChangeColorMode": "standard",
            "showPercentChange": false
          },
          "pluginVersion": "v11.4.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "expr": "(\n  sum(\n    rate(\n      argo_workflows_k8s_request_total{\n        cluster=\"$cluster\",\nnamespace=~\"$namespace\",\njob=~\"$job\"\n\n,\n        status_code=~\"2..|101\"\n      }[$__rate_interval]\n    )\n  )\n  /\n  sum(\n    rate(\n      argo_workflows_k8s_request_total{\n        cluster=\"$cluster\",\nnamespace=~\"$namespace\",\njob=~\"$job\"\n\n\n      }[$__rate_interval]\n    )\n  )\n) * 100\n",
              "instant": false
            }
          ],
          "title": "K8s API Success Rate",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "description": "Current total queue depth across controller work queues for the selected controllers.",
          "fieldConfig": {
            "defaults": {
              "mappings": [],
              "thresholds": {
                "steps": [
                  {
                    "color": "green",
                    "value": 0
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 12,
            "y": 1
          },
          "id": 4,
          "options": {
            "graphMode": "area",
            "percentChangeColorMode": "standard",
            "showPercentChange": false
          },
          "pluginVersion": "v11.4.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "expr": "sum(\n  argo_workflows_queue_depth_gauge{\n    cluster=\"$cluster\",\nnamespace=~\"$namespace\",\njob=~\"$job\"\n\n\n  }\n)\n",
              "instant": false
            }
          ],
          "title": "Queue Depth",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "description": "Current number of busy workers across the selected controllers.",
          "fieldConfig": {
            "defaults": {
              "mappings": [],
              "thresholds": {
                "steps": [
                  {
                    "color": "green",
                    "value": 0
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 18,
            "y": 1
          },
          "id": 5,
          "options": {
            "graphMode": "area",
            "percentChangeColorMode": "standard",
            "showPercentChange": false
          },
          "pluginVersion": "v11.4.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "expr": "sum(\n  argo_workflows_workers_busy_count{\n    cluster=\"$cluster\",\nnamespace=~\"$namespace\",\njob=~\"$job\"\n\n\n  }\n)\n",
              "instant": false
            }
          ],
          "title": "Busy Workers",
          "type": "stat"
        },
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 5
          },
          "id": 6,
          "title": "Errors",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "description": "Controller errors per second by cause. Common causes include OperationPanic, CronWorkflowSubmissionError, and CronWorkflowSpecError.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "axisSoftMin": 0,
                "fillOpacity": 100,
                "lineWidth": 1,
                "stacking": {
                  "mode": "normal"
                }
              },
              "unit": "ops"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 6
          },
          "id": 7,
          "options": {
            "legend": {
              "calcs": [
                "mean",
                "max"
              ],
              "displayMode": "table",
              "placement": "right",
              "showLegend": true,
              "sortBy": "Mean",
              "sortDesc": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "pluginVersion": "v11.4.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "exemplar": false,
              "expr": "sum(\n  rate(\n    argo_workflows_error_count{\n      cluster=\"$cluster\",\nnamespace=~\"$namespace\",\njob=~\"$job\"\n\n\n    }[$__rate_interval]\n  )\n) by (cause)\n",
              "legendFormat": "{{ cause }}"
            }
          ],
          "title": "Controller Errors by Cause",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "description": "Rate of log messages by severity level. High rates of warning or error messages indicate controller issues. Debug/info messages show normal operation.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "axisSoftMin": 0,
                "fillOpacity": 100,
                "lineWidth": 1,
                "stacking": {
                  "mode": "normal"
                }
              },
              "unit": "ops"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 6
          },
          "id": 8,
          "options": {
            "legend": {
              "calcs": [
                "mean",
                "max"
              ],
              "displayMode": "table",
              "placement": "right",
              "showLegend": true,
              "sortBy": "Mean",
              "sortDesc": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "pluginVersion": "v11.4.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "exemplar": false,
              "expr": "sum(\n  rate(\n    argo_workflows_log_messages{\n      cluster=\"$cluster\",\nnamespace=~\"$namespace\",\njob=~\"$job\"\n\n\n    }[$__rate_interval]\n  )\n) by (level)\n",
              "legendFormat": "{{ level }}"
            }
          ],
          "title": "Log Messages by Level",
          "type": "timeseries"
        },
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 14
          },
          "id": 9,
          "title": "Kubernetes API",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "description": "Rate of Kubernetes API requests by resource kind and verb. High rates may indicate excessive reconciliation or API server pressure. Watch for throttling responses.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "axisSoftMin": 0,
                "fillOpacity": 100,
                "lineWidth": 1,
                "stacking": {
                  "mode": "normal"
                }
              },
              "unit": "ops"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 15
          },
          "id": 10,
          "options": {
            "legend": {
              "calcs": [
                "mean",
                "max"
              ],
              "displayMode": "table",
              "placement": "right",
              "showLegend": true,
              "sortBy": "Mean",
              "sortDesc": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "pluginVersion": "v11.4.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "exemplar": false,
              "expr": "sum(\n  rate(\n    argo_workflows_k8s_request_total{\n      cluster=\"$cluster\",\nnamespace=~\"$namespace\",\njob=~\"$job\"\n\n\n    }[$__rate_interval]\n  )\n) by (kind, verb)\n",
              "legendFormat": "{{ kind }}/{{ verb }}"
            }
          ],
          "title": "K8s API Request Rate by Kind/Verb",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "description": "Kubernetes API request latency percentiles. Rising latency indicates API server overload or network issues. P99 spikes often precede visible degradation of workflow processing.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "fillOpacity": 10
              },
              "unit": "s"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 15
          },
          "id": 11,
          "options": {
            "legend": {
              "calcs": [
                "mean",
                "max"
              ],
              "displayMode": "table",
              "placement": "right",
              "showLegend": true,
              "sortBy": "Mean",
              "sortDesc": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "pluginVersion": "v11.4.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "exemplar": false,
              "expr": "histogram_quantile(\n  0.5,\n  sum(\n    rate(\n      argo_workflows_k8s_request_duration_bucket{\n        cluster=\"$cluster\",\nnamespace=~\"$namespace\",\njob=~\"$job\"\n\n\n      }[$__rate_interval]\n    )\n  ) by (le)\n)\n",
              "legendFormat": "P50"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "exemplar": false,
              "expr": "histogram_quantile(\n  0.95,\n  sum(\n    rate(\n      argo_workflows_k8s_request_duration_bucket{\n        cluster=\"$cluster\",\nnamespace=~\"$namespace\",\njob=~\"$job\"\n\n\n      }[$__rate_interval]\n    )\n  ) by (le)\n)\n",
              "legendFormat": "P95"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "exemplar": false,
              "expr": "histogram_quantile(\n  0.99,\n  sum(\n    rate(\n      argo_workflows_k8s_request_duration_bucket{\n        cluster=\"$cluster\",\nnamespace=~\"$namespace\",\njob=~\"$job\"\n\n\n      }[$__rate_interval]\n    )\n  ) by (le)\n)\n",
              "legendFormat": "P99"
            }
          ],
          "title": "K8s API Request Duration",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "description": "Rate of Kubernetes API requests by HTTP status code. Non-2xx responses indicate API server issues, RBAC problems, or resource conflicts. Watch for 429 (throttled) and 5xx responses.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "axisSoftMin": 0,
                "fillOpacity": 100,
                "lineWidth": 1,
                "stacking": {
                  "mode": "normal"
                }
              },
              "unit": "ops"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 23
          },
          "id": 12,
          "options": {
            "legend": {
              "calcs": [
                "mean",
                "max"
              ],
              "displayMode": "table",
              "placement": "right",
              "showLegend": true,
              "sortBy": "Mean",
              "sortDesc": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "pluginVersion": "v11.4.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "exemplar": false,
              "expr": "sum(\n  rate(\n    argo_workflows_k8s_request_total{\n      cluster=\"$cluster\",\nnamespace=~\"$namespace\",\njob=~\"$job\"\n\n\n    }[$__rate_interval]\n  )\n) by (status_code)\n",
              "legendFormat": "{{ status_code }}"
            }
          ],
          "title": "K8s API Request Rate by Status Code",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "description": "Percentage of Kubernetes API requests succeeding. Drops here usually indicate API server issues, throttling, conflicts, or RBAC problems.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "axisSoftMax": 100,
                "axisSoftMin": 0,
                "fillOpacity": 10
              },
              "unit": "percent"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 23
          },
          "id": 13,
          "options": {
            "legend": {
              "calcs": [
                "mean",
                "max"
              ],
              "displayMode": "table",
              "placement": "right",
              "showLegend": true,
              "sortBy": "Mean",
              "sortDesc": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "pluginVersion": "v11.4.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "exemplar": false,
              "expr": "(\n  sum(\n    rate(\n      argo_workflows_k8s_request_total{\n        cluster=\"$cluster\",\nnamespace=~\"$namespace\",\njob=~\"$job\"\n\n,\n        status_code=~\"2..|101\"\n      }[$__rate_interval]\n    )\n  )\n  /\n  sum(\n    rate(\n      argo_workflows_k8s_request_total{\n        cluster=\"$cluster\",\nnamespace=~\"$namespace\",\njob=~\"$job\"\n\n\n      }[$__rate_interval]\n    )\n  )\n) * 100\n",
              "legendFormat": "Success Rate"
            }
          ],
          "title": "K8s API Success Rate",
          "type": "timeseries"
        },
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 31
          },
          "id": 14,
          "title": "Work Queues",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "description": "Current depth of controller work queues. Rising depth indicates the controller cannot keep up with incoming work. Persistently high values suggest scaling issues.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "axisSoftMin": 0,
                "fillOpacity": 100,
                "lineWidth": 1,
                "stacking": {
                  "mode": "normal"
                }
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 32
          },
          "id": 15,
          "options": {
            "legend": {
              "calcs": [
                "mean",
                "max"
              ],
              "displayMode": "table",
              "placement": "right",
              "showLegend": true,
              "sortBy": "Mean",
              "sortDesc": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "pluginVersion": "v11.4.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "exemplar": false,
              "expr": "sum(\n  argo_workflows_queue_depth_gauge{\n    cluster=\"$cluster\",\nnamespace=~\"$namespace\",\njob=~\"$job\"\n\n\n  }\n) by (queue_name)\n",
              "legendFormat": "{{ queue_name }}"
            }
          ],
          "title": "Queue Depth",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "description": "Items added per second to controller work queues. Spikes indicate bursts of workflow activity or reconciliation events.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "axisSoftMin": 0,
                "fillOpacity": 100,
                "lineWidth": 1,
                "stacking": {
                  "mode": "normal"
                }
              },
              "unit": "ops"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 32
          },
          "id": 16,
          "options": {
            "legend": {
              "calcs": [
                "mean",
                "max"
              ],
              "displayMode": "table",
              "placement": "right",
              "showLegend": true,
              "sortBy": "Mean",
              "sortDesc": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "pluginVersion": "v11.4.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "exemplar": false,
              "expr": "sum(\n  rate(\n    argo_workflows_queue_adds_count{\n      cluster=\"$cluster\",\nnamespace=~\"$namespace\",\njob=~\"$job\"\n\n\n    }[$__rate_interval]\n  )\n) by (queue_name)\n",
              "legendFormat": "{{ queue_name }}"
            }
          ],
          "title": "Queue Additions",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "description": "Time items wait in the queue before being processed. Rising latency indicates the controller is falling behind. High P95 values mean some items are waiting significantly longer than average.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "fillOpacity": 10
              },
              "unit": "s"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 40
          },
          "id": 17,
          "options": {
            "legend": {
              "calcs": [
                "mean",
                "max"
              ],
              "displayMode": "table",
              "placement": "right",
              "showLegend": true,
              "sortBy": "Mean",
              "sortDesc": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "pluginVersion": "v11.4.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "exemplar": false,
              "expr": "histogram_quantile(\n  0.5,\n  sum(\n    rate(\n      argo_workflows_queue_latency_bucket{\n        cluster=\"$cluster\",\nnamespace=~\"$namespace\",\njob=~\"$job\"\n\n\n      }[$__rate_interval]\n    )\n  ) by (le, queue_name)\n)\n",
              "legendFormat": "{{ queue_name }} P50"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "exemplar": false,
              "expr": "histogram_quantile(\n  0.95,\n  sum(\n    rate(\n      argo_workflows_queue_latency_bucket{\n        cluster=\"$cluster\",\nnamespace=~\"$namespace\",\njob=~\"$job\"\n\n\n      }[$__rate_interval]\n    )\n  ) by (le, queue_name)\n)\n",
              "legendFormat": "{{ queue_name }} P95"
            }
          ],
          "title": "Queue Latency",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "description": "Time taken to process each queue item. Rising duration indicates complex workflows or slow API responses. High P95 may cause cascading delays.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "fillOpacity": 10
              },
              "unit": "s"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 40
          },
          "id": 18,
          "options": {
            "legend": {
              "calcs": [
                "mean",
                "max"
              ],
              "displayMode": "table",
              "placement": "right",
              "showLegend": true,
              "sortBy": "Mean",
              "sortDesc": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "pluginVersion": "v11.4.0",
          "targets": [
