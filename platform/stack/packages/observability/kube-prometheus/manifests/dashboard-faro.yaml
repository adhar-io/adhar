# Faro collector Grafana dashboard (hand-written; no upstream dashboard exists
# for the Alloy faro.receiver). Built on faro_receiver_* metrics plus Alloy
# self-metrics scraped by observability/faro/manifests/servicemonitor.yaml
# (job="faro"). Panels use the default Prometheus datasource (uid "prometheus").
apiVersion: v1
kind: ConfigMap
metadata:
  name: adhar-dashboard-faro
  namespace: adhar-system
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: adhar-observability
  annotations:
    grafana_folder: "Platform"
data:
  faro.json: |
    {
      "uid": "adhar-faro",
      "title": "Adhar / Faro — Frontend Observability Collector",
      "tags": [
        "adhar",
        "faro",
        "observability",
        "alloy"
      ],
      "editable": true,
      "schemaVersion": 39,
      "version": 1,
      "timezone": "",
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "graphTooltip": 1,
      "annotations": {
        "list": []
      },
      "links": [],
      "templating": {
        "list": [
          {
            "name": "namespace",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "refresh": 2,
            "query": {
              "query": "label_values(faro_receiver_inflight_requests, namespace)",
              "refId": "namespace"
            },
            "sort": 1,
            "includeAll": true,
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "label": "Namespace",
            "regex": "",
            "allValue": ".*"
          },
          {
            "name": "pod",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "refresh": 2,
            "query": {
              "query": "label_values(faro_receiver_inflight_requests{namespace=~\"$namespace\"}, pod)",
              "refId": "pod"
            },
            "sort": 1,
            "includeAll": true,
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "label": "Pod",
            "regex": "",
            "allValue": ".*"
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Overview — Faro collector (Alloy faro.receiver)",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Collectors up",
          "description": "Number of faro-alloy pods being scraped successfully.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "textMode": "auto",
            "orientation": "auto",
            "wideLayout": true
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(up{job=\"faro\", namespace=~\"$namespace\"})",
              "legendFormat": "",
              "refId": "A",
              "range": false,
              "instant": true
            }
          ]
        },
        {
          "id": 3,
