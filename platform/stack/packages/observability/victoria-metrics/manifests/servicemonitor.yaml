# VictoriaMetrics (single) Prometheus ServiceMonitor
# Not emitted by the chart (server.serviceMonitor.enabled left default off).
# vmsingle serves vm_* metrics on the
# "victoria-metrics-victoria-metrics-single-server" Service, port 8428 named
# "http" at /metrics.
# Prometheus serviceMonitorSelector is empty ({}), so this is scraped as-is and
# feeds the VictoriaMetrics Grafana dashboards.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: victoria-metrics
  namespace: adhar-system
  labels:
    app.kubernetes.io/name: victoria-metrics-single
    app.kubernetes.io/instance: victoria-metrics
    app.kubernetes.io/managed-by: adhar
spec:
  jobLabel: app.kubernetes.io/name
  namespaceSelector:
    matchNames:
      - adhar-system
  selector:
    matchLabels:
      app.kubernetes.io/name: victoria-metrics-single
      app.kubernetes.io/instance: victoria-metrics
      app.kubernetes.io/component: server
  endpoints:
    - port: http
      path: /metrics
      interval: 60s
      scrapeTimeout: 30s
      honorLabels: true
