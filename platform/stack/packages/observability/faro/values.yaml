# Adhar overrides for grafana/alloy, deployed as a Grafana Faro collector.
#
# Faro is Grafana's frontend (browser) Real User Monitoring SDK; it has no
# Helm chart of its own. Browsers POST RUM data to Alloy's faro.receiver, which
# forwards logs to Loki and traces to Tempo. The receiver listens on port 12347
# and is exposed externally through the Cilium Gateway API HTTPRoute in
# manifests/httproute.yaml (browsers need a public endpoint).
alloy:
  # The chart's readiness probe defaults to timeoutSeconds: 1, which no package
  # may ship (TestNoProbeShipsAOneSecondTimeout); set here so a regeneration
  # keeps it.
  timeoutSeconds: 5
  configMap:
    create: true
    content: |
      // Loki needs at least one label per stream, and the dashboards select by
      // app and environment: an empty value is filled from the payload's own
      // field (app_name, app_environment, kind), so every browser event lands
      // as {source="faro", app_name, app_environment, kind}. Without them every
      // stream was label-less, which Loki either refuses or files under
      // service_name="unknown_service": unselectable per app either way.
      faro.receiver "default" {
        extra_log_labels = {
          source          = "faro",
          app_name        = "",
          app_environment = "",
          kind            = "",
        }
        server {
          listen_address = "0.0.0.0"
          listen_port    = 12347
          cors_allowed_origins = ["*"]
        }
        output {
          logs   = [loki.write.default.receiver]
          traces = [otelcol.exporter.otlp.tempo.input]
        }
      }

      loki.write "default" {
        endpoint {
          url = "http://loki.adhar-system.svc.cluster.local:3100/loki/api/v1/push"
        }
      }

      otelcol.exporter.otlp "tempo" {
        client {
          endpoint = "tempo.adhar-system.svc.cluster.local:4317"
          tls {
            insecure = true
          }
        }
      }

  # Expose the Faro receiver port on the Alloy Service so the HTTPRoute can
  # target it.
  extraPorts:
    - name: faro
      port: 12347
      targetPort: 12347
      protocol: TCP

# Faro is a stateless ingest endpoint; a single replica controller is fine.
controller:
  type: deployment
  replicas: 1
