# OpenCost UI routed through the Cilium Gateway (adhar-gateway). TLS terminates
# at the Gateway. The old nginx rewrite-target (/opencost/$2 with use-regex)
# preserved the /opencost prefix when forwarding to the backend, so no URLRewrite
# filter is needed here.
#
# SSO: every backend below is the Keycloak oauth2-proxy from sso.yaml, which
# forwards to the original upstream(s): opencost:9090.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: opencost
  namespace: adhar-system
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  parentRefs:
    - name: adhar-gateway
      namespace: adhar-system
  hostnames:
    - opencost.adhar.localtest.me
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: opencost-oauth2-proxy
          port: 4180
