# External access to the Pyroscope UI/API through the platform Gateway.
# In-cluster consumers (Grafana datasource, Alloy) use the Service directly.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pyroscope
  namespace: adhar-system
spec:
  parentRefs:
    - name: adhar-gateway
      namespace: adhar-system
  hostnames:
    - pyroscope.adhar.localtest.me
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: pyroscope
          port: 4040
