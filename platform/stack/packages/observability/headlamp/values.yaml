# Headlamp runs with NATIVE Keycloak OIDC (no oauth2-proxy): the login page's
# sign-in button runs the code flow against the `headlamp` client, and headlamp
# forwards the user's Keycloak token to the kube-apiserver on every cluster
# call. The Kind apiserver trusts the realm (kind.yaml.tmpl sets the oidc-*
# flags with the oidc: prefix), so per-user Kubernetes RBAC applies via the
# group bindings in keycloak's k8s-rbac.yaml (platform-admin -> cluster-admin,
# platform-developer -> edit, platform-viewer -> view).
#
# For token validation to work the apiserver (host netns on the node) must
# reach the issuer URL https://keycloak.<host>:8443. Three pieces make that
# true and all are required:
#   1. the Gateway's 8443 listener is pinned to node port 8443 (gateway.go);
#   2. Cilium socketLB is enabled (hack/cilium/values.yaml) so host-namespace
#      connects to node-port/cluster-IP services are translated;
#   3. the oidc-loopback-proxy DaemonSet (keycloak package) listens on the
#      node's 127.0.0.1:8443 and forwards to the Gateway, because
#      *.localtest.me resolves to 127.0.0.1 and Cilium does not translate
#      loopback node-port connects.
# If any of these regress, headlamp logins bounce back to the sign-in screen
# with every cluster call returning 401 (token validation fails when the
# apiserver cannot do OIDC discovery).
#
# The whole OIDC wiring below is FOLDED into these values so generate-manifests.sh
# reproduces manifests/install.yaml faithfully (no hand-patching after regen).
# The chart's `externalSecret` mode is deliberately NOT used: it renders
# `envFrom: secretRef: name: oidc` WITHOUT optional:true (headlamp would
# CreateContainerConfigError until the `oidc` secret exists — breaking cold
# bootstrap) and names env vars after the secret's data keys. Instead we drive
# the 4 OIDC env vars ourselves as OPTIONAL secretKeyRefs (see `env:` below);
# the chart auto-emits the matching `-oidc-*` args when it detects those env
# vars, and we add `-oidc-ca-file` / `-oidc-callback-url` via config.extraArgs.
config:
  oidc:
    # The chart's empty `oidc` Secret is intentionally not generated — the
    # ExternalSecret in manifests/oidc.yaml populates a Secret of the same name
    # from the keycloak `headlamp` client (keycloak-clients).
    secret:
      create: false
    # externalSecret mode is unusable here (non-optional envFrom breaks the
    # cold-boot tolerance below); drive OIDC via `env:` + extraArgs instead.
    externalSecret:
      enabled: false
  # Helm releases UI (adds `-enable-helm`). Safe, offline-friendly.
  enableHelm: true
  # Bundled static plugins (e.g. the Prometheus "Show metrics" plugin). Default,
  # kept explicit. NOT pluginsManager, which npm-installs plugins at boot and
  # breaks air-gapped/offline installs.
  staticPlugins:
    enabled: true
  extraArgs:
    # OIDC client-id, issuer and scopes are STATIC, known-ahead values, so they
    # are hardcoded here rather than sourced from the (optional) `oidc` Secret.
    # This is the durable fix for the "$(OIDC_ISSUER_URL)/.well-known/... :
    # unsupported protocol scheme" login error: Kubernetes only substitutes
    # $(VAR) when the env var is DEFINED, so when the Secret was absent at pod
    # start the issuer arg kept the LITERAL "$(OIDC_ISSUER_URL)" and discovery
    # died. With the issuer literal in args, discovery always works regardless of
    # Secret timing; only the client SECRET (below) is genuinely dynamic.
    - "-oidc-client-id=headlamp"
    - "-oidc-idp-issuer-url=https://keycloak.adhar.localtest.me:8443/realms/adhar"
    - "-oidc-scopes=openid,profile,email,groups"
    # Client secret is the one truly dynamic value — reference the env var below.
    # If the Secret is absent at start this arg is literal, but that only affects
    # the token exchange (not discovery/startup); oidc-reload.yaml restarts
    # headlamp once the Secret lands so the real secret is picked up.
    - "-oidc-client-secret=$(HEADLAMP_OIDC_CLIENT_SECRET)"
    # Discovery runs against the external issuer URL, which serves the
    # platform's self-signed certificate: hand headlamp the platform CA
    # explicitly (purpose-built flag; do not rely on the image's trust store).
    # Without it: "x509: certificate signed by unknown authority". The CA is
    # mounted from `adhar-cert` via the platform-ca volume below (optional, so
    # headlamp still boots if the cert is absent).
    - "-oidc-ca-file=/platform-ca/tls.crt"
    # Headlamp's OIDC callback path; must match a redirect URI on the keycloak
    # `headlamp` client.
    - "-oidc-callback-url=https://headlamp.adhar.localtest.me:8443/oidc-callback"

# Only the client SECRET is sourced from the ESO-populated `oidc` Secret. The
# env var is intentionally NOT named OIDC_* so the chart does not also auto-emit
# a duplicate `-oidc-client-secret` arg (we supply all -oidc-* args explicitly
# via config.extraArgs above). optional:true keeps headlamp booting on a cold
# cluster before Keycloak's realm job has produced keycloak-clients; the
# oidc-reload PostSync hook restarts it once the real secret lands.
env:
  - name: HEADLAMP_OIDC_CLIENT_SECRET
    valueFrom:
      secretKeyRef: {name: oidc, key: clientSecret, optional: true}

# Mount the self-signed platform CA (adhar-cert) at /platform-ca/tls.crt so OIDC
# discovery against the self-signed issuer works (-oidc-ca-file above).
# optional: headlamp still boots if the cert Secret is absent.
volumeMounts:
  - name: platform-ca
    mountPath: /platform-ca
    readOnly: true
volumes:
  - name: platform-ca
    secret:
      secretName: adhar-cert
      optional: true
      items: [{key: tls.crt, path: tls.crt}]
