# Headlamp UI on its own host (headlamp.adhar.localtest.me), served directly.
# Authentication is Headlamp-native OIDC against Keycloak: the login page's
# sign-in button runs the code flow, and the resulting Keycloak token is
# forwarded to the kube-apiserver, which trusts the realm — so Kubernetes RBAC
# applies per user/group (see keycloak's k8s-rbac.yaml).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: headlamp
  namespace: adhar-system
spec:
  parentRefs:
    - name: adhar-gateway
      namespace: adhar-system
  hostnames:
    - headlamp.adhar.localtest.me
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: headlamp
          port: 80
