spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: headlamp
      app.kubernetes.io/instance: headlamp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: headlamp
        app.kubernetes.io/instance: headlamp
    spec:
      serviceAccountName: headlamp
      volumes:
        - name: platform-ca
          secret:
            secretName: adhar-cert
            optional: true
            items: [{key: tls.crt, path: tls.crt}]
      automountServiceAccountToken: true
      hostUsers: true
      securityContext:
        {}
      containers:
        - name: headlamp
          securityContext:
            privileged: false
            runAsGroup: 101
            runAsNonRoot: true
            runAsUser: 100
          image: "ghcr.io/headlamp-k8s/headlamp:v0.43.0"
          imagePullPolicy: IfNotPresent
          
          env:
            # OIDC sign-in (keycloak `headlamp` client). The kube-apiserver
            # trusts the realm (kind.yaml.tmpl configures the oidc-* flags;
            # keycloak's k8s-rbac.yaml maps groups onto cluster roles), so the
            # user's Keycloak token is forwarded to the API server and per-user
            # RBAC applies: platform-admin -> cluster-admin, platform-developer
            # -> edit, platform-viewer -> view. Requires the issuer to be
            # reachable from the node's host namespace: Cilium socketLB plus
            # the apiserver-oidc-hosts DaemonSet (keycloak package).
            # optional: the `oidc` Secret is produced by ESO from the keycloak
            # `headlamp` client, which only exists once the whole SSO chain has
            # run (keycloak-db -> keycloak -> config job -> keycloak-clients).
            # Without `optional: true` headlamp cannot start until then —
            # CreateContainerConfigError on every fresh bootstrap, and forever
            # on installs with keycloak disabled. Empty values simply mean
            # "OIDC not configured" (headlamp starts and offers token auth);
            # it picks up SSO on its next restart after the Secret appears.
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef: {name: oidc, key: clientID, optional: true}
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef: {name: oidc, key: clientSecret, optional: true}
            - name: OIDC_ISSUER_URL
              valueFrom:
                secretKeyRef: {name: oidc, key: issuerURL, optional: true}
            - name: OIDC_SCOPES
              valueFrom:
                secretKeyRef: {name: oidc, key: scopes, optional: true}
          args:
            - "-in-cluster"
            - "-in-cluster-context-name=main"
            - "-oidc-client-id=$(OIDC_CLIENT_ID)"
            - "-oidc-client-secret=$(OIDC_CLIENT_SECRET)"
            - "-oidc-idp-issuer-url=$(OIDC_ISSUER_URL)"
            - "-oidc-scopes=$(OIDC_SCOPES)"
            # Discovery runs against the external issuer URL, which serves the
            # platform's self-signed certificate: hand headlamp the platform CA
            # explicitly (purpose-built flag; do not rely on the image's trust
            # store). Without it: "x509: certificate signed by unknown authority".
            - "-oidc-ca-file=/platform-ca/tls.crt"
            # Headlamp's OIDC callback path; must match a redirect URI on the
            # keycloak `headlamp` client.
            - "-oidc-callback-url=https://headlamp.adhar.localtest.me:8443/oidc-callback"
            - "-plugins-dir=/headlamp/plugins"
            - "-session-ttl=86400"
            # Check if externalSecret is disabled
          volumeMounts:
            - name: platform-ca
              mountPath: /platform-ca
              readOnly: true
          ports:
            - name: http
              containerPort: 4466
              protocol: TCP
          livenessProbe:
            httpGet:
              path: "/"
              port: http
              scheme: HTTP
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 1
            successThreshold: 1
            failureThreshold: 3
