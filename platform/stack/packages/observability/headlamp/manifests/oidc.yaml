# Populates the `oidc` Secret headlamp's deployment reads for its OIDC
# sign-in option, from the keycloak `headlamp` client.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: headlamp-oidc
  namespace: adhar-system
spec:
  secretStoreRef:
    name: keycloak
    kind: ClusterSecretStore
  # Explicit 1h: leaving refreshInterval unset means 0 = a single sync attempt
  # with no retry, so an ES created before the Keycloak realm job has written
  # keycloak-clients wedges as SecretSyncedError forever.
  # 10s, not 30s: this is the RETRY cadence until keycloak-clients exists, and
  # the wait is the platform's critical path — Keycloak's wave-20 config Job
  # writes that Secret and several apps cannot go Healthy until their own ES has
  # picked it up. At 30s each consumer could sit on a Secret that was already
  # there for half a minute; the whole GitOps phase is a chain of such waits.
  refreshInterval: 10s
  target:
    name: oidc
    template:
      engineVersion: v2
      data:
        clientID: headlamp
        clientSecret: "{{ .HEADLAMP_CLIENT_SECRET }}"
        issuerURL: https://keycloak.adhar.localtest.me:8443/realms/adhar
        # groups: the id_token must carry the groups claim so the API server
        # (oidc-groups-claim=groups) maps users onto the k8s-rbac.yaml bindings.
        scopes: openid,profile,email,groups
  data:
    - secretKey: HEADLAMP_CLIENT_SECRET
      remoteRef:
        key: keycloak-clients
        property: HEADLAMP_CLIENT_SECRET
