# Populates the `oidc` Secret headlamp's deployment reads for its OIDC
# sign-in option, from the keycloak `headlamp` client.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: headlamp-oidc
  namespace: adhar-system
spec:
  secretStoreRef:
    name: keycloak
    kind: ClusterSecretStore
  # Explicit 1h: leaving refreshInterval unset means 0 = a single sync attempt
  # with no retry, so an ES created before the Keycloak realm job has written
  # keycloak-clients wedges as SecretSyncedError forever.
  refreshInterval: 1h
  target:
    name: oidc
    template:
      engineVersion: v2
      data:
        clientID: headlamp
        clientSecret: "{{ .HEADLAMP_CLIENT_SECRET }}"
        issuerURL: https://keycloak.adhar.localtest.me:8443/realms/adhar
        # groups: the id_token must carry the groups claim so the API server
        # (oidc-groups-claim=groups) maps users onto the k8s-rbac.yaml bindings.
        scopes: openid,profile,email,groups
  data:
    - secretKey: HEADLAMP_CLIENT_SECRET
      remoteRef:
        key: keycloak-clients
        property: HEADLAMP_CLIENT_SECRET
