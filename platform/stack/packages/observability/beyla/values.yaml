# Adhar overrides for grafana/beyla.
# Beyla is an eBPF auto-instrumentation agent deployed as a DaemonSet. It has no
# web UI, so no Gateway API HTTPRoute is required. Telemetry is exported to the
# in-cluster Alloy OTLP endpoint.
config:
  create: true
  data:
    discovery:
      # Instrument APPLICATION workloads only. Platform components in
      # adhar-system (and the system namespaces) already ship their own
      # exporters/ServiceMonitors, and eBPF-instrumenting ~50 platform pods
      # per node made Beyla grow past 3 GiB and OOM-loop on dense control-plane
      # nodes — for RED metrics nothing else was collecting. On data planes
      # (where applications run, ADR-0023) every namespace is instrumented.
      services:
        - k8s_namespace: .
      exclude_services:
        - k8s_namespace: ^(adhar-system|kube-system|kube-public|kube-node-lease|local-path-storage|cilium-secrets|adhar-environments|kargo-.*|dp-.*)$
        - k8s_deployment_name: ^(alloy|beyla|prometheus.*|loki.*|tempo.*|mimir.*|hubble.*|cilium.*)$
      # Go-specific tracers attach uprobes into every Go binary; the generic
      # kernel probes give the same HTTP/gRPC RED metrics at a fraction of the
      # memory (only Go library-level spans such as sql/kafka are omitted).
      skip_go_specific_tracers: true
    attributes:
      kubernetes:
        enable: true
    otel_metrics_export:
      endpoint: http://alloy.adhar-system.svc.cluster.local:4318
    otel_traces_export:
      endpoint: http://alloy.adhar-system.svc.cluster.local:4318

# eBPF auto-instrumentation runs on every node with no chart default for
# resources; unbounded it became the recurring SystemOOM victim/trigger on a
# fully loaded 16 GiB worker (node flapping NotReady, Gitea cache lost, ArgoCD
# unable to fetch). Bound it so the kernel evicts Beyla, not the node.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    # 1Gi OOM-looped beyla (exit 137) on every node of a busy cluster; the cap
    # still protects the node but now sits above beyla's real usage.
    memory: 2Gi
