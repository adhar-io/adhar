# Minimal single-node Mimir for the local platform. The chart's defaults are a
# production-grade distributed topology (3-zone ingesters/store-gateways,
# Kafka ingest storage, multi-replica query path — ~20 pods), which starves a
# single-node Kind cluster. This profile collapses everything to one replica
# with classic (non-Kafka) ingest and replication factor 1; MinIO stays as the
# object store. Alloy remote_writes to mimir-distributor:8080; Grafana queries
# mimir-query-frontend:8080/prometheus.
# Classic ingest path (direct remote_write to ingesters) — the chart's
# default Kafka-based ingest-storage architecture is a whole Kafka StatefulSet
# we don't want on a single node.
kafka:
  enabled: false

# The S3 keys reach every component as env (global.extraEnvFrom — the chart
# has no `mimir.extraEnvFrom`; a value there renders nothing, and every
# component then hits the store as an anonymous client: "Access Denied" on the
# 2026-09-15 bring-up) and are expanded into mimir.yaml by config.expand-env.
global:
  extraEnvFrom:
    - secretRef:
        name: mimir-s3-credentials

mimir:
  extraArgs:
    config.expand-env: "true"
  structuredConfig:
    # Classic ingest: kafka.enabled=false removes the Kafka StatefulSet, but
    # the rendered mimir.yaml still defaults to the ingest-storage
    # architecture — without this, every ingester/distributor crashloops with
    # "invalid ingest storage config: the Kafka address has not been
    # configured".
    ingest_storage:
      enabled: false
    common:
      storage:
        backend: s3
        # The platform RustFS, not the chart's bundled MinIO. RustFS is the
        # primary S3 store and MinIO is disabled in every profile (ADR-0011:
        # never bundle a capability the platform already provides). Keys are the
        # platform root-creds, mirrored into Secret mimir-s3-credentials and
        # expanded from env at start (extraArgs config.expand-env), as Loki does.
        s3:
          endpoint: rustfs.adhar-system.svc.cluster.local:9000
          insecure: true
          region: us-east-1
          access_key_id: ${S3_ACCESS_KEY}
          secret_access_key: ${S3_SECRET_KEY}
    blocks_storage:
      s3:
        bucket_name: mimir-blocks
    ruler_storage:
      s3:
        bucket_name: mimir-ruler
    alertmanager_storage:
      s3:
        bucket_name: mimir-alertmanager
    ingester:
      # Chart 6.x disables the ingester Push gRPC method assuming Kafka
      # ingest-storage carries writes; with classic ingest the distributor
      # still pushes over gRPC, and Mimir refuses to start with the method
      # disabled ("cannot disable Push gRPC method in ingester, while ingest
      # storage is not enabled").
      push_grpc_method_enabled: true
      ring:
        replication_factor: 1
        zone_awareness_enabled: false
    store_gateway:
      sharding_ring:
        replication_factor: 1
        zone_awareness_enabled: false

ingester:
  replicas: 1
  zoneAwareReplication:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi
store_gateway:
  replicas: 1
  zoneAwareReplication:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
distributor:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
querier:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
query_frontend:
  replicas: 1
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
query_scheduler:
  replicas: 1
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
compactor:
  replicas: 1
  resources:
    requests:
      cpu: 25m
      memory: 256Mi
ruler:
  enabled: false
alertmanager:
  enabled: false
overrides_exporter:
  enabled: false
rollout_operator:
  enabled: false
gateway:
  replicas: 1
  resources:
    requests:
      cpu: 25m
      memory: 64Mi

minio:
  # Bundled MinIO OFF — object storage is the platform RustFS (see
  # mimir.structuredConfig.common.storage.s3).
  enabled: false

# Local profile: no meta-monitoring or dashboards from this chart —
# kube-prometheus owns Grafana and scraping.
metaMonitoring:
  serviceMonitor:
    enabled: false
  grafanaAgent:
    enabled: false
nginx:
  enabled: false
# Recreate: this Deployment owns a ReadWriteOnce volume, so a RollingUpdate can
# never schedule its replacement (the volume stays attached to the old pod's
# node) and every change parked the new pod in ContainerCreating for good.
