# Mimir's object-store credential: the platform root-creds under the env names
# the structuredConfig expands (`${S3_ACCESS_KEY}` / `${S3_SECRET_KEY}`).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mimir-s3-credentials
  namespace: adhar-system
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: gitea
    kind: ClusterSecretStore
  target:
    name: mimir-s3-credentials
    creationPolicy: Owner
  data:
    - secretKey: S3_ACCESS_KEY
      remoteRef: {key: root-creds, property: rootUser}
    - secretKey: S3_SECRET_KEY
      remoteRef: {key: root-creds, property: rootPassword}
