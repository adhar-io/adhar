# Mimir Prometheus ServiceMonitor
# Not emitted by the chart (metaMonitoring.serviceMonitor.enabled left default
# off). Every Mimir component Service (compactor, distributor, ingester,
# querier, query-frontend, query-scheduler, store-gateway) exposes cortex_*
# metrics on port 8080 named "http-metrics" at /metrics. Excluded:
#   - the *-headless Services (label prometheus.io/service-monitor="false"),
#     which select the same pods and would duplicate targets;
#   - mimir-gateway, an nginx front door with no /metrics;
#   - mimir-gossip-ring, which has no http-metrics port anyway;
#   - mimir-minio (different label set entirely).
# The relabelings mirror the chart's own ServiceMonitor so the Mimir mixin
# dashboards (job="<namespace>/<component>", cluster label) match.
# Prometheus serviceMonitorSelector is empty ({}), so this is scraped as-is and
# feeds the Mimir Overview Grafana dashboards.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  name: mimir
  namespace: adhar-system
  labels:
    app.kubernetes.io/name: mimir
    app.kubernetes.io/instance: mimir
    app.kubernetes.io/managed-by: adhar
spec:
  namespaceSelector:
    matchNames:
      - adhar-system
  selector:
    matchLabels:
      app.kubernetes.io/name: mimir
      app.kubernetes.io/instance: mimir
    matchExpressions:
      - key: prometheus.io/service-monitor
        operator: NotIn
        values:
          - "false"
      - key: app.kubernetes.io/component
        operator: NotIn
        values:
          - gateway
          - gossip-ring
  endpoints:
    - port: http-metrics
      path: /metrics
      interval: 60s
      scrapeTimeout: 30s
      honorLabels: true
      relabelings:
        - sourceLabels: [__meta_kubernetes_service_label_app_kubernetes_io_component]
          action: replace
          replacement: adhar-system/$1
          targetLabel: job
        - action: replace
          replacement: mimir
          targetLabel: cluster
