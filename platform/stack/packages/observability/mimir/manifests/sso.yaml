# Keycloak SSO in front of Mimir (same pattern as Nexus/Tekton/Harbor): the
# UI is gated by an oauth2-proxy using the `mimir` Keycloak client, which is
# provisioned generically from the labelled ConfigMap below by the keycloak
# package (config Job + 5-minute client-reconcile CronJob) and whose secret
# arrives via ESO from keycloak-clients (MIMIR_CLIENT_SECRET).
# The oidc-issuer-url auto-discovers Keycloak's endpoints via
# /.well-known/openid-configuration. The HTTPRoute (sync-wave 6) points at
# mimir-oauth2-proxy:4180; the proxy forwards to http://mimir-distributor.adhar-system.svc.cluster.local:8080.
# Machine-facing (SSO_BEARER=1): besides the browser login, requests carrying a
# Keycloak-issued bearer access token for the `mimir` client (client_credentials
# with MIMIR_CLIENT_SECRET from keycloak-clients) pass straight through.
#
# GENERATED by hack/gen-sso.sh — regenerate rather than hand-edit:
#   SSO_BEARER=1 hack/gen-sso.sh platform/stack/packages/observability/mimir mimir mimir-distributor 8080
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mimir-keycloak-client
  namespace: adhar-system
  labels:
    # Picked up by the keycloak package's client reconciler (see
    # security/keycloak/manifests/keycloak-config.yaml, configure.sh).
    adhar.io/keycloak-client: "true"
    app.kubernetes.io/name: mimir-keycloak-client
    app.kubernetes.io/part-of: mimir
  # Wave 0: a ConfigMap is healthy instantly and blocks nothing; the earlier
  # it exists, the sooner the reconciler exports the client secret the
  # wave-5 proxy waits on.
  annotations: {argocd.argoproj.io/sync-wave: "0"}
data:
  # Keep "description" under 255 chars (Keycloak varchar; longer fails with 500).
  client.json: |
    {
      "protocol": "openid-connect",
      "clientId": "mimir",
      "name": "Mimir Client",
      "description": "Used for Mimir SSO via oauth2-proxy",
      "publicClient": false,
      "authorizationServicesEnabled": false,
      "serviceAccountsEnabled": true,
      "implicitFlowEnabled": false,
      "directAccessGrantsEnabled": true,
      "standardFlowEnabled": true,
      "frontchannelLogout": true,
      "redirectUris": ["https://mimir.adhar.localtest.me:8443/oauth2/callback"],
      "webOrigins": ["https://mimir.adhar.localtest.me:8443"],
      "protocolMappers": [
        {
          "name": "self-audience",
          "protocol": "openid-connect",
          "protocolMapper": "oidc-audience-mapper",
          "config": {
            "included.custom.audience": "mimir",
            "id.token.claim": "false",
            "access.token.claim": "true"
          }
        }
      ]
    }
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: mimir-oauth2-cookie
  namespace: adhar-system
  # Wave 5: the SSO front-end deploys AFTER the app core (wave 0-3). Otherwise
  # this oauth2-proxy — which waits on a Keycloak-provisioned ExternalSecret —
  # sits unhealthy at wave 0 and blocks the core from ever deploying.
  annotations: {argocd.argoproj.io/sync-wave: "5"}
spec:
  length: 32
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mimir-oauth2-proxy
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "5"}
spec:
  refreshPolicy: CreatedOnce
  refreshInterval: 5m
  secretStoreRef:
    name: keycloak
    kind: ClusterSecretStore
  target:
    name: mimir-oauth2-proxy
    template:
      engineVersion: v2
      data:
        OAUTH2_PROXY_CLIENT_SECRET: "{{ .MIMIR_CLIENT_SECRET }}"
        OAUTH2_PROXY_COOKIE_SECRET: "{{ .COOKIE_SECRET }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: mimir-oauth2-cookie
      rewrite:
        - transform:
            template: "COOKIE_SECRET"
  data:
    - secretKey: MIMIR_CLIENT_SECRET
      remoteRef:
        key: keycloak-clients
        property: MIMIR_CLIENT_SECRET
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mimir-oauth2-proxy
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "5"}
  labels:
    app.kubernetes.io/name: mimir-oauth2-proxy
    app.kubernetes.io/part-of: mimir
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mimir-oauth2-proxy
  template:
    metadata:
      labels:
        app: mimir-oauth2-proxy
    spec:
      enableServiceLinks: false
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1
          args:
            - --http-address=0.0.0.0:4180
            - --provider=oidc
            - --oidc-issuer-url=https://keycloak.adhar.localtest.me:8443/realms/adhar
            - --ssl-insecure-skip-verify=true
            - --client-id=mimir
            - --redirect-url=https://mimir.adhar.localtest.me:8443/oauth2/callback
            - --upstream=http://mimir-distributor.adhar-system.svc.cluster.local:8080
            - --email-domain=*
            - --scope=openid profile email groups
            - --cookie-secure=true
            - --skip-provider-button=true
            - --reverse-proxy=true
            # Forward the authenticated identity (X-Forwarded-User/Email/
            # Preferred-Username) so apps with header/proxy auth can use it.
            - --pass-user-headers=true
            # Machine clients (workload-cluster spokes) authenticate with a
            # Keycloak bearer access token instead of the browser login flow:
            #   POST https://keycloak.<host>/realms/adhar/protocol/openid-connect/token
            #        grant_type=client_credentials client_id=mimir client_secret=<MIMIR_CLIENT_SECRET>
            - --skip-jwt-bearer-tokens=true
          envFrom:
            - secretRef:
                name: mimir-oauth2-proxy
          ports:
            - name: http
              containerPort: 4180
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
          readinessProbe:
            httpGet:
              path: /ping
              port: 4180
            initialDelaySeconds: 5
            timeoutSeconds: 10
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: mimir-oauth2-proxy
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "5"}
  labels:
    app.kubernetes.io/name: mimir-oauth2-proxy
    app.kubernetes.io/part-of: mimir
spec:
  selector:
    app: mimir-oauth2-proxy
  ports:
    - name: http
      port: 4180
      targetPort: 4180
