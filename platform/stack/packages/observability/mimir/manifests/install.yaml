# Minio provides post-install hook to create bucket
# however the hook won't be executed if helm install is run
# with --wait flag. Hence this job is a workaround for that.
# See https://github.com/grafana/mimir/issues/2464
apiVersion: batch/v1
kind: Job
metadata:
  name: mimir-make-minio-buckets-5.4.0
  namespace: "adhar-system"
  labels:
    app: mimir-distributed-make-bucket-job
    chart: mimir-distributed-6.0.6
    release: mimir
    heritage: Helm
spec:
  template:
    metadata:
      labels:
        app: mimir-distributed-job
        release: mimir
    spec:
      restartPolicy: OnFailure      
      volumes:
        - name: minio-configuration
          projected:
            sources:
            - configMap:
                name: mimir-minio
            - secret:
                name: mimir-minio
      containers:
      - name: minio-mc
        image: "quay.io/minio/mc:RELEASE.2024-11-21T17-21-54Z"
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "/config/initialize"]
        env:
          - name: MINIO_ENDPOINT
            value: mimir-minio
          - name: MINIO_PORT
            value: "9000"
        volumeMounts:
          - name: minio-configuration
            mountPath: /config
        resources:
          requests:
            memory: 128Mi
