# Loki Prometheus ServiceMonitor
# Not emitted by the chart (monitoring.serviceMonitor.enabled left default
# off). The single-binary StatefulSet serves loki_* metrics on the "loki"
# Service, port 3100 named "http-metrics" at /metrics. The "loki-headless"
# Service (label variant=headless) selects the same pods and is excluded to
# avoid duplicate targets; "loki-memberlist" has no http-metrics port.
# The relabelings mirror the chart's own ServiceMonitor so the Loki mixin
# dashboards (job="<namespace>/<service>", cluster label) match.
# Prometheus serviceMonitorSelector is empty ({}), so this is scraped as-is and
# feeds the Loki Grafana dashboards (loki, loki-reads, loki-writes, ...).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: loki
  namespace: adhar-system
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/instance: loki
    app.kubernetes.io/managed-by: adhar
spec:
  namespaceSelector:
    matchNames:
      - adhar-system
  selector:
    matchLabels:
      app.kubernetes.io/name: loki
      app.kubernetes.io/instance: loki
    matchExpressions:
      - key: variant
        operator: DoesNotExist
      - key: prometheus.io/service-monitor
        operator: NotIn
        values:
          - "false"
  endpoints:
    - port: http-metrics
      path: /metrics
      interval: 60s
      scrapeTimeout: 30s
      honorLabels: true
      relabelings:
        - sourceLabels: [job]
          action: replace
          replacement: adhar-system/$1
          targetLabel: job
        - action: replace
          replacement: loki
          targetLabel: cluster
