# Ingestion route for workload-cluster spokes (roadmap P2.3): Alloy agents on
# workload clusters ship to this hostname through the platform Gateway.
# In-cluster consumers keep using the Service directly.
#
# SSO: every backend below is the Keycloak oauth2-proxy from sso.yaml, which
# forwards to the original upstream(s): loki:3100.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: loki
  namespace: adhar-system
  annotations:
    # After the oauth2-proxy (sso.yaml, wave 5): ArgoCD holds a wave until its
    # resources are healthy, and a route whose backend Service does not exist
    # yet is Degraded (ResolvedRefs=False) — at an earlier wave that deadlocks
    # the sync on a fresh cluster and the proxy is never created.
    argocd.argoproj.io/sync-wave: "6"
spec:
  parentRefs:
    - name: adhar-gateway
      namespace: adhar-system
  hostnames:
    - loki.adhar.localtest.me
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: loki-oauth2-proxy
          port: 4180
