# Loki 3.x (grafana/loki chart) in SingleBinary mode for the local platform.
# Replaces the deprecated loki-stack chart (Loki 2.6.1): log collection is
# Alloy's job (loki.source.kubernetes -> loki.write), so no fluent-bit here.
# The Service keeps the name `loki` on :3100 — Alloy's HUB_LOKI_URL, the
# HTTPRoute and the Grafana datasource all point at it.
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  # Chunks and index live in the platform MinIO (bucket `loki`, provisioned by
  # data/minio/values.yaml) instead of the pod's volume: a filesystem store fills
  # its PVC within days on a full-profile cluster and Loki then stops ingesting.
  # Credentials come from the loki-s3-credentials ExternalSecret
  # (manifests/platform-storage.yaml), expanded at start-up (-config.expand-env).
  storage:
    type: s3
    bucketNames:
      chunks: loki
      ruler: loki
      admin: loki
    s3:
      endpoint: http://minio.adhar-system.svc.cluster.local:9000
      region: us-east-1
      s3ForcePathStyle: true
      insecure: true
      accessKeyId: ${MINIO_ACCESS_KEY_ID}
      secretAccessKey: ${MINIO_SECRET_ACCESS_KEY}
  compactor:
    retention_enabled: true
    delete_request_store: s3
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: index_
          period: 24h
  limits_config:
    # Grafana's "logs volume" panel queries /loki/api/v1/index/volume;
    # without this it shows "Log volume has not been configured".
    volume_enabled: true
    allow_structured_metadata: true
    # The chart default (4 MB/s) drops lines from the busier namespaces on a
    # full-profile cluster ("ingestion rate limit exceeded for user fake").
    ingestion_rate_mb: 32
    ingestion_burst_size_mb: 64
    per_stream_rate_limit: 8MB
    per_stream_rate_limit_burst: 16MB
    retention_period: 720h

singleBinary:
  replicas: 1
  extraArgs:
    - -config.expand-env=true
  extraEnvFrom:
    - secretRef:
        name: loki-s3-credentials
  persistence:
    enabled: true
    size: 10Gi
  # Sized for the ingestion limits set above, not for the chart's defaults.
  # One process runs every Loki target (-target=all) and now buffers chunks in
  # memory until they flush to MinIO, so 32 MB/s of accepted ingest does not fit
  # in the 1 GiB the chart ships: on the verified cluster loki-0 was OOMKilled
  # (exit 137) 18 times in five hours. Raise the ingestion limits and this
  # together, never one without the other.
  resources:
    requests:
      cpu: 200m
      memory: 1Gi
    limits:
      memory: 4Gi

# Zero out the scalable-mode targets; SingleBinary carries everything.
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

# No nginx gateway in front — clients hit the `loki` Service directly.
gateway:
  enabled: false

# Local-profile trimming: no canary, no helm test, no memcached tiers.
lokiCanary:
  enabled: false
test:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false

monitoring:
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false
  serviceMonitor:
    enabled: false

sidecar:
  rules:
    enabled: false
