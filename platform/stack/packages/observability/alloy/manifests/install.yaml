---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: alloy
  labels:
    helm.sh/chart: alloy-1.12.1
    app.kubernetes.io/name: alloy
    app.kubernetes.io/instance: alloy
    app.kubernetes.io/version: v1.19.2
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: alloy
    app.kubernetes.io/component: rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: alloy
subjects:
- kind: ServiceAccount
  name: alloy
  namespace: adhar-system
---
apiVersion: v1
kind: Service
metadata:
  name: alloy
  namespace: adhar-system
  labels:
    helm.sh/chart: alloy-1.12.1
    app.kubernetes.io/name: alloy
    app.kubernetes.io/instance: alloy
    app.kubernetes.io/version: v1.19.2
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: alloy
    app.kubernetes.io/component: networking
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/instance: alloy
  internalTrafficPolicy: Cluster
  ports:
  - name: http-metrics
    port: 12345
    targetPort: 12345
    protocol: TCP
  - name: otlp-grpc
    port: 4317
    targetPort: 4317
    protocol: TCP
  - name: otlp-http
    port: 4318
    targetPort: 4318
    protocol: TCP
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: alloy
  namespace: adhar-system
  labels:
    helm.sh/chart: alloy-1.12.1
    app.kubernetes.io/name: alloy
    app.kubernetes.io/instance: alloy
    app.kubernetes.io/version: v1.19.2
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: alloy
spec:
  minReadySeconds: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: alloy
      app.kubernetes.io/instance: alloy
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: alloy
      labels:
        app.kubernetes.io/name: alloy
        app.kubernetes.io/instance: alloy
    spec:
      serviceAccountName: alloy
      containers:
      - name: alloy
        image: docker.io/grafana/alloy:v1.19.2
        imagePullPolicy: IfNotPresent
        args:
        - run
        - /etc/alloy/config.alloy
        - --storage.path=/tmp/alloy
        - --server.http.listen-addr=0.0.0.0:12345
        - --server.http.ui-path-prefix=/
        - --stability.level=generally-available
        env:
        - name: ALLOY_DEPLOY_MODE
          value: helm
        - name: HOSTNAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: K8S_NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        envFrom:
        - configMapRef:
            name: observability-hub
        ports:
        - containerPort: 12345
          name: http-metrics
        - containerPort: 4317
          name: otlp-grpc
          protocol: TCP
        - containerPort: 4318
          name: otlp-http
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /-/ready
            port: 12345
            scheme: HTTP
          initialDelaySeconds: 10
          timeoutSeconds: 5
        volumeMounts:
        - name: config
          mountPath: /etc/alloy
        # Measured, not guessed. alloy requested 50Mi and used 980-1120Mi on
        # every node of a live cluster (2026-10-13) — a DaemonSet, so ~6.6 GiB
        # cluster-wide against 300Mi declared. An agent's footprint scales with
        # the targets it scrapes and the logs it tails, and this platform gives
        # it several hundred pods.
        #
        # Understated requests are not a cosmetic problem: the scheduler places
        # by REQUESTS, so it packed nodes it believed were nearly empty, those
        # nodes then ran out of real memory, and the kubelet and containerd were
        # starved by pods the scheduler never accounted for. Cluster-wide the
        # gap was 34.6 GiB.
        resources:
          requests:
            cpu: 100m
            memory: 768Mi
          limits:
            memory: 1536Mi
      - name: config-reloader
        image: quay.io/prometheus-operator/prometheus-config-reloader:v0.91.0@sha256:7d9e4eea5f1139e602508871f422b0116c60e87c662f3dcd234d5ab60cd0d8c1
        imagePullPolicy: IfNotPresent
        args:
        - --watched-dir=/etc/alloy
        - --reload-url=http://localhost:12345/-/reload
        volumeMounts:
        - name: config
          mountPath: /etc/alloy
        # The reloader watches one directory and POSTs a reload; ~10 MiB.
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 65534
          runAsNonRoot: true
          runAsUser: 65534
          seccompProfile:
            type: RuntimeDefault
      dnsPolicy: ClusterFirst
      volumes:
      - name: config
        configMap:
          name: alloy
