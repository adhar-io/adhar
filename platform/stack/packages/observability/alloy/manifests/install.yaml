data:
  config.alloy: "logging {\n\tlevel  = \"info\"\n\tformat = \"logfmt\"\n}\n\ndiscovery.kubernetes\
    \ \"pods\" {\n\trole = \"pod\"\n\t// Namespace labels as __meta_kubernetes_namespace_label_*:\
    \ the pod-log\n\t// relabels read adhar.io/plane and adhar.io/environment|team|project\n\
    \t// from the namespace, which is where the control plane stamps them.\n\tattach_metadata\
    \ {\n\t\tnamespace = true\n\t}\n}\n\n// Pod discovery only. Node/service/endpoints/endpointslice/ingress\n\
    // discovery was declared here (2026-08-16) and referenced by nothing,\n// yet\
    \ Alloy runs every declared component: each agent held five more\n// cluster-wide\
    \ watches and caches \u2014 50 idle API-server watches across\n// the DaemonSet\
    \ (2026-11-03). Declare one when a pipeline consumes it.\n\n// ---------------------------------------------------------------\n\
    // Hub shipping (roadmap P2.3): everything collected here is written\n// to the\
    \ observability hub. Endpoints come from the observability-hub\n// ConfigMap (envFrom)\
    \ \u2014 adhar-controlplane service URLs on the hub itself,\n// external Gateway\
    \ URLs on workload-cluster spokes. Every sample and\n// stream carries the cluster\
    \ label for hub-side separation.\n// ---------------------------------------------------------------\n\
    prometheus.scrape \"annotated_pods\" {\n\ttargets    = discovery.relabel.scrape_pods.output\n\
    \tforward_to = [prometheus.remote_write.hub.receiver]\n\n\t// Discovery is cluster-wide:\
    \ each target is scraped by ONE agent\n\t// (alloy.clustering.enabled), not by\
    \ every agent in the DaemonSet.\n\tclustering {\n\t\tenabled = true\n\t}\n}\n\n\
    discovery.relabel \"scrape_pods\" {\n\ttargets = discovery.kubernetes.pods.targets\n\
    \trule {\n\t\tsource_labels = [\"__meta_kubernetes_pod_annotation_prometheus_io_scrape\"\
    ]\n\t\tregex         = \"true\"\n\t\taction        = \"keep\"\n\t}\n\trule {\n\
    \t\tsource_labels = [\"__meta_kubernetes_namespace\"]\n\t\ttarget_label  = \"\
    namespace\"\n\t}\n\trule {\n\t\tsource_labels = [\"__meta_kubernetes_pod_name\"\
    ]\n\t\ttarget_label  = \"pod\"\n\t}\n}\n\nprometheus.remote_write \"hub\" {\n\t\
    endpoint {\n\t\turl = sys.env(\"HUB_MIMIR_URL\")\n\t}\n\texternal_labels = {\n\
    \t\tcluster = sys.env(\"HUB_CLUSTER_NAME\"),\n\t}\n}\n\n// Carry the Kubernetes\
    \ identity of every log stream: without these\n// relabels Loki only gets job/instance,\
    \ making namespace/pod filtering\n// (and Grafana's log volume breakdowns) useless.\n\
    discovery.relabel \"pod_logs\" {\n\ttargets = discovery.kubernetes.pods.targets\n\
    \trule {\n\t\tsource_labels = [\"__meta_kubernetes_namespace\"]\n\t\ttarget_label\
    \  = \"namespace\"\n\t}\n\trule {\n\t\tsource_labels = [\"__meta_kubernetes_pod_name\"\
    ]\n\t\ttarget_label  = \"pod\"\n\t}\n\trule {\n\t\tsource_labels = [\"__meta_kubernetes_pod_container_name\"\
    ]\n\t\ttarget_label  = \"container\"\n\t}\n\trule {\n\t\tsource_labels = [\"__meta_kubernetes_pod_node_name\"\
    ]\n\t\ttarget_label  = \"node\"\n\t}\n\trule {\n\t\tsource_labels = [\"__meta_kubernetes_pod_label_app_kubernetes_io_name\"\
    , \"__meta_kubernetes_pod_label_app\"]\n\t\tseparator     = \"\"\n\t\ttarget_label\
    \  = \"app\"\n\t}\n\t// Custom applications: tie every stream in a WORKLOAD namespace\
    \ to the\n\t// application, component and environment it belongs to, so one Grafana\n\
    \t// dashboard can filter a team's logs without knowing pod names. Each rule\n\
    \t// is gated on the namespace label adhar.io/plane=workload \u2014 a platform\n\
    \t// stream matches none of them and keeps exactly the labels it had.\n\t// The\
    \ owner is app.kubernetes.io/instance (CNPG \"<app>-db\", Strimzi\n\t// \"<app>-events\"\
    ), else the `app` label (\"<app>\", \"<app>-cache\").\n\trule {\n\t\tsource_labels\
    \ = [\"__meta_kubernetes_namespace_label_adhar_io_plane\", \"__meta_kubernetes_pod_label_app_kubernetes_io_instance\"\
    , \"__meta_kubernetes_pod_label_app\"]\n\t\tseparator     = \";\"\n\t\tregex \
    \        = \"workload;([^;]+);.*\"\n\t\ttarget_label  = \"__tmp_adhar_owner\"\n\
    \t}\n\trule {\n\t\tsource_labels = [\"__meta_kubernetes_namespace_label_adhar_io_plane\"\
    , \"__meta_kubernetes_pod_label_app_kubernetes_io_instance\", \"__meta_kubernetes_pod_label_app\"\
    ]\n\t\tseparator     = \";\"\n\t\tregex         = \"workload;;(.+)\"\n\t\ttarget_label\
    \  = \"__tmp_adhar_owner\"\n\t}\n\t// \"<app>-db\" \u2192 application <app>, component\
    \ db; a bare \"<app>\" is the\n\t// application's own workload (component app).\n\
    \trule {\n\t\tsource_labels = [\"__tmp_adhar_owner\"]\n\t\tregex         = \"\
    (.+?)(-(db|cache|events))?\"\n\t\ttarget_label  = \"adhar_application\"\n\t}\n\
    \trule {\n\t\tsource_labels = [\"__tmp_adhar_owner\"]\n\t\tregex         = \"\
    .+\"\n\t\ttarget_label  = \"adhar_component\"\n\t\treplacement   = \"app\"\n\t\
    }\n\trule {\n\t\tsource_labels = [\"__tmp_adhar_owner\"]\n\t\tregex         =\
    \ \".+-(db|cache|events)\"\n\t\ttarget_label  = \"adhar_component\"\n\t}\n\t//\
    \ Explicit pod labels win over the derivation.\n\trule {\n\t\tsource_labels =\
    \ [\"__meta_kubernetes_namespace_label_adhar_io_plane\", \"__meta_kubernetes_pod_label_adhar_io_application\"\
    ]\n\t\tseparator     = \";\"\n\t\tregex         = \"workload;(.+)\"\n\t\ttarget_label\
    \  = \"adhar_application\"\n\t}\n\trule {\n\t\tsource_labels = [\"__meta_kubernetes_namespace_label_adhar_io_plane\"\
    , \"__meta_kubernetes_pod_label_adhar_io_component\"]\n\t\tseparator     = \"\
    ;\"\n\t\tregex         = \"workload;(.+)\"\n\t\ttarget_label  = \"adhar_component\"\
    \n\t}\n\t// Environment, team and project come from the NAMESPACE (one value per\n\
    \t// namespace), via discovery.kubernetes \"pods\" attach_metadata.namespace.\n\
    \trule {\n\t\tsource_labels = [\"__meta_kubernetes_namespace_label_adhar_io_plane\"\
    , \"__meta_kubernetes_namespace_label_adhar_io_environment\"]\n\t\tseparator \
    \    = \";\"\n\t\tregex         = \"workload;(.+)\"\n\t\ttarget_label  = \"adhar_environment\"\
    \n\t}\n\trule {\n\t\tsource_labels = [\"__meta_kubernetes_namespace_label_adhar_io_plane\"\
    , \"__meta_kubernetes_namespace_label_adhar_io_team\"]\n\t\tseparator     = \"\
    ;\"\n\t\tregex         = \"workload;(.+)\"\n\t\ttarget_label  = \"adhar_team\"\
    \n\t}\n\trule {\n\t\tsource_labels = [\"__meta_kubernetes_namespace_label_adhar_io_plane\"\
    , \"__meta_kubernetes_namespace_label_adhar_io_project\"]\n\t\tseparator     =\
    \ \";\"\n\t\tregex         = \"workload;(.+)\"\n\t\ttarget_label  = \"adhar_project\"\
    \n\t}\n}\n\nloki.source.kubernetes \"pods\" {\n\ttargets    = discovery.relabel.pod_logs.output\n\
    \tforward_to = [loki.write.hub.receiver]\n\n\t// Each tailed container is a follow\
    \ stream THROUGH the API server.\n\t// Without clustering every agent tailed every\
    \ container in the\n\t// cluster: 10 agents x 463 containers = 4,607 open pods/log\
    \ streams\n\t// held by kube-apiserver (2026-11-03). Now one agent per container.\n\
    \tclustering {\n\t\tenabled = true\n\t}\n}\n\nloki.write \"hub\" {\n\tendpoint\
    \ {\n\t\turl = sys.env(\"HUB_LOKI_URL\")\n\t}\n\texternal_labels = {\n\t\tcluster\
    \ = sys.env(\"HUB_CLUSTER_NAME\"),\n\t}\n}\n\n// Application OTLP (:4317 gRPC,\
    \ :4318 HTTP \u2014 every workload's\n// OTEL_EXPORTER_OTLP_ENDPOINT) is NOT received\
    \ here: the OpenTelemetry\n// Engine (`alloy otel`, the otel-engine container\
    \ in this pod, configured\n// by the alloy-otel-engine ConfigMap) owns those ports\
    \ and ships traces to\n// Tempo and metrics to Mimir itself. This engine keeps\
    \ what it is built\n// for: pull-based scraping, pod logs and clustering.\n//\n\
    // The Engine's component bundle has no Loki exporter, so OTLP LOGS cross\n//\
    \ back to this engine over the pod's loopback and leave through the same\n// loki.write\
    \ as the pod-log tailer: the same stream labels and the same\n// cluster label\
    \ as before the split. 127.0.0.1 only \u2014 nothing outside\n// the pod can reach\
    \ this receiver, and it never contends for :4317.\notelcol.receiver.otlp \"otel_engine_logs\"\
    \ {\n\tgrpc {\n\t\tendpoint = \"127.0.0.1:14317\"\n\t}\n\toutput {\n\t\tlogs =\
    \ [otelcol.exporter.loki.otel_engine_logs.input]\n\t}\n}\n\n// OTLP logs \u2192\
    \ Loki, same stream labels as the pod-log tailer.\notelcol.exporter.loki \"otel_engine_logs\"\
    \ {\n\tforward_to = [loki.write.hub.receiver]\n}"
