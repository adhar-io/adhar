# Source: alloy/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy
  namespace: adhar-system
  labels:
    helm.sh/chart: alloy-1.8.2
    app.kubernetes.io/name: alloy
    app.kubernetes.io/instance: alloy
    app.kubernetes.io/version: "v1.16.1"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: alloy
    app.kubernetes.io/component: config
data:
  config.alloy: |-
    logging {
    	level  = "info"
    	format = "logfmt"
    }
    
    discovery.kubernetes "pods" {
    	role = "pod"
    }
    
    discovery.kubernetes "nodes" {
    	role = "node"
    }
    
    discovery.kubernetes "services" {
    	role = "service"
    }
    
    discovery.kubernetes "endpoints" {
    	role = "endpoints"
    }
    
    discovery.kubernetes "endpointslices" {
    	role = "endpointslice"
    }
    
    discovery.kubernetes "ingresses" {
    	role = "ingress"
    }

    // ---------------------------------------------------------------
    // Hub shipping (roadmap P2.3): everything collected here is written
    // to the observability hub. Endpoints come from the observability-hub
    // ConfigMap (envFrom) — in-cluster service URLs on the hub itself,
    // external Gateway URLs on workload-cluster spokes. Every sample and
    // stream carries the cluster label for hub-side separation.
    // ---------------------------------------------------------------
    prometheus.scrape "annotated_pods" {
    	targets    = discovery.relabel.scrape_pods.output
    	forward_to = [prometheus.remote_write.hub.receiver]
    }

    discovery.relabel "scrape_pods" {
    	targets = discovery.kubernetes.pods.targets
    	rule {
    		source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_scrape"]
    		regex         = "true"
    		action        = "keep"
    	}
    	rule {
    		source_labels = ["__meta_kubernetes_namespace"]
    		target_label  = "namespace"
    	}
    	rule {
    		source_labels = ["__meta_kubernetes_pod_name"]
    		target_label  = "pod"
    	}
    }

    prometheus.remote_write "hub" {
    	endpoint {
    		url = sys.env("HUB_MIMIR_URL")
    	}
    	external_labels = {
    		cluster = sys.env("HUB_CLUSTER_NAME"),
    	}
    }

    loki.source.kubernetes "pods" {
    	targets    = discovery.kubernetes.pods.targets
    	forward_to = [loki.write.hub.receiver]
    }

    loki.write "hub" {
    	endpoint {
    		url = sys.env("HUB_LOKI_URL")
    	}
    	external_labels = {
    		cluster = sys.env("HUB_CLUSTER_NAME"),
    	}
    }

    otelcol.receiver.otlp "workloads" {
    	grpc {
    		endpoint = "0.0.0.0:4317"
    	}
    	http {
    		endpoint = "0.0.0.0:4318"
    	}
    	output {
    		traces = [otelcol.exporter.otlphttp.hub.input]
    	}
    }

    otelcol.exporter.otlphttp "hub" {
    	client {
    		endpoint = sys.env("HUB_TEMPO_URL")
    		tls {
    			insecure_skip_verify = true
    		}
    	}
    }
