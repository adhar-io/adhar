# Alloy Prometheus ServiceMonitor
# Not emitted by the chart (serviceMonitor.enabled left default off).
# The Alloy DaemonSet exposes its self-metrics (alloy_component_*,
# prometheus_remote_write_*, loki_write_*, otelcol_*) on the "alloy" Service,
# port 12345 named "http-metrics" at /metrics. The OTLP ports on the same
# Service are not named http-metrics and are therefore skipped.
# Prometheus serviceMonitorSelector is empty ({}), so this is scraped as-is and
# feeds the Adhar / Alloy Grafana dashboard.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: alloy
  namespace: adhar-system
  labels:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/instance: alloy
    app.kubernetes.io/managed-by: adhar
spec:
  jobLabel: app.kubernetes.io/name
  namespaceSelector:
    matchNames:
      - adhar-system
  selector:
    matchLabels:
      app.kubernetes.io/name: alloy
      app.kubernetes.io/instance: alloy
      app.kubernetes.io/component: networking
  endpoints:
    - port: http-metrics
      path: /metrics
      interval: 60s
      scrapeTimeout: 30s
      honorLabels: true
