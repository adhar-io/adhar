# Adhar marketplace contract for the alloy package.
# Validated against platform/stack/packages/marketplace.schema.json
# (run: hack/validate-packages.sh). See MARKETPLACE.md for the contract.
apiVersion: marketplace.adhar.io/v1alpha1
kind: AdharPackage
name: alloy
category: observability
version: 1.8.2          # tracks the grafana/alloy Helm chart version (generate-manifests.sh)
appVersion: v1.16.1     # Grafana Alloy application version
description: Grafana Alloy telemetry collector that discovers Kubernetes pods, nodes and services and ships logs to Loki.
maintainer:
  name: Adhar Platform Team
  url: https://github.com/adhar-io/adhar
  firstParty: true
license: Apache-2.0
homepage: https://grafana.com/docs/alloy
adharCompatibility:
  minVersion: 0.0.1
  notes: Ships collected logs to http://loki-gateway/loki/api/v1/push (tenant_id 1).
dependencies:
  # Alloy pushes logs to the Loki gateway; without loki-stack the pipeline has no sink.
  - name: loki-stack
    category: observability
provenance:
  sourceRepo: https://github.com/adhar-io/adhar
  upstreamChart: grafana/alloy
  signed: true
  cosignKeyless: true          # GoReleaser Cosign keyless (Sigstore Fulcio + Rekor), ADR-0019
  scanned: true
  scanner: trivy
  sbom: sbom/alloy.spdx.json
planeAffinity: data-plane      # runs as a per-node agent collecting node/pod telemetry
stability: stable
resources:
  cpu: 200m
  memory: 256Mi
  storage: "0"
  footprint: minimal
  localSafe: true
keywords:
  - observability
  - telemetry
  - logs
  - collector
  - grafana
