# Keycloak SSO in front of Litmus (same pattern as Nexus/Tekton/Harbor): the
# UI is gated by an oauth2-proxy using the `litmus` Keycloak client, which is
# provisioned generically from the labelled ConfigMap below by the keycloak
# package (config Job + 5-minute client-reconcile CronJob) and whose secret
# arrives via ESO from keycloak-clients (LITMUS_CLIENT_SECRET).
# The oidc-issuer-url auto-discovers Keycloak's endpoints via
# /.well-known/openid-configuration. The HTTPRoute (sync-wave 6) points at
# litmus-oauth2-proxy:4180; the proxy forwards to http://litmus-frontend-service.adhar-system.svc.cluster.local:9091.
#
# GENERATED by hack/gen-sso.sh — regenerate rather than hand-edit:
#   hack/gen-sso.sh platform/stack/packages/application/litmus litmus litmus-frontend-service 9091
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: litmus-keycloak-client
  namespace: adhar-system
  labels:
    # Picked up by the keycloak package's client reconciler (see
    # security/keycloak/manifests/keycloak-config.yaml, configure.sh).
    adhar.io/keycloak-client: "true"
    app.kubernetes.io/name: litmus-keycloak-client
    app.kubernetes.io/part-of: litmus
  # Wave 0: a ConfigMap is healthy instantly and blocks nothing; the earlier
  # it exists, the sooner the reconciler exports the client secret the
  # wave-5 proxy waits on.
  annotations: {argocd.argoproj.io/sync-wave: "0"}
data:
  # Keep "description" under 255 chars (Keycloak varchar; longer fails with 500).
  client.json: |
    {
      "protocol": "openid-connect",
      "clientId": "litmus",
      "name": "Litmus Client",
      "description": "Used for Litmus SSO via oauth2-proxy",
      "publicClient": false,
      "authorizationServicesEnabled": false,
      "serviceAccountsEnabled": false,
      "implicitFlowEnabled": false,
      "directAccessGrantsEnabled": true,
      "standardFlowEnabled": true,
      "frontchannelLogout": true,
      "redirectUris": ["https://litmus.adhar.localtest.me:8443/oauth2/callback"],
      "webOrigins": ["https://litmus.adhar.localtest.me:8443"]
    }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litmus-oauth2-proxy
  namespace: adhar-system
  # Wave 5: the SSO front-end deploys AFTER the app core (wave 0-3). Otherwise
  # this oauth2-proxy — which waits on a Keycloak-provisioned ExternalSecret —
  # sits unhealthy at wave 0 and blocks the core from ever deploying.
  annotations: {argocd.argoproj.io/sync-wave: "5"}
spec:
  refreshPolicy: CreatedOnce
  refreshInterval: 30s
  secretStoreRef:
    name: keycloak
    kind: ClusterSecretStore
  target:
    name: litmus-oauth2-proxy
    template:
      engineVersion: v2
      data:
        OAUTH2_PROXY_CLIENT_SECRET: "{{ .LITMUS_CLIENT_SECRET }}"
        OAUTH2_PROXY_COOKIE_SECRET: "{{ .COOKIE_SECRET }}"
  data:
    - secretKey: LITMUS_CLIENT_SECRET
      remoteRef:
        key: keycloak-clients
        property: LITMUS_CLIENT_SECRET
    # The platform-wide cookie secret (security/keycloak/manifests/sso-cookie.yaml).
    # One secret for every proxy because one secret is easier to operate than 29 —
    # NOT to share sessions: each proxy sets its own --cookie-name below.
    - secretKey: COOKIE_SECRET
      remoteRef:
        key: adhar-sso-cookie
        property: COOKIE_SECRET
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litmus-oauth2-proxy
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "5"}
  labels:
    app.kubernetes.io/name: litmus-oauth2-proxy
    app.kubernetes.io/part-of: litmus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litmus-oauth2-proxy
  template:
    metadata:
      labels:
        app: litmus-oauth2-proxy
    spec:
      enableServiceLinks: false
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1
          args:
            - --http-address=0.0.0.0:4180
            - --provider=oidc
            - --oidc-issuer-url=https://keycloak.adhar.localtest.me:8443/realms/adhar
            - --ssl-insecure-skip-verify=true
            - --client-id=litmus
            - --redirect-url=https://litmus.adhar.localtest.me:8443/oauth2/callback
            - --upstream=http://litmus-frontend-service.adhar-system.svc.cluster.local:9091
            - --email-domain=*
            - --scope=openid profile email groups
            - --cookie-secure=true
            # A cookie name UNIQUE to this app, and deliberately no
            # --cookie-domain. Every proxy once shared the default name on the
            # parent domain with a shared secret, which meant each one decrypted
            # and reused the others' sessions: Argo CD received a token minted for
            # the tekton client and rejected it with 'expected audience "argocd"
            # got ["tekton"]', and whichever app you opened last overwrote the
            # rest. Single sign-on comes from Keycloak's own session instead: with
            # no cookie of its own this proxy bounces through Keycloak, which
            # already knows the user and returns a code immediately, so the user
            # sees no login screen and this app gets a token with its own audience.
            - --cookie-name=_adhar_sso_litmus
            - --whitelist-domain=.adhar.localtest.me:8443
            - --skip-provider-button=true
            - --reverse-proxy=true
            # Forward the authenticated identity (X-Forwarded-User/Email/
            # Preferred-Username) so apps with header/proxy auth can use it.
            - --pass-user-headers=true
          envFrom:
            - secretRef:
                name: litmus-oauth2-proxy
          ports:
            - name: http
              containerPort: 4180
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
          readinessProbe:
            httpGet:
              path: /ping
              port: 4180
            initialDelaySeconds: 5
            timeoutSeconds: 10
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: litmus-oauth2-proxy
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "5"}
  labels:
    app.kubernetes.io/name: litmus-oauth2-proxy
    app.kubernetes.io/part-of: litmus
spec:
  selector:
    app: litmus-oauth2-proxy
  ports:
    - name: http
      port: 4180
      targetPort: 4180
