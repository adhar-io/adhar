apiVersion: litmuschaos.io/v1alpha1
description:
  message: "Kills a container belonging to an application pod \n"
kind: ChaosExperiment
metadata:
  name: container-kill
  labels:
    app.kubernetes.io/component: kubernetes-chaos
    app.kubernetes.io/instance: litmus
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: k8s
    app.kubernetes.io/part-of: k8s
    app.kubernetes.io/version: 3.31.0
    helm.sh/chart: kubernetes-chaos-3.31.0
    litmuschaos.io/version: 3.31.0
  annotations:
    argocd.argoproj.io/sync-wave: '2'
spec:
  definition:
    scope: Namespaced
    permissions:
    - apiGroups:
      - ''
      - apps
      - batch
      - apps.openshift.io
      - argoproj.io
      - litmuschaos.io
      resources:
      - jobs
      - pods
      - pods/log
      - events
      - replicationcontrollers
      - deployments
      - statefulsets
      - daemonsets
      - replicasets
      - deploymentconfigs
      - rollouts
      - pods/exec
      - chaosengines
      - chaosexperiments
      - chaosresults
      verbs:
      - create
      - list
      - get
      - update
      - patch
      - delete
      - deletecollection
    image: litmuschaos.docker.scarf.sh/litmuschaos/go-runner:3.31.0
    imagePullPolicy: Always
    args:
    - -c
    - ./experiments -name container-kill
    command:
    - /bin/bash
    env:
    - name: TARGET_CONTAINER
      value: ''
    - name: RAMP_TIME
      value: ''
    - name: CHAOS_INTERVAL
      value: '10'
    - name: SIGNAL
      value: SIGKILL
    - name: TOTAL_CHAOS_DURATION
      value: '20'
    - name: SOCKET_PATH
      value: /run/containerd/containerd.sock
    - name: CONTAINER_RUNTIME
      value: containerd
    - name: LIB_IMAGE
      value: litmuschaos.docker.scarf.sh/litmuschaos/go-runner:3.31.0
    - name: TARGET_PODS
      value: ''
    - name: PODS_AFFECTED_PERC
      value: ''
    - name: SEQUENCE
      value: parallel
    labels:
      name: container-kill
      app.kubernetes.io/part-of: litmus
      app.kubernetes.io/runtime-api-usage: 'true'

