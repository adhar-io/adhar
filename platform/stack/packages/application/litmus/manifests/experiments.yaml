      value: GKE
    - name: PROJECT_ID
      value: ''
    - name: LIB
      value: litmus
    - name: NODE_NAME
      value: ''
    - name: DISK_NAME
      value: ''
    - name: ZONE_NAME
      value: ''
    - name: DEVICE_NAME
      value: ''
    labels:
      name: disk-loss
      app.kubernetes.io/part-of: litmus
    secrets:
    - name: cloud-secret
      mountPath: /tmp/

