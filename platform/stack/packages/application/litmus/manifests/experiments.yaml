  definition:
    scope: Cluster
    permissions:
    - apiGroups:
      - ''
      - batch
      - litmuschaos.io
      resources:
      - jobs
      - pods
      - events
      - pods/log
      - secrets
      - chaosengines
      - chaosexperiments
      - chaosresults
      verbs:
      - create
      - list
      - get
      - patch
      - update
      - delete
    image: litmuschaos.docker.scarf.sh/litmuschaos/ansible-runner:3.31.0
