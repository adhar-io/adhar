---
apiVersion: v1
kind: ConfigMap
metadata:
  name: litmus-frontend-nginx-configuration
  namespace: adhar-system
  labels:
    app.kubernetes.io/instance: litmus
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: litmus
    app.kubernetes.io/part-of: litmus
    app.kubernetes.io/version: 3.30.0
    helm.sh/chart: litmus-3.30.0
    litmuschaos.io/version: 3.30.0
    app.kubernetes.io/component: litmus-admin-config
  annotations:
    argocd.argoproj.io/sync-wave: '3'
data:
  nginx.conf: "pid /tmp/nginx.pid;\n\nevents {\n  worker_connections  1024;\n}\n\n\
    http {\n    map $http_upgrade $connection_upgrade {\n        default upgrade;\n\
    \        '' close;\n    }\n\n    client_body_temp_path /tmp/client_temp;\n   \
    \ proxy_temp_path       /tmp/proxy_temp_path;\n    fastcgi_temp_path     /tmp/fastcgi_temp;\n\
    \    uwsgi_temp_path       /tmp/uwsgi_temp;\n    scgi_temp_path        /tmp/scgi_temp;\n\
    \n    sendfile on;\n    tcp_nopush on;\n    tcp_nodelay on;\n    keepalive_timeout\
    \ 65;\n    types_hash_max_size 2048;\n    server_tokens off;\n\n    include /etc/nginx/mime.types;\n\
    \n    gzip on;\n    gzip_disable \"msie6\";\n\n    access_log /var/log/nginx/access.log;\n\
    \    error_log /var/log/nginx/error.log;\n\n    server {\n        listen 8185;\n\
    \        server_name  default_server;\n        root   /opt/chaos;\n\n        location\
    \ /health {\n          return 200;\n        }\n\n        location / {\n      \
    \      proxy_http_version 1.1;\n            add_header Cache-Control \"no-cache\"\
    ;\n            try_files $uri /index.html;\n            autoindex on;\n      \
    \  }\n\n        # redirect server error pages to the static page /50x.html\n \
    \       #\n        error_page   500 502 503 504  /50x.html;\n        location\
    \ = /50x.html {\n            root   /usr/share/nginx/html;\n        }\n\n    \
    \    location /auth/ {\n            proxy_pass \"http://litmus-auth-server-service:9003/\"\
    ;\n            proxy_http_version 1.1;\n            proxy_set_header   Host  \
    \               $host;\n            proxy_set_header   X-Real-IP            $remote_addr;\n\
    \            proxy_set_header   X-Forwarded-For      $proxy_add_x_forwarded_for;\n\
    \            proxy_set_header   X-Forwarded-Proto    $scheme;\n        }\n\n \
    \       location /api/ {\n            proxy_pass \"http://litmus-server-service:9002/\"\
    ;\n            proxy_http_version 1.1;\n            proxy_set_header   Host  \
    \               $host;\n            proxy_set_header   X-Real-IP            $remote_addr;\n\
    \            proxy_set_header   X-Forwarded-For      $proxy_add_x_forwarded_for;\n\
    \            proxy_set_header   X-Forwarded-Proto    $scheme;\n            proxy_set_header\
    \   Upgrade              $http_upgrade;\n            proxy_set_header   Connection\
    \           $connection_upgrade;\n        }\n    }\n}\n"

