---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litmus-auth-server
  namespace: adhar-system
  labels:
    app.kubernetes.io/component: litmus-auth-server
    app.kubernetes.io/instance: litmus
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: litmus
    app.kubernetes.io/part-of: litmus
    app.kubernetes.io/version: 3.30.0
    helm.sh/chart: litmus-3.30.0
    litmuschaos.io/version: 3.30.0
  annotations:
    argocd.argoproj.io/sync-wave: '3'
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: litmus-auth-server
  template:
    metadata:
      labels:
        app.kubernetes.io/component: litmus-auth-server
        app.kubernetes.io/instance: litmus
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: litmus
        app.kubernetes.io/part-of: litmus
        app.kubernetes.io/version: 3.30.0
        helm.sh/chart: litmus-3.30.0
        litmuschaos.io/version: 3.30.0
    spec:
      automountServiceAccountToken: false
      initContainers:
      - name: wait-for-mongodb
        image: litmuschaos.docker.scarf.sh/litmuschaos/mongo:6
        imagePullPolicy: Always
        command:
        - /bin/bash
        - -c
        env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: litmus-admin-secret
              key: DB_PASSWORD
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: litmus-admin-secret
              key: DB_USER
        - name: DB_SERVER
          valueFrom:
            configMapKeyRef:
              name: litmus-admin-config
              key: DB_SERVER
        args:
        - until  [[ $(mongosh -u ${DB_USER} -p ${DB_PASSWORD} ${DB_SERVER} --eval
          'rs.status()' | grep 'ok' | wc -l) -eq 1 ]]; do sleep 5; echo 'Waiting for
          the MongoDB to be ready...'; done; echo 'Connection with MongoDB established'
        resources:
          limits:
            cpu: 250m
            ephemeral-storage: 1Gi
            memory: 256Mi
          requests:
            cpu: 25m
            ephemeral-storage: 500Mi
            memory: 64Mi
        securityContext: {}
      containers:
      - name: auth-server
        image: litmuschaos.docker.scarf.sh/litmuschaos/litmusportal-auth-server:3.30.0
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: auth-server
        - containerPort: 3030
          name: auth-rpc-server
        resources:
          limits:
            cpu: 500m
            ephemeral-storage: 1Gi
            memory: 512Mi
          requests:
            cpu: 25m
            ephemeral-storage: 500Mi
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 2000
        envFrom:
        - secretRef:
            name: litmus-admin-secret
        - configMapRef:
            name: litmus-admin-config
        env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: litmus-admin-secret
              key: DB_PASSWORD
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: litmus-admin-secret
              key: DB_USER
        - name: LITMUS_GQL_GRPC_ENDPOINT
          value: litmus-server-service
        - name: LITMUS_GQL_GRPC_PORT
          value: '8000'
        - name: ENABLE_INTERNAL_TLS
          value: 'false'
        - name: REST_PORT
          value: '3000'
        - name: GRPC_PORT
          value: '3030'
        - name: ALLOWED_ORIGINS
          value: .*
        - name: HTTP_PROXY
          value: ''
        - name: HTTPS_PROXY
          value: ''
        - name: NO_PROXY
          value: ''
        volumeMounts: null
      volumes: null
      enableServiceLinks: false

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litmus-frontend
  namespace: adhar-system
  labels:
    app.kubernetes.io/component: litmus-frontend
    app.kubernetes.io/instance: litmus
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: litmus
    app.kubernetes.io/part-of: litmus
    app.kubernetes.io/version: 3.30.0
    helm.sh/chart: litmus-3.30.0
    litmuschaos.io/version: 3.30.0
  annotations:
    argocd.argoproj.io/sync-wave: '3'
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: litmus-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/component: litmus-frontend
        app.kubernetes.io/instance: litmus
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: litmus
        app.kubernetes.io/part-of: litmus
        app.kubernetes.io/version: 3.30.0
        helm.sh/chart: litmus-3.30.0
        litmuschaos.io/version: 3.30.0
    spec:
      automountServiceAccountToken: false
      volumes:
      - name: nginx-config
        configMap:
          name: litmus-frontend-nginx-configuration
      containers:
      - name: litmusportal-frontend
        image: litmuschaos.docker.scarf.sh/litmuschaos/litmusportal-frontend:3.30.0
        imagePullPolicy: Always
        resources:
          limits:
            cpu: 500m
            ephemeral-storage: 1Gi
            memory: 512Mi
          requests:
            cpu: 25m
            ephemeral-storage: 500Mi
            memory: 128Mi
        securityContext: null
        livenessProbe:
          httpGet:
            path: /
            port: http
            scheme: HTTP
          failureThreshold: 5
          initialDelaySeconds: 30
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /
            port: http
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 10
        ports:
        - containerPort: 8185
          name: http
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
      enableServiceLinks: false

