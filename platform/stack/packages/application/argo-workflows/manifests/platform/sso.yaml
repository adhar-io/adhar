# Single sign-on for the native Argo Workflows UI (docs/design/0026 §5.4, D-11).
#
# The native UI is a power tool for PLATFORM STAFF. Teams use the console, which
# reaches the engine with the caller's own identity (§4.4). argo-server has no
# per-user impersonation: with `sso.rbac.enabled` it maps a signed-in user to the
# first ServiceAccount (highest `rbac-rule-precedence`) in its own namespace whose
# `workflows.argoproj.io/rbac-rule` matches the user's claims, and makes every API
# call with THAT account's token. So the accounts below hold Argo objects and pods
# — nothing else, and never cluster-admin (TestArgoSSOMapsNoGroupToClusterAdmin).
# The platform-admin mapping used to be bound to cluster-admin through a long-lived
# token Secret (manifests/dev/sa-admin.yaml, deleted with this file's arrival).
#
#   platform-admin, platform-engineer      -> argo-sso-platform (operate)
#   platform-developer, platform-viewer    -> argo-sso-viewer   (read)
#   anyone else (ws-team-*, org-*)         -> no rule matches -> access denied
#
# Token Secrets: argo-server reads `<account>.service-account-token` (upstream SSO
# RBAC since Kubernetes 1.24). Each grants only what its account holds.
---
# The OIDC client credential (Keycloak client `argo-workflows`, written into
# keycloak-clients by Keycloak's config Job). Named for this package, not the
# generic `keycloak-oidc`, which is one collision away in a shared namespace.
#
# Wave 15: after the controller (10), which does not need it, and before
# argo-server (20), which does not start without it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argo-workflows-sso
  namespace: adhar-system
  labels:
    app.kubernetes.io/name: argo-workflows
    app.kubernetes.io/component: sso
  annotations:
    argocd.argoproj.io/sync-wave: "15"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshPolicy: CreatedOnce
  # 10s, not 30s: the retry cadence while keycloak-clients does not exist yet,
  # which is the platform's SSO critical path.
  refreshInterval: 10s
  secretStoreRef:
    name: keycloak
    kind: ClusterSecretStore
  target:
    name: argo-workflows-sso
    creationPolicy: Owner
  data:
    - secretKey: client-id
      remoteRef:
        key: keycloak-clients
        property: ARGO_WORKFLOWS_CLIENT_ID
    - secretKey: client-secret
      remoteRef:
        key: keycloak-clients
        property: ARGO_WORKFLOWS_CLIENT_SECRET
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argo-sso-platform
  namespace: adhar-system
  labels:
    app.kubernetes.io/name: argo-workflows
    app.kubernetes.io/component: sso
  annotations:
    workflows.argoproj.io/rbac-rule: "'platform-admin' in groups || 'platform-engineer' in groups"
    workflows.argoproj.io/rbac-rule-precedence: "10"
---
apiVersion: v1
kind: Secret
metadata:
  name: argo-sso-platform.service-account-token
  namespace: adhar-system
  labels:
    app.kubernetes.io/name: argo-workflows
    app.kubernetes.io/component: sso
  annotations:
    kubernetes.io/service-account.name: argo-sso-platform
type: kubernetes.io/service-account-token
---
# Operate every workflow on the cluster: submit, retry (which deletes the failed
# nodes' pods), resubmit, suspend, resume, stop, terminate, approve; read pods,
# their logs and events. Nothing outside argoproj.io and those pods.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: adhar-argo-platform-operator
  labels:
    app.kubernetes.io/name: argo-workflows
    app.kubernetes.io/component: sso
rules:
  - apiGroups: [argoproj.io]
    resources:
      - workflows
      - workflowtemplates
      - cronworkflows
      - workfloweventbindings
      - workflowtaskresults
      - clusterworkflowtemplates
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods, pods/log, events]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: adhar-argo-platform-operator
  labels:
    app.kubernetes.io/name: argo-workflows
    app.kubernetes.io/component: sso
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: adhar-argo-platform-operator
subjects:
  - kind: ServiceAccount
    name: argo-sso-platform
    namespace: adhar-system
---
# argo-server opens an artifact with the CALLER's client: it reads the repository's
# credential Secret as the signed-in user's account (server/artifacts). adhar-system's
# repository (artifacts.yaml) reads `root-creds`, so the operator account may get
# that one Secret there and nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: adhar-argo-platform-artifacts
  namespace: adhar-system
  labels:
    app.kubernetes.io/name: argo-workflows
    app.kubernetes.io/component: sso
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [root-creds]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: adhar-argo-platform-artifacts
  namespace: adhar-system
  labels:
    app.kubernetes.io/name: argo-workflows
    app.kubernetes.io/component: sso
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: adhar-argo-platform-artifacts
subjects:
  - kind: ServiceAccount
    name: argo-sso-platform
    namespace: adhar-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argo-sso-viewer
  namespace: adhar-system
  labels:
    app.kubernetes.io/name: argo-workflows
    app.kubernetes.io/component: sso
  annotations:
    workflows.argoproj.io/rbac-rule: "'platform-viewer' in groups || 'platform-developer' in groups"
    workflows.argoproj.io/rbac-rule-precedence: "5"
---
apiVersion: v1
kind: Secret
metadata:
  name: argo-sso-viewer.service-account-token
  namespace: adhar-system
  labels:
    app.kubernetes.io/name: argo-workflows
    app.kubernetes.io/component: sso
  annotations:
    kubernetes.io/service-account.name: argo-sso-viewer
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: adhar-argo-viewer
  labels:
    app.kubernetes.io/name: argo-workflows
    app.kubernetes.io/component: sso
rules:
  - apiGroups: [argoproj.io]
    resources:
      - workflows
      - workflowtemplates
      - cronworkflows
      - workfloweventbindings
      - workflowtaskresults
      - clusterworkflowtemplates
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods, pods/log, events]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: adhar-argo-viewer
  labels:
    app.kubernetes.io/name: argo-workflows
    app.kubernetes.io/component: sso
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: adhar-argo-viewer
subjects:
  - kind: ServiceAccount
    name: argo-sso-viewer
    namespace: adhar-system
