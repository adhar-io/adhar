# Argo Workflows as the platform runs it — the Argo CD element's manifestPath
# (docs/design/0026 §5). Both profiles use this one overlay; local differs only
# in being disabled by default.
#
#   ../base             GENERATED upstream install + minimal CRDs (generate-manifests.sh)
#   ../platform-tasks   the platform's own operational WorkflowTemplates and CronWorkflows
#   ../catalog          the platform step catalogue (ClusterWorkflowTemplates)
#
# Files ending in .yaml.tmpl are rendered to .yaml when the stack is staged into
# Gitea (stageStack); this kustomization names the RENDERED files.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
  - ../platform-tasks
  - ../catalog
  - sso.yaml
  - httproute.yaml
  - archive-db.yaml
  - artifacts.yaml
  - metrics.yaml
  - rules.yaml
  - networkpolicy.yaml
  - policies.yaml
patches:
  - path: workflow-controller-configmap.yaml
  - path: controller-patch.yaml
  - path: server-patch.yaml
