# Strapi's database and its generated secrets.
#
# Strapi is a framework, not a finished product: its deployable artifact is
# normally an application YOU scaffold and build. This package runs the
# platform's own prebuilt one (ghcr.io/adhar-io/strapi, see install.yaml), with
# content types and uploads on the PVC. That makes "give me a CMS" one click; a
# production CMS with custom content types in Git is the golden path instead
# (scaffold a repo, app-ci builds your own image), and the contract says so.
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: strapi-db
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "-2"}
spec:
  length: 28
  digits: 5
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# The database credential. `refreshInterval: '0'` generates it once: a rotating
# password would break a running Strapi, whose pool holds it for the process's
# life.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: strapi-db-credentials
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "-1"}
spec:
  refreshInterval: '0'
  target:
    name: strapi-db-credentials
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          adhar.io/cli-secret: 'true'
          adhar.io/package-name: strapi
      engineVersion: v2
      data:
        username: strapi
        password: '{{ .PASSWORD }}'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: strapi-db
      rewrite:
        - transform: {template: PASSWORD}
---
# Strapi's six application secrets. Every one is REQUIRED: with any of them
# missing or empty Strapi v5 refuses to boot (`Missing APP_KEYS`,
# `Missing encryption key`), and a value that changes between restarts
# invalidates every admin session, API token and encrypted field — so these are
# generated once and never rotated in place.
#
# One generator, six `dataFrom` entries: ESO calls the generator per entry, so
# each key gets its own value.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: strapi-app
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "-2"}
spec:
  length: 32
  digits: 6
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: strapi-secrets
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "-1"}
spec:
  refreshInterval: '0'
  target:
    name: strapi-secrets
    template:
      engineVersion: v2
      metadata:
        labels:
          adhar.io/package-name: strapi
      data:
        # APP_KEYS is a comma-separated LIST (session signing keys, rotated by
        # position); four is what `create-strapi-app` generates.
        APP_KEYS: '{{ .k1 }},{{ .k2 }},{{ .k3 }},{{ .k4 }}'
        API_TOKEN_SALT: '{{ .k5 }}'
        ADMIN_JWT_SECRET: '{{ .k6 }}'
        TRANSFER_TOKEN_SALT: '{{ .k7 }}'
        JWT_SECRET: '{{ .k8 }}'
        ENCRYPTION_KEY: '{{ .k9 }}'
  dataFrom:
    - sourceRef: {generatorRef: {apiVersion: generators.external-secrets.io/v1alpha1, kind: Password, name: strapi-app}}
      rewrite: [{transform: {template: k1}}]
    - sourceRef: {generatorRef: {apiVersion: generators.external-secrets.io/v1alpha1, kind: Password, name: strapi-app}}
      rewrite: [{transform: {template: k2}}]
    - sourceRef: {generatorRef: {apiVersion: generators.external-secrets.io/v1alpha1, kind: Password, name: strapi-app}}
      rewrite: [{transform: {template: k3}}]
    - sourceRef: {generatorRef: {apiVersion: generators.external-secrets.io/v1alpha1, kind: Password, name: strapi-app}}
      rewrite: [{transform: {template: k4}}]
    - sourceRef: {generatorRef: {apiVersion: generators.external-secrets.io/v1alpha1, kind: Password, name: strapi-app}}
      rewrite: [{transform: {template: k5}}]
    - sourceRef: {generatorRef: {apiVersion: generators.external-secrets.io/v1alpha1, kind: Password, name: strapi-app}}
      rewrite: [{transform: {template: k6}}]
    - sourceRef: {generatorRef: {apiVersion: generators.external-secrets.io/v1alpha1, kind: Password, name: strapi-app}}
      rewrite: [{transform: {template: k7}}]
    - sourceRef: {generatorRef: {apiVersion: generators.external-secrets.io/v1alpha1, kind: Password, name: strapi-app}}
      rewrite: [{transform: {template: k8}}]
    - sourceRef: {generatorRef: {apiVersion: generators.external-secrets.io/v1alpha1, kind: Password, name: strapi-app}}
      rewrite: [{transform: {template: k9}}]
---
# The platform-owned first Super Admin (2026-10-24; src/adhar/bootstrap-admin.js
# in platform-extension.yaml). Strapi shows /admin/auth/register-admin until an
# admin exists, and whoever reaches it first becomes Super Admin; people sign in
# with Keycloak instead, so the platform creates this one unattended at boot.
#
# Nobody needs the password day to day — it is the break-glass login at
# /admin/auth/login?local=1 when Keycloak itself is down:
#   adhar get secrets   (or: kubectl -n adhar-system get secret strapi-bootstrap-admin)
# Generated once (refreshInterval 0). The Secret is authoritative: Strapi
# re-applies it on every start, so rotating = delete this Secret, let ESO mint
# a new one, restart Strapi. The email is a fixed non-routable identity, so a
# platform domain change never creates a second bootstrap admin, and the SSO
# bridge refuses to sign anyone in as it.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: strapi-bootstrap-admin
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "-2"}
spec:
  length: 32
  digits: 6
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: strapi-bootstrap-admin
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "-1"}
spec:
  refreshInterval: '0'
  target:
    name: strapi-bootstrap-admin
    template:
      engineVersion: v2
      metadata:
        labels:
          # Listed by `adhar get secrets`, like the other operator credentials.
          adhar.io/cli-secret: 'true'
          adhar.io/package-name: strapi
      data:
        email: strapi-bootstrap@adhar.internal
        password: '{{ .PASSWORD }}'
  dataFrom:
    - sourceRef: {generatorRef: {apiVersion: generators.external-secrets.io/v1alpha1, kind: Password, name: strapi-bootstrap-admin}}
      rewrite: [{transform: {template: PASSWORD}}]
---
# The database, asked for rather than built.
#
# This was a CloudNativePG `Cluster` plus a `ScheduledBackup` declared here,
# with the same barman stanza every other platform database also carried. It is
# now a `Database`, and the control plane composes exactly those objects
# (compositions/database/local-cnpg.yaml) — verified by rendering this request
# and diffing it against the Cluster it replaces, field for field.
#
# The credential is unchanged: the ExternalSecret in this package still mints it,
# and `credentialsSecret` hands it to CNPG as the bootstrap owner secret.
apiVersion: platform.adhar.io/v1alpha1
kind: Database
metadata:
  name: strapi-db
  namespace: adhar-system
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  parameters:
    databaseName: strapi
    credentials:
      masterUsername: strapi
    credentialsSecret: strapi-db-credentials
    storageSize: 5Gi
    backupSchedule: 0 20 3 * * *
