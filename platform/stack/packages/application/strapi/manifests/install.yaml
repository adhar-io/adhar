# Strapi — the platform's headless CMS.
#
# THE IMAGE IS THE PLATFORM'S OWN: ghcr.io/adhar-io/strapi
# --------------------------------------------------------
# Upstream retired `strapi/strapi`, and `naskio/strapi` (the only maintained
# replacement) ships a CLI that dies with MODULE_NOT_FOUND on `strapi version`
# alone, on every tag through 5.30.1. Before 5.57.0-2 this package therefore ran
# the plain Node image and scaffolded, npm-installed (~700 MiB) and built the
# admin panel inside the pod on first boot. That took four to six minutes, and
# the volume could be poisoned by an interrupted install (hollow optional
# @swc packages, see git history).
#
# The adhar-io/strapi fork now does all of that at IMAGE BUILD time
# (adhar/docker/ in the fork, released by .github/workflows/adhar-release.yml):
# `create-strapi@<version>`, the fork's @strapi/core swapped in through an npm
# override, the Keycloak admin login and SSO defaults baked into config/ and
# src/index.js, and the admin panel prebuilt. The image is multi-arch
# (amd64 + arm64) and Cosign-keyless signed. A pod starts in seconds and runs
# as uid 1000.
#
# ADMIN SSO
# ---------
# Strapi gates admin SSO behind an Enterprise licence. The fork lists only
# `sso` in ADHAR_BUNDLED_FEATURES (packages/core/core/src/ee/index.ts).
# Audit logs, review workflows, content releases and seat enforcement stay
# exactly as locked as in Community Edition. The image refuses to build
# without that core, so there is no silent fallback to a stock package.
#
# WHAT LIVES ON THE VOLUME
# ------------------------
# /srv/app/src/{api,components,extensions} (what the Content-Type Builder
# writes) and /srv/app/public/uploads (media). The image links those paths
# into /srv. They are the same paths the self-scaffolding layout used, so an
# existing volume carries over. On its first start the image migrates that
# layout once (marker /srv/.adhar-image-layout). It deletes the derived files
# (node_modules, build output, /srv/.admin-built) and moves the rest of the old
# scaffold (package.json, config/, .env, src/index.js) to /srv/legacy-scaffold.
#
# MODE: `strapi develop`, deliberately
# ------------------------------------
# The Content-Type Builder only accepts schema changes when autoReload is on,
# and only `strapi develop` sets it. The previous `NODE_ENV=development` +
# `strapi start` left the builder read-only despite what its comment said.
# STRAPI_ADHAR_MODE=develop runs develop against the PREBUILT admin (no Vite,
# no rebuild); the file watcher restarts the server after a schema save.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: strapi-app
  namespace: adhar-system
  labels: {app.kubernetes.io/name: strapi}
  # SAME wave as the Deployment that mounts it, never earlier: the platform's
  # StorageClass binds WaitForFirstConsumer, so a PVC alone never becomes Bound
  # and Argo CD would wait on its health forever without ever creating the pod
  # that would bind it (TestNoPVCWaitsInAnEarlierWaveThanItsConsumer).
  annotations: {argocd.argoproj.io/sync-wave: "7"}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      # Content types and uploaded media only; node_modules is in the image.
      # Kept at the size the self-scaffolding layout used, because a bound PVC
      # cannot shrink.
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: strapi
  namespace: adhar-system
  labels: {app.kubernetes.io/name: strapi, adhar.io/component: cms}
  annotations: {argocd.argoproj.io/sync-wave: "7"}
spec:
  selector: {app.kubernetes.io/name: strapi}
  ports:
    - name: http
      port: 1337
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: strapi
  namespace: adhar-system
  labels: {app.kubernetes.io/name: strapi, adhar.io/component: cms, adhar.io/plane: control}
  annotations: {argocd.argoproj.io/sync-wave: "7"}
spec:
  replicas: 1
  strategy:
    # The content types live on a ReadWriteOnce PVC, so two pods cannot both
    # mount it. A rolling update would deadlock on the volume.
    type: Recreate
  selector:
    matchLabels: {app.kubernetes.io/name: strapi}
  template:
    metadata:
      labels: {app.kubernetes.io/name: strapi, adhar.io/component: cms, adhar.io/plane: control}
    spec:
      # One namespace for every package (ADR-0011) means Kubernetes injects a
      # <NAME>_PORT env var per Service, and Strapi reads its whole configuration
      # from the environment — exactly the shape that has crashed other packages
      # here (see packages/CONFLICTS.md).
      enableServiceLinks: false
      securityContext:
        # The image's `node` user. fsGroup makes a volume written by the
        # previous layout's root container writable to it.
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        # Strapi runs its schema sync against Postgres on boot, so the database
        # must already answer. Wave ordering gets this right on a fresh install;
        # a node reschedule does not. Same image as the app, so nothing extra to
        # pull. bash's /dev/tcp is used because node:*-slim ships no `nc`.
        - name: wait-for-db
          image: ghcr.io/adhar-io/strapi:5.57.0-2
          command: [bash, -c]
          args:
            - |
              until (echo > /dev/tcp/strapi-db-rw.adhar-system.svc.cluster.local/5432) 2>/dev/null; do
                echo "waiting for strapi-db"; sleep 3
              done
              echo "strapi-db is accepting connections"
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: strapi
          image: ghcr.io/adhar-io/strapi:5.57.0-2
          ports:
            - {name: http, containerPort: 1337}
          env:
            # develop: the Content-Type Builder stays editable (see the header).
            - {name: STRAPI_ADHAR_MODE, value: develop}
            - {name: DATABASE_CLIENT, value: postgres}
            - {name: DATABASE_HOST, value: strapi-db-rw.adhar-system.svc.cluster.local}
            - {name: DATABASE_PORT, value: "5432"}
            - {name: DATABASE_NAME, value: strapi}
            - {name: DATABASE_SSL, value: "false"}
            - name: DATABASE_USERNAME
              valueFrom: {secretKeyRef: {name: strapi-db-credentials, key: username}}
            - name: DATABASE_PASSWORD
              valueFrom: {secretKeyRef: {name: strapi-db-credentials, key: password}}
            # Generated once (platform-postgres.yaml). Strapi v5 refuses to boot
            # without any of them, and the image deliberately carries none.
            - name: APP_KEYS
              valueFrom: {secretKeyRef: {name: strapi-secrets, key: APP_KEYS}}
            - name: API_TOKEN_SALT
              valueFrom: {secretKeyRef: {name: strapi-secrets, key: API_TOKEN_SALT}}
            - name: ADMIN_JWT_SECRET
              valueFrom: {secretKeyRef: {name: strapi-secrets, key: ADMIN_JWT_SECRET}}
            - name: TRANSFER_TOKEN_SALT
              valueFrom: {secretKeyRef: {name: strapi-secrets, key: TRANSFER_TOKEN_SALT}}
            - name: JWT_SECRET
              valueFrom: {secretKeyRef: {name: strapi-secrets, key: JWT_SECRET}}
            - name: ENCRYPTION_KEY
              valueFrom: {secretKeyRef: {name: strapi-secrets, key: ENCRYPTION_KEY}}
            # The public origin. The image's config/server.js reads it as
            # `url` (media URLs, webhook payloads, the SSO callback) and runs
            # with `proxy` on. Rewritten to the platform domain at seed time.
            - {name: PUBLIC_URL, value: "https://strapi.adhar.localtest.me:8443"}
            # Telemetry off: a platform component does not phone home
            # (ARCHITECTURE.md §1). The image sets this too, and turns off the
            # update check in config/server.js; stated here so the contract
            # is visible without reading the image.
            - {name: STRAPI_TELEMETRY_DISABLED, value: "true"}
            # ── Admin-panel SSO (Keycloak) ──
            # The `strapi-app` Keycloak client (sso.yaml) is Strapi's OWN login,
            # separate from the `strapi` client the edge proxy uses, so each
            # side receives a token minted for itself (see CLAUDE.md on
            # per-app audiences). The browser is sent to the public issuer; the
            # code exchange and userinfo go to the in-cluster one.
            - {name: KEYCLOAK_ISSUER_URL, value: "https://keycloak.adhar.localtest.me:8443/realms/adhar"}
            - {name: KEYCLOAK_INTERNAL_ISSUER_URL, value: "http://keycloak.adhar-system.svc.cluster.local:8080/realms/adhar"}
            - {name: KEYCLOAK_CLIENT_ID, value: strapi-app}
            # Required, like the proxy's own secret: nobody reaches Strapi
            # without keycloak-clients anyway, and a pod that waits for the key
            # self-corrects when the client reconciler exports it.
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: keycloak-clients, key: STRAPI_APP_CLIENT_SECRET}}
            # Role a Keycloak user receives on first sign-in (admin_roles.code:
            # strapi-super-admin | strapi-editor | strapi-author). The image's
            # bootstrap turns on auto-registration with this role on every
            # start. A Super Admin promotes people from Settings → Users.
            - {name: STRAPI_SSO_DEFAULT_ROLE, value: strapi-editor}
            # The Adhar Console's Content API key (console-token.yaml). The
            # image's bootstrap registers its hash as a full-access API token
            # named "Adhar Console", and repairs it if it is edited or deleted.
            # Optional so Strapi still boots before ESO writes it; the
            # registration is skipped until then.
            - name: ADHAR_CONSOLE_TOKEN
              valueFrom: {secretKeyRef: {name: strapi-api-token, key: STRAPI_TOKEN, optional: true}}
          volumeMounts:
            - {name: app, mountPath: /srv}
            - {name: tmp, mountPath: /tmp}
          # `/_health` answers 204 as soon as the HTTP server is listening
          # (verified). No probe on this platform may ship timeoutSeconds: 1 — a
          # loaded node needs longer than a second and kubelet then kills a
          # healthy pod (enforced by TestNoProbeShipsAOneSecondTimeout).
          startupProbe:
            httpGet: {path: /_health, port: http}
            periodSeconds: 10
            timeoutSeconds: 10
            # Normally under a minute. The budget covers the one start that
            # removes the previous layout's ~700 MiB of node_modules from the
            # volume, and kubelet's fsGroup walk before it: 30 × 10 s.
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /_health, port: http}
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /_health, port: http}
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 6
          resources:
            # No admin build at runtime any more, so no 2 GiB build heap and
            # no 3 GiB limit. `develop` runs a cluster primary plus a worker,
            # measured at ~360 MiB serving. cpu 50m: measured max 1m serving
            # on the AWS cluster (2026-10-24).
            requests: {cpu: 50m, memory: 512Mi}
            limits: {cpu: "1", memory: 1536Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: app
          persistentVolumeClaim:
            claimName: strapi-app
        # Strapi's scratch space (upload temp files).
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
