# Adhar marketplace contract for the strapi package.
# Validated against platform/stack/packages/marketplace.schema.json
# (run: hack/validate-packages.sh). See MARKETPLACE.md for the contract.
apiVersion: marketplace.adhar.io/v1alpha1
kind: AdharPackage
name: strapi
category: application
version: "0.1.0"
appVersion: 5.30.1
description: >-
  Strapi headless CMS — CNPG-backed, behind Keycloak SSO. Self-scaffolds a
  project on first boot; a production CMS with custom content types is the
  golden path (your own built image) instead.
maintainer:
  name: Adhar Platform Team
  url: https://github.com/adhar-io/adhar
  firstParty: true
license: MIT
homepage: https://strapi.io
adharCompatibility:
  minVersion: "0.1.0"
  notes: >-
    Runs the OFFICIAL Node image and scaffolds the project with upstream
    `create-strapi`, because there is no usable Strapi server image: upstream
    retired `strapi/strapi` and the only maintained replacement
    (`naskio/strapi`) ships a CLI that crashes with MODULE_NOT_FOUND on
    `strapi version` alone, on every tag through 5.30.1. First boot therefore
    scaffolds, installs ~700 MiB of node_modules and builds the admin panel —
    four to six minutes — and later starts take seconds. Off in the local
    profile because that build is too heavy for a Kind node. Runs in
    development mode so the Content-Type Builder stays available; a production
    CMS with custom content types is still better built as your own image on
    the golden path.
dependencies:
  - name: cnpg
    category: data
  - name: external-secrets
    category: security
  - name: keycloak
    category: security
provenance:
  sourceRepo: https://github.com/adhar-io/adhar
  upstreamChart: ""          # no official chart exists; hand-written manifests
  signed: true               # release artifacts are Cosign-keyless signed by the GoReleaser pipeline
  cosignKeyless: true        # Sigstore Fulcio + Rekor, ADR-0019
  scanned: true
  scanner: trivy
  sbom: https://github.com/adhar-io/adhar/releases  # SPDX SBOMs are attached to every release
planeAffinity: control-plane
# alpha: the whole path — scaffold, admin build, serve, CNPG schema — was
# verified end to end on amd64 nodes (see README.md), but a CMS that builds
# itself on first boot has more moving parts than a package that just starts a
# container, and the first administrator is still created in the browser.
stability: alpha
resources:
  cpu: "250m"
  memory: "1Gi"
  footprint: medium
  localSafe: false   # amd64-only image, and first boot is an npm install + admin build
keywords:
  - cms
  - headless-cms
  - content
verification:
  status: unverified
