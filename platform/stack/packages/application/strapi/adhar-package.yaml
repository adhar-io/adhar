# Adhar marketplace contract for the strapi package.
# Validated against platform/stack/packages/marketplace.schema.json
# (run: hack/validate-packages.sh). See MARKETPLACE.md for the contract.
apiVersion: marketplace.adhar.io/v1alpha1
kind: AdharPackage
name: strapi
category: application
version: "0.2.0"
appVersion: 5.57.0
description: >-
  Strapi headless CMS — CNPG-backed, Keycloak admin SSO, on the platform's own
  prebuilt image (ghcr.io/adhar-io/strapi). A production CMS with custom
  content types in Git is the golden path (your own built image) instead.
maintainer:
  name: Adhar Platform Team
  url: https://github.com/adhar-io/adhar
  firstParty: true
license: MIT
homepage: https://strapi.io
adharCompatibility:
  minVersion: "0.1.0"
  notes: >-
    Runs ghcr.io/adhar-io/strapi, built by the adhar-io/strapi fork: the
    project is scaffolded with upstream create-strapi, the fork's @strapi/core
    (admin SSO only; every other Enterprise feature stays locked) is swapped in,
    and the admin panel is prebuilt, all at image build time. Upstream retired
    `strapi/strapi` and the community `naskio/strapi` cannot run `strapi
    version`, which is why the platform builds its own. Multi-arch, starts in
    seconds, runs as uid 1000. Content types and uploads live on the PVC. Runs
    `strapi develop` against the prebuilt admin so the Content-Type Builder
    stays editable. Off in the local profile by choice, not because it cannot
    run there.
dependencies:
  - name: cnpg
    category: data
  - name: external-secrets
    category: security
  - name: keycloak
    category: security
provenance:
  sourceRepo: https://github.com/adhar-io/strapi
  upstreamChart: ""          # no official chart exists; hand-written manifests
  signed: true               # release artifacts are Cosign-keyless signed by the GoReleaser pipeline
  cosignKeyless: true        # Sigstore Fulcio + Rekor, ADR-0019
  scanned: true
  scanner: trivy
  sbom: https://github.com/adhar-io/adhar/releases  # SPDX SBOMs are attached to every release
planeAffinity: control-plane
# alpha: the image replaces a self-scaffolding pod (5.57.0-1). The first
# administrator is still created in the browser.
stability: alpha
resources:
  cpu: "100m"
  memory: "512Mi"
  footprint: medium
  localSafe: true    # multi-arch image, no install or build at runtime
keywords:
  - cms
  - headless-cms
  - content
verification:
  status: unverified
