# Plane's signing keys, generated once per cluster.
#
# The chart renders SECRET_KEY and LIVE_SERVER_SECRET_KEY from its values.yaml
# defaults, so every Plane installed from it shared the same Django key: anyone
# who has read the chart can forge session cookies and password-reset tokens
# for any of them. generate-manifests.sh strips both from the chart's Secrets
# and every workload reads them from plane-generated-keys instead.
#
# CreatedOnce: the keys are minted the first time and never rotated by a sync.
# Plane encrypts the instance settings it keeps in the database (the Keycloak
# client secret among them) with a key derived from SECRET_KEY; a rotation
# signs everyone out and needs those settings written again, which the
# instance-setup hook does on every sync of this app.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: plane-secret-key
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "-2"}
spec:
  length: 64
  digits: 16
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: plane-live-server-secret-key
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "-2"}
spec:
  length: 40
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: plane-generated-keys
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "-2"}
spec:
  refreshPolicy: CreatedOnce
  refreshInterval: 30s
  target:
    name: plane-generated-keys
    template:
      engineVersion: v2
      data:
        SECRET_KEY: "{{ .SECRET_KEY }}"
        LIVE_SERVER_SECRET_KEY: "{{ .LIVE_SERVER_SECRET_KEY }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: plane-secret-key
      rewrite:
        - transform:
            template: "SECRET_KEY"
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: plane-live-server-secret-key
      rewrite:
        - transform:
            template: "LIVE_SERVER_SECRET_KEY"
