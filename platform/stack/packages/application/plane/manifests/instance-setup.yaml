# First-run instance setup for Plane, done for you.
#
# Plane Community Edition has no OIDC login (that is a commercial feature); the
# platform fronts the whole app with Keycloak through oauth2-proxy (sso.yaml)
# and Plane's own sign-in is email + password. Until an instance admin has
# completed the "god-mode" setup, Plane's sign-in page shows "No authentication
# methods available" — so this Job completes it: it creates the instance admin
# with a generated password (surfaced by `adhar get secrets -p plane`), marks
# the instance set up and enables password login + sign-up. Idempotent.
#
# It also makes the Define phase of the console work without a human first
# clicking through Plane: it creates the platform workspace (slug `adhar`, the
# console's `planeWorkspace` default) owned by that admin, mints a Plane API
# key for the admin, and writes both into the `plane-api-token` Secret
# (PLANE_URL / PLANE_TOKEN / PLANE_WORKSPACE). The console's ExternalSecret
# (core/adhar-console) copies that into its pod env — Plane only speaks
# X-API-Key on /api/v1, and the public route sits behind oauth2-proxy, so
# the console needs the in-cluster URL + a real key, not the user's session.
# (Plain .yaml on purpose: the ESO template directives must survive seeding.)
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: plane-instance-setup
  namespace: adhar-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: plane-instance-setup
  namespace: adhar-system
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: plane-instance-setup
  namespace: adhar-system
subjects:
  - kind: ServiceAccount
    name: plane-instance-setup
    namespace: adhar-system
roleRef:
  kind: Role
  name: plane-instance-setup
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: plane-admin
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "-2"}
spec:
  length: 24
  digits: 4
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: plane-admin-credentials
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "-2"}
spec:
  refreshInterval: '0'
  target:
    name: plane-admin-credentials
    template:
      metadata:
        labels:
          adhar.io/cli-secret: 'true'
          adhar.io/package-name: plane
      engineVersion: v2
      data:
        username: plane-admin@adhar.local
        password: '{{ .PASSWORD }}'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: plane-admin
      rewrite:
        - transform:
            template: 'PASSWORD'
---
apiVersion: batch/v1
kind: Job
metadata:
  name: plane-instance-setup
  namespace: adhar-system
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "10"
spec:
  backoffLimit: 20
  template:
    spec:
      restartPolicy: OnFailure
      enableServiceLinks: false
      serviceAccountName: plane-instance-setup
      containers:
        - name: setup
          image: artifacts.plane.so/makeplane/plane-backend:v1.4.1
          envFrom:
            - configMapRef: {name: plane-app-vars}
            - secretRef: {name: plane-app-secrets}
            - secretRef: {name: plane-doc-store-secrets}
          env:
            - name: ADMIN_EMAIL
              valueFrom: {secretKeyRef: {name: plane-admin-credentials, key: username}}
            - name: ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: plane-admin-credentials, key: password}}
            # Workspace the console's Define phase works in (its
            # `planeWorkspace` default). Must be a valid Plane slug.
            - name: WORKSPACE_SLUG
              value: adhar
            - name: WORKSPACE_NAME
              value: Adhar
            # In-cluster API base handed to the console with the key.
            - name: PLANE_API_URL
              value: http://plane-api.adhar-system.svc.cluster.local:8000
            - name: TOKEN_SECRET_NAME
              value: plane-api-token
            - name: NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
          command: [sh, -c]
          args:
            - |
              set -e
              cd /code
              python manage.py shell <<'PY'
              import base64, json, os, ssl, urllib.request, uuid
              from django.contrib.auth.hashers import make_password
              from plane.db.models import APIToken, User, Workspace, WorkspaceMember
              from plane.license.models import Instance, InstanceAdmin, InstanceConfiguration
              email = os.environ["ADMIN_EMAIL"].strip().lower()
              password = os.environ["ADMIN_PASSWORD"]
              user, created = User.objects.get_or_create(email=email, defaults={
                  "username": uuid.uuid4().hex, "first_name": "Adhar", "last_name": "Admin",
                  "is_active": True, "is_email_verified": True})
              user.set_password(password)
              user.is_password_autoset = False
              user.is_active = True
              user.save()
              instance = Instance.objects.first()
              if instance is None:
                  raise SystemExit("instance not registered yet (api migrate job not finished) — retrying")
              instance.is_setup_done = True
              instance.save()
              InstanceAdmin.objects.get_or_create(instance=instance, user=user, defaults={"role": 20})
              for key, value in {"ENABLE_SIGNUP": "1", "ENABLE_EMAIL_PASSWORD": "1", "ENABLE_MAGIC_LINK_LOGIN": "0"}.items():
                  InstanceConfiguration.objects.update_or_create(key=key, defaults={"value": value, "category": "AUTHENTICATION"})
              print(f"instance setup done; admin {'created' if created else 'updated'}: {email}")

              # ── platform workspace + console API key ─────────────────────────
              slug = os.environ["WORKSPACE_SLUG"]
              ws, ws_created = Workspace.objects.get_or_create(slug=slug, defaults={
                  "name": os.environ.get("WORKSPACE_NAME") or slug, "owner": user})
              WorkspaceMember.objects.get_or_create(workspace=ws, member=user, defaults={"role": 20, "is_active": True})
              print(f"workspace {slug} {'created' if ws_created else 'present'}")
              label = "adhar-console"
              token = APIToken.objects.filter(user=user, label=label, is_active=True, workspace__isnull=True).order_by("created_at").first()
              if token is None:
                  token = APIToken.objects.create(user=user, label=label,
                      description="Server-side key the Adhar Console uses for the Define phase (generated by plane-instance-setup).",
                      user_type=0, is_active=True)
                  print("console API key minted")
              else:
                  print("console API key present")

              # ── hand it to the console through a Secret (kube API, in-cluster SA) ──
              ns = os.environ["NAMESPACE"]
              name = os.environ["TOKEN_SECRET_NAME"]
              sa = "/var/run/secrets/kubernetes.io/serviceaccount"
              bearer = open(f"{sa}/token").read().strip()
              ctx = ssl.create_default_context(cafile=f"{sa}/ca.crt")
              host = os.environ.get("KUBERNETES_SERVICE_HOST", "kubernetes.default.svc")
              port = os.environ.get("KUBERNETES_SERVICE_PORT", "443")
              base = f"https://{host}:{port}/api/v1/namespaces/{ns}/secrets"
              b64 = lambda s: base64.b64encode(s.encode()).decode()
              body = {"apiVersion": "v1", "kind": "Secret", "type": "Opaque",
                      "metadata": {"name": name, "namespace": ns,
                                   "labels": {"app.kubernetes.io/part-of": "plane", "adhar.io/package-name": "plane"}},
                      "data": {"PLANE_URL": b64(os.environ["PLANE_API_URL"]), "PLANE_TOKEN": b64(token.token), "PLANE_WORKSPACE": b64(slug)}}
              def call(method, url, payload, ctype="application/json"):
                  req = urllib.request.Request(url, method=method, data=json.dumps(payload).encode(),
                      headers={"Authorization": f"Bearer {bearer}", "Content-Type": ctype, "Accept": "application/json"})
                  with urllib.request.urlopen(req, context=ctx, timeout=20) as r:
                      return r.status
              try:
                  st = call("POST", base, body)
              except urllib.error.HTTPError as e:
                  if e.code != 409:
                      raise
                  st = call("PATCH", f"{base}/{name}", body, "application/merge-patch+json")
              print(f"secret {ns}/{name} written (http {st})")
              PY
          resources:
            requests: {cpu: 50m, memory: 256Mi}
            limits: {memory: 1Gi}
