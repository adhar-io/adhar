# First-run instance setup for Plane, done for you.
#
# Keycloak reaches Plane three ways, all wired here and in sso.yaml:
#
#  1. ENFORCED EDGE SSO — every request to plane.<host> passes through the
#     Keycloak oauth2-proxy in sso.yaml first. Nobody sees Plane at all without
#     a valid Keycloak session.
#  2. NATIVE KEYCLOAK LOGIN INSIDE PLANE — the Adhar fork of Plane
#     (ghcr.io/adhar-io/plane-backend) adds a generic OIDC provider,
#     plane/authentication/provider/oauth/keycloak.py, that upstream Community
#     Edition does not ship (its providers are email, magic code, gitea,
#     github, gitlab, google — `grep -ril oidc` in v1.4.2 returns nothing).
#     The fork reads its settings from InstanceConfiguration (category
#     KEYCLOAK), and the api-migrate Job seeds those rows from the pod env,
#     which is "0"/empty here because the client secret does not exist until
#     the keycloak package has exported the `plane-app` client (sso.yaml) into
#     the keycloak-clients Secret. So this Job writes the six KEYCLOAK_* rows
#     itself, from that Secret — a cluster that ran the fork image with
#     is_keycloak_enabled=False is exactly the gap this closes.
#  3. (Removed 2026-10-14.) There used to be a Gitea-federation fallback —
#     Plane's Gitea OAuth provider pointed at the platform Gitea — because the
#     platform ran the STOCK frontend, which cannot draw a button for a method
#     it does not know. Every image is the fork's build now (plane-frontend,
#     plane-space and plane-admin render "Continue with Keycloak"), so the
#     detour is gone and the Job switches IS_GITEA_ENABLED off.
#
# Plus the instance admin itself: until an instance admin has completed the
# "god-mode" setup, Plane's sign-in page shows "No authentication methods
# available" — so this Job completes it. It creates a LOCAL break-glass instance
# admin (plane-admin@adhar.local) with a generated password (surfaced by
# `adhar get secrets -p plane`), marks the instance set up, and enables password
# login + sign-up. That account exists for /god-mode/ only: the fork's god-mode
# sign-in (/api/instances/admins/sign-in/, apps/admin sign-in-form.tsx) is an
# email/password form checked against InstanceAdmin rows, on its own admin
# session cookie — it has no Keycloak button, so a Keycloak identity cannot be
# the instance admin. Idempotent and re-runnable, and it VERIFIES the result
# through the same API the web app reads (/api/instances/) before exiting: if
# the instance is not set up, or no authentication method is enabled, the Job
# exits non-zero and ArgoCD retries. A Job that exits 0 having enabled nothing
# is exactly the bug this guards.
#
# Everything a PERSON sees belongs to the Keycloak platform admin, not to that
# local account. The Job resolves the realm's platform admin from the
# keycloak-directory ConfigMap the keycloak package publishes (every realm user
# with their groups, no credentials; the group is the KEYCLOAK_ADMIN_GROUPS
# below) and pre-creates them in Plane by email — no usable password,
# last_login_medium "keycloak" — so their first "Continue with Keycloak" signs
# into THAT account (the fork's complete_login_or_signup() looks users up by
# email and logs an existing one in). The platform admin then:
#   - owns the platform workspace (slug `adhar`, the console's `planeWorkspace`
#     default) and is its admin member,
#   - owns the console's Plane API key, so everything the console does through
#     the API (projects, work items …) is attributed to a real person,
#   - takes over project lead / default assignee and project-admin seats the
#     local account held.
# Existing clusters migrate on the next sync: workspace ownership moves off the
# local account, a new key is minted for the platform admin and written to
# `plane-api-token` (PLANE_URL / PLANE_TOKEN / PLANE_WORKSPACE), the old key is
# deactivated, and the local account leaves the workspace (it is re-added while
# Keycloak is NOT verified, because then it is the only way in). Rows are moved
# with queryset updates, so created_by/updated_by history is never rewritten.
# If no platform admin can be resolved the Job logs a WARNING and keeps the
# workspace/key with whoever holds them now — never back-migrates, never
# blocks sign-in.
#
# The console reads `plane-api-token` into its env key by key
# (core/adhar-console) when its pod starts, so the Secret carries
# the key's mint time in `adhar.io/token-created-at` and plane-console-reload
# restarts the console when its pod predates it. Plane only speaks X-API-Key on
# /api/v1, and the public route sits behind oauth2-proxy, so the console needs
# the in-cluster URL + a real key, not the user's session.
# (Plain .yaml on purpose: the ESO template directives must survive seeding.)
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: plane-instance-setup
  namespace: adhar-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: plane-instance-setup
  namespace: adhar-system
rules:
  # Exactly the two Secrets the script touches (KEYCLOAK_CLIENTS_SECRET and
  # TOKEN_SECRET_NAME below); unnamed, these verbs read, created and patched
  # every Secret in adhar-system. It reads keycloak-clients and writes the
  # console's token with server-side apply: a PATCH to the Secret's own URL,
  # and when the Secret does not exist yet the API server authorises the create
  # that implies WITH its name (k8s.io/apiserver endpoints/handlers/patch.go,
  # createAuthorizerAttributes), so resourceNames applies to `create` too. Only
  # a POST to the collection, which carries no name, cannot be narrowed — and
  # the script no longer makes one. (Same shape as penpot's console-token.)
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["keycloak-clients"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["plane-api-token"]
    verbs: ["create", "patch"]
  # The realm's user directory (KEYCLOAK_DIRECTORY_CONFIGMAP below), read to
  # find the platform admin who owns the workspace and the console key.
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["keycloak-directory"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: plane-instance-setup
  namespace: adhar-system
subjects:
  - kind: ServiceAccount
    name: plane-instance-setup
    namespace: adhar-system
roleRef:
  kind: Role
  name: plane-instance-setup
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: plane-admin
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "-2"}
spec:
  length: 24
  digits: 4
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: plane-admin-credentials
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "-2"}
spec:
  refreshInterval: '0'
  target:
    name: plane-admin-credentials
    template:
      metadata:
        labels:
          # `adhar get secrets -p plane` prints anything carrying these.
          adhar.io/cli-secret: 'true'
          adhar.io/package-name: plane
      engineVersion: v2
      data:
        username: plane-admin@adhar.local
        password: '{{ .PASSWORD }}'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: plane-admin
      rewrite:
        - transform:
            template: 'PASSWORD'
---
apiVersion: batch/v1
kind: Job
metadata:
  name: plane-instance-setup
  namespace: adhar-system
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "10"
spec:
  backoffLimit: 20
  template:
    spec:
      restartPolicy: OnFailure
      enableServiceLinks: false
      serviceAccountName: plane-instance-setup
      containers:
        - name: setup
          image: ghcr.io/adhar-io/plane-backend:1.4.2-4
          envFrom:
            - configMapRef: {name: plane-app-vars}
            - secretRef: {name: plane-app-secrets}
            - secretRef: {name: plane-generated-keys}
            - secretRef: {name: plane-doc-store-secrets}
          env:
            - name: ADMIN_EMAIL
              valueFrom: {secretKeyRef: {name: plane-admin-credentials, key: username}}
            - name: ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: plane-admin-credentials, key: password}}
            # Workspace the console's Define phase works in (its
            # `planeWorkspace` default). Must be a valid Plane slug.
            - name: WORKSPACE_SLUG
              value: adhar
            - name: WORKSPACE_NAME
              value: Adhar
            # In-cluster API base handed to the console with the key, and the
            # one this Job re-reads /api/instances/ from to verify itself.
            - name: PLANE_API_URL
              value: http://plane-api.adhar-system.svc.cluster.local:8000
            - name: TOKEN_SECRET_NAME
              value: plane-api-token
            - name: NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            # Plane's OWN Keycloak login (method 2 in the header). The realm
            # issuer the BROWSER is sent to; the controller rewrites
            # adhar.localtest.me:8443 to the real domain when seeding.
            - name: KEYCLOAK_ISSUER_URL
              value: https://keycloak.adhar.localtest.me:8443/realms/adhar
            # Backchannel — discovery, the code-for-token exchange and userinfo
            # — stays adhar-controlplane; the fork re-bases those endpoints onto this
            # URL whatever issuer the discovery document reports.
            - name: KEYCLOAK_INTERNAL_ISSUER_URL
              value: http://keycloak.adhar-system.svc.cluster.local:8080/realms/adhar
            # Where the client id/secret of the `plane-app` client land once the
            # keycloak package's reconciler has exported them. Read through the
            # kube API (the Role grants `get` on exactly this Secret) rather than a
            # secretKeyRef, so the Job can WAIT for them instead of silently
            # starting without — see keycloak_login() below.
            - name: KEYCLOAK_CLIENTS_SECRET
              value: keycloak-clients
            - name: KEYCLOAK_CLIENT_ID_KEY
              value: PLANE_APP_CLIENT_ID
            - name: KEYCLOAK_CLIENT_SECRET_KEY
              value: PLANE_APP_CLIENT_SECRET
            # Published by the keycloak package (publish_directory in
            # keycloak-config.yaml, on its sync Job and every 5 minutes by the
            # keycloak-client-reconcile CronJob): [{username, email, firstName,
            # lastName, groups}]. The platform admin is resolved from it.
            - name: KEYCLOAK_DIRECTORY_CONFIGMAP
              value: keycloak-directory
          command: [sh, -c]
          args:
            - |
              set -e
              cd /code
              python manage.py shell <<'PY'
              import base64, datetime, json, os, ssl, sys, time, urllib.error, urllib.parse, urllib.request, uuid
              from django.db import transaction
              from django.db.models import Min
              from plane.db.models import (APIToken, Profile, Project, ProjectMember, ProjectUserProperty, User,
                                           Workspace, WorkspaceMember)
              from plane.license.models import Instance, InstanceAdmin, InstanceConfiguration
              from plane.license.utils.encryption import decrypt_data, encrypt_data
              from plane.utils.cache import invalidate_cache_directly

              failures = []
              ADMIN_ROLE = 20

              def cfg(key, value, category, encrypted=False):
                  InstanceConfiguration.objects.update_or_create(
                      key=key,
                      defaults={"value": encrypt_data(value) if encrypted else value,
                                "category": category, "is_encrypted": encrypted})

              # ── 1. break-glass instance admin + credential login ─────────────
              # A LOCAL account, for /god-mode/ only (see the header): the fork's
              # god-mode sign-in is email/password against InstanceAdmin rows and
              # offers no Keycloak. It owns nothing a person uses — section 4
              # gives the workspace and the console key to the platform admin.
              email = os.environ["ADMIN_EMAIL"].strip().lower()
              password = os.environ["ADMIN_PASSWORD"]
              local_admin, created = User.objects.get_or_create(email=email, defaults={
                  "username": uuid.uuid4().hex, "first_name": "Adhar", "last_name": "Admin",
                  "is_active": True, "is_email_verified": True})
              local_admin.set_password(password)
              local_admin.is_password_autoset = False
              local_admin.is_active = True
              local_admin.is_email_verified = True
              local_admin.save()

              # The Instance row is created by the api-migrate Job. Wait for it
              # rather than dying immediately — this Job is a PostSync hook and a
              # crash here used to burn a backoff slot for nothing.
              instance = None
              for attempt in range(60):
                  instance = Instance.objects.first()
                  if instance is not None:
                      break
                  print(f"waiting for the Instance row (api-migrate) … {attempt + 1}/60", flush=True)
                  time.sleep(5)
              if instance is None:
                  raise SystemExit("FATAL: no Instance row after 5 minutes — is plane-api-migrate stuck?")

              instance.is_setup_done = True
              instance.save()
              InstanceAdmin.objects.get_or_create(instance=instance, user=local_admin, defaults={"role": 20})
              cfg("ENABLE_SIGNUP", "1", "AUTHENTICATION")
              cfg("ENABLE_MAGIC_LINK_LOGIN", "0", "AUTHENTICATION")
              # Email/password starts ON and is switched off further down once
              # the Keycloak provider is verified — see the note there. Enabling
              # it here first means an instance is never left with zero usable
              # methods, which renders as "No authentication methods available".
              cfg("ENABLE_EMAIL_PASSWORD", "1", "AUTHENTICATION")
              print(f"instance setup done; break-glass instance admin {'created' if created else 'updated'}: {email}", flush=True)

              # In-cluster kube API, used to read keycloak-clients (2) and to
              # write the console's token Secret (4).
              ns = os.environ["NAMESPACE"]
              sa = "/var/run/secrets/kubernetes.io/serviceaccount"
              bearer = open(f"{sa}/token").read().strip()
              ctx = ssl.create_default_context(cafile=f"{sa}/ca.crt")
              khost = os.environ.get("KUBERNETES_SERVICE_HOST", "kubernetes.default.svc")
              kport = os.environ.get("KUBERNETES_SERVICE_PORT", "443")
              api = f"https://{khost}:{kport}/api/v1/namespaces/{ns}"
              base = f"{api}/secrets"

              # ── 2. Plane's OWN Keycloak login (the fork's OIDC provider) ─────
              # Env is only the provider's FALLBACK: it reads InstanceConfiguration
              # first, and api-migrate seeded those rows from an env that had no
              # client secret. Write them here from the keycloak-clients Secret.
              # WAITS for that Secret rather than skipping: the edge proxy in
              # front of Plane reads the same Secret, so without it nobody
              # reaches Plane anyway — and by the time this PostSync hook runs
              # the proxy is Healthy, which means the Secret is normally there.
              def keycloak_login():
                  issuer = (os.environ.get("KEYCLOAK_ISSUER_URL") or "").rstrip("/")
                  internal = (os.environ.get("KEYCLOAK_INTERNAL_ISSUER_URL") or "").rstrip("/")
                  if not issuer:
                      return "skipped (KEYCLOAK_ISSUER_URL unset)", False
                  secret_name = os.environ.get("KEYCLOAK_CLIENTS_SECRET") or "keycloak-clients"
                  id_key = os.environ.get("KEYCLOAK_CLIENT_ID_KEY") or "PLANE_APP_CLIENT_ID"
                  secret_key = os.environ.get("KEYCLOAK_CLIENT_SECRET_KEY") or "PLANE_APP_CLIENT_SECRET"
                  client_id = client_secret = ""
                  why = "not attempted"
                  for attempt in range(120):
                      try:
                          req = urllib.request.Request(f"{base}/{secret_name}", headers={
                              "Authorization": f"Bearer {bearer}", "Accept": "application/json"})
                          with urllib.request.urlopen(req, context=ctx, timeout=20) as r:
                              data = json.loads(r.read().decode()).get("data") or {}
                          client_id = base64.b64decode(data.get(id_key) or "").decode().strip()
                          client_secret = base64.b64decode(data.get(secret_key) or "").decode().strip()
                          if client_id and client_secret:
                              break
                          why = f"Secret {secret_name} has no {id_key}/{secret_key} yet"
                      except urllib.error.HTTPError as err:
                          if err.code != 404:
                              raise
                          why = f"Secret {secret_name} does not exist yet"
                      print(f"keycloak login: waiting — {why} … {attempt + 1}/120", flush=True)
                      time.sleep(5)
                  if not (client_id and client_secret):
                      return f"NOT configured — {why} after 10 minutes (the keycloak client reconciler exports it)", False

                  # Prove the realm answers on the backchannel before switching
                  # the sign-in page over to it. A page whose only button leads
                  # to KEYCLOAK_NOT_CONFIGURED locks everyone out of workspaces.
                  needed = ("authorization_endpoint", "token_endpoint", "userinfo_endpoint")
                  doc = None
                  for attempt in range(12):
                      try:
                          with urllib.request.urlopen(f"{internal or issuer}/.well-known/openid-configuration", timeout=15) as r:
                              doc = json.loads(r.read().decode())
                          if all(doc.get(k) for k in needed):
                              break
                          doc = None
                      except Exception as exc:  # noqa: BLE001
                          print(f"keycloak login: discovery not answering yet ({exc}) … {attempt + 1}/12", flush=True)
                      time.sleep(5)
                  if doc is None:
                      return f"NOT configured — no usable discovery document at {internal or issuer}", False

                  cfg("KEYCLOAK_ISSUER_URL", issuer, "KEYCLOAK")
                  cfg("KEYCLOAK_INTERNAL_ISSUER_URL", internal, "KEYCLOAK")
                  cfg("KEYCLOAK_CLIENT_ID", client_id, "KEYCLOAK")
                  cfg("KEYCLOAK_CLIENT_SECRET", client_secret, "KEYCLOAK", encrypted=True)
                  cfg("IS_KEYCLOAK_ENABLED", "1", "KEYCLOAK")
                  cfg("ENABLE_KEYCLOAK_SYNC", "1", "KEYCLOAK")
                  # Membership follows the realm (fork feature, 1.4.2-2+): every
                  # Keycloak user lands in the platform workspace on sign-in, with
                  # the role taken from the `groups` claim — the same groups the
                  # Gitea auth source maps (platform-admin / -developer / -viewer).
                  # Nobody has to be invited, and nobody is dropped on
                  # "create your workspace" after single sign-on.
                  cfg("KEYCLOAK_AUTO_JOIN_WORKSPACE", os.environ["WORKSPACE_SLUG"], "KEYCLOAK")
                  cfg("KEYCLOAK_ADMIN_GROUPS", "platform-admin", "KEYCLOAK")
                  cfg("KEYCLOAK_GUEST_GROUPS", "platform-viewer", "KEYCLOAK")
                  return f"enabled (client {client_id}, issuer {issuer}, backchannel {internal or issuer})", True

              keycloak_ready = False
              try:
                  note, keycloak_ready = keycloak_login()
                  print(f"keycloak login: {note}", flush=True)
                  if not keycloak_ready and os.environ.get("KEYCLOAK_ISSUER_URL"):
                      failures.append(f"keycloak login {note}")
              except Exception as exc:  # noqa: BLE001 — recorded, and the run still writes the console token
                  detail = exc.read().decode()[:300] if isinstance(exc, urllib.error.HTTPError) else exc
                  print(f"keycloak login: FAILED ({type(exc).__name__}: {detail})", flush=True)
                  failures.append(f"keycloak login failed: {type(exc).__name__}: {detail}")
              if not keycloak_ready:
                  cfg("IS_KEYCLOAK_ENABLED", "0", "KEYCLOAK")

              # ── 3. No Gitea detour ───────────────────────────────────────────
              # The fork's frontend renders the native Keycloak method, so the
              # Gitea-federation bridge that stood in for it is retired. Switch
              # it off explicitly: a cluster that ran the bridge still holds the
              # rows, and two buttons that both end at Keycloak is not SSO.
              cfg("IS_GITEA_ENABLED", "0", "GITEA")

              # ── Single sign-on means one sign-in, so hide the password form ──
              #
              # Reaching Plane already required a Keycloak session at the edge
              # proxy. Showing an email/password box after that reads as "log in
              # again" and invites people to create a SECOND, local identity that
              # Keycloak knows nothing about — the opposite of single sign-on.
              # "Continue with Keycloak" should be the only thing on the page.
              #
              # Strictly conditional on the method the page can DRAW being on.
              # With the fork's frontend that is the native Keycloak provider
              # (is_keycloak_enabled is in its auth bundle: apps/web/core/hooks/
              # oauth/core.tsx); keycloak_ready is only True after this Job has
              # read the client secret AND seen the realm answer discovery, so
              # the form is never removed in favour of a method that cannot work.
              #
              # The god-mode instance admin is unaffected. That sign-in posts to
              # /api/instances/admins/sign-in/, which authenticates InstanceAdmin
              # rows directly; ENABLE_EMAIL_PASSWORD governs the WORKSPACE
              # sign-in page only. `adhar get secrets -p plane` still prints the
              # admin credentials, and they still work at /god-mode/.
              if keycloak_ready:
                  cfg("ENABLE_EMAIL_PASSWORD", "0", "AUTHENTICATION")
                  print("auth: email/password disabled — Keycloak is the only rendered method", flush=True)
              else:
                  cfg("ENABLE_EMAIL_PASSWORD", "1", "AUTHENTICATION")
                  print("auth: KEEPING email/password — the Keycloak provider is not ready, so removing "
                        "the form would leave no way in", flush=True)

              # ── 4. the Keycloak platform admin: who owns the workspace and the key ──
              # Resolved from the realm's user directory (KEYCLOAK_DIRECTORY_CONFIGMAP),
              # never hardcoded: the members of the group KEYCLOAK_ADMIN_GROUPS names
              # above. The keycloak package republishes it every five minutes, so when
              # Keycloak is verified the Job WAITS for it like it waits for the client
              # secret — a PostSync hook that skips does not come back until the next
              # sync. Without Keycloak there is nobody to sign in as the platform admin
              # yet, so one read is enough.
              ADMIN_GROUP = "platform-admin"  # == KEYCLOAK_ADMIN_GROUPS above
              slug = os.environ["WORKSPACE_SLUG"]

              def kube_get(url):
                  req = urllib.request.Request(url, headers={"Authorization": f"Bearer {bearer}", "Accept": "application/json"})
                  with urllib.request.urlopen(req, context=ctx, timeout=20) as r:
                      return json.loads(r.read().decode())

              def directory_admins():
                  """[(email, first, last)] of the realm's platform admins, sorted by email."""
                  name = os.environ.get("KEYCLOAK_DIRECTORY_CONFIGMAP") or "keycloak-directory"
                  tries = 72 if keycloak_ready else 1
                  why = "not attempted"
                  for attempt in range(tries):
                      try:
                          users = json.loads((kube_get(f"{api}/configmaps/{name}").get("data") or {}).get("users.json") or "[]")
                          found = {}
                          for u in users if isinstance(users, list) else []:
                              if not isinstance(u, dict):
                                  continue
                              groups = {str(g).strip().strip("/").rsplit("/", 1)[-1] for g in (u.get("groups") or [])}
                              mail = str(u.get("email") or "").strip().lower()
                              if ADMIN_GROUP in groups and "@" in mail:
                                  found[mail] = (mail, str(u.get("firstName") or ""), str(u.get("lastName") or ""))
                          if found:
                              return [found[k] for k in sorted(found)], f"ConfigMap {name}"
                          why = f"ConfigMap {name} lists nobody in group {ADMIN_GROUP}"
                      except urllib.error.HTTPError as err:
                          if err.code != 404:
                              raise
                          why = f"ConfigMap {name} is not published yet"
                      if attempt + 1 < tries:
                          print(f"platform admin: waiting — {why} … {attempt + 1}/{tries}", flush=True)
                          time.sleep(5)
                  return [], why

              def ensure_platform_admin(mail, first, last):
                  """The Plane account the platform admin's first Keycloak sign-in lands in.

                  The fork's complete_login_or_signup() looks the user up by email and logs
                  an EXISTING account in (no signup, no duplicate), refusing only bots and
                  accounts deactivated through Plane (inactive with last_logout_time set) —
                  so a pre-created, active, never-logged-out row is exactly what it links."""
                  u = User.objects.filter(email=mail).first()
                  if u is None:
                      u = User(email=mail, username=uuid.uuid4().hex, first_name=first, last_name=last,
                               display_name=User.get_display_name(mail), is_active=True, is_email_verified=True,
                               is_password_autoset=True, last_login_medium="keycloak")
                      u.set_unusable_password()  # Keycloak is its only way in
                      u.save()
                      Profile.objects.get_or_create(user=u)
                      return u, "pre-created (first Keycloak sign-in links to it by email)"
                  if u.is_bot:
                      return None, "is a bot account in Plane"
                  if not u.is_active:
                      if u.last_logout_time is not None:
                          return None, "was deactivated in Plane — not overriding that"
                      User.objects.filter(pk=u.pk).update(is_active=True)
                      u.is_active = True
                  return u, f"present (last sign-in via {u.last_login_medium})"

              ws = Workspace.objects.filter(slug=slug).select_related("owner").first()
              platform_admin = None
              try:
                  admins, source = directory_admins()
                  # Sticky: once a platform admin owns the workspace it stays theirs while
                  # they remain in the group; otherwise the first by email.
                  pick = next((a for a in admins if ws is not None and ws.owner.email == a[0]), admins[0] if admins else None)
                  if pick is None:
                      print(f"WARNING: platform admin NOT resolved — {source}. The workspace and the console key stay "
                            f"with their current owner ({ws.owner.email if ws else email}); the next sync retries.", flush=True)
                  elif pick[0] == email:
                      print(f"WARNING: the directory names the break-glass account {email} as platform admin; ignoring", flush=True)
                  else:
                      platform_admin, note = ensure_platform_admin(*pick)
                      print(f"platform admin {pick[0]} (from {source}): {note}", flush=True)
                      if platform_admin is None:
                          print("WARNING: workspace and console key stay with their current owner", flush=True)
              except Exception as exc:  # noqa: BLE001 — ownership is never worth a broken sign-in
                  detail = exc.read().decode()[:300] if isinstance(exc, urllib.error.HTTPError) else exc
                  print(f"WARNING: platform admin lookup FAILED ({type(exc).__name__}: {detail}); workspace and console "
                        "key stay with their current owner", flush=True)
                  platform_admin = None

              # ── 5. platform workspace, ownership migration, console API key ──────────
              if platform_admin is not None:
                  owner = platform_admin
              elif ws is not None and ws.owner.is_active:
                  owner = ws.owner          # never back-migrate on a lookup that failed
              else:
                  owner = local_admin       # fresh cluster without a resolvable admin
              ws, ws_created = Workspace.objects.get_or_create(slug=slug, defaults={
                  "name": os.environ.get("WORKSPACE_NAME") or slug, "owner": owner})
              print(f"workspace {slug} {'created' if ws_created else 'present'}", flush=True)

              def ensure_admin_member(member):
                  wm = WorkspaceMember.objects.filter(workspace=ws, member=member).first()
                  if wm is None:
                      WorkspaceMember.objects.create(workspace=ws, member=member, role=ADMIN_ROLE, is_active=True)
                      return "added as admin"
                  if wm.role < ADMIN_ROLE or not wm.is_active:
                      WorkspaceMember.objects.filter(pk=wm.pk).update(role=ADMIN_ROLE, is_active=True)
                      return "raised to admin"
                  return None

              members_changed = False
              if platform_admin is not None:
                  if ws.owner_id == local_admin.id:
                      # .update(), not save(): BaseModel.save() outside a request blanks
                      # created_by/updated_by, and history is not ours to rewrite.
                      Workspace.objects.filter(pk=ws.pk).update(owner=platform_admin)
                      print(f"workspace {slug}: ownership transferred {email} -> {platform_admin.email}", flush=True)
                  elif ws.owner_id != platform_admin.id:
                      print(f"workspace {slug} is owned by {ws.owner.email}, not the break-glass account; ownership left as is", flush=True)
                  note = ensure_admin_member(platform_admin)
                  if note:
                      members_changed = True
                      print(f"workspace {slug}: {platform_admin.email} {note}", flush=True)

                  # Projects the local account led or administered pass to the platform
                  # admin (plane-project-access adds every workspace admin to every project
                  # too, but on a 5-minute schedule; this closes that window before the
                  # local account's seats are released below).
                  for field in ("project_lead", "default_assignee"):
                      n = Project.objects.filter(workspace=ws, **{field: local_admin}).update(**{field: platform_admin})
                      if n:
                          print(f"projects: {field} moved to {platform_admin.email} on {n} project(s)", flush=True)
                  seats = list(ProjectMember.objects.filter(workspace=ws, member=local_admin, is_active=True, role=ADMIN_ROLE)
                               .values_list("project_id", flat=True))
                  if seats:
                      have = {pm.project_id: pm for pm in ProjectMember.objects.filter(project_id__in=seats, member=platform_admin)}
                      props = set(ProjectUserProperty.objects.filter(project_id__in=seats, user=platform_admin)
                                  .values_list("project_id", flat=True))
                      floor = ProjectUserProperty.objects.filter(workspace=ws, user=platform_admin).aggregate(v=Min("sort_order"))["v"]
                      create, prop_rows, raise_ids = [], [], []
                      for pid in seats:
                          pm = have.get(pid)
                          if pm is None:
                              create.append(ProjectMember(member=platform_admin, role=ADMIN_ROLE, project_id=pid, workspace_id=ws.id))
                          elif not pm.is_active or pm.role < ADMIN_ROLE:
                              raise_ids.append(pm.pk)
                          if pid not in props:
                              floor = floor - 10000 if floor is not None else 65535
                              prop_rows.append(ProjectUserProperty(user=platform_admin, project_id=pid, workspace_id=ws.id, sort_order=floor))
                      # Plane's own add-member path (bulk_create, ignore_conflicts) — the
                      # same as plane-project-access; ProjectMember.save() would insert a
                      # second ProjectUserProperty for a previously soft-deleted member.
                      with transaction.atomic():
                          ProjectMember.objects.filter(pk__in=raise_ids).update(is_active=True, role=ADMIN_ROLE)
                          ProjectMember.objects.bulk_create(create, batch_size=50, ignore_conflicts=True)
                          ProjectUserProperty.objects.bulk_create(prop_rows, batch_size=50, ignore_conflicts=True)
                      if create or raise_ids:
                          print(f"projects: {platform_admin.email} made admin of {len(create) + len(raise_ids)} project(s) "
                                f"{email} administered", flush=True)

              # The break-glass account is a workspace member only while it is the way in:
              # with Keycloak verified and a platform admin in charge it leaves the
              # workspace (and its project seats), so it shows up nowhere a person works;
              # while Keycloak is NOT verified the password form is back on and this
              # account is re-admitted, because then nobody else can sign in. A lookup
              # that merely failed changes nothing (no flapping on a transient error).
              if platform_admin is not None and keycloak_ready:
                  n = WorkspaceMember.objects.filter(workspace=ws, member=local_admin, is_active=True).update(is_active=False)
                  p = ProjectMember.objects.filter(workspace=ws, member=local_admin, is_active=True).update(is_active=False)
                  if n or p:
                      members_changed = True
                      print(f"workspace {slug}: break-glass {email} removed from the workspace and {p} project(s); "
                            "it keeps /god-mode/ only", flush=True)
              elif not keycloak_ready or ws.owner_id == local_admin.id:
                  note = ensure_admin_member(local_admin)
                  if note:
                      members_changed = True
                      print(f"workspace {slug}: break-glass {email} {note} (Keycloak not verified, or it still owns the workspace)", flush=True)
              if members_changed:
                  invalidate_cache_directly(path=f"/api/workspaces/{slug}/members/", url_params=False, user=False, multiple=True)

              # The console's key belongs to the platform admin — or, unresolved, to the
              # workspace owner as it stands, so a failed lookup never rotates it back.
              ws.refresh_from_db()
              key_user = platform_admin or (ws.owner if ws.owner.is_active else local_admin)
              if key_user.id != local_admin.id:
                  ensure_admin_member(key_user)
              label = "adhar-console"
              token = APIToken.objects.filter(user=key_user, label=label, is_active=True, workspace__isnull=True).order_by("created_at").first()
              if token is None:
                  token = APIToken.objects.create(user=key_user, label=label,
                      description="Server-side key the Adhar Console uses for the Define phase (generated by plane-instance-setup).",
                      user_type=0, is_active=True)
                  print(f"console API key minted for {key_user.email}", flush=True)
              else:
                  print(f"console API key present for {key_user.email}", flush=True)

              # ── 6. hand it to the console through a Secret (kube API, adhar-controlplane SA) ──
              # adhar.io/token-created-at is the key's mint time, stable across runs and
              # new on rotation: plane-console-reload restarts the console when its pod
              # predates it (env is read once, at start).
              name = os.environ["TOKEN_SECRET_NAME"]
              b64 = lambda s: base64.b64encode(s.encode()).decode()
              minted = token.created_at.astimezone(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
              body = {"apiVersion": "v1", "kind": "Secret", "type": "Opaque",
                      "metadata": {"name": name, "namespace": ns,
                                   "labels": {"app.kubernetes.io/part-of": "plane", "adhar.io/package-name": "plane"},
                                   "annotations": {"adhar.io/token-created-at": minted, "adhar.io/token-owner": key_user.email}},
                      "data": {"PLANE_URL": b64(os.environ["PLANE_API_URL"]), "PLANE_TOKEN": b64(token.token), "PLANE_WORKSPACE": b64(slug)}}
              def kube(method, url, payload, ctype="application/json"):
                  req = urllib.request.Request(url, method=method, data=json.dumps(payload).encode(),
                      headers={"Authorization": f"Bearer {bearer}", "Content-Type": ctype, "Accept": "application/json"})
                  with urllib.request.urlopen(req, context=ctx, timeout=20) as r:
                      return r.status
              # Server-side apply (JSON is YAML): one PATCH to the Secret's own
              # URL that creates it or updates it. A POST to the collection
              # carries no name, so it needed `create` on EVERY Secret; this is
              # authorised against the name, and the Role grants this one.
              st = kube("PATCH", f"{base}/{name}?fieldManager=plane-instance-setup&force=true",
                        body, "application/apply-patch+yaml")
              print(f"secret {ns}/{name} written (http {st}; key of {key_user.email}, minted {minted})", flush=True)

              # Only now that the Secret carries the new key: retire every other console
              # key (the local account's, from before the migration). plane-project-access
              # also reads "the" console key by this label, so exactly one stays active.
              retired = APIToken.objects.filter(label=label, is_active=True, workspace__isnull=True).exclude(pk=token.pk).update(is_active=False)
              if retired:
                  print(f"console API key: {retired} superseded key(s) deactivated", flush=True)

              # ── 7. VERIFY through the API the web app actually reads ─────────
              # The sign-in screen renders "No authentication methods available"
              # purely from this payload. Exiting 0 without asserting it is what
              # let a broken instance ship, so assert it here and fail loudly.
              #
              # That payload is CACHED in Redis for two hours (@cache_response on
              # InstanceEndpoint.get). The admin endpoints invalidate it when
              # they write InstanceConfiguration; cfg() above writes the rows
              # directly and does not, so a run that changed the auth methods
              # left both the sign-in page and this check reading the old set.
              # Observed: a run that switched Gitea → Keycloak verified
              # ["is_gitea_enabled"]. Drop both keys before reading.
              invalidate_cache_directly(path="/api/instances/", user=False)
              invalidate_cache_directly(path="/api/instances/configurations/", user=False)
              # The flags the FRONTEND can draw a button for. These are the
              # `is_*_enabled` keys the fork's auth bundle reads — the six the
              # stock frontend knows plus is_keycloak_enabled, which the fork's
              # web/space/admin hooks (hooks/oauth/core.tsx) added. The list must
              # match the image install.yaml deploys: with the STOCK frontend,
              # counting is_keycloak_enabled made this Job report success about
              # an instance whose sign-in page said "No authentication methods
              # available" (2026-10-11). plane_image_test.go pins the frontend
              # to the fork build for exactly that reason.
              rendered_methods = ["is_email_password_enabled", "is_magic_login_enabled", "is_google_enabled",
                                  "is_github_enabled", "is_gitlab_enabled", "is_gitea_enabled",
                                  "is_keycloak_enabled"]
              methods = list(rendered_methods)
              payload = None
              for attempt in range(12):
                  try:
                      with urllib.request.urlopen(
                              os.environ["PLANE_API_URL"].rstrip("/") + "/api/instances/", timeout=15) as r:
                          payload = json.loads(r.read().decode())
                      break
                  except Exception as exc:  # noqa: BLE001
                      print(f"verify: /api/instances/ not answering yet ({exc}) … {attempt + 1}/12", flush=True)
                      time.sleep(5)
              if payload is None:
                  raise SystemExit("FATAL: could not read /api/instances/ to verify the setup")
              conf = payload.get("config") or {}
              enabled = [m for m in methods if conf.get(m)]
              drawable = [m for m in rendered_methods if conf.get(m)]
              print("verify: " + json.dumps({"is_setup_done": (payload.get("instance") or {}).get("is_setup_done"),
                                             "enabled_methods": enabled,
                                             "rendered_by_the_frontend": drawable}), flush=True)
              if not (payload.get("instance") or {}).get("is_setup_done"):
                  failures.append("instance.is_setup_done is still false")
              if not drawable:
                  failures.append("no authentication method the FRONTEND can render is enabled — the sign-in "
                                  "page shows 'No authentication methods available' regardless of what "
                                  f"/api/instances/ reports (it reports {enabled or 'nothing'}); the fork "
                                  "frontend draws only " + ", ".join(rendered_methods))
              if keycloak_ready and not conf.get("is_keycloak_enabled"):
                  # The rows were written but the API does not report the method:
                  # an upstream (non-fork) image has no KEYCLOAK category at all.
                  failures.append("KEYCLOAK rows written but /api/instances/ does not report is_keycloak_enabled "
                                  "— is plane-api running the adhar-io fork image?")
              # The migration, asserted in the database it wrote.
              if platform_admin is not None:
                  ws.refresh_from_db()
                  if ws.owner_id == local_admin.id:
                      failures.append(f"workspace {slug} is still owned by the break-glass account {email}")
                  if token.user_id != platform_admin.id or not APIToken.objects.filter(pk=token.pk, is_active=True).exists():
                      failures.append(f"the console key is not an active key of the platform admin {platform_admin.email}")
              if failures:
                  raise SystemExit("FATAL: " + "; ".join(failures))
              print(f"OK: Plane is set up. Sign-in page offers {drawable}; "
                    f"the API also reports {sorted(set(enabled) - set(drawable)) or 'nothing extra'}", flush=True)
              PY
          resources:
            requests: {cpu: 50m, memory: 256Mi}
            limits: {memory: 1Gi}
