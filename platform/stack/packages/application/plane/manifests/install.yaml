apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: adhar-system
  name: plane-web-wl
  labels:
    helm.sh/chart: plane-ce-1.8.0
    app.kubernetes.io/name: plane-ce
    app.kubernetes.io/instance: plane
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "1.4.1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.name: adhar-system-plane-web
  template:
    metadata:
      namespace: adhar-system
      labels:
        app.name: adhar-system-plane-web
        helm.sh/chart: plane-ce-1.8.0
        app.kubernetes.io/name: plane-ce
        app.kubernetes.io/instance: plane
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/version: "1.4.1"
      annotations:
        timestamp: "pinned-by-generate-manifests"
    spec:
      initContainers:
      - name: auto-sso-index
        image: ghcr.io/adhar-io/plane-frontend:1.4.2-4
        command:
        - sh
        - -c
        - |
          src=/usr/share/caddy/html/index.html
          sed 's#<head\([^>]*\)>#<head\1><script src="/adhar-auto-sso.js"></script>#' "$src" > /patched/index.html
          if grep -q adhar-auto-sso /patched/index.html; then echo "index.html: auto sign-in script added"
          else cp "$src" /patched/index.html; echo "index.html: no <head> found, served unchanged"; fi
        resources:
          requests: {cpu: 5m, memory: 16Mi}
          limits: {memory: 64Mi}
        volumeMounts:
        - {name: auto-sso-index, mountPath: /patched}
      containers:
      - name: plane-web
        imagePullPolicy: Always
        image: ghcr.io/adhar-io/plane-frontend:1.4.2-4
        stdin: true
        tty: true
        resources:
          requests:
            memory: "50Mi"
            cpu: "50m"
          limits:
            memory: "1000Mi"
            cpu: "500m"
        volumeMounts:
        - {name: auto-sso-index, mountPath: /usr/share/caddy/html/index.html, subPath: index.html}
        - {name: auto-sso-script, mountPath: /usr/share/caddy/html/adhar-auto-sso.js, subPath: auto-sso.js}
      volumes:
      - {name: auto-sso-index, emptyDir: {}}
      - name: auto-sso-script
        configMap: {name: plane-web-auto-sso}
      serviceAccount: plane-srv-account
      serviceAccountName: plane-srv-account
