# Platform admins — and the console's Plane key — belong to EVERY project.
#
# A Plane workspace admin is not a member of the projects other people create:
# project-level reads and writes check ProjectMember, not the workspace role.
# The console works through ONE API key (plane-instance-setup mints it for
# plane-admin@adhar.local, a workspace admin), so every project created in
# Plane itself answered that key with 403 — the project record read fine, its
# work items did not, and the Define phase showed "The console's Plane key
# can't read this project" (Azure, 2026-10-28: project IBNG, created by a
# platform admin, had one member). The people in Keycloak's platform-admin
# group were in the same position for each other's projects.
#
# So this CronJob makes every active workspace admin of the platform workspace
# (the fork maps Keycloak's platform-admin group to workspace admin on every
# sign-in, and plane-instance-setup makes the console's key user one) an ADMIN
# member of every project in it, private ones included, every five minutes. It
# adds memberships the way Plane's own add-member endpoint does — ProjectMember
# plus its ProjectUserProperty, bulk-created with ignore_conflicts, which skips
# ProjectMember.save(): that save inserts a second property row and violates its
# unique constraint for anyone whose earlier membership was soft-deleted — and
# re-activates or raises a membership someone removed or lowered, because Plane
# itself refuses to give a workspace admin a project role below admin. It never
# removes anyone. A run that changed a project proves the change through the
# console's own key (one work-items read per changed project; the key is
# rate-limited and shared by every console user, so unchanged projects are not
# re-read) and exits non-zero if the key still gets anything but 200.
#
# The script lives in a ConfigMap Argo CD tracks: a change to it shows up as a
# diff and reaches the next run, which a script inlined in a hook never did.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: plane-project-access
  namespace: adhar-system
data:
  reconcile.py: |
    import json, os, sys, urllib.error, urllib.request
    from django.db import transaction
    from django.db.models import Min
    from plane.db.models import APIToken, Project, ProjectMember, ProjectUserProperty, Workspace, WorkspaceMember

    ADMIN, MEMBER = 20, 15
    slug = os.environ["WORKSPACE_SLUG"]
    ws = Workspace.objects.filter(slug=slug).first()
    if ws is None:
        print(f"workspace {slug} does not exist yet (plane-instance-setup creates it); nothing to do", flush=True)
        sys.exit(0)

    # Who must reach every project: each active workspace admin, plus the
    # console key's user at whatever role it holds in the workspace.
    key = (APIToken.objects.filter(label=os.environ["CONSOLE_KEY_LABEL"], is_active=True, workspace__isnull=True)
           .order_by("created_at").first())
    targets = {}
    for wm in WorkspaceMember.objects.filter(workspace=ws, is_active=True).select_related("member"):
        if not wm.member.is_active:
            continue
        if wm.role == ADMIN or (key is not None and wm.member_id == key.user_id and wm.role >= MEMBER):
            targets[wm.member_id] = (wm.role, wm.member.email)
    if key is None:
        print(f"WARNING: no active '{os.environ['CONSOLE_KEY_LABEL']}' API key yet (plane-instance-setup mints it)", flush=True)
    elif key.user_id not in targets:
        print(f"WARNING: the console key's user is not an active member of workspace {slug}", flush=True)

    sort_floor = {uid: v for uid, v in ProjectUserProperty.objects.filter(workspace=ws, user_id__in=targets)
                  .values("user_id").annotate(v=Min("sort_order")).values_list("user_id", "v")}
    changed = []
    projects = list(Project.objects.filter(workspace=ws))
    for project in projects:
        current = {pm.member_id: pm for pm in ProjectMember.objects.filter(project=project, member_id__in=targets)}
        have_props = set(ProjectUserProperty.objects.filter(project=project, user_id__in=targets)
                         .values_list("user_id", flat=True))
        create, update, props, notes = [], [], [], []
        for uid, (role, email) in targets.items():
            pm = current.get(uid)
            if pm is None:
                create.append(ProjectMember(member_id=uid, role=role, project_id=project.id, workspace_id=ws.id))
                notes.append(f"added {email}")
            elif not pm.is_active or pm.role < role:
                notes.append(f"{'re-activated' if not pm.is_active else 'raised'} {email} (role {pm.role} -> {max(pm.role, role)})")
                pm.is_active, pm.role = True, max(pm.role, role)
                update.append(pm)
            if uid not in have_props:
                floor = sort_floor.get(uid)
                sort_floor[uid] = floor - 10000 if floor is not None else 65535
                props.append(ProjectUserProperty(user_id=uid, project_id=project.id, workspace_id=ws.id,
                                                 sort_order=sort_floor[uid]))
        if create or update or props:
            with transaction.atomic():
                ProjectMember.objects.bulk_update(update, ["is_active", "role"], batch_size=100)
                ProjectMember.objects.bulk_create(create, batch_size=50, ignore_conflicts=True)
                ProjectUserProperty.objects.bulk_create(props, batch_size=50, ignore_conflicts=True)
            if create or update:
                changed.append(project)
            print(f"{project.identifier}: " + ("; ".join(notes) or "added missing user properties"), flush=True)

    # Prove it in the database for every project, and through the console's own
    # key for the ones this run changed.
    failures = []
    for project in projects:
        active = dict(ProjectMember.objects.filter(project=project, member_id__in=targets, is_active=True)
                      .values_list("member_id", "role"))
        for uid, (role, email) in targets.items():
            if active.get(uid, 0) < role:
                failures.append(f"{project.identifier}: {email} is not an active member at role >= {role}")
    if key is not None:
        api = os.environ["PLANE_API_URL"].rstrip("/")
        for project in changed[:10]:
            url = f"{api}/api/v1/workspaces/{slug}/projects/{project.id}/work-items/?per_page=1"
            try:
                with urllib.request.urlopen(urllib.request.Request(url, headers={"X-API-Key": key.token}), timeout=20) as r:
                    status = r.status
            except urllib.error.HTTPError as err:
                status = err.code
            except Exception as exc:  # noqa: BLE001 — plane-api down is a failed run, not a traceback
                status = f"unreachable ({exc})"
            print(f"verify {project.identifier}: the console's key reads its work items -> {status}", flush=True)
            if status != 200:
                failures.append(f"{project.identifier}: the console's key still gets {status}")
        if len(changed) > 10:
            print(f"verify: {len(changed) - 10} more changed project(s) checked in the database only "
                  "(the shared key is rate-limited)", flush=True)
    if failures:
        raise SystemExit("FATAL: " + "; ".join(failures))
    print(json.dumps({"workspace": slug, "projects": len(projects), "changed": [p.identifier for p in changed],
                      "admins": sorted(email for _, email in targets.values())}), flush=True)
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: plane-project-access
  namespace: adhar-system
spec:
  # A project created in Plane is reachable by the console within five minutes
  # (its 403 messages say so); plane_project_access_test.go pins the interval.
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      # Under Forbid, a hung run would otherwise skip every later schedule.
      activeDeadlineSeconds: 240
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          restartPolicy: Never
          enableServiceLinks: false
          # Talks to Postgres and plane-api only; no kube API.
          automountServiceAccountToken: false
          containers:
            - name: reconcile
              image: ghcr.io/adhar-io/plane-backend:1.4.2-4
              envFrom:
                - configMapRef: {name: plane-app-vars}
                - secretRef: {name: plane-app-secrets}
                - secretRef: {name: plane-doc-store-secrets}
              env:
                # The workspace and key label plane-instance-setup creates.
                - name: WORKSPACE_SLUG
                  value: adhar
                - name: CONSOLE_KEY_LABEL
                  value: adhar-console
                - name: PLANE_API_URL
                  value: http://plane-api.adhar-system.svc.cluster.local:8000
              command: [sh, -c, 'cd /code && python manage.py shell < /opt/adhar/reconcile.py']
              volumeMounts:
                - {name: script, mountPath: /opt/adhar, readOnly: true}
              resources:
                requests: {cpu: 50m, memory: 256Mi}
                limits: {memory: 1Gi}
          volumes:
            - name: script
              configMap: {name: plane-project-access}
