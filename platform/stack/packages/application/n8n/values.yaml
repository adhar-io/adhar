# n8n values for Adhar (community 8gears chart). Ingress disabled -- routing is
# handled by the Cilium Gateway API (adhar-gateway) via manifests/httproute.yaml.
# n8n is served host-based at n8n.adhar.localtest.me (the HTTPRoute hostname);
# the editor/webhook base URLs must match that host, not a sub-path, or the
# SPA calls the apex host and never loads behind the Gateway.
ingress:
  enabled: false

# the main (n8n) application config. The main.config dict is rendered into a
# ConfigMap as environment variables (nested keys joined with "_", uppercased).
main:
  config:
    # WEBHOOK_URL / N8N_EDITOR_BASE_URL carry the route hostname so the editor
    # and generated webhook links resolve on every domain.
    WEBHOOK_URL: "https://n8n.adhar.localtest.me:8443/"
    N8N_EDITOR_BASE_URL: "https://n8n.adhar.localtest.me:8443/"
    N8N_HOST: "n8n.adhar.localtest.me"
    N8N_PATH: "/"
    N8N_PROTOCOL: "https"
    N8N_PORT: "5678"
  service:
    enabled: true
    type: ClusterIP
    port: 80
