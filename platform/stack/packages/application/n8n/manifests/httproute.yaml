# n8n routed through the Cilium Gateway (adhar-gateway). TLS terminates at the
# Gateway (adhar-cert), replacing the chart's Ingress (disabled in values.yaml).
# Requests to /n8n are forwarded to the n8n service on port 80. n8n is configured
# (N8N_PATH / WEBHOOK_URL) to serve under the /n8n sub-path.
#
# SSO: every backend below is the Keycloak oauth2-proxy from sso.yaml, which
# forwards to the original upstream(s): n8n:80.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: n8n
  namespace: adhar-system
  annotations:
    # After the oauth2-proxy (sso.yaml, wave 5): ArgoCD holds a wave until its
    # resources are healthy, and a route whose backend Service does not exist
    # yet is Degraded (ResolvedRefs=False) — at an earlier wave that deadlocks
    # the sync on a fresh cluster and the proxy is never created.
    argocd.argoproj.io/sync-wave: "6"
  labels:
    app.kubernetes.io/name: n8n
    app.kubernetes.io/instance: n8n
    app.kubernetes.io/part-of: n8n
spec:
  parentRefs:
    - name: adhar-gateway
      namespace: adhar-system
  hostnames:
    - n8n.adhar.localtest.me
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: n8n-oauth2-proxy
          port: 4180
