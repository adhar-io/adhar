# Kargo Helm Chart Values
#
# Gateway API only -- NO nginx Ingress. The chart's Ingress resources are
# disabled by default (api.ingress.enabled=false); we keep them off and route
# the kargo-api ClusterIP service through the Cilium Gateway via
# manifests/httproute.yaml.
#
# Admin credentials come from the pre-created "kargo-api" Secret shipped in
# manifests/ingress.yaml (ADMIN_ACCOUNT_PASSWORD_HASH + token signing key), so
# the chart does not generate its own.

api:
  # Hostname where Kargo's UI/API is reached through the Gateway (host-based
  # route, rewritten to the platform domain at seed time).
  host: kargo.adhar.localtest.me
  # TLS terminates at the Cilium Gateway; the API must speak plain HTTP behind
  # it. With the chart default (self-signed TLS on the API pod) every request
  # through the route died with "client sent an HTTP request to an HTTPS
  # server" (HTTP 400).
  tls:
    enabled: false
  # Native Keycloak OIDC (NOT an oauth2-proxy front: the kargo CLI logs in via
  # OIDC directly). Kargo uses the authorization-code flow with PKCE and takes
  # NO client secret, so both Keycloak clients are PUBLIC; they are shipped as
  # labelled ConfigMaps in manifests/keycloak-clients.yaml and provisioned by
  # the keycloak package's client reconciler.
  #   kargo      UI:  redirect https://kargo.adhar.localtest.me:8443/login
  #   kargo-cli  CLI: redirect http://localhost:*/auth/callback
  # Admin access maps from the realm's admin groups via the `groups` claim
  # (the platform's Keycloak groups are `platform-admin` / `admin`).
  #
  # kargo-api performs OIDC discovery/token validation against the issuer over
  # TLS. The chart has no issuer-CA option, so the platform Gateway certificate
  # (Secret adhar-cert: self-signed locally, Let's Encrypt on cloud) is mounted
  # and added to Go's trust directories via SSL_CERT_DIR — the system roots
  # stay in place, the platform cert is simply an extra anchor.
  env:
    - name: SSL_CERT_DIR
      value: /etc/ssl/certs:/etc/adhar-ca
  volumes:
    - name: adhar-ca
      secret:
        secretName: adhar-cert
        items:
          - key: tls.crt
            path: adhar-gateway.crt
  volumeMounts:
    - name: adhar-ca
      mountPath: /etc/adhar-ca
      readOnly: true
  oidc:
    enabled: true
    issuerURL: https://keycloak.adhar.localtest.me:8443/realms/adhar
    clientID: kargo
    cliClientID: kargo-cli
    additionalScopes:
      - groups
    usernameClaim: preferred_username
    admins:
      claims:
        groups:
          - platform-admin
          - admin
    dex:
      enabled: false
  ingress:
    enabled: false
    tls:
      enabled: false
  service:
    type: ClusterIP
  secret:
    name: kargo-api

externalWebhooksServer:
  ingress:
    enabled: false

controller:
  # The environments repo is reached over the in-cluster Gitea service
  # (plain HTTP inside the cluster, TLS terminates at the Gateway). Kargo
  # otherwise "refused to get credentials for insecure HTTP endpoint" and every
  # promotion's git-push failed with "could not read Username".
  allowCredentialsOverHTTP: true
