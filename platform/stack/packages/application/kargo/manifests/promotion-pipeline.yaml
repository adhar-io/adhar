# Environment promotion pipeline (roadmap P2.5): dev → staging → prod as
# first-class Git promotion over the platform's environments repository.
#
# Model: the environments repo's development/ tree is the promotion source.
# Kargo's Warehouse creates Freight for each commit touching it; the staging
# Stage auto-promotes (copies development config over staging and pushes), and
# the production Stage promotes only on manual approval in the Kargo UI/CLI —
# the promotion itself is still a Git commit ArgoCD then syncs (ADR-0004:
# Git remains the only write path).
#
# The Project gets its own namespace (Kargo requirement — a Project owns a
# namespace of the same name; this is a sanctioned exception to the
# shared-namespace rule of ADR-0011, like open-function). Git credentials are
# projected from gitea-credential via ESO using the kubernetes-backed
# ClusterSecretStore (same mechanism as the SSO secret chain, ADR-0013).
apiVersion: v1
kind: Namespace
metadata:
  name: adhar-environments
  labels:
    kargo.akuity.io/project: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "10"
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Project
metadata:
  name: adhar-environments
  annotations:
    argocd.argoproj.io/sync-wave: "11"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
---
# Promotion policy lives in ProjectConfig since Kargo 1.3 (Project has no
# spec any more — an inline promotionPolicies block fails validation).
apiVersion: kargo.akuity.io/v1alpha1
kind: ProjectConfig
metadata:
  name: adhar-environments
  namespace: adhar-environments
  annotations:
    argocd.argoproj.io/sync-wave: "12"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  # The SAME three environments, in the same order, with the same policy as
  # every application's own pipeline (adhar-supply-chain/90-app-environments):
  # dev and test promote on their own, prod waits for a person. This pipeline
  # used to say staging -> production while `adhar up` created the namespaces
  # dev/test/prod and the per-app pipelines used dev/test/prod, so the Kargo UI
  # and the console showed environments that existed nowhere else (2026-10-04).
  promotionPolicies:
    - stageSelector:
        name: dev
      autoPromotionEnabled: true
    - stageSelector:
        name: test
      autoPromotionEnabled: true
    - stageSelector:
        name: prod
      autoPromotionEnabled: false
---
# Git credentials for Kargo, projected from the platform's gitea-credential.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kargo-gitea-creds
  namespace: adhar-environments
  annotations:
    argocd.argoproj.io/sync-wave: "12"
spec:
  secretStoreRef:
    name: gitea
    kind: ClusterSecretStore
  target:
    name: kargo-gitea-creds
    template:
      metadata:
        labels:
          kargo.akuity.io/cred-type: git
      data:
        repoURL: http://gitea-http.adhar-system.svc.cluster.local:3000/adhar/environments
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: gitea-credential
        property: username
    - secretKey: password
      remoteRef:
        key: gitea-credential
        property: password
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: environments
  namespace: adhar-environments
  annotations:
    argocd.argoproj.io/sync-wave: "13"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  subscriptions:
    - git:
        repoURL: http://gitea-http.adhar-system.svc.cluster.local:3000/adhar/environments
        branch: main
        # Kargo treats a bare entry as a path PREFIX (use "glob:"/"regex:" for
        # patterns); "development/**" matched nothing and the Warehouse sat at
        # "No commits discovered".
        includePaths:
          - glob:dev/**
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: dev
  namespace: adhar-environments
  labels: {adhar.io/environment: dev}
  annotations:
    argocd.argoproj.io/sync-wave: "14"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  # dev is the SOURCE: a commit to dev/ in the environments repo is the freight.
  # Its promotion has nothing to write — the change is already in dev — so a
  # single clone step completes it and marks the freight current, which is what
  # makes dev visible as an environment and lets test promote from it.
  requestedFreight:
    - origin:
        kind: Warehouse
        name: environments
      sources:
        direct: true
  promotionTemplate:
    spec:
      steps:
        - uses: git-clone
          config:
            repoURL: http://gitea-http.adhar-system.svc.cluster.local:3000/adhar/environments
            checkout:
              - branch: main
                path: ./src
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: test
  namespace: adhar-environments
  labels: {adhar.io/environment: test}
  annotations:
    argocd.argoproj.io/sync-wave: "14"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: environments
      sources:
        stages:
          - dev
  promotionTemplate:
    spec:
      steps:
        - uses: git-clone
          config:
            repoURL: http://gitea-http.adhar-system.svc.cluster.local:3000/adhar/environments
            checkout:
              - branch: main
                path: ./src
        - uses: copy
          config:
            inPath: ./src/dev/config.yaml
            outPath: ./src/test/config.yaml
        - uses: git-commit
          config:
            path: ./src
            message: "promote: dev -> test"
        - uses: git-push
          config:
            path: ./src
            targetBranch: main
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod
  namespace: adhar-environments
  labels: {adhar.io/environment: prod}
  annotations:
    argocd.argoproj.io/sync-wave: "14"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: environments
      sources:
        stages:
          - test
  promotionTemplate:
    spec:
      steps:
        - uses: git-clone
          config:
            repoURL: http://gitea-http.adhar-system.svc.cluster.local:3000/adhar/environments
            checkout:
              - branch: main
                path: ./src
        - uses: copy
          config:
            inPath: ./src/test/config.yaml
            outPath: ./src/prod/config.yaml
        - uses: git-commit
          config:
            path: ./src
            message: "promote: test -> prod"
        - uses: git-push
          config:
            path: ./src
            targetBranch: main
