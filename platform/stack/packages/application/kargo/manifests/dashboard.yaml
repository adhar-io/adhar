# Grafana dashboard for Kargo (application/kargo). Kargo controllers are
# controller-runtime based; this dashboard renders the standard
# controller_runtime_* / workqueue_* / go_* metrics. Fed by
# servicemonitor.yaml. Datasource is variable-driven.
