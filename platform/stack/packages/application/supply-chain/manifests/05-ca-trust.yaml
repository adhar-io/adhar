# CA trust for the HTTPS-everywhere build path.
#
# Harbor now serves its in-cluster registry over TLS signed by the platform
# `adhar` CA (application/harbor). Every actor that pushes/pulls those images must
# trust that CA:
#   * the kpack controller (resolves + pushes the ClusterBuilder image) — trusts
#     the `adhar-ca` ConfigMap in adhar-system (see buildpack package; kpack moved
#     out of kpack-system into the shared platform namespace, ADR-0011).
#   * the kpack build pods (lifecycle prepare/analyze/export talk to Harbor) —
#     kpack exposes no way to add a volume/env to build pods, so a Kyverno mutate
#     policy injects the CA + SSL_CERT_DIR into them (below).
#
# This file (a) distributes the adhar CA into the two ConfigMaps and (b) defines
# the build-pod mutate policy. The CA itself is the per-cluster `adhar-cert`
# secret, so it is copied at sync time rather than baked into git.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: adhar-ca-distributor
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "-2"}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: adhar-ca-distributor
  annotations: {argocd.argoproj.io/sync-wave: "-2"}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, create, update, patch]
  # The kpack controller builds its CA pool once at start-up, so refreshing the
  # ConfigMap is not enough -- the Deployment has to be restarted.
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: adhar-ca-distributor
  annotations: {argocd.argoproj.io/sync-wave: "-2"}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: adhar-ca-distributor}
subjects: [{kind: ServiceAccount, name: adhar-ca-distributor, namespace: adhar-system}]
---
# Copy the adhar CA into the ConfigMaps kpack-controller and the build pods read.
# Runs as a Sync hook (wave -1) so the ConfigMaps exist before those pods start.
apiVersion: batch/v1
kind: Job
metadata:
  name: adhar-ca-distributor
  namespace: adhar-system
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 5
  activeDeadlineSeconds: 300
  template:
    spec:
      serviceAccountName: adhar-ca-distributor
      restartPolicy: Never
      containers:
        - name: distribute
          image: alpine/k8s:1.31.1
          command: [bash, -c]
          args:
            - |
              set -euo pipefail
              # TWO different certificates are involved, and using the wrong one
              # is what broke every kpack build:
              #
              #   harbor-core-internal-tls (ca.crt) — the CA that signs the
              #     certificate harbor-core presents on the CLUSTER network. This
              #     is the one kpack and the build lifecycle must trust. Without
              #     it the ClusterBuilder never resolves:
              #       Get "https://harbor-core.adhar-system.svc.cluster.local/v2/":
              #       tls: failed to verify certificate: x509: certificate signed
              #       by unknown authority
              #     and the supply-chain sync then hangs forever on
              #     "waiting for healthy state of kpack.io/ClusterBuilder".
              #
              #   adhar-cert (tls.crt) — the platform EDGE certificate for
              #     *.<host>. It is a leaf, not a CA, so it can verify nothing;
              #     it used to be the only thing in this bundle.
              #
              # Both go in, harbor's CA first. Concatenated PEM is a valid bundle.
              for i in $(seq 1 60); do
                kubectl get secret harbor-core-internal-tls -n adhar-system >/dev/null 2>&1 && break
                echo "waiting for harbor-core-internal-tls ($i/60)"; sleep 5
              done
              kubectl get secret harbor-core-internal-tls -n adhar-system \
                -o jsonpath='{.data.ca\.crt}' | base64 -d > /tmp/ca.crt
              if kubectl get secret adhar-cert -n adhar-system >/dev/null 2>&1; then
                kubectl get secret adhar-cert -n adhar-system \
                  -o jsonpath='{.data.tls\.crt}' | base64 -d >> /tmp/ca.crt
              fi
              # Three destinations, because kpack is the ONE package that does not
              # live in adhar-system (ADR-0011: kpack and cosign both hardcode
              # Secret/webhook-certs, and two knative webhooks cannot share it):
              #
              #   kpack-system/adhar-ca   — mounted by the kpack-controller
              #     Deployment at /etc/adhar-ca with `optional: true`, which is why
              #     a missing ConfigMap produced no error at all: the mount was
              #     simply empty, SSL_CERT_DIR found nothing, and every registry
              #     call failed to verify Harbor.
              #   adhar-system/adhar-ca        — anything in the platform namespace
              #     that mounts the same name.
              #   adhar-system/adhar-ca-bundle — injected into kpack BUILD pods by
              #     the Kyverno mutate below (builds run in adhar-system).
              for ns in kpack-system adhar-system; do
                kubectl get namespace "$ns" >/dev/null 2>&1 || continue
                kubectl create configmap adhar-ca -n "$ns" --from-file=ca.crt=/tmp/ca.crt \
                  --dry-run=client -o yaml | kubectl apply -f -
              done
              kubectl create configmap adhar-ca-bundle -n adhar-system --from-file=ca.crt=/tmp/ca.crt \
                --dry-run=client -o yaml | kubectl apply -f -
              # Pick up the refreshed bundle: the controller reads it once at boot.
              kubectl -n kpack-system rollout restart deployment/kpack-controller 2>/dev/null \
                || echo "kpack-controller not installed yet; it will read the bundle at start-up"
              echo "CA bundle distributed to adhar-system/adhar-ca and adhar-system/adhar-ca-bundle"
---
# Inject the adhar CA into every kpack build pod. kpack builds run in adhar-system
# (excluded from most policies) — this mutate is scoped tightly to pods carrying
# the kpack build label, and points SSL_CERT_DIR at the CA alongside the system
# trust store so the Go-based lifecycle trusts Harbor without skip_verify.
# NOTE: requires the platform Kyverno to admit adhar-system (see security/kyverno):
# the webhook namespaceSelector must not exclude adhar-system, and the Enforce
# verify-supply-chain-images policy must exclude adhar-system.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: kpack-build-ca-trust
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    policies.kyverno.io/description: >-
      Inject the adhar CA + SSL_CERT_DIR into kpack build pods so the buildpacks
      lifecycle trusts Harbor's internal TLS when it pushes/pulls images.
spec:
  background: false
  rules:
    - name: inject-adhar-ca
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [adhar-system]
              selector:
                matchExpressions:
                  - key: image.kpack.io/image
                    operator: Exists
      mutate:
        patchStrategicMerge:
          spec:
            volumes:
              - name: adhar-ca-bundle
                configMap:
                  name: adhar-ca-bundle
            initContainers:
              - (name): "?*"
                volumeMounts:
                  - name: adhar-ca-bundle
                    mountPath: /etc/adhar-ca
                    readOnly: true
                env:
                  - name: SSL_CERT_DIR
                    value: /etc/ssl/certs:/etc/adhar-ca
            containers:
              - (name): "?*"
                volumeMounts:
                  - name: adhar-ca-bundle
                    mountPath: /etc/adhar-ca
                    readOnly: true
                env:
                  - name: SSL_CERT_DIR
                    value: /etc/ssl/certs:/etc/adhar-ca
