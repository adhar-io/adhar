# Admission gate — only cosign-signed images from our Harbor may run.
#
# SCOPED on purpose: imageReferences matches ONLY
# harbor-core.adhar-system.svc.cluster.local/library/* — i.e. images this
# supply chain builds. Every other image (upstream platform components, which are
# not signed by us) is simply not matched by this rule, so nothing else is
# blocked. mutateDigest rewrites the admitted tag to the verified digest, so what
# runs is exactly what was verified.
#
# The publicKey below is the cosign.pub generated into the `cosign-key` secret by
# 00-foundation.yaml. Keep it in sync if the key is rotated:
#   kubectl get secret cosign-key -n adhar-system -o jsonpath='{.data.cosign\.pub}' | base64 -d
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-supply-chain-images
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    policies.kyverno.io/title: Verify Supply-Chain Image Signatures
    policies.kyverno.io/category: Software Supply Chain Security
    policies.kyverno.io/severity: high
spec:
  validationFailureAction: Enforce
  background: false
  webhookTimeoutSeconds: 30
  failurePolicy: Ignore
  rules:
    - name: verify-harbor-library-signature
      match:
        any:
          - resources:
              kinds: [Pod]
      exclude:
        # adhar-system is where kpack build pods run (and is now admitted by
        # Kyverno so the build-pod CA mutate can fire — see security/kyverno).
        # Harbor's registry is HTTPS now, so signature verification here would
        # require the Kyverno admission controller itself to trust the adhar CA
        # and reach Harbor at admission time; to avoid coupling platform-namespace
        # admission to Harbor availability, verification is scoped to workload
        # namespaces and skipped for adhar-system (its images are still signed by
        # kpack at build time).
        any:
          - resources:
              namespaces: [adhar-system]
      verifyImages:
        - imageReferences:
            # The name the Tekton pipelines push to (in-cluster Service DNS).
            - "harbor-core.adhar-system.svc.cluster.local/library/*"
            # The name workloads PULL by. A node kubelet resolves through the
            # host resolver, which cannot see *.svc.cluster.local, so every pod
            # referencing the in-cluster name sat in ImagePullBackOff with "no
            # such host". Workload manifests use the platform-edge Harbor name
            # instead; both point at the same repository, so one signature
            # satisfies either. The trailing wildcard covers the local ":8443"
            # form and the port-less form behind a 443 LoadBalancer.
            - "harbor.*/library/*"
          mutateDigest: true
          verifyDigest: true
          required: true
          attestors:
            - count: 1
              entries:
                - keys:
                    # The key the platform's cosign-sign Task signs with — Secret/cosign-key,
                    # generated per cluster by security/cosign. This used to be an INLINE public
                    # key that could never match a cluster-generated private key, so every
                    # signed image was refused as "no matching signatures: invalid signature"
                    # (2026-09-15 DO bring-up) — the enforce policy blocked the very images the
                    # platform had just signed.
                    secret:
                      name: cosign-key
                      namespace: adhar-system
                    rekor:
                      ignoreTlog: true