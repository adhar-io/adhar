---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{values.name | dump}}
  description: Golden-path static frontend
  annotations:
    backstage.io/techdocs-ref: dir:.
    backstage.io/kubernetes-label-selector: 'entity-id=${{values.name}}'
    backstage.io/kubernetes-namespace: ${{values.name | dump}}
    argocd/app-name: ${{values.name | dump}}
  links:
    - url: https://gitea.adhar.localtest.me:8443
      title: Repo URL
      icon: github
spec:
  owner: ${{values.owner | dump}}
  lifecycle: experimental
  type: website
  system: ${{values.name | dump}}
---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: ${{values.name | dump}}
  description: Golden-path static frontend system
  annotations:
    backstage.io/techdocs-ref: dir:.
  links:
    - url: https://github.com/adhar-io/adhar
      title: Adhar Repo
      icon: github
spec:
  owner: ${{values.owner | dump}}
  lifecycle: experimental
  type: website
