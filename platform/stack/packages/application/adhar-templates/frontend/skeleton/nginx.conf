server {
    listen       8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Probe endpoint used by the Deployment's liveness/readiness probes.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # SPA-friendly: unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
