---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{values.name | dump}}
  description: ${{values.description | dump}}
  annotations:
    backstage.io/techdocs-ref: dir:.
    backstage.io/kubernetes-label-selector: 'entity-id=${{values.name}}'
    backstage.io/kubernetes-namespace: ${{values.name | dump}}
    argocd/app-name: ${{values.name | dump}}
    adhar.io/model-name: ${{values.modelName | dump}}
    adhar.io/framework: ${{values.framework | dump}}
  tags:
    - golden-path
    - ml
    - kubeflow
    - fastapi
  links:
    - url: https://gitea.adhar.localtest.me:8443
      title: Repo URL
      icon: github
    - url: https://${{values.name}}.adhar.localtest.me:8443
      title: Model API
      icon: dashboard
    - url: https://kubeflow.adhar.localtest.me:8443
      title: Kubeflow Pipelines
      icon: dashboard
spec:
  owner: ${{values.owner | dump}}
  lifecycle: experimental
  type: service
  system: ${{values.name | dump}}
---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: ${{values.name | dump}}
  description: Golden-path ML system (training pipeline + model server)
  annotations:
    backstage.io/techdocs-ref: dir:.
  links:
    - url: https://github.com/adhar-io/adhar
      title: Adhar Repo
      icon: github
spec:
  owner: ${{values.owner | dump}}
  lifecycle: experimental
  type: service
