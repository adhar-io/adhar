apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: ${{values.name | dump}}
  namespace: ${{values.name | dump}}
  labels:
    entity-id: ${{values.name}}
    app.kubernetes.io/name: ${{values.name}}
    adhar.io/owner: ${{values.owner}}
spec:
  scaleTargetRef:
    name: ${{values.name | dump}}
  pollingInterval: 30
  cooldownPeriod: 120
  minReplicaCount: 1
  maxReplicaCount: 10
  triggers:
    - type: cpu
      metricType: Utilization
      metadata:
        value: "70"
    - type: memory
      metricType: Utilization
      metadata:
        value: "75"
