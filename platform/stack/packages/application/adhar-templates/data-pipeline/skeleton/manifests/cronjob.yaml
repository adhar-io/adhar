# Daily materialization run. Mirrors the Dagster schedule in
# dagster/pipeline.py (0 6 * * * UTC) but runs as a plain Kubernetes CronJob so
# the scaffold needs no long-running Dagster daemon: ingest asset -> Iceberg,
# then the dbt staging build.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ${{values.name}}-materialize
  namespace: ${{values.name | dump}}
  labels:
    entity-id: ${{values.name}}
    app.kubernetes.io/name: ${{values.name}}
    adhar.io/owner: ${{values.owner}}
spec:
  schedule: "0 6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            entity-id: ${{values.name}}
            app.kubernetes.io/name: ${{values.name}}
            adhar.io/owner: ${{values.owner}}
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: materialize
              # Placeholder until the paved-road pipeline promotes an image with
              # dagster/pipeline.py + dbt/ baked in. Replace with your registry
              # image; the command already targets the scaffolded module.
              image: docker.io/dagster/dagster:1.9.5
              command: ["dagster"]
              args:
                - "asset"
                - "materialize"
                - "-m"
                - "dagster.pipeline"
                - "--select"
                - "*"
              envFrom:
                - configMapRef:
                    name: ${{values.name}}-iceberg-catalog
              env:
                - name: DAGSTER_HOME
                  value: /opt/dagster/home
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              volumeMounts:
                - name: dagster-home
                  mountPath: /opt/dagster/home
          volumes:
            - name: dagster-home
              emptyDir: {}
