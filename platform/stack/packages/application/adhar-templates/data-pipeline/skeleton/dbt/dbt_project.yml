name: '${{values.name}}'
version: '1.0.0'
config-version: 2

# The Trino profile (dbt-trino) reads/writes the platform Iceberg catalog.
profile: '${{values.name}}'

model-paths: ["models"]
target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  ${{values.name}}:
    staging:
      +materialized: view
      +schema: staging
