# Nexus secrets encryption key (2026-10-24).
#
# WHY: Nexus encrypts the secrets it stores (proxy-repository remote
# credentials, capability passwords, …) with a key, and unless it is given one
# that key is the DEFAULT compiled into every Nexus build — anyone with a copy of
# the database can decrypt them. The status page says so:
#   "Default Secret Encryption Key — Nexus was not configured with an encryption
#    key and is using the Default key."
# This Job generates a platform-specific key ONCE, in-cluster, into Secret
# `nexus-secrets-key`. install.yaml mounts it and points -Dnexus.secrets.file at
# it; bootstrap.sh (config-job.yaml, step 4b) then re-encrypts the existing
# secrets under it. No key material is ever in Git.
#
# ⚠️ THIS SECRET IS DATA-LOSS RELEVANT. Once Nexus has re-encrypted under it,
# Nexus cannot decrypt its stored secrets without it, and re-encryption cannot
# be undone. Back it up together with the nexus-data volume (README, "Secrets
# encryption key"). Losing it means re-entering every stored credential.
#
# WHY A JOB AND NOT AN ESO Password generator like the rest of the platform:
# an ExternalSecret regenerates whenever it is recreated (an Application
# deleted and re-added, a package re-enabled), and under the default
# creationPolicy the Secret is garbage-collected with it. Either one silently
# swaps the key under a Nexus that already depends on the old one. A Secret
# that only a create-if-absent Job ever writes cannot be regenerated, and,
# because it carries no Argo CD tracking metadata and no ownerReference, it can
# be neither pruned nor cascade-deleted with the Application. The annotations
# on it are a second guard in case it is ever adopted into Git by mistake.
#
# A Sync hook at wave 0, so the Secret exists before the Nexus Deployment
# (wave 1) — the Deployment mounts it non-optionally on purpose: a Nexus that
# has re-encrypted must never start without its key.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nexus-secrets-key
  namespace: adhar-system
  # Wave -1 so it exists BEFORE the wave-0 hook (same trap as
  # adhar-credential-rotation: a hook admitted before its ServiceAccount sits in
  # ContainerCreating forever).
  annotations: {argocd.argoproj.io/sync-wave: "-1"}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nexus-secrets-key
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "-1"}
rules:
  # get to check presence, create to write it once. Deliberately NO update /
  # patch / delete: this Job cannot change an existing key even by mistake.
  - {apiGroups: [""], resources: [secrets], verbs: [create]}
  - {apiGroups: [""], resources: [secrets], resourceNames: [nexus-secrets-key], verbs: [get]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nexus-secrets-key
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "-1"}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: nexus-secrets-key}
subjects: [{kind: ServiceAccount, name: nexus-secrets-key, namespace: adhar-system}]
---
apiVersion: batch/v1
kind: Job
metadata:
  name: nexus-secrets-key
  namespace: adhar-system
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 300
  template:
    spec:
      serviceAccountName: nexus-secrets-key
      restartPolicy: Never
      enableServiceLinks: false
      containers:
        - name: keygen
          image: alpine/k8s:1.31.1
          env:
            - {name: HOME, value: /tmp}
            - {name: NS, value: adhar-system}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 256Mi}
          command: [bash, -c]
          args:
            - |
              set -euo pipefail
              umask 077
              if kubectl -n "${NS}" get secret nexus-secrets-key >/dev/null 2>&1; then
                echo "nexus-secrets-key exists; never regenerated"
                exit 0
              fi
              # The ID names the key inside Nexus (re-encrypt's secretKeyId).
              # A date-stamped ID leaves room for a future rotation, which adds
              # a second key to the file and re-encrypts to it.
              KEY_ID="adhar-$(date -u +%Y%m%d)"
              # 32 random bytes, base64 — Sonatype's recommended key shape.
              KEY=$(head -c 32 /dev/urandom | base64 | tr -d '\n')
              jq -nc --arg id "${KEY_ID}" --arg k "${KEY}" \
                '{active:$id, keys:[{id:$id, key:$k}]}' > /tmp/nexus.secrets.json
              printf '%s' "${KEY_ID}" > /tmp/active-key-id
              kubectl create secret generic nexus-secrets-key -n "${NS}" \
                --from-file=nexus.secrets.json=/tmp/nexus.secrets.json \
                --from-file=active-key-id=/tmp/active-key-id \
                --dry-run=client -o yaml > /tmp/secret.yaml
              rm -f /tmp/nexus.secrets.json
              # Guards in case this Secret is ever adopted into an Argo CD
              # Application: never prune it, never delete it with the app.
              kubectl annotate --local -f /tmp/secret.yaml -o yaml \
                argocd.argoproj.io/sync-options=Prune=false,Delete=false \
                argocd.argoproj.io/compare-options=IgnoreExtraneous \
                adhar.io/data-loss-relevant="Nexus cannot decrypt its stored secrets without this key; back it up with nexus-data" \
                > /tmp/secret-annotated.yaml
              kubectl label --local -f /tmp/secret-annotated.yaml -o yaml \
                app.kubernetes.io/name=nexus app.kubernetes.io/component=secrets-encryption-key \
                > /tmp/secret-final.yaml
              # `create`, never `apply`: if another run won the race the API
              # answers AlreadyExists and the existing key is kept.
              if kubectl create -f /tmp/secret-final.yaml >/dev/null 2>/tmp/err; then
                echo "nexus-secrets-key created (key id ${KEY_ID})"
              elif grep -q AlreadyExists /tmp/err; then
                echo "nexus-secrets-key was created concurrently; keeping it"
              else
                cat /tmp/err >&2; exit 1
              fi
              rm -f /tmp/secret*.yaml
