# Grafana dashboard for Nexus Repository (application/nexus). Best-effort:
# Nexus exposes Dropwizard/Prometheus metrics at
# /service/metrics/prometheus, which requires authentication. The
# ServiceMonitor in servicemonitor.yaml scrapes it with basicAuth (admin).
# `up` always works; jvm_*/nexus_* panels populate once auth is accepted.
apiVersion: v1
kind: ConfigMap
metadata:
  name: adhar-dashboard-nexus
  namespace: adhar-system
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: adhar-observability
  annotations:
    grafana_folder: "Platform"
