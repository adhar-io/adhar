# Bootstrap Nexus: create the hosted repositories (maven/npm/pypi), enable the
# npm bearer-token realm, and publish a `nexus-credentials` secret the supply
# chain uses to publish artefacts. Idempotent PostSync hook — safe every sync.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nexus-config
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "2"}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nexus-config
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "2"}
rules:
  - {apiGroups: [""], resources: [secrets], verbs: [get, create, update, patch]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nexus-config
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "2"}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: nexus-config}
subjects: [{kind: ServiceAccount, name: nexus-config, namespace: adhar-system}]
---
apiVersion: batch/v1
kind: Job
metadata:
  name: nexus-config
  namespace: adhar-system
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  template:
    spec:
      serviceAccountName: nexus-config
      restartPolicy: Never
      containers:
        - name: config
          image: alpine/k8s:1.31.1
          env:
            - {name: NEXUS, value: "http://nexus.adhar-system.svc.cluster.local:8081"}
            - {name: NEXUS_USER, value: "admin"}
            - {name: NEXUS_PASS, value: "admin123"}
          command: [bash, -c]
          args:
            - |
              set -euo pipefail
              AUTH="-u ${NEXUS_USER}:${NEXUS_PASS}"
              API="${NEXUS}/service/rest/v1"
              # 1) Wait for Nexus to be up.
              echo "waiting for Nexus…"
              for i in $(seq 1 60); do
                code=$(curl -s -o /dev/null -w "%{http_code}" "${API}/status" || echo 000)
                [ "$code" = "200" ] && { echo "Nexus up"; break; }
                sleep 10
              done
              # helper: create a hosted repo (idempotent — 400/already-exists ok)
              mkrepo() {  # $1=path $2=json
                code=$(curl -s -o /tmp/r -w "%{http_code}" $AUTH -H 'Content-Type: application/json' \
                  -X POST "${API}/repositories/$1" -d "$2")
                case "$code" in
                  201) echo "created $1" ;;
                  400) echo "$1 exists / ok ($(head -c 80 /tmp/r))" ;;
                  *) echo "warn: $1 -> $code $(head -c 120 /tmp/r)" ;;
                esac
              }
              # 2) Hosted repositories for each ecosystem.
              mkrepo maven/hosted '{"name":"maven-hosted","online":true,"storage":{"blobStoreName":"default","strictContentTypeValidation":false,"writePolicy":"ALLOW"},"maven":{"versionPolicy":"MIXED","layoutPolicy":"PERMISSIVE"}}'
              mkrepo npm/hosted   '{"name":"npm-hosted","online":true,"storage":{"blobStoreName":"default","strictContentTypeValidation":true,"writePolicy":"ALLOW"}}'
              mkrepo pypi/hosted  '{"name":"pypi-hosted","online":true,"storage":{"blobStoreName":"default","strictContentTypeValidation":true,"writePolicy":"ALLOW"}}'
              # Proxy caches (so app builds resolve upstream deps through Nexus).
              mkrepo npm/proxy    '{"name":"npm-registry","online":true,"storage":{"blobStoreName":"default","strictContentTypeValidation":true,"writePolicy":"ALLOW"},"proxy":{"remoteUrl":"https://registry.npmjs.org","contentMaxAge":1440,"metadataMaxAge":1440},"negativeCache":{"enabled":true,"timeToLive":1440},"httpClient":{"blocked":false,"autoBlock":true}}'
              mkrepo pypi/proxy   '{"name":"pypi-proxy","online":true,"storage":{"blobStoreName":"default","strictContentTypeValidation":true,"writePolicy":"ALLOW"},"proxy":{"remoteUrl":"https://pypi.org/","contentMaxAge":1440,"metadataMaxAge":1440},"negativeCache":{"enabled":true,"timeToLive":1440},"httpClient":{"blocked":false,"autoBlock":true}}'
              # Maven Central proxy + a public GROUP (maven-hosted + maven-central) so
              # builds resolve deps through Nexus. The release pipeline mirrors
              # * -> maven-public, which 404s (fails all resolution) without this group.
              mkrepo maven/proxy '{"name":"maven-central","online":true,"storage":{"blobStoreName":"default","strictContentTypeValidation":false},"proxy":{"remoteUrl":"https://repo1.maven.org/maven2/","contentMaxAge":-1,"metadataMaxAge":1440},"negativeCache":{"enabled":true,"timeToLive":1440},"httpClient":{"blocked":false,"autoBlock":true},"maven":{"versionPolicy":"RELEASE","layoutPolicy":"PERMISSIVE"}}'
              mkrepo maven/group '{"name":"maven-public","online":true,"storage":{"blobStoreName":"default","strictContentTypeValidation":false},"group":{"memberNames":["maven-hosted","maven-central"]}}'
              # 3) Enable the auth realms:
              #    - NpmToken       : `npm publish` bearer tokens
              #    - rutauth-realm  : Rut Auth (HTTP header) — lets the Keycloak
              #      SSO in front of Nexus (oauth2-proxy) log the user in via the
              #      X-Forwarded-User header. Nexus OSS has no native OIDC, so this
              #      header-trust realm is how the proxied identity becomes a Nexus
              #      session. Order matters: rutauth-realm must precede the
              #      authenticating realm so the header is honoured first.
              curl -s $AUTH -H 'Content-Type: application/json' -X PUT "${API}/security/realms/active" \
                -d '["rutauth-realm","NexusAuthenticatingRealm","NexusAuthorizingRealm","NpmToken"]' >/dev/null 2>&1 || true
              echo "npm token + rut-auth realms enabled"
              # 3b) Rut Auth capability — tells Nexus which HTTP header carries the
              # authenticated username. oauth2-proxy sends X-Forwarded-User (the
              # Keycloak preferred_username). There is no stable public v1 endpoint
              # for capabilities, so this uses the internal UI API and is strictly
              # best-effort (|| true): a version mismatch must not fail the sync.
              # If it already exists Nexus returns 400 (dup) — also fine.
              have_rut=$(curl -s $AUTH "${API%/v1}/v1/status" >/dev/null 2>&1; \
                curl -s $AUTH -H 'Content-Type: application/json' \
                  "${NEXUS}/service/rest/internal/ui/capabilities" 2>/dev/null | grep -c '"typeId":"rutauth"' || echo 0)
              if [ "${have_rut:-0}" = "0" ]; then
                code=$(curl -s -o /tmp/rut -w "%{http_code}" $AUTH \
                  -H 'Content-Type: application/json' -H 'X-Nexus-UI: true' \
                  -X POST "${NEXUS}/service/rest/internal/ui/capabilities" \
                  -d '{"typeId":"rutauth","enabled":true,"notes":"Keycloak SSO via oauth2-proxy (X-Forwarded-User)","properties":{"httpHeader":"X-Forwarded-User"}}' || echo 000)
                echo "rut-auth capability -> ${code} $(head -c 120 /tmp/rut 2>/dev/null || true)"
              else
                echo "rut-auth capability already present"
              fi
              # 4) Publish the credentials + endpoints the supply chain consumes.
              kubectl create secret generic nexus-credentials -n adhar-system \
                --from-literal=username="${NEXUS_USER}" \
                --from-literal=password="${NEXUS_PASS}" \
                --from-literal=url="${NEXUS}" \
                --from-literal=maven-hosted="${NEXUS}/repository/maven-hosted/" \
                --from-literal=maven-public="${NEXUS}/repository/maven-public/" \
                --from-literal=npm-hosted="${NEXUS}/repository/npm-hosted/" \
                --from-literal=pypi-hosted="${NEXUS}/repository/pypi-hosted/" \
                --dry-run=client -o yaml | kubectl apply -f -
              echo "nexus bootstrap complete"
