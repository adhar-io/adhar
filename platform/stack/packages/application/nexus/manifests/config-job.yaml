# Bootstrap Nexus: put the admin account on the platform admin password,
# create the automation service account, create the hosted repositories
# (maven/npm/pypi), enable the npm bearer-token realm, re-encrypt stored secrets
# under the platform's own key, and publish a `nexus-credentials` secret the
# supply chain uses to publish artefacts. Idempotent PostSync hook — safe every
# sync — and the same script runs every ten minutes from the CronJob below.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nexus-config
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "2"}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nexus-config
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "2"}
rules:
  - {apiGroups: [""], resources: [secrets], verbs: [get, create, update, patch]}
  # Read the Keycloak user directory to provision Nexus accounts (step 5).
  - {apiGroups: [""], resources: [configmaps], resourceNames: [keycloak-directory], verbs: [get]}
  # Restart the console when nexus-credentials changes (it reads it as env).
  - {apiGroups: [apps], resources: [deployments], resourceNames: [adhar-console], verbs: [get, patch]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nexus-config
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "2"}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: nexus-config}
subjects: [{kind: ServiceAccount, name: nexus-config, namespace: adhar-system}]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nexus-bootstrap-script
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "2"}
data:
  bootstrap.sh: |
    set -euo pipefail
    API="${NEXUS}/service/rest/v1"
    NS="${NAMESPACE:-adhar-system}"
    umask 077
    # Credentials never go on a command line or into the log (2026-10-24).
    # Every authenticated curl reads them from a curl config file instead
    # (`-K`), so they do not show up in /proc/*/cmdline either. $AUTH stays
    # a plain word list because the rest of this script expands it unquoted.
    AUTH_FILE=/tmp/nexus-auth.curlrc
    AUTH="-K ${AUTH_FILE}"
    curlrc() {  # $1=file $2=user $3=password
      local u p
      u=$(printf '%s' "$2" | sed 's/[\\"]/\\&/g'); p=$(printf '%s' "$3" | sed 's/[\\"]/\\&/g')
      printf 'user = "%s:%s"\n' "$u" "$p" > "$1"
    }
    # 0 when $1/$2 is an account with admin rights on this Nexus. The
    # realms endpoint needs nx-settings-read, so a valid but unprivileged
    # account does not pass for an administrator.
    can_admin() {
      curlrc /tmp/probe.curlrc "$1" "$2"
      [ "$(curl -s -m 30 -o /dev/null -w '%{http_code}' -K /tmp/probe.curlrc "${API}/security/realms/active" || echo 000)" = "200" ]
    }
    # PUT /security/users/<id>/change-password with the new password as a
    # text/plain body read from a file. Uses whatever $AUTH is.
    set_password() {  # $1=userId $2=new password
      printf '%s' "$2" > /tmp/newpw
      local code
      code=$(curl -s -m 30 -o /tmp/pwresp -w '%{http_code}' $AUTH -X PUT \
        -H 'Content-Type: text/plain' --data-binary @/tmp/newpw \
        "${API}/security/users/$1/change-password" || echo 000)
      rm -f /tmp/newpw
      [ "${code}" = "204" ] || { echo "ERROR: changing the password of Nexus user $1 failed (HTTP ${code}): $(head -c 200 /tmp/pwresp 2>/dev/null)"; return 1; }
    }
    secret_field() {  # $1=secret $2=key -> decoded value, or empty
      kubectl -n "${NS}" get secret "$1" -o "jsonpath={.data.$2}" 2>/dev/null | base64 -d 2>/dev/null || true
    }

    # 1) Wait for Nexus to accept writes. /status answers 200 a while before
    # the security and config stores are usable; /status/writable is the
    # one Sonatype documents for "ready to be configured".
    echo "waiting for Nexus…"
    up=no
    for i in $(seq 1 60); do
      code=$(curl -s -m 10 -o /dev/null -w "%{http_code}" "${API}/status/writable" || echo 000)
      [ "$code" = "200" ] && { echo "Nexus up"; up=yes; break; }
      sleep 10
    done
    [ "${up}" = "yes" ] || { echo "ERROR: Nexus did not become writable within 10 minutes"; exit 1; }

    # 1b) The admin account takes the PLATFORM ADMIN password (2026-10-24).
    #
    # Nexus boots with admin/admin123 (NEXUS_SECURITY_RANDOMPASSWORD=false,
    # install.yaml) and its status page flags that as "Default Admin
    # Credentials — The default admin credentials have not been changed".
    # The platform admin password is Keycloak's bootstrap admin
    # (Secret keycloak-config, key KEYCLOAK_ADMIN_PASSWORD — what
    # `adhar get secrets` lists as "Keycloak (admin)", user adhar-admin),
    # so one break-glass password opens both. Day-to-day sign-in is still
    # Keycloak SSO through the oauth2-proxy; nothing about that changes.
    #
    # Which password Nexus has right now is discovered, not assumed, so
    # this is safe on every run and on every cluster:
    #   admin + platform password  -> already done, nothing to change
    #   admin + admin123           -> first run: change it
    #   the service account below  -> the platform password was ROTATED
    #                                 (or someone changed admin by hand):
    #                                 reset admin to the current one
    # The CronJob below runs this every ten minutes, so a rotated
    # keycloak-config converges on its own with no rotation hook.
    #
    # NOT done by reading /nexus-data/admin.password: random first-boot
    # passwords are disabled here, and the file lives on Nexus's RWO volume
    # where this pod cannot see it anyway.
    DEFAULT_PASS="admin123"
    PLATFORM_PASS="${NEXUS_ADMIN_PASSWORD:-}"
    SVC_USER="adhar-automation"
    PUB_USER=$(secret_field nexus-credentials username)
    PUB_PASS=$(secret_field nexus-credentials password)
    if [ -n "${PLATFORM_PASS}" ] && can_admin admin "${PLATFORM_PASS}"; then
      echo "admin already uses the platform admin password"
      curlrc "${AUTH_FILE}" admin "${PLATFORM_PASS}"
    else
      if can_admin admin "${DEFAULT_PASS}"; then
        curlrc "${AUTH_FILE}" admin "${DEFAULT_PASS}"; via="the default admin password"
      elif [ -n "${PUB_USER}" ] && [ "${PUB_USER}" != "admin" ] && can_admin "${PUB_USER}" "${PUB_PASS}"; then
        curlrc "${AUTH_FILE}" "${PUB_USER}" "${PUB_PASS}"; via="the ${PUB_USER} service account"
      else
        echo "ERROR: no known credential opens the Nexus admin API: not the platform admin password,"
        echo "ERROR: not admin123, and not the account in Secret nexus-credentials. Reset the admin"
        echo "ERROR: password by hand (README: 'Admin password') and the next run takes over again."
        exit 1
      fi
      if [ -n "${PLATFORM_PASS}" ]; then
        set_password admin "${PLATFORM_PASS}" || exit 1
        can_admin admin "${PLATFORM_PASS}" || { echo "ERROR: admin password changed but the platform admin password does not authenticate"; exit 1; }
        echo "admin password set to the platform admin password (keycloak-config/KEYCLOAK_ADMIN_PASSWORD), via ${via}"
        curlrc "${AUTH_FILE}" admin "${PLATFORM_PASS}"
      else
        echo "WARNING: keycloak-config/KEYCLOAK_ADMIN_PASSWORD is not available (Keycloak not installed?);"
        echo "WARNING: Nexus keeps its current admin password and the 'Default Admin Credentials' warning."
      fi
    fi

    # 1c) A dedicated service account for automation, published as
    # nexus-credentials (2026-10-24).
    #
    # nexus-credentials USED to carry admin/admin123, and it travels: the
    # console takes it as env, every Tekton build writes it into .npmrc and
    # Maven settings.xml inside a workspace that runs developer code, and
    # the repository composition hands it to provisioning Jobs. Publishing
    # the platform admin password there would hand Keycloak's master admin
    # to every build. So automation gets its own nx-admin account with its
    # own random password; its blast radius is Nexus, exactly as before.
    # The password is kept while it still works and replaced (and the Secret
    # rewritten) only when it does not.
    SVC_PASS=""
    if [ "${PUB_USER}" = "${SVC_USER}" ] && [ -n "${PUB_PASS}" ] && can_admin "${SVC_USER}" "${PUB_PASS}"; then
      SVC_PASS="${PUB_PASS}"
      echo "service account ${SVC_USER} ok"
    else
      SVC_PASS=$(head -c 48 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 32)
      if curl -s -m 30 $AUTH "${API}/security/users?userId=${SVC_USER}&source=default" | jq -e --arg id "${SVC_USER}" '.[] | select(.userId==$id)' >/dev/null 2>&1; then
        set_password "${SVC_USER}" "${SVC_PASS}" || exit 1
        echo "service account ${SVC_USER}: password reset"
      else
        jq -nc --arg id "${SVC_USER}" --arg p "${SVC_PASS}" \
          '{userId:$id,firstName:"Adhar",lastName:"Automation",emailAddress:"adhar-automation@users.adhar.local",password:$p,status:"active",roles:["nx-admin"]}' > /tmp/svcuser.json
        code=$(curl -s -m 30 -o /tmp/u -w '%{http_code}' $AUTH -H 'Content-Type: application/json' \
          -X POST "${API}/security/users" --data-binary @/tmp/svcuser.json || echo 000)
        rm -f /tmp/svcuser.json
        case "${code}" in 2*) echo "service account ${SVC_USER} created" ;; *) echo "ERROR: creating ${SVC_USER} failed (HTTP ${code}): $(head -c 200 /tmp/u)"; exit 1 ;; esac
      fi
    fi
    # Keep it an active nx-admin even if someone edited it in the UI.
    jq -nc --arg id "${SVC_USER}" '{userId:$id,firstName:"Adhar",lastName:"Automation",emailAddress:"adhar-automation@users.adhar.local",source:"default",status:"active",readOnly:false,roles:["nx-admin"],externalRoles:[]}' > /tmp/svcuser.json
    curl -s -m 30 -o /dev/null $AUTH -H 'Content-Type: application/json' -X PUT "${API}/security/users/${SVC_USER}" --data-binary @/tmp/svcuser.json || true

    # Publish the credentials + endpoints the supply chain consumes NOW,
    # straight after the password is known, so a later failure in this run
    # cannot leave Nexus and the Secret disagreeing.
    printf '%s' "${SVC_PASS}" > /tmp/svcpw
    kubectl create secret generic nexus-credentials -n "${NS}" \
      --from-literal=username="${SVC_USER}" \
      --from-file=password=/tmp/svcpw \
      --from-literal=url="${NEXUS}" \
      --from-literal=maven-hosted="${NEXUS}/repository/maven-hosted/" \
      --from-literal=maven-public="${NEXUS}/repository/maven-public/" \
      --from-literal=npm-hosted="${NEXUS}/repository/npm-hosted/" \
      --from-literal=pypi-hosted="${NEXUS}/repository/pypi-hosted/" \
      --dry-run=client -o yaml | kubectl apply -f - >/dev/null
    rm -f /tmp/svcpw
    echo "nexus-credentials published (${SVC_USER})"
    # The console reads nexus-credentials as env at start-up, so a changed
    # account means nothing to a running pod until it restarts. Best effort:
    # only when the published credential actually changed.
    if [ "${PUB_USER}" != "${SVC_USER}" ] || [ "${PUB_PASS}" != "${SVC_PASS}" ]; then
      if kubectl -n "${NS}" get deployment adhar-console >/dev/null 2>&1; then
        kubectl -n "${NS}" rollout restart deployment/adhar-console >/dev/null 2>&1 \
          && echo "adhar-console restarted onto the new nexus-credentials" \
          || echo "WARNING: could not restart adhar-console; it uses the old Nexus credential until its next restart"
      fi
    fi
    # 2) Accept the Community Edition EULA. WITHOUT THIS NEXUS SERVES
    # NOTHING. Every /repository/... request answers 403 with "You must
    # accept the End User License Agreement (EULA) through the
    # onboarding wizard or REST API before proceeding", while the admin
    # REST API keeps working normally — so repositories are created
    # successfully and the instance looks healthy right up until a build
    # tries to resolve a dependency. On the first GCP deployment this
    # failed both library releases for eight hours, and the symptoms
    # (403 on artifacts that plainly exist) point at credentials or a
    # blocked proxy rather than at licensing.
    #
    # The disclaimer text must be echoed back verbatim, so it is read
    # from the API rather than hardcoded: Sonatype revises the wording.
    echo "accepting the Nexus Community Edition EULA…"
    eula_state=$(curl -s -m 30 $AUTH "${API}/system/eula" || echo '{}')
    case "${eula_state}" in
      *'"accepted" : true'*|*'"accepted":true'*)
        echo "EULA already accepted" ;;
      *)
        disclaimer=$(printf '%s' "${eula_state}" | sed -n 's/.*"disclaimer"[[:space:]]*:[[:space:]]*"\(.*\)".*/\1/p')
        if [ -z "${disclaimer}" ]; then
          echo "WARNING: could not read the EULA disclaimer; Nexus may refuse to serve repositories" >&2
        else
          code=$(curl -s -o /dev/null -w "%{http_code}" -m 30 $AUTH \
            -H 'Content-Type: application/json' -X POST "${API}/system/eula" \
            -d "{\"accepted\":true,\"disclaimer\":\"${disclaimer}\"}")
          echo "EULA acceptance -> HTTP ${code}"
        fi ;;
    esac

    # helper: create a hosted repo (idempotent — 400/already-exists ok)
    mkrepo() {  # $1=path $2=json
      code=$(curl -s -o /tmp/r -w "%{http_code}" $AUTH -H 'Content-Type: application/json' \
        -X POST "${API}/repositories/$1" -d "$2")
      case "$code" in
        201) echo "created $1" ;;
        400) echo "$1 exists / ok ($(head -c 80 /tmp/r))" ;;
        *) echo "warn: $1 -> $code $(head -c 120 /tmp/r)" ;;
      esac
    }
    # Create-or-UPDATE (PUT on exists). Required for anything Nexus
    # pre-creates at first boot — maven-public ships with
    # [maven-releases, maven-snapshots, maven-central] — because a
    # create-only POST returns 400 and silently leaves the default
    # member list in place. That is exactly how maven-hosted and
    # lombok-edge went missing from the group: every adhar-kit build
    # then failed with "Could not find org.projectlombok:lombok:
    # edge-SNAPSHOT in nexus-public" although the proxy itself served it.
    # $1=path (e.g. maven/group) $2=name $3=json
    upsertrepo() {
      code=$(curl -s -o /tmp/r -w "%{http_code}" $AUTH -H 'Content-Type: application/json' \
        -X POST "${API}/repositories/$1" -d "$3")
      case "$code" in
        201) echo "created $2" ;;
        400)
          code=$(curl -s -o /tmp/r -w "%{http_code}" $AUTH -H 'Content-Type: application/json' \
            -X PUT "${API}/repositories/$1/$2" -d "$3")
          case "$code" in
            204) echo "updated $2" ;;
            *) echo "warn: update $2 -> $code $(head -c 120 /tmp/r)" ;;
          esac ;;
        *) echo "warn: $2 -> $code $(head -c 120 /tmp/r)" ;;
      esac
    }
    # 2) Hosted repositories for each ecosystem.
    mkrepo maven/hosted '{"name":"maven-hosted","online":true,"storage":{"blobStoreName":"default","strictContentTypeValidation":false,"writePolicy":"ALLOW"},"maven":{"versionPolicy":"MIXED","layoutPolicy":"PERMISSIVE"}}'
    mkrepo npm/hosted   '{"name":"npm-hosted","online":true,"storage":{"blobStoreName":"default","strictContentTypeValidation":true,"writePolicy":"ALLOW"}}'
    mkrepo pypi/hosted  '{"name":"pypi-hosted","online":true,"storage":{"blobStoreName":"default","strictContentTypeValidation":true,"writePolicy":"ALLOW"}}'
    # Proxy caches (so app builds resolve upstream deps through Nexus).
    # Negative caching is OFF on every proxy: with it on (24h default) a
    # transient upstream failure — Nexus restarting mid-build, a network
    # blip — poisons "not found" for a day and every later build fails
    # with "was not found in nexus-public" although the artifact exists.
    mkrepo npm/proxy    '{"name":"npm-registry","online":true,"storage":{"blobStoreName":"default","strictContentTypeValidation":true,"writePolicy":"ALLOW"},"proxy":{"remoteUrl":"https://registry.npmjs.org","contentMaxAge":1440,"metadataMaxAge":1440},"negativeCache":{"enabled":false,"timeToLive":5},"httpClient":{"blocked":false,"autoBlock":false}}'
    mkrepo pypi/proxy   '{"name":"pypi-proxy","online":true,"storage":{"blobStoreName":"default","strictContentTypeValidation":true,"writePolicy":"ALLOW"},"proxy":{"remoteUrl":"https://pypi.org/","contentMaxAge":1440,"metadataMaxAge":1440},"negativeCache":{"enabled":false,"timeToLive":5},"httpClient":{"blocked":false,"autoBlock":false}}'
    # Maven Central proxy + a public GROUP (maven-hosted + maven-central) so
    # builds resolve deps through Nexus. The release pipeline mirrors
    # * -> maven-public, which 404s (fails all resolution) without this group.
    # upsertrepo, NOT mkrepo: Nexus pre-creates maven-central at first
    # boot (see the note above) with negativeCache ENABLED and a 1440
    # minute TTL, and a create-only call silently leaves those defaults
    # in place. That is how a cold cluster poisons its own builds — the
    # first Maven resolutions run before egress is reliable, every miss
    # is cached for 24 hours, and afterwards artifacts that plainly
    # exist keep returning 403 from a proxy that is not even blocked.
    # Observed on GCP: release-adhar-kit failed on
    # maven-build-cache-extension:1.2.0 for eight hours while
    # repo1.maven.org served it fine.
    upsertrepo maven/proxy maven-central '{"name":"maven-central","online":true,"storage":{"blobStoreName":"default","strictContentTypeValidation":false},"proxy":{"remoteUrl":"https://repo1.maven.org/maven2/","contentMaxAge":-1,"metadataMaxAge":1440},"negativeCache":{"enabled":false,"timeToLive":5},"httpClient":{"blocked":false,"autoBlock":false},"maven":{"versionPolicy":"RELEASE","layoutPolicy":"PERMISSIVE"}}'
    # Lombok edge-releases proxy: adhar-kit builds on JDK 25 and depends on
    # org.projectlombok:lombok:edge-SNAPSHOT (only the edge channel supports
    # the newest JDKs; it is NOT on Maven Central). versionPolicy MIXED so the
    # -SNAPSHOT resolves. Added to maven-public below so builds see it.
    mkrepo maven/proxy '{"name":"lombok-edge","online":true,"storage":{"blobStoreName":"default","strictContentTypeValidation":false},"proxy":{"remoteUrl":"https://projectlombok.org/edge-releases/","contentMaxAge":-1,"metadataMaxAge":60},"negativeCache":{"enabled":false,"timeToLive":5},"httpClient":{"blocked":false,"autoBlock":false},"maven":{"versionPolicy":"MIXED","layoutPolicy":"PERMISSIVE"}}'
    # maven-public pre-exists (Nexus creates it at first boot), so this
    # MUST be an upsert — see upsertrepo. Keep Nexus's own
    # maven-releases/maven-snapshots members so nothing that already
    # resolves through the default group regresses.
    upsertrepo maven/group maven-public '{"name":"maven-public","online":true,"storage":{"blobStoreName":"default","strictContentTypeValidation":false},"group":{"memberNames":["maven-hosted","maven-releases","maven-snapshots","maven-central","lombok-edge"]}}'
    # 3) Enable the auth realms:
    #    - NpmToken       : `npm publish` bearer tokens
    #    - rutauth-realm  : Rut Auth (HTTP header) — lets the Keycloak
    #      SSO in front of Nexus (oauth2-proxy) log the user in via the
    #      X-Forwarded-User header. Nexus OSS has no native OIDC, so this
    #      header-trust realm is how the proxied identity becomes a Nexus
    #      session. Order matters: rutauth-realm must precede the
    #      authenticating realm so the header is honoured first.
    #
    # The list must contain ONLY ids Nexus actually knows. It carried
    # "NexusAuthorizingRealm", which does not exist in 3.79.1 — the
    # valid ids are ConanToken, DefaultRole, DockerToken, LdapRealm,
    # NexusAuthenticatingRealm, NpmToken, NuGetApiKey and
    # rutauth-realm — and Nexus validates the array as a WHOLE:
    #   400 ValidationErrorXO{message='"Unknown realmIds:
    #   [NexusAuthorizingRealm]"'}
    # so one bogus id left NONE of them active. Live on the 2026-10-11
    # GCP cluster the active list was just
    # ["NexusAuthenticatingRealm"], which is why Nexus still drew its
    # own sign-in form behind a working Keycloak proxy (rutauth-realm
    # inactive) and why `npm publish` had no bearer-token realm.
    #
    # The response is CHECKED, not discarded. The previous version
    # piped it to /dev/null, swallowed the failure with `|| true` and
    # then printed "realms enabled" unconditionally, so the one thing
    # that would have revealed this was the one thing thrown away.
    realm_code=$(curl -s -o /tmp/realms -w '%{http_code}' $AUTH \
      -H 'Content-Type: application/json' -X PUT "${API}/security/realms/active" \
      -d '["rutauth-realm","NexusAuthenticatingRealm","NpmToken"]' || echo 000)
    case "${realm_code}" in
      2*) echo "npm token + rut-auth realms enabled" ;;
      *)  echo "ERROR: enabling the auth realms failed (HTTP ${realm_code}): $(head -c 200 /tmp/realms 2>/dev/null)"
          echo "ERROR: without rutauth-realm the Keycloak proxy cannot log anyone in to Nexus,"
          echo "ERROR: and without NpmToken 'npm publish' has no bearer-token realm." ;;
    esac
    # 3b) Rut Auth capability — tells Nexus which HTTP header carries the
    # authenticated username. oauth2-proxy sends X-Forwarded-User (the
    # Keycloak preferred_username). There is no stable public v1 endpoint
    # for capabilities, so this uses the internal UI API and is strictly
    # best-effort (|| true): a version mismatch must not fail the sync.
    # If it already exists Nexus returns 400 (dup) — also fine.
    #
    # `grep -q`, NOT `grep -c ... || echo 0`. `grep -c` PRINTS "0" and
    # also EXITS 1 when it matches nothing, so the `|| echo 0`
    # fallback appended a second zero and the variable became the two
    # lines "0\n0" — which never equals "0", so the branch below was
    # never taken and the capability was never created. On a cluster
    # whose realms were fine this alone was enough to leave Nexus
    # drawing its own sign-in form behind a working Keycloak proxy.
    # Capabilities live on the Ext.Direct endpoint, not under
    # /service/rest. Every REST spelling 404s on 3.79.1 —
    # /service/rest/internal/ui/capabilities,
    # /service/rest/v1/capabilities and the beta path alike — so the
    # previous POST could never have worked on this version, and
    # because it was best-effort nothing said so. /service/extdirect
    # answers, and `read` is how we tell whether the capability is
    # already there.
    ed() {
      curl -s -o "$2" -w '%{http_code}' $AUTH \
        -H 'Content-Type: application/json' -H 'X-Nexus-UI: true' \
        -X POST "${NEXUS}/service/extdirect" -d "$1" || echo 000
    }
    # The header is X-Forwarded-Preferred-Username, NOT X-Forwarded-User:
    # oauth2-proxy puts the token's `sub` (Keycloak's internal UUID) in
    # X-Forwarded-User, which matches no Nexus account, so Nexus drew its own
    # login form after a successful Keycloak sign-in (2026-10-18). The
    # preferred username is what step 5 names the accounts after. A capability
    # naming any other header is replaced.
    RUT_HEADER="X-Forwarded-Preferred-Username"
    ed '{"action":"capability_Capability","method":"read","data":null,"type":"rpc","tid":1}' /tmp/caps >/dev/null
    stale=$(jq -r --arg h "$RUT_HEADER" '.result.data[]? | select(.typeId=="rutauth" and .properties.httpHeader != $h) | .id' /tmp/caps 2>/dev/null || true)
    for id in $stale; do
      ed "{\"action\":\"capability_Capability\",\"method\":\"remove\",\"data\":[\"${id}\"],\"type\":\"rpc\",\"tid\":3}" /tmp/rm >/dev/null
      echo "replaced rut-auth capability ${id} (it trusted a header no Nexus account matches)"
    done
    ed '{"action":"capability_Capability","method":"read","data":null,"type":"rpc","tid":1}' /tmp/caps >/dev/null
    if jq -e --arg h "$RUT_HEADER" '.result.data[]? | select(.typeId=="rutauth" and .properties.httpHeader == $h)' /tmp/caps >/dev/null 2>&1; then
      echo "rut-auth capability already present (${RUT_HEADER})"
    else
      code=$(ed '{"action":"capability_Capability","method":"create","data":[{"typeId":"rutauth","enabled":true,"notes":"Keycloak SSO via oauth2-proxy (X-Forwarded-Preferred-Username)","properties":{"httpHeader":"X-Forwarded-Preferred-Username"}}],"type":"rpc","tid":2}' /tmp/rut)
      # Ext.Direct answers 200 with success:false inside the body, so
      # the status code alone does not tell you whether it worked.
      if [ "${code}" = "200" ] && grep -q '"success":true' /tmp/rut 2>/dev/null; then
        echo "rut-auth capability created"
      else
        echo "ERROR: creating the rut-auth capability failed (HTTP ${code}): $(head -c 200 /tmp/rut 2>/dev/null)"
        echo "ERROR: without it Nexus ignores X-Forwarded-User, so the Keycloak proxy in front"
        echo "ERROR: of Nexus authenticates the browser and Nexus still asks for a local login."
      fi
    fi
    # 4) Onboarding. The wizard Nexus shows administrators has three items
    # on 3.79.1: CommunityDiscover and CommunityEula (both cleared by the
    # EULA acceptance in step 2) and ConfigureAnonymousAccess, which applies
    # until the anonymous-access setting has been SAVED once. Saving back
    # exactly what GET returns marks it configured without changing whether
    # anonymous access is on (2026-10-24). Only done while the item is
    # pending, so the setting is not rewritten every ten minutes.
    if curl -s -m 30 $AUTH "${NEXUS}/service/rest/internal/ui/onboarding" 2>/dev/null | jq -e '.[]? | select(.type=="ConfigureAnonymousAccess")' >/dev/null 2>&1; then
      if curl -s -m 30 $AUTH "${API}/security/anonymous" -o /tmp/anon && jq -e 'has("enabled")' /tmp/anon >/dev/null 2>&1; then
        code=$(curl -s -m 30 -o /dev/null -w '%{http_code}' $AUTH -H 'Content-Type: application/json' \
          -X PUT "${API}/security/anonymous" --data-binary @/tmp/anon || echo 000)
        echo "onboarding: anonymous access confirmed as-is (enabled=$(jq -r .enabled /tmp/anon)) -> HTTP ${code}"
      fi
    fi

    # 4b) Custom secrets encryption key (2026-10-24).
    #
    # Without one, Nexus encrypts stored secrets (proxy/remote credentials,
    # capability passwords, …) with a key compiled into every Nexus build,
    # and flags "Default Secret Encryption Key — Nexus was not configured
    # with an encryption key and is using the Default key". The key file is
    # generated once adhar-controlplane (secrets-key.yaml) and handed to Nexus via
    # -Dnexus.secrets.file (install.yaml); that makes the key ACTIVE for new
    # secrets and clears the warning, but secrets written before it stay
    # under the default key until a re-encrypt task runs. Nexus reports
    # exactly that as the "Re-encryption required" status check, so the
    # check — not a marker — decides whether to submit the task, and an
    # interrupted run is simply resubmitted next time.
    if [ -n "${NEXUS_SECRET_KEY_ID:-}" ]; then
      checks=$(curl -s -m 30 $AUTH "${API}/status/check" || echo '{}')
      # `| tostring`, NOT `// "unknown"`: jq's // treats false as missing, so
      # the one value that matters ("unhealthy") would read as "unknown".
      default_key=$(printf '%s' "${checks}" | jq -r '."Default Secret Encryption Key".healthy | tostring' 2>/dev/null || echo unknown)
      reencrypt=$(printf '%s' "${checks}" | jq -r '."Re-encryption required".healthy | tostring' 2>/dev/null || echo unknown)
      if [ "${default_key}" = "false" ]; then
        echo "WARNING: Nexus still reports the default encryption key: it was started without the"
        echo "WARNING: nexus-secrets-key file (Deployment not rolled yet?). Re-encryption deferred."
      elif [ "${reencrypt}" = "false" ]; then
        jq -nc --arg id "${NEXUS_SECRET_KEY_ID}" '{secretKeyId:$id}' > /tmp/reenc.json
        code=$(curl -s -m 60 -o /tmp/reenc -w '%{http_code}' $AUTH -H 'Content-Type: application/json' \
          -X PUT "${API}/secrets/encryption/re-encrypt" --data-binary @/tmp/reenc.json || echo 000)
        case "${code}" in
          2*)  echo "re-encryption with key ${NEXUS_SECRET_KEY_ID} submitted (HTTP ${code})" ;;
          409) echo "re-encryption already running" ;;
          *)   echo "WARNING: re-encryption request failed (HTTP ${code}): $(head -c 200 /tmp/reenc 2>/dev/null)" ;;
        esac
      elif [ "${reencrypt}" = "true" ]; then
        echo "secrets encryption key ${NEXUS_SECRET_KEY_ID} active, nothing to re-encrypt"
      else
        echo "WARNING: could not read Nexus's encryption status checks (${default_key}/${reencrypt}); retrying next run"
      fi
    else
      echo "WARNING: nexus-secrets-key not found; Nexus keeps the default secrets encryption key"
    fi
    # 5) One Nexus account per Keycloak user, so the proxy's X-Forwarded-User
    # resolves to SOMEONE. Rut Auth authenticates the header but only for a
    # user Nexus already has; a Keycloak user without one got Nexus's own
    # sign-in form after logging in to Keycloak (2026-10-18). The accounts get
    # a random password nobody is told (sign-in is always through the proxy),
    # and roles follow Keycloak groups on every run:
    #   platform-admin           -> nx-admin
    #   platform-developer/other -> adhar-developer (browse, read, search, publish)
    #   platform-viewer          -> adhar-viewer    (browse, read, search)
    ensure_role() {
      local id="$1" desc="$2" privs="$3"
      code=$(curl -s -o /dev/null -w '%{http_code}' $AUTH "${API}/security/roles/${id}" || echo 000)
      body=$(jq -nc --arg id "$id" --arg d "$desc" --argjson p "$privs" '{id:$id,name:$id,description:$d,privileges:$p,roles:[]}')
      if [ "$code" = "200" ]; then
        curl -s -o /dev/null $AUTH -H 'Content-Type: application/json' -X PUT "${API}/security/roles/${id}" -d "$body" || true
      else
        curl -s -o /dev/null $AUTH -H 'Content-Type: application/json' -X POST "${API}/security/roles" -d "$body" || true
      fi
    }
    ensure_role adhar-viewer "Keycloak platform-viewer" '["nx-repository-view-*-*-browse","nx-repository-view-*-*-read","nx-search-read","nx-healthcheck-read"]'
    ensure_role adhar-developer "Keycloak platform-developer" '["nx-repository-view-*-*-browse","nx-repository-view-*-*-read","nx-repository-view-*-*-add","nx-repository-view-*-*-edit","nx-search-read","nx-component-upload","nx-healthcheck-read","nx-apikey-all"]'
    if kubectl -n adhar-system get configmap keycloak-directory -o jsonpath='{.data.users\.json}' > /tmp/users.json 2>/dev/null && [ -s /tmp/users.json ]; then
      made=0; updated=0
      for row in $(jq -c '.[] | @base64' /tmp/users.json | tr -d '"'); do
        u=$(echo "$row" | base64 -d)
        id=$(echo "$u" | jq -r '.username')
        [ -n "$id" ] && [ "$id" != "admin" ] && [ "$id" != "anonymous" ] && [ "$id" != "${SVC_USER}" ] || continue
        role=$(echo "$u" | jq -r 'if (.groups | index("platform-admin")) then "nx-admin" elif ((.groups | index("platform-viewer")) and ((.groups | index("platform-developer")) | not)) then "adhar-viewer" else "adhar-developer" end')
        email=$(echo "$u" | jq -r '.email | if . == "" then empty else . end'); [ -n "$email" ] || email="${id}@users.adhar.local"
        first=$(echo "$u" | jq -r '.firstName | if . == "" then empty else . end'); [ -n "$first" ] || first="$id"
        last=$(echo "$u" | jq -r '.lastName | if . == "" then empty else . end'); [ -n "$last" ] || last="-"
        enc=$(jq -rn --arg v "$id" '$v|@uri')
        if curl -s $AUTH "${API}/security/users?userId=${enc}&source=default" | jq -e --arg id "$id" '.[] | select(.userId==$id)' >/dev/null 2>&1; then
          body=$(jq -nc --arg id "$id" --arg f "$first" --arg l "$last" --arg e "$email" --arg r "$role" '{userId:$id,firstName:$f,lastName:$l,emailAddress:$e,source:"default",status:"active",readOnly:false,roles:[$r],externalRoles:[]}')
          curl -s -o /dev/null $AUTH -H 'Content-Type: application/json' -X PUT "${API}/security/users/${enc}" -d "$body" && updated=$((updated+1)) || true
        else
          pw=$(head -c 24 /dev/urandom | base64 | tr -d '/+=')
          body=$(jq -nc --arg id "$id" --arg f "$first" --arg l "$last" --arg e "$email" --arg r "$role" --arg p "$pw" '{userId:$id,firstName:$f,lastName:$l,emailAddress:$e,password:$p,status:"active",roles:[$r]}')
          code=$(curl -s -o /tmp/u -w '%{http_code}' $AUTH -H 'Content-Type: application/json' -X POST "${API}/security/users" -d "$body" || echo 000)
          case "$code" in 2*) made=$((made+1)) ;; *) echo "WARNING: could not create Nexus user ${id} (HTTP ${code}): $(head -c 160 /tmp/u)" ;; esac
        fi
      done
      echo "nexus accounts from keycloak-directory: ${made} created, ${updated} refreshed"
    else
      echo "keycloak-directory not published yet; Keycloak users will be provisioned on the next run"
    fi
    echo "nexus bootstrap complete"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: nexus-config
  namespace: adhar-system
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  template:
    spec:
      serviceAccountName: nexus-config
      restartPolicy: Never
      containers:
        - name: config
          image: alpine/k8s:1.31.1
          env:
            - {name: NEXUS, value: "http://nexus.adhar-system.svc.cluster.local:8081"}
            - {name: NAMESPACE, value: adhar-system}
            # kubectl wants a writable cache dir; / is not ours as non-root.
            - {name: HOME, value: /tmp}
            # The platform admin password Nexus's `admin` takes (bootstrap.sh
            # step 1b). optional: Keycloak is an optional dependency, and
            # without it the script leaves the password alone and says so.
            - name: NEXUS_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: keycloak-config, key: KEYCLOAK_ADMIN_PASSWORD, optional: true}}
            # Only the key's ID — the key itself stays in the Nexus pod.
            - name: NEXUS_SECRET_KEY_ID
              valueFrom: {secretKeyRef: {name: nexus-secrets-key, key: active-key-id, optional: true}}
          command: [bash, /script/bootstrap.sh]
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: script, mountPath: /script}
      volumes:
        - name: script
          configMap:
            name: nexus-bootstrap-script
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nexus-reconcile
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "3"}
spec:
  # Every ten minutes, because the bootstrap above is a PostSync HOOK and a
  # hook does not run again once the app has converged.
  #
  # Nexus keeps the accepted EULA and every repository definition in its own
  # volume. Lose that volume and the instance comes back with only Nexus's
  # default repositories and an UNACCEPTED EULA, at which point every
  # /repository/... request answers 403 while the admin REST API keeps working
  # — so the pod is Ready, the Argo CD Application is Healthy, and nothing
  # reports a problem.
  #
  # Live on 2026-10-13 the nexus-data PVC was recreated and that is exactly
  # what happened: npm-hosted and maven-hosted were gone, maven-releases was
  # empty, and every Maven build failed with
  #   Non-resolvable parent POM ... adhar-kit-parent:pom:0.1.0 ... 403
  # for hours, with the only successful bootstrap Job sitting Complete from
  # before the volume was replaced. Re-running it by hand fixed it in twelve
  # seconds, which is the whole argument for running it on a schedule.
  #
  # Safe to repeat: the script creates-or-updates and is the same one the
  # bootstrap Job runs, mounted from the same ConfigMap.
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 3600
      # bootstrap.sh waits up to 10 min for Nexus; under Forbid a run that
      # hangs past that (a request with no client timeout) would block the
      # repair this CronJob exists to make, indefinitely.
      activeDeadlineSeconds: 900
      template:
        spec:
          serviceAccountName: nexus-config
          restartPolicy: Never
          containers:
            - name: config
              image: alpine/k8s:1.31.1
              # Same env as the bootstrap Job above (keep them in step). This
              # schedule is also what keeps Nexus's admin on the CURRENT
              # platform admin password after keycloak-config is rotated.
              env:
                - {name: NEXUS, value: "http://nexus.adhar-system.svc.cluster.local:8081"}
                - {name: NAMESPACE, value: adhar-system}
                - {name: HOME, value: /tmp}
                - name: NEXUS_ADMIN_PASSWORD
                  valueFrom: {secretKeyRef: {name: keycloak-config, key: KEYCLOAK_ADMIN_PASSWORD, optional: true}}
                - name: NEXUS_SECRET_KEY_ID
                  valueFrom: {secretKeyRef: {name: nexus-secrets-key, key: active-key-id, optional: true}}
              command: [bash, /script/bootstrap.sh]
              securityContext:
                runAsNonRoot: true
                runAsUser: 65534
                runAsGroup: 65534
                allowPrivilegeEscalation: false
                capabilities: {drop: [ALL]}
              resources:
                requests: {cpu: 10m, memory: 32Mi}
                limits: {memory: 256Mi}
              volumeMounts:
                - {name: script, mountPath: /script}
          volumes:
            - name: script
              configMap:
                name: nexus-bootstrap-script
