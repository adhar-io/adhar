# Keycloak SSO in front of Nexus (same pattern as Tekton/Harbor). Nexus's own
# login stays for API/tooling auth, but the UI is gated by an oauth2-proxy using
# the `nexus` Keycloak client (provisioned by the keycloak config job; secret via
# ESO from keycloak-clients). The oidc-issuer-url auto-discovers Keycloak's
# endpoints via /.well-known/openid-configuration.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nexus-oauth2-proxy
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "5"}
spec:
  refreshPolicy: CreatedOnce
  refreshInterval: 30s
  secretStoreRef:
    name: keycloak
    kind: ClusterSecretStore
  target:
    name: nexus-oauth2-proxy
    template:
      engineVersion: v2
      data:
        OAUTH2_PROXY_CLIENT_SECRET: "{{ .NEXUS_CLIENT_SECRET }}"
        OAUTH2_PROXY_COOKIE_SECRET: "{{ .COOKIE_SECRET }}"
  data:
    - secretKey: NEXUS_CLIENT_SECRET
      remoteRef:
        key: keycloak-clients
        property: NEXUS_CLIENT_SECRET
    # The platform-wide cookie secret (security/keycloak/manifests/sso-cookie.yaml).
    # Shared by every oauth2-proxy so a session established by one app is
    # accepted by all of them.
    - secretKey: COOKIE_SECRET
      remoteRef:
        key: adhar-sso-cookie
        property: COOKIE_SECRET
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-oauth2-proxy
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "5"}
  labels:
    app.kubernetes.io/name: nexus-oauth2-proxy
    app.kubernetes.io/part-of: nexus
spec:
  # A late SSO secret (this app can sync before Keycloak has written
  # keycloak-clients) must not hold the rollout Progressing for the default
  # 10 minutes — surface it fast so ArgoCD retries.
  progressDeadlineSeconds: 120
  replicas: 1
  selector:
    matchLabels:
      app: nexus-oauth2-proxy
  template:
    metadata:
      labels:
        app: nexus-oauth2-proxy
    spec:
      enableServiceLinks: false
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1
          args:
            - --http-address=0.0.0.0:4180
            - --provider=oidc
            - --oidc-issuer-url=https://keycloak.adhar.localtest.me:8443/realms/adhar
            - --ssl-insecure-skip-verify=true
            - --client-id=nexus
            - --redirect-url=https://nexus.adhar.localtest.me:8443/oauth2/callback
            - --upstream=http://nexus.adhar-system.svc.cluster.local:8081
            - --email-domain=*
            - --scope=openid profile email groups
            - --cookie-secure=true
            # Parent-domain cookie + the shared secret above = real single
            # sign-on: another app's proxy accepts this session without a round
            # trip to Keycloak. Seed-time host rewriting turns the literal
            # domain into the platform's own.
            - --cookie-domain=.adhar.localtest.me
            - --whitelist-domain=.adhar.localtest.me:8443
            - --skip-provider-button=true
            - --reverse-proxy=true
            # Forward the authenticated identity to Nexus so its Rut Auth realm
            # can log the user in (Nexus OSS has no native OIDC). X-Forwarded-User
            # carries the username; prefer the preferred_username claim over email
            # so it matches Nexus usernames rather than "<user>@<domain>".
            - --pass-user-headers=true
            - --set-xauthrequest=true
            - --prefer-email-to-user=false
          envFrom:
            - secretRef:
                name: nexus-oauth2-proxy
          ports:
            - name: http
              containerPort: 4180
          readinessProbe:
            httpGet:
              path: /ping
              port: 4180
            initialDelaySeconds: 5
            timeoutSeconds: 10
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: nexus-oauth2-proxy
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "5"}
  labels:
    app.kubernetes.io/name: nexus-oauth2-proxy
    app.kubernetes.io/part-of: nexus
spec:
  selector:
    app: nexus-oauth2-proxy
  ports:
    - name: http
      port: 4180
      targetPort: 4180
