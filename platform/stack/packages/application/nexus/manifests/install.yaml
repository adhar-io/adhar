# Nexus Repository OSS — the platform's build-artefact repository for language
# packages (Maven, npm, PyPI, …). Harbor stays OCI-images-only; Nexus owns
# everything else. Wired into the supply chain: the adhar-libraries release
# pipelines publish here, and app builds can resolve dependencies through it.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nexus-data
  namespace: adhar-system
  # Same wave as the Deployment on purpose: the `standard` StorageClass is
  # WaitForFirstConsumer, so the PVC only binds once its consumer pod is
  # scheduled. In an earlier wave ArgoCD blocks "waiting for healthy state of
  # PVC/nexus-data" and never applies the Deployment → deadlock (PVC Pending
  # forever). Applying both together lets the pod bind the volume.
  annotations: {argocd.argoproj.io/sync-wave: "1"}
spec:
  accessModes: [ReadWriteOnce]
  # adhar-block, NOT the node-local default — the one package where naming it
  # explicitly is not optional.
  #
  # Two reasons, and the second one took the platform down.
  #
  # 1. DURABILITY. `adhar-local` (local-path-provisioner) is the platform
  #    default because ~90 PVCs cannot fit in a cloud VM's 7-8 disk attach
  #    slots, and that trade is fine for anything whose durability comes from
  #    replication plus backups. Nexus is not that: it holds PUBLISHED release
  #    versions, and a Nexus hosted repository never accepts the same version
  #    twice. A node-local volume does not survive its node, so losing it loses
  #    artefacts that cannot be re-published under the versions everything
  #    already resolves.
  #
  # 2. SCHEDULABILITY. A node-local PV pins its consumer to one node FOREVER,
  #    and no amount of autoscaling can rescue it. On the AWS cluster
  #    (2026-10-09) nexus bound a volume on ip-10-0-1-176, that node reached
  #    3995m of 4000m CPU requests, and the pod then sat Pending for 37 minutes
  #    reporting `3 node(s) didn't match PersistentVolume's node affinity,
  #    2 Insufficient cpu` while the autoscaler happily grew the cluster from 3
  #    nodes to 6. None of the new capacity was reachable. And because nexus
  #    never booted it never published `nexus-credentials`, so the
  #    adhar-libraries mirror Jobs failed their gate and `adhar-kit` and
  #    `adhar-ui` were never created in Gitea at all — one unschedulable pod
  #    took out the whole library story.
  #
  # ⚠️ CHANGING THIS ON A RUNNING NEXUS IS A MIGRATION, not an edit:
  # `storageClassName` is immutable, so Argo CD cannot sync it in place. On a
  # cluster whose nexus already holds artefacts, back them up, delete the PVC,
  # then sync. On a cluster where nexus has never booted (its volume is empty)
  # deleting the PVC once is enough.
  storageClassName: adhar-block
  resources:
    requests:
      storage: 8Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus
  namespace: adhar-system
  labels: {app.kubernetes.io/name: nexus, app.kubernetes.io/part-of: adhar-supply-chain}
  annotations: {argocd.argoproj.io/sync-wave: "1"}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: nexus}
  template:
    metadata:
      labels: {app.kubernetes.io/name: nexus}
    spec:
      securityContext:
        fsGroup: 200
      containers:
        - name: nexus
          image: sonatype/nexus3:3.79.1
          imagePullPolicy: IfNotPresent
          # Deterministic admin password ("admin123") so the bootstrap Job can
          # configure repositories without scraping the random admin.password
          # file. Rotate post-install for hardened environments.
          env:
            - {name: NEXUS_SECURITY_RANDOMPASSWORD, value: "false"}
            # Heap + direct memory sized to fit the 2Gi limit (~1Gi heap + 512m
            # direct + JVM overhead). Actual local usage is ~800Mi, so this is
            # comfortable; raise for a busy shared registry.
            # Sonatype's recommended baseline is ~2.7Gi total (heap + direct).
            # The earlier trim (1Gi heap / 2Gi limit) starved boot — Nexus 3
            # thrashed GC through the OrientDB/H2 + OSGi startup and never went
            # Ready. Give it a healthy heap + direct memory that fits the 3Gi
            # limit for a reliable, faster cold start.
            - {name: INSTALL4J_ADD_VM_PARAMS, value: "-Xms1200m -Xmx2048m -XX:MaxDirectMemorySize=2g -Djava.util.prefs.userRoot=/nexus-data/javaprefs"}
          ports:
            - {name: http, containerPort: 8081}
          resources:
            requests: {cpu: 500m, memory: 2Gi}
            limits: {memory: 3Gi}
          # Nexus 3 cold-starts slowly (Jetty + OrientDB init, minutes on an
          # empty PVC). A startupProbe gates liveness/readiness so the app gets
          # up to ~10min to come up instead of the liveness probe SIGKILLing it
          # mid-boot (the previous crash loop: exitCode 137 "failed liveness
          # probe"). timeoutSeconds bumped off the 1s default so a busy JVM
          # doesn't trip the probe.
          # ~20 min budget (initialDelay + period*threshold). Nexus 3 cold-starts
          # slowly (Jetty + OrientDB/mybatis init), and on a CPU-contended node it
          # can exceed the old ~10 min budget — the startupProbe then exhausts and
          # the kubelet restarts the pod mid-boot, so it never becomes Ready and
          # its gateway route returns 502. A wider budget lets it finish.
          startupProbe:
            httpGet: {path: /service/rest/v1/status, port: 8081}
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 120
            timeoutSeconds: 5
          # Nexus answers slowly while it proxies a cold dependency tree for a
          # build on a busy node; a tight liveness probe then restarts it
          # mid-transfer (Maven "Failed to read artifact descriptor", pnpm
          # ECONNRESET/ECONNREFUSED). Generous timeouts: only a truly hung
          # process gets restarted (~15 min of failed probes).
          readinessProbe:
            httpGet: {path: /service/rest/v1/status, port: 8081}
            periodSeconds: 15
            failureThreshold: 8
            timeoutSeconds: 15
          livenessProbe:
            httpGet: {path: /, port: 8081}
            periodSeconds: 30
            failureThreshold: 30
            timeoutSeconds: 20
          volumeMounts:
            - {name: nexus-data, mountPath: /nexus-data}
      volumes:
        - name: nexus-data
          persistentVolumeClaim:
            claimName: nexus-data
---
apiVersion: v1
kind: Service
metadata:
  name: nexus
  namespace: adhar-system
  labels: {app.kubernetes.io/name: nexus}
  annotations: {argocd.argoproj.io/sync-wave: "1"}
spec:
  selector: {app.kubernetes.io/name: nexus}
  ports:
    - {name: http, port: 8081, targetPort: 8081}
