# Nexus UI + repository APIs on a dedicated host, nexus.adhar.localtest.me,
# through the Cilium Gateway. TLS terminates at the Gateway (adhar-cert wildcard).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nexus
  namespace: adhar-system
  labels:
    app.kubernetes.io/name: nexus
    app.kubernetes.io/part-of: adhar-supply-chain
  annotations:
    # After the oauth2-proxy (wave 5): ArgoCD holds a wave until its resources
    # are healthy, and a route whose backend Service does not exist yet is
    # Degraded (ResolvedRefs=False) — at wave 0 that deadlocked the sync on a
    # fresh cluster and the proxy was never created.
    argocd.argoproj.io/sync-wave: "6"
spec:
  parentRefs:
    - name: adhar-gateway
      namespace: adhar-system
  hostnames:
    - nexus.adhar.localtest.me
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        # Routed through the Keycloak oauth2-proxy (dashboard-sso.yaml) so the UI
        # requires SSO; the proxy forwards to the nexus Service upstream.
        - name: nexus-oauth2-proxy
          port: 4180
