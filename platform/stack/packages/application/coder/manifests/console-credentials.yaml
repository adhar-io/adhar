# Coder bootstrap owner, published for the console's Cloud Dev Environments page.
#
# This lives in the coder package, not in core/adhar-console: its source Secret
# (coder-admin-credentials) is created by admin-setup.yaml here, so on a stack
# without coder a console-owned copy could never resolve — the console app then
# failed its sync on "could not get secret data from provider" and retried
# forever (observed at attempt #39 on the local profile, 2026-09-19). The
# console mounts it with optional: true, so it simply does without when coder
# is disabled.
# Coder bootstrap owner for the console's Cloud Dev Environments page. The
# `gitea` ClusterSecretStore is a plain Kubernetes-provider store over
# adhar-system, so it can read the `coder-admin-credentials` Secret that
# application/coder/manifests/admin-setup.yaml generates. The BFF posts these
# to /api/v2/users/login and proxies with the resulting session token.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: coder-credentials
  namespace: adhar-system
spec:
  secretStoreRef:
    name: gitea
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: coder-credentials
  data:
  - secretKey: CODER_USERNAME
    remoteRef:
      key: coder-admin-credentials
      property: username
  - secretKey: CODER_PASSWORD
    remoteRef:
      key: coder-admin-credentials
      property: password
