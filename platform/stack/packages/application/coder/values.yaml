# Coder values for Adhar. Ingress disabled -- routing is handled by the Cilium
# Gateway API (adhar-gateway) via manifests/httproute.yaml. Coder is served under
# the /coder sub-path on adhar.localtest.me.
coder:
  ingress:
    enable: false
  env:
    # Host-based route (manifests/httproute.yaml); the host is rewritten to the
    # platform domain at seed time. CODER_HTTP_ADDRESS is set by the chart —
    # a second copy here made the Deployment fail server-side apply with
    # "duplicate entries for key [name=CODER_HTTP_ADDRESS]".
    - name: CODER_ACCESS_URL
      value: "https://coder.adhar.localtest.me:8443"
  service:
    type: ClusterIP
