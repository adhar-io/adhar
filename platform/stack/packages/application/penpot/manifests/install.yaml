apiVersion: apps/v1
kind: Deployment
metadata:
  name: penpot-backend
  namespace: adhar-system
  labels:
    helm.sh/chart: penpot-1.9.0
    app.kubernetes.io/name: penpot
    app.kubernetes.io/instance: penpot
    app.kubernetes.io/version: "2.17.2"
    app.kubernetes.io/managed-by: Helm
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: penpot-backend
      app.kubernetes.io/instance: penpot
  replicas: 1
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: penpot-backend
        app.kubernetes.io/name: penpot-backend
        app.kubernetes.io/instance: penpot
    spec:
      serviceAccountName: penpot
      securityContext:
        fsGroup: 1001
      containers:
        - name: penpot-backend
          image: "penpotapp/backend:2.17.2"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - all
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 1001
          env:
            # General settings
            - name: PENPOT_PUBLIC_URI
              value: "https://penpot.adhar.localtest.me:8443"
            - name: PENPOT_FLAGS
              value: "$PENPOT_FLAGS enable-registration enable-login-with-password enable-login-with-oidc disable-email-verification disable-secure-session-cookies"
            - name: PENPOT_SECRET_KEY
              value: "kmZ96pAxhTgk3HZvvBkPeVTspGBneKVLEpO_3ecORs_gwACENZ77z05zCe7skvPsQ3jI3QgkULQOWCuLjmjQsg"
            # Telemetry settings
            - name: PENPOT_TELEMETRY_ENABLED
              value: "true"
            - name: PENPOT_TELEMETRY_REFERER
              value: kubernetes
            # PosgreSQL connection settings
            - name: PENPOT_DATABASE_URI
              value: "postgresql://penpot-postgresql.adhar-system.svc.cluster.local:5432/penpot"
            - name: PENPOT_DATABASE_USERNAME
              value: "penpot"
            - name: PENPOT_DATABASE_PASSWORD
              value: "penpot"
            # Valkey/Redis connection settings
            - name: PENPOT_REDIS_URI
              value: "redis://penpot-valkey.adhar-system.svc.cluster.local:6379/0"
            # Objects Storage settings
            - name: PENPOT_OBJECTS_STORAGE_BACKEND
              value: "s3"
            - name: PENPOT_OBJECTS_STORAGE_S3_REGION
              value: "us-east-1"
            - name: PENPOT_OBJECTS_STORAGE_S3_BUCKET
              value: "penpot"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: penpot-s3-credentials
                  key: accessKeyID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: penpot-s3-credentials
                  key: secretAccessKey
            - name: PENPOT_OBJECTS_STORAGE_S3_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: penpot-s3-credentials
                  key: endpointURI
            # File Data Store settings
            - name: PENPOT_FILE_DATA_BACKEND
              value: "legacy-db"
            # OIDC provider settings.
            #
            # WHY THE ENDPOINTS ARE SPELLED OUT INSTEAD OF DISCOVERED. Penpot's
            # backend is a JVM, and the JVM trusts its own bundled keystore — not the
            # platform CA. Left to discover the provider, it fetches
            # https://keycloak.<host>/realms/adhar/.well-known/openid-configuration
            # and, whenever the platform certificate is self-signed (ALWAYS on local
            # Kind, and on a cloud cluster until ACME succeeds), dies with:
            #
            #   W app.auth.oidc - hint="unable to initialize auth provider"
            #   javax.net.ssl.SSLHandshakeException: PKIX path building failed
            #
            # Penpot then starts happily with OIDC switched off, so the only symptom
            # is a login page with no "Login with OpenID" button — nothing on it
            # mentions certificates.
            #
            # Penpot skips discovery entirely when auth-uri, token-uri and user-uri
            # are all set (backend/src/app/auth/oidc.clj, prepare-oidc-provider), so
            # the split below removes TLS from every server-side call:
            #
            #   auth-uri  → the PUBLIC host: the browser is redirected there, and a
            #               browser trusts the platform certificate or is told to.
            #   token,    → the IN-CLUSTER Service over plain HTTP: server-to-server,
            #   user,       inside the pod network, where Cilium provides the
            #   jwks        confidentiality and no certificate is involved.
            #
            # base-uri stays the PUBLIC issuer so it still matches the `iss` claim
            # Keycloak signs into the ID token. This is the same split the adhar-ai
            # and console packages already use.
            - name: PENPOT_OIDC_BASE_URI
              value: "https://keycloak.adhar.localtest.me:8443/realms/adhar/"
            - name: PENPOT_OIDC_AUTH_URI
              value: "https://keycloak.adhar.localtest.me:8443/realms/adhar/protocol/openid-connect/auth"
            - name: PENPOT_OIDC_TOKEN_URI
              value: "http://keycloak.adhar-system.svc.cluster.local:8080/realms/adhar/protocol/openid-connect/token"
            - name: PENPOT_OIDC_USER_URI
              value: "http://keycloak.adhar-system.svc.cluster.local:8080/realms/adhar/protocol/openid-connect/userinfo"
            - name: PENPOT_OIDC_JWKS_URI
              value: "http://keycloak.adhar-system.svc.cluster.local:8080/realms/adhar/protocol/openid-connect/certs"
            - name: PENPOT_OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: penpot-oidc
                  key: clientID
            - name: PENPOT_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: penpot-oidc
                  key: clientSecret
            - name: PENPOT_OIDC_SCOPES
              value: "openid profile email"
            - name: PENPOT_OIDC_NAME_ATTR
              value: "name"
            - name: PENPOT_OIDC_EMAIL_ATTR
              value: "email"
            # Auto file snapshot settings
            - name: PENPOT_AUTO_FILE_SNAPSHOT_EVERY
              value: "5"
            - name: PENPOT_AUTO_FILE_SNAPSHOT_TIMEOUT
              value: "3h"
            # Extra environments
          volumeMounts:
            - mountPath: "/opt/data/assets"
              name: app-data
              readOnly: false
          ports:
            - name: http
              containerPort: 6060
              protocol: TCP
          resources:
            limits: {}
            requests: {}
          startupProbe:
            failureThreshold: 30
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
      volumes:
      - name: app-data
        emptyDir: {}
