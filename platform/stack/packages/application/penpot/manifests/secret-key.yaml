# PENPOT_SECRET_KEY, generated per cluster. The backend and the exporter both
# read it (values.yaml config.existingSecret): it keys every token Penpot issues
# (session cookies, OIDC state, registration, password-recovery and invitation
# tokens) and the exporter's shared key. The chart's default is a public
# constant, with which anyone could mint or read those tokens.
#
# CreatedOnce: a new key signs everyone out of Penpot (and voids outstanding
# invitations), so it is minted once and never refreshed. If the Secret is ever
# lost and re-minted, the start page (sso-start.yaml penpot.html) checks the
# session rather than trusting the now-stale auth-token cookie, so people are
# signed straight back in through Keycloak.
#
# Wave -2: the backend and exporter Deployments (wave 0) mount it.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: penpot-secret-key
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "-2"}
spec:
  # Penpot derives its keys from this with HKDF (backend/src/app/setup/keys.clj);
  # 64 alphanumerics, like the `secrets.token_urlsafe(64)` its docs suggest.
  length: 64
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: penpot-secret-key
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "-2"}
spec:
  refreshPolicy: CreatedOnce
  refreshInterval: 30s
  target:
    name: penpot-secret-key
    template:
      engineVersion: v2
      data:
        secretKey: "{{ .secretKey }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: penpot-secret-key
      rewrite:
        - transform:
            template: "secretKey"
