# Penpot values for Adhar. Ingress disabled -- routing is handled by the Cilium
# Gateway API (adhar-gateway) via manifests/httproute.yaml.tmpl. Penpot is served
# on its own host (penpot.<host>) and signs people in itself (native OIDC against
# Keycloak, no oauth2-proxy); a page load with no checked session goes through
# the same-origin start page (security/keycloak/manifests/sso-start.yaml,
# penpot.html), which starts that OIDC login so nobody has to click.
#
# The 1.x Penpot chart does NOT bundle PostgreSQL/Valkey, so this package ships a
# minimal in-namespace Postgres + Valkey (manifests/dependencies.yaml) that the
# config below points at.
config:
  # Assets in the platform MinIO (bucket `penpot`, credentials mirrored from
  # root-creds by manifests/platform-storage.yaml). The chart's default is a
  # filesystem backend on ONE ReadWriteOnce volume mounted by both the backend
  # and the frontend, which deadlocks every rolling update (the new frontend
  # pod cannot attach the volume another node still holds) and is not
  # "platform-provided object storage" anyway.
  # Keycloak SSO, natively (Penpot speaks OIDC; "Sign in with OpenID" on the
  # login page). The client `penpot` is provisioned by the keycloak package from
  # manifests/keycloak-client.yaml and its secret mirrored into penpot-oidc.
  # Realm roles are not checked (roles: "") — any realm user may sign in and
  # is auto-registered (enable-registration): on a first sign-in the start page
  # submits Penpot's own "Create account" step for the identity Keycloak just
  # returned, so that click disappears too.
  providers:
    oidc:
      enabled: true
      # THE BROWSER USES KEYCLOAK'S PUBLIC URL; PENPOT'S OWN CALLS STAY IN THE
      # CLUSTER — the split the console, adhar-ai and Tolgee use. All three URIs
      # below are set, so Penpot (2.17.2 backend/src/app/auth/oidc.clj
      # `prepare-oidc-provider`) skips discovery and never resolves, dials or
      # TLS-verifies the public Keycloak host at all.
      #
      # It used to be the public URL for everything, and that is what broke
      # sign-in on GCP (2026-10-26): Penpot's backend redeems the authorization
      # code with a server-side POST, and from inside the cluster
      # https://keycloak.<host> is the Gateway's own load-balancer address, so
      # the POST hairpinned through the Cilium Gateway's Envoy, which enforces
      # network policy on L7-LB traffic and answered it itself —
      #     unable to fetch access token … :response-status 403,
      #     :response-body "Access denied\r\n"
      # (Cilium's l7policy denial body; Keycloak never saw the request, and
      # Hubble's HTTP drop counter on the node ticked in that minute). Penpot
      # then lands on /#/auth/login?error=unable-to-auth, for which it
      # deliberately shows NO message: the person just sees a login page.
      # The public path also made Penpot depend on the JVM trusting the platform
      # certificate (self-signed local Kind: PKIX failure, provider silently
      # dropped) and on public DNS at boot.
      #
      # The in-cluster split used to be refused: Penpot validates every outbound
      # URI against an SSRF blocklist (10/8 included), so a bare
      # http://keycloak.adhar-system.svc… failed with
      #     error=unable-to-auth&hint=uri+target+is+not+allowed
      # `PENPOT_SSRF_ALLOWED_HOSTS` (Penpot 2.15+, read here from 2.17.2
      # backend/src/app/util/ssrf.clj: exact, case-insensitive host match) exempts
      # named hosts — set in backend.extraEnvs below for exactly the Keycloak
      # Service and nothing else.
      #
      # baseURI is still required to be set, but is not fetched once auth, token
      # and user URIs are all given. Trailing slash kept for the day it is.
      baseURI: https://keycloak.adhar.localtest.me:8443/realms/adhar/
      # Where the BROWSER is sent: the public URL, which Keycloak's session
      # cookie belongs to.
      authURI: https://keycloak.adhar.localtest.me:8443/realms/adhar/protocol/openid-connect/auth
      # Server-to-server: code redemption and (fallback) userinfo. Keycloak's
      # `hostname` is the public URL, so tokens fetched here still carry the
      # public issuer.
      tokenURI: http://keycloak.adhar-system.svc.cluster.local:8080/realms/adhar/protocol/openid-connect/token
      userURI: http://keycloak.adhar-system.svc.cluster.local:8080/realms/adhar/protocol/openid-connect/userinfo
      # the chart default here is the literal placeholder "scope1 scope2"
      scopes: "openid profile email"
      roles: ""
      nameAttribute: name
      emailAttribute: email
    existingSecret: penpot-oidc
    secretKeys:
      oidcClientIDKey: clientID
      oidcClientSecretKey: clientSecret
  objectsStorage:
    storageBackend: s3
    s3:
      region: us-east-1
      bucket: penpot
      existingSecret: penpot-s3-credentials
      secretKeys:
        accessKeyIDKey: accessKeyID
        secretAccessKey: secretAccessKey
        endpointURIKey: endpointURI
  publicUri: "https://penpot.adhar.localtest.me:8443"
  # Every platform URL is HTTPS (local Kind included), so the session cookie
  # keeps Penpot's default `Secure` attribute (`disable-secure-session-cookies`
  # used to strip it). The exporter is unaffected: it sets its own auth-token
  # cookie on its headless browser for http://penpot:8080 (exporter
  # browser.cljs `create-cookies`), it never relays the backend's Set-Cookie.
  # The chart template prepends a literal "$PENPOT_FLAGS " (Kubernetes expands
  # only $(VAR)), which used to reach the env and /js/config.js verbatim.
  # Harmless to both flag parsers (common/src/app/common/flags.cljc `parse`
  # skips any word without an enable-/disable- prefix), but it is not a flag,
  # so post-render.py strips it.
  #
  # enable-access-tokens: the Adhar Console calls Penpot's RPC API as a robot
  # profile with `Authorization: Token …` (manifests/console-token.yaml mints
  # it into Secret penpot-api-token). Without the flag the backend compiles
  # token authentication out entirely (2.17.2 backend/src/app/http/
  # access_token.clj `authz`), so every token is answered as anonymous: 401.
  # It also shows the Access Tokens section in each person's profile.
  # enable-webhooks: per-team webhooks (team settings → Webhooks). Delivery
  # goes through Penpot's SSRF filter (loggers/webhooks.clj), which refuses
  # in-cluster addresses unless PENPOT_SSRF_ALLOWED_HOSTS names the host.
  flags: "enable-registration enable-login-with-password enable-login-with-oidc disable-email-verification enable-access-tokens enable-webhooks"
  # PENPOT_SECRET_KEY encrypts every token Penpot issues (sessions, OIDC state,
  # registration, password-recovery and invitation tokens). The chart ships a
  # PUBLIC default key, with which anyone can mint or read those tokens, so the
  # backend and exporter read one generated per cluster instead
  # (manifests/secret-key.yaml, CreatedOnce). Replacing it signs everyone out
  # of Penpot once; the start page then signs them straight back in through
  # Keycloak (it checks the session instead of trusting the stale cookie).
  apiSecretKey: ""
  existingSecret: penpot-secret-key
  secretKeys:
    apiSecretKey: secretKey
  postgresql:
    host: "penpot-postgresql.adhar-system.svc.cluster.local"
    port: 5432
    username: "penpot"
    password: "penpot"
    database: "penpot"
  redis:
    host: "penpot-valkey.adhar-system.svc.cluster.local"
    port: 6379
    database: "0"

ingress:
  enabled: false

# Penpot MCP integration pulls an extra image; keep the core install lean.
# Requests measured on the DigitalOcean cluster (2026-10-22). The chart ships
# none, so every Penpot pod took the namespace's 64Mi default while the backend
# JVM held ~1.5 GiB: the scheduler packed it onto full nodes and the kubelet
# evicted it five times in one afternoon ("request is 64Mi, has larger
# consumption of memory"). Requests only — a limit would also shrink the JVM's
# default heap (25% of the cgroup limit), which is a tuning change of its own.
backend:
  service:
    type: ClusterIP
  resources:
    requests: {cpu: 100m, memory: 1536Mi}
  # The OIDC split above (config.providers.oidc): the chart has no value for the
  # JWKS URI or the SSRF allowlist. JWKS is fetched once at boot; if Keycloak is
  # not answering then, Penpot falls back to the userinfo endpoint per login.
  extraEnvs:
    - name: PENPOT_OIDC_JWKS_URI
      value: http://keycloak.adhar-system.svc.cluster.local:8080/realms/adhar/protocol/openid-connect/certs
    - name: PENPOT_SSRF_ALLOWED_HOSTS
      value: keycloak.adhar-system.svc.cluster.local
frontend:
  service:
    type: ClusterIP
  resources:
    requests: {cpu: 20m, memory: 256Mi}
exporter:
  resources:
    requests: {cpu: 20m, memory: 192Mi}

persistence:
  assets:
    enabled: false
