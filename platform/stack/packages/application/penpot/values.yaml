# Penpot values for Adhar. Ingress disabled -- routing is handled by the Cilium
# Gateway API (adhar-gateway) via manifests/httproute.yaml. Penpot is served
# on its own host (penpot.<host>) behind the Keycloak oauth2-proxy front.
#
# The 1.x Penpot chart does NOT bundle PostgreSQL/Valkey, so this package ships a
# minimal in-namespace Postgres + Valkey (manifests/dependencies.yaml) that the
# config below points at.
config:
  # Assets in the platform MinIO (bucket `penpot`, credentials mirrored from
  # root-creds by manifests/platform-storage.yaml). The chart's default is a
  # filesystem backend on ONE ReadWriteOnce volume mounted by both the backend
  # and the frontend, which deadlocks every rolling update (the new frontend
  # pod cannot attach the volume another node still holds) and is not
  # "platform-provided object storage" anyway.
  # Keycloak SSO, natively (Penpot speaks OIDC; "Sign in with OpenID" on the
  # login page). The client `penpot` is provisioned by the keycloak package from
  # manifests/keycloak-client.yaml and its secret mirrored into penpot-oidc.
  # Realm roles are not checked (roles: "") — any realm user may sign in and
  # is auto-registered (enable-registration).
  providers:
    oidc:
      enabled: true
      # PENPOT MUST TALK TO KEYCLOAK OVER ITS PUBLIC HTTPS URL, and both of the
      # obvious alternatives are dead ends — recorded here because each cost a
      # debugging cycle (this note used to live in the GENERATED manifest, where
      # the next `generate-manifests.sh` deleted it):
      #
      #  1. In-cluster HTTP endpoints (http://keycloak.adhar-system.svc…). This is
      #     the split the console and adhar-ai use, and Penpot REJECTS it: its HTTP
      #     client validates every outbound URI against an SSRF blocklist and only
      #     exempts calls that pass `skip-ssrf-check?`, which the OIDC provider
      #     path does not. The login page then fails with
      #         error=unable-to-auth&hint=uri+target+is+not+allowed
      #     which names a URI, not a security policy.
      #
      #  2. The public URL while the platform certificate is SELF-SIGNED. Penpot's
      #     backend is a JVM and trusts only its bundled keystore, so provider
      #     discovery dies with
      #         javax.net.ssl.SSLHandshakeException: PKIX path building failed
      #     and Penpot then starts happily with OIDC switched OFF — the only
      #     symptom being a login page with no "Login with OpenID" button.
      #
      # So: public URL, and the platform certificate must be publicly trusted
      # (cloud with ACME succeeded — see cmd/up/acme_preflight.go, which warns at
      # bring-up when it will not be). On a self-signed platform — local Kind
      # always, cloud until the DNS-01 challenge passes — Penpot OIDC stays off by
      # design; password login remains, and the fix is to trust the platform CA in
      # the JVM, not to reach for an in-cluster URL.
      #
      # Trailing slash matters: Penpot URI-joins ".well-known/openid-configuration"
      # onto this value, and without the slash RFC 3986 resolution drops the
      # last path segment (".../realms/.well-known/…" → discovery fails).
      baseURI: https://keycloak.adhar.localtest.me:8443/realms/adhar/
      # the chart default here is the literal placeholder "scope1 scope2"
      scopes: "openid profile email"
      roles: ""
      nameAttribute: name
      emailAttribute: email
    existingSecret: penpot-oidc
    secretKeys:
      oidcClientIDKey: clientID
      oidcClientSecretKey: clientSecret
  objectsStorage:
    storageBackend: s3
    s3:
      region: us-east-1
      bucket: penpot
      existingSecret: penpot-s3-credentials
      secretKeys:
        accessKeyIDKey: accessKeyID
        secretAccessKey: secretAccessKey
        endpointURIKey: endpointURI
  publicUri: "https://penpot.adhar.localtest.me:8443"
  flags: "enable-registration enable-login-with-password enable-login-with-oidc disable-email-verification disable-secure-session-cookies"
  postgresql:
    host: "penpot-postgresql.adhar-system.svc.cluster.local"
    port: 5432
    username: "penpot"
    password: "penpot"
    database: "penpot"
  redis:
    host: "penpot-valkey.adhar-system.svc.cluster.local"
    port: 6379
    database: "0"

ingress:
  enabled: false

# Penpot MCP integration pulls an extra image; keep the core install lean.
backend:
  service:
    type: ClusterIP
frontend:
  service:
    type: ClusterIP

persistence:
  assets:
    enabled: false
