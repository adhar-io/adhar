# Adhar marketplace contract for the argo-events package.
# Validated against platform/stack/packages/marketplace.schema.json
# (run: hack/validate-packages.sh). See MARKETPLACE.md for the contract.
# Scaffolded by hack/gen-package-contracts.sh — refine it by hand as the
# package changes; the generator never overwrites an existing contract.
apiVersion: marketplace.adhar.io/v1alpha1
kind: AdharPackage
name: argo-events
category: application
version: "2.4.26"
description: 'Argo Events event-driven automation: event sources, sensors and triggers that start workflows from external events.'
maintainer:
  name: Adhar Platform Team
  url: https://github.com/adhar-io/adhar
  firstParty: true
license: Apache-2.0
homepage: https://argoproj.github.io/argo-events/
adharCompatibility:
  minVersion: "0.1.0"
dependencies: []
provenance:
  sourceRepo: https://github.com/adhar-io/adhar
  upstreamChart: argo/argo-events
  signed: true                 # release artifacts are Cosign-keyless signed by the GoReleaser pipeline
  cosignKeyless: true          # Sigstore Fulcio + Rekor, ADR-0019
  scanned: true
  scanner: trivy
  sbom: https://github.com/adhar-io/adhar/releases  # SPDX SBOMs are attached to every release
planeAffinity: control-plane
stability: beta
resources:
  localSafe: false   # mirrors the enabled gate in adhar-appset-local.yaml
keywords:
  - events
  - eventing
  - automation
  - argo
