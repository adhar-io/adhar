# Lighthouse webhook endpoint through the platform Gateway: Gitea (or an
# external forge) delivers push/PR events to https://lighthouse.<host>/hook,
# validated with the lighthouse-hmac-token shared secret.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: lighthouse
  namespace: adhar-system
spec:
  parentRefs:
    - name: adhar-gateway
      namespace: adhar-system
  hostnames:
    - lighthouse.adhar.localtest.me
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: hook
          port: 80
