# Lighthouse credentials (ADR-0009: Git carries pointers, never values).
#
# - lighthouse-oauth-token: the Git token Lighthouse uses against Gitea,
#   projected from the platform's gitea-credential (key `token`) via the
#   kubernetes-backed ClusterSecretStore.
# - lighthouse-hmac-token: the webhook HMAC shared secret, generated once
#   in-cluster (same pattern as the minio package's root-creds job). Configure
#   the same value on Gitea webhooks (Lighthouse's hook endpoint validates it).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lighthouse-oauth-token
  namespace: adhar-system
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  secretStoreRef:
    name: gitea
    kind: ClusterSecretStore
  target:
    name: lighthouse-oauth-token
  data:
    - secretKey: oauth
      remoteRef:
        key: gitea-credential
        property: token
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lighthouse-secret-gen
  namespace: adhar-system
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "-10"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lighthouse-secret-gen
  namespace: adhar-system
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "-10"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lighthouse-secret-gen
  namespace: adhar-system
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "-10"
subjects:
  - kind: ServiceAccount
    name: lighthouse-secret-gen
    namespace: adhar-system
roleRef:
  kind: Role
  name: lighthouse-secret-gen
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: lighthouse-hmac-gen
  namespace: adhar-system
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "-5"
spec:
  template:
    metadata:
      generateName: lighthouse-hmac-gen
    spec:
      serviceAccountName: lighthouse-secret-gen
      restartPolicy: Never
      enableServiceLinks: false
      containers:
        - name: kubectl
          image: docker.io/bitnamilegacy/kubectl:1.31
          command: ["/bin/bash", "-c"]
          args:
            - |
              kubectl get secret -n adhar-system lighthouse-hmac-token && exit 0
              set -e
              HMAC=$(openssl rand -hex 32)
              kubectl create secret generic lighthouse-hmac-token \
                -n adhar-system --from-literal=hmac="${HMAC}"
