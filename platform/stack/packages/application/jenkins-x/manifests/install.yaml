            value: "http://gitea-http.adhar-system.svc.cluster.local:3000"
          - name: "GIT_USER"
            value: gitea_admin
          - name: "GIT_TOKEN"
            valueFrom:
              secretKeyRef:
                name: lighthouse-oauth-token
                key: oauth
          - name: "HMAC_TOKEN"
            valueFrom:
              secretKeyRef:
                name: lighthouse-hmac-token
                key: hmac
          - name: "JX_LOG_FORMAT"
            value: "json"
          - name: "LOGRUS_FORMAT"
            value: "json"
          - name: LOGRUS_SERVICE
            value: "lighthouse"
          - name: LOG_LEVEL
            value: "info"
          - name: LOGRUS_SERVICE_VERSION
            value: "1.33.1"
          - name: LOGRUS_STACK_SKIP
            value: ""
          - name: JX_DEFAULT_IMAGE
            value: ""
        securityContext:
            {}
        resources:
            limits:
              cpu: 100m
              memory: 256Mi
            requests:
              cpu: 80m
              memory: 128Mi
        volumeMounts:
      volumes:
      terminationGracePeriodSeconds: 180
