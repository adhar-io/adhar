# Source: lighthouse/templates/config-cm.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: config
  labels:
    app: lighthouse-lighthouse
    chart: "lighthouse-1.33.1"
    release: "lighthouse"
data:
  config.yaml: |
    pod_namespace: adhar-system
    prowjob_namespace: adhar-system
    in_repo_config:
      enabled:
        "*": true
    branch-protection:
      protect-tested-repos: true
    plank: {}
    push_gateway:
      serve_metrics: false
    tide:
      merge_method:
        adhar: merge
      target_url: https://lighthouse.adhar.localtest.me:8443
      queries:
        - labels:
            - approved
          missingLabels:
            - do-not-merge
            - do-not-merge/hold
            - do-not-merge/work-in-progress
            - needs-ok-to-test
          orgs:
            - adhar
      context_options:
        from-branch-protection: true
        required-if-present-contexts: []
        skip-unknown-contexts: false
