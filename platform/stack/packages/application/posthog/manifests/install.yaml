                exec:
                    command: [
                        "sh", "-c",
                        "(echo '{\"event\": \"preStop_started\"}'; touch /tmp/posthog_prestop || true; sleep 20; echo '{\"event\": \"preStop_ended\"}') > /proc/1/fd/1"
                    ]

        livenessProbe:
          httpGet:
            path: /_livez
            port: 8000
            scheme: HTTP
          failureThreshold: 3
          initialDelaySeconds: 0
