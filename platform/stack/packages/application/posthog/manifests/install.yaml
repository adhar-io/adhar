      remote_servers/posthog_writable/shard/replica/port: "9000"
      remote_servers/session_replay/shard/replica/host: chi-posthog-posthog-0-0
      remote_servers/session_replay/shard/replica/port: "9000"
      remote_servers/sessions/shard/replica/host: chi-posthog-posthog-0-0
      remote_servers/sessions/shard/replica/port: "9000"
      remote_servers/web_analytics/shard/replica/host: chi-posthog-posthog-0-0
      remote_servers/web_analytics/shard/replica/port: "9000"
      session_log/database: system
      session_log/flush_interval_milliseconds: "7500"
      session_log/partition_by: toYYYYMM(event_date)
      session_log/table: session_log

    files:
      events.proto: |
        syntax = "proto3";
        message Event {
          string uuid = 1;
          string event = 2;
          string properties = 3;
          string timestamp = 4;
          uint64 team_id = 5;
          string distinct_id = 6;
          string created_at = 7;
          string elements_chain = 8;
        }

    zookeeper:
      nodes:
        - host: posthog-clickhouse-keeper
          port: 2181

  templates:
    podTemplates:
      - name: pod-template
        spec:
          volumes:
            - name: data-volumeclaim-template
              persistentVolumeClaim:
                claimName: data-volumeclaim-template
          securityContext:
            fsGroup: 101
            runAsGroup: 101
            runAsUser: 101

          containers:
            - name: clickhouse
              image: "clickhouse/clickhouse-server:26.6.2.158"
              command:
                - /bin/bash
                - -c
                - /usr/bin/clickhouse-server --config-file=/etc/clickhouse-server/config.xml

              ports:
                - name: http
                  containerPort: 8123
                - name: client
                  containerPort: 9000
                - name: interserver
                  containerPort: 9009
              volumeMounts:
                - name: data-volumeclaim-template
                  mountPath: /var/lib/clickhouse

    serviceTemplates:
      - name: service-template
        generateName: clickhouse-posthog
        spec:
          ports:
            - name: http
              port: 8123
            - name: tcp
              port: 9000
          type: ClusterIP
    volumeClaimTemplates:
      - name: data-volumeclaim-template
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: "20Gi"
