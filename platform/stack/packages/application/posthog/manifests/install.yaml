                                  type: string
                                dataVolumeClaimTemplate:
                                  type: string
                                logVolumeClaimTemplate:
                                  type: string
                                serviceTemplate:
                                  type: string
                                clusterServiceTemplate:
                                  type: string
                                shardServiceTemplate:
                                  type: string
                                replicaServiceTemplate:
                                  type: string
                  podTemplates:
                    type: array
                    description: 'podTemplate will use during render `Pod` inside
                      `StatefulSet.spec` and allows define rendered `Pod.spec`, pod
                      scheduling distribution and pod zone

                      More information: https://github.com/Altinity/clickhouse-operator/blob/master/docs/custom_resource_explained.md#spectemplatespodtemplates

                      '
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          description: template name, could use to link inside top-level
                            `chi.spec.defaults.templates.podTemplate`, cluster-level
                            `chi.spec.configuration.clusters.templates.podTemplate`,
                            shard-level `chi.spec.configuration.clusters.layout.shards.temlates.podTemplate`,
                            replica-level `chi.spec.configuration.clusters.layout.replicas.templates.podTemplate`
                        generateName:
                          type: string
                          description: allows define format for generated `Pod` name,
                            look to https://github.com/Altinity/clickhouse-operator/blob/master/docs/custom_resource_explained.md#spectemplatesservicetemplates
                            for details about aviailable template variables
                        zone:
                          type: object
                          description: allows define custom zone name and will separate
                            ClickHouse `Pods` between nodes, shortcut for `chi.spec.templates.podTemplates.spec.affinity.podAntiAffinity`
                          properties:
                            key:
                              type: string
                              description: optional, if defined, allows select kubernetes
                                nodes by label with `name` equal `key`
                            values:
                              type: array
                              description: optional, if defined, allows select kubernetes
                                nodes by label with `value` in `values`
                              items:
                                type: string
                        distribution:
                          type: string
                          description: DEPRECATED, shortcut for `chi.spec.templates.podTemplates.spec.affinity.podAntiAffinity`
                          enum:
                          - ''
                          - Unspecified
                          - OnePerHost
                        podDistribution:
                          type: array
                          description: define ClickHouse Pod distibution policy between
                            Kubernetes Nodes inside Shard, Replica, Namespace, CHI,
                            another ClickHouse cluster
                          items:
                            type: object
                            properties:
                              type:
                                type: string
                                description: you can define multiple affinity policy
                                  types
                                enum:
                                - ''
                                - Unspecified
                                - ClickHouseAntiAffinity
                                - ShardAntiAffinity
                                - ReplicaAntiAffinity
                                - AnotherNamespaceAntiAffinity
                                - AnotherClickHouseInstallationAntiAffinity
                                - AnotherClusterAntiAffinity
                                - MaxNumberPerNode
                                - NamespaceAffinity
                                - ClickHouseInstallationAffinity
                                - ClusterAffinity
                                - ShardAffinity
                                - ReplicaAffinity
                                - PreviousTailAffinity
                                - CircularReplication
                              scope:
                                type: string
                                description: scope for apply each podDistribution
                                enum:
                                - ''
                                - Unspecified
                                - Shard
                                - Replica
                                - Cluster
                                - ClickHouseInstallation
                                - Namespace
                              number:
                                type: integer
                                description: define, how much ClickHouse Pods could
                                  be inside selected scope with selected distribution
                                  type
                                minimum: 0
                                maximum: 65535
                              topologyKey:
                                type: string
                                description: 'use for inter-pod affinity look to `pod.spec.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution.podAffinityTerm.topologyKey`,
                                  More info: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#inter-pod-affinity-and-anti-affinity'
                        spec:
                          type: object
                          description: allows define whole Pod.spec inside StaefulSet.spec,
                            look to https://kubernetes.io/docs/concepts/workloads/pods/#pod-templates
                            for details
                          x-kubernetes-preserve-unknown-fields: true
                        metadata:
                          type: object
                          description: 'allows pass standard object''s metadata from
                            template to Pod

                            More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#metadata

                            '
                          x-kubernetes-preserve-unknown-fields: true
                  volumeClaimTemplates:
                    type: array
                    description: allows define template for rendering `PVC` kubernetes
                      resource, which would use inside `Pod` for mount clickhouse
                      `data`, clickhouse `logs` or something else
                    items:
                      type: object
                      properties:
                        name:
                          description: 'template name, could use to link inside

                            top-level `chi.spec.defaults.templates.dataVolumeClaimTemplate`
                            or `chi.spec.defaults.templates.logVolumeClaimTemplate`,

                            cluster-level `chi.spec.configuration.clusters.templates.dataVolumeClaimTemplate`
                            or `chi.spec.configuration.clusters.templates.logVolumeClaimTemplate`,

                            shard-level `chi.spec.configuration.clusters.layout.shards.temlates.dataVolumeClaimTemplate`
                            or `chi.spec.configuration.clusters.layout.shards.temlates.logVolumeClaimTemplate`

                            replica-level `chi.spec.configuration.clusters.layout.replicas.templates.dataVolumeClaimTemplate`
                            or `chi.spec.configuration.clusters.layout.replicas.templates.logVolumeClaimTemplate`

                            '
                          type: string
                        reclaimPolicy:
                          type: string
                          description: define behavior of `PVC` deletion policy during
                            delete `Pod`, `Delete` by default, when `Retain` then
                            `PVC` still alive even `Pod` will deleted
                          enum:
                          - ''
                          - Retain
                          - Delete
                        metadata:
                          type: object
                          description: 'allows pass standard object''s metadata from
                            template to PVC

                            More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#metadata

                            '
                          x-kubernetes-preserve-unknown-fields: true
                        spec:
                          type: object
                          description: 'allows define all aspects of `PVC` resource

                            More info: https://kubernetes.io/docs/concepts/storage/persistent-volumes/#persistentvolumeclaims

                            '
                          x-kubernetes-preserve-unknown-fields: true
                  serviceTemplates:
                    type: array
                    description: 'allows define template for rendering `Service` which
                      would get endpoint from Pods which scoped chi-wide, cluster-wide,
                      shard-wide, replica-wide level

                      '
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          description: 'template name, could use to link inside

                            chi-level `chi.spec.defaults.templates.serviceTemplate`

                            cluster-level `chi.spec.configuration.clusters.templates.clusterServiceTemplate`

                            shard-level `chi.spec.configuration.clusters.layout.shards.temlates.shardServiceTemplate`

                            replica-level `chi.spec.configuration.clusters.layout.replicas.templates.replicaServiceTemplate`
                            or `chi.spec.configuration.clusters.layout.shards.replicas.replicaServiceTemplate`

                            '
                        generateName:
                          type: string
                          description: allows define format for generated `Service`
                            name, look to https://github.com/Altinity/clickhouse-operator/blob/master/docs/custom_resource_explained.md#spectemplatesservicetemplates
                            for details about aviailable template variables
                        metadata:
                          type: object
                          description: 'allows pass standard object''s metadata from
                            template to Service

                            Could be use for define specificly for Cloud Provider
                            metadata which impact to behavior of service

                            More info: https://kubernetes.io/docs/concepts/services-networking/service/

                            '
                          x-kubernetes-preserve-unknown-fields: true
                        spec:
                          type: object
                          description: 'describe behavior of generated Service

                            More info: https://kubernetes.io/docs/concepts/services-networking/service/

                            '
                          x-kubernetes-preserve-unknown-fields: true
              useTemplates:
                type: array
                description: list of `ClickHouseInstallationTemplate` (chit) resource
                  names which will merge with current `Chi` manifest during render
                  Kubernetes resources to create related ClickHouse clusters
                items:
                  type: object
                  properties:
                    name:
                      type: string
                      description: name of `ClickHouseInstallationTemplate` (chit)
                        resource
                    namespace:
                      type: string
                      description: Kubernetes namespace where need search `chit` resource,
                        depending on `watchNamespaces` settings in `clichouse-operator`
                    useType:
                      type: string
                      description: optional, current strategy is only merge, and current
                        `chi` settings have more priority than merged template `chit`
                      enum:
                      - ''
                      - merge
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: clickhouseinstallationtemplates.clickhouse.altinity.com
  labels:
    clickhouse.altinity.com/chop: 0.18.4
spec:
  group: clickhouse.altinity.com
  scope: Namespaced
  names:
    kind: ClickHouseInstallationTemplate
    singular: clickhouseinstallationtemplate
    plural: clickhouseinstallationtemplates
    shortNames:
    - chit
  versions:
  - name: v1
    served: true
    storage: true
    additionalPrinterColumns:
    - name: version
      type: string
      description: Operator version
      priority: 1
      jsonPath: .status.chop-version
    - name: clusters
