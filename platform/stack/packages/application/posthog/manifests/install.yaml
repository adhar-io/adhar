          imagePullPolicy: IfNotPresent
          env:
            - name: CLICKHOUSE_HOST
              value: clickhouse-posthog
            - name: CLICKHOUSE_CLUSTER
              value: "posthog"
            - name: CLICKHOUSE_DATABASE
              value: "posthog"
            - name: CLICKHOUSE_USER
              value: "admin"
            - name: CLICKHOUSE_PASSWORD
              value: "a1f31e03-c88e-4ca6-a2df-ad49183d15d9"
            - name: CLICKHOUSE_SECURE
              value: "false"
            - name: CLICKHOUSE_VERIFY
              value: "false"
          command:
            - /bin/sh
            - -c
            - >
                
                until (
                    NODES_COUNT=$(wget -qO- \
                        "http://$CLICKHOUSE_USER:$CLICKHOUSE_PASSWORD@clickhouse-posthog.$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace).svc.cluster.local:8123" \
                        --post-data "SELECT count() FROM clusterAllReplicas('posthog', system, one)"
                    )
                    test ! -z $NODES_COUNT && test $NODES_COUNT -eq 1
                );
                do
                    echo "waiting for all ClickHouse nodes to be available"; sleep 1;
                done
                
        
                until (nc -vz "posthog-pgbouncer" 6543);
                do
                    echo "waiting for PgBouncer"; sleep 1;
                done
        
                
        
                
                until (nc -vz "posthog-posthog-redis-master.$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace).svc.cluster.local" "6379");
                do
                    echo "waiting for Redis"; sleep 1;
                done
