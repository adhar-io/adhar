apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: clickhouseinstallations.clickhouse.altinity.com
  labels:
    clickhouse.altinity.com/chop: 0.18.4
spec:
  group: clickhouse.altinity.com
  scope: Namespaced
  names:
    kind: ClickHouseInstallation
    singular: clickhouseinstallation
    plural: clickhouseinstallations
    shortNames:
    - chi
  versions:
  - name: v1
    served: true
    storage: true
    additionalPrinterColumns:
    - name: version
      type: string
      description: Operator version
      priority: 1
      jsonPath: .status.chop-version
    - name: clusters
      type: integer
      description: Clusters count
      priority: 0
      jsonPath: .status.clusters
    - name: shards
      type: integer
      description: Shards count
      priority: 1
      jsonPath: .status.shards
    - name: hosts
      type: integer
      description: Hosts count
      priority: 0
      jsonPath: .status.hosts
    - name: taskID
      type: string
      description: TaskID
      priority: 1
      jsonPath: .status.taskID
    - name: status
      type: string
      description: CHI status
      priority: 0
      jsonPath: .status.status
    - name: updated
      type: integer
      description: Updated hosts count
      priority: 1
      jsonPath: .status.updated
    - name: added
      type: integer
      description: Added hosts count
      priority: 1
      jsonPath: .status.added
    - name: deleted
      type: integer
      description: Hosts deleted count
      priority: 1
      jsonPath: .status.deleted
    - name: delete
      type: integer
      description: Hosts to be deleted count
      priority: 1
      jsonPath: .status.delete
    - name: endpoint
      type: string
      description: Client access endpoint
      priority: 1
      jsonPath: .status.endpoint
    - name: age
      type: date
      description: Age of the resource
      jsonPath: .metadata.creationTimestamp
    subresources:
      status: {}
    schema:
      openAPIV3Schema:
        description: define a set of Kubernetes resources (StatefulSet, PVC, Service,
          ConfigMap) which describe behavior one or more ClickHouse clusters
        type: object
        required:
        - spec
        properties:
          apiVersion:
            description: 'APIVersion defines the versioned schema of this representation
              of an object. Servers should convert recognized schemas to the latest
              internal value, and may reject unrecognized values. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources'
            type: string
          kind:
            description: 'Kind is a string value representing the REST resource this
              object represents. Servers may infer this from the endpoint the client
              submits requests to. Cannot be updated. In CamelCase. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds'
            type: string
          metadata:
            type: object
          status:
            type: object
            description: Current ClickHouseInstallation manifest status, contains
              many fields like a normalized configuration, clickhouse-operator version,
              current action and all applied action list, current taskID and all applied
              taskIDs and other
            properties:
              chop-version:
                type: string
                description: ClickHouse operator version
              chop-commit:
                type: string
                description: ClickHouse operator git commit SHA
              chop-date:
                type: string
                description: ClickHouse operator build date
              clusters:
                type: integer
                minimum: 0
                description: Clusters count
              shards:
                type: integer
                minimum: 0
                description: Shards count
              replicas:
                type: integer
                minimum: 0
                description: Replicas count
              hosts:
                type: integer
                minimum: 0
                description: Hosts count
              status:
                type: string
                description: Status
              taskID:
                type: string
                description: Current task id
              taskIDsStarted:
                type: array
                description: Started task ids
                items:
                  type: string
              taskIDsCompleted:
                type: array
                description: Completed task ids
                items:
                  type: string
              action:
                type: string
                description: Action
              actions:
                type: array
                description: Actions
                items:
                  type: string
              error:
                type: string
                description: Last error
              errors:
                type: array
                description: Errors
                items:
                  type: string
              updated:
                type: integer
                minimum: 0
                description: Updated Hosts count
              added:
                type: integer
                minimum: 0
                description: Added Hosts count
              deleted:
                type: integer
                minimum: 0
                description: Deleted Hosts count
              delete:
                type: integer
                minimum: 0
                description: About to delete Hosts count
              pods:
                type: array
                description: Pods
                items:
                  type: string
              fqdns:
                type: array
                description: Pods FQDNs
                items:
                  type: string
              endpoint:
                type: string
                description: Endpoint
              generation:
                type: integer
                minimum: 0
                description: Generation
              normalized:
                type: object
                description: Normalized CHI
                x-kubernetes-preserve-unknown-fields: true
          spec:
            type: object
            description: 'Specification of the desired behavior of one or more ClickHouse
              clusters

              More info: https://github.com/Altinity/clickhouse-operator/blob/master/docs/custom_resource_explained.md"

              '
            properties:
              taskID:
                type: string
                description: Allow define custom taskID for named update and watch
                  status of this update execution in .status.taskIDs field, by default
                  every update of chi manifest will generate random taskID
              stop:
                type: string
                description: "Allow stop all ClickHouse clusters described in current\
                  \ chi.\nStop mechanism works as follows:\n - When `stop` is `1`\
                  \ then setup `Replicas: 0` in each related to current `chi` StatefulSet\
                  \ resource, all `Pods` and `Service` resources will desctroy, but\
                  \ PVCs still live\n - When `stop` is `0` then `Pods` will created\
                  \ again and will attach retained PVCs and `Service` also will created\
                  \ again\n"
                enum:
                - ''
                - '0'
                - '1'
                - 'False'
                - 'false'
                - 'True'
                - 'true'
                - 'No'
                - 'no'
                - 'Yes'
                - 'yes'
                - 'Off'
                - 'off'
                - 'On'
                - 'on'
                - Disable
                - disable
                - Enable
                - enable
                - Disabled
                - disabled
                - Enabled
                - enabled
              restart:
                type: string
                description: This is a 'soft restart' button. When set to 'RollingUpdate'
                  operator will restart ClickHouse pods in a graceful way. Remove
                  it after the use in order to avoid unneeded restarts
                enum:
                - ''
                - RollingUpdate
              troubleshoot:
                type: string
                description: allows troubleshoot Pods during CrashLoopBack state,
                  when you apply wrong configuration, `clickhouse-server` wouldn't
                  startup
                enum:
                - ''
                - '0'
                - '1'
                - 'False'
                - 'false'
                - 'True'
                - 'true'
                - 'No'
                - 'no'
                - 'Yes'
                - 'yes'
                - 'Off'
                - 'off'
                - 'On'
                - 'on'
                - Disable
                - disable
                - Enable
                - enable
                - Disabled
                - disabled
                - Enabled
                - enabled
              namespaceDomainPattern:
                type: string
                description: custom domain suffix which will add to end of `Service`
                  or `Pod` name, use it when you use custom cluster domain in your
                  Kubernetes cluster
              templating:
                type: object
                description: optional, define policy for auto applying ClickHouseInstallationTemplate
                  inside ClickHouseInstallation
                properties:
                  policy:
                    type: string
                    description: when defined as `auto` inside ClickhouseInstallationTemplate,
                      it will auto add into all ClickHouseInstallation, manual value
                      is default
                    enum:
                    - auto
                    - manual
              reconciling:
                type: object
                description: optional, allows tuning reconciling cycle for ClickhouseInstallation
                  from clickhouse-operator side
                properties:
                  policy:
                    type: string
                    description: DEPRECATED
                  configMapPropagationTimeout:
                    type: integer
                    description: 'timeout in seconds when `clickhouse-operator` will
                      wait when applied `ConfigMap` during reconcile `ClickhouseInstallation`
                      pods will updated from cache

                      see details: https://kubernetes.io/docs/concepts/configuration/configmap/#mounted-configmaps-are-updated-automatically

                      '
                    minimum: 0
                    maximum: 3600
                  cleanup:
                    type: object
                    description: optional, define behavior for cleanup Kubernetes
                      resources during reconcile cycle
                    properties:
                      unknownObjects:
                        type: object
                        description: what clickhouse-operator shall do when found
                          Kubernetes resources which should be managed with clickhouse-operator,
                          but not have `ownerReference` to any currently managed `ClickHouseInstallation`
                          resource, default behavior is `Delete`
                        properties:
                          statefulSet:
                            type: string
                            description: behavior policy for unknown StatefulSet,
                              Delete by default
                            enum:
                            - Retain
                            - Delete
                          pvc:
                            type: string
                            description: behavior policy for unknown PVC, Delete by
                              default
                            enum:
                            - Retain
                            - Delete
                          configMap:
                            type: string
                            description: behavior policy for unknown ConfigMap, Delete
                              by default
                            enum:
                            - Retain
                            - Delete
                          service:
                            type: string
                            description: behavior policy for unknown Service, Delete
                              by default
                            enum:
                            - Retain
                            - Delete
                      reconcileFailedObjects:
                        type: object
                        description: what clickhouse-operator shall do when reconciling
                          Kubernetes resources are failed, default behavior is `Retain`
                        properties:
                          statefulSet:
                            type: string
                            description: behavior policy for failed StatefulSet reconciling,
                              Retain by default
                            enum:
                            - Retain
                            - Delete
                          pvc:
                            type: string
                            description: behavior policy for failed PVC reconciling,
                              Retain by default
                            enum:
                            - Retain
                            - Delete
                          configMap:
                            type: string
                            description: behavior policy for failed ConfigMap reconciling,
                              Retain by default
                            enum:
                            - Retain
                            - Delete
                          service:
                            type: string
                            description: behavior policy for failed Service reconciling,
                              Retain by default
                            enum:
                            - Retain
                            - Delete
              defaults:
                type: object
                description: 'define default behavior for whole ClickHouseInstallation,
                  some behavior can be re-define on cluster, shard and replica level

                  More info: https://github.com/Altinity/clickhouse-operator/blob/master/docs/custom_resource_explained.md#specdefaults

                  '
                properties:
                  replicasUseFQDN:
                    type: string
                    description: 'define should replicas be specified by FQDN in `<host></host>`,
                      then "no" then will use short hostname and clickhouse-server
                      will use kubernetes default suffixes for properly DNS lookup

                      "yes" by default

                      '
                    enum:
                    - ''
                    - '0'
                    - '1'
                    - 'False'
                    - 'false'
                    - 'True'
                    - 'true'
                    - 'No'
                    - 'no'
                    - 'Yes'
                    - 'yes'
                    - 'Off'
                    - 'off'
                    - 'On'
                    - 'on'
                    - Disable
                    - disable
                    - Enable
                    - enable
                    - Disabled
                    - disabled
                    - Enabled
                    - enabled
                  distributedDDL:
                    type: object
                    description: 'allows change `<yandex><distributed_ddl></distributed_ddl></yandex>`
                      settings

                      More info: https://clickhouse.tech/docs/en/operations/server-configuration-parameters/settings/#server-settings-distributed_ddl

                      '
                    properties:
                      profile:
                        type: string
                        description: Settings from this profile will be used to execute
                          DDL queries
                  templates:
                    type: object
                    description: optional, configuration of the templates names which
                      will use for generate Kubernetes resources according to one
                      or more ClickHouse clusters described in current ClickHouseInstallation
                      (chi) resource
                    properties:
                      hostTemplate:
                        type: string
                        description: optional, template name from chi.spec.templates.hostTemplates,
                          which will apply to configure every `clickhouse-server`
                          instance during render ConfigMap resources which will mount
                          into `Pod`
                      podTemplate:
                        type: string
                        description: optional, template name from chi.spec.templates.podTemplates,
                          allows customization each `Pod` resource during render and
                          reconcile each StatefulSet.spec resource described in `chi.spec.configuration.clusters`
                      dataVolumeClaimTemplate:
                        type: string
                        description: optional, template name from chi.spec.templates.volumeClaimTemplates,
                          allows customization each `PVC` which will mount for clickhouse
                          data directory in each `Pod` during render and reconcile
                          every StatefulSet.spec resource described in `chi.spec.configuration.clusters`
                      logVolumeClaimTemplate:
                        type: string
                        description: optional, template name from chi.spec.templates.volumeClaimTemplates,
                          allows customization each `PVC` which will mount for clickhouse
                          log directory in each `Pod` during render and reconcile
                          every StatefulSet.spec resource described in `chi.spec.configuration.clusters`
                      serviceTemplate:
                        type: string
                        description: optional, template name from chi.spec.templates.serviceTemplates,
                          allows customization for one `Service` resource which will
                          created by `clickhouse-operator` which cover all clusters
                          in whole `chi` resource
                      clusterServiceTemplate:
                        type: string
                        description: optional, template name from chi.spec.templates.serviceTemplates,
                          allows customization for each `Service` resource which will
                          created by `clickhouse-operator` which cover each clickhouse
                          cluster described in `chi.spec.configuration.clusters`
                      shardServiceTemplate:
                        type: string
                        description: optional, template name from chi.spec.templates.serviceTemplates,
                          allows customization for each `Service` resource which will
                          created by `clickhouse-operator` which cover each shard
                          inside clickhouse cluster described in `chi.spec.configuration.clusters`
                      replicaServiceTemplate:
                        type: string
                        description: optional, template name from chi.spec.templates.serviceTemplates,
                          allows customization for each `Service` resource which will
                          created by `clickhouse-operator` which cover each replica
                          inside each shard inside each clickhouse cluster described
                          in `chi.spec.configuration.clusters`
                      volumeClaimTemplate:
                        type: string
                        description: DEPRECATED! VolumeClaimTemplate is deprecated
                          in favor of DataVolumeClaimTemplate and LogVolumeClaimTemplate
              configuration:
                type: object
                description: allows configure multiple aspects and behavior for `clickhouse-server`
                  instance and also allows describe multiple `clickhouse-server` clusters
                  inside one `chi` resource
                properties:
                  zookeeper:
                    type: object
                    description: 'allows configure <yandex><zookeeper>..</zookeeper></yandex>
                      section in each `Pod` during generate `ConfigMap` which will
                      mounted in `/etc/clickhouse-server/config.d/`

                      `clickhouse-operator` itself doesn''t manage Zookeeper, please
                      install Zookeeper separatelly look examples on https://github.com/Altinity/clickhouse-operator/tree/master/deploy/zookeeper/

                      currently, zookeeper (or clickhouse-keeper replacement) used
                      for *ReplicatedMergeTree table engines and for `distributed_ddl`

                      More details: https://clickhouse.tech/docs/en/operations/server-configuration-parameters/settings/#server-settings_zookeeper

                      '
                    properties:
                      nodes:
                        type: array
                        description: describe every available zookeeper cluster node
                          for interaction
                        items:
                          type: object
                          properties:
                            host:
                              type: string
                              description: dns name or ip address for Zookeeper node
                            port:
                              type: integer
                              description: TCP port which used to connect to Zookeeper
                                node
                              minimum: 0
                              maximum: 65535
                      session_timeout_ms:
                        type: integer
                        description: session timeout during connect to Zookeeper
                      operation_timeout_ms:
                        type: integer
                        description: one operation timeout during Zookeeper transactions
                      root:
                        type: string
                        description: optional root znode path inside zookeeper to
                          store ClickHouse related data (replication queue or distributed
                          DDL)
                      identity:
                        type: string
                        description: optional access credentials string with `user:password`
                          format used when use digest authorization in Zookeeper
                  users:
                    type: object
                    description: 'allows configure <yandex><users>..</users></yandex>
                      section in each `Pod` during generate `ConfigMap` which will
                      mount in `/etc/clickhouse-server/users.d/`

                      you can configure password hashed, authorization restrictions,
                      database level security row filters etc.

                      More details: https://clickhouse.tech/docs/en/operations/settings/settings-users/

                      Your yaml code will convert to XML, see examples https://github.com/Altinity/clickhouse-operator/blob/master/docs/custom_resource_explained.md#specconfigurationusers

                      '
                    x-kubernetes-preserve-unknown-fields: true
                  profiles:
                    type: object
                    description: 'allows configure <yandex><profiles>..</profiles></yandex>
                      section in each `Pod` during generate `ConfigMap` which will
                      mount in `/etc/clickhouse-server/users.d/`

                      you can configure any aspect of settings profile

                      More details: https://clickhouse.tech/docs/en/operations/settings/settings-profiles/

                      Your yaml code will convert to XML, see examples https://github.com/Altinity/clickhouse-operator/blob/master/docs/custom_resource_explained.md#specconfigurationprofiles

                      '
                    x-kubernetes-preserve-unknown-fields: true
                  quotas:
                    type: object
                    description: 'allows configure <yandex><quotas>..</quotas></yandex>
                      section in each `Pod` during generate `ConfigMap` which will
                      mount in `/etc/clickhouse-server/users.d/`

                      you can configure any aspect of resource quotas

                      More details: https://clickhouse.tech/docs/en/operations/quotas/

                      Your yaml code will convert to XML, see examples https://github.com/Altinity/clickhouse-operator/blob/master/docs/custom_resource_explained.md#specconfigurationquotas

                      '
                    x-kubernetes-preserve-unknown-fields: true
                  settings:
                    type: object
                    description: 'allows configure `clickhouse-server` settings inside
                      <yandex>...</yandex> tag in each `Pod` during generate `ConfigMap`
                      which will mount in `/etc/clickhouse-server/config.d/`

                      More details: https://clickhouse.tech/docs/en/operations/settings/settings/

                      Your yaml code will convert to XML, see examples https://github.com/Altinity/clickhouse-operator/blob/master/docs/custom_resource_explained.md#specconfigurationsettings

                      '
                    x-kubernetes-preserve-unknown-fields: true
                  files:
                    type: object
                    description: 'allows define content of any setting file inside
                      each `Pod` during generate `ConfigMap` which will mount in `/etc/clickhouse-server/config.d/`
                      or `/etc/clickhouse-server/conf.d/` or `/etc/clickhouse-server/users.d/`

                      every key in this object is the file name

                      every value in this object is the file content

                      you can use `!!binary |` and base64 for binary files, see details
                      here https://yaml.org/type/binary.html

                      each key could contains prefix like USERS, COMMON, HOST or config.d,
                      users.d, cond.d, wrong prefixes will ignored, subfolders also
                      will ignored

                      More details: https://github.com/Altinity/clickhouse-operator/blob/master/docs/chi-examples/05-settings-05-files-nested.yaml

                      '
                    x-kubernetes-preserve-unknown-fields: true
                  clusters:
                    type: array
                    description: 'describes ClickHouse clusters layout and allows
                      change settings on cluster-level, shard-level and replica-level

                      every cluster is a set of StatefulSet, one StatefulSet contains
                      only one Pod with `clickhouse-server`

                      all Pods will rendered in <remote_server> part of ClickHouse
                      configs, mounted from ConfigMap as `/etc/clickhouse-server/config.d/chop-generated-remote_servers.xml`

                      Clusters will use for Distributed table engine, more details:
                      https://clickhouse.tech/docs/en/engines/table-engines/special/distributed/

                      If `cluster` contains zookeeper settings (could be inherited
                      from top `chi` level), when you can create *ReplicatedMergeTree
                      tables

                      '
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          description: cluster name, used to identify set of ClickHouse
                            servers and wide used during generate names of related
                            Kubernetes resources
                          minLength: 1
                          maxLength: 15
                          pattern: ^[a-zA-Z0-9-]{0,15}$
                        zookeeper:
                          type: object
                          description: 'optional, allows configure <yandex><zookeeper>..</zookeeper></yandex>
                            section in each `Pod` only in current ClickHouse cluster,
                            during generate `ConfigMap` which will mounted in `/etc/clickhouse-server/config.d/`

                            override top-level `chi.spec.configuration.zookeeper`
                            settings

                            '
                          properties:
                            nodes:
                              type: array
                              description: describe every available zookeeper cluster
                                node for interaction
                              items:
                                type: object
                                properties:
                                  host:
                                    type: string
                                    description: dns name or ip address for Zookeeper
                                      node
                                  port:
                                    type: integer
                                    description: TCP port which used to connect to
                                      Zookeeper node
                                    minimum: 0
                                    maximum: 65535
                            session_timeout_ms:
                              type: integer
                              description: session timeout during connect to Zookeeper
                            operation_timeout_ms:
                              type: integer
                              description: one operation timeout during Zookeeper
                                transactions
                            root:
                              type: string
                              description: optional root znode path inside zookeeper
                                to store ClickHouse related data (replication queue
                                or distributed DDL)
                            identity:
                              type: string
                              description: optional access credentials string with
                                `user:password` format used when use digest authorization
                                in Zookeeper
                        settings:
                          type: object
                          description: 'optional, allows configure `clickhouse-server`
                            settings inside <yandex>...</yandex> tag in each `Pod`
                            only in one cluster during generate `ConfigMap` which
                            will mount in `/etc/clickhouse-server/config.d/`

                            override top-level `chi.spec.configuration.settings`

                            More details: https://clickhouse.tech/docs/en/operations/settings/settings/

                            '
                          x-kubernetes-preserve-unknown-fields: true
                        files:
                          type: object
                          description: 'optional, allows define content of any setting
                            file inside each `Pod` on current cluster during generate
                            `ConfigMap` which will mount in `/etc/clickhouse-server/config.d/`
                            or `/etc/clickhouse-server/conf.d/` or `/etc/clickhouse-server/users.d/`

                            override top-level `chi.spec.configuration.files`

                            '
                          x-kubernetes-preserve-unknown-fields: true
                        templates:
                          type: object
                          description: 'optional, configuration of the templates names
                            which will use for generate Kubernetes resources according
                            to selected cluster

                            override top-level `chi.spec.configuration.templates`

                            '
                          properties:
                            hostTemplate:
                              type: string
                              description: optional, template name from chi.spec.templates.hostTemplates,
                                which will apply to configure each `clickhouse-server`
                                instance during render ConfigMap resources which will
                                mount into `Pod` only for one cluster
                            podTemplate:
                              type: string
                              description: optional, template name from chi.spec.templates.podTemplates,
                                allows customization each `Pod` resource during render
                                and reconcile each StatefulSet.spec resource described
                                in `chi.spec.configuration.clusters` only for one
                                cluster
                            dataVolumeClaimTemplate:
                              type: string
                              description: optional, template name from chi.spec.templates.volumeClaimTemplates,
                                allows customization each `PVC` which will mount for
                                clickhouse data directory in each `Pod` during render
                                and reconcile every StatefulSet.spec resource described
                                in `chi.spec.configuration.clusters` only for one
                                cluster
                            logVolumeClaimTemplate:
                              type: string
                              description: optional, template name from chi.spec.templates.volumeClaimTemplates,
                                allows customization each `PVC` which will mount for
                                clickhouse log directory in each `Pod` during render
                                and reconcile every StatefulSet.spec resource described
                                in `chi.spec.configuration.clusters` only for one
                                cluster
                            serviceTemplate:
                              type: string
                              description: optional, fully ignores for cluster-level
                            clusterServiceTemplate:
                              type: string
                              description: optional, template name from chi.spec.templates.serviceTemplates,
                                allows customization for each `Service` resource which
                                will created by `clickhouse-operator` which cover
                                each clickhouse cluster described in `chi.spec.configuration.clusters`
                                only for one cluster
                            shardServiceTemplate:
                              type: string
                              description: optional, template name from chi.spec.templates.serviceTemplates,
                                allows customization for each `Service` resource which
                                will created by `clickhouse-operator` which cover
                                each shard inside clickhouse cluster described in
                                `chi.spec.configuration.clusters` only for one cluster
                            replicaServiceTemplate:
                              type: string
                              description: optional, template name from chi.spec.templates.serviceTemplates,
                                allows customization for each `Service` resource which
                                will created by `clickhouse-operator` which cover
                                each replica inside each shard inside each clickhouse
                                cluster described in `chi.spec.configuration.clusters`
                                only for one cluster
                            volumeClaimTemplate:
                              type: string
                              description: DEPRECATED! VolumeClaimTemplate is deprecated
                                in favor of DataVolumeClaimTemplate and LogVolumeClaimTemplate
                        layout:
                          type: object
                          description: 'describe current cluster layout, how much
                            shards in cluster, how much replica in shard

                            allows override settings on each shard and replica separatelly

                            '
                          properties:
                            type:
                              type: string
                              description: DEPRECATED - to be removed soon
                            shardsCount:
                              type: integer
                              description: how much shards for current ClickHouse
                                cluster will run in Kubernetes, each shard contains
                                shared-nothing part of data and contains set of replicas,
                                cluster contains 1 shard by default
                            replicasCount:
                              type: integer
                              description: how much replicas in each shards for current
                                ClickHouse cluster will run in Kubernetes, each replica
                                is a separate `StatefulSet` which contains only one
                                `Pod` with `clickhouse-server` instance, every shard
                                contains 1 replica by default
                            shards:
                              type: array
                              description: optional, allows override top-level `chi.spec.configuration`,
                                cluster-level `chi.spec.configuration.clusters` settings
                                for each shard separately, use it only if you fully
                                understand what you do
                              items:
                                type: object
                                properties:
                                  name:
