apiVersion: v1
kind: ConfigMap
metadata:
  name: posthog-posthog-redis-health
  namespace: adhar-system
  labels:
    app.kubernetes.io/name: posthog-redis
    helm.sh/chart: redis-16.8.9
    app.kubernetes.io/instance: posthog
    app.kubernetes.io/managed-by: Helm
data:
  ping_readiness_local.sh: "#!/bin/bash\n\n[[ -f $REDIS_PASSWORD_FILE ]] && export\
    \ REDIS_PASSWORD=\"$(< \"${REDIS_PASSWORD_FILE}\")\"\n[[ -n \"$REDIS_PASSWORD\"\
    \ ]] && export REDISCLI_AUTH=\"$REDIS_PASSWORD\"\nresponse=$(\n  timeout -s 3\
    \ $1 \\\n  redis-cli \\\n    -h localhost \\\n    -p $REDIS_PORT \\\n    ping\n\
    )\nif [ \"$?\" -eq \"124\" ]; then\n  echo \"Timed out\"\n  exit 1\nfi\nif [ \"\
    $response\" != \"PONG\" ]; then\n  echo \"$response\"\n  exit 1\nfi"
  ping_liveness_local.sh: "#!/bin/bash\n\n[[ -f $REDIS_PASSWORD_FILE ]] && export\
    \ REDIS_PASSWORD=\"$(< \"${REDIS_PASSWORD_FILE}\")\"\n[[ -n \"$REDIS_PASSWORD\"\
    \ ]] && export REDISCLI_AUTH=\"$REDIS_PASSWORD\"\nresponse=$(\n  timeout -s 3\
    \ $1 \\\n  redis-cli \\\n    -h localhost \\\n    -p $REDIS_PORT \\\n    ping\n\
    )\nif [ \"$?\" -eq \"124\" ]; then\n  echo \"Timed out\"\n  exit 1\nfi\nresponseFirstWord=$(echo\
    \ $response | head -n1 | awk '{print $1;}')\nif [ \"$response\" != \"PONG\" ]\
    \ && [ \"$responseFirstWord\" != \"LOADING\" ] && [ \"$responseFirstWord\" !=\
    \ \"MASTERDOWN\" ]; then\n  echo \"$response\"\n  exit 1\nfi"
  ping_readiness_master.sh: "#!/bin/bash\n\n[[ -f $REDIS_MASTER_PASSWORD_FILE ]] &&\
    \ export REDIS_MASTER_PASSWORD=\"$(< \"${REDIS_MASTER_PASSWORD_FILE}\")\"\n[[\
    \ -n \"$REDIS_MASTER_PASSWORD\" ]] && export REDISCLI_AUTH=\"$REDIS_MASTER_PASSWORD\"\
    \nresponse=$(\n  timeout -s 3 $1 \\\n  redis-cli \\\n    -h $REDIS_MASTER_HOST\
    \ \\\n    -p $REDIS_MASTER_PORT_NUMBER \\\n    ping\n)\nif [ \"$?\" -eq \"124\"\
    \ ]; then\n  echo \"Timed out\"\n  exit 1\nfi\nif [ \"$response\" != \"PONG\"\
    \ ]; then\n  echo \"$response\"\n  exit 1\nfi"
  ping_liveness_master.sh: "#!/bin/bash\n\n[[ -f $REDIS_MASTER_PASSWORD_FILE ]] &&\
    \ export REDIS_MASTER_PASSWORD=\"$(< \"${REDIS_MASTER_PASSWORD_FILE}\")\"\n[[\
    \ -n \"$REDIS_MASTER_PASSWORD\" ]] && export REDISCLI_AUTH=\"$REDIS_MASTER_PASSWORD\"\
    \nresponse=$(\n  timeout -s 3 $1 \\\n  redis-cli \\\n    -h $REDIS_MASTER_HOST\
    \ \\\n    -p $REDIS_MASTER_PORT_NUMBER \\\n    ping\n)\nif [ \"$?\" -eq \"124\"\
    \ ]; then\n  echo \"Timed out\"\n  exit 1\nfi\nresponseFirstWord=$(echo $response\
    \ | head -n1 | awk '{print $1;}')\nif [ \"$response\" != \"PONG\" ] && [ \"$responseFirstWord\"\
    \ != \"LOADING\" ]; then\n  echo \"$response\"\n  exit 1\nfi"
  ping_readiness_local_and_master.sh: 'script_dir="$(dirname "$0")"

    exit_status=0

    "$script_dir/ping_readiness_local.sh" $1 || exit_status=$?

    "$script_dir/ping_readiness_master.sh" $1 || exit_status=$?

    exit $exit_status'
  ping_liveness_local_and_master.sh: 'script_dir="$(dirname "$0")"

    exit_status=0

    "$script_dir/ping_liveness_local.sh" $1 || exit_status=$?

    "$script_dir/ping_liveness_master.sh" $1 || exit_status=$?

    exit $exit_status'
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: posthog-posthog-redis-scripts
  namespace: adhar-system
  labels:
    app.kubernetes.io/name: posthog-redis
    helm.sh/chart: redis-16.8.9
    app.kubernetes.io/instance: posthog
    app.kubernetes.io/managed-by: Helm
data:
  start-master.sh: "#!/bin/bash\n\n[[ -f $REDIS_PASSWORD_FILE ]] && export REDIS_PASSWORD=\"\
    $(< \"${REDIS_PASSWORD_FILE}\")\"\nif [[ ! -f /opt/bitnami/redis/etc/master.conf\
    \ ]];then\n    cp /opt/bitnami/redis/mounted-etc/master.conf /opt/bitnami/redis/etc/master.conf\n\
    fi\nif [[ ! -f /opt/bitnami/redis/etc/redis.conf ]];then\n    cp /opt/bitnami/redis/mounted-etc/redis.conf\
    \ /opt/bitnami/redis/etc/redis.conf\nfi\nARGS=(\"--port\" \"${REDIS_PORT}\")\n\
    ARGS+=(\"--protected-mode\" \"no\")\nARGS+=(\"--include\" \"/opt/bitnami/redis/etc/redis.conf\"\
    )\nARGS+=(\"--include\" \"/opt/bitnami/redis/etc/master.conf\")\nARGS+=(\"--maxmemory\
    \ 400mb\")\nARGS+=(\"--maxmemory-policy allkeys-lru\")\nexec redis-server \"${ARGS[@]}\"\
    \n"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: etc-clickhouse-operator-files
  namespace: adhar-system
  labels:
    clickhouse.altinity.com/chop: 0.18.4
    app: clickhouse-operator
data:
  config.yaml: "# IMPORTANT\n# This file is auto-generated from deploy/builder/templates-config.\n\
    # It will be overwritten upon next sources build.\n#\n# Template parameters available:\n\
    #   watchNamespaces\n#   chUsername\n#   chPassword\n#   password_sha256_hex\n\
    \n################################################\n##\n## Watch Section\n##\n\
    ################################################\nwatch:\n  # List of namespaces\
    \ where clickhouse-operator watches for events.\n  # Concurrently running operators\
    \ should watch on different namespaces\n  #namespaces: [\"dev\", \"test\"]\n \
    \ namespaces: []\n\nclickhouse:\n  configuration:\n    ################################################\n\
    \    ##\n    ## Configuration Files Section\n    ##\n    ################################################\n\
    \    file:\n      path:\n        # Path to the folder where ClickHouse configuration\
    \ files common for all instances within a CHI are located.\n        common: config.d\n\
    \        # Path to the folder where ClickHouse configuration files unique for\
    \ each instance (host) within a CHI are located.\n        host: conf.d\n     \
    \   # Path to the folder where ClickHouse configuration files with users settings\
    \ are located.\n        # Files are common for all instances within a CHI.\n \
    \       user: users.d\n    ################################################\n\
    \    ##\n    ## Configuration Users Section\n    ##\n    ################################################\n\
    \    user:\n      default:\n        # Default values for ClickHouse user configuration\n\
    \        # 1. user/profile - string\n        # 2. user/quota - string\n      \
    \  # 3. user/networks/ip - multiple strings\n        # 4. user/password - string\n\
    \        profile: default\n        quota: default\n        networksIP:\n     \
    \     - \"::1\"\n          - \"127.0.0.1\"\n        password: \"default\"\n  \
    \  ################################################\n    ##\n    ## Configuration\
    \ Network Section\n    ##\n    ################################################\n\
    \    network:\n      # Default host_regexp to limit network connectivity from\
    \ outside\n      hostRegexpTemplate: \"(chi-{chi}-[^.]+\\\\d+-\\\\d+|clickhouse\\\
    \\-{chi})\\\\.{namespace}\\\\.svc\\\\.cluster\\\\.local$\"\n  ################################################\n\
    \  ##\n  ## Access to ClickHouse instances\n  ##\n  ################################################\n\
    \  access:\n    # ClickHouse credentials (username, password and port) to be used\
    \ by operator to connect to ClickHouse instances\n    # for:\n    # 1. Metrics\
    \ requests\n    # 2. Schema maintenance\n    # 3. DROP DNS CACHE\n    # User with\
    \ such credentials can be specified in additional ClickHouse .xml config files,\n\
    \    # located in `chUsersConfigsPath` folder\n    username: \"clickhouse_operator\"\
    \n    password: \"clickhouse_operator_password\"\n    secret:\n      # Location\
    \ of k8s Secret with username and password to be used by operator to connect to\
    \ ClickHouse instances\n      # Can be used instead of explicitly specified username\
    \ and password\n      namespace: \"\"\n      name: \"\"\n    # Port where to connect\
    \ to ClickHouse instances to\n    port: 8123\n\n################################################\n\
    ##\n## Templates Section\n##\n################################################\n\
    template:\n  chi:\n    # Path to the folder where ClickHouseInstallation .yaml\
    \ manifests are located.\n    # Manifests are applied in sorted alpha-numeric\
    \ order.\n    path: templates.d\n\n################################################\n\
    ##\n## Reconcile Section\n##\n################################################\n\
    reconcile:\n  runtime:\n    # Max number of concurrent reconciles in progress\n\
    \    threadsNumber: 10\n\n  statefulSet:\n    create:\n      # What to do in case\
    \ created StatefulSet is not in Ready after `statefulSetUpdateTimeout` seconds\n\
    \      # Possible options:\n      # 1. abort - do nothing, just break the process\
    \ and wait for admin\n      # 2. delete - delete newly created problematic StatefulSet\n\
    \      # 3. ignore - ignore error, pretend nothing happened and move on to the\
    \ next StatefulSet\n      onFailure: ignore\n\n    update:\n      # How many seconds\
    \ to wait for created/updated StatefulSet to be Ready\n      timeout: 300\n  \
    \    # How many seconds to wait between checks for created/updated StatefulSet\
    \ status\n      pollInterval: 5\n      # What to do in case updated StatefulSet\
    \ is not in Ready after `statefulSetUpdateTimeout` seconds\n      # Possible options:\n\
    \      # 1. abort - do nothing, just break the process and wait for admin\n  \
    \    # 2. rollback - delete Pod and rollback StatefulSet to previous Generation.\n\
    \      # Pod would be recreated by StatefulSet based on rollback-ed configuration\n\
    \      # 3. ignore - ignore error, pretend nothing happened and move on to the\
    \ next StatefulSet\n      onFailure: rollback\n\n  host:\n    # Whether reconciler\
    \ should wait for host:\n    # to be excluded from cluster OR\n    # to be included\
    \ into cluster\n    # respectfully\n    wait:\n      exclude: true\n      include:\
    \ false\n\n################################################\n##\n## Annotations\
    \ management\n##\n################################################\nannotation:\n\
    \  # Applied when:\n  #  1. Propagating annotations from the CHI's `metadata.annotations`\
    \ to child objects' `metadata.annotations`,\n  #  2. Propagating annotations from\
    \ the CHI Template's `metadata.annotations` to CHI's `metadata.annotations`,\n\
    \  # Include annotations from the following list:\n  # Applied only when not empty.\
    \ Empty list means \"include all, no selection\"\n  include: []\n  # Exclude annotations\
    \ from the following list:\n  exclude: []\n\n################################################\n\
    ##\n## Labels management\n##\n################################################\n\
    label:\n  # Applied when:\n  #  1. Propagating labels from the CHI's `metadata.labels`\
    \ to child objects' `metadata.labels`,\n  #  2. Propagating labels from the CHI\
    \ Template's `metadata.labels` to CHI's `metadata.labels`,\n  # Include labels\
    \ from the following list:\n  # Applied only when not empty. Empty list means\
    \ \"include all, no selection\"\n  include: []\n  # Exclude labels from the following\
    \ list:\n  exclude: []\n  # Whether to append *Scope* labels to StatefulSet and\
    \ Pod.\n  # Full list of available *scope* labels check in labeler.go\n  #  LabelShardScopeIndex\n\
    \  #  LabelReplicaScopeIndex\n  #  LabelCHIScopeIndex\n  #  LabelCHIScopeCycleSize\n\
    \  #  LabelCHIScopeCycleIndex\n  #  LabelCHIScopeCycleOffset\n  #  LabelClusterScopeIndex\n\
    \  #  LabelClusterScopeCycleSize\n  #  LabelClusterScopeCycleIndex\n  #  LabelClusterScopeCycleOffset\n\
    \  appendScope: \"no\"\n\n################################################\n##\n\
    ## StatefulSet management\n##\n################################################\n\
    statefulSet:\n  revisionHistoryLimit: 0\n\n################################################\n\
    ##\n## Pod management\n##\n################################################\n\
    pod:\n  # Grace period for Pod termination.\n  # How many seconds to wait between\
    \ sending\n  # SIGTERM and SIGKILL during Pod termination process.\n  # Increase\
    \ this number is case of slow shutdown.\n  terminationGracePeriod: 30\n\n################################################\n\
    ##\n## Log parameters\n##\n################################################\n\
    logger:\n  logtostderr: \"true\"\n  alsologtostderr: \"false\"\n  v: \"1\"\n \
    \ stderrthreshold: \"\"\n  vmodule: \"\"\n  log_backtrace_at: \"\"\n"
---
