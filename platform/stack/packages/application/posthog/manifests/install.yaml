                                            with name `interserver` for selected shard,
                                            override `chi.spec.templates.hostTemplates.spec.interserverHTTPPort`

                                            allows connect between replicas inside
                                            same shard during fetch replicated data
                                            parts HTTP protocol

                                            '
                                          minimum: 1
                                          maximum: 65535
                                        settings:
                                          type: object
                                          description: 'optional, allows configure
                                            `clickhouse-server` settings inside <yandex>...</yandex>
                                            tag in `Pod` only in one shard related
                                            to current replica during generate `ConfigMap`
                                            which will mount in `/etc/clickhouse-server/conf.d/`

                                            override top-level `chi.spec.configuration.settings`,
                                            cluster-level `chi.spec.configuration.clusters.settings`
                                            and replica-level `chi.spec.configuration.clusters.layout.replicas.settings`

                                            More details: https://clickhouse.tech/docs/en/operations/settings/settings/

                                            '
                                          x-kubernetes-preserve-unknown-fields: true
                                        files:
                                          type: object
                                          description: 'optional, allows define content
                                            of any setting file inside each `Pod`
                                            only in one shard related to current replica
                                            during generate `ConfigMap` which will
                                            mount in `/etc/clickhouse-server/config.d/`
                                            or `/etc/clickhouse-server/conf.d/` or
                                            `/etc/clickhouse-server/users.d/`

                                            override top-level `chi.spec.configuration.files`
                                            and cluster-level `chi.spec.configuration.clusters.files`,
                                            will ignore if `chi.spec.configuration.clusters.layout.shards`
                                            presents

                                            '
                                          x-kubernetes-preserve-unknown-fields: true
                                        templates:
                                          type: object
                                          description: 'optional, configuration of
                                            the templates names which will use for
                                            generate Kubernetes resources according
                                            to selected replica

                                            override top-level `chi.spec.configuration.templates`,
                                            cluster-level `chi.spec.configuration.clusters.templates`,
                                            replica-level `chi.spec.configuration.clusters.layout.replicas.templates`

                                            '
                                          properties:
                                            hostTemplate:
                                              type: string
                                              description: optional, template name
                                                from chi.spec.templates.hostTemplates,
                                                which will apply to configure each
                                                `clickhouse-server` instance during
                                                render ConfigMap resources which will
                                                mount into `Pod` only for one shard
                                            podTemplate:
                                              type: string
                                              description: optional, template name
                                                from chi.spec.templates.podTemplates,
                                                allows customization each `Pod` resource
                                                during render and reconcile each StatefulSet.spec
                                                resource described in `chi.spec.configuration.clusters`
                                                only for one shard
                                            dataVolumeClaimTemplate:
                                              type: string
                                              description: optional, template name
                                                from chi.spec.templates.volumeClaimTemplates,
                                                allows customization each `PVC` which
                                                will mount for clickhouse data directory
                                                in each `Pod` during render and reconcile
                                                every StatefulSet.spec resource described
                                                in `chi.spec.configuration.clusters`
                                                only for one shard
                                            logVolumeClaimTemplate:
                                              type: string
                                              description: optional, template name
                                                from chi.spec.templates.volumeClaimTemplates,
                                                allows customization each `PVC` which
                                                will mount for clickhouse log directory
                                                in each `Pod` during render and reconcile
                                                every StatefulSet.spec resource described
                                                in `chi.spec.configuration.clusters`
                                                only for one shard
                                            serviceTemplate:
                                              type: string
                                              description: optional, fully ignores
                                                for shard-level
                                            clusterServiceTemplate:
                                              type: string
                                              description: optional, fully ignores
                                                for shard-level
                                            shardServiceTemplate:
                                              type: string
                                              description: optional, template name
                                                from chi.spec.templates.serviceTemplates,
                                                allows customization for each `Service`
                                                resource which will created by `clickhouse-operator`
                                                which cover shard inside clickhouse
                                                cluster described in `chi.spec.configuration.clusters`
                                                only for one shard
                                            replicaServiceTemplate:
                                              type: string
                                              description: optional, template name
                                                from chi.spec.templates.serviceTemplates,
                                                allows customization for each `Service`
                                                resource which will created by `clickhouse-operator`
                                                which cover each replica inside each
                                                shard inside clickhouse cluster described
                                                in `chi.spec.configuration.clusters`
                                                only for one shard
                                            volumeClaimTemplate:
                                              type: string
                                              description: DEPRECATED! VolumeClaimTemplate
                                                is deprecated in favor of DataVolumeClaimTemplate
                                                and LogVolumeClaimTemplate
              templates:
                type: object
                description: allows define templates which will use for render Kubernetes
                  resources like StatefulSet, ConfigMap, Service, PVC, by default,
                  clickhouse-operator have own templates, but you can override it
                properties:
                  hostTemplates:
                    type: array
                    description: hostTemplate will use during apply to generate `clickhose-server`
                      config files
                    items:
                      type: object
                      properties:
                        name:
                          description: template name, could use to link inside top-level
                            `chi.spec.defaults.templates.hostTemplate`, cluster-level
                            `chi.spec.configuration.clusters.templates.hostTemplate`,
                            shard-level `chi.spec.configuration.clusters.layout.shards.temlates.hostTemplate`,
                            replica-level `chi.spec.configuration.clusters.layout.replicas.templates.hostTemplate`
                          type: string
                        portDistribution:
                          type: array
                          description: define how will distribute numeric values of
                            named ports in `Pod.spec.containers.ports` and clickhouse-server
                            configs
                          items:
                            type: object
                            properties:
                              type:
                                type: string
                                description: type of distribution, when `Unspecified`
                                  (default value) then all listen ports on clickhouse-server
                                  configuration in all Pods will have the same value,
                                  when `ClusterScopeIndex` then ports will increment
                                  to offset from base value depends on shard and replica
                                  index inside cluster with combination of `chi.spec.templates.podTemlates.spec.HostNetwork`
                                  it allows setup ClickHouse cluster inside Kubernetes
                                  and provide access via external network bypass Kubernetes
                                  internal network
                                enum:
                                - ''
                                - Unspecified
                                - ClusterScopeIndex
                        spec:
                          type: object
                          properties:
                            name:
                              type: string
                              description: by default, hostname will generate, but
                                this allows define custom name for each `clickhuse-server`
                              minLength: 1
                              maxLength: 15
                              pattern: ^[a-zA-Z0-9-]{0,15}$
                            tcpPort:
                              type: integer
                              description: 'optional, setup `tcp_port` inside `clickhouse-server`
                                settings for each Pod where current template will
                                apply

                                if specified, should have equal value with `chi.spec.templates.podTemplates.spec.containers.ports[name=tcp]`

                                More info: https://clickhouse.tech/docs/en/interfaces/tcp/

                                '
                              minimum: 1
                              maximum: 65535
                            httpPort:
                              type: integer
                              description: 'optional, setup `http_port` inside `clickhouse-server`
                                settings for each Pod where current template will
                                apply

                                if specified, should have equal value with `chi.spec.templates.podTemplates.spec.containers.ports[name=http]`

                                More info: https://clickhouse.tech/docs/en/interfaces/http/

                                '
                              minimum: 1
                              maximum: 65535
                            interserverHTTPPort:
                              type: integer
                              description: 'optional, setup `interserver_http_port`
                                inside `clickhouse-server` settings for each Pod where
                                current template will apply

                                if specified, should have equal value with `chi.spec.templates.podTemplates.spec.containers.ports[name=interserver]`

                                More info: https://clickhouse.tech/docs/en/operations/server-configuration-parameters/settings/#interserver-http-port

                                '
                              minimum: 1
                              maximum: 65535
                            settings:
                              type: object
                              description: 'optional, allows configure `clickhouse-server`
                                settings inside <yandex>...</yandex> tag in each `Pod`
                                where this template will apply during generate `ConfigMap`
                                which will mount in `/etc/clickhouse-server/conf.d/`

                                More details: https://clickhouse.tech/docs/en/operations/settings/settings/

                                '
                              x-kubernetes-preserve-unknown-fields: true
                            files:
                              type: object
                              description: 'optional, allows define content of any
                                setting file inside each `Pod` where this template
                                will apply during generate `ConfigMap` which will
                                mount in `/etc/clickhouse-server/config.d/` or `/etc/clickhouse-server/conf.d/`
                                or `/etc/clickhouse-server/users.d/`

                                '
                              x-kubernetes-preserve-unknown-fields: true
                            templates:
                              type: object
                              description: be carefull, this part of CRD allows override
                                template inside template, don't use it if you don't
                                understand what you do
                              properties:
                                hostTemplate:
                                  type: string
                                podTemplate:
                                  type: string
                                dataVolumeClaimTemplate:
                                  type: string
                                logVolumeClaimTemplate:
                                  type: string
                                serviceTemplate:
                                  type: string
                                clusterServiceTemplate:
                                  type: string
                                shardServiceTemplate:
                                  type: string
                                replicaServiceTemplate:
                                  type: string
                  podTemplates:
                    type: array
                    description: 'podTemplate will use during render `Pod` inside
                      `StatefulSet.spec` and allows define rendered `Pod.spec`, pod
                      scheduling distribution and pod zone

                      More information: https://github.com/Altinity/clickhouse-operator/blob/master/docs/custom_resource_explained.md#spectemplatespodtemplates

                      '
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          description: template name, could use to link inside top-level
                            `chi.spec.defaults.templates.podTemplate`, cluster-level
                            `chi.spec.configuration.clusters.templates.podTemplate`,
                            shard-level `chi.spec.configuration.clusters.layout.shards.temlates.podTemplate`,
                            replica-level `chi.spec.configuration.clusters.layout.replicas.templates.podTemplate`
                        generateName:
                          type: string
                          description: allows define format for generated `Pod` name,
                            look to https://github.com/Altinity/clickhouse-operator/blob/master/docs/custom_resource_explained.md#spectemplatesservicetemplates
                            for details about aviailable template variables
                        zone:
                          type: object
                          description: allows define custom zone name and will separate
                            ClickHouse `Pods` between nodes, shortcut for `chi.spec.templates.podTemplates.spec.affinity.podAntiAffinity`
                          properties:
                            key:
                              type: string
                              description: optional, if defined, allows select kubernetes
                                nodes by label with `name` equal `key`
                            values:
                              type: array
                              description: optional, if defined, allows select kubernetes
                                nodes by label with `value` in `values`
                              items:
                                type: string
                        distribution:
                          type: string
                          description: DEPRECATED, shortcut for `chi.spec.templates.podTemplates.spec.affinity.podAntiAffinity`
                          enum:
                          - ''
                          - Unspecified
                          - OnePerHost
                        podDistribution:
                          type: array
                          description: define ClickHouse Pod distibution policy between
                            Kubernetes Nodes inside Shard, Replica, Namespace, CHI,
                            another ClickHouse cluster
                          items:
                            type: object
                            properties:
                              type:
                                type: string
                                description: you can define multiple affinity policy
                                  types
                                enum:
                                - ''
                                - Unspecified
                                - ClickHouseAntiAffinity
                                - ShardAntiAffinity
                                - ReplicaAntiAffinity
                                - AnotherNamespaceAntiAffinity
                                - AnotherClickHouseInstallationAntiAffinity
                                - AnotherClusterAntiAffinity
                                - MaxNumberPerNode
                                - NamespaceAffinity
                                - ClickHouseInstallationAffinity
                                - ClusterAffinity
                                - ShardAffinity
                                - ReplicaAffinity
                                - PreviousTailAffinity
                                - CircularReplication
                              scope:
                                type: string
                                description: scope for apply each podDistribution
                                enum:
                                - ''
                                - Unspecified
                                - Shard
                                - Replica
                                - Cluster
                                - ClickHouseInstallation
                                - Namespace
                              number:
                                type: integer
                                description: define, how much ClickHouse Pods could
                                  be inside selected scope with selected distribution
                                  type
                                minimum: 0
                                maximum: 65535
                              topologyKey:
                                type: string
                                description: 'use for inter-pod affinity look to `pod.spec.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution.podAffinityTerm.topologyKey`,
                                  More info: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#inter-pod-affinity-and-anti-affinity'
                        spec:
                          type: object
                          description: allows define whole Pod.spec inside StaefulSet.spec,
                            look to https://kubernetes.io/docs/concepts/workloads/pods/#pod-templates
                            for details
                          x-kubernetes-preserve-unknown-fields: true
                        metadata:
                          type: object
                          description: 'allows pass standard object''s metadata from
                            template to Pod

                            More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#metadata

                            '
                          x-kubernetes-preserve-unknown-fields: true
                  volumeClaimTemplates:
                    type: array
                    description: allows define template for rendering `PVC` kubernetes
                      resource, which would use inside `Pod` for mount clickhouse
                      `data`, clickhouse `logs` or something else
                    items:
                      type: object
                      properties:
                        name:
                          description: 'template name, could use to link inside

                            top-level `chi.spec.defaults.templates.dataVolumeClaimTemplate`
                            or `chi.spec.defaults.templates.logVolumeClaimTemplate`,

                            cluster-level `chi.spec.configuration.clusters.templates.dataVolumeClaimTemplate`
                            or `chi.spec.configuration.clusters.templates.logVolumeClaimTemplate`,

                            shard-level `chi.spec.configuration.clusters.layout.shards.temlates.dataVolumeClaimTemplate`
                            or `chi.spec.configuration.clusters.layout.shards.temlates.logVolumeClaimTemplate`

                            replica-level `chi.spec.configuration.clusters.layout.replicas.templates.dataVolumeClaimTemplate`
                            or `chi.spec.configuration.clusters.layout.replicas.templates.logVolumeClaimTemplate`

                            '
                          type: string
                        reclaimPolicy:
                          type: string
                          description: define behavior of `PVC` deletion policy during
                            delete `Pod`, `Delete` by default, when `Retain` then
                            `PVC` still alive even `Pod` will deleted
                          enum:
                          - ''
                          - Retain
                          - Delete
                        metadata:
                          type: object
                          description: 'allows pass standard object''s metadata from
                            template to PVC

                            More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#metadata

                            '
                          x-kubernetes-preserve-unknown-fields: true
                        spec:
                          type: object
                          description: 'allows define all aspects of `PVC` resource

                            More info: https://kubernetes.io/docs/concepts/storage/persistent-volumes/#persistentvolumeclaims

                            '
                          x-kubernetes-preserve-unknown-fields: true
                  serviceTemplates:
                    type: array
                    description: 'allows define template for rendering `Service` which
                      would get endpoint from Pods which scoped chi-wide, cluster-wide,
                      shard-wide, replica-wide level

                      '
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          description: 'template name, could use to link inside

                            chi-level `chi.spec.defaults.templates.serviceTemplate`

                            cluster-level `chi.spec.configuration.clusters.templates.clusterServiceTemplate`

                            shard-level `chi.spec.configuration.clusters.layout.shards.temlates.shardServiceTemplate`

                            replica-level `chi.spec.configuration.clusters.layout.replicas.templates.replicaServiceTemplate`
                            or `chi.spec.configuration.clusters.layout.shards.replicas.replicaServiceTemplate`

                            '
                        generateName:
                          type: string
                          description: allows define format for generated `Service`
                            name, look to https://github.com/Altinity/clickhouse-operator/blob/master/docs/custom_resource_explained.md#spectemplatesservicetemplates
                            for details about aviailable template variables
                        metadata:
                          type: object
                          description: 'allows pass standard object''s metadata from
                            template to Service

                            Could be use for define specificly for Cloud Provider
                            metadata which impact to behavior of service

                            More info: https://kubernetes.io/docs/concepts/services-networking/service/

                            '
                          x-kubernetes-preserve-unknown-fields: true
                        spec:
                          type: object
                          description: 'describe behavior of generated Service

                            More info: https://kubernetes.io/docs/concepts/services-networking/service/

                            '
                          x-kubernetes-preserve-unknown-fields: true
              useTemplates:
                type: array
                description: list of `ClickHouseInstallationTemplate` (chit) resource
                  names which will merge with current `Chi` manifest during render
                  Kubernetes resources to create related ClickHouse clusters
                items:
                  type: object
                  properties:
                    name:
                      type: string
                      description: name of `ClickHouseInstallationTemplate` (chit)
                        resource
                    namespace:
                      type: string
                      description: Kubernetes namespace where need search `chit` resource,
                        depending on `watchNamespaces` settings in `clichouse-operator`
                    useType:
                      type: string
                      description: optional, current strategy is only merge, and current
                        `chi` settings have more priority than merged template `chit`
                      enum:
                      - ''
                      - merge
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: clickhouseoperatorconfigurations.clickhouse.altinity.com
  labels:
    clickhouse.altinity.com/chop: 0.18.4
spec:
  group: clickhouse.altinity.com
  scope: Namespaced
  names:
    kind: ClickHouseOperatorConfiguration
    singular: clickhouseoperatorconfiguration
    plural: clickhouseoperatorconfigurations
    shortNames:
    - chopconf
  versions:
  - name: v1
    served: true
    storage: true
    additionalPrinterColumns:
    - name: namespaces
      type: string
      description: Watch namespaces
      priority: 0
      jsonPath: .status
    - name: age
      type: date
      description: Age of the resource
      jsonPath: .metadata.creationTimestamp
    schema:
      openAPIV3Schema:
        type: object
        description: allows customize `clickhouse-operator` settings, need restart
          clickhouse-operator pod after adding, more details https://github.com/Altinity/clickhouse-operator/blob/master/docs/operator_configuration.md
        x-kubernetes-preserve-unknown-fields: true
        properties:
          status:
            type: object
            x-kubernetes-preserve-unknown-fields: true
          spec:
            type: object
            description: 'Allows to define settings of the clickhouse-operator.

              More info: https://github.com/Altinity/clickhouse-operator/blob/master/config/config.yaml

              Check into etc-clickhouse-operator* ConfigMaps if you need more control

              '
            x-kubernetes-preserve-unknown-fields: true
            properties:
              watch:
                type: object
                properties:
                  namespaces:
                    type: array
                    description: List of namespaces where clickhouse-operator watches
                      for events.
                    items:
                      type: string
              clickhouse:
                type: object
                properties:
                  configuration:
                    type: object
                    properties:
                      file:
                        type: object
                        properties:
                          path:
                            type: object
                            properties:
                              common:
                                type: string
                                description: Path to the folder where ClickHouse configuration
                                  files common for all instances within a CHI are
                                  located. Default - config.d
                              host:
                                type: string
                                description: Path to the folder where ClickHouse configuration
                                  files unique for each instance (host) within a CHI
                                  are located. Default - conf.d
                              user:
                                type: string
                                description: Path to the folder where ClickHouse configuration
                                  files with users settings are located. Files are
                                  common for all instances within a CHI.
                      user:
                        type: object
                        properties:
                          default:
                            type: object
                            properties:
                              profile:
                                type: string
                                description: ClickHouse server configuration `<profile>...</profile>`
                                  for any <user>
                              quota:
                                type: string
                                description: ClickHouse server configuration `<quota>...</quota>`
                                  for any <user>
                              networksIP:
                                type: array
                                description: ClickHouse server configuration `<networks><ip>...</ip></networks>`
                                  for any <user>
                                items:
                                  type: string
                              password:
                                type: string
                                description: ClickHouse server configuration `<password>...</password>`
                                  for any <user>
                      network:
                        type: object
                        properties:
                          hostRegexpTemplate:
                            type: string
                            description: ClickHouse server configuration `<host_regexp>...</host_regexp>`
                              for any <user>
                  access:
                    type: object
                    properties:
                      scheme:
                        type: string
                        description: The scheme to user for connecting to ClickHouse.
                          One of http or https
                      username:
                        type: string
                        description: ClickHouse username to be used by operator to
                          connect to ClickHouse instances, deprecated, use chCredentialsSecretName
                      password:
                        type: string
                        description: ClickHouse password to be used by operator to
                          connect to ClickHouse instances, deprecated, use chCredentialsSecretName
                      secret:
                        type: object
                        properties:
                          namespace:
                            type: string
                            description: Location of k8s Secret with username and
                              password to be used by operator to connect to ClickHouse
                              instances
                          name:
                            type: string
                            description: Name of k8s Secret with username and password
                              to be used by operator to connect to ClickHouse instances
                      port:
                        type: integer
                        minimum: 1
                        maximum: 65535
                        description: port to be used by operator to connect to ClickHouse
                          instances
              template:
                type: object
                properties:
                  chi:
                    type: object
                    properties:
                      path:
                        type: string
                        description: Path to folder where ClickHouseInstallationTemplate
                          .yaml manifests are located.
              reconcile:
                type: object
                properties:
                  runtime:
                    type: object
                    properties:
                      threadsNumber:
                        type: integer
                        minimum: 1
                        maximum: 65535
                        description: How many goroutines will be used to reconcile
                          in parallel, 10 by default
                  statefulSet:
                    type: object
                    properties:
                      create:
                        type: object
                        properties:
                          onFailure:
                            type: string
                            description: 'What to do in case created StatefulSet is
                              not in Ready after `statefulSetUpdateTimeout` seconds

                              Possible options:

                              1. abort - do nothing, just break the process and wait
                              for admin.

                              2. delete - delete newly created problematic StatefulSet.

                              3. ignore (default) - ignore error, pretend nothing
                              happened and move on to the next StatefulSet.

                              '
                      update:
                        type: object
                        properties:
                          timeout:
                            type: integer
                            description: How many seconds to wait for created/updated
                              StatefulSet to be Ready
                          pollInterval:
                            type: integer
                            description: How many seconds to wait between checks for
                              created/updated StatefulSet status
                          onFailure:
                            type: string
                            description: 'What to do in case updated StatefulSet is
                              not in Ready after `statefulSetUpdateTimeout` seconds

                              Possible options:

                              1. abort - do nothing, just break the process and wait
                              for admin.

                              2. rollback (default) - delete Pod and rollback StatefulSet
                              to previous Generation. Pod would be recreated by StatefulSet
                              based on rollback-ed configuration.

                              3. ignore - ignore error, pretend nothing happened and
                              move on to the next StatefulSet.

                              '
                  host:
                    type: object
                    properties:
                      wait:
                        type: object
                        properties:
                          exclude:
                            type: boolean
                          include:
                            type: boolean
              annotation:
                type: object
                properties:
                  include:
                    type: array
                    items:
                      type: string
                  exclude:
                    type: array
                    items:
                      type: string
              label:
                type: object
                properties:
                  include:
                    type: array
                    items:
                      type: string
                  exclude:
                    type: array
                    items:
                      type: string
                    description: 'When propagating labels from the chi''s `metadata.labels`
                      section to child objects'' `metadata.labels`,

                      exclude labels from the following list

                      '
                  appendScope:
                    type: string
                    description: 'Whether to append *Scope* labels to StatefulSet
                      and Pod

                      - "LabelShardScopeIndex"

                      - "LabelReplicaScopeIndex"

                      - "LabelCHIScopeIndex"

                      - "LabelCHIScopeCycleSize"

                      - "LabelCHIScopeCycleIndex"

                      - "LabelCHIScopeCycleOffset"

                      - "LabelClusterScopeIndex"

                      - "LabelClusterScopeCycleSize"

                      - "LabelClusterScopeCycleIndex"

                      - "LabelClusterScopeCycleOffset"

                      '
                    enum:
                    - ''
                    - '0'
                    - '1'
                    - 'False'
                    - 'false'
                    - 'True'
                    - 'true'
                    - 'No'
                    - 'no'
                    - 'Yes'
                    - 'yes'
                    - 'Off'
                    - 'off'
                    - 'On'
                    - 'on'
                    - Disable
                    - disable
                    - Enable
                    - enable
                    - Disabled
                    - disabled
                    - Enabled
                    - enabled
              statefulSet:
                type: object
                properties:
                  revisionHistoryLimit:
                    type: integer
              pod:
                type: object
                properties:
                  terminationGracePeriod:
                    type: integer
              logger:
                type: object
                properties:
                  logtostderr:
                    type: string
                    description: boolean, allows logs to stderr
                  alsologtostderr:
                    type: string
                    description: boolean allows logs to stderr and files both
                  v:
                    type: string
                    description: verbosity level of clickhouse-operator log, default
                      - 1 max - 9
                  stderrthreshold:
                    type: string
                  vmodule:
                    type: string
                    description: 'Comma-separated list of filename=N, where filename
                      (can be a pattern) must have no .go ext, and N is a V level.

                      Ex.: file*=2 sets the ''V'' to 2 in all files with names like
                      file*.

                      '
                  log_backtrace_at:
                    type: string
                    description: 'It can be set to a file and line number with a logging
                      line.

                      Ex.: file.go:123

                      Each time when this line is being executed, a stack trace will
                      be written to the Info log.

                      '
---
