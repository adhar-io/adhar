# PostHog's PostgreSQL, provisioned from the platform's CNPG operator.
#
# Platform rule: applications consume platform capabilities, never bundle
# their own. The chart's bundled Bitnami PostgreSQL is 11.7 — PostHog's
# migrations refuse anything below 14 ("PostgreSQL 14 or later is required") —
# so the bundled StatefulSet can never work; CNPG runs a supported major and
# backs it up to the platform MinIO like every other platform database.
#
# Sync waves: -6 credentials, -5 the CNPG Cluster (ServerSideApply: CNPG's
# defaulting webhook fights a client-side apply), 0 the chart.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: posthog-db
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "-6"}
spec:
  length: 28
  digits: 5
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: posthog-db-credentials
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "-6"}
spec:
  refreshInterval: '0'
  target:
    name: posthog-db-credentials
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          adhar.io/cli-secret: 'true'
          adhar.io/package-name: posthog
      engineVersion: v2
      data:
        username: posthog
        password: '{{ .PASSWORD }}'
        # the chart reads its external-PostgreSQL password from this key
        postgresql-password: '{{ .PASSWORD }}'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: posthog-db
      rewrite:
        - transform:
            template: 'PASSWORD'
---
# The database, asked for rather than built.
#
# This was a CloudNativePG `Cluster` plus a `ScheduledBackup` declared here,
# with the same barman stanza every other platform database also carried. It is
# now a `Database`, and the control plane composes exactly those objects
# (compositions/database/local-cnpg.yaml) — verified by rendering this request
# and diffing it against the Cluster it replaces, field for field.
#
# The credential is unchanged: the ExternalSecret in this package still mints it,
# and `credentialsSecret` hands it to CNPG as the bootstrap owner secret.
apiVersion: platform.adhar.io/v1alpha1
kind: Database
metadata:
  name: posthog-db
  namespace: adhar-system
  labels:
    app.kubernetes.io/name: posthog-db
    adhar.io/component: posthog
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  parameters:
    databaseName: posthog
    credentials:
      masterUsername: posthog
    credentialsSecret: posthog-db-credentials
    storageSize: 20Gi
    component: posthog
    additionalDatabases:
      - {name: posthog_persons, owner: posthog}
    backupSchedule: 0 30 1 * * *
