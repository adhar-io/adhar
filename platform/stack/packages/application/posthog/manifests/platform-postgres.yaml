# PostHog's PostgreSQL, provisioned from the platform's CNPG operator.
#
# Platform rule: applications consume platform capabilities, never bundle
# their own. The chart's bundled Bitnami PostgreSQL is 11.7 — PostHog's
# migrations refuse anything below 14 ("PostgreSQL 14 or later is required") —
# so the bundled StatefulSet can never work; CNPG runs a supported major and
# backs it up to the platform MinIO like every other platform database.
#
# Sync waves: -6 credentials, -5 the CNPG Cluster (ServerSideApply: CNPG's
# defaulting webhook fights a client-side apply), 0 the chart.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: posthog-db
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "-6"}
spec:
  length: 28
  digits: 5
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: posthog-db-credentials
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "-6"}
spec:
  refreshInterval: '0'
  target:
    name: posthog-db-credentials
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          adhar.io/cli-secret: 'true'
          adhar.io/package-name: posthog
      engineVersion: v2
      data:
        username: posthog
        password: '{{ .PASSWORD }}'
        # the chart reads its external-PostgreSQL password from this key
        postgresql-password: '{{ .PASSWORD }}'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: posthog-db
      rewrite:
        - transform:
            template: 'PASSWORD'
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: posthog-db
  namespace: adhar-system
  labels:
    app.kubernetes.io/name: posthog-db
    adhar.io/component: posthog
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
    argocd.argoproj.io/sync-options: ServerSideApply=true,SkipDryRunOnMissingResource=true
spec:
  instances: 1
  # Expose the instance exporter to kube-prometheus: CNPG creates a PodMonitor
  # (skipped gracefully while the monitoring CRDs are absent) so the Platform and
  # CloudNativePG dashboards show this cluster. Without it no cnpg_* series exist.
  monitoring:
    enablePodMonitor: true
  storage:
    size: 20Gi
  enableSuperuserAccess: false
  bootstrap:
    initdb:
      database: posthog
      owner: posthog
      secret:
        name: posthog-db-credentials
  backup:
    retentionPolicy: 7d  # a week of PITR; 30d of WAL for every platform DB filled the shared MinIO
    barmanObjectStore:
      destinationPath: s3://adhar-backups/cnpg/posthog-db
      endpointURL: http://minio.adhar-system.svc.cluster.local:9000
      s3Credentials:
        accessKeyId:
          name: root-creds
          key: rootUser
        secretAccessKey:
          name: root-creds
          key: rootPassword
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: posthog-db-daily
  namespace: adhar-system
  labels:
    app.kubernetes.io/name: posthog-db
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  schedule: "0 30 1 * * *"
  backupOwnerReference: self
  cluster:
    name: posthog-db
---
# PostHog split its person tables into a SEPARATE database. posthog/persons_db.py
# reads PERSONS_DB_WRITER_URL and, with nothing set, falls back to host "db" --
# which is why `apply_persons_migrations` failed the whole migrate Job with
#   psycopg.OperationalError: [Errno -2] Name or service not known
# The chart has no value for it, so the database is declared here and the URL is
# injected through values.yaml `env`. The name `posthog_persons` is the one the
# application expects.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: posthog-persons-db
  namespace: adhar-system
  labels:
    app.kubernetes.io/name: posthog-db
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  name: posthog_persons
  owner: posthog
  cluster:
    name: posthog-db
