# ClickHouse creates its system log tables lazily, on the first flush. PostHog's
# ClickHouse migration queries system.crash_log directly, and that table only
# ever receives data when the server CRASHES -- so on a fresh cluster it does not
# exist and the migration dies with
#   Unknown table expression identifier 'system.crash_log'
#
# This Job forces the table into existence, at SYNC-WAVE 1.
#
# It used to be a PostSync hook, and that could never work: PostSync runs only
# after the sync SUCCEEDS, and the sync fails *because* this table is missing --
# migrate exhausts its backoffLimit, posthog-web and posthog-worker then time out
# on an unmigrated database, and the sync is marked failed. The repair was gated
# on the very thing it repairs, so PostHog stayed Degraded on every cluster and
# this Job never ran once.
#
# PreSync is not the answer either: on a fresh install ClickHouse does not exist
# yet, so the wait loop below would block the sync forever waiting for a server
# the same sync has not created.
#
# Ordinary resource + wave ordering is what actually sequences this, and the
# generator now pins the other two ends of the chain (posthog/generate-manifests.sh):
#
#   wave 0  ClickHouseInstallation
#   wave 1  this Job -- waits for the server, then materialises the log tables
#   wave 2  the chart's posthog-migrate Job
#
# The migrate-repair step below is kept as a safety net for clusters already
# wedged in the old state (a failed migrate Job from before this ordering
# existed); with correct ordering there is nothing for it to find.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: posthog-clickhouse-prepare
  namespace: adhar-system
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: posthog-clickhouse-prepare
  namespace: adhar-system
  annotations:
    argocd.argoproj.io/sync-wave: "0"
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: posthog-clickhouse-prepare
  namespace: adhar-system
  annotations:
    argocd.argoproj.io/sync-wave: "0"
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: posthog-clickhouse-prepare}
subjects: [{kind: ServiceAccount, name: posthog-clickhouse-prepare, namespace: adhar-system}]
---
apiVersion: batch/v1
kind: Job
metadata:
  name: posthog-clickhouse-prepare
  namespace: adhar-system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    # A Job's selector and pod template are immutable, so a later edit to this
    # file would otherwise fail the sync with a patch error rather than re-running.
    argocd.argoproj.io/sync-options: Replace=true
spec:
  backoffLimit: 20
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      serviceAccountName: posthog-clickhouse-prepare
      restartPolicy: OnFailure
      # Two steps, two toolchains: the ClickHouse image has clickhouse-client but
      # no kubectl, and the kubectl image has no clickhouse-client.
      initContainers:
        - name: flush-system-logs
          image: clickhouse/clickhouse-server:26.6.2.158
          command:
            - /bin/sh
            - -ec
            - |
              until clickhouse-client --host clickhouse-posthog --user admin --password "$CLICKHOUSE_PASSWORD" -q "SELECT 1" >/dev/null 2>&1; do
                echo "waiting for clickhouse-posthog"; sleep 5
              done
              # A bare "SYSTEM FLUSH LOGS" only touches tables that already have
              # buffered rows, so it never creates system.crash_log -- that table
              # only ever receives data when the server crashes. Naming the table
              # explicitly makes ClickHouse materialise it with its own canonical
              # schema, which is what PostHog's migration needs. Verified on
              # ClickHouse 26.6.2.158, where the generic form left the table absent
              # and the migration failed with
              #   Unknown table expression identifier 'system.crash_log'
              clickhouse-client --host clickhouse-posthog --user admin --password "$CLICKHOUSE_PASSWORD" -q "SYSTEM FLUSH LOGS"
              for tbl in crash_log session_log query_thread_log part_log trace_log; do
                clickhouse-client --host clickhouse-posthog --user admin --password "$CLICKHOUSE_PASSWORD" \
                  -q "SYSTEM FLUSH LOGS $tbl" || echo "  $tbl not configured on this server; skipping"
              done
              clickhouse-client --host clickhouse-posthog --user admin --password "$CLICKHOUSE_PASSWORD" \
                -q "SELECT name FROM system.tables WHERE database='system' AND name IN ('crash_log','session_log','query_thread_log')"
          env:
            - name: CLICKHOUSE_PASSWORD
              value: "a1f31e03-c88e-4ca6-a2df-ad49183d15d9"
          securityContext:
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
      containers:
        - name: repair-migration
          image: alpine/k8s:1.31.1
          command:
            - /bin/sh
            - -ec
            - |
              # Repair the ordering. The chart's migrate Job runs in the SAME sync
              # as ClickHouse itself, so on a fresh cluster it starts before this
              # hook and fails against a server with no system.crash_log. Once it
              # exhausts its backoffLimit it never retries on its own, and PostHog
              # stays Degraded until somebody deletes the Job by hand.
              #
              # Deleting a FAILED migrate Job makes ArgoCD recreate it on the next
              # sync, now against a ClickHouse that has the table. A Job that is
              # running, or already succeeded, is left strictly alone.
              found=0
              for j in $(kubectl -n "$NS" get jobs -o name 2>/dev/null | grep 'job.batch/posthog-migrate' || true); do
                found=1
                succeeded=$(kubectl -n "$NS" get "$j" -o jsonpath='{.status.succeeded}' 2>/dev/null)
                failed=$(kubectl -n "$NS" get "$j" -o jsonpath='{.status.failed}' 2>/dev/null)
                if [ -n "$succeeded" ] && [ "$succeeded" != "0" ]; then
                  echo "$j already succeeded; leaving it"
                  continue
                fi
                if [ -n "$failed" ] && [ "$failed" -ge 1 ] 2>/dev/null; then
                  echo "$j has $failed failed pod(s); deleting so ArgoCD recreates it"
                  kubectl -n "$NS" delete "$j" --wait=false || true
                else
                  echo "$j is still running; leaving it"
                fi
              done
              [ "$found" = "0" ] && echo "no posthog-migrate Job present yet; nothing to repair"
              echo "clickhouse prepare done"
          env:
            - name: NS
              value: adhar-system
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
