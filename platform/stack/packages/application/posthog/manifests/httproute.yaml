# PostHog routed through the Cilium Gateway (adhar-gateway). TLS terminates at the
# Gateway (adhar-cert), replacing the chart's Ingress + bundled ingress-nginx
# (both disabled in values.yaml). Requests to /posthog are forwarded to the
# posthog-web service on port 8000.
# NOTE: PostHog serves its app at the root path and does not natively support a
# URL sub-path; for a clean production setup give it a dedicated hostname instead
# of the /posthog prefix.
#
# SSO: every backend below is the Keycloak oauth2-proxy from sso.yaml, which
# forwards to the original upstream(s): posthog-web:8000.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: posthog
  namespace: adhar-system
  annotations:
    # After the oauth2-proxy (sso.yaml, wave 5): ArgoCD holds a wave until its
    # resources are healthy, and a route whose backend Service does not exist
    # yet is Degraded (ResolvedRefs=False) — at an earlier wave that deadlocks
    # the sync on a fresh cluster and the proxy is never created.
    argocd.argoproj.io/sync-wave: "6"
  labels:
    app.kubernetes.io/name: posthog
    app.kubernetes.io/instance: posthog
    app.kubernetes.io/part-of: posthog
spec:
  parentRefs:
    - name: adhar-gateway
      namespace: adhar-system
  hostnames:
    - posthog.adhar.localtest.me
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: posthog-oauth2-proxy
          port: 4180
