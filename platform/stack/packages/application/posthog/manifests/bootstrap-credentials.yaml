# Credentials PostHog is bootstrapped with — minted in-cluster, never in git.
#
# PostHog has no declarative first-run: a fresh instance shows a sign-up page
# and nothing can read its API until a person creates an organisation, a
# project and a personal API key by hand. That is what left the Console's
# analytics panel reading "PostHog backend responded but isn't ready" — there
# was no project and no key for it to use. bootstrap-job.yaml (generated by
# generate-manifests.sh so it carries the exact env of the posthog-web pods)
# creates the organisation `Adhar`, the project `Adhar Platform`, an owner
# account and a personal API key from THIS Secret, idempotently, on every sync.
#
# Three consumers read it by reference: the bootstrap Job (all three keys), the
# Console (`POSTHOG_TOKEN` ← api-key, core/adhar-console), and whoever needs to
# sign in to PostHog itself (`adhar get secrets -p posthog`).
#
# CreatedOnce: a rotated key here would only take effect after the next sync
# re-ran the Job, and the Console would hold the old one until it restarted.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: posthog-admin-password
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "-2"}
spec:
  length: 32
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: posthog-console-api-key
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "-2"}
spec:
  # PostHog personal API keys are `phx_` + 32 url-safe characters; the template
  # below adds the prefix the server's key parser looks for.
  length: 32
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: posthog-console-credentials
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "-2"}
spec:
  refreshPolicy: CreatedOnce
  refreshInterval: 30s
  target:
    name: posthog-console-credentials
    template:
      engineVersion: v2
      data:
        # The platform host convention; the controller rewrites it to the real
        # domain when the stack is seeded, like every other seeded address.
        admin-email: "admin@adhar.localtest.me"
        admin-password: "{{ .password }}"
        api-key: "phx_{{ .apikey }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: posthog-admin-password
      rewrite:
        - transform: {template: "password"}
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: posthog-console-api-key
      rewrite:
        - transform: {template: "apikey"}
