# PostHog values for Adhar (charts-clickhouse). The chart's Ingress (and bundled
# ingress-nginx) is disabled -- routing is handled by the Cilium Gateway API
# (adhar-gateway) via manifests/httproute.yaml. PostHog is served at the root path
# on adhar.localtest.me (it does not support a sub-path), so the HTTPRoute matches
# a dedicated path and PostHog should ideally have its own hostname in production.
cloud: "local"

ingress:
  enabled: false
  nginx:
    enabled: false

# Bundled ingress-nginx subchart -- keep it off, the Cilium Gateway handles L7.
ingress-nginx:
  enabled: false

# Bitnami pruned the "-debian-10-rNN" builds that this chart's bundled
# subcharts pin (kafka 2.8.1-debian-10-r99, zookeeper 3.7.0-debian-10-r70,
# postgresql 11.7.0-debian-10-r9, redis 6.2.7-debian-10-r0), so every one of
# those pods failed with ImagePullBackOff / manifest unknown. The same
# SOFTWARE VERSIONS are still published in the bitnamilegacy repository under
# plain version tags, so pin those: identical versions (the subchart's
# configuration stays valid), tags that actually exist.
pgbouncer:
  image:
    repository: bitnamilegacy/pgbouncer
    tag: 1.18.0
redis:
  image:
    repository: bitnamilegacy/redis
    tag: 6.2.7

# Use the platform's shared Strimzi Kafka (KRaft, no ZooKeeper) instead of the
# chart's bundled Kafka 2.8.1 + ZooKeeper ensemble, whose Bitnami images
# upstream deleted. One Kafka for the whole platform, on a supported version.
kafka:
  enabled: false
zookeeper:
  enabled: false
externalKafka:
  brokers:
    - adhar-kafka-kafka-bootstrap.adhar-system.svc.cluster.local:9092
  tls: false

# Point ClickHouse at the platform's ClickHouse Keeper (manifests/
# clickhouse-keeper.yaml) rather than the chart's Bitnami ZooKeeper ensemble.
# Keeper speaks the same protocol on the same port, so this is a drop-in.
clickhouse:
  # Kafka-engine tables reference named collections (settings below), and
  # ClickHouse only lets a user reference one it has been granted:
  # "Not enough privileges ... grant NAMED COLLECTION ON msk_cluster". The chart
  # defines the admin user in users.xml, where grants cannot be issued by SQL,
  # so give it named-collection control there.
  additionalUsersConfig:
    admin/named_collection_control: "1"
    admin/access_management: "1"
  # posthog/posthog:latest tracks PostHog master, whose ClickHouse migrations
  # need the ClickHouse release master runs (docker-compose.base.yml); the
  # chart's 23.9 default is years behind it. Keep this tag in step with
  # upstream's CLICKHOUSE_SERVER_IMAGE when bumping the app image.
  image:
    tag: "26.6.2.158"
  # PostHog's migrations read two ClickHouse macros the chart never defines
  # ("No macro hostClusterType in config"); the operator writes settings as
  # config.d XML paths, so these land in <macros>.
  settings:
    macros/hostClusterType: online
    macros/hostClusterRole: coordinator
    # Kafka-engine tables are declared as `ENGINE = Kafka(<named collection>, …)`
    # (posthog/clickhouse/kafka_engine.py, default CLICKHOUSE_KAFKA_NAMED_COLLECTION
    # = msk_cluster); upstream's docker/clickhouse/config.d/default.xml defines
    # the same nine collections, each just a broker list. Point them all at the
    # platform Kafka (see externalKafka above).
    # System log tables PostHog's ClickHouse migrations query (custom metrics
    # read system.crash_log, …); upstream enables them in docker/clickhouse/
    # config.xml, the chart's ClickHouseInstallation does not. Only the tables
    # the migrations touch: declaring opentelemetry_span_log/backup_log here made
    # ClickHouse 26.6 abort at start-up (createSystemLog<OpenTelemetrySpanLog>).
    crash_log/database: system
    crash_log/table: crash_log
    crash_log/flush_interval_milliseconds: "1000"
    session_log/database: system
    session_log/table: session_log
    session_log/partition_by: toYYYYMM(event_date)
    session_log/flush_interval_milliseconds: "7500"
    query_thread_log/database: system
    query_thread_log/table: query_thread_log
    query_thread_log/partition_by: toYYYYMM(event_date)
    query_thread_log/flush_interval_milliseconds: "7500"
    named_collections/msk_cluster/kafka_broker_list: adhar-kafka-kafka-bootstrap.adhar-system.svc.cluster.local:9092
    named_collections/warpstream_ingestion/kafka_broker_list: adhar-kafka-kafka-bootstrap.adhar-system.svc.cluster.local:9092
    named_collections/warpstream_calculated_events/kafka_broker_list: adhar-kafka-kafka-bootstrap.adhar-system.svc.cluster.local:9092
    named_collections/warpstream_replay/kafka_broker_list: adhar-kafka-kafka-bootstrap.adhar-system.svc.cluster.local:9092
    named_collections/warpstream_shared/kafka_broker_list: adhar-kafka-kafka-bootstrap.adhar-system.svc.cluster.local:9092
    named_collections/warpstream_cyclotron/kafka_broker_list: adhar-kafka-kafka-bootstrap.adhar-system.svc.cluster.local:9092
    named_collections/warpstream_logs/kafka_broker_list: adhar-kafka-kafka-bootstrap.adhar-system.svc.cluster.local:9092
    named_collections/warpstream_traces/kafka_broker_list: adhar-kafka-kafka-bootstrap.adhar-system.svc.cluster.local:9092
    named_collections/warpstream_metrics/kafka_broker_list: adhar-kafka-kafka-bootstrap.adhar-system.svc.cluster.local:9092
    # PostHog's migrations address several *named* ClickHouse clusters
    # (posthog_migrations, posthog_single_shard, ai_events, …) that the chart's
    # single-cluster ClickHouseInstallation never defines ("Requested cluster
    # 'ai_events' not found"). On a single-node ClickHouse they are all the same
    # node, so declare them as remote_servers entries pointing at it. The
    # operator writes settings as config.d XML paths. The list comes from grepping
# cluster names out of the PostHog image (/code/posthog/clickhouse).
    remote_servers/posthog_migrations/shard/replica/host: chi-posthog-posthog-0-0
    remote_servers/posthog_migrations/shard/replica/port: "9000"
    remote_servers/posthog_single_shard/shard/replica/host: chi-posthog-posthog-0-0
    remote_servers/posthog_single_shard/shard/replica/port: "9000"
    remote_servers/ai_events/shard/replica/host: chi-posthog-posthog-0-0
    remote_servers/ai_events/shard/replica/port: "9000"
    remote_servers/posthog_logs/shard/replica/host: chi-posthog-posthog-0-0
    remote_servers/posthog_logs/shard/replica/port: "9000"
    remote_servers/aux/shard/replica/host: chi-posthog-posthog-0-0
    remote_servers/aux/shard/replica/port: "9000"
    remote_servers/ops/shard/replica/host: chi-posthog-posthog-0-0
    remote_servers/ops/shard/replica/port: "9000"
    remote_servers/posthog_writable/shard/replica/host: chi-posthog-posthog-0-0
    remote_servers/posthog_writable/shard/replica/port: "9000"
    remote_servers/posthog_svc/shard/replica/host: chi-posthog-posthog-0-0
    remote_servers/posthog_svc/shard/replica/port: "9000"
    remote_servers/posthog_primary_replica/shard/replica/host: chi-posthog-posthog-0-0
    remote_servers/posthog_primary_replica/shard/replica/port: "9000"
    remote_servers/posthog_aux/shard/replica/host: chi-posthog-posthog-0-0
    remote_servers/posthog_aux/shard/replica/port: "9000"
    remote_servers/data_warehouse/shard/replica/host: chi-posthog-posthog-0-0
    remote_servers/data_warehouse/shard/replica/port: "9000"
    remote_servers/posthog_data_warehouse/shard/replica/host: chi-posthog-posthog-0-0
    remote_servers/posthog_data_warehouse/shard/replica/port: "9000"
    remote_servers/posthog_analytics/shard/replica/host: chi-posthog-posthog-0-0
    remote_servers/posthog_analytics/shard/replica/port: "9000"
    remote_servers/posthog_events/shard/replica/host: chi-posthog-posthog-0-0
    remote_servers/posthog_events/shard/replica/port: "9000"
    remote_servers/posthog_code/shard/replica/host: chi-posthog-posthog-0-0
    remote_servers/posthog_code/shard/replica/port: "9000"
    remote_servers/sessions/shard/replica/host: chi-posthog-posthog-0-0
    remote_servers/sessions/shard/replica/port: "9000"
    remote_servers/posthog_sessions/shard/replica/host: chi-posthog-posthog-0-0
    remote_servers/posthog_sessions/shard/replica/port: "9000"
    remote_servers/logs/shard/replica/host: chi-posthog-posthog-0-0
    remote_servers/logs/shard/replica/port: "9000"
    remote_servers/web_analytics/shard/replica/host: chi-posthog-posthog-0-0
    remote_servers/web_analytics/shard/replica/port: "9000"
    remote_servers/posthog_web_analytics/shard/replica/host: chi-posthog-posthog-0-0
    remote_servers/posthog_web_analytics/shard/replica/port: "9000"
    remote_servers/posthog_ai_events/shard/replica/host: chi-posthog-posthog-0-0
    remote_servers/posthog_ai_events/shard/replica/port: "9000"
    remote_servers/posthog_ops/shard/replica/host: chi-posthog-posthog-0-0
    remote_servers/posthog_ops/shard/replica/port: "9000"
    remote_servers/persons/shard/replica/host: chi-posthog-posthog-0-0
    remote_servers/persons/shard/replica/port: "9000"
    remote_servers/posthog_persons/shard/replica/host: chi-posthog-posthog-0-0
    remote_servers/posthog_persons/shard/replica/port: "9000"
    remote_servers/posthog_logs_v2/shard/replica/host: chi-posthog-posthog-0-0
    remote_servers/posthog_logs_v2/shard/replica/port: "9000"
    remote_servers/session_replay/shard/replica/host: chi-posthog-posthog-0-0
    remote_servers/session_replay/shard/replica/port: "9000"
    remote_servers/posthog_session_replay/shard/replica/host: chi-posthog-posthog-0-0
    remote_servers/posthog_session_replay/shard/replica/port: "9000"
  externalZookeeper:
    servers:
      - host: posthog-clickhouse-keeper
        port: 2181

# PostHog runs its ClickHouse migrations against a cluster named
# "posthog_migrations" by default; the chart's ClickHouseInstallation only
# defines the "posthog" cluster, so the migrate Job died with "Requested
# cluster 'posthog_migrations' not found". With a single-shard ClickHouse the
# two are the same set of nodes.
env:
  - name: CLICKHOUSE_MIGRATIONS_CLUSTER
    value: posthog
  # NOTE: DEPLOYMENT is NOT set here. The chart already emits it
  # (`helm_local_ha`) into every pod spec, so adding a second entry produced
  # `duplicate entries for key [name="DEPLOYMENT"]` and server-side apply
  # rejected every web/events/worker Deployment — PostHog had no web pods at all.
  # generate-manifests.sh rewrites the chart's single entry to `hobby` instead.
  #
  # KEEP EVERY ENTRY IN THIS ONE `env:` LIST. A second top-level `env:` further
  # down silently replaced this block, which would have taken
  # CLICKHOUSE_MIGRATIONS_CLUSTER with it.
  #
  # PostHog moved its person tables into a separate database and reads that
  # connection URL only from PERSONS_DB_WRITER_URL / PERSONS_DB_READER_URL. The
  # chart has no value for either, so with nothing set posthog/persons_db.py
  # falls back to host "db" and the migrate Job died on
  # `apply_persons_migrations` with
  #   psycopg.OperationalError: [Errno -2] Name or service not known
  # The password is read from the CNPG-managed Secret and spliced in with
  # Kubernetes' $(VAR) expansion, which resolves against an env var declared
  # EARLIER in the same container -- the only way to build a URL without copying
  # the password into git. The database itself is declared in
  # manifests/platform-postgres.yaml.
  - name: ADHAR_PERSONS_DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: posthog-db-credentials
        key: postgresql-password
  - name: PERSONS_DB_WRITER_URL
    value: "postgres://posthog:$(ADHAR_PERSONS_DB_PASSWORD)@posthog-db-rw.adhar-system.svc.cluster.local:5432/posthog_persons"
  - name: PERSONS_DB_READER_URL
    value: "postgres://posthog:$(ADHAR_PERSONS_DB_PASSWORD)@posthog-db-ro.adhar-system.svc.cluster.local:5432/posthog_persons"

# PostgreSQL comes from the platform CNPG operator (manifests/platform-postgres.yaml):
# the chart's bundled PostgreSQL is 11.7 and PostHog requires 14+.
postgresql:
  enabled: false
externalPostgresql:
  postgresqlHost: posthog-db-rw.adhar-system.svc.cluster.local
  postgresqlPort: 5432
  postgresqlDatabase: posthog
  postgresqlUsername: posthog
  existingSecret: posthog-db-credentials
  existingSecretPasswordKey: postgresql-password

# Resource requests for the app tiers. The chart ships none, so on a busy node
# posthog-web was OOM-killed (exit 137) with no request to schedule against, and
# a Django+gunicorn worker set needs ~2 GiB to load. Requests also give the node
# autoscaler something to reason about.
# The web Service type lives under the chart's TOP-LEVEL `service:` key, not
# under `web.service` -- web-service.yaml reads `.Values.service.type`. The old
# `web.service.type` was ignored and PostHog kept a NodePort.
service:
  type: ClusterIP

# NOTE: keep exactly ONE `web:` key in this file. A second top-level `web:`
# block silently replaces the first one.
web:
  # The chart allows 6 x 10s = 60 seconds for start-up. posthog/posthog:latest
  # boots Django with the full PostHog app set and does not bind port 8000 in
  # anything like that time, so the kubelet killed the container over and over:
  #   Startup probe failed: ... dial tcp 10.244.9.60:8000: connect: connection
  #   refused / Container posthog-web failed startup probe, will be restarted
  # and each restart paid the same slow start again. 60 x 10s gives it ten
  # minutes. The liveness and readiness probes are untouched, so a process that
  # genuinely wedges after start-up is still caught.
  # events-deployment.yaml reads web.startupProbe too, so this covers both.
  startupProbe:
    failureThreshold: 60
    initialDelaySeconds: 0
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 5
  # posthog/posthog:latest loads the whole PostHog app set into every gunicorn
  # worker. At the chart default the tier was OOM-killed (exit 137) over and over
  # and never answered /_readyz. Two workers with a 6Gi ceiling starts reliably;
  # raise WEB_CONCURRENCY, and the limit with it, to serve more traffic.
  env:
    - name: WEB_CONCURRENCY
      value: "2"
  resources:
    requests: {cpu: 250m, memory: 2Gi}
    limits: {memory: 6Gi}
events:
  # Same shape as web: Django+gunicorn, one full app set per worker. A 1536Mi
  # limit OOM-killed it nine times in a row, and 3Gi still did.
  env:
    - name: WEB_CONCURRENCY
      value: "2"
  resources:
    requests: {cpu: 200m, memory: 1536Mi}
    limits: {memory: 4Gi}
# The plugin server is DISABLED: posthog/posthog:latest no longer ships
# ./bin/plugin-server (the chart's command for it), so the Deployment could only
# ever CrashLoop with "no such file or directory". Ingestion still works — the
# events tier consumes Kafka — but app transformations/destinations are off until
# the chart and the image agree on an entrypoint again.
plugins:
  enabled: false

# PostHog moved its person tables into a separate database and reads the
# connection URL only from PERSONS_DB_WRITER_URL / PERSONS_DB_READER_URL. The
# chart has no value for either, so with nothing set posthog/persons_db.py falls
# back to host "db" and the migrate Job died on `apply_persons_migrations` with
#   psycopg.OperationalError: [Errno -2] Name or service not known
# `env` is appended verbatim to EVERY PostHog pod spec, so this reaches the
# migrate Job, web, events and the workers alike. The password is read from the
# CNPG-managed Secret and spliced in with Kubernetes' $(VAR) expansion, which
# resolves against an env var declared EARLIER in the same container -- that is
# the only way to build a URL without copying the password into git.
# The database itself is declared in manifests/platform-postgres.yaml.
