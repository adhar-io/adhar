# PostHog values for Adhar (charts-clickhouse). The chart's Ingress (and bundled
# ingress-nginx) is disabled -- routing is handled by the Cilium Gateway API
# (adhar-gateway) via manifests/httproute.yaml. PostHog is served at the root path
# on adhar.localtest.me (it does not support a sub-path), so the HTTPRoute matches
# a dedicated path and PostHog should ideally have its own hostname in production.
cloud: "local"

ingress:
  enabled: false
  nginx:
    enabled: false

# Bundled ingress-nginx subchart -- keep it off, the Cilium Gateway handles L7.
ingress-nginx:
  enabled: false

web:
  service:
    type: ClusterIP

# Bitnami pruned the "-debian-10-rNN" builds that this chart's bundled
# subcharts pin (kafka 2.8.1-debian-10-r99, zookeeper 3.7.0-debian-10-r70,
# postgresql 11.7.0-debian-10-r9, redis 6.2.7-debian-10-r0), so every one of
# those pods failed with ImagePullBackOff / manifest unknown. The same
# SOFTWARE VERSIONS are still published in the bitnamilegacy repository under
# plain version tags, so pin those: identical versions (the subchart's
# configuration stays valid), tags that actually exist.
pgbouncer:
  image:
    repository: bitnamilegacy/pgbouncer
    tag: 1.18.0
redis:
  image:
    repository: bitnamilegacy/redis
    tag: 6.2.7

# Use the platform's shared Strimzi Kafka (KRaft, no ZooKeeper) instead of the
# chart's bundled Kafka 2.8.1 + ZooKeeper ensemble, whose Bitnami images
# upstream deleted. One Kafka for the whole platform, on a supported version.
kafka:
  enabled: false
zookeeper:
  enabled: false
externalKafka:
  brokers:
    - adhar-kafka-kafka-bootstrap.adhar-system.svc.cluster.local:9092
  tls: false

# Point ClickHouse at the platform's ClickHouse Keeper (manifests/
# clickhouse-keeper.yaml) rather than the chart's Bitnami ZooKeeper ensemble.
# Keeper speaks the same protocol on the same port, so this is a drop-in.
clickhouse:
  # PostHog's migrations read two ClickHouse macros the chart never defines
  # ("No macro hostClusterType in config"); the operator writes settings as
  # config.d XML paths, so these land in <macros>.
  settings:
    macros/hostClusterType: online
    macros/hostClusterRole: coordinator
    # PostHog's migrations address several *named* ClickHouse clusters
    # (posthog_migrations, posthog_single_shard, ai_events, …) that the chart's
    # single-cluster ClickHouseInstallation never defines ("Requested cluster
    # 'ai_events' not found"). On a single-node ClickHouse they are all the same
    # node, so declare them as remote_servers entries pointing at it. The
    # operator writes settings as config.d XML paths. The list comes from grepping
# cluster names out of the PostHog image (/code/posthog/clickhouse).
    remote_servers/posthog_migrations/shard/replica/host: chi-posthog-posthog-0-0
    remote_servers/posthog_migrations/shard/replica/port: "9000"
    remote_servers/posthog_single_shard/shard/replica/host: chi-posthog-posthog-0-0
    remote_servers/posthog_single_shard/shard/replica/port: "9000"
    remote_servers/ai_events/shard/replica/host: chi-posthog-posthog-0-0
    remote_servers/ai_events/shard/replica/port: "9000"
    remote_servers/posthog_logs/shard/replica/host: chi-posthog-posthog-0-0
    remote_servers/posthog_logs/shard/replica/port: "9000"
    remote_servers/aux/shard/replica/host: chi-posthog-posthog-0-0
    remote_servers/aux/shard/replica/port: "9000"
    remote_servers/ops/shard/replica/host: chi-posthog-posthog-0-0
    remote_servers/ops/shard/replica/port: "9000"
    remote_servers/posthog_writable/shard/replica/host: chi-posthog-posthog-0-0
    remote_servers/posthog_writable/shard/replica/port: "9000"
    remote_servers/posthog_svc/shard/replica/host: chi-posthog-posthog-0-0
    remote_servers/posthog_svc/shard/replica/port: "9000"
    remote_servers/posthog_primary_replica/shard/replica/host: chi-posthog-posthog-0-0
    remote_servers/posthog_primary_replica/shard/replica/port: "9000"
    remote_servers/posthog_aux/shard/replica/host: chi-posthog-posthog-0-0
    remote_servers/posthog_aux/shard/replica/port: "9000"
    remote_servers/data_warehouse/shard/replica/host: chi-posthog-posthog-0-0
    remote_servers/data_warehouse/shard/replica/port: "9000"
    remote_servers/posthog_data_warehouse/shard/replica/host: chi-posthog-posthog-0-0
    remote_servers/posthog_data_warehouse/shard/replica/port: "9000"
    remote_servers/posthog_analytics/shard/replica/host: chi-posthog-posthog-0-0
    remote_servers/posthog_analytics/shard/replica/port: "9000"
    remote_servers/posthog_events/shard/replica/host: chi-posthog-posthog-0-0
    remote_servers/posthog_events/shard/replica/port: "9000"
    remote_servers/posthog_code/shard/replica/host: chi-posthog-posthog-0-0
    remote_servers/posthog_code/shard/replica/port: "9000"
  externalZookeeper:
    servers:
      - host: posthog-clickhouse-keeper
        port: 2181

# PostHog runs its ClickHouse migrations against a cluster named
# "posthog_migrations" by default; the chart's ClickHouseInstallation only
# defines the "posthog" cluster, so the migrate Job died with "Requested
# cluster 'posthog_migrations' not found". With a single-shard ClickHouse the
# two are the same set of nodes.
env:
  - name: CLICKHOUSE_MIGRATIONS_CLUSTER
    value: posthog

# PostgreSQL comes from the platform CNPG operator (manifests/platform-postgres.yaml):
# the chart's bundled PostgreSQL is 11.7 and PostHog requires 14+.
postgresql:
  enabled: false
externalPostgresql:
  postgresqlHost: posthog-db-rw.adhar-system.svc.cluster.local
  postgresqlPort: 5432
  postgresqlDatabase: posthog
  postgresqlUsername: posthog
  existingSecret: posthog-db-credentials
  existingSecretPasswordKey: postgresql-password
