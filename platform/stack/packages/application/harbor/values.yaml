# Harbor Helm Chart Values
#
# Gateway API only -- NO nginx Ingress. We expose Harbor as a ClusterIP service
# and route external traffic through the Cilium Gateway via manifests/httproute.yaml.
# Setting expose.type to "clusterIP" prevents the chart from rendering any Ingress.
#
# DEDICATED HOST (not a sub-path): Harbor serves its registry/core APIs at root
# prefixes (/api, /v2, /service, /c, /chartrepo) and cannot live under a shared
# host's sub-path without hijacking those global prefixes from other apps. It is
# therefore given its own hostname, harbor.adhar.localtest.me, which the platform
# wildcard TLS cert (*.adhar.localtest.me) already covers and *.localtest.me
# resolves to 127.0.0.1. The Cilium Gateway listeners are hostname-agnostic, so
# the harbor HTTPRoute (hostname: harbor.adhar.localtest.me) attaches on :8443.

expose:
  type: clusterIP
  tls:
    enabled: false
  clusterIP:
    name: harbor
    ports:
      httpPort: 80
      httpsPort: 443

# External URL Harbor advertises — the root of its dedicated host on the platform
# external port. Portal + core generate absolute links against this.
externalURL: "https://harbor.adhar.localtest.me:8443"

# --- HTTPS everywhere: in-cluster TLS on the component Services -------------------
# The kind node's containerd (and kpack) must PULL/PUSH the images kpack builds,
# whose tag host is the in-cluster Service DNS
# `harbor-core.adhar-system.svc.cluster.local`. Serving that endpoint as plain
# http forces containerd into insecure/skip_verify hacks; instead we enable
# Harbor's internalTLS so every component (core, jobservice, registry, portal)
# serves HTTPS and they mutually authenticate.
#
# certSource: secret — the per-component certs are supplied as pre-created
# Secrets (see manifests/10-internal-tls-certs.yaml, a PreSync hook Job that mints
# them from the platform CA `adhar-cert`). Rooting them in the known `adhar` CA
# means the node (which already mounts that CA at /etc/adhar/pki/tls.crt) and
# kpack trust the exact same root — no skip_verify anywhere. The core cert's SANs
# include the full Service FQDN AND the pinned harbor-core ClusterIP so the node
# can dial it directly (see the clusterIP pin injected into the harbor-core
# Service by generate-manifests.sh).
#
# The externally exposed `harbor` (nginx) Service stays plain http on :80 — the
# Cilium Gateway terminates TLS at the edge (adhar-cert) and nginx reverse-proxies
# to the now-HTTPS core/portal, so the Gateway HTTPRoute is unaffected.
internalTLS:
  enabled: true
  certSource: "secret"
  core:
    secretName: "harbor-core-internal-tls"
  jobservice:
    secretName: "harbor-jobservice-internal-tls"
  registry:
    secretName: "harbor-registry-internal-tls"
  portal:
    secretName: "harbor-portal-internal-tls"

# Pin the shared internal secrets to stable values so re-rendering the chart never
# rotates them (an accidental rotation on a live cluster would churn every Harbor
# component). These are the SAME values the chart previously auto-generated for
# this local install; `secretKey` / admin / DB passwords are the chart defaults.
# NOTE: local-footprint credentials — swap for real secrets (ESO) on a hardened
# install; they match application/harbor's existing local posture (Harbor12345).
secretKey: "not-a-secure-key"
harborAdminPassword: "Harbor12345"

# Use the chart's bundled (internal) database and redis. Adhar adds Valkey as the
# preferred platform cache alongside Redis, but Harbor keeps its own bundled redis
# (tightly coupled to Harbor internals) rather than sharing the platform cache.
database:
  type: "internal"

redis:
  type: "internal"

# --- Lightweight profile for a single Kind node ---------------------------------
# Trivy (vulnerability scanner) is the heaviest optional component (extra pod +
# large PVC + DB pulls) -- disabled locally. Enable on real clusters for scanning.
trivy:
  enabled: false

# Metrics/exporter enabled so kube-prometheus scrapes Harbor and the Grafana
# Harbor dashboard (gnetId 14075) gets data. The exporter component exposes
# harbor_* metrics on the harbor-exporter service (port 8001, path /metrics);
# core/registry/jobservice also expose their own /metrics on port 8001.
# A ServiceMonitor is shipped alongside in manifests/servicemonitor.yaml.
metrics:
  enabled: true

# Single replica for every stateless component (chart defaults are already 1, set
# explicitly so the intent is clear and HA never accidentally scales them up).
# The `secret` / `xsrfKey` / `htpasswdString` fields pin the shared internal
# secrets to stable values so re-rendering never rotates them on a live cluster
# (they match the values this local install already runs with).
portal:
  replicas: 1
core:
  replicas: 1
  secret: "mN6OngnrDg4wd0Ac"
  xsrfKey: "owavrk6oUYGd9ZONoznjQUxfcMUGCPw1"
jobservice:
  replicas: 1
  secret: "lsuPgF5L6EwBfed9"
registry:
  replicas: 1
  secret: "uDZ0EeRFXE6vZAPR"
  credentials:
    username: "harbor_registry_user"
    password: "harbor_registry_password"
    htpasswdString: "harbor_registry_user:$2a$10$aumpBZC6v8Tc/xq6QNv6SOykGu96yoi3voDB1eBWgR2UQu8ApViIu"

# Small ephemeral-ish volumes sized for local demos (Kind's local-path provisioner
# supplies the default StorageClass). Bump these substantially on real clusters.
persistence:
  enabled: true
  persistentVolumeClaim:
    registry:
      size: 2Gi
    jobservice:
      jobLog:
        size: 1Gi
    database:
      size: 1Gi
    redis:
      size: 1Gi
