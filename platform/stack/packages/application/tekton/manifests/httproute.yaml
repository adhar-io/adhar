# Tekton Dashboard through the shared platform Gateway, gated by Keycloak SSO
# (oauth2-proxy; see dashboard-sso.yaml). The dashboard itself has no auth.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tekton-dashboard
  namespace: adhar-system
spec:
  parentRefs:
    - name: adhar-gateway
      namespace: adhar-system
  hostnames: ["tekton.adhar.localtest.me"]
  rules:
    - backendRefs:
        - name: tekton-oauth2-proxy
          port: 4180
