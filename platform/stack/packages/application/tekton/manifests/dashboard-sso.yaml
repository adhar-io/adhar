# Keycloak SSO in front of the Tekton Dashboard (issue: dashboard shipped with
# no authentication). The dashboard has no native OIDC, so an oauth2-proxy
# gates it with the `tekton` Keycloak client (provisioned by the keycloak
# config job; secret via ESO from keycloak-clients). Same pattern as the
# RustFS console gate.
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: tekton-oauth2-cookie
  namespace: adhar-system
spec:
  length: 32
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tekton-oauth2-proxy
  namespace: adhar-system
spec:
  # CreatedOnce + 5m: retry until keycloak-clients exists, then freeze so the
  # generated cookie secret never rotates. A bare refreshInterval "0" is one
  # attempt with NO retry — any ES created before the Keycloak realm job
  # finishes (always, on a cold bootstrap) stays SecretSyncedError forever.
  refreshPolicy: CreatedOnce
  refreshInterval: 5m
  secretStoreRef:
    name: keycloak
    kind: ClusterSecretStore
  target:
    name: tekton-oauth2-proxy
    template:
      engineVersion: v2
      data:
        OAUTH2_PROXY_CLIENT_SECRET: "{{ .TEKTON_CLIENT_SECRET }}"
        OAUTH2_PROXY_COOKIE_SECRET: "{{ .COOKIE_SECRET }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: tekton-oauth2-cookie
      rewrite:
        - transform:
            template: "COOKIE_SECRET"
  data:
    - secretKey: TEKTON_CLIENT_SECRET
      remoteRef:
        key: keycloak-clients
        property: TEKTON_CLIENT_SECRET
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tekton-oauth2-proxy
  namespace: adhar-system
  labels:
    app.kubernetes.io/name: tekton-oauth2-proxy
    app.kubernetes.io/part-of: tekton
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tekton-oauth2-proxy
  template:
    metadata:
      labels:
        app: tekton-oauth2-proxy
    spec:
      enableServiceLinks: false
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1
          args:
            - --http-address=0.0.0.0:4180
            - --provider=oidc
            - --oidc-issuer-url=https://keycloak.adhar.localtest.me:8443/realms/adhar
            - --ssl-insecure-skip-verify=true
            - --client-id=tekton
            - --redirect-url=https://tekton.adhar.localtest.me:8443/oauth2/callback
            - --upstream=http://tekton-dashboard.adhar-system.svc.cluster.local:9097
            - --email-domain=*
            - --scope=openid profile email groups
            - --cookie-secure=true
            - --skip-provider-button=true
            - --reverse-proxy=true
          envFrom:
            - secretRef:
                name: tekton-oauth2-proxy
          ports:
            - name: http
              containerPort: 4180
          readinessProbe:
            httpGet:
              path: /ping
              port: 4180
            initialDelaySeconds: 5
            timeoutSeconds: 10
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: tekton-oauth2-proxy
  namespace: adhar-system
  labels:
    app.kubernetes.io/name: tekton-oauth2-proxy
    app.kubernetes.io/part-of: tekton
spec:
  selector:
    app: tekton-oauth2-proxy
  ports:
    - name: http
      port: 4180
      targetPort: 4180
