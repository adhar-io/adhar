# Baserow routed through the Cilium Gateway (adhar-gateway). TLS terminates at the
# Gateway (adhar-cert), replacing the chart's Ingress (disabled in values.yaml).
# Baserow splits its UI (baserow-frontend:3000) from its API (baserow-wsgi:8000);
# the /baserow/api, /baserow/ws and /baserow/media prefixes go to the backend and
# everything else under /baserow goes to the frontend. publicBackendUrl /
# publicFrontendUrl are set to the external /baserow URL in values.yaml.
#
# SSO: every backend below is the Keycloak oauth2-proxy from sso.yaml, which
# forwards to the original upstream(s): baserow-wsgi:8000, baserow-frontend:3000.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: baserow
  namespace: adhar-system
  annotations:
    # After the oauth2-proxy (sso.yaml, wave 5): ArgoCD holds a wave until its
    # resources are healthy, and a route whose backend Service does not exist
    # yet is Degraded (ResolvedRefs=False) — at an earlier wave that deadlocks
    # the sync on a fresh cluster and the proxy is never created.
    argocd.argoproj.io/sync-wave: "6"
  labels:
    app.kubernetes.io/name: baserow
    app.kubernetes.io/instance: baserow
    app.kubernetes.io/part-of: baserow
spec:
  parentRefs:
    - name: adhar-gateway
      namespace: adhar-system
  hostnames:
    - baserow.adhar.localtest.me
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
        - path:
            type: PathPrefix
            value: /ws
        - path:
            type: PathPrefix
            value: /media
      backendRefs:
        - name: baserow-oauth2-proxy
          port: 4180
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: baserow-oauth2-proxy
          port: 4180
