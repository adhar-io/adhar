# Chaos Mesh dashboard routed through the Cilium Gateway (adhar-gateway). TLS
# terminates at the Gateway (adhar-cert), replacing any nginx Ingress. The
# /chaos-mesh prefix is stripped before forwarding to the dashboard service
# (chaos-dashboard:2333).
#
# SSO: every backend below is the Keycloak oauth2-proxy from sso.yaml, which
# forwards to the original upstream(s): chaos-dashboard:2333.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: chaos-dashboard
  namespace: adhar-system
  annotations:
    # After the oauth2-proxy (sso.yaml, wave 5): ArgoCD holds a wave until its
    # resources are healthy, and a route whose backend Service does not exist
    # yet is Degraded (ResolvedRefs=False) — at an earlier wave that deadlocks
    # the sync on a fresh cluster and the proxy is never created.
    argocd.argoproj.io/sync-wave: "6"
  labels:
    app.kubernetes.io/name: chaos-mesh
    app.kubernetes.io/component: chaos-dashboard
    app.kubernetes.io/part-of: chaos-mesh
spec:
  parentRefs:
    - name: adhar-gateway
      namespace: adhar-system
  hostnames:
    - chaos-mesh.adhar.localtest.me
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: chaos-mesh-oauth2-proxy
          port: 4180
