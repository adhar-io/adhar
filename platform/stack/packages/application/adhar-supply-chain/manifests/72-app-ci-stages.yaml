# The stages that make `app-ci` a secure supply chain rather than a build script
# (ADR-0018, ADR-0019). Each is a Task the Pipeline in 70-app-ci.yaml composes:
#
#   clone → build, then in parallel   test-auto · gitleaks-scan · source-scan · trivy-scan · syft-sbom
#   then                              cosign-sign → cosign-attest-sbom → cosign-verify-attested → deploy
#   finally                    ci-summary
#
# Every gate here FAILS the run (exit 1) — a gate that only reports is a
# dashboard, not a control. Where a scanner finds nothing to scan (a repository
# with no tests, no lockfile, no manifests) the stage passes and says so.
#
# The one exception is how app-ci runs source-scan (and trivy-scan): with
# blocking=false they record a verdict and the JSON report, and scan-gate
# (74-scan-governance.yaml) fails the run instead — under the project's scan
# policy, approved waivers and, if the policy asks, a reviewer's decision.
---
# Unit tests, language detected from the checkout. One task instead of one per
# language so the pipeline does not need to know what it is building — the
# buildpack does not either. Maven/Gradle resolve through the adhar-controlplane Nexus
# when the repository ships the platform's settings.xml (the templates do).
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: test-auto
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "4"}
spec:
  description: Run the repository's unit and integration tests with the toolchain the repository declares.
  params:
    - {name: subdirectory, type: string, default: ""}
    # From detect-toolchain. Step images are built from these, so a project is
    # tested on ITS JDK/Node/Go, not on one the pipeline chose.
    - {name: jdkVersion, type: string, default: "25"}
    - {name: mavenVersion, type: string, default: "3.9"}
    - {name: nodeVersion, type: string, default: "22"}
    - {name: goVersion, type: string, default: "1.24"}
    - {name: pythonVersion, type: string, default: "3.12"}
  workspaces:
    - {name: source}
  results:
    - {name: runner, description: "Which test runner ran (maven, gradle, npm, go, pytest, none)"}
  # Testcontainers needs a Docker API; kubedock provides one that runs each
  # container as a pod in adhar-ci-sandbox (74-testcontainers-sandbox.yaml) and
  # reverse-proxies its ports onto this pod's localhost. Bound to 127.0.0.1 so
  # only the steps of THIS pod can use it — on the default `:2475` any pod in
  # the cluster could start containers through it. --disable-dind: no
  # container gets a Docker socket. --timeout 10m: an image pull on a busy node
  # outlasts kubedock's 1-minute default — the first live run on GCP timed out
  # at 5m while postgres:16-alpine was still being pulled (2026-10-22). No --prune-start: concurrent runs
  # share the namespace and must not delete each other's containers; leftovers
  # are reaped after --reapmax.
  sidecars:
    - name: kubedock
      image: docker.io/joyrex2001/kubedock:0.23.0
      args:
        - server
        - --listen-addr=127.0.0.1:2475
        - --namespace=adhar-ci-sandbox
        - --reverse-proxy
        - --disable-dind
        - --timeout=10m
        - --reapmax=45m
      computeResources:
        requests: {cpu: 20m, memory: 64Mi}
        limits: {cpu: 500m, memory: 256Mi}
  steps:
    # Tests run on a private COPY of the checkout: `npm ci` / `mvn test` write
    # node_modules and target/ next to the source, and the shared workspace is
    # what later stages (and a re-run build) read.
    - name: detect
      image: docker.io/library/bash:5.2
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        mkdir -p /workspace/testsrc
        cp -a "$(workspaces.source.path)/$(params.subdirectory)/." /workspace/testsrc/
        cd /workspace/testsrc
        r=none
        if   [ -f pom.xml ];          then r=maven
        elif [ -f gradlew ] || [ -f build.gradle ] || [ -f build.gradle.kts ]; then r=gradle
        elif [ -f package.json ];     then r=npm
        elif [ -f go.mod ];           then r=go
        elif [ -f pyproject.toml ] || [ -f requirements.txt ]; then r=pytest
        fi
        echo "test runner: $r"
        printf '%s' "$r" > "$(results.runner.path)"
    - name: maven
      image: docker.io/library/maven:$(params.mavenVersion)-eclipse-temurin-$(params.jdkVersion)
      # `mvn test` peaked at ~1.3 GiB (2026-10-22). Requests of every step in
      # this Task are SUMMED into the pod's request even though only the
      # detected runner does work, so only the heaviest common runner (Maven —
      # adhar-kit services) carries one; the others keep the namespace default.
      computeResources:
        requests: {cpu: 250m, memory: 768Mi}
      workingDir: /workspace/testsrc
      env:
        - {name: DOCKER_HOST, value: "tcp://127.0.0.1:2475"}
        # Ryuk (Testcontainers' reaper) needs a Docker socket it can mount;
        # kubedock reaps instead.
        - {name: TESTCONTAINERS_RYUK_DISABLED, value: "true"}
        - {name: TESTCONTAINERS_CHECKS_DISABLE, value: "true"}
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        [ "$(cat $(results.runner.path))" = maven ] || { echo "skip (not a Maven project)"; exit 0; }
        S=""; [ -f settings.xml ] && S="-s settings.xml"
        # The wrapper, when the project ships one, is the project's exact Maven.
        MVN=mvn; [ -x ./mvnw ] && MVN=./mvnw
        # `verify`, not `test`: integration tests (*IT, maven-failsafe) run in
        # the integration-test phase — the JVM templates' Karate API suite
        # against the real app and its Testcontainers dependencies. Their
        # containers come from the kubedock sidecar.
        $MVN -B -q $S -Dmaven.repo.local=/workspace/.m2 verify
        echo "maven unit and integration tests passed"
    - name: gradle
      image: docker.io/library/eclipse-temurin:$(params.jdkVersion)-jdk
      workingDir: /workspace/testsrc
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        [ "$(cat $(results.runner.path))" = gradle ] || { echo "skip (not a Gradle project)"; exit 0; }
        if [ -x ./gradlew ]; then ./gradlew --no-daemon -q test; else echo "no gradlew wrapper; cannot run tests reproducibly" >&2; exit 1; fi
        echo "gradle tests passed"
    - name: npm
      image: docker.io/library/node:$(params.nodeVersion)-bookworm
      workingDir: /workspace/testsrc
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        [ "$(cat $(results.runner.path))" = npm ] || { echo "skip (not a Node project)"; exit 0; }
        if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
        npm test --if-present
        echo "npm tests passed"
    - name: go
      image: docker.io/library/golang:$(params.goVersion)-bookworm
      workingDir: /workspace/testsrc
      env: [{name: GOFLAGS, value: "-mod=mod"}, {name: GOCACHE, value: /workspace/.gocache}, {name: GOMODCACHE, value: /workspace/.gomod}]
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        [ "$(cat $(results.runner.path))" = go ] || { echo "skip (not a Go module)"; exit 0; }
        go vet ./... && go test ./...
        echo "go tests passed"
    - name: pytest
      image: docker.io/library/python:$(params.pythonVersion)-slim
      workingDir: /workspace/testsrc
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        [ "$(cat $(results.runner.path))" = pytest ] || { echo "skip (not a Python project)"; exit 0; }
        [ -f requirements.txt ] && pip install -q -r requirements.txt
        [ -f pyproject.toml ] && pip install -q -e . || true
        pip install -q pytest
        python -m pytest -q || [ $? -eq 5 ]   # 5 = no tests collected
        echo "pytest passed"
---
# Committed credentials. A key that reaches git is compromised whether or not it
# reaches an image, so this runs against the SOURCE, before the build.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: gitleaks-scan
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "4"}
spec:
  description: Fail if the checkout contains a committed secret.
  workspaces:
    - {name: source}
  steps:
    - name: scan
      image: ghcr.io/gitleaks/gitleaks:v8.21.2
      workingDir: $(workspaces.source.path)
      # The step used to print only "leaks found: 1" and keep the report in the
      # pod's /tmp, so a failed run (reactapp, 2026-10-23) could not say WHICH
      # file — the developer had nothing to fix. Now each finding is printed
      # (file, line, rule, fingerprint; the secret itself stays redacted).
      #
      # Scope: the repository's own code. The shared workspace also holds the
      # .git directory (scan-policy writes into it) and whatever a build or tool
      # leaves next to the source; third-party trees (node_modules, vendor) and
      # build output carry sample keys that are not the team's secrets. Same
      # skip list as source-scan.
      #
      # A repository's own .gitleaks.toml is extended, not replaced, and its
      # .gitleaksignore (fingerprints of accepted false positives) is honoured.
      script: |
        #!/bin/sh
        set -u
        if [ -f .gitleaks.toml ]; then BASE="path = \"$(pwd)/.gitleaks.toml\""; else BASE="useDefault = true"; fi
        cat > /tmp/gitleaks.toml <<EOF
        [extend]
        ${BASE}

        [allowlist]
        description = "Not the repository's own code: VCS metadata, dependencies, build output"
        paths = [
          '''(^|/)\.git/''',
          '''(^|/)node_modules/''',
          '''(^|/)(vendor|third_party)/''',
          '''(^|/)(dist|build|out|target|coverage|generated|\.next|\.nuxt|\.svelte-kit|\.angular|\.cache)/''',
          '''(^|/)(\.venv|venv|__pycache__|\.tox)/''',
        ]
        EOF
        # --no-git: the clone is shallow; scan the tree, not history.
        gitleaks detect --source=. --no-git --no-banner --redact --verbose \
          --config=/tmp/gitleaks.toml --exit-code=1 \
          --report-format=json --report-path=/tmp/gitleaks.json
        rc=$?
        if [ "$rc" -ne 0 ]; then
          echo ""
          echo "A committed secret was found (details above; the value is redacted)."
          echo "  Real secret:     remove it from the repository and ROTATE it — it is in Git history."
          echo "  False positive:  add the finding's Fingerprint line to .gitleaksignore at the repository root."
        fi
        exit "$rc"
---
# Dependency CVEs and manifest misconfigurations, from the source tree: the
# lockfile tells trivy what the app ships before the image exists, and `deploy/`
# is what Argo CD will apply — a privileged container or a missing limit is
# caught here rather than by Kyverno at admission, with the run still green.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: source-scan
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "4"}
spec:
  description: Trivy filesystem scan — dependency vulnerabilities and Kubernetes manifest misconfiguration.
  params:
    # The severities that FAIL; the reports carry all of them.
    - {name: severity, type: string, default: "HIGH,CRITICAL"}
    # Bounds the vulnerability-DB download AND the scan. The trivy default is 5m
    # TOTAL, and the DB alone is 120 MiB — measured at 4m20s on a live cluster,
    # which left 40s to scan and killed a release with
    # "semaphore acquire: context deadline exceeded".
    - {name: scanTimeout, type: string, default: "20m"}
    # "false": record the verdict and pass; scan-gate judges (app-ci). The
    # default keeps this task a gate on its own.
    - {name: blocking, type: string, default: "true"}
    # Which halves run: vuln (dependencies) and/or misconfig (manifests).
    - {name: scanners, type: string, default: "vuln,misconfig"}
    - {name: ignoreUnfixed, type: string, default: "false"}
  workspaces:
    - {name: source}
  results:
    - {name: verdict, description: "pass or fail against the severity threshold"}
    - {name: summary, description: "Counts as compact JSON (adhar-scan-lib evaluate.jq)"}
  # ONE vulnerability DB for the whole task.
  #
  # Both steps below run trivy, and Tekton steps are separate containers: with
  # the cache under each container's own /tmp they downloaded the 120 MiB DB
  # TWICE per run, each inside its own 5-minute default budget — two independent
  # chances to flake per scan. A volume shared by both steps means the second
  # reuses what the first fetched.
  volumes:
    - name: trivy-cache
      emptyDir: {}
    - name: work
      emptyDir: {}
    - name: scan-lib
      configMap: {name: adhar-scan-lib}
  stepTemplate:
    env:
      # Trivy derives its cache dir from $HOME, which is `/` in this image, and
      # the step runs non-root: without these it fails with
      # "failed to download vulnerability DB: mkdir /.cache: permission denied"
      # AFTER the download appears to succeed, which reads like a network fault.
      - {name: HOME, value: /tmp}
      - {name: TRIVY_CACHE_DIR, value: /mnt/trivy-cache}
    volumeMounts:
      - {name: trivy-cache, mountPath: /mnt/trivy-cache}
      - {name: work, mountPath: /work}
  # Both scans MEASURE (JSON, every severity, no --exit-code: a non-zero exit is
  # a Trivy error, which the task's retries are for); `evaluate` JUDGES.
  #
  # Ignore file: the project's approved waivers when a reviewer has granted any
  # (scan-policy writes .git/adhar-scan/source-trivyignore.yaml only then);
  # otherwise none is named and Trivy keeps reading the checkout's own
  # .trivyignore, exactly as before.
  steps:
    - name: deps
      image: docker.io/aquasec/trivy:0.58.1
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -e
        case ",$(params.scanners)," in *,vuln,*) ;; *) echo "dependency scan disabled by policy"; exit 0 ;; esac
        IGNORE=""
        [ -s .git/adhar-scan/source-trivyignore.yaml ] && IGNORE="--ignorefile .git/adhar-scan/source-trivyignore.yaml"
        UNFIXED=""
        [ "$(params.ignoreUnfixed)" = "true" ] && UNFIXED="--ignore-unfixed"
        # Build output and generated trees are skipped: they are not source
        # anybody can fix a CVE in, and walking them races whatever is still
        # writing them. `**/` matters — a bare `dist` matches only ./dist, not
        # <package>/dist, which is how a monorepo slips through.
        SKIP='node_modules,**/node_modules,dist,**/dist,target,**/target,.git,**/.git,generated,**/generated'
        # shellcheck disable=SC2086
        trivy fs --scanners vuln --show-suppressed $IGNORE $UNFIXED --format json --output /work/deps.json \
          --skip-dirs "$SKIP" --timeout "$(params.scanTimeout)" --no-progress .
        echo "dependency scan complete"
    - name: manifests
      image: docker.io/aquasec/trivy:0.58.1
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -e
        case ",$(params.scanners)," in *,misconfig,*) ;; *) echo "manifest scan disabled by policy"; exit 0 ;; esac
        found=""
        for d in deploy manifests k8s kubernetes; do [ -d "$d" ] && found="$found $d"; done
        [ -n "$found" ] || { echo "no Kubernetes manifests in the repository; nothing to check"; exit 0; }
        IGNORE=""
        [ -s .git/adhar-scan/source-trivyignore.yaml ] && IGNORE="--ignorefile .git/adhar-scan/source-trivyignore.yaml"
        # shellcheck disable=SC2086
        trivy config -q $IGNORE --format json --output /work/config.json \
          --timeout "$(params.scanTimeout)" $found
        echo "manifest scan complete"
    - name: evaluate
      image: alpine/k8s:1.31.1
      workingDir: $(workspaces.source.path)
      volumeMounts:
        - {name: scan-lib, mountPath: /lib/adhar-scan, readOnly: true}
      script: |
        #!/bin/bash
        set -euo pipefail
        have=()
        for r in /work/deps.json /work/config.json; do [ -s "$r" ] && have+=("$r"); done
        if [ ${#have[@]} -eq 0 ]; then echo '{}' > /work/none.json; have=(/work/none.json); fi
        jq -c -s --arg fail "$(params.severity)" --arg deny "" --arg warn "" \
          -f /lib/adhar-scan/evaluate.jq "${have[@]}" > /work/source.summary.json
        VERDICT=$(jq -r .verdict /work/source.summary.json)
        printf '%s' "$VERDICT" > "$(results.verdict.path)"
        jq -c 'del(.verdict)' /work/source.summary.json | tr -d '\n' > "$(results.summary.path)"
        echo "summary: $(cat /work/source.summary.json)"
        if [ "$VERDICT" = fail ]; then
          echo "findings that fail the gate ($(params.severity)):"
          jq -r -s --arg fail "$(params.severity)" --arg deny "" -f /lib/adhar-scan/failing.jq "${have[@]}" | sort -u | head -200 || true
        fi
        OUT=.git/adhar-scan; mkdir -p "$OUT"
        cp /work/source.summary.json "$OUT/"
        [ -s /work/deps.json ] && cp /work/deps.json "$OUT/source-deps.trivy.json"
        [ -s /work/config.json ] && cp /work/config.json "$OUT/source-config.trivy.json"
        if [ "$VERDICT" = fail ] && [ "$(params.blocking)" = "true" ]; then
          echo "$(params.severity) findings in the source — gate failed." >&2
          exit 1
        fi
        echo "verdict: ${VERDICT}$([ "$(params.blocking)" = "true" ] || echo " (recorded; scan-gate decides)")"
---
# The SBOM of the image that was actually built, as CycloneDX, written into the
# workspace for cosign-attest-sbom to attach to the image (safe there: the build
# has already read the source by the time this runs). Whoever pulls the
# image can then ask what is in it and prove the answer was made at build time.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: syft-sbom
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "4"}
spec:
  description: Generate a CycloneDX SBOM for a built image.
  params:
    - {name: image, type: string}
    - {name: output, type: string, default: "sbom.cdx.json"}
  workspaces:
    - {name: source}
  results:
    - {name: components, description: "Number of components catalogued"}
  volumes:
    - name: harbor-dockercfg
      secret: {secretName: harbor-dockercfg, items: [{key: .dockerconfigjson, path: config.json}]}
    - name: harbor-ca
      secret: {secretName: harbor-core-internal-tls, items: [{key: ca.crt, path: harbor-ca.crt}]}
  steps:
    # The syft image is distroless — no shell — so it runs as command+args and
    # the bookkeeping happens in a separate step.
    - name: sbom
      image: docker.io/anchore/syft:v1.18.1
      # Measured ~430 MiB cataloguing a JVM image (2026-10-22).
      computeResources:
        requests: {cpu: 100m, memory: 384Mi}
      workingDir: $(workspaces.source.path)
      env:
        - {name: DOCKER_CONFIG, value: /harbor-creds}
        - {name: SSL_CERT_DIR, value: "/etc/ssl/certs:/etc/harbor-ca"}
        - {name: SYFT_CHECK_FOR_APP_UPDATE, value: "false"}
      volumeMounts:
        - {name: harbor-dockercfg, mountPath: /harbor-creds}
        - {name: harbor-ca, mountPath: /etc/harbor-ca}
      command: [/syft]
      args: ["registry:$(params.image)", "-o", "cyclonedx-json=$(params.output)", "-q"]
    - name: record
      image: docker.io/library/bash:5.2
      workingDir: $(workspaces.source.path)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        n=$(grep -o '"bom-ref"' "$(params.output)" | wc -l | tr -d ' ')
        echo "SBOM: $n components → $(params.output)"
        printf '%s' "$n" > "$(results.components.path)"
---
# One line per stage at the end of every run, whatever happened — the run's
# story in the PipelineRun log, and the place the Console's Deploy tab reads.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: ci-summary
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "4"}
spec:
  description: Print the outcome of every app-ci stage.
  params:
    - {name: image, type: string}
    - {name: revision, type: string}
    - {name: stages, type: string, description: "name=status pairs, space separated"}
  steps:
    - name: summary
      image: docker.io/library/bash:5.2
      script: |
        #!/usr/bin/env bash
        echo "━━━ app-ci summary ━━━"
        echo "image     $(params.image):$(params.revision)"
        for kv in $(params.stages); do printf '%-14s %s\n' "${kv%%=*}" "${kv#*=}"; done
        echo "━━━━━━━━━━━━━━━━━━━━━━"
---
# The toolchain is the PROJECT's decision; the pipeline reads it, once, here.
#
# Every build and test stage used to carry a literal — `maven:3.9-eclipse-
# temurin-25`, `node:22`, `golang:1.24`, BP_JVM_VERSION=25 — so a repository on
# Java 21 was tested on 25, and one that moved to Node 24 was tested on 22. This
# task reads what the repository declares, in the places each ecosystem makes
# that declaration, and the stages take their images and buildpack settings
# from its results. The `default*` params are the LAST resort for a repository
# that declares nothing anywhere, and are the only versions this file knows.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: detect-toolchain
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "4"}
spec:
  description: Read the JDK, Maven, Node and Go versions the repository declares.
  params:
    - {name: subdirectory, type: string, default: ""}
    - {name: defaultJdk, type: string, default: "25"}
    - {name: defaultMaven, type: string, default: "3.9"}
    # 24, not 22: the build now ships the Node the tests ran on (buildpacks-build
    # writes BP_NODE_VERSION from this result), and 24 is node-engine's own
    # default, Active LTS, and the oldest line whose bundled npm passes the image
    # scan — Node 22's npm 10.9.x carries eight HIGH findings beyond the five the
    # gate excuses in npm 11 (Trivy 0.58.1, 2026-10-28; 30-scan-verify-pipeline.yaml).
    - {name: defaultNode, type: string, default: "24"}
    - {name: defaultGo, type: string, default: "1.24"}
    - {name: defaultPython, type: string, default: "3.12"}
  workspaces:
    - {name: source}
  results:
    - {name: jdk, description: "JDK major the repository declares (project.toml BP_JVM_VERSION, .java-version, .sdkmanrc, .tool-versions, POM compiler release), else defaultJdk"}
    - {name: maven, description: "Maven version from .mvn/wrapper/maven-wrapper.properties (x.y.z), else defaultMaven (a tag family, not a pin)"}
    - {name: node, description: "Node major from project.toml BP_NODE_VERSION, .nvmrc, .node-version, .tool-versions or package.json engines.node, else defaultNode"}
    - {name: go, description: "Go minor from project.toml BP_GO_VERSION or go.mod, else defaultGo"}
    - {name: python, description: "Python minor from project.toml BP_CPYTHON_VERSION, .python-version, runtime.txt or pyproject requires-python, else defaultPython"}
    - {name: e2e, description: "true when the repository ships a Playwright suite (e2e/playwright.config.*); gates the e2e stage"}
    - {name: tolgee, description: "true when the repository carries a Tolgee CLI config (.tolgeerc, .tolgeerc.json/.yaml/.yml); gates the localise stage"}
  steps:
    - name: detect
      image: docker.io/library/bash:5.2
      workingDir: $(workspaces.source.path)/$(params.subdirectory)
      script: |
        set -euo pipefail
        major() { sed -E 's/^[^0-9]*//; s/^(1\.)?([0-9]+).*/\2/'; }
        minor() { sed -E 's/^[^0-9]*([0-9]+\.[0-9]+).*/\1/'; }
        # The value project.toml's [[build.env]] gives NAME. The buildpack's own
        # contract, so for every runtime it outranks the editor-level files,
        # exactly as BP_JVM_VERSION does below: what the image is built with is
        # what the tests run on.
        bpenv() {
          [ -f project.toml ] || return 0
          awk -v n="$1" '$0 ~ "^[[:space:]]*name[[:space:]]*=[[:space:]]*\"" n "\"" {f=1; next} f && /^[[:space:]]*value/ {gsub(/.*=[[:space:]]*"?|"?[[:space:]]*$/, ""); print; exit}' project.toml || true
        }

        jdk=""
        # project.toml [[build.env]] BP_JVM_VERSION is the buildpack's own
        # contract, so it outranks the editor-level files.
        if [ -f project.toml ]; then
          jdk=$(awk '/^[[:space:]]*name[[:space:]]*=[[:space:]]*"BP_JVM_VERSION"/{f=1;next} f&&/^[[:space:]]*value/{gsub(/.*=[[:space:]]*"?|"?[[:space:]]*$/,"");print;exit}' project.toml || true)
        fi
        [ -z "$jdk" ] && [ -f .java-version ]  && jdk=$(head -1 .java-version | major)
        [ -z "$jdk" ] && [ -f .sdkmanrc ]      && jdk=$(sed -nE 's/^java=(.*)$/\1/p' .sdkmanrc | head -1 | major)
        [ -z "$jdk" ] && [ -f .tool-versions ] && jdk=$(sed -nE 's/^java[[:space:]]+(.*)$/\1/p' .tool-versions | head -1 | major)
        [ -z "$jdk" ] && [ -f pom.xml ]        && jdk=$(sed -nE 's#.*<(java\.version|maven\.compiler\.release|maven\.compiler\.target)>[[:space:]]*([0-9.]+)[[:space:]]*</.*#\2#p' pom.xml | head -1 | major)
        src="repository"; [ -z "$jdk" ] && { jdk="$(params.defaultJdk)"; src="default — the repository declares no JDK"; }
        echo "jdk=$jdk ($src)"

        maven=""
        if [ -f .mvn/wrapper/maven-wrapper.properties ]; then
          maven=$(sed -nE 's#.*apache-maven-([0-9]+\.[0-9]+\.[0-9]+)-bin\.zip.*#\1#p' .mvn/wrapper/maven-wrapper.properties | head -1)
        fi
        src="maven wrapper"; [ -z "$maven" ] && { maven="$(params.defaultMaven)"; src="default family — no wrapper pin"; }
        echo "maven=$maven ($src)"

        node=$(bpenv BP_NODE_VERSION | major)
        [ -z "$node" ] && [ -f .nvmrc ]         && node=$(head -1 .nvmrc | major)
        [ -z "$node" ] && [ -f .node-version ] && node=$(head -1 .node-version | major)
        [ -z "$node" ] && [ -f .tool-versions ] && node=$(sed -nE 's/^nodejs[[:space:]]+(.*)$/\1/p' .tool-versions | head -1 | major)
        [ -z "$node" ] && [ -f package.json ] && node=$(sed -nE 's/.*"node"[[:space:]]*:[[:space:]]*"[^0-9]*([0-9]+).*/\1/p' package.json | head -1)
        src="repository"; [ -z "$node" ] && { node="$(params.defaultNode)"; src="default — the repository declares no Node"; }
        echo "node=$node ($src)"

        go=$(bpenv BP_GO_VERSION | minor)
        [ -z "$go" ] && [ -f go.mod ] && go=$(sed -nE 's/^go[[:space:]]+([0-9]+\.[0-9]+).*/\1/p' go.mod | head -1)
        src="repository"; [ -z "$go" ] && { go="$(params.defaultGo)"; src="default — no go.mod"; }
        echo "go=$go ($src)"

        printf '%s' "$jdk"   > "$(results.jdk.path)"
        printf '%s' "$maven" > "$(results.maven.path)"
        printf '%s' "$node"  > "$(results.node.path)"
        python=$(bpenv BP_CPYTHON_VERSION | minor)
        [ -z "$python" ] && [ -f .python-version ] && python=$(head -1 .python-version | sed -E 's/^[^0-9]*([0-9]+\.[0-9]+).*/\1/')
        [ -z "$python" ] && [ -f runtime.txt ] && python=$(sed -nE 's/^python-?([0-9]+\.[0-9]+).*/\1/p' runtime.txt | head -1)
        [ -z "$python" ] && [ -f pyproject.toml ] && python=$(sed -nE 's/^requires-python[[:space:]]*=[[:space:]]*"[^0-9]*([0-9]+\.[0-9]+).*/\1/p' pyproject.toml | head -1)
        src="repository"; [ -z "$python" ] && { python="$(params.defaultPython)"; src="default — the repository declares no Python"; }
        echo "python=$python ($src)"

        printf '%s' "$go"    > "$(results.go.path)"
        printf '%s' "$python" > "$(results.python.path)"

        # Decided HERE, not inside the e2e stage: a stage that only discovers
        # it has nothing to do still asks the scheduler for its pod — on the
        # node the workspace volume pins every task to. On 2026-10-22 that node
        # was out of memory, so my-service (a JVM service with no Playwright
        # suite) waited indefinitely for a browser pod it did not need, signing
        # never ran, and Kyverno refused the unsigned image in every
        # environment.
        e2e=false
        compgen -G "e2e/playwright.config.*" >/dev/null && e2e=true
        echo "e2e=$e2e"
        printf '%s' "$e2e" > "$(results.e2e.path)"

        # Same reasoning for localisation: decided here, so a repository
        # without Tolgee config never schedules the localise pod at all.
        # NON-EMPTY: a template rendered with localisation off still ships an
        # empty .tolgeerc (the scaffolder cannot omit a file), and that must
        # not schedule the stage either.
        tolgee=false
        for f in .tolgeerc .tolgeerc.json .tolgeerc.yaml .tolgeerc.yml; do
          if [ -s "$f" ] && grep -q '[^[:space:]]' "$f"; then tolgee=true; fi
        done
        echo "tolgee=$tolgee"
        printf '%s' "$tolgee" > "$(results.tolgee.path)"
---
# End-to-end tests in a real browser, on every build.
#
# The frontend templates ship a Playwright suite in `e2e/` whose config builds
# and serves the app's PRODUCTION build itself (webServer), so this stage needs
# no deployed environment: it proves the artifact this build produced renders,
# navigates and logs no errors — before it is signed. A repository without
# `e2e/playwright.config.*` skips it.
#
# The image's browsers are tied to its Playwright version; the templates pin
# @playwright/test to the same version (1.64.1). A project that moves its
# @playwright/test pin must move this image with it, or the browsers are not
# found.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: e2e-playwright
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "4"}
spec:
  description: Run the repository's Playwright end-to-end suite against its own production build.
  params:
    - {name: subdirectory, type: string, default: ""}
  workspaces:
    - {name: source}
  results:
    - {name: ran, description: "true when an e2e suite exists and ran"}
  steps:
    - name: e2e
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      env:
        - {name: CI, value: "true"}
        - {name: HOME, value: /workspace/e2e-home}
      # Requests sized to schedule on a busy node: every task of a run is
      # pinned to the node holding its workspace, so a large request can wait
      # there indefinitely. The limit leaves room for the build + Chromium.
      computeResources:
        requests: {cpu: 250m, memory: 512Mi}
        limits: {cpu: "2", memory: 3Gi}
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        # A private copy, like the unit tests: node_modules, the build output
        # and the reports must not land in the shared workspace.
        mkdir -p /workspace/e2esrc "$HOME"
        cp -a "$(workspaces.source.path)/$(params.subdirectory)/." /workspace/e2esrc/
        cd /workspace/e2esrc
        CFG="$(ls e2e/playwright.config.* 2>/dev/null | head -n 1 || true)"
        if [ -z "$CFG" ]; then
          echo "no e2e/playwright.config.*; nothing to run"
          printf false > "$(results.ran.path)"
          exit 0
        fi
        if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
        printf true > "$(results.ran.path)"
        if npm run 2>/dev/null | grep -q '^  test:e2e$'; then
          npm run test:e2e
        else
          npx playwright test -c "$CFG"
        fi
        echo "e2e tests passed"
---
# Localisation: Tolgee push + pull BEFORE the build, so the image bundles the
# current translations as its fallback (the running app reads newer ones at
# runtime from Tolgee with the read-only key in `<app>-tolgee`).
#
# Gated twice, both before any pod: detect-toolchain's `tolgee` result (the
# repository has a .tolgeerc) and the branch (only `main` — a pull request's
# keys are not the product's yet). Inside the pod it degrades instead of
# failing when the platform cannot help: no `<app>-tolgee-ci` Secret (the app
# does not declare `localisation.provider: tolgee`, or the platform has not
# provisioned it yet) or no answer from Tolgee leaves the build with the
# translations committed in the repository. A push or pull that Tolgee REFUSES
# fails the task — that is a broken configuration, not an outage.
#
# push --force-mode KEEP: new keys (and translations for keys Tolgee does not
# have) are created; an existing translation is never overwritten from the
# repository. The CLI flags --api-url/--project-id override whatever the
# repository's .tolgeerc says, and the key comes from the Secret through the
# environment (TOLGEE_API_KEY), never from a file or the log.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: tolgee-sync
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "4"}
spec:
  description: Push new localisation keys to Tolgee and pull the current translations into the checkout.
  params:
    - {name: app, type: string, description: "The application (= repository) name; its Secret is <app>-tolgee-ci"}
    # The Node major the REPOSITORY declares (detect-toolchain), like every
    # other stage: the pipeline pins no runtime. The CLI needs Node >= 18.
    - {name: nodeVersion, type: string, default: "22"}
    - {name: subdirectory, type: string, default: ""}
  workspaces:
    - {name: source}
  results:
    - {name: synced, description: "true when keys were pushed and translations pulled"}
  steps:
    - name: sync
      image: docker.io/library/node:$(params.nodeVersion)-bookworm-slim
      workingDir: $(workspaces.source.path)/$(params.subdirectory)
      env:
        # The CLI itself IS pinned: it is the platform's tool, not the project's.
        - {name: TOLGEE_CLI_VERSION, value: "2.21.0"}
        - {name: HOME, value: /tmp/tolgee-home}
        - {name: npm_config_cache, value: /tmp/npm-cache}
        - {name: CI, value: "true"}
        - name: TOLGEE_API_URL
          valueFrom: {secretKeyRef: {name: $(params.app)-tolgee-ci, key: api-url, optional: true}}
        - name: TOLGEE_PROJECT_ID
          valueFrom: {secretKeyRef: {name: $(params.app)-tolgee-ci, key: project-id, optional: true}}
        - name: TOLGEE_API_KEY
          valueFrom: {secretKeyRef: {name: $(params.app)-tolgee-ci, key: api-key, optional: true}}
      computeResources:
        requests: {cpu: 100m, memory: 256Mi}
        limits: {memory: 1Gi}
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        skip() { echo "$1"; printf false > "$(results.synced.path)"; exit 0; }
        cfg=""
        for f in .tolgeerc .tolgeerc.json .tolgeerc.yaml .tolgeerc.yml; do
          if [ -s "$f" ] && grep -q '[^[:space:]]' "$f"; then cfg="$f"; break; fi
        done
        [ -n "$cfg" ] || skip "no .tolgeerc; nothing to localise"
        if [ -z "${TOLGEE_API_URL:-}" ] || [ -z "${TOLGEE_PROJECT_ID:-}" ] || [ -z "${TOLGEE_API_KEY:-}" ]; then
          skip "Secret $(params.app)-tolgee-ci is missing or incomplete (does .adhar/app.yaml declare localisation.provider: tolgee?); building with the translations committed in the repository"
        fi
        if ! node -e 'fetch(process.env.TOLGEE_API_URL + "/api/public/configuration").then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))'; then
          skip "WARNING: Tolgee at ${TOLGEE_API_URL} does not answer; building with the translations committed in the repository"
        fi
        mkdir -p "$HOME"
        npm install --prefix /tmp/tolgee-cli --no-audit --no-fund --loglevel=error "@tolgee/cli@${TOLGEE_CLI_VERSION}"
        tolgee() { /tmp/tolgee-cli/node_modules/.bin/tolgee --api-url "$TOLGEE_API_URL" --project-id "$TOLGEE_PROJECT_ID" "$@"; }
        owner="$(stat -c '%u:%g' .)"
        echo "tolgee push ($cfg, project ${TOLGEE_PROJECT_ID}): new keys only, existing translations kept"
        tolgee push --force-mode KEEP
        echo "tolgee pull into the path $cfg declares"
        tolgee pull
        # The pulled files must belong to whoever owns the checkout, or a later
        # step running as another user cannot touch them.
        chown -R "$owner" . 2>/dev/null || true
        printf true > "$(results.synced.path)"
