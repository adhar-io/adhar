# Per-application dev → test → prod promotion: Argo Rollouts + Kargo + Argo CD.
#
# This is the half of the paved road that was missing. `app-ci` ended at "a
# signed, scanned, attested image is in Harbor and the app repo's manifest was
# pinned to it" — ONE environment, a plain Deployment, and no promotion. The
# chain now continues:
#
#   git push
#     └─> app-ci            build → test → gitleaks → trivy(source+image)
#                           → SBOM → cosign sign → attest → verify
#                           → image + digest in Harbor
#           └─> Kargo Warehouse  (subscribes to the Harbor repo) → Freight
#                 ├─> Stage <app>-dev    AUTO   → sets the digest in deploy/envs/dev
#                 │                             → git push → Argo CD syncs → Rollout
#                 ├─> Stage <app>-test   AUTO   (once dev's Rollout is Healthy)
#                 └─> Stage <app>-prod   MANUAL → a Release (ADR-0026)
#
# WHO OWNS THE OBJECTS (ADR-0026). Everything in the cluster — the three Argo CD
# Applications, the Kargo Warehouse and Stages — is composed from ONE
# `Application` by the control plane; the `app-env-register` Task below
# applies that single object and nothing else. The project it belongs to owns
# the environments (namespaces, quotas, team access), the Kargo Project and its
# promotion policy, and the Argo CD AppProject; applications only name their
# project. Until 2026-10-04 this Task applied ~12 raw objects with kubectl while
# the Application composition created an overlapping set — two writers
# for one graph, with namespaces that disagreed (`<app>-<env>` vs the project's).
#
# WHY KARGO IS THE ONLY WRITER PAST dev. Two systems committing to the same
# files is a conflict generator, so app-ci's `gitops-writeback` pins ONLY the
# dev overlay; every promotion after that is a Kargo commit. Git stays the only
# write path (ADR-0004) — a promotion is a commit Argo CD then syncs, never a
# `kubectl` call against a cluster.
#
# WHY THE OVERLAYS LIVE IN THE APP'S OWN REPO. A team owns its deployment
# config next to its code, and `gitops-writeback` already looks under `deploy/`.
#
# NAMESPACES come from the project: `app-env-scaffold` reads
# `Project.status.environments[]` and writes each overlay's
# `namespace:` from it. The platform's own project `adhar` maps dev/test/prod to
# the namespaces of the same name that `adhar up` creates.
---
# ---------------------------------------------------------------------------
# 1. Materialise the three-environment overlay into the app's repository.
# ---------------------------------------------------------------------------
# Idempotent: an app that already has deploy/envs is left completely alone, so
# this is safe to run on every onboard and safe to re-run on an existing app.
#
# It writes a kustomize base plus three overlays. The overlay is the unit Kargo
# edits — `kustomize-set-image` rewrites the `images:` block of ONE
# kustomization.yaml, so a promotion touches exactly one file in one directory
# and can never disturb another environment's replica count or hostname.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: app-env-scaffold
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "4"}
spec:
  description: Write the dev/test/prod kustomize overlays into an application repository, one per environment of the application's project.
  params:
    - {name: repo-name, type: string}
    - {name: port, type: string, default: "8080"}
    - {name: project, type: string, default: "adhar", description: "The Project the application belongs to; its status.environments decides the overlay namespaces."}
  steps:
    - name: scaffold
      # alpine/k8s carries git AND kubectl: the namespaces are read off the project.
      image: alpine/k8s:1.31.1
      env:
        - {name: GIT_USER, valueFrom: {secretKeyRef: {name: gitea-ci-creds, key: username}}}
        - {name: GIT_PASS, valueFrom: {secretKeyRef: {name: gitea-ci-creds, key: password}}}
      script: |
        #!/bin/sh
        set -eu
        APP="$(params.repo-name)"
        PORT="$(params.port)"
        PROJECT="$(params.project)"
        # Where each environment lives is the project's call, published on its
        # status by the control plane. Refuse to guess: a wrong namespace here is
        # an overlay that Argo CD can never deploy under the project's AppProject.
        ENVS=$(kubectl get project "${PROJECT}" -n adhar-system -o jsonpath='{range .status.environments[*]}{.name}={.namespace}{"\n"}{end}')
        [ -n "$ENVS" ] || { echo "Project ${PROJECT} has not published its environments yet"; exit 1; }
        REGISTRY=$(kubectl get project "${PROJECT}" -n adhar-system -o jsonpath='{.status.imageRegistry}')
        REGISTRY="${REGISTRY:-harbor-core.adhar-system.svc.cluster.local/library}"
        # Basic auth as a header, not in the URL: a rotated password can hold any
        # byte and alpine/git has nothing to URL-encode it with. Same reasoning as
        # gitops-writeback.
        AUTH=$(printf '%s:%s' "$GIT_USER" "$GIT_PASS" | base64 | tr -d '\n')
        git config --global http.extraHeader "Authorization: Basic ${AUTH}"
        cd /tmp && rm -rf work
        git clone --depth 1 "http://gitea-http.adhar-system.svc.cluster.local:3000/adhar/${APP}.git" work
        cd work

        if [ -d deploy/envs ]; then
          echo "deploy/envs already exists — leaving this repository's overlays alone"
          exit 0
        fi

        mkdir -p deploy/base deploy/envs

        # The workload is an Argo Rollout, not a Deployment: a progressive
        # delivery strategy is the entire point of having a test and a prod
        # environment, and a Deployment can only roll all-or-nothing.
        cat > deploy/base/rollout.yaml <<EOF
        apiVersion: argoproj.io/v1alpha1
        kind: Rollout
        metadata:
          name: ${APP}
          labels: {app: ${APP}, adhar.io/supply-chain: "true"}
        spec:
          replicas: 1
          revisionHistoryLimit: 3
          selector:
            matchLabels: {app: ${APP}}
          template:
            metadata:
              labels: {app: ${APP}}
            spec:
              enableServiceLinks: false
              imagePullSecrets: [{name: harbor-push}]
              containers:
                - name: app
                  # The tag here is a PLACEHOLDER. Every overlay pins a digest,
                  # and nothing is ever deployed from this base directly.
                  image: ${REGISTRY}/${APP}:latest
                  ports: [{containerPort: ${PORT}}]
                  resources:
                    requests: {cpu: 50m, memory: 128Mi}
                    limits: {memory: 512Mi}
                  readinessProbe:
                    httpGet: {path: /, port: ${PORT}}
                    initialDelaySeconds: 10
                    periodSeconds: 10
                    # Never 1s — a loaded node fails a healthy probe and the
                    # platform forbids it outright (TestNoProbeShipsAOneSecondTimeout).
                    timeoutSeconds: 5
          strategy:
            canary:
              steps:
                - setWeight: 25
                - pause: {duration: 30s}
                - setWeight: 50
                - pause: {duration: 30s}
        EOF

        cat > deploy/base/service.yaml <<EOF
        apiVersion: v1
        kind: Service
        metadata:
          name: ${APP}
          labels: {app: ${APP}}
        spec:
          selector: {app: ${APP}}
          ports: [{name: http, port: 80, targetPort: ${PORT}}]
        EOF

        cat > deploy/base/kustomization.yaml <<EOF
        apiVersion: kustomize.config.k8s.io/v1beta1
        kind: Kustomization
        resources:
          - rollout.yaml
          - service.yaml
        EOF

        # One overlay per environment. The `images:` block is what Kargo rewrites.
        # dev starts on :latest only until the first promotion replaces it with a
        # digest; after that no environment ever references a mutable tag.
        for pair in $ENVS; do
          env="${pair%%=*}"; ns="${pair#*=}"
          mkdir -p "deploy/envs/${env}"
          case "$env" in
            dev)  replicas=1; weight_pause=10s ;;
            test) replicas=1; weight_pause=30s ;;
            prod) replicas=2; weight_pause=120s ;;
            *)    replicas=1; weight_pause=30s ;;
          esac
          cat > "deploy/envs/${env}/kustomization.yaml" <<EOF
        apiVersion: kustomize.config.k8s.io/v1beta1
        kind: Kustomization
        namespace: ${ns}
        resources:
          - ../../base
        images:
          - name: ${REGISTRY}/${APP}
            newTag: latest
        patches:
          - target: {kind: Rollout, name: ${APP}}
            patch: |-
              - op: replace
                path: /spec/replicas
                value: ${replicas}
              - op: replace
                path: /spec/strategy/canary/steps/1/pause/duration
                value: ${weight_pause}
              - op: replace
                path: /spec/strategy/canary/steps/3/pause/duration
                value: ${weight_pause}
        EOF
        done

        git config user.name  "adhar-ci"
        git config user.email "ci@adhar.io"
        git add deploy
        git commit -m "chore(adhar): add dev/test/prod overlays with Argo Rollouts

        Generated by the Adhar paved road (app-env-scaffold). Kargo promotes a
        digest into deploy/envs/<env>/kustomization.yaml; Argo CD syncs each
        environment into the <app>-<env> namespace."
        git push origin HEAD:main
        echo "wrote deploy/base + deploy/envs/{$(echo "$ENVS" | cut -d= -f1 | paste -sd, -)} to adhar/${APP} (project ${PROJECT})"
---
# What the onboarding pipeline (ServiceAccount adhar-pipeline) may do in the
# control plane: read projects (to learn where environments live) and write
# applications. Nothing cluster-wide — the XRs are namespaced in adhar-system,
# and everything they create is the control plane's job, with its own RBAC.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: app-env-register
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "4"}
rules:
  - apiGroups: ["platform.adhar.io"]
    resources: ["projects"]
    verbs: ["get", "list"]
  - apiGroups: ["platform.adhar.io"]
    resources: ["applications"]
    verbs: ["get", "list", "create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: app-env-register
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "4"}
subjects: [{kind: ServiceAccount, name: adhar-pipeline, namespace: adhar-system}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: app-env-register}
---
# ---------------------------------------------------------------------------
# 2. Register the application in the cluster: ONE object.
# ---------------------------------------------------------------------------
# The Application is the application. Its composition (controlplane
# compositions/apps/argocd-multienv.yaml) observes the project, then creates an
# Argo CD Application per environment under the project's AppProject, the Kargo
# Warehouse for the image repository and one Kargo Stage per environment chained
# in the project's order. Promotion policy and credentials belong to the project.
#
# Applied with kubectl rather than committed, matching how `scaffold-service`
# already onboards an app: the object is derived entirely from the app name and
# its project, so there is nothing a human would review in a diff. It is
# idempotent — re-registering an application re-applies the same spec.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: app-env-register
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "4"}
spec:
  description: Create (or update) the Application that composes an app's environments, Argo CD Applications and Kargo promotion pipeline.
  params:
    - {name: repo-name, type: string}
    - {name: project, type: string, default: "adhar"}
  steps:
    - name: register
      image: alpine/k8s:1.31.1
      script: |
        #!/bin/bash
        set -euo pipefail
        APP="$(params.repo-name)"
        PROJECT="$(params.project)"
        GITEA="http://gitea-http.adhar-system.svc.cluster.local:3000/adhar/${APP}"
        kubectl get project "${PROJECT}" -n adhar-system >/dev/null
        kubectl apply -f - <<YAML
        apiVersion: platform.adhar.io/v1alpha1
        kind: Application
        metadata:
          name: ${APP}
          namespace: adhar-system
          labels:
            adhar.io/project: ${PROJECT}
            adhar.io/application: ${APP}
            app.kubernetes.io/managed-by: adhar-paved-road
        spec:
          parameters:
            project: ${PROJECT}
            displayName: ${APP}
            source:
              repoURL: ${GITEA}
              path: deploy
              targetRevision: main
        YAML
        echo "registered ${APP} in project ${PROJECT}: the control plane now composes its environments, Argo CD Applications and Kargo pipeline"
        echo "dev and test promote automatically; prod needs a Release (or: kargo promote --project ${PROJECT} --stage ${APP}-prod --freight <id>)"
---
# ---------------------------------------------------------------------------
# 3. Onboarding pipeline: overlays in Git, then environments in the cluster.
# ---------------------------------------------------------------------------
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: app-onboard-environments
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "4"}
spec:
  description: Give an existing application the full dev → test → prod promotion chain inside its project.
  params:
    - {name: repo-name, type: string}
    - {name: port, type: string, default: "8080"}
    - {name: project, type: string, default: "adhar"}
  tasks:
    - name: scaffold
      retries: 2
      taskRef: {name: app-env-scaffold}
      params:
        - {name: repo-name, value: "$(params.repo-name)"}
        - {name: port, value: "$(params.port)"}
        - {name: project, value: "$(params.project)"}
    - name: register
      retries: 2
      runAfter: [scaffold]
      taskRef: {name: app-env-register}
      params:
        - {name: repo-name, value: "$(params.repo-name)"}
        - {name: project, value: "$(params.project)"}
