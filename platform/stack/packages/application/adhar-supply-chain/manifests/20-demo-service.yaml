# Reference service — proves the whole build leg end to end.
#
# kpack watches the git source, builds it with the adhar-builder (buildpacks,
# no Dockerfile), pushes the image to Harbor, and — because adhar-pipeline carries
# the cosign-key secret — signs it. The signed digest is what 30-scan-deploy and
# 40-verify-images act on. This is exactly the shape 50-service-template stamps
# out for a new service.
apiVersion: kpack.io/v1alpha2
kind: Image
metadata:
  name: sample-app
  namespace: adhar-system
  labels:
    adhar.io/supply-chain: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  tag: harbor-core.adhar-system.svc.cluster.local/library/sample-app
  serviceAccountName: adhar-pipeline
  builder:
    name: adhar-builder
    kind: ClusterBuilder
  cache:
    volume:
      size: "1Gi"
  source:
    git:
      url: https://github.com/paketo-buildpacks/samples
      revision: main
    subPath: go/mod
  build:
    env:
      - name: BP_GO_TARGETS
        value: "./"
