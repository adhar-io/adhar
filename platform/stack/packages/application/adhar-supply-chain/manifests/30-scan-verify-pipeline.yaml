# Tekton quality gate — runs against the signed image kpack just pushed.
#
#   trivy-scan  → fail the run on HIGH/CRITICAL CVEs
#   cosign-verify → confirm the image carries a valid signature from our key
#   promote     → mark the digest ready; Kargo (application/kargo) then promotes
#                 it dev → staging → prod over the environments repo, and ArgoCD
#                 syncs. Deployment admission is gated by 40-verify-images.
#
# Harbor is adhar-controlplane HTTP, so trivy/cosign are told the registry is non-TLS and
# given the same admin credential the build SA uses.
---
# The ONE excused finding class: Go stdlib CVEs in buildpack-provided binaries.
#
# Every buildpack-built image carries several Go binaries the platform did not
# write — the CNB lifecycle launcher and one exec.d helper per buildpack
# (bellsoft-liberica, ca-certificates, spring-boot, nginx, ...). They are libpak
# programs that read environment variables, compute JAVA_TOOL_OPTIONS or a
# config file, print it and exit. They never bind a socket, serve a file,
# negotiate HTTP/2 or perform a TLS handshake, so the Go stdlib CVEs listed below
# — server-side net/http and crypto/tls paths, plus one crypto/x509 chain
# verification fix that matters only to a TLS client — are not reachable in them.
# Paketo documents this class as expected scanner noise in discussion #401.
#
# They are also not fixable today. Every Paketo release pins an exact patch in
# go.mod (`go 1.27.1`) and its release workflow honours that pin, and Go 1.27.2
# was published TWO DAYS AFTER the newest buildpack release, so no published
# version can contain the fix. Measured on a React app image: 12 findings, all
# HIGH, zero CRITICAL, every one of them these three CVEs in four different Go
# binaries. The gate was refusing an image whose only defect nobody could repair.
#
# Scoped by PURL, not by path, because one of the groups cannot be reached by
# path: it comes from the CNB-provided SBOM baked into the image, and Trivy
# reports it with an EMPTY target. Trivy 0.58.1 offers no flag to ignore an
# in-image SBOM, so `pkg:golang/stdlib` is the narrowest selector available.
#
# The cost, stated plainly: an application's OWN Go binary carrying one of these
# three CVEs would also be excused. That is why every entry has `expired_at` —
# the upstream fix is days away, and when the date passes the gate starts
# failing again and forces a re-read rather than silently living for ever.
#
# Nothing else is relaxed. Severity stays HIGH,CRITICAL and the gate still exits
# 1. Verified against two real images: the React app goes from exit 1 to exit 0
# with zero findings left, while the Java service still exits 1 on its nine
# CRITICAL dependency vulnerabilities, which are the platform's to fix and are
# untouched by this.
apiVersion: v1
kind: ConfigMap
metadata:
  name: trivy-buildpack-exceptions
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "4"}
data:
  ignore.yaml: |
    vulnerabilities:
      - id: CVE-2026-78667
        purls: ["pkg:golang/stdlib"]
        statement: >-
          net/http Range-header DoS. Buildpack exec.d helpers and the CNB
          launcher serve no HTTP; the vulnerable path is unreachable. No Paketo
          release is built with the patched Go yet.
        expired_at: 2026-11-30
      - id: CVE-2026-78669
        # Also golang.org/x/net, not only stdlib: the bellsoft-liberica helper
        # vendors x/net v0.59.0 and Trivy reports that as its own package, so a
        # stdlib-only scope left one finding behind and the gate stayed red with
        # everything else already clear.
        purls: ["pkg:golang/stdlib", "pkg:golang/golang.org/x/net"]
        statement: >-
          net/http and x/net HTTP/2 SETTINGS DoS. Same buildpack binaries, which
          serve no HTTP/2. Fixed in Go 1.27.2 and x/net 0.60.0, neither of which
          any published Paketo buildpack is built with yet.
        expired_at: 2026-11-30
      - id: CVE-2026-97031
        purls: ["pkg:golang/stdlib"]
        statement: >-
          crypto/tls ECH DoS. Same binaries, no TLS handshake performed.
        expired_at: 2026-11-30
      - id: CVE-2026-111943
        # GO-2026-6809. Unlike the three above, govulncheck -mode=binary DOES
        # find the affected symbol (x509.Certificate.Verify) linked into the
        # ca-certificates 3.14.1 helper, so this rests on behaviour rather than
        # on the symbol being absent: the fix is a denylist of compromised
        # intermediate CAs consulted when a TLS client verifies a server's
        # chain, and these helpers open no connections at all (2026-10-21).
        purls: ["pkg:golang/stdlib"]
        statement: >-
          crypto/x509 distrust of compromised intermediate certificates in
          Certificate.Verify. It matters only to a program verifying a remote
          TLS chain; the buildpack exec.d helpers make no network connections.
          Fixed in Go 1.27.3, which no published Paketo buildpack is built with.
        expired_at: 2026-11-30
---
# Image vulnerability scan.
#
# Two halves: `scan` MEASURES (one Trivy run, every severity, JSON, waived
# findings kept under ExperimentalModifiedFindings) and `evaluate` JUDGES it
# against the severity threshold and the licence deny-list. A Trivy error —
# a registry or DB-download fault — fails `scan`, so task retries still cover
# infrastructure; findings are never retried.
#
# Standalone (supply-chain-gate, build-buildpacks, build-dockerfile, chainguard)
# the defaults keep the original contract exactly: HIGH,CRITICAL fail the task,
# the buildpack exceptions are the only ignore file, nothing else is waived.
#
# app-ci binds the `reports` workspace and passes blocking=false plus the
# project policy resolved by scan-policy (74-scan-governance.yaml): the task
# then records its verdict and the report, and scan-gate decides.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: trivy-scan
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "4"}
spec:
  params:
    - {name: image, type: string, description: "fully qualified image ref (with digest)"}
    # The severities that FAIL; the report always carries all of them.
    - {name: severity, type: string, default: "HIGH,CRITICAL"}
    # 20m, matching source-scan and the library release: this budget has to cover
    # the 120 MiB vulnerability-DB download as well as the scan, and a DB fetch
    # measured at 4m20s on a live cluster.
    - {name: scanTimeout, type: string, default: "20m"}
    # "false": record the verdict and pass; scan-gate judges (app-ci only).
    - {name: blocking, type: string, default: "true"}
    # Policy knobs, each defaulting to the original behaviour.
    - {name: scanners, type: string, default: "vuln"}
    - {name: ignoreUnfixed, type: string, default: "false"}
    - {name: licenseDeny, type: string, default: ""}
    - {name: licenseWarn, type: string, default: ""}
  workspaces:
    # Where scan-policy left the merged ignore file and where the report is
    # published (<workspace>/.git/adhar-scan/). Unbound outside app-ci.
    - {name: reports, optional: true}
  results:
    - {name: verdict, description: "pass or fail against the severity threshold and licence deny-list"}
    - {name: summary, description: "Counts as compact JSON (adhar-scan-lib evaluate.jq)"}
    - {name: digest, description: "sha256 digest of the image that was scanned"}
  steps:
    - name: scan
      image: docker.io/aquasec/trivy:0.58.1
      # Measured ~250 MiB / ~0.6 CPU per image scan (2026-10-22); the 64Mi
      # namespace default left it eviction-first on a full node.
      computeResources:
        requests: {cpu: 250m, memory: 256Mi}
      env:
        # Harbor serves HTTPS with its own internal CA. TRIVY_NON_SSL=true used
        # to be set here, which forced plaintext against a TLS-only registry and
        # failed every scan; point Go's trust store at the CA instead.
        - {name: SSL_CERT_DIR, value: "/etc/ssl/certs:/etc/harbor-ca"}
        - {name: TRIVY_USERNAME, value: "admin"}
        - {name: TRIVY_PASSWORD, value: "Harbor12345"}
        # Trivy derives its cache dir from $HOME, which is `/` in this image.
        # Without these the DB downloads and THEN fails on
        # "mkdir /.cache: permission denied", which reads like a network fault.
        # The other two scan tasks already set them; this one was the outlier.
        - {name: HOME, value: /tmp}
        - {name: TRIVY_CACHE_DIR, value: /tmp/trivy-cache}
      script: |
        #!/bin/sh
        set -e
        # The buildpack exceptions, unless scan-policy merged them with the
        # approved waivers into one file for this build.
        IGNORE=/etc/trivy/ignore.yaml
        if [ "$(workspaces.reports.bound)" = "true" ] && [ -s "$(workspaces.reports.path)/.git/adhar-scan/trivyignore.yaml" ]; then
          IGNORE="$(workspaces.reports.path)/.git/adhar-scan/trivyignore.yaml"
        fi
        UNFIXED=""
        [ "$(params.ignoreUnfixed)" = "true" ] && UNFIXED="--ignore-unfixed"
        echo "Scanning $(params.image) ($(params.scanners)); ignore file ${IGNORE}"
        date -u +%Y-%m-%dT%H:%M:%SZ > /work/started
        # No --severity and no --exit-code here: the report holds everything,
        # and `evaluate` applies the threshold. A non-zero exit is a Trivy
        # error, which the task's retries exist for.
        # shellcheck disable=SC2086
        trivy image --scanners "$(params.scanners)" --ignorefile "$IGNORE" --show-suppressed $UNFIXED \
          --format json --output /work/image.trivy.json \
          --no-progress --timeout "$(params.scanTimeout)" "$(params.image)"
        date -u +%Y-%m-%dT%H:%M:%SZ > /work/finished
        trivy --version | sed -n 's/^Version: //p' > /work/version
      volumeMounts:
        - {name: harbor-ca, mountPath: /etc/harbor-ca, readOnly: true}
        - {name: trivy-exceptions, mountPath: /etc/trivy, readOnly: true}
        - {name: work, mountPath: /work}
    - name: evaluate
      image: alpine/k8s:1.31.1
      script: |
        #!/bin/bash
        set -euo pipefail
        R=/work/image.trivy.json
        DIGEST=$(jq -r '((.Metadata.RepoDigests // [])[0] // "") | sub("^.*@"; "")' "$R")
        printf '%s' "$DIGEST" > "$(results.digest.path)"
        # Digest-scoped waivers (app-ci): only in waivers.json, because Trivy
        # cannot scope an ignore entry to a digest. Applied before judging, so
        # the verdict, the report and the OpenVEX all see them as waived.
        WAIVERS="$(workspaces.reports.path)/.git/adhar-scan/waivers.json"
        if [ "$(workspaces.reports.bound)" = "true" ] && [ -s "$WAIVERS" ]; then
          if jq --slurpfile wf "$WAIVERS" --argjson now "$(date +%s)" -f /lib/adhar-scan/digest-waivers.jq "$R" > /work/dw.json; then
            mv /work/dw.json "$R"
          else
            echo "WARNING: waivers.json could not be applied; digest-scoped waivers are ignored" >&2
          fi
        fi
        jq -c -s --arg fail "$(params.severity)" --arg deny "$(params.licenseDeny)" --arg warn "$(params.licenseWarn)" \
          -f /lib/adhar-scan/evaluate.jq "$R" > /work/image.summary.json
        VERDICT=$(jq -r .verdict /work/image.summary.json)
        printf '%s' "$VERDICT" > "$(results.verdict.path)"
        jq -c 'del(.verdict)' /work/image.summary.json | tr -d '\n' > "$(results.summary.path)"
        echo "summary: $(cat /work/image.summary.json)"
        if [ "$VERDICT" = fail ]; then
          echo "findings that fail the gate ($(params.severity)$([ -n "$(params.licenseDeny)" ] && echo "; licences denied: $(params.licenseDeny)")):"
          jq -r -s --arg fail "$(params.severity)" --arg deny "$(params.licenseDeny)" -f /lib/adhar-scan/failing.jq "$R" | sort -u | head -200 || true
        fi
        if [ "$(workspaces.reports.bound)" = "true" ]; then
          OUT="$(workspaces.reports.path)/.git/adhar-scan"; mkdir -p "$OUT"
          cp "$R" /work/image.summary.json "$OUT/"
          jq -n --arg s "$(cat /work/started)" --arg f "$(cat /work/finished)" --arg v "$(cat /work/version)" \
            --arg run "$(context.taskRun.name)" --arg image "$(params.image)" \
            '{started: $s, finished: $f, trivyVersion: $v, taskRun: $run, image: $image}' > "$OUT/image.meta.json"
        fi
        if [ "$VERDICT" = fail ] && [ "$(params.blocking)" = "true" ]; then
          echo "$(params.severity) findings — gate failed." >&2
          exit 1
        fi
        echo "verdict: ${VERDICT}$([ "$(params.blocking)" = "true" ] || echo " (recorded; scan-gate decides)")"
      volumeMounts:
        - {name: work, mountPath: /work}
        - {name: scan-lib, mountPath: /lib/adhar-scan, readOnly: true}
  volumes:
    - name: harbor-ca
      secret:
        secretName: harbor-core-internal-tls
        items: [{key: ca.crt, path: harbor-ca.crt}]
    - name: trivy-exceptions
      configMap:
        name: trivy-buildpack-exceptions
    - name: scan-lib
      configMap:
        name: adhar-scan-lib
    - name: work
      emptyDir: {}
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cosign-verify
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "4"}
spec:
  params:
    - {name: image, type: string}
  steps:
    - name: verify
      image: ghcr.io/sigstore/cosign/cosign:v2.4.1
      env:
        - {name: COSIGN_PASSWORD, value: adhar}
        - {name: COSIGN_REPOSITORY, value: "harbor-core.adhar-system.svc.cluster.local/library/sample-app"}
        # Same HTTPS-with-private-CA story as cosign-sign / trivy-scan.
        - {name: SSL_CERT_DIR, value: "/etc/ssl/certs:/etc/harbor-ca"}
      args:
        - verify
        - --key=k8s://adhar-system/cosign-key
        - --insecure-ignore-tlog=true
        - "$(params.image)"
      volumeMounts:
        - {name: harbor-ca, mountPath: /etc/harbor-ca, readOnly: true}
  volumes:
    - name: harbor-ca
      secret:
        secretName: harbor-core-internal-tls
        items: [{key: ca.crt, path: harbor-ca.crt}]
---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: supply-chain-gate
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "4"}
spec:
  params:
    - {name: image, type: string, description: "signed image ref to scan + verify"}
  tasks:
    - name: scan
      retries: 2
      taskRef: {name: trivy-scan}
      params: [{name: image, value: "$(params.image)"}]
    - name: verify
      retries: 2
      runAfter: [scan]
      taskRef: {name: cosign-verify}
      params: [{name: image, value: "$(params.image)"}]
