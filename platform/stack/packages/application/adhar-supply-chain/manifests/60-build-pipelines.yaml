# Reusable Tekton build pipeline templates for application builds.
#
# Two ready-to-run pipelines, both ending in a signed + scanned image in Harbor:
#   * build-buildpacks  — no Dockerfile; Cloud Native Buildpacks auto-detect the
#                         language (Node/Go/Java/Python). Tekton-native alt to kpack.
#   * build-dockerfile  — Kaniko builds from a Dockerfile (the case kpack can't do).
#
# Both reuse the supply-chain identity (adhar-pipeline SA + cosign-key from
# 00-foundation.yaml) and the trivy-scan/cosign-verify tasks from 30. Harbor is
# in-cluster HTTP, so registry access is --insecure/--allow-http throughout.
#
# Run one (a shared workspace PVC is created per run):
#   kubectl create -n adhar-system -f - <<'EOF'
#   apiVersion: tekton.dev/v1
#   kind: PipelineRun
#   metadata: {generateName: build-}
#   spec:
#     pipelineRef: {name: build-buildpacks}     # or build-dockerfile
#     taskRunTemplate: {serviceAccountName: adhar-pipeline}
#     params:
#       - {name: git-url, value: https://github.com/paketo-buildpacks/samples}
#       - {name: revision, value: main}
#       - {name: subdirectory, value: go/mod}   # build-dockerfile: path to Dockerfile dir
#       - {name: image, value: harbor-core.adhar-system.svc.cluster.local/library/myapp}
#     workspaces:
#       - name: shared
#         volumeClaimTemplate:
#           spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 1Gi}}}
#   EOF
---
# Docker config for Tekton build tasks that push to Harbor (auth = admin:Harbor12345).
apiVersion: v1
kind: Secret
metadata:
  name: harbor-dockercfg
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "4"}
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {"auths":{"harbor-core.adhar-system.svc.cluster.local":{"username":"admin","password":"Harbor12345","auth":"YWRtaW46SGFyYm9yMTIzNDU="}}}
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: git-clone
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "4"}
spec:
  params:
    - {name: url, type: string}
    - {name: revision, type: string, default: main}
    - {name: subdirectory, type: string, default: ""}
  workspaces:
    - {name: output}
  results:
    - {name: commit, description: "the cloned commit SHA"}
  steps:
    - name: clone
      image: alpine/git:2.45.2
      # Gitea requires sign-in for every read (REQUIRE_SIGNIN_VIEW), so the
      # in-cluster repos are cloned with the CI credential. It is sent ONLY to
      # the in-cluster Gitea hosts — never to GitHub or any other URL a
      # pipeline is pointed at.
      env:
        - name: GIT_USER
          valueFrom: {secretKeyRef: {name: gitea-ci-creds, key: username, optional: true}}
        - name: GIT_PASS
          valueFrom: {secretKeyRef: {name: gitea-ci-creds, key: password, optional: true}}
      script: |
        #!/bin/sh
        set -e
        DIR="$(workspaces.output.path)"
        rm -rf "${DIR:?}/"* 2>/dev/null || true
        URL="$(params.url)"
        AUTH=""
        case "$URL" in
          http://gitea-http.adhar-system.svc.cluster.local:3000/*|http://gitea-http:3000/*|http://gitea-argocd.adhar-system.svc.cluster.local:3000/*)
            if [ -n "${GIT_USER:-}" ]; then
              AUTH="Authorization: Basic $(printf '%s:%s' "$GIT_USER" "$GIT_PASS" | base64 | tr -d '\n')"
            fi ;;
        esac
        if [ -n "$AUTH" ]; then
          git -c http.extraHeader="$AUTH" clone --depth 1 -b "$(params.revision)" "$URL" "$DIR"
        else
          git clone --depth 1 -b "$(params.revision)" "$URL" "$DIR"
        fi
        git -C "$DIR" rev-parse HEAD | tr -d '\n' > "$(results.commit.path)"
        echo "cloned $(params.url)@$(params.revision)"
---
# Cloud Native Buildpacks build (creator lifecycle) → push to Harbor. No Dockerfile.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: buildpacks-build
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "4"}
spec:
  params:
    - {name: image, type: string}
    - {name: subdirectory, type: string, default: ""}
    - {name: builder, type: string, default: "paketobuildpacks/builder-jammy-base:latest"}
    # Second tag pushed alongside :latest, so every build is addressable by the
    # exact commit it came from. Per-PR preview environments (ADR-0017) deploy
    # <image>:<PR head sha>, which only exists because of this. Defaults to
    # "latest" so a bare PipelineRun behaves exactly as before.
    - {name: extra-tag, type: string, default: "latest"}
    # npm scopes that resolve from the PLATFORM's registry rather than npmjs.
    # Space-separated. See the .npmrc injection in the prepare step below.
    - {name: platformNpmScopes, type: string, default: "@adhar-ui @adhar-kit"}
    # The JDK a Maven build gets when the repository does not ask for one. 25
    # because adhar-kit's parent POM enforces RequireJavaVersion [25,) and the
    # buildpack's own default is 21; a parameter rather than a literal so a
    # cluster whose libraries move can follow without editing the Task script.
    - {name: defaultJvmVersion, type: string, default: "25"}
    # What the repository itself declares, read once by detect-toolchain and
    # handed in here: the JDK major (.java-version / .sdkmanrc /
    # .tool-versions / the POM's compiler release) and the Maven version its
    # wrapper pins. Empty when the repository says nothing. The pipeline must
    # not decide a project's toolchain; it only carries the project's own
    # decision to the buildpack.
    - {name: jdkVersion, type: string, default: ""}
    - {name: mavenVersion, type: string, default: ""}
    - {name: nodeVersion, type: string, default: ""}
    - {name: goVersion, type: string, default: ""}
    - {name: pythonVersion, type: string, default: ""}
    # Whether the repository ships a Playwright suite, likewise passed through
    # so the e2e stage is gated on the build, not on detect-toolchain.
    - {name: e2e, type: string, default: "false"}
  # The toolchain, passed THROUGH. detect-toolchain decides the versions and the
  # build is the one stage that must take them from it directly; every later
  # stage (test) reads them from the build instead, so the pipeline graph stays
  # a line — clone → toolchain → build → test — rather than fanning a second
  # edge from toolchain to test (the "connection line" the console drew, which
  # read as test depending on something other than the artifact it tests).
  results:
    - {name: jdk, description: "the JDK major the build used, from detect-toolchain"}
    - {name: maven, description: the Maven version the build used}
    - {name: node, description: the Node major the build used}
    - {name: go, description: the Go version the build used}
    - {name: python, description: the Python version the build used}
    - {name: e2e, description: "true when the repository ships a Playwright suite, from detect-toolchain"}
  workspaces:
    - {name: source}
  steps:
    - name: toolchain
      image: docker.io/library/bash:5.2
      script: |
        #!/usr/bin/env bash
        printf '%s' "$(params.jdkVersion)"    > "$(results.jdk.path)"
        printf '%s' "$(params.mavenVersion)"  > "$(results.maven.path)"
        printf '%s' "$(params.nodeVersion)"   > "$(results.node.path)"
        printf '%s' "$(params.goVersion)"     > "$(results.go.path)"
        printf '%s' "$(params.pythonVersion)" > "$(results.python.path)"
        printf '%s' "$(params.e2e)"           > "$(results.e2e.path)"
    # The CNB lifecycle runs as the builder image's `cnb` user, but the workspace
    # PVC arrives owned by whoever cloned into it, so the first thing npm/maven
    # does — creating node_modules or target/ — failed with
    # "EACCES: permission denied, mkdir '/workspace/source/node_modules'"
    # (exit 243). Every buildpack build on the platform failed this way.
    #
    # The ids are 1001:1000, not 1000:1000: paketo's jammy builders set
    # CNB_USER_ID=1001 / CNB_GROUP_ID=1000, and the lifecycle re-execs itself as
    # that pair. Forcing runAsUser 1000 instead produced
    # "failed to exec as user 1001:1000: operation not permitted", because a
    # non-root process cannot switch to another uid.
    - name: prepare
      image: docker.io/library/bash:5.2
      securityContext: {runAsUser: 0}
      # optional: true throughout — a profile without the `nexus` package still
      # builds, it just does not rewrite .npmrc (the step says so in the log).
      env:
        - {name: NEXUS_NPM, valueFrom: {secretKeyRef: {name: nexus-credentials, key: npm-hosted, optional: true}}}
        - {name: NEXUS_MAVEN_PUBLIC, valueFrom: {secretKeyRef: {name: nexus-credentials, key: maven-public, optional: true}}}
        - {name: NEXUS_USER, valueFrom: {secretKeyRef: {name: nexus-credentials, key: username, optional: true}}}
        - {name: NEXUS_PASS, valueFrom: {secretKeyRef: {name: nexus-credentials, key: password, optional: true}}}
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        chown -R 1001:1000 "$(workspaces.source.path)"
        echo "workspace handed to 1001:1000 for the CNB lifecycle"

        # A retried build runs on the SAME workspace. The first attempt's
        # `npm install` leaves node_modules behind and the npm-install
        # buildpack then refuses with
        #   mkdir /workspace/source/node_modules: file exists
        # so every retry fails for a reason unrelated to the first failure —
        # and that is the error a person reads (ngapp, 2026-10-15). Each
        # attempt starts from the checkout.
        rm -rf "$(workspaces.source.path)/$(params.subdirectory)/node_modules"

        # ── Platform npm registry ────────────────────────────────────────────
        # Point the platform's own npm scopes at the platform's own registry, so
        # an application never has to hardcode infrastructure URLs.
        #
        # WHY THIS EXISTS. `app-ci` for a scaffolded Angular app failed with
        #   npm error 404 Not Found - GET
        #   http://gitea-http…:3000/api/packages/adhar/npm/@adhar-ui%2fangular
        # because the app's own .npmrc routed @adhar-ui at GITEA's package
        # registry, while the library release pipeline publishes to NEXUS
        # (`pnpm-publish-nexus` → repository/npm-hosted/, where both
        # @adhar-ui/angular and @adhar-ui/tokens were verified present). The
        # app's .npmrc even carried a comment asserting the pipeline published to
        # Gitea, which was never true. No amount of retrying fixes a build that
        # is asking the wrong host, and every app scaffolded from that template
        # inherited the same dead pointer.
        #
        # Injecting it here rather than fixing the template is deliberate: the
        # template lives in a separate mirrored repo, templates already in the
        # wild cannot be retro-fixed, and a registry hostname is a property of
        # the PLATFORM, not of anybody's application. Apps that pin nothing get
        # the right answer automatically.
        #
        # Existing lines for the managed scopes are REMOVED before ours are
        # appended, so the result does not depend on npm's last-key-wins
        # behaviour. Unmanaged scopes and the app's default registry are left
        # exactly as the app set them — this redirects the platform's scopes, not
        # the app's dependency resolution.
        APPDIR_NPM="$(workspaces.source.path)/$(params.subdirectory)"
        APPDIR_NPM="${APPDIR_NPM%/}"
        if [ -z "${NEXUS_NPM:-}" ]; then
          echo "no nexus-credentials secret — leaving .npmrc untouched"
        elif [ ! -f "${APPDIR_NPM}/package.json" ]; then
          echo "no package.json in ${APPDIR_NPM} — no npm registry to configure"
        else
          NPMRC="${APPDIR_NPM}/.npmrc"
          touch "$NPMRC"
          NEXUS_HOST="${NEXUS_NPM#*://}"
          for scope in $(params.platformNpmScopes); do
            # Drop any existing mapping for this scope, whatever it pointed at.
            sed -i "\|^${scope}:registry=|d" "$NPMRC"
            printf '%s:registry=%s\n' "$scope" "$NEXUS_NPM" >> "$NPMRC"
            echo "  ${scope} -> ${NEXUS_NPM}"
          done
          # Credentials scoped to the Nexus path only. `always-auth` is NOT set:
          # that would send these to npmjs for every public package too.
          if [ -n "${NEXUS_USER:-}" ] && [ -n "${NEXUS_PASS:-}" ]; then
            AUTH=$(printf '%s:%s' "$NEXUS_USER" "$NEXUS_PASS" | base64 | tr -d '\n')
            sed -i "\|^//${NEXUS_HOST}:_auth=|d" "$NPMRC"
            printf '//%s:_auth=%s\n' "$NEXUS_HOST" "$AUTH" >> "$NPMRC"
          fi
          # Written as root after the chown above, so hand it to the lifecycle.
          chown 1001:1000 "$NPMRC"
          echo "platform npm scopes configured in ${NPMRC}"
        fi
        # ─────────────────────────────────────────────────────────────────────

        # ── Platform Maven registry ──────────────────────────────────────────
        # The same bug as the npm block above, in the other toolchain, and it
        # fails twice over.
        #
        # WHY THIS EXISTS. `app-ci` for a scaffolded Java service failed with
        #   [FATAL] Non-resolvable parent POM for io.adhar.service:test-service:
        #   1.0.0: com.adhar.kit:adhar-kit-parent:pom:0.1.0 (absent): Could not
        #   transfer artifact ... from/to maven-default-http-blocker
        #   (http://0.0.0.0/): Blocked mirror for repositories: [gitea-adhar
        #   (http://gitea-http...:3000/api/packages/adhar/maven)]
        # and there were two independent reasons it could never have worked:
        #
        #  1. WRONG HOST. The template's settings.xml resolves from GITEA's
        #     Maven registry, which holds nothing — `GET /api/v1/packages/adhar
        #     ?type=maven` returns an empty list and the parent POM is a 404 —
        #     while the library release pipeline deploys to NEXUS
        #     (`altDeploymentRepository=nexus::default::maven-hosted`, where
        #     adhar-kit-parent 0.1.0 answers 200 in both maven-hosted and
        #     maven-public). The npm half of this template had the identical
        #     dead pointer, and the comment above records it.
        #  2. BLOCKED SCHEME. Maven 3.8 ships a mirror in its GLOBAL settings,
        #     `maven-default-http-blocker`, matching `external:http:*`. Every
        #     in-cluster registry is plain HTTP on a cluster-DNS name, which is
        #     "external" by that rule, so Maven refuses to contact it whatever
        #     the URL points at. The documented way to lift it is to redeclare
        #     the SAME id with a harmless mirrorOf, which is what the file below
        #     does — not to turn the repository into HTTPS, which would hairpin
        #     through the Gateway for every dependency.
        #
        # Injected here rather than fixed in the template for the reasons the
        # npm block gives: the template lives in a separate mirrored repo,
        # templates already in the wild cannot be retro-fixed, and a registry
        # hostname is a property of the PLATFORM, not of anybody's application.
        #
        # Written to settings-adhar.xml, NOT over the app's settings.xml, so
        # nothing an application wrote is destroyed — but BP_MAVEN_SETTINGS_PATH
        # is then pointed at ours, because the platform's own registry must win
        # over a template's stale pointer. The log says when that has displaced
        # an app-provided file, so it is auditable rather than silent.
        APPDIR_MVN="$(workspaces.source.path)/$(params.subdirectory)"
        APPDIR_MVN="${APPDIR_MVN%/}"
        PLATFORM_SETTINGS=""
        if [ -z "${NEXUS_MAVEN_PUBLIC:-}" ]; then
          echo "no nexus-credentials secret — leaving Maven settings untouched"
        elif [ ! -f "${APPDIR_MVN}/pom.xml" ]; then
          echo "no pom.xml in ${APPDIR_MVN} — no Maven registry to configure"
        else
          PLATFORM_SETTINGS=settings-adhar.xml
          SETTINGS="${APPDIR_MVN}/${PLATFORM_SETTINGS}"
          # XML-escape the credentials: a generated password containing & or <
          # produces a settings file Maven cannot parse, and the error names the
          # line, not the cause.
          xml_escape() { printf '%s' "$1" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'; }
          MVN_USER_X=$(xml_escape "${NEXUS_USER:-}")
          MVN_PASS_X=$(xml_escape "${NEXUS_PASS:-}")
          {
            printf '%s\n' '<settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">'
            printf '%s\n' '  <servers>'
            printf '    <server><id>nexus-public</id><username>%s</username><password>%s</password></server>\n' \
              "$MVN_USER_X" "$MVN_PASS_X"
            printf '%s\n' '  </servers>'
            printf '%s\n' '  <mirrors>'
            # Redeclaring this id neutralises Maven 3.8+'s default HTTP blocker;
            # mirrorOf "dummy" matches no repository, so it only displaces the
            # global entry.
            printf '%s\n' '    <mirror><id>maven-default-http-blocker</id><mirrorOf>dummy</mirrorOf><name>disabled by the platform</name><url>http://0.0.0.0/</url></mirror>'
            printf '    <mirror><id>nexus-public</id><mirrorOf>*</mirrorOf><name>Adhar platform Maven</name><url>%s</url></mirror>\n' \
              "$NEXUS_MAVEN_PUBLIC"
            printf '%s\n' '  </mirrors>'
            printf '%s\n' '</settings>'
          } > "$SETTINGS"
          chown 1001:1000 "$SETTINGS"
          if [ -f "${APPDIR_MVN}/settings.xml" ]; then
            echo "  NOTE: the repository ships its own settings.xml; the platform's ${PLATFORM_SETTINGS} takes precedence"
          fi
          echo "  * -> ${NEXUS_MAVEN_PUBLIC}"
          echo "platform Maven registry configured in ${SETTINGS}"
        fi
        # ─────────────────────────────────────────────────────────────────────

        # project.toml is a CNB *platform* descriptor: `pack` reads its
        # [[build.env]] table and hands the values to the lifecycle. This task
        # invokes /cnb/lifecycle/creator directly, which never reads it, so every
        # BP_* setting an app declared was silently dropped. The visible symptom
        # for a static SPA was an image with no process type:
        #   ERROR: failed to launch: determine start command: when there is no
        #   default process a command is required
        # because BP_WEB_SERVER=nginx never reached the web-servers buildpack.
        #
        # The lifecycle DOES read one file per variable from <platform>/env, so
        # translate the descriptor into that directory. Keep the parser dumb: one
        # [[build.env]] block with a name and a value line, which is the shape
        # every template emits.
        APPDIR="$(workspaces.source.path)/$(params.subdirectory)"
        PROJ="${APPDIR%/}/project.toml"
        mkdir -p /platform/env
        if [ -f "$PROJ" ]; then
          echo "translating $PROJ into /platform/env"
          name=""
          while IFS= read -r line || [ -n "$line" ]; do
            # strip leading whitespace so indented tables parse too
            line="${line#"${line%%[![:space:]]*}"}"
            case "$line" in
              '[[build.env]]'*)
                name=""
                ;;
              name*=*)
                name=$(printf '%s' "$line" | sed -E 's/^name[[:space:]]*=[[:space:]]*"?([^"]*)"?[[:space:]]*$/\1/')
                ;;
              value*=*)
                if [ -n "$name" ]; then
                  value=$(printf '%s' "$line" | sed -E 's/^value[[:space:]]*=[[:space:]]*"?(.*[^"])"?[[:space:]]*$/\1/')
                  printf '%s' "$value" > "/platform/env/$name"
                  echo "  $name=$value"
                  name=""
                fi
                ;;
            esac
          done < "$PROJ"
        else
          echo "no project.toml at $PROJ — building with buildpack defaults"
        fi

        # Point the Maven buildpack at the platform's settings file, AFTER the
        # translation above so it wins over a BP_MAVEN_SETTINGS_PATH the
        # repository declared. A template that names its own settings.xml is
        # naming the file with the dead Gitea pointer in it; the platform's
        # registry is not the application's choice to make.
        if [ -n "${PLATFORM_SETTINGS:-}" ]; then
          printf '%s' "$PLATFORM_SETTINGS" > /platform/env/BP_MAVEN_SETTINGS_PATH
          echo "  BP_MAVEN_SETTINGS_PATH=$PLATFORM_SETTINGS (platform override)"

          # The platform's own Java libraries require JDK 25, and the buildpack
          # defaults to 21.
          #
          # adhar-kit's parent POM enforces RequireJavaVersion [25,), so a
          # service built on the buildpack default fails in maven-enforcer long
          # after resolving its parent:
          #   Rule 1: RequireJavaVersion failed with message: Detected JDK
          #   version 21.0.12 (JAVA_HOME=/layers/paketo-buildpacks_bellsoft-
          #   liberica/jdk) is not in the allowed range [25,).
          # The release pipeline already builds the libraries on
          # maven:3.9-eclipse-temurin-25 for exactly this reason; an application
          # consuming them needs the same floor.
          #
          # A DEFAULT, not an override: unlike the registry, the JVM version is
          # legitimately the application's choice, so an app that declared
          # BP_JVM_VERSION in its project.toml keeps it. Only a repository that
          # said nothing is moved off the buildpack default.
          if [ -s /platform/env/BP_JVM_VERSION ]; then
            echo "  BP_JVM_VERSION=$(cat /platform/env/BP_JVM_VERSION) (declared in project.toml)"
          elif [ -n "$(params.jdkVersion)" ]; then
            # The repository said so elsewhere (.java-version, .sdkmanrc,
            # .tool-versions, the POM's compiler release) — detect-toolchain
            # read it, so it is the project's version, not the pipeline's.
            printf '%s' "$(params.jdkVersion)" > /platform/env/BP_JVM_VERSION
            echo "  BP_JVM_VERSION=$(params.jdkVersion) (declared by the repository)"
          else
            printf '%s' "$(params.defaultJvmVersion)" > /platform/env/BP_JVM_VERSION
            echo "  BP_JVM_VERSION=$(params.defaultJvmVersion) (platform default: the repository declared no JDK anywhere)"
          fi
          # A Maven wrapper pins the exact Maven the project builds with; the
          # buildpack must use that one, not its bundled default. Only a full
          # x.y.z is a pin — detect-toolchain's family fallback (3.9) is for
          # image tags, and is not written here.
          if [ ! -s /platform/env/BP_MAVEN_VERSION ] && printf '%s' "$(params.mavenVersion)" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            printf '%s' "$(params.mavenVersion)" > /platform/env/BP_MAVEN_VERSION
            echo "  BP_MAVEN_VERSION=$(params.mavenVersion) (pinned by the repository's Maven wrapper)"
          fi
        fi
        # The lifecycle runs as 1001:1000 and only reads these files.
        chown -R 1001:1000 /platform
      volumeMounts:
        # Must be mounted HERE too, not only on the build step: Tekton scopes
        # volumeMounts per step, so without this the files were written to this
        # container's own filesystem, the build step saw an empty emptyDir, and
        # the detector never saw BP_WEB_SERVER -- the nodejs order group won over
        # web-servers and the image came out with no process type.
        - {name: cnb-platform, mountPath: /platform}
    - name: build
      image: $(params.builder)
      securityContext: {runAsUser: 1001}
      env:
        - {name: CNB_PLATFORM_API, value: "0.12"}
        - {name: DOCKER_CONFIG, value: /harbor-creds}
        # Trust Harbor's internal CA (mounted below) alongside the system store.
        - {name: SSL_CERT_DIR, value: "/etc/ssl/certs:/etc/harbor-ca"}
      # The lifecycle stamps every image with a FIXED creation time (1980-01-01,
      # for reproducible builds) unless SOURCE_DATE_EPOCH says otherwise. Kargo's
      # Warehouse picks the newest build by that time, so with every image
      # "created" at the same instant it could not tell a new build from the
      # last: after an app's first promotion, later builds were discovered and
      # never became freight (my-service, 2026-10-17). The build's own wall
      # clock gives the Warehouse a real order; the image content stays
      # reproducible, only its timestamp moves.
      command: ["/bin/bash", "-c"]
      args:
        - >-
          SOURCE_DATE_EPOCH="$(date +%s)" exec /cnb/lifecycle/creator
          "-app=$(workspaces.source.path)/$(params.subdirectory)"
          "-platform=/platform"
          "-tag=$(params.image):$(params.extra-tag)"
          "$(params.image):latest"
      volumeMounts:
        - {name: harbor-dockercfg, mountPath: /harbor-creds}
        - {name: harbor-ca, mountPath: /etc/harbor-ca, readOnly: true}
        - {name: cnb-platform, mountPath: /platform}
  volumes:
    # Shared between prepare (writes) and build (reads): the CNB platform dir.
    - name: cnb-platform
      emptyDir: {}
    - name: harbor-dockercfg
      secret:
        secretName: harbor-dockercfg
        items: [{key: .dockerconfigjson, path: config.json}]
    # Harbor's in-cluster registry serves HTTPS with its OWN internal CA
    # (`harbor-core-internal-tls`, O=adhar.io, CA:TRUE) — NOT the public
    # `adhar-cert` leaf that 05-ca-trust.yaml distributes as `adhar-ca-bundle`.
    # The Go-based lifecycle reads every file under SSL_CERT_DIR, so mounting
    # the CA here is what lets it push to Harbor without skipping verification.
    - name: harbor-ca
      secret:
        secretName: harbor-core-internal-tls
        items: [{key: ca.crt, path: harbor-ca.crt}]
---
# Kaniko build from a Dockerfile → push to Harbor (the case buildpacks/kpack skip).
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: kaniko-build
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "4"}
spec:
  params:
    - {name: image, type: string}
    - {name: subdirectory, type: string, default: ""}
    - {name: dockerfile, type: string, default: Dockerfile}
    # See buildpacks-build: a commit-addressable second tag, for previews.
    - {name: extra-tag, type: string, default: "latest"}
  workspaces:
    - {name: source}
  results:
    - {name: digest, description: "the built image digest"}
  steps:
    - name: build
      image: gcr.io/kaniko-project/executor:v1.23.2
      args:
        - "--context=$(workspaces.source.path)/$(params.subdirectory)"
        - "--dockerfile=$(params.dockerfile)"
        - "--destination=$(params.image):latest"
        - "--destination=$(params.image):$(params.extra-tag)"
        - "--insecure"
        - "--skip-tls-verify"
        - "--digest-file=$(results.digest.path)"
      env:
        - {name: DOCKER_CONFIG, value: /harbor-creds}
      volumeMounts:
        - {name: harbor-dockercfg, mountPath: /harbor-creds}
  volumes:
    - name: harbor-dockercfg
      secret:
        secretName: harbor-dockercfg
        items: [{key: .dockerconfigjson, path: config.json}]
---
# Sign the built image with the platform cosign key.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cosign-sign
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "4"}
spec:
  params:
    - {name: image, type: string}
    # Which tag to resolve to a digest and sign. Signing is by digest, so signing
    # :latest or :<commit sha> of the same build yields the same signature.
    - {name: tag, type: string, default: "latest"}
  steps:
    - name: sign
      image: ghcr.io/sigstore/cosign/cosign:v2.4.1
      env:
        - {name: COSIGN_PASSWORD, value: adhar}
        - {name: COSIGN_YES, value: "true"}
        # Harbor speaks HTTPS with its own internal CA — see buildpacks-build.
        # `--allow-http-registry` used to be passed here, which forced cosign to
        # talk plaintext to a TLS-only registry; trusting the CA is the fix.
        - {name: SSL_CERT_DIR, value: "/etc/ssl/certs:/etc/harbor-ca"}
        # cosign does not just READ the image: it PUSHES the signature back as
        # a `<digest>.sig` tag in the same repository, so it needs the Harbor
        # push credential exactly as the build step does. Without it the step
        # failed with
        #   UNAUTHORIZED: unauthorized to access repository: library/<app>,
        #   action: push
        # Listing harbor-push under the ServiceAccount is not enough -- that
        # secret is kubernetes.io/basic-auth and carries no tekton.dev/docker-*
        # annotation, so Tekton's credential initialiser writes no docker config.
        - {name: DOCKER_CONFIG, value: /harbor-creds}
      args:
        - sign
        - --key=k8s://adhar-system/cosign-key
        - --tlog-upload=false
        - "$(params.image):$(params.tag)"
      volumeMounts:
        - {name: harbor-dockercfg, mountPath: /harbor-creds}
        - {name: harbor-ca, mountPath: /etc/harbor-ca, readOnly: true}
  volumes:
    - name: harbor-dockercfg
      secret:
        secretName: harbor-dockercfg
        items: [{key: .dockerconfigjson, path: config.json}]
    - name: harbor-ca
      secret:
        secretName: harbor-core-internal-tls
        items: [{key: ca.crt, path: harbor-ca.crt}]
---
# Pipeline: source → buildpacks build+push → cosign sign → trivy scan.
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: build-buildpacks
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "4"}
spec:
  params:
    - {name: git-url, type: string}
    - {name: revision, type: string, default: main}
    - {name: subdirectory, type: string, default: ""}
    - {name: image, type: string}
  workspaces:
    - {name: shared}
  tasks:
    - name: clone
      retries: 2
      taskRef: {name: git-clone}
      params:
        - {name: url, value: "$(params.git-url)"}
        - {name: revision, value: "$(params.revision)"}
      workspaces: [{name: output, workspace: shared}]
    - name: build
      retries: 2
      runAfter: [clone]
      taskRef: {name: buildpacks-build}
      params:
        - {name: image, value: "$(params.image)"}
        - {name: subdirectory, value: "$(params.subdirectory)"}
      workspaces: [{name: source, workspace: shared}]
    # Scan BEFORE signing — only a clean image gets a signature (and only a
    # signed image is admitted by kyverno). Build → Harbor → scan → sign.
    - name: scan
      retries: 2
      runAfter: [build]
      taskRef: {name: trivy-scan}
      params: [{name: image, value: "$(params.image):latest"}]
    - name: sign
      retries: 2
      runAfter: [scan]
      taskRef: {name: cosign-sign}
      params: [{name: image, value: "$(params.image)"}]
---
# Pipeline: source → Dockerfile (kaniko) build+push → cosign sign → trivy scan.
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: build-dockerfile
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "4"}
spec:
  params:
    - {name: git-url, type: string}
    - {name: revision, type: string, default: main}
    - {name: subdirectory, type: string, default: ""}
    - {name: dockerfile, type: string, default: Dockerfile}
    - {name: image, type: string}
  workspaces:
    - {name: shared}
  tasks:
    - name: clone
      retries: 2
      taskRef: {name: git-clone}
      params:
        - {name: url, value: "$(params.git-url)"}
        - {name: revision, value: "$(params.revision)"}
      workspaces: [{name: output, workspace: shared}]
    - name: build
      retries: 2
      runAfter: [clone]
      taskRef: {name: kaniko-build}
      params:
        - {name: image, value: "$(params.image)"}
        - {name: subdirectory, value: "$(params.subdirectory)"}
        - {name: dockerfile, value: "$(params.dockerfile)"}
      workspaces: [{name: source, workspace: shared}]
    # Scan before signing (only clean images get signed → admitted by kyverno).
    - name: scan
      retries: 2
      runAfter: [build]
      taskRef: {name: trivy-scan}
      params: [{name: image, value: "$(params.image):latest"}]
    - name: sign
      retries: 2
      runAfter: [scan]
      taskRef: {name: cosign-sign}
      params: [{name: image, value: "$(params.image)"}]
