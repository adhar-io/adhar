# Every environment namespace gets the Harbor pull secret.
#
# Applications are deployed into their project's environment namespaces
# (dev/test/prod, ADR-0026), but `harbor-dockercfg` — the only credential the
# kubelet accepts for the adhar-controlplane registry — existed in adhar-system alone.
# A Rollout in `dev` therefore sat in ImagePullBackOff with a perfectly good
# image in Harbor. Kyverno clones the secret into every namespace that carries
# `adhar.io/environment` (the Environment composition labels them so) and keeps
# it in sync when Harbor rotates it. Platform namespaces are untouched.
#
# `root-creds` — the object-store credential every CNPG ScheduledBackup names
# for its barman archive — follows for the same reason: a database composed
# into an environment backs up to the platform's RustFS, and the Secret it
# names must exist beside it.
#
# The background controller that performs `generate` is granted nothing on
# Secrets by the chart; the aggregated ClusterRole below is what lets it clone.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: adhar:kyverno:pull-secret-sync
  annotations: {argocd.argoproj.io/sync-wave: "4"}
  labels:
    # Both controllers: the background controller performs the clone, and the
    # admission controller validates the policy by checking that IT can get/list
    # the source Secret — without this label the policy itself is denied with
    # "kyverno-admission-controller requires permissions list,get for resource
    # v1/Secret" and the sync never applies it (2026-10-17).
    rbac.kyverno.io/aggregate-to-admission-controller: "true"
    rbac.kyverno.io/aggregate-to-background-controller: "true"
    app.kubernetes.io/part-of: adhar-platform
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create, update, patch, delete, get, list, watch]
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: sync-harbor-pull-secret
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    policies.kyverno.io/title: Harbor pull secret in every environment namespace
    policies.kyverno.io/category: Adhar Delivery
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Namespace, Secret
    policies.kyverno.io/description: >-
      Clones adhar-system/harbor-dockercfg and adhar-system/root-creds into
      every namespace labelled adhar.io/environment, so workloads promoted into
      dev/test/prod can pull the images app-ci built and their databases can
      archive backups to the platform object store.
  labels:
    app.kubernetes.io/name: adhar-supply-chain
    app.kubernetes.io/part-of: adhar-platform
spec:
  background: true
  rules:
    - name: clone-harbor-dockercfg
      match:
        any:
          - resources:
              kinds: [Namespace]
              selector:
                matchExpressions:
                  - {key: adhar.io/environment, operator: Exists}
      exclude:
        any:
          - resources:
              namespaces: [adhar-system]
      generate:
        apiVersion: v1
        kind: Secret
        name: harbor-dockercfg
        namespace: "{{request.object.metadata.name}}"
        synchronize: true
        generateExisting: true
        clone:
          namespace: adhar-system
          name: harbor-dockercfg
    - name: clone-object-store-credentials
      match:
        any:
          - resources:
              kinds: [Namespace]
              selector:
                matchExpressions:
                  - {key: adhar.io/environment, operator: Exists}
      exclude:
        any:
          - resources:
              namespaces: [adhar-system]
      generate:
        apiVersion: v1
        kind: Secret
        name: root-creds
        namespace: "{{request.object.metadata.name}}"
        synchronize: true
        generateExisting: true
        clone:
          namespace: adhar-system
          name: root-creds
