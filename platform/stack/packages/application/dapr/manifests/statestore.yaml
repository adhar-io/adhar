apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: statestore
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  type: state.redis
  version: v1
  metadata:
    - name: redisHost
      value: adhar-cache.adhar-system.svc.cluster.local:6379
    - name: actorStateStore
      value: "true"
auth:
  secretStore: kubernetes