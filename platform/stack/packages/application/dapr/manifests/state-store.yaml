# dapr-state — the store behind every environment's statestore, lockstore and
# configstore, and behind pub/sub where the cluster runs no Kafka. The
# Environment composition (compositions/env/local.yaml) points each
# environment's Components here.
#
# Not the shared adhar-cache, deliberately. adhar-cache is a Valkey the operator
# runs in CLUSTER mode (`cluster-enabled yes`, even with one node), and a
# cluster refuses three things Dapr needs from a state store:
#
#   - a transaction whose keys hash to different slots: `CROSSSLOT Keys in
#     request don't hash to the same slot`, even when one node holds every
#     slot. Every Dapr Workflow save is such a transaction (inbox, history and
#     metadata rows), so is every multi-key actor update and every state
#     transaction adhar-kit exposes; on adhar-cache all of them fail;
#   - SELECT (`ERR SELECT is not allowed in cluster mode`), the only way to keep
#     dev, test and prod apart for what Dapr does NOT prefix: actor state
#     (`<app>||<type>||<id>||<key>`), locks (`lock||<app>||<resource>`) and
#     configuration keys (none at all — a configuration.redis Get with no keys
#     runs `KEYS *` and returns whatever the database holds);
#   - keyspace notifications, which configuration subscriptions are built on,
#     and an eviction policy that never drops state.
#
# Verified against valkey 8.1 with cluster-enabled yes and every slot on one
# node (2026-10-27).
#
# One standalone node with an append-only file: durable across restarts, not
# across the loss of its node — the volume is node-local like every platform
# volume, which is also why the pod is adhar-node-bound (see
# data/valkey/manifests/node-bound-priority.yaml). A team whose workflow state
# is business-critical declares its own state.postgresql Component on a
# Database instead (README.md).
#
# No password, like adhar-cache: a credential would have to be copied into every
# environment's namespace for every component, and the store is reachable only
# from the namespaces the NetworkPolicy below admits.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dapr-state
  namespace: adhar-system
  labels:
    app.kubernetes.io/name: dapr-state
    app.kubernetes.io/part-of: dapr
    app.kubernetes.io/component: state-store
data:
  valkey.conf: |
    # Standalone, never cluster mode (see the header of state-store.yaml).
    port 6379
    bind * -::*
    protected-mode no
    dir /data
    # Durable: every write reaches the append-only file within a second. RDB
    # snapshots would add a second fork for nothing the AOF does not already hold.
    appendonly yes
    appendfsync everysec
    save ""
    # A state store refuses a write rather than dropping state to make room.
    # The cap sits under the container's 256Mi limit, leaving room for the
    # fork an AOF rewrite takes.
    maxmemory 160mb
    maxmemory-policy noeviction
    # One database per environment tier and building block; the composition
    # picks the number: 0 the platform namespace, 1/2/3 dev/test/prod state,
    # locks and streams, 9/10/11 their configuration (kept apart because a
    # configuration Get-all is KEYS * on its database).
    databases 16
    # Keyspace events for string writes, deletes and expiries: the configuration
    # store's subscriptions are built on them. Narrower than "KA", so state (hash)
    # writes publish nothing.
    notify-keyspace-events K$gx
---
apiVersion: v1
kind: Service
metadata:
  name: dapr-state
  namespace: adhar-system
  labels:
    app.kubernetes.io/name: dapr-state
    app.kubernetes.io/part-of: dapr
    app.kubernetes.io/component: state-store
spec:
  selector:
    app.kubernetes.io/name: dapr-state
  ports:
    - name: valkey
      port: 6379
      targetPort: valkey
    - name: metrics
      port: 9121
      targetPort: metrics
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dapr-state
  namespace: adhar-system
  labels:
    app.kubernetes.io/name: dapr-state
    app.kubernetes.io/part-of: dapr
    app.kubernetes.io/component: state-store
spec:
  replicas: 1
  serviceName: dapr-state
  selector:
    matchLabels:
      app.kubernetes.io/name: dapr-state
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dapr-state
        app.kubernetes.io/part-of: dapr
        app.kubernetes.io/component: state-store
      annotations:
        # Valkey reads valkey.conf once, at start. Bump this with any change to
        # the ConfigMap above, or the running server keeps the old settings.
        adhar.io/config-revision: "1"
    spec:
      # Every package shares adhar-system, so Kubernetes would inject a
      # <SVC>_PORT variable per Service into both containers; the exporter reads
      # REDIS_* variables as its own flags (platform/stack/packages/CONFLICTS.md).
      enableServiceLinks: false
      priorityClassName: adhar-node-bound
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: valkey
          # The server version adhar-cache runs (ghcr.io/hyperspike/valkey:8.1.4).
          image: docker.io/valkey/valkey:8.1.4-alpine
          command: ["valkey-server", "/etc/valkey/valkey.conf"]
          ports:
            - name: valkey
              containerPort: 6379
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
          readinessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: valkey
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /etc/valkey
              readOnly: true
        # redis_exporter: puts this store on the "Valkey / Redis" dashboard,
        # which lists every redis_up target by namespace and job.
        - name: metrics
          image: docker.io/oliver006/redis_exporter:v1.62.0-alpine
          args: ["--redis.addr=redis://localhost:6379"]
          ports:
            - name: metrics
              containerPort: 9121
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: dapr-state
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
---
# Who may reach the store: the environment namespaces (and preview ones), whose
# Components point here, and the platform namespace — its own statestore, and
# Prometheus scraping the exporter.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dapr-state
  namespace: adhar-system
  labels:
    app.kubernetes.io/name: dapr-state
    app.kubernetes.io/part-of: dapr
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: dapr-state
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: adhar.io/plane
                operator: In
                values: [workload, preview]
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: adhar-system
      ports:
        - port: 6379
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: adhar-system
      ports:
        - port: 9121
          protocol: TCP
