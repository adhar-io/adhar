# Adhar marketplace contract for the scorecards package.
# Validated against platform/stack/packages/marketplace.schema.json
# (run: hack/validate-packages.sh). See MARKETPLACE.md for the contract.
# Scaffolded by hack/gen-package-contracts.sh — refine it by hand as the
# package changes; the generator never overwrites an existing contract.
apiVersion: marketplace.adhar.io/v1alpha1
kind: AdharPackage
name: adhar-scorecards
category: application
version: "0.1.0"
description: 'Production-readiness scorer: grades every service 0-100 from in-cluster signals, and proves each application with an hourly automated k6 load test and Litmus pod-delete chaos experiment, publishing the adhar-scorecards ConfigMap the Console reads.'
maintainer:
  name: Adhar Platform Team
  url: https://github.com/adhar-io/adhar
  firstParty: true
license: Apache-2.0
homepage: https://github.com/adhar-io/adhar
adharCompatibility:
  minVersion: "0.1.0"
dependencies:
  - name: cnpg
    category: data
  # The resilience runner's chaos experiments run through Litmus; without it
  # the chaos signal is recorded as unavailable rather than failing.
  - name: litmus
    category: application
    optional: true
provenance:
  sourceRepo: https://github.com/adhar-io/adhar
  signed: true                 # release artifacts are Cosign-keyless signed by the GoReleaser pipeline
  cosignKeyless: true          # Sigstore Fulcio + Rekor, ADR-0019
  scanned: true
  scanner: trivy
  sbom: https://github.com/adhar-io/adhar/releases  # SPDX SBOMs are attached to every release
planeAffinity: control-plane
stability: beta
resources:
  localSafe: false   # mirrors the enabled gate in adhar-appset-local.yaml
keywords:
  - scorecards
  - readiness
  - governance
  - console
  - performance
  - chaos
  - resilience
verification:
  status: verified
  profile: production
  verifiedAt: "2026-09-23"
  platformVersion: "v0.1.23"
  kubernetesVersion: "v1.37.0"
