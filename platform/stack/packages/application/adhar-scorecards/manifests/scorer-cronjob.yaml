---
# The scoring logic, kept as a mounted script so the CronJob spec stays small
# and the algorithm is reviewable in one place. Pure kubectl + jq; no build
# step, no custom image. Runnable by hand:
#   kubectl -n adhar-system run scorecard --rm -it --restart=Never \
#     --overrides='{"spec":{"serviceAccountName":"adhar-scorecard"}}' \
#     --image=alpine/k8s:1.31.1 -- bash /scripts/score.sh
apiVersion: v1
kind: ConfigMap
metadata:
  name: adhar-scorecard-script
  namespace: adhar-system
  labels:
    adhar.io/component: scorecards
    app.kubernetes.io/name: adhar-scorecard
    app.kubernetes.io/part-of: adhar
    app.kubernetes.io/managed-by: argocd
data:
  score.jq: |
    # adhar production-readiness scoring program (run by score.sh; see model.yaml
    # in adhar-scorecard-config for the model). Inputs arrive as --slurpfile /
    # --argjson; every file holds one document, hence the `[0]` unwraps.
    ($appsf[0]) as $apps
    | ($workloadsf[0]) as $wlIdx
    | ($reportsf[0].byKey) as $polByKey
    | ($reportsf[0].byNs) as $polByNs
    | ($routesf[0].nsSet) as $routeNs
    | ($cnpgf[0].byKey) as $cnpgByKey
    | ($cnpgf[0].byNs) as $cnpgByNs
    | ($schedulesf[0]) as $sched
    | ($hpasf[0].byTarget // {}) as $hpaBy
    | ($pdbsf[0].byNs // {}) as $pdbBy
    | ($podsf[0] // {}) as $podsBy
    | ($evidencef[0] // {}) as $evidence
    | (($perfcenterf // [{}])[0] // {}) as $perfCenter
    | (($gamedayf // [{}])[0] // {}) as $gameDays
    | (($vulnsf // [{}])[0] // {}) as $vulnsBy
    | (($metricsf // [{}])[0] // {}) as $metricsBy
    # Batch inputs are read through $ARGS.named: optional, so a caller that passes
    # none (an older score.sh, a fixture) gets no batch signals rather than a jq
    # compile error on an undefined variable.
    | ((($ARGS.named.batchf // [{}])[0] // {}).byKey // {}) as $batchBy
    | ((($ARGS.named.batchf // [{}])[0] // {}).prometheus // false) as $batchProm
    | ($ARGS.named.batchminpct // 95) as $batchminpct
    | ($ARGS.named.batchwindow // 7) as $batchwindow
    | ($ARGS.named.batchrestartdays // 30) as $batchrestartdays
    | ($trusted | split(",") | map(select(. != ""))) as $trustedRegs
    | ($envorder | split(",")) as $order
    |
    # ---- helpers ----------------------------------------------------------------
    def imgbad($img):
      ($img | type == "string")
      and (($img | test(":latest$")) or (($img | test(":")) | not));
    def grade($s):
      if   $s >= $ga then "A"
      elif $s >= $gb then "B"
      elif $s >= $gc then "C"
      elif $s >= $gd then "D"
      else "F" end;
    def b($x): if $x then 1 else 0 end;
    def sig($name; $cat; $applicable; $score; $detail):
      {name: $name, category: $cat, applicable: $applicable, score: $score}
      + (if $detail == null then {} else {detail: $detail} end);
    # every key/value of $sel is in $labels
    def selects($sel; $labels): ($sel | length) > 0 and all($sel | to_entries[]; $labels[.key] == .value);
    def ms($x): if $x == null then "?" else ($x | floor | tostring) + " ms" end;
    def pct($x): if $x == null then "?" else (($x * 10000 | round) / 100 | tostring) + "%" end;
    def ago($epoch): (($now - $epoch) / 3600 | floor) as $h
      | if $h < 1 then "under an hour ago" elif $h < 48 then "\($h)h ago" else "\($h / 24 | floor)d ago" end;
    def envrank($e): ($order | index($e)) // 99;
    # Kubernetes quantities: CPU in cores ("250m", "1", "123456n"), memory in bytes ("512Mi", "1G").
    def cpuq($q): if $q == null then null else ($q | tostring) as $v
      | if   ($v | endswith("n")) then ($v[:-1] | tonumber) / 1e9
        elif ($v | endswith("u")) then ($v[:-1] | tonumber) / 1e6
        elif ($v | endswith("m")) then ($v[:-1] | tonumber) / 1000
        else ($v | tonumber? // null) end end;
    def memq($q): if $q == null then null else (($q | tostring) | capture("^(?<n>[0-9.eE+-]+)(?<u>[A-Za-z]*)$")?) as $c
      | if $c == null then null else ($c.n | tonumber) * ({"": 1, k: 1e3, K: 1e3, M: 1e6, G: 1e9, T: 1e12,
          Ki: 1024, Mi: 1048576, Gi: 1073741824, Ti: 1099511627776}[$c.u] // 1) end end;
    def mib($b): ($b / 1048576 | floor | tostring) + "Mi";
    def mcpu($c): ($c * 1000 | floor | tostring) + "m";
    # An image is pinned when it cannot move: a digest, a 40-hex commit tag (what
    # app-ci publishes) or a version tag — never :latest or untagged.
    def pinned($img): ($img | type == "string") and (($img | test("@sha256:[0-9a-f]{64}$"))
      or ($img | test(":[0-9a-f]{40}$")) or ($img | test(":v?[0-9]+\\.[0-9]+(\\.[0-9]+)?([-+][0-9A-Za-z.-]+)?$")));
    # The registry host: the first path segment when it looks like a host, else Docker Hub.
    def reghost($img): ($img | split("@")[0] | split("/")) as $p
      | if ($p | length) > 1 and (($p[0] | test("[.:]")) or $p[0] == "localhost") then $p[0] else "docker.io" end;

    # Category fraction = mean of applicable signals. With NO applicable signal,
    # the four original categories stay neutral (1.0, as they always have, so a
    # platform package's grade does not move), while performance and resilience
    # — which only applications are measured on — leave the score entirely and
    # report null: a free 100% there would grade a package as load- and
    # chaos-tested when nothing was tested.
    def finish:
      . as $rec
      | ($rec.signals) as $signals
      | { reliability: $wrel, security: $wsec, observability: $wobs, operations: $wops,
          performance: $wperf, resilience: $wres, supply_chain: $wsup, efficiency: $weff } as $w
      | ( $w | keys_unsorted | map( . as $cat
            | [ $signals[] | select(.category == $cat and .applicable) ] as $s
            | { key: $cat,
                value: (if ($s | length) > 0 then (([ $s[].score ] | add) / ($s | length))
                        elif ($cat == "performance" or $cat == "resilience" or $cat == "supply_chain" or $cat == "efficiency") then null
                        else 1 end) } )
          | from_entries ) as $cf
      | ([ $cf | to_entries[] | select(.value != null) | $w[.key] ] | add // 0) as $wtot
      | (if $wtot > 0
         then ([ $cf | to_entries[] | select(.value != null) | .value * $w[.key] ] | add) / $wtot * 100 | floor
         else 0 end) as $score
      | $rec + { score: $score, grade: grade($score),
                 categories: ($cf | map_values(if . == null then null else (. * 100 | floor) end)) };

    # ---- per Argo CD Application: the signals its own resources earn ------------
    def base:
      . as $app |
      ($app.name) as $name |
      ($app.ns) as $ns |
      # What this Application actually owns, per ArgoCD. When ArgoCD knows the
      # inventory that IS the answer: an Application that owns no workload has no
      # containers to grade, and its container signals drop out as not-applicable
      # rather than borrow other workloads from the namespace. The instance label
      # and the destination namespace are fallbacks only for an Application that
      # has never synced.
      (($app.own.total // 0) > 0) as $hasOwn |
      (if $hasOwn
       then [ ($app.own.wl // [])[] | $wlIdx.byKey[.] // empty ]
       else ($wlIdx.byInstance[$name] // $wlIdx.byNs[$ns] // []) end) as $wl |
      ([ $wl[] | (.containers // [])[] ]) as $cs |
      (($cs | length) > 0) as $hasC |
      ($app.health == "Healthy") as $healthy |
      ($hasC and (all($cs[]; .probes))) as $probesOk |
      ($hasC and (all($cs[]; .res))) as $resOk |
      ($hasC and (all($cs[]; (imgbad(.image)) | not))) as $imgOk |
      # Kyverno reports are scoped to individual workloads, so they can be
      # attributed exactly; the namespace aggregate is only for the never-synced
      # fallback above.
      (if $hasOwn
       then { pass: ([ ($app.own.wl // [])[] | ($polByKey[.].pass // 0) ] | add // 0),
              fail: ([ ($app.own.wl // [])[] | ($polByKey[.].fail // 0) ] | add // 0) }
       else ($polByNs[$ns] // {pass:0, fail:0}) end) as $pol |
      (($pol.pass + $pol.fail) > 0) as $hasPol |
      (if $hasPol then ($pol.pass / ($pol.pass + $pol.fail)) else 0 end) as $passRate |
      ($app.sync == "Synced") as $synced |
      (if $hasOwn then (($app.own.routes // 0) > 0) else ($routeNs[$ns] // false) end) as $exposed |
      # A batch application (design 0025): BatchJobs and no long-running workload.
      # It serves nothing, so an HTTPRoute is not applicable to it, and neither is
      # the resilience runner's load test or pod-delete (it tests Services).
      ((($app.own.batch // []) | length) > 0 and ($wl | length) == 0) as $batchOnly |
      (any($wl[]?; .kind == "StatefulSet")) as $hasSts |
      ([ ($app.own.cnpg // [])[] | $cnpgByKey[.] // empty ]) as $cnpgOwn |
      (if $hasOwn then $cnpgOwn
       else (($cnpgByNs[$ns] // {count: 0, backup: false})
             | if .count > 0 then [{backup: .backup}] else [] end) end) as $cnpgHere |
      ($hasSts or (($cnpgHere | length) > 0)) as $stateful |
      ( ($sched.all or ($sched.nsSet[$ns] // false)) or (any($cnpgHere[]?; .backup)) ) as $backupOk |
      {
        name: $name, namespace: $ns, stateful: $stateful, batchOnly: $batchOnly,
        health: $app.health, sync: $app.sync, wl: $wl, cs: $cs, hasC: $hasC,
        signals: [
          sig("argocd_healthy";    "reliability";   true;      b($healthy);  null),
          sig("probes";            "reliability";   $hasC;     b($probesOk); null),
          sig("resources";         "reliability";   $hasC;     b($resOk);    null),
          sig("image_not_latest";  "security";      $hasC;     b($imgOk);    null),
          sig("kyverno_pass_rate"; "security";      $hasPol;   $passRate;    null),
          sig("argocd_synced";     "observability"; true;      b($synced);   null),
          sig("httproute_exposed"; "observability"; ($batchOnly | not); b($exposed); null),
          sig("backup";            "operations";    $stateful; b($backupOk); null)
        ]
      };

    # ---- resilience the running workload already shows --------------------------
    # Measured on the application's most-promoted environment: production
    # readiness is a property of how it runs where it is closest to production.
    def static_resilience($env):
      . as $r |
      ([ $r.wl[] | select(.kind == "Rollout" or .kind == "Deployment") ]) as $ws |
      (($ws | length) > 0) as $has |
      [ $ws[] | . as $w | ($hpaBy["\($w.ns)/\($w.kind)/\($w.name)"]) as $h
        | { w: $w, hpa: $h,
            minReplicas: ([ $w.replicas, ($h.min // 0) ] | max),
            pdb: any(($pdbBy[$w.ns] // [])[]; selects(.; $w.podLabels)),
            restarts: ([ ($podsBy[$w.ns] // [])[] | select(selects($w.podLabels; .labels)) | .restarts ] | add // null) } ] as $x |
      ([ $x[] | .minReplicas ] | min // 0) as $minRep |
      ([ $x[] | .restarts | select(. != null) ] | add // null) as $restarts |
      [
        sig("replicas_ha"; "resilience"; $has; b($has and $minRep >= 2);
            "at least \($minRep) replica(s) in \($env)" + (if $minRep < 2 then " — one pod is a single point of failure" else "" end)),
        sig("pod_disruption_budget"; "resilience"; $has; b($has and all($x[]; .pdb));
            if all($x[]; .pdb) then "a PodDisruptionBudget covers every pod in \($env)"
            else "no PodDisruptionBudget in \($env): a node drain can evict every replica at once" end),
        sig("autoscaling"; "resilience"; $has; b($has and all($x[]; .hpa != null));
            if all($x[]; .hpa != null) then "HorizontalPodAutoscaler \($x[0].hpa.min)-\($x[0].hpa.max) in \($env)"
            else "no HorizontalPodAutoscaler in \($env)" end),
        sig("spread_across_nodes"; "resilience"; $has; b($has and all($ws[]; .spread));
            if all($ws[]; .spread) then "topology spread / anti-affinity keeps replicas on different nodes"
            else "replicas may all land on one node (no topologySpreadConstraints or podAntiAffinity)" end),
        sig("graceful_shutdown"; "resilience"; $r.hasC; b($r.hasC and all($r.cs[]; .preStop));
            if ($r.hasC and all($r.cs[]; .preStop)) then "every container drains with a preStop hook"
            else "no preStop hook: in-flight requests are cut when a pod is replaced" end),
        sig("restart_stability"; "resilience"; ($restarts != null); b(($restarts // 0) < 3);
            "\($restarts // 0) container restart(s) across the running pods in \($env)"),
        sig("progressive_delivery"; "resilience"; $has; b($has and any($ws[]; .progressive));
            if any($ws[]; .progressive) then "Argo Rollouts canary/blue-green" else "plain rolling update; no canary or blue-green" end)
      ];

    # ---- supply chain and efficiency --------------------------------------------
    # Both are null for the category (not a free 100%) when nothing could be
    # measured: no containers, no Trivy report for the running images, or no
    # metrics-server answer.
    def supply_efficiency($env):
      . as $r |
      ([ $r.cs[] | .image ] | unique) as $imgs |
      # Trivy reports for the images RUNNING now — older ReplicaSets keep reports
      # for images no longer deployed, and those must not count.
      ([ $r.wl[] | . as $w | ($vulnsBy[$w.ns] // [])[]
         | select(.name == $w.name or (.name | startswith($w.name + "-")))
         | select(. as $v | any($imgs[]; contains($v.repo) and (($v.digest != "" and contains($v.digest)) or ($v.tag != "" and contains(":" + $v.tag))))) ]
       | unique_by(.repo + "@" + .digest + ":" + .tag)) as $vr |
      ([ $vr[].critical ] | add // 0) as $crit |
      ([ $vr[].high ] | add // 0) as $high |
      ([ $imgs[] | select(pinned(.) | not) ]) as $loose |
      ([ $imgs[] | select(reghost(.) as $h | any($trustedRegs[]; . as $t | $h | contains($t)) | not) ]) as $foreign |
      # Pods of these workloads, with their requests and (when metrics-server
      # answers) their live usage.
      ([ $r.wl[] | . as $w | ($podsBy[$w.ns] // [])[] | select(selects($w.podLabels; .labels))
         | . + {use: ($metricsBy["\(.ns)/\(.name)"] // null)} ] | unique_by(.ns + "/" + .name)) as $pods |
      ([ $pods[] | select(.use != null) ]) as $measured |
      ([ $measured[] | .req[] | cpuq(.cpu) // empty ] | add // 0) as $reqCpu |
      ([ $measured[] | .use[] | cpuq(.cpu) // empty ] | add // 0) as $useCpu |
      ([ $measured[] | .req[] | memq(.mem) // empty ] | add // 0) as $reqMem |
      ([ $measured[] | .use[] | memq(.mem) // empty ] | add // 0) as $useMem |
      (($measured | length) > 0) as $hasM |
      (if $reqCpu > 0 then $useCpu / $reqCpu * 100 else null end) as $cpuPct |
      (if $reqMem > 0 then $useMem / $reqMem * 100 else null end) as $memPct |
      [
        sig("image_pinned"; "supply_chain"; $r.hasC; b(($loose | length) == 0);
            if ($loose | length) == 0 then "every image is pinned by digest or an immutable tag"
            else "not pinned: \($loose | join(", ")) — the same tag can be pushed again" end),
        sig("image_trusted_registry"; "supply_chain"; ($r.hasC and ($trustedRegs | length) > 0); b(($foreign | length) == 0);
            if ($foreign | length) == 0 then "every image comes from \($trustedRegs | join(" or "))"
            else "from outside the platform registry: \($foreign | join(", "))" end),
        sig("no_critical_vulns"; "supply_chain"; (($vr | length) > 0); b($crit == 0);
            if ($vr | length) == 0 then "no Trivy report for the running images yet"
            else "\($crit) critical, \($high) high across \($vr | length) scanned image(s)" end),
        sig("cpu_right_sized"; "efficiency"; ($hasM and $cpuPct != null);
            b($cpuPct != null and $cpuPct >= $cpumin and $cpuPct <= $cpumax);
            if ($hasM | not) then "no live usage: metrics-server did not answer for \($env)"
            elif $cpuPct == null then "no CPU request set in \($env)"
            else "uses \($cpuPct | floor)% of its \(mcpu($reqCpu)) CPU request in \($env)"
              + (if $cpuPct < $cpumin then " — most of it is reserved and idle"
                 elif $cpuPct > $cpumax then " — over its request; raise it so the scheduler reserves what it needs"
                 else "" end) end),
        sig("memory_right_sized"; "efficiency"; ($hasM and $memPct != null);
            b($memPct != null and $memPct >= $memmin and $memPct <= $memmax);
            if ($hasM | not) then "no live usage: metrics-server did not answer for \($env)"
            elif $memPct == null then "no memory request set in \($env)"
            else "uses \($memPct | floor)% of its \(mib($reqMem)) memory request in \($env)"
              + (if $memPct < $memmin then " — most of it is reserved and idle"
                 elif $memPct > $memmax then " — over its request; the pod is first to be evicted under pressure"
                 else "" end) end)
      ];

    # ---- what the resilience runner proved ---------------------------------------
    def evidence_signals($ev; $batchOnly):
      ($ev.testedAtEpoch // 0) as $at |
      (($now - $at) <= ($evdays * 86400)) as $fresh |
      ($ev.performance // null) as $perf |
      ($ev.chaos // null) as $chaos |
      ($ev.slo // null) as $slo |
      (($perf.thresholdP95Ms // $p95default)) as $p95t |
      ($ev.pending // "awaiting the first automated run") as $pending |
      [
        sig("load_test"; "performance"; ($batchOnly | not) or $perf != null;
            b($perf != null and $perf.status == "passed" and $fresh);
            if $perf == null then $pending
            elif ($perf.status == "error") then "load test could not run: \($perf.detail // "unknown error")"
            else "\($perf.status): p95 \(ms($perf.p95Ms)) (target < \($p95t) ms), errors \(pct($perf.errorRate)), \(($perf.rps // 0) | floor) req/s with \($perf.vus // "?") users in \($ev.environment), \(ago($at))"
                 + (if $fresh then "" else " — STALE, older than \($evdays) days" end) end),
        sig("latency_slo"; "performance"; ($slo != null and $slo.p95Ms != null);
            b($slo != null and $slo.p95Ms != null and $slo.p95Ms <= $p95t);
            if $slo == null or $slo.p95Ms == null then "no request-latency metrics yet"
            else "p95 \(ms($slo.p95Ms)) over 24h in \($slo.environment) (target < \($p95t) ms)" end),
        ((($slo.targetAvailability // 99.9)) as $target | (1 - $target / 100) as $budget |
        sig("error_budget"; "performance"; ($slo != null and $slo.errorRatio != null);
            b($slo != null and $slo.errorRatio != null and $slo.errorRatio <= $budget);
            if $slo == null or $slo.errorRatio == null then "no request metrics yet"
            else "5xx \(pct($slo.errorRatio)) of \($slo.requests | floor) requests over 24h in \($slo.environment) (budget \(pct($budget)) for \($target)%)" end)),
        sig("chaos_pod_delete"; "resilience"; (if $chaos == null then ($batchOnly | not) else $chaos.status != "unavailable" end);
            b($chaos != null and $chaos.status == "passed" and $fresh);
            if $chaos == null then $pending
            elif ($chaos.status == "passed" or $chaos.status == "failed")
            then "\($chaos.status): \($chaos.detail); steady-state probe \($chaos.probeSuccessPercentage // "?")% in \($ev.environment), \(ago($at))"
                 + (if $fresh then "" else " — STALE, older than \($evdays) days" end)
            else ($chaos.detail // $chaos.status) end),
        # The rest of the automated chaos suite: the same steady-state probe
        # under a slow network and a saturated CPU. Absent from older
        # evidence, so not applicable until the runner has run the suite.
        (($ev.chaosSuite // {})["pod-network-latency"] // null) as $net |
        (($ev.chaosSuite // {})["pod-cpu-hog"] // null) as $cpu |
        sig("chaos_network_latency"; "resilience"; ($net != null and $net.status != "unavailable");
            b($net != null and $net.status == "passed" and $fresh);
            if $net == null then "not in the automated chaos suite yet"
            elif ($net.status == "passed" or $net.status == "failed") then "\($net.status): \($net.detail); steady-state probe \($net.probeSuccessPercentage // "?")%"
            else ($net.detail // $net.status) end),
        sig("chaos_cpu_stress"; "resilience"; ($cpu != null and $cpu.status != "unavailable");
            b($cpu != null and $cpu.status == "passed" and $fresh);
            if $cpu == null then "not in the automated chaos suite yet"
            elif ($cpu.status == "passed" or $cpu.status == "failed") then "\($cpu.status): \($cpu.detail); steady-state probe \($cpu.probeSuccessPercentage // "?")%"
            else ($cpu.detail // $cpu.status) end),
        # Memory pressure: what the JVM templates' suites run by default.
        (($ev.chaosSuite // {})["pod-memory-hog"] // null) as $mem |
        sig("chaos_memory_pressure"; "resilience"; ($mem != null and $mem.status != "unavailable");
            b($mem != null and $mem.status == "passed" and $fresh);
            if $mem == null then "not in this application's chaos suite"
            elif ($mem.status == "passed" or $mem.status == "failed") then "\($mem.status): \($mem.detail); steady-state probe \($mem.probeSuccessPercentage // "?")%"
            else ($mem.detail // $mem.status) end),
        # The promotion gate: the suite run against each build in the
        # environment before prod (compositions/project/local.yaml). A build
        # that failed it was held out of prod; the latest verdict is the signal.
        (($ev.gates // {}) | to_entries | map(.value + {ns: .key}) | sort_by(.at // "") | last // null) as $gate |
        sig("promotion_gate"; "resilience"; ($gate != null and $gate.verdict != "skipped");
            b($gate != null and $gate.verdict == "pass");
            if $gate == null then "no build has been through the promotion gate yet"
            elif $gate.verdict == "pass" then "pass: \($gate.image) survived its load test and chaos suite in \($gate.environment // $gate.ns), \(ago((($gate.at // "") | sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601? // 0)))"
            else "\($gate.verdict): \($gate.image) was held out of prod — \(($gate.reasons // []) | join("; "))" end),
        sig("recovery_time"; "resilience";
            ($chaos != null and ($chaos.status == "passed" or $chaos.status == "failed"));
            b(($chaos.recoverySeconds // null) != null and $chaos.recoverySeconds <= $recoverymax);
            if ($chaos.recoverySeconds // null) == null then "did not return to full readiness within 3 minutes of the experiment"
            else "back to \($chaos.replicas // "?") ready replica(s) \($chaos.recoverySeconds)s after the experiment (target ≤ \($recoverymax)s)" end)
      ];

    # ---- what the team proved themselves: Performance Center + game days ---------
    def team_signals($app):
      ($perfCenter[$app] // null) as $pc |
      ($gameDays[$app] // null) as $gd |
      def epoch($t): (($t // "") | sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601? // 0);
      [
        sig("perf_center_gate"; "performance"; ($pc != null and $pc.judged != null);
            b($pc != null and $pc.judged != null and $pc.judged.verdict == "pass" and ($now - epoch($pc.judged.at)) <= ($evdays * 86400));
            if $pc == null then "no Performance Center test targets this application"
            elif $pc.judged == null then "\($pc.count) Performance Center result(s), none with a recorded verdict — run the test again to judge it"
            else "latest Performance Center run of \($pc.judged.test) (\($pc.judged.trigger), \($pc.count) result(s) across \($pc.tests | length) test(s)): \(if $pc.judged.verdict == "" then "no verdict recorded" else $pc.judged.verdict end)"
                 + (if ($pc.judged.reasons // "") != "" then " — \($pc.judged.reasons)" else "" end)
                 + (if ($now - epoch($pc.judged.at)) > ($evdays * 86400) then " — STALE, older than \($evdays) days" else "" end) end),
        sig("chaos_gameday"; "resilience"; ($gd != null);
            b($gd != null and $gd.latest.verdict == "Pass" and ($now - epoch($gd.latest.at)) <= ($evdays * 86400));
            if $gd == null then "no game day has targeted this application"
            else "latest game day \($gd.latest.experiment): \($gd.latest.verdict) (steady-state probe \($gd.latest.probe)%); \($gd.count) fault run(s): \($gd.experiments | join(", "))"
                 + (if ($now - epoch($gd.latest.at)) > ($evdays * 86400) then " — STALE, older than \($evdays) days" else "" end) end)
      ];

    # ---- batch jobs (design 0025 §15 Phase 3, PLAT-3.7) --------------------------
    # What a BatchJob needs before it runs unattended, from what batch.jq projected:
    # a restart that was proven, the composed alerts, a JobRepository on a platform
    # Postgres, a deadline on every schedule, and the last window's success rate.
    # Graded on the most-promoted environment's BatchJobs (the restart proof on any
    # environment's: it is proven in test); an application with no BatchJob gets
    # none of these signals at all, so a service's ledger does not change.
    def batch_signals($rep; $group; $ev):
      ([ ($rep.own.batch // [])[] | $batchBy[.] // empty ]) as $here |
      ([ $group[] | (.own.batch // [])[] | $batchBy[.] // empty ]) as $all |
      (if ($here | length) > 0 then $here else $all end) as $jobs |
      if ($jobs | length) == 0 then [] else
      ($jobs[0].namespace) as $env |
      ([ $jobs[] | .name ] | unique) as $names |
      # restart: per job, the newest restart run that ended, on any environment —
      # kept, or recorded by an earlier scorer run after its run was deleted — and
      # it proves the restart while it is younger than batch_restart_max_age_days.
      ([ $names[] | . as $n | ([ $all[] | select(.name == $n) | .restarts[] ] | sort_by(.at // 0) | last) as $r
         | {name: $n, run: $r} ]) as $restarts |
      ($ev.batchRestart // null) as $rt |
      ($rt != null and $rt.status == "passed" and ($now - ($rt.testedAtEpoch // 0)) <= ($evdays * 86400)) as $rtPassed |
      ([ $restarts[] | select($rtPassed | not)
         | if .run == null then "\(.name) (never restarted)"
           elif .run.o != "succeeded" then "\(.name) (its newest restart, \(.run.name), failed \(ago(.run.at // 0)))"
           elif ($now - (.run.at // 0)) > ($batchrestartdays * 86400) then "\(.name) (last proven by \(.run.name) \(ago(.run.at)), older than \($batchrestartdays) days)"
           else empty end ]) as $unproven |
      ([ $jobs[] | select(.alertsEnabled | not) | .name ]) as $silenced |
      ([ $jobs[] | select(.alertsEnabled and ((.alerts | index("BatchRunFailed")) == null
                    or (.scheduled and (.alerts | index("BatchNoRecentSuccess")) == null))) | .name ]) as $noAlerts |
      ([ $jobs[] | select(.database.cluster == null) | "\(.name) (\(.database.secret))" ]) as $notPlatformPg |
      ([ $jobs[] | select(.scheduled) ]) as $scheduled |
      ([ $scheduled[] | select((.finishBy // "") == "") | .name ]) as $noDeadline |
      ([ $jobs[].outcomes.succeeded ] | add // 0) as $ok |
      ([ $jobs[].outcomes.failed ] | add // 0) as $failed |
      ($ok + $failed) as $total |
      (if $total > 0 then $ok / $total * 100 else null end) as $rate |
      # A schedule that ran nothing in the window, though it is older than the window
      # and neither held nor suspended, has stopped: that is a 0% job, not one with
      # no evidence. Only Prometheus can say so; the runs still kept cannot (the TTL
      # removes them), so without it nothing is called stopped.
      ([ $scheduled[] | select($batchProm and (.paused | not)
           and .createdAt != null and .createdAt <= ($now - $batchwindow * 86400)
           and (.outcomes.succeeded + .outcomes.failed) == 0) | .name ]) as $stopped |
      [
        sig("batch_restart_test"; "resilience"; true; b(($unproven | length) == 0);
            if ($unproven | length) == 0 then
              (if $rtPassed then "the batch restart test passed in \($rt.environment // "test"), \(ago($rt.testedAtEpoch))"
               else "a restarted run completed for every job: \([ $restarts[] | "\(.run.name) (\(ago(.run.at // 0)))" ] | join(", "))" end)
            else "no restart proven for \($unproven | join(", ")): kill a run mid-way in test and restart it (adhar batch restart); it must finish from its last commit" end),
        sig("batch_alerts"; "observability"; true; b(($silenced | length) == 0 and ($noAlerts | length) == 0);
            if ($silenced | length) > 0 then "alerts.enabled is false on \($silenced | join(", ")): a failed or missed run pages nobody"
            elif ($noAlerts | length) > 0 then "no composed BatchRunFailed (and, on a schedule, BatchNoRecentSuccess) for \($noAlerts | join(", ")) in \($env)"
            else "BatchRunFailed\(if ($scheduled | length) > 0 then " and BatchNoRecentSuccess" else "" end) are composed for every job in \($env)" end),
        sig("batch_jdbc_repository"; "reliability"; true; b(($notPlatformPg | length) == 0);
            if ($notPlatformPg | length) == 0 then "every JobRepository is on a platform Postgres: \([ $jobs[] | "\(.name) on \(if .database.provider != null then "Database \(.database.cluster) (\(.database.provider))" else .database.cluster end)\(if .database.backup then " (backed up)" else "" end)" ] | join(", "))"
            else "the JobRepository of \($notPlatformPg | join(", ")) is neither a CloudNativePG cluster nor a platform Database on a cloud Postgres in \($env): restart from the last commit depends on a database the platform neither runs nor backs up" end),
        sig("batch_deadline"; "operations"; (($scheduled | length) > 0); b(($noDeadline | length) == 0);
            if ($noDeadline | length) == 0 then "every schedule has a deadline: \([ $scheduled[] | "\(.name) by \(.finishBy)" ] | join(", "))"
            else "no sla.finishBy on \($noDeadline | join(", ")): nothing warns before a late run misses the business's deadline" end),
        sig("batch_success_rate"; "reliability"; ($total > 0 or ($stopped | length) > 0);
            b($rate != null and $rate >= $batchminpct and ($stopped | length) == 0);
            if ($stopped | length) > 0 then "no run of \($stopped | join(", ")) finished in the last \($batchwindow) days in \($env), though it is scheduled and neither held nor suspended"
              + (if $total > 0 then "; \($ok) of \($total) runs of the others succeeded" else "" end)
            elif $total == 0 then "no run finished in the last \($batchwindow) days in \($env)"
            else "\($ok) of \($total) runs succeeded over \($batchwindow) days in \($env) (\($rate | floor)%, at least \($batchminpct)% required)"
              + (if $batchProm then "" else "; Prometheus did not answer, so only the runs still kept are counted" end) end)
      ] end;

    # ---- assemble ------------------------------------------------------------------
    # Applications only — the same set the Service Catalog lists. Platform
    # packages are not graded: they are the platform's own concern, not a
    # team's, and grading all ~78 of them buried the handful of applications a
    # team actually owns on the Scorecards page (2026-10-22). score.sh already
    # drops them at collection; the select below keeps the program honest if
    # it is fed an unfiltered list.
    ($apps.items // []) as $items
    | [ $items[] | select(.app != null) ] | group_by(.app)
    | map(
        . as $group
        | ($group[0].app) as $appName
        # the most-promoted environment that has actually been deployed
        | ($group | map(. + {rank: envrank(.env // ""), deployed: ((.own.total // 0) > 0)})
                  | (map(select(.deployed)) | sort_by(.rank) | first) // (sort_by(.rank) | first)) as $rep
        | ($rep | base) as $b
        | ($evidence[$appName] // {}) as $ev
        | {
            kind: "application",
            name: $appName,
            namespace: $b.namespace,
            environment: ($rep.env // $rep.ns),
            environments: [ $group | sort_by(envrank(.env // ""))[] | {name: (.env // .ns), namespace: .ns, health, sync, argocdApp: .name} ],
            stateful: $b.stateful,
            health: $b.health,
            sync: $b.sync,
            evidence: ($ev | {environment, image, testedAt, target, performance, chaos, chaosSuite, slo, pending} | with_entries(select(.value != null))),
            signals: ($b.signals + ($b | static_resilience($rep.env // $rep.ns)) + ($b | supply_efficiency($rep.env // $rep.ns)) + evidence_signals($ev; $b.batchOnly) + team_signals($appName) + batch_signals($rep; $group; $ev)),
        perfCenter: ($perfCenter[$appName] // null),
        gameDays: ($gameDays[$appName] // null)
          }
        | finish )
    | . as $applications
    | $applications as $services
    | {
        generatedAt: $ts,
        weights: {reliability:$wrel, security:$wsec, observability:$wobs, operations:$wops,
                  performance:$wperf, resilience:$wres, supply_chain:$wsup, efficiency:$weff},
        gradeThresholds: {A:$ga, B:$gb, C:$gc, D:$gd},
        serviceCount: ($services | length),
        applicationCount: ($applications | length),
        averageScore: (if ($services | length) > 0
                       then ([ $services[].score ] | add) / ($services | length) | floor
                       else 0 end),
        services: ($services | sort_by(.score) | reverse)
      }
  batch.jq: |
    # The batch evidence (design 0025 §15 Phase 3, PLAT-3.7), projected per BatchJob
    # for score.jq's batch signals. Run by score.sh with -n; every input is one
    # document (--slurpfile, hence the [0] unwraps) and may be empty or an error:
    #   $bjf      BatchJobs (platform.adhar.io) in the application namespaces
    #   $rulesf   PrometheusRules labelled adhar.io/batch-job (the composed <name>-batch)
    #   $runsf    batch/v1 Jobs labelled adhar.io/batch-job (the runs still kept)
    #   $vcrunsf  Volcano Jobs labelled adhar.io/batch-job (gang runs)
    #   $cnpgf    CNPG Clusters, for which Secret is a platform Postgres's
    #   $promf    {native: {succeeded, failed}, volcano: {succeeded, failed}}: raw
    #             Prometheus /api/v1/query answers, null where Prometheus did not answer
    # and, optional (read through $ARGS.named, so a caller passing neither still runs):
    #   dbf       Database XRs (platform.adhar.io), for which Secret is a cloud Postgres's
    #   restartsf the scorer's own record of each BatchJob's newest restart that ended
    #             ({"<ns>/<batchjob>": {name, o, at}}, ConfigMap adhar-scorecards-batch-restarts)
    # Output: {byKey: {"<ns>/<batchjob>": {...}}, prometheus: bool, lastRestarts: {...}}.
    (($bjf // [{}])[0].items // []) as $bjs
    | (($rulesf // [{}])[0].items // []) as $rules
    | (($runsf // [{}])[0].items // []) as $runs
    | (($vcrunsf // [{}])[0].items // []) as $vcruns
    | (($cnpgf // [{}])[0].items // []) as $cnpg
    | (($promf // [{}])[0] // {}) as $prom
    | ((($ARGS.named.dbf // [{}])[0] // {}).items // []) as $dbs
    | (($ARGS.named.restartsf // [{}])[0] // {} | if type == "object" then . else {} end) as $recorded
    | ($now - ($windowdays * 86400)) as $since
    |
    def epoch($t): (($t // "") | sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601? // null);
    def bj($o): ($o.metadata.labels["adhar.io/batch-job"] // "");
    # A run's outcome and when it reached it: a batch/v1 Job by its Complete or
    # Failed condition, a Volcano Job by its phase.
    def outcome:
      if .apiVersion == "batch/v1" then
        ([ (.status.conditions // [])[] | select(.status == "True" and (.type == "Complete" or .type == "Failed")) ] | first) as $c
        | if $c == null then null
          else {o: (if $c.type == "Complete" then "succeeded" else "failed" end),
                at: epoch($c.lastTransitionTime // .status.completionTime)} end
      else
        (.status.state.phase // "") as $p
        | if $p == "Completed" then {o: "succeeded", at: epoch(.status.state.lastTransitionTime)}
          elif ($p == "Failed" or $p == "Terminated" or $p == "Aborted") then {o: "failed", at: epoch(.status.state.lastTransitionTime)}
          else null end
      end;
    # Prometheus answers, "<ns>/<batchjob>" -> count; null when it did not answer.
    def counts($r; $lbl):
      if ($r | type) == "object" and $r.status == "success"
      then reduce ($r.data.result // [])[] as $x ({}; .["\($x.metric.namespace)/\($x.metric[$lbl] // "")"] = ($x.value[1] | tonumber))
      else null end;
    (counts($prom.native.succeeded; "label_adhar_io_batch_job")) as $ns_ok
    | (counts($prom.native.failed; "label_adhar_io_batch_job")) as $ns_fail
    # Volcano's series exist only where Volcano runs; a query that answered with
    # nothing and one that was never asked both read as no gang runs.
    | (counts($prom.volcano.succeeded; "batch_job") // {}) as $vc_ok
    | (counts($prom.volcano.failed; "batch_job") // {}) as $vc_fail
    | ($ns_ok != null and $ns_fail != null) as $promOk
    | ([ ($runs + $vcruns)[] | . as $r | outcome as $x | select($x != null)
         | {key: "\($r.metadata.namespace)/\(bj($r))", name: $r.metadata.name,
            trigger: ($r.metadata.labels["adhar.io/batch-trigger"] // ""), o: $x.o, at: $x.at} ]) as $finished
    # The Secrets that ARE a platform Postgres: CNPG publishes <cluster>-app unless
    # the cluster bootstraps from a Secret of its own, which it then uses.
    | (reduce $cnpg[] as $c ({};
        ($c.spec.bootstrap.initdb.secret.name // "\($c.metadata.name)-app") as $s
        | .["\($c.metadata.namespace)/\($s)"] = {cluster: $c.metadata.name, backup: ($c.spec.backup != null)})) as $pgSecrets
    # A Database XR on a CLOUD Postgres is a platform Postgres too: the platform
    # composes it and the cloud runs and backs it up. Its connection Secret is what
    # the composition writes (writeConnectionSecretToRef, else <name>-db in
    # adhar-system). Only the PostgreSQL cloud compositions count — Azure's is SQL
    # Server — and the local one is not listed: it composes a CNPG Cluster, which
    # the reduce above already matched. A compositionRef, when set, decides alone.
    | {"database-aws-rds-postgresql": "aws", "database-gcp-cloudsql": "gcp"} as $pgCompositions
    | ([ $pgCompositions[] ]) as $pgProviders
    | (reduce $dbs[] as $d ($pgSecrets;
        ($d.spec.crossplane.compositionRef.name // $d.spec.compositionRef.name // "") as $ref
        | ($d.spec.crossplane.compositionSelector.matchLabels.provider // $d.spec.compositionSelector.matchLabels.provider // "local") as $sel
        | (if $ref != "" then $pgCompositions[$ref] elif ($pgProviders | index($sel)) != null then $sel else null end) as $provider
        | if $provider == null or (($d.spec.parameters.engine // "postgresql") != "postgresql") then .
          else ($d.spec.writeConnectionSecretToRef // {}) as $w
            | .["\($w.namespace // "adhar-system")/\($w.name // "\($d.metadata.name)-db")"] =
                {cluster: $d.metadata.name, provider: $provider, backup: ($d.spec.parameters.enableBackup != false)} end)) as $pgSecrets
    | (reduce $bjs[] as $b ({};
          ($b.metadata.namespace) as $ns | ($b.metadata.name) as $name | "\($ns)/\($name)" as $k
          | ($b.spec.parameters // {}) as $p
          | ([ $finished[] | select(.key == $k) ]) as $mine
          | ([ $mine[] | select(.at != null and .at >= $since) ]) as $recent
          | .[$k] = {
              name: $name, namespace: $ns,
              scheduled: ((($p.schedule // {}).cron // "") != ""),
              # A schedule that is held or declared suspended is not expected to run;
              # one older than the window that is neither, and ran nothing, stopped.
              paused: ((($b.metadata.annotations // {}) | has("adhar.io/batch-hold"))
                       or (($p.schedule // {}).suspend == true)),
              createdAt: epoch($b.metadata.creationTimestamp),
              finishBy: (($p.sla // {}).finishBy // null),
              alertsEnabled: ((($p.alerts // {}).enabled) != false),
              alerts: ([ $rules[] | select(.metadata.namespace == $ns and bj(.) == $name)
                         | (.spec.groups // [])[] | (.rules // [])[] | .alert // empty ] | unique),
              database: ((($p.database // {}).secretRef // "") as $s
                         | {secret: $s} + ($pgSecrets["\($ns)/\($s)"] // {cluster: null, backup: false})),
              # Restart runs (trigger restart: `adhar batch restart`, or `adhar batch
              # run --wait` restarting a failed run as -r<n>) that reached an end —
              # the ones still kept, plus the newest the scorer recorded before: a
              # run is deleted ttlSecondsAfterFinished (7 days) after it ends, and
              # the proof of a restart must not go with it. A record older than this
              # BatchJob (deleted and created again) proves nothing about it.
              restarts: (([ $mine[] | select(.trigger == "restart") ]) as $kept
                         | ($recorded[$k] // null) as $r
                         | $kept + (if $r != null and ($r.at | type) == "number" and ($r.o == "succeeded" or $r.o == "failed")
                                       and ([ $kept[] | .name ] | index($r.name)) == null
                                       and $r.at >= (epoch($b.metadata.creationTimestamp) // 0)
                                    then [{name: $r.name, trigger: "restart", o: $r.o, at: $r.at, recorded: true}] else [] end)
                         | sort_by(.at // 0)),
              outcomes: (if $promOk
                         then {source: "prometheus",
                               succeeded: (($ns_ok[$k] // 0) + ($vc_ok[$k] // 0)),
                               failed: (($ns_fail[$k] // 0) + ($vc_fail[$k] // 0))}
                         else {source: "runs",
                               succeeded: ([ $recent[] | select(.o == "succeeded") ] | length),
                               failed: ([ $recent[] | select(.o == "failed") ] | length)} end)
            })) as $byKey
    | {
        prometheus: $promOk,
        byKey: $byKey,
        # What score.sh records for the next run: each BatchJob's newest restart
        # that ended, failed ones included — a failed restart must not be
        # forgotten in favour of an older success once its run is deleted.
        lastRestarts: ($byKey | to_entries
          | map(.value.restarts as $rs | select(($rs | length) > 0 and ($rs | last | .at) != null)
                | {key: .key, value: ($rs | last | {name, o, at})})
          | from_entries)
      }
  score.sh: |
    #!/usr/bin/env bash
    # adhar production-readiness scorer. Gathers real adhar-controlplane signals and
    # writes a 0-100 score + letter grade per service to a ConfigMap.
    set -euo pipefail

    OUT_NS="${OUTPUT_NAMESPACE:-adhar-system}"
    OUT_CM="${OUTPUT_CONFIGMAP:-adhar-scorecards}"
    CONFIG_DIR="${CONFIG_DIR:-/config}"
    WORKDIR="$(mktemp -d)"
    trap 'rm -rf "$WORKDIR"' EXIT

    # Read a tunable from the mounted config ConfigMap, with a fallback default.
    readcfg() {
      local f="$CONFIG_DIR/$1"
      if [ -f "$f" ]; then tr -d ' \n\r' < "$f"; else printf '%s' "$2"; fi
    }

    W_REL=$(readcfg weight_reliability 35)
    W_SEC=$(readcfg weight_security 25)
    W_OBS=$(readcfg weight_observability 15)
    W_OPS=$(readcfg weight_operations 25)
    W_PERF=$(readcfg weight_performance 20)
    W_RES=$(readcfg weight_resilience 25)
    W_SUP=$(readcfg weight_supply_chain 20)
    W_EFF=$(readcfg weight_efficiency 10)
    TRUSTED_REGISTRIES=$(readcfg trusted_registries harbor)
    CPU_MIN=$(readcfg rightsize_cpu_min_pct 10)
    CPU_MAX=$(readcfg rightsize_cpu_max_pct 100)
    MEM_MIN=$(readcfg rightsize_mem_min_pct 20)
    MEM_MAX=$(readcfg rightsize_mem_max_pct 100)
    # Evidence from the resilience runner older than this no longer counts.
    EVIDENCE_DAYS=$(readcfg evidence_max_age_days 7)
    P95_DEFAULT=$(readcfg perf_p95_ms 500)
    RECOVERY_MAX=$(readcfg chaos_recovery_max_seconds 120)
    # Most-promoted first: an application is graded on the first of these it
    # has actually been deployed to.
    ENV_ORDER=$(readcfg environment_order prod,test,dev)
    SCRIPT_DIR="${SCRIPT_DIR:-/scripts}"
    G_A=$(readcfg grade_a 90)
    G_B=$(readcfg grade_b 80)
    G_C=$(readcfg grade_c 70)
    G_D=$(readcfg grade_d 60)

    # Collect a resource cluster-wide, then immediately PROJECT it down to the
    # handful of fields the scoring program reads and INDEX it by the keys the
    # program looks up. Both steps were forced by running this on a real
    # cluster:
    #   * a payload must never travel as a command-line argument — the combined
    #     JSON is megabytes and `jq --argjson` dies with "Argument list too
    #     long" (ARG_MAX), so everything moves through files and --slurpfile;
    #   * the raw objects are mostly managedFields and last-applied
    #     annotations, and the scoring program used to re-scan every workload
    #     for every service (O(services x workloads)), which blew past the
    #     job's activeDeadlineSeconds. Projecting first and looking up by key
    #     makes the per-service work O(1).
    fetch() {  # fetch <resource> <name>
      kubectl get "$1" -A -o json 2>/dev/null >"$WORKDIR/$2.raw" || true
      [ -s "$WORKDIR/$2.raw" ] || echo '{"items":[]}' >"$WORKDIR/$2.raw"
    }
    project() {  # project <name> <jq program>
      jq -c "$2" "$WORKDIR/$1.raw" >"$WORKDIR/$1.json" || echo '{}' >"$WORKDIR/$1.json"
      rm -f "$WORKDIR/$1.raw"
    }

    echo "adhar-scorecard: collecting signals..."
    fetch applications.argoproj.io apps
    # Only delivered applications (Argo CD Applications labelled
    # adhar.io/application) are graded, so only they are kept — and every
    # other signal is collected from the namespaces they deploy into rather
    # than from the whole cluster, which is almost entirely platform packages.
    jq '{items: [ (.items // [])[] | select(.metadata.labels["adhar.io/application"] != null) ]}' \
      "$WORKDIR/apps.raw" >"$WORKDIR/apps.filtered" && mv "$WORKDIR/apps.filtered" "$WORKDIR/apps.raw"
    APP_NS="$(jq -r '[ .items[] | .spec.destination.namespace // empty ] | unique | .[]' "$WORKDIR/apps.raw")"
    echo "adhar-scorecard: $(jq '.items | length' "$WORKDIR/apps.raw") application environment(s) in: $(printf "%s " $APP_NS)"
    # fetch_ns <resource> <name> [selector]: like fetch, over the application
    # namespaces, optionally only objects carrying a label.
    fetch_ns() {
      : >"$WORKDIR/$2.ndjson"
      for ns in $APP_NS; do
        kubectl -n "$ns" get "$1" ${3:+-l "$3"} -o json 2>/dev/null | jq -c '(.items // [])[]' >>"$WORKDIR/$2.ndjson" || true
      done
      jq -s '{items: .}' "$WORKDIR/$2.ndjson" >"$WORKDIR/$2.raw" 2>/dev/null || echo '{"items":[]}' >"$WORKDIR/$2.raw"
      rm -f "$WORKDIR/$2.ndjson"
    }
    # DaemonSets count: an application may ship one.
    fetch_ns deployments,statefulsets,daemonsets core-workloads
    # Argo Rollouts are what every application template ships. They are fetched
    # on their own: one unknown type in a combined `kubectl get` makes it return
    # NOTHING for the others, so a cluster without the Rollouts CRD would have
    # lost every Deployment too.
    fetch_ns rollouts.argoproj.io rollouts
    jq -s '{items: ((.[0].items // []) + (.[1].items // []))}' \
      "$WORKDIR/core-workloads.raw" "$WORKDIR/rollouts.raw" >"$WORKDIR/workloads.raw"
    rm -f "$WORKDIR/core-workloads.raw" "$WORKDIR/rollouts.raw"
    fetch_ns policyreports.wgpolicyk8s.io reports
    fetch_ns httproutes.gateway.networking.k8s.io routes
    fetch schedules.velero.io schedules
    fetch_ns clusters.postgresql.cnpg.io cnpg
    fetch_ns horizontalpodautoscalers.autoscaling hpas
    fetch_ns poddisruptionbudgets.policy pdbs
    # Trivy Operator's per-workload vulnerability reports (absent without it).
    fetch_ns vulnerabilityreports.aquasecurity.github.io vulns

    # Batch (design 0025, PLAT-3.7): the BatchJobs applications deliver, the alerts
    # the composition renders for each, their runs, the Postgres clusters the
    # JobRepository can live on, and seven days of run outcomes from Prometheus —
    # the runs themselves are no history: a CronJob keeps its last three of each.
    # Collected only from the application namespaces, like everything else.
    fetch_ns batchjobs.platform.adhar.io batchjobs
    fetch_ns prometheusrules.monitoring.coreos.com batchrules adhar.io/batch-job
    fetch_ns jobs.batch batchruns adhar.io/batch-job
    fetch_ns jobs.batch.volcano.sh vcbatchruns adhar.io/batch-job
    # Database XRs: a JobRepository on a cloud Postgres the platform composes.
    fetch_ns databases.platform.adhar.io databases
    PROM="${PROMETHEUS_URL:-http://prometheus-kube-prometheus-prometheus.adhar-system.svc.cluster.local:9090}"
    BATCH_WINDOW_DAYS=$(readcfg batch_window_days 7)
    BATCH_RESTART_DAYS=$(readcfg batch_restart_max_age_days 30)
    # The newest restart of each BatchJob, as the scorer last saw it: a restart run
    # is deleted 7 days after it ends (ttlSecondsAfterFinished), and the proof must
    # outlive it. Only a ConfigMap that is ABSENT starts a fresh record; one that
    # could not be read leaves RESTARTS_OK=0, and the record is then not rewritten,
    # so a transient API error cannot erase every proof.
    RESTARTS_CM="${OUT_CM}-batch-restarts"
    RESTARTS_OK=1
    if kubectl -n "$OUT_NS" get configmap "$RESTARTS_CM" -o json >"$WORKDIR/restarts.raw" 2>"$WORKDIR/restarts.err"; then
      jq -c '(.data["restarts.json"] // "{}") | (fromjson? // {}) | if type == "object" then . else {} end' \
        "$WORKDIR/restarts.raw" >"$WORKDIR/restarts.json" 2>/dev/null || { echo '{}' >"$WORKDIR/restarts.json"; RESTARTS_OK=0; }
    elif grep -q NotFound "$WORKDIR/restarts.err"; then
      echo '{}' >"$WORKDIR/restarts.json"
    else
      echo '{}' >"$WORKDIR/restarts.json"; RESTARTS_OK=0
      echo "adhar-scorecard: could not read ${OUT_NS}/${RESTARTS_CM}; restart proofs are not updated this run"
    fi
    rm -f "$WORKDIR/restarts.raw" "$WORKDIR/restarts.err"
    promraw() {  # promraw <query> -> the raw API answer, or null
      curl -fsS --max-time 30 --data-urlencode "query=$1" "$PROM/api/v1/query" 2>/dev/null || echo null
    }
    # A run counts once, by name, at the outcome it reached in the window: kube-state-
    # metrics' series outlive the deleted Job in Prometheus, which is what makes them
    # history. Indexed (partitioned) Jobs complete as a whole, so Complete, never the
    # succeeded-pod count, is the success.
    W="${BATCH_WINDOW_DAYS}d"
    BJ='max by (namespace, job_name, label_adhar_io_batch_job) (max_over_time(kube_job_labels{label_adhar_io_batch_job!=""}['"$W"']))'
    jq -n -c \
      --argjson nok "$(promraw "count by (namespace, label_adhar_io_batch_job) ((max by (namespace, job_name) (max_over_time(kube_job_complete{condition=\"true\"}[$W])) > 0) * on (namespace, job_name) group_left (label_adhar_io_batch_job) $BJ)")" \
      --argjson nfail "$(promraw "count by (namespace, label_adhar_io_batch_job) ((max by (namespace, job_name) (max_over_time(kube_job_failed{condition=\"true\"}[$W])) > 0) * on (namespace, job_name) group_left (label_adhar_io_batch_job) $BJ)")" \
      --argjson vok "$(promraw "count by (namespace, batch_job) (max by (namespace, vcjob, batch_job) (max_over_time(kube_volcano_job_status_phase{phase=\"Completed\",batch_job!=\"\"}[$W])) > 0)")" \
      --argjson vfail "$(promraw "count by (namespace, batch_job) (max by (namespace, vcjob, batch_job) (max_over_time(kube_volcano_job_status_phase{phase=~\"Failed|Terminated|Aborted\",batch_job!=\"\"}[$W])) > 0)")" \
      '{native: {succeeded: $nok, failed: $nfail}, volcano: {succeeded: $vok, failed: $vfail}}' \
      >"$WORKDIR/batchprom.json" 2>/dev/null || echo '{}' >"$WORKDIR/batchprom.json"
    jq -n -c -f "$SCRIPT_DIR/batch.jq" \
      --slurpfile bjf "$WORKDIR/batchjobs.raw" --slurpfile rulesf "$WORKDIR/batchrules.raw" \
      --slurpfile runsf "$WORKDIR/batchruns.raw" --slurpfile vcrunsf "$WORKDIR/vcbatchruns.raw" \
      --slurpfile cnpgf "$WORKDIR/cnpg.raw" --slurpfile promf "$WORKDIR/batchprom.json" \
      --slurpfile dbf "$WORKDIR/databases.raw" --slurpfile restartsf "$WORKDIR/restarts.json" \
      --argjson now "$(date -u +%s)" --argjson windowdays "$BATCH_WINDOW_DAYS" \
      >"$WORKDIR/batch.json" 2>/dev/null || echo '{}' >"$WORKDIR/batch.json"
    rm -f "$WORKDIR/batchjobs.raw" "$WORKDIR/batchrules.raw" "$WORKDIR/batchruns.raw" "$WORKDIR/vcbatchruns.raw" "$WORKDIR/batchprom.json" "$WORKDIR/databases.raw"
    # Merged, never replaced: a BatchJob missing from this run's listing (an API
    # hiccup the fetch swallows) keeps its record. A record older than the proof
    # window decides nothing any more and is dropped, which bounds the ConfigMap.
    if [ "$RESTARTS_OK" = 1 ] && jq -e 'has("lastRestarts")' "$WORKDIR/batch.json" >/dev/null 2>&1; then
      jq -n -c --slurpfile prev "$WORKDIR/restarts.json" --slurpfile cur "$WORKDIR/batch.json" \
            --argjson now "$(date -u +%s)" --argjson days "$BATCH_RESTART_DAYS" \
        '($prev[0] + $cur[0].lastRestarts) | with_entries(select((.value.at | type) == "number" and .value.at >= ($now - $days * 86400)))' \
        >"$WORKDIR/restarts.next" 2>/dev/null \
        && kubectl create configmap "$RESTARTS_CM" -n "$OUT_NS" --from-file=restarts.json="$WORKDIR/restarts.next" \
             --dry-run=client -o yaml | kubectl apply -f - >/dev/null \
        && kubectl -n "$OUT_NS" label configmap "$RESTARTS_CM" adhar.io/component=scorecards \
             app.kubernetes.io/managed-by=adhar-scorecard-scorer app.kubernetes.io/part-of=adhar --overwrite >/dev/null \
        || echo "adhar-scorecard: could not record restart proofs in ${OUT_NS}/${RESTARTS_CM}"
    fi
    rm -f "$WORKDIR/restarts.json" "$WORKDIR/restarts.next"

    # Evidence from the resilience runner (load test, chaos, live SLO). It is
    # runtime data the runner writes; absent until its first run.
    kubectl -n "$OUT_NS" get configmap "${EVIDENCE_CONFIGMAP:-adhar-resilience-results}" \
      -o jsonpath='{.data.results\.json}' >"$WORKDIR/evidence.json" 2>/dev/null || true
    jq -e 'type == "object"' "$WORKDIR/evidence.json" >/dev/null 2>&1 || echo '{}' >"$WORKDIR/evidence.json"

    # Performance Center results a team ran themselves (console, schedule, CI)
    # against an application: the console stamps adhar.io/application on every
    # result whose test targets one. Only the verdict the Performance Center
    # recorded is read (gate budgets + baseline regression) — the scorer never
    # re-judges a run the Performance Center already judged.
    kubectl get configmaps -A -l 'adhar.io/perf-result=true,adhar.io/application' -o json 2>/dev/null >"$WORKDIR/perfcenter.raw" || true
    [ -s "$WORKDIR/perfcenter.raw" ] || echo '{"items":[]}' >"$WORKDIR/perfcenter.raw"
    jq -c '[ (.items // [])[] | (.metadata.annotations // {}) as $a | {
        app: .metadata.labels["adhar.io/application"],
        test: (.metadata.labels["adhar.io/perf-test"] // ""),
        namespace: .metadata.namespace,
        trigger: (.metadata.labels["adhar.io/perf-trigger"] // ""),
        verdict: ($a["adhar.io/perf-verdict"] // ""),
        reasons: ($a["adhar.io/perf-verdict-reasons"] // ""),
        at: ($a["adhar.io/perf-finished"] // .metadata.creationTimestamp) } ]
      | group_by(.app) | map({key: .[0].app, value: {count: length, tests: ([.[].test] | unique),
          # `latest` keeps its meaning (the newest run, judged or not): the
          # Console reads it, and turning it into null when nothing was judged
          # crashed the Performance Center page (Cannot read properties of
          # null, reading verdict; 2026-10-22). The SIGNAL reads `judged`,
          # the newest run with a verdict: a result recorded with none (the
          # console recorded its own runs that way until 2026-10-22) was never
          # judged, so it neither passes nor fails the application.
          latest: (sort_by(.at) | last),
          judged: (map(select(.verdict != "")) | sort_by(.at) | last),
          unjudged: (map(select(.verdict == "")) | length)}})
      | from_entries' "$WORKDIR/perfcenter.raw" >"$WORKDIR/perfcenter.json" 2>/dev/null || echo '{}' >"$WORKDIR/perfcenter.json"
    rm -f "$WORKDIR/perfcenter.raw"

    # Game days: Litmus results of chaos run from the console (or ChaosCenter)
    # rather than by the resilience runner, attributed to an application by the
    # workload Litmus targeted — every template names its Rollout after the app.
    kubectl -n "$OUT_NS" get chaosresults.litmuschaos.io -o json 2>/dev/null >"$WORKDIR/gameday.raw" || true
    [ -s "$WORKDIR/gameday.raw" ] || echo '{"items":[]}' >"$WORKDIR/gameday.raw"
    jq -c '[ (.items // [])[] | select((.spec.engine // "") | startswith("adhar-chaos-") | not)
        | . as $r | (.status.history.targets // [])[] | {
          app: .name,
          experiment: ($r.spec.experiment // ""),
          engine: ($r.spec.engine // ""),
          verdict: ($r.status.experimentStatus.verdict // ""),
          probe: ($r.status.experimentStatus.probeSuccessPercentage // ""),
          at: ($r.metadata.creationTimestamp // "") } ]
      | group_by(.app) | map({key: .[0].app, value: {count: length,
          experiments: ([.[].experiment] | unique), latest: (sort_by(.at) | last)}})
      | from_entries' "$WORKDIR/gameday.raw" >"$WORKDIR/gameday.json" 2>/dev/null || echo '{}' >"$WORKDIR/gameday.json"
    rm -f "$WORKDIR/gameday.raw"

    echo "adhar-scorecard: indexing signals..."
    # `.status.resources` is ArgoCD's own inventory of what each Application
    # manages. It is the only precise attribution available: every platform
    # package now installs into the SAME namespace (ADR-0011), so a
    # namespace-keyed signal is identical for all of them and says nothing
    # about an individual service.
    project apps '{items: [ (.items // [])[] | (.status.resources // []) as $rs | {
        name: .metadata.name,
        app:  (.metadata.labels["adhar.io/application"] // null),
        env:  (.metadata.labels["adhar.io/environment"] // .spec.destination.namespace // null),
        ns:   (.spec.destination.namespace // .metadata.namespace // "default"),
        health: (.status.health.status // "Unknown"),
        sync:   (.status.sync.status // "Unknown"),
        own: {
          total:  ($rs | length),
          wl:     [ $rs[] | select(.kind == "Deployment" or .kind == "StatefulSet" or .kind == "DaemonSet" or .kind == "Rollout")
                    | "\(.namespace // "")/\(.kind)/\(.name)" ],
          routes: ([ $rs[] | select(.kind == "HTTPRoute") ] | length),
          batch:  [ $rs[] | select(.kind == "BatchJob" and ((.group // "") == "platform.adhar.io"))
                    | "\(.namespace // "")/\(.name)" ],
          cnpg:   [ $rs[] | select(.kind == "Cluster" and ((.group // "") == "postgresql.cnpg.io"))
                    | "\(.namespace // "")/\(.name)" ] } } ]}'

    # Pods only for the namespaces applications are delivered into: their
    # restart counts are a resilience signal, and listing every platform pod
    # just to throw them away would cost more than the rest of the run.
    : >"$WORKDIR/pods.ndjson"
    for ns in $APP_NS; do
      kubectl -n "$ns" get pods -o json 2>/dev/null | jq -c '(.items // [])[] | {
          ns: .metadata.namespace, name: .metadata.name, labels: (.metadata.labels // {}),
          req: [ (.spec.containers // [])[] | {cpu: .resources.requests.cpu, mem: .resources.requests.memory} ],
          restarts: ([ (.status.containerStatuses // [])[].restartCount ] | add // 0) }' >>"$WORKDIR/pods.ndjson" || true
    done
    jq -s 'group_by(.ns) | map({key: .[0].ns, value: .}) | from_entries' "$WORKDIR/pods.ndjson" >"$WORKDIR/pods.json" \
      || echo '{}' >"$WORKDIR/pods.json"

    # Live pod usage from metrics-server, keyed "<ns>/<pod>". A cluster without
    # metrics-server leaves this empty and the efficiency category reports null.
    : >"$WORKDIR/metrics.ndjson"
    for ns in $APP_NS; do
      kubectl get --raw "/apis/metrics.k8s.io/v1beta1/namespaces/${ns}/pods" 2>/dev/null | jq -c '(.items // [])[] | {
          key: "\(.metadata.namespace)/\(.metadata.name)",
          value: [ (.containers // [])[] | {cpu: .usage.cpu, mem: .usage.memory} ] }' >>"$WORKDIR/metrics.ndjson" || true
    done
    jq -s 'from_entries' "$WORKDIR/metrics.ndjson" >"$WORKDIR/metrics.json" 2>/dev/null || echo '{}' >"$WORKDIR/metrics.json"
    rm -f "$WORKDIR/metrics.ndjson"

    project workloads '[ (.items // [])[] | {
        kind: .kind,
        ns:   .metadata.namespace,
        name: .metadata.name,
        inst: (.metadata.labels["app.kubernetes.io/instance"] // null),
        replicas: (.spec.replicas // 1),
        podLabels: (.spec.template.metadata.labels // {}),
        progressive: (.kind == "Rollout" and (((.spec.strategy.canary // .spec.strategy.blueGreen) // null) != null)),
        spread: ((((.spec.template.spec.topologySpreadConstraints // []) | length) > 0)
                 or (.spec.template.spec.affinity.podAntiAffinity != null)),
        containers: [ (.spec.template.spec.containers // [])[] | {
            image: .image,
            probes: ((.readinessProbe != null) and (.livenessProbe != null)),
            res:    ((.resources.requests != null) and (.resources.limits != null)),
            preStop: (.lifecycle.preStop != null) } ] } ]
      | { byKey:      (map({key: "\(.ns)/\(.kind)/\(.name)", value: .}) | from_entries),
          byInstance: (group_by(.inst) | map(select(.[0].inst != null) | {key: .[0].inst, value: .}) | from_entries),
          byNs:       (group_by(.ns)   | map({key: .[0].ns, value: .}) | from_entries) }'
    project hpas '{ byTarget: ( reduce (.items // [])[] as $h ({};
        .["\($h.metadata.namespace)/\($h.spec.scaleTargetRef.kind)/\($h.spec.scaleTargetRef.name)"] =
          { min: ($h.spec.minReplicas // 1), max: ($h.spec.maxReplicas // 1) } ) ) }'
    project pdbs '{ byNs: ( reduce (.items // [])[] as $p ({};
        .[$p.metadata.namespace] = ((.[$p.metadata.namespace] // []) + [ ($p.spec.selector.matchLabels // {}) ]) ) ) }'
    project reports '{
        byKey: ( reduce (.items // [])[] as $r ({};
          "\($r.scope.namespace // $r.metadata.namespace // "")/\($r.scope.kind // "")/\($r.scope.name // "")" as $k
          | .[$k] = { pass: ((.[$k].pass // 0) + ($r.summary.pass // 0)),
                      fail: ((.[$k].fail // 0) + ($r.summary.fail // 0)) } ) ),
        byNs: ( reduce (.items // [])[] as $r ({};
          ($r.metadata.namespace // "_cluster") as $ns
          | .[$ns] = { pass: ((.[$ns].pass // 0) + ($r.summary.pass // 0)),
                       fail: ((.[$ns].fail // 0) + ($r.summary.fail // 0)) } ) ) }'
    project vulns 'reduce (.items // [])[] as $v ({};
        ($v.metadata.namespace) as $ns
        | .[$ns] = ((.[$ns] // []) + [ {
            name: ($v.metadata.labels["trivy-operator.resource.name"] // ""),
            repo: ($v.report.artifact.repository // ""),
            tag: ($v.report.artifact.tag // ""),
            digest: ($v.report.artifact.digest // ""),
            critical: ($v.report.summary.criticalCount // 0),
            high: ($v.report.summary.highCount // 0) } ]))'
    project routes '{ nsSet: ( reduce (.items // [])[] as $r ({}; .[$r.metadata.namespace] = true) ) }'
    project cnpg '{
        byKey: ( reduce (.items // [])[] as $c ({};
          .["\($c.metadata.namespace)/\($c.metadata.name)"] = { backup: ($c.spec.backup != null) } ) ),
        byNs: ( reduce (.items // [])[] as $c ({};
          ($c.metadata.namespace) as $ns
          | .[$ns] = { count:  ((.[$ns].count // 0) + 1),
                       backup: ((.[$ns].backup // false) or ($c.spec.backup != null)) } ) ) }'
    project schedules '{
        all:   ([ (.items // [])[] | select((((.spec.template.includedNamespaces // []) | index("*"))) != null) ] | length > 0),
        nsSet: ( reduce (.items // [])[] as $s ({};
                   reduce (($s.spec.template.includedNamespaces // [])[]) as $n (.; .[$n] = true) ) ) }'

    echo "adhar-scorecard: computing scores..."
    # --slurpfile binds an ARRAY of the file's documents; each file holds one
    # document, hence the `[0]` unwrap below.
    jq -n -f "$SCRIPT_DIR/score.jq" \
      --slurpfile appsf "$WORKDIR/apps.json" \
      --slurpfile workloadsf "$WORKDIR/workloads.json" \
      --slurpfile reportsf "$WORKDIR/reports.json" \
      --slurpfile routesf "$WORKDIR/routes.json" \
      --slurpfile schedulesf "$WORKDIR/schedules.json" \
      --slurpfile cnpgf "$WORKDIR/cnpg.json" \
      --slurpfile hpasf "$WORKDIR/hpas.json" \
      --slurpfile pdbsf "$WORKDIR/pdbs.json" \
      --slurpfile podsf "$WORKDIR/pods.json" \
      --slurpfile evidencef "$WORKDIR/evidence.json" \
      --slurpfile perfcenterf "$WORKDIR/perfcenter.json" \
      --slurpfile gamedayf "$WORKDIR/gameday.json" \
      --slurpfile vulnsf "$WORKDIR/vulns.json" \
      --slurpfile metricsf "$WORKDIR/metrics.json" \
      --slurpfile batchf "$WORKDIR/batch.json" \
      --argjson wrel "$W_REL" --argjson wsec "$W_SEC" \
      --argjson wobs "$W_OBS" --argjson wops "$W_OPS" \
      --argjson wperf "$W_PERF" --argjson wres "$W_RES" \
      --argjson wsup "$W_SUP" --argjson weff "$W_EFF" --arg trusted "$TRUSTED_REGISTRIES" \
      --argjson cpumin "$CPU_MIN" --argjson cpumax "$CPU_MAX" --argjson memmin "$MEM_MIN" --argjson memmax "$MEM_MAX" \
      --argjson ga "$G_A" --argjson gb "$G_B" --argjson gc "$G_C" --argjson gd "$G_D" \
      --argjson evdays "$EVIDENCE_DAYS" --argjson p95default "$P95_DEFAULT" \
      --argjson recoverymax "$RECOVERY_MAX" --arg envorder "$ENV_ORDER" \
      --argjson batchminpct "$(readcfg batch_success_rate_min_pct 95)" --argjson batchwindow "$BATCH_WINDOW_DAYS" \
      --argjson batchrestartdays "$BATCH_RESTART_DAYS" \
      --argjson now "$(date -u +%s)" \
      --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$WORKDIR/summary.json"

    # Compact lookup: service name -> {score, grade} (what the Console reads).
    jq '{ generatedAt: .generatedAt,
          services: ([ .services[] | {key: .name, value: {score, grade}} ] | from_entries) }' \
      "$WORKDIR/summary.json" > "$WORKDIR/index.json"

    echo "adhar-scorecard: writing ConfigMap ${OUT_NS}/${OUT_CM} ..."
    kubectl create configmap "$OUT_CM" -n "$OUT_NS" \
      --from-file=summary.json="$WORKDIR/summary.json" \
      --from-file=index.json="$WORKDIR/index.json" \
      --dry-run=client -o yaml | kubectl apply -f -

    kubectl -n "$OUT_NS" label configmap "$OUT_CM" \
      adhar.io/component=scorecards \
      app.kubernetes.io/managed-by=adhar-scorecard-scorer \
      app.kubernetes.io/part-of=adhar --overwrite >/dev/null
    kubectl -n "$OUT_NS" annotate configmap "$OUT_CM" \
      adhar.io/scorecard-generated-at="$(date -u +%Y-%m-%dT%H:%M:%SZ)" --overwrite >/dev/null

    # ── rolling history ────────────────────────────────────────────────────
    #
    # Each run overwrites the results ConfigMap, so without this there is no way
    # to answer "is this getting better?" — the one question a readiness score
    # is actually for. A single score is a number; a trend is a decision.
    #
    # Deliberately COMPACT: one entry per run holding the run's totals, the
    # grade distribution and a name -> score/grade map. The full per-signal
    # ledger stays in summary.json for the current run only — keeping 24 of
    # those would push the ConfigMap past the 1 MiB etcd object limit on a
    # platform this size, and the object would then fail to write at all,
    # taking the current results down with it.
    #
    # HIST_KEEP entries at ~30 min each is half a day at the default schedule.
    HIST_CM="${OUT_CM}-history"
    HIST_KEEP="${HIST_KEEP:-24}"

    jq -c '{
      at: .generatedAt,
      serviceCount: .serviceCount,
      averageScore: .averageScore,
      grades: ([.services[].grade] | group_by(.) | map({key: .[0], value: length}) | from_entries),
      services: ([.services[] | {key: .name, value: {score, grade}}] | from_entries)
    }' "$WORKDIR/summary.json" > "$WORKDIR/entry.json"

    # Read the existing history, append, trim to the last HIST_KEEP. A missing
    # or corrupt ConfigMap starts a fresh series rather than failing the run:
    # history is an enhancement, and losing it must never cost the current score.
    if kubectl -n "$OUT_NS" get configmap "$HIST_CM" -o jsonpath='{.data.history\.json}' \
         > "$WORKDIR/history-prev.json" 2>/dev/null && [ -s "$WORKDIR/history-prev.json" ]; then
      jq -e 'type == "array"' "$WORKDIR/history-prev.json" >/dev/null 2>&1 || echo '[]' > "$WORKDIR/history-prev.json"
    else
      echo '[]' > "$WORKDIR/history-prev.json"
    fi

    jq -s --argjson keep "$HIST_KEEP" \
      '(.[0] + [.[1]]) | unique_by(.at) | sort_by(.at) | .[-$keep:]' \
      "$WORKDIR/history-prev.json" "$WORKDIR/entry.json" > "$WORKDIR/history.json"

    kubectl create configmap "$HIST_CM" -n "$OUT_NS" \
      --from-file=history.json="$WORKDIR/history.json" \
      --dry-run=client -o yaml | kubectl apply -f -
    kubectl -n "$OUT_NS" label configmap "$HIST_CM" \
      adhar.io/component=scorecards \
      app.kubernetes.io/managed-by=adhar-scorecard-scorer \
      app.kubernetes.io/part-of=adhar --overwrite >/dev/null
    echo "adhar-scorecard: history now $(jq 'length' "$WORKDIR/history.json") run(s) in ${OUT_NS}/${HIST_CM}."

    echo "adhar-scorecard: scored $(jq '.serviceCount' "$WORKDIR/summary.json") services (avg $(jq '.averageScore' "$WORKDIR/summary.json"))."
    jq -r '.services[] | "  \(.grade)  \((.score|tostring) + "    " | .[0:4])  \(.name)"' "$WORKDIR/summary.json" || true
---
# Runs the scorer every 30 minutes. Read-only SA; the only write is the results
# ConfigMap. Non-root, read-only root FS, everything scratch goes to emptyDir.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: adhar-scorecard-scorer
  namespace: adhar-system
  labels:
    adhar.io/component: scorecards
    app.kubernetes.io/name: adhar-scorecard
    app.kubernetes.io/part-of: adhar
    app.kubernetes.io/managed-by: argocd
spec:
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            adhar.io/component: scorecards
            app.kubernetes.io/name: adhar-scorecard
            app.kubernetes.io/part-of: adhar
        spec:
          serviceAccountName: adhar-scorecard
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: scorer
              image: alpine/k8s:1.31.1
              imagePullPolicy: IfNotPresent
              command: ["bash", "/scripts/score.sh"]
              env:
                - name: OUTPUT_NAMESPACE
                  value: adhar-system
                - name: OUTPUT_CONFIGMAP
                  value: adhar-scorecards
                - name: CONFIG_DIR
                  value: /config
                # kubectl needs a writable HOME/cache with a read-only root FS.
                - name: HOME
                  value: /tmp
                - name: KUBECACHEDIR
                  value: /tmp/.kube/cache
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  # jq crunches the projected API payloads; 250m made the job
                  # miss its deadline on a full platform.
                  cpu: "1"
                  memory: 256Mi
              volumeMounts:
                - name: script
                  mountPath: /scripts
                  readOnly: true
                - name: config
                  mountPath: /config
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: script
              configMap:
                name: adhar-scorecard-script
                defaultMode: 0555
            - name: config
              configMap:
                name: adhar-scorecard-config
            - name: tmp
              emptyDir: {}
