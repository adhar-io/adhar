---
# The scoring logic, kept as a mounted script so the CronJob spec stays small
# and the algorithm is reviewable in one place. Pure kubectl + jq; no build
# step, no custom image. Runnable by hand:
#   kubectl -n adhar-system run scorecard --rm -it --restart=Never \
#     --overrides='{"spec":{"serviceAccountName":"adhar-scorecard"}}' \
#     --image=alpine/k8s:1.31.1 -- bash /scripts/score.sh
apiVersion: v1
kind: ConfigMap
metadata:
  name: adhar-scorecard-script
  namespace: adhar-system
  labels:
    adhar.io/component: scorecards
    app.kubernetes.io/name: adhar-scorecard
    app.kubernetes.io/part-of: adhar
    app.kubernetes.io/managed-by: argocd
data:
  score.sh: |
    #!/usr/bin/env bash
    # adhar production-readiness scorer. Gathers real in-cluster signals and
    # writes a 0-100 score + letter grade per service to a ConfigMap.
    set -euo pipefail

    OUT_NS="${OUTPUT_NAMESPACE:-adhar-system}"
    OUT_CM="${OUTPUT_CONFIGMAP:-adhar-scorecards}"
    CONFIG_DIR="${CONFIG_DIR:-/config}"
    WORKDIR="$(mktemp -d)"
    trap 'rm -rf "$WORKDIR"' EXIT

    # Read a tunable from the mounted config ConfigMap, with a fallback default.
    readcfg() {
      local f="$CONFIG_DIR/$1"
      if [ -f "$f" ]; then tr -d ' \n\r' < "$f"; else printf '%s' "$2"; fi
    }

    W_REL=$(readcfg weight_reliability 35)
    W_SEC=$(readcfg weight_security 25)
    W_OBS=$(readcfg weight_observability 15)
    W_OPS=$(readcfg weight_operations 25)
    G_A=$(readcfg grade_a 90)
    G_B=$(readcfg grade_b 80)
    G_C=$(readcfg grade_c 70)
    G_D=$(readcfg grade_d 60)

    # Collect a resource cluster-wide, then immediately PROJECT it down to the
    # handful of fields the scoring program reads and INDEX it by the keys the
    # program looks up. Both steps were forced by running this on a real
    # cluster:
    #   * a payload must never travel as a command-line argument — the combined
    #     JSON is megabytes and `jq --argjson` dies with "Argument list too
    #     long" (ARG_MAX), so everything moves through files and --slurpfile;
    #   * the raw objects are mostly managedFields and last-applied
    #     annotations, and the scoring program used to re-scan every workload
    #     for every service (O(services x workloads)), which blew past the
    #     job's activeDeadlineSeconds. Projecting first and looking up by key
    #     makes the per-service work O(1).
    fetch() {  # fetch <resource> <name>
      kubectl get "$1" -A -o json 2>/dev/null >"$WORKDIR/$2.raw" || true
      [ -s "$WORKDIR/$2.raw" ] || echo '{"items":[]}' >"$WORKDIR/$2.raw"
    }
    project() {  # project <name> <jq program>
      jq -c "$2" "$WORKDIR/$1.raw" >"$WORKDIR/$1.json" || echo '{}' >"$WORKDIR/$1.json"
      rm -f "$WORKDIR/$1.raw"
    }

    echo "adhar-scorecard: collecting signals..."
    fetch applications.argoproj.io apps
    # DaemonSets count: several platform components (alloy, the eBPF agents)
    # ship only as DaemonSets and were ungradable while this listed just
    # Deployments and StatefulSets.
    kubectl get deployments,statefulsets,daemonsets -A -o json 2>/dev/null >"$WORKDIR/workloads.raw" || true
    [ -s "$WORKDIR/workloads.raw" ] || echo '{"items":[]}' >"$WORKDIR/workloads.raw"
    fetch policyreports.wgpolicyk8s.io reports
    fetch httproutes.gateway.networking.k8s.io routes
    fetch schedules.velero.io schedules
    fetch clusters.postgresql.cnpg.io cnpg

    echo "adhar-scorecard: indexing signals..."
    # `.status.resources` is ArgoCD's own inventory of what each Application
    # manages. It is the only precise attribution available: every platform
    # package now installs into the SAME namespace (ADR-0011), so a
    # namespace-keyed signal is identical for all of them and says nothing
    # about an individual service.
    project apps '{items: [ (.items // [])[] | (.status.resources // []) as $rs | {
        name: .metadata.name,
        ns:   (.spec.destination.namespace // .metadata.namespace // "default"),
        health: (.status.health.status // "Unknown"),
        sync:   (.status.sync.status // "Unknown"),
        own: {
          total:  ($rs | length),
          wl:     [ $rs[] | select(.kind == "Deployment" or .kind == "StatefulSet" or .kind == "DaemonSet")
                    | "\(.namespace // "")/\(.kind)/\(.name)" ],
          routes: ([ $rs[] | select(.kind == "HTTPRoute") ] | length),
          cnpg:   [ $rs[] | select(.kind == "Cluster" and ((.group // "") == "postgresql.cnpg.io"))
                    | "\(.namespace // "")/\(.name)" ] } } ]}'
    project workloads '[ (.items // [])[] | {
        kind: .kind,
        ns:   .metadata.namespace,
        name: .metadata.name,
        inst: (.metadata.labels["app.kubernetes.io/instance"] // null),
        containers: [ (.spec.template.spec.containers // [])[] | {
            image: .image,
            probes: ((.readinessProbe != null) and (.livenessProbe != null)),
            res:    ((.resources.requests != null) and (.resources.limits != null)) } ] } ]
      | { byKey:      (map({key: "\(.ns)/\(.kind)/\(.name)", value: .}) | from_entries),
          byInstance: (group_by(.inst) | map(select(.[0].inst != null) | {key: .[0].inst, value: .}) | from_entries),
          byNs:       (group_by(.ns)   | map({key: .[0].ns, value: .}) | from_entries) }'
    project reports '{
        byKey: ( reduce (.items // [])[] as $r ({};
          "\($r.scope.namespace // $r.metadata.namespace // "")/\($r.scope.kind // "")/\($r.scope.name // "")" as $k
          | .[$k] = { pass: ((.[$k].pass // 0) + ($r.summary.pass // 0)),
                      fail: ((.[$k].fail // 0) + ($r.summary.fail // 0)) } ) ),
        byNs: ( reduce (.items // [])[] as $r ({};
          ($r.metadata.namespace // "_cluster") as $ns
          | .[$ns] = { pass: ((.[$ns].pass // 0) + ($r.summary.pass // 0)),
                       fail: ((.[$ns].fail // 0) + ($r.summary.fail // 0)) } ) ) }'
    project routes '{ nsSet: ( reduce (.items // [])[] as $r ({}; .[$r.metadata.namespace] = true) ) }'
    project cnpg '{
        byKey: ( reduce (.items // [])[] as $c ({};
          .["\($c.metadata.namespace)/\($c.metadata.name)"] = { backup: ($c.spec.backup != null) } ) ),
        byNs: ( reduce (.items // [])[] as $c ({};
          ($c.metadata.namespace) as $ns
          | .[$ns] = { count:  ((.[$ns].count // 0) + 1),
                       backup: ((.[$ns].backup // false) or ($c.spec.backup != null)) } ) ) }'
    project schedules '{
        all:   ([ (.items // [])[] | select((((.spec.template.includedNamespaces // []) | index("*"))) != null) ] | length > 0),
        nsSet: ( reduce (.items // [])[] as $s ({};
                   reduce (($s.spec.template.includedNamespaces // [])[]) as $n (.; .[$n] = true) ) ) }'

    echo "adhar-scorecard: computing scores..."
    # --slurpfile binds an ARRAY of the file's documents; each file holds one
    # document, hence the `[0]` unwrap below.
    jq -n \
      --slurpfile appsf "$WORKDIR/apps.json" \
      --slurpfile workloadsf "$WORKDIR/workloads.json" \
      --slurpfile reportsf "$WORKDIR/reports.json" \
      --slurpfile routesf "$WORKDIR/routes.json" \
      --slurpfile schedulesf "$WORKDIR/schedules.json" \
      --slurpfile cnpgf "$WORKDIR/cnpg.json" \
      --argjson wrel "$W_REL" --argjson wsec "$W_SEC" \
      --argjson wobs "$W_OBS" --argjson wops "$W_OPS" \
      --argjson ga "$G_A" --argjson gb "$G_B" --argjson gc "$G_C" --argjson gd "$G_D" \
      --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '
      # ---- inputs (projected + indexed above; unwrapped from --slurpfile) ---
      ($appsf[0]) as $apps
      | ($workloadsf[0]) as $wlIdx
      | ($reportsf[0].byKey) as $polByKey
      | ($reportsf[0].byNs) as $polByNs
      | ($routesf[0].nsSet) as $routeNs
      | ($cnpgf[0].byKey) as $cnpgByKey
      | ($cnpgf[0].byNs) as $cnpgByNs
      | ($schedulesf[0]) as $sched
      |
      # ---- helpers ----------------------------------------------------------
      def imgbad($img):
        ($img | type == "string")
        and (($img | test(":latest$")) or (($img | test(":")) | not));
      def grade($s):
        if   $s >= $ga then "A"
        elif $s >= $gb then "B"
        elif $s >= $gc then "C"
        elif $s >= $gd then "D"
        else "F" end;

      [ ($apps.items // [])[] |
        . as $app |
        ($app.name) as $name |
        ($app.ns) as $ns |
        ($app.health) as $health |
        ($app.sync) as $sync |

        # What this Application actually owns, per ArgoCD. When ArgoCD knows the
        # inventory that IS the answer: an Application that owns no workload
        # (an ApplicationSet, a policy bundle, a set of Tekton tasks) has no
        # containers to grade, and its container signals must drop out as
        # not-applicable rather than borrow other workloads from the namespace.
        # The instance label and the destination namespace are fallbacks only
        # for an Application that has never synced.
        (($app.own.total // 0) > 0) as $hasOwn |
        (if $hasOwn
         then [ ($app.own.wl // [])[] | $wlIdx.byKey[.] // empty ]
         else ($wlIdx.byInstance[$name] // $wlIdx.byNs[$ns] // []) end) as $wl |
        ([ $wl[] | (.containers // [])[] ]) as $cs |
        (($cs | length) > 0) as $hasC |

        # reliability
        ($health == "Healthy") as $healthy |
        ($hasC and (all($cs[]; .probes))) as $probesOk |
        ($hasC and (all($cs[]; .res))) as $resOk |

        # security
        ($hasC and (all($cs[]; (imgbad(.image)) | not))) as $imgOk |
        # Kyverno reports are scoped to individual workloads, so they can be
        # attributed exactly; the namespace aggregate is only for the
        # never-synced fallback above.
        (if $hasOwn
         then { pass: ([ ($app.own.wl // [])[] | ($polByKey[.].pass // 0) ] | add // 0),
                fail: ([ ($app.own.wl // [])[] | ($polByKey[.].fail // 0) ] | add // 0) }
         else ($polByNs[$ns] // {pass:0, fail:0}) end) as $pol |
        (($pol.pass + $pol.fail) > 0) as $hasPol |
        (if $hasPol then ($pol.pass / ($pol.pass + $pol.fail)) else 0 end) as $passRate |

        # observability
        ($sync == "Synced") as $synced |
        (if $hasOwn then (($app.own.routes // 0) > 0) else ($routeNs[$ns] // false) end) as $exposed |

        # operations
        (any($wl[]?; .kind == "StatefulSet")) as $hasSts |
        ([ ($app.own.cnpg // [])[] | $cnpgByKey[.] // empty ]) as $cnpgOwn |
        (if $hasOwn then $cnpgOwn
         else (($cnpgByNs[$ns] // {count: 0, backup: false})
               | if .count > 0 then [{backup: .backup}] else [] end) end) as $cnpgHere |
        ($hasSts or (($cnpgHere | length) > 0)) as $stateful |
        ( ($sched.all or ($sched.nsSet[$ns] // false)) or (any($cnpgHere[]?; .backup)) ) as $backupOk |

        # signal ledger
        [
          {name:"argocd_healthy",    category:"reliability",    applicable:true,      score:(if $healthy  then 1 else 0 end)},
          {name:"probes",            category:"reliability",    applicable:$hasC,     score:(if $probesOk then 1 else 0 end)},
          {name:"resources",         category:"reliability",    applicable:$hasC,     score:(if $resOk    then 1 else 0 end)},
          {name:"image_not_latest",  category:"security",       applicable:$hasC,     score:(if $imgOk    then 1 else 0 end)},
          {name:"kyverno_pass_rate", category:"security",       applicable:$hasPol,   score:$passRate},
          {name:"argocd_synced",     category:"observability",  applicable:true,      score:(if $synced  then 1 else 0 end)},
          {name:"httproute_exposed", category:"observability",  applicable:true,      score:(if $exposed then 1 else 0 end)},
          {name:"backup",            category:"operations",     applicable:$stateful, score:(if $backupOk then 1 else 0 end)}
        ] as $signals |

        # Category fraction = mean of applicable signals; neutral 1.0 if none apply.
        ( ["reliability","security","observability","operations"]
          | map( . as $cat
            | [ $signals[] | select(.category == $cat and .applicable) ] as $s
            | { key: $cat,
                value: (if ($s | length) > 0 then (([ $s[].score ] | add) / ($s | length)) else 1 end) }
          ) | from_entries ) as $cf |

        (($wrel + $wsec + $wobs + $wops)) as $wtot |
        ( ( $cf.reliability   * $wrel
          + $cf.security      * $wsec
          + $cf.observability * $wobs
          + $cf.operations    * $wops ) / $wtot * 100 | floor ) as $score |

        {
          name: $name,
          namespace: $ns,
          stateful: $stateful,
          score: $score,
          grade: grade($score),
          health: $health,
          sync: $sync,
          categories: ($cf | map_values((. * 100) | floor)),
          signals: $signals
        }
      ] as $services |

      {
        generatedAt: $ts,
        weights: {reliability:$wrel, security:$wsec, observability:$wobs, operations:$wops},
        gradeThresholds: {A:$ga, B:$gb, C:$gc, D:$gd},
        serviceCount: ($services | length),
        averageScore: (if ($services | length) > 0
                       then ([ $services[].score ] | add) / ($services | length) | floor
                       else 0 end),
        services: ($services | sort_by(.score) | reverse)
      }
    ' > "$WORKDIR/summary.json"

    # Compact lookup: service name -> {score, grade} (what the Console reads).
    jq '{ generatedAt: .generatedAt,
          services: ([ .services[] | {key: .name, value: {score, grade}} ] | from_entries) }' \
      "$WORKDIR/summary.json" > "$WORKDIR/index.json"

    echo "adhar-scorecard: writing ConfigMap ${OUT_NS}/${OUT_CM} ..."
    kubectl create configmap "$OUT_CM" -n "$OUT_NS" \
      --from-file=summary.json="$WORKDIR/summary.json" \
      --from-file=index.json="$WORKDIR/index.json" \
      --dry-run=client -o yaml | kubectl apply -f -

    kubectl -n "$OUT_NS" label configmap "$OUT_CM" \
      adhar.io/component=scorecards \
      app.kubernetes.io/managed-by=adhar-scorecard-scorer \
      app.kubernetes.io/part-of=adhar --overwrite >/dev/null
    kubectl -n "$OUT_NS" annotate configmap "$OUT_CM" \
      adhar.io/scorecard-generated-at="$(date -u +%Y-%m-%dT%H:%M:%SZ)" --overwrite >/dev/null

    echo "adhar-scorecard: scored $(jq '.serviceCount' "$WORKDIR/summary.json") services (avg $(jq '.averageScore' "$WORKDIR/summary.json"))."
    jq -r '.services[] | "  \(.grade)  \((.score|tostring) + "    " | .[0:4])  \(.name)"' "$WORKDIR/summary.json" || true
---
# Runs the scorer every 30 minutes. Read-only SA; the only write is the results
# ConfigMap. Non-root, read-only root FS, everything scratch goes to emptyDir.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: adhar-scorecard-scorer
  namespace: adhar-system
  labels:
    adhar.io/component: scorecards
    app.kubernetes.io/name: adhar-scorecard
    app.kubernetes.io/part-of: adhar
    app.kubernetes.io/managed-by: argocd
spec:
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            adhar.io/component: scorecards
            app.kubernetes.io/name: adhar-scorecard
            app.kubernetes.io/part-of: adhar
        spec:
          serviceAccountName: adhar-scorecard
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: scorer
              image: alpine/k8s:1.31.1
              imagePullPolicy: IfNotPresent
              command: ["bash", "/scripts/score.sh"]
              env:
                - name: OUTPUT_NAMESPACE
                  value: adhar-system
                - name: OUTPUT_CONFIGMAP
                  value: adhar-scorecards
                - name: CONFIG_DIR
                  value: /config
                # kubectl needs a writable HOME/cache with a read-only root FS.
                - name: HOME
                  value: /tmp
                - name: KUBECACHEDIR
                  value: /tmp/.kube/cache
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  # jq crunches the projected API payloads; 250m made the job
                  # miss its deadline on a full platform.
                  cpu: "1"
                  memory: 256Mi
              volumeMounts:
                - name: script
                  mountPath: /scripts
                  readOnly: true
                - name: config
                  mountPath: /config
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: script
              configMap:
                name: adhar-scorecard-script
                defaultMode: 0555
            - name: config
              configMap:
                name: adhar-scorecard-config
            - name: tmp
              emptyDir: {}
