---
# Tunable scoring model. Weights and grade thresholds live here (not baked into
# the script) so operators can re-balance the model per environment without
# rebuilding anything -- edit, commit, and the next scorer run picks it up
# (it mounts this ConfigMap as files). Weights are relative; they do NOT need
# to sum to 100 (the scorer normalises by their total).
apiVersion: v1
kind: ConfigMap
metadata:
  name: adhar-scorecard-config
  namespace: adhar-system
  labels:
    adhar.io/component: scorecards
    app.kubernetes.io/name: adhar-scorecard
    app.kubernetes.io/part-of: adhar
    app.kubernetes.io/managed-by: argocd
data:
  # ---- Category weights (relative) ----------------------------------------
  # reliability   -> ArgoCD Healthy, probes, resource requests/limits
  # security      -> image not :latest, Kyverno policy-report pass rate
  # observability -> ArgoCD Synced (GitOps-tracked), HTTPRoute exposure
  # operations    -> backup coverage for stateful services (Velero / CNPG)
  # performance   -> automated k6 load test, live p95 latency, live error budget
  # resilience    -> automated pod-delete chaos + recovery time, replicas, PDB,
  #                  HPA, spread across nodes, graceful shutdown, restarts,
  #                  progressive delivery
  # supply_chain  -> images pinned (digest / commit or version tag), pulled from
  #                  a trusted registry, no critical CVEs in Trivy's report
  # efficiency    -> CPU and memory requests match real usage (metrics-server)
  weight_reliability: "35"
  weight_security: "25"
  weight_observability: "15"
  weight_operations: "25"
  weight_performance: "20"
  weight_resilience: "25"
  weight_supply_chain: "20"
  weight_efficiency: "10"

  # ---- Supply chain -------------------------------------------------------
  # Comma-separated registry hosts (substring match) an image must come from.
  trusted_registries: "harbor"

  # ---- Efficiency ---------------------------------------------------------
  # A request is right-sized when live usage is within this % band of it:
  # below the floor it is reserved and idle, above the ceiling (memory) the
  # pod is first in line for eviction / (CPU) it competes for spare cycles.
  rightsize_cpu_min_pct: "10"
  rightsize_cpu_max_pct: "100"
  rightsize_mem_min_pct: "20"
  rightsize_mem_max_pct: "100"

  # ---- Letter-grade thresholds (score >= threshold) -----------------------
  grade_a: "90"
  grade_b: "80"
  grade_c: "70"
  grade_d: "60"

  # ---- Evidence (scorer) ----------------------------------------------------
  # Load-test / chaos evidence older than this scores as stale (0).
  evidence_max_age_days: "7"
  # An application is graded on the first of these it is deployed to.
  environment_order: "prod,test,dev"
  # recovery_time passes when the workload is fully ready again within this.
  chaos_recovery_max_seconds: "120"

  # ---- Resilience runner (adhar-resilience-runner CronJob) -----------------
  # Environments it may test, in order of preference. NEVER add prod here
  # unless you mean to kill production pods every day.
  runner_environments: "test,dev"
  # Retest when the image changes or the evidence is older than this.
  runner_max_age_hours: "24"
  # Applications tested per hourly run (oldest evidence first).
  runner_apps_per_run: "3"
  # k6 load profile and the defaults a Service may override with
  # adhar.io/slo-latency-p95-ms and adhar.io/slo-error-rate.
  perf_vus: "10"
  perf_duration: "60s"
  perf_p95_ms: "500"
  perf_error_rate: "0.01"
  # Litmus pod-delete duration; the Service's adhar.io/slo-availability (or
  # this default) sets the 24 h error budget.
  chaos_duration_seconds: "30"
  # The automated chaos suite, each under the same steady-state probe and each
  # its own scorecard signal: chaos_pod_delete, chaos_network_latency,
  # chaos_cpu_stress. Any kubernetes-chaos fault name may be listed.
  chaos_experiments: "pod-delete,pod-network-latency,pod-cpu-hog"
  chaos_network_latency_ms: "300"
  slo_availability: "99.9"

  # ---- Human-readable model reference (not consumed by the script) --------
  model.yaml: |
    # adhar production-readiness scorecard model
    # score = floor( sum(categoryFraction * weight) / sum(weights of the
    #         categories that count) * 100 )
    categories:
      reliability:
        weight: 35
        signals:
          - argocd_healthy      # ArgoCD Application health == Healthy
          - probes              # every container has readiness + liveness probe
          - resources           # every container sets requests AND limits
      security:
        weight: 25
        signals:
          - image_not_latest    # no container on :latest or an untagged image
          - kyverno_pass_rate   # PolicyReport pass / (pass+fail) for the workloads
      observability:
        weight: 15
        signals:
          - argocd_synced       # ArgoCD Application sync == Synced
          - httproute_exposed   # the application owns an HTTPRoute
      operations:
        weight: 25
        signals:
          - backup              # stateful only: Velero Schedule covers the ns
                                # OR a CNPG Cluster with .spec.backup exists
      performance:              # applications only
        weight: 20
        signals:
          - load_test           # last automated k6 run met p95 + error-rate
                                # thresholds, within evidence_max_age_days
          - latency_slo         # live p95 over 24h <= the latency target
          - error_budget        # live 5xx ratio over 24h within 1 - availability SLO
      resilience:               # applications only
        weight: 25
        signals:
          - chaos_pod_delete    # Litmus pod-delete with a continuous steady-state
                                # httpProbe: Pass, within evidence_max_age_days
          - chaos_network_latency # keeps serving with chaos_network_latency_ms added
          - chaos_cpu_stress    # keeps serving with its CPU saturated
          - recovery_time       # back to full readiness <= chaos_recovery_max_seconds
          - replicas_ha         # >= 2 replicas (or HPA minReplicas >= 2)
          - pod_disruption_budget
          - autoscaling         # a HorizontalPodAutoscaler targets the workload
          - spread_across_nodes # topologySpreadConstraints or podAntiAffinity
          - graceful_shutdown   # preStop hook on every container
          - restart_stability   # < 3 container restarts across running pods
          - progressive_delivery # Argo Rollouts canary / blue-green
      supply_chain:             # where there are containers (null otherwise)
        weight: 20
        signals:
          - image_pinned        # every image by digest, a 40-hex commit tag or a
                                # version tag (never :latest or untagged)
          - image_trusted_registry # every image from trusted_registries
          - no_critical_vulns   # Trivy reports for the RUNNING images: 0 critical
      efficiency:               # where metrics-server answers (null otherwise)
        weight: 10
        signals:
          - cpu_right_sized     # live CPU within rightsize_cpu_*_pct of requests
          - memory_right_sized  # live memory within rightsize_mem_*_pct of requests
    grades: { A: 90, B: 80, C: 70, D: 60, F: 0 }
    notes:
      - Applications (Argo CD apps labelled adhar.io/application) are graded
        ONCE, named after the application, on their most-promoted deployed
        environment (environment_order); every environment is listed with it.
        Platform packages are graded per Argo CD Application as before.
      - A signal that cannot be evaluated (CRD/resource absent, no workload,
        no metrics yet) is applicable=false and leaves its category's
        denominator. With no applicable signal, reliability / security /
        observability / operations stay neutral (100); performance and
        resilience leave the score entirely and report null, so a platform
        package is never credited with tests nobody ran.
      - Evidence that was never produced is NOT "not applicable": an
        application with no load test or chaos result yet fails those signals
        with the reason, because production readiness has to be shown.
      - The `backup` signal is only applicable to stateful services.
