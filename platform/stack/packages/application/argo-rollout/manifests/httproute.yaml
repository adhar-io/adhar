# Argo Rollouts dashboard routed through the Cilium Gateway (adhar-gateway),
# gated by Keycloak via oauth2-proxy (dashboard-sso.yaml). The route targets the
# oauth2-proxy at the host root so /oauth2/* (login/callback) and the dashboard
# both resolve; the proxy forwards authenticated traffic to
# argo-rollouts-dashboard:3100.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argo-rollouts-dashboard
  namespace: adhar-system
  labels:
    app.kubernetes.io/name: argo-rollouts
    app.kubernetes.io/component: rollouts-dashboard
    app.kubernetes.io/part-of: argo-rollouts
spec:
  parentRefs:
    - name: adhar-gateway
      namespace: adhar-system
  hostnames:
    - argo-rollout.adhar.localtest.me
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: argo-rollout-oauth2-proxy
          port: 4180
