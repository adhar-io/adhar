# Keycloak SSO in front of the Argo Rollouts Dashboard (which ships with no
# authentication). An oauth2-proxy gates it with the `argo-rollout` Keycloak
# client (provisioned by the keycloak config job; secret via ESO from
# keycloak-clients). Same pattern as the Tekton Dashboard gate.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argo-rollout-oauth2-proxy
  namespace: adhar-system
spec:
  refreshPolicy: CreatedOnce
  refreshInterval: 30s
  secretStoreRef:
    name: keycloak
    kind: ClusterSecretStore
  target:
    name: argo-rollout-oauth2-proxy
    template:
      engineVersion: v2
      data:
        OAUTH2_PROXY_CLIENT_SECRET: "{{ .ARGO_ROLLOUT_CLIENT_SECRET }}"
        OAUTH2_PROXY_COOKIE_SECRET: "{{ .COOKIE_SECRET }}"
  data:
    - secretKey: ARGO_ROLLOUT_CLIENT_SECRET
      remoteRef:
        key: keycloak-clients
        property: ARGO_ROLLOUT_CLIENT_SECRET
    # The platform-wide cookie secret (security/keycloak/manifests/sso-cookie.yaml).
    # Shared by every oauth2-proxy so a session established by one app is
    # accepted by all of them.
    - secretKey: COOKIE_SECRET
      remoteRef:
        key: adhar-sso-cookie
        property: COOKIE_SECRET
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argo-rollout-oauth2-proxy
  namespace: adhar-system
  labels:
    app.kubernetes.io/name: argo-rollout-oauth2-proxy
    app.kubernetes.io/part-of: argo-rollouts
spec:
  # A late SSO secret (this app can sync before Keycloak has written
  # keycloak-clients) must not hold the rollout Progressing for the default
  # 10 minutes — surface it fast so ArgoCD retries.
  progressDeadlineSeconds: 120
  replicas: 1
  selector:
    matchLabels:
      app: argo-rollout-oauth2-proxy
  template:
    metadata:
      labels:
        app: argo-rollout-oauth2-proxy
    spec:
      enableServiceLinks: false
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1
          args:
            - --http-address=0.0.0.0:4180
            - --provider=oidc
            - --oidc-issuer-url=https://keycloak.adhar.localtest.me:8443/realms/adhar
            - --ssl-insecure-skip-verify=true
            - --client-id=argo-rollout
            - --redirect-url=https://argo-rollout.adhar.localtest.me:8443/oauth2/callback
            - --upstream=http://argo-rollouts-dashboard.adhar-system.svc.cluster.local:3100
            - --email-domain=*
            - --scope=openid profile email groups
            - --cookie-secure=true
            # A cookie name UNIQUE to this app. Every proxy once shared the
            # default name on the parent domain with a shared secret, which meant
            # each one decrypted and reused the others' sessions: Argo CD received
            # a token minted for the tekton client and rejected it with
            # 'expected audience "argocd" got ["tekton"]', and whichever app you
            # opened last overwrote the rest. Single sign-on comes from Keycloak's
            # own session instead: with no cookie of its own this proxy bounces
            # through Keycloak, which already knows the user and returns a code
            # immediately, so the user sees no login screen and this app gets a
            # token with its own audience.
            - --cookie-name=_adhar_sso_argo_rollout
            - --whitelist-domain=.adhar.localtest.me:8443
            - --skip-provider-button=true
            - --reverse-proxy=true
          envFrom:
            - secretRef:
                name: argo-rollout-oauth2-proxy
          ports:
            - name: http
              containerPort: 4180
          readinessProbe:
            httpGet:
              path: /ping
              port: 4180
            initialDelaySeconds: 5
            timeoutSeconds: 10
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: argo-rollout-oauth2-proxy
  namespace: adhar-system
  labels:
    app.kubernetes.io/name: argo-rollout-oauth2-proxy
    app.kubernetes.io/part-of: argo-rollouts
spec:
  selector:
    app: argo-rollout-oauth2-proxy
  ports:
    - name: http
      port: 4180
      targetPort: 4180
