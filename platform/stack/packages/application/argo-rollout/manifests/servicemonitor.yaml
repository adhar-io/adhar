# Argo Rollouts Prometheus ServiceMonitor
# Not emitted by the chart (serviceMonitor.enabled left default off). Scrapes the
# "argo-rollouts-metrics" Service from metrics-service.yaml, port "metrics" (8090)
# at /metrics. Prometheus serviceMonitorSelector is empty ({}), so this is scraped
# as-is and feeds the upstream Argo Rollouts Grafana dashboard
# (examples/dashboard.json from argoproj/argo-rollouts).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  name: argo-rollouts
  namespace: adhar-system
  labels:
    app.kubernetes.io/name: argo-rollouts
    app.kubernetes.io/instance: argo-rollouts
    app.kubernetes.io/component: rollouts-controller
    app.kubernetes.io/managed-by: adhar
spec:
  jobLabel: app.kubernetes.io/name
  namespaceSelector:
    matchNames:
      - adhar-system
  selector:
    matchLabels:
      app.kubernetes.io/name: argo-rollouts
      app.kubernetes.io/instance: argo-rollouts
      app.kubernetes.io/component: rollouts-controller
  endpoints:
    - port: metrics
      path: /metrics
      interval: 60s
      scrapeTimeout: 30s
      honorLabels: true
