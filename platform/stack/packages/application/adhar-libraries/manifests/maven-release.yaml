# Build + release adhar-kit (com.adhar.kit:*) to the Sonatype Nexus Maven
# registry (repository `maven-hosted`). Tekton pipeline; the PipelineRun runs it
# once per sync (PostSync, after mirror). Dependency resolution is pulled through
# Nexus via a `<mirror>` onto the default `maven-public` group.
# Adjust the builder image if adhar-kit targets a newer JDK.
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: deploy-maven-project
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "1"}
spec:
  params:
    - {name: repo, type: string}
  workspaces:
    - {name: source}
  steps:
    - name: mvn-deploy
      image: docker.io/library/maven:3.9-eclipse-temurin-21
      env:
        # Nexus credentials + endpoints published by the nexus-config bootstrap Job.
        - {name: NEXUS_USER, valueFrom: {secretKeyRef: {name: nexus-credentials, key: username}}}
        - {name: NEXUS_PASS, valueFrom: {secretKeyRef: {name: nexus-credentials, key: password}}}
        - {name: NEXUS_MAVEN, valueFrom: {secretKeyRef: {name: nexus-credentials, key: maven-hosted}}}
        - {name: NEXUS_URL, valueFrom: {secretKeyRef: {name: nexus-credentials, key: url}}}
        # Clone source from Gitea (git mirror is still Gitea-hosted).
        - {name: GITEA_USER, valueFrom: {secretKeyRef: {name: gitea-credential, key: username}}}
        - {name: GITEA_PASS, valueFrom: {secretKeyRef: {name: gitea-credential, key: password}}}
      workingDir: $(workspaces.source.path)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        GITEA=http://gitea-http.adhar-system.svc.cluster.local:3000
        # Publish target (hosted) + resolution group (default Nexus maven-public).
        MAVEN_URL="${NEXUS_MAVEN%/}"
        MAVEN_PUBLIC="${NEXUS_URL%/}/repository/maven-public/"
        git clone --depth 1 "$GITEA/adhar/$(params.repo).git" src
        cd src
        cat > settings.xml <<EOF
        <settings>
          <servers>
            <server>
              <id>nexus</id>
              <username>${NEXUS_USER}</username>
              <password>${NEXUS_PASS}</password>
            </server>
            <server>
              <id>nexus-public</id>
              <username>${NEXUS_USER}</username>
              <password>${NEXUS_PASS}</password>
            </server>
          </servers>
          <mirrors>
            <mirror>
              <id>nexus-public</id>
              <name>Nexus Public Mirror</name>
              <url>${MAVEN_PUBLIC}</url>
              <mirrorOf>*</mirrorOf>
            </mirror>
          </mirrors>
        </settings>
        EOF
        mvn -B -s settings.xml -DskipTests \
          -DaltDeploymentRepository="nexus::default::$MAVEN_URL" \
          deploy
        echo "adhar-kit published to $MAVEN_URL (resolved via $MAVEN_PUBLIC)"
---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: release-adhar-kit
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "1"}
spec:
  workspaces: [{name: shared}]
  tasks:
    - name: deploy
      taskRef: {name: deploy-maven-project}
      params: [{name: repo, value: "adhar-kit"}]
      workspaces: [{name: source, workspace: shared}]
---
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: release-adhar-kit
  namespace: adhar-system
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "2"
spec:
  pipelineRef: {name: release-adhar-kit}
  taskRunTemplate:
    serviceAccountName: adhar-libraries
  workspaces:
    - name: shared
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 2Gi
