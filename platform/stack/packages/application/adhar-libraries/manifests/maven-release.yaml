# Build + release adhar-kit (com.adhar.kit:*) to the Gitea Maven registry.
# Tekton pipeline; the PipelineRun runs it once per sync (PostSync, after mirror).
# Adjust the builder image if adhar-kit targets a newer JDK.
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: deploy-maven-project
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "1"}
spec:
  params:
    - {name: repo, type: string}
  workspaces:
    - {name: source}
  steps:
    # Build the JARs (JDK 25 — adhar-kit's enforcer requires [25,); bump this
    # image in lockstep with the pom) and deploy them to the Nexus maven-hosted
    # repository — the platform's artefact repository for language packages.
    # Harbor is OCI-images-only; libraries live in Nexus.
    - name: mvn-deploy
      image: docker.io/library/maven:3.9-eclipse-temurin-25
      env:
        - {name: GITEA_USER, valueFrom: {secretKeyRef: {name: gitea-credential, key: username}}}
        - {name: GITEA_PASS, valueFrom: {secretKeyRef: {name: gitea-credential, key: password}}}
        - {name: NEXUS_USER, valueFrom: {secretKeyRef: {name: nexus-credentials, key: username}}}
        - {name: NEXUS_PASS, valueFrom: {secretKeyRef: {name: nexus-credentials, key: password}}}
        - {name: NEXUS_MAVEN, valueFrom: {secretKeyRef: {name: nexus-credentials, key: maven-hosted}}}
      workingDir: $(workspaces.source.path)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        GITEA=http://gitea-http.adhar-system.svc.cluster.local:3000
        git clone --depth 1 "$GITEA/adhar/$(params.repo).git" src
        cd src
        cat > settings.xml <<EOF
        <settings>
          <servers>
            <server>
              <id>nexus</id>
              <username>${NEXUS_USER}</username>
              <password>${NEXUS_PASS}</password>
            </server>
          </servers>
        </settings>
        EOF
        # -fae: build every module even if one deploy is a no-op. Nexus hosted
        # repos allow re-deploy (writePolicy ALLOW), so re-running this PostSync
        # hook is idempotent; tolerate an already-exists on the off chance.
        set +e
        mvn -B -s settings.xml -DskipTests -fae \
          -DaltDeploymentRepository="nexus::default::${NEXUS_MAVEN}" \
          deploy 2>&1 | tee /tmp/mvn.log
        rc=${PIPESTATUS[0]}
        set -e
        if [ "$rc" = "0" ]; then
          echo "adhar-kit published to Nexus ${NEXUS_MAVEN}"
        elif grep -qiE "status code: 40[09]|already exists" /tmp/mvn.log \
          && ! grep -qiE "COMPILATION ERROR|Could not resolve dependencies|Non-resolvable" /tmp/mvn.log; then
          echo "adhar-kit artefacts already present in Nexus — idempotent"
        else
          echo "maven build/deploy failed for a non-conflict reason"; exit 1
        fi
---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: release-adhar-kit
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "1"}
spec:
  workspaces: [{name: shared}]
  tasks:
    - name: deploy
      taskRef: {name: deploy-maven-project}
      params: [{name: repo, value: "adhar-kit"}]
      workspaces: [{name: source, workspace: shared}]
---
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: release-adhar-kit
  namespace: adhar-system
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "2"
spec:
  pipelineRef: {name: release-adhar-kit}
  taskRunTemplate:
    serviceAccountName: adhar-libraries
  workspaces:
    - name: shared
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 2Gi
