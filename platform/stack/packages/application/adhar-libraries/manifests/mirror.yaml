# Mirror the shared libraries from GitHub → Gitea at bootstrap, so teams build,
# customise and maintain them in-cluster. Each Job (idempotent) creates the Gitea
# repo and force-pushes the GitHub main branch. Runs as a PostSync hook so it
# re-mirrors on every sync; the release pipelines (npm-release.yaml /
# maven-release.yaml) then publish to the Nexus package registry
# (npm-hosted / maven-hosted). This Job only mirrors git repos GitHub -> Gitea;
# it is not a package/dependency mirror, so no Nexus config lives here.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: adhar-libraries
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "0"}
---
# The mirror push fires the Gitea → Tekton release webhook, and the release
# pipeline publishes to Nexus with `nexus-credentials` — a Secret the nexus
# package's config Job creates once Nexus is up. On a fresh cluster the mirror
# used to win that race, the first release run died with
# CreateContainerConfigError, and only the retry succeeded. So the mirror waits
# for the credential before it pushes; this Role lets it look for it.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: adhar-libraries-wait
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "0"}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [nexus-credentials]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: adhar-libraries-wait
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "0"}
subjects:
  - {kind: ServiceAccount, name: adhar-libraries, namespace: adhar-system}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: adhar-libraries-wait}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: mirror-adhar-ui
  namespace: adhar-system
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 4
  template:
    spec:
      serviceAccountName: adhar-libraries
      restartPolicy: Never
      initContainers:
        - name: wait-for-nexus
          image: docker.io/bitnamisecure/kubectl:latest
          command: [sh, -c]
          args:
            - |
              # See the Role above: the release this push triggers needs Nexus.
              for i in $(seq 1 120); do
                kubectl get secret nexus-credentials -n adhar-system >/dev/null 2>&1 && { echo "nexus-credentials present"; exit 0; }
                sleep 10
              done
              echo "nexus-credentials not published within 20 minutes"; exit 1
      containers:
        - name: mirror
          image: alpine/git:2.45.2
          env:
            - {name: GITHUB_URL, value: "https://github.com/adhar-io/adhar-ui.git"}
            - {name: REPO, value: "adhar-ui"}
            - {name: GITEA_USER, valueFrom: {secretKeyRef: {name: gitea-credential, key: username}}}
            - {name: GITEA_PASS, valueFrom: {secretKeyRef: {name: gitea-credential, key: password}}}
          command: [sh, -c]
          args:
            - |
              set -e
              apk add --no-cache curl >/dev/null 2>&1 || true
              GITEA=http://gitea-http.adhar-system.svc.cluster.local:3000
              AUTH=$(printf '%s:%s' "$GITEA_USER" "$GITEA_PASS" | base64 | tr -d '\n')
              echo "creating Gitea repo adhar/$REPO (idempotent)"
              curl -s -o /dev/null -X POST "$GITEA/api/v1/orgs/adhar/repos" \
                -H "Authorization: Basic $AUTH" -H 'Content-Type: application/json' \
                -d "{\"name\":\"$REPO\",\"private\":false,\"default_branch\":\"main\"}" || true
              # Full clone (NOT --depth 1): Gitea rejects pushes from a shallow
              # clone with "shallow update not allowed".
              rm -rf /tmp/src && git clone "$GITHUB_URL" /tmp/src
              cd /tmp/src
              echo "mirroring $REPO → Gitea"
              git -c http.extraHeader="Authorization: Basic $AUTH" \
                push -f "$GITEA/adhar/$REPO.git" HEAD:main
              echo "mirrored adhar/$REPO"
---
