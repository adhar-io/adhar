# Platform library releases — ONE PipelineRun PER LIBRARY, per run, created by a
# PostSync hook Job (after the git mirrors and the CI webhook registration).
#
# adhar-kit and adhar-ui are separate repositories with their own code, build
# tooling and registries, so each has its own Pipeline (maven-release.yaml /
# npm-release.yaml) with its own stages — clone, build, test, (lint,) scan,
# publish — and its own run below. Nothing couples one library's outcome to the
# other's: the Job creates both and does not gate one on the other.
#
# WHY A JOB AND NOT TWO STATIC PipelineRuns
# -----------------------------------------
# This file used to ship two PipelineRun manifests with FIXED names
# (`release-adhar-kit`, `release-adhar-ui`) plus
# `hook-delete-policy: BeforeHookCreation`. That is unworkable for a CI object:
#   * a PipelineRun is immutable, so re-running meant colliding with the object
#     already there — ArgoCD had to DELETE the previous run before creating the
#     next one, so at most ONE run per library ever existed;
#   * every re-sync therefore destroyed the previous run's logs, status and
#     TaskRuns — including failed ones, which are the runs you actually need;
#   * and a run that was still going got deleted out from under itself.
# `generateName` is the right answer for "every run is a new instance", but a
# PipelineRun committed as a static manifest in a GitOps package CANNOT use it:
# ArgoCD needs a stable name to track and prune the resource it owns.
#
# So the package ships no static PipelineRun at all. Runs are created
# imperatively — here at install time by this Job, and thereafter by the CI
# EventListener's TriggerTemplates (triggers.yaml), which already use
# `generateName: release-adhar-{ui,kit}-`. Both paths produce distinct,
# immutable objects with their own logs and status, and nothing deletes the
# previous one. Retention is a separate, explicit policy — see the
# `tekton-pipelinerun-pruner` CronJob in the `tekton` package.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: bootstrap-library-releases
  namespace: adhar-system
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: '2'
spec:
  backoffLimit: 3
  template:
    spec:
      # adhar-ci already carries the tekton-triggers-eventlistener Role, which
      # grants create on pipelineruns — the same permission the EventListener
      # uses to create these very runs from a push.
      serviceAccountName: adhar-ci
      restartPolicy: Never
      containers:
        - name: create-runs
          image: alpine/k8s:1.31.1
          command: [bash, -c]
          args:
            - |
              set -euo pipefail

              # WAIT FOR NEXUS before queuing anything. The libraries resolve
              # Maven and npm dependencies through it, and Nexus is a SEPARATE
              # Argo CD Application — sync waves order resources within one
              # Application and say nothing across two, so this hook can and did
              # run first. The cost is not a retry: the proxy caches the failed
              # lookups, and with Nexus's own default negative-cache TTL of 24
              # hours the build stayed broken long after Nexus was healthy.
              #
              # A known artifact is fetched rather than a health endpoint, because
              # "Nexus is up" and "Nexus can serve Maven Central" are different
              # facts and only the second one matters here.
              NEXUS=http://nexus.adhar-system.svc.cluster.local:8081
              PROBE="${NEXUS}/repository/maven-public/junit/junit/4.13.2/junit-4.13.2.pom"
              echo "waiting for Nexus to serve maven-public..."
              ready=0
              for i in $(seq 1 60); do
                code=$(curl -s -o /dev/null -w '%{http_code}' -m 20 "${PROBE}" || true)
                if [ "${code}" = "200" ]; then ready=1; echo "Nexus is serving maven-public"; break; fi
                echo "  attempt ${i}: HTTP ${code:-000}; retrying in 15s"
                sleep 15
              done
              if [ "${ready}" != "1" ]; then
                # Deliberately fatal. Queuing the pipelines anyway would poison
                # the proxy cache and leave the app Degraded with a failure whose
                # cause is long gone by the time anyone looks.
                echo "ERROR: Nexus did not serve maven-public within 15 minutes; not queuing library releases" >&2
                echo "       check the nexus Application and its config Job, then re-run this hook by re-syncing adhar-libraries" >&2
                exit 1
              fi

              # A library is built and published ONCE. This hook runs on every
              # sync of the Application, and every push to the packages
              # monorepo re-syncs every Application (the sync storm in
              # CLAUDE.md) — without this guard each push queued a fresh
              # release of both libraries (10 syncs = 10 builds, 2026-09-15).
              # A library with a Succeeded release, or one in flight, is
              # skipped; a real re-release comes from the Gitea push trigger
              # (triggers.yaml) or from deleting the Succeeded run.
              for lib in adhar-kit adhar-ui; do
                if kubectl -n adhar-system get pipelinerun -l "adhar.io/library=${lib}" -o json \
                     | python3 -c 'import sys,json;rs=[c for p in json.load(sys.stdin)["items"] for c in p.get("status",{}).get("conditions",[]) if c.get("type")=="Succeeded" and c.get("status") in ("True","Unknown")];sys.exit(0 if rs else 1)'; then
                  echo "${lib}: a release already succeeded or is running; not queuing another"
                  continue
                fi
                # generateName => a fresh, distinct object every single sync.
                # No delete, no collision, no lost history.
                kubectl create -f - <<EOF
              apiVersion: tekton.dev/v1
              kind: PipelineRun
              metadata:
                generateName: release-${lib}-
                namespace: adhar-system
                labels:
                  adhar.io/library: ${lib}
                  adhar.io/trigger: bootstrap
                  tekton.dev/pipeline: release-${lib}
              spec:
                pipelineRef:
                  name: release-${lib}
                params:
                  - {name: revision, value: main}
                taskRunTemplate:
                  serviceAccountName: adhar-libraries
                timeouts:
                  pipeline: 2h0m0s
                workspaces:
                  - name: shared
                    volumeClaimTemplate:
                      spec:
                        accessModes: [ReadWriteOnce]
                        resources:
                          requests:
                            storage: 4Gi
              EOF
              done
              echo "release PipelineRuns reconciled (queued only for a library that had none)"
---
# The bootstrap hook decides whether to queue a release by reading the existing
# PipelineRuns; the triggers Role it borrows grants only `create`.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: adhar-ci-release-reader
  namespace: adhar-system
  annotations:
    argocd.argoproj.io/sync-wave: '0'
rules:
  - apiGroups: [tekton.dev]
    resources: [pipelineruns]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: adhar-ci-release-reader
  namespace: adhar-system
  annotations:
    argocd.argoproj.io/sync-wave: '0'
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: adhar-ci-release-reader}
subjects: [{kind: ServiceAccount, name: adhar-ci, namespace: adhar-system}]
