# Platform library release, run once per adhar-libraries sync (PostSync, after
# the git mirrors and the CI webhook registration).
#
# ONE PipelineRun executes the Maven release and then the npm release
# (`runAfter`), never in parallel: both resolve and publish through the single
# in-cluster Nexus, and running them concurrently on a small node has starved
# Nexus and even the node itself (taint evictions, ECONNREFUSED mid-transfer).
# ArgoCD hook waves cannot enforce that ordering because a PipelineRun is
# "created" long before it finishes, so the ordering lives in Tekton instead.
# Per-repository push builds still use the individual release-adhar-kit /
# release-adhar-ui Pipelines through the CI EventListener (triggers.yaml).
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: release-adhar-libraries
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "1"}
spec:
  workspaces:
    - {name: maven}
    - {name: npm}
  tasks:
    - name: maven
      taskRef: {name: deploy-maven-project}
      workspaces: [{name: shared, workspace: maven}]
    - name: npm
      runAfter: [maven]
      taskRef: {name: publish-npm-workspace}
      workspaces: [{name: shared, workspace: npm}]
---
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: release-adhar-libraries
  namespace: adhar-system
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "2"
spec:
  pipelineRef: {name: release-adhar-libraries}
  taskRunTemplate: {serviceAccountName: adhar-libraries}
  timeouts: {pipeline: 2h0m0s}
  workspaces:
    - name: maven
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources: {requests: {storage: 2Gi}}
    - name: npm
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources: {requests: {storage: 2Gi}}
