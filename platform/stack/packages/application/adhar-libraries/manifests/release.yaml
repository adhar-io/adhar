# Platform library releases — ONE PipelineRun PER LIBRARY, run on every
# adhar-libraries sync (PostSync, after the git mirrors and the CI webhook
# registration).
#
# adhar-kit and adhar-ui are separate repositories with their own code, build
# tooling and registries, so each has its own Pipeline (maven-release.yaml /
# npm-release.yaml) with its own stages — clone, build, test, (lint,) scan,
# publish — and its own run below. Nothing couples one library's outcome to the
# other's.
#
# Both publish through the single in-cluster Nexus, and running two builds at
# once on a small node has starved it before, so the runs are staggered with
# hook waves: ArgoCD waits for the wave-2 run to finish (its PipelineRun health
# check reports Progressing until Succeeded/Failed) before creating wave 3.
# Per-repository push builds use the same Pipelines via the CI EventListener
# (triggers.yaml).
---
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: release-adhar-kit
  namespace: adhar-system
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: '2'
spec:
  pipelineRef:
    name: release-adhar-kit
  params:
    - {name: revision, value: main}
  taskRunTemplate:
    serviceAccountName: adhar-libraries
  timeouts:
    pipeline: 2h0m0s
  workspaces:
    - name: shared
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 4Gi
---
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: release-adhar-ui
  namespace: adhar-system
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: '3'
spec:
  pipelineRef:
    name: release-adhar-ui
  params:
    - {name: revision, value: main}
  taskRunTemplate:
    serviceAccountName: adhar-libraries
  timeouts:
    pipeline: 2h0m0s
  workspaces:
    - name: shared
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 4Gi
