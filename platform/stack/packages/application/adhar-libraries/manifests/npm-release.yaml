# Build + release adhar-ui (@adhar-ui/*) to the Gitea npm registry. Tekton
# pipeline; the PipelineRun below runs it once per sync (PostSync, after the
# mirror). Add a Gitea webhook → EventListener for release-on-push.
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: publish-npm-workspace
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "1"}
spec:
  params:
    - {name: repo, type: string}
    - {name: scope, type: string}
  workspaces:
    - {name: source}
  steps:
    - name: build-and-publish
      image: docker.io/library/node:20-bookworm
      env:
        - {name: GITEA_USER, valueFrom: {secretKeyRef: {name: gitea-credential, key: username}}}
        - {name: GITEA_PASS, valueFrom: {secretKeyRef: {name: gitea-credential, key: password}}}
        - {name: NEXUS_USER, valueFrom: {secretKeyRef: {name: nexus-credentials, key: username}}}
        - {name: NEXUS_PASS, valueFrom: {secretKeyRef: {name: nexus-credentials, key: password}}}
        - {name: NEXUS_NPM, valueFrom: {secretKeyRef: {name: nexus-credentials, key: npm-hosted}}}
      workingDir: $(workspaces.source.path)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        GITEA=http://gitea-http.adhar-system.svc.cluster.local:3000
        # Publish to the Nexus npm-hosted repository (the platform's artefact
        # repository for language packages). Harbor is OCI-images-only.
        REG="$NEXUS_NPM"
        HOST=$(printf '%s' "$REG" | sed -E 's#^https?://##')
        git clone --depth 1 "$GITEA/adhar/$(params.repo).git" src
        cd src
        AUTH=$(printf '%s:%s' "$NEXUS_USER" "$NEXUS_PASS" | base64 | tr -d '\n')
        cat > .npmrc <<EOF
        $(params.scope):registry=$REG
        //${HOST}:_auth=$AUTH
        always-auth=true
        EOF
        corepack enable
        # --no-frozen-lockfile: the mirrored source lockfile can lag package.json
        # (e.g. storybook app deps); a release build should still install + publish.
        pnpm install --no-frozen-lockfile
        # Build all packages if a build script is defined, then publish each.
        pnpm -r build || true
        pnpm -r --no-git-checks publish --registry "$REG" || \
          echo "some packages may already be published at this version"
        echo "adhar-ui published to Nexus $REG"
---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: release-adhar-ui
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "1"}
spec:
  workspaces: [{name: shared}]
  tasks:
    - name: publish
      taskRef: {name: publish-npm-workspace}
      params:
        - {name: repo, value: "adhar-ui"}
        - {name: scope, value: "@adhar-ui"}
      workspaces: [{name: source, workspace: shared}]
---
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: release-adhar-ui
  namespace: adhar-system
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "2"
spec:
  pipelineRef: {name: release-adhar-ui}
  taskRunTemplate:
    serviceAccountName: adhar-libraries
  workspaces:
    - name: shared
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 2Gi
