# Build + release adhar-ui (@adhar-ui/*) to the Sonatype Nexus npm registry
# (repository `npm-hosted`). Tekton pipeline; the PipelineRun below runs it once
# per sync (PostSync, after the mirror). Dependency resolution is pulled through
# the Nexus `npm-registry` proxy (which caches npmjs.org).
# A Gitea webhook → EventListener (triggers.yaml) reruns it on push.
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: publish-npm-workspace
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "1"}
spec:
  params:
    - {name: repo, type: string}
    - {name: scope, type: string}
  workspaces:
    - {name: source}
  steps:
    - name: build-and-publish
      image: docker.io/library/node:20-bookworm
      # Cap the build so it cannot starve Nexus / the node (a single small
      # node runs the whole platform); requests keep it schedulable.
      computeResources:
        requests: {cpu: 500m, memory: 512Mi}
        limits: {cpu: "2", memory: 3Gi}
      env:
        # Nexus credentials + endpoints published by the nexus-config bootstrap Job.
        - {name: NEXUS_USER, valueFrom: {secretKeyRef: {name: nexus-credentials, key: username}}}
        - {name: NEXUS_PASS, valueFrom: {secretKeyRef: {name: nexus-credentials, key: password}}}
        - {name: NEXUS_NPM, valueFrom: {secretKeyRef: {name: nexus-credentials, key: npm-hosted}}}
        - {name: NEXUS_URL, valueFrom: {secretKeyRef: {name: nexus-credentials, key: url}}}
        # Clone source from Gitea (git mirror is still Gitea-hosted).
        - {name: GITEA_USER, valueFrom: {secretKeyRef: {name: gitea-credential, key: username}}}
        - {name: GITEA_PASS, valueFrom: {secretKeyRef: {name: gitea-credential, key: password}}}
      workingDir: $(workspaces.source.path)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        GITEA=http://gitea-http.adhar-system.svc.cluster.local:3000
        # Publish target (hosted) + resolution proxy (caches npmjs.org).
        NPM_HOSTED="${NEXUS_NPM%/}/"
        NPM_PROXY="${NEXUS_URL%/}/repository/npm-registry/"
        # Host:port for the per-registry auth lines (derived, not hardcoded).
        HOST="${NEXUS_URL#*://}"
        git clone --depth 1 "$GITEA/adhar/$(params.repo).git" src
        cd src
        # Nexus npm accepts base64(user:pass) as _auth on the registry path.
        AUTH=$(printf '%s:%s' "$NEXUS_USER" "$NEXUS_PASS" | base64 | tr -d '\n')
        cat > .npmrc <<EOF
        registry=$NPM_PROXY
        $(params.scope):registry=$NPM_HOSTED
        //${HOST}/repository/npm-hosted/:_auth=$AUTH
        //${HOST}/repository/npm-registry/:_auth=$AUTH
        always-auth=true
        EOF
        corepack enable
        # --no-frozen-lockfile: the mirrored repo's pnpm-lock.yaml can lag behind
        # package.json (e.g. apps/storybook), which hard-fails a frozen install in
        # CI. Resolve/refresh the lockfile at build time so a stale lock upstream
        # doesn't block the publish (we're publishing packages, not enforcing a
        # reproducible app deploy here).
        # The in-cluster Nexus proxy can be slow/briefly unavailable on a busy
        # node: retry harder and keep parallel fetches modest so a cold proxy
        # (every package fetched from upstream on first use) is not swamped.
        pnpm install --no-frozen-lockfile \
          --fetch-retries=8 --fetch-retry-mintimeout=10000 --fetch-retry-maxtimeout=120000 \
          --fetch-timeout=300000 --network-concurrency=6
        # Build all packages if a build script is defined, then publish each. A
        # version already present in Nexus must not hard-fail the run (idempotent).
        pnpm -r build || true
        pnpm -r --no-git-checks publish --registry "$NPM_HOSTED" || \
          echo "some packages may already be published at this version"
        echo "adhar-ui published to $NPM_HOSTED (resolved via $NPM_PROXY)"
---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: release-adhar-ui
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "1"}
spec:
  workspaces: [{name: shared}]
  tasks:
    - name: publish
      taskRef: {name: publish-npm-workspace}
      params:
        - {name: repo, value: "adhar-ui"}
        - {name: scope, value: "@adhar-ui"}
      workspaces: [{name: source, workspace: shared}]