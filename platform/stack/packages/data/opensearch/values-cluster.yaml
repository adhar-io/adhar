# opensearch-cluster chart values — the platform's shared OpenSearch cluster,
# as one OpenSearchCluster CR plus the roles, users and lifecycle policies that
# go with it.
#
# Rendered with release name `opensearch`, which is what every Service name
# derives from. That is deliberate and load-bearing:
#
#   opensearch              ClusterIP  9200  REST API  <- consumers connect here
#   opensearch-nodes        headless         9300      node discovery
#   opensearch-dashboards   ClusterIP  5601  UI        <- HTTPRoute (Keycloak OIDC in Dashboards)
#
# `opensearch-dashboards` is byte-identical to the Service the old plain chart
# produced, so manifests/httproute.yaml.tmpl needed no change for it. The REST
# Service DID: it was `opensearch-cluster-master`, a name the
# plain chart invented from its StatefulSet, and the operator has no such
# concept. Consumers were updated with it (data/open-metadata,
# data/libredb-studio).

# The current group. The operator chart has legacyAPI disabled, so the
# deprecated `opensearch.opster.io` CRDs are not installed and asking for them
# here would render CRs with no definition behind them.
apiGroup: opensearch.org

serviceAccount:
  create: false

cluster:
  # Empty = release name = `opensearch`. Spelled out rather than left implicit
  # because the Service names above, and therefore every consumer's connection
  # string, are derived from it.
  name: opensearch

  general:
    # OpenSearch 3.8.0, the version this package already ran — the operator is
    # the change here, not the engine.
    #
    # 3.9.0 exists and is NOT used on purpose: `monitoring.enable` below makes
    # the operator download the Prometheus exporter plugin whose release is
    # version-matched to OpenSearch (prometheus-exporter-<version>.0.zip), and
    # Aiven-Open/prometheus-exporter-plugin-for-opensearch tops out at 3.8.0.0.
    # On 3.9.0 the init step fetches a URL that 404s and every node fails to
    # start. Move both together, never the engine alone.
    version: "3.8.0"
    image: docker.io/opensearchproject/opensearch
    imagePullPolicy: IfNotPresent

    httpPort: 9200

    # OpenSearch refuses to start unless vm.max_map_count >= 262144; the
    # operator sets it from a privileged init container.
    setVMMaxMapCount: true

    # FALSE while the cluster has ONE data node, and that is not a preference.
    #
    # With drain on, operator 3.0.0 restarts a node by excluding it from shard
    # allocation and waiting until it holds no shards
    # (services.PreparePodForDelete -> CheckPodSafeToDelete). A lone node can
    # never empty — there is nowhere for its primaries to go — so every rolling
    # restart (a version bump, a securityconfig key, any pod-template change)
    # stalls forever with `cluster.routing.allocation.exclude._name` naming the
    # only node, and every index created after that (tomorrow's
    # security-auditlog-*) cannot allocate and goes red. With drain off the
    # operator restricts allocation to primaries, deletes the pod and
    # re-enables allocation once it is back: a short outage, which is all a
    # single node can offer anyway.
    #
    # Set it back to true together with a second data node (see `nodePools`);
    # TestOpenSearchSingleDataNodeIsNeverDrained holds the two together.
    drainDataNodes: false

    # Prometheus metrics, which this package did not actually have before.
    #
    # The old manifests/servicemonitor.yaml scraped http://.../_prometheus/metrics
    # on a cluster that served HTTPS and ran an image with no exporter plugin
    # installed, so it collected nothing and said nothing about collecting
    # nothing. The operator installs the plugin and generates the ServiceMonitor
    # with credentials and TLS that match the cluster it just built.
    monitoring:
      enable: true
      scrapeInterval: 30s
      # A dedicated least-privilege user (see `users`/`roles` below) rather than
      # the admin account the operator would otherwise put in the scrape config.
      monitoringUserSecret: opensearch-monitoring-credentials
      tlsConfig:
        # The HTTP certificate is issued by the operator's own generated CA,
        # which Prometheus has no reason to trust. The alternative is wiring that
        # CA into every scrape config; the endpoint is a ClusterIP in one
        # namespace.
        insecureSkipVerify: true
      labels:
        adhar.io/component: observability

    # repository-s3 is NOT bundled in the OpenSearch 3.x distribution, and the
    # s3.client.* settings in additionalConfig below belong to it. Without the
    # plugin the node rejects every one of them and refuses to start:
    #   unknown setting [s3.client.default.endpoint]
    #   unknown secure setting [s3.client.default.secret_key]
    #   ... please check that any required plugins are installed
    # It crash-looped 21 times on the 2026-10-04 Azure cluster, so OpenSearch
    # never served and opensearch-dashboards sat in CrashLoopBackOff behind it.
    # The snapshot repository below is the only reason these settings exist.
    # (This note used to be hand-written into the generated cluster.yaml, where
    # the next generate-manifests.sh run would have dropped it.)
    pluginsList:
      - repository-s3
    additionalConfig:
      # S3 client for the snapshot repository below. RustFS is the platform's
      # primary S3 store (ADR: data/rustfs), reached adhar-controlplane over plain HTTP
      # on 9000, and it needs path-style addressing because there is no
      # per-bucket DNS.
      s3.client.default.endpoint: "rustfs.adhar-system.svc.cluster.local:9000"
      s3.client.default.protocol: "http"
      s3.client.default.path_style_access: "true"

    # The S3 keys for that client, injected into the OpenSearch keystore from the
    # Secret RustFS already publishes. keyMappings restricts the read to these
    # two keys, so the rest of root-creds (the console password) never reaches
    # the OpenSearch pods.
    keystore:
      - secret:
          name: root-creds
        keyMappings:
          RUSTFS_ACCESS_KEY: s3.client.default.access_key
          RUSTFS_SECRET_KEY: s3.client.default.secret_key

    # Registered by the operator over the REST API once the cluster is up.
    # `adhar-backups` is a bucket data/rustfs already creates, so enabling
    # snapshots costs nothing in another package; `base_path` keeps OpenSearch's
    # snapshots out of Velero's and CNPG's way inside it.
    snapshotRepositories:
      - name: adhar-rustfs
        type: s3
        settings:
          bucket: adhar-backups
          base_path: opensearch
          client: default

  confMgmt:
    # Drain and exclude a node from the voting configuration before removing it,
    # so a scale-down cannot lose quorum.
    smartScaler: true

  bootstrap:
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1Gi

  initHelper:
    image: docker.io/busybox
    version: "1.36"
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 128Mi

  nodePools:
    # ONE pool holding every role. The platform runs a single shared search
    # cluster for OpenMetadata's catalogue index, LibreDB Studio's OpenSearch
    # connection and anything a tenant points at it — not a log-ingest tier, so
    # splitting masters from data nodes would triple the JVM count to serve the
    # same index.
    #
    # To split it later, replace this with two entries — `masters`
    # (roles: [master], replicas: 3, small disk) and `data`
    # (roles: [data, ingest], replicas: >=2) — and the operator will migrate
    # shards across as it rolls them.
    - component: nodes
      replicas: 1
      roles:
        - "master"
        - "data"
        - "ingest"
      # 20Gi, up from the 4Gi the plain chart asked for: the default
      # StorageClass is node-local `adhar-local` on a 256 GiB worker disk
      # (see "volume attach limit" in CLAUDE.md), so disk here is cheap and
      # 4Gi left no room for a catalogue to grow into. No storageClass is
      # named, on purpose — no package pins one, so this follows the cluster
      # default and lands on the node filesystem.
      diskSize: "20Gi"
      resources:
        requests:
          # 250m -> 100m -> 50m: measured max 52m on the AWS cluster
          # (2026-10-24). 50m is the measured peak, not headroom: chosen so the
          # node holding this pool's node-local volume (a pod cannot move off
          # it) can still fit it when the cluster is fully requested.
          cpu: 50m
          # The operator derives the JVM heap from requests.memory / 2, so this
          # is -Xms1g -Xmx1g. Stating it through the request keeps the heap and
          # the cgroup in agreement.
          memory: 2Gi
        limits:
          # Memory only. A CPU limit on a JVM search engine turns a GC pause or
          # a shard relocation into a throttled stall.
          memory: 3Gi

  dashboards:
    enable: true
    version: "3.8.0"
    image: docker.io/opensearchproject/opensearch-dashboards
    imagePullPolicy: IfNotPresent
    replicas: 1

    # EMPTY, where the plain chart set `/opensearch` with rewriteBasePath.
    # Dashboards is served on its own hostname (opensearch.<platform host>) at
    # the root, so a base path only bought an extra redirect on every visit and
    # a trap for anyone wiring a new route.
    basePath: ""

    tls:
      # Plain HTTP inside the cluster: TLS terminates at the Cilium Gateway,
      # whose HTTPRoute (manifests/httproute.yaml.tmpl) forwards to
      # http://opensearch-dashboards:5601. The console reaches the same Service
      # directly.
      enable: false
      # Overrides a chart BUG, and it is not cosmetic. opensearch-cluster 3.3.5
      # ships `secret:` followed by an unclosed comment (`# name: "`), so the
      # default value is null — and the chart renders dashboards with
      # `omit | toYaml`, which puts `secret: null` into the CR. The CRD declares
      # that field `type: object` without `nullable`, so the API server rejects
      # the whole OpenSearchCluster with "must be of type object". An empty map
      # is the same intent and passes.
      secret: {}

    # Each value is written VERBATIM after `key: ` into opensearch_dashboards.yml
    # (operator 3.0.0, builders.NewDashboardsConfigMapForCR), so a value is YAML
    # source: a list is written as a flow sequence and a sentence containing
    # ": " must carry its own quotes.
    additionalConfig:
      # One tenant. Multi-tenancy adds a tenant picker and per-tenant index
      # plumbing for a cluster whose users all arrive through one Keycloak client.
      opensearch_security.multitenancy.enabled: "false"

      # --- Sign-in: Keycloak OIDC, click-free (security-dashboards 3.8.0.0) ---
      #
      # This used to be the default `basicauth` behind an oauth2-proxy, which
      # passed X-Forwarded-User to a Dashboards that never reads it: after the
      # Keycloak round trip every request without a Dashboards session was sent
      # to /app/login and its username/password form — a second login.
      #
      # Two auth types, because the second one is break-glass: `basicauth` is
      # what the internal admin uses when Keycloak itself is down, and 3.8
      # refuses a multi-type list without it. default_redirect_auth_type stops
      # the two from meaning a chooser page: an unauthenticated page request
      # (`/`, /app/*, /goto/*) goes straight into the OIDC flow
      # (multi_auth.ts handleUnauthedRequest), which a person already signed
      # in to Keycloak completes without seeing anything. The chooser is only
      # drawn when asked for with ?auto_login=false, and /app/login itself
      # — which Dashboards never auto-redirects — is redirected at the Gateway.
      opensearch_security.auth.type: '["basicauth","openid"]'
      opensearch_security.auth.multiple_auth_enabled: "true"
      opensearch_security.auth.default_redirect_auth_type: openid
      # Fetched server-side at START-UP; Dashboards does not start without it.
      # The in-cluster address of the same realm: Keycloak's fixed hostname
      # still hands back the PUBLIC authorization/token/end-session endpoints,
      # which is what the browser must be sent to.
      opensearch_security.openid.connect_url: http://keycloak.adhar-system.svc.cluster.local:8080/realms/adhar/.well-known/openid-configuration
      # The `opensearch` client (manifests/sso.yaml). The SAME name is the
      # backend's required_audience (manifests/security-config.yaml).
      opensearch_security.openid.client_id: opensearch
      # From the environment, never from git: OpenSearch Dashboards resolves
      # ${VAR} in its yml after parsing it (osd-config read_config.ts) and
      # refuses to start if VAR is unset. VAR is filled from the
      # opensearch-dashboards-oidc Secret (env below).
      opensearch_security.openid.client_secret: ${ADHAR_OIDC_CLIENT_SECRET}
      # Without it Dashboards builds its redirect_uri from its own bind address
      # (http://0.0.0.0:5601). The callback is <this>/auth/openid/login, which
      # the Keycloak client must list; rewritten to the platform host at seed.
      opensearch_security.openid.base_redirect_url: https://opensearch.adhar.localtest.me:8443
      # No `groups` scope requested: the client carries the groups mapper itself
      # (sso.yaml) and the reconciler adds the realm's `groups` default scope, so
      # the claim is always there and nothing depends on a scope name.
      opensearch_security.openid.scope: openid profile email
      # Keycloak's end-session endpoint (the same value discovery reports).
      # Dashboards adds id_token_hint and post_logout_redirect_uri=<base URL>,
      # which the client's post.logout.redirect.uris allows.
      opensearch_security.openid.logout_url: https://keycloak.adhar.localtest.me:8443/realms/adhar/protocol/openid-connect/logout
      # The session cookie is Secure (the browser only ever sees https) and is
      # encrypted with a GENERATED password. The default is the published
      # string `security_cookie_default_password`, which lets anyone holding a
      # copy of the cookie decrypt it — and a break-glass basicauth session
      # cookie carries the admin's credentials.
      opensearch_security.cookie.secure: "true"
      opensearch_security.cookie.password: ${ADHAR_COOKIE_PASSWORD}
      # What the break-glass page (/app/login?auto_login=false) says.
      opensearch_security.ui.openid.login.buttonname: Log in with single sign-on
      opensearch_security.ui.basicauth.login.title: Break-glass sign-in
      opensearch_security.ui.basicauth.login.subtitle: '"For the internal admin account while Keycloak is unavailable. Everyone else uses single sign-on."'

    env:
      # Referenced as ${...} by additionalConfig above. NOT optional: a pod
      # without them cannot start, and that is the right failure — the
      # alternative is a Dashboards running on an empty client secret.
      - name: ADHAR_OIDC_CLIENT_SECRET
        valueFrom:
          secretKeyRef:
            name: opensearch-dashboards-oidc
            key: client_secret
      - name: ADHAR_COOKIE_PASSWORD
        valueFrom:
          secretKeyRef:
            name: opensearch-dashboards-cookie
            key: password
      # The token exchange and refresh go to Keycloak's PUBLIC token endpoint
      # (the fixed hostname puts it in discovery). Node trusts Let's Encrypt on
      # its own; on a platform serving the self-signed adhar-cert it needs that
      # certificate as an extra anchor. NODE_EXTRA_CA_CERTS ADDS to Node's
      # roots — unlike openid.root_ca, which would replace them and break the
      # Let's Encrypt case. Same approach as Kargo and Coder (SSL_CERT_DIR).
      - name: NODE_EXTRA_CA_CERTS
        value: /etc/adhar-ca/adhar-gateway.crt

    additionalVolumes:
      - name: adhar-ca
        path: /etc/adhar-ca
        secret:
          secretName: adhar-cert
          # A missing file only makes Node log a warning; the Let's Encrypt
          # case does not need it at all.
          optional: true
          items:
            - key: tls.crt
              path: adhar-gateway.crt

    service:
      type: ClusterIP

    # Measured ~230 MiB, peak 272 MiB over three hours (2026-10-22).
    resources:
      requests:
        cpu: 100m
        memory: 384Mi
      limits:
        memory: 1Gi

  security:
    config:
      # The admin password is GENERATED, not written down.
      #
      # The plain chart shipped `OPENSEARCH_INITIAL_ADMIN_PASSWORD` as a literal
      # in values.yaml, which put the platform's search admin password in git and
      # made every consumer hard-code the same string. Here an External Secrets
      # Password generator mints it (manifests/credentials.yaml) and the operator
      # hashes it into the security config itself — so nothing has to bcrypt
      # anything at render time, and `adhar get secrets -p opensearch` is how you
      # read it.
      adminCredentialsSecret:
        name: opensearch-admin-credentials
      # config.yml ONLY (manifests/security-config.yaml): the authentication
      # domains — Keycloak tokens first, HTTP Basic for service accounts and
      # break-glass. Everything else stays the image's (roles, action groups)
      # or the operator's (internal_users.yml hashes, the REST-managed roles and
      # mappings below). The operator merges it into
      # opensearch-security-config-generated and applies it with securityadmin
      # using the admin certificate, which no config.yml can lock out.
      #
      # Adding the FIRST key here changes the node pod template (the operator
      # mounts every key of the generated secret into the nodes), so it costs
      # one rolling restart — the reason drainDataNodes above must be false
      # while there is one data node. Editing config.yml later does not.
      securityConfigSecret:
        name: opensearch-securityconfig

    tls:
      http:
        generate: true
        duration: "8760h"
        # Reissue 30 days out instead of the operator's historical "recover
        # after it expires". 3.x loads the new certificate without a restart.
        rotateDaysBeforeExpiry: 30
      transport:
        generate: true
        perNode: true
        duration: "8760h"
        rotateDaysBeforeExpiry: 30

  ingress:
    # Never. Routing is Gateway API (manifests/httproute.yaml.tmpl), which also
    # owns the click-free /app/login redirect; there is no Ingress controller
    # to serve an Ingress anyway.
    opensearch:
      enabled: false
    dashboards:
      enabled: false

# --- Declarative security objects -------------------------------------------
# These are OpensearchRole / OpensearchUser / OpensearchUserRoleBinding CRs,
# reconciled over the cluster's REST API by the operator. Before this they were
# things you clicked in Dashboards and lost on the next reinstall.

roles:
  - name: adhar-monitoring
    clusterPermissions:
      - cluster_monitor
      # The Prometheus exporter plugin's own endpoint. Granted explicitly
      # alongside the wildcard because the plugin has registered the action
      # under both cluster:admin and cluster:monitor across versions, and an
      # action string OpenSearch does not recognise is simply inert.
      - "cluster:admin/prometheus/metrics"
      - "cluster:monitor/*"
    indexPermissions:
      - indexPatterns:
          - "*"
        allowedActions:
          - "indices_monitor"
          - "indices:admin/mappings/get"
  # platform-developer: read and write data in every index that is not a system
  # index, create indices, manage aliases and mappings — but not delete
  # indices, change cluster settings, snapshots, ISM or security. `*` is the
  # right pattern: the security plugin protects system indices on its own
  # (plugins.security.system_indices.* plus every index a plugin registers,
  # SpecialIndices.isSystemIndex in security 3.8), whatever a role says.
  # Dashboards' saved objects come from kibana_user, bound alongside.
  - name: adhar-developer
    clusterPermissions:
      # bulk / mget / msearch / scroll and alias reads at the cluster level.
      - cluster_composite_ops
      # cluster health, stats and node info that Dev Tools and Index
      # Management read.
      - cluster_monitor
    indexPermissions:
      - indexPatterns:
          - "*"
        allowedActions:
          # read + write (index, update, delete documents; put mapping).
          - crud
          - create_index
          - manage_aliases
          - indices_monitor
          - "indices:admin/mappings/get"
          - "indices:admin/get"
          - "indices:admin/refresh*"

users:
  # The scrape identity for the ServiceMonitor the operator generates. Its
  # password comes from the same generated Secret the ServiceMonitor reads, so
  # the two cannot drift.
  - name: adhar-monitoring
    secretName: opensearch-monitoring-credentials
    secretKey: password
    backendRoles: []

usersRoleBinding:
  - name: adhar-monitoring
    users:
      - adhar-monitoring
    roles:
      - adhar-monitoring

  # --- Platform people (Keycloak) -------------------------------------------
  # backendRoles are the Keycloak GROUP NAMES the `groups` claim carries
  # (full.path=false), which the openid domain hands over as backend roles
  # (roles_key: groups, manifests/security-config.yaml). Bindings are
  # additive: the operator merges these into the existing mappings over REST
  # and re-asserts them every 30s, so the image's own mappings (admin ->
  # all_access, kibanaserver -> kibana_server) are kept.
  #
  # Tiers follow the rest of the platform (security/keycloak k8s-rbac.yaml):
  # platform-engineer is the infrastructure admin tier and gets what
  # platform-admin gets. The realm's `admin` group is already all_access
  # through the image's default mapping (backend role `admin`).
  #
  # security 3.8 has no `security_manager` role. The Security plugin's REST API
  # and Dashboards Security pages are opened by membership of a role listed in
  # plugins.security.restapi.roles_enabled — all_access and
  # security_rest_api_access in the operator's opensearch.yml. all_access
  # already qualifies; security_rest_api_access is bound as well so the
  # Security pages stay reachable if all_access is ever narrowed. (The
  # permission-based security_rest_api_full_access is deliberately NOT used:
  # its restapi:admin/* grants take effect only with
  # plugins.security.restapi.admin.enabled, and the REST API refuses to map a
  # role carrying them unless the caller is super-admin — the operator is not.)
  - name: adhar-platform-admins
    backendRoles:
      - platform-admin
      - platform-engineer
    roles:
      - all_access
      - security_rest_api_access
  - name: adhar-platform-developers
    backendRoles:
      - platform-developer
    roles:
      - adhar-developer
      - kibana_user
  - name: adhar-platform-viewers
    backendRoles:
      - platform-viewer
    roles:
      # Built-in: read on every non-system index, read-only cluster ops.
      - readall
      # Built-in: the Dashboards saved-objects index, so Discover and
      # dashboards load.
      - kibana_user

# --- Index lifecycle ---------------------------------------------------------
# An unmanaged OpenSearch grows until the disk runs out, and on node-local
# storage that takes the node with it. This is the floor: anything written to a
# dated index under these patterns rolls over and is eventually deleted.
ismPolicies:
  - name: adhar-timeseries
    # One line, no colon. The chart renders this as a bare `description: {{ . }}`
    # scalar, so a multi-line block or an embedded colon produces invalid YAML
    # and the whole render fails.
    description: "Platform default for dated indices - roll over at 20GB or 7 days, drop the replica at 7 days, delete at 30"
    defaultState: hot
    states:
      - name: hot
        actions:
          - rollover:
              minSize: "20gb"
              minIndexAge: "7d"
        transitions:
          - stateName: warm
            conditions:
              minIndexAge: "7d"
      - name: warm
        actions:
          - replicaCount:
              numberOfReplicas: 0
        transitions:
          - stateName: delete
            conditions:
              minIndexAge: "30d"
      - name: delete
        actions:
          - delete: {}
    # No `transitions: []` on the last state and no `ismTemplate.priority: 0`:
    # both are the CRD's zero values, which the API server drops (omitempty),
    # so Argo CD diffed the stored object against them and held the opensearch
    # Application OutOfSync forever (2026-10-22). Omitting them means the same.
    ismTemplate:
      indexPatterns:
        # Deliberately NOT "*": OpenMetadata's catalogue indices are not dated
        # and must not be rolled over or deleted underneath it.
        - "logs-*"
        - "events-*"
        - "traces-*"
        - "adhar-*"

tenants: []
actionGroups: []
componentTemplates: []
indexTemplates: []
