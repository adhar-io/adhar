# Generated credentials for the OpenSearch cluster.
#
# The plain-chart install carried `OPENSEARCH_INITIAL_ADMIN_PASSWORD` as a
# literal string in values.yaml, which put the platform's
# search admin password in git, printed it into every rendered manifest, and
# made two other packages hard-code the same string to talk to it. Here the
# External Secrets Password generator mints both passwords and the OpenSearch
# operator hashes the admin one into the cluster's security config itself — so
# nothing has to bcrypt anything at render time and no password is committed.
#
# To read them:  adhar get secrets -p opensearch
#
# ONE generator per ExternalSecret, and ONE credential per ExternalSecret.
# The Password generator returns a fresh random value on every call and ESO
# re-runs every `dataFrom` entry whenever the object's spec changes, so folding
# both passwords into one ExternalSecret would rotate the admin password every
# time the monitoring user was touched — against a cluster whose security config
# was bootstrapped with the old one. The keycloak package learned this the hard
# way; see security/keycloak/manifests/secret-gen.yaml.
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: opensearch-admin
  namespace: adhar-system
  # Earlier wave than the ExternalSecret that references it. A generator applied
  # after its consumer is a permanent deadlock: the ExternalSecret cannot resolve
  # the generatorRef, so its wave never goes healthy and the generator's own wave
  # is never reached. That is what took Airbyte down on 2026-09-15.
  annotations: {argocd.argoproj.io/sync-wave: "-6"}
spec:
  length: 32
  digits: 5
  symbols: 3
  # A restricted symbol set on purpose. This password travels through a basic-auth
  # header, a Prometheus scrape config and an OpenSearch keystore, and the broader
  # defaults include characters that need escaping in at least one of them.
  symbolCharacters: /-+
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: opensearch-admin-credentials
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "-5"}
spec:
  # Minted once and never rotated underneath a running cluster: the operator
  # writes this password's hash into the security config at bootstrap, and a
  # changed value would leave a Secret that no longer opens anything.
  # Rotation is a deliberate act — delete this Secret and let it regenerate,
  # then let the operator reconcile the new hash.
  refreshPolicy: CreatedOnce
  refreshInterval: '0'
  target:
    name: opensearch-admin-credentials
    template:
      engineVersion: v2
      metadata:
        labels:
          # Makes it discoverable through `adhar get secrets`.
          adhar.io/cli-secret: 'true'
          adhar.io/package-name: opensearch
      data:
        # `username` and `password` are the key names the operator requires of
        # security.config.adminCredentialsSecret — not a platform convention.
        username: admin
        password: '{{ .PASSWORD }}'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: opensearch-admin
      rewrite:
        - transform:
            template: PASSWORD
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: opensearch-monitoring
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "-6"}
spec:
  length: 32
  digits: 5
  symbols: 3
  symbolCharacters: /-+
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: opensearch-monitoring-credentials
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "-5"}
spec:
  refreshPolicy: CreatedOnce
  refreshInterval: '0'
  target:
    name: opensearch-monitoring-credentials
    template:
      engineVersion: v2
      metadata:
        labels:
          adhar.io/cli-secret: 'true'
          adhar.io/package-name: opensearch
      data:
        # Read from BOTH ends of the same Secret, which is the point:
        #   * the OpensearchUser CR (cluster.yaml) sets this user's password
        #     from `password`
        #   * the ServiceMonitor the operator generates scrapes with
        #     `username` + `password`
        # One object, so the credential the exporter presents and the credential
        # the cluster accepts cannot drift apart.
        username: adhar-monitoring
        password: '{{ .PASSWORD }}'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: opensearch-monitoring
      rewrite:
        - transform:
            template: PASSWORD
