# Keycloak single sign-on for OpenSearch Dashboards — NATIVE OIDC, no proxy.
#
# Hand-written, no longer generated by hack/gen-sso.sh: that script puts an
# oauth2-proxy in front of an app, and this package removed its proxy on
# 2026-10-27. Why:
#
#   * The proxy did not sign anyone in to Dashboards. It passed
#     X-Forwarded-User/Email to a Dashboards running the default `basicauth`,
#     which never reads them, so after the Keycloak round trip every visitor
#     still landed on /app/login and its username/password form — the second
#     login people kept reporting.
#   * It authorised nothing either (--email-domain=*, no group check). Who may
#     do what is decided by OpenSearch's role mappings, which need the person's
#     identity and groups IN OpenSearch — a Keycloak token, not a header.
#   * Kept in front of a Dashboards that does its own OIDC it would make every
#     sign-in two authorization-code flows with two cookies that expire
#     independently, block HTTP Basic API calls at the edge, and make the
#     break-glass login unreachable exactly when it is needed: while Keycloak
#     is down, a proxy cannot pass anyone.
#
# Dashboards now runs the authorization-code flow itself as the CONFIDENTIAL
# client below and keeps its own host-only session cookie, so each app still
# has its own session and its own audience; single sign-on comes from
# Keycloak's session, as everywhere else on the platform. Configuration lives in
# values-cluster.yaml (dashboards.additionalConfig), the backend half in
# security-config.yaml, the click-free /app/login redirect in httproute.yaml.tmpl.
#
# Host convention: https://opensearch.adhar.localtest.me:8443 is rewritten to
# the platform's domain when the stack is seeded into Gitea.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: opensearch-keycloak-client
  namespace: adhar-system
  labels:
    # Picked up by the keycloak package's client reconciler (see
    # security/keycloak/manifests/keycloak-config.yaml, configure.sh): created
    # if missing, PUT-reconciled on every run (redirect URIs, attributes,
    # protocol mappers), given the realm's `groups` default scope, and its
    # secret exported into keycloak-clients as OPENSEARCH_CLIENT_SECRET.
    adhar.io/keycloak-client: "true"
    app.kubernetes.io/name: opensearch-keycloak-client
    app.kubernetes.io/part-of: opensearch
  # Wave 0: a ConfigMap is healthy instantly and blocks nothing; the earlier
  # it exists, the sooner the reconciler exports the client secret the
  # wave-5 ExternalSecret below waits on.
  annotations: {argocd.argoproj.io/sync-wave: "0"}
data:
  # Keep "description" under 255 chars (Keycloak varchar; longer fails with 500).
  #
  # redirectUris: Dashboards' callback is <base_redirect_url>/auth/openid/login
  #   (security-dashboards openid/routes.ts); the old proxy's /oauth2/callback
  #   is gone with the proxy.
  # post.logout.redirect.uris: Dashboards' logout sends Keycloak
  #   post_logout_redirect_uri=<base_redirect_url> with an id_token_hint, and
  #   Keycloak refuses any value the client does not list (an empty attribute
  #   allows none).
  # protocolMappers: the ID token is what Dashboards forwards and what
  #   OpenSearch maps (roles_key: groups), so it must carry group NAMES. The
  #   realm's `groups` default scope already adds them; the client's own mapper
  #   makes the contract this package depends on independent of realm-level
  #   drift. Two group mappers do not duplicate entries: Keycloak 26.8's
  #   GroupMembershipMapper is forced multivalued and JsonUtils.mapClaim merges
  #   without repeats.
  # directAccessGrantsEnabled: false — nothing logs in to this client with a
  #   password; the browser flow is the only one Dashboards uses.
  client.json: |
    {
      "protocol": "openid-connect",
      "clientId": "opensearch",
      "name": "OpenSearch Dashboards",
      "description": "OpenSearch Dashboards native OIDC sign-in (authorization code, confidential client); groups claim maps to OpenSearch roles",
      "publicClient": false,
      "authorizationServicesEnabled": false,
      "serviceAccountsEnabled": false,
      "implicitFlowEnabled": false,
      "directAccessGrantsEnabled": false,
      "standardFlowEnabled": true,
      "frontchannelLogout": true,
      "attributes": {
        "post.logout.redirect.uris": "https://opensearch.adhar.localtest.me:8443/*"
      },
      "redirectUris": [
        "https://opensearch.adhar.localtest.me:8443/auth/openid/login"
      ],
      "webOrigins": ["https://opensearch.adhar.localtest.me:8443"],
      "protocolMappers": [
        {
          "name": "groups",
          "protocol": "openid-connect",
          "protocolMapper": "oidc-group-membership-mapper",
          "config": {
            "claim.name": "groups",
            "full.path": "false",
            "id.token.claim": "true",
            "access.token.claim": "true",
            "userinfo.token.claim": "true"
          }
        }
      ]
    }
---
# The `opensearch` client secret, read by Dashboards as ADHAR_OIDC_CLIENT_SECRET
# (values-cluster.yaml dashboards.env). Same wave as the OpenSearchCluster: the
# Dashboards pod cannot start without it, and nothing else waits on it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: opensearch-dashboards-oidc
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "5"}
spec:
  # 10s, not 30s: this is the RETRY cadence until keycloak-clients carries the
  # key, and that wait is on the platform's critical path (Keycloak's wave-20
  # config Job and the 5-minute client reconciler write it). Afterwards it keeps
  # the Secret in step with Keycloak; a changed secret reaches Dashboards on its
  # next restart.
  refreshInterval: 10s
  secretStoreRef:
    name: keycloak
    kind: ClusterSecretStore
  target:
    name: opensearch-dashboards-oidc
    template:
      engineVersion: v2
      data:
        client_secret: "{{ .OPENSEARCH_CLIENT_SECRET }}"
  data:
    - secretKey: OPENSEARCH_CLIENT_SECRET
      remoteRef:
        key: keycloak-clients
        property: OPENSEARCH_CLIENT_SECRET
---
# The key Dashboards encrypts its session cookies with (ADHAR_COOKIE_PASSWORD).
# Generated, never committed — the upstream default is a published string.
# Generator one wave before its ExternalSecret: the reverse order is a
# permanent deadlock (see credentials.yaml).
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: opensearch-dashboards-cookie
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "-6"}
spec:
  # >= 32 is enforced by Dashboards (cookie.password minLength).
  length: 48
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: opensearch-dashboards-cookie
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "-5"}
spec:
  # Minted once. A new value would sign every person out of Dashboards on its
  # next restart — harmless (they come straight back through Keycloak) but
  # pointless, so it only changes when this Secret is deleted on purpose.
  refreshPolicy: CreatedOnce
  refreshInterval: '0'
  target:
    name: opensearch-dashboards-cookie
    template:
      engineVersion: v2
      data:
        password: '{{ .PASSWORD }}'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: opensearch-dashboards-cookie
      rewrite:
        - transform:
            template: PASSWORD
