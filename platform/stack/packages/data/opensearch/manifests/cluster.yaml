    argocd.argoproj.io/sync-wave: '5'
spec:
  defaultState: hot
  description: Platform default for dated indices - roll over at 20GB or 7 days, drop the replica at 7 days, delete at 30
  states:
  - actions:
    - rollover:
        minIndexAge: 7d
        minSize: 20gb
    name: hot
    transitions:
    - conditions:
        minIndexAge: 7d
      stateName: warm
  - actions:
    - replicaCount:
        numberOfReplicas: 0
    name: warm
    transitions:
    - conditions:
        minIndexAge: 30d
      stateName: delete
  - actions:
    - delete: {}
    name: delete
  ismTemplate:
    indexPatterns:
    - logs-*
    - events-*
    - traces-*
    - adhar-*
  opensearchCluster:
    name: opensearch
