# Grafana dashboard for OpenSearch (data/opensearch). Requires the OpenSearch
# prometheus-exporter plugin (exposes opensearch_* metrics at
# /_prometheus/metrics). Fed by servicemonitor.yaml. Best-effort: metric
# names follow the community prometheus-exporter plugin. Datasource is
# variable-driven. Added as a NEW file (values.yaml/install.yaml untouched).
apiVersion: v1
kind: ConfigMap
metadata:
  name: adhar-dashboard-opensearch
  namespace: adhar-system
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: adhar-observability
  annotations:
    grafana_folder: "Platform"
data:
  opensearch.json: |
