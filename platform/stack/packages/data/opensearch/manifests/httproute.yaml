# OpenSearch Dashboards UI routed through the Cilium Gateway (adhar-gateway).
# TLS terminates at the Gateway (adhar-cert). Replaces any nginx Ingress.
#
# Dashboards is served at the ROOT of its own hostname: this route forwards `/`
# unchanged to opensearch-dashboards:5601 and the app's basePath is empty
# (values-cluster.yaml). It used to run under a `/opensearch` basePath with
# rewriteBasePath, which bought an extra redirect on every visit and a trap for
# anyone adding a second route — the host is already dedicated to it.
#
# The backend Service name survived the move to the operator unchanged. The
# operator derives Service names from the OpenSearchCluster's name, and the
# cluster is named `opensearch`, so its dashboards Service is
# `opensearch-dashboards` — exactly what the old plain chart produced. Rename the
# cluster and this file breaks.
#
# SSO: every backend below is the Keycloak oauth2-proxy from sso.yaml, which
# forwards to the original upstream(s): opensearch-dashboards:5601.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: opensearch-dashboards
  namespace: adhar-system
  annotations:
    # After the oauth2-proxy (sso.yaml, wave 5): ArgoCD holds a wave until its
    # resources are healthy, and a route whose backend Service does not exist
    # yet is Degraded (ResolvedRefs=False) — at an earlier wave that deadlocks
    # the sync on a fresh cluster and the proxy is never created.
    argocd.argoproj.io/sync-wave: "6"
  labels:
    app.kubernetes.io/name: opensearch-dashboards
    app.kubernetes.io/instance: opensearch-dashboards
spec:
  parentRefs:
    - name: adhar-gateway
      namespace: adhar-system
  hostnames:
    - opensearch.adhar.localtest.me
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: opensearch-oauth2-proxy
          port: 4180
