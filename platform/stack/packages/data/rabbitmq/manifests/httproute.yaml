# RabbitMQ management UI routed through the Cilium Gateway (adhar-gateway). TLS
# terminates at the Gateway (adhar-cert). Replaces any nginx Ingress. The
# management plugin serves from the root; the /rabbitmq prefix is stripped
# before forwarding to the rabbitmq service:15672 (HTTP management port).
#
# SSO: every backend below is the Keycloak oauth2-proxy from sso.yaml, which
# forwards to the original upstream(s): rabbitmq:15672.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rabbitmq
  namespace: adhar-system
  annotations:
    # After the oauth2-proxy (sso.yaml, wave 5): ArgoCD holds a wave until its
    # resources are healthy, and a route whose backend Service does not exist
    # yet is Degraded (ResolvedRefs=False) — at an earlier wave that deadlocks
    # the sync on a fresh cluster and the proxy is never created.
    argocd.argoproj.io/sync-wave: "6"
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/instance: rabbitmq
spec:
  parentRefs:
    - name: adhar-gateway
      namespace: adhar-system
  hostnames:
    - rabbitmq.adhar.localtest.me
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: rabbitmq-oauth2-proxy
          port: 4180
