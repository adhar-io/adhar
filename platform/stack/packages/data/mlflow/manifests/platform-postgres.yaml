# MLflow's tracking database — a CNPG cluster on the platform's operator, the
# same shape every other stateful package uses (see data/metabase). Password is
# generated by ESO and never written down.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: mlflow-db
  namespace: adhar-system
  annotations:
    argocd.argoproj.io/sync-wave: '-6'
spec:
  length: 28
  digits: 5
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mlflow-db-credentials
  namespace: adhar-system
  annotations:
    argocd.argoproj.io/sync-wave: '-6'
spec:
  refreshInterval: '0'
  target:
    name: mlflow-db-credentials
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          adhar.io/cli-secret: 'true'
          adhar.io/package-name: mlflow
      engineVersion: v2
      data:
        username: mlflow
        password: '{{ .PASSWORD }}'
  dataFrom:
  - sourceRef:
      generatorRef:
        apiVersion: generators.external-secrets.io/v1alpha1
        kind: Password
        name: mlflow-db
    rewrite:
    - transform:
        template: PASSWORD
---
# The database, asked for rather than built.
#
# This was a CloudNativePG `Cluster` plus a `ScheduledBackup` declared here,
# with the same barman stanza every other platform database also carried. It is
# now a `Database`, and the control plane composes exactly those objects
# (compositions/database/local-cnpg.yaml) — verified by rendering this request
# and diffing it against the Cluster it replaces, field for field.
#
# The credential is unchanged: the ExternalSecret in this package still mints it,
# and `credentialsSecret` hands it to CNPG as the bootstrap owner secret.
apiVersion: platform.adhar.io/v1alpha1
kind: Database
metadata:
  name: mlflow-db
  namespace: adhar-system
  labels:
    app.kubernetes.io/name: mlflow-db
    adhar.io/component: mlflow
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  parameters:
    databaseName: mlflow
    credentials:
      masterUsername: mlflow
    credentialsSecret: mlflow-db-credentials
    storageSize: 10Gi
    component: mlflow
    backupSchedule: 0 50 2 * * *
