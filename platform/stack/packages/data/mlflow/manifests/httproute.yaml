# MLflow tracking + model registry UI routed through the Cilium Gateway
# (adhar-gateway). TLS terminates at the Gateway (adhar-cert). Replaces any
# nginx Ingress. The /mlflow prefix is stripped before forwarding to
# mlflow-mlflow-webserver:80. (Set mlflowWebserver.pathPrefix in values if
# Dagit needs to serve under the sub-path.)
#
# SSO: every backend below is the Keycloak oauth2-proxy from sso.yaml, which
# forwards to the original upstream(s): mlflow-mlflow-webserver:80.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mlflow
  namespace: adhar-system
  annotations:
    # After the oauth2-proxy (sso.yaml, wave 5): ArgoCD holds a wave until its
    # resources are healthy, and a route whose backend Service does not exist
    # yet is Degraded (ResolvedRefs=False) — at an earlier wave that deadlocks
    # the sync on a fresh cluster and the proxy is never created.
    argocd.argoproj.io/sync-wave: "6"
  labels:
    app.kubernetes.io/name: mlflow
    app.kubernetes.io/instance: mlflow
spec:
  parentRefs:
    - name: adhar-gateway
      namespace: adhar-system
  hostnames:
    - mlflow.adhar.localtest.me
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: mlflow-oauth2-proxy
          port: 4180
