# MLflow — experiment tracking + MODEL REGISTRY (Phase 4 ML workflow), the piece
# the ML golden path was missing: Kubeflow Pipelines trains, MLflow records runs
# and registers models, the FastAPI model server pulls a registered version.
#
# Postgres for metadata (CNPG, platform-postgres.yaml); RustFS for artifacts
# (platform-storage.yaml); Keycloak in front via oauth2-proxy (sso.yaml). The
# official image is used directly — MLflow has no Helm chart worth the
# indirection for a single Deployment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: adhar-system
  labels: {app.kubernetes.io/name: mlflow, app.kubernetes.io/part-of: mlflow}
  annotations: {argocd.argoproj.io/sync-wave: "3"}
spec:
  # A late SSO secret (this app can sync before Keycloak has written
  # keycloak-clients) must not hold the rollout Progressing for the default
  # 10 minutes — surface it fast so ArgoCD retries.
  progressDeadlineSeconds: 120
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: mlflow}
  template:
    metadata:
      labels: {app.kubernetes.io/name: mlflow, app.kubernetes.io/part-of: mlflow}
    spec:
      enableServiceLinks: false
      securityContext: {runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, runAsNonRoot: true}
      initContainers:
        - name: deps
          # The official image ships without the Postgres driver and S3 client;
          # install into a shared volume rather than maintaining a fork.
          image: ghcr.io/mlflow/mlflow:v3.8.1
          command: ["sh", "-c", "pip install --no-cache-dir --target /deps psycopg2-binary boto3 >/dev/null && echo deps ready"]
          volumeMounts: [{name: deps, mountPath: /deps}]
      containers:
        - name: mlflow
          image: ghcr.io/mlflow/mlflow:v3.8.1
          # Registering a model version makes the SERVER resolve the logged
          # model's `models:/` URI through a client of itself and stage the
          # download under its working directory (`./mlruns`); with the image's
          # cwd at `/` that was "Permission denied: './mlruns'" → HTTP 500 on
          # every model-versions/create (2026-09-15). A writable scratch cwd and
          # a loopback tracking URI make that path work.
          workingDir: /tmp
          command: ["mlflow", "server"]
          args:
            - --host=0.0.0.0
            - --port=5000
            - --backend-store-uri=postgresql://$(DB_USER):$(DB_PASSWORD)@mlflow-db-rw.adhar-system.svc.cluster.local:5432/mlflow
            - --artifacts-destination=s3://mlflow/
            # The default uvicorn server, not gunicorn: MLflow refuses the
            # security flags below under --gunicorn-opts ("only supported with
            # the default uvicorn server"), and --workers covers the same need.
            - --workers=2
            # MLflow ≥3.5 rejects any Host header outside localhost/private IPs
            # ("Invalid Host header - possible DNS rebinding attack"). Every
            # in-cluster client (golden-path ML jobs, notebooks, the verify Job)
            # and the SSO proxy (which passes the browser's Host through) must
            # be listed. The localtest.me entry is rewritten to the platform
            # domain at seed time like every other host reference.
            - --allowed-hosts=mlflow.adhar-system.svc.cluster.local:5000,mlflow.adhar-system.svc.cluster.local,mlflow.adhar-system.svc:5000,mlflow.adhar-system:5000,mlflow:5000,localhost:5000,127.0.0.1:5000,mlflow.adhar.localtest.me:8443,mlflow.adhar.localtest.me
            - --serve-artifacts
          env:
            - {name: PYTHONPATH, value: /deps}
            - name: DB_USER
              valueFrom: {secretKeyRef: {name: mlflow-db-credentials, key: username}}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: mlflow-db-credentials, key: password}}
            - {name: MLFLOW_S3_ENDPOINT_URL, value: http://rustfs.adhar-system.svc.cluster.local:9000}
            - {name: MLFLOW_TRACKING_URI, value: http://127.0.0.1:5000}
            - {name: AWS_DEFAULT_REGION, value: us-east-1}
            - {name: MLFLOW_S3_IGNORE_TLS, value: "true"}
          envFrom:
            - secretRef: {name: mlflow-s3-credentials}
          ports: [{name: http, containerPort: 5000}]
          volumeMounts: [{name: deps, mountPath: /deps}]
          readinessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 20, initialDelaySeconds: 30}
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits: {memory: 2Gi}
      volumes:
        - {name: deps, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: adhar-system
  labels: {app.kubernetes.io/name: mlflow, app.kubernetes.io/part-of: mlflow}
  annotations: {argocd.argoproj.io/sync-wave: "3"}
spec:
  selector: {app.kubernetes.io/name: mlflow}
  ports: [{name: http, port: 5000, targetPort: http}]
