# Grafana dashboard for the Valkey cache (data/valkey). The hyperspike
# valkey-operator emits redis_exporter-compatible metrics (redis_*) via the
# valkey-sidecar when the Valkey CR sets prometheus: true + serviceMonitor:
# true (see valkey-cache.yaml). Auto-loaded by the Grafana sidecar
# (grafana_dashboard label). Datasource is variable-driven; the $job var is
# regex-scoped to valkey/cache services so it doesn't mix with data/redis.
apiVersion: v1
kind: ConfigMap
metadata:
  name: adhar-dashboard-valkey
  namespace: adhar-system
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: adhar-observability
  annotations:
    grafana_folder: "Platform"
data:
  valkey.json: |
