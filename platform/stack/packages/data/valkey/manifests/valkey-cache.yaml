# The platform's shared cache, asked for rather than built (2026-10-11).
#
# This was a `Valkey` CR declared here. It is now a `Cache`, and the control
# plane composes exactly that CR (compositions/cache/local-valkey.yaml) —
# verified by rendering this request and diffing the Valkey spec against the one
# it replaces, which came out field-for-field identical.
#
# The NAME is the contract and does not change: eight packages reach this cache
# at `adhar-cache.adhar-system.svc.cluster.local`, and the operator names the
# Service after the CR, so the XR must keep the same name.
#
# `password: false` keeps `anonymousAuth: true`. A shared cache every package
# connects to without a credential is the deliberate choice documented in the
# Cache XRD: it is reachable only inside the cluster, and handing a credential to
# every consumer is a rotation problem in exchange for very little. A team that
# wants its own isolated instance asks for its own Cache.
#
# Two labels differ from the hand-written CR (`app.kubernetes.io/name: valkey`
# and `part-of: adhar` are replaced by the composition's managed-by and hierarchy
# labels). Nothing selects them — the consumers use DNS and the ServiceMonitor is
# the operator's own — so this is cosmetic.
apiVersion: platform.adhar.io/v1alpha1
kind: Cache
metadata:
  name: adhar-cache
  namespace: adhar-system
  labels:
    app.kubernetes.io/part-of: adhar
    app.kubernetes.io/component: cache
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  parameters:
    displayName: Adhar shared cache
    engine: valkey
    # One node, no replica: more than one node SHARDS the keyspace (cluster
    # mode), which not every client library on this platform supports.
    nodes: 1
    replicas: 0
    password: false
    tls: false
    # A cache that hits its limit evicts. One with no limit is killed by the
    # kubelet instead, which is not eviction — it is an outage.
    maxMemory: 256Mi
    cpu: 25m
    metrics: true
