# LibreDB Studio's own server-side storage, provisioned from the platform CNPG
# operator (same pattern as data/metabase/manifests/platform-postgres.yaml).
#
# Studio defaults to keeping connections, tabs and query history in the
# browser's localStorage. That is per-browser, per-device state, which is the
# wrong shape once logins come from Keycloak — and it is also the mode in which
# the server cannot resolve a managed connection's credentials for the user.
# values.yaml therefore sets STORAGE_PROVIDER=postgres, and this is that
# PostgreSQL: the platform's own, never a bundled one (ADR-0011 rule: never
# bundle a capability the platform already provides — the chart's Bitnami
# postgresql subchart stays disabled).
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: libredb-db
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "-6"}
spec:
  length: 28
  digits: 5
  # No symbols: the password is interpolated into the STORAGE_POSTGRES_URL that
  # keycloak-client.yaml assembles, and a '/' or '@' there would be read as URL
  # structure rather than as password.
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: libredb-db-credentials
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "-6"}
spec:
  # '0' = generate once and never rotate: the password is baked into the role
  # at first initialisation, so a refresh would desynchronise Secret and
  # database.
  refreshInterval: '0'
  target:
    name: libredb-db-credentials
    template:
      # CNPG requires basic-auth with `username` + `password`, and `username`
      # MUST equal bootstrap.initdb.owner below.
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          adhar.io/cli-secret: 'true'
          adhar.io/package-name: libredb-studio
      engineVersion: v2
      data:
        username: libredb
        password: '{{ .PASSWORD }}'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: libredb-db
      rewrite:
        - transform:
            template: 'PASSWORD'
---
# The database, asked for rather than built.
#
# This was a CloudNativePG `Cluster` plus a `ScheduledBackup` declared here,
# with the same barman stanza every other platform database also carried. It is
# now a `Database`, and the control plane composes exactly those objects
# (compositions/database/local-cnpg.yaml) — verified by rendering this request
# and diffing it against the Cluster it replaces, field for field.
#
# The credential is unchanged: the ExternalSecret in this package still mints it,
# and `credentialsSecret` hands it to CNPG as the bootstrap owner secret.
apiVersion: platform.adhar.io/v1alpha1
kind: Database
metadata:
  name: libredb-db
  namespace: adhar-system
  labels:
    app.kubernetes.io/name: libredb-db
    adhar.io/component: libredb-studio
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  parameters:
    databaseName: libredb
    credentials:
      masterUsername: libredb
    credentialsSecret: libredb-db-credentials
    storageSize: 5Gi
    component: libredb-studio
    backupSchedule: 0 45 1 * * *
