---
# adhar-ai-rag (pgvector) is deliberately NOT wired here.
#
# `ai/adhar-ai` is opt-in and disabled by default, so its CNPG cluster — and
# therefore the `adhar-ai-rag-app` Secret this would read — does not exist on a
# default install. External Secrets fails an ExternalSecret whose remote key is
# absent ("could not get secret data from provider"), and ArgoCD then retries
# the whole Application forever: observed on the live DigitalOcean cluster as
# `Retrying attempt #14` while the app itself sat Healthy, because
# `ignore-healthcheck` hides the failure from the health check but not from the
# sync. A datasource must never be able to put the package into a permanent
# retry loop over something that is switched off.
#
# To add it after enabling `ai/adhar-ai`, copy the pattern of any Postgres
# block above (the README has the one-command recipe) — the seed document
# already tolerates a connection whose env vars are unset.
