# Credentials for the seed connections in values.yaml.
#
# One ExternalSecret per platform database, never a shared one: a single
# ExternalSecret fails as a whole when ONE of its sources is missing, which on
# a cluster that does not run posthog/metabase/open-metadata/adhar-ai would
# leave every connection without credentials. Split per datasource, a missing
# package costs exactly its own connection — Studio skips a connection whose
# `${VAR}` is undefined and lists the rest (docs/SEED_CONNECTIONS.md).
#
# Every password is mirrored from the Secret the owning operator already
# created; none is written here. CNPG uses the Secret named in
# bootstrap.initdb.secret as the application account, so that — not a
# `<cluster>-app` Secret — is the source for every cluster except adhar-ai-rag,
# which has no bootstrap secret and therefore gets the CNPG-generated
# `adhar-ai-rag-app`. The `gitea` ClusterSecretStore is the platform's
# kubernetes-provider store over adhar-system (the same one penpot reads MinIO
# credentials through); the name is historical, the scope is the namespace.
#
# argocd.argoproj.io/ignore-healthcheck: whether the owning package is enabled
# is an environment choice (local enables a curated core), so a datasource
# mirror that cannot sync must not make THIS application Degraded. The
# ExternalSecret keeps retrying every 5m and the connection appears the moment
# the package is turned on.
---
# gitea-db, created by the bootstrap phase (controllers/.../cnpg/gitea-db.yaml) — always present
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: libredb-ds-gitea
  namespace: adhar-system
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/ignore-healthcheck: "true"
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: gitea
    kind: ClusterSecretStore
  target:
    name: libredb-ds-gitea
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        PG_GITEA_USER: '{{ .username }}'
        PG_GITEA_PASSWORD: '{{ .password }}'
  data:
    - secretKey: username
      remoteRef: {key: gitea-db-credentials, property: username}
    - secretKey: password
      remoteRef: {key: gitea-db-credentials, property: password}
---
