data:
  NODE_ENV: "production"
  PORT: "3000"
  # Empty is the sentinel meaning "nobody chose": the image's entrypoint then
  # resolves the bind address itself and prefers a verified dual-stack "::".
  # The key is written explicitly rather than omitted so that whatever HOSTNAME
  # the runtime injects (a pod name, a container id) can never reach the server.
  HOSTNAME: ""
  NEXT_TELEMETRY_DISABLED: "1"
  NODE_OPTIONS: "--max-old-space-size=384"
  NEXT_PUBLIC_AUTH_PROVIDER: "oidc"
  LOG_LEVEL: "info"
  AUTH_BOOTSTRAP: "off"
  STORAGE_PROVIDER: "postgres"
  OIDC_ISSUER: "https://keycloak.adhar.localtest.me:8443/realms/adhar"
  OIDC_SCOPE: "openid profile email"
  OIDC_ROLE_CLAIM: "groups"
  OIDC_ADMIN_ROLES: "admin,platform-admin,platform-engineer"
