
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rustfs-oauth2-proxy
  namespace: adhar-system
  annotations:
    argocd.argoproj.io/sync-wave: '5'
spec:
  refreshPolicy: CreatedOnce
  refreshInterval: 30s
  secretStoreRef:
    name: keycloak
    kind: ClusterSecretStore
  target:
    name: rustfs-oauth2-proxy
    template:
      engineVersion: v2
      data:
        OAUTH2_PROXY_CLIENT_SECRET: '{{ .RUSTFS_CLIENT_SECRET }}'
        OAUTH2_PROXY_COOKIE_SECRET: '{{ .COOKIE_SECRET }}'
  data:
  - secretKey: RUSTFS_CLIENT_SECRET
    remoteRef:
      key: keycloak-clients
      property: RUSTFS_CLIENT_SECRET
  # The platform-wide cookie secret (security/keycloak/manifests/sso-cookie.yaml),
  # shared by every oauth2-proxy so a session one app established is accepted by
  # all of them instead of bouncing through Keycloak again.
  - secretKey: COOKIE_SECRET
    remoteRef:
      key: adhar-sso-cookie
      property: COOKIE_SECRET
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustfs-oauth2-proxy
  namespace: adhar-system
  labels:
    app.kubernetes.io/name: rustfs-oauth2-proxy
    app.kubernetes.io/part-of: rustfs
  annotations:
    argocd.argoproj.io/sync-wave: '5'
spec:
  # A late SSO secret (this app can sync before Keycloak has written
  # keycloak-clients) must not hold the rollout Progressing for the default
  # 10 minutes — surface it fast so ArgoCD retries.
  progressDeadlineSeconds: 120
  replicas: 1
  selector:
    matchLabels:
      app: rustfs-oauth2-proxy
  template:
    metadata:
      labels:
        app: rustfs-oauth2-proxy
    spec:
      containers:
      - name: oauth2-proxy
        image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1
        args:
        - --http-address=0.0.0.0:4180
        - --provider=oidc
        - --oidc-issuer-url=https://keycloak.adhar.localtest.me:8443/realms/adhar
        - --ssl-insecure-skip-verify=true
        - --client-id=rustfs
        - --redirect-url=https://rustfs.adhar.localtest.me:8443/oauth2/callback
        - --upstream=http://rustfs-console.adhar-system.svc.cluster.local:9001
        - --email-domain=*
        - --scope=openid profile email groups
        - --cookie-secure=true
        # Parent-domain cookie + the shared secret above = real single sign-on:
        # another app's proxy accepts this session with no round trip to Keycloak.
        - --cookie-domain=.adhar.localtest.me
        - --whitelist-domain=.adhar.localtest.me:8443
        - --skip-provider-button=true
        - --reverse-proxy=true
        envFrom:
        - secretRef:
            name: rustfs-oauth2-proxy
        ports:
        - name: http
          containerPort: 4180
        readinessProbe:
          httpGet:
            path: /ping
            port: http
        livenessProbe:
          httpGet:
            path: /ping
            port: http
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: rustfs-oauth2-proxy
  namespace: adhar-system
  labels:
    app.kubernetes.io/name: rustfs-oauth2-proxy
    app.kubernetes.io/part-of: rustfs
  annotations:
    argocd.argoproj.io/sync-wave: '5'
spec:
  selector:
    app: rustfs-oauth2-proxy
  ports:
  - name: http
    port: 4180
    targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rustfs
  namespace: adhar-system
  labels:
    app.kubernetes.io/name: rustfs
    app.kubernetes.io/part-of: rustfs
  annotations:
    argocd.argoproj.io/sync-wave: '5'
spec:
  parentRefs:
  - name: adhar-gateway
    namespace: adhar-system
  hostnames:
  - rustfs.adhar.localtest.me
  rules:
  - matches:
    - path:
        type: Exact
        value: /
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplaceFullPath
          replaceFullPath: /rustfs/console/
    backendRefs:
    - name: rustfs-oauth2-proxy
      port: 4180
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: rustfs-oauth2-proxy
      port: 4180
