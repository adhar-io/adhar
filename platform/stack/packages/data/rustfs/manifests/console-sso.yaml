# SSO for the RustFS console — SYNC-WAVE 5, deliberately late.
#
# The oauth2-proxy reads its client secret from Keycloak, which on a fresh
# cluster comes up long after the object store has to exist. With the proxy in
# an early wave, ArgoCD waited on "Deployment/rustfs-oauth2-proxy" and never
# reached the wave-2 buckets/warehouse Job — so nothing in the platform had a
# bucket, and every consumer of root-creds sat Degraded behind a login proxy.
# Observed on the 2026-09-15 bring-up. The store must never wait for its UI.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: rustfs-oauth2-cookie
  namespace: adhar-system
  annotations:
    argocd.argoproj.io/sync-wave: '5'
spec:
  length: 32
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rustfs-oauth2-proxy
  namespace: adhar-system
  annotations:
    argocd.argoproj.io/sync-wave: '5'
spec:
  refreshPolicy: CreatedOnce
  refreshInterval: 30s
  secretStoreRef:
    name: keycloak
    kind: ClusterSecretStore
  target:
    name: rustfs-oauth2-proxy
    template:
      engineVersion: v2
      data:
        OAUTH2_PROXY_CLIENT_SECRET: '{{ .RUSTFS_CLIENT_SECRET }}'
        OAUTH2_PROXY_COOKIE_SECRET: '{{ .COOKIE_SECRET }}'
  dataFrom:
  - sourceRef:
      generatorRef:
        apiVersion: generators.external-secrets.io/v1alpha1
        kind: Password
        name: rustfs-oauth2-cookie
    rewrite:
    - transform:
        template: COOKIE_SECRET
  data:
  - secretKey: RUSTFS_CLIENT_SECRET
    remoteRef:
      key: keycloak-clients
      property: RUSTFS_CLIENT_SECRET
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustfs-oauth2-proxy
  namespace: adhar-system
  labels:
    app.kubernetes.io/name: rustfs-oauth2-proxy
    app.kubernetes.io/part-of: rustfs
  annotations:
    argocd.argoproj.io/sync-wave: '5'
spec:
  # A late SSO secret (this app can sync before Keycloak has written
  # keycloak-clients) must not hold the rollout Progressing for the default
  # 10 minutes — surface it fast so ArgoCD retries.
  progressDeadlineSeconds: 120
  replicas: 1
  selector:
    matchLabels:
      app: rustfs-oauth2-proxy
  template:
    metadata:
      labels:
        app: rustfs-oauth2-proxy
    spec:
      containers:
      - name: oauth2-proxy
        image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1
        args:
        - --http-address=0.0.0.0:4180
        - --provider=oidc
        - --oidc-issuer-url=https://keycloak.adhar.localtest.me:8443/realms/adhar
        - --ssl-insecure-skip-verify=true
        - --client-id=rustfs
        - --redirect-url=https://rustfs.adhar.localtest.me:8443/oauth2/callback
        - --upstream=http://rustfs-console.adhar-system.svc.cluster.local:9001
        - --email-domain=*
        - --scope=openid profile email groups
        - --cookie-secure=true
        - --skip-provider-button=true
        - --reverse-proxy=true
        envFrom:
        - secretRef:
            name: rustfs-oauth2-proxy
        ports:
        - name: http
          containerPort: 4180
        readinessProbe:
          httpGet:
            path: /ping
            port: http
        livenessProbe:
          httpGet:
            path: /ping
            port: http
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: rustfs-oauth2-proxy
  namespace: adhar-system
  labels:
    app.kubernetes.io/name: rustfs-oauth2-proxy
    app.kubernetes.io/part-of: rustfs
  annotations:
    argocd.argoproj.io/sync-wave: '5'
spec:
  selector:
    app: rustfs-oauth2-proxy
  ports:
  - name: http
    port: 4180
    targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rustfs
  namespace: adhar-system
  labels:
    app.kubernetes.io/name: rustfs
    app.kubernetes.io/part-of: rustfs
  annotations:
    argocd.argoproj.io/sync-wave: '5'
spec:
  parentRefs:
  - name: adhar-gateway
    namespace: adhar-system
  hostnames:
  - rustfs.adhar.localtest.me
  rules:
  - matches:
    - path:
        type: Exact
        value: /
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplaceFullPath
          replaceFullPath: /rustfs/console/
    backendRefs:
    - name: rustfs-oauth2-proxy
      port: 4180
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: rustfs-oauth2-proxy
      port: 4180
