# Kubeflow Pipelines UI through the Cilium Gateway. The route lives in
# adhar-system, the same namespace as the backend Service and the Gateway
# (ADR-0011). sync-wave 2 keeps it after the Service so its health check
# doesn't deadlock the earlier waves.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kubeflow
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "2"}
  labels:
    app.kubernetes.io/name: kubeflow
    app.kubernetes.io/part-of: adhar-data
spec:
  parentRefs:
    - name: adhar-gateway
      namespace: adhar-system
  hostnames:
    - kubeflow.adhar.localtest.me
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: ml-pipeline-ui
          port: 80
