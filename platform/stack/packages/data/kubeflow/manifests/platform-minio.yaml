# Kubeflow Pipelines uses the platform's MinIO, not its own.
#
# Platform principle: applications consume platform-provisioned capabilities
# (object storage, Kafka, PostgreSQL, cache, search) rather than bundling their
# own. Upstream KFP ships a private MinIO Deployment whose image
# (gcr.io/ml-pipeline/minio:RELEASE.2019-08-14…) no longer exists, which took
# ml-pipeline and ml-pipeline-persistenceagent down with it.
#
# generate-manifests.sh strips that Deployment, its PVC and its Service; these
# resources take their place:
#   * minio-service            -> ExternalName alias to the platform MinIO, so
#                                 every upstream reference to "minio-service"
#                                 keeps working unchanged (same port 9000). KFP
#                                 now shares adhar-system with the platform MinIO
#                                 (ADR-0011), so this is a same-namespace CNAME to
#                                 `minio`; it is kept rather than dropped because
#                                 KFP components address the store by that name.
#   * mlpipeline-minio-artifact-> KFP's credential Secret, mirrored from the
#                                 platform MinIO root credentials by ESO.
# The "mlpipeline" bucket is provisioned by the minio package (values.yaml).
# Negative sync waves: ml-pipeline dials minio-service at startup, so the alias
# and the credential Secret must land before the KFP Deployments (wave 0).
apiVersion: v1
kind: Service
metadata:
  name: minio-service
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "-2"}
spec:
  type: ExternalName
  externalName: minio.adhar-system.svc.cluster.local
  ports:
    - {name: http, port: 9000, targetPort: 9000}
---
# KFP's credential Secret, continuously mirrored from the platform MinIO root
# credentials by External Secrets (the `gitea` ClusterSecretStore is the
# platform's Kubernetes-provider store over adhar-system). A one-shot Job here
# captured the bootstrap placeholder credentials before the minio package
# rotated them, and ml-pipeline then panicked with "The Access Key Id you
# provided does not exist"; an ExternalSecret follows rotations.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mlpipeline-minio-artifact
  namespace: adhar-system
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: gitea
    kind: ClusterSecretStore
  target:
    name: mlpipeline-minio-artifact
    creationPolicy: Owner
  data:
    - secretKey: accesskey
      remoteRef:
        key: root-creds
        property: rootUser
    - secretKey: secretkey
      remoteRef:
        key: root-creds
        property: rootPassword
