# Kafka UI on its own host through the Cilium Gateway.
# SSO: the backend below is the Keycloak oauth2-proxy from sso.yaml, which
# forwards to the original upstream: kafka-ui:80.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kafka-ui
  namespace: adhar-system
  # Apply AFTER the Service (sync-wave 1). The HTTPRoute's health check reports
  # Degraded ("backend Service not found") until its backend exists, and ArgoCD
  # blocks later waves on an unhealthy earlier wave — so a wave-0 route would
  # deadlock the wave-1 Deployment/Service that back it.
  annotations: {argocd.argoproj.io/sync-wave: "6"}
  labels:
    app.kubernetes.io/name: kafka-ui
    app.kubernetes.io/part-of: adhar-data
spec:
  parentRefs:
    - name: adhar-gateway
      namespace: adhar-system
  hostnames:
    - kafka-ui.adhar.localtest.me
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: kafka-ui-oauth2-proxy
          port: 4180
