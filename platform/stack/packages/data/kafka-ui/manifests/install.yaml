# Kafka UI — a web console for browsing topics/consumers/messages. Points at the
# in-cluster Kafka bootstrap (the `kafka` package's broker Service). Dynamic
# config is enabled so clusters can also be added from the UI at runtime — so the
# UI is useful even before/without the `kafka` package being enabled.
#
# Image: provectuslabs/kafka-ui (widely available); kafbat/kafka-ui is the
# maintained successor if you prefer to track it.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-ui
  namespace: adhar-system
  labels: {app.kubernetes.io/name: kafka-ui, app.kubernetes.io/part-of: adhar-data}
  annotations: {argocd.argoproj.io/sync-wave: "1"}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: kafka-ui}
  template:
    metadata:
      labels: {app.kubernetes.io/name: kafka-ui}
    spec:
      containers:
        - name: kafka-ui
          image: provectuslabs/kafka-ui:v0.7.2
          env:
            - {name: DYNAMIC_CONFIG_ENABLED, value: "true"}
            - {name: KAFKA_CLUSTERS_0_NAME, value: "adhar"}
            - {name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS, value: "kafka.adhar-system.svc.cluster.local:9092"}
            - {name: SERVER_SERVLET_CONTEXT_PATH, value: "/"}
          ports:
            - {name: http, containerPort: 8080}
          resources:
            requests: {cpu: 50m, memory: 256Mi}
            limits: {memory: 768Mi}
          readinessProbe:
            httpGet: {path: /actuator/health, port: 8080}
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 20
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-ui
  namespace: adhar-system
  labels: {app.kubernetes.io/name: kafka-ui}
  annotations: {argocd.argoproj.io/sync-wave: "1"}
spec:
  selector: {app.kubernetes.io/name: kafka-ui}
  ports:
    - {name: http, port: 80, targetPort: 8080}
