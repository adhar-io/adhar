# Grafana dashboard for Kafka UI (data/kafka-ui) — a Spring Boot app that
# exposes Micrometer/Prometheus metrics at /actuator/prometheus. Fed by the
# ServiceMonitor in servicemonitor.yaml. Datasource is variable-driven.
apiVersion: v1
kind: ConfigMap
metadata:
  name: adhar-dashboard-kafka-ui
  namespace: adhar-system
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: adhar-observability
  annotations:
    grafana_folder: "Platform"
data:
  kafka-ui.json: |
