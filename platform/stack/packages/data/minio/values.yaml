replicas: 1
mode: standalone

resources:
  requests:
    memory: 128Mi

persistence:
  enabled: true
  # No storageClass and no volumeName: the claim binds to whatever the
  # cluster's DEFAULT StorageClass provisions (local-path on Kind,
  # do-block-storage / gp3 / pd-balanced on the clouds). This package used to
  # ship a hostPath PersistentVolume ("backup" -> /backup, storageClass
  # "standard") and pin the claim to it with volumeName. That is Kind-only,
  # and the root-owned host directory is not writable by minio's uid 1000, so
  # minio crash-looped with "Unable to initialize backend: Unable to write to
  # the backend". Dynamically provisioned volumes honour the pod's fsGroup.
  #
  # Sizing: this one volume backs Velero, every CNPG WAL archive + base backup
  # (cnpg/<cluster>), Loki chunks, Penpot assets and the Kubeflow artifact
  # store. A 10 GiB volume filled in two days on the DO run (Keycloak alone
  # archived ~2 GiB of WAL a day), and a full MinIO stops WAL archiving, which
  # then fills the Postgres volumes and takes Keycloak (all SSO) down. Cloud
  # StorageClasses allow online expansion; grow it before it passes ~70 %.
  size: 100Gi

buckets:
  - name: adhar-backups
  # Kubeflow Pipelines' artifact store. KFP ships its own MinIO deployment
  # upstream, but its image (gcr.io/ml-pipeline/minio:RELEASE.2019-…) no longer
  # exists and a second object store on the same cluster is waste: the kubeflow
  # package points at this MinIO instead (see kubeflow/manifests/platform-minio.yaml).
  - name: mlpipeline
  # Penpot assets (application/penpot uses the S3 backend instead of a shared
  # ReadWriteOnce volume).
  - name: penpot
  # Loki chunks/index (observability/loki-stack uses the S3 backend).
  - name: loki

# Ingress is disabled: the MinIO console is now exposed via a Gateway API
# HTTPRoute (manifests/httproute.yaml) attached to the Cilium adhar-gateway,
# replacing the old nginx Ingress. If generate-manifests.sh is re-run, do not
# re-enable this -- maintain the HTTPRoute instead.
consoleIngress:
  enabled: false

existingSecret: root-creds

# Keycloak SSO for the MinIO console. The `minio` client + secret come from
# manifests/oidc.yaml (ExternalSecrets). The hardcoded `policy=consoleAdmin` claim
# on the Keycloak client (see keycloak-config.yaml) grants SSO users console admin.
# trustedCertsSecret mounts the platform CA so MinIO trusts Keycloak's self-signed
# cert during OIDC discovery/token exchange. Local root creds stay as break-glass.
oidc:
  enabled: true
  configUrl: "https://keycloak.adhar.localtest.me:8443/realms/adhar/.well-known/openid-configuration"
  clientId: "minio"
  existingClientSecretName: "minio-oidc"
  existingClientSecretKey: "MINIO_CLIENT_SECRET"
  claimName: "policy"
  scopes: "openid,profile,email,groups"
  redirectUri: "https://minio.adhar.localtest.me:8443/oauth_callback"
  displayName: "Keycloak"

trustedCertsSecret: "minio-ca"

# Standalone MinIO owns one ReadWriteOnce volume; a RollingUpdate can never
# schedule the replacement pod (the volume is attached to the old pod's node),
# so every config change parked the new pod in ContainerCreating for good.
deploymentUpdate:
  type: Recreate
