# Inputs for MinIO console OIDC (Keycloak) login, consumed by the chart's `oidc`
# block (values.yaml). The MinIO server does server-side OIDC discovery/token
# exchange against Keycloak over the self-signed platform cert, so it needs both
# the `minio` client secret and the platform CA (mounted via trustedCertsSecret).
---
# Keycloak `minio` client secret, from keycloak-clients (realm job wave 20).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: minio-oidc
  namespace: adhar-system
spec:
  # 1h, not "0": sync-once is a single attempt with no retry, so any ES created
  # before the Keycloak realm job has written keycloak-clients wedges as
  # SecretSyncedError forever.
  # 10s, not 30s: this is the RETRY cadence until keycloak-clients exists, and
  # the wait is the platform's critical path — Keycloak's wave-20 config Job
  # writes that Secret and several apps cannot go Healthy until their own ES has
  # picked it up. At 30s each consumer could sit on a Secret that was already
  # there for half a minute; the whole GitOps phase is a chain of such waits.
  refreshInterval: 10s
  secretStoreRef:
    name: keycloak
    kind: ClusterSecretStore
  target:
    name: minio-oidc
  data:
    - secretKey: MINIO_CLIENT_SECRET
      remoteRef:
        key: keycloak-clients
        property: MINIO_CLIENT_SECRET
---
# The self-signed platform CA (adhar-cert.tls.crt from adhar-system), mounted into
# MinIO's CA trust dir via chart value trustedCertsSecret. The `gitea`
# ClusterSecretStore reads the adhar-system namespace. Key ends in .crt so MinIO
# picks it up as a trusted CA.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: minio-ca
  namespace: adhar-system
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: gitea
    kind: ClusterSecretStore
  target:
    name: minio-ca
  data:
    - secretKey: adhar-ca.crt
      remoteRef:
        key: adhar-cert
        property: tls.crt
