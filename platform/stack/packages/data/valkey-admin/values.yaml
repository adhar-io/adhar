# Valkey Admin — the Valkey project's own admin UI (Apache-2.0,
# ghcr.io/valkey-io/valkey-admin) over the platform's Valkey caches.
#
# There is no published Helm chart, so manifests/valkey-admin.yaml is written
# by hand and these values document the choices it encodes. Keep the two in
# step. (This package ran Redis Commander until the Valkey project shipped its
# own UI; see the header of manifests/valkey-admin.yaml.)

image:
  repository: ghcr.io/valkey-io/valkey-admin
  # Pinned to the upstream release tag, no "v" prefix (ghcr publishes edge,
  # latest and 1.0.0-1.2.0; the full tag is the only one that does not move).
  tag: "1.2.0"

# Connections on the Connect page are PRE-ADDED, not configured here
# (2026-10-24). valkey-admin keeps its list only in browser localStorage, so
# manifests/connections-sync.yaml discovers every Valkey the platform composed
# (Cache XRs and Database engine=valkey: hyperspike Valkey CRs labelled
# app.kubernetes.io/managed-by=crossplane + platform.adhar.io/cache|database)
# every minute and the page seeds them on load. See README.md.
connections:
  autoRegister: true
  # Seed passwords of `password: true` caches into the (Keycloak-gated)
  # browser so they connect with one click. false = listed, password prompted.
  includePasswords: true
  # In-cluster TLS is signed by the adhar-selfsigned ClusterIssuer and
  # valkey-admin 1.2.0 cannot be given a CA, so verification is off.
  verifyTlsCertificate: false
# The shared cache also stays the server's one preconfigured instance
# (VALKEY_HOST, used by the metrics collector):
preconfigured:
  host: adhar-cache.adhar-system.svc.cluster.local
  port: 6379

# The UI itself has no users. Keycloak SSO (manifests/sso.yaml, oauth2-proxy
# in front) is the only way in; the Service is ClusterIP and the HTTPRoute
# points at the proxy, never at the app.
server:
  port: 8080
  # Read-only off: this is an ADMIN console — platform operators use it to
  # inspect and flush keys. Flip READ_ONLY to "true" to make it a viewer.
  readOnly: false
