# Valkey Admin UI routed through the Cilium Gateway (adhar-gateway); TLS
# terminates at the Gateway (adhar-cert).
#
# The backend is the Keycloak oauth2-proxy from sso.yaml, which forwards to the
# Redis Commander Service (valkey-admin:8081). The app has no users of its own,
# so this route is the only thing standing between the internet and FLUSHALL
# on the platform cache — it must never point at the app directly.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: valkey-admin
  namespace: adhar-system
  annotations:
    # After the oauth2-proxy (sso.yaml, wave 5): a route whose backend Service
    # does not exist yet is Degraded (ResolvedRefs=False) and deadlocks the
    # sync on a fresh cluster.
    argocd.argoproj.io/sync-wave: "6"
  labels:
    app.kubernetes.io/name: valkey-admin
    app.kubernetes.io/part-of: valkey-admin
spec:
  parentRefs:
    - name: adhar-gateway
      namespace: adhar-system
  hostnames:
    - valkey-admin.adhar.localtest.me
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: valkey-admin-oauth2-proxy
          port: 4180
