# Valkey Admin — the Valkey project's own admin UI, over the platform's cache.
#
# This package used to run Redis Commander, which is why opening it showed a
# Redis tool: it was named for the capability, and at the time the only
# MIT-licensed option was Redis Commander (RedisInsight is SSPL). The Valkey
# project now ships its own admin UI under Apache-2.0
# (https://valkey-admin.valkey.io), so the package runs the thing it is named
# after.
#
# Hand-written (no published chart); values.yaml documents every choice here.
# Access is ONLY through the oauth2-proxy in sso.yaml: this Service is
# ClusterIP and the HTTPRoute never points at it. That is not belt-and-braces:
# upstream's own documentation says Valkey Admin's Web mode has NO
# AUTHENTICATION and should be bound to localhost unless it sits behind an
# authenticating proxy. Here the proxy IS that, and FLUSHALL is one click away
# behind it.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey-admin
  namespace: adhar-system
  labels:
    app.kubernetes.io/name: valkey-admin
    app.kubernetes.io/part-of: valkey-admin
    app.kubernetes.io/component: ui
  # Same wave as the proxy: both are plain Deployments with nothing to wait for.
  annotations: {argocd.argoproj.io/sync-wave: "5"}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: valkey-admin
  template:
    metadata:
      labels:
        app: valkey-admin
        app.kubernetes.io/name: valkey-admin
    spec:
      # Sharing one namespace means Kubernetes injects a <NAME>_PORT env var per
      # Service; the entrypoint reads PORT and friends, so keep those out.
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # The uid MUST be numeric here, even though the image already sets a
        # non-root USER.
        #
        # valkey-admin's Dockerfile declares `USER node`, a NAME, and kubelet
        # cannot resolve a name to a uid without running the image: with
        # runAsNonRoot: true and no runAsUser it refuses the container outright
        # — `container has runAsNonRoot and image has non-numeric user (node),
        # cannot verify user is non-root`, CreateContainerConfigError, seventeen
        # times in three minutes. 1000 is what `id` reports inside 1.2.0.
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # Pre-added connections (2026-10-24, see connections-sync.yaml): the app
      # keeps its connection list only in browser localStorage, so the list is
      # seeded by two same-origin scripts served from /adhar/. This copies the
      # image's own built frontend into an emptyDir and adds their <script>
      # tags to index.html — derived from the image at start, so it can never
      # pin a stale asset hash from another release. Classic scripts run during
      # parsing, before the app's deferred module script reads localStorage.
      initContainers:
        - name: inject-connections
          image: ghcr.io/valkey-io/valkey-admin:1.2.0
          imagePullPolicy: IfNotPresent
          command: [sh, -c]
          args:
            - |
              set -eu
              # Keep file content only; preserving source mtimes/ownership with
              # -a fails under the pod's non-root security context.
              cp -R /app/apps/frontend/dist/. /dist/
              tags='<script src="/adhar/connections.js"></script><script src="/adhar/bootstrap.js"></script>'
              sed -i "s#</head>#${tags}</head>#" /dist/index.html
              # A newer image whose index.html changed shape still serves the
              # UI; only the pre-added connections would be missing, so warn
              # rather than keep the admin UI down.
              grep -q '/adhar/bootstrap.js' /dist/index.html \
                || echo "WARNING: could not inject the connection bootstrap into index.html" >&2
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: frontend
              mountPath: /dist
      containers:
        - name: valkey-admin
          # Pinned, not :latest — this is the UI through which someone can
          # delete every key in the platform's shared cache.
          #
          # The tag carries NO "v" prefix. valkey-admin's releases are named
          # v1.2.0 but its images are tagged 1.2.0, and the v-prefixed spelling
          # pulled ImagePullBackOff for an hour ("not found" from ghcr, which
          # reads like a private registry and is really a tag that was never
          # published). The published tags are edge, latest and 1.0.0-1.2.0.
          image: ghcr.io/valkey-io/valkey-admin:1.2.0
          imagePullPolicy: IfNotPresent
          env:
            # Web, not the desktop app: this is the containerised server mode.
            - name: DEPLOYMENT_MODE
              value: Web
            # The shared platform cache. It is unauthenticated inside the
            # cluster (`anonymousAuth: true`, see data/valkey), so no
            # VALKEY_AUTH_TYPE / USERNAME / PASSWORD is set — naming an auth
            # type with no credential makes the connection fail outright rather
            # than fall back to none.
            - name: VALKEY_HOST
              value: adhar-cache.adhar-system.svc.cluster.local
            - name: VALKEY_PORT
              value: "6379"
            - name: VALKEY_TLS
              value: "false"
          ports:
            - name: http
              # This image's own port. The Service and the oauth2-proxy
              # upstream were moved with it.
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          # timeoutSeconds 5, never the 1s the platform forbids
          # (TestNoProbeShipsAOneSecondTimeout).
          readinessProbe:
            httpGet:
              # The app root. The old probe path belonged to the previous
              # image; a probe path that 404s makes a healthy pod look broken.
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            # The image's frontend, with the bootstrap tags (init container).
            - name: frontend
              mountPath: /app/apps/frontend/dist
            # Served by the app's own express.static at /adhar/*, behind the
            # same oauth2-proxy as everything else. Not a subPath mount, so the
            # kubelet refreshes it in place when the sync job rewrites the
            # Secret — no restart when a cache is added or removed.
            - name: adhar-connections
              mountPath: /app/apps/frontend/dist/adhar
              readOnly: true
      volumes:
        - name: frontend
          emptyDir:
            sizeLimit: 32Mi
        - name: adhar-connections
          projected:
            sources:
              - configMap:
                  name: valkey-admin-connections
                  items: [{key: bootstrap.js, path: bootstrap.js}]
              # Written by the sync job, not by Argo CD (it holds passwords of
              # caches created with `password: true`). Optional so the UI starts
              # before the first run; bootstrap.js changes nothing without it.
              - secret:
                  name: valkey-admin-connections
                  optional: true
                  items: [{key: connections.js, path: connections.js}]
---
apiVersion: v1
kind: Service
metadata:
  name: valkey-admin
  namespace: adhar-system
  labels:
    app.kubernetes.io/name: valkey-admin
    app.kubernetes.io/part-of: valkey-admin
  annotations: {argocd.argoproj.io/sync-wave: "5"}
spec:
  type: ClusterIP
  selector:
    app: valkey-admin
  ports:
    - name: http
      port: 8080
      targetPort: http
