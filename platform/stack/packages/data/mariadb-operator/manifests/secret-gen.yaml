# The application user's password, generated in-cluster.
#
# The operator cannot generate it: `User.spec.passwordSecretKeyRef` takes only a
# `key` and a `name` (the `generate` flag belongs to the MariaDB kind's own
# password references). Sending `generate: true` made Argo CD's server-side apply
# fail with `.spec.passwordSecretKeyRef.generate: field not declared in schema`
# on every retry — 1326 of them in 14 hours on a live cluster — so the User was
# never created and its Grant failed with `Can't find any matching row in the
# user table`. See the comment on the User in cluster.yaml.
#
# Same wave as the User that reads it (5), not an earlier one: an ExternalSecret
# whose generatorRef does not exist yet reports `could not get secret data from
# provider` and never becomes healthy, so a LATER wave for the generator is a
# permanent deadlock (the trap airbyte hit — see data/airbyte/manifests/auth.yaml).
#
# refreshPolicy CreatedOnce: the password is written once and never rotated
# underneath a running database. Rotation goes through
# security/credential-rotation, which updates both sides.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: mariadb-adhar
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "5"}
spec:
  length: 24
  digits: 4
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mariadb-adhar-password
  namespace: adhar-system
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshPolicy: CreatedOnce
  target:
    name: mariadb-adhar-password
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        labels:
          # The operator watches Secrets with this label so a password change can
          # be applied to the live database.
          k8s.mariadb.com/watch: ""
          adhar.io/cli-secret: "true"
          adhar.io/package-name: mariadb-operator
      data:
        # The Password generator emits ONE key, named `password`. Every other
        # generator-backed ExternalSecret on the platform that reads it as
        # `PASSWORD` carries a `rewrite` to upper-case the key; this one did
        # not, so ESO failed every refresh with `map has no entry for key
        # "PASSWORD"`, the Secret was never created, the operator's User could
        # not read its password and the Grant failed on a user that did not
        # exist — mariadb-operator Degraded on every fresh cluster (2026-10-09).
        password: '{{ .password }}'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: mariadb-adhar
