  # Grant below then failed with `Error 1133 (28000): Can't find any matching row
  # in the user table`, so the whole package stayed Degraded.
  #
  # The password is generated the way every other platform credential is: an ESO
  # Password generator in secret-gen.yaml, in the SAME wave as this object.
  passwordSecretKeyRef:
    key: password
    name: mariadb-adhar-password
