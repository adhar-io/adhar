# lakeFS Prometheus ServiceMonitor
# Not emitted by the chart (lakefs-1.12.2 has no ServiceMonitor template). lakeFS
# serves Prometheus metrics at /metrics on its API port (Service "lakefs", port
# "http" 80 -> 8000) without authentication: api_requests_total{code,method},
# api_request_duration_seconds{operation,code}, lakefs_concurrent_requests
# {service,operation}, plus go_* / process_*. Prometheus serviceMonitorSelector is
# empty ({}), so this is scraped as-is and feeds the Adhar / lakeFS Grafana
# dashboard.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  name: lakefs
  namespace: adhar-system
  labels:
    app.kubernetes.io/name: lakefs
    app.kubernetes.io/instance: lakefs
    app.kubernetes.io/managed-by: adhar
spec:
  jobLabel: app.kubernetes.io/name
  namespaceSelector:
    matchNames:
      - adhar-system
  selector:
    matchLabels:
      app.kubernetes.io/name: lakefs
      app.kubernetes.io/instance: lakefs
  endpoints:
    - port: http
      path: /metrics
      interval: 60s
      scrapeTimeout: 30s
      honorLabels: true
