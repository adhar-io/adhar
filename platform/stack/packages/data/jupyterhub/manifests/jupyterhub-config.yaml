---
apiVersion: v1
kind: ConfigMap
metadata:
  name: jupyterhub-config-job
  namespace: adhar-system
  labels:
    # Generic Keycloak client contract: the keycloak package's config Job and
    # its 5-minute client-reconcile CronJob ensure every ConfigMap carrying
    # this label + a client.json key exists as a client and export its secret
    # to keycloak-clients as JUPYTERHUB_CLIENT_ID/_SECRET. The Job below stays
    # as the package's own fast-path convergence (same payload).
    adhar.io/keycloak-client: "true"
data:
  client.json: |
    {
      "protocol": "openid-connect",
      "clientId": "jupyterhub",
      "name": "Jupyterhub Client",
      "description": "Used for Jupyterhub SSO",
      "publicClient": false,
      "authorizationServicesEnabled": false,
      "serviceAccountsEnabled": false,
      "implicitFlowEnabled": false,
      "directAccessGrantsEnabled": true,
      "standardFlowEnabled": true,
      "frontchannelLogout": true,
      "attributes": {
        "saml_idp_initiated_sso_url_name": "",
        "oauth2.device.authorization.grant.enabled": false,
        "oidc.ciba.grant.enabled": false
      },
      "alwaysDisplayInConsole": false,
      "rootUrl": "",
      "baseUrl": "",
      "redirectUris": [
        "https://jupyterhub.adhar.localtest.me:8443/hub/oauth_callback"
      ],
      "webOrigins": [
        "/*"
      ]
    }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: jupyterhub-config
  namespace: adhar-system
  annotations:
    # A Sync hook, recreated on every sync: a plain Job that reaches its
    # backoffLimit stays Failed forever and selfHeal never touches it, so one
    # slow bring-up cost JupyterHub its OIDC client permanently (41 failed pods
    # over 8 h on 2026-10-05 while Keycloak was Pending for CPU). The script is
    # idempotent, so re-running it on the next `adhar upgrade` is free.
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  # This job needs the keycloak-clients Secret, which is written by a DIFFERENT
  # ArgoCD Application (keycloak) — sync waves cannot order across Applications,
  # so it always starts before Keycloak is ready. It WAITS for the Secret inside
  # one pod (below) rather than exiting 1 and spending a retry: every failed
  # attempt here used to pull apt packages and kubectl again, and the
  # exponential backoff made the gap between attempts six minutes.
  backoffLimit: 6
  template:
    metadata:
      generateName: jupyterhub-config
    spec:
      serviceAccountName: keycloak-config
      restartPolicy: Never
      volumes:
        - name: keycloak-config
          secret:
            secretName: keycloak-config
        - name: config-payloads
          configMap:
            name: jupyterhub-config-job
      containers:
        - name: kubectl
          image: docker.io/library/ubuntu:22.04
          volumeMounts:
            - name: keycloak-config
              readOnly: true
              mountPath: "/var/secrets/"
            - name: config-payloads
              readOnly: true
              mountPath: "/var/config/"
          command: ["/bin/bash", "-c"]
          args:
            - |
              #! /bin/bash
              set -ex -o pipefail
              apt -qq update && apt -qq install curl jq gettext-base -y
              
              # Fetch a kubectl matching the cluster's architecture. The old
              # hardcoded "v1.28.3//bin/linux/amd64" URL had a double slash AND
              # forced amd64, so on an arm64 node it downloaded an XML error page
              # (NoSuchKey) instead of a binary — every ./kubectl call then failed
              # with "syntax error near unexpected token `<`".
              KVER="$(curl -sSL https://dl.k8s.io/release/stable.txt)"
              ARCH="$(uname -m)"
              case "${ARCH}" in
                x86_64) ARCH="amd64" ;;
                aarch64|arm64) ARCH="arm64" ;;
              esac
              curl -sS -LO "https://dl.k8s.io/release/${KVER}/bin/linux/${ARCH}/kubectl"
              chmod +x kubectl
              
              # Wait for the identity path (CNPG → keycloak-db → Keycloak → the
              # realm config Job) rather than fail: up to 90 minutes, which covers
              # a cold cloud bring-up with room to spare.
              echo "waiting for the keycloak-clients Secret"
              for i in $(seq 1 180); do
                if ./kubectl get secret -n adhar-system keycloak-clients &> /dev/null; then
                  break
                fi
                [ "$i" -eq 180 ] && { echo "keycloak-clients never appeared after 90 minutes"; exit 1; }
                sleep 30
              done
              
              ADMIN_PASSWORD=$(cat /var/secrets/KEYCLOAK_ADMIN_PASSWORD)
              KEYCLOAK_URL=http://keycloak.adhar-system.svc.cluster.local:8080
              KEYCLOAK_TOKEN=$(curl -sS  --fail-with-body -X POST -H "Content-Type: application/x-www-form-urlencoded" \
                --data-urlencode "username=adhar-admin" \
                --data-urlencode "password=${ADMIN_PASSWORD}" \
                --data-urlencode "grant_type=password" \
                --data-urlencode "client_id=admin-cli" \
                ${KEYCLOAK_URL}/realms/master/protocol/openid-connect/token | jq -e -r '.access_token')
              
              set +e
              
              curl --fail-with-body -H "Authorization: bearer ${KEYCLOAK_TOKEN}"  "${KEYCLOAK_URL}/admin/realms/adhar"  &> /dev/null
              if [ $? -ne 0 ]; then
                exit 0
              fi
              set -e
              
              echo "creating Jupyterhub client"
              curl -sS -H "Content-Type: application/json" \
                -H "Authorization: bearer ${KEYCLOAK_TOKEN}" \
                -X POST --data @/var/config/client.json \
                  ${KEYCLOAK_URL}/admin/realms/adhar/clients
              
              CLIENT_ID=$(curl -sS -H "Content-Type: application/json" \
                -H "Authorization: bearer ${KEYCLOAK_TOKEN}" \
                -X GET ${KEYCLOAK_URL}/admin/realms/adhar/clients | jq -e -r  '.[] | select(.clientId == "jupyterhub") | .id')
              
              CLIENT_SCOPE_GROUPS_ID=$(curl -sS -H "Content-Type: application/json" -H "Authorization: bearer ${KEYCLOAK_TOKEN}" -X GET  ${KEYCLOAK_URL}/admin/realms/adhar/client-scopes | jq -e -r  '.[] | select(.name == "groups") | .id')
              curl -sS -H "Content-Type: application/json" -H "Authorization: bearer ${KEYCLOAK_TOKEN}" -X PUT  ${KEYCLOAK_URL}/admin/realms/adhar/clients/${CLIENT_ID}/default-client-scopes/${CLIENT_SCOPE_GROUPS_ID}
              
              JUPYTERHUB_CLIENT_SECRET=$(curl -sS -H "Content-Type: application/json" \
                -H "Authorization: bearer ${KEYCLOAK_TOKEN}" \
                -X GET ${KEYCLOAK_URL}/admin/realms/adhar/clients/${CLIENT_ID} | jq -e -r '.secret')
              
              ./kubectl patch secret -n adhar-system keycloak-clients --type=json \
                -p='[{
                "op" : "add" ,
                "path" : "/data/JUPYTERHUB_CLIENT_SECRET" ,
                "value" : "'$(echo -n "$JUPYTERHUB_CLIENT_SECRET" | base64 -w 0)'"
                },{
                  "op" : "add" ,
                  "path" : "/data/JUPYTERHUB_CLIENT_ID" ,
                  "value" : "'$(echo -n "jupyterhub" | base64 -w 0)'"
                }]'
