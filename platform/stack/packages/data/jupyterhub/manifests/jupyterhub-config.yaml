---
apiVersion: v1
kind: ConfigMap
metadata:
  name: jupyterhub-config-job
  namespace: adhar-system
data:
  jupyterhub-client-payload.json: |
    {
      "protocol": "openid-connect",
      "clientId": "jupyterhub",
      "name": "Jupyterhub Client",
      "description": "Used for Jupyterhub SSO",
      "publicClient": false,
      "authorizationServicesEnabled": false,
      "serviceAccountsEnabled": false,
      "implicitFlowEnabled": false,
      "directAccessGrantsEnabled": true,
      "standardFlowEnabled": true,
      "frontchannelLogout": true,
      "attributes": {
        "saml_idp_initiated_sso_url_name": "",
        "oauth2.device.authorization.grant.enabled": false,
        "oidc.ciba.grant.enabled": false
      },
      "alwaysDisplayInConsole": false,
      "rootUrl": "",
      "baseUrl": "",
      "redirectUris": [
        "https://adhar.localtest.me:8443/jupyterhub/hub/oauth_callback"
      ],
      "webOrigins": [
        "/*"
      ]
    }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: jupyterhub-config
  namespace: adhar-system
spec:
  # This job polls for the keycloak-clients Secret, which is written by a
  # DIFFERENT ArgoCD Application (keycloak) — sync waves cannot order across
  # Applications, so it always starts before Keycloak is ready and exits 1
  # until it is. The default backoffLimit of 6 gives up after ~10 minutes,
  # long before a cold local bootstrap finishes bringing up keycloak-db ->
  # keycloak -> the realm config job; the Job then stays Failed forever and
  # JupyterHub never gets its OIDC client. Retry for ~2h instead (capped at
  # the 6-minute inter-retry backoff Kubernetes tops out at).
  backoffLimit: 40
  template:
    metadata:
      generateName: jupyterhub-config
    spec:
      serviceAccountName: keycloak-config
      restartPolicy: Never
      volumes:
        - name: keycloak-config
          secret:
            secretName: keycloak-config
        - name: config-payloads
          configMap:
            name: jupyterhub-config-job
      containers:
        - name: kubectl
          image: docker.io/library/ubuntu:22.04
          volumeMounts:
            - name: keycloak-config
              readOnly: true
              mountPath: "/var/secrets/"
            - name: config-payloads
              readOnly: true
              mountPath: "/var/config/"
          command: ["/bin/bash", "-c"]
          args:
            - |
              #! /bin/bash
              set -ex -o pipefail
              apt -qq update && apt -qq install curl jq gettext-base -y
              
              # Fetch a kubectl matching the cluster's architecture. The old
              # hardcoded "v1.28.3//bin/linux/amd64" URL had a double slash AND
              # forced amd64, so on an arm64 node it downloaded an XML error page
              # (NoSuchKey) instead of a binary — every ./kubectl call then failed
              # with "syntax error near unexpected token `<`".
              KVER="$(curl -sSL https://dl.k8s.io/release/stable.txt)"
              ARCH="$(uname -m)"
              case "${ARCH}" in
                x86_64) ARCH="amd64" ;;
                aarch64|arm64) ARCH="arm64" ;;
              esac
              curl -sS -LO "https://dl.k8s.io/release/${KVER}/bin/linux/${ARCH}/kubectl"
              chmod +x kubectl
              
              echo "checking if we're ready to start"
              set +e
              ./kubectl get secret -n adhar-system keycloak-clients &> /dev/null
              if [ $? -ne 0 ]; then
                exit 1
              fi
              set -e
              
              ADMIN_PASSWORD=$(cat /var/secrets/KEYCLOAK_ADMIN_PASSWORD)
              KEYCLOAK_URL=http://keycloak.adhar-system.svc.cluster.local:8080
              KEYCLOAK_TOKEN=$(curl -sS  --fail-with-body -X POST -H "Content-Type: application/x-www-form-urlencoded" \
                --data-urlencode "username=adhar-admin" \
                --data-urlencode "password=${ADMIN_PASSWORD}" \
                --data-urlencode "grant_type=password" \
                --data-urlencode "client_id=admin-cli" \
                ${KEYCLOAK_URL}/realms/master/protocol/openid-connect/token | jq -e -r '.access_token')
              
              set +e
              
              curl --fail-with-body -H "Authorization: bearer ${KEYCLOAK_TOKEN}"  "${KEYCLOAK_URL}/admin/realms/adhar"  &> /dev/null
              if [ $? -ne 0 ]; then
                exit 0
              fi
              set -e
              
              echo "creating Jupyterhub client"
              curl -sS -H "Content-Type: application/json" \
                -H "Authorization: bearer ${KEYCLOAK_TOKEN}" \
                -X POST --data @/var/config/jupyterhub-client-payload.json \
                  ${KEYCLOAK_URL}/admin/realms/adhar/clients
              
              CLIENT_ID=$(curl -sS -H "Content-Type: application/json" \
                -H "Authorization: bearer ${KEYCLOAK_TOKEN}" \
                -X GET ${KEYCLOAK_URL}/admin/realms/adhar/clients | jq -e -r  '.[] | select(.clientId == "jupyterhub") | .id')
              
              CLIENT_SCOPE_GROUPS_ID=$(curl -sS -H "Content-Type: application/json" -H "Authorization: bearer ${KEYCLOAK_TOKEN}" -X GET  ${KEYCLOAK_URL}/admin/realms/adhar/client-scopes | jq -e -r  '.[] | select(.name == "groups") | .id')
              curl -sS -H "Content-Type: application/json" -H "Authorization: bearer ${KEYCLOAK_TOKEN}" -X PUT  ${KEYCLOAK_URL}/admin/realms/adhar/clients/${CLIENT_ID}/default-client-scopes/${CLIENT_SCOPE_GROUPS_ID}
              
              JUPYTERHUB_CLIENT_SECRET=$(curl -sS -H "Content-Type: application/json" \
                -H "Authorization: bearer ${KEYCLOAK_TOKEN}" \
                -X GET ${KEYCLOAK_URL}/admin/realms/adhar/clients/${CLIENT_ID} | jq -e -r '.secret')
              
              ./kubectl patch secret -n adhar-system keycloak-clients --type=json \
                -p='[{
                "op" : "add" ,
                "path" : "/data/JUPYTERHUB_CLIENT_SECRET" ,
                "value" : "'$(echo -n "$JUPYTERHUB_CLIENT_SECRET" | base64 -w 0)'"
                },{
                  "op" : "add" ,
                  "path" : "/data/JUPYTERHUB_CLIENT_ID" ,
                  "value" : "'$(echo -n "jupyterhub" | base64 -w 0)'"
                }]'
