  hub.config.ConfigurableHTTPProxy.auth_token: "dWw0WTIyT2p0dVpwbXZ1V1d4S3hwaWxPcmlJNUNRMFlPaWk1UEN3T2NYWmJ4RnBUQVRBZ0JsMmhjMENLdUdDSg=="
  hub.config.JupyterHub.cookie_secret: "ZDFjNjRlMzBkYjcxNDIyNDgzNTY0MTk3MzlmMDQzYTc4NzE1N2I2MGI1MmY2ZjJhM2ZlY2I5ZmFlYzRkZTU1ZQ=="
  hub.config.CryptKeeper.keys: "ZmJmOTdmM2I0ODQ4NWFmYzU0OTQ3ZGVlMTFhYmM3ZGQ3ODYzZmEyMmQ0ZGYzYjRjOWY2OTE3NjU4ZmE2Nzk1OQ=="
