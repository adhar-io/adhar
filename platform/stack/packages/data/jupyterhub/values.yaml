# Served at the subdomain root (jupyterhub.adhar.localtest.me) like the other
# packages -- no baseUrl. A /jupyterhub baseUrl combined with the gateway's
# prefix rewrite double-prefixed every browser request
# (/jupyterhub/hub/... -> /jupyterhub/jupyterhub/hub/...), so pages never loaded.
hub:
  extraEnv:
    - name: OAUTH_TLS_VERIFY # for getting around self signed certificate issue
      value: "0"
    - name: OAUTH_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: jupyterhub-oidc
          key: JUPYTERHUB_OAUTH_CLIENT_SECRET
  config:
    GenericOAuthenticator:
      # ALL endpoints use the SAME external gateway host. The browser hits the
      # external authorize endpoint, so the issued token's `iss` claim is the
      # external issuer (https://keycloak.adhar.localtest.me:8443/realms/adhar).
      # The server-side token + userinfo calls must therefore ALSO go to that
      # same external host: a previous attempt pointed token_url/userdata_url at
      # the in-cluster Service and Keycloak rejected the userinfo call with
      # HTTP 401 (token issuer != endpoint host). Connectivity to the external
      # gateway from the hub works now that the chart NetworkPolicy is disabled
      # (see below); the self-signed gateway cert is handled by disabling TLS
      # verification for these server-side calls (validate_server_cert: false /
      # OAUTH_TLS_VERIFY=0). This mirrors the working grafana OIDC setup.
      oauth_callback_url: https://jupyterhub.adhar.localtest.me:8443/hub/oauth_callback
      client_id: jupyterhub
      authorize_url: https://keycloak.adhar.localtest.me:8443/realms/adhar/protocol/openid-connect/auth
      token_url: https://keycloak.adhar.localtest.me:8443/realms/adhar/protocol/openid-connect/token
      userdata_url: https://keycloak.adhar.localtest.me:8443/realms/adhar/protocol/openid-connect/userinfo
      validate_server_cert: false
      scope:
        - openid
        - profile
      username_key: "preferred_username"
      login_service: "keycloak"
      allow_all: true # Allows all oauth authenticated users to use Jupyterhub. For finer grained control, you can use `allowed_users`: https://jupyterhub.readthedocs.io/en/stable/tutorial/getting-started/authenticators-users-basics.html#deciding-who-is-allowed
    JupyterHub:
      authenticator_class: generic-oauth
  # Disable the chart's NetworkPolicies. Their egress rules (Cilium-enforced on
  # this platform) block the hub pod from reaching in-cluster Services — the
  # server-side OAuth call to Keycloak timed out / 403'd, so login 500'd on the
  # callback. These policies are hostile-multitenant hardening JupyterHub does
  # not need here; Cilium + platform policies govern network security.
  networkPolicy:
    enabled: false
proxy:
  # proxy-public is reached through the Cilium Gateway HTTPRoute, not a cloud
  # load balancer. The chart default type=LoadBalancer leaves the Service
  # Pending forever on Kind (no LB controller), so ArgoCD never sees jupyterhub
  # healthy. ClusterIP is correct for gateway-fronted ingress.
  service:
    type: ClusterIP
  chp:
    networkPolicy:
      enabled: false
  traefik:
    networkPolicy:
      enabled: false
singleuser:
  networkPolicy:
    enabled: false
# Image pre-pulling disabled: the hook blocks ArgoCD sync (hook-image-awaiter)
# until the ~2GB singleuser image lands on every node, wedging the app at
# Progressing for the whole pull. Without it the image pulls lazily on first
# notebook spawn instead of blocking platform convergence.
prePuller:
  hook:
    enabled: false
  continuous:
    enabled: false
