# Dagster data orchestrator.
# The Dagster webserver (Dagit) UI is exposed via the Cilium Gateway API
# HTTPRoute (manifests/httproute.yaml) attached to adhar-gateway -- the chart
# Ingress is left disabled (default) and must NOT be enabled (no nginx).
ingress:
  enabled: false

dagsterWebserver:
  service:
    type: ClusterIP
    port: 80

# The chart ships a demo "k8s-example-user-code" deployment whose image fails to
# load its Dagster definitions (DagsterUserCodeLoadError) and crash-loops on a
# real cluster. Teams add their own code locations; the platform ships none.
dagster-user-deployments:
  enabled: true
  deployments: []
