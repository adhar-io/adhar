# Neo4j's credential, generated and never written down.
#
# NEO4J_AUTH is the one env var the image reads at FIRST BOOT, in the form
# `neo4j/<password>`, and it is honoured only while the store is empty: once
# `/data` holds a database the image ignores it and keeps the password it was
# initialised with. So this Secret is minted ONCE (`refreshPolicy: CreatedOnce`,
# `refreshInterval: "0"`) — a rotated value would not change the database and
# would instead leave every client holding a password the server never had.
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: neo4j
  namespace: adhar-system
  labels:
    app.kubernetes.io/name: neo4j
    adhar.io/component: neo4j
  annotations:
    argocd.argoproj.io/sync-wave: "-6"
spec:
  length: 32
  digits: 5
  # No symbols. This password is substituted into `neo4j/<password>` and into
  # `bolt://neo4j:<password>@host`, where an unescaped `/` or `@` changes which
  # database and host the client reaches.
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: neo4j-auth
  namespace: adhar-system
  labels:
    app.kubernetes.io/name: neo4j
    adhar.io/component: neo4j
  annotations:
    argocd.argoproj.io/sync-wave: "-6"
spec:
  refreshPolicy: CreatedOnce
  refreshInterval: "0"
  target:
    name: neo4j-auth
    template:
      engineVersion: v2
      metadata:
        labels:
          adhar.io/cli-secret: "true"
          adhar.io/package-name: neo4j
      data:
        # What the SERVER reads at first boot.
        NEO4J_AUTH: "neo4j/{{ .PASSWORD }}"
        # What CLIENTS read. Separate keys rather than one URI, because the
        # Python and Java drivers take host and credentials apart anyway, and a
        # URI is the form that gets logged by accident.
        username: neo4j
        password: "{{ .PASSWORD }}"
        host: neo4j.adhar-system.svc.cluster.local
        boltPort: "7687"
        httpPort: "7474"
        uri: "bolt://neo4j.adhar-system.svc.cluster.local:7687"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: neo4j
      rewrite:
        - transform:
            template: PASSWORD
