# MONGODB INSTALL RESOURCES
# Hand-maintained (NOT chart-generated). The bitnami/mongodb chart is hard-wired
# to docker.io/bitnamilegacy/mongodb images, which are published amd64-only —
# on arm64 nodes (Apple Silicon Kind) the pod crashloops with exec format
# errors. The official docker.io/library/mongo image is multi-arch, so this
# package ships a minimal standalone deployment on that image instead.
apiVersion: v1
kind: Secret
metadata:
  name: mongodb
  namespace: adhar-system
  labels:
    app.kubernetes.io/instance: mongodb
    app.kubernetes.io/name: mongodb
type: Opaque
stringData:
  mongodb-root-username: root
  mongodb-root-password: adharMongo123
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongodb
  namespace: adhar-system
  labels:
    app.kubernetes.io/instance: mongodb
    app.kubernetes.io/name: mongodb
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 8Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: adhar-system
  labels:
    app.kubernetes.io/instance: mongodb
    app.kubernetes.io/name: mongodb
spec:
  type: ClusterIP
  ports:
    - name: mongodb
      port: 27017
      targetPort: mongodb
  selector:
    app.kubernetes.io/instance: mongodb
    app.kubernetes.io/name: mongodb
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: adhar-system
  labels:
    app.kubernetes.io/instance: mongodb
    app.kubernetes.io/name: mongodb
spec:
  replicas: 1
  strategy:
    type: Recreate   # RWO volume: old pod must release it before the new one binds
  selector:
    matchLabels:
      app.kubernetes.io/instance: mongodb
      app.kubernetes.io/name: mongodb
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: mongodb
        app.kubernetes.io/name: mongodb
    spec:
      enableServiceLinks: false
      securityContext:
        fsGroup: 999
      containers:
        - name: mongodb
          image: docker.io/library/mongo:8.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: mongodb
              containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mongodb
                  key: mongodb-root-username
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb
                  key: mongodb-root-password
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          # mongosh ping; generous timing for loaded single-node clusters (ADR-0012)
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          volumeMounts:
            - name: data
              mountPath: /data/db
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mongodb
