apiVersion: v1
kind: ConfigMap
metadata:
  name: airbyte-temporal-dynamicconfig
  labels:
    helm.sh/chart: temporal-1.9.2
    app.kubernetes.io/name: temporal
    app.kubernetes.io/instance: airbyte
    app.kubernetes.io/version: 2.0.1
    app.kubernetes.io/managed-by: Helm
data:
  development.yaml: "frontend.namespaceCount:\n  - value: 4096\n    constraints: {}\n\
    frontend.namespaceRPS.visibility:\n  - value: 100\n    constraints: {}\nfrontend.namespaceBurst.visibility:\n\
    \  - value: 150\n    constraints: {}\nfrontend.namespaceRPS:\n  - value: 76800\n\
    \    constraints: {}\nfrontend.enableClientVersionCheck:\n  - value: true\n  \
    \  constraints: {}\nhistory.persistenceMaxQPS:\n  - value: 3000\n    constraints:\
    \ {}\nfrontend.persistenceMaxQPS:\n  - value: 5000\n    constraints: {}\nfrontend.historyMgrNumConns:\n\
    \  - value: 30\n    constraints: {}\nfrontend.throttledLogRPS:\n  - value: 200\n\
    \    constraints: {}\nfrontend.enableUpdateWorkflowExecution:\n  - value: true\n\
    frontend.enableUpdateWorkflowExecutionAsyncAccepted:\n  - value: true\nhistory.historyMgrNumConns:\n\
    \  - value: 50\n    constraints: {}\nsystem.advancedVisibilityWritingMode:\n \
    \ - value: \"off\"\n    constraints: {}\nhistory.defaultActivityRetryPolicy:\n\
    \  - value:\n      InitialIntervalInSeconds: 1\n      MaximumIntervalCoefficient:\
    \ 100.0\n      BackoffCoefficient: 2.0\n      MaximumAttempts: 0\nhistory.defaultWorkflowRetryPolicy:\n\
    \  - value:\n      InitialIntervalInSeconds: 1\n      MaximumIntervalCoefficient:\
    \ 100.0\n      BackoffCoefficient: 2.0\n      MaximumAttempts: 0\n# Limit for\
    \ responses. This mostly impacts discovery jobs since they have the largest responses.\n\
    limit.blobSize.error:\n  - value: 15728640 # 15MB\n    constraints: {}\nlimit.blobSize.warn:\n\
    \  - value: 10485760 # 10MB\n    constraints: {}\n"

