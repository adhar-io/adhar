spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: connector-builder-server
      app.kubernetes.io/instance: airbyte
  strategy:
    type: null
  template:
    metadata:
      labels:
        app.kubernetes.io/name: connector-builder-server
        app.kubernetes.io/instance: airbyte
    spec:
      serviceAccountName: airbyte-admin
      containers:
      - name: airbyte-connector-builder-server
        image: airbyte/connector-builder-server:2.0.1
        imagePullPolicy: IfNotPresent
        env:
        - name: AIRBYTE_VERSION
          valueFrom:
            configMapKeyRef:
              name: airbyte-airbyte-env
              key: AIRBYTE_VERSION
        - name: AIRBYTE_EDITION
          valueFrom:
            configMapKeyRef:
              name: airbyte-airbyte-env
              key: AIRBYTE_EDITION
        - name: MANIFEST_SERVER_API_HOST
          valueFrom:
            configMapKeyRef:
              name: airbyte-airbyte-env
              key: MANIFEST_SERVER_API_HOST
        - name: MICROMETER_METRICS_ENABLED
          valueFrom:
            configMapKeyRef:
              name: airbyte-airbyte-env
              key: MICROMETER_METRICS_ENABLED
        - name: MICROMETER_METRICS_STEP
          valueFrom:
            configMapKeyRef:
              name: airbyte-airbyte-env
              key: MICROMETER_METRICS_STEP
        - name: MICROMETER_METRICS_OTLP_ENABLED
          valueFrom:
            configMapKeyRef:
              name: airbyte-airbyte-env
              key: MICROMETER_METRICS_OTLP_ENABLED
        - name: OTEL_COLLECTOR_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: airbyte-airbyte-env
              key: OTEL_COLLECTOR_ENDPOINT
        - name: MICROMETER_METRICS_STATSD_ENABLED
          valueFrom:
            configMapKeyRef:
              name: airbyte-airbyte-env
              key: MICROMETER_METRICS_STATSD_ENABLED
        - name: MICROMETER_METRICS_STATSD_FLAVOR
          valueFrom:
            configMapKeyRef:
              name: airbyte-airbyte-env
              key: MICROMETER_METRICS_STATSD_FLAVOR
        - name: SEGMENT_WRITE_KEY
          valueFrom:
            configMapKeyRef:
              name: airbyte-airbyte-env
              key: SEGMENT_WRITE_KEY
        - name: STATSD_HOST
          valueFrom:
            configMapKeyRef:
              name: airbyte-airbyte-env
              key: STATSD_HOST
        - name: STATSD_PORT
          valueFrom:
            configMapKeyRef:
              name: airbyte-airbyte-env
              key: STATSD_PORT
        - name: TRACKING_STRATEGY
          valueFrom:
            configMapKeyRef:
              name: airbyte-airbyte-env
              key: TRACKING_STRATEGY
        livenessProbe:
          httpGet:
            path: /v1/health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 10
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /v1/health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 10
          successThreshold: 1
          failureThreshold: 3
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        resources:
          limits: {}
          requests: {}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false
          runAsGroup: 1000
          runAsNonRoot: true
          runAsUser: 1000
          seccompProfile:
            type: RuntimeDefault
        volumeMounts: null
      securityContext:
        fsGroup: 1000
      volumes: null

