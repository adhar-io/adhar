# Airbyte credential material.
#
# Airbyte splits its credentials over two Secrets:
#   * airbyte-config-secrets -- the instance-admin login the chart consumes via
#     global.auth.instanceAdmin, and what `adhar get secrets -p airbyte` prints.
#   * airbyte-auth-secrets   -- the runtime auth material every component reads:
#     the JWT signing key, the instance-admin OAuth client and the *dataplane*
#     client credentials the workload-launcher authenticates with.
#
# airbyte-auth-secrets is not ours alone. The airbyte-bootloader (a PreSync
# hook) registers the default dataplane and its service account in Airbyte's
# database and writes the resulting `dataplane-client-id` /
# `dataplane-client-secret` into this Secret (K8sSecretHelper.createOrUpdateSecret);
# on every later run it re-reads them and verifies them against the service
# account rows, re-registering only when they do not match. Those two values are
# therefore only meaningful if they equal the database rows -- a locally
# generated random string can never be one, so they must NOT be templated here.
#
# Hence `creationPolicy: Merge`: ESO maintains exactly the four keys it owns and
# leaves the bootloader's two dataplane keys untouched. Under the previous
# `Owner` policy ESO adopted the Secret and deleted `dataplane-client-id` /
# `dataplane-client-secret` the moment the bootloader wrote them, which parked
# airbyte-workload-launcher in CreateContainerConfigError ("couldn't find key
# dataplane-client-id in Secret adhar-system/airbyte-auth-secrets"); the same
# drift invalidated ESO's data hash and re-ran the Password generators, rotating
# instance-admin-password out of sync with airbyte-config-secrets so the UI
# login no longer matched `adhar get secrets`.
#
# For that second reason the four ESO-owned keys are no longer generated inline
# either: they are generated once into stable source Secrets
# (airbyte-config-secrets, airbyte-auth-material) and only *mirrored* here
# through the `gitea` ClusterSecretStore (the platform's Kubernetes-provider
# store over adhar-system), so a re-sync is a no-op instead of a rotation.
#
# Keys read out of airbyte-auth-secrets by the rendered chart:
#   jwt-signature-secret          -- server, worker, cron, workload-api-server
#   instance-admin-password       -- server
#   instance-admin-client-id      -- server
#   instance-admin-client-secret  -- server
#   dataplane-client-id           -- workload-launcher   (bootloader-owned)
#   dataplane-client-secret       -- workload-launcher   (bootloader-owned)
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: airbyte-admin
  namespace: adhar-system
  # Wave -3, the SAME wave as the ExternalSecret that consumes it
  # (airbyte-config-secrets), not -2.
  #
  # At -2 the generator was created a wave AFTER its consumer. ArgoCD applies
  # wave -3 first, the ExternalSecret cannot resolve a generatorRef that does not
  # exist yet, ESO reports `could not get secret data from provider`, the wave
  # never becomes healthy — and so wave -2 is never reached and the generator is
  # never created. A permanent deadlock: airbyte sat Degraded with that one error
  # and no amount of retrying could break it, because the thing it was waiting
  # for was queued behind it. `airbyte-auth` (below) has always been in the same
  # wave as its consumers, which is why only this one generator deadlocked.
  annotations: {argocd.argoproj.io/sync-wave: "-3"}
spec:
  length: 24
  digits: 4
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# The instance-admin login (chart: global.auth.instanceAdmin.secretName).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: airbyte-config-secrets
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "-3"}
spec:
  refreshInterval: '0'
  target:
    name: airbyte-config-secrets
    template:
      metadata:
        labels:
          adhar.io/cli-secret: 'true'
          adhar.io/package-name: airbyte
      engineVersion: v2
      data:
        instance-admin-email: airbyte-admin@adhar.local
        instance-admin-password: '{{ .PASSWORD }}'
        username: airbyte-admin@adhar.local
        password: '{{ .PASSWORD }}'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: airbyte-admin
      rewrite:
        - transform:
            template: 'PASSWORD'
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: airbyte-auth
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "-3"}
spec:
  length: 40
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# Stable source of the runtime auth material. Nothing but ESO ever writes to
# this Secret, so its data hash never drifts and the Password generators below
# run exactly once -- which is what keeps the mirror in airbyte-auth-secrets
# idempotent.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: airbyte-auth-material
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "-3"}
spec:
  refreshInterval: '0'
  target:
    name: airbyte-auth-material
    template:
      engineVersion: v2
      data:
        jwt-signature-secret: '{{ .JWT }}'
        instance-admin-client-id: '{{ .CLIENT_ID }}'
        instance-admin-client-secret: '{{ .CLIENT_SECRET }}'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: airbyte-auth
      rewrite:
        - transform:
            template: 'JWT'
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: airbyte-auth
      rewrite:
        - transform:
            template: 'CLIENT_ID'
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: airbyte-auth
      rewrite:
        - transform:
            template: 'CLIENT_SECRET'
---
# The Secret the chart actually binds. `Merge` -> ESO patches in only these four
# keys and never removes or rewrites the bootloader's dataplane-client-id /
# dataplane-client-secret. It needs the Secret to exist; the bootloader PreSync
# hook creates it before the Sync phase, and the 1m refresh retries until then
# (safe here because every value is read from a stable Secret, not regenerated).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: airbyte-auth-secrets
  namespace: adhar-system
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: gitea
    kind: ClusterSecretStore
  target:
    name: airbyte-auth-secrets
    creationPolicy: Merge
  data:
    - secretKey: jwt-signature-secret
      remoteRef: {key: airbyte-auth-material, property: jwt-signature-secret}
    - secretKey: instance-admin-client-id
      remoteRef: {key: airbyte-auth-material, property: instance-admin-client-id}
    - secretKey: instance-admin-client-secret
      remoteRef: {key: airbyte-auth-material, property: instance-admin-client-secret}
    - secretKey: instance-admin-password
      remoteRef: {key: airbyte-config-secrets, property: instance-admin-password}
