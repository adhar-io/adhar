# Memory requests for every Airbyte JVM (2026-10-22). The chart ships none, so
# each took the namespace's 64Mi default while holding 370-780 MiB: the
# scheduler stacked them onto full nodes and the kubelet evicted server, cron,
# worker and the workload API server ("request is 64Mi, has larger consumption
# of memory"). Each request is the measured working set rounded up; no limits,
# because a limit also moves the JVM's default heap ceiling.
cron:
  resources:
    requests: {cpu: 50m, memory: 768Mi}

connector-builder-server:
  resources:
    requests: {cpu: 20m, memory: 448Mi}
