# Airbyte data-integration / ELT platform.
# The Airbyte web UI is exposed via the Cilium Gateway API HTTPRoute
# (manifests/httproute.yaml) attached to adhar-gateway -- the chart Ingress is
# left disabled (default) and must NOT be enabled (no nginx).
global:
  edition: community
  # Airbyte's own login (instance admin, credentials generated by ESO into
  # airbyte-config-secrets — see manifests/auth.yaml and
  # `adhar get secrets -p airbyte`). Without it the UI is wide open and warns
  # "Your Airbyte instance is reachable from the internet and doesn't use any
  # form of authentication". Keycloak fronts the route via oauth2-proxy as well
  # (sso.yaml); OIDC inside Airbyte itself is an Enterprise feature.
  auth:
    enabled: true
    instanceAdmin:
      secretName: airbyte-config-secrets
      firstName: Adhar
      lastName: Admin
      emailSecretKey: instance-admin-email
      passwordSecretKey: instance-admin-password

  # Object storage: the platform MinIO, never the MinIO subchart the chart bundles
  # (ADR-0011 -- applications consume platform-provisioned capabilities). The
  # bundled StatefulSet/Service/bucket-Pod are stripped in generate-manifests.sh
  # (chart 1.9.3 has no `minio.enabled` toggle -- the objects are gated on
  # `global.storage.type == "minio"`, and turning that off would switch Airbyte to
  # the S3 provider). STORAGE_TYPE stays MINIO: that mode is S3 with path-style
  # access and works against the platform MinIO unchanged.
  #
  # Postgres is still the chart's bundled airbyte-db for now; move it to a CNPG
  # Cluster the way application/posthog does when that work is scheduled.
  storage:
    type: minio
    # Credentials come from their own Secret, mirrored off the platform MinIO
    # root credentials by ESO (manifests/platform-minio.yaml), instead of the
    # chart's literal minio/minio123 in airbyte-airbyte-secrets.
    secretName: airbyte-platform-minio
    # One bucket for every Airbyte prefix; provisioned by data/minio/values.yaml.
    bucket:
      log: airbyte
      state: airbyte
      workloadOutput: airbyte
      activityPayload: airbyte
      auditLogging: airbyte
    minio:
      # Overrides the chart default "http://airbyte-minio-svc:9000"
      # (templates/_helpers.tpl -> airbyte.storage.minio.endpoint), which is the
      # only reference to the stripped subchart Service.
      endpoint: http://rustfs.adhar-system.svc.cluster.local:9000

webapp:
  ingress:
    enabled: false

server:
  # JVM start-up budget. The chart's liveness probe (initialDelay 30 s, 3 × 10 s)
  # gives a Micronaut JVM 60 s to bind its health port; on a node at 100% CPU
  # requests it takes longer, so kubelet killed the server, worker, workload
  # API server and launcher before they finished booting — 130+ restarts each
  # (2026-10-05) and Airbyte never came up at all. The chart (1.9.3) has no
  # startupProbe knob, so liveness carries the boot: 60 s + 12 × 10 s = 3 min
  # before a kill, which a cold JVM on a saturated node fits with room.
  # timeoutSeconds 5, never the chart's 1: a loaded node fails a healthy probe
  # (TestNoProbeShipsAOneSecondTimeout).
  livenessProbe:
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 12
  readinessProbe:
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 12

