# Metabase's application database, provisioned from the platform CNPG operator
# (same pattern as application/posthog/manifests/platform-postgres.yaml).
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: metabase-db
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "-6"}
spec:
  length: 28
  digits: 5
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: metabase-db-credentials
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "-6"}
spec:
  refreshInterval: '0'
  target:
    name: metabase-db-credentials
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          adhar.io/cli-secret: 'true'
          adhar.io/package-name: metabase
      engineVersion: v2
      data:
        username: metabase
        password: '{{ .PASSWORD }}'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: metabase-db
      rewrite:
        - transform:
            template: 'PASSWORD'
---
# The database, asked for rather than built.
#
# This was a CloudNativePG `Cluster` plus a `ScheduledBackup` declared here,
# with the same barman stanza every other platform database also carried. It is
# now a `Database`, and the control plane composes exactly those objects
# (compositions/database/local-cnpg.yaml) — verified by rendering this request
# and diffing it against the Cluster it replaces, field for field.
#
# The credential is unchanged: the ExternalSecret in this package still mints it,
# and `credentialsSecret` hands it to CNPG as the bootstrap owner secret.
apiVersion: platform.adhar.io/v1alpha1
kind: Database
metadata:
  name: metabase-db
  namespace: adhar-system
  labels:
    app.kubernetes.io/name: metabase-db
    adhar.io/component: metabase
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  parameters:
    databaseName: metabase
    credentials:
      masterUsername: metabase
    credentialsSecret: metabase-db-credentials
    storageSize: 20Gi
    component: metabase
    backupSchedule: 0 30 1 * * *
