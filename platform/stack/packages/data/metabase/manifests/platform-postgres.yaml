# Metabase's application database, provisioned from the platform CNPG operator
# (same pattern as application/posthog/manifests/platform-postgres.yaml).
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: metabase-db
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "-6"}
spec:
  length: 28
  digits: 5
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: metabase-db-credentials
  namespace: adhar-system
  annotations: {argocd.argoproj.io/sync-wave: "-6"}
spec:
  refreshInterval: '0'
  target:
    name: metabase-db-credentials
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          adhar.io/cli-secret: 'true'
          adhar.io/package-name: metabase
      engineVersion: v2
      data:
        username: metabase
        password: '{{ .PASSWORD }}'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: metabase-db
      rewrite:
        - transform:
            template: 'PASSWORD'
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: metabase-db
  namespace: adhar-system
  labels:
    app.kubernetes.io/name: metabase-db
    adhar.io/component: metabase
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
    argocd.argoproj.io/sync-options: ServerSideApply=true,SkipDryRunOnMissingResource=true
spec:
  instances: 1
  storage:
    size: 20Gi
  enableSuperuserAccess: false
  bootstrap:
    initdb:
      database: metabase
      owner: metabase
      secret:
        name: metabase-db-credentials
  backup:
    retentionPolicy: 30d
    barmanObjectStore:
      destinationPath: s3://adhar-backups/cnpg/metabase-db
      endpointURL: http://minio.adhar-system.svc.cluster.local:9000
      s3Credentials:
        accessKeyId:
          name: root-creds
          key: rootUser
        secretAccessKey:
          name: root-creds
          key: rootPassword
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: metabase-db-daily
  namespace: adhar-system
  labels:
    app.kubernetes.io/name: metabase-db
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  schedule: "0 30 1 * * *"
  backupOwnerReference: self
  cluster:
    name: metabase-db
