# Metabase UI routed through the Cilium Gateway (adhar-gateway). TLS terminates
# at the Gateway (adhar-cert). Replaces any nginx Ingress. Metabase is served at
# the root of its own hostname (MB_SITE_URL in manifests/install.yaml matches)
# and the request is forwarded to the metabase service:80.
#
# SSO: every backend below is the Keycloak oauth2-proxy from sso.yaml, which
# forwards to the original upstream(s): metabase:80.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: metabase
  namespace: adhar-system
  annotations:
    # After the oauth2-proxy (sso.yaml, wave 5): ArgoCD holds a wave until its
    # resources are healthy, and a route whose backend Service does not exist
    # yet is Degraded (ResolvedRefs=False) — at an earlier wave that deadlocks
    # the sync on a fresh cluster and the proxy is never created.
    argocd.argoproj.io/sync-wave: "6"
  labels:
    app.kubernetes.io/name: metabase
    app.kubernetes.io/instance: metabase
spec:
  parentRefs:
    - name: adhar-gateway
      namespace: adhar-system
  hostnames:
    - metabase.adhar.localtest.me
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: metabase-oauth2-proxy
          port: 4180
