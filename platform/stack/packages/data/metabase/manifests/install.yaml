apiVersion: apps/v1
kind: Deployment
metadata:
  name: metabase
  namespace: adhar-system
  labels:
    app.kubernetes.io/name: metabase
    app.kubernetes.io/instance: metabase
spec:
  # A late SSO secret (this app can sync before Keycloak has written
  # keycloak-clients) must not hold the rollout Progressing for the default
  # 10 minutes — surface it fast so ArgoCD retries.
  progressDeadlineSeconds: 120
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: metabase
      app.kubernetes.io/instance: metabase
  template:
    metadata:
      labels:
        app.kubernetes.io/name: metabase
        app.kubernetes.io/instance: metabase
    spec:
      containers:
      - name: metabase
        image: metabase/metabase:v0.51.10
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 3000
        env:
        # Cap the heap BELOW the container limit. A JVM that sizes its heap to the
        # whole cgroup has nothing left for metaspace, the code cache and thread
        # stacks, and gets killed rather than garbage collecting.
        - name: JAVA_OPTS
          value: "-Xmx1400m -XX:MaxMetaspaceSize=256m"
        - name: MB_JETTY_PORT
          value: '3000'
        # Host-based route (manifests/httproute.yaml, via the metabase
        # oauth2-proxy); rewritten to the platform domain at seed time. It must
        # match the browser URL or Metabase emits absolute links (emails,
        # pulses, embeds) that point somewhere unreachable.
        - name: MB_SITE_URL
          value: https://metabase.adhar.localtest.me:8443
        # Application database on the platform CNPG operator
        # (manifests/platform-postgres.yaml) — the image default is an H2 file
        # inside the container, so every restart wiped users, dashboards and
        # the completed setup wizard.
        - name: MB_DB_TYPE
          value: postgres
        - name: MB_DB_HOST
          value: metabase-db-rw.adhar-system.svc.cluster.local
        - name: MB_DB_PORT
          value: "5432"
        - name: MB_DB_DBNAME
          value: metabase
        - name: MB_DB_USER
          valueFrom: {secretKeyRef: {name: metabase-db-credentials, key: username}}
        - name: MB_DB_PASS
          valueFrom: {secretKeyRef: {name: metabase-db-credentials, key: password}}
        readinessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 60
          periodSeconds: 15
          failureThreshold: 12
        livenessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 120
          periodSeconds: 30
          failureThreshold: 6
        resources:
          requests:
            cpu: 250m
            memory: 1Gi
          limits:
            # 2Gi, not 1Gi. Metabase is a JVM application and 1Gi was not enough
            # to finish starting: it was OOMKilled 90 times in a row while still
            # registering its JDBC drivers, so the app never reached a state where
            # its own logs said anything was wrong — the only evidence was
            # lastState.terminated.reason=OOMKilled. Upstream asks for 2GB.
            memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: metabase
  namespace: adhar-system
  labels:
    app.kubernetes.io/name: metabase
    app.kubernetes.io/instance: metabase
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: metabase
    app.kubernetes.io/instance: metabase
  ports:
  - name: http
    port: 80
    targetPort: http
