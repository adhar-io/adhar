# OpenMetadata metadata / data-catalog platform.
#
# The OpenMetadata UI is exposed via the Cilium Gateway API HTTPRoute
# (manifests/httproute.yaml) attached to adhar-gateway -- the chart Ingress is
# left disabled (default) and must NOT be enabled (no nginx).
#
# PLATFORM DEPENDENCIES (see manifests/platform-dependencies.yaml)
# ---------------------------------------------------------------
# The openmetadata chart ships NO database and NO search engine: it expects an
# external MySQL/Postgres, an Elasticsearch/OpenSearch and (optionally) an
# Airflow. Adhar applications consume PLATFORM capabilities rather than bundling
# their own subcharts, so:
#
#   * database  -> a CloudNativePG `Cluster` named `openmetadata-db`, provisioned
#                  by the platform `cnpg` package. CNPG publishes the primary as
#                  Service `openmetadata-db-rw` (port 5432) in adhar-system, and
#                  its `bootstrap.initdb` creates the `openmetadata_db` database
#                  owned by the `openmetadata` role. The password is generated by
#                  ESO into Secret `openmetadata-db-credentials` (basic-auth,
#                  keys `username`/`password`) -- this replaces the chart default
#                  `mysql-secrets`, whose absence is what made the
#                  run-db-migrations init container fail with
#                  `secret "mysql-secrets" not found`.
#
#                  NOT MySQL: the platform MySQL operator only provisions
#                  InnoDBClusters (Group Replication), which refuse writes to
#                  OpenMetadata's primary-key-less tables, and the sole GR
#                  workaround (sql_generate_invisible_primary_key=ON) is itself
#                  rejected by OpenMetadata's migrations. See
#                  manifests/platform-dependencies.yaml.
#
#   * search    -> the platform `opensearch` package
#                  (`opensearch-cluster-master:9200`). That cluster runs with the
#                  OpenSearch security plugin's DEMO certificates, i.e. HTTPS with
#                  a self-signed CA whose SANs do not cover the in-cluster
#                  Service DNS name. OpenMetadata's search client applies default
#                  JVM trust + hostname verification and exposes no
#                  "skip verification" switch (only ELASTICSEARCH_TRUST_STORE_PATH,
#                  which cannot fix the hostname mismatch), so the package ships a
#                  minimal TLS-terminating bridge Service `openmetadata-opensearch`
#                  (nginx, `proxy_ssl_verify off`) and OpenMetadata talks plain
#                  HTTP to it. Credentials still travel end to end: the bridge
#                  forwards the Authorization header to OpenSearch.
#
#   * pipelines -> DISABLED. The chart's pipelineServiceClientConfig defaults to
#                  an Airflow deployed by the openmetadata-dependencies chart,
#                  which Adhar does not run (and whose `airflow-secrets` Secret
#                  does not exist either). Ingestion pipelines are therefore not
#                  available; the catalog, lineage, glossary and search UIs are.
ingress:
  enabled: false

openmetadata:
  config:
    database:
      enabled: true
      # CNPG primary Service for the `openmetadata-db` Cluster
      # (postgresql.cnpg.io/v1, manifests/platform-dependencies.yaml).
      host: openmetadata-db-rw.adhar-system.svc.cluster.local
      port: 5432
      driverClass: org.postgresql.Driver
      dbScheme: postgresql
      databaseName: openmetadata_db
      auth:
        # Must match bootstrap.initdb.owner / the `username` key of the
        # basic-auth Secret CNPG bootstraps the role from.
        username: openmetadata
        password:
          # Created by platform-dependencies.yaml (ESO Password generator), NOT
          # the chart default `mysql-secrets`.
          secretRef: openmetadata-db-credentials
          secretKey: password
      # The chart default is MySQL-only
      # (allowPublicKeyRetrieval / useSSL / serverTimezone are Connector/J
      # properties); pgjdbc needs none of them, so the JDBC URL carries no query
      # string and the driver's own defaults apply.
      dbParams: ""
    elasticsearch:
      enabled: true
      searchType: opensearch
      # TLS-terminating bridge in front of opensearch-cluster-master:9200
      # (platform-dependencies.yaml). Plain HTTP inside the cluster only.
      host: openmetadata-opensearch.adhar-system.svc.cluster.local
      port: 9200
      scheme: http
      auth:
        enabled: true
        # OpenSearch security-plugin admin user shipped by the opensearch package.
        username: admin
        password:
          secretRef: openmetadata-opensearch-secrets
          secretKey: openmetadata-opensearch-password
    # No Airflow on the platform: do not deploy one, disable the client instead.
    pipelineServiceClientConfig:
      enabled: false
      airflow:
        auth:
          # MUST be false as well. The chart guards the AIRFLOW_PASSWORD env with
          #   {{- if and ($pipelineConfig.enabled | default true) ($authConfig.enabled | default false) }}
          # and Helm's `default` treats the boolean false as "empty", so
          # `false | default true` evaluates to TRUE: `enabled: false` above does
          # NOT suppress the env var. Left on, the Deployment keeps a
          # secretKeyRef to the chart-default `airflow-secrets` Secret, which
          # this platform never creates -- the same class of failure as the
          # original `secret "mysql-secrets" not found`.
          enabled: false
          password:
            secretRef: ""
            secretKey: ""
    # Deploying ingestion pipelines requires the pipeline service client above.
    deployPipelinesConfig:
      enabled: false

# Belt and braces. With the client disabled the chart puts
# PIPELINE_SERVICE_CLIENT_ENABLED into openmetadata-pipeline-secret as the
# QUOTED string "false"; a container-level env wins over envFrom, so this pins
# the plain boolean into both the migration init container and the server
# container (extraEnvs is rendered into both).
extraEnvs:
  - name: PIPELINE_SERVICE_CLIENT_ENABLED
    value: "false"

# Scheduling hints only -- deliberately no memory LIMIT: the server JVM sizes its
# heap from the container limit and reindexing is memory hungry, so a limit here
# turns a slow reindex into an OOMKill loop.
resources:
  requests:
    cpu: 250m
    memory: 1Gi
