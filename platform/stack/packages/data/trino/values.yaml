# Trino distributed SQL query engine.
# The Trino UI/coordinator is exposed via the Cilium Gateway API HTTPRoute
# (manifests/httproute.yaml) attached to adhar-gateway -- the chart Ingress is
# left disabled (default) and must NOT be enabled (no nginx).
server:
  workers: 1

ingress:
  enabled: false

service:
  type: ClusterIP
  port: 8080

# Catalogs. The chart's own defaults (tpch/tpcds sample data) are kept for smoke
# queries; `iceberg` is the platform lakehouse.
#
# The Iceberg REST catalog is RustFS S3 Tables — the catalog runs INSIDE the
# object store on the same port, so the REST uri and the S3 endpoint are the
# same host. Auth is SigV4 with the platform object-store root credential
# (`root-creds`), which trino reads from env via the secret mounted below; the
# REST catalog uses the same keys (`security=SIGV4`, signing name `s3`).
#
# RustFS documents Trino against its catalog as READ verified and write
# "not claimed" (docs/architecture/s3-tables-support-matrix.md). Writes are
# therefore done by PyIceberg (Dagster) in the data golden path, and Trino is the
# query/dbt layer — dbt-trino issues CTAS/INSERT, which is the one thing to watch
# on a fresh RustFS release.
catalogs:
  tpch: |
    connector.name=tpch
    tpch.splits-per-node=4
  tpcds: |
    connector.name=tpcds
    tpcds.splits-per-node=4
  iceberg: |
    connector.name=iceberg
    iceberg.catalog.type=rest
    iceberg.rest-catalog.uri=http://rustfs.adhar-system.svc.cluster.local:9000/iceberg
    iceberg.rest-catalog.warehouse=lakehouse
    iceberg.rest-catalog.security=SIGV4
    iceberg.rest-catalog.signing-name=s3
    iceberg.rest-catalog.vended-credentials-enabled=false
    fs.native-s3.enabled=true
    s3.endpoint=http://rustfs.adhar-system.svc.cluster.local:9000
    s3.region=us-east-1
    s3.path-style-access=true
    s3.aws-access-key=${ENV:S3_ACCESS_KEY}
    s3.aws-secret-key=${ENV:S3_SECRET_KEY}

# The object-store credential for the iceberg catalog, as env on coordinator and
# workers (`${ENV:...}` expansion in catalog properties is native to Trino).
envFrom:
  - secretRef:
      name: trino-s3-credentials
