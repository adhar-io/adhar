# Trino distributed SQL query engine.
# The Trino UI/coordinator is exposed via the Cilium Gateway API HTTPRoute
# (manifests/httproute.yaml) attached to adhar-gateway -- the chart Ingress is
# left disabled (default) and must NOT be enabled (no nginx).
server:
  workers: 1
  # Single sign-on: the Keycloak oauth2-proxy in front (manifests/sso.yaml) is
  # the gate, and Trino has no authenticator of its own (clients connect over
  # plain HTTP inside the cluster). With no authenticator the web UI still draws
  # a username/password form, so a person who had just signed in to Keycloak was
  # asked to sign in AGAIN. `fixed` serves the UI as one user with no form;
  # it grants nothing a typed username did not already grant.
  #
  # `alternate-header-name=Presto`: Metabase reaches Trino through its bundled
  # `presto-jdbc` driver (it ships no Trino/Starburst driver), which speaks
  # X-Presto-* headers. Trino accepts them only with this set; without it every
  # Metabase query fails on a missing user header.
  coordinatorExtraConfig: |-
    web-ui.authentication.type=fixed
    web-ui.user=adhar-ui
    protocol.v1.alternate-header-name=Presto

# Access control: the `metabase` user is READ-ONLY on every catalog, everyone
# else unchanged. Metabase is enrolled by metabase-database-sync and the
# console's SQL Editor runs through Metabase's admin session, so whatever
# Metabase may do, every console user may do — it must not be able to write or
# drop lakehouse tables. With no authenticator the user name is a label, not a
# credential; the boundary this enforces is "what Metabase does", which is the
# path every console user takes.
accessControl:
  type: configmap
  refreshPeriod: 60s
  configFile: "rules.json"
  rules:
    rules.json: |-
      {
        "catalogs": [
          {"user": "metabase", "catalog": ".*", "allow": "read-only"},
          {"catalog": ".*", "allow": "all"}
        ]
      }

# Heap and requests (2026-10-22). The chart default is an 8G heap per JVM with NO
# request, so on this platform both pods took the namespace's 64Mi default
# request while holding ~800-900 MiB and able to grow to 8 GiB each on a 12 GiB
# node. The coordinator was evicted three times in one afternoon ("request is
# 64Mi, has larger consumption of memory"). 2G of heap still satisfies Trino's
# own startup check: query.max-memory-per-node (1GB) + 30% heap headroom (~614MB)
# fits inside it. The request covers heap in use + the 512M code cache; the heap
# cap — not a container limit — is what bounds the footprint.
coordinator:
  jvm:
    maxHeapSize: "2G"
  resources:
    requests: {cpu: 100m, memory: 1Gi}
  # 30s + 90 x 10s = a sixteen-minute boot budget, not two. The upstream
  # chart's 10 + 60 x 2s gives the JVM 130 seconds, and on a node whose CPU is
  # already committed Trino was still in "Loading configuration" three minutes
  # in: every worker was SIGTERMed (exitCode 143) and CrashLoopBackOff'd, so the
  # trino Application never went Healthy. timeoutSeconds is 10 rather than 2
  # because health-check is a process launch. Set HERE, not in the rendered
  # manifest: it was a hand-edit there and regenerating dropped it.
  startupProbe:
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 90
worker:
  jvm:
    maxHeapSize: "2G"
  resources:
    requests: {cpu: 100m, memory: 1Gi}
  # 30s + 90 x 10s = a sixteen-minute boot budget, not two. The upstream
  # chart's 10 + 60 x 2s gives the JVM 130 seconds, and on a node whose CPU is
  # already committed Trino was still in "Loading configuration" three minutes
  # in: every worker was SIGTERMed (exitCode 143) and CrashLoopBackOff'd, so the
  # trino Application never went Healthy. timeoutSeconds is 10 rather than 2
  # because health-check is a process launch. Set HERE, not in the rendered
  # manifest: it was a hand-edit there and regenerating dropped it.
  startupProbe:
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 90

ingress:
  enabled: false

service:
  type: ClusterIP
  port: 8080

# Catalogs. The chart's own defaults (tpch/tpcds sample data) are kept for smoke
# queries; `iceberg` is the platform lakehouse.
#
# The Iceberg REST catalog is RustFS S3 Tables — the catalog runs INSIDE the
# object store on the same port, so the REST uri and the S3 endpoint are the
# same host. Auth is SigV4 with the platform object-store root credential
# (`root-creds`), which trino reads from env via the secret mounted below; the
# REST catalog uses the same keys (`security=SIGV4`, signing name `s3`).
#
# RustFS documents Trino against its catalog as READ verified and write
# "not claimed" (docs/architecture/s3-tables-support-matrix.md). Writes are
# therefore done by PyIceberg (Dagster) in the data golden path, and Trino is the
# query/dbt layer — dbt-trino issues CTAS/INSERT, which is the one thing to watch
# on a fresh RustFS release.
catalogs:
  tpch: |
    connector.name=tpch
    tpch.splits-per-node=4
  tpcds: |
    connector.name=tpcds
    tpcds.splits-per-node=4
  iceberg: |
    connector.name=iceberg
    iceberg.catalog.type=rest
    iceberg.rest-catalog.uri=http://rustfs.adhar-system.svc.cluster.local:9000/iceberg
    iceberg.rest-catalog.warehouse=lakehouse
    iceberg.rest-catalog.security=SIGV4
    iceberg.rest-catalog.signing-name=s3
    iceberg.rest-catalog.vended-credentials-enabled=false
    fs.native-s3.enabled=true
    s3.endpoint=http://rustfs.adhar-system.svc.cluster.local:9000
    s3.region=us-east-1
    s3.path-style-access=true
    s3.aws-access-key=${ENV:S3_ACCESS_KEY}
    s3.aws-secret-key=${ENV:S3_SECRET_KEY}

# The object-store credential for the iceberg catalog, as env on coordinator and
# workers (`${ENV:...}` expansion in catalog properties is native to Trino).
envFrom:
  - secretRef:
      name: trino-s3-credentials
