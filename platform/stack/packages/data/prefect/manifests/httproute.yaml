# Prefect UI + API on its own host through the Cilium Gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prefect
  namespace: adhar-system
  # Apply after the Service (wave 2 > 1) — see kafka-ui httproute for the
  # sync-wave deadlock this avoids.
  annotations: {argocd.argoproj.io/sync-wave: "2"}
  labels:
    app.kubernetes.io/name: prefect
    app.kubernetes.io/part-of: adhar-data
spec:
  parentRefs:
    - name: adhar-gateway
      namespace: adhar-system
  hostnames:
    - prefect.adhar.localtest.me
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: prefect-server
          port: 4200
