# CloudNativePG operator (Helm chart) values.
#
# monitoring.podMonitorEnabled — create a PodMonitor for the operator so its
# controller-runtime metrics (reconcile counts, work-queue, Go runtime) are
# scraped out of the box. Prometheus discovers it because the kube-prometheus
# values set podMonitorSelectorNilUsesHelmValues=false (select-all), so the
# missing `release: prometheus` label no longer hides it.
#
# Per-database metrics (cnpg_*) come from the Cluster instance pods, not the
# operator: create a Cluster with `spec.monitoring.enablePodMonitor: true` and
# the shipped "CloudNativePG" dashboard (manifests/grafana-dashboard.yaml)
# populates. grafanaDashboard.create stays false here because that dashboard is
# shipped as a standalone sidecar ConfigMap in this package.
monitoring:
  podMonitorEnabled: true
  grafanaDashboard:
    create: false

# Resource requests/limits so the scheduler PACES the operator instead of
# treating it as free — a request-less operator gets packed onto an already-busy
# node, then its webhook/readyz probe starves and it CrashLoopBackOffs (which
# takes every CNPG-backed DB — keycloak-db, console-db — down with it). Modest
# request, headroom limit.
resources:
  requests:
    cpu: 100m
    memory: 200Mi
  limits:
    memory: 400Mi
