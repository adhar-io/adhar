# JMX Prometheus exporter rules for Strimzi Kafka (upstream
# examples/metrics/kafka-metrics.yaml). Reference this from a Kafka CR so the
# broker pods expose Prometheus metrics on the tcp-prometheus (9404) port that
# the strimzi-podmonitors.yaml PodMonitor scrapes:
#
#   spec:
#     kafka:
#       metricsConfig:
#         type: jmxPrometheusExporter
#         valueFrom:
#           configMapKeyRef:
#             name: kafka-metrics
#             key: kafka-metrics-config.yml
#
# Must live in the SAME namespace as the Kafka CR (shipped in adhar-system,
# where local Kafka clusters are created).
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-metrics
  namespace: adhar-system
  labels:
    adhar.io/component: data
data:
  kafka-metrics-config.yml: "# See https://github.com/prometheus/jmx_exporter for more info about JMX Prometheus Exporter metrics\nlowercaseOutputName: true\nrules:\n# Special cases and very specific rules\n- pattern: kafka.server<type=(.+), name=(.+), clientId=(.+), topic=(.+), partition=(.*)><>Value\n  name: kafka_server_$1_$2\n  type: GAUGE\n  labels:\n    clientId: \"$3\"\n    topic: \"$4\"\n    partition: \"$5\"\n- pattern: kafka.server<type=(.+), name=(.+), clientId=(.+), brokerHost=(.+), brokerPort=(.+)><>Value\n  name: kafka_server_$1_$2\n  type: GAUGE\n  labels:\n    clientId: \"$3\"\n    broker: \"$4:$5\"\n- pattern: kafka.server<type=(.+), cipher=(.+), protocol=(.+), listener=(.+), networkProcessor=(.+)><>connections\n  name: kafka_server_$1_connections_tls_info\n  type: GAUGE\n  labels:\n    cipher: \"$2\"\n    protocol: \"$3\"\n    listener: \"$4\"\n    networkProcessor: \"$5\"\n- pattern: kafka.server<type=(.+), clientSoftwareName=(.+), clientSoftwareVersion=(.+), listener=(.+), networkProcessor=(.+)><>connections\n  name: kafka_server_$1_connections_software\n  type: GAUGE\n  labels:\n    clientSoftwareName: \"$2\"\n    clientSoftwareVersion: \"$3\"\n    listener: \"$4\"\n    networkProcessor: \"$5\"\n- pattern: \"kafka.server<type=(.+), listener=(.+), networkProcessor=(.+)><>(.+-total):\"\n  name: kafka_server_$1_$4\n  type: COUNTER\n  labels:\n    listener: \"$2\"\n    networkProcessor: \"$3\"\n- pattern: \"kafka.server<type=(.+), listener=(.+), networkProcessor=(.+)><>(.+):\"\n  name: kafka_server_$1_$4\n  type: GAUGE\n  labels:\n    listener: \"$2\"\n    networkProcessor: \"$3\"\n- pattern: kafka.server<type=(.+), listener=(.+), networkProcessor=(.+)><>(.+-total)\n  name: kafka_server_$1_$4\n  type: COUNTER\n  labels:\n    listener: \"$2\"\n    networkProcessor: \"$3\"\n- pattern: kafka.server<type=(.+), listener=(.+), networkProcessor=(.+)><>(.+)\n  name: kafka_server_$1_$4\n  type: GAUGE\n  labels:\n    listener: \"$2\"\n    networkProcessor: \"$3\"\n# Some percent metrics use MeanRate attribute\n# Ex) kafka.server<type=(KafkaRequestHandlerPool), name=(RequestHandlerAvgIdlePercent)><>MeanRate\n- pattern: kafka.(\\w+)<type=(.+), name=(.+)Percent\\w*><>MeanRate\n  name: kafka_$1_$2_$3_percent\n  type: GAUGE\n# Generic gauges for percents\n- pattern: kafka.(\\w+)<type=(.+), name=(.+)Percent\\w*><>Value\n  name: kafka_$1_$2_$3_percent\n  type: GAUGE\n- pattern: kafka.(\\w+)<type=(.+), name=(.+)Percent\\w*, (.+)=(.+)><>Value\n  name: kafka_$1_$2_$3_percent\n  type: GAUGE\n  labels:\n    \"$4\": \"$5\"\n# Generic per-second counters with 0-2 key/value pairs\n- pattern: kafka.(\\w+)<type=(.+), name=(.+)PerSec\\w*, (.+)=(.+), (.+)=(.+)><>Count\n  name: kafka_$1_$2_$3_total\n  type: COUNTER\n  labels:\n    \"$4\": \"$5\"\n    \"$6\": \"$7\"\n- pattern: kafka.(\\w+)<type=(.+), name=(.+)PerSec\\w*, (.+)=(.+)><>Count\n  name: kafka_$1_$2_$3_total\n  type: COUNTER\n  labels:\n    \"$4\": \"$5\"\n- pattern: kafka.(\\w+)<type=(.+), name=(.+)PerSec\\w*><>Count\n  name: kafka_$1_$2_$3_total\n  type: COUNTER\n# Generic gauges with 0-2 key/value pairs\n- pattern: kafka.(\\w+)<type=(.+), name=(.+), (.+)=(.+), (.+)=(.+)><>Value\n  name: kafka_$1_$2_$3\n  type: GAUGE\n  labels:\n    \"$4\": \"$5\"\n    \"$6\": \"$7\"\n- pattern: kafka.(\\w+)<type=(.+), name=(.+), (.+)=(.+)><>Value\n  name: kafka_$1_$2_$3\n  type: GAUGE\n  labels:\n    \"$4\": \"$5\"\n- pattern: kafka.(\\w+)<type=(.+), name=(.+)><>Value\n  name: kafka_$1_$2_$3\n  type: GAUGE\n# Emulate Prometheus 'Summary' metrics for the exported 'Histogram's.\n# Note that these are missing the '_sum' metric!\n- pattern: kafka.(\\w+)<type=(.+), name=(.+), (.+)=(.+), (.+)=(.+)><>Count\n  name: kafka_$1_$2_$3_count\n  type: COUNTER\n  labels:\n    \"$4\": \"$5\"\n    \"$6\": \"$7\"\n- pattern: kafka.(\\w+)<type=(.+), name=(.+), (.+)=(.*), (.+)=(.+)><>(\\d+)thPercentile\n  name: kafka_$1_$2_$3\n  type: GAUGE\n  labels:\n    \"$4\": \"$5\"\n    \"$6\": \"$7\"\n    quantile: \"0.$8\"\n- pattern: kafka.(\\w+)<type=(.+), name=(.+), (.+)=(.+)><>Count\n  name: kafka_$1_$2_$3_count\n\
    \  type: COUNTER\n  labels:\n    \"$4\": \"$5\"\n- pattern: kafka.(\\w+)<type=(.+), name=(.+), (.+)=(.*)><>(\\d+)thPercentile\n  name: kafka_$1_$2_$3\n  type: GAUGE\n  labels:\n    \"$4\": \"$5\"\n    quantile: \"0.$6\"\n- pattern: kafka.(\\w+)<type=(.+), name=(.+)><>Count\n  name: kafka_$1_$2_$3_count\n  type: COUNTER\n- pattern: kafka.(\\w+)<type=(.+), name=(.+)><>(\\d+)thPercentile\n  name: kafka_$1_$2_$3\n  type: GAUGE\n  labels:\n    quantile: \"0.$4\"\n# KRaft overall related metrics\n# distinguish between always increasing COUNTER (total and max) and variable GAUGE (all others) metrics\n- pattern: \"kafka.server<type=raft-metrics><>(.+-total|.+-max):\"\n  name: kafka_server_raftmetrics_$1\n  type: COUNTER\n- pattern: \"kafka.server<type=raft-metrics><>(current-state): (.+)\"\n  name: kafka_server_raftmetrics_$1\n  value: 1\n  type: UNTYPED\n  labels:\n    $1: \"$2\"\n- pattern: \"kafka.server<type=raft-metrics><>(.+):\"\n  name: kafka_server_raftmetrics_$1\n  type: GAUGE\n# KRaft \"low level\" channels related metrics\n# distinguish between always increasing COUNTER (total and max) and variable GAUGE (all others) metrics\n- pattern: \"kafka.server<type=raft-channel-metrics><>(.+-total|.+-max):\"\n  name: kafka_server_raftchannelmetrics_$1\n  type: COUNTER\n- pattern: \"kafka.server<type=raft-channel-metrics><>(.+):\"\n  name: kafka_server_raftchannelmetrics_$1\n  type: GAUGE\n# Broker metrics related to fetching metadata topic records in KRaft mode\n- pattern: \"kafka.server<type=broker-metadata-metrics><>(.+):\"\n  name: kafka_server_brokermetadatametrics_$1\n  type: GAUGE\n"
