# The platform's shared Kafka cluster, managed by the Strimzi operator this
# package installs. Strimzi 1.x runs Kafka 4.x, which is KRaft-only — there is
# no ZooKeeper anywhere in the platform.
#
# Before this existed the operator was installed with no cluster, so every
# application that needed Kafka bundled its own: PostHog shipped Kafka 2.8.1
# plus a ZooKeeper ensemble on images upstream has since deleted. Applications
# now point at this one cluster instead
# (adhar-kafka-kafka-bootstrap.adhar-system.svc.cluster.local:9092).
#
# Sized for a single-node/local-friendly default (one dual-role node,
# replication factor 1). Scale `replicas` and the replication factors together
# for a production fleet.
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: adhar-kafka-dual-role
  namespace: adhar-system
  labels:
    strimzi.io/cluster: adhar-kafka
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  replicas: 1
  roles:
    - controller
    - broker
  # Broker compute lives on the NODE POOL, not on `spec.kafka`.
  #
  # The v1 Kafka schema does not declare `spec.kafka.resources` — it has
  # jvmOptions, livenessProbe and readinessProbe, but compute moved to the pool
  # when KafkaNodePool became the unit of scaling. Putting it on `spec.kafka`
  # is not ignored, it is REJECTED, and with ServerSideApply the whole sync
  # fails to build its patch:
  #
  #   failed to create typed patch object (adhar-system/adhar-kafka;
  #   kafka.strimzi.io/v1, Kind=Kafka): .spec.kafka.resources: field not
  #   declared in schema
  #
  # Live on 2026-10-14 that failed the kafka-operator sync 219 times, so the
  # `adhar-kafka` cluster was never created and every Kafka-using service
  # failed to start — my-service died in
  # `internalKafkaListenerEndpointRegistry` with no Kafka to reach.
  #
  # A broker with no CPU request gets no CFS share, so it loses the race
  # against its own probe on exactly the loaded nodes where boot is slowest.
  # No memory limit: the heap in jvmOptions is the real bound, and a limit here
  # would turn a slow GC into an OOMKill.
  #
  # cpu 300m -> 160m: measured max 102m on the AWS cluster (2026-10-24), so
  # this is 1.5x the observed peak; still a real CFS share for boot, and there
  # is no CPU limit to throttle it.
  resources:
    requests:
      cpu: 160m
      memory: 1Gi
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 10Gi
        deleteClaim: false
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: adhar-kafka
  namespace: adhar-system
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
    argocd.argoproj.io/sync-wave: "6"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  kafka:
    # Let Strimzi derive metadataVersion from the Kafka version — pinning it
    # to a non-existent IV level makes the cluster NotReady ("invalid").
    version: 4.3.1
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: tls
        port: 9093
        type: internal
        tls: true
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
      auto.create.topics.enable: true
    # Strimzi's default probes kill a healthy broker during KRaft startup.
    #
    # The defaults are initialDelay 15s and failureThreshold 3 at a 10s period,
    # so liveness SIGKILLs the container 45 seconds in. A Kafka JVM formatting
    # its KRaft storage on a node whose CPU is already committed takes minutes:
    # the broker died at exitCode 137 seventy-eight seconds after start, twelve
    # times in a row, with its last log line "Making sure the Kraft storage is
    # formatted". The Kafka CR then reported `NotReady FatalProblem: Pod is
    # unschedulable or is not starting`, which reads like a capacity problem and
    # is really a probe deadline — the pod was scheduled and running the whole
    # time. Strimzi exposes no startupProbe, so liveness has to carry the boot
    # budget itself.
    livenessProbe:
      initialDelaySeconds: 180
      periodSeconds: 15
      timeoutSeconds: 10
      failureThreshold: 20
    readinessProbe:
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 10
      failureThreshold: 60
    jvmOptions:
      -Xms: 512m
      -Xmx: 1g
    # Prometheus metrics. Without this the shared cluster exposed NOTHING: the
    # strimzi-kafka-resources-metrics PodMonitor (strimzi-podmonitors.yaml)
    # selects its pods but the tcp-prometheus port only exists once a
    # metricsConfig is set, and the "Kafka / Brokers" dashboard showed only the
    # application clusters composed in dev/test/prod. The ConfigMap is the
    # upstream Strimzi rule set (kafka-metrics-configmap.yaml), which labels
    # per-topic and per-request series — so the shared cluster gets per-topic
    # bytes and request latency the compact composed rule set cannot provide.
    # Changing this rolls the broker once.
    metricsConfig:
      type: jmxPrometheusExporter
      valueFrom:
        configMapKeyRef:
          name: kafka-metrics
          key: kafka-metrics-config.yml
  # Topic offsets and consumer-group lag for "Kafka / Topics & Consumer Lag".
  # Scraped through the same PodMonitor (it carries strimzi.io/kind: Kafka).
  kafkaExporter:
    topicRegex: ".*"
    groupRegex: ".*"
    resources:
      requests:
        cpu: 10m
        memory: 48Mi
      limits:
        memory: 128Mi
  entityOperator:
    topicOperator: {}
    userOperator: {}
