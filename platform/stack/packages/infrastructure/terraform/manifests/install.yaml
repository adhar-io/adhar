apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    helm.sh/chart: tf-controller-0.15.1
    app.kubernetes.io/name: tf-controller
    app.kubernetes.io/instance: tf-controller
    app.kubernetes.io/version: "v0.15.1"
    app.kubernetes.io/managed-by: Helm
    control-plane: controller
  name: tf-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tf-controller
      app.kubernetes.io/instance: tf-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tf-controller
        app.kubernetes.io/instance: tf-controller
    spec:
      containers:
      - args:
        - --watch-all-namespaces
        - --log-level=info
        - --log-encoding=json
        - --enable-leader-election
        - --concurrent=24
        - --ca-cert-validity-duration=168h0m
        - --cert-rotation-check-frequency=30m0s
        - --cert-validity-duration=6h0m
        - --runner-creation-timeout=5m0s
        - --runner-grpc-max-message-size=4
        - --events-addr=http://notification-controller.flux-system.svc.cluster.local./
        - --kube-api-qps=50
        - --kube-api-burst=100
        - --allow-break-the-glass=false
        - --cluster-domain=cluster.local
        command:
        - /sbin/tini
        - --
        - tf-controller
        env:
        - name: RUNTIME_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: RUNNER_POD_IMAGE
          value: "ghcr.io/weaveworks/tf-runner:v0.15.1"
        image: "ghcr.io/weaveworks/tf-controller:v0.15.1"
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /healthz
            port: healthz
        name: tf-controller
        ports:
        - containerPort: 8080
          name: http-prom
        - containerPort: 9440
          name: healthz
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /readyz
            port: healthz
        resources:
          limits:
            cpu: 1000m
            memory: 1Gi
          requests:
            cpu: 200m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65532
          seccompProfile:
            type: RuntimeDefault
      securityContext:
        fsGroup: 1337
      serviceAccountName: tf-controller
      terminationGracePeriodSeconds: 10
