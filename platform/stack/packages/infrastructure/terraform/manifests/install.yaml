      serviceAccountName: "flux-source-flux-check"
      automountServiceAccountToken: true
      containers:
      - name: flux-cli
        image: ghcr.io/fluxcd/flux-cli:v2.9.1
        command: ["/usr/local/bin/flux", "check",  "--pre", "--namespace", adhar-system]
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
