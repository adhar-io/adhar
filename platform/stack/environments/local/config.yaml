environment: local
type: nonprod
# Local package enablement — mirrors adhar-appset-local.yaml exactly (the
# curated core a single Kind node can run; ADR-0004). Regenerate from the
# appset when it changes; the parity tests enforce the match.
packages:

  - name: "external-secrets"
    enabled: "true"
    namespace: "adhar-system"
    category: "security"
    manifestPath: "security/external-secrets/manifests"
  - name: "knative"
    enabled: "false"
    namespace: "adhar-system"
    category: "application"
    manifestPath: "application/knative/manifests"
  - name: "hubble"
    enabled: "true"
    namespace: "adhar-system"
    category: "observability"
    manifestPath: "observability/hubble/manifests"
  - name: "falco"
    enabled: "false"
    namespace: "adhar-system"
    category: "security"
    manifestPath: "security/falco/manifests"
  - name: "trivy"
    enabled: "false"
    namespace: "adhar-system"
    category: "security"
    manifestPath: "security/trivy/manifests"
  # SECRETS BACKEND -- EXACTLY ONE OF vault / openbao MAY BE ENABLED.
  # Both claim ClusterSecretStore/vault and Service/vault in the shared
  # adhar-system namespace (ADR-0011, CONFLICTS.md). Both are disabled locally:
  # a single Kind node does not need a secrets backend.
  - name: "vault"
    enabled: "false"
    namespace: "adhar-system"
    category: "security"
    manifestPath: "security/vault/manifests"
  # OpenBao -- the Linux Foundation fork of Vault (MPL-2.0). Production uses
  # this one; disabled locally, like vault, and for the same reason.
  - name: "openbao"
    enabled: "false"
    namespace: "adhar-system"
    category: "security"
    manifestPath: "security/openbao/manifests"
  - name: "cosign"
    enabled: "true"
    namespace: "adhar-system"
    category: "security"
    manifestPath: "security/cosign/manifests"
  - name: "adhar-ai"
    enabled: "false"
    namespace: "adhar-system"
    category: "ai"
    manifestPath: "ai/adhar-ai/manifests"
  - name: "agentgateway"
    enabled: "false"
    namespace: "adhar-system"
    category: "ai"
    manifestPath: "ai/agentgateway/manifests"
  # Self-hosted vLLM inference — three elements from one package directory
  # (shared surface + one Deployment per profile). Enable "vllm" plus EXACTLY
  # ONE of vllm-cpu / vllm-gpu; all three are off by default because vLLM is
  # heavy and nothing in the platform depends on it. Mirrors adhar-appset-local.yaml.
  - name: "vllm"
    enabled: "false"
    namespace: "adhar-system"
    category: "ai"
    manifestPath: "ai/vllm/manifests"
  - name: "vllm-cpu"
    enabled: "false"
    namespace: "adhar-system"
    category: "ai"
    manifestPath: "ai/vllm/manifests/cpu"
  - name: "vllm-gpu"
    enabled: "false"
    namespace: "adhar-system"
    category: "ai"
    manifestPath: "ai/vllm/manifests/gpu"
  - name: "scorecards"
    enabled: "false"
    namespace: "adhar-system"
    category: "application"
    manifestPath: "application/scorecards/manifests"
  - name: "credential-rotation"
    enabled: "false"
    namespace: "adhar-system"
    category: "security"
    manifestPath: "security/credential-rotation/manifests"
  - name: "kubescape"
    enabled: "false"
    namespace: "adhar-system"
    category: "security"
    manifestPath: "security/kubescape/manifests"
  - name: "tetragon"
    enabled: "false"
    namespace: "adhar-system"
    category: "security"
    manifestPath: "security/tetragon/manifests"
  - name: "beyla"
    enabled: "false"
    namespace: "adhar-system"
    category: "observability"
    manifestPath: "observability/beyla/manifests"
  - name: "faro"
    enabled: "false"
    namespace: "adhar-system"
    category: "observability"
    manifestPath: "observability/faro/manifests"
  - name: "pixie"
