    namespace: "adhar-system"
    category: "security"
    manifestPath: "security/policy-reporter/manifests"
  # ADR-0019 supply-chain admission pack, shipped in two stages. The
  # AUDIT pack is always on: its findings land in ClusterPolicyReports
  # and predict exactly what Enforce would block. The ENFORCE pack is
  # the documented knob — flip it to "true" here AND in the matching
  # adhar-appset-*.yaml (a parity test enforces the match) to make unsigned /
  # :latest / untrusted-registry workloads fail admission. Leave the
  # audit pack enabled; the two coexist (policy names differ by an
  # `-enforce` suffix). See the package README for the staging recipe
  # and hack/verify-supply-chain.sh for the drill that proves it works.
  - name: "supply-chain-policies"
    enabled: "true"
    namespace: "adhar-system"
    category: "security"
    manifestPath: "security/supply-chain-policies/manifests/audit"
  - name: "supply-chain-policies-enforce"
    enabled: "false"
    namespace: "adhar-system"
    category: "security"
    manifestPath: "security/supply-chain-policies/manifests/enforce"
