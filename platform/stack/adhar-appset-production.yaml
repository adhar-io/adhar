apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: helm-charts-production
  namespace: adhar-system
spec:
  # Production enablement: every package is deployed except the documented
  # mutual exclusions (see platform/stack/packages/CONFLICTS.md — fixed-name
  # object collisions in the shared namespace that renaming cannot fix, plus
  # alternatives to the default path). Each disabled entry carries its reason
  # inline. The bootstrap controller selects this ApplicationSet for cloud /
  # on-prem providers; Kind clusters get adhar-appset-local.yaml (curated core
  # — a single node cannot run the full set).
  # Enable packages in small waves when turning more on (ADR-0014).
  generators:
    - list:
        elements:
          - name: "external-secrets"
            enabled: "true"
            namespace: "adhar-system"
            category: "security"
            manifestPath: "security/external-secrets/manifests"
          # knative disabled in production: CONFLICTS.md: config-logging/config-observability collide with tekton
          - name: "knative"
            enabled: "false"
            namespace: "adhar-system"
            category: "application"
            manifestPath: "application/knative/manifests"
          - name: "hubble"
            enabled: "true"
            namespace: "adhar-system"
            category: "observability"
            manifestPath: "observability/hubble/manifests"
          - name: "falco"
            enabled: "true"
            namespace: "adhar-system"
            category: "security"
            manifestPath: "security/falco/manifests"
          - name: "trivy"
            enabled: "false"
            namespace: "adhar-system"
            category: "security"
            manifestPath: "security/trivy/manifests"
          # SECRETS BACKEND -- EXACTLY ONE OF vault / openbao MAY BE ENABLED.
          # Both packages claim ClusterSecretStore/vault and Service/vault in the
          # shared adhar-system namespace, so two enabled Applications would
          # fight over the same objects forever (ADR-0011, CONFLICTS.md).
          #
          # vault is DISABLED: production now runs OpenBao instead. OpenBao is
          # the Linux Foundation / OpenSSF fork of Vault under MPL-2.0, whereas
          # HashiCorp Vault is BUSL-1.1 -- a source-available licence that does
          # not fit a 100% open-source platform. OpenBao is wire-compatible, so
          # nothing downstream changed: the ESO ClusterSecretStore keeps the
          # name `vault`, the provider stays `vault:`, the `vault` Service name
          # is republished by the openbao package, and the vault_* Prometheus
          # metrics (and the dashboard-vault Grafana board) are unchanged.
          # Re-enable vault ONLY after disabling openbao below.
          - name: "vault"
            enabled: "false"
            namespace: "adhar-system"
            category: "security"
            manifestPath: "security/vault/manifests"
          # openbao is the enabled production secrets backend (see above).
          # Mutually exclusive with vault; enabling both breaks both.
          - name: "openbao"
            enabled: "true"
            namespace: "adhar-system"
            category: "security"
            manifestPath: "security/openbao/manifests"
          # cosign installs into the shared adhar-system namespace (ADR-0011).
          # policy-controller hardcodes Service/webhook and Secret/webhook-certs
          # in its binary, so neither can be renamed: tekton was moved off the
          # Secret (tekton-webhook-certs), but kpack (buildpack) hardcodes it
          # too -- cosign and buildpack are mutually exclusive in one namespace.
          # Service/webhook re-injects WEBHOOK_PORT via service links, so
          # env-parsing components must keep enableServiceLinks:false.
          # See platform/stack/packages/CONFLICTS.md before enabling both.
          # Enabled in production for keyless signature verification (ADR-0019).
          # Retired 2026-09-19: the sigstore policy-controller writes
          # Secret/webhook-certs under a name compiled into its binary, and so does
          # kpack — they cannot share adhar-system (ADR-0011, one namespace). Image
          # signatures are enforced by the supply-chain-kyverno ClusterPolicy
          # verify-supply-chain-images against the same cosign key, so enforcement is
          # unchanged; what is lost is the ClusterImagePolicy API.
          - name: "cosign"
            enabled: "false"
            namespace: "adhar-system"
            category: "security"
            manifestPath: "security/cosign/manifests"
          # Agentic AI control plane (ADR-0024). Opt-in: ships disabled because it
          # needs the ghcr.io/adhar-io/adhar-ai-* images + an LLM key (Vault). The
          # platform runs unaffected until enabled. Write path is Gitea-PR-only; no
          # direct cluster/cloud mutation. Runs on the control plane (adhar.io/plane).
          - name: "adhar-ai"
            enabled: "true"
            namespace: "adhar-system"
            category: "ai"
            plane: "control"
            manifestPath: "ai/adhar-ai/manifests"
          # AI data plane (ADR-0025) — agentgateway: ONE governed endpoint for LLM
          # completions + federated MCP tools, with Keycloak JWT, group-based
          # authorization, prompt guardrails, token budgets and OTel traces.
          # Replaces adhar-ai's bespoke adhar-ai-llm-gateway. Enabled exactly
          # where adhar-ai is enabled and no wider — AI is opt-in.
          - name: "agentgateway"
            enabled: "true"
            namespace: "adhar-system"
            category: "ai"
            plane: "control"
            manifestPath: "ai/agentgateway/manifests"
          # Self-hosted, OpenAI-compatible LLM inference (vLLM). THREE elements
          # from one package directory: "vllm" is the shared surface (model-cache
          # PVC, Service, HTTPRoute, ServiceMonitor, Grafana dashboard, optional
          # HF-token ExternalSecret); "vllm-cpu" and "vllm-gpu" each carry one
          # Deployment. Enable "vllm" plus EXACTLY ONE profile -- both
          # Deployments are named `vllm` and share one Service, so enabling both
          # makes two Applications fight over the same object.
          #
          # ALL THREE OFF BY DEFAULT: vLLM is heavy and entirely optional. Turning
          # it on is a capacity decision, not a default -- the GPU profile needs a
          # GPU node pool with the NVIDIA device plugin advertising nvidia.com/gpu
          # (Adhar's default droplets are CPU-only), ~15 GB of model weights on the
          # PVC, and 4 CPU / 16Gi of host RAM per replica. Nothing in the platform
          # depends on it; agentgateway and adhar-ai fall back to a hosted
          # model until it is enabled. On a cloud cluster WITHOUT GPU nodes,
          # "vllm-cpu" is still a valid (slow) choice for small models.
          - name: "vllm"
            enabled: "false"
            namespace: "adhar-system"
            category: "ai"
            plane: "control"
            manifestPath: "ai/vllm/manifests"
          # llm-d disabled by default: distributed LLM inference. It runs vLLM model
          # servers, which are the heaviest workload in the catalogue, so it is opt-in
          # per cluster rather than something every platform pays for.
          - name: "llm-d"
            enabled: "false"
            namespace: "adhar-system"
            category: "ai"
            plane: "control"
            manifestPath: "ai/llm-d/manifests"
          - name: "vllm-cpu"
            enabled: "false"
            namespace: "adhar-system"
            category: "ai"
            plane: "control"
            manifestPath: "ai/vllm/manifests/cpu"
          - name: "vllm-gpu"
            enabled: "false"
            namespace: "adhar-system"
            category: "ai"
            plane: "control"
            manifestPath: "ai/vllm/manifests/gpu"
          # Per-service production-readiness score cards (roadmap Phase 3), surfaced
          # in the Console. Read-only scorer CronJob → adhar-scorecards ConfigMap.
          - name: "adhar-scorecards"
            enabled: "true"
            namespace: "adhar-system"
            category: "application"
            manifestPath: "application/adhar-scorecards/manifests"
          # Rotates gitea_admin/argocd admin bootstrap credentials into
          # break-glass values (Vault-backed when available). Disabled locally
          # so documented dev credentials keep working; enable once SSO login
          # is verified (roadmap P1.4).
          - name: "adhar-credential-rotation"
            enabled: "true"
            namespace: "adhar-system"
            category: "security"
            manifestPath: "security/adhar-credential-rotation/manifests"
          # kubescape disabled by default: opt-in. It registers an AGGREGATED APIServer
          # (spdx.softwarecomposition.kubescape.io), and whenever its pod cannot run the
          # API becomes unavailable and EVERY kubectl call in the cluster then prints
          # "couldn't get resource list for spdx.softwarecomposition.kubescape.io/v1beta1".
          # That noise goes to stderr and contaminates anything capturing command output —
          # it is what made `adhar upgrade` misread a Gitea 409 as a failure (2026-09-26).
          # A scanner should not be able to break unrelated tooling by being unschedulable.
          - name: "kubescape"
            enabled: "false"
            namespace: "adhar-system"
            category: "security"
            manifestPath: "security/kubescape/manifests"
          - name: "tetragon"
            enabled: "true"
            namespace: "adhar-system"
            category: "security"
            manifestPath: "security/tetragon/manifests"
          # beyla disabled by default: eBPF auto-instrumentation, opt-in per cluster.
          - name: "beyla"
            enabled: "false"
            namespace: "adhar-system"
            category: "observability"
            manifestPath: "observability/beyla/manifests"
          - name: "faro"
            enabled: "true"
            namespace: "adhar-system"
            category: "observability"
            manifestPath: "observability/faro/manifests"
          # pixie disabled: Vizier must register against Pixie Cloud with a deploy key
          # (px.dev account); without one it exits fatally ("Failed to register vizier
          # deployment"). Enable after setting the deploy key in the package values.
          - name: "pixie"
            enabled: "false"
            namespace: "adhar-system"
            category: "observability"
            manifestPath: "observability/pixie/manifests"
          # victoria-metrics disabled in production: alternative metrics path (ADR-0010); enable instead of kube-prometheus, not alongside
          - name: "victoria-metrics"
            enabled: "false"
            namespace: "adhar-system"
            category: "observability"
            manifestPath: "observability/victoria-metrics/manifests"
          - name: "trino"
            enabled: "true"
            namespace: "adhar-system"
            category: "data"
            manifestPath: "data/trino/manifests"
          - name: "metabase"
            enabled: "true"
            namespace: "adhar-system"
            category: "data"
            manifestPath: "data/metabase/manifests"
          - name: "mlflow"
            enabled: "true"
            namespace: "adhar-system"
            category: "data"
            manifestPath: "data/mlflow/manifests"
          - name: "libredb-studio"
            enabled: "true"
            namespace: "adhar-system"
            category: "data"
            manifestPath: "data/libredb-studio/manifests"
          - name: "opensearch"
            enabled: "true"
            namespace: "adhar-system"
            category: "data"
            manifestPath: "data/opensearch/manifests"
          - name: "rabbitmq"
            enabled: "true"
            namespace: "adhar-system"
            category: "data"
            manifestPath: "data/rabbitmq/manifests"
          - name: "mongodb"
            enabled: "true"
            namespace: "adhar-system"
            category: "data"
            manifestPath: "data/mongodb/manifests"
          - name: "mysql-operator"
            enabled: "true"
            namespace: "adhar-system"
            category: "data"
            manifestPath: "data/mysql-operator/manifests"
          - name: "fluent-bit"
            enabled: "false"
            namespace: "adhar-system"
            category: "observability"
            manifestPath: "observability/fluent-bit/manifests"
          - name: "airbyte"
            enabled: "true"
            namespace: "adhar-system"
            category: "data"
            manifestPath: "data/airbyte/manifests"
          - name: "dagster"
            enabled: "true"
            namespace: "adhar-system"
            category: "data"
            manifestPath: "data/dagster/manifests"
          - name: "open-metadata"
            enabled: "true"
            namespace: "adhar-system"
            category: "data"
            manifestPath: "data/open-metadata/manifests"
          - name: "argo-events"
            enabled: "true"
            namespace: "adhar-system"
            category: "application"
            manifestPath: "application/argo-events/manifests"
          - name: "argo-rollout"
            enabled: "true"
            namespace: "adhar-system"
            category: "application"
            manifestPath: "application/argo-rollout/manifests"
          # kpack: the ONE package outside adhar-system (ADR-0011 exception).
          # Its webhook hardcodes Secret/webhook-certs, exactly like cosign's
          # policy-controller, and both are enabled here; two knative webhooks
          # sharing that Secret leave one without a valid serving cert. The
          # generator drops upstream's Namespace object (pod-security
          # enforce=restricted) and renders everything into adhar-system, which
          # ArgoCD creates (CreateNamespace=true). See CONFLICTS.md.
          - name: "buildpack"
            enabled: "true"
            namespace: "adhar-system"
            category: "application"
            manifestPath: "application/buildpack/manifests"
          # chaos-mesh disabled: replaced by `litmus` as the platform's chaos
          # engine. Chaos Mesh's dashboard is a CR editor; ChaosCenter is a
          # chaos workflow engine with a fault catalogue, probes and recorded
          # results, which is what resilience testing in CI needs. Running both
          # would put two fault injectors on the same nodes.
          - name: "chaos-mesh"
            enabled: "false"
            namespace: "adhar-system"
            category: "application"
            manifestPath: "application/chaos-mesh/manifests"
          # litmus: the platform's chaos-engineering engine (replaces chaos-mesh).
          # Three charts in one package — ChaosCenter, the chaos operator + CRDs,
          # and the 29-fault Kubernetes catalogue — plus its own MongoDB replica
          # set from the platform operator.
          - name: "litmus"
            enabled: "true"
            namespace: "adhar-system"
            category: "application"
            manifestPath: "application/litmus/manifests"
          - name: "external-dns"
            enabled: "true"
            namespace: "adhar-system"
            category: "application"
            manifestPath: "application/external-dns/manifests"
          # open-function disabled in production: CONFLICTS.md: vendors Knative ConfigMaps that collide with tekton
          - name: "open-function"
            enabled: "false"
            # adhar-system like every other package (ADR-0011). Kept DISABLED:
            # it vendors Knative/Tekton ConfigMaps (config-defaults,
            # config-tracing) whose names are fixed upstream and collide with the
            # core tekton package once both live in adhar-system. Enabling it
            # requires disabling tekton first (see CONFLICTS.md).
            namespace: "adhar-system"
            category: "application"
            manifestPath: "application/open-function/manifests"
          - name: "coder"
            enabled: "true"
            namespace: "adhar-system"
            category: "application"
            manifestPath: "application/coder/manifests"
          # n8n disabled by default: a workflow-automation tool, not part of the paved road.
          - name: "n8n"
            enabled: "false"
            namespace: "adhar-system"
            category: "application"
            manifestPath: "application/n8n/manifests"
          - name: "penpot"
            enabled: "true"
            namespace: "adhar-system"
            category: "application"
            manifestPath: "application/penpot/manifests"
          - name: "posthog"
            enabled: "true"
            namespace: "adhar-system"
            category: "application"
            manifestPath: "application/posthog/manifests"
          - name: "plane"
            enabled: "true"
            namespace: "adhar-system"
            category: "application"
            manifestPath: "application/plane/manifests"
          - name: "baserow"
            enabled: "false"
            namespace: "adhar-system"
            category: "application"
            manifestPath: "application/baserow/manifests"
          - name: "vcluster"
            enabled: "true"
            namespace: "adhar-system"
            category: "core"
            manifestPath: "core/vcluster/manifests"
          - name: "sveltos"
            enabled: "false"
            namespace: "adhar-system"
            category: "core"
            manifestPath: "core/sveltos/manifests"
          - name: "karmada"
            enabled: "true"
            namespace: "adhar-system"
            category: "core"
            manifestPath: "core/karmada/manifests"
          - name: "kamaji"
            enabled: "false"
            namespace: "adhar-system"
            category: "core"
            manifestPath: "core/Kamaji/manifests"
          - name: "cert-manager"
            enabled: "true"
            namespace: "adhar-system"
            category: "security"
            manifestPath: "security/cert-manager/manifests"
          - name: "cnpg"
            enabled: "true"
            namespace: "adhar-system"
            category: "data"
            manifestPath: "data/cnpg/manifests"
          # Hierarchical tenant quotas: a per-team ceiling above the
          # per-namespace ResourceQuota. Certificates + a webhook config only —
          # the validator runs inside the controller manager already present.
          - name: "adhar-tenant-quotas"
            enabled: "true"
            namespace: "adhar-system"
            category: "security"
            manifestPath: "security/adhar-tenant-quotas/manifests"
          - name: "kyverno"
            enabled: "true"
            namespace: "adhar-system"
            category: "security"
            manifestPath: "security/kyverno/manifests"
          - name: "adhar-kyverno-policies"
            enabled: "true"
            namespace: "adhar-system"
            category: "security"
            manifestPath: "security/adhar-kyverno-policies/manifests"
          - name: "adhar-policy-reporter"
            enabled: "true"
            namespace: "adhar-system"
            category: "security"
            manifestPath: "security/adhar-policy-reporter/manifests"
          # ADR-0019 supply-chain admission pack, shipped in two stages. The
          # AUDIT pack is always on: its findings land in ClusterPolicyReports
          # and predict exactly what Enforce would block. The ENFORCE pack is
          # the documented knob — flip it to "true" (here AND in
          # platform/stack/environments/<env>/config.yaml) to make unsigned /
          # :latest / untrusted-registry workloads fail admission. Leave the
          # audit pack enabled; the two coexist (policy names differ by an
          # `-enforce` suffix). See the package README for the staging recipe
          # and hack/verify-supply-chain.sh for the drill that proves it works.
          - name: "adhar-supply-chain-policies"
            enabled: "true"
            namespace: "adhar-system"
            category: "security"
            manifestPath: "security/adhar-supply-chain-policies/manifests/audit"
          # Enforce pack ENABLED (2026-09-13). hack/verify-supply-chain.sh passed
          # twice on a live DigitalOcean cluster before this was flipped: unsigned
          # image DENIED, signed image ADMITTED, against a key-based cosign
          # signature made exactly the way the Tekton cosign-sign Task makes one.
          # Platform namespaces are excluded twice over (by name and by the
          # adhar.io/plane: control label), so this gates workload and preview
          # namespaces only.
          - name: "adhar-supply-chain-policies-enforce"
            enabled: "true"
            namespace: "adhar-system"
            category: "security"
            manifestPath: "security/adhar-supply-chain-policies/manifests/enforce"
          # Opt-in compliance profiles (CIS / SOC2-oriented), Audit mode.
          - name: "adhar-policy-packs"
            enabled: "false"
            namespace: "adhar-system"
            category: "security"
            manifestPath: "security/adhar-policy-packs/manifests"
          - name: "jupyterhub"
            enabled: "true"
            namespace: "adhar-system"
            category: "data"
            manifestPath: "data/jupyterhub/manifests"
          - name: "headlamp"
            enabled: "true"
            namespace: "adhar-system"
            category: "observability"
            manifestPath: "observability/headlamp/manifests"
          - name: "keycloak"
            enabled: "true"
            namespace: "adhar-system"
            category: "security"
            manifestPath: "security/keycloak/manifests"
          - name: "tekton"
            enabled: "true"
            namespace: "adhar-system"
            category: "application"
            manifestPath: "application/tekton/manifests"
          # argo-workflows disabled by default: a workflow engine, opt-in per cluster.
          - name: "argo-workflows"
            enabled: "false"
            namespace: "adhar-system"
            category: "application"
            manifestPath: "application/argo-workflows/manifests/dev"
          - name: "adhar-console"
            enabled: "true"
            namespace: "adhar-system"
            category: "core"
            manifestPath: "core/adhar-console/manifests"
          - name: "harbor"
            enabled: "true"
            namespace: "adhar-system"
            category: "application"
            manifestPath: "application/harbor/manifests"
          # Nexus Repository OSS — artefact repository for language packages
          # (Maven/npm/PyPI). Harbor stays OCI-images-only; Nexus owns the rest.
          - name: "nexus"
            enabled: "true"
            namespace: "adhar-system"
            category: "application"
            manifestPath: "application/nexus/manifests"
          - name: "kafka-ui"
            enabled: "true"
            namespace: "adhar-system"
            category: "data"
            manifestPath: "data/kafka-ui/manifests"
          # Kubeflow Pipelines (standalone) — ML pipeline orchestration. The
          # upstream kustomize env hardcodes `kubeflow`; generate-manifests.sh
          # rewrites it to adhar-system (ADR-0011). Heavy (MySQL/Argo/API/UI);
          # disabled in the local core, enable per environment.
          - name: "kubeflow"
            enabled: "true"
            namespace: "adhar-system"
            category: "data"
            manifestPath: "data/kubeflow/manifests"
          # Prefect — Python workflow orchestration (data platform). Opt-in.
          - name: "prefect"
            enabled: "true"
            namespace: "adhar-system"
            category: "data"
            manifestPath: "data/prefect/manifests"
          # Strapi headless CMS, CNPG-backed, behind Keycloak SSO. ON.
          # It does NOT use a "strapi" image: upstream retired `strapi/strapi`
          # and the only maintained replacement (`naskio/strapi`) ships a broken
          # CLI (MODULE_NOT_FOUND on `strapi version`, every tag through 5.30.1).
          # The package therefore runs the official Node image and scaffolds the
          # project onto its volume with upstream `create-strapi`, then builds and
          # starts it — verified end to end on this cluster's amd64 nodes before
          # being switched on (see the package's install.yaml header).
          # First boot takes four to six minutes; later starts are seconds.
          - name: "strapi"
            enabled: "true"
            namespace: "adhar-system"
            category: "application"
            manifestPath: "application/strapi/manifests"
          # tooljet disabled: low-code app builder, not part of the paved road;
          # its container crash-loops on startup and nothing else depends on it.
          - name: "tooljet"
            enabled: "false"
            namespace: "adhar-system"
            category: "application"
            manifestPath: "application/tooljet/manifests"
          # End-to-end software supply chain (kpack build+sign → trivy/cosign gate
          # → kyverno verify → service-from-template). Depends on
          # buildpack/harbor/cosign/kyverno/tekton.
          - name: "adhar-supply-chain"
            enabled: "true"
            namespace: "adhar-system"
            category: "application"
            manifestPath: "application/adhar-supply-chain/manifests"
          # Kyverno ClusterPolicies of supply-chain, split out so supply-chain itself
          # can run without the kyverno package (off in the local curated core).
          - name: "adhar-supply-chain-kyverno"
            enabled: "true"
            namespace: "adhar-system"
            category: "application"
            manifestPath: "application/adhar-supply-chain/kyverno"
          # Ephemeral per-PR preview environments (ADR-0017): an ApplicationSet with the
          # Gitea pull-request generator, plus the Kyverno ResourceQuota/LimitRange
          # guardrails for preview namespaces. Costs nothing until a repo ships
          # preview/kustomization.yaml and a PR is labelled `preview`, so it is on
          # everywhere.
          - name: "adhar-preview-environments"
            enabled: "true"
            namespace: "adhar-system"
            category: "application"
            manifestPath: "application/adhar-preview-environments/manifests"
          # Kyverno ClusterPolicies of preview-environments, split out so preview-environments itself
          # can run without the kyverno package (off in the local curated core).
          - name: "adhar-preview-environments-kyverno"
            enabled: "true"
            namespace: "adhar-system"
            category: "application"
            manifestPath: "application/adhar-preview-environments/kyverno"
          - name: "adhar-libraries"
            enabled: "true"
            namespace: "adhar-system"
            category: "application"
            manifestPath: "application/adhar-libraries/manifests"
          - name: "kargo"
            enabled: "true"
            namespace: "adhar-system"
            category: "application"
            manifestPath: "application/kargo/manifests"
          - name: "minio"
            enabled: "false"
            namespace: "adhar-system"
            category: "data"
            manifestPath: "data/minio/manifests"
          - name: "rustfs"
            enabled: "true"
            namespace: "adhar-system"
            category: "data"
            manifestPath: "data/rustfs/manifests"
          - name: "velero"
            enabled: "true"
            namespace: "adhar-system"
            category: "core"
            manifestPath: "core/velero/manifests"
          # spark-operator disabled by default: batch compute, opt-in per cluster.
          - name: "spark-operator"
            enabled: "false"
            namespace: "adhar-system"
            category: "data"
            manifestPath: "data/spark-operator/manifests"
          - name: "metrics-server"
            enabled: "true"
            namespace: "adhar-system"
            category: "observability"
            manifestPath: "observability/metrics-server/manifests"
          - name: "kube-prometheus"
            enabled: "true"
            namespace: "adhar-system"
            category: "observability"
            manifestPath: "observability/kube-prometheus/manifests"
          - name: "loki"
            enabled: "true"
            namespace: "adhar-system"
            category: "observability"
            manifestPath: "observability/loki-stack/manifests"
          # Recording rules + budget alerts over OpenCost's metrics, and the
          # series `adhar cost` reads. Rules only — no workload.
          - name: "adhar-cost-governance"
            enabled: "true"
            namespace: "adhar-system"
            category: "observability"
            manifestPath: "observability/adhar-cost-governance/manifests"
          - name: "opencost"
            enabled: "true"
            namespace: "adhar-system"
            category: "observability"
            manifestPath: "observability/opencost/manifests"
          - name: "alloy"
            enabled: "true"
            namespace: "adhar-system"
            category: "observability"
            manifestPath: "observability/alloy/manifests"
          - name: "oncall"
            enabled: "true"
            namespace: "adhar-system"
            category: "observability"
            manifestPath: "observability/oncall/manifests"
          - name: "tempo"
            enabled: "true"
            namespace: "adhar-system"
            category: "observability"
            manifestPath: "observability/tempo/manifests"
          # pyroscope disabled by default: continuous profiling, opt-in per cluster.
          - name: "pyroscope"
            enabled: "false"
            namespace: "adhar-system"
            category: "observability"
            manifestPath: "observability/pyroscope/manifests"
          # mimir's bundled MinIO now uses a dedicated SA (mimir-minio-sa), so
          # the collision with the minio package is resolved and the metrics
          # hub backend is enabled for production.
          - name: "mimir"
            enabled: "true"
            namespace: "adhar-system"
            category: "observability"
            manifestPath: "observability/mimir/manifests"
          - name: "k6"
            enabled: "true"
            namespace: "adhar-system"
            category: "application"
            manifestPath: "application/k6/manifests"
          - name: "crossplane"
            enabled: "true"
            namespace: "adhar-system"
            category: "infrastructure"
            manifestPath: "infrastructure/crossplane/manifests"
          - name: "terraform"
            enabled: "true"
            namespace: "adhar-system"
            category: "infrastructure"
            manifestPath: "infrastructure/terraform/manifests"
          - name: "dapr"
            enabled: "true"
            namespace: "adhar-system"
            category: "application"
            manifestPath: "application/dapr/manifests"
          # redis disabled by default: valkey is the platform's primary key-value store and
          # is what every package wires to. redis remains as the drop-in alternative for a
          # workload that needs it; the only package declaring it is libredb-studio, and
          # that dependency is optional.
          - name: "redis"
            enabled: "false"
            namespace: "adhar-system"
            category: "data"
            manifestPath: "data/redis/manifests"
          - name: "valkey"
            enabled: "true"
            namespace: "adhar-system"
            category: "data"
            manifestPath: "data/valkey/manifests"
          - name: "kafka-operator"
            enabled: "true"
            namespace: "adhar-system"
            category: "data"
            manifestPath: "data/kafka-operator/manifests"
          - name: "keda"
            enabled: "true"
            namespace: "adhar-system"
            category: "application"
            manifestPath: "application/keda/manifests"
      selector:
        matchLabels:
          enabled: "true"
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  template:
    metadata:
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      labels:
        adhar.io/package-name: "{{ .name }}"
        adhar.io/category: "{{ .category }}"
        environment: "production"
      name: "{{ .name }}"
    spec:
      destination:
        # Every platform package targets adhar-system (ADR-0011). The field is
        # kept per-element as an escape hatch, but no platform package uses a
        # different value; the only sanctioned non-adhar-system namespaces are
        # Kargo Project namespaces (adhar-environments — Kargo requires one
        # namespace per Project) and data-plane vclusters (dp-*), neither of
        # which is wired through this ApplicationSet.
        namespace: "{{ .namespace }}"
        server: https://kubernetes.default.svc
      # Fields the API server and admission webhooks DEFAULT onto these resources.
      # Without these entries an app syncs successfully and is immediately OutOfSync
      # again — forever — because applying cannot remove a defaulted field. Paths were
      # measured by diffing live objects against Git (2026-09-19). Keep in sync with
      # adhar-appset-local.yaml.
      ignoreDifferences:
      - group: gateway.networking.k8s.io
        kind: HTTPRoute
        jsonPointers:
        - /status
        jqPathExpressions:
        - .spec.parentRefs[]?.group
        - .spec.parentRefs[]?.kind
        - .spec.rules[]?.backendRefs[]?.group
        - .spec.rules[]?.backendRefs[]?.kind
        - .spec.rules[]?.backendRefs[]?.weight
      - group: external-secrets.io
        kind: ExternalSecret
        jsonPointers:
        - /status
      - group: apiextensions.k8s.io
        kind: CustomResourceDefinition
        jsonPointers:
        - /status
        jqPathExpressions:
        - .spec.conversion.webhook.clientConfig.caBundle
        - .spec.conversion.webhook.clientConfig.service.path
        - .spec.conversion.webhook.clientConfig.service.port
        - .spec.names.listKind
      - group: kyverno.io
        kind: ClusterPolicy
        jsonPointers:
        - /status
        - /spec/admission
        - /spec/emitWarning
        - /spec/validationFailureAction
        jqPathExpressions:
        - .spec.rules[]?.skipBackgroundRequests
      - group: kyverno.io
        kind: Policy
        jsonPointers:
        - /status
        - /spec/admission
        - /spec/emitWarning
        - /spec/validationFailureAction
        jqPathExpressions:
        - .spec.rules[]?.skipBackgroundRequests
      - group: tekton.dev
        kind: Task
        jqPathExpressions:
        - .spec.results[]?.type
        - .spec.steps[]?.computeResources
        - .spec.params[]?.type
      - group: tekton.dev
        kind: ClusterTask
        jqPathExpressions:
        - .spec.results[]?.type
        - .spec.steps[]?.computeResources
        - .spec.params[]?.type
      - group: tekton.dev
        kind: Pipeline
        jqPathExpressions:
        - .spec.params[]?.type
        - .spec.results[]?.type
        - .spec.tasks[]?.taskRef.kind
      - group: triggers.tekton.dev
        kind: EventListener
        jsonPointers:
        - /status
      project: default
      sources:
        - path: "{{ .manifestPath }}"
          repoURL: http://gitea-http.adhar-system.svc.cluster.local:3000/adhar/packages
          targetRevision: main
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          backoff:
            duration: 5s
            factor: 2
            # 20s, not the 3m it was. Cross-package CRD dependencies make first
            # syncs fail routinely, and with a 3-minute cap an app that was ready to
            # succeed waited up to three minutes to find out: a live bring-up had six
            # apps at retry attempts #6-#9, i.e. ~8 minutes of pure backoff each,
            # long after the dependency they wanted had appeared. A retry is cheap (a
            # dry-run and an apply); the wait was the expensive part.
            maxDuration: 20s
          # Unlimited (see adhar-appset-local.yaml): cross-package CRD
          # dependencies make first syncs fail until the provider package has
          # applied its CRDs; a finite limit leaves them Failed forever.
          limit: -1
        # Namespaces ArgoCD creates for packages carry the ADR-0023 placement
        # label (platform packages run on the control plane) so the
        # require-namespace-plane-label policy reports them as compliant.
        managedNamespaceMetadata:
          labels:
            adhar.io/plane: control
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          # Packages ship CRs whose CRDs come from OTHER packages (ServiceMonitor
          # from kube-prometheus, Cluster from cnpg, …). Without this, ArgoCD
          # rejects the whole sync ("synchronization tasks are not valid: failed
          # to discover server resources …") until the CRD exists, stalling the
          # cnpg → keycloak → console chain behind parallel first-boot ordering.
          # With it, valid resources apply now and CRD-dependent ones retry.
          - SkipDryRunOnMissingResource=true
