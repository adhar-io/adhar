apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: helm-charts-production
  namespace: adhar-system
spec:
  # Production enablement: every package is deployed except the documented
  # mutual exclusions (see platform/stack/packages/CONFLICTS.md — fixed-name
  # object collisions in the shared namespace that renaming cannot fix, plus
  # alternatives to the default path). Each disabled entry carries its reason
  # inline. The bootstrap controller selects this ApplicationSet for cloud /
  # on-prem providers; Kind clusters get adhar-appset-local.yaml (curated core
  # — a single node cannot run the full set).
  # Enable packages in small waves when turning more on (ADR-0014).
  generators:
    - list:
        elements:
          - name: "external-secrets"
            enabled: "true"
            namespace: "adhar-system"
            category: "security"
            manifestPath: "security/external-secrets/manifests"
          # knative disabled in production: CONFLICTS.md: config-logging/config-observability collide with tekton
          - name: "knative"
            enabled: "false"
            namespace: "adhar-system"
            category: "application"
            manifestPath: "application/knative/manifests"
          - name: "hubble"
            enabled: "true"
            namespace: "adhar-system"
            category: "observability"
            manifestPath: "observability/hubble/manifests"
          - name: "falco"
            enabled: "true"
            namespace: "adhar-system"
            category: "security"
            manifestPath: "security/falco/manifests"
          - name: "trivy"
            enabled: "false"
            namespace: "adhar-system"
            category: "security"
            manifestPath: "security/trivy/manifests"
          - name: "vault"
            enabled: "true"
            namespace: "adhar-system"
            category: "security"
            manifestPath: "security/vault/manifests"
          # cosign installs into the shared adhar-system namespace (ADR-0011).
          # policy-controller hardcodes Service/webhook and Secret/webhook-certs
          # in its binary, so neither can be renamed: tekton was moved off the
          # Secret (tekton-webhook-certs), but kpack (buildpack) hardcodes it
          # too -- cosign and buildpack are mutually exclusive in one namespace.
          # Service/webhook re-injects WEBHOOK_PORT via service links, so
          # env-parsing components must keep enableServiceLinks:false.
          # See platform/stack/packages/CONFLICTS.md before enabling both.
          # Enabled in production for keyless signature verification (ADR-0019).
          - name: "cosign"
            enabled: "true"
            namespace: "adhar-system"
            category: "security"
            manifestPath: "security/cosign/manifests"
          # Agentic AI control plane (ADR-0024). Opt-in: ships disabled because it
          # needs the ghcr.io/adhar-io/adhar-ai-* images + an LLM key (Vault). The
          # platform runs unaffected until enabled. Write path is Gitea-PR-only; no
          # direct cluster/cloud mutation. Runs on the control plane (adhar.io/plane).
          - name: "adhar-ai"
            enabled: "false"
            namespace: "adhar-system"
            category: "ai"
            plane: "control"
            manifestPath: "ai/adhar-ai/manifests"
          # Per-service production-readiness score cards (roadmap Phase 3), surfaced
          # in the Console. Read-only scorer CronJob → adhar-scorecards ConfigMap.
          - name: "scorecards"
            enabled: "true"
            namespace: "adhar-system"
            category: "application"
            manifestPath: "application/scorecards/manifests"
          # Rotates gitea_admin/argocd admin bootstrap credentials into
          # break-glass values (Vault-backed when available). Disabled locally
          # so documented dev credentials keep working; enable once SSO login
          # is verified (roadmap P1.4).
          - name: "credential-rotation"
            enabled: "true"
            namespace: "adhar-system"
            category: "security"
            manifestPath: "security/credential-rotation/manifests"
          - name: "kubescape"
            enabled: "true"
            namespace: "adhar-system"
            category: "security"
            manifestPath: "security/kubescape/manifests"
          - name: "tetragon"
            enabled: "true"
            namespace: "adhar-system"
            category: "security"
            manifestPath: "security/tetragon/manifests"
          - name: "beyla"
            enabled: "true"
            namespace: "adhar-system"
            category: "observability"
            manifestPath: "observability/beyla/manifests"
          - name: "faro"
            enabled: "true"
            namespace: "adhar-system"
            category: "observability"
            manifestPath: "observability/faro/manifests"
          # pixie disabled: Vizier must register against Pixie Cloud with a deploy key
          # (px.dev account); without one it exits fatally ("Failed to register vizier
          # deployment"). Enable after setting the deploy key in the package values.
          - name: "pixie"
            enabled: "false"
            namespace: "adhar-system"
            category: "observability"
            manifestPath: "observability/pixie/manifests"
          # victoria-metrics disabled in production: alternative metrics path (ADR-0010); enable instead of kube-prometheus, not alongside
          - name: "victoria-metrics"
            enabled: "false"
            namespace: "adhar-system"
            category: "observability"
            manifestPath: "observability/victoria-metrics/manifests"
          - name: "trino"
            enabled: "true"
            namespace: "adhar-system"
            category: "data"
            manifestPath: "data/trino/manifests"
          - name: "metabase"
            enabled: "true"
            namespace: "adhar-system"
            category: "data"
            manifestPath: "data/metabase/manifests"
          - name: "lakefs"
            enabled: "true"
            namespace: "adhar-system"
            category: "data"
            manifestPath: "data/lakefs/manifests"
          - name: "opensearch"
            enabled: "true"
            namespace: "adhar-system"
            category: "data"
            manifestPath: "data/opensearch/manifests"
          - name: "rabbitmq"
            enabled: "true"
            namespace: "adhar-system"
            category: "data"
            manifestPath: "data/rabbitmq/manifests"
          - name: "mongodb"
            enabled: "true"
            namespace: "adhar-system"
            category: "data"
            manifestPath: "data/mongodb/manifests"
          - name: "mysql-operator"
            enabled: "true"
            namespace: "adhar-system"
            category: "data"
            manifestPath: "data/mysql-operator/manifests"
          - name: "fluent-bit"
            enabled: "false"
            namespace: "adhar-system"
            category: "observability"
            manifestPath: "observability/fluent-bit/manifests"
          - name: "airbyte"
            enabled: "true"
            namespace: "adhar-system"
            category: "data"
            manifestPath: "data/airbyte/manifests"
          - name: "dagster"
            enabled: "true"
            namespace: "adhar-system"
            category: "data"
            manifestPath: "data/dagster/manifests"
          - name: "open-metadata"
            enabled: "true"
            namespace: "adhar-system"
            category: "data"
            manifestPath: "data/open-metadata/manifests"
          - name: "argo-events"
            enabled: "true"
            namespace: "adhar-system"
            category: "application"
            manifestPath: "application/argo-events/manifests"
          - name: "argo-rollout"
            enabled: "true"
            namespace: "adhar-system"
            category: "application"
            manifestPath: "application/argo-rollout/manifests"
          # kpack: the ONE package outside adhar-system (ADR-0011 exception).
          # Its webhook hardcodes Secret/webhook-certs, exactly like cosign's
          # policy-controller, and both are enabled here; two knative webhooks
          # sharing that Secret leave one without a valid serving cert. The
          # generator drops upstream's Namespace object (pod-security
          # enforce=restricted) and renders everything into kpack-system, which
          # ArgoCD creates (CreateNamespace=true). See CONFLICTS.md.
          - name: "buildpack"
            enabled: "true"
            namespace: "kpack-system"
            category: "application"
            manifestPath: "application/buildpack/manifests"
          - name: "chaos-mesh"
            enabled: "true"
            namespace: "adhar-system"
            category: "application"
            manifestPath: "application/chaos-mesh/manifests"
          - name: "external-dns"
            enabled: "true"
            namespace: "adhar-system"
            category: "application"
            manifestPath: "application/external-dns/manifests"
          # open-function disabled in production: CONFLICTS.md: vendors Knative ConfigMaps that collide with tekton
          - name: "open-function"
            enabled: "false"
            # adhar-system like every other package (ADR-0011). Kept DISABLED:
            # it vendors Knative/Tekton ConfigMaps (config-defaults,
            # config-tracing) whose names are fixed upstream and collide with the
            # core tekton package once both live in adhar-system. Enabling it
            # requires disabling tekton first (see CONFLICTS.md).
            namespace: "adhar-system"
            category: "application"
            manifestPath: "application/open-function/manifests"
          - name: "coder"
            enabled: "true"
            namespace: "adhar-system"
            category: "application"
            manifestPath: "application/coder/manifests"
          - name: "n8n"
            enabled: "true"
            namespace: "adhar-system"
            category: "application"
            manifestPath: "application/n8n/manifests"
          - name: "penpot"
            enabled: "true"
            namespace: "adhar-system"
            category: "application"
            manifestPath: "application/penpot/manifests"
          - name: "posthog"
            enabled: "true"
            namespace: "adhar-system"
            category: "application"
            manifestPath: "application/posthog/manifests"
          - name: "plane"
            enabled: "true"
            namespace: "adhar-system"
            category: "application"
            manifestPath: "application/plane/manifests"
          - name: "baserow"
            enabled: "false"
            namespace: "adhar-system"
            category: "application"
            manifestPath: "application/baserow/manifests"
          - name: "vcluster"
            enabled: "true"
            namespace: "adhar-system"
            category: "core"
            manifestPath: "core/vcluster/manifests"
          - name: "sveltos"
            enabled: "false"
            namespace: "adhar-system"
            category: "core"
            manifestPath: "core/sveltos/manifests"
          - name: "open-cluster-management"
            enabled: "true"
            namespace: "adhar-system"
            category: "core"
            manifestPath: "core/open-cluster-management/manifests"
          - name: "kamaji"
            enabled: "false"
            namespace: "adhar-system"
            category: "core"
            manifestPath: "core/Kamaji/manifests"
          - name: "cert-manager"
            enabled: "true"
            namespace: "adhar-system"
            category: "security"
            manifestPath: "security/cert-manager/manifests"
          - name: "cnpg"
            enabled: "true"
            namespace: "adhar-system"
            category: "data"
            manifestPath: "data/cnpg/manifests"
          - name: "kyverno"
            enabled: "true"
            namespace: "adhar-system"
            category: "security"
            manifestPath: "security/kyverno/manifests"
          - name: "kyverno-policies"
            enabled: "true"
            namespace: "adhar-system"
            category: "security"
            manifestPath: "security/kyverno-policies/manifests"
          - name: "policy-reporter"
            enabled: "true"
            namespace: "adhar-system"
            category: "security"
            manifestPath: "security/policy-reporter/manifests"
          # Opt-in compliance profiles (CIS / SOC2-oriented), Audit mode.
          - name: "policy-packs"
            enabled: "false"
            namespace: "adhar-system"
            category: "security"
            manifestPath: "security/policy-packs/manifests"
          - name: "jupyterhub"
            enabled: "true"
            namespace: "adhar-system"
            category: "data"
            manifestPath: "data/jupyterhub/manifests"
          - name: "headlamp"
            enabled: "true"
            namespace: "adhar-system"
            category: "observability"
            manifestPath: "observability/headlamp/manifests"
          - name: "keycloak"
            enabled: "true"
            namespace: "adhar-system"
            category: "security"
            manifestPath: "security/keycloak/manifests"
          - name: "tekton"
            enabled: "true"
            namespace: "adhar-system"
            category: "application"
            manifestPath: "application/tekton/manifests"
          - name: "argo-workflows"
            enabled: "true"
            namespace: "adhar-system"
            category: "application"
            manifestPath: "application/argo-workflows/manifests/dev"
          - name: "adhar-console"
            enabled: "true"
            namespace: "adhar-system"
            category: "core"
            manifestPath: "core/adhar-console/manifests"
          - name: "harbor"
            enabled: "true"
            namespace: "adhar-system"
            category: "application"
            manifestPath: "application/harbor/manifests"
          # Nexus Repository OSS — artefact repository for language packages
          # (Maven/npm/PyPI). Harbor stays OCI-images-only; Nexus owns the rest.
          - name: "nexus"
            enabled: "true"
            namespace: "adhar-system"
            category: "application"
            manifestPath: "application/nexus/manifests"
          - name: "kafka-ui"
            enabled: "true"
            namespace: "adhar-system"
            category: "data"
            manifestPath: "data/kafka-ui/manifests"
          # Kubeflow Pipelines (standalone) — ML pipeline orchestration. The
          # upstream kustomize env hardcodes `kubeflow`; generate-manifests.sh
          # rewrites it to adhar-system (ADR-0011). Heavy (MySQL/Argo/API/UI);
          # disabled in the local core, enable per environment.
          - name: "kubeflow"
            enabled: "true"
            namespace: "adhar-system"
            category: "data"
            manifestPath: "data/kubeflow/manifests"
          # Prefect — Python workflow orchestration (data platform). Opt-in.
          - name: "prefect"
            enabled: "true"
            namespace: "adhar-system"
            category: "data"
            manifestPath: "data/prefect/manifests"
          # tooljet disabled: low-code app builder, not part of the paved road;
          # its container crash-loops on startup and nothing else depends on it.
          - name: "tooljet"
            enabled: "false"
            namespace: "adhar-system"
            category: "application"
            manifestPath: "application/tooljet/manifests"
          # End-to-end software supply chain (kpack build+sign → trivy/cosign gate
          # → kyverno verify → service-from-template). Depends on
          # buildpack/harbor/cosign/kyverno/tekton.
          - name: "supply-chain"
            enabled: "true"
            namespace: "adhar-system"
            category: "application"
            manifestPath: "application/supply-chain/manifests"
          - name: "adhar-libraries"
            enabled: "true"
            namespace: "adhar-system"
            category: "application"
            manifestPath: "application/adhar-libraries/manifests"
          - name: "kargo"
            enabled: "true"
            namespace: "adhar-system"
            category: "application"
            manifestPath: "application/kargo/manifests"
          - name: "minio"
            enabled: "true"
            namespace: "adhar-system"
            category: "data"
            manifestPath: "data/minio/manifests"
          - name: "rustfs"
            enabled: "true"
            namespace: "adhar-system"
            category: "data"
            manifestPath: "data/rustfs/manifests"
          - name: "velero"
            enabled: "true"
            namespace: "adhar-system"
            category: "core"
            manifestPath: "core/velero/manifests"
          - name: "spark-operator"
            enabled: "true"
            namespace: "adhar-system"
            category: "data"
            manifestPath: "data/spark-operator/manifests"
          - name: "metrics-server"
            enabled: "true"
            namespace: "adhar-system"
            category: "observability"
            manifestPath: "observability/metrics-server/manifests"
          - name: "kube-prometheus"
            enabled: "true"
            namespace: "adhar-system"
            category: "observability"
            manifestPath: "observability/kube-prometheus/manifests"
          - name: "loki"
            enabled: "true"
            namespace: "adhar-system"
            category: "observability"
            manifestPath: "observability/loki-stack/manifests"
          - name: "opencost"
            enabled: "true"
            namespace: "adhar-system"
            category: "observability"
            manifestPath: "observability/opencost/manifests"
          - name: "alloy"
            enabled: "true"
            namespace: "adhar-system"
            category: "observability"
            manifestPath: "observability/alloy/manifests"
          - name: "oncall"
            enabled: "true"
            namespace: "adhar-system"
            category: "observability"
            manifestPath: "observability/oncall/manifests"
          - name: "tempo"
            enabled: "true"
            namespace: "adhar-system"
            category: "observability"
            manifestPath: "observability/tempo/manifests"
          - name: "pyroscope"
            enabled: "true"
            namespace: "adhar-system"
            category: "observability"
            manifestPath: "observability/pyroscope/manifests"
          # mimir's bundled MinIO now uses a dedicated SA (mimir-minio-sa), so
          # the collision with the minio package is resolved and the metrics
          # hub backend is enabled for production.
          - name: "mimir"
            enabled: "true"
            namespace: "adhar-system"
            category: "observability"
            manifestPath: "observability/mimir/manifests"
          - name: "k6"
            enabled: "true"
            namespace: "adhar-system"
            category: "application"
            manifestPath: "application/k6/manifests"
          - name: "crossplane"
            enabled: "true"
            namespace: "adhar-system"
            category: "infrastructure"
            manifestPath: "infrastructure/crossplane/manifests"
          - name: "terraform"
            enabled: "true"
            namespace: "adhar-system"
            category: "infrastructure"
            manifestPath: "infrastructure/terraform/manifests"
          - name: "dapr"
            enabled: "true"
            namespace: "adhar-system"
            category: "application"
            manifestPath: "application/dapr/manifests"
          - name: "redis"
            enabled: "true"
            namespace: "adhar-system"
            category: "data"
            manifestPath: "data/redis/manifests"
          - name: "valkey"
            enabled: "true"
            namespace: "adhar-system"
            category: "data"
            manifestPath: "data/valkey/manifests"
          - name: "kafka-operator"
            enabled: "true"
            namespace: "adhar-system"
            category: "data"
            manifestPath: "data/kafka-operator/manifests"
          - name: "keda"
            enabled: "true"
            namespace: "adhar-system"
            category: "application"
            manifestPath: "application/keda/manifests"
      selector:
        matchLabels:
          enabled: "true"
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  template:
    metadata:
      finalizers:
        - resources-finalizer.argoproj.io
      labels:
        adhar.io/package-name: "{{ .name }}"
        adhar.io/category: "{{ .category }}"
        environment: "production"
      name: "{{ .name }}"
    spec:
      destination:
        # Every platform package targets adhar-system (ADR-0011). The field is
        # kept per-element as an escape hatch, but no platform package uses a
        # different value; the only sanctioned non-adhar-system namespaces are
        # Kargo Project namespaces (adhar-environments — Kargo requires one
        # namespace per Project) and data-plane vclusters (dp-*), neither of
        # which is wired through this ApplicationSet.
        namespace: "{{ .namespace }}"
        server: https://kubernetes.default.svc
      project: default
      sources:
        - path: "{{ .manifestPath }}"
          repoURL: http://gitea-http.adhar-system.svc.cluster.local:3000/adhar/packages
          targetRevision: main
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m0s
          # Unlimited (see adhar-appset-local.yaml): cross-package CRD
          # dependencies make first syncs fail until the provider package has
          # applied its CRDs; a finite limit leaves them Failed forever.
          limit: -1
        # Namespaces ArgoCD creates for packages carry the ADR-0023 placement
        # label (platform packages run on the control plane) so the
        # require-namespace-plane-label policy reports them as compliant.
        managedNamespaceMetadata:
          labels:
            adhar.io/plane: control
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          # Packages ship CRs whose CRDs come from OTHER packages (ServiceMonitor
          # from kube-prometheus, Cluster from cnpg, …). Without this, ArgoCD
          # rejects the whole sync ("synchronization tasks are not valid: failed
          # to discover server resources …") until the CRD exists, stalling the
          # cnpg → keycloak → console chain behind parallel first-boot ordering.
          # With it, valid resources apply now and CRD-dependent ones retry.
          - SkipDryRunOnMissingResource=true
