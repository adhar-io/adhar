apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: helm-charts-gitops
  namespace: adhar-system
spec:
  # Cloud/enterprise ApplicationSet: the full platform stack is enabled (a
  # multi-node cloud cluster has the capacity). The generator `selector` still
  # honours each package's `enabled` flag, so individual packages can be turned
  # off per environment. Generated from adhar-appset-local.yaml (all enabled).
  generators:
    - list:
        elements:
          - name: "external-secrets"
            enabled: "true"
            namespace: "adhar-system"
            category: "security"
            manifestPath: "security/external-secrets/manifests"
          - name: "knative"
            enabled: "true"
            namespace: "adhar-system"
            category: "application"
            manifestPath: "application/knative/manifests"
          - name: "hubble"
            enabled: "true"
            namespace: "adhar-system"
            category: "observability"
            manifestPath: "observability/hubble/manifests"
          - name: "falco"
            enabled: "true"
            namespace: "adhar-system"
            category: "security"
            manifestPath: "security/falco/manifests"
          - name: "trivy"
            enabled: "true"
            namespace: "adhar-system"
            category: "security"
            manifestPath: "security/trivy/manifests"
          # SECRETS BACKEND -- EXACTLY ONE OF vault / openbao MAY BE ENABLED.
          # Both claim ClusterSecretStore/vault and Service/vault in the shared
          # adhar-system namespace (ADR-0011, CONFLICTS.md). This "all enabled"
          # appset therefore keeps vault on and openbao off; if you switch to
          # OpenBao (as adhar-appset-production.yaml does), flip BOTH flags.
          - name: "vault"
            enabled: "true"
            namespace: "adhar-system"
            category: "security"
            manifestPath: "security/vault/manifests"
          - name: "openbao"
            enabled: "false"
            namespace: "adhar-system"
            category: "security"
            manifestPath: "security/openbao/manifests"
          - name: "cosign"
            enabled: "true"
            namespace: "adhar-system"
            category: "security"
            manifestPath: "security/cosign/manifests"
          # Agentic AI control plane (ADR-0024) — opt-in; needs adhar-ai images + LLM key.
          - name: "adhar-ai"
            enabled: "false"
            namespace: "adhar-system"
            category: "ai"
            plane: "control"
            manifestPath: "ai/adhar-ai/manifests"
          # AI data plane (ADR-0025) — agentgateway: ONE governed endpoint for LLM
          # completions + federated MCP tools, with Keycloak JWT, group-based
          # authorization, prompt guardrails, token budgets and OTel traces.
          # Replaces adhar-ai's bespoke adhar-ai-llm-gateway. Enabled exactly
          # where adhar-ai is enabled and no wider — AI is opt-in.
          - name: "agentgateway"
            enabled: "false"
            namespace: "adhar-system"
            category: "ai"
            plane: "control"
            manifestPath: "ai/agentgateway/manifests"
          # Self-hosted, OpenAI-compatible LLM inference (vLLM). THREE elements
          # from one package directory: "vllm" is the shared surface (model-cache
          # PVC, Service, HTTPRoute, ServiceMonitor, Grafana dashboard, optional
          # HF-token ExternalSecret); "vllm-cpu" and "vllm-gpu" each carry one
          # Deployment. Enable "vllm" plus EXACTLY ONE profile -- both
          # Deployments are named `vllm` and share one Service, so enabling both
          # makes two Applications fight over the same object.
          #
          # ALL THREE OFF BY DEFAULT: vLLM is heavy and entirely optional. Turning
          # it on is a capacity decision, not a default -- the GPU profile needs a
          # GPU node pool with the NVIDIA device plugin advertising nvidia.com/gpu
          # (Adhar's default droplets are CPU-only), ~15 GB of model weights on the
          # PVC, and 4 CPU / 16Gi of host RAM per replica. Nothing in the platform
          # depends on it; agentgateway and adhar-ai fall back to a hosted
          # model until it is enabled. On a cloud cluster WITHOUT GPU nodes,
          # "vllm-cpu" is still a valid (slow) choice for small models.
          - name: "vllm"
            enabled: "false"
            namespace: "adhar-system"
            category: "ai"
            plane: "control"
            manifestPath: "ai/vllm/manifests"
          - name: "vllm-cpu"
            enabled: "false"
            namespace: "adhar-system"
            category: "ai"
            plane: "control"
            manifestPath: "ai/vllm/manifests/cpu"
          - name: "vllm-gpu"
            enabled: "false"
            namespace: "adhar-system"
            category: "ai"
            plane: "control"
            manifestPath: "ai/vllm/manifests/gpu"
          # Per-service production-readiness score cards (roadmap Phase 3).
          - name: "scorecards"
            enabled: "true"
            namespace: "adhar-system"
            category: "application"
            manifestPath: "application/scorecards/manifests"
          - name: "kubescape"
            enabled: "true"
            namespace: "adhar-system"
            category: "security"
            manifestPath: "security/kubescape/manifests"
          - name: "tetragon"
            enabled: "true"
            namespace: "adhar-system"
            category: "security"
            manifestPath: "security/tetragon/manifests"
          - name: "beyla"
            enabled: "true"
            namespace: "adhar-system"
            category: "observability"
            manifestPath: "observability/beyla/manifests"
          - name: "faro"
            enabled: "true"
            namespace: "adhar-system"
            category: "observability"
            manifestPath: "observability/faro/manifests"
          - name: "pixie"
            enabled: "true"
            namespace: "adhar-system"
            category: "observability"
            manifestPath: "observability/pixie/manifests"
          - name: "victoria-metrics"
            enabled: "true"
            namespace: "adhar-system"
            category: "observability"
            manifestPath: "observability/victoria-metrics/manifests"
          - name: "trino"
            enabled: "true"
            namespace: "adhar-system"
            category: "data"
            manifestPath: "data/trino/manifests"
          - name: "metabase"
            enabled: "true"
            namespace: "adhar-system"
            category: "data"
            manifestPath: "data/metabase/manifests"
          - name: "libredb-studio"
            enabled: "true"
            namespace: "adhar-system"
            category: "data"
            manifestPath: "data/libredb-studio/manifests"
          - name: "lakefs"
            enabled: "true"
            namespace: "adhar-system"
            category: "data"
            manifestPath: "data/lakefs/manifests"
          - name: "opensearch"
            enabled: "true"
            namespace: "adhar-system"
            category: "data"
            manifestPath: "data/opensearch/manifests"
          - name: "rabbitmq"
            enabled: "true"
            namespace: "adhar-system"
            category: "data"
            manifestPath: "data/rabbitmq/manifests"
          - name: "mongodb"
            enabled: "true"
            namespace: "adhar-system"
            category: "data"
            manifestPath: "data/mongodb/manifests"
          - name: "mysql-operator"
            enabled: "true"
            namespace: "adhar-system"
            category: "data"
            manifestPath: "data/mysql-operator/manifests"
          - name: "fluent-bit"
            enabled: "false"
            namespace: "adhar-system"
            category: "observability"
            manifestPath: "observability/fluent-bit/manifests"
          - name: "airbyte"
            enabled: "true"
            namespace: "adhar-system"
            category: "data"
            manifestPath: "data/airbyte/manifests"
          - name: "dagster"
            enabled: "true"
            namespace: "adhar-system"
            category: "data"
            manifestPath: "data/dagster/manifests"
          - name: "open-metadata"
            enabled: "true"
            namespace: "adhar-system"
            category: "data"
            manifestPath: "data/open-metadata/manifests"
          - name: "argo-events"
            enabled: "true"
            namespace: "adhar-system"
            category: "application"
            manifestPath: "application/argo-events/manifests"
          - name: "argo-rollout"
            enabled: "true"
            namespace: "adhar-system"
            category: "application"
            manifestPath: "application/argo-rollout/manifests"
          - name: "buildpack"
            enabled: "true"
            namespace: "kpack-system"
            category: "application"
            manifestPath: "application/buildpack/manifests"
          - name: "chaos-mesh"
            enabled: "true"
            namespace: "adhar-system"
            category: "application"
            manifestPath: "application/chaos-mesh/manifests"
          - name: "external-dns"
            enabled: "true"
            namespace: "adhar-system"
            category: "application"
            manifestPath: "application/external-dns/manifests"
          - name: "open-function"
            enabled: "true"
            namespace: "adhar-system"
            category: "application"
            manifestPath: "application/open-function/manifests"
          - name: "coder"
            enabled: "true"
            namespace: "adhar-system"
            category: "application"
            manifestPath: "application/coder/manifests"
          - name: "n8n"
            enabled: "true"
            namespace: "adhar-system"
            category: "application"
            manifestPath: "application/n8n/manifests"
          - name: "penpot"
            enabled: "true"
            namespace: "adhar-system"
            category: "application"
            manifestPath: "application/penpot/manifests"
          - name: "posthog"
            enabled: "true"
            namespace: "adhar-system"
            category: "application"
            manifestPath: "application/posthog/manifests"
          - name: "plane"
            enabled: "true"
            namespace: "adhar-system"
            category: "application"
            manifestPath: "application/plane/manifests"
          - name: "baserow"
            enabled: "true"
            namespace: "adhar-system"
            category: "application"
            manifestPath: "application/baserow/manifests"
          - name: "vcluster"
            enabled: "true"
            namespace: "adhar-system"
            category: "core"
            manifestPath: "core/vcluster/manifests"
          - name: "sveltos"
            enabled: "true"
            namespace: "adhar-system"
            category: "core"
            manifestPath: "core/sveltos/manifests"
          - name: "open-cluster-management"
            enabled: "true"
            namespace: "adhar-system"
            category: "core"
            manifestPath: "core/open-cluster-management/manifests"
          - name: "kamaji"
            enabled: "true"
            namespace: "adhar-system"
            category: "core"
            manifestPath: "core/Kamaji/manifests"
          - name: "cert-manager"
            enabled: "true"
            namespace: "adhar-system"
            category: "security"
            manifestPath: "security/cert-manager/manifests"
          - name: "cnpg"
            enabled: "true"
            namespace: "adhar-system"
            category: "data"
            manifestPath: "data/cnpg/manifests"
          - name: "kyverno"
            enabled: "true"
            namespace: "adhar-system"
            category: "security"
            manifestPath: "security/kyverno/manifests"
          - name: "kyverno-policies"
            enabled: "true"
            namespace: "adhar-system"
            category: "security"
            manifestPath: "security/kyverno-policies/manifests"
          # ADR-0019 supply-chain admission pack (audit stage; the enforce
          # stage lives in .../manifests/enforce and is opt-in — see the
          # package README).
          - name: "supply-chain-policies"
            enabled: "true"
            namespace: "adhar-system"
            category: "security"
            manifestPath: "security/supply-chain-policies/manifests/audit"
          - name: "supply-chain-policies-enforce"
            enabled: "false"
            namespace: "adhar-system"
            category: "security"
            manifestPath: "security/supply-chain-policies/manifests/enforce"
          - name: "jupyterhub"
            enabled: "true"
            namespace: "adhar-system"
            category: "data"
            manifestPath: "data/jupyterhub/manifests"
          - name: "headlamp"
            enabled: "true"
            namespace: "adhar-system"
            category: "observability"
            manifestPath: "observability/headlamp/manifests"
          - name: "keycloak"
            enabled: "true"
            namespace: "adhar-system"
            category: "security"
            manifestPath: "security/keycloak/manifests"
          - name: "argo-workflows"
            enabled: "true"
            namespace: "adhar-system"
            category: "application"
            manifestPath: "application/argo-workflows/manifests/dev"
          - name: "adhar-console"
            enabled: "true"
            namespace: "adhar-system"
            category: "core"
            manifestPath: "core/adhar-console/manifests"
          - name: "harbor"
            enabled: "true"
            namespace: "adhar-system"
            category: "application"
            manifestPath: "application/harbor/manifests"
          - name: "kargo"
            enabled: "true"
            namespace: "adhar-system"
            category: "application"
            manifestPath: "application/kargo/manifests"
          # Ephemeral per-PR preview environments (ADR-0017): an ApplicationSet with the
          # Gitea pull-request generator, plus the Kyverno ResourceQuota/LimitRange
          # guardrails for preview namespaces. Costs nothing until a repo ships
          # preview/kustomization.yaml and a PR is labelled `preview`, so it is on
          # everywhere.
          - name: "preview-environments"
            enabled: "true"
            namespace: "adhar-system"
            category: "application"
            manifestPath: "application/preview-environments/manifests"
          - name: "minio"
            enabled: "true"
            namespace: "adhar-system"
            category: "data"
            manifestPath: "data/minio/manifests"
          - name: "rustfs"
            enabled: "true"
            namespace: "adhar-system"
            category: "data"
            manifestPath: "data/rustfs/manifests"
          - name: "velero"
            enabled: "true"
            namespace: "adhar-system"
            category: "core"
            manifestPath: "core/velero/manifests"
          - name: "spark-operator"
            enabled: "true"
            namespace: "adhar-system"
            category: "data"
            manifestPath: "data/spark-operator/manifests"
          - name: "metrics-server"
            enabled: "true"
            namespace: "adhar-system"
            category: "observability"
            manifestPath: "observability/metrics-server/manifests"
          - name: "kube-prometheus"
            enabled: "true"
            namespace: "adhar-system"
            category: "observability"
            manifestPath: "observability/kube-prometheus/manifests"
          - name: "loki"
            enabled: "true"
            namespace: "adhar-system"
            category: "observability"
            manifestPath: "observability/loki-stack/manifests"
          - name: "opencost"
            enabled: "true"
            namespace: "adhar-system"
            category: "observability"
            manifestPath: "observability/opencost/manifests"
          - name: "alloy"
            enabled: "true"
            namespace: "adhar-system"
            category: "observability"
            manifestPath: "observability/alloy/manifests"
          - name: "oncall"
            enabled: "true"
            namespace: "adhar-system"
            category: "observability"
            manifestPath: "observability/oncall/manifests"
          - name: "tempo"
            enabled: "true"
            namespace: "adhar-system"
            category: "observability"
            manifestPath: "observability/tempo/manifests"
          - name: "mimir"
            enabled: "true"
            namespace: "adhar-system"
            category: "observability"
            manifestPath: "observability/mimir/manifests"
          - name: "k6"
            enabled: "true"
            namespace: "adhar-system"
            category: "application"
            manifestPath: "application/k6/manifests"
          - name: "crossplane"
            enabled: "true"
            namespace: "adhar-system"
            category: "infrastructure"
            manifestPath: "infrastructure/crossplane/manifests"
          - name: "terraform"
            enabled: "true"
            namespace: "adhar-system"
            category: "infrastructure"
            manifestPath: "infrastructure/terraform/manifests"
          - name: "dapr"
            enabled: "true"
            namespace: "adhar-system"
            category: "application"
