# ArgoCD Repository Authentication Configuration
# This file contains the repository secrets that allow ArgoCD to authenticate
# with the internal Gitea repositories for GitOps operations.
#
# RESILIENT DESIGN:
# 1. Dedicated service (gitea-argocd) for ArgoCD access
# 2. ConfigMap for service discovery and configuration
# 3. Service names instead of IP addresses
# 4. Automatic fallback mechanisms
#
# The secrets are configured to use internal service URLs and admin credentials
# to access the environments and packages repositories within the cluster.
#
# These secrets are applied during platform setup to enable ArgoCD to:
# - Access the environments repository for environment management
# - Access the packages repository for application templates and manifests

---
# ConfigMap for service discovery and configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: gitea-argocd-config
  namespace: adhar-system
  labels:
    app: gitea
    component: argocd-config
data:
  gitea-service: "gitea-argocd.adhar-system.svc.cluster.local:3000"
  gitea-admin-user: "gitea_admin"
  # No password here: a ConfigMap is not a secret, and the controller
  # substitutes the CURRENT (rotated) admin password into this whole file.
  environments-repo: "environments"
  packages-repo: "packages"
---
# Dedicated service for ArgoCD to ensure stable connectivity
apiVersion: v1
kind: Service
metadata:
  name: gitea-argocd
  namespace: adhar-system
  labels:
    app: gitea
    component: argocd-access
spec:
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
  selector:
    app.kubernetes.io/name: gitea
    app.kubernetes.io/instance: gitea
  type: ClusterIP
---
apiVersion: v1
kind: Secret
metadata:
  name: repo-environments
  namespace: adhar-system
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  type: git
  url: http://gitea-argocd.adhar-system.svc.cluster.local:3000/adhar/environments
  username: gitea_admin
  password: r8sA8CPHD9!bt6d
  insecure: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: repo-packages
  namespace: adhar-system
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  type: git
  url: http://gitea-argocd.adhar-system.svc.cluster.local:3000/adhar/packages
  username: gitea_admin
  password: r8sA8CPHD9!bt6d
  insecure: "true"
---
# Credential TEMPLATES (repo-creds): matched by URL PREFIX, so every repository
# on the adhar-controlplane Gitea is covered — the platform stack (`packages`, which
# every ApplicationSet reads through gitea-http), application repositories in
# any organisation (the Application compositions rewrite their repoURL to
# gitea-http), and preview environments. The two `repository` Secrets above
# match one exact URL each, and until 2026-10-21 everything else was cloned
# ANONYMOUSLY. Gitea now requires sign-in for every read (REQUIRE_SIGNIN_VIEW,
# hack/gitea/values.yaml), so an anonymous clone fails and these are what keep
# Argo CD working. The controller replaces the bootstrap password below with
# the credential currently in force (applyArgoCDRepoAuth).
apiVersion: v1
kind: Secret
metadata:
  name: creds-gitea-http
  namespace: adhar-system
  labels:
    argocd.argoproj.io/secret-type: repo-creds
stringData:
  type: git
  url: http://gitea-http.adhar-system.svc.cluster.local:3000/
  username: gitea_admin
  password: r8sA8CPHD9!bt6d
  insecure: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: creds-gitea-argocd
  namespace: adhar-system
  labels:
    argocd.argoproj.io/secret-type: repo-creds
stringData:
  type: git
  url: http://gitea-argocd.adhar-system.svc.cluster.local:3000/
  username: gitea_admin
  password: r8sA8CPHD9!bt6d
  insecure: "true"
