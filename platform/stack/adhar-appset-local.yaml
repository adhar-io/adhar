apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: helm-charts-local
  namespace: adhar-system
spec:
  # All packages are wired below, but only those with `enabled: "true"` are
  # deployed — the generator `selector` (matchLabels.enabled: "true") filters the
  # list. A single Kind node cannot run all packages (the full set OOM-kills the
  # node), so the local default enables a representative core; flip a package's
  # `enabled` to "true" to add it (resources permitting).
  generators:
    - list:
        elements:
          - name: "external-secrets"
            enabled: "true"
            namespace: "adhar-system"
            category: "security"
            manifestPath: "security/external-secrets/manifests"
          - name: "knative"
            enabled: "false"
            namespace: "adhar-system"
            category: "application"
            manifestPath: "application/knative/manifests"
          - name: "hubble"
            enabled: "true"
            namespace: "adhar-system"
            category: "observability"
            manifestPath: "observability/hubble/manifests"
          - name: "falco"
            enabled: "false"
            namespace: "adhar-system"
            category: "security"
            manifestPath: "security/falco/manifests"
          - name: "trivy"
            enabled: "false"
            namespace: "adhar-system"
            category: "security"
            manifestPath: "security/trivy/manifests"
          # SECRETS BACKEND -- EXACTLY ONE OF vault / openbao MAY BE ENABLED.
          # Both packages claim ClusterSecretStore/vault and Service/vault in the
          # shared adhar-system namespace, so two enabled Applications would
          # fight over the same objects forever (ADR-0011, CONFLICTS.md).
          # Locally both ship disabled: a single Kind node does not need a
          # secrets backend, and the platform's SSO/credential chains fall back
          # to the kubernetes-provider `keycloak` / `gitea` stores.
          - name: "vault"
            enabled: "false"
            namespace: "adhar-system"
            category: "security"
            manifestPath: "security/vault/manifests"
          # OpenBao -- the Linux Foundation fork of Vault (MPL-2.0, vs Vault's
          # BUSL-1.1). Production uses this one; see the production appset.
          # Disabled locally, like vault, and for the same reason.
          - name: "openbao"
            enabled: "false"
            namespace: "adhar-system"
            category: "security"
            manifestPath: "security/openbao/manifests"
          # cosign installs into the shared adhar-system namespace (ADR-0011).
          # policy-controller hardcodes Service/webhook and Secret/webhook-certs
          # in its binary, so neither can be renamed: tekton was moved off the
          # Secret (tekton-webhook-certs), but kpack (buildpack) hardcodes it
          # too -- cosign and buildpack are mutually exclusive in one namespace.
          # See platform/stack/packages/CONFLICTS.md before enabling both.
          - name: "cosign"
            enabled: "true"
            namespace: "adhar-system"
            category: "security"
            manifestPath: "security/cosign/manifests"
          # Agentic AI control plane (ADR-0024) — opt-in; needs adhar-ai images +
          # an LLM key. Off in the local core.
          - name: "adhar-ai"
            enabled: "false"
            namespace: "adhar-system"
            category: "ai"
            plane: "control"
            manifestPath: "ai/adhar-ai/manifests"
          # AI data plane (ADR-0025) — agentgateway: ONE governed endpoint for LLM
          # completions + federated MCP tools, with Keycloak JWT, group-based
          # authorization, prompt guardrails, token budgets and OTel traces.
          # Replaces adhar-ai's bespoke adhar-ai-llm-gateway. Enabled exactly
          # where adhar-ai is enabled and no wider — AI is opt-in.
          - name: "agentgateway"
            enabled: "false"
            namespace: "adhar-system"
            category: "ai"
            plane: "control"
            manifestPath: "ai/agentgateway/manifests"
          # Self-hosted, OpenAI-compatible LLM inference (vLLM). THREE elements
          # from one package directory: "vllm" is the shared surface (model-cache
          # PVC, Service, HTTPRoute, ServiceMonitor, Grafana dashboard, optional
          # HF-token ExternalSecret); "vllm-cpu" and "vllm-gpu" each carry one
          # Deployment. Enable "vllm" plus EXACTLY ONE profile -- both
          # Deployments are named `vllm` and share one Service, so enabling both
          # makes two Applications fight over the same object. (Same one-dir /
          # several-elements shape as supply-chain-policies audit+enforce.)
          #
          # ALL THREE OFF BY DEFAULT: vLLM is heavy and entirely optional -- a
          # ~1.8 GB image, ~1 GB of model weights and a 6Gi memory request for the
          # CPU profile (a ~10 GB image, ~15 GB of weights and a GPU for the other
          # one). Nothing in the platform depends on it; ai/agentgateway and
          # ai/adhar-ai simply use a hosted model until it is turned on.
          #
          # Locally this is the CPU profile ("vllm-cpu", Qwen2.5-0.5B-Instruct on
          # the official vllm/vllm-openai-cpu image) -- it works on a Kind node,
          # but only after you free headroom by disabling a few heavy packages
          # above. "vllm-gpu" stays off on Kind: there is no GPU to schedule on.
          - name: "vllm"
            enabled: "false"
            namespace: "adhar-system"
            category: "ai"
            plane: "control"
            manifestPath: "ai/vllm/manifests"
          - name: "vllm-cpu"
            enabled: "false"
            namespace: "adhar-system"
            category: "ai"
            plane: "control"
            manifestPath: "ai/vllm/manifests/cpu"
          - name: "vllm-gpu"
            enabled: "false"
            namespace: "adhar-system"
            category: "ai"
            plane: "control"
            manifestPath: "ai/vllm/manifests/gpu"
          # Per-service production-readiness score cards (roadmap Phase 3). Off in
          # the local core; enable to see per-package readiness in the Console.
          - name: "scorecards"
            enabled: "false"
            namespace: "adhar-system"
            category: "application"
            manifestPath: "application/scorecards/manifests"
          # Rotates gitea_admin/argocd admin bootstrap credentials into
          # break-glass values (Vault-backed when available). Disabled locally
          # so documented dev credentials keep working; enable once SSO login
          # is verified (roadmap P1.4).
          - name: "credential-rotation"
            enabled: "false"
            namespace: "adhar-system"
            category: "security"
            manifestPath: "security/credential-rotation/manifests"
          - name: "kubescape"
            enabled: "false"
            namespace: "adhar-system"
            category: "security"
            manifestPath: "security/kubescape/manifests"
          - name: "tetragon"
            enabled: "false"
            namespace: "adhar-system"
            category: "security"
            manifestPath: "security/tetragon/manifests"
          - name: "beyla"
            enabled: "false"
            namespace: "adhar-system"
            category: "observability"
            manifestPath: "observability/beyla/manifests"
          - name: "faro"
            enabled: "false"
            namespace: "adhar-system"
            category: "observability"
            manifestPath: "observability/faro/manifests"
          - name: "pixie"
            enabled: "false"
            namespace: "adhar-system"
            category: "observability"
            manifestPath: "observability/pixie/manifests"
          - name: "victoria-metrics"
            enabled: "false"
            namespace: "adhar-system"
            category: "observability"
            manifestPath: "observability/victoria-metrics/manifests"
          - name: "trino"
            enabled: "false"
            namespace: "adhar-system"
            category: "data"
            manifestPath: "data/trino/manifests"
          - name: "metabase"
            enabled: "false"
            namespace: "adhar-system"
            category: "data"
            manifestPath: "data/metabase/manifests"
          # LibreDB Studio — browser SQL IDE over every platform database
          # (CNPG clusters, Valkey/Redis, OpenSearch, ClickHouse, Trino), with
          # native Keycloak OIDC. Enabled locally: one 256Mi pod plus the single
          # CNPG instance holding its own state, and it is the only UI a developer
          # has onto the platform's databases. Connections whose package is not
          # enabled here are skipped, not broken.
          - name: "libredb-studio"
            enabled: "true"
            namespace: "adhar-system"
            category: "data"
            manifestPath: "data/libredb-studio/manifests"
          - name: "lakefs"
            enabled: "false"
            namespace: "adhar-system"
            category: "data"
            manifestPath: "data/lakefs/manifests"
          - name: "opensearch"
            enabled: "false"
            namespace: "adhar-system"
            category: "data"
            manifestPath: "data/opensearch/manifests"
          - name: "rabbitmq"
            enabled: "false"
            namespace: "adhar-system"
            category: "data"
            manifestPath: "data/rabbitmq/manifests"
          - name: "mongodb"
            enabled: "false"
            namespace: "adhar-system"
            category: "data"
            manifestPath: "data/mongodb/manifests"
          - name: "mysql-operator"
            enabled: "false"
            namespace: "adhar-system"
            category: "data"
            manifestPath: "data/mysql-operator/manifests"
          - name: "fluent-bit"
            enabled: "false"
            namespace: "adhar-system"
            category: "observability"
            manifestPath: "observability/fluent-bit/manifests"
          - name: "kafka-ui"
            enabled: "true"
            namespace: "adhar-system"
            category: "data"
            manifestPath: "data/kafka-ui/manifests"
          - name: "airbyte"
            enabled: "false"
            namespace: "adhar-system"
            category: "data"
            manifestPath: "data/airbyte/manifests"
          - name: "dagster"
            enabled: "false"
            namespace: "adhar-system"
            category: "data"
            manifestPath: "data/dagster/manifests"
          # Prefect — Python workflow orchestration (data platform). Opt-in.
          - name: "prefect"
            enabled: "false"
            namespace: "adhar-system"
            category: "data"
            manifestPath: "data/prefect/manifests"
          # Kubeflow Pipelines (standalone) — ML pipeline orchestration. The
          # upstream kustomize env hardcodes `kubeflow`; generate-manifests.sh
          # rewrites it to adhar-system (ADR-0011). Heavy (MySQL/Argo/API/UI);
          # disabled in the local core, enable per environment.
          - name: "kubeflow"
            enabled: "false"
            namespace: "adhar-system"
            category: "data"
            manifestPath: "data/kubeflow/manifests"
          - name: "open-metadata"
            enabled: "false"
            namespace: "adhar-system"
            category: "data"
            manifestPath: "data/open-metadata/manifests"
          - name: "argo-events"
            enabled: "false"
            namespace: "adhar-system"
            category: "application"
            manifestPath: "application/argo-events/manifests"
          - name: "argo-rollout"
            enabled: "true"
            namespace: "adhar-system"
            category: "application"
            manifestPath: "application/argo-rollout/manifests"
          # kpack: the ONE package outside adhar-system (ADR-0011 exception).
          # Its webhook hardcodes Secret/webhook-certs, exactly like cosign's
          # policy-controller, and both are enabled here; two knative webhooks
          # sharing that Secret leave one without a valid serving cert. The
          # generator drops upstream's Namespace object (pod-security
          # enforce=restricted) and renders everything into kpack-system, which
          # ArgoCD creates (CreateNamespace=true). See CONFLICTS.md.
          - name: "buildpack"
            enabled: "true"
            namespace: "kpack-system"
            category: "application"
            manifestPath: "application/buildpack/manifests"
          - name: "chaos-mesh"
            enabled: "false"
            namespace: "adhar-system"
            category: "application"
            manifestPath: "application/chaos-mesh/manifests"
          - name: "external-dns"
            enabled: "false"
            namespace: "adhar-system"
            category: "application"
            manifestPath: "application/external-dns/manifests"
          - name: "open-function"
            enabled: "false"
            # adhar-system like every other package (ADR-0011). Kept DISABLED:
            # it vendors Knative/Tekton ConfigMaps (config-defaults,
            # config-tracing) whose names are fixed upstream and collide with the
            # core tekton package once both live in adhar-system. Enabling it
            # requires disabling tekton first (see CONFLICTS.md).
            namespace: "adhar-system"
            category: "application"
            manifestPath: "application/open-function/manifests"
          - name: "coder"
            enabled: "false"
            namespace: "adhar-system"
            category: "application"
            manifestPath: "application/coder/manifests"
          - name: "n8n"
            enabled: "false"
            namespace: "adhar-system"
            category: "application"
            manifestPath: "application/n8n/manifests"
          - name: "penpot"
            enabled: "false"
            namespace: "adhar-system"
            category: "application"
            manifestPath: "application/penpot/manifests"
          - name: "tooljet"
            enabled: "false"
            namespace: "adhar-system"
            category: "application"
            manifestPath: "application/tooljet/manifests"
          - name: "posthog"
            enabled: "false"
            namespace: "adhar-system"
            category: "application"
            manifestPath: "application/posthog/manifests"
          - name: "plane"
            enabled: "false"
            namespace: "adhar-system"
            category: "application"
            manifestPath: "application/plane/manifests"
          - name: "baserow"
            enabled: "false"
            namespace: "adhar-system"
            category: "application"
            manifestPath: "application/baserow/manifests"
          - name: "vcluster"
            enabled: "false"
            namespace: "adhar-system"
            category: "core"
            manifestPath: "core/vcluster/manifests"
          - name: "sveltos"
            enabled: "false"
            namespace: "adhar-system"
            category: "core"
            manifestPath: "core/sveltos/manifests"
          - name: "open-cluster-management"
            enabled: "false"
            namespace: "adhar-system"
            category: "core"
            manifestPath: "core/open-cluster-management/manifests"
          - name: "kamaji"
            enabled: "false"
            namespace: "adhar-system"
            category: "core"
            manifestPath: "core/Kamaji/manifests"
          # Required by kargo (webhook/api Certificates + Issuer come from
          # cert-manager CRDs).
          - name: "cert-manager"
            enabled: "false"
            namespace: "adhar-system"
            category: "security"
            manifestPath: "security/cert-manager/manifests"
          - name: "cnpg"
            enabled: "true"
            namespace: "adhar-system"
            category: "data"
            manifestPath: "data/cnpg/manifests"
          # Required by the supply-chain package (its verify-supply-chain-images
          # + kpack-build-ca-trust are kyverno ClusterPolicies). supply-chain is
          # enabled below, so kyverno must stay on or supply-chain fails to sync.
          - name: "kyverno"
            enabled: "true"
            namespace: "adhar-system"
            category: "security"
            manifestPath: "security/kyverno/manifests"
          # Pod Security Standards baseline (~14 ClusterPolicies, all Audit mode)
          # + disallow-:latest / restrict-registries, with exceptions for the
          # platform's own namespaces. Cheap: policies are just CRs, no new pods
          # (the kyverno engine is already enabled above).
          - name: "kyverno-policies"
            enabled: "true"
            namespace: "adhar-system"
            category: "security"
            manifestPath: "security/kyverno-policies/manifests"
          - name: "policy-reporter"
            enabled: "true"
            namespace: "adhar-system"
            category: "security"
            manifestPath: "security/policy-reporter/manifests"
          # ADR-0019 supply-chain admission pack, shipped in two stages. The
          # AUDIT pack is always on: its findings land in ClusterPolicyReports
          # and predict exactly what Enforce would block. The ENFORCE pack is
          # the documented knob — flip it to "true" (here AND in
          # platform/stack/environments/<env>/config.yaml) to make unsigned /
          # :latest / untrusted-registry workloads fail admission. Leave the
          # audit pack enabled; the two coexist (policy names differ by an
          # `-enforce` suffix). See the package README for the staging recipe
          # and hack/verify-supply-chain.sh for the drill that proves it works.
          - name: "supply-chain-policies"
            enabled: "true"
            namespace: "adhar-system"
            category: "security"
            manifestPath: "security/supply-chain-policies/manifests/audit"
          - name: "supply-chain-policies-enforce"
            enabled: "false"
            namespace: "adhar-system"
            category: "security"
            manifestPath: "security/supply-chain-policies/manifests/enforce"
          # Opt-in compliance profiles (CIS / SOC2-oriented) layered on the
          # kyverno-policies baseline; all Audit mode (roadmap Phase 3).
          - name: "policy-packs"
            enabled: "false"
            namespace: "adhar-system"
            category: "security"
            manifestPath: "security/policy-packs/manifests"
          - name: "jupyterhub"
            enabled: "false"
            namespace: "adhar-system"
            category: "data"
            manifestPath: "data/jupyterhub/manifests"
          - name: "headlamp"
            enabled: "true"
            namespace: "adhar-system"
            category: "observability"
            manifestPath: "observability/headlamp/manifests"
          - name: "keycloak"
            enabled: "true"
            namespace: "adhar-system"
            category: "security"
            manifestPath: "security/keycloak/manifests"
          - name: "tekton"
            enabled: "true"
            namespace: "adhar-system"
            category: "application"
            manifestPath: "application/tekton/manifests"
          - name: "argo-workflows"
            enabled: "false"
            namespace: "adhar-system"
            category: "application"
            manifestPath: "application/argo-workflows/manifests/dev"
          - name: "adhar-console"
            enabled: "true"
            namespace: "adhar-system"
            category: "core"
            manifestPath: "core/adhar-console/manifests"
          - name: "harbor"
            enabled: "true"
            namespace: "adhar-system"
            category: "application"
            manifestPath: "application/harbor/manifests"
          # Nexus Repository OSS — artefact repository for language packages
          # (Maven/npm/PyPI). Harbor stays OCI-images-only; Nexus owns the rest.
          - name: "nexus"
            enabled: "true"
            namespace: "adhar-system"
            category: "application"
            manifestPath: "application/nexus/manifests"
          # End-to-end software supply chain (kpack build+sign → trivy/cosign gate
          # → kyverno verify → service-from-template). Opt-in: enable AFTER the core
          # is healthy so the kpack builder's image pulls don't compete with the
          # bootstrap. Depends on buildpack/harbor/cosign/kyverno/tekton (all above).
          - name: "supply-chain"
            enabled: "true"
            namespace: "adhar-system"
            category: "application"
            manifestPath: "application/supply-chain/manifests"
          # Ephemeral per-PR preview environments (ADR-0017): an ApplicationSet with the
          # Gitea pull-request generator, plus the Kyverno ResourceQuota/LimitRange
          # guardrails for preview namespaces. Costs nothing until a repo ships
          # preview/kustomization.yaml and a PR is labelled `preview`, so it is on
          # everywhere.
          - name: "preview-environments"
            enabled: "true"
            namespace: "adhar-system"
            category: "application"
            manifestPath: "application/preview-environments/manifests"
          - name: "adhar-libraries"
            enabled: "true"
            namespace: "adhar-system"
            category: "application"
            manifestPath: "application/adhar-libraries/manifests"
          - name: "kargo"
            enabled: "false"
            namespace: "adhar-system"
            category: "application"
            manifestPath: "application/kargo/manifests"
          - name: "minio"
            enabled: "true"
            namespace: "adhar-system"
            category: "data"
            manifestPath: "data/minio/manifests"
          - name: "rustfs"
            enabled: "false"
            namespace: "adhar-system"
            category: "data"
            manifestPath: "data/rustfs/manifests"
          - name: "velero"
            enabled: "false"
            namespace: "adhar-system"
            category: "core"
            manifestPath: "core/velero/manifests"
          - name: "spark-operator"
            enabled: "false"
            namespace: "adhar-system"
            category: "data"
            manifestPath: "data/spark-operator/manifests"
          - name: "metrics-server"
            enabled: "true"
            namespace: "adhar-system"
            category: "observability"
            manifestPath: "observability/metrics-server/manifests"
          - name: "kube-prometheus"
            enabled: "true"
            namespace: "adhar-system"
            category: "observability"
            manifestPath: "observability/kube-prometheus/manifests"
          - name: "loki"
            enabled: "true"
            namespace: "adhar-system"
            category: "observability"
            manifestPath: "observability/loki-stack/manifests"
          - name: "opencost"
            enabled: "false"
            namespace: "adhar-system"
            category: "observability"
            manifestPath: "observability/opencost/manifests"
          - name: "alloy"
            enabled: "true"
            namespace: "adhar-system"
            category: "observability"
            manifestPath: "observability/alloy/manifests"
          - name: "oncall"
            enabled: "false"
            namespace: "adhar-system"
            category: "observability"
            manifestPath: "observability/oncall/manifests"
          - name: "tempo"
            enabled: "true"
            namespace: "adhar-system"
            category: "observability"
            manifestPath: "observability/tempo/manifests"
          - name: "pyroscope"
            enabled: "false"
            namespace: "adhar-system"
            category: "observability"
            manifestPath: "observability/pyroscope/manifests"
          - name: "mimir"
            enabled: "true"
            namespace: "adhar-system"
            category: "observability"
            manifestPath: "observability/mimir/manifests"
          - name: "k6"
            enabled: "true"
            namespace: "adhar-system"
            category: "application"
            manifestPath: "application/k6/manifests"
          - name: "crossplane"
            enabled: "false"
            namespace: "adhar-system"
            category: "infrastructure"
            manifestPath: "infrastructure/crossplane/manifests"
          - name: "terraform"
            enabled: "false"
            namespace: "adhar-system"
            category: "infrastructure"
            manifestPath: "infrastructure/terraform/manifests"
          - name: "dapr"
            enabled: "true"
            namespace: "adhar-system"
            category: "application"
            manifestPath: "application/dapr/manifests"
          - name: "redis"
            enabled: "false"
            namespace: "adhar-system"
            category: "data"
            manifestPath: "data/redis/manifests"
          - name: "valkey"
            enabled: "true"
            namespace: "adhar-system"
            category: "data"
            manifestPath: "data/valkey/manifests"
          - name: "kafka-operator"
            enabled: "true"
            namespace: "adhar-system"
            category: "data"
            manifestPath: "data/kafka-operator/manifests"
          - name: "keda"
            enabled: "false"
            namespace: "adhar-system"
            category: "application"
            manifestPath: "application/keda/manifests"
      selector:
        matchLabels:
          enabled: "true"
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  # NOTE: no RollingSync strategy — all apps sync in PARALLEL. A progressive
  # (ordered) strategy was tried to force console-first, but RollingSync serializes
  # EVERYTHING behind each step, so a single slow foundation app (e.g. CNPG taking
  # a while to go Healthy) stalls the entire platform. The console is instead made
  # fast by preloading its image + its deps (CNPG/ESO/Keycloak) into the node
  # cache (see platform/providers/kind/preload.go), so it comes up quickly without
  # blocking anything else.
  template:
    metadata:
      finalizers:
        - resources-finalizer.argoproj.io
      labels:
        adhar.io/package-name: "{{ .name }}"
        adhar.io/category: "{{ .category }}"
        environment: "local"
      name: "{{ .name }}"
    spec:
      destination:
        # Every platform package targets adhar-system (ADR-0011). The field is
        # kept per-element as an escape hatch, but no platform package uses a
        # different value; the only sanctioned non-adhar-system namespaces are
        # Kargo Project namespaces (adhar-environments — Kargo requires one
        # namespace per Project) and data-plane vclusters (dp-*), neither of
        # which is wired through this ApplicationSet.
        namespace: "{{ .namespace }}"
        server: https://kubernetes.default.svc
      project: default
      # Silence the cosmetic OutOfSync drift so apps show Synced + Healthy.
      # Two controllers mutate resources after ArgoCD applies them: the Gateway
      # controller defaults group/kind/weight on HTTPRoute parent/backend refs
      # (which the manifests omit) and writes .status; external-secrets writes
      # ExternalSecret .status. These ignoreDifferences use CLIENT-side diff
      # (jsonPointers/jqPathExpressions) — NOT ServerSideDiff, which was tried
      # before and broke bootstrap by dry-run-applying against the CNPG webhook
      # while it was briefly unreachable (apps got stuck ComparisonError/Unknown).
      # RespectIgnoreDifferences=true (below) makes selfHeal skip these fields too,
      # so it never fights the controllers.
      ignoreDifferences:
        - group: gateway.networking.k8s.io
          kind: HTTPRoute
          jsonPointers:
            - /status
          jqPathExpressions:
            - '.spec.parentRefs[]?.group'
            - '.spec.parentRefs[]?.kind'
            - '.spec.rules[]?.backendRefs[]?.group'
            - '.spec.rules[]?.backendRefs[]?.kind'
            - '.spec.rules[]?.backendRefs[]?.weight'
        - group: external-secrets.io
          kind: ExternalSecret
          jsonPointers:
            - /status
      sources:
        - path: "{{ .manifestPath }}"
          repoURL: http://gitea-http.adhar-system.svc.cluster.local:3000/adhar/packages
          targetRevision: main
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        # Retry budget: limit 15 with 5s/2x/1m backoff retries for ~12 minutes
        # (5+10+20+40s then 1m caps). That covers a cold-bootstrap race where an
        # app syncs before its dependency is ready — e.g. adhar-console's OIDC
        # ExternalSecret waiting on Keycloak's realm client, which can take
        # longer than the old ~3.5m (limit 6) budget, leaving console stuck
        # until a manual re-sync. Still bounded so a genuinely doomed sync frees
        # the queue for the next corrected revision rather than blocking forever.
        retry:
          backoff:
            duration: 5s
            factor: 2
            # Fast early retries (5s,10s,20s…) so an app whose dependency
            # (CRD/operator/OIDC secret) has just appeared re-syncs promptly,
            # capped at 30s so it never idles a full minute per attempt.
            maxDuration: 30s
          # Unlimited: on a fresh cluster packages carry CRs whose CRDs come
          # from other packages (ServiceMonitor, ExternalSecret, cnpg Cluster…);
          # their first syncs legitimately fail until the provider package has
          # applied its CRDs. A finite limit (or none — ArgoCD reads a missing
          # limit as "no retries") leaves them Failed forever, because ArgoCD
          # never auto-syncs a revision whose last attempt failed.
          # (The previous 60-attempt window — ~30 min at the 30s cap — was
          # exhausted on a fresh cluster once every package carried
          # ServiceMonitor/ExternalSecret CRs; a healthy resource still applies
          # on the first attempt, so unlimited only costs time on failures.)
          limit: -1
        # Namespaces ArgoCD creates for packages carry the ADR-0023 placement
        # label (platform packages run on the control plane) so the
        # require-namespace-plane-label policy reports them as compliant.
        managedNamespaceMetadata:
          labels:
            adhar.io/plane: control
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          # Packages ship CRs whose CRDs come from OTHER packages (ExternalSecret
          # + Password generator in every sso.yaml, ServiceMonitor from
          # kube-prometheus, Cluster from cnpg, …). Without this, ArgoCD rejects
          # the whole sync ("synchronization tasks are not valid: failed to
          # discover server resources …") until the CRD exists, which on a fresh
          # cluster stalls every package behind first-boot ordering. With it,
          # valid resources apply now and CRD-dependent ones retry.
          - SkipDryRunOnMissingResource=true
          # Apply the ignoreDifferences fields during sync too, so selfHeal does
          # not try to strip the controller-defaulted HTTPRoute/ExternalSecret
          # fields (which would just be re-added → perpetual OutOfSync).
          - RespectIgnoreDifferences=true
